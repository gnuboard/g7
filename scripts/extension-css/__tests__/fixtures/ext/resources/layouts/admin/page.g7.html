<!-- 합성 관리자 화면. 이 주석 안의 class="flex" 는 바꾸지 않는다 -->
<div class="flex items-center gap-2 dark:hover:bg-gray-100 !mt-2 -mt-1 group group/item">
  <span class="card {{row.status === 'active' ? 'bg-blue-100 text-blue-800' : 'input'}}">x</span>
  <span class="hover-lift group-hover:underline fa fa-check readonly sr-only spinner">y</span>
  <span class="{{ {'pending': 'bg-yellow-100', 'done': 'section-heading-md'}[row.status] }}">z</span>
  <span class="{{row.tags.includes('hidden') || row.map['block'] ? 'hidden' : 'block'}}">w</span>
  <span class="bg-{{row.color}}-500 {{'text-' + row.tone}} pay-demo-tone paydemo:flex">v</span>
  <span class="{{(row.mode ?? 'standard') === 'standard' ? 'prose' : 'w-[200px] md:w-1/2'}}">u</span>
  <div class="px-2">
    <class-map key="{{row.state}}" base="px-2" default="text-gray-500">
      <variant when="on">bg-green-100 input</variant>
    </class-map>
  </div>
  <table class="table hidden"/>
  <header class="page-header px-4"/>
  <icon name="fa-solid fa-check" class="text-sm md:text-xl text-gray-500"/>
  <icon name="fa-solid fa-xmark" class="text-xs leading-5 text-[2rem]"/>
  <data-grid cellClassName="px-4 text-sm"/>
</div>
