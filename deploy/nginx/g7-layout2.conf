# G7 — 배포 레이아웃 ②(문서 루트 = 프로젝트 루트) 보호·위임 조각 · nginx
#
# 문서 루트를 `public/` 으로 바꿀 수 없는 호스팅에서 릴리즈 압축을 문서 루트에 그대로
# 풀었을 때, 프로젝트 루트(`.env`·`storage`·`vendor` …)가 웹에 노출되지 않게 한다.
#
# ── 먼저 확인할 것 ────────────────────────────────────────────────────────────
# nginx 에는 Apache `.htaccess` 같은 **디렉토리별 설정 파일이 없다.** 그래서 이 파일은
# 동봉만으로 효력이 생기지 않는다 — 서버 블록에 넣고 nginx 를 reload 해야 한다.
# 서버 블록의 `root` 를 직접 바꿀 수 있다면 그렇게 하는 쪽이 언제나 더 안전하다
# (`root /경로/g7/public;` = 표준 배치). 이 조각은 관리 패널이 `root` 를 사이트
# 디렉토리에 고정해 두고 location 추가만 허용하는 환경을 위한 것이다.
#
# ── 검증 상태 (2026-08-27 실측) ───────────────────────────────────────────────
# 이 조각의 **문서 루트 배치**는 nginx 1.28 로 실제 측정했다. 확인한 것:
#   · `/public/favicon.ico` → 301 `/favicon.ico`   (정본 주소 · 목적지에 `/public` 없음)
#   · `/build` · `/storage` · `/app` → 위임        (**`/public/…` 을 공표하는 301 이 없다**)
#   · `/install` → 301 `/install/`                 (목적지에 `/public` 없음)
#   · `/.env` · `/foo/.git/HEAD` → 403             (경로 어느 구간이든)
#   · `/composer.json` · `/artisan` · `/vendor/autoload.php` → 위임 (원문 서빙 0)
#   · `/public/install/` → 301 `/install/`
# 측정은 PHP-FPM 없이 했다 — 위임된 요청은 502 로 끝나지만, 이 조각이 판정하는 것은
# **어느 location 이 잡고 무엇을 돌려주는가**이므로 그 축에는 영향이 없다.
#
# 아직 재지 않은 것 ①: **하위 주소(서브패스) 배치**. 아래 「하위 폴더 마운트」 절의
# 조정이 필요하며, 그 형태에서의 `SCRIPT_NAME` 거동은 확정되지 않았다.
#
#   G7-VERIFICATION-STATUS: UNVERIFIED(subpath-mount)
#
# 아직 재지 않은 것 ②: 정본 주소 규칙의 **역슬래시 형태**(`/public/\evil.example/p`).
# 아래 (3) 의 빈 세그먼트 가드는 `//` 리터럴만 보는데 브라우저는 `/\` 도 authority
# 시작으로 읽는다. 그 자리에 근거와 조치 순서를 적어 두었고, 가드를 넓히지 않은 이유는
# 이 서버를 잴 수 없기 때문이다(잘못 적으면 규칙이 통째로 꺼지거나 설정 로드가 실패한다).
#
#   G7-VERIFICATION-STATUS: UNVERIFIED(canonical-address-backslash)
#
#   첫 배포 시 잴 항목:
#     curl -sI 'http://호스트/public/\evil.example/p' | grep -i location
#     → `Location` 이 `/\evil.example/p` 로 나가면 (3) 에 역슬래시 조건을 하나 더 세운다.
#
# 이 토큰이 그 사실의 **선언**이다. 종전에는 위 한국어 산문만 있었고 그것을 읽는 검사가
# 없어, 문장을 다듬거나 지워도 아무것도 울지 않았다 — 형제 파일 둘(`web.config`·Caddy
# 조각)은 이미 같은 토큰을 갖고 있었는데 이 파일만 축이 없었다. 그 사각의 실물이 바로
# 아래 「하위 폴더 마운트」 절의 잘못된 지시였다 (10차 G3 라운드 D10-7).
#
# ── 적용 ─────────────────────────────────────────────────────────────────────
#   server {
#       listen 80;
#       server_name example.com;
#       root  /var/www/g7;          # 프로젝트 루트 (= 문서 루트, 바꿀 수 없는 상태)
#       index index.php;
#
#       include /var/www/g7/deploy/nginx/g7-layout2.conf;   # ← 이 파일
#   }
#
# `include` 는 **다른 location 블록보다 앞**에 둔다. nginx 는 정규식 location 을
# **설정에 적힌 순서대로** 평가하므로, 관리 패널이 넣어 두는 정적 최적화 블록
# (`location ~* \.(js|css|json|png|…)$ { expires max; }`)이 먼저 나오면 그 블록이
# 프로젝트 루트에서 파일을 직접 읽어 `/composer.json` 같은 주소가 그대로 열린다.
# (같은 함정을 INSTALL.md 「정적 파일 최적화 블록을 함께 쓰는 경우」가 다룬다.)
#
# ── 하위 폴더 마운트 ─────────────────────────────────────────────────────────
# 이 조각은 사이트가 **문서 루트 바로 아래**에 놓인 배치를 전제로 `^/…` 로 경로를
# 잡는다. 사이트가 하위 폴더에 있다면(`https://host/g7/`) 각 정규식의 `^/` 를
# `^/g7/` 로 바꾼다.
#
# **`try_files` 는 그렇게 바꾸면 안 된다.** 종전 지시는 `try_files` 의 조회 경로 앞에도
# 같은 접두사를 덧붙이라고 적었는데, 그 배치에서 `$uri` 는 이미 접두사를 포함한다 —
# 조회 경로가 접두사를 **두 번** 갖게 되어 언제나 부재이고, 정적 자산이 전부 위임으로
# 떨어진다(`/g7/build/assets/*.js` 포함). 접두사를 **빼는** 형태가 필요하다:
#
#     location /g7/ {
#         rewrite ^/g7(/.*)$ /public$1 break;   # 접두사 제거 후 공개 폴더로
#         try_files $uri @g7_front;
#     }
#
# 이 형태는 **재어 본 적이 없다**(위 선언 토큰 참조). 그대로 옮겨 쓰지 말고 첫 배포에서
# 정적 자산 200 · 위임 200 · 정본 주소 301 셋을 함께 확인한다 (10차 G3 라운드 D10-3).
#
# **리다이렉트 목적지에도 같은 접두사를 붙인다** — 이 축을 빠뜨리면 그 사이트의
# 정규화가 사이트 **밖**으로 나간다: `/g7/public/favicon.ico` → `Location: /favicon.ico`,
# `/g7/install` → `Location: /install/`. 고칠 자리는 (3) 의 `^/public(/.*)$` 두 조건과
# `return 301 $1`, 그리고 (3-1) 의 `location = /install…` 및 그 `return 301 /install/`
# 이다. 형제 Apache 는 마운트를 매치 문자열로 판정해 이 조정 자체가 필요 없다
# (7차 G3 라운드 A3).
#
# 형제 파일 `.htaccess` 는 상대 경로로 동작해 그 조정이 필요 없다.
#
# 형제 파일 루트 `.htaccess` 는 위임 규칙이 사이트 안 경로를 진입 스크립트에 넘겨,
# 웹서버가 `SCRIPT_NAME` 에 접두사를 싣지 않는 마운트 형태(Apache `Alias` 등)에서도
# 접두사를 복원한다. **이 조각에는 그에 해당하는 전달이 없다** — nginx 로 그 형태를
# 재어 본 적이 없어 무엇을 넘겨야 하는지 확정하지 못했기 때문이다. 그래서 이 서버에서
# 하위 주소 배치를 쓴다면 `location` 접두사가 `fastcgi_param SCRIPT_NAME` 에 실리는지
# 먼저 확인한다 — 실리지 않으면 미설치 안내가 사이트 밖 주소를 가리킨다.
#
# ── PHP 소켓 ─────────────────────────────────────────────────────────────────
# 아래 `@g7_front` 의 `fastcgi_pass` 는 환경에 맞게 고친다 (PHP-FPM 버전·소켓 경로).
#
# ── 코어 업데이트와 이 파일 ──────────────────────────────────────────────────
# 이 파일을 위처럼 **직접 고쳐 쓰면** 코어 업데이트는 그것을 덮어쓰지 않는다. 대신 새
# 판본을 같은 자리에 `g7-layout2.conf.dist` 로 두고 업데이트 결과에 그 사실을 알린다 —
# 두 파일의 차이를 확인해 직접 합친 뒤 reload 하고 `.dist` 는 지운다. 합치지 않으면 새
# 판본의 보호 규칙이 이 서버에 적용되지 않는다. 고치지 않은 파일은 그대로 갱신된다.
# 판정 근거는 코어가 마지막으로 쓴 내용의 기록이므로, 그 기록이 없는 사이트(이 규칙
# 이전에 설치)는 첫 업데이트 한 번에 한해 바뀐 조각을 전부 「수정본」으로 본다
# (15차 G3 라운드 W2-1).
#
# ── 루트 `.htaccess` 와의 대응 ────────────────────────────────────────────────
# | 루트 `.htaccess`                                   | 이 파일                          |
# |----------------------------------------------------|----------------------------------|
# | `RedirectMatch 403 (?i)(^\|/)\.(?!well-known/)`      | `location ~ /\.` → `deny all`    |
# | `RewriteRule ^\.well-known/ - [L]`                  | `location ^~ /.well-known/`      |
# | `Header always set X-Content-Type-Options nosniff` (`.well-known/` 정적 서빙) | `location ^~ /.well-known/` 의 `add_header … always` |
# | `RewriteRule ^((?!public/).*)$ public/$1 [E=G7_ROUTE:$1,L]` | `location /` → `try_files /public$uri` |
# | `public/.htaccess` (B) `/public/…` → 301            | `location ~ ^/public/`           |
# | `!mod_rewrite` 민감 디렉토리 `RedirectMatch 403`     | `location ~ ^/(…)(/\|$)` (아래 주 참조) |
# | `!mod_rewrite` 확장자 `<FilesMatch>`                | `location ~ ^/[^/]+\.(…)$`       |
# | `!mod_rewrite` 확장자 없는 파일 `<FilesMatch>`       | `location ~ ^/(artisan\|LICENSE)$` |
# | `IndexIgnore *` (루트 `.htaccess` + `public/.htaccess`, 목록 차단) | `autoindex off` (응답 코드는 갈린다 — 아래 「목록 응답 패리티」) |
# | 루트 `.htaccess` `-d` 위임 + `G7_ROOTDIR` 표식       | **대응물 없음** (주 참조)        |
#
# ── 이 조각만 갖는 규칙 (역방향) ──────────────────────────────────────────────
# 형제 파일 둘(`web.config`·Caddy 조각)은 「nginx 만 갖는 규칙」 행을 이미 갖고 있는데
# 이 파일에는 그 절이 없었다 — 소유자 파일에만 그 사실이 없는 상태였다. 역방향 대조가
# **규칙 단위**로 서면 이 절이 그 도출 근거가 된다 (10차 G3 라운드 D10-6).
# 선언 토큰(`G7-REVERSE-ONLY:`)이 그 행의 **기계 판독 근거**다. 산문 표만 있으면 행을
# 지우거나 늘려도 아무 검사가 울지 않는다 — 형제 둘(`web.config`·Caddy 조각)도 같은 토큰을
# 갖고, 계약 검사가 셋 모두에서 그 절의 존재를 요구한다 (22차 G3 라운드 A5).
#
#   G7-REVERSE-ONLY: install_dir_normalize
#   G7-REVERSE-ONLY: front_controller_named_location
#   G7-REVERSE-ONLY: public_php_direct_exec
#
# | 이 파일                                             | 형제 대응물                      |
# |----------------------------------------------------|----------------------------------|
# | (3-1) `location = /install` → 301 `/install/`       | 없음 — mod_dir·IIS 기본 동작이 같은 일을 한다 · Caddy 는 (7) 이 `root` 를 `…/public` 으로 바꿔 자동 슬래시 301 이 이미 정본 주소를 낸다(그 조각의 대응표가 같은 근거를 적는다) |
# | (8) `location @g7_front` (위임 본체)                | Apache 는 없음(위임이 재작성 한 줄이라 별도 블록이 없다) · Caddy 는 `(g7_delegate)` 스니펫이 그 자리를 갖는다 · IIS 는 없음(rule "G7 delegate to public" 이 재작성 한 줄이라 마찬가지) |
# | (9) `location ~ ^/(.+\.php)$` (public 아래 .php 실행, 부재 시 (8) 로 폴백) | Apache 는 없음(`public/.htaccess` 가 그 자리를 갖는다 — 부재 시 프런트 컨트롤러 위임도 그쪽 규칙이다) · Caddy 는 `(g7_delegate)` 안의 `php_fastcgi` 가 그 자리를 갖는다 · IIS 는 `handlers` 기본 매핑이 그 자리를 갖는다(위임 규칙이 `public/` 아래 실재 파일을 건드리지 않는다) |
# 표 머리가 「형제 **셋**」이다. 종전에는 (8)(9) 두 행이 Apache·Caddy 만 논증하고 IIS 를
# 빠뜨렸고, (3-1) 행은 Caddy 를 빠뜨렸다 — 근거가 절반~2/3 인 상태였고, 그 상태에서는
# 빠진 서버 쪽 대응물이 사라져도 이 표가 그대로 참으로 읽힌다 (13차 #D11-8 · 22차 A4).
#
# 목록 응답 패리티 — G7-PARITY-NOTE: AUTOINDEX_EMPTY_LISTING
#   루트와 `public/` 에 같은 이름의 디렉토리(`storage`)가 있다. 그 주소에 대한 응답은 보호는
#   같은데 **코드가 갈린다**: Apache 는 서버 `Options` 에 `Indexes` 가 없으면 403(P0 5마운트
#   실측 전부 — vhost 가 `Options -Indexes` 였다), 켜져 있으면 `IndexIgnore *` 가 **빈 목록
#   200**(파일명 노출 0)을 낸다. 루트 `.htaccess` 가 `Options -Indexes` 를 스스로 두지 못하는
#   이유는 그 지시어가 `AllowOverride Options` 등급이라 제한 호스팅에서 디렉토리 하위 전
#   요청을 500 으로 만들기 때문이다(형제 `.htaccess` 머리말). 이 조각은 `autoindex off` 라
#   **403** 이고 Caddy·IIS 도 403·404 다 — 첫 실측에서 Apache 가 200 을 내더라도 파일 이름이
#   한 줄도 없으면 정상이고, 403 을 내더라도 「이 조각과 갈렸다」가 아니다.
#
# 주 — `-d` 위임 + `G7_ROOTDIR` 표식에 대응물이 없는 이유.
#   Apache 는 `mod_dir` 이 루트 실존 디렉토리(`/app`)에 슬래시를 붙여 되던지고, 그 요청이
#   `public/app/` 로 위임되면 `public/.htaccess` (D) 가 `public/` 아래에 그 디렉토리가
#   없다는 이유로 슬래시를 다시 떼어 무한 301 이 된다 — 그래서 루트가 그 위임에 표식을
#   실어 (D) 가 건너뛰게 한다(P0 실측. 종전의 `DirectorySlash Off` 는 슬래시 없는 마운트
#   루트 `/g7sub` 를 403 으로 만들어 폐기했다). 이 조각에는 (D) 형태의 **슬래시를 떼는
#   규칙 자체가 없다** — nginx 는 그 자동 슬래시를 `try_files` 로 파일을 찾지 못한 경로에는
#   적용하지 않고, 프로젝트 루트의 실존 디렉토리(app·storage·vendor…)는 위 (4) 규칙이
#   먼저 잡아 위임으로 흡수한다. 그래서 같은 고리가 성립하지 않는다.
#   **이 서술은 코드 독해이지 실측이 아니다.** 첫 배포 시 `/app`(슬래시 없음)이 무한
#   리다이렉트 없이 404 로 끝나는지 확인할 것.
#
# 주 — Apache 의 민감 디렉토리·확장자 차단은 `<IfModule !mod_rewrite.c>` 안에 있다.
# 위임이 성립하는 서버에서 그 패턴이 평가되면 `/api/modules/bundle.js` 같은 정상
# 라우트까지 403 이 되기 때문이다. nginx 에는 「위임이 없는 상태」가 존재하지 않으므로
# (이 조각이 곧 위임이다) 같은 목록을 **차단이 아니라 위임**으로 낸다: 요청은 언제나
# `public/` 아래에서만 해석되고, 프로젝트 루트는 어떤 경로로도 읽히지 않는다. 목록을
# 그대로 옮겨 적는 이유는 위에 적은 **정규식 location 우선순위** 때문이다 — 이 이름들이
# 패널 블록보다 먼저 잡혀야 그 블록이 프로젝트 루트를 읽지 못한다.
#
# 이 목록은 루트 `.htaccess` 에서 도출한다. 한쪽에 항목이 늘면 계약 테스트가 red 가 된다.


# (1) SSL 인증서 자동 갱신(ACME HTTP-01). 문서 루트의 `.well-known/` 을 그대로 읽으므로
#     아래 숨김 파일 차단보다 앞선다. `^~` 는 정규식 location 을 이기므로 위치와 무관하게
#     (2) 보다 우선한다.
location ^~ /.well-known/ {
    # `add_header` 는 상속되지 않고 **대체**되므로 이 블록이 자기 것을 갖는다. 없으면
    # 운영자가 이 디렉토리에 두는 파일(`security.txt`·`assetlinks.json` 등)만 스니핑
    # 승격 대상이 되어, 형제 서버들과 이 한 경로에서만 보호 강도가 갈린다.
    #
    # `autoindex` 도 같은 이유로 블록마다 적는다 — 상위에서 끈 값이 내려오지 않는다.
    # 형제 셋은 이 둘을 무조건 건다(Apache 는 디렉토리 단위 `.htaccess`, IIS 는
    # `system.webServer` 전역, Caddy 는 사이트 블록 전역).
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# (2) 숨김 파일(`.env`·`.git/…` 등) — 경로 어느 구간에 있든 차단한다.
location ~ /\. {
    deny all;
    # 403 도 응답이다. 형제 셋은 이 응답에도 헤더를 싣는다(Apache `Header always set` 은
    # 디렉토리 하위 전 응답 · IIS `customHeaders` 는 사이트 전역 · Caddy 는 그 자리에
    # 헤더를 건다). nginx 만 `add_header` 가 상속되지 않고 **대체**되므로 블록마다 명시해야
    # 같은 강도가 된다 — 없으면 같은 사이트가 서버에 따라 다른 헤더를 낸다
    # (23차 G3 라운드 A23-5).
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    log_not_found off;
}

# (3) 정본 주소 고정. 같은 사이트가 `/…` 와 `/public/…` 두 갈래로 열리면 세션 쿠키
#     path·절대 URL·검색 색인이 갈린다. 아래 위임은 **내부 파일 조회**라 location 을
#     다시 타지 않으므로 이 규칙과 맞물려 루프가 생기지 않는다.
#
#     목적지는 **인코딩된 원문**(`$request_uri`)에서 만든다. location 정규식의 캡처
#     (`$1`)는 nginx 가 `%XX` 를 푼 정규화 URI 에 대해 잡히므로, 그 값을 그대로
#     `Location` 에 실으면 한 번 인코딩이 모자란 주소가 나간다 — `/public/my%20file.png`
#     → `Location: /my file.png`(헤더에 생 공백), `/public/a%2520b` → `/a%20b`(이중
#     디코딩으로 **다른 파일**), `/public/x%3Fy=1` → 경로가 쿼리로 승격. 형제 Apache 는
#     같은 자리에서 mod_rewrite 의 기본 이스케이프에 기대어 `NE` 를 금지하는 것으로 이
#     축을 지킨다 (7차 G3 라운드 A4).
#
#     `$request_uri` 는 쿼리까지 포함한 원문이므로 `$is_args$args` 를 덧붙이지 않는다.
location ~ ^/public/ {
    # 이 블록의 404·301 응답에도 형제 셋과 같은 헤더를 싣는다 (A23-5).
    add_header X-Content-Type-Options "nosniff" always;
    # 인코딩으로 가린 요청(`/%70ublic/…`)은 정규화하지 않고 **거부**한다 — 정규화하면
    # 서버가 스스로 제2 주소를 공표하는 셈이다. 형제 Apache 의 (B-0) 과 같은 판정이며,
    # 여기서는 디코딩된 경로가 `/public/` 인데 원문은 아닌 상태가 그 신호다.
    if ($request_uri !~ "^/public/") {
        return 404;
    }

    # 빈 세그먼트가 든 요청은 정규화하지 않고 거부한다. `$request_uri` 는 **원문**이라
    # `merge_slashes` 의 영향을 받지 않으므로(그 지시어는 `$uri` 와 location 매칭에만
    # 걸린다) `/public//evil.example/p` 에서 아래 캡처가 `//evil.example/p` 가 되고,
    # `Location: //evil.example/p` 를 브라우저가 **프로토콜 상대 URL** 로 읽어
    # **목적지 호스트를 요청자가 지정**한다. 형제 Apache 는 같은 것을
    # `RewriteCond %{REQUEST_URI} !//` 로 막는다(`public/.htaccess` (B)·(E)).
    #
    # 판정은 **경로 구간에만** 건다(`^[^?]*//`). `$request_uri` 는 쿼리까지 포함한
    # 원문이라 문자열 전체에 `//` 를 걸면 형제 Apache 와 폭이 갈린다 — Apache 의
    # `%{REQUEST_URI}` 는 경로 전용이므로, 쿼리에 URL 이 실린 정상 요청
    # (`/public/board/1?next=https://x/`)이 이 서버에서만 404 가 된다. 그 입력은
    # 취약점 재현 경로가 아니다: 아래 캡처는 `^/public(/.*)$` 라 목적지가 언제나
    # `/` 로 시작해 프로토콜 상대가 될 수 없다.
    #
    # **알려진 한계 — 역슬래시 형태(`/\`).** 이 가드는 `//` 리터럴만 본다. 그런데 WHATWG
    # URL 파싱은 특수 스킴에서 `\` 를 `/` 와 동등하게 다루므로 브라우저는
    # `Location: /\evil.example/p` 도 authority 시작으로 읽는다 — 즉 `//` 와 같은 결과다.
    # `/public/\evil.example/p` 는 위 두 조건을 모두 통과해 아래 캡처가 `/\evil.example/p`
    # 가 되고, 그 값이 그대로 301 목적지로 나간다. 형제 Apache 는 같은 입력을 우연히
    # 닫는다 — mod_rewrite 가 목적지를 만들 때 백슬래시를 `%5C` 로 이스케이프하기 때문이며,
    # 그 서버가 그 축을 **의도해서** 막은 것은 아니다. 형제 Caddy·IIS 도 열려 있다.
    #   이 조각은 실측 환경이 없다(아래 「검증 상태」). 가드를 넓히면 nginx 정규식의
    #   백슬래시 이스케이프가 설정 파서와 PCRE 두 단계를 지나므로 **잘못 적으면 그 규칙이
    #   통째로 꺼지거나 설정 로드가 실패**하는데, 그 결과를 잴 수 없다. 프로젝트 결정(2026-08-27,
    #   미실측 서버는 문서만 보강)에 따라 한계로 남기고 운영자 확인 항목으로 넘긴다.
    #   첫 배포 시 잴 항목:
    #     curl -sI 'http://호스트/public/\evil.example/p' | grep -i location
    #   `Location` 이 `/\evil.example/p` 로 나가면 이 `if` 옆에 역슬래시 조건을 하나 더 세운다.
    #
    # **정본화 대상 밖.** 빈 세그먼트가 든 주소는 이 규칙이 다루지 않는다 — 이 서버는
    # 404 로 거부하고, 형제 Apache 는 규칙을 건너뛰어 그 주소가 그대로 응답된다
    # (`/public//favicon.ico` 가 Apache 에서는 정적 200 이다). 「제2 주소를 없앤다」는
    # 이 규칙의 목적은 그 입력에서 **어느 서버에서도 성립하지 않는다.** 응답이 갈리는 것은
    # 거부 수단의 차이일 뿐 보호 폭의 차이가 아니다.
    if ($request_uri ~ "^[^?]*//") {
        return 404;
    }

    if ($request_uri ~ "^/public(/.*)$") {
        return 301 $1;
    }

    return 404;
}

# (3-1) 설치 마법사는 `public/install/` 의 **실제 디렉토리**다. 디렉토리 주소를 인덱스
#       파일로 여기서 확정한다 — nginx 의 자동 슬래시·자동 인덱스에 맡기면 그 내부
#       리다이렉트가 위임 경로를 그대로 `Location: /public/install/` 로 **공표해**
#       제2 주소가 브라우저에 노출된다(실측). 같은 이유로 `public/.htaccess` 도 이
#       정규화를 자기 몫으로 가져갔다.
location = /install  { add_header X-Content-Type-Options "nosniff" always; return 301 /install/; }
location = /install/ { rewrite ^ /install/index.php last; }

# (4) 민감 디렉토리 — 위임으로 흡수한다(위 「주」 참조).
location ~ ^/(\.git|app|bootstrap|config|database|deploy|docs|lang|lang-packs|modules|node_modules|playwright-report|plugins|resources|routes|scripts|storage|templates|test-results|tests|upgrades|vendor)(/|$) {
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files /public$uri @g7_front;
}

# (5) 최상위 민감 확장자 — 위임으로 흡수한다. `[^/]+` 로 **최상위 한 칸**에만 걸리므로
#     `/build/assets/app-abc.js` 처럼 `public/` 아래 깊은 자산은 영향받지 않는다.
#     `/robots.txt` 는 `public/robots.txt` 가 실재하므로 그대로 200 이다.
location ~ ^/[^/]+\.(json|lock|md|log|sql|sqlite|xml|ya?ml|ini|sh|bat|bak|dist|zip|gz|tar|7z|phar|js|cjs|mjs|ts|py|toml|patch|txt|default|example|config)$ {
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files /public$uri @g7_front;
}

# (6) 확장자가 없는 최상위 파일. `artisan` 은 PHP 소스이고, `public/` 에 같은 이름이
#     없으므로 애플리케이션으로 넘어가 404 가 된다.
location ~ ^/(artisan|LICENSE)$ {
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files /public$uri @g7_front;
}

# (7) 위임 본체. `root` 를 건드리지 않고 `try_files` 의 조회 경로 앞에 `/public` 을
#     붙인다 — 프로젝트 루트가 조회 대상에 **한 번도 들어가지 않는다**.
#
#     정적 서빙에도 `X-Content-Type-Options: nosniff` 를 붙인다 — 애플리케이션의 파일 응답
#     헬퍼가 같은 헤더를 붙이므로, `public/storage` 링크 유무(정적 서빙 ↔ 앱 서빙)에 따라
#     업로드된 SVG·HTML 의 실행 여부가 갈리지 않는다. `always` 가 없으면 4xx·5xx 에는 붙지
#     않는다. 이 location 은 `public/` 아래 모든 정적 파일이 지나는 자리이고, (4)(5)(6) 은
#     `public/` 에 같은 이름이 실재할 때만 정적 응답이라 그 셋에도 같은 줄을 둔다. 형제 셋
#     (Apache `Header`·Caddy `header`·IIS `customHeaders`)과 같은 몫이다 (G3 회차 16 W2 C-3).
#
#     주의 — nginx 의 `add_header` 는 **상속되지 않고 대체된다.** location 에 하나라도 있으면
#     server 블록의 `add_header`(HSTS 등)가 그 location 에서 사라진다. 서버 수준 헤더를 쓰고
#     있다면 이 조각의 `add_header` 줄 옆에 그 헤더를 함께 적는다(이 파일은 운영자가 제자리에서
#     고쳐 쓰는 파일이다 — 위 「코어 업데이트와 이 파일」 참조).
location / {
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files /public$uri @g7_front;
}

# (8) 프런트 컨트롤러. 실행 대상은 언제나 `public/index.php` 하나다.
#     `include fastcgi_params` 가 **첫 줄**이다 — 그 파일이 `SCRIPT_NAME`·`DOCUMENT_ROOT`·
#     `QUERY_STRING` 을 자기 값으로 선언하므로, 재정의는 그 뒤에 와야 한다. 앞에 두면 같은
#     이름이 두 번 선언되어 둘 다 FastCGI 에 실리고 어느 값이 이기는지가 PHP-FPM 에 달린다 —
#     오류 없이 접두사 복원이 배치에 따라 갈린다 (G3 회차 16 W2 C-4).
location @g7_front {
    # 동적 응답에도 nosniff 를 붙인다. 형제 셋은 응답의 정적·동적을 가리지 않는다 —
    # Apache 의 `Header always set` 은 디렉토리 하위 전 응답에, IIS 의 `customHeaders`
    # 와 Caddy 의 `header` 는 사이트 전역에 걸린다. 이 조각만 정적 서빙 블록에만 두면
    # 같은 사이트가 「파일이 실재하는가」에 따라 보호 강도가 갈린다.
    #
    # 앱이 파일 응답 헬퍼에서 같은 헤더를 붙이는 경로에서는 값이 두 번 실린다. 값이
    # 같으므로 판정은 바뀌지 않는다(Fetch 규격은 첫 값을 본다) — nginx 에는 `add_header`
    # 의 「대체」 형태가 없어 이것이 형제와 같은 보호를 내는 유일한 수단이다.
    add_header X-Content-Type-Options nosniff always;
    include       fastcgi_params;
    fastcgi_pass  unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/public/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   $document_root/public;
    fastcgi_param QUERY_STRING    $query_string;
}

# (9) `public/` 아래의 `.php` 를 직접 실행한다 — 설치 마법사(`/install/…`)가 여기에
#     해당한다. 파일이 없으면 (8) 프런트 컨트롤러로 **폴백**한다 — 형제 Apache 는 같은
#     주소(`/foo.php`)를 `public/.htaccess` 의 프런트 컨트롤러 위임으로 애플리케이션에 넘기므로
#     (라우트가 있으면 200, 없으면 앱의 404 화면), 여기서 `=404` 로 끝내면 그 주소의 응답 주체가
#     서버에 따라 갈린다(404 화면·헤더·로그가 다르다). 없는 파일을 PHP-FPM 에 직접 넘기지 않는
#     것은 그대로다("Primary script unknown" 노출 차단) — 폴백 대상은 named location 이라
#     정규식 location 을 다시 타지 않으므로 (3) 과 맞물려 루프가 생기지 않는다 (G3 회차 16 W2 C-7).
#     `include fastcgi_params` 가 첫 줄인 이유는 (8) 과 같다.
location ~ ^/(.+\.php)$ {
    # 동적 응답 nosniff — 근거는 (8) 과 같다. 설치 마법사(`/install/…`)가 이 자리를 지난다.
    add_header X-Content-Type-Options nosniff always;
    try_files /public/$1 @g7_front;
    include       fastcgi_params;
    fastcgi_pass  unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/public/$1;
}
