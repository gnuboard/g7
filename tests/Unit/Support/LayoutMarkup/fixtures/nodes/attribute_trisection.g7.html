<data-grid data-type="composite" data-ref="user_grid"
           class="admin-card"
           data-testid="grid"
           aria-label="$t:admin.users.title"
           :serverSidePagination="true"
           :pageSize="20"
           data="{{users?.data?.data ?? []}}"

           data-track-changes

           data-slot="content"
           data-slot-order="2"/>
