feature: 부모 삭제 경로의 자식 명시 삭제 — DB CASCADE 비의존

description: |
  부모 행을 지우는 서비스·저장소가 자식 행(메뉴 배정·메뉴 권한·역할 부여·회원 배정·실행 이력·알림 템플릿·하위 메뉴)을
  DB CASCADE 에 기대지 않고 명시적으로 지운다. 외래키 검사를 끈 상태에서 삭제해도 자식 고아가 0건이어야 한다.
  다른 확장이 소유한 자식(본인확인 거래 매핑 등)은 코어가 그 테이블을 모르므로, 부모를 지우기 직전 훅
  `core.identity_logs.before_purge` 로 알리고 소유 확장의 리스너가 지운다. 확장 메뉴 일괄 삭제는 다른 출처의 자식 메뉴를
  지우지 않고 최상위로 올린다. 마이그레이션의 cascade FK 는 안전망으로 남고, 대장·정적 검사가 새 삭제 지점을 막는다.

# 축 의미:
#   case — {지우는 부모 테이블}__{삭제를 시작하는 계층}(service: 서비스 메서드, repository: 저장소 일괄 삭제).
axes:
  case: [menus__service, menus__repository, permissions__repository, roles__service, users__service, schedules__service, notification_definitions__service, identity_verification_logs__service]

effects:
  - children_deleted_without_cascade
  - operator_child_menu_lifted
  - purge_hook_fired_before_delete

test_files:
  - tests/Feature/Architecture/NoCascadeDependentDeletionTest.php
