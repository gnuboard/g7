feature: 확장 회원 항목 이름의 언어팩 번역 (Extension Field Language Pack Texts)

description: |
  확장(게시판 알림 4칸, 비회원 작성자 항목, 이커머스 통화와 배송 국가, 주문서 항목, 마케팅 동의)이 선언한 회원 항목의
  이름과 안내문은 선언 동기화 때 DB 행에 다국어 JSON 으로 저장된다. 확장은 그 글을 자기 언어 파일에서 읽는데,
  코어 도우미 `ExtensionLangTexts` 가 그 확장을 대상으로 하는 활성 언어팩의 `backend/{언어}/fields.php` 도 함께 읽어
  확장에 없는 언어(ja 등)를 더한다. 확장 범위 언어팩을 켜고 끌 때 `RunSeedersOnLanguagePackLifecycle` 이 그 확장의
  항목 선언을 다시 동기화해 DB 행에 반영한다.

  이 경로가 없으면 일본어 화면에서 확장이 기여한 항목만 한국어로 보였다(실측 C-O4). 확장별 선언 시험은 각 확장의
  매니페스트(`language_pack_names`)가 가진다.

axes:
  case: [active_pack_adds_locale, inactive_or_other_target_ignored, pack_lifecycle_resyncs_fields]

effects:
  - extension_field_name_includes_active_pack_locale
  - inactive_or_foreign_pack_not_read
  - pack_toggle_resyncs_extension_field_definitions

test_files:
  - tests/Feature/LanguagePack/LanguagePackExtensionFieldTextsTest.php
