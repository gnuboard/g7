feature: 업그레이드 스텝 지문 — 검수 서버의 같은 판 재배포에서 같은 내용의 스텝을 다시 돌리지 않는다

description: |
  검수 서버(stage)는 운영 서버와 같은 DB 를 쓴다. 검수에서 결함을 고쳐 같은 판 번호로 다시 배포(`*:update --force`,
  `core:execute-upgrade-steps --force`)하면 실행 대장(`upgrade_step_runs`)이 `--force` 를 「대장 무시」로 읽어 이미 끝난 스텝이
  공유 DB 에서 두 번 돌았다. 반대로 「늘 건너뜀」이면 1차 배포 때 결함이 있던 스텝을 같은 판 번호로 고쳐도 다시 돌 길이 없다.
  대장에 스텝 내용의 지문(sha256 — 스텝 클래스 파일 + 그 스텝의 `data/<판>/` 파일)을 적는다. 검수 서버의 `--force` 는 이미
  끝났고 지문이 같으면 건너뛰고(「건너뜀」 통지), 다르면 다시 돌고 지문을 갱신한다. 운영 서버의 `--force` 는 종전대로 다시 돈다.
  지문이 없는 옛 행은 「모름」으로 보고 다시 돌며 지문을 채운다. 클로저 스텝(`callable@판`)은 지문이 없다.
  `--force` 없는 실행·끝나지 않은 행의 동작은 tests/scenarios/upgrade-step-run-ledger.yaml 이 잰다.

# 축 의미:
#   case — {스텝 소유}__{역할}_{상황}.
axes:
  case:
    - core__stage_force_same_content       # 검수 서버, 같은 판 --force, 내용 같음
    - core__stage_force_changed_step       # 검수 서버, 같은 판 --force, 스텝 파일 고침
    - core__live_force_same_content        # 운영 서버, 같은 판 --force, 내용 같음
    - core__stage_force_legacy_row         # 검수 서버, 지문 없는 옛 done 행
    - module__stage_force_data_migration   # 검수 서버, 모듈 클래스 스텝 — 데이터 마이그레이션만 고침
    - plugin__stage_force_data_migration   # 검수 서버, 플러그인 클래스 스텝 — 데이터 마이그레이션만 고침
    - module__stage_force_closure          # 검수 서버, 클로저 스텝
    - core__live_yes_without_force         # 운영 서버 배포, --force 없이 --yes 로 확인만 넘김

effects:
  - step_fingerprint_is_recorded                        # 실행한 클래스 스텝은 대장에 sha256 지문을 남긴다
  - stage_force_skips_done_step_with_same_fingerprint   # 검수 서버 --force: done + 같은 지문이면 건너뛰고 「건너뜀」으로 통지
  - stage_force_reruns_step_when_fingerprint_changes    # 검수 서버 --force: 지문이 다르면 다시 돌고 지문을 갱신
  - data_migration_change_changes_fingerprint           # 스텝 클래스는 그대로, data/<판>/migrations 파일만 고쳐도 지문이 바뀐다
  - live_force_reruns_done_step                         # 운영 서버 --force 는 지문과 무관하게 다시 돈다
  - legacy_row_without_fingerprint_reruns_and_fills     # 지문 없는 옛 done 행은 다시 돌고 지문을 채운다
  - live_yes_skips_done_step                            # 운영 서버의 --yes 실행은 대장을 무시하지 않아 검수 서버가 끝낸 스텝을 건너뛴다
  - closure_step_has_no_fingerprint                     # 클로저 스텝은 지문 NULL, --force 에서 다시 돈다

test_files:
  - tests/Feature/Upgrade/UpgradeStepFingerprintTest.php
