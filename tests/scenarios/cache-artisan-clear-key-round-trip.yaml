feature: cache_artisan_clear_key_round_trip

description: |
  캐시 이관 그룹 G(module:cache-clear, plugin:cache-clear, template:cache-clear) 당시의 키 픽스처로
  CacheInterface(코어 드라이버, array 저장소)의 다건 put 후 forget 왕복을 고정한다.
  커맨드는 호출하지 않는다. 현행 커맨드는 상태 키 무효화, 레이아웃 캐시, 버전 증가로 동작하며
  커맨드 실동작은 {Module,Plugin,Template}ArtisanCommandsTest 가 맡는다. 여기서는 모듈, 플러그인,
  템플릿 키와 전역 키를 forget 하면 모두 사라지는지만 본다.

axes:
  case:
    - module_keys              # 모듈 키 픽스처 (G-1-1)
    - plugin_keys              # 플러그인 키 픽스처 (G-1-2)
    - template_keys            # 템플릿, 레이아웃 키 픽스처 (G-1-3)
    - global_and_module_keys   # 전역 키와 개별 모듈 키 혼합 (G-1-4)

exclusions:
  - { case: module_keys, reason: "제외 없음 — 사례 단일 축" }

effects:
  - per_extension_keys_forgotten   # 확장별 키를 forget 하면 has() 가 모두 false 다
  - global_keys_forgotten          # 전역 키(modules.all 등)를 forget 하면 has() 가 모두 false 다

test_files:
  - tests/Unit/Cache/Migration/ArtisanCacheClearTest.php
