feature: 레이아웃·확장 조각·커스텀 다국어 관리 API 실패 응답의 DB 내부 정보 차단 (7.1.0 전수 실측 영역 I1)

description: |
  레이아웃 파일·레이아웃 확장 조각·템플릿 커스텀 다국어 관리 컨트롤러가 실패를
  `$this->error('common.failed', 500, ['error' => $e->getMessage()])` 로 돌려줬다. 응답 도우미의 운영 모드
  500 차단은 문자열 오류만 거르므로 배열로 감싼 원문이 `errors.error` 로 그대로 나갔다 — DB 예외라면 SQL·
  DB 호스트·DB 이름이 관리자 화면 응답에 실린다. 이제 사유는 SafeExceptionMessage 를 거쳐 운영 모드의
  내부 예외를 일반 문구로 바꾸고 원문은 서버 로그에만 남긴다. 그 계약을 예외 주입(DB 예외 — SQL·호스트·
  DB 이름 포함)으로 잠그고, 세 컨트롤러 소스에 원문 직접 싣기가 다시 들어오지 않는지도 함께 본다.
  운영 모드(app.debug=false) 기준.

axes:
  surface: [admin_api]

effects:
  - layout_admin_failure_masks_db_detail

test_files:
  - tests/Feature/Api/Admin/LayoutAdminFailureMaskingTest.php

notes: |
  경로(레이아웃 생성·이름변경·삭제·저장·미리보기 / 확장 조각 / 커스텀 다국어)는 축이 아니라 각 시험 안에서 모두 돈다.
  판정 규칙 자체는 tests/Unit/Support/SafeExceptionMessageTest.php 가 예외 종류별로 고정한다
  (extension-failure-internal-detail-masking.yaml 소유).
  e2e_browser=not_applicable — 서버 예외 주입 계약. 브라우저에서 DB 예외를 일으키려면 공유 DB 를 망가뜨려야 해
  실측은 하지 않는다.

validation:
  audit_rule: test-scenario-coverage
