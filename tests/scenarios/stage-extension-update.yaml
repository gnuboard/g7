feature: 검수 서버(stage)의 확장 업데이트와 미뤄 둔 선언형 정리

description: |
  검수 서버의 `*:update` 는 공유 상태 칸에 `updating` 을 쓰지 않는다(진행 표식은 서버 로컬 진행 기록과 작업 잠금).
  선언형 정리(메뉴·권한·역할·알림 정의/템플릿·본인확인 정책·시드 엔티티·스케줄)는 지우지 않고 대장
  `extension_deferred_cleanups` 에 한 번만 적는다. 운영 서버의 `extension:apply-deferred-cleanup` 이 같은 헬퍼 메서드를 같은
  인자로 불러 지우기 직전 기록·자식 명시 삭제 규칙대로 실행하고 대장 행을 지운다. `--dry-run` 은 무변경, 검수 서버에서는 종료 1.
  live 의 정리는 종전대로 곧바로 지운다. 운영 서버 실행은 지우기 전에 정리할 항목과 건수를 먼저 알린다(`--json` 에는 섞지 않음).

# 축 의미:
#   case — 경로. stage_redeploy 는 검수 서버에 여러 번 배포한 뒤 운영 서버에서 실행하는 경로(#888).
axes:
  case: [deferred_cleanup, live_regression, status_not_updating, stage_redeploy]

effects:
  - stage_cleanup_is_deferred_to_ledger
  - live_applies_deferred_cleanup
  - stage_update_keeps_shared_status
  - apply_deferred_cleanup_announces_items_before_deleting
  - stage_redeploy_restored_item_survives_live_apply
  - stage_redeploy_added_item_survives_live_apply
  - live_apply_recomputes_dynamic_keep_list
  - live_apply_waits_until_server_files_match_shared_version
  - live_apply_rechecks_seed_usage
  - stage_defers_field_definition_removal
  - stage_defers_role_permission_revoke
  - core_cleanup_waits_until_live_core_is_new
  - core_resync_failure_keeps_row
  - rerecorded_row_during_apply_is_kept
  - locked_extension_is_not_applied
  - unknown_kind_row_fails_alone
  - live_apply_waits_when_files_differ_with_same_version
  - core_cleanup_waits_when_declaration_file_differs
  - seeder_row_follows_last_stage_build
  - core_resync_declarations_command_runs_resync

test_files:
  - tests/Feature/RuntimeRole/StageExtensionUpdateTest.php
  - tests/Feature/RuntimeRole/DeferredCleanupRecomputeTest.php
