
feature: 상품 문의 목록 비밀글 마스킹 (KVE-2026-1914 A-1/A-2)

description: |
  상품 문의 목록은 게시판 모듈의 `get_by_ids` 훅으로 게시글 본문을 받아 직렬화한다. 비밀
  문의의 원문(content/title/reply/attachments)이 열람 권한 없는 요청에 새지 않아야 한다.

  방어는 두 계층이며 **각 계층이 독립적으로 성립**해야 한다:

  - layer=hook — 게시판 리스너(EcommerceInquiryHookListener::getByIds)가 SecretContentGate
    판정으로 원문을 마스킹하고, 권위 플래그 `can_view_secret` 를 payload 에 실어 보낸다.
  - layer=service — 이커머스 서비스(ProductInquiryService::getProductInquiries)가 그 권위
    플래그만 신뢰해 재마스킹한다. 자기 권한을 재계산하지 않으므로 게이트 강도가 훅과 갈리지
    않고, 플래그가 없으면 fail-closed(마스킹)다 — 훅 미치환·타 확장 치환 회귀를 덮는다.

  클라이언트가 보내는 `exclude_secret` 는 보안 판정에 쓰이지 않는다(단순 표시 필터). 노출
  여부는 서버가 요청자 신원으로만 결정한다.

  같은 훅 경계에 입력 경계 규율이 하나 더 걸린다(sub_flow `listener_ip_boundary`): 리스너는
  요청 객체에 손을 뻗지 않고(`request()->ip()` 직접 참조 금지) 요청 경계인 서비스가 payload
  로 실어 준 `ip_address` 만 기록한다. viewer 축과 교차하지 않는 별개 관심사라 축이 아니라
  sub_flow 로 둔다.

axes:
  layer: [hook, service]
  viewer: [non_viewer, owner]

effects:
  - hook_masks_secret_post_for_non_viewer
  - hook_exposes_secret_post_to_owner
  - hook_emits_authoritative_can_view_secret_flag
  - service_remasks_when_hook_omits_masking
  - service_fails_closed_when_flag_absent
  - service_remasks_title_with_shared_placeholder
  - service_exposes_original_when_flag_true

sub_flows:
  - id: listener_ip_boundary
    description: |
      리스너 입력 경계 — 생성·답변 두 경로 모두 서비스가 payload 로 주입한 ip_address 를
      그대로 기록하고, payload 에 없으면 요청 객체로 되돌아가지 않고 폴백(0.0.0.0)한다.
      회귀 가드는 request IP 를 비-0.0.0.0 으로 세팅한 상태에서 폴백을 확인한다 —
      0.0.0.0 기본 request 로는 request()->ip() 재도입이 silent green 이 된다.
    effects:
      - listener_uses_service_provided_ip_not_request
      - listener_does_not_reach_into_request_for_ip
      # 주입 측 — Listener 경계는 서비스가 IP 를 실어 보낼 때만 성립한다. 수용 측만
      # 고정하면 주입 코드를 지워도 스위트가 green 이고 문의 IP 가 조용히 0.0.0.0 이 된다.
      # 생성·답변은 서로 다른 서비스 메서드(createInquiry / createReply)라 주입 코드가 각각
      # 있다 — 한 효과로 묶으면 생성 경로 테스트 하나가 답변 경로까지 덮는 것처럼 집계된다.
      - service_injects_client_ip_into_hook_payload
      - service_injects_client_ip_into_reply_hook_payload

