feature: notification_definition_label_source

description: |
  알림 정의 화면의 타입 라벨이 **어디서 오는가** (S2-D14)

  **증상**: 이커머스 「알림 설정」 탭의 정의 **47건 중 37건**이 사람 말 대신 원문 키를
  그대로 보여줬다 — 반품·교환·환불·클레임 **35종 전부**가 여기 포함된다.

      sirsoft-ecommerce.admin.settings.notification_definitions.types.return_requested
      sirsoft-ecommerce.admin.settings.notification_definitions.types.refund_completed
      …

  **원인**: 화면이 `$t:…notification_definitions.types.{{def.type}}` 로 **랭팩 키**를
  찾았다. 그 키는 ko·en 랭팩에 **10종만** 있었다. 정의는 47종이다. 키가 없는 37종은
  번역 엔진이 키 문자열을 그대로 돌려주고, 그것이 화면에 나온다.

  **정작 이름은 이미 있었다.** 목록 API(`/api/admin/notification-definitions`)가
  `name` 을 **로케일 객체**(`{ko, en, ja}`)로 **47건 전건** 내려준다. 화면이 그것을
  버리고 랭팩을 뒤진 것이다.

  **같은 결함의 재발이다.** 종전에 `order_pending_deposit`·`order_delivered` 두 종이
  같은 증상을 냈고, 그때는 **랭팩에 키 2개를 더해** 닫았다. 증상만 지운 수리라 타입이
  늘 때마다 되살아났고, 실제로 35종에서 되살아났다.

  **계약**: 라벨은 `$localized(def.name)` 으로 **데이터에서** 온다.

      "text": "{{$localized(def.name) || def.type}}"

    - 랭팩에 타입별 키를 둘 필요가 없다 — 정의가 늘어도 라벨이 저절로 따라온다.
    - 로케일을 바꾸면 같은 정의가 그 언어로 갈린다(ko·en·ja).
    - `name` 이 비면 **타입 코드**로 폴백한다 — 빈 칸을 남기지 않는다.

  **실측 확인**(2026-09-16, `/admin/ecommerce/settings?tab=notification_definitions`):

      수정 전   정의 47건 · 원문 키 **37건** (클레임 35종 전부 포함)
      수정 후   정의 47건 · 원문 키 **0건**
                반품 신청 접수 · 환불 완료 · 교환 회수중 · 클레임 철회 알림 · 구매확정 관리자 알림
      ja 전환   返品申請受付 · 返金完了 …  원문 키 0건
      종전 10건 회귀 0 (결제 완료 · 무통장 입금 안내 · 배송 시작 … 그대로)

  원문 키가 보이는 화면은 운영자에게 「이 알림이 무엇인지」를 알려주지 못한다. 알림을
  켜고 끄고 템플릿을 고치는 화면에서, 무엇을 켜는지 모르면 잘못된 알림을 끈다.

axes:
  notification_definition_label:
    - localized_name_from_data

effects:
  # 랭팩에 타입 키가 없어도 정의 이름이 사람 말로 렌더된다
  - definitions_render_human_labels_without_any_langpack_type_key
  # 이름이 비어도 빈 칸 대신 타입 코드가 남는다
  - missing_name_falls_back_to_the_type_code

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/notificationDefinitionTypeLabels.test.tsx
