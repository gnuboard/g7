feature: G7DevToolsCore 추적 기능 단위 검사

description: |
  G7DevToolsCore 는 디버그 모드에서 상태, 액션, 캐시, 라이프사이클, 성능, 네트워크, 로그, Named Actions, 모달 정의를
  기록하고 진단 정보를 내보낸다. 이 매니페스트는 그 단위 시험 파일(G7DevToolsCore.test.ts)을 영역별로 소유한다.
  인증 진단의 판정 순서는 devtools-auth-diagnostic.yaml 이 배포 번들 spec 으로 따로 다룬다. 마운트 추적은 저장 정보의 id 를
  componentId 로 정하므로 호출자가 id 를 넘기지 않아도 된다.

axes:
  area: [auth_diagnosis, singleton, enablement, state, action_log, cache, lifecycle, performance, network, config, log, named_actions, modal_missing_definition]

effects:
  - devtools_core_auth_diagnosis_respects_auth_manager
  - devtools_core_singleton
  - devtools_core_enabled_by_debug_mode
  - devtools_core_tracks_state
  - devtools_core_logs_actions
  - devtools_core_tracks_cache_stats
  - devtools_core_tracks_lifecycle
  - devtools_core_tracks_performance
  - devtools_core_tracks_network
  - devtools_core_config
  - devtools_core_tracks_logs
  - devtools_core_tracks_named_actions
  - devtools_core_detects_missing_modal_definition

test_files:
  - resources/js/core/devtools/__tests__/G7DevToolsCore.test.ts
