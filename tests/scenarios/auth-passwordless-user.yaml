# audit:allow test-scenario-coverage[cross_product] reason: 축(비밀번호 유무 × 진입 경로 × 시도·만료 상태)은 경로마다 의미 있는 축이 달라
# 곱한 조합 대부분이 명목상이다(재설정 메일 경로에 오입력 횟수 축이 없다 등). 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 비밀번호 없는 회원 (외부 인증 전용)

description: |
  소셜 로그인처럼 외부 인증으로만 가입한 회원은 `users.password` 가 NULL 이다(#40 K3·K4·K5·K8·K10).
    - 비밀번호 로그인은 반드시 실패하고, 틀린 비밀번호 시도를 세지 않아 남이 계정을 잠그지 못한다.
    - 확장은 `AuthService::register($data, ['issue_token' => false])` 로 비밀번호·토큰 없이 가입시킨다.
    - 마이페이지 비밀번호 변경·정보 수정·비밀번호 재설정 메일로 처음 비밀번호를 정한다(현재 비밀번호 없음).
    - 비밀번호 만료 정책(판정·배치 후보·안내·토큰 회수·로그인 변경 관문·표시) 비대상.
    - 대체 이메일(`.invalid`)은 「이메일 없음」 — 메일 2단계 인증·메일 알림·재설정 메일을 보내지 않는다.

axes:
  password: [none, set]
  path: [password_login, register, reset_mail, change_password, profile_update, verify_password, expiry_batch, resource]
  attempts: [under_threshold, over_threshold]
  email: [null, empty, placeholder, normal]

effects:
  - passwordless_row_stored_null
  - password_login_rejected
  - failed_attempts_not_incremented
  - account_not_locked
  - password_holder_locked
  - register_stores_null_password
  - register_skips_token
  - after_register_fires
  - change_date_not_recorded
  - first_password_set_via_reset
  - password_login_succeeds_after_set
  - has_password_exposed_without_hash
  - first_password_set_without_current
  - change_date_recorded
  - current_password_dropped_for_passwordless
  - current_password_required_for_password_holder
  - profile_update_password_branch
  - verify_password_challenges_passwordless
  - policy_excludes_passwordless
  - candidate_query_excludes_passwordless
  - no_notice_for_passwordless
  - no_token_revoke_for_passwordless
  - login_requirement_null_for_passwordless
  - expiry_display_not_applicable
  - undeliverable_email_judged
  - email_deliverable_exposed

test_files:
  - tests/Feature/Auth/PasswordlessUserTest.php
  - tests/Feature/Api/Auth/ChangePasswordWithoutCurrentTest.php
  - tests/Feature/Auth/PasswordExpiryPasswordlessTest.php
  - tests/Unit/Support/UndeliverableEmailTest.php
