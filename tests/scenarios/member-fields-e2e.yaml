feature: member_fields_e2e

description: |
  회원 항목 설정, 운영자 추가 항목, 표시 이름을 실제 브라우저로 잇는 E2E (계획서 10절 Playwright 후보 ①~⑥).
  서버와 레이아웃 테스트는 각 층을 따로 잠그지만 「운영자 화면에서 바꾼 설정 → 사용자 화면」 연결은 한 사이트에서 이어 봐야 드러난다.
  - signup_custom_required: 운영자가 「항목 추가」 창으로 필수 한 줄 글 항목을 만들면 가입 화면에 별표와 함께 나오고, 비우면 제출이 막히며
    서버 오류는 그 칸 아래(`mf_error_{키}`)에만 붙고, 채우면 가입되어 값이 저장된다.
  - signup_order_drag: 가입 항목 표에서 손잡이로 끈 순서가 순서 API 로 저장되고 가입 화면이 그 순서를 따른다.
  - required_info_redirect: 「기존 회원에게도 입력 요구」를 켠 필수 항목이 빈 회원은 로그인 뒤 추가 정보 화면으로 가고, 다른 주소로 가도
    돌아오며, 저장하면 가려던 곳으로 가고 그 뒤로는 유도되지 않는다.
  - display_name_nickname: 운영자가 사이트 기본 표시 이름을 닉네임으로 고정해 저장하면 가입 항목 표의 닉네임 행이 새로고침 없이 잠기고
    회원 헤더가 닉네임을 보인다(게시글 작성자는 게시판 모듈 매니페스트 board-author-display-name-e2e 가 잰다).
  - admin_list_member_fields: 「회원 목록 열」, 「회원 검색」을 켠 항목이 관리자 회원 목록의 열과 검색 대상이 되고, 필수 미입력 회원만 남기는
    조건이 주소 인자로 실려 결과를 좁힌다.
  - display_name_member_default_usage: 회원 기본 종류 아래에 이 값을 쓰는 영역이 보이고, 사이트 기본을 「회원이 고른 값」으로 바꾸면
    저장 전에 「사이트 기본」이 들어오며 저장하고 다시 열어도 그대로다.
  - nickname_interval_notice: 운영자가 닉네임 변경 주기를 정하면 회원이 한 번 바꾼 뒤 수정 화면의 닉네임 칸이 잠기고 다음 변경 가능일이 칸 아래에 보인다.
  모든 스펙은 바꾼 사이트 설정, 만든 항목과 회원을 afterAll 에서 되돌린다(키 접두 e2e490_, 이메일 접두 e2e490.).

coverage_strategy: full

axes:
