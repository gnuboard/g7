feature: setState 의 dot notation 대상(`_local.xxx`)으로 기록한 값이 G7Core.state.getLocal() 에 도달한다 (배포 번들 기준)

description: |
  `_local` 은 저장소가 둘이다 — React `localDynamicState`(A)와 `_global._local`(B). dot notation 분기는 A 만
  갱신하고 B 를 갱신하지 않았다. 모듈·플러그인 커스텀 핸들러가 읽는 공개 통로 `G7Core.state.getLocal()` 은 B 를
  읽으므로 dot notation 으로 기록한 값이 핸들러에게 undefined 로 보였다(실발현: 주문서 간편결제 선택값을
  PG 플러그인이 못 읽어 통합결제창이 열림). 브라우저에서 배포 번들의 액션 파이프(`G7Core.dispatch`)를 직접 태운다.

  축 write_pattern 은 기록의 앞뒤 상황이다 — 단독 기록, setLocal 로 다른 키가 먼저 있는 상태에서의 기록,
  같은 키·형제 키를 잇달아 기록.

axes:
  write_pattern: [single_write, after_setlocal_key, sequential_writes]

effects:
  - dot_path_setstate_reaches_getlocal            # getLocal() 과 canonical 저장소 양쪽에서 기록값이 읽힌다
  - dot_path_setstate_preserves_other_local_keys  # 동기화가 setLocal 로 먼저 둔 다른 키를 지우지 않는다
  - dot_path_setstate_accumulates_across_writes   # 연속 기록 뒤 마지막 값과 형제 키가 함께 남는다

test_files:
  - tests/Playwright/specs/setstate-dot-path-local-store-sync.spec.ts
