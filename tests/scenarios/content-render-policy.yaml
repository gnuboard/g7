feature: 본문 콘텐츠 규칙 — 허용 후보·운영자 추가 태그·외부 영상 서비스·미디어 서빙 응답 (#883 5단계, engine-v1.90.0)

description: |
  코어 환경설정 「본문 콘텐츠」(`content` 카테고리)가 본문 HTML 규칙의 SSoT 다. 서버 `ContentHtmlPolicy` 가 허용 후보(그림 캡션·
  업로드 동영상·오디오·외부 영상)·추가 태그·미디어 출처 패턴을 정하고 `EmbedProviderRegistry` 가 프리셋 3종(YouTube·Vimeo·TikTok)·운영자 직접 추가·확장
  제공 서비스를 같은 컴파일 정규식으로 합친다. 화면에는 계산값 `render_policy` 만 내려가고(원본 비공개), 템플릿 HtmlContent·편집기·
  봇 정화기·이커머스 저장 정화기가 같은 규칙을 쓴다. 본문 미디어 서빙은 `ContentMediaResponder`(Range·inline 판정·보안 헤더).
  미디어 출처 패턴은 확장이 등록한 실제 서빙 라우트에서 만든다(`MediaSourceRoutes` — 모듈·플러그인, 가짜 경로 거부, #887).
  저장용 규칙 `ContentHtmlPolicy::forStorage()` 는 후보 스위치·외부 영상 켜고 끄기와 무관하고, 저장 마무리는 모르는 서비스 oembed 도
  원문 보존한다(#887).

