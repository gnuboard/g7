# audit:allow test-scenario-coverage[cross_product] reason: |
#   이 기능의 축(수신자 종류 × 채널 × 구독자 유무)은 조합마다 별도 테스트를 두는 형태가
#   아니라 **정의 전수를 순회하는 계약 테스트**로 커버한다(1층 계약 + 수신자 해석 단위).
#   effects 축은 면제하지 않는다 — 선언한 부수효과는 전부 테스트 마킹으로 덮여야 한다.
feature: notification_recipient_personalization

description: |
  알림을 "수신자별로" 다르게 만들 수 있게 하는 코어 seam 과, 그 위에 선 정의 전수 계약.

  핵심 동작:
    - NotificationHookListener 가 수신자 루프 안에서 `{prefix}.notification.personalize_data`
      필터를 적용한다. 구독자가 없으면 값이 그대로다(비용 0 · 동작 불변).
    - `core.notification.after_send` 는 **실제로 나간 값**(치환 결과)을 넘긴다.
    - 수신자 0명은 조용히 사라지지 않고 notification_logs 에 skipped 로 남으며,
      사유가 `no_recipient_resolved` / `guest_email_empty` 로 갈린다.
    - `exclude_trigger_user` 는 **그 규칙이 뽑은 수신자에게만** 적용된다.
    - trigger_user_id 가 가리키는 계정이 사라졌으면(삭제 회원) 게스트 재료가 있어도 폴백하지
      않는다 — 판정은 NotificationWithdrawnRecipientPolicy 한 곳이 소유한다(#599 validate).
    - 정의 전수 계약: 본문·링크가 쓰는 변수 선언 · database 채널의 클릭 대상 ·
      audience(staff/customer) ↔ 수신자 규칙 정합 · 인정 어휘 4종.

axes:
  recipient_kind:
    - member
    - guest
    - missing_account
  personalize_subscriber:
    - present
    - absent

exclusions:
  - { recipient_kind: guest, personalize_subscriber: present, reason: "게스트는 관리자 화면 권한이 없어 링크 승격 대상이 아니다 — 승격 판정은 권한으로 가른다" }
  - { recipient_kind: missing_account, personalize_subscriber: present, reason: "계정이 없으면 권한 판정 자체가 성립하지 않는다(게스트와 같은 취급)" }

effects:
  # 1층 전역 구조 계약 (NotificationLinkContractTest)
  # 아래 계약들은 전부 「순회 → 위반 목록이 비었는지」 형태라, 수집기가 빈손이면
  # 모두 조용히 초록이 된다. 모집단 자체를 먼저 못박는 축을 맨 앞에 둔다.
  - notification_declaration_population_is_not_empty
  - every_notification_placeholder_is_declared_as_a_variable
  - database_templates_always_have_a_click_target
  - every_definition_declares_an_audience_consistent_with_its_recipients
  - every_recipient_type_is_within_the_recognized_vocabulary
  # 설명이 비면 폴백이 영문 키를 설명 자리에 넣고, 중복 선언은 같은 줄을 두 번 세운다.
  - declared_variables_are_readable_and_unique
  # 코어 seam (NotificationDispatchIntegrationTest)
  - personalize_data_filter_can_change_values_per_recipient
  - personalize_seam_is_a_noop_without_subscribers
  - after_send_receives_the_personalized_payload
  - zero_recipients_are_logged_as_skipped
  - empty_guest_email_is_logged_with_its_own_reason
  # 건너뜀 사유는 규칙을 사람 말로 적는다 — 관계 이름·유발자 제외·역할 이름(7.1.0 실측 O-G7)
  - zero_recipient_reason_names_rules_in_words
  - zero_recipient_reason_names_role_by_display_name
  # 발송 파이프라인 기본 경로 (NotificationDispatchIntegrationTest) — 수신 규칙별 실제 발송·데이터 추출
  - trigger_user_sends_to_event_user
  - role_sends_to_all_role_users
  - specific_users_sends_to_designated_users
  - role_excludes_trigger_user
  - multiple_rules_combine_and_deduplicate
  - sends_without_extract_data_filter
  - inactive_definition_does_not_send
  - legacy_notifiable_fallback_when_no_recipients
  - core_welcome_extract_data
  - core_reset_password_extract_data
  - core_password_changed_extract_data
  - core_unknown_type_returns_default
  # 수신자 해석 (NotificationRecipientResolverTest)
  # 링크 승격은 수신자마다 권한을 묻는다 — 재료를 함께 싣지 않으면 쿼리가 사람 수만큼 는다.
  - role_recipients_arrive_with_their_permissions_loaded
  - exclude_trigger_user_applies_only_to_its_own_rule
  - exclude_trigger_user_still_filters_its_own_rule
  - missing_trigger_user_does_not_fall_back_to_guest_recipient
  - missing_trigger_user_without_guest_material_stays_empty
  # 수신자 종류별 기본 해석 (NotificationRecipientResolverTest)
  - trigger_user_resolves_from_context
  - trigger_user_resolves_from_id_only
  - trigger_user_returns_empty_without_context
  - related_user_resolves_from_context
  - related_user_returns_empty_when_relation_missing
  - related_user_supports_collection
  - role_resolves_users_by_role_identifier
  - role_resolves_users_from_multiple_identifiers
  - role_multiple_identifiers_deduplicate_shared_users
  - role_scalar_value_still_resolves
  - role_falls_back_to_super_admin
  - role_nonexistent_falls_back_to_super_admin
  - specific_users_resolves_by_uuid
  - specific_users_returns_empty_for_empty_ids
  - exclude_trigger_user_filters_out_trigger
  - no_exclude_keeps_trigger_user
  - multiple_rules_combine_recipients
  - duplicate_users_are_deduplicated
  - empty_rules_returns_empty
  - unknown_type_is_skipped_gracefully
  - invalid_guest_recipient_yields_no_recipient

test_files:
  - tests/Unit/Notifications/NotificationLinkContractTest.php
  - tests/Unit/Listeners/NotificationDispatchIntegrationTest.php
  - tests/Unit/Services/NotificationRecipientResolverTest.php

validation:
  audit_rule: test-scenario-coverage
