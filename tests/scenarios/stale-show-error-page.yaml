feature: 늦게 도착한 showErrorPage 가 이미 이동한 다음 화면을 덮지 않는다 (engine-v1.80.1, 7.1.1 출시 전 실측)

description: |
  잘못된 주소에서 404 가 뜨기 전에 다른 화면으로 SPA 이동하면, 앞 화면이 부른 showErrorPage 가 컨테이너 대기·오류 레이아웃 적재를
  마친 뒤 새 화면 위에 404 를 그렸다. showErrorPage 는 부른 시점의 경로 세대(`TemplateApp.getRouteChangeId`, 데이터 소스 오류 처리는
  그 fetch 를 시작한 세대 `__routeGeneration`)를 잡아 두고 그리기 직전마다 비교한다. 축 origin 은 호출 출처, timing 은 경로가 바뀐 때다.

axes:
  origin: [action, data_source]
  timing: [before_container, during_render, late_fetch, same_route]

exclusions:
  - { origin: action, timing: late_fetch, reason: "late_fetch 는 데이터 소스 fetch 가 이동 뒤에 끝나는 경우다 — 액션 호출은 호출 시점 세대를 쓴다" }
  - { origin: data_source, timing: [before_container, during_render, same_route], reason: "세대를 정한 뒤의 판정(컨테이너 대기 뒤·그리기 직전)은 출처와 무관하게 같다 — action 행이 덮는다" }

effects:
  - stale_error_page_not_drawn_over_next_route
  - same_route_error_page_drawn

test_files:
  - resources/js/core/__tests__/TemplateApp.staleShowErrorPage.test.ts
