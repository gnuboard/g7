feature: 엔진 밖 오류 화면이 루트 컨테이너를 차지할 때 React 루트 반납 (engine-v1.79.0)

description: |
  레이아웃을 받지 못하거나(401 제외) 초기화·편집기 번들 로드가 실패하면 오류 화면(ErrorDisplay)이
  루트 컨테이너 `#app` 을 innerHTML 로 덮는다. React 루트를 그대로 두면 이어진 토스트 갱신이 지워진
  노드를 기준으로 insertBefore/removeChild 를 시도해 NotFoundError 가 수백 건 쌓이고(7.1.0 실측 O-K2-2 —
  제한 관리자의 「알림함 보기」 한 번에 198건 + React #185), 브라우저 뒤로 가기도 오류 화면에 머문다.

  계약:
    1) 오류 화면을 그리기 직전 React 루트만 내려놓는다(엔진 상태는 유지).
    2) 반납 중 도착한 데이터 업데이트는 버린다 — 큐에 남기면 다음 화면에 떠난 화면의 `_local` 이 흘러든다.
    3) 다음 renderTemplate 이 오류 화면을 걷고 새 루트로 그린다.
    4) 첫 렌더 전 업데이트 큐(오류 화면과 무관한 경로)와 엔진 재초기화 뒤 큐는 종전과 같다.
    5) 401 레이아웃 실패는 로그인 이동이라 반납하지 않는다.

axes:
  screen_takeover: [none, error_display, editor_bundle_error]

effects:
  - error_screen_survives_later_toast_updates_without_dom_errors
  - next_render_after_error_screen_draws_fresh_layout_without_stale_updates
  - pre_render_updates_still_queued_until_first_render
  - route_error_releases_root_before_error_screen
  - unauthorized_layout_failure_does_not_release_root
  # 같은 테스트 파일의 401 리다이렉트 계약(Issue #301) — 반납 판정과 같은 분기를 공유한다
  - unauthorized_layout_redirects_to_login_with_session_expired_reason
  - anonymous_unauthorized_redirect_without_reason
  - custom_login_path_used_for_unauthorized_redirect
  - admin_pathname_selects_admin_login
  - non_unauthorized_layout_failure_does_not_redirect

test_files:
  - resources/js/core/__tests__/template-engine.releaseRoot.test.tsx
  - resources/js/core/__tests__/TemplateApp.unauthorized.test.ts

notes: |
  `TemplateApp.unauthorized.test.ts` 의 401 리다이렉트 테스트 8건(Issue #301)은 이 매니페스트 이전부터 있던 테스트로,
  레이아웃 실패 분기(showRouteError)를 반납 판정과 공유해 같은 매니페스트에 효과로 묶었다. 반납 순서 테스트 2건은
  engine-v1.79.0 에서 더했다. 브라우저 실측은 세션 H 이력 문서의 「O-K2-2」 행(제한 관리자 → 회원 상세 → 「알림함 보기」 403,
  수정 전 콘솔 error 200·NotFoundError 196·React #185 → 수정 후 2·0·0).
