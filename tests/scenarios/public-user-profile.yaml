feature: 공개 회원 프로필 API — 회원 상태별 공개 범위와 아바타 주소 (아바타 주소 결함과 함께 매니페스트 신설)

description: |
  `GET /api/users/{uuid}/profile` 은 비로그인 방문자도 부르는 공개 API 라 회원 상태에 따라 내보내는 칸이 다르다.
  - active: 이름·아바타·소개·가입일·상태와 상태 라벨 전부
  - inactive: 소개만 뺀다(아바타·가입일은 남는다)
  - blocked: 이름과 상태만 남기고 아바타·소개·가입일을 null 로 낸다
  - withdrawn: 200 으로 응답하되 이름을 「탈퇴한 회원」으로 바꾸고 나머지를 비운다(is_withdrawn=true)
  - 없는 uuid: 404
  게시글·댓글 통계는 게시판 모듈 API 몫이라 이 응답에 싣지 않는다.

  아바타 주소는 `User::getAvatarUrl()` 과 같아야 한다. 종전에는 접근자가 없는 `avatar_url` 속성을 읽어 아바타를 올린
  회원도 늘 null 이었다.

  이 매니페스트는 테스트 파일을 고치면서 소유 매니페스트가 없다는 것이 드러나 만들었다. 기존 테스트 7건은
  그때 마킹만 붙였고 동작 단언은 바꾸지 않았다.

axes:
  user_status: [active, inactive, blocked, withdrawn, missing]

effects:
  - active_profile_returns_all_public_fields
  - inactive_profile_hides_bio_only
  - blocked_profile_keeps_name_and_status_only
  - withdrawn_profile_is_anonymized_with_200
  - unknown_user_profile_returns_404
  - profile_carries_status_and_localized_label
  - profile_excludes_board_statistics
  - profile_avatar_matches_user_avatar_url

test_files:
  - tests/Feature/Api/Public/PublicProfileControllerTest.php
