feature: 번들 확장 시험 기반 클래스의 독립 적재 (Bundled Test Base Standalone Load)

description: |
  번들 확장의 시험 기반 클래스(`modules/_bundled/*/tests/ModuleTestCase.php`, `plugins/_bundled/*/tests/PluginTestCase.php`)는 PHPUnit 밖의 개발 환경
  PHP 프로세스가 Composer 오토로더만 둔 채 읽기도 한다. 그 프로세스에는 확장 `Tests` 네임스페이스가 등록되지 않아,
  기반 클래스가 같은 네임스페이스의 트레이트를 `use` 하면 잡을 수 없는 Fatal 이 나고 개발 로그에 쌓였다
  (게시판 `RestoresBoardSettingsStorage`). 기반 클래스는 자기 트레이트를 직접 읽어 그 경로에서도 Fatal 이 나지 않아야 한다.

  같은 개발 환경 프로세스(Laravel VS Code 확장의 시험 탐색 스크립트)는 앱을 먼저 부팅한 뒤 시험 파일을 읽는다. 부팅이 활성
  디렉토리 사본의 심볼을 이미 선언해 둔 상태에서 시험 파일이 파일 범위에서 `_bundled` 원본 src 를 무조건 `require_once` 하면
  경로가 달라 「Cannot declare trait … already in use」 Fatal 이 났다(게시판 `FormatsBoardDate`, 하루 81건). 그런 시험 파일은
  심볼이 아직 없을 때만 원본을 읽어야 한다. 그 Fatal 이 걷히자 같은 탐색이 이커머스 시험 파일에서 「Trait not found」
  (`Concerns\BuildsClaimFlowOrders` 등, 확장 `Tests` 네임스페이스 미등록) Fatal 로 다시 멈췄다. 확장의 시험 파일 전체가 그 경로에서
  Fatal 없이 읽혀야 한다.

  축 base 는 기반 클래스 파일(bundled_test_base_case), 확장 하나의 시험 파일 전체(bundled_test_file_set), 파일 범위에서 src 를 읽는
  시험 파일(bundled_test_with_src_preload)이다.

axes:
  base: [bundled_test_base_case, bundled_test_file_set, bundled_test_with_src_preload]

effects:
  - standalone_include_has_no_fatal
  - test_files_load_without_fatal_outside_phpunit_bootstrap
  - preloaded_src_symbol_is_not_redeclared

test_files:
  - tests/Unit/Extension/BundledTestBaseStandaloneLoadTest.php
