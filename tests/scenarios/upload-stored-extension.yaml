feature: 업로드 저장 확장자 — 올린 이름이 아니라 파일 내용으로 정한다

description: |
  업로드 검증의 통과 기준은 파일 내용인데 저장 경로가 올린 이름의 확장자를 그대로 쓰면, 내용은 이미지이고 이름만
  `.html` 인 파일이 그 확장자로 저장된다. 그 디스크를 직접 내보내는 웹서버·객체 저장소는 확장자로 형식을 정하므로
  같은 출처에서 스크립트가 실행된다.

  세 겹:
    - 저장 확장자는 코어 공용 판정(StoredFileExtension)이 내용에서 정한다. 원본 이름(표시·내려받기)은 그대로다.
    - 레이아웃 첨부 요청은 이름 확장자(extensions:)와 내용(AttachmentFileContent)을 함께 본다. 허용 목록은
      「템플릿 설정(필터 훅) > 코어 설정(환경설정 > 업로드) > 기본값」 순서로 정한다.
    - 공개 자산 디스크에는 「공개 디스크로 내보낼 확장자」 의 파일만 저장한다. 그 밖은 비공개 디스크 + 서버를 거치는 주소.

  설정 저장: 두 확장자 목록은 비울 수 없고(빈 목록이 "제한 없음" 이 아니다) 소문자 배열로 정규화해 저장한다.
  요청 한도 설정(1~1000)의 검증도 같은 저장 요청이 맡는다.

