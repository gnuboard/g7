feature: 레이아웃 코드 편집기 HTML(.g7.html) 기본화 (#476)

description: |
  관리자 레이아웃 코드 편집기의 정본을 JSON 에서 HTML(`.g7.html`)로 바꾼다. DB 는 JSON 만 유지하고
  (결정 C1), 열 때 `?with_markup=1` 로 역변환하며 저장·미리보기는 `format=markup` 으로 HTML 을
  보내 서버가 프로덕션 컴파일한다. JSON 서브탭은 읽기 전용 산출물이고(C2) 타이핑이 멈춘 1초 뒤
  `markup-compile` 이 갱신한다(C7). 컴파일 오류는 422 `errors.compile_error {code,message,line,column}`
  로 돌아와 편집기 마커·오류 패널이 되고 저장을 막는다. lint 경고는 저장을 막지 않는다.

  결정 사슬:
    - 오라클과 편집기가 같은 진입점(LayoutMarkupCompiler)을 탄다 — 게이트가 초록인데 저장이 막히는
      상태가 다시 생기지 않는다.
    - 설치본 행은 조각이 인라인된 평탄 문서라 저장소 파일과 다르다 — 편집기 하단 안내가 이를 밝힌다.
    - 확장 조각 갈래도 같은 규칙(C4)이고, 같은 대상의 조각 둘은 `fragment_key` 로 구분한다(C13).

  ## 축을 이 셋으로 좁힌 근거

  착수 판본은 `action` 에 `restore_version` 을, `input` 에 `no_change` 를 두고 `pairwise` 로 11 조합을
  뽑았다. 그 판본은 **어느 테스트도 그 조합을 주장하지 않는 상태**로 초록이 날 수 없었고, 맞추려면
  마킹을 사실과 다르게 적어야 했다 — 그 방향은 매니페스트를 거짓말로 만든다. 그래서 반대로
  **축을 실제 서버 왕복 셋(유휴 변환·저장·미리보기) × 두 갈래 × 두 입력**으로 좁히고
  `coverage_strategy: full` 로 12 조합 전건을 `LayoutMarkupApiTest` 가 직접 덮는다(마킹 12건).

  빠진 표면은 축이 아니라 **효과**로 관측한다 — 판본 복원은
  `code_editor_version_restore_relies_on_refetch_not_stale_reread`, 편집이 없을 때의 저장·미리보기는
  축으로 세울 만한 분기가 아니라 같은 `valid_edit` 경로다.

coverage_strategy: full

axes:
  branch: [layout, extension]
  input: [valid_edit, compile_error]
  action: [idle_compile, save, preview]

