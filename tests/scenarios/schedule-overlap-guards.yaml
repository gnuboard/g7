feature: 예약 작업 중복 실행 방지 (확장 예약 기본값 · 「지금 실행」 실행 잠금, #161 F3·F4)

description: |
  예약 작업의 「중복 실행 방지」가 두 곳에서 빠져 있었다.

  확장 예약(모듈·플러그인 getSchedules())은 중복 실행 방지·한 서버 실행을 걸지 않아, 길어진 매시 작업이 다음 회차와
  겹치고 다중 서버에서는 같은 작업이 서버 수만큼 돌았다. 이제 기본으로 중복 실행 방지(1440분)·한 서버 실행을 건다.
  항목에 `without_overlapping => false` 를 두면 끄고, 분 단위 정수면 그 시간 뒤 잠금이 만료된다.
  `on_one_server => false` 면 서버마다 돈다. 7.1.5 는 routes/console.php 등록 블록이 이 기본값을 걸었고, 7.2.0 은
  선언을 등록부(schedules) 행으로 동기화하므로 옛 형식 정규화(ExtensionScheduleSyncHelper)가 같은 기본값을 행에 채운다.

  관리자 화면의 「지금 실행」은 스케줄의 without_overlapping 값을 저장만 하고 쓰지 않아, 버튼을 두 번 누르면 같은 작업이
  두 번 돌았다. 이제 방지를 켠 스케줄은 직전 훅·이력 생성보다 먼저 실행 잠금(7.2.0 실행기의 `schedule:run:{id}`)을
  잡는다. 실행 중이면 409, 잠금 저장소 오류면 503 으로 거절하고 거절된 요청은 이력·last_result 를 남기지 않는다.
  잠금은 실행이 실패해도 풀린다.

  큐로 보내는 스케줄은 요청 시점에 202 로 접수하고 잠금은 워커가 실행기를 부를 때 잡는다. 그때의 거절(실행 중, 잠금 저장소
  오류)도 last_result 를 바꾸지 않고 앞선 실행의 잠금을 풀지 않는다. 다만 요청이 이미 끝나 화면에 알릴 길이 없으므로 실행 잡이
  경고 로그와 함께 실행 이력에 「거절됨」 행 한 줄(사유, 누른 관리자)을 남긴다 — 실패 이력이 아니라서 실패 알림은 나가지 않는다.
  이 경로의 시험은 실행 잡 시험 파일을 소유한 schedule-db-registry.yaml 의
  `queued_manual_run_refused_by_lock_store_error_records_rejected_row_only` 와
  `queued_manual_run_refused_while_running_records_rejected_row_only` 가 맡는다(RunScheduledTaskJobTest).

axis_notes:
  case: |
    ext_schedule_* 는 확장 예약 선언이 등록부 행 속성으로 바뀌는 자리(옛 형식 정규화), run_* 는 「지금 실행」 경로다.
    service_query·service_delete 는 ScheduleServiceTest 의 종전 조회·삭제 시험이다(이 매니페스트만 소유한다).

axes:
  case: [ext_schedule_default, ext_schedule_overlap_opt_out, ext_schedule_overlap_minutes, ext_schedule_one_server_opt_out,
         run_rejected_while_running, run_overlap_allowed, run_failed_releases_lock, run_lock_store_error,
         admin_history_list, admin_bulk_status, admin_bulk_delete, admin_unauthenticated,
         service_query, service_delete]

effects:
  # 확장 예약 등록 기본값 (F3)
  - extension_schedule_defaults_to_overlap_guards      # 지정하지 않으면 중복 실행 방지(1440분)·한 서버 실행
  - extension_schedule_overlap_guard_opt_out           # without_overlapping => false 면 중복 실행 방지를 끈다
  - extension_schedule_overlap_expiry_minutes          # without_overlapping 정수는 잠금 만료 분
  - extension_schedule_one_server_opt_out              # on_one_server => false 면 서버마다 실행
  # 「지금 실행」 실행 잠금 (F4)
  - schedule_run_rejected_while_same_schedule_runs     # 실행 중이면 409 — 이력·last_result 를 남기지 않는다
  - schedule_run_overlap_allowed_when_guard_off        # 방지를 끈 스케줄은 잠금 없이 겹쳐 실행된다
  - schedule_run_lock_released_after_failure           # 실행이 실패해도 실행 잠금은 풀린다
  - schedule_run_refused_when_lock_store_errors        # 잠금 저장소 오류면 실행하지 않고 503(번역문만 응답)

  # 기존 동작 (이 매니페스트가 소유한 시험 파일의 종전 시험)
  - schedule_admin_history_includes_trigger_user
  - schedule_bulk_status_change
  - schedule_bulk_delete
  - schedule_bulk_requires_auth
  - schedule_service_returns_paginators
  - schedule_delete_removes_histories_and_fires_hooks

# E2E axis 없음: 판정은 전부 서버측이고 레이아웃 JSON·컴포넌트 변경이 없다.

test_files:
  - tests/Feature/Extension/ExtensionScheduleSyncHelperTest.php
  - tests/Unit/Services/ScheduleServiceTest.php
  - tests/Feature/Api/Admin/ScheduleControllerTest.php
