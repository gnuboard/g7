feature: init_actions 안의 showErrorPage — 첫 렌더를 막지 않고 렌더 뒤에 실행 (engine-v1.80.1, 7.1.1 출시 전 실측)

description: |
  `TemplateApp.executeInitActions` 는 렌더 전에 init 을 끝까지 기다리고, `showErrorPage` 는 렌더가 만들 `#main_content` 를
  최대 60초 기다려 서로를 기다렸다(비회원 클레임 신청 잘못된 유형 주소 → 빈 화면). 렌더 전 init 단계의 showErrorPage 는
  그 경로의 첫 렌더 뒤로 미루고 init 체인은 기다리지 않는다. 경로가 바뀌면 미룬 동작은 버린다.

  축 container 는 호출 시점의 컨테이너 상태(아직 없음·앞 화면 것이 남아 있음), 축 route 는 렌더 전 경로 전환 여부다.

axes:
  slot: [init]
  container: [absent, stale_previous_page]
  route: [same, superseded]

exclusions:
  - { container: stale_previous_page, route: superseded, reason: "폐기 판정은 컨테이너 유무와 무관(경로 ID 비교) — absent 행이 덮는다" }

effects:
  - init_show_error_page_does_not_block_render
  - init_show_error_page_waits_for_this_route_render
  - superseded_deferred_error_page_dropped

test_files:
  - resources/js/core/__tests__/TemplateApp.initShowErrorPage.test.ts
