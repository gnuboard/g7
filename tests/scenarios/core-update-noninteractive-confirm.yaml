feature: 확인 질문에 답할 수 없는 core:update 실행을 성공으로 끝내지 않는다

description: |
  cron, CI, 원격 명령, `--no-interaction` 처럼 진행 확인에 답할 수 없는 `core:update` 실행은 종전에 확인이 기본값
  「아니오」로 처리돼 아무 출력 없이 종료 코드 0 으로 끝났다. 지금은 사유와 `--yes` 안내를 출력하고 종료 코드 1 로
  끝나며 업데이트를 시작하지 않는다. `--yes` 는 진행 확인을 「예」로 처리한다(대화형이면 묻지 않는다). 대화형에서
  운영자가 직접 「아니오」를 답한 취소는 종전처럼 0 이다. 이미 비대화형 기본값이 정해진 다른 질문(`--bundled-sources`
  미지정 시 배치하지 않음, 번들 확장 일괄 업데이트 진행 「예」, 레이아웃 전략 overwrite, 검색 인덱스 재생성 「아니오」)은 바꾸지 않는다.

axes:
  input:
    - no_interaction_option
    - no_terminal
    - interactive
  yes_option:
    - absent
    - present

effects:
  - unanswerable_confirmation_fails_with_reason_and_hint
  - update_does_not_start_without_confirmation
  - yes_option_answers_the_update_confirmation
  - interactive_no_answer_keeps_success_exit_code

test_files:
  - tests/Feature/Console/CoreUpdateNonInteractiveConfirmTest.php
