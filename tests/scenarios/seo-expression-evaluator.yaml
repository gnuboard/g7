feature: SEO 표현식 평가기 — 봇 화면이 브라우저 평가기와 같은 값을 그린다

description: |
  봇(검색·미리보기 크롤러)에게 내려가는 HTML 은 서버의 PHP 평가기(`App\Seo\ExpressionEvaluator`)가
  레이아웃 표현식을 풀어 만든다. 사람이 보는 화면은 같은 식을 브라우저 평가기가 푼다. 두 결과가
  다르면 같은 주소가 봇에게만 다르게 보이므로, 이 매니페스트는 PHP 평가기가 **자바스크립트 의미론을
  그대로 재현하는지** 를 행동 단위로 잠근다 — 경로 해석, 연산자, 인스턴스·정적·전역 함수, 리터럴,
  번역 토큰, 파이프, SEO 덮어쓰기(seo_overrides).

  축은 둘이다.
    - entry_point: 문자열로 그리는 `evaluate()` 와 원본 값을 돌려주는 `evaluateRaw()`.
      `evaluateRaw()` 는 확장 주입 props 처럼 값의 타입이 의미를 갖는 자리에 쓰인다 — 배열·불리언이
      문자열로 뭉개지면 레이아웃이 선언한 판정이 뒤집힌다.
    - expression_form: 입력 문자열이 어떤 모양인가. 전체가 `{{식}}` 하나인 단일 바인딩, 문장 속에
      박힌 바인딩, `$t:` 로 시작하는 번역 키, 바인딩 없는 평문(인라인 `$t:` 토큰 포함).
      `evaluate()` 는 이 모양에 따라 번역 해석·바인딩 치환·인라인 토큰 치환으로 갈라진다.

axes:
  entry_point: [evaluate, evaluate_raw]
  expression_form: [single_binding, embedded_binding, translation_key, plain_text]

exclusions:
  - { entry_point: evaluate_raw, expression_form: [translation_key, plain_text],
      reason: "evaluateRaw() 는 입력이 단일 {{}} 바인딩이 아니면 그대로 evaluate() 에 넘긴다 — 번역 키·평문은 evaluate 칸이 같은 코드 경로를 대표하고, 위임 자체는 evaluate_raw × embedded_binding 칸이 잠근다" }

