  - tests/Unit/Seo/ExpressionEvaluatorTest.php

notes: |
  테스트 250건 전부가 `@effects` 를 갖고, 평가 호출이 모두 한 칸(같은 진입점·같은 입력 모양)에
  속하는 249건은 `@scenario` 도 갖는다. 나머지 1건(`test_real_world_discount_price_condition`)은
  단일 바인딩과 문장 속 바인딩(`{{rate}}%`)을 한 테스트에서 함께 평가하므로 칸을 하나로 적지 않는다.

  브라우저 평가기 쪽의 같은 식 동작과 샌드박스 차단은 `layout-expression-sandbox` 매니페스트가
  맡는다. 이 매니페스트는 서버 평가기 단독의 해석 결과만 본다(설계 결정 2026-09-26).
