feature: notification_localized_variable

description: |
  알림 제목·본문 틀은 받는 사람 언어(`BaseNotification::resolveNotifiableLocale()`)로 고르지만, 변수 값은 문자열 하나만 받아
  (`NotificationContentBehavior::replaceVariables()` 의 `(string) $value`) IdP 이름처럼 언어마다 다른 값이 알림을 일으킨 요청의
  언어로 고정됐다(실측: 한국어 틀 + 「Mock company account」). 변수 값이 `{로케일: 문자열}` 배열이면 받는 사람 언어 →
  사이트 기본 언어 → 영어 → 첫 유효값 순(`LocalizedValue::pick`)으로 고른다. 해석은 `NotificationVariables` 한 곳에서 하고
  메일·사이트 알림(제목·본문·click_url·저장 data)·확장 채널 필터(`{접두사}.notification.to_{채널}`)가 같은 값을 쓴다.
  문자열 변수는 그대로, 언어 배열이 아닌 배열 값은 치환하지 않는다(종전에는 배열→문자열 변환 오류).

axes:
  channel:
    - mail        # toMail 제목·본문
    - database    # toArray 제목·click_url·data
    - extension   # 확장 채널 필터로 넘기는 data
    - helper      # NotificationVariables·replaceVariables 직접 호출

exclusions:
  - { channel: helper, reason: "제외 없음 — 채널 단일 축(수신자 언어·값 모양 조합은 사례로 고정)" }

effects:
  - localized_value_follows_recipient   # 같은 알림이 ko 수신자에겐 한국어 값, en 수신자에겐 영어 값
  - localized_value_falls_back          # 수신자 언어 값이 없거나 비면 사이트 기본 언어 → 영어 → 첫 값
  - plain_values_unchanged              # 문자열·숫자 변수는 그대로, 구조 배열은 치환 안 함·오류 없음

test_files:
  - tests/Unit/Notifications/NotificationLocalizedVariableTest.php
