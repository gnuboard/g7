  - modules/_bundled/sirsoft-page/tests/Feature/User/PublicPageAttachmentAccessTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/User/ReviewImageControllerTest.php
  # 숨김 리뷰 이미지 서명 download URL 의 직렬화 축 (관리자 상세 응답)
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Admin/ProductReviewControllerTest.php
