feature: 검수 서버(stage)의 레이아웃 테이블

description: |
  검수 서버는 레이아웃을 `stage_` 접두 테이블 4개(원 테이블과 같은 스키마·인덱스, ID 10억부터)에 둔다. 레이아웃 모델은 실행
  역할에 맞는 테이블을 쓰고, 다른 역할 테이블에 쓰려 하면 예외다. `stage-layouts:reset-from-live` 는 한 트랜잭션에서 스테이지 테이블을
  비우고 운영 레이아웃·조각을 ID 그대로 복사하며 운영 테이블에는 쓰지 않는다(운영 대비 체크섬 확인). 복사 전·후 스테이지 레이아웃의 병합본 캐시를 버려 검수 서버가 바로 새 판을 내준다. 검수 서버 범위의 레이아웃 해석 캐시(값이 행 ID)와
  역변환 마크업 캐시(키가 ID·잠금 판 — 복사가 둘 다 그대로 옮긴다)도 버려 지운 검수 서버 행 ID·편집본을 캐시 수명 동안 내주지 않는다. 미리보기는 만든 서버의
  역할로 가른다. 템플릿 제거는 다른 역할 테이블의 그 템플릿 행도 명시적으로 지운다. live 는 스테이지 행을 보지 않는다(회귀).
  명령 이름은 방향(운영 → 검수 서버)과 파괴성을 드러내고, `--yes` 여도 복사 전에 방향과 지워질 검수 서버 편집본 수를 출력한다
  (방향이 없던 종전 이름 `stage-layouts:resync` 는 등록하지 않는다).

# 축 의미:
#   case — 경로.
axes:
  case: [stage_write, write_guard, resync, preview, direct_readers, template_uninstall, reset_from_live_notice]

effects:
  - reset_from_live_announces_direction_and_discarded_stage_edits
  - stage_layout_writes_stay_in_stage_tables
  - resync_copies_live_rows_without_writing_live
  - resync_drops_stage_layout_cache
  - resync_drops_stage_markup_and_resolution_cache
  - previews_are_scoped_by_runtime_role
  - other_role_rows_removed_on_template_uninstall

test_files:
  - tests/Feature/RuntimeRole/StageLayoutTablesTest.php
