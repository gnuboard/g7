# audit:allow test-scenario-coverage[cross_product] reason: |
#   축(편집 축 × 계층)의 조합마다 테스트를 두지 않는다 — 각 축의 계약은 "서버가 정하고 화면이
#   읽는다" 하나이고, 계층마다 그 계약의 자기 몫을 한 테스트가 본다. effects 축은 면제하지 않는다.
feature: notification_template_admin_screen

description: |
  운영자가 알림 템플릿을 고치는 화면의 세 축을 **서버가 정하고 화면이 읽는** 형태로 맞춘다.
  세 축 모두 어긋나면 **수신자 0명** 또는 **저장 payload 가 빈다** 로만 드러난다 — 예외도
  로그도 화면에 남지 않는 종류다.

  핵심 동작:
    - **본문 편집기는 채널이 정한다**(`template_editor`: rich / plain / none). 메일 본문은
      HTML 로 나가고 사이트내 알림은 평문으로 그려지므로 한 편집기로 두 채널을 다루면
      관리자 미리보기와 사용자 화면이 서로 다른 문자열을 보여 준다. 종전 플래그
      `hidden_template_editor: true` 는 서버가 `none` 으로 정규화해 하위호환을 지킨다.
    - **역할 수신자는 여러 개**를 고를 수 있다. 서버가 배열을 못 받으면 화면이 배열을 보낸
      순간 422 이거나, 통과하더라도 해석에서 TypeError 가 나고 그것을 `resolve()` 의
      try/catch 가 삼켜 수신자가 0명이 된다. 기존 저장값(문자열)은 읽기에서 그대로 수용한다.
    - **「관련 사용자」의 관계 키는 정의가 선언한 목록 안**이어야 한다. 선언이 비면 화면이
      그 타입 자체를 감춘다 — 지원하지 않는 키를 고르면 역시 조용한 0명이다.
    - 표시 이름은 **저장된 순서 그대로** 나른다. DB 반환 순서로 뽑으면 화면이 인덱스로
      짝지을 때 다른 사람·다른 역할의 이름이 붙는다.

axes:
  editing_axis:
    - template_editor
    - role_recipients
    - related_user_relation
    - toggle_active
    - revert_to_declared
    - operator_definition
  layer:
    - channel_meta
    - request_validation
    - resource_payload
    - modal_layout
    - live_screen
    - user_overrides

exclusions:
  - { editing_axis: template_editor, layer: live_screen, reason: "편집기 종류의 라이브 축은 앞선 실측(T-D3)이 채널 메타 응답으로 이미 쟀다 — 같은 값을 화면에서 한 번 더 세지 않는다" }
  - { editing_axis: related_user_relation, layer: live_screen, reason: "관계 선언의 라이브 축은 T-D5 가 정의 응답으로 쟀다(선언이 있는 8건 · 없는 52건)" }
  - { editing_axis: template_editor, layer: request_validation, reason: "편집기 종류는 저장 값이 아니라 화면 렌더 축이라 FormRequest 가 볼 것이 없다" }
  - { editing_axis: role_recipients, layer: channel_meta, reason: "수신자 규칙은 채널과 무관한 축이다" }
  - { editing_axis: related_user_relation, layer: channel_meta, reason: "같은 사유" }

