# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 관리자 회원 알림함 (in-app 수신함) 조회·삭제

description: |
  이슈 #524 WP-F. 코어에는 알림 축이 둘 있었다 — 관리자 «본인» 수신함(`admin/notifications`)과
  발송 이력(`admin/notification-logs`). 회원이 «받은» 알림, 즉 회원 화면에 지금 무엇이 남아
  있는지를 보는 축은 없었다. 「알림이 안 왔다」는 문의가 들어오면 발송 이력에서 보낸 기록만
  확인할 수 있었고, 그것이 회원 수신함에 남아 있는지·읽었는지는 알 수 없었다.

  여기서 지우면 그 회원의 알림함에서 사라진다 — 발송 이력 삭제(기록만 지움)와 무게가 다르다.
  그래서 채널 탭도 재발송도 두지 않는다.

  `search_type` 네 갈래는 **실제로 동작한다**. 발송 이력 화면의 같은 이름 셀렉트는 Request
  규칙에 없어 무시되는 장식이었다(계획서 부록 B D7) — 그 전례를 반복하지 않도록 규칙으로 닫고,
  네 갈래 모두를 테스트가 잰다. 제목·본문은 표준 `notifications` 테이블의 `data` JSON 안에
  있어 서버가 JSON 추출로 찾는다(원시 SQL 이라 테이블 접두사를 직접 붙인다).

  식별자가 uuid 문자열이라 일괄 삭제 규칙도 uuid 다 — 발송 이력의 integer 규칙을 복사하면
  모든 요청이 422 로 막힌다.

  회원 상세 「알림함」 탭은 총건·안읽음 요약과 그 회원으로 좁힌 목록 링크만 낸다.
  요약은 단건 상세 응답에만 싣는다 — 목록(`toListArray`)에 넣으면 행마다 집계가 돌아 N+1 이 된다.

  엔드포인트:
    - GET    /api/admin/member-notifications              (전 회원 수신함)
    - POST   /api/admin/member-notifications/bulk-delete  (`{id}` 보다 먼저 선언 — uuid 로 잡히지 않게)
    - DELETE /api/admin/member-notifications/{id}

  권한: `core.member-notifications.read` / `.delete`. manager 역할은 read 를 스코프 없이 받는다 —
  이 권한의 대상이 «회원이 받은» 알림이라 self 로 좁히면 매니저 본인의 수신함이 되어 버린다.

# 입력 axis
#  surface    : 조회 지점 (관리자 목록 / 회원 상세 탭)
#  permission : 운영자 권한
#  search_type: 검색 대상 4갈래
#  read       : 읽음 상태 필터
#  member_scope: 회원 한정(user_uuid) 으로 들어왔는가
axes:
  surface: [admin_member_notifications, member_detail_tab]
  permission: [read, delete]
  search_type: [all, recipient, subject, body]
  read: [all, unread, read]
  member_scope: [true, false]

# 의미 없는 조합 컷:
#  - 회원 상세 탭은 요약만 내므로 검색·읽음 필터가 없고, 언제나 그 회원 한정이다
exclusions:
  - { surface: member_detail_tab, search_type: recipient, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, search_type: subject, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, search_type: body, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, read: unread, reason: "요약이 총건·안읽음을 함께 낸다 — 필터 없음" }
  - { surface: member_detail_tab, read: read, reason: "요약이 총건·안읽음을 함께 낸다 — 필터 없음" }
  - { surface: member_detail_tab, member_scope: false, reason: "탭 자체가 그 회원 한정" }

