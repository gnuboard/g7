feature: 관리자 템플릿 자산 — 편집기 CSS 변환 결과의 캐시 키

description: |
  편집기 CSS 변환 결과는 원본 파일의 mtime 을 캐시 키에 넣어 빌드가 바뀌면 즉시 무효화된다.
  mtime 조회가 실패하면 키를 만들지 않고 캐시를 건너뛴다 — 실패를 `m0` 으로 접으면 실패한
  요청들이 하나의 키를 공유해 옛 변환 결과가 1시간 동안 그대로 나간다.

axes:
  mtime_read: [ok, failed]

effects:
  - editor_css_cache_key_is_skipped_when_mtime_is_unreadable
  - editor_css_cache_key_embeds_mtime_when_readable

test_files:
  - tests/Unit/Http/Controllers/Api/Admin/AdminTemplateAssetEditorCssCacheKeyTest.php
