# audit:allow test-scenario-coverage[cross_product] reason: 코드 상태 × 응답 형태 × 경로를 곱하면 코드가 무효인 조합은 응답 형태 축에 도달하지
# 않아 명목상이다. 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 로그인 인계 (외부 인증 → 로그인 화면)

description: |
  외부 인증 확장이 본인 확인을 마친 회원에 대해 `LoginHandoffService::issue()` 로 일회용 코드를 받아 `/login?login_handoff={code}` 로
  보내면, 로그인 화면이 엔진 `loginHandoff` 액션(`AuthManager.loginWithHandoff()`)으로 `POST /api/auth/login/handoff` 를 호출한다(#40 K2·E1·E2).
    - 응답은 비밀번호 로그인과 같은 세 형태(인증 완료 · 2단계 인증 · 비밀번호 변경)이고, 엔진 액션의 반환도 `login` 과 키 단위로 같다.
    - 코드는 32바이트 난수, 120초, 한 번만. 없음·만료·재사용·관리자 경로·사라진 회원은 같은 422.
    - `/api/auth/*` globalHeaders(장바구니 키)가 실려 로그인 완료 훅(장바구니 병합)까지 닿는다.

axes:
  code: [valid, reused, expired, forged, empty, missing]
  response: [authenticated, two_factor_required, password_change_required, invalid_code]
  guard: [user, admin]
  user: [present, missing]
  status: [active, blocked]
  header: [none, x_cart_key, global_headers]
  auth_type: [user, admin]

effects:
  - handoff_issues_token
  - handoff_response_matches_login_shape
  - handoff_two_factor_step
  - handoff_password_change_step
  - handoff_code_single_use
  - handoff_code_expires
  - handoff_forged_rejected
  - admin_guard_handoff_rejected
  - missing_user_handoff_rejected
  - handoff_blocked_status_message
  - cart_key_header_reaches_after_login
  - handoff_establishes_session
  - handoff_result_matches_login_result
  - handoff_two_factor_challenge_without_session
  - handoff_password_change_challenge_without_session
  - handoff_failure_keeps_state
  - handoff_admin_unsupported
  - handoff_forwards_headers
  - handoff_action_shape_equals_login
  - handoff_requires_code
  - handoff_forwards_auth_global_headers
  - handoff_error_reaches_layout

test_files:
  - tests/Feature/Auth/LoginHandoffTest.php
  - resources/js/core/auth/__tests__/AuthManager.handoff.test.ts
  - resources/js/core/template-engine/__tests__/actions/loginHandoff.test.ts
