feature: 번들 레이아웃과 편집기 표본의 정적 이미지 경로 실재 가드

description: |
  쇼핑몰 상품 폼의 복사 원본 칸과 사용자 주문 완료 화면은 썸네일이 없을 때 `/images/placeholder.png` 로
  떨어졌고 편집기 표본 93곳도 같은 경로를 썼지만, 그 파일은 public 에 없어 깨진 그림이 보였다.
  2026-10-04 결정 4 로 실화면은 썸네일이 없으면 아이콘 상자를 보이고, 표본은 서버에 기대지 않는
  인라인 그림을 쓴다. 같은 일이 다시 생기지 않도록 번들 레이아웃·확장 조각·편집기 표본이 가리키는
  사이트 루트 이미지 경로가 public 에 실재하는지 대조하고, 두 실화면이 썸네일이 없을 때 아이콘 상자로
  떨어지는지도 잠근다.

  축 source 는 검사 대상이다. fixture 는 경로 추출 규칙, bundled 는 번들 전체 대조다.

axes:
  source: [fixture, bundled]

effects:
  - root_image_paths_are_extracted
  - bundled_image_paths_exist_in_public
  - missing_thumbnail_falls_back_to_icon
  - editor_sample_images_do_not_point_to_absent_server_files # 편집기 표본 그림 칸이 실재하지 않는 첨부·storage 경로를 가리키지 않는다

test_files:
  - resources/js/core/template-engine/__tests__/BundledStaticImagePathsExist.test.ts
