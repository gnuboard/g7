feature: 옛 화면 호환의 기준 칸 목록 — 7.1.x 화면이 보내던 코어 회원 칸

description: |
  옛 화면(fields_version 없는 회원 폼 요청)은 그 표면의 7.1.x 화면에 없던 코어 칸의 필수 규칙을 늦춘다. 기준 칸 목록
  App\Fields\LegacyScreenFields 는 런타임에 옛 레이아웃을 읽을 수 없어 고정해 두었고, 시험이 7.1.6 태그의 레이아웃과
  저장소의 7.1.3 서빙 고정물에서 칸(입력칸 name 과 폼 상태 참조)을 다시 뽑아 코어 저장 컬럼으로 맞춘 뒤 대조한다.

coverage_strategy: full

axes:
  surface: [signup, self_update, admin_create, admin_update, other]
  source: [fixture, tag, none]

exclusions:
  - { surface: [admin_create, admin_update], source: fixture, reason: "저장소 고정물에 관리자 회원 폼이 없다 — 7.1.6 태그로 잰다" }
  - { surface: [signup, self_update, admin_create, admin_update], source: none, reason: "none 은 목록이 없는 표면(other)의 갈래다" }
  - { surface: other, source: [fixture, tag], reason: "7.1.x 에 없던 표면은 대조할 레이아웃이 없다" }

effects:
  - legacy_core_keys_match_7_1_fixtures
  - legacy_core_keys_match_7_1_6_tag
  - legacy_core_keys_absent_for_other_surfaces

test_files:
  - tests/Unit/Fields/LegacyScreenFieldsTest.php
