feature: 번역 문맥 없이 그린 엔진 렌더러가 부모 렌더러의 렌더 환경에서 번역 문맥을 이어받는다 (engine-v1.94.0, #869)

description: |
  컴포넌트가 정의를 엔진 렌더러로 직접 그리면서(Modal 고정 하단 같은 서드파티 꼴) translationContext 를 넘기지 않으면, 엔진은
  parentComponentContext.renderEnvRef 에 담긴 부모의 번역 문맥을 쓴다. 두 번들 템플릿 Modal 은 번역 문맥을 직접 넘겨 이 줄을 밟지 않으므로
  넘기지 않는 컴포넌트로 잠근다. 축 renderer 는 자식 렌더러를 그리는 꼴이다.

axes:
  renderer: [component_draws_engine_renderer_without_translation_prop]

effects:
  - inner_renderer_uses_parent_translation_context  # 넘겨받지 못한 번역 문맥을 부모 렌더 환경에서 이어받아 그 템플릿의 문구로 번역한다

test_files:
  - resources/js/core/template-engine/__tests__/DynamicRenderer.inheritRenderEnvTranslation.test.tsx

validation:
  note: |
    fail-first: DynamicRenderer.tsx 의 `?? parentComponentContext?.renderEnvRef?.current?.translationContext` 한 줄을 빼면 이 시험이 red(키 그대로),
    되돌리면 green. 두 템플릿 modalFooterUnquotedTranslation 시험은 Modal 이 번역 문맥을 직접 넘겨 그 줄을 빼도 통과한다(ρ 대조 G1).
