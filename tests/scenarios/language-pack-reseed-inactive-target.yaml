feature: 언어팩 활성·비활성 뒤 시더 재실행은 대상 확장이 활성일 때만 돈다 (7.1.3)

description: |
  모듈·플러그인을 비활성화하면 그 확장의 언어팩도 함께 꺼지고, RunSeedersOnLanguagePackLifecycle 이 그 확장의 시더를
  다시 돌리려 한다. 확장이 이미 비활성이라 module:seed·plugin:seed 는 늘 거절한다. 7.1.2 까지는 반환값을 버려 조용했고,
  7.1.3 이 반환값을 생명주기 경고로 올리면서 언어팩이 있는 확장을 끌 때마다 거짓 경고(관리자 노란 결과 창, CLI 종료코드 1)가
  났다. 비활성 대상은 건너뛰고(시더가 돌지 않는 결과는 7.1.2 와 같다), 활성 대상은 종전대로 다시 돌린다.

axes:
  target: [inactive, active]

effects:
  - inactive_target_reseed_skipped_without_warning
  - active_target_reseeded

test_files:
  - tests/Unit/Listeners/LanguagePack/ReseedSkipsInactiveTargetTest.php
