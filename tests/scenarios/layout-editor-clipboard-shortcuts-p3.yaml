  - shortcut_help_modal_close_calls_on_close
  - shortcut_paste_works_without_selection
  - shortcut_mod_c_calls_copy
  - clipboard_empty_reads_null
  - clipboard_session_roundtrip_strips_internal_meta
  - clipboard_read_returns_fresh_copy
