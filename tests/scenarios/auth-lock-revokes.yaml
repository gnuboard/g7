# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "잠긴 계정의 토큰 회수 (#798 K13 · P9)"

description: |
  잠긴 계정의 토큰 회수 (#798 K13 · P9)
  로그인 실패로 계정이 잠기는 순간 그 회원의 토큰이 전부 지워진다 — 잠긴 계정이 이미 받아 둔 토큰으로 계속 쓰지 못한다. 영구 잠금도 같다.
  비밀번호 없는 회원은 지금처럼 잠기지 않는다.

axes:
  lock: [timed, permanent]
  password: [none]

effects:
  - lock_revokes_tokens
  - revoked_token_401
  - relogin_after_unlock
  - permanent_lock_revokes_tokens
  - passwordless_not_locked

test_files:
  - tests/Feature/Auth/LockRevokesTokensTest.php
