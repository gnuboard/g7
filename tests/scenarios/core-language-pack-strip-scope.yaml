feature: 코어 언어팩 끄기가 걷는 번역 범위 — 코어 소유 행만

description: |
  코어 범위 언어팩을 끄면 그 팩이 넣은 범위(코어 소유 — extension_type core 또는 NULL)의 메뉴·권한·역할·알림 정의/템플릿에서만
  그 로케일 키를 걷는다. 같은 로케일의 확장 팩이 넣은 확장 소유 행의 번역은 남긴다 — 종전에는 전 행에서 지워, 코어 팩을 껐다 켜면
  확장 메뉴·권한 이름이 원문(영어)으로 남았다. 켜기는 코어 seed 를 코어 소유 행에만 넣는다(종전과 같음).

axes:
  owner: [core, extension]

effects:
  - core_pack_strip_removes_core_owned_locale
  - core_pack_strip_keeps_extension_owned_locale

test_files:
  - tests/Feature/LanguagePack/CoreLanguagePackStripScopeTest.php
