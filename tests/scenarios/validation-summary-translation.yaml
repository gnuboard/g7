feature: 검증 실패 요약 문구의 나머지 오류 수 꼬리 번역

description: |
  Laravel 은 422 응답의 message 를 첫 오류 + 「(and :count more error(s))」로 만든다. 이 꼬리는 JSON 번역 키로만
  번역되는데 코어의 lang/{locale}.json 은 프론트 번역 진입 파일이라, 번역기가 키를 못 찾았을 때 이 두 문구만
  validation.summary_more_error(단수)·summary_more_errors(복수)로 잇는다. 다른 없는 키는 종전처럼 키 그대로다.
  로케일은 번역기의 현재 로케일을 쓴다(choice() 는 없는 키에 대체 로케일을 넘긴다).

axes:
  locale: [ko, en]
  extra_errors: [none, one, many]

exclusions:
  - { locale: en, extra_errors: none, reason: "꼬리가 없는 경우는 로케일과 무관(ko 로 확인)" }

effects:
  - summary_tail_is_translated
  - english_summary_tail_keeps_plural_rule
  - single_error_has_no_tail
  - unrelated_missing_keys_are_untouched

test_files:
  - tests/Feature/Http/ValidationSummaryTranslationTest.php
