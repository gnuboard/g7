feature: field_types

description: |
  항목 입력 유형 15종(App\Fields\Types)의 검증 규칙, 정규화, 저장 직렬화 왕복, 보기용 문자열, 지원 기능.
  유형은 DB 를 쓰지 않으므로 저장하지 않은 항목 정의로 단위 검증한다.

coverage_strategy: full

axes:
  field_type: [text, textarea, number, boolean, date, datetime, date_range, choice, multi_choice, phone, email, url, address, file, image]

effects:
  - field_type_rules_reject_invalid_input
  - field_type_value_roundtrip
  - field_type_unique_key_normalized
  - field_type_constraint_rules_guard_definition
  - field_type_relative_date_bound_uses_site_timezone
  - field_type_choice_other_stored_as_single_bucket
  - field_type_address_flat_parts_keep_legacy_request_keys
  - field_type_file_upload_limits
  - field_type_registry_lists_core_types
  - field_type_country_widget_displays_name

test_files:
  - tests/Unit/Fields/Types/TextTypeTest.php
  - tests/Unit/Fields/Types/DateTypeTest.php
  - tests/Unit/Fields/Types/ChoiceTypeTest.php
  - tests/Unit/Fields/Types/AddressAndFileTypeTest.php
