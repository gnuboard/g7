feature: 화면 주소 헬퍼(ScreenUrl)·사용자 화면 URL 설정·코어 하드코딩 주소 교체 (#792)

description: |
  서버가 만드는 사람이 여는 화면 주소를 ScreenUrl::path/absolute(키·G7 기본 경로·파라미터·범위)로 만들고
  필터 core.screen_url.filter_path 로 개발자가 주소 구조를 바꾼다. 절대화 베이스는 사용자 범위 = 환경설정
  「사용자 화면 URL」(비면 사이트 URL), 관리자 범위 = 사이트 URL. 사용자 화면 URL 은 http·https 전체 주소만
  저장(끝 슬래시 제거, 빈 값 허용). 코어 알림·비밀번호 재설정·메일 본인인증 링크가 헬퍼를 거치고 본인인증 복귀는
  사용자 화면 URL 출처도 허용한다.

test_files:
  - tests/Unit/Support/ScreenUrlTest.php
  - tests/Feature/Settings/UserScreenUrlSettingTest.php
  - tests/Feature/Screen/CoreScreenUrlConsumersTest.php

