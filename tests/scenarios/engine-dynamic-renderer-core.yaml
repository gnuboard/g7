feature: 동적 렌더러(DynamicRenderer) 핵심 동작 묶음

description: |
  DynamicRenderer 의 오래된 통합 시험 파일을 영역별로 소유한다. $t: 번역(text, props, 중첩 자식, 파라미터 치환),
  lifecycle onMount 와 onUnmount, text 의 {{}} 복합 바인딩, className 식(삼항, 논리 연산, 특수문자),
  blur_until_loaded, onComponentEvent 구독과 해제, stateRef 와 computedRef 로 최신 상태 읽기(stale closure 회귀),
  text 파이프, JSON 문자열과 raw: 바인딩의 $t: 토큰 보존을 본다. 축 area 는 영역 하나씩이다.

axes:
  area: [translation, lifecycle, text_binding, class_name, blur, component_event, stale_closure, pipe, raw_tokens]

effects:
  - renderer_translates_text_and_props
  - renderer_runs_lifecycle_actions
  - renderer_binds_text_expressions
  - renderer_evaluates_class_name_expressions
  - renderer_applies_blur_until_loaded
  - renderer_subscribes_component_events
  - renderer_reads_latest_state_refs
  - renderer_applies_text_pipes
  - renderer_preserves_raw_and_json_tokens

test_files:
  - resources/js/core/template-engine/__tests__/DynamicRenderer.test.tsx
