feature: 레이아웃 갱신 — 기본 「수정 유지」·전략 옵션·미리보기·화면별 결정·덮어쓰기 직전 버전 기록

description: |
  [레이아웃 갱신](CLI `{template|module|plugin}:refresh-layout`, API `POST /api/admin/{templates|modules|plugins}/refresh-layouts`)은
  기본이 keep 이다 — 운영자가 편집기로 고친 화면은 고친 부분을 지키고 손대지 않은 부분만 새 판으로 바꾼다. 파일 판으로
  덮어쓰려면 전략을 overwrite 로 명시한다(CLI `--layout-strategy=overwrite`, API `layout_strategy=overwrite`).

  미리보기(CLI `--dry-run --json`, API `…/refresh-layouts/preview`·`…/{id}/update/preview`)는 실제 갱신과 같은 코드로 화면별
  판정만 계산하고 DB·캐시는 그대로 둔다. 같은 입력이면 미리보기와 실제 갱신의 판정 목록이 같다.

  화면별 결정(CLI `--decisions=<json>`, API `decisions`)은 충돌 화면마다 `take-theirs`(그 화면만 새 판) 또는 `keep-ours`
  (운영자 판 유지)를 고른다. 운영자 판을 새 판으로 덮기 직전에는 그 판을 편집기 버전 이력에 남긴다(요약 `source` =
  `refresh`·`extension_update`·`decision_take_theirs`).

# 축 의미:
#   source   — 화면을 소유한 확장 종류.
#   entry    — 진입점. cli = refresh-layout·update --dry-run 명령, api = 관리자 API(모달이 부른다), service = 서비스 직접 호출(미리보기·결정 계약).
#   strategy — default = 전략 생략(keep), overwrite = 덮어쓰기 명시, invalid = 알 수 없는 값.
axes:
  source: [template, module, plugin]
  entry: [cli, api, service]
  strategy: [default, overwrite, invalid]

effects:
  - refresh_default_keeps_operator_edit
  - refresh_overwrite_replaces_operator_edit
  - refresh_invalid_strategy_fails
  - refresh_response_carries_verdict_counts
  - refresh_all_prints_verdict_counts_and_conflicts
  - dry_run_writes_nothing
  - dry_run_matches_real_run
  - decision_take_theirs_overwrites_one_screen
  - overwrite_records_operator_version
  - decision_keep_ours_keeps_whole_screen
  - update_preview_uses_new_version_files
  - update_preview_reuses_pending_download
  - cli_update_preview_matches_api
  - update_preview_lists_declarative_deletions
  - update_preview_survives_missing_active_files
  - update_preview_not_installed_returns_404

test_files:
