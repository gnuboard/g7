# audit:allow test-scenario-coverage[cross_product] reason: 입력 채널 × 설치 상태 × 실행 계정 × OS × vendor 방식 × 재설치 옵션의 곱은 수백 조합이고 OS·실행 계정 축은 PHPUnit 한 프로세스에서 만들 수 없다. 축별 대표값은 test_files 의 effects 로, OS·root·도커 조합은 manual_verification(CLI 실측 매트릭스)으로 덮는다.
feature: 터미널(CLI) 설치 명령 — 웹 설치 마법사와 같은 공유 함수 + 마법사 결함 6건 정리

description: |
  웹 설치 마법사(/install)의 단계 0~5 를 터미널에서 같은 규칙으로 재현하는 `php g7-install`
  (vendor 가 있으면 `php artisan core:install` 별칭)과, 그 과정에서 함께 고친 웹 마법사 결함의
  시나리오 매트릭스.

  「같은 규칙」은 같은 코드로 보장한다. 웹 엔드포인트에 박혀 있던 검증·계획·확정 본문을 공유 함수로
  옮겨 웹(HTTP 껍데기)과 터미널이 같은 함수를 부른다:
    - config-validation.php  installer_validate_config()        — Step 3 입력 검증
    - requirements.php       installer_collect_requirements()   — Step 2 요구사항 (+ PHP·Composer 검사)
    - db-check.php           installer_test_database()          — DB 연결·권한·기존 테이블
    - extension-selection.php installer_resolve_extension_selection() — Step 4 확장 선택 (JS 사본과 등가 잠금)
    - install-plan.php       installer_begin_installation()     — 설치 계획 확정
    - env-finalize.php       installer_finalize_env()           — .env 확정

  함께 고친 웹 마법사 결함:
    ① 사이트 언어가 세션에 의존 — SSE 워커가 만든 설정은 ko, finalize 의 .env 는 en 으로 어긋남
    ② 리눅스·맥에서 자동 롤백 명령(`cd /d`)이 실행조차 안 됨
    ③ 작업 중 PHP Error 가 state 를 running 으로 고착
    ④ 브라우저에서만 하던 검사(Step 2 차단·사이트/관리자 이름·접두사 형식·vendor 방식·확장 존재·의존·단일 선택)
    ⑤ 하위 폴더 설치에서 .env 확정 요청 404, running 재진입 분기의 미정의 식별자

axes:
  input_channel: [interactive_tty, flags, env_vars, config_file]
  install_state: [fresh, web_owned, cli_interrupted, completed]
  account: [regular_user, root_with_web_user, root_without_web_user]
  os: [windows, linux, docker]
  vendor_mode: [auto, composer, bundled]
  reinstall_options: [none, delete_extensions, delete_settings, delete_uploads, delete_vendor]

