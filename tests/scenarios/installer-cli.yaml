manual_verification:
  - description: "CLI 실측 매트릭스 (계획서 9.3) — Windows·WSL·도커에서 종료 코드·파일·DB 로 증거"
    steps:
      - "C1~C10: Windows 사본에서 비대화형·대화형·재실행·검증 오류·기존 테이블·중단/재개·웹 소유·동시 실행·JSON 출력·artisan 별칭"
      - "L1~L4: WSL 에서 root(--web-user 유무)·일반 계정·롤백 성공"
      - "D1~D2: WSL 도커 compose 첫 기동·재기동·웹 요청 200"
      - "INSTALL.md 방법 5 예시 그대로(계획서 9.4): 비대화형 예시(일반 계정·vendor 자동·Composer 없는 서버) · sudo 대화형 root 예시(--web-user=www-data)"
  - description: "결함 ①·⑥ 수정 전·후 대조 — 영어 UI·SSE 설치 뒤 general.json language · .env APP_LOCALE · config 캐시"
    steps:
      - "웹 마법사를 영어로 SSE 모드 설치"
      - "storage/app/settings/general.json 의 language 와 .env APP_LOCALE 이 같은지"
      - "bootstrap/cache/config.php 의 app.url·app.installer_completed 가 .env 와 같은지"
      - "같은 대조를 호환 모드(폴링) 설치로 — routes-v7.php 생성·로그에 lock lost 없음까지"
