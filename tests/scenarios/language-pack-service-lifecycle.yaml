feature: 언어팩 서비스의 켜기·끄기·제거·목록·설치 차단 판정 기본 동작

description: |
  LanguagePackService 의 기본 수명주기를 고정한다 — 같은 언어 자리(scope·target·locale)당 켜진 팩 1개,
  끌 때 다음 후보 승격, 보호 팩 끄기·제거 거부, 목록·단건 조회, 미설치 번들 가상 행, 설치 차단 사유 판정
  (코어 로케일 미활성·대상 미설치·대상 버전 미달 — 대상이 설치돼 있으나 꺼진 것은 차단이 아니라 안내),
  GitHub 출처 업데이트 확인, 다운그레이드 차단·강제 허용, 실번들 코어 ja 설치·재설치, 업데이트 실패 시 이전 상태 복원.
  설치·활성화 권한 경계와 활성화 경로 단일화는 language-pack-php-whitelist-and-activation-boundary.yaml 이,
  꺼진 확장의 언어팩 설치·확장 켤 때 함께 켜기는 language-pack-install-for-inactive-host.yaml 이 소유한다.

