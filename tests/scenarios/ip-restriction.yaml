notes: |
  화면 축은 레이아웃 렌더링 테스트(배포 JSON 노드를 그대로 렌더)와 Playwright spec(실제 브라우저)이
  나눠 덮는다 — 앞은 배선·분기, 뒤는 실제 렌더러·모달·저장 왕복이다. 규칙 편집 창의 단추가 모달
  고정 하단에 있으면 방금 친 값을 읽지 못한다는 것은 브라우저 쪽에서만 드러났다.

  운영 사이트에서 측정할 때는 반드시 존재하지 않는 고유 접두사(`/api/__ip-probe*`)만 규칙으로
  막는다. 관리자 영역 목록을 건드리면 측정 중인 관리자 세션이 끊기고 복구는 셸뿐이다.
