# audit:allow test-scenario-coverage[cross_product] reason: 축은 조건부다 — admin_list 는 관리자 표면에서만,
# rule 은 제외 경로가 아닌 표면에서만, ip_source 는 목록 대조가 일어날 때만 의미가 있다. 명목상 곱
# (2×6×3×4×4 = 576)은 실체 없는 칸이 대부분이라 조합별 docblock 을 매핑할 대상이 없다. 실제 회귀
# 가드는 effects 이며 전부 test_files 의 테스트에 @effects 로 귀속되어 있다(미검증 0건).

feature: IP 접근 제한 (관리자 영역 · 라우트별 규칙)

description: |
  허용한 IP 에서만 관리자 영역·지정 경로에 접근하게 한다(이슈 #636 트랙 2). 설정은 코어
  환경설정 보안 탭 한 곳이며, 판정은 App\Support\IpAccessMatcher 한 곳에서만 계산한다 —
  차단 미들웨어·설정 저장의 자기 잠금 검사·구제 커맨드가 모두 그 결과만 소비한다.

  판정 순서 (첫 거부에서 멈춘다):
    1. 마스터 토글(ip_restriction_enabled)이 꺼져 있으면 통과.
    2. 관리자 영역이면 admin_allowed_ips 대조 — 빈 목록이면 이 축은 적용하지 않는다.
       관리자 영역 = 관리자 셸(admin*) · 코어 관리자 API(api/admin/*) · 관리자 로그인 API
       (api/auth/admin/*) · 확장 관리자 API(api/{modules|plugins}/{id}/admin/*).
       관리자 영역이 아니면 인바운드 콜백(결제·웹훅·본인인증)인지 먼저 보고 해당하면 통과.
    3. ip_restriction_rules 에서 사용 중인 첫 매칭 규칙 하나만 대조한다.

  배치:
    - 전역 미들웨어를 Laravel 기본 전역 스택 **뒤**(append)에 둔다. 신뢰 프록시는 그 스택의
      TrustProxies 가 적용하므로, 앞(prepend)에 두면 프록시 뒤에서 모든 요청이 프록시 주소
      하나로 보인다. 그룹·라우트 미들웨어보다는 먼저 돌아 withoutMiddleware() 로 빠져나갈 수 없다.
    - 설정 읽기가 깨지면 열어 두고(fail-open) 오류를 기록한다 — 닫아 두면 설정 한 줄이 깨졌을 때
      관리자를 포함한 전원이 잠기고 복구 수단이 셸뿐이다.

  안전장치:
    - 저장하는 관리자 자신을 잠그는 조합(현재 IP 가 목록 밖, 또는 설정 화면을 막는 규칙)은
      저장 전에 422 로 막는다.
    - 그래도 잠겼으면 `php artisan security:ip-restriction --disable` 이 토글만 끈다.
    - 관리자 영역은 제외 경로 훅으로도 빠져나갈 수 없다.

axes:
  master_toggle: [on, off]
  surface: [admin_shell, core_admin_api, admin_login_api, extension_admin_api, public_path, inbound_callback]
  admin_list: [empty, contains_client, excludes_client]
  rule: [none, allows_client, blocks_client, disabled]
  ip_source: [direct, forwarded_untrusted, forwarded_trusted, ipv4_mapped]

exclusions:
  - { master_toggle: off, admin_list: excludes_client, reason: "토글이 꺼지면 목록은 저장만 되고 판정에 쓰이지 않는다 — 결과가 목록과 무관하다" }
  - { master_toggle: off, rule: blocks_client, reason: "동일 사유" }
  - { surface: public_path, admin_list: excludes_client, reason: "관리자 허용 목록은 관리자 영역에만 쓰인다 — 공개 경로 결과를 바꾸지 않는다" }
  - { surface: inbound_callback, admin_list: excludes_client, reason: "동일 사유" }
  - { surface: inbound_callback, rule: blocks_client, reason: "인바운드 콜백은 규칙 판정 전에 빠진다 — 결과가 규칙과 무관하다 (effects 가 그 사실을 잠근다)" }

