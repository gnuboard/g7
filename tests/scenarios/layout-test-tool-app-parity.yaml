feature: 레이아웃 시험 도구(createLayoutTest)의 렌더 컨텍스트를 실제 앱과 맞춘다 (7.1.3)

description: |
  createLayoutTest 가 만드는 렌더 컨텍스트가 실제 앱(TemplateApp 의 첫 렌더 컨텍스트·template-engine 전역 변수)과 달라 시험은
  통과하는데 실제 화면은 깨질 수 있었다. 차이 10건(T1~T10)을 실제 앱과 같은 규칙으로 맞췄다 — computed 는 공용 평가기,
  데이터소스 init 은 TemplateApp.processInitOptions, init_actions·토스트·모달은 실제 ActionDispatcher 내장 처리, 모달은
  ParentContextProvider + `_global.modalStack`. 축 item 은 차이 한 건과 시험 하나의 짝이다.

axes:
  item: [t1_computed, t2_globals, t3_route, t4_isolated, t5_datasource_errors, t6_response_shape, t7_datasource_init, t8_defines_warnings, t9_init_actions, t10_modal_toast]

effects:
  - tool_context_matches_app

test_files:
  - resources/js/core/template-engine/__tests__/utils/layoutTestUtils.appParity.test.tsx
