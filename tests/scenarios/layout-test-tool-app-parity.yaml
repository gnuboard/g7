feature: 레이아웃 시험 도구(createLayoutTest)의 렌더 컨텍스트를 실제 앱과 맞춘다 (7.1.3)

description: |
  createLayoutTest 가 만드는 렌더 컨텍스트가 실제 앱(TemplateApp 의 첫 렌더 컨텍스트·template-engine 전역 변수)과 달라 시험은
  통과하는데 실제 화면은 깨질 수 있었다. 차이 10건(T1~T10)을 실제 앱과 같은 규칙으로 맞췄다 — computed 는 공용 평가기,
  데이터소스 init 은 TemplateApp.processInitOptions, init_actions·토스트·모달은 실제 ActionDispatcher 내장 처리, 모달은
  ParentContextProvider + `_global.modalStack`. 축 item 은 차이 한 건과 시험 하나의 짝이다.
  T11(#869): 레이아웃 `state` 를 렌더 직전에 `_local` 위에 덮어 시험이 준 initialState 가 효과가 없었다. 실제 앱처럼
  initLocal 이 없을 때만 쓰는 별칭으로 처리하고(병합 경로에 올리자 드러난 null 대상 병합 오류는 T12), `global_state` 는 앱이 읽지 않는 시험 고정물 전용 시드 키로 남겼다(모듈 시험 고정물이 쓴다).

axes:
  item: [t1_computed, t2_globals, t3_route, t4_isolated, t5_datasource_errors, t6_response_shape, t7_datasource_init, t8_defines_warnings, t9_init_actions, t10_modal_toast, t11_state_alias, t12_null_seed_merge]

effects:
  - tool_context_matches_app

