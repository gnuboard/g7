feature: 태그 입력(TagInput)의 Enter 키 — 옵션 선택·새 값 만들기·중복·폼 제출

description: |
  태그 입력의 Enter 가드는 내부 입력값(inputValue)을 보고 빈 입력·중복 값에서 Enter 를 막았다. 그런데 고르기만
  하는 칸(creatable=false)은 입력값을 제어하지 않아 inputValue 가 늘 빈 값이었고, 그 결과 검색어를 치거나 화살표로
  옮긴 뒤의 Enter 선택이 모두 막혔다(회원 「역할 추가」 창·권한 그룹 필터·메뉴 일괄 역할 칸, 브라우저 실측).

  고친 규칙(키보드 Enter 하나의 갈래):
    - 새로 만드는 칸에서 친 값이 이미 태그면 아무것도 하지 않는다 — react-select 는 선택된 옵션을 다시 고르면
      해제하므로, 막지 않으면 같은 IP 를 한 번 더 입력하는 순간 기존 태그가 사라진다(관리자 허용 IP 칸 실측)
    - 메뉴가 열려 있으면 react-select 가 포커스된 옵션을 고르거나 새 값을 만든다 — 가로채지 않는다
    - 메뉴가 닫힌 빈 칸의 Enter 는 폼 제출로 번지지 않게 막는다(종전 그대로)

  Tab(7.1.0): 메뉴가 열린 채 Tab 으로 칸을 떠나면 react-select 기본값(tabSelectsValue)이
  포커스된 옵션을 골라 회원 역할 칸에 「관리자」 가 붙을 뻔했다. Tab 은 고르지 않는다(`tabSelectsValue: false`).
  만들기 칸에서 친 글자의 Tab 태그화는 종전대로 둔다.

  새 태그를 만든 뒤 메뉴(환경설정 보안 탭 IP 규칙 「편집」 창 실측): 허용 IP 칸에 값을 치고 Enter 로 태그를 만든 뒤
  바로 아래 「메모」 칸을 마우스로 누를 수 없었다 — 메뉴 포털(z-9999)이 열린 채 클릭을 가로챘다. 여러 개 고르는
  칸은 고른 뒤 메뉴를 열어 두는데(closeMenuOnSelect=false) 새 값 만들기도 같은 「고르기」 경로라 메뉴가 남았고,
  입력이 비면 붙은 태그 전부를 옵션으로 펼쳐 값이 있던 칸일수록 아래 칸을 덮었다.
    - 만들기 칸에서 키보드(Enter·Tab·쉼표)나 「추가」 항목으로 새 태그를 만들면 메뉴를 닫는다(포커스는 칸에 남고
      다음 값을 치면 다시 열린다)
    - 고르기 전용 칸은 고른 뒤에도 메뉴를 열어 둔다(여러 개를 잇달아 고르는 종전 동작)
    - 여러 항목을 붙여넣어 태그를 만들어도 메뉴를 닫는다(먼저 쳐 둔 글자가 남아 있으면 그 글자의 「추가」 항목을 위해
      열어 둔다)

  만들기 칸에 포커스만 줄 때(같은 편집 창): 칸에 포커스만 줘도 메뉴가 붙은 태그 전부를 체크 표시 행으로 펼쳐 아래
  「메모」 칸을 덮었고, 그 상태에서 메모 칸을 누르면 클릭이 행에 닿아 react-select 가 그 태그를 해제했다(선택된
  옵션을 다시 고르면 해제). 빈 입력 Enter 도 메뉴 첫 행(이미 붙은 태그)을 다시 골라 해제했다.
    - 여러 개를 새로 만드는 칸은 직접 친 태그(옵션 목록에 없는 값)를 메뉴 행으로 되풀이하지 않는다
    - 그 결과 제안 옵션도 레이아웃 안내 문구도 없는 칸은 빈 입력일 때 메뉴를 열지 않는다(aria-expanded=false,
      빈 입력 Enter 는 닫힌 칸의 Enter 가드로 간다). 글자를 치면 「… 추가」 항목과 함께 연다
    - 레이아웃이 준 제안 옵션 행은 체크 표시와 함께 남는다. 안내 문구도 종전대로 보인다
  jsdom 은 TouchEvent 를 만들 수 있어 react-select 가 「터치 기기」로 보고 고른 뒤 입력칸을 흐려(blurInputOnSelect)
  메뉴를 닫으므로 결함이 가려진다 — 이 갈래 시험은 데스크톱처럼 TouchEvent 생성을 거부하고 잰다.

  만들기 칸에서 이미 붙은 행을 다시 고를 때(7.1.1): 체크된 제안 행을 마우스·화살표+Enter·친 글자가 이름에 맞은 행 Enter 로
  다시 고르면 react-select 가 그 태그를 해제했다(deselect-option) — 사용자가 고른 것이 사라진다.
    - 만들기 칸은 다시 골라도 태그를 그대로 둔다(이미 있으면 그대로). 화면 읽기 안내문도 「해제」 가 아니라 「선택됨」 이다
    - 이미 붙은 값을 섞어 붙여넣어도 붙은 태그는 그대로고 새 값만 더해진다
    - 고르기 전용 칸은 체크 목록이라 다시 고르면 해제한다(종전)

  키보드로 태그 지우기: 만들기 칸은 직접 친 태그를 메뉴 행으로 보여 주지 않으므로 메뉴 행 Enter 로 지우는 길이 없다.
  태그의 × 단추는 포인터용(Tab 순서 밖 — 태그가 많은 칸에서 Tab 이 태그 수만큼 멈추지 않게)이다. 키보드 길은 빈 입력에서
  ←·→ 로 태그에 포커스한 뒤 Backspace·Delete 다(react-select 기본 키, 화면 읽기 안내문도 이 길을 알린다).
    - ←·→ 로 고른 태그는 포커스 링으로 보인다 — unstyled 라 표시가 없어 무엇이 지워질지 볼 수 없었다
    - 태그에 포커스하지 않은 빈 입력의 Backspace 는 태그를 지우지 않는다(backspaceRemovesValue=false, 종전)
    - Tab 은 × 마다 멈추지 않고 다음 칸으로 간다

axes:
  mode: [select_only, creatable]
  input: [typed_match, arrow_focus, duplicate, empty_closed, tab_with_open_menu, typed_then_tab, prefilled_typed_enter, typed_delimiter, pasted_multiple, prefilled_focus_only, tag_arrow_remove, blank_backspace, tab_past_tags, reselect_attached]

exclusions:
  - { mode: select_only, input: duplicate, reason: "고르기 전용 칸은 입력값으로 태그를 만들지 않는다 — 중복 입력이라는 갈래가 없다" }
  - { mode: creatable, input: arrow_focus, reason: "새로 만드는 칸의 화살표 선택은 고르기 전용과 같은 react-select 경로 — select_only 행이 잰다" }
  - { mode: creatable, input: empty_closed, reason: "닫힌 빈 칸의 Enter 가드는 모드와 무관한 같은 분기 — select_only 행이 잰다" }
  - { mode: creatable, input: tab_with_open_menu, reason: "tabSelectsValue 는 모드와 무관한 같은 react-select 설정 — select_only 행이 잰다" }
  - { mode: select_only, input: typed_then_tab, reason: "고르기 전용 칸은 친 글자로 태그를 만들지 않는다" }
  - { mode: select_only, input: prefilled_typed_enter, reason: "고르기 전용 칸은 친 값으로 새 태그를 만들지 않는다 — 값이 있는 칸의 Enter 고르기는 typed_match 와 같은 경로" }
  - { mode: select_only, input: typed_delimiter, reason: "구분자 태그화는 만들기 칸에서만 일어난다" }
  - { mode: select_only, input: pasted_multiple, reason: "붙여넣기 분리는 만들기 칸(splitOnPaste·creatable·isMulti)에서만 일어난다" }
  - { mode: select_only, input: prefilled_focus_only, reason: "고르기 전용 칸은 포커스하면 고를 목록을 여는 것이 본래 동작이다 — 붙은 값 행도 체크 표시로 두는 종전 동작을 바꾸지 않는다" }
  - { mode: select_only, input: blank_backspace, reason: "backspaceRemovesValue=false 는 두 모드가 함께 쓰는 멀티 설정이다 — creatable 행이 잰다" }
  - { mode: select_only, input: tab_past_tags, reason: "× 단추는 두 모드가 함께 쓰는 같은 MultiValueRemove 다 — creatable 행이 잰다" }

effects:
  - tag_input_enter_selects_focused_option
  - tag_input_enter_creates_new_value
  - tag_input_enter_ignores_duplicate_value
  - tag_input_enter_on_closed_empty_does_not_submit
  - tag_input_tab_never_selects_option
  - tag_input_create_closes_menu
  - tag_input_select_keeps_menu_open
  - tag_input_create_menu_omits_attached_tags
  - tag_input_create_blank_menu_stays_closed
  - tag_input_create_suggestion_rows_shown
  - tag_input_create_reselect_keeps_tag
  - tag_input_select_reselect_toggles
  - tag_input_ip_rule_field_contract
  - tag_input_keyboard_removes_focused_tag
  - tag_input_focused_tag_visible
  - tag_input_blank_backspace_keeps_tags
  - tag_input_tab_skips_remove_buttons

