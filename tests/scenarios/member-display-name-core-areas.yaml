feature: member_display_name_core_areas

description: |
  코어 화면의 회원 이름 출력 지점에 표시 이름을 적용한다. 관리자 화면(활동 로그, 알림 발송 이력, 알림 템플릿의
  지정 수신자 등)의 이름은 관리자 영역 표시 이름이고, 실명은 관리자 요청이면서 회원 조회 권한이 있을 때만
  `real_name` 으로 더해진다(표시 이름과 같거나 비어 있으면 싣지 않는다). 공개 프로필은 사이트 기본 영역 표시 이름만 낸다.
  목록은 추가 항목 값을 한 번에 읽고, 설정을 바꾸지 않은 사이트에서는 값이 종전과 같다.

coverage_strategy: full

axes:
  case:
    - default_settings_unchanged
    - admin_list_display_name
    - real_name_gate
    - real_name_omitted
    - public_profile
    - list_query_count
    - relation_resources
    - other_admin_surfaces
    - admin_search

effects:
  - default_admin_names_equal_real_name
  - default_admin_lists_carry_no_real_name
  - default_public_profile_shows_name
  - admin_list_name_follows_admin_area
  - admin_list_carries_real_name_for_user_readers
  - actor_name_follows_admin_area
  - real_name_hidden_without_user_read_permission
  - real_name_limited_to_self_for_scoped_reader
  - real_name_hidden_outside_admin_requests
  - real_name_omitted_when_empty
  - real_name_omitted_when_same_as_display_name
  - real_name_omitted_for_withdrawn_member
  - public_profile_shows_site_display_name
  - public_profile_never_exposes_real_name
  - public_profile_nickname_never_falls_back_to_name
  - admin_list_reads_field_values_once
  - admin_list_shows_field_kind_value
  - relation_resources_show_admin_area_name
  - relation_resources_carry_suffixed_real_name_keys
  - relation_resources_hide_real_name_on_public_requests
  - notification_log_recipient_follows_admin_area
  - notification_template_specific_users_follow_admin_area
  - notification_log_snapshot_is_kept
  - admin_member_search_matches_name_and_nickname

test_files:
  - tests/Feature/DisplayName/CoreDisplayNameApplicationTest.php
