feature: 레이아웃 시험 도구(createLayoutTest)의 검증 기능

description: |
  createLayoutTest 가 시험 중에 레이아웃 실수를 경고로 잡는지 본다. mockApi 로 등록한 응답이 data_sources 받기로
  실리고, slot 속성만 있고 SlotContainer 가 없으면 경고하며, DataGrid 의 data 에 배열이 아닌 값이 바인딩되면 경고한다.
  assertNoValidationErrors 는 검증 오류가 있을 때만 던진다. 축 area 는 검증 기능 하나씩이다.

axes:
  area: [datasource_mock, slot_validation, binding_type_validation, assert_no_errors]

effects:
  - layout_test_mock_api_feeds_data_sources
  - layout_test_warns_missing_slot_container
  - layout_test_warns_binding_type_mismatch
  - layout_test_assert_throws_on_validation_error

test_files:
  - resources/js/core/template-engine/__tests__/utils/layoutTestUtils.validation.test.ts
