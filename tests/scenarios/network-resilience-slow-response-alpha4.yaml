# 레이아웃 요청 시도 상한 30초 — 느린 정상 응답을 끊지 않는다 (설계 확정 2026-11-09)
# 7차 관찰 4(레이아웃 요청이 15초를 넘으면 끊고 다시 물어 실패로 끝남)의 회귀 시험을 소유한다.
feature: network_resilience_slow_response_alpha4

description: |
  fetchWithRetry 는 시도마다 상한 안에 응답 머리가 오지 않으면 끊고 백오프 뒤 다시 묻는다(재시도 2, 총 3시도). 레이아웃 요청
  (LayoutLoader.fetchLayout)이 공용 기본 15초를 써서, 첫 요청이 16~18초 걸리는 느린 서버의 정상 응답이 세 번 모두 끊겨
  「페이지 로딩 실패」 로 끝났다. 설계 결정으로 레이아웃 요청만 ApiClient 와 같은 30초(LAYOUT_REQUEST_TIMEOUT_MS)로 맞추고,
  라우트, 컴포넌트, 언어 파일 같은 다른 요청은 15초 그대로 둔다. 30초를 넘는 무응답은 종전처럼 세 번 물은 뒤 LayoutLoaderError 로
  끝나 경로 오류 화면으로 간다. 축 case 는 요청 종류와 서버 응답 시간의 조합이다(교차곱이 아니라 잰 조합만).

axes:
  case: [layout_limit_constant, layout_16s, layout_29_9s, layout_no_response, other_16s, other_14s]

effects:
  - slow_layout_response_received_in_one_attempt # 30초 안의 레이아웃 응답은 끊지 않고 한 번에 받는다
  - layout_no_response_retried_then_fails        # 무응답은 30초마다 끊고 세 번 물은 뒤 LayoutLoaderError
  - other_requests_keep_default_limit            # 레이아웃이 아닌 요청은 종전 15초 상한 그대로

test_files:
  - resources/js/core/template-engine/__tests__/networkResilience.slowResponse.test.ts

validation:
  note: |
    fail-first: 수정 전(LayoutLoader 가 기본 15초) layout_limit_constant, layout_16s, layout_29_9s, layout_no_response 4 실패
    (상수 없음, 16초 응답에 2번째 시도) → 수정 뒤 6/6. other_* 2건은 다른 요청 동작이 그대로임을 잠근다(수정 전후 통과).
