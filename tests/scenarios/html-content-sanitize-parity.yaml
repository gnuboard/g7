feature: 사용자 작성 콘텐츠 렌더링 — HtmlContent 정화

description: |
  게시글·상품 설명 등 **사용자가 쓴 본문**을 화면에 그릴 때의 정화 계약을 고정한다.
  평문 모드는 HTML 을 이스케이프하고, HTML 모드는 안전한 마크업만 남긴다.

  이 계약은 봇(SEO) 화면의 `App\Seo\HtmlSanitizer` 와 **같은 강도**여야 한다. 한쪽만
  고치면 봇 경로(`?_escaped_fragment_=`)의 정화가 느슨해져 저장형 XSS 가 그 경로로만
  실행된다 — 사람이 보는 화면은 정상이라 드러나지 않는다.

  두 번들 템플릿이 각자 사본을 갖고 있어 **양쪽을 같은 축으로** 잰다. 사본이 갈리면
  그 템플릿을 쓰는 사이트에서만 차단이 풀린다.

axes:
  content_kind: [script_injection, event_handler, javascript_url, embedded_frame, safe_markup]
  mode: [html, text]

exclusions:
  - { content_kind: event_handler, mode: text, reason: "평문 모드는 마크업 종류와 무관하게 전부 이스케이프 — script_injection 조합이 대표" }
  - { content_kind: javascript_url, mode: text, reason: "동일" }
  - { content_kind: embedded_frame, mode: text, reason: "동일" }
  - { content_kind: safe_markup, mode: text, reason: "동일 (평문 모드는 안전 마크업도 보존하지 않는다)" }

effects:
  - script_tag_blocked
  - event_handler_attr_blocked
  - javascript_url_blocked
  - embedded_frame_blocked
  - safe_markup_preserved
  - plain_text_mode_escapes_html

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/HtmlContent.test.tsx
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/HtmlContent.test.tsx
