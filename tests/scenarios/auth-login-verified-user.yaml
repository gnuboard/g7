  - dormancy_restored
  - two_factor_challenge_without_token
  - login_method_survives_two_factor
  - login_method_survives_two_factor_resend
  - two_factor_uses_login_purpose_provider
  - skip_two_factor_issues_token
  - placeholder_email_skips_mail_two_factor
  - missing_email_skips_mail_two_factor
  - login_method_required
  - password_change_gate_applies
  - login_method_survives_password_change
  - passwordless_skips_password_change_gate
  - admin_guard_rejects_before_session
  - admin_login_rejects_before_dormancy_restore
  - admin_password_change_completion_rejects_before_session
  - no_after_login_for_rejected_admin_login
  - no_token_for_rejected_admin_login
  - no_two_factor_mail_for_non_admin
  - admin_two_factor_complete_rejects_before_session
