feature: 확장 업데이트가 새 판 진입 클래스를 다시 읽지 못하면 판을 적기 전에 실패한다 (7.1.3)

description: |
  모듈·플러그인 업데이트는 파일을 새 판으로 바꾼 뒤 진입 파일(module.php·plugin.php)의 클래스를 다시 읽는다.
  새 판의 네임스페이스·클래스 이름이 틀려 기대 클래스가 없으면 예전에는 경고 없이 부팅 때 읽은 옛 판 인스턴스로
  나머지 단계를 돌고 DB 판을 새 판으로 적어 「성공」했다 — 데이터는 옛 형태인데 판만 올라갔다(계획 WP2·D10).
  이제 판을 적기 전에 실패해 기존 업데이트 실패 경로(파일 복원·판 유지·상태 복원)를 타고, 실패 사유에 진입 파일명과
  기대 클래스를 담는다. 설치 경로의 재로드 실패는 warning 로그로 남긴다.

axes:
  source: [module, plugin]
  path: [update_entry_class_missing]

effects:
  - update_fails_when_new_entry_class_missing_and_keeps_version

test_files:
  - tests/Feature/Extension/UpdateReloadClassMissingFailsTest.php
