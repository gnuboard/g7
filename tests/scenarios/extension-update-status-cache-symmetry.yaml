feature: 확장 업데이트의 상태 복원 ↔ 상태 캐시 무효화 대칭

description: |
  업데이트는 시작 때 상태를 `updating` 으로 바꾸고, 그 창에서 읽힌 활성 확장 목록이 캐시에 남을 수 있다. 실패 경로가 상태만
  되돌리고 캐시를 비우지 않으면 확장은 정상인데 그 화면이 캐시 만료까지 빠진다. 모듈·플러그인·템플릿 업데이트 메서드에서
  상태 복원 지점마다 캐시 무효화가 따라붙는지 구조로 잠근다(템플릿 실패 경로 누락은 7.2.0 에서 고침, #888).

# 축 의미:
#   manager — 검사 대상 매니저.
axes:
  manager: [module, plugin, template]

effects:
  - status_restore_followed_by_cache_invalidation

test_files:
  - tests/Unit/Extension/ExtensionUpdateStatusCacheSymmetryTest.php