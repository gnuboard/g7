# 레이아웃 편집기 디바이스 분기(responsive) — 디바이스 목록, 분리 판정, 점프, 분기 드래그 (실측 C1~C3 정비)
#
# 두 spec 은 그동안 소유 매니페스트 없이 있었다. λ 실측(2026-11-08)에서 spec 자료 낡음(search_row 제거,
# 293533e742)과 부드러운 스크롤 경합을 고치며 매니페스트를 붙인다. 축은 서로 곱해지지 않는 화면 동작이라
# sub_flows 로만 나눈다.

feature: 레이아웃 편집기 디바이스 분기(responsive) 편집
phase: 3
issue: 869

axes:
  responsive_flow: [device_list, branch_separation, branch_drag]

sub_flows:
  - id: device_list
    description: |
      디바이스 토글과 스타일 탭 세부탭에 portable(모바일+태블릿) 이 보인다.
    effects:
      - device_toggle_has_portable
      - style_tab_has_portable
  - id: branch_separation
    description: |
      분리 판정(children 유무), 다른 디바이스 구성으로 점프, 포괄 분기에서 점프와 분리 공존, 사용자 화면 반영.
      대상 노드: user_list_content(props-only portable 분기), bulk_actions_area(portable children 분기).
    effects:
      - separation_mode_by_children
      - device_jump_button_for_other_device_children
      - covering_branch_jump_and_separate_stacked
      - user_screen_portable_override_and_children_swap
  - id: branch_drag
    description: |
      모바일 보기에서 분기 안 자식이 드래그 핸들을 갖고, 끌면 같은 분기 안에 드롭 칸이 생긴다.
    effects:
      - branch_node_has_drag_handle
      - branch_drop_slots_render
      - editor_locked_branch_children_have_no_drag_handle

effects:
  - device_toggle_has_portable
  - style_tab_has_portable
  - separation_mode_by_children
  - device_jump_button_for_other_device_children
  - covering_branch_jump_and_separate_stacked
  - user_screen_portable_override_and_children_swap
  - branch_node_has_drag_handle
  - branch_drop_slots_render
  - editor_locked_branch_children_have_no_drag_handle   # 공통 레이아웃 등 잠긴 노드의 분기 자식에는 드래그 핸들이 없다(출처 메타 잇기)

test_files:
  - tests/Playwright/specs/layout-editor/responsive-device-list-and-separation.spec.ts
  - tests/Playwright/specs/layout-editor/responsive-branch-drag.spec.ts
  - resources/js/core/template-engine/layout-editor/__tests__/dnd/dropSlots.responsiveBranch.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/utils/layoutTreeUtils.inheritBranchSource.test.ts

notes:
  - 단위 회귀는 layoutTreeUtils(분기 세그먼트)·dropSlots(분기 컨테이너) 시험이 맡고, 이 매니페스트는 브라우저 흐름만 묶는다.
