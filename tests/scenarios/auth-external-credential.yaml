# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "외부 자격 증명 검증자 `core.auth.registered_credential_verifiers` (#798 K4 · W27 · W32)"

description: |
  외부 자격 증명 검증자 `core.auth.registered_credential_verifiers` (#798 K4 · W27 · W32)
  로그인 칸의 식별자를 담당하는 검증자가 있으면 비밀번호를 G7 이 아니라 그 검증자가 확인한다. 인증 성공은 `loginVerifiedUser()` 로 합류해
  비밀번호 로그인과 같은 세 응답, 거절은 일반 실패와 같은 401(실패 횟수는 검증자가 고른다 — 비밀번호 없는 회원도), 추가 단계는 409 + 이동 경로.
  잠긴 회원은 디렉터리에 묻지 않고, 사용 불가 검증자는 건너뛰며, 아이디를 받는 검증자가 있으면 로그인 칸의 이메일 형식 검사를 푼다.

axes:
  verifier: [no_match]
  result: [authenticated, rejected, step_required]
  two_factor: [off, on]
  counts: [true, false]
  password: [none]
  user: [locked]
  guard: [admin]
  rule: [username_accepted, unavailable_skipped]

effects:
  - no_match_falls_back_to_password
  - authenticated_joins_login_verified_user
  - rejected_counts_external_failure
  - rejected_unavailable_not_counted
  - rejected_same_message
  - step_required_returns_409
  - locked_user_not_verified
  - admin_guard_uses_verifier
  - login_rule_relaxed_for_usernames
  - unavailable_verifier_skipped

test_files:
  - tests/Feature/Auth/ExternalCredentialVerifierTest.php
