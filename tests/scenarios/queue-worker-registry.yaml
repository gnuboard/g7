# audit:allow test-scenario-coverage[cross_product] reason: 이슈 #139 큐 워커 등록·상태. 드라이버 × 등록 형태 × 하트비트 × 화면 상태의 곱 중 판정 함수별 대표값만 매핑한다 — 저장 검증(V1~V9)·배치 판정·하트비트·상태 보고·화면 분기가 서로 독립 함수다.
# audit:allow scenario-scale-axis-required reason: 연결·큐 수십 개 이하의 설정·상태 판정 — 처리 규모 경로 무변경

feature: queue_worker_registry

description: |
  관리자 환경설정 > 드라이버 탭 「큐 워커」 구역(#139). 이 서버에서 워커를 실제로 돌리는 연결(drivers.queue_connections)과
  연결별 큐(drivers.queue_names)를 등록하고, 등록한 큐마다 대기 건수·마지막 워커 신호를 본다.

  핵심 동작:
    - 저장 검증 V1~V9(등록 가능 연결만·중복 금지·기본 연결 필수·알 수 없는 연결 키 금지·빈 큐 목록 금지·큐 이름 형식·길이·개수).
    - 저장 때 정규화 — 기본 연결은 늘 포함, 빈 큐 목록은 기본값(-long 연결은 long, 그 밖 default).
    - 워커는 Looping·JobProcessing 이벤트마다 연결·큐별 하트비트를 캐시에 남긴다(30초 스로틀, 실패해도 예외 없음).
    - GET /api/admin/settings/queue-status — 행별 대기 건수(잴 수 없으면 measurable=false)·마지막 신호·경고
      (no_heartbeat | pending_without_worker)·timeout 클램프 횟수·long 큐 안내, long 워커 등록 상태, supervisor 명령.
    - 화면: sync 면 「워커 불필요」만, 그 밖이면 입력칸 2종. 상태는 저장된 드라이버 기준 — 폼만 바꾸면 「저장 뒤 반영」 안내.
      서버 422 오류 키는 해당 칸 아래에만 붙는다(연결 간 누출 없음). 수정 권한이 없으면 입력칸 비활성.
      리스너가 등록 안 된 연결·큐를 가리켜 기본값으로 보낸 횟수(placement.fallback)가 있으면 구역에 안내와 마지막 사례를 그린다.

coverage_strategy: pairwise

axes:
  driver: [sync, database, database_and_redis]
  registration: [empty, registered, connection_unregistered, queue_unregistered, invalid_entries, long]
  heartbeat: [fresh, stale, throttled, multi_queue, cache_failure]
  placement: [counters]
  worker: [once, loop]
  endpoint: [settings_get, queue_status]
  permission: [granted, missing]
  rule: [valid, normalize, cross_connection, v1, v2, v3, v4, v5, v6, v7, v8, v9]
  screen: [driver_sync, driver_database, default_queue_chips, saved_driver_differs, error_routing, not_measurable, warning_badges, read_only, empty_status, load_failed, long_worker_states, fallback_count]

