feature: 견본 명령 custom:example (#792 WP-S)

description: |
  코어 릴리스는 예약 자리에 파일을 싣지 않는다. php artisan custom:example board 가 명령 디렉터리의
  stubs/board 원본을 같은 상대 경로로 예약 자리에 복사해(.stub 제거) 견본을 만들고 만든 목록을 보여 준다.
  만들 파일이 하나라도 이미 있으면 아무것도 쓰지 않고 그 목록을 보여 준 뒤 실패로 끝난다(덮어쓰기 선택지 없음).

test_files:
  - tests/Feature/Custom/CustomExampleCommandTest.php

axes:
  case:
    - creates
    - exists
    - unknown

effects:
  - creates_reserved_files_only
  - lists_created_files
  - aborts_without_writing
  - lists_existing_files
  - unknown_sample_fails
