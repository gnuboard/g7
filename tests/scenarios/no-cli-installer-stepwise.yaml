# audit:allow test-scenario-coverage reason: issue:#609 disable_functions 는 INI 값이라 PHPUnit/Playwright 런타임에서 재현 불가 (계획서 §8 자동화 한계). 태스크 흐름·재개·롤백·건너뛰기·모드 전파는 실행기 seam 을 둔 단위 테스트(test_files)가 커버하고, 무CLI 프로필에서의 설치 완주(stepwise + inprocess)는 P0 격리 환경의 브라우저 실측(§9 S2 · G2 DoD)이 담당한다 — 결과는 G2 히스토리 문서와 G8 보고서에 기록된다.

feature: 인스톨러 단계별(stepwise) 실행 + 실행 모드 선택 (무CLI 환경 지원 축 A — P2/G2)

description: |
  설치 태스크를 "요청 1개 = 태스크 1개" 로 돌리는 제3의 진행 모드(stepwise)와, 그 태스크가
  Artisan 을 실행하는 방식(subprocess / inprocess)을 정하는 인스톨러 러너.

  구성:
    - 인스톨러 러너 includes/artisan-executor.php — installerRunArtisan(command, params).
      subprocess 는 종전 exec 본문을 그대로 옮긴 것, inprocess 는 Laravel 부팅 후 코어
      InProcessCommandRunner. task-runner 3곳·rollback 1곳이 전부 이 한 지점을 경유한다.
    - 실행 모드 판정 includes/execution-mode.php — Step 3 선택(auto|subprocess|inprocess,
      기본 auto) > 감지(ExecutionEnvironment). 설치 시작 시 1회 확정해 state 에 박는다(R1).
      inprocess 면 Vendor 설치 방식 bundled 고정(A-4) + 진행 모드 stepwise 강제(A-2).
    - api/run-task.php — 토큰(runtime.php 전용, R3/R8) + finalize 가드(R5) + 워커 lock.
      서버의 completed_tasks 가 다음 태스크를 정하므로 새로고침해도 이어서 진행(W3).
    - W3 [건너뛰고 계속] — 선택 확장(모듈·플러그인·사용자 템플릿·언어팩) 실패만 건너뛰기 허용,
      짝 태스크(activate)까지 완료 마커에 실어 다음 태스크로.
    - D35 — 코어 CommandRunnerResolver::resolve() 가 감지된 php_binary 를 SubprocessCommandRunner 에 전달.

  회귀 불변식 (계획서 §7 R1~R12):
    R1 모드는 진입 1회 결정(execution_mode_resolved) · R2 관리자 ENV 는 같은 요청 안 커맨드 직전 주입 ·
    R3 토큰은 runtime.php(0600) 전용 · R4 include 순서 독립 · R5 전 엔드포인트 가드 경유 ·
    R6 DB 실패 롤백 후 completed 마커 제거 · R7 테스트는 temp BASE_PATH · R8 세션 무의존 ·
    R9/R10 모드가 관여하는 지점은 모드를 읽고 --vendor-mode 로 전파.

# 축이 12개라 full cross product 는 663만 조합이 되어 전개 상한을 넘고, 그 대부분은
# 서로 무관한 관심사의 인위적 조합이다(진행 모드 × 롤백 대상 태스크 × 엔드포인트 가드 …).
# 모든 축 값 쌍을 덮되 케이스 수를 실측 가능한 범위로 유지한다.
coverage_strategy: pairwise

axes:
  installation_mode: [sse, polling, stepwise]                       # 진행 모드 (stepwise 신설)
  execution_mode_choice: [auto, subprocess, inprocess, invalid]     # Step 3 선택값
  execution_mode_resolved: [subprocess, inprocess, absent]          # 설치 시작 시 확정값 (absent = 구 상태 파일)
  vendor_mode_choice: [auto, composer, bundled]                     # Step 3 Vendor 선택
  task_outcome: [done, best_effort_failed, failed_db, failed_extension, aborted]
  resume_point: [first_pending, retry_after_failure, already_completed, all_completed]   # 새로고침 재개 · 실패 후 재시도
  mode_touchpoint: [vendor_mode_read, execution_mode_read]          # 모드가 관여하는 지점 (R9 — 스캔 도출)
  skip_request: [skippable, required, no_failure]
  runner_strategy: [subprocess, inprocess_no_vendor, inprocess, override]
  endpoint_guard: [general, finalize_allowed, finalize_unexpected, missing]
  php_binary_source: [detected_autodetect, configured]              # D35
  task: [composer, key_generate, env, dependency_precheck, db_cleanup, db_migrate, db_seed, template, user_template, module, plugin, language_pack, settings, cache, complete_flag, config_cache, static_publish]   # 태스크 종류 (목록 순서는 test_task_list_order_keys_and_skippable_flags 가 고정). 11차 #C2 — 살아 있는 태스크 4종(key_generate·dependency_precheck·db_cleanup·user_template)이 축에 없어 롤백 디스패치·수동 복구 안내의 모집단에서 빠져 있었다. static_publish 는 부트스트랩 리소스 정적 게시 태스크로, 목록 SSoT 로 옮겨진 뒤에도 이 축에 없어 접기 표와 어긋나 있었다
  # G3 회차 16 W6 — 종전 마킹이 쓰던 이름을 선언으로 올린다 (선언 = 마킹, 제품 결정). 값은 실제 마킹에서 도출.
  probe_key_source: [producer_sources]                              # PHP 프로브 메시지 키 사전의 모집단 출처
  locale: [ko, en]                                                  # 프로브 키가 해석돼야 하는 기본 로케일
  setting_key: [system.execution_mode, general.asset_url_mode]      # 허용값이 닫힌 설정 키 (EnumeratedSettingValues)
  value_kind: [undeclared, declared]                                # 저장 시도 값의 선언 여부
  save_path: [bulk]                                                 # 설정 저장 경로 (벌크)
  base_path: [subpath]                                              # 사이트 마운트 위치 — 인스톨러 JS 주소 조립
  script_home: [installer]                                          # 주소를 만드는 스크립트의 거처
  failure_kind: [rate_limited, unexpected_exception, unparsable_body]  # 요구사항 화면이 살아남아야 하는 실패 형태
  # D2 현장 제보 등재 — 진행 기록의 **양**과 태스크의 **길이**는 서로 다른 축이고,
  # 무응답은 그 둘이 겹칠 때 난다. 실측(2026-09-11, 수정 전): 한 설치가 13,017 줄
  # (`[cmd]` 12,798 줄 · 1.1 MB)을 만들고, 가장 긴 태스크 하나가 44.0 초 동안 화면에
  # 아무것도 주지 않았으며, 그 응답이 도착하는 순간 207,699 자를 한 번에 그리느라
  # 메인 스레드가 1,579 ms 멈췄다.
  progress_log_volume: [small, large, rotated]                      # 화면·파일에 쌓이는 진행 기록의 양
  task_duration: [short, long_no_feedback]                          # 한 요청이 사는 길이 (피드백 부재 구간)

  # a11y_axis 는 이름에 숫자가 들어 InstallerScenarioMarkerCoverageTest::declaredAxes() 의
  # `[a-z_]+` 파서가 여기서 멈춘다 — 그 검사의 대조 대상(task)은 위에 이미 있으므로 이 둘은
  # 블록의 마지막에 둔다.
  a11y_axis: [live_region]                                          # 인스톨러 접근성 축 (라이브 리전)
  nesting: [none]                                                   # 라이브 리전 중첩 금지

exclusions:
  - { installation_mode: sse, execution_mode_resolved: inprocess, reason: "inprocess 는 stepwise 로 강제된다 (A-2)" }
  - { installation_mode: polling, execution_mode_resolved: inprocess, reason: "동일" }
  - { vendor_mode_choice: composer, execution_mode_resolved: inprocess, reason: "bundled 로 고정된다 (A-4) — 조합 자체가 저장되지 않는다" }
  - { skip_request: skippable, task_outcome: failed_db, reason: "DB 단계는 필수 — 건너뛰기 불가" }
  - { installation_mode: stepwise, vendor_mode_choice: composer, reason: "요청 하나가 180초를 사는데 composer install 은 그보다 오래 걸린다 — 화면·서버가 함께 막는다 (10차 #M3)" }
  - { installation_mode: stepwise, vendor_mode_choice: auto, reason: "auto 는 composer 가 있으면 composer 를 돈다 — 위와 같은 이유로 막힌다" }

