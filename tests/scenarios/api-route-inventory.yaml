feature: API 레퍼런스 라우트 수집(ApiRouteInventory) — 미설치 확장 폴백과 확장 web 라우트 범위

description: |
  API 레퍼런스(api:docgen)가 문서로 만들 라우트를 모으는 규칙이다. 명시한 확장이 설치되지 않아 등록 라우트가 0건이면
  번들 라우트 파일을 라우트 프로바이더와 같은 규약으로 읽어 모은다. 외부 시스템이 부르는 확장 web 라우트(PG 콜백·웹훅)는
  문서 대상이고, 사람이 브라우저로 여는 관리자 화면 web 라우트와 코어 web 라우트는 뺀다. 확장의 관리자 JSON API
  (/api/modules/{id}/admin/…)는 다른 API 와 같이 문서 대상이다.
  시험 하나가 시나리오 하나다 — 축 case 는 아래 시험 이름과 짝이다.

axes:
  case:
    - uninstalled_fallback          # 미설치_모듈_범위는_번들_라우트_파일에서_폴백_수집한다
    - fallback_url_convention       # 폴백_수집_라우트는_프로바이더와_동일한_ur_l_규약을_따른다
    - fallback_admin_web_excluded   # web_admin_라우트는_ap_i_문서_대상에서_제외된다
    - no_route_file                 # 라우트_파일이_없는_범위는_빈_배열을_반환한다
    - plugin_webhook                # 플러그인_웹훅_web_라우트가_수집된다
    - plugin_payment_callback       # 플러그인_결제_콜백_web_라우트가_수집된다
    - web_owner_uri                 # 수집된_web_라우트는_확장_소유와_uri_를_정확히_보존한다
    - web_domain_group              # web_라우트도_도메인_그룹으로_분류된다
    - core_web_excluded             # 코어_web_라우트는_수집되지_않는다
    - extension_admin_web_excluded  # 확장의_관리자_화면_web_라우트는_수집되지_않는다
    - other_plugin_isolated         # 타_플러그인_web_라우트는_범위에_섞이지_않는다

effects:
  - uninstalled_scope_falls_back_to_bundled_route_files
  - fallback_routes_follow_provider_url_convention
  - admin_web_screens_excluded_admin_api_included
  - scope_without_route_file_returns_empty
  - plugin_webhook_web_route_collected
  - plugin_payment_callback_web_route_collected
  - web_route_keeps_owner_and_uri
  - web_route_classified_into_domain_group
  - core_web_routes_not_collected
  - other_plugin_web_routes_not_mixed
  # 같은 시험의 효과 이름(7.2.0 쪽 쌍둥이 api-route-inventory-collection.yaml 을 6차 병합 후속에서 합침) — 각 시험 메서드가 위 이름과 함께 마킹한다.
  - plugin_webhook_web_routes_collected
  - plugin_payment_callback_web_routes_collected
  - web_route_owner_and_uri_preserved
  - web_route_domain_group_classified
  - core_web_routes_excluded
  - extension_admin_screen_web_routes_excluded
  - uninstalled_module_routes_collected_from_bundle
  - fallback_routes_follow_provider_conventions
  - fallback_excludes_web_admin_routes
  - missing_route_file_returns_empty

test_files:
  - tests/Unit/Support/ApiDoc/ApiRouteInventoryFallbackTest.php
  - tests/Unit/Support/ApiDoc/ApiRouteInventoryWebRouteTest.php
