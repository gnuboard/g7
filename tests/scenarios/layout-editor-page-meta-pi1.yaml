# 레이아웃 편집기 페이지 설정 메타와 SEO OG 폼
# tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_page_meta_pi1

description: |
  페이지 설정의 메타 폼(제목과 설명 패치, 빈 값 키 제거, fieldT 전달, 아이콘 피커, 권한 TagInput)을 다룬다.
  SEO OG 폼의 기본값과 출처 배지, 상속 칩, 고급 이미지 옵션, 데이터칩 패치, filter 잠금, extra 배열, 자동값 연결 칩과 override 전환을 함께 잰다.

axes:
  subject: [meta_form, seo_og_form]

effects:
  - meta_form_renders_and_patches_fields
  - meta_form_empty_value_removes_key
  - meta_form_expression_title_uses_i18n_field
  - meta_form_value_fields_get_field_t
  - meta_form_field_t_falls_back_to_t
  - meta_form_icon_free_input_fallback
  - meta_form_icon_picker_collapsed_toggle
  - meta_form_permissions_tag_input_patches
  - meta_form_last_permission_removes_key
  - seo_og_default_placeholder_and_core_badge
  - seo_og_source_chip_switches_to_revert
  - seo_og_inherited_key_chip_and_empty_input
  - seo_og_type_inherited_source_inline
  - seo_og_image_advanced_collapsible_patches
  - seo_og_image_advanced_open_when_filled
  - seo_og_title_override_patch
  - seo_og_image_data_chip_patch
  - seo_og_site_name_plain_and_data_patch
  - seo_og_unlocked_keys_stay_editable
  - seo_og_locked_key_read_only_value
  - seo_og_extra_array_serialized
  - seo_og_twitter_extra_array_serialized
  - seo_og_no_defaults_hides_placeholder_badge
  - seo_og_auto_value_link_chip_with_replace
  - seo_og_auto_i18n_row_link_chip_only
  - seo_og_replace_enters_override
  - seo_og_override_shows_data_chip_input
  - seo_og_no_source_expr_keeps_placeholder

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/page-settings/MetaForm.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/page-settings/SeoOgForm.test.tsx
