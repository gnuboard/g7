feature: cache_ttl_settings

description: |
  코어 캐시를 쓰는 서비스들이 TTL 과 사용 여부를 코드에 박아 두지 않고 g7_core_settings('cache.*_ttl'),
  'cache.*_enabled' 설정을 따르는지 고정한다(계획서 §13 S-1 ~ S-14). CoreCacheDriver 의 기본 TTL 과
  LayoutService, SeoCacheManager, NotificationDefinitionService, CoreVersionChecker 의 getCacheTtl() 이
  설정값을 돌려주고, 설정을 바꾸면 다음 호출부터 바로 새 값이 쓰인다. SEO 와 GeoIP 캐시를 끄면 저장하지 않고,
  레이아웃 캐시 끔 설정도 읽힌다. put() 에 TTL 을 직접 주면 그 값으로 저장되고, 설정이 비어 있으면
  서비스의 하드코딩 기본값(알림 3600초)으로 돌아간다.

axes:
  case:
    - default_ttl            # CoreCacheDriver 기본 TTL (S-1, S-2)
    - layout_ttl             # LayoutService TTL (S-3)
    - seo_ttl                # SeoCacheManager TTL (S-4)
    - notification_ttl       # NotificationDefinitionService TTL (S-5)
    - geoip_ttl              # GeoIpService 캐시와 TTL 설정 (S-6)
    - version_check_ttl      # CoreVersionChecker TTL (S-7)
    - extension_status_ttl   # 확장 상태 TTL 설정 (S-8)
    - sitemap_ttl            # Sitemap TTL 설정 (S-9)
    - seo_disabled           # SEO 캐시 끔 (S-10)
    - geoip_disabled         # GeoIP 캐시 끔 (S-11)
    - layout_disabled        # 레이아웃 캐시 끔 (S-12)
    - explicit_ttl           # put() 에 TTL 직접 지정 (S-13)
    - missing_setting        # 설정값 없음 (S-14)

exclusions:
  - { case: default_ttl, reason: "제외 없음 — 사례 단일 축(서비스, 설정 키, 켜고 끔 조합은 사례로 고정)" }

effects:
  - default_ttl_follows_setting        # getDefaultTtl() 이 cache.default_ttl 값을 돌려준다
  - ttl_change_applies_immediately     # 설정을 바꾸면 다음 호출부터 새 TTL 이 나온다
  - service_ttl_follows_setting        # 서비스와 버전 검사기의 getCacheTtl() 이 각자의 cache.*_ttl 값을 돌려준다
  - ttl_setting_value_read             # g7_core_settings('cache.*_ttl') 가 기본값 대신 설정값을 읽는다
  - geoip_lookup_result_cached         # GeoIP 조회 결과가 geoip.timezone.{ip} 키에 저장된다
  - disabled_cache_not_stored          # SEO 나 GeoIP 캐시를 끄면 저장한 값이 남지 않는다
  - layout_cache_disabled_read         # cache.layout_enabled=false 가 false 로 읽힌다
  - explicit_ttl_put_stored            # TTL 을 직접 준 put() 값이 저장된다
  - missing_setting_uses_fallback      # 설정이 비면 서비스 하드코딩 기본값(3600초)을 쓴다

test_files:
  - tests/Unit/Cache/Migration/CacheSettingsTest.php
