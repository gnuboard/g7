feature: member_signup_field_settings

description: |
  가입 요청(POST /api/auth/register)이 회원 항목 설정을 따르는지. 기본 설정에서는 종전과 같고,
  운영자가 항목의 사용, 필수, 가입 표시를 바꾸거나 항목을 추가하면 검증과 저장이 따라 바뀐다.

coverage_strategy: full

axes:
  setting: [defaults, name_optional_or_disabled, core_field_required, custom_field, fields_version, legacy_keys, extension_filter]

effects:
  - signup_unchanged_with_default_settings
  - signup_ignores_fields_not_shown_on_signup
  - signup_name_can_be_optional_or_disabled
  - signup_follows_required_and_signup_visibility
  - signup_core_field_error_uses_field_label
  - signup_custom_field_validated_and_stored
  - signup_stale_form_rejected_before_validation
  - signup_legacy_request_key_is_accepted
  - signup_validation_filter_still_runs

test_files:
  - tests/Feature/Auth/RegisterFieldSetTest.php
