feature: 반복 렌더 컨텍스트(DataGrid cellChildren 등)의 파이프 표현식이 배포 번들에서 포맷된 값으로 그려진다 (#87)

description: |
  `renderItemChildren` 이 단일 바인딩을 해석할 때 `|` 를 복잡 표현식 문자로 분류해 JS 비트 OR 로 평가했다.
  인자 있는 파이프(`datetime('YYYY-MM-DD HH:mm')`)는 예외로 값이 사라져 셀이 비었고, 인자 없는 파이프
  (`uppercase`)는 `0` 이라는 조용한 오답이 됐다. 셀에 파이프를 넣은 화면이 코어 기본 레이아웃에 없으므로
  배포 번들의 `G7Core.renderItemChildren` 를 직접 호출해 결과를 잠근다.

  소스 수준 잠금은 engine-render-item-children-pipe(renderItemChildren-pipe.test.ts)가 맡고, 이 매니페스트는
  같은 계약의 배포 번들 종단이다. 축 case 는 파이프 자리 하나씩이다 — text 의 인자 있는 파이프,
  text 의 인자 없는 파이프(number·uppercase), props 값의 파이프.

axes:
  case: [cellchildren_pipe_with_args, cellchildren_pipe_without_args, cellchildren_props_pipe]

effects:
  - pipe_formatted_value_rendered   # 파이프가 적용된 문자열(날짜 형식·천 단위 구분·대문자)이 children·title 에 실린다

test_files:
  - tests/Playwright/specs/datagrid-cellchildren-pipe.spec.ts
