notes:
  - 의존 대상의 판이 내려가거나 꺼지는 경로(역방향)는 막지 않고 안내(notice)만 한다 — 작업 차단은 범위 밖.
  - 강제 비활성화·install --force 의 안내 연결은 실제로 돌리면 라우트·훅 캐시 재굽기가 따라와 시험 중 실행할 수 없다 — 판정·수준은 dependents_* 단위 시험, 연결은 dependents_wiring 소스 가드가 잠근다.
