# audit:allow test-scenario-coverage[cross_product] reason: 행별 권한은 스코프(self/전체/없음) × 행(본인/타인) × 래핑(단건/이중/컬렉션)이지만, 래핑 축은 스코프 해석이 중첩 리소스를 풀어내는지만 보므로 self 스코프 한 조합으로 충분하다 — 곱하면 같은 판정만 반복된다.
feature: user_per_item_abilities
coverage_strategy: pairwise
description: |
  관리자 회원 목록 응답의 행별 권한(abilities)과 소유 여부(is_owner). 수정 삭제 가능 여부는 역할 권한의 스코프로 정한다 —
  self 는 본인 행만, 전체(null)는 모든 행, 권한 없음은 모두 false. 단 관리자 화면에서 본인 계정은 스코프와 관계없이 지울 수
  없다(UserService::deleteUser 와 같은 판정). 리소스를 이중으로 감싸거나 컬렉션이 다시 감싸도 안쪽 회원으로 판정한다.
axes:
  scope: [self, all, none]
  row: [own, other]
  wrap: [single, double, collection]
effects:
  - self_scope_own_row_updatable_not_deletable
  - self_scope_other_row_denied
  - all_scope_other_row_allowed
  - list_array_has_is_owner
  - list_array_has_abilities
  - effective_scope_cached
  - no_permission_all_false
  - collection_double_wrap_resolves_scope
  - double_wrap_resolves_abilities
test_files:
  - tests/Unit/Resources/PerItemAbilitiesTest.php
