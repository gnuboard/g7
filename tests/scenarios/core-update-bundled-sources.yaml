# audit:allow test-scenario-coverage[cross_product] reason: 축 곱(도메인 4 × 설치 2 × 디스크 2 × 의존 4 × 선택 7 × 적용 모드 3 × 소스 5 …)은 수천 조합이라 개별 docblock 으로 전개하지 않는다. 각 축은 데이터 프로바이더(적용 모드 3종, 선택 4종, 잘못된 선택 3종, zip 접두사 2종, 옵션 3종)와 축별 대표 케이스로 검증하고, 후속 효과(effects)는 전부 테스트 docblock 에 매핑한다.

feature: core_update_bundled_sources

description: |
  공개 #146. core:update 가 새 배포본의 `_bundled` 를 통째로 배치하던 동작을 바꾼다. 설치됐거나 디스크에 있는
  공식 번들과 그 의존 번들(새 판 manifest 추이 폐포)은 항상 갱신하고, 디스크에도 없고 설치되지도 않은 번들은
  [배치하지 않음 / 모두 배치 / 골라서 배치] 로 묻는다(비대화형은 --bundled-sources, 없으면 none).
  --source/--zip/--local 은 유지보수 모드 전에, GitHub 경로는 다운로드 직후 경고와 함께 묻는다.
  Step 6.5(롤백 manifest)·Step 7(파일 적용)은 증분·prune·백업 부재 세 모드 모두 skipPaths 로 미배치 경로를 건너뛴다.
  언어팩은 core 팩 항상, 확장 팩은 대상이 배치·설치되거나 팩 자신이 설치·디스크에 있을 때만 배치한다.
  결과는 storage/app/core_update/bundled_sources.json 에 기록하고(롤백 시 이전 기록 복원), 완료 요약은 4구분으로 출력한다.
  core:bundled-sources list/place/prune 로 사후 보고·배치·정리를 한다(prune 기본 미리보기, 수정본 보존, 의존 보호,
  사용자 자체 폴더 불가침). 관리자 목록 4화면은 미배치 안내와 관리자별 닫기(해시 30일 캐시)를 보인다.

