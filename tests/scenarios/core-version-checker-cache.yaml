feature: core_version_checker_cache

description: |
  캐시 이관 그룹 F 에서 CoreVersionChecker 의 호환성 검사 캐시를 고정한다.
  캐시 키는 `ext.version_check.{type}.{코어 버전}` 이고 코어 드라이버가 `g7:core:` 접두사를 붙인다.
  같은 키로 저장한 결과는 캐시 히트가 되고, clearCache() 는 modules, plugins, templates 세 타입 키를 모두 지운다.
  코어 버전이 바뀌면 키가 달라져 이전 버전의 결과와 섞이지 않는다. env APP_VERSION 을 비우고
  config('app.version') 로 버전을 바꿔 가며 확인한다.

axes:
  case:
    - key_format       # F-1-1 캐시 키 형식
    - cache_hit        # F-1-2 저장 후 캐시 히트
    - clear_cache      # F-1-3 clearCache 세 타입 무효화
    - version_change   # F-1-4 코어 버전 변경 시 키 분리

exclusions:
  - { case: key_format, reason: "제외 없음 — 사례 단일 축" }

effects:
  - version_check_key_prefixed          # 키가 ext.version_check.modules.7.0.1 이고 g7:core: 접두사로 풀린다
  - cached_result_hit                   # 저장한 호환성 결과를 같은 키로 읽는다
  - clear_cache_removes_three_types     # clearCache 뒤 modules, plugins, templates 키가 모두 없다
  - version_change_separates_keys       # 버전이 바뀌면 새 키가 달라지고 옛 키 값은 새 키로 보이지 않는다

test_files:
  - tests/Unit/Cache/Migration/CoreVersionCheckerCacheTest.php
