feature: 미뤄 둔 선언 정리 대장 — DB 에서 읽은 대상은 정해 둔 것만 실행하고 소유를 짐작하지 않는다

description: |
  대장은 「이 확장(코어)의 선언 정리가 필요하다」만 적고, 운영 서버의 `extension:apply-deferred-cleanup` 이 그 서버의 지금 선언으로
  다시 계산한다. DB 에서 읽는 값 가운데 시드 정리 시더 클래스는 그 확장이 선언한 시더(`getSeeders()`)일 때만 실행하고, 그 밖의
  시더·알 수 없는 범위는 실행하지 않고 실패(종료 1, 행 유지)로 남긴다. 검수 서버가 미룰 수 있는 정리 메서드는 허용 목록
  (메뉴·권한·역할·스케줄 2·시드 엔티티·본인확인 정책·알림 정의·알림 템플릿)에 있는 것뿐이다. 대장에 적는 소유 범위·식별자는
  메서드마다 정해 둔 인자 자리에서 읽는다 — 식별자 모양의 문자열을 보고 모듈로 짐작하지 않고, 읽을 수 없으면 core 로 둔다.

# 축 의미:
#   case — 경로.
axes:
  case: [unlisted_target, owner_resolution]

effects:
  - undeclared_seeder_is_not_run
  - unlisted_target_row_fails_and_stays
  - owner_is_read_from_declared_arguments

test_files:
  - tests/Feature/RuntimeRole/DeferredCleanupAllowlistTest.php
