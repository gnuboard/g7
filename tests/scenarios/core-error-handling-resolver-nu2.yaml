feature: 오류 처리 해석기(ErrorHandlingResolver) 단위 검사

description: |
  ErrorHandlingResolver 는 API 오류 코드에 맞는 처리 핸들러를 액션, 레이아웃, 템플릿, 시스템 기본값 순서로 찾아
  실행한다. 이 매니페스트는 그 단위 시험 파일을 영역별로 소유한다(#869 표식 소급).
  시스템 기본값(DEFAULT_ERROR_HANDLING)에 default 키가 있어 설정을 모두 비워도 핸들러를 찾는다. 그래서
  「핸들러 없음 → handled: false」 갈래는 resolve 가 빈 결과를 돌려줄 때만 닿으며, 시험은 그 경우를 따로 고정한다.

axes:
  area: [singleton, priority, show_error_page, execute, resolve_and_execute, suppress, config]

effects:
  - error_resolver_singleton
  - error_level_priority
  - error_page_code_injected
  - error_handler_executed
  - error_resolve_execute_result
  - error_suppress_stops_propagation
  - error_config_managed

test_files:
  - resources/js/core/error/__tests__/ErrorHandlingResolver.test.ts
