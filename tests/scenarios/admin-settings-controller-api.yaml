# audit:allow test-scenario-coverage[cross_product] reason: 엔드포인트 × 탭 × 인증 상태 × 결과 중 엔드포인트마다 의미 있는 조합만 실체가 있다
# (탭은 store 에만, 최고관리자는 앱 키 재생성에만, 서비스 직접 호출은 probe 격리 단위 검증에만 성립). 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 관리자 환경설정 API (조회, 탭별 저장, 단건 조회와 수정, 시스템 정보, 캐시, 앱 키, 테스트 메일, 복원)

description: |
  `/api/admin/settings` 계열 엔드포인트의 계약을 고정한다.

  배경:
    - 이 테스트 파일은 시스템 정보 probe 격리(settings-system-info-probe-isolation)와
      OPcache 노출(opcache-status-visibility) 두 매니페스트에 일부 테스트만 귀속돼 있었고,
      나머지 57건은 소유 매니페스트 없이 존재했다. 이 매니페스트가 그 57건의 소유권을 명시한다.
    - 권한은 둘로 갈린다. core.settings.read 는 조회(index, show, system-info, app-key),
      core.settings.update 는 상태를 바꾸는 길(store, update, clear-cache, restore)이다.
      read 만 가진 관리자는 목록을 보되 abilities.can_update 가 false 로 내려간다.
    - 앱 키 재생성은 설정 권한과 별개로 최고관리자(회원의 `is_super` 표지)만 통과한다.
      코어에는 최고관리자 역할이 없으므로, 일반 관리자는 권한이 있어도 라우트의 최고관리자
      관문에서 403 으로 끊긴다. 통과한 뒤에는 비밀번호 필수(422)와 불일치(401)를 차례로 본다.
    - 저장(store)은 `_tab` 으로 general, security, advanced, identity, drivers 중 한 탭만 받는다.
      허용 목록 밖 탭은 422 다. 탭마다 필드 검증(형식, 범위, 조건부 필수)이 다르다.
      identity 탭의 목적별 프로바이더는 점이 들어간 purpose id 가 중첩 객체로 들어와도 받되,
      값 길이 제약은 임의 깊이에서 유지한다. drivers 탭은 웹소켓을 켰을 때만 앱 ID, 키, 시크릿이 필수다.
    - 시스템 정보는 하드웨어 정보를 캐시하되 server_time 은 매 호출 갱신하고, 캐시 정리가
      시스템 정보 캐시까지 무효화한다. probe 실패 격리 자체는 settings-system-info-probe-isolation 이 소유한다.

  적용 지점:
    - `app/Http/Controllers/Api/Admin/SettingsController.php`
    - `app/Services/SettingsService.php` (safeSystemProbe 포함)
    - `app/Http/Requests/Settings/**` FormRequest (탭별 저장, 앱 키 재생성, 테스트 메일, 복원)

# 네 축의 완전 곱(2,772)은 대부분 성립하지 않는 조합이다(탭은 store 에만 의미가 있다). 조합 전개는 pairwise 로 둔다.
coverage_strategy: pairwise

axes:
  endpoint: [index, store, show, update, system_info, clear_cache, app_key, regenerate_app_key, test_mail, restore, settings_service]
  tab: [none, general, security, advanced, identity, drivers, invalid]
  auth_state: [unauthenticated, authenticated_without_permission, authenticated_read_only, authenticated_with_permission, super_admin, not_applicable]
  outcome: [success, validation_error, unauthorized, forbidden, password_rejected, fallback_returned]

effects:
