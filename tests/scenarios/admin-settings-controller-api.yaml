# E2E axis 없음: 순수 백엔드 JSON API 계약이다. 화면(환경설정 탭) 렌더는 템플릿 쪽 테스트가 소유한다.

test_files:
  - tests/Feature/Api/Admin/SettingsControllerTest.php
