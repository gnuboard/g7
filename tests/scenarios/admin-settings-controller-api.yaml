  - show_returns_default_for_nonexistent_key
  - update_saves_single_setting_by_dotted_key
  - update_requires_value

  # 시스템 정보와 캐시
  - system_info_memory_usage_has_disk_like_structure
  - system_info_cpu_info_excludes_shell_error_tail
  - system_info_caches_hardware_payload_and_refreshes_server_time
  - clear_cache_invalidates_system_info_cache
  - clear_cache_returns_success
  - safe_system_probe_returns_fallback_on_error

  # 앱 키 — 조회는 마스킹, 재생성은 최고관리자(is_super) 전용
  - app_key_is_returned_masked
  - app_key_regeneration_requires_super_admin
  - app_key_regeneration_by_super_admin_requires_password
  - app_key_regeneration_rejects_wrong_password_with_401
  - app_key_regeneration_succeeds_for_super_admin

  # 테스트 메일
