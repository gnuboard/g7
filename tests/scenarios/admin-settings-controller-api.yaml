  - index_without_authentication_returns_401
  - index_without_read_permission_returns_403
  - store_without_update_permission_returns_403
  - restore_without_authentication_returns_401
  - restore_without_update_permission_returns_403
  - test_mail_without_authentication_returns_401

  # 목록 조회(index)와 abilities
  - index_returns_settings_successfully
  - index_response_has_success_message_data_structure
  - index_abilities_can_update_true_with_update_permission
  - index_abilities_can_update_false_for_read_only_user

  # 탭별 저장(store) 정상 경로
  - store_saves_general_tab
  - store_saves_security_tab
  - store_saves_advanced_tab
  - store_accepts_identity_tab
  - store_accepts_nested_purpose_provider_for_dotted_purpose_id
  - store_accepts_europe_paris_timezone
  - store_timezone_keeps_app_timezone_utc
  - store_saves_core_update_settings_and_index_reflects_them
  - store_allows_empty_core_update_settings
  - store_persists_core_update_category_in_config_repository
  - store_accepts_site_logo_as_attachment_objects
  - store_accepts_site_logo_as_integer_ids
  - store_allows_empty_websocket_credentials_when_disabled
  - store_saves_websocket_settings_with_credentials
  - store_drivers_roundtrip_includes_s3_endpoint_and_path_style

  # 탭별 저장(store) 검증 실패
  - store_rejects_nested_purpose_provider_value_over_max_length
  - store_rejects_identity_challenge_ttl_out_of_range
  - store_rejects_identity_max_attempts_out_of_range
  - store_requires_site_name_for_general_tab
  - store_rejects_invalid_site_url
  - store_rejects_invalid_admin_email
  - store_rejects_unsupported_timezone
  - store_rejects_auth_token_lifetime_out_of_range
  - store_rejects_layout_cache_ttl_over_max
  - store_rejects_unknown_tab
  - store_rejects_invalid_core_update_github_url
  - store_rejects_core_update_github_token_over_max_length
  - store_requires_websocket_credentials_when_enabled

  # 단건 조회(show)와 수정(update)
