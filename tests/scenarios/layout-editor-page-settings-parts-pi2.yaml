feature: 레이아웃 편집기 페이지 설정 부품 — 구조화 데이터, SEO 동적변수, 동작 목록, 오류 처리 행, 데이터 소스 조건, 격리 영역

description: |
  페이지 설정 모달과 속성 모달이 공유하는 부품의 단위 시험을 묶는다. 각 시험이 실제로 재는 동작을
  효과로 적는다. 소유 매니페스트(page-settings.yaml)가 이미 선언한 효과는 그쪽을 그대로 쓰고,
  여기에는 그 매니페스트에 없던 동작만 둔다.

  - SeoStructuredDataEditor: 점 경로 평탄화와 중첩 복원, 자동 블록 읽기 전용 미리보기, 직접 지정
    전환 시 모듈 자동값 시드(autoMeta 가 있으면 데이터 경로), filter 잠김, 빈 값 안내.
  - SeoVarsEditor: 자동 채움 읽기 전용, 값 채우기 패치, 필수 표시, 직접 추가 이름 검사와 삭제,
    확장과 page_type 전제 미충족 배너.
  - ActionListBuilder, ErrorHandlingRows, dataSourceConditionAdapter: 친화 요약과 순서 이동,
    코드 보기, 오류 코드 행과 정리, data_source if 왕복.
  - IsolatedScopeControl: scopeId 검색 후보, 자유 입력, 빈 값 자동 시드 유지, OFF 상태 입력칸 숨김.

axes:
  area: [seo_structured_data, seo_vars, action_list, error_rows, ds_condition, isolated_scope]

