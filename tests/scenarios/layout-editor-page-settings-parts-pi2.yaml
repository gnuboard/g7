  - seo_sd_flatten_nested_to_dot_path_rows
  - seo_sd_nest_dot_path_rows_back_to_object
  - seo_sd_off_shows_auto_block_readonly_with_warning
  - seo_sd_on_seeds_module_auto_block
  - seo_sd_on_without_auto_block_starts_empty_type
  - seo_sd_add_dot_path_property_patches_nested
  - seo_sd_seed_from_module_copies_auto_block
  - seo_sd_existing_declaration_opens_toggle_on
  - seo_sd_filter_lock_hides_toggle_shows_filtered
  - seo_sd_empty_value_row_shows_not_rendered_note
  - seo_sd_without_auto_meta_keeps_plain_auto_rows
  - seo_sd_on_seed_uses_auto_meta_expr_not_text
  - seo_sd_on_seed_keeps_plain_for_keys_without_meta
  - seo_sd_seeded_meta_row_value_renders_as_chip
  # SEO 동적변수
  - seo_vars_auto_source_rows_readonly_without_input
  - seo_vars_data_row_value_input_patches_vars
  - seo_vars_required_data_var_warned_not_removable
  - seo_vars_custom_add_blocks_reserved_auto_name
  - seo_vars_custom_add_creates_empty_key
  - seo_vars_unlisted_name_shows_not_provided_hint
  - seo_vars_custom_var_remove_deletes_key
  - seo_vars_gating_unmet_hides_auto_and_data_rows
  # 공용 부품
  - action_list_builder_summary_reorder_remove_add
  - action_list_builder_code_view_shows_json
  - error_rows_render_code_rows_badge_and_warning
  - error_rows_clear_removes_code_key
  - ds_condition_adapter_round_trips_if
  - ds_condition_adapter_empty_node_removes_if
  # 격리 영역
  - isolated_scopeid_search_filters_and_selects
  - isolated_scopeid_free_text_accepts_new_name
  - isolated_scopeid_empty_input_keeps_auto_seed
  - isolated_scope_off_hides_scopeid_input

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/page-settings/SeoStructuredDataEditor.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/page-settings/SeoVarsEditor.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/pageSettingsCommonParts.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/property-controls/IsolatedScopeControl.test.tsx

validation:
  note: |
    Vitest RTL 단위가 잰다. 모달 합성 화면의 브라우저 실측은 page-settings.yaml 이 소유한다.
