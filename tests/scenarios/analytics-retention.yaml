  - tests/Feature/Console/Analytics/PruneCommandTest.php
  - tests/Feature/Console/Analytics/CheckVolumeCommandTest.php
  - tests/Feature/Console/Analytics/AnonymizeCommandTest.php
  - tests/Feature/Console/Analytics/PurgeCommandTest.php
  - tests/Feature/Analytics/ExtensionPurgeTest.php
  - tests/Feature/Analytics/RunProgressBroadcastTest.php
  - tests/Feature/Analytics/StaleRunServiceTest.php
  - tests/Feature/Console/Analytics/UpdateCloudRangesCommandTest.php
  - tests/Feature/Console/Analytics/AnalyticsScheduleRegistrationTest.php

