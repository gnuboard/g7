feature: 레이아웃 편집기 다국어 텍스트 입력 — I18nTextField, 번역 탭, 자리표시 칩, 데이터 피커, 부유 드롭다운

description: |
  텍스트 propControl 과 번역 탭이 쓰는 입력 위젯의 단위 시험을 묶는다. 소유 매니페스트
  (layout-editor-prop-controls, page-settings, layout-editor-text-inline-binding)가 이미 선언한
  효과는 그쪽을 쓰고, 여기에는 그 매니페스트에 없던 동작만 둔다.

  - classifyCustomText: 평문, custom 키, 임의 lang 키, 바인딩, param 키 분류.
  - I18nTextField: 미리보기와 blur 커밋(키 생성, 현재 로케일 갱신), 표현식 트리 opt-in 과 접힘,
    일반 이름과 표현식 전환, 단일 바인딩 데이터 칩, 설정 참조 칩, ko/en/ja 펼침, 칸자리 칩과
    +데이터 키화.
  - ControlRenderer: i18n-text 와 text propValue 분기.
  - TranslationField: param 키 저장 상태 표시, 칩 구조 변경 판정과 즉시 동기화, 칩 해제 배선.
  - PlaceholderChipInput: 슬롯 구성, 무손실 분해, 칩 렌더와 해제 버튼, 드래그 뒤 오클릭 차단,
    글자 사이 이동, 비제어 평문 타이핑.
  - InlineBindingScalarPicker, FloatingDropdown: 부유와 인라인 분기, 후보 선택, 닫힘 트리거.

axes:
  area: [classify, i18n_field_commit, expression_tree, data_binding, settings_ref, expand_locales, prop_control, param_chip, translation_field, placeholder_chip, scalar_picker, floating_dropdown]

