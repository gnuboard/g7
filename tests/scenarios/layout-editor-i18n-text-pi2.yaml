    Vitest RTL 단위가 잰다. contentEditable 칩 드래그와 부유 위치 보정(flip, clamp)은 jsdom 좌표가
    0 이라 각 시험 파일 머리말의 e2e:allow 사유대로 Chrome MCP 실측이 맡는다.
