feature: 트러블슈팅 회귀 — 상태 고급(cellChildren·Debounce·부분 업데이트·computed·모달 스코프·커스텀 핸들러·비동기 setLocal·오류 콜백)

description: |
  상태 고급 트러블슈팅 사례(해결됨)를 실제 엔진 모듈로 재현해 잠그는 회귀 시험이다.
  사례마다 원인이 달라 사례끼리 곱할 입력 축이 없다 — 축 case 는 문서의 사례 하나씩이고, 효과는 그 사례가 지키는
  해결 성질 하나씩이다(같은 사례의 시험 여럿은 같은 칸·같은 효과를 서로 다른 각도로 잠근다).

  사례 번호는 문서 절(Debounce·모달 스코프·비동기 setLocal 등)마다 따로 매겨져 겹치므로 축 값은 번호 대신 증상 이름을 쓴다.

