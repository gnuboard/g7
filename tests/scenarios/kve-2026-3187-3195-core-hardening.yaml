# audit:allow test-scenario-coverage[cross_product] reason: |
#   경합(동시 요청)은 단일 프로세스 PHPUnit 이 진짜로 만들 수 없어 「낡은 모델을 돌려주는 Repository」·
#   「같은 요청 안 재진입」으로 결정론적으로 재현한다. 진짜 동시성은 브라우저 Promise.all 실측이 덮는다.
#   축 조합 전개는 다른 시나리오와 같은 fallback YAML 파서 한계로 자동 검출하지 않는다.

feature: 인증·본인인증 경합·결박 강화 (KVE-2026-3187~3195 코어 조치)

description: |
  제보 8건과 같은 원인을 가진 코어 결함을 함께 닫는다. 원인은 둘이다.
    - 「읽고 → 판단하고 → 나중에 덮어쓴다」: 슬라이딩 갱신의 save() 가 지운 토큰을 되살리고,
      시도 횟수·상태 전이·토큰 소비가 조건 없는 저장이라 동시 요청이 서로를 덮는다.
    - 「발급할 때 묶은 조건을 쓸 때 확인하지 않는다」: 본인인증 결과를 purpose 만 보고 받아
      정책이 지정한 수단·대상과 무관하게 여러 번 쓸 수 있다.

  적용 지점(WP1~WP5):
    - 토큰 연장은 행이 있을 때만 바뀌는 UPDATE, 토큰 폐기 경로는 web 세션도 함께 지운다.
    - 재설정 토큰은 지운 행 수 1 일 때만 비밀번호 변경을 확정한다.

axes:
  token_path: [user_logout, user_refresh, admin_logout, admin_refresh, active_request]
  token_remaining: [above_half, below_half, expired, no_expiry]
  revocation_entry: [logout_all_devices, password_reset, self_password_change, admin_block, bulk_status]
  session_driver: [database, file]
  reset_token_use: [first, stale_second]
  token_binding: [purpose, required_provider, target_member, target_guest, targetless]
  request_outcome: [success, validation_422, policy_428, rollback]
  two_factor_answer: [wrong, correct_while_locked]
  challenge_state: [sent, verified, cancelled, failed, expired]
  read_timing: [fresh, stale]
  code: [correct, wrong]

exclusions:
  - { token_path: active_request, token_remaining: expired, reason: "만료 토큰은 인증 단계에서 401 — 갱신 경로에 닿지 않음" }

