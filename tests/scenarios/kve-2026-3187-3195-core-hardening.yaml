  # 정책 미들웨어의 토큰 우회 매트릭스(EnforceIdentityPolicyTokenBypassTest)와 가입 정책 흐름
  # (RegisterPolicyDrivenSignupTest) — 결박·1회 소비(WP3)가 기대는 기존 회귀를 함께 고정한다.
  - verified_token_passes_matching_policy        # 같은 목적·같은 대상의 확인 완료·미소비 토큰이면 정책 통과
  - token_bypass_ignores_grace_window            # grace 0분 밖(verified_at 2초 전)이어도 토큰만으로 통과
  - token_purpose_mismatch_rejected              # 다른 목적으로 발급된 토큰은 428
  - unverified_token_rejected                    # 확인 전(sent) 토큰은 428
  - unknown_token_rejected                       # DB 에 없는 위조 토큰은 428
  - signup_before_submit_requires_token          # 가입 전 정책이 켜져 있으면 토큰 없는 가입은 428, 회원 미생성
  - signup_without_policy_creates_active_user    # 가입 정책이 모두 꺼져 있으면 활성 회원 생성, challenge 없음
  - signup_after_create_creates_pending_user     # 가입 후 정책 → 인증 대기 회원 + after_register 출처 challenge
  - signup_after_create_verify_activates_user    # 가입 후 정책 challenge 를 확인하면 활성으로 전환
  - after_register_hook_not_enforced_twice       # after_register 훅은 challenge 발행 리스너만 구독, 일반 강제 리스너 미구독
  - signup_token_single_use                      # 가입에 쓴 토큰으로 두 번째 가입 불가(KVE 동형 O4·B2)
  - signup_failure_releases_token                # 가입 422 실패 시 토큰 소비를 되돌려 재가입 허용

