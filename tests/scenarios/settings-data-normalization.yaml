feature: 설정 조회 — 저장된 값을 defaults 스키마의 스칼라 타입으로 맞추는 NormalizesSettingsData

description: |
  숫자 설정은 HTML number 입력과 Laravel integer 규칙을 거치며 숫자 문자열로 영속될 수 있다. 조회 시
  NormalizesSettingsData 가 defaults 스키마의 타입(int, float)으로 캐스트해야 Carbon 같은 strict 타입
  경계에서 TypeError 가 나지 않는다. 캐스트는 인덱스 배열 항목과 연관 배열 그룹 안까지 내려가고,
  기본값이 숫자가 아니거나(불리언, 문자열, 다국어 맵) 기본값이 없는 키, 숫자가 아닌 값은 손대지 않는다.

axes:
  value_shape: [scalar_int, scalar_float, indexed_array_item, associative_group, untouched]

effects:
  - settings_read_returns_schema_scalar_type
  - numeric_strings_inside_nested_settings_are_cast
  - non_castable_values_are_left_untouched
  - multilingual_settings_are_not_broken_by_normalization

test_files:
  - tests/Unit/Traits/NormalizesSettingsDataTest.php
