  - preset_options_drop_nameless_and_duplicate_rows
  - preset_control_lists_original_then_presets_with_size_fit_labels
  - preset_control_keeps_unknown_current_value_visible
  - preset_control_emits_name_or_undefined
  - img_thumb_preset_written_to_node_props
  - img_thumb_preset_binding_value_degrades_to_badge

