feature: 이미지 썸네일 프론트 — 주소 유틸과 편집기 「썸네일 규격」 위젯 (#869)

description: |
  화면이 서빙 주소에 `?size={규격}` 을 붙이는 판정은 코어 `resources/js/core/support/thumbnailUrl.ts` 한 곳에 있다. 서버 `App\Thumbnails\ThumbnailUrl`
  과 같은 판정이어야 봇 화면(SSR)과 사람 화면이 같은 파생본을 쓰므로, 기대값은 서버 시험(`image-thumbnails.yaml`)과 같은
  규격표로 맞추고 효과 이름도 같은 것을 쓴다.
  - 대상: 설정 `upload.thumbnail_url_patterns` 에 등록된 서빙 경로의 루트 상대 또는 같은 출처 주소만. 외부·정적·data·blob·
    protocol-relative·상대 경로는 그대로 둔다. 기능이 꺼지면(패턴 []) 어떤 주소도 대상이 아니다. 하위 폴더 설치는 접두를 벗겨 대조한다.
  - 주소 조립: 서명 쿼리는 원문 순서와 인코딩을 그대로 두고 끝에 붙인다(순서가 바뀌면 서명 검증이 깨진다). 기존 size·w 는 걷어낸다. 걷어낼 키
    판정은 서버 `ThumbnailQuery::ignoreClosure()` 와 같다(`+` 는 공백, 복호 뒤 `size`·`w` 이거나 `size[`·`w[` 로 시작).
  - srcset: 같은 맞춤·같은 비율 중 1.5배 이상 최소 규격을 2x 로. 본문은 숫자 요청 대상 규격 전부를 가로 기술자로.
    원본 가로를 아는 자리는 `contentSrcsetWithin` 이 원본 가로를 넘는 후보를 뺀다(기본 이하, `includeOriginal` 이면 미만 + 원본).
  - 설정 출처: 렌더 환경 전역 상태(편집 캔버스 sampleGlobal) → G7Config 순.
  - 편집기: Img 「썸네일 규격」 컨트롤(`thumbnail-preset` 위젯)이 규격 목록을 고르게 하고 `props.thumbPreset` 에 기록한다.
  `thumb`·`thumbSrcset` 파이프는 같은 유틸을 부르며 `engine-data-binding-and-pipes.yaml` 이 소유한다.

axes:
  surface: [url_util, editor_control]

effects:
  # 주소 유틸 — 서버와 같은 이름(image-thumbnails.yaml)
  - url_util_adds_size_only_to_registered_same_origin_paths
  - url_util_preserves_query_and_fragment
  - url_util_wildcard_matches_one_segment_exactly
  - url_util_disabled_feature_targets_nothing
  - url_util_subfolder_prefix_stripped_before_match
  - url_util_drops_non_api_patterns
  - url_util_replaces_existing_size_and_w
  - url_util_strips_array_and_encoded_thumbnail_keys
  - srcset_2x_is_smallest_same_shape_preset_at_one_and_half_times
  - srcset_unknown_preset_is_one_x_only
  - srcset_empty_for_non_target_or_disabled
  - content_srcset_lists_numeric_presets_by_width
  - srcset_encodes_spaces_in_candidates
