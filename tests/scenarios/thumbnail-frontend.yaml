  - resources/js/core/template-engine/layout-editor/__tests__/components/ThumbnailPresetControl.test.tsx

notes: |
  e2e_browser=partial — 편집기에서 Img 규격을 고른 뒤 저장한 레이아웃이 사용자 화면에서 ?size= 로 요청되는 흐름과
  DPR 2 의 currentSrc 는 계획서 10절 Chrome MCP 매트릭스(10.3 편집기 컨트롤, T8-b)에서 잰다. 이 매니페스트는 판정 함수와
  위젯 단위를 잠근다.
