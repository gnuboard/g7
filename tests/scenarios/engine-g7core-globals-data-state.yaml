feature: G7Core 전역 API — dataSource.updateData 와 부모 상태 API

description: |
  G7Core.dataSource.updateData 가 데이터 소스 배열에 append(기본)와 prepend 로 붙이고, 루트 배열과 중첩 경로를
  다루며, 앱 미초기화, 없는 소스, 잘못된 경로, 배열 아닌 대상과 입력, 메서드 부재에서는 false 를 돌려주는지 본다.
  무한 스크롤처럼 페이지를 차례로 붙이는 경우도 본다. G7Core.state 의 getParent, setParentLocal, setParentGlobal 은
  레이아웃 컨텍스트 스택의 가장 최근 부모를 읽고 쓴다. 축 area 는 기능 묶음 하나씩이다.

axes:
  area: [data_source_append, data_source_prepend, data_source_errors, infinite_scroll, parent_state]

effects:
  - g7core_update_data_appends
  - g7core_update_data_prepends
  - g7core_update_data_rejects_invalid_input
  - g7core_update_data_supports_pagination
  - g7core_parent_state_api_reads_and_writes

test_files:
  - resources/js/core/template-engine/__tests__/G7CoreGlobals.test.ts
