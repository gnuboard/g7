feature: 검색엔진 드라이버 폴백 가드 (A5b)

description: |
  드라이버 폴백 가드는 `DriverRegistryService` 의 카테고리 레지스트리를 순회하며, 저장된
  드라이버가 현재 사용 불가면 기본 드라이버로 되돌린다. 검색엔진(`drivers.search_engine_driver`)
  만 그 레지스트리에 없어 가드 대상 밖이었다.

  결과: 검색엔진 플러그인을 선택해 저장한 뒤 그 플러그인을 제거하면 `scout.driver` 가 죽은
  값으로 남고, 공개 검색이 500 으로 떨어진다. 다른 카테고리는 같은 상황에서 기본 드라이버로
  폴백해 사이트가 살아남는다 — 같은 부류의 결함인데 이 축만 방어가 없었다.

  검색엔진은 등록 훅이 다르다(`core.search.engine_drivers` — Scout 엔진 맵). 플러그인에
  제2의 등록 훅을 요구하지 않도록, 카탈로그 조회가 그 훅을 함께 읽는다. 일반 드라이버 훅
  (`core.settings.available_search_drivers`)도 그대로 인식해 양쪽 등록 방식을 모두 받는다.

axes:
  # 엔진이 어디서 왔는가. 레지스트리 표면(카테고리 등재·기본 드라이버·설정/Config 키)은
  # 엔진 출처와 직교하는 단일 사실이라 축이 아니라 effects 로 판정한다 — 축으로 두면
  # 전개만 4배가 되고 조합마다 검증할 내용이 같아진다.
  engine_source: [core, plugin_scout_hook, plugin_generic_hook, removed]

effects:
  - search_category_registered_in_driver_registry   # 폴백 가드 순회 대상에 편입
  - core_search_engine_declared_as_core_driver      # mysql-fulltext 가 코어 드라이버로 인식
  - search_default_fallback_is_core_engine          # 폴백 대상이 mysql-fulltext
  - search_settings_key_matches_saved_field         # drivers.search_engine_driver 와 일치
  - search_config_key_matches_apply_site            # scout.driver — 실제 적용 지점과 동일
  - scout_hook_registered_engine_is_available       # 살아있는 플러그인 엔진을 사용 가능으로 판정
  - generic_hook_registered_engine_is_available     # 일반 드라이버 훅 등록분도 인식 (하위호환)
  - removed_plugin_engine_is_unavailable            # 제거된 엔진은 사용 불가 → 기본 엔진 폴백
  - admin_driver_options_include_search_category    # 관리자 응답의 available_drivers 에 포함

test_files:
  - tests/Feature/Settings/SearchDriverFallbackTest.php
  - tests/Unit/Services/DriverRegistryServiceTest.php
  - tests/Feature/Api/Admin/SettingsControllerDriverOptionsTest.php
