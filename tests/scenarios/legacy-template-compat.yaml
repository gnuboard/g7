# audit:allow test-scenario-coverage[cross_product] reason: 화면마다 기준 폼과 채우는 자리가 달라 템플릿 모양 × 화면 중 실체가 있는 조합만 시험한다
# (current_7_2·heavily_customized 는 판별·앵커 실패 경로라 대표 화면 하나로 충분). 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 옛 템플릿 호환 심 — 7.1.x 화면 계약 템플릿에 7.2.0 확장점·로그인 인계·재인증 자리 채우기 (PO 결정 2026-11-02)

description: |
  7.1.x 기본 템플릿을 복사해 쓰는 사이트가 7.2.0 에서 소셜 로그인·SSO 를 켜면 로그인·가입 단추 확장점과 로그인 인계 교환이 없고,
  비밀번호 없는 회원이 정보 수정 진입 확인·비밀번호 첫 설정에서 막힌다. LayoutExtensionService::applyExtensions 가 서빙 때
  LegacyContractShim 으로 빠진 자리를 채우고(원본·편집 모드는 그대로), 확장 조각 등록 판정은 호스트 화면이 있으면 그 확장점을 받는다.

test_files:
  - tests/Unit/Support/LayoutCompat/LegacyContractShimTest.php
  - tests/Feature/Layout/LegacyTemplateCompatServingTest.php

axes:
  template_shape:
    - legacy_7_1
    - current_7_2
    - heavily_customized
  screen:
    - user_login
    - admin_login
    - register
    - profile_reauth
    - change_password
    - other

effects:
  - login_extension_point_inserted_after_login_form
  - login_handoff_init_reuses_template_login_branch
  - admin_login_extension_point_inserted
  - admin_login_handoff_targets_admin
  - register_extension_point_inserted_before_register_form
  - verify_form_limited_to_password_members
  - no_password_reauth_section_inserted
  - verification_token_init_added
  - current_password_field_hidden_for_no_password_member
  - change_password_reauth_extension_point_inserted
  - shim_is_idempotent
  - current_contract_untouched
  - missing_anchor_keeps_layout_and_warns_once
  - other_layouts_untouched
  - legacy_template_accepts_contract_extension_point_rows
  - plugin_fragment_rendered_into_shimmed_extension_point
  - editor_response_has_no_shim
