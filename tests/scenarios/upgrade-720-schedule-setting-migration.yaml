feature: upgrade_720_schedule_setting_migration

description: |
  7.2.0 업그레이드 데이터 스텝 02·03 — 설정·환경변수에 있던 예약 주기를 코어 스케줄 행으로 옮긴다 (D10).
  02: SEO 설정 seo.sitemap_schedule(_time) → sitemap-generate 행 (hourly·daily·weekly 의미 동결, 옮긴 뒤 설정 키 삭제).
  03: 환경변수 GEOIP_SCHEDULE_FREQUENCY·_TIME → geoip-update 행 (daily·weekly(수) 의미 동결, .env 는 고치지 않음).
  카탈로그 기본과 같으면 행 유지, 다르면 cron + user_overrides(expression). 운영자가 이미 바꾼 행은 존중.
  행이 없으면 02 는 설정 키를 남긴다(재실행으로 이관). 두 번 돌려도 결과가 같다.

coverage_strategy: full

axes:
  surface: [sitemap_setting, geoip_env]
  stored: [absent, default, hourly, daily_custom, weekly_custom, invalid_time]
  schedule_row: [present, operator_overridden, missing]

exclusions:
  - { surface: geoip_env, stored: hourly, reason: "GeoIP 환경변수는 daily|weekly 만 받았다(7.1.x routes/console.php) — hourly 는 weekly 로 떨어지는 「알 수 없는 값」이며 weekly_custom 과 같은 경로다" }

effects:
  - sitemap_custom_period_moves_to_row
  - geoip_env_period_moves_to_row
  - operator_schedule_is_kept
  - legacy_seo_keys_removed
  - keys_kept_when_row_missing
  - migration_is_idempotent

test_files:
  - tests/Feature/Upgrades/Upgrade720ScheduleSettingMigrationTest.php
