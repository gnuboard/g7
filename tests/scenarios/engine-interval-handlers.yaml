feature: startInterval / stopInterval 핸들러 — 주기 실행 타이머

description: |
  카운트다운 같은 주기적 UI 갱신용 타이머 핸들러(engine-v1.45.0).
  지정 간격으로 액션을 반복 실행하고, id 로 멈추며, 같은 id 재등록은 기존 타이머를 교체한다.
  stopAllIntervals 는 전부 정리하고, id 누락이나 0 이하 간격은 거부한다.

axes:
  case: [periodic_tick, stop_by_id, same_id_twice, stop_all, invalid_params]

effects:
  - interval_actions_run_periodically
  - stop_interval_halts_timer_by_id
  - same_id_interval_replaces_existing_timer
  - stop_all_intervals_clears_every_timer
  - start_interval_rejects_invalid_params

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.intervals.test.ts
