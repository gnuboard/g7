  - flex_editor_make_flex_applies_token
  - flex_editor_item_role_shows_item_controls
  - flex_editor_disable_removes_flex_token
  - flex_editor_device_scope_enable_writes_branch
  # 세부탭 컴포넌트
  - scope_tabs_render_scheme_and_device_rows
  - scope_tabs_hide_scheme_row_when_disabled
  - scope_tabs_use_tablist_semantics
  - scope_tabs_click_reports_scope
  - scope_tabs_render_custom_range_from_node
  - scope_tabs_custom_range_add_validates
  - scope_tabs_keep_active_custom_tab
  - scope_tabs_custom_scope_priority_note
  - scope_tabs_reset_needs_override_and_handler

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/PropertyEditorModal.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/s7-property-controls.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/StyleScopeTabs.test.tsx

validation:
  note: |
    Vitest RTL 단위가 잰다. 브라우저 실측은 layout-editor-style-scope.yaml 과
    layout-editor-action-flex-condition.yaml 의 e2e spec 이 소유한다.
