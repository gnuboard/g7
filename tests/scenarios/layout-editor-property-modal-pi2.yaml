feature: 레이아웃 편집기 속성 모달 — 탭 가용성, 컨트롤 패치, scope 세부탭, 레시피 컨트롤, 조건 빌더, 정렬 박스

description: |
  속성 편집 모달과 그 안의 S7 컨트롤, 색 모드 × 디바이스 세부탭의 단위 시험을 묶는다. 소유
  매니페스트(layout-editor-style-scope, layout-editor-action-flex-condition, custom-translations)가
  이미 선언한 효과는 그쪽을 쓰고, 여기에는 그 매니페스트에 없던 동작만 둔다.

  - PropertyEditorModal: capability 별 탭 노출, initialTab, 고급 값 배지, 컨트롤과 설정 패치,
    고급 탭 권한 칩, 삭제, scope 세부탭과 콜백.
  - RecipePickerControls, ActionRecipeEditor: 자유 입력 폴백과 목록 복귀, 다국어 메시지 키화,
    최상위 node.actions 기록, 라우트 후보 드롭다운.
  - ConditionBuilder: legacy props.if 이관, 디바이스 scope 의 상속 노출과 역해석.
  - FlexEditor: 역할별 섹션, 정렬 박스 만들기와 해제, 디바이스 scope 기록.
  - StyleScopeTabs: 탭 렌더와 시맨틱, 클릭 scope, 커스텀 범위 추가 검증, 초기화 버튼 조건.

axes:
  area: [modal_tabs, modal_patch, modal_scope, recipe_pickers, action_editor, condition_builder, flex_editor, scope_tabs]

effects:
  # 탭 가용성
  - property_modal_style_tab_renders_controls
  - property_modal_advanced_tab_only_when_declared
  - property_modal_settings_tab_default_active
  - property_modal_empty_capability_keeps_core_props
  - property_modal_core_props_opt_out_no_editable
  - property_modal_initial_tab_applied_if_available
  - property_modal_advanced_badge_only_when_present
  # 패치
  - property_modal_style_control_patches_via_recipe
  - property_modal_settings_field_patches_props
  - property_modal_advanced_permissions_and_preserved
  - property_modal_permission_chip_patches_node
  - property_modal_delete_calls_on_delete
  # scope 세부탭(모달)
  - property_modal_style_tab_shows_scope_subtabs
  - property_modal_visibility_tab_device_row_only
  - property_modal_subtab_click_reports_scope
  # 레시피 컨트롤
  - page_picker_free_input_without_candidates
  - datasource_picker_edit_button_to_free_input
  - recipe_i18n_text_control_keyifies_plain
  - action_editor_add_writes_top_level_actions
  - action_editor_page_picker_lists_routes
  - action_editor_page_picker_degrades_to_input
  # 조건 빌더
  - condition_builder_legacy_props_if_migrates
  - condition_builder_device_scope_inherits_base_if
  - condition_builder_device_scope_reads_own_if
  # 정렬 박스
