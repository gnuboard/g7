feature: 본인확인 코드 발송 — 보내지 못했으면 그 자리에서 말한다

description: |
  민감 작업(회원 탈퇴·글 삭제 등)은 6자리 코드로 본인을 확인한다. 코드를 보내지 못하면
  사용자는 그 작업을 **영영 끝낼 수 없다**. 그러니 실패는 즉시 말해야 한다.

  조용히 깨지는 지점은 **챌린지 생성과 코드 전달이 다른 일이라는 것**이다. 전달이 실패해도
  챌린지 행은 만들어진다. 그 상태로 201 을 돌려주면 화면은 「전송된 6자리 코드를 입력해주세요」와
  남은 시간·남은 시도 카운트다운을 띄우고, 사용자는 오지 않을 코드를 기다리다 만료를 맞는다.

  실측(#599 세션A 2026-09-22 · `/mypage/profile` → [회원 탈퇴]): 챌린지
  `01a0c4c9-6dc7-739b-a096-4a87d65d5039` 가 생성 2초 뒤 `status=failed` 인데 API 는 201 과
  「인증 요청이 전송되었습니다」를 냈다. 코드는 bcrypt 해시로만 남아 복구할 수 없어,
  그 환경에서는 **회원이 스스로 탈퇴할 방법이 없었다**.

  판정은 공개 폴링(`getStatus`)과 **같은 자리**를 쓴다 — 생성 응답과 폴링이 서로 다른 기준으로
  성패를 재면, 화면이 한쪽은 성공으로 한쪽은 실패로 읽는 상태가 생긴다.

# axis 의미: 갈라지는 축은 «코드 전달이 성공했는가» 하나다. 두 값이 서로를 지킨다 —
# failed 만 보면 정상 발송까지 오류로 떨어뜨리는 수정이 통과하고, succeeded 만 보면
# 원래 결함이 그대로 남는다.
axes:
  dispatch: [failed, succeeded]

effects:
  - failed_dispatch_is_not_reported_as_success        # 실패를 201 로 포장하지 않는다
  - failed_dispatch_message_exists_in_all_locales     # 실패 문구가 ko·en 에 있다
  - successful_dispatch_still_returns_created         # 정상 발송은 201 을 유지한다
  - mail_channel_off_answers_502                      # 메일 채널을 끄면 502 (본인인증 메일도 채널 토글을 따른다, #699)

test_files:
  - tests/Feature/Identity/ChallengeSendFailureIsReportedTest.php

validation:
  audit_rule: backend-change-requires-test
  browser_check: |
    #599 세션A 실측(2026-09-22 · `POST /api/identity/challenges`, purpose=sensitive_action).
    수정 전: 201 + 「인증 요청이 전송되었습니다」(챌린지는 failed).
    수정 후: **502** + 「인증 코드를 보내지 못했습니다. 잠시 후 다시 시도하시거나 다른 인증 수단을 이용해주세요.」
  note: |
    502 를 쓰는 이유 — 요청은 올바랐고(422 아님) 권한도 있었으며, 실패한 것은 **바깥 전달 경로**다.
    이 환경은 SMTP 미설정이라 항상 실패하지만, 운영에서는 일시 장애에도 같은 경로를 탄다.
    문구가 재시도와 대체 수단을 함께 안내하는 것은 그 때문이다.
