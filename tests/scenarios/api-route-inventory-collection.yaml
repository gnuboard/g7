# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변종이다. route_kind 값은 각각 한 범위(plugin, module, core)에만 실재하고 bundled_fallback 은 미설치 모듈에만 해당하므로 세 축을 곱한 조합 대부분이 명목상이다. 회귀 가드는 effects 이고 모든 effect 가 test_files 의 @effects 로 귀속된다.
feature: API 레퍼런스 라우트 수집 (ApiRouteInventory 의 확장 web 라우트 수집과 미설치 확장 폴백)

description: |
  ApiRouteInventory::collect() 는 api/ 라우트에 더해 확장 소유가 확정되는 web 라우트(PG 결제 콜백, 웹훅)를 수집하고,
  소유 확장, URI, 메서드, 컨트롤러, 도메인 그룹을 보존한다. 코어 web 라우트와 확장 관리자 화면 web 라우트는 수집하지
  않으며, 범위에는 그 확장 소유 라우트만 담는다. 범위로 지정한 확장이 미설치여서 등록 라우트가 없으면 번들 라우트
  파일(src/routes/api.php)을 프로바이더와 같은 prefix, name 규약으로 읽어 폴백 수집하고, 라우트 파일이 없으면 빈 배열이다.

axes:
  scope: [plugin, module, core, nonexistent_module]
  source: [web_route, api_route, bundled_fallback, none]
  route_kind: [webhook, payment_callback, admin_screen, core_web, other_plugin]

exclusions: []

effects:
  - plugin_webhook_web_routes_collected
  - plugin_payment_callback_web_routes_collected
  - web_route_owner_and_uri_preserved
  - web_route_domain_group_classified
  - core_web_routes_excluded
  - extension_admin_screen_web_routes_excluded
  - other_plugin_web_routes_not_mixed
  - uninstalled_module_routes_collected_from_bundle
  - fallback_routes_follow_provider_conventions
  - fallback_excludes_web_admin_routes
  - missing_route_file_returns_empty

test_files:
  - tests/Unit/Support/ApiDoc/ApiRouteInventoryWebRouteTest.php
  - tests/Unit/Support/ApiDoc/ApiRouteInventoryFallbackTest.php
