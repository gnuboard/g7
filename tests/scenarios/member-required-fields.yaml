feature: member_required_fields

description: |
  비어 있는 필수 항목 판정(RequiredFieldsChecker)과 그 판정을 쓰는 관리자 회원 목록, 그리고 기존 회원 입력 요구.
  보통 회원은 「기존 회원에게도 입력 요구」를 켠 항목만, 필수 항목을 건너뛰고 만들어진 회원은 필수 항목 전부가 대상이다.
  목록은 행마다 미입력 항목을 싣고, 「필수 항목 미입력」과 「닉네임 중복」 필터, 운영자 추가 항목의 열과 검색 대상 정보를 준다.
  판정은 회원과 정의 버전별로 캐시하고 회원 값이 저장되면 지운다. 미입력 회원의 쓰기 요청은 `api` 그룹 전체에서
  403 `required_fields_pending` 으로 거부하되, 관리자 API 와 통과 표식이 붙은 라우트, 확장이 필터로 보탠 라우트는 통과시킨다.
  추가 정보 저장은 비어 있던 필수 항목만 받고, 다 채우면 건너뛴 표시를 지운다.

coverage_strategy: full

axes:
  case: [member_kind, locked, batch, list_required_missing, list_required_missing_none, list_nickname_duplicate, list_member_fields_meta, cache_version, cache_invalidation, write_block, allow_list, core_markers, admin_exception, deferred_complete, locked_not_blocked, middleware_order]

