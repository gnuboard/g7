feature: 렌더 전 init_actions 에서 등록한 startInterval 의 틱이 현재 화면 _local 을 읽고 화면에 쓰며, 화면을 떠나면 멈춘다 (engine-v1.91.1, 7.1.6)

description: |
  틱은 등록 문맥으로 돌았다. init 문맥은 렌더 전 데이터 스냅숏이고 컴포넌트 writer 가 없어, 틱의 식은 렌더 뒤 바뀐 값을 못 봤고
  틱의 setState 는 렌더 전 경로(저장소 B 만)로 써서 저장소 A 의 같은 키에 가려졌다(본인인증 전체화면 남은 시간·재전송 대기 정지).
  stopAllIntervals 호출처가 없어 화면을 떠나도 돌았다. 엔진은 init 문맥의 시작 세대(__initRouteGeneration)로 그런 타이머를 알아보고,
  틱마다 _global·_local 을 현재 값으로 다시 읽어 액션 밖 writer(setLocal)로 쓰며(엔진 병합 규칙·동작 문맥 격리), 세대가 바뀌면 멈춘다.
  축 case 는 렌더 뒤 틱이 만나는 상황(단위 시험)과 실제 전체화면(E2E)이다. 저장소 B 는 손으로 채우지 않는다.

axes:
  # 등록 문맥은 init_actions 하나뿐이라 곱하지 않는다 — 렌더 뒤 틱이 만나는 상황(단위) + 실제 전체화면(E2E)
  case: [component_setState, action_pending, merge_rules, route_changed, fullpage_countdown]

effects:
  - tick_reads_live_local                         # 렌더 뒤 채워진 _local 값(만료 시각)으로 틱 식을 계산한다
  - tick_write_reaches_screen                     # 클릭 setState 가 저장소 A 에 쓴 같은 키도 틱이 화면에서 줄인다
  - tick_does_not_write_into_pending_action_writer  # 다른 동작이 await 하는 동안 돈 틱이 그 동작의 writer 를 부르지 않고 동작 문맥을 되돌린다
  - tick_merge_matches_engine_rules               # 틱 쓰기의 병합은 엔진 규칙 — 빈 객체 교체로 errors 를 비운다
  - tick_keeps_pending_sequence_sync              # 대기 중인 sequence 의 동기화 변수를 틱이 바꾸지 않는다
  - tick_stops_after_route_change                 # 경로 세대가 바뀌면 타이머가 멈추고 다음 화면 _local 에 쓰지 않는다

test_files:
  - resources/js/core/template-engine/__tests__/DynamicRenderer.intervalTickFromInit.test.tsx
  - tests/Playwright/specs/identity-challenge-fullpage-countdown.spec.ts

validation:
  browser_check: 사용자·관리자 템플릿 본인인증 전체화면 — 남은 시간이 1초씩 줄고, [재전송] 뒤 대기 표시가 줄며, SPA 로 떠나면 intervals 에서 identity_challenge_tick 이 사라지고 다음 화면 _local 에 앞 화면 키 0
  note: |
    fail-first: 수정 전 ActionDispatcher·TemplateApp 로 되돌리면 case=component_setState(남은 시간 0 고정)·case=route_changed(타이머 생존) 가 red.
    action_pending·merge_rules 는 이 수정이 들인 setLocal 경로의 방어(동작 문맥 격리·엔진 병합·sequence 동기화 보존)를 잠근다 — 방어만 되돌린 변형에서 red.
