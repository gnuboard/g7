  - the_upgrade_steps_run_in_a_request_after_file_application  # R25 — [G8 측정 완료] 12단계 완주에서 apply(7)와 upgrade_steps(10) 사이에 vendor_copy·migrate 두 요청이 놓여 요청 경계 확보
  - spawn_failure_forces_inprocess_execution                 # R26 — [G8 측정 완료] 프로필 자체가 `exec,proc_open,shell_exec` 차단이고 그 위에서 설치 62단계·업데이트 12단계 2회 완주
  - bundled_extensions_and_language_packs_update_in_one_run  # §0.4 — [G8 부분] 한 실행 안에서는 「갱신할 것 없음」까지만 확인. 실제 갱신은 모듈 1.1.1→1.1.2 · 언어팩 1.0.2→1.0.3 을 각각 버튼/API 로 성립시켰다
  - the_admin_screen_stays_reachable_while_maintenance_is_on # [G8 측정 완료] 공개 홈 503 인 동안 status·advance·dismiss 200 + 관리자 화면 200 — **우회 쿠키 없는 새 클라이언트**로 측정
  # (승격됨 — `preflight_blocks_the_run_when_target_paths_are_not_writable` 는 이제 effects 에 있다.
  #  권한을 인위로 뺏는 대신 진단을 대역으로 갈아 끼워 재며, 「막혔다」뿐 아니라
  #  **아무것도 바꾸지 않은 채 막혔다**(`files_were_applied=false`)까지 단언한다.)

