# audit:allow test-scenario-coverage[cross_product] reason: issue:#609 단계 전수 완주는 실제 릴리스 ZIP 을 내려받아 파일을 교체하고 마이그레이션을 돌린다 — 테스트 프로세스 안에서 수행하면 저장소 자신이 교체되고 실패 시 되돌릴 대상이 테스트 환경이 된다. 게다가 `execution_mode=inprocess`·`spawn_fallback=forced_inprocess` 축은 `disable_functions` 로만 재현되는 실행 프로세스의 성질이라 PHPUnit/Playwright 어느 쪽도 그 조합을 만들 수 없다(계획서 §8 자동화 한계). 경계 조건(순서 불변식·권한·착수 가드·안전 기본값·재개/점유)은 test_files 가 전수 커버하고, 조합 종단은 P0 격리 환경 실측(§9 S13, G8)이 담당한다.

feature: 코어 업데이트 웹 단계 실행 (무CLI 호스팅)

description: |
  코어 업데이트는 지금까지 CLI 전용이었다. 환경설정 화면은 `php artisan core:update`
  명령어를 문구로 안내할 뿐이라, SSH 가 없는 호스팅에서는 코어를 올릴 수단이 없었다.

  이 매니페스트는 **웹 버튼만으로 코어가 올라가고, 중간 실패 시 자동으로 되돌아오는**
  동선의 시나리오 매트릭스다. 핵심은 세 가지다:

  1. **한 요청 = 한 단계.** 파일을 교체한 프로세스가 사라진 클래스를 참조하면 fatal 이
     난다(§7 R25). 특히 업그레이드 스텝은 파일 적용 **다음 요청**에서 돌아야 하고, 그
     요청이 곧 신버전 코드로 부팅된 새 프로세스다 — 무CLI 환경에서 spawn 격리를 대신하는
     것이 이 성질이다. 진행 지점은 상태 파일이 갖고, 브라우저는 그것을 이어 호출한다.

  2. **웹에는 위험한 선택이 없다 (D27).** `--force`(버전 비교 생략) · `--prune`(전체
     덮어쓰기 + 삭제) · `--no-backup`(되돌릴 것 없음) · `--no-maintenance` 는 CLI 전용으로
     남고 웹 동선에는 **입력 표면 자체가 없다**. 검증으로 거르는 형태를 택하지 않은 이유는
     규칙 한 줄만 풀면 켜지는 값이 남기 때문이다.

  3. **실패는 조작 없이 되돌린다 (D10).** 단계가 실패하면 되돌리기 대기 상태로 전이하고,
     다음 호출이 백업 복원을 수행한다. 복원까지 실패한 경우에만 수동 복구 절차를 연다.
     화면에서 가장 중요한 정보는 「실패했다」가 아니라 **「지금 사이트는 멀쩡하다」**이다.

  권한은 설정 수정과 **다른 등급**이다 (D4) — 설정을 고치는 것과 코어를 갈아 끼우는 것은
  실패 시 되돌리는 비용이 다르다. 그 권한이 없는 관리자에게는 화면에서 영역 자체가
  보이지 않는다(비활성이 아니라 미표시).

  수동 ZIP 경로(㉯ — D18)는 아웃바운드가 막힌 서버용이다. 운영자가 릴리스 ZIP 을 FTP 로
  올려 두고 고급 접기에서 고르면, 이후는 자동 내려받기와 **같은 단계식 파이프라인**을
  탄다 — 새 로직을 만들지 않는다(§7 R28).

axes:
  # 착수 지점
  actor: [with_permission, without_permission]          # D4 — 신규 권한 보유 여부
  source: [github_download, manual_zip]                 # ㉯ (D18) — 자동 내려받기 / 운영자 ZIP
  run_state: [idle, running, rolling_back, finished]    # 화면이 고르는 W6 4상태의 근거

  # 착수 선택 (D27 이 남긴 넷)
  bundled_extensions: [on, off]                         # D28 — 번들 확장·언어팩 함께
  rebuild_search_index: [on, off]                       # 그 창에서만 유효 (재생성 옵트인)
  layout_strategy: [overwrite, keep]                    # D29 — 전역 전략

  # 실행 환경
  execution_mode: [subprocess, inprocess]               # 무CLI 는 in-process 로 판정된다
  spawn_fallback: [not_needed, forced_inprocess]        # §7 R26 — 스폰 불가 시 강제 전환

  # 진행·실패
  failing_step: [none, preflight, download, apply, upgrade_steps, bundled]
  rollback_outcome: [not_needed, restored, restore_failed]
  handoff: [none, continued, exhausted]                 # 업그레이드 스텝의 새 프로세스 요청

  # 동시성·재개
  concurrency: [single, duplicate_request, stale_claim]

