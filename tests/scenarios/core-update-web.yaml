  # 아래는 **아직 재는 테스트가 없다**. 무CLI(P0) 프로필에서만 재현되는 축이라 PHPUnit·
  # Playwright 어느 쪽으로도 자동화할 수 없다 — `disable_functions` 는 실행 프로세스의
  # 성질이고 테스트 프로세스가 그것을 바꿀 수 없기 때문이다(§8 자동화 한계).
  # G8(브라우저 실측 전수)이 P0 환경에서 수행하며, 그때까지 이 목록이 미커버 사실을 소유한다.
