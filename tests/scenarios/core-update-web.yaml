  # G8 실측 결과 (2026-09-02 · P0 무CLI 프로필 `http://localhost:8090`). 항목은 **지우지
  # 않는다** — 사람이 한 번 재었다는 사실과 자동으로 재는 테스트가 생겼다는 사실은 다르고,
  # 지우면 census 에서 빠져 다음 릴리즈에 다시 미커버로 남는다. 각 줄의 주석이 그 결과를
  # 소유하며, 상세 근거는 계획서 §9.11.2 · §9.11.4 D군에 있다.
  - a_failing_step_rolls_back_without_operator_action        # D10 — [G8 측정 완료] 손상 ZIP 으로 download 단계 실패 → 조작 없이 rolled_back, `restored=true`·`maintenance_left_on=false`, 홈 200 복귀
