coverage_strategy: pairwise

# 「단계 전수 완주」를 PHPUnit 으로 재지 않는 이유: 그 흐름은 실제 릴리스 ZIP 을 내려받아
# 파일을 교체하고 마이그레이션을 돌린다. 테스트 프로세스 안에서 수행하면 저장소 자신이
# 교체되고, 실패 시 되돌릴 대상이 테스트 환경 자체가 된다. 그래서 이 매니페스트는
# **경계 조건**(순서 불변식 · 권한 · 착수 가드 · 안전 기본값 · 재개·점유)을 자동으로 잠그고,
# 종단 완주는 P0 프로필의 실측으로 남긴다.
#
# `execution_mode` · `spawn_fallback` 축은 러너(`CommandRunnerResolver`)가 소유하고 G1 이
# 이미 등가 계약 테스트로 고정했다. 이 매니페스트는 그 러너를 **경유한다**는 사실만 잰다
# (`the_web_pipeline_covers_every_service_call_the_cli_makes` 가 그 통로를 본다).
