feature: 검색 인덱스 재생성 뒤 잔존 — 표 재구축 안내

description: |
  InnoDB 숨은 문서 번호(FTS_DOC_ID) 연결이 어긋난 표는 FULLTEXT 인덱스를 DROP/ADD 해도 색인 누락이 남고, 표를
  `ALTER TABLE … ENGINE=InnoDB, ALGORITHM=COPY` 로 다시 만들어야 회복된다(개발 DB g7_ecommerce_products 실례).
  `repairStale()` 이 재생성 뒤 재점검에서 남은 인덱스에 대해, 안내 계약(ProvidesPersistentStaleAdvice)을 구현한 엔진의
  안내(표 이름 + 정확한 명령)를 보고·로그·명령 출력·API 페이로드에 싣는다. 자동 실행은 하지 않는다(큰 표는
  오래 걸리고 쓰기가 잠긴다). 안내를 주지 않는 엔진에는 명령을 붙이지 않는다(엔진 중립).

axes:
  case: [advice_report, advice_healed, advice_no_provider, fulltext_per_table, command_output, json_output]

effects:
  - persistent_stale_advice_in_report          # SearchIndexRepairReport::$advice·toArray()['advice'] 에 표·명령
  - persistent_stale_advice_logged             # Log::warning 에 advice
  - persistent_stale_advice_in_command_output  # search:index --repair 출력에 사유·명령·잠금 경고
  - no_advice_when_healed                      # 재생성으로 나으면 안내 없음
  - no_advice_for_engine_without_provider      # 안내 계약 없는 엔진은 잔존만 보고
  - fulltext_advice_one_command_per_table      # FULLTEXT 유지보수기는 표마다 명령 하나

test_files:
  - tests/Feature/Search/SearchIndexPersistentStaleAdviceTest.php

notes: |
  관리자 확장 업데이트 화면은 search_index 페이로드를 아직 그리지 않는다 — advice 는 응답에 실리기만 한다
  (페이로드 전달 계약은 search-index-notice-reaches-client.yaml).
