feature: ActionDispatcher 핸들러 계약 — 액션 하나하나가 지키는 약속

description: |
  엔진의 액션 디스패처가 각 핸들러·각 국면에서 지키는 약속을 잠근다. 231 케이스가 한 파일에
  모여 있는 이유는 대상이 하나이기 때문이고(`ActionDispatcher`), 그 안에서 갈리는 것은
  **어느 핸들러의 어느 국면인가** 다.

  ## 효과 단위를 `describe` 그룹으로 잡은 이유

  케이스마다 이름을 새로 지으면 목록이 테스트 파일의 사본이 되고, 사본은 갈린다. 그룹은 이미
  "이 핸들러가 지키는 약속" 을 뜻하고 케이스들은 그 약속의 조각이므로, 그룹을 계약 단위로 둔다.
  한 효과를 여러 케이스가 마킹하는 것은 정상이다 — 약속 하나를 여러 각도로 재는 것이다.

  ## 축

  `surface` 는 디스패처를 **어디서 건드리는가** 다. `binding` 은 props 에 핸들러를 다는 단계
  (이벤트 종류 판정·key 필터·커스텀 컴포넌트 이벤트 승격), `execution` 은 실제 실행 단계
  (핸들러별 동작·상태 병합·격리 상태), `security` 는 외부 코드·출처를 다루는 자리다.
  보안 축을 따로 세운 이유는 그 자리의 실패가 **기능 실패로 보이지 않기** 때문이다 —
  프로토타입 오염이나 출처 우회는 화면이 멀쩡한 채로 성립한다.

axes:
  surface: [binding, execution, security]

