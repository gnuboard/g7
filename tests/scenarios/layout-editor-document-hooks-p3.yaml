# π3 (#869) 레이아웃 편집기 시험 표식 부채 채우기 — 이 매니페스트는 아래 test_files 의 각 시험이 재는 효과를
# 시험 단위로 선언한다. 축 hook 은 시험 대상 단위이다.

feature: 레이아웃 편집기 문서 훅 — 인라인 키화 커밋, 레이아웃 문서 적재와 저장, 미리보기, 페이지 설정 위임

description: |
  편집기 문서 계층 훅(useInlineEdit 커밋, useLayoutDocument, useLayoutPreview, usePageSettings)이
  서버 요청 형식, 오류 분류, 세션 캐시, 반복 항목과 모달 편집의 저장 격리, 미리보기 창 열기를
  지키는지 잰다.

axes:
  hook: [inline_edit_commit, layout_document, layout_preview, page_settings]

effects:
  - keyify_named_param_lang_node_after_chip_move_creates_key
  - keyify_chip_value_on_param_key_skips_rekeyify
  - keyify_chip_editor_change_posts_plain_base_and_buffers_sentence
  - keyify_lang_key_with_data_avoids_raw_t_in_value
