feature: admin_trailing_slash_route

description: |
  끝 슬래시가 붙은 관리자 경로(`/admin/`)도 끝 슬래시 없는 경로(`/admin`)와 같은 라우트로 매칭된다.
  클라이언트 라우터의 `Router.match()` 가 들어온 경로의 끝 슬래시를 정규화하지 않아 `/admin/` 이
  어떤 라우트에도 매칭되지 않고 404 로 떨어지던 결함의 브라우저 회귀 가드다. 로그인이 풀린 상태로
  접근하면 대시보드 → 로그인 리다이렉트 흐름을 타야 한다(404 페이지 노출 0).

# 입력 axis — 두 값 모두 tests/Playwright/specs/admin/admin-trailing-slash-route.spec.ts 의 시험 하나씩이 잰다.
axes:
  trailing_slash: [present, absent]

effects:
  # 미인증 접근이 404 가 아니라 /admin/login 으로 리다이렉트되고 404 안내 문구가 없다
  - redirect_to_login_not_404

test_files:
  - tests/Playwright/specs/admin/admin-trailing-slash-route.spec.ts
