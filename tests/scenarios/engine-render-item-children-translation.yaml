feature: 반복 렌더(renderItemChildren)의 표현식 결과 $t: 번역 후처리

description: |
  반복 문맥에서 그리는 자식의 표현식 결과가 `$t:` 문자열이면(삼항 연산자의 양쪽 경로, 하이픈 있는 모듈 키 포함)
  번역해서 그린다. 정적 `$t:` 텍스트는 종전대로 번역하고, `raw:` 바인딩은 번역하지 않으며 내부 마커를 벗겨 내보낸다.
  `$t:` 가 아닌 결과는 번역을 시도하지 않는다. 축 source 는 문구가 나오는 자리 하나씩이다.

axes:
  source: [ternary_true, ternary_false, unhyphenated_key, static_text, raw_binding, non_translation_result]

effects:
  - expression_translation_result_translated
  - raw_binding_kept_untranslated
  - non_translation_result_untouched

test_files:
  - resources/js/core/template-engine/__tests__/renderItemChildren-translation.test.ts
