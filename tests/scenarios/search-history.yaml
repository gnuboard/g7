limitations:
  - "검색창 펼침 목록 UI(기본 템플릿 헤더·모바일 서랍·통합검색 화면)는 2단계다 — 이 매니페스트는 코어·엔진·관리자 카드까지만 잠근다."
  - "대소문자만 다른 검색어는 서버 콜레이션(대소문자 구분 없음)과 엔진 비교 키(toLocaleLowerCase)로 한 행이 된다. 악센트 무시 등 콜레이션의 나머지 규칙은 엔진(비회원)이 흉내 내지 않는다."
  - "비회원 목록은 그 브라우저에만 있다 — 다른 기기·브라우저와 공유되지 않고, 로그인할 때 그 브라우저의 목록만 병합된다."
