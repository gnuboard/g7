feature: 최근 검색어 (검색 범위별 보관 · 회원 서버 / 비회원 브라우저 · 로그인 병합 · 보관 기한 파기)

description: |
  검색창에 제출한 검색어를 검색 범위(scope)별로 보관한다(코어 7.1.5 · engine-v1.87.0).

  범위: 코어 예약 `core.site`(통합검색) + 활성 모듈·플러그인이 manifest `search_scopes` 로 선언한 `{식별자}.{이름}`.
  코어가 식별자 접두어를 붙여 남의 범위를 주장하지 못하게 하고, 선언하지 않았거나 비활성인 확장의 범위는 API 가 422 로
  거부하며 엔진은 조용히 건너뛴다. 같은 범위를 적은 검색창끼리 목록을 공유한다.

  저장: 회원은 서버(`user_search_histories`, `/api/me/search-history`), 비회원은 localStorage `g7_search_history`
  (`{v:1, autoSave, items:{범위:[{k,t}]}}`, 코어 필수 저장 키 — 쿠키 동의 플러그인이 합쳐 읽는다). 같은 검색어는 한 행으로
  맨 앞에 올리고, 범위별 보관 개수를 넘는 옛 검색어는 지운다. 기록은 검색창 제출 경로(`recordSearchKeyword`·
  `G7Core.searchHistory.record`)만 한다 — 주소에 직접 넣은 검색은 기록하지 않는다.

  자동 저장 끄기(회원 `users.search_history_auto_save` · 비회원 브라우저 칸): 기록을 멈추고 목록을 감춘다. 저장된 검색어는 남는다.
  로그인: 브라우저 목록을 서버에 시간순 병합(같은 검색어 하나)하고 성공하면 브라우저 칸을 지운다(실패하면 남긴다).

  운영자 설정: 환경설정 > 개인정보 「최근 검색어」 카드 — 사용 여부 + 범위별 보관 개수·보관 기한(일, 0 = 기한 없음).
  저장은 목록 모양(`privacy.search_history_scopes = [{scope, max_count, retention_days}]`) — 범위 id 에 점이 있어 맵 불가.
  보관 기한 파기는 개인정보 보유기간 핸들러 `search-history`(명단은 검색어 대신 회원·범위·건수·가장 오래된 검색일).
  탈퇴·삭제 시 그 회원의 검색어를 명시 삭제한다.

