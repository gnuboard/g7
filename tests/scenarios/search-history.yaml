  - invalid_scope_declaration_dropped_with_warning     # 이름 규칙·범위 밖 값은 버리고 설치·활성화 경고(search_scopes)
  - core_scope_always_present                          # core.site 가 늘 맨 앞
  - inactive_extension_scope_absent                    # 비활성 확장 범위는 집계에 없다
  - effective_value_precedence_settings_declared_default   # 설정 행 → 선언값 → 10개·기한 없음
  - retention_policy_keeps_inactive_scope_rows         # 끈 확장의 설정 행 기한도 파기 정책에 든다
  - settings_rows_one_per_declared_scope               # 관리자 응답 행은 선언 범위마다 한 행
  - saving_keeps_rows_of_inactive_scopes               # 저장은 화면에 없던 끈 확장 행을 보존
  - frontend_inline_lists_scope_max_count              # G7Config.searchScopes = 범위 → {max_count}
