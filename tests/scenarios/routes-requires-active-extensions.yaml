feature: 활성 확장 판정(_global.activeModules·activePlugins)과 routes.json requires — 브라우저·검색봇 동형 (#822)

description: |
  사이트가 고르는 모듈(게시판·쇼핑몰·페이지)과 플러그인(우편번호)을 꺼도 사용자 템플릿이 동작하도록, 코어가
  두 가지 판정 수단을 준다.

  1. 전역 상태 `_global.activeModules`·`_global.activePlugins` — 활성 확장 식별자 배열. 브라우저는 G7Config 의
     메타 배열에서, 검색봇 렌더러는 같은 출처(ModuleManager·PluginManager)에서 싣는다. 레이아웃 가드
     `{{_global.activeModules?.includes('id') ?? true}}` 는 두 렌더러에서 같은 값이어야 한다(키 없는 옛 코어 = 켜짐).
  2. routes.json 라우트 키 `requires` — 적힌 확장이 모두 활성일 때만 공개 routes 응답·SEO·사이트맵·정적 사본에
     실린다. 형식 오류는 라우트를 남기고 경고(fail-open). 편집기·layout:check-installed 는 거르지 않는다.

  같은 결함군: 템플릿 의존 역조회(getTemplatesDependingOn*)가 목록형 dependencies 를 읽지 못하던 문제.

