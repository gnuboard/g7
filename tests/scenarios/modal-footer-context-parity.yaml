feature: Modal 고정 하단(props.footer)과 본문 자식이 같은 데이터 문맥으로 그려진다 (#869 4라운드)

description: |
  본문 자식은 엔진이 Modal 노드의 확장 데이터 컨텍스트로 그리고, 고정 하단은 Modal 이 __componentContext.parentDataContext 로
  그린다. 엔진의 컴포넌트 문맥 메모가 확장 데이터 컨텍스트 전체를 의존성에 두므로 두 값은 같은 렌더의 같은 객체다. 모달을 여는
  길(엔진 openModal 없이 modalStack 만 바꿈, 레이아웃 컨텍스트 스택 직접 주입, 페이지 루트 Modal)과 상관없이 $parent._local,
  _local, _computed 가 두 표면에서 같아야 한다. 축 open_path 는 모달을 연 길이다.

axes:
  open_path: [direct_stack]

effects:
  - footer_and_body_share_data_context  # 고정 하단과 본문이 같은 $parent._local·_local·_computed·_global·route 를 그리고 본문 상태 변경을 함께 따른다

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/modalFooterContextParity.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/layouts/modalFooterContextParity.test.tsx
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/modalFooterUnquotedTranslation.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/layouts/modalFooterUnquotedTranslation.test.tsx

validation:
  note: |
    되돌림 확인: Modal 고정 하단을 종전처럼 빈 데이터 문맥(`__dataContext || {}`)으로 그리면 두 템플릿 모두 3건 red.
    #869 8차 회귀: skipBindingKeys 로 하단을 원문 그대로 그리게 된 뒤 하단 식 안 `$t:` 가 번역 문맥 없이 풀려(엔진은 `__translationContext` 를 넘기지
    않음) 단추가 「컴포넌트 로드 실패」 였다. 엔진이 부모 렌더 환경의 번역 문맥을 이어 준다. 종전 엔진에서 관리자 9건(하단 사이트 8, 짝 1)·사용자 2건 red.

