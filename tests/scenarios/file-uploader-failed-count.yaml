feature: 파일 업로더 — 업로드 신호 결과에 실패 수를 싣는다 (사용자·관리자 템플릿)

description: |
  저장 단추는 `emit-event upload:*` 로 업로더를 돌린 뒤 저장 요청을 보낸다. 업로드가 실패해도 신호 결과에 실패를 알리는
  값이 없어 저장이 이어졌다. 두 템플릿 업로더가 결과에 `failedCount`(이번 업로드에서 실패한 파일 수,
  올릴 것이 없으면 0)를 싣는다. 실패 문구는 업로더가 파일마다 이미 알린다.

# axis 의미:
#   upload_result — all_failed 모두 실패, partial 일부 실패, nothing_to_upload 올릴 파일 없음.
axes:
  upload_result: [all_failed, partial, nothing_to_upload]

effects:
  - upload_signal_reports_failed_count   # 업로드 신호 결과의 failedCount 가 실패한 파일 수와 같다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/FileUploaderUploadFailedCount.test.ts
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/FileUploaderUploadFailedCount.test.ts
