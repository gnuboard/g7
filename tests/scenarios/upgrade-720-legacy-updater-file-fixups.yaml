feature: upgrade_720_legacy_updater_file_fixups

description: |
  코어 7.2.0 데이터 스텝 `12_RestoreOperatorFaviconFromBackup`·`13_ReconcileRootFilesPlacedByLegacyUpdate`.
  7.1.x → 7.2.0 업데이트의 파일 적용은 7.1.x 코드가 해서 7.2.0 의 판정이 돌지 않았다(7.1.6 → 7.2.0 실측):
  운영자 `public/favicon.ico` 가 기본 아이콘으로 덮였고, 설치가 끝난 사이트 루트에 `g7-setup.php` 가 놓였고,
  루트 `index.php` 만 놓이고 `.htaccess` 가 빠졌다. 12 는 이번 업데이트 백업에서 운영자 아이콘을 되살리고,
  13 은 설치 완료 사이트의 압축 풀기 파일을 지우고 배포본 압축 해제본에서 루트 `.htaccess` 를 놓는다.

coverage_strategy: full

axes:
  case: [favicon_overwritten_operator_ico, favicon_empty_legacy_default, favicon_backup_selection, favicon_unrelated_current, setup_file_installed, setup_file_guarded, root_htaccess_missing, root_htaccess_guarded]

effects:
  - operator_favicon_restored_from_backup          # 업데이트가 덮은 운영자 파비콘을 백업에서 되살린다
  - empty_legacy_favicon_becomes_new_default       # 7.1.x 빈 기본 파일이었으면 새 기본 아이콘을 둔다
  - only_matching_newest_backup_is_used            # 이번 실행(from → to)의 가장 새 백업만 쓴다
  - unrelated_current_favicon_kept                 # 업데이트 뒤 넣은 다른 파일은 건드리지 않는다
  - favicon_restore_is_idempotent                  # 되살린 뒤 다시 돌려도 같다
  - installed_site_setup_file_removed              # 설치가 끝난 사이트의 압축 풀기 파일을 지운다
  - setup_file_kept_when_not_installed_or_foreign  # 설치 중이거나 그누보드7 파일이 아니면 둔다
  - missing_root_htaccess_placed_from_release      # 빠진 루트 .htaccess 를 같은 배포본에서 놓는다
  - root_htaccess_fix_is_idempotent                # 다시 돌려도 같다
  - existing_root_htaccess_kept                    # 이미 있는 루트 .htaccess 는 건드리지 않는다
  - unmatched_release_not_used                     # 루트 index.php 가 다른 배포본은 쓰지 않는다

test_files:
  - tests/Unit/Upgrades/Upgrade720LegacyUpdaterFileFixupsTest.php
