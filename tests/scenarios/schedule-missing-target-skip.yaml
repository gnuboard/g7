feature: 이 서버에 없는 명령·작업 클래스의 스케줄 등록 건너뛰기

description: |
  같은 DB 를 쓰는 서버가 여럿이면 한 서버(검수 서버에 먼저 올린 새 판)가 설치·업데이트로 공유 `schedules` 에 새 명령의 행을 넣거나
  command 를 새 값으로 바꾼다. 다른 서버의 스케줄러가 그 행을 자기 코드에 없는 명령·작업으로 매 주기 실행해 실패 이력·오류 로그·
  실패 알림이 쌓였다. 등록기(ScheduleRegistrar)는 이 서버에 없는 Artisan 명령·작업(Job) 클래스의 행에 실행 시점 건너뛰기 필터를 걸어
  두 실행기(서버 크론·웹 크론)가 실행하지 않게 하고 경고를 남긴다(같은 행·대상의 경고는 하루 한 번). 판정을 실행 시점에 하는 것은
  등록이 콘솔 커널 부팅 도중(routes/console.php)이라 그때 명령 목록을 읽으면 부팅이 다시 돌기 때문이다. 실행 역할과 무관하다.
  있는 명령·클래스의 행은 종전대로 실행한다. 콘솔 커널에 없는 확장 명령(웹 크론)은 실행기와 같은 곳 — 행의 `command_class`, 없으면
  활성 확장의 명령 디렉터리 — 에서 찾고, `command_class` 는 실행기와 같은 조건(커맨드 하위 클래스이고 명령 이름이 같음)일 때만 있다고
  본다. 판정 자체가 예외면(콘솔 커널 명령 하나의 생성 예외 등) 건너뛰지 않고 실행하며(fail-open) 판정 실패 경고는 한 번만 남긴다 —
  예외가 필터 밖으로 새면 모든 행의 필터 판정이 예외가 돼 웹 크론 실행 전체가 멈춘다.

# 축 의미:
#   target — 행의 실행 대상 유형과 이 서버에 그 대상이 있는지.
#     artisan_command_class — 콘솔 커널에 없고 행의 command_class 가 명령 이름이 같은 커맨드.
#     artisan_extension_directory — 콘솔 커널에 없고 활성 확장의 명령 디렉터리에 있는 명령.
#     artisan_command_class_not_command — command_class 가 있는 클래스지만 커맨드가 아님.
#     artisan_command_class_name_mismatch — command_class 가 커맨드지만 명령 이름이 다름.
#     target_check_error — 대상 판정 중 예외(콘솔 커널 명령 목록을 읽지 못함).
axes:
  target:
    - artisan_missing
    - artisan_present
    - job_missing
    - job_present
    - artisan_command_class
    - artisan_extension_directory
    - artisan_command_class_not_command
    - artisan_command_class_name_mismatch
    - target_check_error

effects:
  - missing_artisan_command_row_is_skipped
  - missing_job_class_row_is_skipped
  - present_target_row_still_runs
  - skipped_row_warns_once
  - skip_applies_regardless_of_runtime_role
  - extension_command_outside_kernel_still_runs
  - invalid_command_class_is_not_a_present_target
  - target_check_error_fails_open_and_warns_once

test_files:
  - tests/Feature/Schedule/ScheduleRegistrarMissingTargetTest.php
