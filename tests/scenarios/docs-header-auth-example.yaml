# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "공개 문서의 헤더 인증 예제가 실제로 동작하는지 돌린다 (docs/backend/authentication.md 「예제: 헤더 인증 확장」, #798 D24)"

description: |
  공개 문서의 헤더 인증 예제가 실제로 동작하는지 돌린다 (docs/backend/authentication.md 「예제: 헤더 인증 확장」, #798 D24)
  예제 확장(`Tests\Support\Docs\HeaderAuthExample`)을 등록하고 프록시 헤더 → 회원 생성 → 인계 코드 302 → 로그인 화면의 교환 →
  토큰까지 한 바퀴 돈다. 회사 도메인의 비밀번호 로그인이 막히는지도 본다.

axes:
  member: [new, existing]
  proxy: [trusted, untrusted]
  purpose: [login]

effects:
  - header_example_creates_member_and_hands_off
  - header_example_handoff_exchanges_to_token
  - header_example_reuses_existing_member
  - header_example_rejects_untrusted_proxy
  - header_example_blocks_company_password_login

test_files:
  - tests/Feature/Docs/HeaderAuthExampleTest.php
