# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "관리자 로그인 인계 `POST /api/auth/admin/login/handoff` (#798 K1)"

description: |
  관리자 로그인 인계 `POST /api/auth/admin/login/handoff` (#798 K1)
  외부 인증이 관리자 경로(`admin`)로 발급한 인계 코드를 관리자 로그인 화면이 교환하면 관리자 비밀번호 로그인과 같은 세 형태
  (인증 완료 · 2단계 인증 · 비밀번호 변경)로 답한다. 관리자가 아닌 회원은 휴면 해제 없이 403, 경로가 다른 코드는 422.

axes:
  guard: [admin]
  response: [authenticated, two_factor_required, password_change_required]
  user: [non_admin_dormant]
  code: [wrong_guard, reused]

effects:
  - admin_handoff_issues_token
  - admin_handoff_matches_login_shape
  - admin_handoff_two_factor_step
  - admin_handoff_password_change_step
  - admin_handoff_non_admin_forbidden
  - admin_handoff_keeps_dormant
  - admin_handoff_rejects_user_code
  - user_handoff_rejects_admin_code
  - admin_handoff_single_use

test_files:
  - tests/Feature/Auth/AdminLoginHandoffTest.php
