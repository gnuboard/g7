  - action_menu_item_click_runs_and_closes
  - action_menu_disabled_item_ignored
  - action_menu_closes_on_outside_click
  - action_menu_danger_item_styled
  - action_menu_stays_inside_viewport
  # 키보드로 열고(children 트리거 포함 Enter·Space·아래 화살표) 항목을 화살표로 옮겨 Enter·Space 로 고르며 Escape 로 닫는다 — 반응·스크랩 관리 회원 이름 메뉴(K1 후속 2026-10-06)
  - action_menu_keyboard_operable
  # 글자 없는 아이콘 트리거(DataGrid 행 메뉴 …, 게시판 목록·글 상세의 ⋮)도 이름을 단다 — ariaLabel, 없으면 공용 「작업」. DataGrid 는 작업 열 머리말을 넘긴다(K2 후속 2026-10-07, O-KF-1)
  - action_menu_trigger_has_accessible_name
