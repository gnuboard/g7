feature: 레이아웃 편집기 — 편집기 스펙 묶음 실패 알림과 다시 시도

description: |
  `GET /api/templates/{id}/editor-spec-bundle` 이 실패하면(4xx, 5xx, 네트워크) 편집기가 아무 표시 없이
  팔레트, 스타일 컨트롤, 상태 전환 토글을 빈 채로 보여 주었다. 설계 확정(2026-11-09, #869)으로 편집기 안에
  알림과 다시 시도 단추를 보이고, 다시 시도는 묶음을 다시 요청한다(개별 엔드포인트로 되돌아가지 않는다).

axes:
  case: [spec_bundle_http4xx, spec_bundle_http5xx, spec_bundle_network, spec_bundle_none]

effects:
  - editor_spec_bundle_failure_shows_alert_with_retry
  - editor_spec_bundle_retry_requests_bundle_again
  - editor_spec_bundle_success_shows_no_alert

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/LayoutEditorChrome.specLoadError.test.tsx
