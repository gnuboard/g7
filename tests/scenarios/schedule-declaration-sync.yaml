feature: 스케줄 선언 동기화 — 코어 카탈로그·확장 getSchedules → DB 등록부 (7.2.0)

description: |
  routes/console.php 에 하드코딩하던 예약을 DB 행으로 옮기는 동기화 계층이다.
  코어는 config/core.php 의 schedules 카탈로그를, 모듈·플러그인은 getSchedules() 선언을
  schedules 테이블로 동기화하고, 운영자가 화면에서 바꾼 값은 user_overrides 로 보존한다.

  적용 지점:
    - 코어: CoreScheduleSeeder(설치 DatabaseSeeder · 업데이트 reloadCoreConfigAndResync).
    - 확장: Module/PluginManager::syncDeclarativeArtifacts → ExtensionScheduleSyncHelper,
      제거(데이터 삭제) 시 행·이력 정리, 제거 모달 공유 데이터 집계.
    - 선언 검증: ScheduleManifestValidator (거부 목록·코어 허용목록·선언 유형·잠금 분 범위).

  같은 도메인의 다른 축은 매니페스트를 나눴다(축이 서로 독립이라 한 곱으로 묶으면 무의미한 조합이 폭발한다):
    schedule-registry-model.yaml(스키마·모델·조회) · schedule-condition-evaluator.yaml(실행 조건) ·
    schedule-language-pack-seed.yaml(언어팩 seed).

coverage_strategy: pairwise

axes:
  owner: [core, module, plugin]
  declaration_shape: [new_schema, legacy_schema, invalid]
  sync_run: [first, second_unchanged, after_operator_edit, after_declaration_removed, after_format_upgrade]

exclusions:
  - { owner: core, declaration_shape: legacy_schema, reason: "코어 카탈로그는 처음부터 새 형식이다 — 옛 형식 정규화는 확장 경로만" }
  - { owner: core, declaration_shape: invalid, reason: "코어 카탈로그 전건 유효는 ScheduleManifestValidatorTest 가 고정한다 — 무효 선언 건너뛰기는 확장과 같은 헬퍼 경로(ExtensionScheduleSyncHelperTest)" }
  - { owner: core, sync_run: after_format_upgrade, reason: "코어 카탈로그는 처음부터 새 형식이라 옛 자동 이름 행이 없다 — 이어받기는 확장 경로만" }
  - { declaration_shape: legacy_schema, sync_run: after_format_upgrade, reason: "형식 전환 후 동기화는 정의상 새 형식 선언이다 — 옛 형식 선언은 자동 이름 그대로라 이어받을 대상이 없다" }
  - { declaration_shape: invalid, sync_run: after_format_upgrade, reason: "무효 선언은 건너뛰고 기존 행을 남긴다(invalid_declaration_is_skipped_and_row_kept) — 이어받기 전에 검증에서 빠진다" }

effects:
  - catalog_matches_legacy_console_registrations
  - catalog_gc_commands_are_allowlisted
  - catalog_conditions_are_resolvable
  - catalog_ttl_minutes_are_preserved
  - catalog_filter_runs_before_sync
  - seeder_creates_core_rows
  - seeder_is_idempotent
  - seeder_preserves_operator_overrides
  - seeder_removes_rows_dropped_from_catalog
  - seeder_leaves_custom_rows_alone
  - core_resync_runs_schedule_seeder
  - legacy_declaration_is_normalized
  - invalid_declaration_is_skipped_and_row_kept
  - extension_sync_preserves_overrides_and_removes_stale
  - legacy_named_row_is_adopted_by_new_name
  - uninstall_with_data_removes_schedules_and_history
  - empty_declaration_blocks_cleanup
  - uninstall_modal_counts_schedules
  - validator_rejects_denylisted_and_unlisted_core_commands
  - validator_rejects_shell_and_url_declarations
  - validator_bounds_overlap_minutes

# E2E axis 없음: 데이터 계층(시더·동기화·검증기)만 다룬다. 화면은 S5·S6 의 스케줄 화면 매니페스트와
# Chrome MCP 매트릭스(계획서 §10 — 확장 제거 모달의 스케줄 N건 포함)가 소유한다.

test_files:
  - tests/Feature/Seeders/CoreScheduleSeederTest.php
  - tests/Feature/Extension/ExtensionScheduleSyncHelperTest.php
  - tests/Unit/Extension/Validators/ScheduleManifestValidatorTest.php
