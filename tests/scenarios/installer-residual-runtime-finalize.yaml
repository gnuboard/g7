feature: 설치 잔여 런타임 파일 정리

description: |
  웹 설치는 진행 중 DB 계정과 APP_KEY 를 `.env` 가 아니라 `storage/installer/runtime.php` 에 잠깐 둔다. 설치가 끝나면
  `.env` 에 합치고 지우는데, 지우지 못한 채 남으면 그 파일이 `.env` 대신 쓰여 서버를 옮기며 `.env` 를 고쳐도 반영되지 않았다.

  - 설치 마무리: 삭제가 실패하면 한 번 더 지워 보고, 그래도 안 되면 내용을 비워 비밀값을 없앤다. 결과에 표시를 남겨
    설치 완료 화면이 직접 지우라고 알린다.
  - 7.1.6 업그레이드 단계: 설치가 끝난 사이트에 남은 파일의 값을 `.env` 로 옮기고 지운다. `.env` 의 빈 칸은 채우고,
    DB 정보가 다르면 실제로 접속해 보고 정하며, APP_KEY 는 지금까지 쓰인 값(런타임)을 채택한다. 바꾼 것이 있으면
    `.env` 사본을 남긴다. 기록에는 키 이름과 결정만 남고 값은 남지 않는다. 설치 중인 사이트는 건드리지 않는다.

axes:
  case: [no_runtime, install_in_progress, blank_env, app_key_differs, db_differs_env_works, db_differs_runtime_works, db_differs_none_works, rerun, log_redaction, finalize_delete_ok, finalize_delete_fails, finalize_delete_and_blank_fail, finalize_warning_text]

effects:
  - residual_step_skips_when_nothing_to_do                 # 런타임 파일 없음 · 설치 중 → 건드리지 않음
  - residual_step_fills_blank_env_and_removes_runtime      # 빈 칸 채움 + 사본 + 파일 삭제 + 프로세스 환경 갱신
  - residual_step_adopts_runtime_app_key                   # 앱 키가 다르면 지금 쓰이는 값(런타임)
  - residual_step_tests_connection_on_conflict             # DB 정보가 다르면 접속해 보고 정함
  - residual_step_is_idempotent                            # 다시 돌려도 같은 결과
  - residual_step_logs_keys_not_values                     # 기록에 값·경로 없음
  - finalize_removes_runtime_file                          # 설치 마무리: 평소에는 삭제
  - finalize_neutralizes_runtime_file_when_delete_fails    # 삭제 실패 → 재시도 → 내용 비움 + 표시
  - finalize_reports_runtime_cleanup_failure               # 비우지도 못하면 실패 표시 + 로그 + 경고 문구

test_files:
  - tests/Unit/Upgrades/FinalizeResidualInstallerRuntimeTest.php
  - tests/Unit/Installer/InstallerFinalizeRuntimeCleanupTest.php
