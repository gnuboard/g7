# 시나리오 매니페스트 — 확장 업데이트가 받은 소스 임시 디렉터리 정리 (#916 ④ 후속)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: extension_update_temp_cleanup

description: |
  모듈·플러그인·템플릿 업데이트는 GitHub·ZIP 에서 받은 소스를 `storage/app/temp` 아래 임시 디렉터리에 푼다.
  #916 에서 GitHub 받기가 백업 앞으로 옮겨지면서, 백업 생성이 실패하거나 다운그레이드 차단으로 멈추면 그 임시
  디렉터리가 스테이징의 finally 를 지나지 않아 남았다. 세 매니저(Module·Plugin·Template)가 바깥 실패 경로와
  다운그레이드 차단 직전에 임시 디렉터리를 지운다.

axes:
  operation: [update_temp_cleanup]

effects:
  - update_source_temp_dir_removed_when_backup_fails      # 백업 생성 실패·다운그레이드 차단으로 멈춰도 받은 소스 임시 디렉터리가 남지 않는다

test_files:
  - tests/Unit/Extension/ExtensionUpdateTempDirCleanupTest.php
