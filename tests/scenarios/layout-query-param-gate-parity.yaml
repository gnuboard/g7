feature: 화면 조회 조건과 서버 게이트 키의 정합 — 검색·필터 키가 조용히 버려지지 않는다

description: |
  목록 화면의 검색·필터는 필터 컨트롤 → navigate query → data_source params → FormRequest rules()
  → validated() 순서로 서버에 닿는다. 어느 단계에서 키 이름이 어긋나면 요청은 200 으로 끝나고
  목록은 조건 없이 그대로 나와, 운영자는 검색이 된 것으로 읽는다(스케줄 목록 검색어·모듈 필터,
  알림 발송 로그 검색대상·수신자/발신자 행 필터가 이 형태로 깨져 있었다).

  이 계약은 두 검사로 선다.
    - data_source_params_within_gate: GET data_source 의 params 키와 endpoint 쿼리 키가 그
      엔드포인트 FormRequest rules() 의 최상위 키에 있는지(`page` 는 페이지네이터가 직접 읽어 제외).
    - navigate_query_consumed: 자기 화면 경로로 navigate 하며 싣는 query 키를 같은 화면의
      data_source 가 `query.K` 로 읽는지. 화면 표시 상태 키는 사유 달린 allowlist.

axes:
  check: [data_source_params_within_gate, navigate_query_consumed]

effects:
  - dropped_query_key_detected
  - unconsumed_navigate_key_detected

test_files:
  - tests/Unit/Layouts/LayoutQueryParamGateParityTest.php
