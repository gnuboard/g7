feature: 알림 발송 로그 검색대상·다중 필터 — 고른 조건이 서버에서 그대로 적용된다

description: |
  알림 발송 로그 목록은 검색대상(전체/수신자/제목)과 상태·확장 유형 다중 선택을 보낸다.
  서버 게이트가 search_type 을 받고, 상태·확장 유형은 배열(스칼라는 배열로 승격)로 받아
  whereIn 으로 적용해야 한다. 화면은 배열 전체를 보내고, 행의 수신자·발신자 링크가 싣는
  recipient_user_id·sender_user_id 도 data_source 가 서버로 넘긴다.

axes:
  case: [search_subject, search_recipient, search_all, search_type_invalid, status_multi, scalar_compat, extension_multi, status_invalid, layout_sends_all_values, mobile_recipient_truncate]

effects:
  - search_scoped_to_selected_field
  - multi_value_filter_applied
  - invalid_input_rejected
  - recipient_cell_fits_card

test_files:
  - tests/Feature/Api/Admin/NotificationLogSearchFilterTest.php
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-notification-log-filter-arrays.test.ts
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-notification-log-mobile-recipient.test.ts
