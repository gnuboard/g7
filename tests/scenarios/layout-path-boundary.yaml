feature: 레이아웃 조각·확장 파일 경로의 OS 무관 정리와 폴더 경계 판정

description: |
  #144(공개) / #770(내부). 리눅스 서버에서 JSON 전용 확장의 정상 조각이 "허용된 디렉토리 외부" 로 판정돼 설치·업데이트가
  실패했다 — 수동 경로 정규화가 리눅스 절대경로의 맨 앞 `/` 를 잃었고, 조각 해석이 없는 `.g7.html` 후보를 존재 확인보다
  먼저 보안 검사해 실재하는 `.json` 으로 넘어가지 못했다. 같은 계열로 문자열 접두 비교가 이름이 비슷한 형제 폴더
  (`layouts-evil`·`base-x`)를 통과시켰고, 사이트가 `layouts` 라는 폴더 아래 설치되면 layouts 루트를 프로젝트 밖으로 잡았다.
  공용 헬퍼(PathGuard)가 루트(`/`·`C:/`·UNC)를 보존해 정리하고 폴더 경계로 포함을 판정한다. 테스트는 Windows 에서도
  드라이브 문자를 뗀 절대경로로 리눅스와 같은 분기를 태운다(WSL 리눅스에서 같은 테스트를 다시 돌려 확인한다).
  부수: 레이아웃 등록 실패·확장 자동 비활성화 로그가 번역 치환 인자를 빠뜨려 `:error` 같은 자리표시만 남기던 8곳을 고치고
  정적 가드로 잠근다.

