feature: 레이아웃 편집기 — 운영 화면 편집 진입 단추와 편집기 주소 복원

description: |
  운영 화면 편집 진입 단추(EditEntryFab)는 #383(2026-05-25)에 만들어졌지만 어느 화면에도 붙지 않았다.
  설계 확정(2026-11-09, #869)으로 관리자 화면과 사용자 사이트의 일반 렌더 트리에 붙인다. 로그인했고
  레이아웃 편집 권한이 있는 사람(로그인 사용자 응답의 `can_edit_layouts`, 편집기 API 가드와 같은 판정)에게만
  보이고, 누르면 같은 탭에서 `/admin/layout-editor/{템플릿}?route={매칭된 라우트 정의 path}` 로 간다.
  편집기 쪽은 그 값으로 라우트를 선택해야 하고, 첫 복원이 주소와 기록을 건드리지 않아야 하며,
  기반 레이아웃과 확장 편집 주소는 새로고침 뒤에도 복귀 라우트를 지켜야 하고, 사람이 붙여 넣은
  사이트 주소도 정의 path 로 찾아야 한다.

