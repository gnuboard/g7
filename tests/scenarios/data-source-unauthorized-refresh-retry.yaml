feature: 데이터 요청 401 은 토큰 갱신·재시도 뒤에만 로그인으로 간다 (설계상 기본)

description: |
  레이아웃에 401 처리가 없을 때 데이터 요청 401 의 결말을 잠근다. ApiClient 인터셉터가 먼저 토큰을 갱신해 같은 요청을 한 번 다시 보낸다.
  다시 보낸 요청이 성공하면 화면은 그대로이고(로그인 이동, 토스트 없음), 그래도 401 이면 오류 처리 해석기의 시스템 기본값
  (`navigate {{auth.loginPath}}`)으로 로그인 화면에 간다. 갱신이 실패하면 ApiClient 의 onUnauthorized(세션 만료 로그인 이동)가 맡는다.
  축 retry 는 토큰 갱신 뒤 다시 보낸 요청의 결말이다.

axes:
  retry: [succeeds, still_unauthorized, refresh_fails]

effects:
  - refreshed_retry_keeps_screen_without_login    # 갱신 뒤 재시도가 성공하면 화면이 그대로이고 로그인 이동이 없다
  - persistent_unauthorized_navigates_to_login    # 재시도도 401 이면 레이아웃 처리가 없어도 시스템 기본값으로 로그인 화면에 간다
  - refresh_failure_hands_over_to_session_expiry  # 갱신이 실패하면 다시 묻지 않고 onUnauthorized 가 맡는다

test_files:
  - resources/js/core/template-engine/__tests__/DataSourceManager.unauthorizedRefreshRetry.test.tsx

validation:
  note: |
    λ 브라우저 실측(관리자 회원 목록 데이터 요청을 401 로 대체했는데 로그인으로 가지 않음)의 판정 근거. 대체가 첫 요청에만 걸리면 갱신과 재시도가
    받아 화면이 머무는 것이 설계대로다(retry=succeeds). 매번 대체하면 로그인으로 가야 한다(retry=still_unauthorized). 데이터 요청의 401 처리
    (ApiClient 인터셉터, 해석기 기본값)는 HEAD 와 같다. fail-first: 시스템 기본값의 401 항목을 빼면 still_unauthorized red, 인터셉터의 갱신 뒤
    재시도를 빼면 succeeds red.
