feature: 중단된 설치 재개 정합성 + Windows 권한 실패 원인 구분

# 재개 정합성 축(task_kind·marker_shape·new_action·worker_liveness)과 권한·OS 명령 축은
# 서로 독립이라 전조합이 의미를 갖지 않는다. exclusions 로 무의미 조합을 걷어낸 뒤
# 축쌍 단위로 커버한다.
coverage_strategy: pairwise

description: |
  중단된 설치를 "재시도" 로 이어서 진행할 때 완료 마커와 실제 DB 상태가 어긋나
  확장이 누락되는 문제, 그리고 Windows 에서 쓰기 실패 원인(ACL vs ReadOnly 속성)을
  구분하지 못해 같은 안내가 반복되던 문제의 시나리오 매트릭스.

  배경 — 재개 정합성:
    - db_cleanup 은 db_prefix 로 시작하는 테이블을 전부 DROP 한다. 따라서 "효과가
      DB 행으로만 남는" task 는 completed 마커가 남아 있어도 결과물이 소멸한다.
    - runInstallationTasks() 는 completed 마커만 보고 스킵하므로, 마커를 함께
      제거하지 않으면 그 확장은 파일만 있고 DB 등록은 없는 유령 상태가 된다.
    - 실제 발생: 1차 시도에서 sirsoft-board 가 db_cleanup 보다 먼저 설치·활성화된 뒤
      재시도에서 drop_tables 를 선택 → g7_modules DROP 으로 board 행 소멸 → 그러나
      module_install:sirsoft-board 마커가 잔존해 재설치 스킵 → 사용자 템플릿 설치가
      "필수 의존성 sirsoft-board (module)이 충족되지 않았습니다" 로 실패.
    - 기존 가드는 db_cleanup/db_migrate/db_seed 3종만 리셋했다.

  배경 — Windows 권한:
    - ReadOnly 는 ACL 이 아니라 파일 속성이라 두 값은 서로 독립이다. icacls 로
      Everyone:(OI)(CI)F 를 부여해도 ReadOnly 가 남아 있으면 is_writable() 은 계속
      false 를 반환해, 안내된 icacls 를 몇 번 실행해도 같은 실패 화면이 반복된다.
    - 압축 해제·백업 복원·동기화 도구가 ReadOnly 를 남기는 것이 흔한 원인이다.

axes:
  task_kind: [db_schema, extension_registration, language_pack, finalization, filesystem_only]
  marker_shape: [bare_id, id_with_target]
  new_action: [skip, drop_tables]
  worker_liveness: [no_worker, active_worker, stale_worker]
  permission_failure_cause: [acl_only, readonly_attribute, normal_directory]
  os_command_kind: [env_copy, permission_fix, translation_keys]

exclusions:
  - { new_action: skip, task_kind: "*", reason: "skip 은 어떤 마커도 제거하지 않는다 — task_kind 별 분기가 없어 조합이 무의미. 단일 효과 skip_preserves_all_markers 로 검증" }
  - { worker_liveness: active_worker, task_kind: "*", reason: "활성 워커 구간은 race 회피로 가드 자체를 건너뛴다 — task_kind 분류에 도달하지 않음" }
  - { permission_failure_cause: "*", marker_shape: "*", reason: "권한 판정과 완료 마커는 서로 독립한 축 — 교차 조합에 의미 없음" }
  - { permission_failure_cause: "*", new_action: "*", reason: "권한 판정은 existing_db_action 과 무관" }
  - { os_command_kind: "*", new_action: "*", reason: "OS 명령 생성은 existing_db_action 과 무관" }
  - { os_command_kind: "*", marker_shape: "*", reason: "OS 명령 생성은 완료 마커와 무관" }
  - { os_command_kind: "*", task_kind: "*", reason: "OS 명령 생성은 task 분류와 무관" }
  - { os_command_kind: "*", worker_liveness: "*", reason: "OS 명령 생성은 워커 상태와 무관" }
  - { os_command_kind: translation_keys, permission_failure_cause: "*", reason: "번역 키 존재 검사는 권한 실패 원인과 무관" }

effects:
  # 무효화 판정 — DB 행으로만 존재하는 결과물
  - db_schema_markers_are_invalidated
  - extension_install_markers_are_invalidated
  - extension_activate_markers_are_invalidated
  - language_pack_markers_are_invalidated
  - finalization_markers_are_invalidated

  # 보존 판정 — 파일시스템·환경 효과라 DROP 과 무관
  - filesystem_only_markers_are_preserved
  - cache_clear_marker_is_preserved

  # 마커 형태 파싱
  - bare_task_id_is_classified
  - targeted_marker_parses_task_id_before_colon
  - hyphenated_identifier_target_is_parsed
  - underscored_identifier_target_is_parsed

  # 분류 누락 방지 (잠금)
  - every_task_id_in_runner_is_classified

  # 기존 가드 의미 보존 (회귀 방지)
  - skip_preserves_all_markers
  - active_worker_preserves_all_markers
  - stale_worker_allows_takeover_reset
  - missing_completed_tasks_yields_empty_array
  - filtered_markers_are_reindexed_sequentially

  # 실제 회귀 시나리오 재현
  - board_installed_before_cleanup_reinstalls_on_retry

  # Windows 권한 실패 원인 구분
  - readonly_directory_is_detected
  - normal_directory_is_not_misdiagnosed_as_readonly
  - readonly_mode_returns_attrib_command
  - readonly_fix_command_clears_nested_contents   # 안내 명령을 실행하면 폴더 안쪽까지 풀린다 (#599 validate, Windows 실측)
  - readonly_mode_does_not_return_icacls

  # OS 별 명령 생성 (기존 회귀 가드)
  - platform_detection_returns_boolean
  - env_copy_command_matches_platform
  - env_copy_command_honors_base_path
  - env_copy_command_uses_windows_path_separator
  - permission_fix_command_ownership_mode
  - permission_fix_command_file_mode
  - permission_fix_command_uses_windows_path_separator
  - permission_translation_keys_exist
  - directory_create_guide_translation_keys_exist

  # 부정 효과 (절대 발생 금지)
  - installer_never_skips_an_extension_whose_db_row_was_dropped

test_files:
  - tests/Unit/Installer/InstallerReadonlyAttribClearsContentsTest.php
  - tests/Unit/Installer/ExistingDbActionGuardTest.php
  - tests/Unit/Installer/InstallerWindowsCommandsTest.php

manual_verification:
  - description: "재개 회귀 재현 — 확장이 db_cleanup 앞에 설치된 뒤 재시도"
    steps:
      - "fresh 환경에서 설치 시작 → 모듈 1개가 db_cleanup 보다 먼저 설치되는 지점에서 중단"
      - "재시도 화면에서 기존 DB 삭제(drop_tables) 선택"
      - "설치 로그에서 해당 모듈의 install/activate 가 '이미 완료' 로 스킵되지 않고 재실행되는지 확인"
      - "설치 완료 후 g7_modules 에 해당 모듈 행이 status=active 로 존재하는지 확인"
      - "사용자 템플릿 설치가 의존성 미충족 없이 통과하는지 확인"
  - description: "Windows ReadOnly 속성 안내"
    steps:
      - "storage 디렉토리에 attrib +R <path> /D 로 ReadOnly 속성 부여"
      - "인스톨러 0-welcome 화면 진입"
      - "icacls 안내보다 먼저 attrib -R 안내가 노출되는지 확인"
      - "attrib -R 실행 후 재진입하면 통과하는지 확인"
