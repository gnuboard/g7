feature: ActionDispatcher 프리뷰 모드 — 화면 밖 효과 핸들러 억제

description: |
  편집기 미리보기에서는 PREVIEW_SUPPRESSED_HANDLERS(navigate, navigateBack, navigateForward, replaceUrl, refresh, logout)를 실행하지 않고,
  apiCall, setState, toast 같은 나머지는 그대로 실행한다(engine-v1.26.1). 억제 레이아웃 기능 목록에는 redirect 가 있다.
  미등록 커스텀 핸들러는 프리뷰 모드에서만 throw 없이 warn 한 번 남기고 success 로 건너뛴다(engine-v1.50.0).

axes:
  case: [default_off, toggle_on, toggle_off, suppressed_list, non_suppressed_list, suppressed_layout_features, suppress_navigate, suppress_navigate_back, suppress_navigate_forward, suppress_replace_url, suppress_logout, allow_api_call, allow_set_state, allow_toast, off_navigate_runs, off_after_on_navigate_runs, unknown_handler_no_throw, unknown_handler_success, unknown_handler_warn_once, unknown_handler_throws_when_off, registered_custom_runs]

effects:
  - preview_mode_off_by_default
  - preview_mode_toggles
  - suppressed_handler_list_published
  - suppressed_layout_feature_list_includes_redirect
  - suppressed_handler_skipped_in_preview
  - non_suppressed_handler_runs_in_preview
  - navigate_runs_when_preview_off
  - unknown_custom_handler_silently_skipped_in_preview
  - unknown_custom_handler_skip_warns_once
  - unknown_custom_handler_throws_when_preview_off
  - registered_custom_handler_runs_in_preview

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.previewMode.test.ts
