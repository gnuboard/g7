feature: 코어 회원 항목 이름의 언어팩 번역 (Member Field Language Pack Seed)

description: |
  코어 회원 항목(이름, 닉네임, 휴대폰, 전화번호, 언어, 국가, 시간대, 홈페이지, 주소, 서명, 자기소개)의 이름과 예시 글은
  `config('core.fields')` 에 ko, en 만 적혀 있다. 다른 언어는 활성 코어 언어팩의 `lang-packs/_bundled/g7-core-ja/seed/fields.json` 이
  시딩 필터 `core.fields.config` 로 더한다. 팩을 켜고 끌 때 코어 항목 시더가 다시 돌아 DB 행에도 반영된다.

  번들 ja 코어 팩에 이 파일이 없으면 일본어 사이트의 가입 화면, 내 정보, 관리자 회원 폼, 환경설정의 가입 항목 표가
  코어 항목만 한국어로 보인다(확장 항목과 운영자 추가 항목은 각자의 경로로 번역된다).

axes:
  case: [filter_injects, bundled_pack_covers_core_fields]

effects:
  - core_pack_injects_member_field_names
  - bundled_ja_pack_translates_every_core_member_field

test_files:
  - tests/Feature/LanguagePack/LanguagePackFieldSeedTest.php
