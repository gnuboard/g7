feature: SEO 렌더 파이프라인(SeoRenderer) 단위 동작 목록

description: |
  봇 방문 렌더 `SeoRenderer::render()` 와 공통 파이프라인 `renderFromResolved()` 의 단위 동작 목록이다.
  URL → 레이아웃 매핑, meta.seo 활성·확장 토글 판정, 데이터 소스 호출과 초기 상태 반영
  (initLocal·initGlobal·init_actions·computed), vars·_seo 컨텍스트 주입, 메타 해석기 호출,
  분기별 필터 훅(og·twitter·structured_data·meta), 컴포넌트 HTML 변환, 블레이드 조립을 다룬다.
  효과 이름은 각 테스트가 지키는 동작 하나에 대응한다(`renderer_` + 동작). 라우트 meta.title 을
  해석기에 넘기는 동작은 `seo-title-route-fallback.yaml` 이 소유한다.

axes:
  # 이 파일의 테스트는 모두 봇 방문 진입점 render(Request) 로 들어간다.
  # 편집기 미리보기가 쓰는 renderFromResolved() 직접 호출은 SeoRendererRenderFromResolvedTest 몫이다.
  entry: [render_request]

