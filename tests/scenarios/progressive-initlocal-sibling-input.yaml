feature: 입력 도중 데이터 소스 initLocal 응답이 와도 같은 화면의 다른 `_local` 칸에 친 글자가 지워지지 않는다 (engine-v1.93.0)

description: |
  입력칸의 set-state target="local" 은 저장소 A 에 쓰고 B 에는 render:false 로 미러해, 데이터 컨텍스트의 `_local`(B 사본)은
  마지막 루트 다시 그리기 때 값이다. 데이터 소스 initLocal 갱신(progressive 응답·다시 받기·쿼리 갱신)이 `_localInit` 만 싣고 오면
  페이지 루트는 「아직 반영하지 않은 _localInit」 렌더에서 저장소 A 를 빼고 그 늦은 사본만 써서, initLocal 대상이 아닌 형제 칸이
  한 커밋 동안 앞 값으로 그려지고 그때 친 키가 앞 글자를 잃었다. 고친 뒤 페이지 루트는 그 렌더에서 렌더 시점의 저장소 B 를 쓴다.
  축 case 는 initLocal 을 싣는 세 갱신 경로와 「응답 처리 뒤, 커밋 전 입력」 이다. 저장소 B 는 손으로 채우지 않는다(실제 입력 이벤트 → setState 액션).

axes:
  case: [spa_entry_progressive_response_mid_typing, refetch_response_mid_typing, query_update_response_mid_typing, keystroke_between_response_and_commit]

effects:
  - sibling_input_value_kept_on_initlocal_commit   # 응답 반영 커밋마다 형제 칸이 친 값 그대로 그려진다(빈 값·앞 값 커밋 0)
  - initlocal_target_still_applied                 # initLocal 대상(폼)은 종전대로 서버 값으로 채워진다 — 저장소 B 에도 형제 칸 값이 남는다

test_files:
  - resources/js/core/template-engine/__tests__/TemplateApp.progressiveInitLocalSiblingInput.test.tsx

validation:
  browser_check: 일반 회원 마이페이지 → [내 정보 수정](SPA) → 본인 정보 응답을 잡아 두고 비밀번호 확인 칸에 5자 친 뒤 응답을 풀고 이어서 친다(키마다 칸 길이), 잡지 않는 자연 경합도 함께
  note: |
    fail-first: 수정 전 엔진으로 4 failed / 4(커밋 기록에 빈 값), 수정 후 4 passed.
