feature: core_update_rollback_apply_warnings

description: |
  코어 업데이트가 실패해 되돌린 뒤 파일 적용 단계의 루트 진입·보호 파일·서버 설정 조각 안내가 남지 않는다.
  적용 단계는 운영자가 고친 `deploy/**` 조각을 보존하고 새 판본을 `.dist` 로 옆에 두며 「합친 뒤 .dist 를 지우세요」를
  알린다. 되돌리기의 복원은 `.dist` 와 해시 원장을 걷는데, 관리자 화면 실행 상태(`run.warnings`)에 그 안내가 남아 없는
  파일을 합치라고 했다. 복원이 끝나면 적용 단계 안내를 경고에서 걷고 「되돌리며 해당 없어졌다」 통보로 바꾼다.
  명령줄 `core:update` 도 되돌린 뒤 같은 통보를 출력한다. 복원이 예외로 끝나면 안내를 남긴다.
  번들 단계의 부분 실패 경고(「코어는 정상 반영」)는 되돌린 뒤 「코어는 되돌렸고 이미 갱신된 확장은 그대로」로 바꾼다.

coverage_strategy: full

axes:
  case: [web_restore_finished, web_restore_threw, web_bundled_failure_then_rollback, cli_restore_finished]

effects:
  - apply_warnings_withdrawn_after_restore      # 복원이 끝나면 적용 단계 안내를 경고에서 걷는다
  - withdrawn_notice_added                      # 걷은 사실을 통보 1건으로 남긴다
  - other_warnings_kept                         # 복원 자신의 경고·적용과 무관한 경고는 남긴다
  - apply_warnings_kept_when_restore_failed     # 복원이 예외로 끝나면 적용 단계 안내를 남긴다
  - cli_prints_withdrawn_notice_after_restore   # 명령줄도 되돌린 뒤 같은 통보를 출력한다
  - cli_apply_warnings_printed_once              # 명령줄 적용 단계 안내는 한 번만 찍힌다
  - cli_withdrawn_notice_starts_on_its_own_line  # 되돌린 뒤 알림은 진행 막대 줄에 붙지 않는다
  - bundled_failure_warning_restated_after_rollback  # 번들 부분 실패 경고의 「코어는 정상 반영」을 「코어는 되돌렸고 갱신된 확장은 그대로」로 바꾼다

test_files:
  - tests/Feature/CoreUpdateRollbackApplyWarningsTest.php
