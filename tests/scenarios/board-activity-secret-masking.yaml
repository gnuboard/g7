feature: 사용자 활동/공개 프로필 목록의 비밀 본문 마스킹 (KVE-2026-1914 형제)

description: |
  공개 프로필(`GET users/{uuid}/posts`)과 마이페이지 활동(`GET me/board-activities`)은 본문
  일부(`content_plain`)를 함께 싣는데 Resource 를 거치지 않고 저장소 배열을 그대로 응답에
  싣는다. 공개 프로필 라우트는 `optional.sanctum` 이라 **미인증**으로 도달하므로, 타인의
  비밀글·블라인드 글 본문이 그대로 나갔다.

  결함의 형태는 **사문화된 옵트인 플래그**였다 — 저장소가 `is_public` 을 읽어 필터를 걸도록
  돼 있었지만 그 키를 설정하는 코드가 어디에도 없어 한 번도 적용되지 않았다. 판정을 열람자
  신원(`viewer_id`) 기반 fail-closed 로 뒤집었다.

  두 활동 유형이 **서로 다른 코드 경로**를 탄다:

  - activity_type=authored — 내가 쓴 글. 열람자 ≠ 대상 사용자면 마스킹(`$isOwnView`).
  - activity_type=commented — 내가 댓글 단 글. 이 목록에는 **타인이 쓴 비밀글**이 섞이므로
    글 단위로 판정한다(`$post->user_id !== $viewerId`). authored 축만 검증하면 이 분기가
    무보호로 남는다.

  가리는 것은 **본문뿐**이다. 행과 제목은 게시판 목록에서 이미 같은 수준으로 노출되며
  (`PostResource` 의 목록 규칙: 제목은 노출, 본문만 차단) 프로필 UI 도 비밀글/블라인드
  배지를 그린다 — 행을 지우면 결함 차단에 필요한 범위를 넘어 기능이 깎인다. 착수 단계에서
  행 제거로 구현했다가 철회한 이력이 있어, 행·제목 유지를 효과로 고정한다.

axes:
  viewer: [guest, other_user, owner]
  activity_type: [authored, commented]

exclusions:
  - { viewer: guest, activity_type: commented, reason: "마이페이지 활동 라우트는 auth:sanctum — 게스트가 도달할 수 없다. 공개 프로필 라우트는 authored 만 서빙한다" }

effects:
  - public_profile_masks_secret_post_content_for_others
  - public_profile_masks_blinded_post_content_for_others
  - public_profile_shows_own_secret_content_to_owner
  - commented_activity_masks_others_secret_content
  # 과차단 회귀 축 — fail-closed 로 뒤집으면서 본인 시야까지 좁히면 기능 축소다.
  - commented_activity_shows_own_secret_content_to_owner
  # 철회한 과잉 수정(행 제거)의 재도입 차단 — 본문 비노출만 단언하면 행을 통째로 지워도 green 이다.
  - activity_rows_and_titles_remain_visible

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/User/UserActivitySecretExposureTest.php
