feature: 검수 서버(stage)의 확장 수명주기 CLI 차단

description: |
  검수 서버는 운영 서버와 같은 DB 를 쓴다. 모듈·플러그인·템플릿·언어팩의 activate·deactivate·uninstall 은 공유 DB 의 확장 상태를
  바꿔 운영 서버에 바로 보인다(같은 종류 운영 활성 템플릿 끄기, `--delete-data` 로 운영 테이블 삭제). 명령 시작 가드가 stage 에서
  이 명령들을 수명주기 전용 안내(`common.console.runtime_role.lifecycle_stage`)와 함께 종료 1 로 끝낸다. install·update·
  refresh-layout·`extension:reset-files-from-bundled`·`core:execute-upgrade-steps` 는 새 확장을 검수 서버에서 시험하는 흐름이라 허용한다.
  live 는 종전과 같다.

# 축 의미:
#   case — 판정 경로. command_names 는 가드 목록의 이름이 실제 등록 명령과 맞는지(이름이 바뀌면 가드가 조용히 빠진다).
axes:
  case: [command_names, stage_blocked, stage_allowed, live_regression]

effects:
  - lifecycle_guard_names_match_registered_commands
  - stage_blocks_lifecycle_state_commands
  - stage_allows_install_update_and_maintenance_commands
  - live_runs_lifecycle_commands

test_files:
  - tests/Feature/RuntimeRole/StageLifecycleCommandGuardTest.php
