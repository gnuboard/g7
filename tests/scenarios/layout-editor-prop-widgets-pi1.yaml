# 레이아웃 편집기 속성 위젯(배열, 자식 목록, 옵션, 식별자, 대상 선택, JSON) 시험 표식
# #869 이월 0 회차(π1): tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_prop_widgets_pi1

description: |
  속성 모달의 구조 편집 위젯(ArrayItemsEditor, ChildrenListControl, OptionsListControl)이 항목 추가, 삭제, 이동, 다국어 키 생성을 노드 패치로 내보내는지,
  식별자 위젯(CoreDataKeyControl, CoreIdControl)의 문자 정리와 바인딩 디그레이드, ComponentTargetPicker 의 캔버스 pick 핸드셰이크,
  JsonBlockField 의 파싱과 검증을 잰다.

axes:
  subject: [array_items_editor, children_list_control, options_list_control, core_data_key_control, core_id_control, component_target_picker, json_block_field]

