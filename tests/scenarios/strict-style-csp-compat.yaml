notes: |
  이 매니페스트는 「코어가 그리는 화면」만 소유한다. 나머지 표면은 각자의 매니페스트가 맡는다.
    - 스타일 정책 문자열·헤더 조합·설정 저장·설정 화면: tests/scenarios/csp-header-setting.yaml
    - 설치 화면의 인라인 스타일 0: tests/scenarios/strict-csp-compat.yaml (installer_* effects, tests/installer/installer-no-inline.test.cjs)
    - 번들 템플릿의 본문 출력·아이콘 미리보기·로딩 막대: 각 템플릿의 tests/scenarios/content-inline-style-deferral.yaml
    - 플러그인: sirsoft-ckeditor5 editor-no-inline-style.yaml·editor-editing-view-style.yaml, sirsoft-daum_postcode postcode-no-inline-style.yaml,
      sirsoft-pay_kginicis standalone-pages-no-inline-style.yaml, sirsoft-pay_nhnkcp strict-csp-kcp-frame.yaml, sirsoft-totp bootstrap-qr-render.yaml,
      sirsoft-gdpr blocker-restore-style.yaml

  브라우저 실측(style_csp_*)은 Chromium 만 돈다(Firefox·Safari 미측정). 문서 응답에 정책 헤더를 덧붙여 재현하므로
  활성 템플릿·플러그인 사본이 수정된 번들이어야 통과한다. 스스로 스타일을 넣는 외부 라이브러리 화면(CKEditor 5 색상 선택기·Monaco 코드 편집기·
  react-select 태그 입력·다음 우편번호)은 고칠 수 없어 spec 의 상수 목록에 사유와 함께 두고 fixme 로 건다. CKEditor 5 편집 화면의
  서식(정렬·색·표·이미지 크기)은 편집기 플러그인이 CSSOM 으로 입혀 고쳤고 editor_formatting_visible_under_style_csp 가 잠근다
  (플러그인 쪽 단위 계약: sirsoft-ckeditor5 editor-editing-view-style.yaml).

  overlay_legacy_algorithm·layout_editor_chrome_regression·layout_editor_asset_regression 은 이번 작업으로 단언이
  바뀐 기존 회귀 테스트다. 덮개 알고리즘 테스트는 구현을 테스트 안에 복제해 단언하므로 실제 경로는
  overlay_no_style_element(실제 TemplateApp 메서드 호출)가 잠근다. 편집기 두 파일은 편집기 매니페스트
  (layout-editor-shell-entry·layout-editor-preview-canvas·layout-editor-page-state-switcher)와 함께 소유한다.
