feature: strict_style_csp_compat

description: |
  엄격한 스타일 CSP 호환 (공개 이슈 #163) — 코어가 그리는 화면에 인라인 스타일 0.

  운영자가 웹서버나 환경설정에서 `style-src 'self'; style-src-attr 'none'` 을 강제하면 다음 세 가지가 적용되지 않는다.
    (A) `<style>` 요소
    (B) HTML 문자열(innerHTML·dangerouslySetInnerHTML·서버 HTML)의 `style="…"` 속성
    (C) `setAttribute('style', …)`
  `el.style.x = …`·`el.style.cssText = …`·`el.style.setProperty()`·React `style={{…}}` 같은 CSSOM 대입은 막히지 않는다.
  종전에는 셸의 지연 안내 숨김 규칙이 `<style>` 블록에 있어 정상 화면 아래에 「화면을 불러오지 못했습니다」가 늘 보였고,
  오류 화면·시스템 배너·전환 덮개·스피너가 스타일 없이 그려졌다.

  핵심 동작:
    - 정적 규칙은 코어 CSS 파일 두 개로만 싣는다 — `g7-core.css`(셸, 전역 선택자·@layer 없음) · `g7-standalone.css`(오류·점검·DB 오류 화면)
    - 런타임에 만드는 규칙은 `RuntimeStyleSheet`(생성형 시트 + `<head>` 표식 `<meta id=key>`)로 붙인다.
      생성형 시트가 없는 환경(구형 브라우저·jsdom)에서만 `<style id=key>` 로 내려간다
    - 전환 덮개(opaque·blur·fade·skeleton·spinner)·레이아웃 편집기·DevTools 가 이 헬퍼를 쓴다
    - 오류 화면·레이아웃 오류 UI·기본 스피너·미디어 임베드 박스는 클래스로, 시스템 배너 색은 CSSOM 대입으로 그린다
    - 본문 사용자 서식(style 속성)은 `InlineStyleDeferral` 이 정화 때 `data-g7-style` 로 옮기고 화면에 붙인 뒤
      `el.style.cssText` 로 입힌다. 코어 본문 규칙 경로는 `G7_DEFER_STYLE: true` 일 때만 지연한다(옛·외부 템플릿 호환)
    - 정책 2강도(기본 `style-src-elem 'self'` / 엄격 `style-src 'self'; style-src-attr 'none'`)를 건 브라우저에서
      진입 화면·환경설정·링크 클릭 화면 이동·오류 화면이 위반 0 으로 그려진다

axes:
  case:
    # 런타임 규칙 헬퍼
    - runtime_style_fallback_element     # 생성형 시트 미지원 환경 — <style id=key> 폴백
    - runtime_style_adopted              # 생성형 시트 환경 — <style> 0 + 표식
    # 본문 서식 지연
    - inline_style_deferral              # style → data-g7-style → cssText
    - content_style_defer_flag           # 코어 본문 규칙 경로의 G7_DEFER_STYLE 플래그 유무
    - embed_box_no_inline_style          # 미디어 임베드 박스·iframe
    # 전환 덮개
    - overlay_no_style_element           # 실제 TemplateApp 메서드 — 생성형 시트 환경
    - overlay_legacy_algorithm           # 덮개 설정 정규화·모양·걷기 알고리즘(기존 회귀 테스트)
    # 정적 CSS · 서버 HTML
    - core_css_contract                  # 코어 정적 CSS 두 개의 계약
    - core_views_no_inline_style         # resources/views 원본 전수
    - admin_shell_no_inline_style        # 관리자 셸 HTML
    - user_shell_no_inline_style         # 사용자 셸 HTML
    - standalone_pages_no_inline_style   # 오류 5종·묶음(4xx·5xx)과 402·419·429·IP 제한 403·점검·DB 계정 오류
    # 엔진 런타임 UI
    - error_screen_no_inline_style       # 오류 화면·레이아웃 오류 UI·시스템 배너
    # 레이아웃 편집기 · DevTools
    - layout_editor_no_style_element     # 편집기 동적 규칙 5곳
    - layout_editor_chrome_regression    # 편집기 셸(툴바 규칙이 런타임 시트로 옮겨진 뒤의 기존 회귀 테스트)
    - layout_editor_asset_regression     # 편집 자산 로더(권한 가드 CSS 가 런타임 시트로 옮겨진 뒤의 기존 회귀 테스트)
    - devtools_no_style_element          # DevTools 패널 CSS
    # 브라우저 실측(Chromium)
    - style_csp_basic_enforced           # 스크립트 strict + style-src-elem 'self'
    - style_csp_strict_enforced          # 스크립트 strict + style-src 'self'; style-src-attr 'none'

