# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다.

feature: "관리자의 회원 강제 로그아웃 `POST /api/admin/users/{user}/sessions/revoke`"

description: |
  관리자의 회원 강제 로그아웃 `POST /api/admin/users/{user}/sessions/revoke`
  대상 회원의 토큰을 전부 지우고 액션 훅과 활동 로그를 남긴다. 회원 수정 권한이 없으면 403, 하위 관리자는 최고관리자를 대상으로 하지 못한다.

axes:
  actor: [super_admin, no_permission, delegated_admin]
  target: [member, super_admin]

effects:
  - revoke_deletes_tokens
  - revoke_hook_fired
  - revoke_activity_logged
  - target_next_request_401
  - revoke_requires_permission
  - revoke_super_admin_refused

test_files:
  - tests/Feature/User/RevokeSessionsTest.php
