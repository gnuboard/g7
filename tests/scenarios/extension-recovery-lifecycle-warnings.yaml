feature: 확장 호환성 복구 API — 자동 비활성 목록·알림 닫기·복구(재활성화)와 복구 중 부분 실패 경고 (7.1.3)

description: |
  코어를 올린 뒤 호환되지 않아 자동으로 꺼진 확장은 대시보드 알림의 「복구」 버튼으로 다시 켠다.
  재활성화 중 레이아웃 등록 같은 일부 항목이 실패해도 작업은 성공으로 끝나는데, 복구 응답이 경고를 싣는
  공용 성공 응답을 거치지 않아 그 실패가 로그에만 남았다(계획 D16·WP3 해결책 3). 이제 응답 data.warnings 에
  싣고, 대시보드 성공 갈래가 확장 목록 화면과 같은 노란 경고 결과 창을 연다(화면 쪽은
  admin-extension-lifecycle-warnings-modal 의 생명주기 apiCall 모집단이 잠근다).
  같은 시험 파일의 기존 계약(목록 구조·인증·숨김 확장 제외·알림 닫기)도 이 매니페스트가 매핑한다.

axes:
  # 엔드포인트·행위자·대상이 갈래마다 달라 교차곱이 의미가 없다 — 실제 갈래를 한 축으로 둔다
  case:
    - list_grouped
    - list_guest
    - list_hidden_extension
    - list_dismissed_item
    - recover_invalid_type
    - recover_unknown_identifier
    - recover_hidden_extension
    - recover_partial_failure
    - dismiss_admin
    - dismiss_guest

effects:
  - auto_deactivated_lists_grouped_items
  - unauthenticated_request_rejected
  - recover_rejects_unknown_target
  - dismiss_returns_alert_id
  - hidden_extension_excluded
  - dismissed_items_excluded
  - recover_response_carries_lifecycle_warnings

test_files:
  - tests/Feature/Api/Admin/ExtensionRecoveryTest.php
