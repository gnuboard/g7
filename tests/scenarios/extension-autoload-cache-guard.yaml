feature: 확장 오토로드 캐시 파괴 방지 가드

description: |
  bootstrap/cache/autoload-extensions.php 는 Modules, Plugins PSR-4 매핑의 단일 소스라 빈 배열로 덮이면
  모든 확장 컨트롤러가 Target class does not exist 로 500 이 된다. 생성기는 DB 설치 목록과 디스크 활성
  디렉터리의 교집합이므로 DB 쪽만 비어도 매핑이 사라진다. 이 매니페스트는 세 가드를 고정한다.
    - DB 조회가 0건인데 디스크에 활성 확장 디렉터리가 있으면 기존 매핑을 보존한다.
    - testing 환경에서는 실제 캐시 파일을 다시 쓰지 않는다.
    - extension:update-autoload 는 훅 캐시 재생성보다 먼저 런타임 오토로드를 재등록한다.

coverage_strategy: full

axes:
  guard_case: [db_empty_with_active_dirs, testing_env_real_cache_path, update_autoload_command_order]

effects:
  - generate_autoload_file_keeps_existing_map_when_db_empty_but_active_dirs_exist
  - generate_autoload_file_leaves_real_cache_untouched_in_testing_env
  - update_autoload_reregisters_runtime_autoload_before_hook_cache

test_files:
  - tests/Unit/Extension/ExtensionAutoloadCacheGuardTest.php
