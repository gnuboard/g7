feature: layout_editor_scroll_extension_lock

description: |
  레이아웃 편집기의 스크롤 구조와 확장 주입 노드 잠금 후속 회귀를 실제 편집기 화면으로 잰다.
  - extension_blackbox_selection: 확장 주입 조각(`__source.kind === 'extension'`) 안 깊은 자식을 눌러도 조각 단위(통짜)로 선택되고,
    속성 메뉴(ⓘ)는 뜨지 않으며 확장 편집 어포던스만 남는다. 대상은 사용자 템플릿 마이페이지 «내 정보»에 이커머스가 주입하는
    「기본 배송지」 카드다(관리자 회원 폼의 마케팅 주입 조각은 #490 에서 코어 회원 항목 칸으로 바뀌어 없어졌다).
  - single_window_scroll: 일반(min-h-screen) 화면은 캔버스가 따로 스크롤되지 않고 브라우저 한 창으로 스크롤되며 머리와 트리가 고정된다.
  - fullscreen_expand: 관리자 풀스크린(h-screen) 화면은 편집 캔버스에서 콘텐츠 높이만큼 펼쳐져 안쪽 스크롤이 남지 않는다.
  리사이즈 뒤 선택 박스 재측정은 단위 테스트(useElementSelection, EditorCanvasOverlay)가 덮는다.

coverage_strategy: full

axes:
  case: [extension_blackbox_selection, single_window_scroll, fullscreen_expand]

effects:
  - extension_node_context_menu_blocked
  - extension_node_blackbox_selection_normalized
  - editor_canvas_single_window_scroll
  - fullscreen_layout_expanded_in_editor

test_files:
  - tests/Playwright/specs/layout-editor/scroll-and-extension-lock-followup.spec.ts
