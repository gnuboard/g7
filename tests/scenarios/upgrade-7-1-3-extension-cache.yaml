feature: 코어 7.1.3 업그레이드 스텝 — 고아 확장 캐시 파일 삭제와 지문 실은 캐시 재생성

description: |
  01 은 만드는 코드도 읽는 코드도 없는 bootstrap/cache 의 고아 파일 두 개를 지운다(없으면 건너뜀, 멱등).
  02 는 extension:update-autoload 로 오토로드·훅 캐시를 다시 만들어 7.1.3 의 활성 확장 파일 지문을 싣는다 —
  경고와 함께 끝나거나 실패해도 업데이트를 막지 않고 업그레이드 로그에 남긴다.

axes:
  step: [remove_orphans, regenerate_caches]

effects:
  - orphan_cache_files_removed_idempotently
  - cache_regeneration_never_blocks_update

test_files:
  - tests/Feature/Upgrades/Upgrade_7_1_3_ExtensionCacheTest.php
