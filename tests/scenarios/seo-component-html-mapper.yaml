feature: SEO 봇 HTML — 레이아웃 컴포넌트 트리를 정적 HTML 로 옮기는 ComponentHtmlMapper

description: |
  검색엔진 봇에게 내보내는 HTML 은 레이아웃 JSON 의 컴포넌트 트리를 ComponentHtmlMapper 가
  config(component_map, render_modes, self_closing, text_props, attr_map, allowed_attrs)에 따라
  태그로 옮긴 결과다. 이 매니페스트는 그 변환의 관심사(기본 태그, 마운트 접두사, 선언적 렌더 모드,
  React 렌더러와 같은 노드 문법, 링크 자동 생성 등)를 축 하나로 나누고, 관심사마다 그 변환이
  지켜야 하는 효과를 하나씩 둔다. 이미지 다운로드 URL 폴백과 CDN 절대 URL 통과는
  public-asset-cdn.yaml 이 소유한다.

axes:
  render_concern: [basic_tags, mount_prefix, config_fallback, iterate_mode, format_mode, raw_mode, page_structure, edge_cases, self_closing, translation_binding, responsive_props, icon_class, text_format, image_src_fallback, renderer_parity, config_props, navigate_links, fields_mode, seo_vars, pagination, all_props, class_map]

effects:
  - component_tree_renders_semantic_html
  - bot_html_urls_carry_the_mount_prefix_once
  - missing_config_falls_back_to_safe_defaults
  - iterate_render_mode_repeats_item_markup
  - format_render_mode_fills_placeholders
  - raw_render_mode_emits_bound_html
  - real_page_structures_render_crawlable_html
  - edge_case_nodes_render_safely_without_errors
  - self_closing_tags_render_without_closing_tag
  - translation_keys_and_bindings_resolve_in_html
  - responsive_desktop_props_are_merged
  - icon_names_convert_to_css_classes
  - text_format_mode_renders_composed_text
  - image_alt_text_follows_the_current_field
  - node_grammar_matches_the_react_renderer
  - config_text_props_attr_map_and_allowed_attrs_apply
  - navigate_actions_render_as_crawlable_links
  - fields_render_mode_renders_labelled_values
  - seo_vars_are_injected_into_format_mode
  - pagination_render_mode_emits_page_links
  - all_props_source_feeds_item_attrs
  - class_map_applies_conditional_classes
  # #869 — Img 의 thumbPreset 이 봇 화면에서도 썸네일 src·srcset 이 되고, raw 본문(HtmlContent)의 이미지가 썸네일로 바뀐다
  - img_thumb_preset_renders_thumbnail_src
  - content_image_uses_thumbnail
  # #869 — responsive 로 thumbPreset 이 바뀌는 노드는 봇 폭(1024px) 한 구간의 규격을 쓴다(프리셋·커스텀 구간 우선순위·식·반복·children·if)
  - img_thumb_preset_responsive_uses_desktop_breakpoint
  - img_thumb_preset_responsive_custom_ranges_follow_desktop_width
  - img_thumb_preset_responsive_node_grammar_on_bot_html
  # #399 — responsive 구간 classMerge 가 봇 화면에서도 기본 className 에 덧붙고, 구간 classMap 이 기본 classMap 을 대신한다 (engine-v1.98.0 짝)
  - responsive_class_merge_and_class_map_apply_on_bot_html

test_files:
  - tests/Unit/Seo/ComponentHtmlMapperTest.php
  - tests/Unit/Seo/ComponentHtmlMapperResponsiveClassMergeTest.php
