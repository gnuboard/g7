# audit:allow test-scenario-coverage[cross_product] reason: 기존 서비스 단위 테스트의 소유권을 사후 등재한 매니페스트. 축 조합 전수가 아니라 이미 통과 중인 회귀 테스트의 효과를 명시하는 것이 목적이다.

feature: 플러그인 설정 서비스 (설정 조회·저장·레이아웃 해석)

description: |
  `PluginSettingsService` 의 단위 계약을 고정한다. 이 테스트 파일은 매니페스트 없이 존재해
  `test-scenario-reverse-mapping` 이 손대는 순간 red 였다 — 2026-09-28 마크업 템플릿 비의존화
  (설정 화면 레이아웃도 템플릿 없이 컴파일) 작업에서 함께 등재한다.

  레이아웃 엔드포인트가 돌려주는 구조는 `version` · `meta` · (확장 레이아웃이면) `extends`·`slots` 다.
  `schema` 키는 소비처 없는 사어 키라 #476 에서 걷혔고, 종전 테스트가 그 키를 단언해 red 였다.

