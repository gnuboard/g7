feature: 확인 질문에 답할 수 없는 확장 업데이트, 제거 명령 실행을 성공으로 끝내지 않는다

description: |
  `module:update`, `plugin:update`, `template:update`, `module:uninstall`, `plugin:uninstall`, `template:uninstall`,
  `language-pack:uninstall` 은 `--force` 없이 실행하면 진행 확인을 묻는다. cron, CI, 원격 명령, `--no-interaction` 처럼
  그 확인에 답할 수 없는 실행은 종전에 기본값 「아니오」로 「취소」 한 줄을 내고 종료 코드 0 으로 끝나 자동화가 성공으로
  읽었다. 지금은 작업을 시작하지 않은 사유와 `--force` 안내를 출력하고 종료 코드 1 로 끝난다. 이 명령들은 `--force` 가
  확인 생략을 겸하므로 새 옵션은 없다. 대화형에서 운영자가 직접 「아니오」를 답한 취소는 종전처럼 0 이다.
  답할 수 없는 실행의 판정(`--no-interaction` 또는 입력이 콘솔이 아님)은 `HasUnifiedConfirm::canAnswerConfirmation()`
  한 곳에 있고 `core:update` 도 같은 판정을 쓴다(`core-update-noninteractive-confirm.yaml`).
  각 테스트는 위 7개 명령 전부를 데이터 공급자로 돈다.

axes:
  input:
    - no_interaction_option
    - no_terminal
    - interactive
  force_option:
    - absent
    - present

effects:
  - unanswerable_confirmation_fails_with_reason_and_force_hint
  - work_does_not_start_without_confirmation
  - force_option_skips_the_confirmation
  - interactive_no_answer_keeps_success_exit_code

test_files:
  - tests/Feature/Console/ExtensionLifecycleNonInteractiveConfirmTest.php
