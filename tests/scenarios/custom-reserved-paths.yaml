feature: custom 예약 자리 — 코어 업데이트가 덮지도 지우지도 않는 개발자 자리 (#792)

description: |
  업데이트 대상 폴더(routes·resources·app·public·lang·config·database) 안쪽의 custom 예약 자리
  (routes/custom.php·app/Custom·resources/views/custom·public/custom·lang/custom·config/custom.php·
  database/migrations/custom)와 최상위 custom/(개발자 composer)를 증분·prune·백업 없음 세 모드 모두에서
  복사·orphan 정리·자동 발견·신규 파일 manifest·롤백 prune 이 건너뛴다. 배포본이 예약 자리에 파일을 실으면
  사전 검사가 찾아 업데이트를 시작하지 않는다. 판정은 경로 구간 단위(app/CustomX 는 예약 자리가 아님).

test_files:
  - tests/Unit/Services/CoreUpdateReservedPathsTest.php
  - tests/Feature/Console/CoreUpdateCustomPreflightTest.php
  - tests/Unit/Extension/CustomPackageConflictCheckerTest.php
  - tests/Feature/Custom/CustomVendorServiceTest.php
  - tests/Feature/Installer/InstallerCustomVendorTest.php

