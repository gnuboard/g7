feature: 동작의 confirm 식이 빈 문구로 풀리면 확인창 없이 실행한다 (engine-v1.92.0)

description: |
  `confirm="{{hasToken ? '$t:…' : ''}}"` 처럼 조건에 따라 확인을 묻는 식은, 디스패처가 식 원문의 유무로 판정해 결과가 빈 문자열이어도
  `confirm('')` 을 불렀다(SSO 첫 SCIM 토큰 발급의 빈 확인창). 이벤트 핸들러 경로(`createHandler`)와 직접 실행 경로(`dispatchAction`)
  모두 문구를 풀고 번역한 뒤 비었으면(빈 문자열·공백, 보간이 null·undefined 를 빈 문자열로 푼다) 묻지 않고 실행한다.
  문구가 있으면 종전대로 묻고, 취소하면 실행하지 않는다.

axes:
  path: [createHandler, dispatchAction]
  confirm_result: [empty_string, whitespace, null, undefined, message_accept, message_cancel]

axis_notes:
  confirm_result: >-
    빈 문구(empty_string·whitespace·null·undefined)는 묻지 않으므로 사용자 선택이 없다. message_accept·message_cancel 은
    문구가 있을 때 확인·취소(대조군).

effects:
  - empty_confirm_runs_without_dialog
  - non_empty_confirm_still_asks

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.emptyConfirm.test.ts
