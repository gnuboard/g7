feature: 관리자 주문 목록 결제수단 칸 — 결제 플러그인 표시 자리

description: |
  이커머스는 PG 를 모른다. 관리자 주문 목록의 결제수단 칸에 PG 별 표시(테스트 결제 배지, 간편결제 원 수단
  라벨)를 얹는 방법을 잠근다.

  왜: 종전에는 결제 플러그인 셋이 배지 하나를 얹으려고 주문 목록 11개 컬럼 전체를 복사해 `inject_props` 로
  덮었다. 이커머스가 컬럼을 고치면 그 사본에 묻혀 화면에서 사라졌고(부분취소 배지·적립 예정 포인트 소실 전례),
  결제수단 칸은 다른 PG 의 테스트 결제 맵까지 읽었다. 우선순위로 한 사본만 이기므로 나머지 PG 의 간편결제
  라벨도 조용히 빠졌다.

  계약:
    - 컬럼 목록은 이커머스 레이아웃이 단일 출처다. 결제수단 칸은 확장점 `admin_order_list_payment_method_badges`
      를 연다(DataGrid 셀 템플릿 안 확장점 — 코어가 `props.columns[].cellChildren` 까지 채운다).
    - 결제 플러그인은 그 확장점에 **자기 배지와 자기 데이터 소스만** 끼운다. 다른 PG 를 참조하지 않는다.
    - 간편결제 원 수단 라벨은 서버 필터 훅 `sirsoft-ecommerce.order.filter_payment_method_display_label` 로
      플러그인이 자기 결제에만 채운다. 화면은 `payment_method_display_label ?? payment_method_label`.
    - 같은 훅이 주문 결제 리소스(`OrderPaymentResource`)의 `payment_method_display_label` 도 채운다 — 관리자 주문 상세·
      관리자 클레임 상세의 주문 결제 카드·마이페이지 주문 상세가 목록과 같은 이름을 보인다. 해석은
      `OrderPayment::paymentMethodDisplayLabel()` 한 곳이다.
    - 자기 간편결제 id(`nicepay_kakaopay`·`nhnkcp_kakaopay`)로 저장된 결제는 기본 라벨 자리에 원시 id 대신 PG 이름을
      쓴다 — 「카카오페이 (나이스페이먼츠)」. 토스는 코어 값(`card`)으로 저장하므로 결제 결과 간편결제사
      (`embedded_pg_provider`)로 「카카오페이 (토스페이먼츠)」를 만든다.
    - 플러그인 업데이트 뒤에는 코어 재등록이 overlay 뿐 아니라 확장점 조각도 활성 템플릿에 다시 등록한다(플러그인마다
      두던 복원 리스너는 꺼진 템플릿까지 행을 만들어 지웠다).

axes:
  payment_plugin: [none, kginicis, nhnkcp, nicepayments, tosspayments]
  # 표시 라벨을 그리는 화면(관리자 목록·관리자 주문 상세·관리자 클레임 상세 주문 결제 카드·마이페이지 주문 상세)은 축이 아니라
  # effect order_detail_screens_prefer_display_label 로 화면별 테스트가 잰다

effects:
  - order_list_payment_method_cell_opens_a_badge_slot
  - badge_fragment_targets_the_ecommerce_slot_only
  - badge_fragment_reads_only_its_own_test_map
  - display_label_is_null_without_subscribers
  - display_label_comes_from_the_payment_plugin_filter
  - display_label_listener_subscribes_to_the_ecommerce_filter
  - display_label_listener_labels_only_its_own_easy_pay_payments
  - easy_pay_display_label_from_provider                     # 토스: 결제 결과 간편결제사(embedded_pg_provider)로 「카카오페이 (토스페이먼츠)」, 옛 「토스결제」 는 토스페이, 맵 밖은 「{원문} (토스페이먼츠)」
  - display_label_uses_pg_name_for_own_easy_pay_method_id   # 자기 id 로 저장된 간편결제는 「카카오페이 (PG 이름)」 — 원시 id 노출 없음
  - order_payment_resource_carries_display_label            # 주문 결제 리소스에도 표시 라벨 — 구독자 없음·빈 값·배열이면 null
  - order_detail_screens_prefer_display_label               # 관리자 주문 상세·클레임 상세 주문 결제 카드·마이페이지 상세가 표시 라벨 우선, 없으면 기본 라벨
  - extension_point_fragment_is_restored_after_plugin_update

