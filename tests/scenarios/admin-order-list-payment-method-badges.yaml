limitations:
  - "셀 템플릿 안 확장점은 서빙 조립에서 채워진다. 위지윅 편집기의 확장점 시각 편집은 `children` 트리만 다루므로 셀 안 확장점은 편집기 캔버스에서 조각 편집 대상으로 잡히지 않는다."
  - "KG이니시스는 간편결제 원 수단 표시 라벨을 제공하지 않는다(종전에도 제공하지 않았다) — 필터 구독자는 NHN KCP·나이스페이먼츠 둘이다."
