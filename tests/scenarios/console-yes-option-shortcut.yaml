feature: 확인 생략 옵션 --yes 의 -y 축약과 language-pack:update 의 --yes

description: |
  `--yes`(확인 질문만 생략)를 선언한 명령은 모두 `-y` 축약도 받는다 — `module|plugin|template:update`·`:uninstall`,
  `language-pack:update`·`language-pack:uninstall`, `core:update`, `core:execute-upgrade-steps`, `stage:apply-to-live`,
  `stage-layouts:reset-from-live`. 종전에는 `--yes` 만 선언해 `-y` 로 부르면 「The "-y" option does not exist.」 로 종료 코드 1 이었다.
  `language-pack:update` 는 진행 확인을 묻지 않지만 확장 일괄 갱신 스크립트가 다른 `{type}:update` 와 같은 형태로 부를 수
  있도록 `--yes` 를 받는다. `--yes` 는 `--force` 효과도, 미서명 패키지 동의(`--allow-unsigned`)도 켜지 않는다 —
  미서명 확인은 대화형이면 묻고, 답할 수 없는 실행은 `--allow-unsigned` 안내와 함께 실패한다.
  모듈 업데이트의 같은 판정은 `package-integrity.yaml` 의 `yes_option_does_not_answer_unsigned_confirmation` 이 소유한다.

axes:
  case:
    - short_y_parse                        # 12개 명령의 명령줄 -y 해석
    - language_pack_update_yes             # language-pack:update -y / --yes 로 업데이트
    - unsigned_yes_noninteractive          # 미서명 새 판 + -y + 답할 수 없는 실행
    - unsigned_yes_interactive             # 미서명 새 판 + -y + 대화형

effects:
  - short_y_is_read_as_yes_option                    # 명령줄의 -y 가 --yes 로 읽힌다 (12개 명령 데이터 공급자)
  - language_pack_update_accepts_yes_and_updates     # language-pack:update -y 는 받아들여 업데이트하고 --force·미서명 동의를 켜지 않는다
  - yes_option_does_not_answer_unsigned_confirmation # 미서명 새 판에서 -y 만 준 비대화형은 exit 1, 대화형은 -y 가 있어도 묻는다

test_files:
  - tests/Feature/Console/YesOptionShortcutTest.php
