feature: 스켈레톤 전환 덮개의 상태 영역 이름과 중복 (engine-v1.79.0)

description: |
  스켈레톤 전환 덮개 컨테이너가 role="status" + aria-label="Loading..." 영문 고정이었고, 안쪽 PageSkeleton 이
  번역된 status 를 다시 그려 상태 영역이 둘 겹쳤다(7.1.0 원 세션 실측 O-C3b-2). 바깥 이름은 템플릿 번역 nav.loading,
  안쪽이 상태 영역을 그리면 바깥의 역할·이름을 걷는다.

axes:
  case: [skeleton_without_own_status, skeleton_with_own_status, skeleton_without_translation]

effects:
  - skeleton_overlay_label_translated   # 바깥 덮개 이름이 화면 언어(nav.loading), 번역 없으면 영문
  - skeleton_status_not_duplicated      # 안쪽 컴포넌트가 status 를 그리면 상태 영역은 하나

test_files:
  - resources/js/core/__tests__/TemplateApp.skeletonOverlayA11y.test.ts
