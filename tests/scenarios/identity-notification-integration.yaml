feature: 본인인증(IDV) 메시지 → 알림 시스템 통합 (#699)

description: |
  본인인증 메일(회원가입·비밀번호 찾기·정보 변경·중요 작업·로그인 2단계·결제 본인 확인)은
  알림 정의(notification_definitions, category=identity)·템플릿·채널 설정·디스패처를 경유한다.
  옛 IDV 전용 표(identity_message_definitions/templates)와 Mail::to() 직발송은 없어졌다.

  핵심 동작:
    - 3단 폴백(정책 → 목적 → 기본)은 type 후보 3개로 해석한다
      (identity.policy.{key} / identity.purpose.{purpose} / identity.default, 100자 초과 정책 키는 해시).
    - 「알림 채널 관리」에서 메일을 끄면 본인인증 메일도 멈춘다 — 로그인 2단계는 503, 챌린지 요청은 502,
      발송 로그에는 skipped(사유).
    - 발송 결과는 DeliveryReport 로 받는다(채널 제외·템플릿 비활성·예외를 빠짐없이). 보고서를 붙이지
      않은 일반 알림은 동작이 바뀌지 않는다.
    - 발송 로그(notification_logs)에는 인증번호·검증 링크가 평문으로 남지 않는다(******).
    - 운영자 정책별 문구는 알림 설정 화면에서 추가·삭제한다(core.settings.* 권한).
    - 7.1.0 업그레이드 스텝이 옛 표를 건수 대조 후 이관·드랍한다(불일치면 드랍하지 않는다).
    - 이커머스 「고객에게 메일 보내기」도 알림 정의 order_custom_email 로 발송한다.

