feature: 가입 완료 훅 가입 데이터에서 비밀번호 원문 제외

description: |
  #138 후속 — 설계 결정. `core.auth.after_register` 의 `registration_data` 가 검증된 가입 요청 전체라 비밀번호 원문이
  담겼고, 큐로 실행되는 구독자마다 작업 표(실패 시 실패 작업 표)에 사본이 남았다. 이 브랜치가 가입 훅에 활동 로그·
  대시보드·마케팅 동의 구독을 새로 연결해 사본이 늘었다. 같은 가입 흐름의 동의 기록 훅(`core.auth.record_consents`)도
  가입 데이터 전체를 넘겨 활동 로그 큐 작업에 사본이 남았다. 읽는 구독자가 없으므로 두 훅 모두 넘기기 전에
  password·password_confirmation 을 뺀다. 그 밖의 가입 필드(예: 결제 통화·마케팅 동의)는 그대로 넘긴다.

axes:
  case: [register_payload_secret]

effects:
  - registration_data_excludes_password
  - queued_hook_jobs_hold_no_plaintext_password

test_files:
  - tests/Feature/Api/Auth/RegisterHookPayloadSecretTest.php
