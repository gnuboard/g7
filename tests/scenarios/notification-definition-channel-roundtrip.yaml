feature: 알림 설정 — 채널·분류를 URL 단일 출처로 왕복 (#518 · #699)

description: >
  알림 설정 탭은 목록을 채널(`?channel=`)과 분류(`?category=`)로 좁혀 부른다. 두 값을 URL 에만 두어야
  다른 설정 탭에 갔다 오거나 새로고침해도 「마지막으로 요청한 값」 과 「화면이 활성으로 보이는 값」 이 같다.
  채널을 로컬 상태에도 두었던 #518 결함은 행마다 「이 채널에 대한 템플릿이 없습니다」 를 띄웠고, 예외도
  콘솔 에러도 없었다. #699 에서 본인인증 메일 문구가 분류 「본인인증」 으로 들어오면서 같은 계약을 분류 칩에도 건다.

test_files:
  - tests/Playwright/specs/admin/notification-definition-channel-roundtrip.spec.ts

axes:
  surface: [core_settings]
  action: [channel_switch, tab_roundtrip, identity_category_roundtrip]

effects:
  - notification_channel_switch_requests_that_channel
  - notification_channel_tab_roundtrip_keeps_data_and_screen_in_sync
  - notification_channel_roundtrip_emits_no_console_errors
  - notification_identity_category_persists_across_reload

sub_flows:
  - id: console_clean
    description: 채널 왕복 중 콘솔 에러 0 (조용한 실패였던 결함이라 콘솔로는 안 잡혔음을 고정)
    effects:
      - notification_channel_roundtrip_emits_no_console_errors

notes: |
  E2E 는 직렬 실행한다(spec 헤더 `test.describe.configure({ mode: 'serial' })`) — 모든 테스트가 관리자 설정
  화면을 띄워 병렬이면 목록 적재 대기가 타임아웃된다. 본인인증 분류 왕복의 편집 저장은 값을 바꾸지 않고
  저장한다(같은 값 저장은 「기본」 표시를 유지하는 계약이라 데이터가 변하지 않는다).
