feature: 관리자 회원 추가·수정 훅 원본 데이터에서 비밀번호 원문 제외

description: |
  #138 후속 validate — 설계 결정(회원가입 훅과 같은 부류). `core.user.after_create`·`after_update` 가 넘기는 요청
  원본 데이터에 관리자가 입력한 비밀번호 원문이 담겨, 큐 구독자(활동 로그·게시판 알림 설정·마케팅 동의 등)마다 작업
  표에 사본이 남았다. 읽는 구독자가 없으므로 훅이 넘기기 전에 password·password_confirmation 을 뺀다.
  직전 훅(before_create·before_update)의 구독자는 즉시 실행(sync)이라 작업 표에 남지 않는다.

axes:
  case: [admin_create_and_update]

effects:
  - queued_user_hook_jobs_hold_no_plaintext_password

test_files:
  - tests/Feature/Services/UserHookPayloadSecretTest.php
