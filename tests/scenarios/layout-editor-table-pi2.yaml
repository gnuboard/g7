feature: 레이아웃 편집기 표 편집 — 속성 패널 TableEditor 와 캔버스 인플레이스 오버레이의 셀 조작

description: |
  표(Table) 노드 에디터와 캔버스 인플레이스 오버레이의 단위 시험을 묶는다. 소유 매니페스트
  (layout-editor-table-editor, layout-editor-table-inplace)가 이미 선언한 구조 변형 효과는 그쪽을
  쓰고, 여기에는 그 매니페스트에 없던 동작만 둔다.

  - TableEditor: grid 와 거터 렌더, 행 삭제, 이동 버튼 활성, 셀 입력 클릭과 Shift 클릭 선택,
    영역 테두리 색, 미리보기 td 의 테두리와 배경 반영, 선택 셀 다국어 섹션과 +데이터, param 키
    셀 편집, 순수 바인딩 셀 편집 제외, 배경과 여백.
  - TableInplaceOverlay: 표 선택과 셀 2단계 선택, 코어 선택 path 매핑, 오른쪽과 아래 병합, 인라인
    편집 요청, 테두리 단일과 전체 적용, 공유변 색 보정, 배경과 여백.

axes:
  area: [table_editor, table_inplace]

effects:
  # 속성 패널
  - table_editor_renders_grid_with_gutters
  - table_editor_remove_row_patches_grid
  - table_editor_move_buttons_enabled_except_edge
  - table_editor_cell_input_click_selects_keeps_focus
  - table_editor_cell_input_shift_click_selects_only
  - table_editor_range_border_color_all_cells
  - table_editor_preview_td_reflects_border
  - table_editor_selected_cell_i18n_section
  - table_editor_structural_cell_hides_i18n
  - table_editor_cell_plus_data_follows_candidates
  - table_editor_param_key_cell_editable_no_raw
  - table_editor_pure_binding_cell_not_editable
  - table_editor_cell_fill_padding_controls
  - table_editor_fill_preset_inline_background
  - table_editor_padding_step_inline_padding
  - table_editor_preview_td_reflects_background
  # 캔버스 인플레이스
  - inplace_table_select_shows_corner_add_and_pick
  - inplace_cell_pick_selects_and_shows_gutters
  - inplace_core_cell_path_selects_and_shows_gutters
  - inplace_merge_right_down_sets_span
  - inplace_cell_click_requests_inline_edit
  - inplace_shift_click_skips_inline_edit
  - inplace_merge_right_disabled_at_last_col
  - inplace_border_applies_to_selected_cell_only
  - inplace_border_color_corrects_shared_edges
  - inplace_range_border_color_adds_default_width
  - inplace_apply_all_toggle_borders_every_cell
  - inplace_cell_fill_padding_controls
  - inplace_fill_preset_inline_background
  - inplace_padding_step_inline_padding
  - inplace_apply_all_toggle_fills_every_cell

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/TableEditor.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/TableInplaceOverlay.test.tsx

validation:
  note: |
    Vitest RTL 단위가 잰다. 라이브 저장과 실페이지 반영은 table-editor.spec.ts 와
    table-inplace-overlay.spec.ts 를 소유한 기존 매니페스트가 맡는다.
