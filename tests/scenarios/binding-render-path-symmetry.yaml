feature: 단일 바인딩 식이 렌더 경로(반복 렌더·조건 판정)와 무관하게 같은 값으로 해석된다 (배포 번들 기준)

description: |
  「이 문자열이 단일 바인딩인가」「이 식이 표현식인가 경로인가」를 가르는 판정이 엔진 곳곳에 복제돼
  복사본마다 인식 문자 집합이 갈라졌고, 같은 작성이 어느 렌더 경로를 타느냐에 따라 다른 결과를 냈다
  (`{{query['sales_status[]']}}` 가 prop 에서는 undefined, `if` 에서는 정상 등).
  브라우저에서 배포 번들의 공개 API(`G7Core.renderItemChildren`, `G7Core.evaluateCondition`)를 그대로 호출해
  결과를 잠근다.

  축 case 는 바인딩 식의 모양 하나씩이다 — 따옴표 키 인덱싱, 파이프 결과 타입, 파이프 식 안의 중괄호,
  리터럴, 빈 바인딩. 반복 렌더의 항목별 조건 평가는 별개 축이라 iteration-condition-render 가 맡는다.

axes:
  case: [binding_quoted_bracket_symmetry, binding_pipe_type_preservation, binding_brace_in_pipe, binding_literal_symmetry, binding_empty_expression]

effects:
  - same_expression_same_value_across_paths       # 따옴표 키·리터럴이 반복 렌더와 조건 판정에서 같은 값을 본다
  - pipe_result_keeps_original_type               # keys·first·length 파이프 결과가 배열·불리언·숫자 그대로 prop 에 실린다
  - brace_inside_pipe_expression_not_leaked_raw   # `{{(x ?? {}) | json}}` 이 `{}` 로 풀리고 `{{` 원문이 남지 않는다
  - empty_binding_does_not_expose_context         # `{{}}` 가 컨텍스트 객체 전체를 prop 에 노출하지 않는다

test_files:
  - tests/Playwright/specs/binding-render-path-symmetry.spec.ts
