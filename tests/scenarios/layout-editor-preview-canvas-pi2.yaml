feature: 레이아웃 편집기 미리보기 캔버스 — $locales 전역 끌어올림, frame 클리핑, guest_only 사용자 시드 제외

description: |
  PreviewCanvas 회귀 시험 세 파일을 묶는다.

  - $locales: sampleGlobal 의 `$` 접두 키가 렌더 컨텍스트 최상위로 올라가 `{{$locales}}` 바인딩이
    화면에 해석된다.
  - frame 클리핑: frame 이 transform 과 overflow:hidden 을 함께 가져 닫힌 fixed 드로어를 잘라 낸다.
  - guest_only: guest_only 레이아웃은 격리 store 에 currentUser 를 시드하지 않고, 일반 레이아웃은
    시드한다(settings baseline 은 양쪽 모두 유지).

axes:
  area: [dollar_locales, frame_clipping, guest_only_seed]

effects:
  - preview_lifts_dollar_locales_into_context
  - preview_frame_owns_transform_and_clipping
  - preview_guest_only_layout_skips_user_seed
  - preview_regular_layout_seeds_current_user

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/PreviewCanvas.dollarLocales.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/PreviewCanvas.frameClipping.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/PreviewCanvas.guestOnlySeed.test.tsx

validation:
  note: |
    Vitest 로 LayoutEditorProvider 와 PreviewCanvas 를 실제로 마운트해 잰다. jsdom 은 레이아웃을
    계산하지 않으므로 frame 클리핑은 인라인 스타일 계약으로 본다.
