feature: 사용자 목록·상세의 행별 권한 메타(abilities·is_owner)

description: |
  역할의 권한 스코프(self·전체·없음)에 따라 행마다 can_update·can_delete·is_owner 가 맞게 나오는지, 감싼 리소스(컬렉션 이중 감싸기)에서도 같은 판정인지, 본인 계정은 관리자 화면에서 지울 수 없는지를 고정한다.

