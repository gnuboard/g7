feature: 7.1.0 JSON 전용(레거시) 확장 호환 — 깨진 조각 관용·편집기 저장·활성화 순서·조각 키 정리·플러그인 레이아웃 생명주기

description: |
  #712. 7.1.0 의 HTML 마크업(.g7.html) 도입 뒤에도 7.0 JSON 전용 확장이 설치·활성화·편집되는지를 고정한다.
  ① JSON 문서의 깨진 조각 참조(파일 부재·조각 JSON 파싱 실패·순환)는 빈 자리로 등록하고 경고(layout_warnings)로
  알린다 — .g7.html 문서와 layouts 밖 참조·최대 깊이·마크업 조각 컴파일 실패는 엄격. 검증 실패 문구는 원시 키·
  미치환 자리표시자 없이, 플러그인은 플러그인으로 표기. ② 편집기는 저장본에 이미 있던 미등록 템플릿 컴포넌트를 그
  개수까지 허용(비차단 경고)하고 새로 쓴 것은 422, 템플릿 components.json 이 스키마를 어기면 열기 200 + 오류.
  ③ 템플릿 활성화는 호스트 레이아웃을 먼저 등록한 뒤 조각을 등록한다. ④ 7.1.0 업그레이드 스텝이 대상 이름으로
  백필된 옛 조각 행을 파일 키로 옮기고(템플릿 오버라이드·다중 후보 포함), 삭제된 플러그인의 잔존 레이아웃을 지운다.
  ⑤ 플러그인 비활성화·재활성화·삭제는 플러그인 레이아웃만 정리한다(같은 식별자의 모듈 행은 건드리지 않는다).
  관리자 화면은 활성화·템플릿 설치 응답의 layout_warnings 건수를 경고 토스트로 알린다.
  ⑥ 엄격한 레이아웃 검증 실패(데이터 소스 id 중복·layouts 밖 참조·.g7.html 컴파일 오류)로 활성화가 실패하면
  확장 상태·soft delete 된 레이아웃 행을 바꾸지 않는다(검증을 상태 쓰기보다 먼저 한다).

