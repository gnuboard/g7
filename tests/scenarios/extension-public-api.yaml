# 시나리오 매니페스트 — 확장 공개 API 선언 public_api 의 코어 해석 (#916 ②, 공개 #83 후속)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: extension_public_api_manifest

description: |
  module.json·plugin.json 의 선택 필드 `public_api` 는 다른 확장이 써도 되는 범위(namespaces·classes)와
  읽기만 허용하는 모델(readonly_models)을 선언한다. 코어 `PublicApiManifest` 는 형태만 검증·정규화하고
  (런타임 강제 없음) 공개 판정을 돌려준다. 판정 규칙은 정적 룰 `extension-internal-symbol-reference` 와
  확장 상세 화면 「공개 API」 칸이 함께 쓴다.

  - 선언이 없거나 배열이 아니면, 지원하지 않는 판이면 null.
  - 판을 생략하면 1 로 읽고 세 목록을 모두 돌려준다.
  - 자기 네임스페이스 밖·루트 자체·접두만 같은 다른 확장·형식이 틀린 항목은 버린다.
  - 공개 판정은 namespaces 하위와 classes 목록이고 readonly_models 는 공개가 아니다.

  각 확장이 공개한 계약의 동작은 그 확장 매니페스트가 소유한다(게시판 `board-directory-contract.yaml`,
  이커머스 `extension-public-api.yaml`·`payment-gateway-contract.yaml`).

axes:
  case: [missing_or_non_array, unsupported_version, version_omitted, foreign_or_malformed_entries, public_judgement]

effects:
  - public_api_missing_or_non_array_normalizes_to_null                     # 선언이 없거나 배열이 아니면 null
  - public_api_unsupported_version_normalizes_to_null                      # 지원하지 않는 판(2, 문자열 "1")은 null
  - public_api_omitted_version_reads_as_1_with_three_lists                 # 판 생략은 1, namespaces·classes·readonly_models 세 목록을 모두 돌려준다
  - public_api_drops_foreign_namespace_and_malformed_entries               # 남의 네임스페이스·루트 자체·접두만 같은 확장·형식 오류 항목은 버리고 앞뒤 역슬래시는 다듬는다
  - public_api_is_public_covers_namespaces_and_classes_not_readonly_models # 공개 판정 = namespaces 하위 + classes, readonly_models·내부 서비스는 공개 아님

test_files:
  - tests/Unit/Support/PublicApiManifestTest.php
