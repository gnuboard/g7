feature: 테스트 DB 스키마 재사용(마이그레이션이 바뀌지 않았으면 migrate:fresh 생략)

description: |
  DB 를 쓰는 테스트가 프로세스마다 마이그레이션 300여 개로 테스트 DB 를 처음부터 다시 만들던 것(약 50초)을, 마이그레이션 지문·환경 키·
  migrations 이름 집합·DB 실물 구조 지문이 기록과 모두 같을 때만 스키마를 재사용하고 잔여 행을 정리하도록 바꿨다(하나라도 다르면 전체 재생,
  재생 전 기록 삭제). 같은 테스트 DB 는 프로세스 잠금으로 한 실행만 쓰고, 요구 프로필(시드·시드 없음)은 베이스 클래스 선언을 따른다.
  트랜잭션 테스트 안 DDL 의 암묵 커밋은 다음 테스트 전 재판정을 유발하고, 강제 재생은 G7_TEST_FRESH_SCHEMA(1 = 프로세스당 1회, 그 밖 = 실행 ID)다.

axes:
  case: [no_record, fingerprint_or_env_changed, migration_set_mismatch, structure_changed, all_match, force_once, force_run_id, order_independent, input_changed, imports_and_logic, write_read, unusable_record, delete_and_state, held_by_other, acquired, child_process, verified_any, state_changed, profile_mismatch, fatal, core_and_unseeded_plugin, seeded_bases, first_use_bases, excluded, migrator_parity, extension_base_parity, stable, detects_changes, long_definitions, residual_rows, migration_batches, auto_increment, failure, round_trip, ddl_in_transaction, next_test_redecides, reuse, column_order_restore, removed_extension_migration, removed_extension_with_irreversible_migration, read_only, committed_write]

