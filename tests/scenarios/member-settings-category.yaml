feature: member_settings_category

description: |
  환경설정 범주 member(닉네임 정책, 표시 이름 설정). 기본값은 종전 동작과 같고, 회원 탭 저장이 통과하며,
  비로그인 공개 설정에는 회원이 고를 수 있는 종류·회원 기본 종류·닉네임 변경 주기만 나간다.

coverage_strategy: full

axes:
