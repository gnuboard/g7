effects:
  - member_settings_defaults_keep_legacy_behavior
  - member_settings_tab_save_roundtrip
  - member_settings_validation
  - member_settings_public_exposure_is_limited

test_files:
  - tests/Feature/Settings/MemberSettingsCategoryTest.php
