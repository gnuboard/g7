feature: 엔진 핸들러 이름 소유권·구독자별 해제 (#816 S1, engine-v1.94.0)

description: |
  확장·템플릿이 같은 이름을 쓸 때 서로를 조용히 덮거나 지우던 결함군을 잠근다.
  핸들러 등록 덮기 경고(등록자 표기·1회 억제), 언어 전환 뒤 재등록 순서(모듈 → 플러그인 → 템플릿),
  componentEvent.off(name, callback) 의 구독자별 해제, 같은 channel:event WebSocket 다중 구독의 독립 수신·해제.
  시험 하나가 시나리오 하나다 — case 값은 파일 접두어 + 시험 순번이다.

