# π3 레이아웃 편집기 시험 표식 부채 채우기 — 이 매니페스트는 아래 test_files 의 각 시험이 재는 효과를
# 시험 단위로 선언한다. 축 behavior 은 그 파일 안의 동작 묶음이다.

feature: 레이아웃 편집기 표 grid 모델 — 기존 table-editor 매니페스트가 선언하지 않은 이동 판정과 셀 편집 세부

