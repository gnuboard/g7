feature: 렌더러의 computed DevTools 추적이 의존성 종류를 DevTools 계약 값으로 알린다 (#869)

description: |
  렌더러가 computed 값과 재계산을 DevTools 에 알릴 때 의존성 종류를 계약(state, datasource, computed, expression)에 없는
  `_local` 로 넘겨, 의존성 트리 노드 type 에 계약 밖 값이 실렸다. 전달부(G7CoreGlobals)의 `as any` 가 어긋남을 가렸고,
  인터페이스의 재계산 트리거 목록도 DevTools 의 `initial` 대신 `init` 을 적고 있었다(넘기는 곳이 없어 동작 영향은 없었다).
  의존성은 `_local` 상태이므로 종류 state, 경로 `_local` 로 알린다.

axes:
  dependency: [local_state]

effects:
  - computed_dependency_type_follows_devtools_contract

test_files:
  - resources/js/core/template-engine/__tests__/computedDevtoolsTracking.test.tsx
