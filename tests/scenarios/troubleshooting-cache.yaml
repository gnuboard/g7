feature: 트러블슈팅 회귀 — 캐시(Row Action ID, 페이지네이션 캐시 키, 모달 fresh, 셀 key, iteration source, 다국어 네임스페이스, _localInit, 표현식 캐시, 확장 라이프사이클)

description: |
  troubleshooting-cache.test.ts 의 해결된 트러블슈팅 사례를 잠그는 회귀 시험이다.
  사례마다 원인이 달라 사례끼리 곱할 입력 축이 없다. 축 case 는 문서의 사례(시험 파일의 가장 안쪽 describe) 하나씩이고,
  효과는 그 사례가 지키는 해결 성질 하나씩이다(같은 사례의 시험 여럿은 같은 칸과 같은 효과를 서로 다른 각도로 잠근다).

axes:
  case: [row_action_id, pagination_cache_key, modal_datasource_cache, cellchildren_repeat_render, iteration_source_reeval, array_type_check, reload_translations_module, spa_local_init_cache, local_path_cache, event_expression_cache, dynamic_path_duplicate_eval, iteration_action_target_id, extension_lifecycle_reload, binding_cache_invalidation, binding_cache_hit_rate]

effects:
  - row_action_reads_id_from_row_context
  - cache_key_includes_page_number
  - modal_open_bypasses_cache_with_fresh
  - cell_keys_are_unique
  - iteration_source_reevaluates_on_state_change
  - empty_array_treated_as_valid_value
  - module_translation_key_includes_namespace
  - layout_change_resets_local_init
  - local_change_invalidates_related_cache
  - event_expression_not_cached
  - static_expression_cached_once
  - iteration_modal_ids_unique
  - extension_lifecycle_refreshes_routes_and_translations
  - state_change_invalidates_dependent_cache
  - frequent_expression_hits_cache

test_files:
  - resources/js/core/template-engine/__tests__/troubleshooting-cache.test.ts

notes: |
  2026-11-09 tsc 오류를 정리하며 이 파일을 손대자 audit `test-scenario-reverse-mapping` 의 선행 부채(시험별 매핑 누락)가
  드러나 이 매니페스트로 해소했다. 시험 동작은 바꾸지 않았다(마킹 주석만). 선례는 troubleshooting-state-advanced.yaml.
