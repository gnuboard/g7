  - resources/js/core/__tests__/TemplateApp.scrollRestoration.test.ts
  - resources/js/core/template-engine/__tests__/dataSourceSnapshot.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/infinite-list-scroll-restoration.test.ts
