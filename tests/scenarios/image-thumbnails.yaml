feature: 이미지 썸네일 1단계 코어 — 엔진·규격·저장소 계층 무효화·퍼지 묶음·코어 서빙 2곳·og 변환 (#869)

description: |
  이미지 서빙 주소에 `?size={규격}` 또는 `?w={숫자}` 를 붙이면 서버가 환경설정의 규격으로 썸네일을 만들어 저장해 두고 낸다.
  - 엔진: GD(기본)·Imagick. 맞춤 cover·contain·width, 기준점 5종, 투명도 보존, EXIF 방향, WebP·AVIF(못 쓰면 원본 형식).
    업로드 축소(ImageResizer)도 같은 엔진.
  - 규격: 고정 슬롯 xs~xl(defaults.json), og(SEO 탭 크기), 확장(필터 core.thumbnail.filter_presets), 운영자 규격.
    `w` 는 숫자 요청 대상 중 가로 ≥ w 최소로 올려 맞춤. 배열·중복·음수·비정수·미정의는 원본.
  - 저장: thumbnails/{원본 disk}/{원본 전체 경로}/{규격}_{지문}.{ext}. 드라이버 put(덮어쓰기)·delete·deleteDirectory·deleteAll
    이 같은 접두 파생본을 모든 썸네일 디스크에서 지우고 core.thumbnail.after_purge 를 묶음으로 발화. 확장 제거도 지운다.
  - 서빙: /api/attachment/{hash}(게이트 — 비공개 디스크·private 캐시), /api/templates/{id}/layout-attachments/{id}/file(공개 —
    공개 썸네일 디스크가 공개 자산 디스크면 302). 낼 수 없으면 원본 + X-G7-Thumbnail: bypass:{사유}.
  - og: renderOgHtml/renderTwitterHtml 이 등록된 서빙 주소의 og 이미지를 size=og 로 바꾼다(크기를 직접 선언했으면 그대로).

# 입력 축 — 코어 서빙 지점 × 썸네일 파라미터(2×4)를 전부 서빙 Feature 테스트가 덮는다.
# 엔진(gd·imagick × 맞춤·기준점·형식)·규격 출처(고정·og·확장·운영자)·저장소 계층(세 드라이버 × put·delete·
# deleteDirectory·deleteAll)·퍼지 시점(콘솔·묶음·큐·HTTP)은 각 층의 단위 테스트가 데이터 공급자·표로 전부 잰다 —
# 층을 가로지르는 조합은 같은 경로를 되풀이할 뿐이라 축으로 올리지 않고 effects 로 대조한다.
axes:
  serving_point: [core_attachment, layout_attachment]
  request_param: [none, size, w, invalid]

