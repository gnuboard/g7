# 레이아웃 편집기 셀 스타일 컨트롤과 치수, 첨부 관리자 시험 표식
# #869 이월 0 회차(π1): tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_cell_style_pi1

description: |
  표 셀 테두리, 채움, 여백 컨트롤이 className 토큰과 인라인 스타일을 합성하고 현재 값을 역해석해 활성 상태로 보이는지,
  라이트와 다크 스킴 탭 전환, 치수 위젯의 확정 규칙, 레이아웃 첨부 관리자의 목록과 선택, 삭제 흐름을 잰다.

axes:
  subject: [cell_border_control, cell_fill_control, cell_padding_control, color_scheme_tabs, dimension_and_attachments]

