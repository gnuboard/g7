# π3 레이아웃 편집기 시험 표식 부채 채우기 — 이 매니페스트는 아래 test_files 의 각 시험이 재는 효과를
# 시험 단위로 선언한다. 축 reducer_action 은 시험 대상 단위이다.

feature: 레이아웃 편집기 리듀서 — 반복 항목 편집 진입과 복귀, 버전 맵 동기화, 라우트 선택 시 편집 모드 해제

description: |
  LayoutEditorReducer 의 편집 모드 전환과 버전 맵 액션이 다른 상태를 건드리지 않고 정확히 복귀하는지 잰다.

axes:
  reducer_action: [iteration_item, layout_versions, select_route]

effects:
  - iteration_click_entry_keeps_selected_route
  - iteration_exit_uses_explicit_return_route
  - iteration_exit_returns_to_route_mode_from_route
  - iteration_exit_returns_to_nested_extension_mode
  - iteration_enter_safe_without_selected_route
  - iteration_exit_returns_route_mode_and_clears_return
  - iteration_enter_sets_mode_virtual_path_return_route
  - versions_set_one_extension_adds_first_save
  - versions_set_one_extension_keeps_layout_map
  - versions_set_extension_map_replaces_all
  - versions_actions_leave_other_state
  - versions_set_one_layout_adds_first_save
  - versions_set_one_layout_keeps_others
  - versions_set_layout_map_replaces_all
  - select_route_null_restores_route_mode
  - select_route_in_route_mode_only_swaps_route
  - select_route_exits_separate_edit_mode

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/LayoutEditorReducer.iterationItem.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/LayoutEditorReducer.layoutVersions.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/LayoutEditorReducer.selectRouteExitsEditMode.test.ts
