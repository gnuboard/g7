feature: 언어팩 정책 정합 — 가상 보호 행·슬롯 우선순위·보호 여부

description: |
  언어팩 목록은 네 출처의 행을 한 슬롯(scope + target + locale) 단위로 합친다.
   - 코어 가상 보호 행: 코어 lang/{ko,en}
   - 확장 가상 보호 행: 설치된 확장 설치본의 lang/{ko,en} (런타임이 실제로 읽는 경로)
   - DB 행: 설치된 언어팩 — 같은 슬롯의 가상 행보다 우선한다
   - 번들 패키지: lang-packs/_bundled 의 ja 등 — 비보호, 설치·제거 자유

  `row_origin` 축은 이 네 출처가 각각 보호 여부·우선순위·경로 규칙을 지키는지 본다. 개별 확장
  화면(target_identifier 필터)이 코어 행을 섞지 않는 것과 모듈 내장 번역이 런타임 경로(src/lang)를
  가리키는 것도 여기서 잠근다.

axes:
  row_origin: [core_virtual, extension_virtual, db_row, bundled_package]

effects:
  - base_locale_helper_recognizes_ko_en_only
  - core_locales_synthesized_as_protected_virtual_rows
  - db_row_overrides_virtual_built_in_in_same_slot
  - activation_requires_installed_host_extension
  - bundled_language_pack_packages_are_unprotected
  - reactivation_stash_is_read_once
  - extension_filter_excludes_core_packs
  - bundled_seeder_is_retired
  - language_pack_enums_expose_expected_cases
  # 모듈 내장 번역은 런타임이 등록하는 설치본 src/lang 을 가리킨다(resources/lang 은 런타임 미로드)
  - module_built_in_pack_points_to_runtime_lang_path
  - bundled_module_source_keeps_backend_lang_in_runtime_path

test_files:
  - tests/Feature/LanguagePack/PolicyAlignmentTest.php
  - tests/Feature/LanguagePack/ModuleLangPathAlignmentTest.php
