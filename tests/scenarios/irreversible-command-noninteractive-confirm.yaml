feature: 확인 질문에 답할 수 없는 되돌릴 수 없는 운영 명령 실행을 성공으로 끝내지 않는다

description: |
  `analytics:anonymize`, `analytics:purge`, `analytics:purge-extension`, `hotfix:rollback-stale-files --prune`,
  `settings:migrate-to-json` 은 작업 전에 확인을 묻는다. cron, CI, 원격 명령, `--no-interaction` 처럼 그 확인에 답할 수
  없는 실행은 종전에 기본값 「아니오」로 「취소」 한 줄을 내고 종료 코드 0 으로 끝나 자동화가 성공으로 읽었다. 지금은
  작업하지 않은 사유와 안내를 출력하고 종료 코드 1 로 끝난다. 확인 생략 옵션이 있는 명령(`analytics:anonymize` 와
  `settings:migrate-to-json` 의 `--force`)은 그 옵션을 안내한다. `analytics:purge` 두 명령의 `--confirm` 은 필수 동의
  표식일 뿐 비대화형 동의로 인정하지 않는다. 다섯 명령 모두 7.1.6 처럼 `--yes`(`-y`, 확인만 생략)를 받아 비대화형에서도
  확인을 건너뛴다 — 되돌릴 수 없는 삭제(`analytics:purge` 두 명령)와 `hotfix:rollback-stale-files --prune` 도 `--yes` 를
  비대화형 동의로 받고, 안내는 그 옵션을 적는다(7.1.6 과 같은 형태 — 7.2.0 초기의 「확인 없이 지우는 방법 없음」을
  바꿈). 대화형에서 운영자가 직접
  「아니오」를 답한 취소는 종전처럼 0 이다. 판정은 `HasUnifiedConfirm::canAnswerConfirmation()` 한 곳이다
  (`extension-lifecycle-noninteractive-confirm.yaml`, `core-update-noninteractive-confirm.yaml` 과 같다).
  각 테스트는 해당 명령 전부를 데이터 공급자로 돈다(확인 생략 옵션 경우는 그 옵션이 있는 두 명령만).

axes:
  input:
    - no_interaction_option
    - no_terminal
    - skip_option
    - yes_option
    - interactive_no_answer

effects:
  - unanswerable_confirmation_fails_with_reason_and_guidance
  - work_does_not_start_without_confirmation
  - purge_confirm_option_is_not_noninteractive_consent
  - skip_option_passes_the_confirmation
  - yes_option_passes_the_confirmation
  - interactive_no_answer_keeps_success_exit_code

test_files:
  - tests/Feature/Console/IrreversibleCommandNonInteractiveConfirmTest.php
