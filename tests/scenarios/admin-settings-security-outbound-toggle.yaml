feature: admin_settings_security_outbound_toggle

description: |
  관리자 환경설정 > 보안 탭의 「내부 네트워크 주소 호출 허용」 토글(#466)과 비밀번호 최소 길이 경계값(#493)의
  브라우저 회귀 가드. 서버가 대신 보내는 outbound 요청에서 내부 네트워크 주소를 기본 차단하되,
  사내 서버를 호출해야 하는 운영 환경을 위해 이 토글로 예외를 허용한다. 토글이 번역문과 함께
  마운트되고 클릭이 폼 상태와 저장 버튼 활성으로 이어지는지, 비밀번호 최소 길이 입력의 min/max 가
  설정 응답의 서버 한계값에서 실제로 해석되는지 잰다.

# 입력 axis — 시험 마킹(`tab=security, permitted=yes`)에서 도출한 값이다(선언 = 마킹).
# 세 시험 모두 core.settings.read·update 권한 토큰으로 보안 탭에 들어가며, 조합은 1칸이다.
axes:
  tab: [security]
  permitted: [yes]

effects:
  # 보안 탭에 토글 행이 마운트되고 항목명·설명이 `$t:` 원문이 아닌 번역문이며 checkbox 가 있다
  - toggle_mounted
  # 토글 클릭이 checked 상태를 뒤집고 변경 감지로 저장 버튼이 활성화된다
  - toggle_interactive
  # 비밀번호 최소 길이 입력의 min/max 가 설정 응답 `_meta.limits` 의 서버 한계값과 같다
  - password_limit_binding_resolved

test_files:
  - tests/Playwright/specs/admin/settings-security-outbound-toggle.spec.ts
