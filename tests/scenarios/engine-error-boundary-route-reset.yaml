feature: 컴포넌트 오류 경계는 같은 레이아웃 안에서 경로·쿼리가 바뀌면 다시 그려 본다 (engine-v1.93.0)

description: |
  노드마다 감싸는 오류 경계는 렌더 오류를 잡으면 「컴포넌트 로드 실패」 박스를 그리고 되돌리는 경로가 없었다. 같은 레이아웃 안의
  SPA 이동(쿼리만 바꾸는 탭 전환, 같은 레이아웃의 다른 경로)은 노드를 다시 마운트하지 않으므로, 새 화면의 데이터가 정상이어도
  박스가 새로고침 전까지 남았다(관리자 히어로섹션 관리의 위치 탭 전환).

  계약:
    1) 오류 상태의 경계는 렌더 문맥 `route`·`query` 값이 오류 때와 달라지면 자식을 다시 그린다.
    2) 정상 경계는 경로·쿼리가 바뀌어도 자식을 다시 마운트하지 않는다.
    3) 다시 그리기는 렌더 중에 하지 않는다. 커밋 뒤 받는 중이 아니면 곧바로, 받는 중이면 받기가 끝날 때(transitionManager 알림)
       전환 갱신으로 한 번 다시 그린다. 앞 화면 값으로 다시 그려 던지는 렌더는 0 이다(링크 이동의 같은 화면 이어 쓰기, 그 렌더 도중
       응답이 모두 와 받는 중 표시가 꺼진 경우 포함 — 전환 렌더에서 던지면 React 회복 오류 #520).
    4) 받기가 끝난 뒤 다시 실패하면 박스로 돌아가고 다음 경로·쿼리 변경 전까지 다시 시도하지 않는다(렌더 루프 없음).
    5) 값이 같은 새 `query` 객체(같은 탭 다시 누름)와 경로·쿼리가 그대로인 화면 갱신은 다시 시도하지 않는다.

axes:
  case: [query_change_recovers, same_screen_navigate_recovers, round_trip_no_stale_retry, settle_without_parent_render, settled_during_stale_render, path_change_recovers, healthy_boundary_not_remounted, retry_fails_again]

effects:
  - error_box_cleared_after_query_change    # 쿼리만 바꾸는 이동(updateQueryParams) 뒤 박스가 사라진다
  - error_box_cleared_after_path_change     # 같은 레이아웃의 다른 경로 이동 뒤 박스가 사라진다
  - recovered_component_shows_new_data      # 다시 그린 컴포넌트가 새 화면의 데이터를 그린다
  - healthy_boundary_not_remounted          # 정상 경계의 자식은 마운트 수·DOM 노드가 그대로다
  - error_box_kept_when_retry_fails         # 다시 그린 자식이 또 실패하면 박스로 돌아간다
  - no_stale_data_retry                     # 경로·쿼리가 바뀐 뒤 앞 화면 값으로 다시 그려 던지지 않는다(전환 렌더 회복 오류 #520 방지)
  - no_retry_without_route_change           # 같은 값의 쿼리 재적용·전역 상태 갱신은 다시 시도하지 않는다
  - no_render_loop                          # 렌더 루프(Maximum update depth) 없음
  - browser_position_tab_round_trip_resets_error_box  # 실제 화면(관리자 히어로섹션 위치 탭): 깨진 홈 → 쇼핑 탭 박스 0 → 홈 탭 박스 1, 탭 줄 같은 노드, pageerror 0

test_files:
  - resources/js/core/template-engine/__tests__/DynamicRenderer.errorBoundaryRouteReset.test.tsx
  - tests/Playwright/specs/engine-error-boundary-route-reset.spec.ts

validation:
  browser_check: 관리자 히어로섹션 관리에서 미리보기 컴포넌트가 던지도록 배너 응답을 깨뜨린 뒤 위치 탭만 바꿔(쿼리 변경) 「컴포넌트 로드 실패」 박스 수가 0 이 되는지, 정상 위치를 오갈 때 다른 노드가 다시 마운트되지 않는지 본다
  note: |
    fail-first(HEAD worktree 사본): 수정 전 엔진으로 4 failed / 5(정상 경계 다시 마운트 없음은 종전에도 통과 — 잠금용).
    「경로·쿼리 변경 때 한 번」만 다시 그리는 수정으로는 same_screen_navigate_recovers 1 failed(이어 그린 옛 값으로 실패한 채 남음).
    값 비교를 끄면(참조만 비교) retry_fails_again 1 failed(같은 값의 쿼리 재적용에 다시 시도).
    「받는 중에도 경로·쿼리 변경 때 바로 다시 그림」 판정으로는 same_screen_navigate_recovers·round_trip_no_stale_retry 2 failed(앞 위치 값으로 던진 렌더 ['main@sub', …]).
    「받는 중이면 렌더 중에 미룸」 판정으로는 settled_during_stale_render 1 failed(['main@sub'] + React 가 회복한 렌더 오류가 처리되지 않은 오류로 보고됨).
    커밋 뒤 다시 그리기(retryAfterSettled)를 끄면 7 failed / 8.
    E2E(tests/Playwright/specs/engine-error-boundary-route-reset.spec.ts): 홈 위치 목록 응답만 `data.data` 를 객체로 깨뜨리고 쇼핑 위치는
    실제 응답, GET·HEAD 가 아닌 `/api/` 요청은 abort. 히어로섹션 플러그인 비활성이면 건너뛴다. 수정 전 대조는 G7_E2E_ENGINE_BUNDLE 로
    HEAD 엔진 번들을 이 브라우저에만 끼운다(1회차 쇼핑 탭 뒤 박스 1 로 red).
