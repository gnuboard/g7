# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "비밀번호 인증 정책 필터 `core.auth.password_auth_decision` (#798 K3 · W1~W4 · W28 · W29)"

description: |
  비밀번호 인증 정책 필터 `core.auth.password_auth_decision` (#798 K3 · W1~W4 · W28 · W29)
  확장이 「이 식별자·회원은 비밀번호를 쓰지 못한다」고 답하면 코어가 비밀번호 로그인·재설정·설정·관리자 지정·로그인 중 변경을 막는다.
  식별자 기준 판정은 로그인 시도 전(실패 횟수 0), 회원 기준 판정은 비밀번호가 맞은 뒤(틀리면 일반 실패와 같다). 재설정 요청의 회원 기준
  거절은 일반 성공 응답 + 액션 1회 + 재설정 토큰 행 0. 재설정 완료·토큰 확인의 회원 기준 거절은 유효한 링크를 확인한 뒤에만 드러난다. 거절 응답은 403 `errors.code = auth.password_auth_disabled` + 이동 경로.

axes:
  purpose: [login, reset_request, reset_complete, set_password, admin_set_password, login_password_change]
  basis: [identifier, user]
  guard: [user, admin]
  password: [correct, wrong]
  decision: [allow_require_two_factor]
  site_two_factor: [off]
  expiry: [on]
  filter: [invalid_value]
  token: [wrong]

effects:
  - identifier_denial_before_attempt
  - denial_response_carries_redirect
  - failed_attempts_unchanged
  - user_denial_after_password
  - wrong_password_hides_denial
  - user_denial_leaves_no_session
  - require_two_factor_forces_challenge
  - reset_request_identifier_denial_shown
  - reset_request_user_denial_silent
  - reset_blocked_action_fired
  - reset_complete_denied
  - reset_complete_policy_hidden_without_valid_token
  - set_password_denied
  - admin_set_password_denied
  - expiry_requirement_null_for_denied
  - login_password_change_denied
  - invalid_filter_value_allows_with_warning

test_files:
  - tests/Feature/Auth/PasswordAuthPolicyTest.php
