feature: 스케줄 명칭·설명의 언어팩 seed 경로 (이슈 #17, 7.2.0)

description: |
  스케줄 label·description 의 ja 등 추가 로케일은 언어팩 seed/schedules.json 으로 들어간다.

  적용 지점:
    - 코어 시딩 필터 core.schedules.config → LanguagePackSeedInjector::injectCoreSchedules (CoreScheduleSeeder 가 발화).
    - 확장 동기화 필터 seed.{id}.schedules.translations (matchKey=name, Module/PluginManager 가 발화).
    - 팩 켜기 SyncDatabaseTranslations → LanguagePackTranslationRepository::applySchedules (코어 팩=코어 소유 행만,
      확장 팩=그 확장 소유 행만, 직접 등록 행은 제외), 끄기 stripLocaleFromPack (운영자 수정 로케일 보존).
    - 켜기/끄기 재실행 대상 코어 시더(RunSeedersOnLanguagePackLifecycle)에 CoreScheduleSeeder.

coverage_strategy: full

axes:
  locale_pack: [core_ja_active, core_ja_deactivated, module_ja_active]
  owner: [core, module, custom]

effects:
  - core_pack_injects_catalog_labels
  - pack_activation_injects_core_rows_only
  - pack_deactivation_strips_injected_locale
  - extension_pack_injects_by_name
  - language_pack_reseed_includes_schedule_seeder

# E2E axis 없음: 번들 ja 팩 생성(build-language-pack-ja)은 번역 API 가 필요한 빌드 단계라 별도 실행 —
# 런타임 경로는 테스트가 임시 팩 디렉터리로 고정한다.

test_files:
  - tests/Feature/LanguagePack/LanguagePackScheduleSeedTest.php
