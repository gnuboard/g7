feature: 개발자 화면 회원 판정(서버 세션 + 그 로그인의 토큰 생존)·custom.auth·custom.admin·내부 API 도구

description: |
  로그인·2단계 인증·비밀번호 변경 완료·관리자 로그인은 세션에 로그인을 남기며 이번 토큰 ID 를 세션
  g7.screen_token_id 에 짝으로 묶는다. 토큰 갱신·가입 라우트도 세션을 열어 짝을 맞춘다. ScreenAuth::user() 는
  웹 세션 회원 + 짝 토큰 존재·미만료일 때만 회원이고, 판정 때 토큰 만료를 API 와 같은 규칙으로 연장한다.
  custom.auth 는 비회원을 로그인 화면으로, custom.admin 은 비회원을 관리자 로그인으로·일반 회원을 403 으로 보낸다.
  InternalApiClient 는 같은 프로세스에서 그 회원 자격(비회원이면 손님)으로 /api/ 를 부르고 상태를 그대로 돌려주며,
  세션을 여는 인증 API·재호출·비 API 경로를 거부하고 가드·로케일·request()·현재 라우트를 되돌린다.
  로그인 화면의 로그인 수단 묻기(사용자·관리자)는 세션 쿠키를 내리지 않아, 로그인 응답보다 늦게 도착해도 짝지은 세션을 덮지 않는다.

