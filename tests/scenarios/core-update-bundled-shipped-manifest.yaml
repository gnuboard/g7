feature: core_update_bundled_shipped_manifest

description: |
  코어 업데이트의 번들 출하 목록 대조 (7.2.0). 업데이트·설치가 놓은 번들 파일의 경로·본문 해시를 사이트에 남기고
  (`storage/app/core-update/bundled-shipped.json`), 다음 업데이트의 기본(증분) 모드가 「직전 목록에는 있고 새 목록에는 없는」
  파일만 지운다. 운영자가 고친 파일·운영자가 넣은 파일·확장 클래스 파일·확장째 사라진 디렉토리는 남긴다. 직전 목록이 없으면
  지우지 않고 기록만 한다. 되돌리기는 지운 파일(백업 복원)과 직전 목록을 돌려놓는다.

coverage_strategy: full

axes:
  case: [prune_rules, collect_and_restore, web_plan_step, apply_and_rollback, rollback_before_apply, manual_seed, upgrade_step_seed]

effects:
  - shipped_then_removed_file_deleted
  - modified_shipped_file_kept
  - operator_file_kept
  - extension_class_file_retained
  - vanished_extension_untouched
  - manifest_collects_bundled_files
  - chunked_collect_matches_full
  - rollback_restores_previous_manifest
  - incremental_apply_prunes_and_records
  - first_update_records_without_prune
  - rollback_restores_files_and_manifest
  - web_plan_stores_shipped_manifest
  - manifest_records_release_version
  - seeded_manifest_survives_rollback_before_apply
  - stale_previous_dropped_at_run_start
  - rerun_apply_keeps_first_previous
  - case_only_rename_not_deleted
  - update_excludes_not_listed_nor_pruned
  - manual_seed_skips_bundled_manifest
  - installer_seed_writes_bundled_manifest
  - upgrade_step_seeds_from_release
  - upgrade_step_skips_without_release_or_when_present

test_files:
  - tests/Unit/Services/CoreUpdateBundledShippedManifestTest.php
  - tests/Unit/Upgrades/SeedBundledShippedManifestTest.php
