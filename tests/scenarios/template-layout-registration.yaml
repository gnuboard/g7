feature: 템플릿 설치, 제거, 활성화에 따른 레이아웃 DB 등록

description: |
  TemplateManager 가 템플릿 레이아웃 파일을 template_layouts 에 등록하고 지우는 계약을 고정한다.
  설치는 레이아웃을 등록하고(같은 템플릿을 두 번 설치해도 중복이 생기지 않는다), 제거는 그 템플릿의
  레이아웃을 모두 지운다. 활성화와 비활성화는 템플릿 자체(source_type=template) 레이아웃 수를 바꾸지
  않으며, 활성화하면 템플릿 설정 화면 레이아웃이 교차 등록된다. errors 레이아웃은 디렉터리 접두사를
  포함한 errors/{code} 이름으로 시드되고, 레이아웃 디렉터리가 없으면 필수 에러 레이아웃도 없어 설치가 실패한다.

coverage_strategy: full

axes:
  lifecycle_step: [install, install_twice, uninstall, activate_deactivate, install_without_layouts_dir]

effects:
  - install_template_registers_layout_json_into_template_layouts
  - install_template_seeds_error_layouts_with_errors_directory_prefix
  - install_template_twice_does_not_duplicate_layouts
  - uninstall_template_removes_its_layouts
  - activate_deactivate_keeps_template_own_layout_count
  - activate_cross_registers_template_settings_layout
  - install_template_without_layouts_directory_throws

test_files:
  - tests/Feature/Template/TemplateLayoutRegistrationTest.php
