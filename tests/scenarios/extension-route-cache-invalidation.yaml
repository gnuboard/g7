feature: 라우트가 바뀌는 지점의 라우트 캐시 갱신

description: |
  `route:cache` 가 걸린 사이트는 캐시에 담긴 라우트만 서빙한다. 확장을 설치·활성화·비활성화·삭제·업데이트해
  라우트가 바뀌어도 캐시를 갱신하지 않으면 새 라우트는 오류 없이 404 가 된다. 훅 캐시와 달리 라우트 캐시에는
  스캔 폴백이 없다. 갱신 헬퍼의 동작, 갱신을 불러야 하는 지점, 상태 캐시 무효화와의 순서, 코어 업데이트 흐름
  끝의 재생성을 잰다.

axes:
  case:
    - helper_rebuild
    - helper_testing_env
    - helper_clear
    - lifecycle_sites
    - core_update_flow
    - rebuild_order
    - update_hook_cache

effects:
  - route_cache_helper_clears_stale_cache_first
  - route_cache_helper_skips_cache_build_in_testing
  - route_cache_helper_clear_does_not_rebuild
  - every_extension_lifecycle_route_change_rebuilds_route_cache
  - core_update_flow_rebuilds_route_cache_with_config_cache
  - route_cache_rebuild_follows_status_cache_invalidation
  - extension_update_regenerates_hook_cache_after_status_restore

test_files:
  - tests/Feature/Extension/ExtensionRouteCacheInvalidationTest.php
