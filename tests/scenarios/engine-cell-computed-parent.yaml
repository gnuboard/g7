feature: 반복 셀·확장 행 안의 _computed 가 부모 컴포넌트의 최신 계산값을 본다 (engine-v1.86.0)

description: |
  DataGrid 셀(`cellChildren`·`subRowChildren`)은 `G7Core.renderItemChildren`, 확장 행(`expandChildren`)은 `G7Core.renderExpandContent`
  로 그려진다. 두 래퍼가 셀 문맥에 빈 `_computed` 를 먼저 넣어, 셀 렌더 함수가 부모 데이터 문맥을 「없는 키만」 병합할 때 부모 값이
  들어오지 못했다 — 셀 안 `{{_computed.x}}` 가 늘 undefined(SSO 회원 연결 표 「연결 해제」 상시 비활성, 통계 리포트 표, 이커머스 상품 표
  통화 열). 셀 문맥의 `_computed` 기본값을 `componentContext.computedRef.current`(없으면 `parentDataContext._computed`)로 둔다.
  셀 문맥이 `_computed` 를 직접 주면 그 값이 이기고, 부모 문맥이 없는 호출(CardGrid)은 종전처럼 빈 객체다.

axes:
  case: [cell_computed_ref, cell_parent_data_context, cell_explicit_item_context, cell_no_parent, expand_computed_ref]

axis_notes:
  case: >-
    cell_* 는 G7Core.renderItemChildren, expand_* 는 G7Core.renderExpandContent. 확장 행은 componentContext 를 늘 받으므로
    computedRef 경로 하나만 의미가 있다(나머지 출처는 셀 경로로 잠근다).

effects:
  - cell_computed_reads_parent_latest
  - cell_computed_explicit_wins
  - cell_computed_empty_without_parent

test_files:
  - resources/js/core/__tests__/G7CoreGlobals.itemChildrenComputed.test.ts
