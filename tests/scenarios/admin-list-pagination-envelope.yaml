# audit:allow test-scenario-coverage[cross_product] reason: 본 매니페스트는 관리자 목록의 쪽 정보 봉투 위치 계약 SSoT. axes cross product 는 화면·엔드포인트 전수에 걸쳐 있어 docblock 전수 @scenario 매핑이 비현실적이라 면제하고, 회귀 가드는 test_files(응답 계약 단위 + 레이아웃 전수 스캔 + Playwright E2E)로 커버한다.

feature: admin_list_pagination_envelope

description: |
  관리자 목록의 쪽 정보가 **응답과 화면이 합의한 한 자리**에 실리는지를 고정한다.

  쪽 이동은 값이 맞는지가 아니라 **어디에 담겼는지**에서 깨진다. 서비스가 63건·7쪽을
  정확히 계산해도, 응답이 그 값을 화면이 보지 않는 자리에 담으면 화면은 마지막 쪽 수를
  모른 채 쪽 단추를 1번 하나만 그린다. 값이 틀린 게 아니라 자리가 어긋난 것이라
  API 테스트도 서비스 테스트도 초록이고, 총 건수 표시 줄은 멀쩡히 「총 63개」라고 적혀
  눈으로는 "총 건수는 맞는데 이동만 안 된다" 는 모순으로만 나타난다.

  핵심 설계:
    - **쪽 정보의 자리는 `data.pagination` 하나다.** 모듈·플러그인·템플릿·언어팩·예약 작업이
      같은 자리를 쓴다. `meta` 에 겹쳐 싣는 것은 하위호환 목적에 한하며, 화면이 읽는
      정본은 언제나 `pagination` 이다.
    - **한 화면이 두 자리를 나눠 읽지 않는다.** 쪽 단추는 `pagination`, 요약 줄은 `meta` 로
      갈라지면 한쪽만 고쳐도 다른 쪽이 조용히 남는다 — 이 결함의 실제 모습이었다.
    - **어긋남은 양방향으로 난다.** 서버가 안 담는 쪽(언어팩)과 화면이 딴 자리를 읽는 쪽
      (예약 작업)이 같은 증상을 낸다. 그래서 응답 계약과 레이아웃 경로를 둘 다 잠근다.
    - **fallback 도 응답과 같은 모양이어야 한다.** 받기 전 기본값이 평면이면 첫 그림에서만
      엉뚱한 쪽 수를 읽는다.
    - `from`/`to` 는 서버가 준 값을 쓴다. 화면에서 산술로 만들면 마지막 쪽에서 실제 건수를
      넘는 범위를 적게 된다.

axes:
  envelope_slot: [pagination, meta_only, flat]
  surface: [language_pack_list, schedule_list, schedule_history_modal, module_list, plugin_list]
  consumer: [pager_buttons, total_summary_line, fallback_before_fetch]
  position: [first, middle, last]

exclusions:
  - { envelope_slot: flat, surface: module_list, reason: "모듈 목록은 처음부터 pagination 자리를 썼다 — 평면 경로가 존재한 적이 없다" }
  - { envelope_slot: flat, surface: plugin_list, reason: "플러그인 목록도 같다 — 기존 회귀 가드가 이미 잠그고 있다" }
  - { consumer: fallback_before_fetch, position: middle, reason: "받기 전 기본값에는 쪽 위치 개념이 없다 — 첫 그림 하나뿐이다" }
  - { consumer: fallback_before_fetch, position: last, reason: "같은 이유" }

effects:
  # ── 응답 봉투 (P0) ──
  - language_pack_index_exposes_pagination_slot
  - pagination_slot_carries_last_page_and_has_more
  - meta_slot_is_kept_for_backward_compatibility
  # ── 레이아웃 경로 (P0) ──
  - pager_reads_pagination_slot_not_flat_path
  - total_summary_reads_same_slot_as_pager
  - fallback_shape_matches_response_shape
  # 확장 목록(모듈·플러그인)은 이 계약을 먼저 겪고 이미 잠가 둔 표면이다.
  # 같은 파일이 같은 축을 보므로 같은 매니페스트가 소유한다.
  - extension_list_pager_reads_pagination_slot
  - list_array_path_is_left_untouched
  # ── 종단(브라우저) 확인 (P0) ──
  # 응답과 레이아웃이 각각 맞아도 둘이 만나는 지점에서만 드러나는 결함이라 화면까지 본다.
  - page_numbers_visible
  - page_navigates
  - last_page_shows_real_remainder

test_files:
  # 코어 — 언어팩 목록 응답이 쪽 정보를 화면이 읽는 자리에 싣는지
  - tests/Feature/Api/Admin/LanguagePackControllerTest.php
  # 화면 — 관리자 목록 레이아웃이 평면 경로를 읽지 않는지 (전수 스캔)
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-extension-list-pagination-binding.test.tsx
  # 브라우저 — 보호된 언어팩을 펼친 목록의 쪽 단추 표시와 실제 이동
  - tests/Playwright/specs/admin/language-pack-pagination-navigation.spec.ts
