# audit:allow test-scenario-coverage[cross_product] reason: issue:#609 실제 요청 시간 초과(`max_execution_time`)와 프록시 응답 제한은 실행 중인 웹 서버 프로세스의 성질이라 PHPUnit·Vitest 가 그 조합을 만들 수 없다. 경계(점유 만료 창 · 치명 종료 기록 · 사라진 요청 승격 · 되돌리기 재시도 상한 · 훑기 시간 상한 · 커서 분할 등가 · 화면 대기와 재호출)는 시계·제한값·오류 주입으로 test_files 가 전수 잰다. 조합 종단은 리허설 환경(Windows nginx + php-cgi, max_execution_time 300)의 화면 실측이 맡는다.

feature: 코어 업데이트 웹 단계의 요청 시간 제한 (단계 길이 · 끊긴 뒤 정리 · 비밀값 기록)

description: |
  관리자 화면 코어 업데이트는 한 요청이 한 단계를 맡는다. 그런데 단계가 서버의 요청 시간
  제한보다 길면 두 곳에서 끊긴다:

  1. **화면 쪽** — 단계 요청을 화면 API 기본 제한(30초)으로 불러, 그보다 긴 단계는 서버가 계속
     도는데 화면만 끊겨 [이어서 진행] 에서 멈췄다. 그동안 사이트는 점검 모드다.
  2. **서버 쪽** — 단계가 `max_execution_time` 을 넘기면 PHP 가 치명 오류로 요청을 끊는다.
     그 단계는 실패로도 성공으로도 기록되지 않고 점유만 15분 남아, 자동 되돌리기가 돌지
     않은 채 사이트가 점검 모드에 갇혔다.

  고친 방향:

  - 화면은 서버가 알려 준 대기 시간(요청 수명 + 여유)만큼 기다리고, 그래도 끊기면 상태를
    다시 읽어 점유가 풀린 뒤 스스로 다시 부른다.
  - 서버는 실제로 적용된 요청 수명을 점유에 선언하고(만료 창 = 수명 + 여유), 치명 오류로 끝난
    단계는 종료 처리에서 실패로 기록한다. 종료 처리도 못 돈 요청은 다음 요청이 만료된 점유를
    보고 실패로 확정한다. 끊긴 되돌리기는 정해진 횟수만 다시 한다.
  - 나눌 수 있는 긴 단계는 요청 몫 안에서 멈춘다 — 사전 점검의 트리 훑기는 거기까지의 판정으로,
    적용 대상 산출은 커서를 남기고 다음 요청이 이어 간다(결과는 한 번에 한 것과 같다).
  - 사전 점검은 링크·정션을 「쓰기 권한 없음」으로 막지 않는다(Windows 의 `public/storage` 정션).

  - 나머지 긴 단계도 요청 몫 안에서 나눈다 — ZIP 추출은 항목 번호, 백업·되돌리기는 정렬된 경로 커서
    (되돌리기는 이번 업데이트가 바꾼 파일을 첫 조각에서 먼저), vendor 반영은 디렉터리 바꿔 끼우기,
    번들 확장은 한 요청에 한 항목, 마무리·되돌리기의 큰 폴더 지우기는 나눠 지우기.

  같은 묶음으로, 점검 모드 우회 비밀값을 기록 파일·실행 기록에 남기지 않는다.

axes:
  request_time_limit: [short, unlimited]
  response: [delivered, cut_off, cut_off_repeatedly, rejected]
  interruption: [none, fatal_shutdown, vanished_request, rollback_interrupted]
  scan: [complete, time_truncated, link_in_tree]
  plan_slicing: [single_pass, sliced, order_changed]
  secret_channel: [upgrade_log, cli_report, web_state]
  run_state: [running, rolling_back, finished]
  long_step: [archive_extraction, backup, vendor_copy, bundled_updates, rollback, finalize_cleanup]
  slicing: [sliced, web_requests, interrupted, swap]

effects:
  # 화면
  - the_screen_waits_as_long_as_the_server_step_may_run
  - a_cut_off_step_request_resumes_on_its_own
  - a_permission_error_stops_without_retrying
  - repeated_failures_without_progress_stop_with_a_reason

  # 점유 · 끊긴 단계 정리
  - a_claim_lives_only_as_long_as_its_request
  - a_timed_out_step_is_recorded_as_failed_and_rolled_back
  - a_vanished_request_is_promoted_to_a_failure
  - an_endlessly_interrupted_rollback_opens_manual_recovery
  - the_status_tells_the_screen_how_long_to_wait
  - the_status_reports_the_installed_version
  - a_restored_site_is_reopened_even_if_the_rollback_cleanup_keeps_failing
  - the_failure_reason_carries_no_terminal_escape_codes

  # 긴 단계 나누기
  - a_preflight_scan_stops_within_its_share_of_the_request
  - a_link_or_junction_is_not_reported_as_unwritable
  - a_sliced_plan_matches_the_single_pass_plan
  - the_plan_step_continues_in_the_next_request

  # 비밀값
  - the_bypass_secret_never_reaches_a_log_file

  # 나머지 긴 단계 나누기 (ZIP 추출 · 백업 · vendor 반영 · 번들 확장 · 되돌리기 · 마무리 정리)
  - the_archive_extraction_fits_within_a_short_request_limit
  - the_backup_fits_within_a_short_request_limit
  - the_vendor_replacement_fits_within_a_short_request_limit
  - the_bundled_extension_updates_fit_within_a_short_request_limit
  - the_rollback_fits_within_a_short_request_limit
  - an_interrupted_sliced_rollback_is_resumed_by_the_next_request
  - the_cleanup_fits_within_a_short_request_limit
  - the_ownership_restore_fits_within_a_short_request_limit
  - a_slice_leaves_room_to_finish_the_response
  - a_finalize_past_its_cleanup_is_never_rolled_back
  - the_bundled_progress_is_saved_before_the_first_item_runs
  - the_backup_path_is_saved_before_copying_starts
  - the_request_that_swaps_the_vendor_back_ends_there
  - repeated_failures_after_the_claim_still_back_off
  - the_progress_files_are_replaced_atomically
  - a_failed_vendor_swap_leaves_a_recovery_record
  - creating_a_backup_does_not_walk_older_backups

