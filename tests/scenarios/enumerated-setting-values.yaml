feature: 설정 저장 — 닫힌 허용값 표(EnumeratedSettingValues)

description: |
  벌크 저장과 단건 저장 두 경로가 공유하는 허용값 표다. 값이 닫힌 설정 키(실행 모드, 자산 URL 방식)만
  In 규칙을 돌려주고, 나머지 키는 null 이다. 표의 허용값은 그 값을 해석하는 쪽(ExecutionMode 열거형,
  AssetUrl 상수)과 같아야 하고, 표의 키는 설정 카탈로그 기본값에 실재하며 기본값이 허용값 안에 있어야 한다.

axes:
  setting_key: [non_enumerated, execution_mode, asset_url_mode]

effects:
  - non_enumerated_key_has_no_allowed_value_rule
  - execution_mode_allowed_values_match_the_enum
  - asset_url_mode_allowed_values_match_the_constants
  - enumerated_keys_exist_in_the_settings_catalog_with_allowed_defaults
  - enumerated_rule_accepts_only_allowed_values

test_files:
  - tests/Unit/Http/Requests/Settings/EnumeratedSettingValuesTest.php
