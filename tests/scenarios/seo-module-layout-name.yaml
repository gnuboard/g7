notes: |
  편집기 봇 미리보기의 요청 본문(`layout_name`)은 레이아웃 편집기 Vitest(SeoBotPreviewPanel·SeoForm)가
  확인하고 그 소유 매니페스트는 `page-settings.yaml` 이다. 모듈 화면 SEO 예시 선언은 hello 모듈 시나리오
  `user-memo-list-markup.yaml` 이 소유한다. 실제 봇 응답(제목·본문·캐시 적중)은 Playwright
  `seo-bot-rendering.spec.ts` 와 브라우저 정밀 점검 매트릭스로 확인한다.
