feature: 코어 마이그레이션 재실행 가드 (#599 validate P4)

description: |
  마이그레이션이 중간에 멈춘 뒤 다시 돌 때, 앞선 실행이 이미 끝낸 단계를 또 하려다 같은 자리에서
  매번 실패하지 않아야 한다. MySQL 은 DDL 을 되돌리지 않으므로 멈춘 지점 앞의 변경은 남고
  마이그레이션 기록은 남지 않는다 — 다음 실행은 같은 up() 을 처음부터 다시 돈다.

  핵심 동작:
    - 활동 로그 i18n 전환은 `description` 이 이미 지워졌으면 삭제를 건너뛰고, 남은 컬럼·인덱스만 만든다.
    - 되돌리기(down)도 인덱스·컬럼을 각각 확인해, 인덱스를 못 만들고 멈춘 설치본에서 막히지 않는다.
    - 레이아웃 확장 조각 식별자 마이그레이션은 고유 키가 이미 있으면 다시 만들지 않고, 되돌리기도
      고유 키가 있을 때만 지운다(MySQL 접두 길이 raw 문과 백필 UPDATE 가 있어 소스로 확인한다).
    - 부분 상태는 공유 테스트 DB 에 만들지 않고 가짜 스키마 빌더(`Tests\Support\RecordingSchemaBuilder`)
      위에서 재현한다 — DDL 이 암묵 커밋되어 테이블이 망가지기 때문이다.

axes:
  defect: [rerun_guard]

effects:
  - activity_log_i18n_rerun_skips_the_already_dropped_column
  - activity_log_i18n_down_survives_a_partial_up
  - layout_fragment_key_unique_index_is_guarded_on_rerun_and_rollback

test_files:
  - tests/Feature/Validate/ValidateP4MigrationsTest.php

notes: |
  e2e_browser=not_applicable — 스키마 마이그레이션(화면 무관).
