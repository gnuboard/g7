feature: 트러블슈팅 회귀 — 컴포넌트(responsive 스코프, DataGrid, Form, Select, Icon, iteration, isolated 스코프, bindingType, 렌더 구조, 슬롯 hook 순서, cellChildren 번역과 파이프)

description: |
  troubleshooting-components.test.ts 의 해결된 트러블슈팅 사례를 잠그는 회귀 시험이다.
  사례마다 원인이 달라 사례끼리 곱할 입력 축이 없다. 축 case 는 문서의 사례(시험 파일의 가장 안쪽 describe) 하나씩이고,
  효과는 그 사례가 지키는 해결 성질 하나씩이다(같은 사례의 시험 여럿은 같은 칸과 같은 효과를 서로 다른 각도로 잠근다).

