feature: _pending 에 스테이징된 확장의 Composer 의존성을 활성 디렉토리 이관 전에 선행 설치한다

description: |
  GitHub·ZIP 으로 받은 모듈·플러그인은 먼저 `_pending/{identifier}` 에 스테이징된다. 외부 Composer 의존성이 있으면
  활성 디렉토리로 옮기기 전에 `_pending` 에서 `composer install` 을 먼저 돌리고, 설치 흐름의 Phase 4.5(활성 디렉토리
  Composer 설치)를 건너뛴다.

  이 매니페스트가 고정하는 판정:
    - `_pending` 존재 판정(ExtensionPendingHelper::isPending)과 `_pending` 경로 계산(getPendingPath).
    - `_pending` 경로의 외부 Composer 의존성 판정 — composer.json 이 없거나 php·ext-* 만 요구하면 의존성 없음.
    - 선행 설치 조건: 활성 디렉토리 부재 + `_pending` 존재 + 외부 의존성 있음. 셋 중 하나라도 어긋나면 건너뛴다.
    - `_pending` 에서 Composer 를 돌렸으면(실패 포함) Phase 4.5 를 다시 돌지 않는다(중복 설치 방지).

axes:
  ext_type: [module, plugin]
  stage: [pending_detection, dependency_check, preinstall_precondition, phase_skip_flag, pending_path]

exclusions:
  - { ext_type: plugin, stage: dependency_check, reason: "의존성 판정은 확장 종류와 무관한 ExtensionManager::hasComposerDependenciesAt 경로 판정이라 모듈 경로로 대표한다. 플러그인 경로의 같은 판정은 preinstall_precondition 테스트가 거친다." }
  - { ext_type: plugin, stage: phase_skip_flag, reason: "composerDoneInPending 플래그 분기는 설치 흐름의 코드 패턴을 모듈 기준으로 재현하는 단위 검증이며, 플러그인 설치 흐름은 같은 분기를 공유한다." }

effects:
  - pending_extension_detected
  - missing_pending_not_detected
  - pending_detected_alongside_bundled
  - external_dependencies_detected_at_pending_path
  - no_composer_json_means_no_dependencies
  - platform_only_requirements_are_not_dependencies
  - preinstall_required_when_active_absent_and_pending_has_deps
  - preinstall_skipped_when_active_exists
  - preinstall_skipped_when_pending_absent
  - preinstall_skipped_without_external_dependencies
  - phase_4_5_skipped_after_pending_composer
  - phase_4_5_runs_without_pending_composer
  - failed_pending_composer_still_marks_done
  - pending_path_resolves_under_pending_dir

test_files:
  - tests/Unit/Extension/PendingComposerPreInstallTest.php

notes:
  - 실제 installModule/installPlugin 을 끝까지 돌리는 통합 검증은 이 매니페스트 범위 밖이다 — 여기서는 선행 설치 조건과 플래그 분기만 단위로 고정한다.
  - _pending·_bundled 디렉토리의 목록·설치·삭제·업데이트 감지 흐름은 extension-pending-bundled-sources.yaml 이 소유한다.
