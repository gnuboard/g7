feature: 이미지 썸네일 캐시 관리 — 정리 명령·미리 만들기 명령·관리 API (7.2.0)

description: |
  썸네일 파생본은 `thumbnails/{원본 disk}/{원본 경로}/{규격명}_{지문}.{ext}` 키로 썸네일 디스크에 쌓인다.
  파일명에 규격 지문만 들어가므로 규격 값을 고치거나 엔진을 바꾸면 옛 지문 파일이 남고, 드라이버 밖에서 원본을
  지우면 원본 없는 파생본이 남는다. 정리 명령 `thumbnails:prune` 이 그 파일들을 지우고(스케줄 05:20, 설정
  `upload.thumbnail_prune_enabled` 기본 켬), `thumbnails:pregenerate` 가 기존 원본의 썸네일을 미리 만든다.

  관리 API(환경설정 > 업로드 탭 「저장 위치 · 캐시」)는 저장 위치를 원본 분류(공개·권한)별 두 줄로 다룬다.
  두 분류가 같은 디스크를 써도 원본 제공자 판정으로 따로 세고 따로 지운다 — 공개만 비웠는데 권한 이미지 썸네일이
  사라지면 안 된다. 퍼지 훅 `core.thumbnail.after_purge` 는 요청 하나에 한 번 발화하고, CDN 대상 경로는 공개 자산
  디스크에 둔 위치에만 싣는다.

  축 surface 는 진입점이다 — 정리 명령, 미리 만들기 명령, stats·purge·pregenerate API.

axes:
  surface: [prune_command, pregenerate_command, stats_api, purge_api, pregenerate_api]

effects:
