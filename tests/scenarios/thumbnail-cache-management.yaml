  - prune_dry_run_counts_without_deleting
  - prune_deletes_stale_fingerprint_files
  - prune_deletes_unknown_preset_files
  - prune_deletes_files_whose_source_is_gone
  - prune_keeps_current_files
  - prune_removes_emptied_directories
  - prune_purge_hook_fires_once
  - prune_engine_change_marks_stale
  - prune_keeps_first_frame_thumbnails
  - prune_days_deletes_old_files_only
  - prune_purge_payload_has_every_key
  - scheduled_prune_respects_toggle
  # 미리 만들기 명령
  - pregenerate_command_runs_every_batch
  - pregenerate_skips_existing_thumbnails
  - pregenerate_dry_run_creates_nothing
  - pregenerate_limit_caps_sources
  - pregenerate_rejects_unknown_names
  - pregenerate_hooks_fire_once_per_batch
  - pregenerate_dry_run_fires_no_hooks
  - pregenerate_time_budget_returns_resume_cursor
  # 관리 API
  - stats_returns_two_locations_by_classification
  - stats_labels_are_translated
  - stats_remote_disk_not_counted
  - stats_cached_until_purge_or_pregenerate
  - purge_shared_disk_keeps_other_classification
  - purge_preset_deletes_only_that_preset
  - purge_all_reports_both_locations
  - purge_keeps_originals_on_shared_public_disk
  - purge_hook_fires_once_with_cdn_prefix_only_on_public_asset_disk
  - purge_validates_location_and_preset
  - purge_time_budget_follows_setting            # 비우기 한 걸음 예산은 업로드 탭 「고급」 core.thumbnail.purge_time_budget 을 따른다
  - purge_walks_in_bounded_steps                 # 같은 디스크·규격 하나 비우기는 시간 예산만큼 이름 순서로 걷고 next_cursor 로 이어 간다(allFiles 없음)
  - settings_permissions_gate_every_endpoint
  - pregenerate_api_batches_with_cursor
  - pregenerate_api_validates_inputs

