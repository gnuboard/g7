  - peak_memory_before_and_after_are_both_reported
  - batch_axis_reports_nonzero_exit_code_as_partial_measurement
  - unregistered_command_is_skipped_with_reason
  # ── 안전장치 (P0) ──
  - mutating_axes_refuse_without_allow_write
  - screen_mutation_verdict_follows_http_method
  - explicit_mutating_declaration_overrides_axis_default
  - seeding_and_truncation_are_refused_in_production
  - measurement_leaves_no_residual_rows_after_rollback
  - database_override_option_repoints_the_connection
  # ── 출력 (P0) ──
  - skipped_profiles_remain_in_output_with_reason
  - all_skipped_run_exits_nonzero
