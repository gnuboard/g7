test_files:
  # 코어 — 선언 수집 / 검증 / 대상 지목 / 축 분기 / 가드 / 출력 스키마
  - tests/Feature/Console/BenchCommandTest.php
  # 코어 — 축 실행기 단위 (화면 내부 요청·쿼리 수집·쓰기 prepare 분리·배치 메모리)
  - tests/Unit/Benchmark/BenchmarkAxisRunnerTest.php
  # 코어 — 프로파일 VO / 축 Enum 계약
  - tests/Unit/Benchmark/BenchmarkProfileTest.php
  # 이커머스 — 확장 선언 + 주문 생성 쓰기 축 대상
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Benchmark/OrderCreationBenchmarkTest.php
