  - core_config_profiles_are_collected
  - module_declared_profiles_are_collected
  - plugin_declared_profiles_are_collected
  - profile_source_kind_and_identifier_are_recorded
  - extension_declaration_failure_is_isolated_to_that_extension
  # ── 선언 검증 (P0) ──
  - missing_type_declaration_is_rejected_with_reason
  - unknown_axis_type_is_rejected_with_allowed_values
  - missing_required_option_is_rejected_naming_the_option
  - screen_axis_accepts_route_or_uri_alternative
  - closure_callback_is_rejected_with_config_cache_reason
  - rejected_declarations_appear_in_warnings_not_silently_dropped
  # ── 대상 지목 (P0) ──
  - qualified_key_resolves_exactly
  - unique_short_key_resolves
  - ambiguous_short_key_lists_candidates_and_refuses
  - unknown_key_fails_with_list_profiles_hint
  - axis_filter_selects_only_that_axis
  - no_selection_fails_asking_for_profile_or_axis_or_all
  # ── 목록 축 (P0) ──
  - list_axis_reports_all_list_and_id_only_columns
  - list_axis_ratio_is_derived_from_id_only_baseline
  - wildcard_columns_expand_to_actual_schema_columns
  - nonexistent_declared_columns_are_filtered_out
  - declared_filters_are_applied_to_measured_query
  - operator_filters_are_applied_to_measured_query
  - equality_filter_is_not_misread_as_operator_form
  - unknown_filter_operator_is_refused_before_measuring
  - list_profile_filters_match_the_screen_default_predicate
  - soft_delete_declaration_adds_deleted_at_predicate
  - explain_option_collects_plans_for_both_column_widths
  # ── 화면 축 (P0) ──
  - screen_axis_dispatches_through_http_kernel_with_middleware
  - screen_axis_reports_status_response_time_and_query_count
  - repeated_identical_sql_is_reported_as_n_plus_one_candidate
  - absence_of_n_plus_one_is_stated_explicitly
  - ephemeral_admin_receives_only_declared_permissions
  - as_option_measures_with_the_named_existing_account
  - container_request_and_auth_guards_are_restored_after_each_dispatch
  - route_name_declaration_resolves_uri_without_prefix_assembly
  - missing_route_name_fails_instead_of_measuring_a_404
  # ── 쓰기 축 (P0) ──
  - prepare_runs_outside_the_measured_window
  - prepare_runs_once_per_iteration
  - callback_receives_prepare_result
  - write_axis_reports_first_run_and_median_separately
  - cleanup_failure_does_not_swallow_the_measurement
  # ── 배치 축 (P1) ──
