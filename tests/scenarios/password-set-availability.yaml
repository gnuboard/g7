# audit:allow test-scenario-coverage[cross_product] reason: issue:#835 마이페이지 응답·관리자 회원 상세·재확인 수단은 서로 다른 응답 표면이라 곱하지 않고 effects 로 잠근다.

feature: 회원 응답이 비밀번호 설정 가능 여부와 실제 재확인 수단을 미리 알린다 (7.2.0)

description: |
  비밀번호 인증 정책(`core.auth.password_auth_decision`, 예: 회사 계정 로그인 강제)이 비밀번호 설정을 막는 회원에게 화면이 「비밀번호 처음 설정
  → 본인 확인」을 안내하고 외부 화면 왕복 뒤 저장 403 을 냈다. 마이페이지 응답(`can_set_password`·`password_set_blocked_message`)과 관리자 회원
  상세(`password_status.can_set`·`set_blocked_message`)가 저장과 같은 판정(본인 `set_password`, 남 `admin_set_password`)으로 미리 알린다.
  메일·비밀번호를 쓸 수 없는 회원의 마이페이지 응답에는 코어가 민감 작업 재확인에 실제로 고를 수단(`reauth_provider`)을 싣는다.

axes:
  surface: [profile, admin]
  policy: [deny, allow]
  target: [other, self]
  member: [undeliverable_with_method, undeliverable_without_method, deliverable]

effects:
  - profile_reports_password_unsettable        # 막힌 회원 — can_set_password=false, 저장 403 과 같은 문구, 판정 대상 set_password/user
  - profile_reports_password_settable          # 막지 않는 회원 — true, 문구 null
  - admin_detail_reports_password_unsettable   # 관리자 상세 — 남은 admin_set_password, 자기 계정은 set_password 판정
  - profile_reports_reauth_provider            # 메일·비밀번호 없는 회원은 코어가 고를 수단 ID, 쓸 수단이 없거나 메일을 받는 회원은 null

test_files:
  - tests/Feature/User/PasswordSetAvailabilityTest.php
