  - shell_html_has_no_inline_executable
  - shell_config_keys_unchanged
  - shell_script_order_preserved
  - shell_stall_notice_rendered
  - shell_assigns_config_from_data_block
  - shell_asset_url_mode_precedence
  - shell_init_on_captured_load
  - shell_ignores_unmarked_scripts
  - shell_retry_backoff_then_fallback
  - shell_corrupt_bundle_fallback
  - shell_observes_bundle_syntax_error
  - shell_js_is_es5_only
  - bootstrap_partial_emits_no_inline_executable
  - error_screen_reload_without_inline_handler
  - installer_has_no_inline_executable
  - installer_delegation_calls_only_mapped_actions
  - installer_boot_restores_globals

