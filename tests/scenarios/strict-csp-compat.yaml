notes: |
  CSP 정책 축과 실패 축은 표면마다 의미가 달라 해당 없는 조합을 exclusions 에 사유와 함께 둔다.
  셸 표면은 webserver_strict(가장 엄격, 허용 호스트·worker-src 없음)에서 렌더·위반 0 을 단언하면
  report_only/enforce 는 그보다 느슨하다. 플러그인 브리지와 CSP 설정 모드는 각 소유 매니페스트가 덮는다.
