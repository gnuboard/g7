  - tests/Feature/View/ShellNoInlineScriptTest.php
  - tests/Feature/View/BootstrapFallbackDiagnosisTest.php
  - resources/js/core/__tests__/shellBoot.test.ts
  - tests/Playwright/specs/smoke/strict-csp.spec.ts
