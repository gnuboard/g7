feature: 업그레이드 스텝 실행 대장 — DB 를 공유하는 서버 간 같은 스텝 중복 실행 방지

description: |
  코어 판 번호는 서버마다 `.env` 에만 있어, DB 를 함께 쓰는 두 번째 서버(웹 여러 대 등)가 이미 끝난 코어 스텝을
  다시 돌렸다. 코어(`CoreUpdateService::runUpgradeSteps()`)와 확장(`ModuleManager`·`PluginManager` 의 스텝 실행)은
  스텝마다 대장 `upgrade_step_runs` 를 확인한다. `done` 이면 「이미 실행됨」 로그를 남기고 건너뛰고, `--force` 는 대장을
  무시하고 다시 돌린다. 건너뛴 스텝은 실행 건수와 따로 세어(`[STEPS_EXECUTED]` 의 `skipped`) `core:update` 부모의 「발견했는데 실행
  0건」 가드가 두 번째 서버를 실패로 읽지 않게 한다. 선점은 유니크 삽입(새 스텝)·조건부 갱신(failed 행)으로 하며, 다른 실행이 `running` 으로 쥐고
  있으면 실패한다. 비정상 종료로 남은 `running` 행은 시작한 지 6시간(`UpgradeStepRunLedger::STALE_RUNNING_HOURS`)이
  지나면 다음 실행이 다시 선점하고, `--force` 재실행은 경과 시간과 무관하게 다시 선점한다. 관리자 화면(웹) 코어 업데이트도 `--force` 없이 스텝 명령을 불러 같은 대장을 따른다. 대장 테이블이 아직 없으면(마이그레이션 전) 대장 없이 종전처럼 돈다. 기존 설치는 백필하지 않는다.

# 축 의미:
#   case — {스텝 소유}__{상황}.
axes:
  case: [core__rerun_and_force, core__skipped_reported, core__contended, ledger__failed_retry, ledger__stale_running_reclaim, ledger__force_running_reclaim, module__rerun_and_force, core__web_rerun]

effects:
  - done_step_is_skipped_on_shared_db
  - force_reruns_done_step
  - skipped_steps_are_counted_separately
  - running_step_claim_conflict_fails
  - failed_step_can_be_reclaimed
  - stale_running_step_is_reclaimed
  - force_reclaims_running_step
  - web_update_follows_ledger

test_files:
  - tests/Feature/Upgrade/UpgradeStepRunLedgerTest.php
