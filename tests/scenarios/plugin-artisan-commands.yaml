feature: 플러그인 Artisan 커맨드(list·install·activate·deactivate·uninstall·update·cache-clear)

description: |
  plugin:* Artisan 커맨드가 목록 조회·상태 필터, 미존재·미설치 플러그인과 잘못된 식별자에 대한 실패 종료,
  캐시 비우기(상태 캐시·미들웨어 인덱스 삭제와 확장 캐시 버전 증가), 그리고 설치→활성화→비활성화→삭제
  전체 수명주기(중복 동작 경고·삭제 확인 프롬프트·--force)를 약속대로 처리하는 계약을 지킨다.

axes:
  case: [list, nonexistent_or_uninstalled, cache_clear, lifecycle_workflow, invalid_identifier]

effects:
  - list_command_exits_successfully
  - list_status_filter_rejects_invalid_status
  - list_shows_empty_message_without_plugins
  - missing_or_uninstalled_plugin_command_fails
  - cache_clear_removes_state_caches_and_bumps_version
  - lifecycle_commands_transition_plugin_status
  - duplicate_lifecycle_action_warns_and_fails
  - uninstall_confirmation_controls_deletion
  - invalid_identifier_install_fails

test_files:
  - tests/Feature/Console/Commands/Plugin/PluginArtisanCommandsTest.php
