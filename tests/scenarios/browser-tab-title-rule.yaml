effects:
  - server_title_rule_matches_fixture                 # 서버 규칙이 공용 판정 사례와 같은 답을 낸다
  - engine_title_rule_matches_fixture                 # 엔진 규칙이 공용 판정 사례와 같은 답을 낸다
  - server_substitute_matches_fixture                 # 서버 틀 치환이 공용 사례와 같다
  - engine_substitute_matches_fixture                 # 엔진 틀 치환이 공용 사례와 같다
  - server_resolver_applies_shared_rule               # 봇 해석기가 같은 규칙(기본 접미사·중복 방지·첫 화면)을 쓴다
  - route_title_shown_at_navigation_start             # 이동 시작 즉시 라우트 제목 + 접미사
  - loading_route_title_replaced_by_data_title        # 받는 동안 라우트 제목, 받으면 데이터 제목
  - late_previous_layout_data_does_not_overwrite_title  # 앞 화면 레이아웃의 늦은 데이터가 새 화면 제목을 덮지 않는다
  - locale_switch_recomputes_title                    # 언어 전환 뒤 새 언어 값으로 다시 계산
  - home_title_is_site_name_only                      # 사이트 첫 화면은 사이트 이름만
  - not_found_uses_template_404_route_title           # 경로 없음은 템플릿 404 라우트 제목
  - layout_editor_tab_title_untouched                 # 편집기·미리보기는 탭 제목을 바꾸지 않는다
  - admin_template_keeps_shell_title                  # 관리자 셸이 제목 계산 값을 넘기지 않으면(옛 서버) 셸 제목 유지
  - admin_title_uses_layout_title_with_admin_suffix   # 관리자: 레이아웃 meta.title + 「 - {사이트 이름} 관리자」, 검색엔진 선언(og) 무시
  - admin_title_falls_back_to_route_title             # 관리자: 레이아웃 제목이 없으면 라우트 제목, 앞 화면 제목 잔류 없음
  - admin_title_suffix_follows_locale                 # 관리자 접미사는 화면 언어를 따른다
  - admin_shell_exports_site_name_and_localized_suffix  # 관리자 셸이 사이트 이름과 지원 언어별 접미사 맵을 넘긴다
  - layout_seo_title_before_extension_template_and_og  # 편집기 「검색 제목·설명」(meta.seo.title·description)이 자체 값 다음·확장 틀·og 앞 후보

