feature: 브라우저 탭 제목과 검색엔진 제목의 단일 규칙

description: |
  사람 방문자의 브라우저 탭 제목(document.title)을 검색엔진(봇) `<title>` 과 같은 규칙으로 정한다(engine-v1.86.0, 코어 7.1.5).
  규칙의 서버 원본은 `app/Seo/SeoTitleRule.php`(SeoMetaResolver·SeoRenderer 가 사용), 화면 짝은
  `resources/js/core/routing/DocumentTitle.ts` 다. 두 구현은 `tests/fixtures/seo/title-rule-cases.json` 하나로 같은 답을 잠근다.

  제목 후보: 리소스 meta_title → 페이지 seo_meta.title → 확장 제목 틀(_seo.{page_type}.title) → meta.seo.og.title → 라우트 meta.title.
  사이트 이름만 되풀이하는 후보는 건너뛰고, 사이트 이름은 코어 접미사(비면 ` - {site_name}`)로만 붙인다. 제목이 이미
  「구분자 + 사이트 이름」으로 끝나면 다시 붙이지 않는다. 사이트 첫 화면은 사이트 이름만 쓴다.

  엔진은 이동을 시작하면 라우트 제목(+접미사)을 곧바로 쓰고, 새 화면을 그린 뒤 그 레이아웃에 연결해 데이터가 올 때마다
  다시 계산한다(연결한 레이아웃 객체일 때만 — 앞 화면의 늦은 데이터 무시). 레이아웃 편집기·편집기 미리보기는 탭 제목을 바꾸지 않는다.

  관리자 템플릿(engine-v1.88.0)은 검색엔진 규칙 대신 「{레이아웃 meta.title 또는 라우트 제목} - {사이트 이름} 관리자」다. 사이트
  이름과 언어별 접미사(`seo.admin_title_suffix`)는 관리자 셸이 `G7Config.seoTitle` 로 넘긴다. 값이 없는 옛 서버면 셸 제목을 둔다.

  종전: 엔진이 document.title 을 쓰지 않아 사람 탭 제목은 늘 셸의 사이트 이름이었다.

