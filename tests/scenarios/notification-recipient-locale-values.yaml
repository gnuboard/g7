feature: 알림 변수의 언어별 값 묶음 — 발송 시점에 만든 알림 데이터를 수신자 언어로 치환한다

description: |
  알림 데이터는 발송 시점에 한 번 만들어 모든 수신자에게 쓴다. 상태 이름 같은 번역 문구를 그때의 앱 언어로 미리
  번역해 넣으면 다른 언어 수신자의 메일에 그 언어가 섞인다. 변수 값으로 언어별 값 묶음(`['ko' => …, 'en' => …]`)을
  넘기면 템플릿 치환(replaceVariables)이 수신자 언어로 고른다 — 없으면 LocalizedValue 규칙(사이트 기본 언어 → 영어).
  확장은 LocalizedValue::translateAll(fn) 으로 지원 언어마다 번역 문구를 만들어 묶음을 만든다(만드는 동안 바꾼 앱 언어는 되돌림).
  문자열 값은 종전 그대로다.

test_files:
  - tests/Unit/Models/NotificationTemplateRecipientLocaleValueTest.php

axes:
  value:
    - locale_map
    - locale_map_missing_locale
    - string

effects:
  - locale_map_value_picks_recipient_locale
  - locale_map_value_falls_back_like_localized_value
  - string_value_unchanged
  - translate_all_builds_locale_map
