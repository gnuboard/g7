# audit:allow test-scenario-coverage[cross_product] reason: |
#   적용 판정은 범위 3 × 회원 3 × 역할 4 × 관리자 2 를 한 테스트 메서드가 루프로 전부 돌려 PHP·SQL 판정을
#   대조한다(조합 마커를 72개로 쪼개지 않는다). 배치 단계·상한·락 축도 메서드 안에서 직접 만든다.
#   effects·test_files 는 계속 검사한다.

feature: 비밀번호 만료 — 적용 판정·시작일·배치·직권 실행·건수/명단 (#736)

description: |
  운영자가 보안 탭에서 만료를 켜면 그 순간이 시작일로 기록되고(서버 전용 — 요청으로 못 바꿈), 만료 기준일은
  max(마지막 변경일 ?? 시작일, 시작일)이다. 적용은 회원 개별 > 역할 > 사이트 범위이며 역할끼리 부딪치면 적용.
  auth:process-password-expiry 가 매일 사전 안내(N일 전, 주기당 1통)와 만료일 처리(만료 알림 + '변경해야 로그인'
  이면 로그인 해제)를 하고, 1회 실행당 상한을 만료가 가까운 순으로 적용한다. 보안 탭 「지금 실행」은 개인정보
  직권 실행 장치로 돌고, 건수·명단 API 는 배치와 같은 쿼리를 쓴다.

axes:
  scope: [all, admin, selected]
  member_policy: [inherit, apply, exempt]
  role_policy: [none, apply, exempt, apply_exempt]
  stage: [notice, expire]
  action: [force, remind]
  toggle: [on, off]
  path: [tab_save, single_key, read]

