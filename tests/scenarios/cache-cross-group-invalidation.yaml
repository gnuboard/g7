feature: cache_cross_group_invalidation

description: |
  캐시 이관 계획서 13절 X-1 ~ X-5 의 그룹 교차 시나리오를 키 차원에서 고정한다.
  모듈 설치와 SEO 설정 저장 때 여러 그룹(상태, 레이아웃, SEO, 설정)의 키를 함께 무효화하고
  ext.cache_version 을 올리는 흐름, 모듈 비활성화 때 코어 키와 모듈 자체 캐시(ModuleCacheDriver)를
  함께 지우는 흐름, withStore 로 바꾼 인스턴스가 같은 키 접두사를 쓰는지, 옛 CacheService 가
  완전히 제거됐는지를 확인한다. 실제 매니저와 서비스는 호출하지 않고 드라이버 호출로 흉내 낸다.

axes:
  case:
    - module_install         # X-1 모듈 설치 카스케이드
    - seo_settings_save      # X-2 SEO 탭 설정 저장 카스케이드
    - module_deactivation    # X-3 모듈 비활성화
    - driver_switch          # X-4 withStore 저장소 전환
    - cache_service_removed  # X-5 CacheService 제거

exclusions:
  - { case: module_install, reason: "제외 없음 — 사례 단일 축" }

effects:
  - cascade_keys_forgotten        # 여러 그룹의 캐시 키가 한 번에 무효화된다
  - cache_version_bumped          # ext.cache_version 이 새 값(2000)으로 바뀐다
  - module_own_cache_flushed      # ModuleCacheDriver 의 remember 키가 flush 로 지워진다
  - with_store_keeps_key_prefix   # withStore 인스턴스가 지정 저장소를 쓰고 같은 키 접두사를 만든다
  - cache_service_absent          # app/Services/CacheService.php 파일과 클래스가 없다

test_files:
  - tests/Unit/Cache/Migration/CacheCrossGroupTest.php
