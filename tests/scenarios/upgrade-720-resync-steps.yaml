feature: upgrade_720_resync_steps

description: |
  7.2.0 데이터 스텝 00(코어 선언 — 스케줄 카탈로그 포함)·01(활성 모듈·플러그인 선언 — 스케줄 포함)을 새 코드로 재동기화한다.
  부모(7.1.x 코드)는 스케줄 동기화를 모르므로 이 스텝이 없으면 스케줄 등록부가 비어 예약이 모두 멈춘다.
  실패는 경고·복구 명령으로만 남기고 업데이트를 되돌리지 않는다.
  01 이 새 판 선언을 읽는 동안 확장 클래스는 아직 7.1.x 활성 디렉토리에서 오토로드되므로, 새 판에만 있는 항목 클래스로
  인한 항목 선언 실패는 경고 표에서 빼고(확장 갱신이 이어서 동기화) 로그에만 남긴다.

coverage_strategy: full

axes:
  case: [core_success, core_failure, extensions_success, extensions_failure, extensions_pending_extension_class, extensions_real_field_failure]

effects:
  - resync_called_once
  - failure_does_not_abort_upgrade
  - pending_extension_class_warning_deferred   # 확장 갱신 전이라 아직 없는 확장 클래스의 항목 선언 실패는 경고 표에서 뺀다
  - unrelated_warnings_kept                    # 앞선 경고·다른 사유의 경고는 그대로 둔다
  - real_field_sync_failure_still_reported     # 활성에도 있는 클래스·새 판에도 없는 클래스의 실패는 그대로 알린다

test_files:
  - tests/Unit/Upgrades/Upgrade720ResyncStepsTest.php
