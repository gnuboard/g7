feature: member_register_service_layer

description: |
  요청 클래스 없이 AuthService::register() 를 직접 부르는 경로(소셜 로그인, SSO, SCIM, 사전 등록).
  항목 값 저장과 「필수 항목 나중 입력」 표시가 서비스 계층에서 일어나고 기존 옵션의 동작은 그대로다.

coverage_strategy: full

axes:
  path: [service_direct, service_defer]

effects:
  - service_register_stores_field_values_without_request
  - service_register_marks_deferred_required_fields
  - service_register_accepts_missing_name
  - service_register_legacy_options_unchanged
  - register_data_filter_cannot_override_identity_columns

test_files:
  - tests/Feature/Auth/RegisterServiceLayerTest.php
