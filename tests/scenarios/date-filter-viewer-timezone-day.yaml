feature: 날짜 필터의 「하루」 기준 — 보는 사람의 시간대 (방문자 통계 원장은 사이트 표준시)

description: |
  화면에서 고른 날짜(Y-m-d)를 UTC 하루로 잘라, 한국 시간 새벽에 생긴 행이 목록에는 그날로 보이는데
  그날로 거르면 빠졌다(7.1.0 영역 C C-D1·O-C2). 목록은 날짜를 보는 사람의 시간대로 그리므로
  (`BaseApiResource::formatDateForUser` 계열) 필터도 `FiltersByDateRange::applyViewerDateRangeFilter()`
  로 같은 하루를 자른다. 회원 통계의 「오늘 가입」 도 보는 사람의 오늘이다.

  방문자 통계의 소급 익명화는 방문 원장을 `visit_date`(사이트 표준시 일자)로 자르므로, 곁 원장(봇 기록·
  수집 실패)도 `applyDateRangeFilterInTimezone(..., AnalyticsClock::siteTimezone())` 로 같은 기간을 자른다.
  회원 목록 4종 날짜 축은 tests/Feature/Api/Admin/UserControllerListFilterTest.php 가 함께 잠근다.

axes:
  surface: [frontend_site_timezone, admin_member_notifications, admin_schedules, admin_schedule_history, admin_user_statistics, analytics_side_ledgers]

effects:
  - date_filters_follow_viewer_timezone_day
  - analytics_side_ledgers_follow_site_timezone_day
  # 7.1.0 R-B: 스케줄 목록 빠른 기간의 「오늘」은 브라우저가 아니라 계정 시간대(회원 → 사이트 기본)의 날짜
  - schedule_quick_dates_use_account_timezone
  # 화면이 사이트 기본 시간대를 알아야 회원 시간대가 없을 때·통계 기간에서 서버와 같은 「오늘」을 만든다
  - site_timezone_exposed_to_frontend

test_files:
  - tests/Feature/Repositories/DateFilterTimezoneDayTest.php
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/layouts/admin-schedule-list-quick-date-timezone.test.ts
  - tests/Feature/Settings/SiteTimezoneFrontendExposureTest.php
