feature: 레이아웃 시험 도구(createLayoutTest) 사용 예시

description: |
  레이아웃 시험 도구의 기본 사용법을 시험으로 남긴 예시다. 렌더, 상태 읽기와 쓰기, API 모의와 오류 모의,
  네비게이션 이력, 토스트 누적, 모달 스택, 인증 상태 렌더, iteration 행 데이터 참조, cleanup 과 전역 상태 설정을
  하나씩 보인다. 축 area 는 도구 기능 묶음 하나씩이다.

axes:
  area: [basic_render, state, mock_api, navigation, toast, modal, auth, iteration, utility]

effects:
  - layout_test_renders_layout
  - layout_test_manages_state
  - layout_test_mocks_api
  - layout_test_tracks_navigation
  - layout_test_collects_toasts
  - layout_test_manages_modals
  - layout_test_renders_authenticated
  - layout_test_iteration_binds_rows
  - layout_test_utility_resets_and_sets_state

test_files:
  - resources/js/core/template-engine/__tests__/layouts/example.test.tsx
