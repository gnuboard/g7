# π3 (#869) 레이아웃 편집기 시험 표식 부채 채우기 — 이 매니페스트는 아래 test_files 의 각 시험이 재는 효과를
# 시험 단위로 선언한다. 축 roundtrip 은 시험 대상 단위이다.

feature: 레이아웃 편집기 산출물의 런타임 라운드트립 — 드래그 이동, 에러 처리, init_actions, 초기 상태, computed, 페이지 상태, 버전 content

description: |
  편집기가 만든 레이아웃 조각이 실제 엔진 경로(DynamicRenderer, TemplateApp, ErrorHandlingResolver,
  ErrorPageHandler, useLayoutDocument 저장)를 거쳐도 의도대로 실행되고 렌더되는지 잰다.

