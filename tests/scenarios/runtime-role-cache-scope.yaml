feature: 실행 역할별 캐시 범위 (Code / Data)

description: |
  검수 서버(stage)는 운영 서버와 캐시 저장소를 공유하지만 코드·레이아웃 판이 다를 수 있다. 캐시 키를 Code(코드·레이아웃 판에
  따라 달라지는 값 — `CacheScope::CODE_PATTERNS`)와 Data(공유 데이터)로 나누고, stage 의 Code 키는 `g7:stage:` 아래로 보낸다.
  드라이버는 `CacheDriverFactory` 로만 만든다(정적 검사 `cache-driver-factory-only`). stage 에서 캐시 버전을 올려도 운영
  서버의 `ext.cache_version` 은 그대로다. live 의 키는 종전과 같다. 그 서버의 레이아웃 표·환경에서 나온 값 — 레이아웃 해석 캐시
  (`layout_resolver.*`, 값이 역할별 레이아웃 표의 행 ID), 역변환 마크업 캐시(`layout:markup:*`), 시스템 정보 캐시(`settings.system_info.*`)
  — 도 Code 범위다.

# 축 의미:
#   case — 판정 경로.
axes:
  case: [key_resolution, cache_version_bump, server_scoped_keys]

effects:
  - stage_code_keys_are_separated
  - stage_cache_clear_keeps_live_version
  - server_specific_keys_are_code_scoped

test_files:
  - tests/Feature/RuntimeRole/CacheScopeTest.php
