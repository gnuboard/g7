feature: 글꼴 아이콘 이름 — 그 화면을 그리는 템플릿에서 글리프로 풀리는 이름만 쓴다

description: |
  번들 템플릿의 `Icon` 은 이름을 `fa-{이름}` 클래스로 바꿔 Font Awesome 6.4.0 글꼴로 그린다. 그 버전에
  없는 이름은 클래스만 붙고 글리프가 없어 빈칸으로 그려진다 — 오류도 경고도 남지 않는다.

  배경:
    - 관리자 화면(이커머스·결제 플러그인·코어 설정·스케줄)에 Lucide 식 이름(`x-circle`·`refresh-cw`·
      `more-horizontal`·`alert-circle` 등)이 섞여 35개 파일 126곳의 아이콘이 비어 있었다(#682 PO 실측 후속 4).
    - 사용자 템플릿 `Icon` 은 변환표(`iconNameMap`)로 몇몇 별칭을 FA 이름으로 바꾸지만 관리자 템플릿
      `Icon` 은 변환표를 쓰지 않는다 — 같은 이름이 한쪽에서만 그려진다.

  적용 지점:
    - 번들 템플릿·모듈·플러그인의 레이아웃(`.g7.html`)과 TSX — 그리는 템플릿(관리자/사용자)을 경로로 가른다.
    - 코어·모듈·플러그인 PHP 가 글리프 이름을 내려 주는 기존 계약(결제수단·PG·정렬 메뉴 등)의 `'icon' => '…'` 값 —
      어느 템플릿이 그릴지 모르므로 풀리는 FA 이름이어야 한다. 새 백엔드 표면은 의미 토큰(`status-*`)을 내고 템플릿이
      해석한다(PO 지시 — 메모리 `backend-emits-icon-semantic-tokens-not-glyph-names`), 그 토큰은 판정에서 뺀다.

