feature: 레이아웃 편집기 URL 동기화와 DevTools 상태 적재

description: |
  useEditorUrlSync 와 editorTrackers 의 단위 시험을 묶는다.

  - URL → 상태: 초기 `?route=` 복원, popstate 재적용, `?edit=…&host=` 다이렉트 진입의 returnRoute
    합성(host 미매칭이면 null).
  - 상태 → URL: 선택 라우트가 바뀌면 replaceState 로 주소를 보정하고, 라우트 모드에서 별도 편집
    모드로 들어가면 pushState 로 history 항목을 남긴다.
  - editorTrackers: devtools 가 없으면 아무것도 하지 않고, 있으면 비누수 필드만 적재하며, 적재
    함수 예외가 본 흐름을 깨지 않는다.

axes:
  area: [url_restore, url_popstate, url_direct_entry, url_write, devtools_tracker]

effects:
  # URL → 상태
  - url_sync_initial_route_param_selects_route
  - url_sync_unmatched_or_missing_route_stays_null
  - url_sync_popstate_reapplies_route_from_url
  - url_sync_direct_edit_entry_builds_return_route
  - url_sync_unknown_host_return_route_null
  # 상태 → URL
  - url_sync_route_change_replaces_url
  - url_sync_edit_mode_entry_pushes_history
  # DevTools
  - editor_tracker_noop_without_devtools
  - editor_tracker_forwards_state_snapshot
  - editor_tracker_snapshot_excludes_node_payload
  - editor_tracker_null_route_fields_when_unselected
  - editor_tracker_clear_forwards_to_devtools
  - editor_tracker_swallows_devtools_errors

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/hooks/useEditorUrlSync.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/devtools/editorTrackers.test.ts

validation:
  note: |
    Vitest 단위가 잰다. window.location 과 history 는 시험 안에서 바꿔 끼운다.
