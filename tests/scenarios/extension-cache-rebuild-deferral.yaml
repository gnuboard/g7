feature: extension_cache_rebuild_deferral

description: |
  자동 비활성화 연쇄에서 확장 1건마다 config 캐시(리스너)와 라우트 캐시(매니저)를 일회용 앱 부팅으로 다시 만들어 17건 연쇄에서
  MySQL 연결 151개가 고갈됐다(공개 #145 F6). ConfigCacheHelper·RouteCacheHelper 의 deferRebuilds() 는 묶는 동안의 재생성
  요청을 대기 표시만 하고, 가장 바깥 호출이 끝날 때 한 번만 재생성한다. 예외가 나도 깊이를 복구한다.

coverage_strategy: full

axes:
  case: [nested, no_request, exception]

effects:
  - deferred_rebuild_runs_once_after_outermost
  - deferred_rebuild_skipped_without_request
  - deferred_rebuild_restores_depth_on_exception

test_files:
  - tests/Unit/Support/ConfigCacheHelperDeferTest.php
  - tests/Unit/Support/RouteCacheHelperDeferTest.php
