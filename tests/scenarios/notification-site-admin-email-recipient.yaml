feature: notification_site_admin_email_recipient

description: |
  알림 템플릿 수신자 규칙 `site_admin_email`(#888) — 환경설정 > 일반의 관리자 이메일(`general.admin_email`) 한 곳을
  비회원 수신자(`GuestNotifiable`, 메일만)로 만든다. 인라인 해석(`resolve`)과 분할 발송용 참조 해석(`resolveRefs`)이
  같은 수신자를 낸다. 값이 비었거나 형식이 틀리면 0명이고 `Log::warning` 을 남긴다. 수신자는 회원이 아니라
  `NotificationRecipientCapability::can()` 이 늘 거짓이다(관리자 화면 주소를 싣지 않는다).

coverage_strategy: full

# 축 의미:
#   case — 설정값 상태와 확인하는 경로(해석 두 경로 / 권한 판정).
axes:
  case: [valid_resolves, empty_or_invalid_resolves_none, guest_has_no_permission]

effects:
  - site_admin_email_resolves_one_guest
  - site_admin_email_refs_match_inline
  - site_admin_email_empty_resolves_none_with_warning
  - site_admin_email_recipient_has_no_permission

test_files:
  - tests/Unit/Services/NotificationSiteAdminEmailRecipientTest.php
  # 확장 알림 템플릿 편집 창의 수신자 선택지 — 축·효과는 각 확장 매니페스트(notification-template-site-admin-email)가 소유한다
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/notification-template-site-admin-email.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/notification-template-site-admin-email.test.ts
  - plugins/_bundled/sirsoft-gdpr/resources/js/__tests__/layouts/notification-template-site-admin-email.test.ts
  - plugins/_bundled/sirsoft-koreaexim/resources/js/__tests__/layouts/notification-template-site-admin-email.test.ts
  - plugins/_bundled/sirsoft-social_login/resources/js/__tests__/layouts/notification-template-site-admin-email.test.ts
