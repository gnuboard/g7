feature: member_display_name

description: |
  표시 이름(환경설정 > 회원 > 표시 이름). 종류(이름, 닉네임, 가린 이름, 아이디 가림, 이름(닉네임), 추가 항목 값)와
  대체 순서, 영역 상속 사슬과 회원이 고른 값, 탈퇴 회원과 비회원, 설정에 없는 깊은 키의 기본값, 확장의 종류와 영역 등록,
  작성자 검색과 정렬 헬퍼, 가입과 내 정보에서 종류 고르기와 권한, 응답의 새 키, 닉네임 항목 잠금,
  회원 탭의 안내와 저장, 추가 항목 삭제 차단, 새 권한의 역할 부여.

coverage_strategy: full

