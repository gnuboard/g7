feature: conditions 액션 핸들러 분기 실행

description: |
  액션 핸들러 conditions 는 if/else 체인(ConditionBranch[])을 평가해 처음 맞는 브랜치의 then 을 실행한다. 조건은 액션
  컨텍스트의 data($args 포함)로 평가하고, AND, OR, 중첩 그룹을 받는다. then 이 배열이면 sequence 처럼 적힌 순서대로
  실행한다. conditions 가 없거나 배열이 아니면 경고를 남기고 아무것도 실행하지 않는다. 이 매니페스트는 그 단위 시험
  파일(ActionDispatcher.conditions.test.ts)을 소유한다(표식 소급, 설계 확정 2026-11-09).

axes:
  area: [branch_chain, args, and_group, or_group, nested, then_sequence, invalid_conditions, usage_scenario]

effects:
  - conditions_handler_runs_matched_branch
  - conditions_handler_then_array_runs_in_order
  - conditions_handler_warns_on_invalid

test_files:
  - resources/js/core/__tests__/ActionDispatcher.conditions.test.ts
