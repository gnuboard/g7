# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "로그아웃 후 이동 `core.auth.logout_redirect_url` (#798 K6)"

description: |
  로그아웃 후 이동 `core.auth.logout_redirect_url` (#798 K6)
  로그아웃 응답이 `data.redirect_url` 을 싣는다 — 확장(예: IdP 로그아웃)이 같은 출처 경로를 주면 그 경로, 아니면 null. 필터는 토큰을 지우기
  **전**에 불려 어느 토큰(세션)을 닫는지 안다.

axes:
  extension: [none, path, external_url]
  guard: [user, admin]

effects:
  - logout_redirect_falls_back_to_login
  - logout_redirect_follows_server_path
  - logout_external_redirect_ignored
  - logout_redirect_null_by_default
  - logout_redirect_from_extension
  - logout_filter_sees_token_before_delete
  - logout_external_redirect_dropped
  - admin_logout_redirect

test_files:
  - resources/js/core/auth/__tests__/AuthManager.logout.test.ts
  - tests/Feature/Auth/LogoutRedirectTest.php
