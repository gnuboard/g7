feature: upgrade_710_core_resync_after_parent_failure

description: |
  7.0.11 → 7.1.0 에서 부모(7.0.11 코드)의 코어 역할·권한 재동기화가 옛 Role 모델(planUpgrade 없음) 때문에 실패하고,
  자식 core:execute-upgrade-steps 는 G7_UPDATE_IN_PROGRESS=1 이면 재동기화를 건너뛰어 새 권한(core.profile.read·
  core.analytics.read·core.member-notifications.read)이 어느 역할에도 연결되지 않던 결함(7.1.0 출시 점검 CU-3, W3 실측).
  (a) 7.1.0 데이터 스텝 00_ResyncCoreDeclarations 가 새 코드에서 코어 선언 재동기화를 1회 멱등 실행(운영자 수정 보존),
  (c) ExtensionRoleSyncHelper 가 planUpgrade 가 없는 옛 역할 모델에서도 운영자 수정 칸을 보존하며 갱신 값을 계산한다.

coverage_strategy: full

axes:
  parent_resync: [failed, legacy_role_model]
  child_resync: [skipped]

effects:
  - data_step_resyncs_core_declarations_after_parent_failure
  - role_sync_falls_back_without_plan_upgrade

test_files:
  - tests/Feature/Upgrades/Upgrade710CoreResyncAfterParentFailureTest.php
