feature: named_actions 와 actionRef 참조 해석

description: |
  레이아웃 named_actions 정의를 actionRef 로 참조한다(engine-v1.19.0).
  해석 결과는 named 정의를 바탕으로 하되 이벤트 속성(type, key, event)은 원본에서 유지하고, 인라인 handler 와 params 가 덮어쓴다.
  actionRef 가 없거나 정의가 없으면 원본을 돌려준다. executeAction 과 bindActionsToProps 모두 해석을 거치며, 페이지 전환 때 정의가 교체된다.

axes:
  case: [set_and_get, set_null, set_multiple, resolve_basic, resolve_keeps_type_key, resolve_keeps_event, no_action_ref, missing_definition, inline_handler_override, inline_params_override, execute_navigate, execute_api_call, bind_actions_to_props, page_switch_replaces]

effects:
  - named_actions_stored_and_returned
  - named_actions_null_normalized_to_empty
  - action_ref_resolves_named_definition
  - action_ref_keeps_event_binding_props
  - action_without_ref_returned_unchanged
  - missing_named_action_returns_original_with_warning
  - inline_props_override_named_definition
  - execute_action_runs_resolved_named_action
  - bind_actions_to_props_resolves_action_ref
  - named_actions_replaced_on_page_switch

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.namedActions.test.ts
