feature: 슬롯 문맥(SlotContext) — 등록, 해제, 정렬, 구독, 전역 노출

description: |
  SlotProvider 가 여는 슬롯 문맥의 단위 시험이다. 컴포넌트는 슬롯 id 와 registrationKey 로 등록하고 해제하며,
  같은 키의 중복 등록은 막는다. 목록은 order 로 정렬하고, 변경은 구독자와 useSlotComponents 훅에 알린다.
  렌더 타이밍 때문에 엔진이 읽는 window.__slotContextValue 에도 값을 싣는다. 축 area 는 문맥 기능 하나씩이다.

axes:
  area: [provider, register, ordering, subscribe, hook_rerender, clear, global_exposure]

effects:
  - slot_provider_enables_context
  - slot_register_unregister_tracks_components
  - slot_components_ordered_by_order
  - slot_subscribers_notified_on_change
  - slot_hook_rerenders_on_change
  - slot_clear_all_empties_slots
  - slot_context_exposed_on_window

test_files:
  - resources/js/core/template-engine/__tests__/SlotContext.test.tsx
