feature: globalHeaders — apiCall 과 login 요청에 패턴별 공통 헤더 적용

description: |
  레이아웃 globalHeaders 규칙(패턴 → 헤더)을 apiCall 과 login 요청에 붙인다.
  `*` 는 전부, 경로 패턴은 매칭되는 엔드포인트에만 적용하고 여러 규칙이 맞으면 병합한다. params.headers 가 가장 우선한다.
  login 헤더의 `_global` 표현식도 평가한다. g7_locale 은 Accept-Language 로 보내되 globalHeaders 와 커스텀 headers 가 앞선다.

axes:
  case: [set_rules, set_null, api_wildcard_all, api_path_match, api_path_no_match, api_params_override, api_multiple_match, api_module_pattern, api_no_rules, pattern_exact, pattern_nested_wildcard, login_user_match, login_admin_match, login_global_expression, login_no_match, login_no_rules, locale_present, locale_absent, locale_vs_global_headers, locale_vs_custom_headers]

effects:
  - global_headers_rules_stored
  - global_headers_null_normalized_to_empty
  - wildcard_pattern_applies_to_every_api_call
  - matching_path_pattern_applies_headers
  - non_matching_path_pattern_skips_headers
  - params_headers_override_global_headers
  - multiple_matching_rules_merged
  - api_call_unchanged_without_global_headers
  - exact_path_pattern_matches_only_that_path
  - wildcard_path_pattern_matches_nested_paths
  - login_request_receives_matching_headers
  - login_header_global_expression_evaluated
