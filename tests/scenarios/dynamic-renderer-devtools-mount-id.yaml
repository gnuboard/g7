feature: 렌더러의 DevTools 마운트 추적은 id 가 있는 컴포넌트만 알린다

description: |
  컴포넌트 id 는 선택이다(번들 레이아웃 컴포넌트 6028개 중 5845개가 id 없이 쓴다). 렌더러가 id 없는 컴포넌트의
  마운트·언마운트를 `undefined` 키로 DevTools 에 알려, 마운트 표가 id 없는 컴포넌트 전부를 한 칸에 덮어쓰고 그중
  하나만 언마운트돼도 그 칸이 지워졌다. ComponentDefinition.id 를 실제 계약대로 선택 필드로 바꾸면서 드러났다.

axes:
  component_id: [mixed]

effects:
  - devtools_mount_tracks_only_identified_components

test_files:
  - resources/js/core/template-engine/__tests__/DynamicRenderer.devtoolsMountId.test.tsx
