feature: 엔진 첫 화면 요청 사슬 — 셸 인라인 템플릿 설정과 첫 레이아웃 미리 요청 (engine-v1.96.0)

description: |
  부팅(`TemplateApp.init`)이 첫 화면 전 PHP 왕복을 줄줄이 기다리던 것 중 두 단계를 걷는다.
    - 템플릿 설정: 셸 `G7Config.templateConfig`(서버가 template.json `expose` 선언 키만 싣는다)에 부팅 키
      (`scroll_restoration`·`errorHandling`)가 모두 있으면(값 null 포함) config API 를 부르지 않는다. 하나라도 빠지거나 실리지 않았으면
      종전처럼 1회 부른다. 오류 화면(`ErrorPageHandler.loadConfig`)은 `error_config` 키가 실렸을 때만 API 를 건너뛴다.
    - 레이아웃: routes 를 받고 인증 확인이 끝나면 현재 경로의 레이아웃 요청을 확장 번들 로드 전에 시작하고, 첫 라우트 처리는 Promise 캐시로
      같은 요청을 쓴다. 리다이렉트·인증 필요·매칭 없음·서버 오류 셸·셸 캐시 버전 없음·만료 토큰(토큰 있는데 인증 실패)은 미리 요청하지 않는다.

axes:
  boot_case: [inline_complete, inline_partial, inline_absent, error_config_inline, prefetch_public_route, prefetch_skipped]

effects:
  - first_paint_skips_template_config_roundtrip
  - template_config_fallback_preserves_values
  - initial_layout_requested_before_extension_bundles
  - layout_prefetch_skipped_when_unsafe

test_files:
  - resources/js/core/__tests__/TemplateApp.inlineTemplateConfig.test.ts
  - tests/Playwright/specs/first-paint-request-chain.spec.ts
