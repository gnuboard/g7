notes: |
  액션/조건 레시피 적용기는 Pure Logic DataProvider (친화 입력 → 핸들러/식 JSON).
  ActionRecipeEditor/ConditionBuilder/FlexEditor 는 Component RTL.
  합성 if 식의 실제 평가는 condition-toggle-render (ConditionEvaluator 라운드트립).
  Chrome MCP drag 비호환(dnd-kit) 으로 캔버스 클릭 가로채기 axis 는 코드경로+RTL 로 대체.
