# audit:allow test-scenario-coverage[cross_product] reason: issue:#835 동작(켜기·끄기·켜기 시도·되돌리기·재동기화)마다 의미 있는 템플릿 상태가 달라 축을 곱하면 성립하지 않는 조합만 늘어난다 — 동작별 시험으로 나눴다.
feature: 알림 — 운영자가 켠 발송 수단의 빈 템플릿 (7.2.0)
coverage_strategy: pairwise

description: >
  알림을 보내는 수단은 여럿이고(코어 메일, 사이트내 알림, 확장 채널), 발송은 템플릿 행이 있는 채널로만 나간다.
  확장이 그 수단의 템플릿을 선언하지 않았으면 운영자가 수단을 켜도 편집할 곳도 발송도 없었다. 이제 정의의 발송 수단
  저장(PUT channels)이 템플릿 없는 수단을 감지해 빈 템플릿(꺼짐, 받는 사람 없음, 제목 null, `is_user_created`)을 만든다.
  저장 버튼으로 모아 보내는 화면(gdpr, 환율, 소셜 로그인)과 스위치마다 즉시 보내는 화면(코어, 게시판, 이커머스 알림 탭)이
  모두 이 API 를 지난다. 빈 템플릿은 받는 사람·본문을 채우기 전에는 켜지 못하고(본문을 확장이 따로 받는 편집기 none 채널은
  받는 사람만), 수단을 꺼도 남으며, [기본값으로 되돌리기]는 만들었을 때의 빈 상태로 돌린다. 확장 업데이트의 재동기화는
  운영자가 켠 수단(정의 `channels` 수정 추적)과 운영자가 만든 템플릿을 지우지 않는다.

test_files:
  - tests/Feature/Api/Admin/NotificationUserCreatedTemplateTest.php
  - tests/Playwright/specs/admin/notification-user-created-template.spec.ts

axes:
  action: [enable_channel, disable_channel, toggle_on, reset, extension_resync]
  template: [missing, existing, user_created, user_created_empty, user_created_filled, declared_without_recipients]
  channel: [template_editor_none]
  scope: [definition, template]
  input: [reordered]
  surface: [immediate_tab]

effects:
  - empty_template_created_on_enable
  - existing_template_untouched
  - user_template_kept_on_disable
  - empty_user_template_toggle_rejected
  - filled_user_template_toggle_allowed
  - extension_edited_channel_needs_only_recipients
  - declared_template_toggle_unchanged
  - user_template_reset_to_empty
  - user_channels_survive_resync
  - user_template_survives_cleanup
  - declared_channel_takes_over
  - reordered_channels_not_override
  - rejected_toggle_reverts_switch
  - immediate_tab_creates_template_on_switch

notes: |
  저장 버튼 화면(소셜 로그인 알림 탭)의 같은 흐름은 플러그인 매니페스트 admin-providers.yaml 이 소유한다(user_template_created_on_channel_save).
  PHPUnit 은 스키마를 새로 만들지 않고 트랜잭션으로 격리한다(로컬 MySQL migrate:fresh OOM 회피) — 알림 유형·역할 식별자에
  실행 고유 접미어를 붙인다. 확장이 선언한 템플릿 8건은 받는 사람 없이 쓰이므로 켜기 검사는 운영자 생성 행에만 건다.
