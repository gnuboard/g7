# audit:allow test-scenario-coverage[cross_product] reason: 7.1.0 abilities 게이트 최종 점검 결함(코어·관리자 화면) 수정의 회귀 묶음. 축은 결함마다 독립(화면·권한 보유 여부)이라 전수 곱이 아니라 결함별 고침/거부 경로를 잠근다.

feature: 7.1.0 abilities 게이트 수정 — 코어 서버 권한 · 관리자 화면 게이트

description: |
  2026-10-09 abilities 게이트 최종 점검에서 남은 코어·관리자 템플릿 결함을 고친 회귀 묶음이다.
  화면은 응답의 abilities 로 쓰기 UI 를 잠그고, 서버는 같은 권한 식별자로 403/422 를 낸다.

  - R2: 확장 설치 창 동반 설치 항목마다 대상 종류의 설치·활성화 권한(미리보기 can_select + 설치 API 403)
  - S8: 사용 여부를 끈 역할의 권한은 판정에서 제외, 최고관리자 역할은 끌 수 없다
  - S4: 관리자 화면에서 운영자 본인 계정 삭제 거부
  - G22: 스케줄 목록 컬렉션 abilities
  - G23: 대시보드 경고 [복구]·[닫기]는 경고가 실어 온 엔드포인트의 라우트 권한으로 판정
  - G20·G24·#7·#8·#15: 확장 목록·상세·복구 경로 권한 정렬
  - 화면 게이트는 굽힌 레이아웃 JSON 으로 단언한다(AdminAbilitiesGateLayoutTest)

axes:
  area: [cascade_install, role_state, self_delete, schedule_list, dashboard_alert, extension_list, layout_gate, stats, resources, activities, alerts, core_update.check, core_update.changelog, compatibility_listener, compatibility_dismiss, dashboard]
  permission: [granted, missing]

