    - refetch_failure_then_success
    - refetch_same_request_5xx
    - refetch_other_target_with_fallback
    - refetch_auth_error_without_fallback
    - refetch_same_path_param_variant_5xx
    - refetch_and_progressive_errors_coexist
    - init_actions_refetch_failure_after_spa
    - same_layout_edit_to_write
    - other_layout_blocking_initlocal_merge
    - same_screen_query_change_no_remount
    - slow_layout_load_spinner
    - fast_layout_load_no_spinner
