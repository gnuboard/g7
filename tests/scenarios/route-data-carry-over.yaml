feature: 화면 전환 때 데이터소스 값 이어 쓰기 — 같은 화면·같은 요청만 이어 쓰고 다시 받기 실패는 처음 받기와 같은 계약 (engine-v1.81.2)

description: |
  화면을 옮길 때 앞 화면의 같은 id 데이터소스 값이 새 화면 첫 렌더에 심기지 않게 잠근다. 이어 쓰는 것은 같은 화면(경로·레이아웃
  이름이 같고 쿼리만 다름)과 같은 요청(같은 정의 · 같은 route/query 의존 값 — 베이스 레이아웃의 메뉴 등)뿐이고, `_local` 을 읽는
  정의와 앞앞 화면이 받은 누적 값은 이어 쓰지 않는다. 다시 받기(refetchDataSource)를 다른 대상으로 시작하거나 실패하면 앞 대상
  값을 남기지 않고(값 null·오류 기록), 같은 대상 실패는 마지막 값을 지킨다. 레이아웃을 받는 동안에도 전환 덮개가 뜬다.
  실물 TemplateApp 경로 전환과 이어 쓰기 판정(순수 함수)의 입력 모양 전수 두 겹으로 잰다.

