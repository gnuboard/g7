feature: ja 언어팩의 휴면 용어 단일성 (이슈 #636 S4)

description: |
  ko 는 「휴면」, en 은 「dormant」 한 낱말로 일관됐는데 ja 만 「休眠」과 「休止」로 갈려 있었다.
  같은 팩(`g7-core-ja`) 안에서도 로그인 차단 문구는 「休眠状態のアカウント」인데 상태 라벨은
  「休止」였고, 관리자 알림 설정 목록은 「休眠転換完了」인데 바로 옆 개인정보 탭은
  「休止アカウント転換」이었다.

  증상은 번역 누락이 아니라 **같은 개념이 두 낱말로 쪼개지는 것**이라 어느 게이트에도 걸리지
  않는다 — `check-language-pack-sync` 는 키의 존재만 보고 값의 낱말은 보지 않는다. 그 사이
  ja 회원은 이렇게 겪는다:

    메일 「休眠アカウントに転換されました」 → 로그인 토스트 「休止状態が解除されました」
    → 프로필 상태 「休止中」 → 자동 탈퇴 예고 「休眠アカウント退会予定」

  휴면 흐름은 법정 사전 통지가 붙는 경로다. 고지를 받은 회원이 **그 고지와 화면의 표시를 같은
  것으로 읽지 못하면** 되돌릴 기회(로그인 한 번)를 놓친 채 자동 탈퇴로 간다.

  설계에서 못박은 것:

  - **정본은 「休眠」** (설계 확정 2026-09-22). 일본에서 장기 미접속 계정을 가리키는 표준어이고,
    법정 사전 통지문과 로그인 차단 문구가 이미 그 낱말이다. 「休止」는 「일시 중지」에 가까워
    장기 미접속이라는 뜻이 약해진다.
  - **모집단을 ko 에서 파생한다.** ja 파일을 훑어 금지어를 찾는 방식은 낱말이 하나 더 생기면
    조용히 통과한다. ko 값에 「휴면」이 든 자리 전량을 정본으로 삼고 그 짝이 되는 ja 값이
    정본 낱말을 쓰는지 본다 — 키가 늘어도, 팩이 늘어도 검사가 함께 넓어진다.
  - **세 갈래를 합집합으로 본다.** 코어 backend lang · 템플릿 frontend partial · 코어 알림
    정의 시드. 하나만 보면 나머지 갈래에서 낱말이 갈려도 초록이다 — 실제로 갈린 자리가
    세 갈래에 모두 있었다.
  - **모집단 하한을 둔다.** 파생이 좁아져 0건이 되면 차집합 단언은 조용히 통과한다.

axes:
  locale: [ja]
  surface: [dormancy_term]

effects:
  - ja_pack_uses_one_word_for_dormancy

test_files:
  - tests/Unit/LanguagePack/JaDormancyTermConsistencyTest.php

rules_layer_coverage:
  - rule: lang-pack-key-parity
    coverage: |
      키 존재 패리티는 `check-language-pack-sync` 가 이미 본다. 이 매니페스트가 덮는 것은 그
      너머 — 키는 다 있는데 **값의 낱말이 갈리는** 축이다.

validation:
  manual: |
    ja 로케일로 전환한 뒤 ① 회원 상세·마이페이지의 상태 뱃지 ② 환경설정 > 개인정보 탭의 휴면
    카드 문구 ③ 휴면 회원 로그인 직후 토스트 ④ 휴면 사전 안내 메일 본문 — 네 자리가 모두
    「休眠」인지 눈으로 확인. 고치기 전에는 ①②③ 이 「休止」였다.
