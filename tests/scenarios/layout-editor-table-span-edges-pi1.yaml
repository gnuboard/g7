# 레이아웃 편집기 표 격자 — 병합이 걸친 행과 열의 추가와 삭제
# addColumn 흡수칸 skip 결함과 removeRow 세로 병합 소실 결함의 회귀 시험을 소유한다.
# 축 subject 는 시험 파일이 재는 대상(표 격자 변형 함수)이고, effects 는 시험이 단언하는 동작이다.
feature: layout_editor_table_span_edges_pi1

description: |
  표 격자 변형(tableGridMutations)이 rowSpan, colSpan 이 걸친 행과 열에 칸을 더하거나 지울 때 격자가 깨지지 않는지 잰다.
  열 추가는 경계 양옆이 흡수칸이어도 그 행에 새 칸을 넣고, 행 삭제는 지우는 행에서 시작하는 세로 병합 셀을 아래 행으로 옮긴다.

axes:
  subject: [table_grid_span_edges, table_grid_sequences]

effects:
  - grid_add_col_left_absorbed_row_gets_new_cell
  - grid_add_col_right_absorbed_row_gets_new_cell
  - grid_add_col_through_merged_block_widens_it
  - grid_add_row_under_colspan_fills_each_col
  - grid_add_row_inside_rowspan_extends_it
  - grid_remove_row_moves_rowspan_origin_down
  - grid_remove_col_under_colspan_shrinks_it
  # 연산을 이어 붙이는 순서(λ 실측)와 무작위 속성 시험
  - grid_merge_add_col_remove_origin_row_stays_valid
  - grid_merge_across_sections_rejected
  - grid_fully_absorbed_row_keeps_its_grid_row
  - grid_random_op_sequences_keep_grid_valid

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/spec/tableGridSpanEdges.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/spec/tableGridSequences.test.ts
