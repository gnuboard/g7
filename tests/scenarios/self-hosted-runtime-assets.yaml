sub_flows:
  - id: asset_url_mode_variants
    description: |
      자산 URL 모드(extension / extensionless)와 정적 게시(on / off)는 환경 토글이라
      단위 테스트가 조합으로 enumerate 하지 않는다. 전용 테스트(VendoredAssetServingTest
      "자산 url 은 두 모드 모두 same origin", TemplateApp.layoutScripts "모드 보정")와
      브라우저 점검 매트릭스가 그 변종을 맡는다.
  - id: multilingual_editor_fallback
    description: 다국어 탭 × textarea 폴백 — 탭 전환 시 현재 값 커밋, form.content 는 로케일 맵 유지
  - id: vendored_version_ssot
    description: |
      동봉 자산의 버전은 확장 안 다섯 곳(dist/vendor 디렉토리 · 의존성 핀 · 복사 스크립트
      경로 · 소스 *_VERSION 상수 · 테스트 어서션)에 중복 기재된다. 조합으로 enumerate 하지
      않는다 — 어긋남 자체가 결함이라 축이 아니라 불변식이다. 정적 검사가 기재 간 수렴을,
      브라우저 spec 이 그 버전 경로가 실제로 200 으로 응답하는지를 맡는다.
  - id: bot_render_path
    description: seo.blade.php 봇 렌더 경로에서도 자산이 same-origin 이어야 한다
