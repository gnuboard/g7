  - tests/Feature/View/TemplateExternalsRenderingTest.php
  - tests/Feature/Extension/BundledExtensionNoExternalAssetTest.php
  - tests/Feature/Extension/VendoredAssetServingTest.php
  - plugins/_bundled/sirsoft-ckeditor5/tests/Unit/VendoredAssetManifestTest.php
  - resources/js/core/__tests__/TemplateApp.layoutScripts.test.ts
  - resources/js/core/__tests__/G7CoreGlobals.test.ts
  - resources/js/core/__tests__/AssetFailureNotice.test.ts
  - resources/js/core/modules/__tests__/ModuleAssetLoader.test.ts
  - resources/js/core/template-engine/__tests__/networkResilience.stylesheet.test.ts
  - plugins/_bundled/sirsoft-ckeditor5/resources/js/__tests__/layouts/html-editor-fallback.test.tsx
  - plugins/_bundled/sirsoft-ckeditor5/resources/js/__tests__/layouts/ckeditorGlobal.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/components/PreviewCanvas.scriptGate.test.tsx
  - tests/Playwright/specs/layout-editor/preview-wysiwyg-single-load.spec.ts
