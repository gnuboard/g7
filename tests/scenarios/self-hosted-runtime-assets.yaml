feature: 구동 에셋 자체 제공 + 로드 실패 폴백

description: |
  브라우저가 화면을 그리기 위해 제3자 CDN 에 도달해야 하는 의존을 없애고(자체 제공),
  그럼에도 자산을 못 불러온 경우를 사용자가 알고 조치할 수 있게 한다(폴백 + 안내 + 재시도).
  더불어 운영자가 자기 CSS/JS/정적 파일을 덧붙일 자리(`custom/`)를 규약으로 연다.

  핵심 동작:
    - 확장·템플릿의 구동 자산을 `dist/vendor/{lib}/{version}/` 에 동봉하고 same-origin 으로 서빙
    - 레이아웃 scripts / 확장 CSS·JS 로드에 재시도 계층 적용 후 최종 실패를 표면화
    - CKEditor5·Monaco 확보 실패 시 textarea 폴백, 우편번호 SDK 부재 시 직접 입력 허용
    - 운영자 `custom/` 자산은 확장 교체(rename 경로 · 제자리 동기화 폴백)에서 보존
    - 외부 URL 은 확장 manifest 의 사유 선언분 또는 운영자의 `custom/assets.json` 등록분만

coverage_strategy: pairwise

axes:
  # 자산 이름이 아니라 **동작이 갈리는 부류**를 축으로 둔다 — 이름별 열거는 테스트가
  # 실제로 하는 일이 아니다(전수 스캔은 전부를 한 번에 보고, 로더는 종류와 무관하다).
  #   vendored    : 동봉 자산 (실패 시 폴백·안내)
  #   service_sdk : 자체 제공 불가 (외부 의존 잔존, 직접 입력이 대안)
  #   translation : 선택적 열화 (실패해도 영어로 동작 — 폴백이 아니라 경고)
  asset_class: [vendored, service_sdk, translation]
  outcome: [loaded, failed]

exclusions:
  - { asset_class: translation, outcome: loaded, reason: "번역은 실패 축만 의미가 있다 — 성공 경로는 vendored 와 같은 코드다" }

effects:
  - runtime_asset_served_same_origin
  - no_third_party_request_on_page_load
  - vendored_asset_survives_rebuild
  - vendored_asset_declared_path_exists_on_disk
  - vendored_asset_version_matches_declaration
  - vendored_editor_mounts_without_fallback
  # 본체 실패 때 코어 레이아웃 스크립트 안내와 겹치지 않고 플러그인 안내 한 건(임시 입력창 전환 문장)만 남는다.
  - editor_script_failure_shows_single_plugin_notice
  # 로더가 두 번 돌아도 먼저 뜬 편집기는 살아 있어 「마운트됨」 축은 green 이다 — 따로 센다.
  - vendored_amd_loader_runs_exactly_once
  - template_external_asset_field_resolves_to_asset_url
  - template_external_same_origin_ignores_preconnect_and_crossorigin
  - template_external_invalid_url_is_logged_not_silently_dropped
  - bot_render_path_uses_same_origin_asset
  - layout_script_retries_before_failing
  - layout_script_url_converted_to_current_mode
  - trusted_external_layout_script_not_mode_converted
  - already_loaded_layout_script_skipped
  - undeclared_external_layout_script_blocked
  # 레이아웃 편집기 미리보기도 런타임처럼 레이아웃 스크립트 주소를 자산 주소 방식으로 바꿔 싣는다
  - preview_layout_script_url_converted_to_current_mode
  # 미리보기·편집기 플러그인 로더가 겹치거나 초기화 요청이 동시에 와도 편집기 본체(UMD)는 한 번만 실행된다
  - vendored_editor_umd_executes_once_across_loaders
  - failed_layout_script_recorded_and_others_continue
  - layout_script_failure_label_is_human_readable
  - failed_asset_shows_retry_notice
  - failed_asset_falls_back_to_plain_input
  - retry_recovers_editor
  - stylesheet_failure_retries_then_surfaces
  - address_fields_editable_when_sdk_missing
  - notice_renders_without_host_component_on_standalone_layout
  # AMD 로더는 URL 에 쿼리가 있으면 모듈 id 에 .js 를 붙이지 않는다 — 템플릿 자산 서빙이 같은 이름의 .js 를 찾아 준다(#712 후속)
  - amd_module_id_without_js_suffix_resolves_to_js_file

