feature: TemplateApp 초기화 네트워크 복원력 — 재시도·문서 이탈 가드·확장 번들 실패 시 대기 생략 (#463)

description: |
  TemplateApp 초기화는 routes.json·components.json 같은 구동 자원을 받아야 화면을 그린다. 일시적인 네트워크
  실패는 재시도로 넘기고, 끝내 실패하거나 서버 오류(HTTP 500)면 오류 화면을 한 번 그린다. 문서가 떠나는
  중(pagehide)의 실패는 화면에 그리지 않고, bfcache 로 돌아온 뒤의 실패는 다시 그린다. 확장 번들이 실패로
  확정되면 핸들러 등록 대기(maxWait)를 생략해 백지 시간을 없앤다.

  축은 실패한 자원과 실패의 성격, 그때의 문서 상태다. 오류 화면을 그리는 경로는 engine-v1.79.0 부터 React
  루트를 먼저 반납한다(`releaseTemplateRoot`, engine-error-screen-root-release 매니페스트) — 이 파일의 테스트는
  그 호출을 mock 으로 받는다.

axes:
  # 실패한 자원 × 실패 성격 × 문서 상태를 실제로 갈리는 경우로만 펼친다 — 셋을 곱하면 같은 fetch 래퍼를 되풀이하는 칸이 대부분이다.
  init_case: [routes_transient, components_transient, routes_persistent, routes_http_500, routes_fail_while_leaving, routes_fail_after_bfcache_restore, bundle_failed, bundle_healthy]

effects:
  - transient_init_failure_recovers_without_error_screen
  - persistent_init_failure_renders_error_screen_once
  - http_500_renders_error_screen_without_retry
  - init_failure_while_leaving_skips_error_screen
  - init_failure_after_bfcache_restore_renders_error_screen
  - failed_bundle_skips_handler_wait
  - healthy_bundle_still_waits_for_handlers
  - unregistered_handler_does_not_break_init

test_files:
  - resources/js/core/__tests__/TemplateApp.networkResilience.test.ts
