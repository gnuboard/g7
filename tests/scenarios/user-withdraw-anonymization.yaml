feature: user_withdraw_anonymization

description: |
  `User::withdraw()` 가 만드는 익명화 값의 규칙(공개이슈 #112). 이메일, 이름, 닉네임 접미사의 형식,
  같은 원본 이메일의 구분, 닉네임이 없는 계정, 다시 부른 탈퇴, 컬럼 길이 클램프, 상태와 탈퇴 일시 기록.
  서비스 계층의 원자성과 탈퇴 경로 통일은 `user-withdraw-atomicity.yaml` 이 소유한다.

coverage_strategy: full

axes:
  rule: [email_suffix, name_nickname_suffix, null_nickname, idempotent, column_clamp, status]

effects:
  - withdrawn_email_suffix_is_date_and_user_id
  - same_original_email_yields_distinct_withdrawn_emails
  - withdrawn_name_suffix_is_date
  - withdrawn_nickname_suffix_is_user_id
  - withdrawn_nickname_normalized_matches_and_unique_key_cleared
  - null_nickname_left_untouched_on_withdraw
  - repeated_withdraw_keeps_anonymized_values
  - withdrawn_values_clamped_to_column_limits
  - clamped_values_keep_full_suffix
  - withdraw_sets_status_and_withdrawn_at

test_files:
  - tests/Unit/Services/UserServiceWithdrawTest.php
