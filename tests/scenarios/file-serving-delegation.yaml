feature: 웹서버 파일 위임 (X-Sendfile / X-Accel-Redirect, #878)

description: |
  로컬 파일 응답을 PHP 가 읽어 보내는 대신 웹서버(Apache mod_xsendfile · nginx X-Accel-Redirect)가 보내게 하는
  운영자 선택 기능이다. 기본은 none(현 동작 불변).

  결정 사슬:
    - 설정: 환경설정 > 드라이버 「웹서버 파일 위임」(drivers.file_delegation · drivers.file_delegation_accel_prefix)
      → SettingsServiceProvider::injectFileDelegationConfig → core.file_serving.{delegation,accel_prefix}.
      `.env` G7_FILE_DELEGATION·G7_FILE_DELEGATION_ACCEL_PREFIX 는 EnvPriority::MAP 등재(잠금 배지 자동).
    - 응답: BaseApiController::fileResponse() 와 ContentMediaResponder 로컬 분기가 DelegatedFileResponse 를 만든다.
      요청 헤더 X-Sendfile-Type·X-Accel-Mapping 은 믿지 않는다 — 복제 요청에 설정값을 덮어쓰고 prepare() 동안만
      Symfony 신뢰 플래그를 켠다(finally 복원). nginx 매핑은 앱이 realpath(base_path()) + 접두사로 만든다.
    - 매핑 밖 실경로 → 위임 없이 PHP 전송 + X-G7-File-Delegation: skipped.
    - 위임 응답은 앱 gzip 에서 빠진다(헬퍼 선언 + 미들웨어 응답 모양 가드).
    - 미구성 감지: 1단계 DriverConnectionTester::testFileDelegation(정적 판정) · 2단계 GET /api/admin/settings/
      file-delegation-probe(실물 JSON 을 fileResponse 로 내고 화면이 본문 수신으로 판정).

  한계: 웹서버가 위임 헤더를 실제로 소비하는지는 PHPUnit 런타임 밖이다 — 로컬 nginx 실측(계획서 §8.4)과
  운영 서버 확인(문서 curl 절차·2단계 프로브)이 담당한다.

axes:
  # 한 축으로 둔다 — 응답 계약·설정 사슬·화면이 각기 다른 표면이라 축을 곱하면 의미 없는 조합만 는다.
  case:
    - forged_header_off
    - x_sendfile_helper
    - conditional_304
    - range_delegated
    - x_accel_mapping
    - outside_mapping
    - trust_flag_restore
    - head_only
    - unknown_mode
    - gzip_guard
    - content_media_local
    - public_storage_attachment
    - public_storage_symlink
    - inject_settings
    - inject_testing_guard
    - save_validation
    - available_drivers_meta
    - driver_test_shape
    - probe_route
    - admin_layout

effects:
  - forged_sendfile_request_header_is_ignored            # 위임 꺼짐/켜짐 모두 요청 헤더로 방식·매핑이 바뀌지 않는다
  - delegated_response_carries_header_without_body       # 위임 헤더만 세우고 본문은 비운다(HEAD 포함)
  - delegated_response_keeps_cache_and_security_headers  # ETag·Last-Modified·Cache-Control·Expires·nosniff·Disposition 유지
  - conditional_request_is_answered_before_delegation    # If-None-Match 일치 → 304, 위임 헤더 없음
  - range_is_left_to_the_web_server                      # Range 요청에도 앱은 200 전량 헤더만
  - accel_redirect_uri_is_built_from_app_mapping         # X-Accel-Redirect = rawurlencode(접두사 + 설치 위치 기준 상대 경로)
  - unmapped_path_falls_back_to_php_with_skipped_diagnostic  # 매핑 밖 → PHP 전송·Range 처리 + skipped
  - trust_flag_never_leaks_past_prepare                  # Symfony 전역 신뢰 플래그가 prepare 뒤 원래 값
  - unknown_mode_is_treated_as_none                      # 모르는 값·형식이 틀린 접두사는 안전한 기본값
  - delegated_response_is_never_gzip_encoded             # 위임 헤더가 있으면 압축 미들웨어가 치환하지 않는다
  - content_media_local_branch_is_delegated              # 본문 미디어 로컬 분기도 위임, private 캐시 유지
  - public_storage_delegation_keeps_attachment_disposition  # 공개 스토리지 활성 문서는 위임돼도 attachment
  - public_storage_symlink_refusal_survives_delegation   # 위임을 켜도 심볼릭 링크 경유는 404
  - stored_delegation_injects_core_config_with_normalization  # 저장값 → core.file_serving 주입, 빈/모르는 값 → none
  - delegation_injection_is_skipped_in_testing_env       # testing 환경은 dev drivers.json 을 주입하지 않는다
  - invalid_delegation_settings_rejected_with_422        # 모르는 방식·접두사 누락·형식 오류 422
  - delegation_catalog_and_meta_exposed_to_admin         # available_drivers.file_delegation 3종 + _meta.file_delegation
  - driver_test_reports_static_delegation_hint           # 1단계 시험 결과 모양(success·message·details)
  - probe_route_serves_json_through_file_helper          # 2단계 프로브가 fileResponse 로 JSON 을 no-store 로 낸다
  - drivers_tab_renders_file_delegation_card             # 관리자 드라이버 탭 카드(선택·접두사·안내·시험·프로브)

