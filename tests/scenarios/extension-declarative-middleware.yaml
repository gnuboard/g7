  - tests/Feature/Extension/ExtensionMiddlewareRegistryTest.php
  - tests/Unit/Http/Middleware/ExtensionMiddlewareGateTest.php
  - tests/Feature/Extension/ExtensionMiddlewareGateIntegrationTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Providers/DetectDeviceMiddlewareRegistrationTest.php
  - plugins/_bundled/sirsoft-pay_nhnkcp/tests/Feature/Middleware/RestrictKcpIpTest.php
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Middleware/InicisNotifyIpWhitelistGateTest.php
  - plugins/_bundled/sirsoft-pay_nicepayments/tests/Feature/Middleware/VbankNotifyIpWhitelistGateTest.php
  - plugins/_bundled/sirsoft-gdpr/tests/Unit/PluginMiddlewareDeclarationTest.php

rules_layer_coverage:
  - rule: extension-middleware-declarative-registration
    coverage: 번들 SP 의 Kernel 미들웨어 그룹 직접 조작 금지 — 이전 후 무검출, 이전 전 패턴 검출로 회귀 가드
  - rule: extension-route-middleware-alias-reference
    coverage: 번들 라우트 파일의 자기 미들웨어 FQCN 부착 금지 — 동일
  - rule: extension-middleware-gate-cache-coverage
    coverage: Abstract 에 getMiddleware 존재 시 Manager 에 registry flush 존재 — 배치 완전성은 flush_rebuilds_index effect 가 병행
