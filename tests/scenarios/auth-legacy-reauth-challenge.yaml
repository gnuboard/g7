# audit:allow test-scenario-coverage[cross_product] reason: issue:#609 관문 × 확인 수단 × 재요청 토큰 상태 중 관문마다 의미 있는 조합만 실체가 있다
# (정책 축은 비밀번호 변경 경로에만, 재요청 축은 428 을 받는 관문에만). 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 옛 화면(7.1.x 템플릿)의 비밀번호 칸 요청 호환 — 비밀번호 없는 회원의 본인 확인

description: |
  비밀번호 없는 회원(외부 인증 전용)을 모르는 옛 화면은 비밀번호 칸에 무엇이든 넣어 보낸다(PO 결정 2026-11-02).
    - 재확인 관문(정보 수정 진입 · 앱 키 재생성 · 관리자 본인 비밀번호 첫 설정)은 그 값을 쓰지 않고 422 대신 본인인증 요구 428
      (목적 `sensitive_action`, 정책 키 `core.reauthentication`, return_request = 원 요청). 엔진이 인증 창을 열고 확인이 끝나면
      `?verification_token=` 을 붙여 같은 본문으로 다시 보낸다. 토큰은 기존 재확인 서비스가 본인·목적 확인 후 한 번만 소비한다.
    - 비밀번호 첫 설정(`PUT /api/me/password`)·정보 수정(`PUT /api/me`)은 현재 비밀번호를 버린다. 본인 확인은 기존 본인인증 정책.
    - 비밀번호 있는 회원, 현재 비밀번호를 비워 보내는 새 화면(7.2.0)의 계약은 그대로다.

axes:
  gate: [verify_password, regenerate_app_key, admin_self_update, change_password, profile_update]
  password: [none, set]
  method: [password, current_password, none]
  replay: [own_token, reused_token, other_token]
  policy: [enabled]

effects:
  - legacy_verify_password_gets_428
  - legacy_empty_body_gets_428
  - legacy_app_key_gets_428
  - legacy_admin_self_update_gets_428
  - legacy_replay_with_own_token_passes
  - legacy_replay_token_single_use
  - legacy_replay_rejects_other_token
  - legacy_current_password_dropped
  - legacy_change_password_follows_idv_policy
  - password_holder_contract_unchanged
  - new_screen_admin_contract_unchanged

test_files:
  - tests/Feature/Auth/LegacyReauthChallengeTest.php
