feature: cache_driver_write_fail_soft

description: |
  캐시 저장소 쓰기가 예외로 실패해도 캐시 드라이버는 예외를 밖으로 던지지 않는다(fail-soft).
  실사례는 root 로 실행한 업데이트가 키 색인 파일을 root 소유로 남겨 웹 프로세스의 모든 캐시 쓰기가
  Permission denied 로 죽고 부팅 경로 전체가 500 이 된 일이다. 캐시는 최적화일 뿐이므로
  put, forget, putMany 는 false 를 돌려주고, remember 는 저장에 실패해도 콜백 결과를 돌려주되
  콜백을 정확히 한 번만 실행한다. 모든 쓰기 연산이 예외를 던지는 시험용 저장소로 고정한다.

axes:
  case:
    - put_failure        # put 쓰기 실패
    - remember_failure   # remember 저장(put, 색인 기록) 실패
    - forget_failure     # forget 쓰기 실패
    - put_many_failure   # putMany 쓰기 실패

exclusions:
  - { case: put_failure, reason: "제외 없음 — 사례 단일 축" }

effects:
  - write_failure_not_thrown             # 저장소 예외가 호출자에게 전파되지 않는다
  - write_failure_returns_false          # put, forget, putMany 가 false 를 돌려준다
  - remember_returns_callback_value_once # remember 가 콜백 결과를 돌려주고 콜백은 1회만 실행된다

test_files:
  - tests/Unit/Cache/CacheDriverWriteFailSoftTest.php
