feature: 응답 헬퍼의 오류 응답 모양과 문구 번역

description: |
  오류 응답은 디버그 여부와 상태 코드에 따라 싣는 것이 달라진다 — 운영에서는 예외 원문과 500 번대의
  문자열 오류를 감추고, 디버그에서는 debug 블록(추적 10줄 제한)을 싣는다. 문구 인자가 있으면 예외 원문을
  문구 뒤에 다시 붙이지 않는다. 문구는 지금 로케일로 번역하며 기본 성공 문구 키가 실제 사전에 있어야 한다.

axes:
  case:
    - error_with_throwable_in_debug_mode_includes_debug_info
    - error_with_throwable_in_production_hides_debug_info
    - error_with_string_500_in_production_hides_errors
    - error_with_string_500_in_debug_mode_shows_errors
    - error_with_array_422_always_shows_errors
    - error_with_string_400_in_production_shows_errors
    - server_error_with_throwable_in_debug_mode
    - server_error_with_throwable_in_production
    - module_error_with_throwable_delegates_to_error
    - server_error_with_string_in_debug_mode_keeps_legacy_behavior
    - error_with_throwable_and_message_params_no_duplicate
    - error_with_null_errors_has_no_extra_keys
    - debug_trace_is_limited_to_10_frames
    - trans_uses_current_app_locale_not_hardcoded_whitelist
    - trans_respects_non_builtin_locale_when_app_locale_set
    - default_success_message_key_is_translated
    - no_caller_passes_unresolvable_messages_success_key

cross_product: |
  디버그 여부·오류 값 종류·상태 코드의 조합 가운데 응답 모양이 달라지는 자리만 케이스로 적는다 — 곱이 아니라 케이스 목록이다. 번역·기본 키 검사는 계약 검사다.

