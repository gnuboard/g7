feature: core_activity_log_sample_marker

description: |
  코어 활동 로그 샘플 시더가 자기가 만든 샘플 로그만 다시 만들고 실제 활동 로그는 지우지 않는다(총괄 결정 — 게시판·이커머스 E-15·B-5 와 같은 방식).
  종전에는 코어 활동 로그 전체를 지워 설치 사이트에서 --sample 을 돌리면 보관 대상 로그가 사라졌다. 시더가 만든 행에
  properties.seeded_by='core:sample' 표식을 달고 재실행 때 그 표식 행만 지운다.

coverage_strategy: full

axes:
  existing_logs: [real_core_logs]
  runs: [twice]

effects:
  - sample_rerun_keeps_real_activity_logs_and_replaces_only_marked_samples

test_files:
  - tests/Feature/Database/ActivityLogSampleSeederPreservesRealLogsTest.php
