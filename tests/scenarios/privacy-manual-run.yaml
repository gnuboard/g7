rules_layer_coverage:
  - rule: offset-chunk-mutates-filter
    coverage: |
      직권 실행은 자동 배치와 같은 처리 메서드(`chunkById`)를 부른다 — 처리하면서 조건에서 빠지는 행이
      커서를 밀지 않는다. 대기기간 생략도 같은 쿼리 메서드가 인자로 조건을 뺄 뿐이다.
  - rule: console-confirm
    coverage: 신규 커맨드 없음 — 기존 배치 커맨드 두 개가 공유 락을 잡을 뿐 확인 프롬프트는 없다(무인 실행).
