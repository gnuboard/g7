feature: layout_extension_patch_list_item

description: |
  확장이 **목록 중 한 항목만** 고칠 수 있는가 (`inject_props` 의 `_patch` 전략 · S2-D13)

  **증상**: 관리자 주문 목록에서 클레임 컬럼이 사라졌다. 레이아웃은 그 컬럼을 「기본 표시」로
  확정해 두었고, 서버는 `claim_summary` 를 항상 실어 보내고, 브라우저 상태에도 `claim` 이
  들어 있는데, **화면에만 없었다.**

  **원인**: 결제 플러그인 3종(KG이니시스·NHN한국사이버결제·나이스페이먼츠)이 주문 목록에
  「테스트 결제」 배지 하나를 달려고 `inject_props` 로 **컬럼 목록 전체를 통째로 복사**해
  두었다. 그 복사본은 2026-08-06 에 얼어붙었고, 2026-08-31 에 클레임 컬럼이 호스트에
  추가됐다. 우선순위가 높은 플러그인 복사본이 호스트의 12칸을 11칸으로 **덮어써 지웠다.**

  복사본 11칸 중 실제로 호스트와 다른 칸은 **`payment_method` 하나뿐**이었다. 나머지
  10칸은 글자 하나 다르지 않았다 — 배지 하나를 위해 목록 전체를 짊어진 것이다.

  **왜 복사했는가**: 그것 말고 방법이 없었다. 기존 전략은 `_append`(끝에 추가) ·
  `_prepend`(앞에 추가) · `_merge`(객체 shallow 병합) 셋뿐이고, 「목록 안의 특정 항목만
  바꾸기」가 없었다. 전략 키가 없으면 **통째로 대체**가 기본 동작이다.

  **계약**: `_patch` 는 `by` 로 항목을 식별하고 `items` 에 적은 항목만 손댄다.

    "columns": {
      "_patch": {
        "by": "field",
        "items": [{ "field": "payment_method", "cellChildren": [ … ] }]
      }
    }

    - 기존 항목과 `by` 값이 같으면 그 항목에 **shallow 병합**(적지 않은 키는 보존).
    - `by` 값이 기존에 없으면 **끝에 추가**.
    - 손대지 않은 항목은 **그대로**, 순서와 개수도 보존.
    - 항목 안의 값이 `{"_append": [ … ]}` 이면 그 키를 **덮어쓰지 않고 뒤에 덧붙인다**.

  **왜 `_append` 가 항목 안에도 필요한가**: 위 shallow 병합은 같은 키를 여러 확장이 쓰면
  마지막 하나만 남긴다. 실제로 결제 플러그인 3종이 「결제수단」 칸의 `cellChildren` 에 각자
  테스트결제 배지를 달았는데, 우선순위가 가장 높은 하나만 화면에 떴다. 그래서 그 하나가
  나머지 두 결제사 몫까지 **대신 그려 주는 계단식 우회**가 생겼고, 그 우회는 남의 플러그인이
  선언한 데이터소스(`nicepay_test_map` 등)를 참조해야 해서 그 플러그인이 없는 사이트에서는
  미정의 참조가 됐다. 새 결제사가 추가될 때마다 **최고 priority 플러그인을 찾아 고쳐야**
  하는 구조이기도 했다.

  `_append` 가 있으면 각 확장이 자기 배지만 덧붙이면 되므로 그 의존이 통째로 사라진다.

  형식이 어긋나면 **원본 목록을 그대로 둔다.** 잘못 쓴 패치가 목록을 비우면 그 화면이
  통째로 사라지는데, 그것이 바로 이 전략이 막으려던 사고와 같은 크기의 사고다.

  **실측 확인**(2026-09-16, 관리자 주문 목록):

    수정 전   헤더 12칸 · 클레임 없음 · 서빙 레이아웃 columns 11칸
    수정 후   헤더 13칸 · 클레임 있음 · 서빙 레이아웃 columns 12칸
              클레임 셀 = "반품완료(2)환불완료(2)취소완료(2)" / 없으면 "-"
              결제수단 셀 = "무통장입금(테스트 결제)"  ← 플러그인 배지도 그대로 동작

  두 계약이 **동시에** 성립하는 것이 핵심이다 — 플러그인은 자기 기능을 유지하고, 호스트
  컬럼은 더 이상 지워지지 않는다.

axes:
  layout_extension:
    - patch_list_item

effects:
  # 한 항목만 패치해도 호스트 목록의 나머지 항목이 모두 살아남는다
  - patching_one_item_keeps_every_other_item_of_the_host_list
  # 형식이 깨진 패치는 호스트 목록을 건드리지 않는다 (빈 목록으로 만들지 않는다)
  - malformed_patch_leaves_the_host_list_untouched
  # 여러 확장이 같은 항목의 같은 키에 _append 하면 전부 살아남는다 (priority 순서 보존)
  - appending_into_a_patched_item_keeps_every_extensions_contribution

test_files:
  - tests/Unit/Services/LayoutExtensionServiceTest.php
