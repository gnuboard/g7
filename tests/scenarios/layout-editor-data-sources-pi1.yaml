# 레이아웃 편집기 데이터 소스 패널과 페이지 설정 데이터 탭 시험 표식
# tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_data_sources_pi1

description: |
  DataSourcesPanel 이 자체와 상속 소스를 나누고 추가, 편집, 삭제, 검증, 요청 파라미터와 기본값 블럭 편집을 저장 페이로드로 옮기는지,
  페이지 설정 데이터 탭이 패널을 임베드하고 전역 헤더와 스크립트를 읽기전용으로 보이는지를 잰다.

axes:
  subject: [data_sources_panel_enrich, data_sources_panel, data_source_tab]

