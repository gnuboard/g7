# audit:allow test-scenario-coverage reason: |
#   cross product 자동 전개는 audit 실행 환경의 fallback YAML 파서가 nested axes 를 읽지
#   못한다(저장소 기존 시나리오와 같은 한계). 축 조합은 PHPUnit Feature 테스트가 커버하고
#   green 이다.

feature: 방문자 통계 확장 기여 표면 (이슈 #682 S4)

description: |
  확장이 방문자 통계에 전환·차원·집계 행·판정표·제외 규칙·개인정보 처리·출력 열을 보태는 길.

  배경:
    - 확장은 기여하기 전에 선언한다(진입 클래스의 getAnalyticsGoals()·getAnalyticsDimensions()).
      선언이 없으면 오타 하나가 새 목표로 쌓이고, 어느 확장이 준 전환인지 가릴 수 없다.
    - 선언은 DB 에 적재하지 않고 활성 확장에서 매번 모은다 — 확장이 꺼지면 선언도 사라지고
      이미 쌓인 데이터는 남는다.
    - 잘못된 선언은 그 항목만 사유와 함께 버린다. 조용히 버리면 그것이 곧 통계의 사각이다.
    - 확장은 코어 방어(봇·DNT·수집 거부)를 뒤집거나 코어 열·섹션을 덮지 못한다. 판정표 필터는
      반환값이 그대로 쓰이므로 받은 목록에 보태서 돌려준다.
    - 개인정보 경로(정보주체 삭제·전체 삭제)는 확장이 같은 트랜잭션 또는 코어보다 먼저 참여해,
      한쪽만 지워지고 완료로 보이는 일이 없다.

  적용 지점:
    - `app/Services/Analytics/GoalRegistry`·`DimensionRegistry` 가 선언을 모아 정규화한다.
    - `app/Services/Analytics/VisitService` 가 등록부로 목표·차원을 판정하고 중복 규칙을 적용한다.
    - `app/Services/Analytics/ConversionRecorder` 가 서버 측 전환을 같은 판정으로 넘긴다.
    - `app/Services/Analytics/ArchiveService` 가 등록 차원을 `ext:` 행으로 집계하고 수집기 훅을 쏜다.
    - `app/Analytics/AnalyticsTables`·`VisitExclusionPipeline` 이 판정표·제외 필터를 건다.
    - `DataSubjectService`·`PurgeService`·`AnonymizeService` 가 개인정보 필터를 건다.
    - `ReportController`·`DiagnosticsService`·`RealtimeService`·`StorageStatsService` 가 출력 필터를 건다.

coverage_strategy: pairwise

axes:
  point: [goal, dimension, archive, judgment, gdpr, output]
  extension_state: [active, inactive]
  input: [registered, unregistered]

exclusions:
  - { point: judgment, extension_state: inactive, reason: "판정·제외 필터는 확장이 꺼지면 구독 자체가 사라진다 — 코어 기본값과 같다" }
  - { point: output, extension_state: inactive, reason: "출력 필터도 같은 이유 — 구독이 없으면 코어 출력 그대로다" }
  - { point: gdpr, extension_state: inactive, reason: "개인정보 필터는 구독한 확장만 참여한다 — 꺼진 확장의 표는 확장 제거 정리(analytics-retention)가 다룬다" }
  - { point: archive, extension_state: inactive, reason: "집계 훅 구독이 없으면 수집기는 비어 있고 코어 집계만 남는다" }

