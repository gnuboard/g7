# audit:allow test-scenario-coverage[cross_product] reason: 명령(설치 3종·비밀번호·설정) × 입력 채널 × 대상 확장 상태의 곱은 명령마다 축이 달라 한 곱으로 전개하면 의미 없는 조합이 대부분이다. 명령별 대표 조합은 test_files 의 effects 로, 실제 서버 조합은 manual_verification(R1~R5 실측)으로 덮는다.
feature: 웹 전용이던 운영 절차의 터미널 명령 — 확장 연쇄 설치·관리자 비밀번호 재설정·설정 값 지정

description: |
  설치 직후 자동 구성을 막던 웹 전용 운영 절차를 터미널에서도 같은 규칙으로 할 수 있게 한다.

  5.1 확장 연쇄 설치 — module:install·plugin:install·template:install 의 --with-dependencies·--with-language-packs.
      관리자 설치 창과 같은 서비스(CascadeInstallOrchestrator)를 쓰고, 함께 고친 결함:
        (a) 의존 확장 활성화 결과를 버려 엉뚱한 오류로 실패 (b) 의존의 의존 미해석 (c) 의존 확장 vendor 방식 auto 고정
      모듈·플러그인 의존성 검사가 템플릿처럼 버전 제약까지 본다(--force 로만 우회).
  5.2 user:reset-password — 메일 없는 서버에서도 관리자 비밀번호를 정책 그대로 재설정, 활동 로그 행위자 「시스템(CLI)」.
  5.3 settings:get·settings:set — 코어·플러그인·모듈 설정을 관리자 화면 저장과 같은 FormRequest 로 검증해 저장.

axes:
  command: [module_install, plugin_install, template_install, reset_password, settings_set, settings_get]
  dependency_state: [none, not_installed, inactive, active_version_unmet, transitive]
  cascade_option: [none, with_dependencies, with_language_packs]

