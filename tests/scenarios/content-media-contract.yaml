feature: 본문 미디어 업로드 계약 — 코어 런타임 G7Core.contentMedia (#883 4단계, engine-v1.89.0)

description: |
  확장(게시판·페이지·이커머스)이 확장점 `html_editor` 의 prop `mediaUpload` 로 업로드 계약을 넘기면, 편집기 플러그인은
  확장의 API 경로를 모른 채 `G7Core.contentMedia` 로 계약을 검사·정규화하고, 업로드 전에 종류·확장자·크기·문서당 개수를
  판정하며, 어댑터를 골라 올린다. 다른 출처 주소·허용 밖 헤더는 받지 않는다. 서버 짝은
  `App\Support\ContentMedia\ContentMediaUploadTarget`·`ContentMediaPolicy`·`App\Rules\ContentMediaFile`.

