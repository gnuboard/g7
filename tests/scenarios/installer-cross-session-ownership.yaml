# audit:allow test-scenario-coverage[cross_product] reason: 인스톨러 상태변경 게이트는 엔드포인트별 서브프로세스 단위 테스트가 effect 단위로 검증한다(installer-entry-guard·installer-security-hardening 매니페스트와 같은 형태). 세션×엔드포인트 교차는 공격자 409 데이터셋(save-extensions/reset/abort)과 install-process·finalize·worker·Step 3·reclaim 개별 테스트로 덮고, 실제 2세션 교차는 manual_verification 의 브라우저 A/B 매트릭스로 확인한다.

feature: 웹 인스톨러 설치 소유권 — 교차 세션 상태 혼합 차단

description: |
  설치 도중 다른 브라우저 세션이 인스톨러 상태변경 API 를 호출해 관리자 자격증명을 바꾸거나
  (자격증명 혼합 → 최고관리자 탈취) 기존 DB 삭제를 예약할 수 있던 결함의 회귀 가드.

  근본 원인은 상태변경 API 에 "설치 소유권" 이 없었던 것 하나다. 처치:
    1. Step 3 를 최초로 통과한 세션이 소유자 — state 에는 세션 토큰 해시만 남는다.
    2. install-process / save-extensions / reset / abort / finalize 는 소유 세션 + CSRF 만.
       폴링 action=get 은 게이트하지 않는다(완료 폴링 자가차단 회귀 가드).
    3. DB 테스트 실패 기록은 통과가 아니며, 검사한 연결설정과 제출 설정을 HMAC 지문으로 대조.
    4. drop_tables 는 DB 테스트가 발급한 확인 토큰 + 탐지 테이블 불변일 때만.
    5. 세션이 없는 SSE 워커는 install-process 가 서명한 설치 계획만 실행.
    6. state 쓰기는 generation CAS — 워커 진행 쓰기는 세대를 올리지 않고 소유 필드를 되돌리지 않는다.
    7. 세션 유실 소유자는 복구 토큰으로만 소유권을 되찾는다(토큰 회전·실패 제한).

axes:
  session: [owner, other_session, lost_owner_session, no_session_worker]
  surface: [step3, install_process, save_extensions, state_reset, state_abort, state_get, state_reclaim, finalize_env, install_worker]

