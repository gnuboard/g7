manual_verification: |
  실제 2세션 교차는 브라우저로 확인한다 — 소유 브라우저로 3단계를 통과한 뒤, 쿠키를 공유하지 않는
  두 번째 세션에서 설치 시작·확장 저장·초기화·중단을 요청해 409 와 상태 불변을 측정하고, 소유
  브라우저의 쿠키를 지워 복구 토큰 화면(오토큰 403, 정토큰 재개·토큰 회전)을 확인한다. SSE 와
  폴링 두 모드로 끝까지 설치해 완료 전환과 완료 후 410 을 확인한다.
