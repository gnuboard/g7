feature: SEO 메타 해석기(SeoMetaResolver)의 필드별 값 출처 캐스케이드

description: |
  SeoMetaResolver 는 봇 요청의 SEO 메타(제목·설명·키워드·제목 접미사·og·twitter·구조화 데이터·분석 ID)를
  여러 출처에서 골라 하나의 결과 배열로 돌려준다. 이 매니페스트는 필드마다 값이 어느 출처에서 오는지와
  출처가 모두 빌 때의 결과를 축으로 삼는다.

  출처(source) 정의:
    - resource_meta: 데이터 컨텍스트 리소스의 meta_title, meta_description, meta_keywords 컬럼 (상품·카테고리·게시글)
    - page_seo_meta: 페이지 데이터의 seo_meta 객체 (title, description, keywords)
    - extension_template: 확장 제목·설명 틀 — _seo 컨텍스트(SeoRenderer 주입) 또는 하위호환 모듈·플러그인 설정 틀 seo.meta_{page_type}_title
    - layout_declaration: 레이아웃 meta.seo 선언 (og, structured_data, vars 의 {{표현식}})
    - extension_settings: 확장 일반 설정 — 템플릿 변수 접두사 $module_settings:, $plugin_settings: 로만 읽는다
    - core_settings: 코어 환경설정 (seo.*, general.site_name)
    - request_query: 요청 쿼리 문자열 — 템플릿 변수 접두사 $query: 로만 읽는다
    - none: 어느 출처도 값을 주지 않음

  같은 테스트 파일을 다른 매니페스트도 소유한다. 아래 동작은 그쪽 축·효과로 마킹하므로 여기 조합에서 뺀다.
    - seo-meta.yaml: og 사이트 이름·이미지 크기 코어 기본값, og.extra 가격 태그, twitter 카드 기본값·이미지 폴백,
      aggregateRating 조건부 출력, 제목 틀 구분자 정리(선두 대시·선택 그룹). 해당 테스트는 이 매니페스트 조합에
      seo-meta.yaml 효과를 함께 적는다.
    - seo-og-default-image.yaml: og:image 사이트 기본 이미지 폴백 (image_chain 축)
    - browser-tab-title-rule.yaml: 레이아웃 편집기 검색 제목·설명(meta.seo.title, description) 후보 (case=layout_seo_title_server)

axes:
  field: [title, description, keywords, title_suffix, og, twitter, structured_data, template_var, analytics, result_contract]
  source: [resource_meta, page_seo_meta, extension_template, layout_declaration, extension_settings, core_settings, request_query, none]

exclusions:
  # 성립하지 않는 조합 — 해석기에 그 출처를 읽는 후보가 없다
  - { field: [title, description, keywords, title_suffix, og, twitter, structured_data, analytics, result_contract], source: [extension_settings, request_query], reason: "확장 일반 설정과 쿼리 문자열은 템플릿 변수 접두사($module_settings:, $plugin_settings:, $query:)로만 값에 들어온다 — template_var 조합이 검증" }
  - { field: title, source: core_settings, reason: "제목에는 코어 설정 후보가 없다 — 사이트 이름은 접미사로만 붙는다(title_suffix)" }
  - { field: title, source: layout_declaration, reason: "레이아웃 선언 제목(meta.seo.title) 후보는 같은 테스트 파일의 browser-tab-title-rule.yaml case=layout_seo_title_server 3건이 소유한다" }
  - { field: keywords, source: [extension_template, layout_declaration], reason: "resolveKeywords 는 리소스 meta_keywords, 페이지 seo_meta.keywords, 코어 키워드만 읽는다 — 확장 틀과 레이아웃 키워드 후보가 없다" }
  - { field: title_suffix, source: [resource_meta, page_seo_meta, extension_template, layout_declaration], reason: "제목 접미사는 코어 설정 seo.meta_title_suffix 하나에서만 온다" }
  - { field: [og, twitter], source: [resource_meta, page_seo_meta, extension_template], reason: "og 와 twitter 는 레이아웃 선언(og, twitter)과 코어 설정, 사이트 기본 이미지만 직접 읽는다 — 리소스, 페이지, 확장 틀 값은 해석된 제목과 설명을 거쳐 대체값으로만 들어오며 그 해석은 title, description 조합이 검증" }
  - { field: structured_data, source: [resource_meta, page_seo_meta, extension_template, core_settings], reason: "resolveStructuredDataArray 는 레이아웃 structured_data 선언만 읽는다 — 선언 안 표현식이 데이터 컨텍스트를 참조할 뿐이다" }
  - { field: template_var, source: [resource_meta, page_seo_meta, extension_template], reason: "템플릿 변수는 레이아웃 vars 선언의 표현식과 설정, 쿼리 접두사로만 정해진다" }
  - { field: analytics, source: [resource_meta, page_seo_meta, extension_template, layout_declaration], reason: "분석, 사이트 인증 ID 는 코어 설정에서만 읽는다" }
  - { field: result_contract, source: [resource_meta, page_seo_meta, extension_template, layout_declaration], reason: "결과 배열의 키와 타입 계약은 출처별로 달라지지 않는다 — 빈 입력(none)과 null 코어 설정(core_settings) 두 경계만 본다" }
  # 다른 조합의 같은 실행이 함께 단언하는 조합
  - { field: twitter, source: core_settings, reason: "카드 종류 코어 기본값(twitter_default_card)은 og 파생 테스트(field=twitter, source=layout_declaration)가 같은 실행에서 함께 단언한다(twitter_card_summary_large_image_default)" }
  # 성립하지만 이 파일에 단언 테스트가 없는 조합 — 미검증 공백. 테스트를 더하면 해당 면제를 걷는다
  - { field: [description, keywords, twitter, analytics], source: none, reason: "미검증 공백 — 모든 출처가 빈 경우의 결과를 단언하는 테스트가 없다(setUp 이 코어 설명, 키워드, 분석 ID 를 늘 채우고, twitter 는 og 와 twitter 선언이 모두 없는 실행을 단언하지 않는다). 테스트 추가 시 이 면제를 걷는다" }

effects:
  # title
  - resource_meta_title_used                          # 리소스 meta_title 이 제목 첫 후보
  - resource_meta_wins_over_extension_template        # 리소스 meta_title, meta_description 이 _seo 확장 틀보다 앞선다
  - page_seo_meta_title_used                          # 페이지 seo_meta.title 사용
  - module_template_title_used_without_resource_meta  # 리소스 값이 없으면 모듈 설정 제목 틀
  - template_vars_substituted_into_extension_title    # 틀의 {var} 를 vars 해석값으로 치환
  - page_type_selects_extension_template_key          # page_type 이 seo.meta_{page_type}_title 키를 고른다
  - template_kept_verbatim_without_vars               # vars 미선언이면 틀 원문 그대로
  - module_template_ignores_enabled_flag              # 해석기는 seo_* 활성 플래그를 보지 않는다(SeoRenderer 몫)
  - extension_template_skipped_without_page_type      # page_type 미선언이면 확장 틀 건너뜀
  - plugin_template_title_used                        # 플러그인 식별자만 있으면 플러그인 설정 제목 틀
  - seo_context_title_and_description_used            # _seo.{page_type} 제목, 설명 사용
  - empty_title_when_no_tier_matches                  # 모든 후보가 비면 빈 제목
  - multilingual_resource_meta_resolved_without_error # 다국어 배열 리소스 meta 컬럼 → 현재 로케일 값
  - multilingual_page_seo_meta_resolved_without_error # 다국어 배열 페이지 seo_meta → 현재 로케일 값
  - multilingual_var_value_substituted_without_error  # 다국어 배열 변수값도 치환 시 예외 없음
  # description
  - core_description_used_as_last_fallback            # 다른 후보가 비면 코어 기본 설명
  - page_seo_meta_description_used                    # 페이지 seo_meta.description 사용
  - plugin_template_description_used                  # 플러그인 설정 설명 틀
  - description_falls_back_to_layout_og_description   # 설명 후보가 비면 레이아웃 og.description
  # keywords
  - resource_meta_keywords_used                       # 리소스 meta_keywords 문자열 사용
  - resource_keyword_list_joined_with_comma           # 리소스 키워드 목록 배열은 쉼표로 결합
  - page_seo_meta_keywords_used                       # 페이지 seo_meta.keywords 사용
  - core_keywords_used_as_fallback                    # 리소스, 페이지 키워드가 없으면 코어 키워드
  # title_suffix
  - core_title_suffix_returned                        # titleSuffix 는 코어 접미사 설정값
  - empty_core_suffix_yields_no_suffix                # 코어 접미사가 비면 titleSuffix 도 빈 값
  - suffix_space_restored_after_trimmed_save          # 저장 시 잘린 선행 공백을 제목 뒤에서 복원
  - suffix_explicit_leading_space_kept                # 선행 공백이 이미 있으면 그대로
  - suffix_dangling_separator_stripped_without_title  # 제목이 비면 접미사 앞 구분자 제거
  - blank_suffix_composes_empty                       # 공백, 구분자뿐인 접미사는 빈 문자열
  # og
  - og_image_tag_emitted_when_declared                # 선언한 og.image 가 og:image 태그로
  - og_image_tag_omitted_without_image                # 이미지가 없으면 og:image 태그 없음
  - og_description_html_stripped                      # og 설명의 HTML 태그 제거
  - og_data_returned_as_array                         # og 는 배열로 반환(HTML 렌더 지연)
  - og_defaults_emitted_without_declaration           # og 미선언이어도 og:type=website 기본값
  - multilingual_core_setting_resolved_without_error  # 다국어 배열 코어 설정(site_name) → 현재 로케일 값
  - multilingual_layout_og_field_resolved             # og 필드의 다국어 객체 리터럴 → 현재 로케일 값
  # structured_data
  - json_ld_rendered_with_schema_context              # JSON-LD 에 @context=https://schema.org
  - json_ld_escapes_script_tags                       # 스크립트 태그 문자 유니코드 이스케이프(반사형 XSS 차단)
  - json_ld_null_without_declaration                  # 구조화 데이터 미선언이면 jsonLd=null
  - json_ld_description_html_stripped                 # JSON-LD 설명의 HTML 태그 제거
  - json_ld_empty_typed_object_removed                # 값이 모두 빈 @type 하위 객체 제거
  - json_ld_filled_sub_object_kept                    # 값이 채워진 하위 객체는 유지
  - structured_data_array_rerenderable_after_hook     # 배열 반환 → 훅 수정 뒤 다시 JSON 렌더
  # template_var
  - var_expression_bound_from_context                 # {{표현식}} 변수를 데이터 컨텍스트로 해석
  - localized_var_value_resolved_to_current_locale    # 다국어 객체 변수값 → 현재 로케일 값
  - var_missing_context_path_yields_empty             # 없는 컨텍스트 경로 → 빈 값, 틀 공백 정리
  - var_module_settings_prefix_resolved               # $module_settings: → 현재 모듈 설정
  - var_explicit_module_id_resolved                   # $module_settings:모듈ID:키 → 지정 모듈 설정
  - var_plugin_settings_prefix_resolved               # $plugin_settings: → 플러그인 설정
  - var_core_settings_prefix_resolved                 # $core_settings: → 코어 설정
  - var_query_prefix_resolved                         # $query: → 요청 쿼리 파라미터
  - multilingual_extension_setting_var_resolved_without_error  # 다국어 배열 모듈 설정 변수 → 현재 로케일 값
  # analytics
  - analytics_id_read_from_core_settings              # googleAnalyticsId 는 코어 설정값
  # result_contract
  - result_contains_required_keys                     # 결과 배열에 필수 키 전부
  - null_core_settings_yield_strings                  # 코어 설정이 null 이어도 문자열 결과(TypeError 없음)

test_files:
  - tests/Unit/Seo/SeoMetaResolverTest.php

validation:
  audit_rule: test-scenario-coverage
