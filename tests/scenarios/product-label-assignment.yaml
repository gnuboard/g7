feature: 상품 라벨 배정의 활성 기간 판정(ProductLabelAssignment)

description: |
  상품 라벨 배정은 시작일·종료일(날짜)로 활성 여부를 가린다. isActive() 와 scopeCurrentlyActive 는 사이트 시간대의
  오늘(siteToday)로 판정하므로, 시험은 시각을 두 시간대의 날짜가 같은 때로 고정해 기간 경계를 잰다. 날짜 캐스팅과
  상품·라벨 관계도 함께 잠근다.

axes:
  case: [date_cast, within_range, before_start, after_end, unbounded, active_scope, relations]

effects:
  - dates_cast_to_date
  - active_within_date_range
  - inactive_before_start_date
  - inactive_after_end_date
  - active_without_date_limits
  - currently_active_scope_keeps_only_active
  - product_relation_resolves
  - label_relation_resolves

test_files:
  - tests/Unit/Models/ProductLabelAssignmentTest.php
