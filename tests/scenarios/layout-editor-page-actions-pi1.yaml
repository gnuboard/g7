# 레이아웃 편집기 페이지 설정 동작 목록과 오류 처리
# #869 이월 0 회차(π1): tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_page_actions_pi1

description: |
  페이지 설정의 동작 추가 피커, 동작 목록(요약, 드래그 순서, 삭제, 코드 보기, 컨텍스트 칩), 동작 파라미터 위젯 디스패치와 미리보기를 다룬다.
  init_actions 폼과 부모 자식 상속 매트릭스(잠금, 자식 구간 patch, 3단 상속, 모달 호스트), 오류 처리 폼과 행(출처 배지, 오버라이드, 해제)을 함께 잰다.

axes:
  subject: [action_add_picker, action_list_builder, action_param_fields, action_preview, init_actions_inheritance, init_actions_form, error_handling_form, error_handling_rows, error_handling_unset, error_handling_save_prune, error_handling_template_override, page_settings_modal]

