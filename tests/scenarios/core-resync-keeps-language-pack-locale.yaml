feature: 코어 선언 재동기화가 활성 코어 언어팩 번역을 지우지 않음

description: |
  `core:resync-declarations` 와 코어 업데이트의 재동기화(`CoreUpdateService::syncCoreMenus()`·`syncCoreRolesAndPermissions()`,
  `reloadCoreConfigAndResync()` 경유)는 시더와 같은 필터(`core.menus.config`·`core.permissions.config`·`core.roles.config`)를 거쳐
  활성 코어 언어팩의 번역을 선언에 함께 넣는다. 언어팩 판이 오르지 않는 코어만 패치·단독 재동기화에서도 코어 메뉴·권한·역할의
  ja 가 남는다(1차 캠페인 E17). 운영자가 고친 이름(user_overrides)은 종전처럼 보존한다.

axes:
  path: [core_resync]
  override: [none, operator_name]

effects:
  - core_resync_keeps_active_pack_locale
  - core_resync_preserves_operator_name

test_files:
  - tests/Feature/Upgrade/CoreResyncKeepsLanguagePackLocaleTest.php
