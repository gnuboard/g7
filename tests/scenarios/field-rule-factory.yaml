feature: field_rule_factory

description: |
  항목 검증 규칙을 만드는 한 곳(App\Fields\FieldRuleFactory). 회원 폼 4경로와 추가 정보 입력이 표면 이름으로 부른다.
  기본 설정에서는 종전 요청 클래스의 항목 규칙과 같은 규칙이 나와야 한다(업그레이드 무변화).

coverage_strategy: full

axes:
  surface: [signup, admin_create, admin_update, self_update, required_info]

effects:
  - rule_factory_defaults_match_legacy_rules
  - rule_factory_disabled_field_is_silently_ignored
  - rule_factory_scope_and_signup_visibility
  - rule_factory_required_presence_by_type
  - rule_factory_admin_update_relaxes_empty_required
  - rule_factory_required_info_limits_to_pending_keys
  - rule_factory_unique_value_conflict
  - rule_factory_attribute_names_and_messages

test_files:
  - tests/Unit/Fields/FieldRuleFactoryTest.php
