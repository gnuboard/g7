feature: 템플릿 설정을 셸 HTML 에 미리 싣는다 — template.json expose 선언

description: |
  첫 화면 전 PHP 왕복(`GET /api/templates/{id}/config`)을 없애려고, 서버가 활성 템플릿 template.json 의 최상위 `expose` 배열에
  제작자가 선언한 키만 셸 HTML(`#g7-config` 의 `templateConfig`)에 싣는다. 설정값의 `expose` 규칙(설정 주인이 선언한 키만 G7Config)과
  같은 방식이다. 선언했는데 template.json 에 없는 키는 null(「선언했고 값 없음」), 문자열이 아닌 항목·경로 모양(`a.b`)·예약 이름
  (`expose`·`cache_version`)은 무시한다. `expose` 가 없는 템플릿은 `templateConfig` 를 싣지 않고 엔진은 종전처럼 API 를 부른다.
  config API 응답 형식은 그대로다(같은 캐시 키의 template.json 읽기를 TemplateService 로 옮겼다).
  설치·업데이트 때 `expose` 가 배열이 아니거나, 엔진이 읽는 키(scroll_restoration·errorHandling·error_config)가 template.json 에
  있는데 선언에 없으면 경고한다(설치는 막지 않는다). `expose` 를 아예 쓰지 않는 템플릿은 경고하지 않는다.

axes:
  shell: [user, admin, fixture]
  declaration: [declared, absent, invalid_items, not_array, missing_engine_keys]

exclusions:
  - { shell: user, declaration: absent, reason: "번들 사용자 템플릿은 선언을 갖는다 — 선언 없음은 fixture 로 본다" }
  - { shell: user, declaration: invalid_items, reason: "형식 판정은 셸과 무관 — fixture 로 본다" }
  - { shell: user, declaration: not_array, reason: "검증 경고는 셸과 무관 — fixture 로 본다" }
  - { shell: user, declaration: missing_engine_keys, reason: "검증 경고는 셸과 무관 — fixture 로 본다" }
  - { shell: admin, declaration: absent, reason: "번들 관리자 템플릿은 선언을 갖는다" }
  - { shell: admin, declaration: invalid_items, reason: "형식 판정은 셸과 무관" }
  - { shell: admin, declaration: not_array, reason: "검증 경고는 셸과 무관" }
  - { shell: admin, declaration: missing_engine_keys, reason: "검증 경고는 셸과 무관" }
  - { shell: fixture, declaration: declared, reason: "선언 정상 경로는 번들 사용자·관리자 셸이 본다" }

