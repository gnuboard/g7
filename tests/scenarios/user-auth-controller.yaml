feature: 사용자 인증 API 엔드포인트 회귀 묶음

description: |
  사용자 인증 컨트롤러(가입·로그인·로그아웃·토큰 갱신·내 정보·비밀번호 찾기·재설정·토큰 확인)의 엔드포인트별
  요청 검증·응답 계약을 고정하는 기존 기능 시험 묶음이다. 가입 연락처 필드는 auth-register-contact-fields,
  계정 존재 비노출과 요청 제한은 auth-account-enumeration 시나리오가 따로 소유한다.

  7.1.6 에서 바뀐 계약: 가입되지 않은 주소의 비밀번호 찾기는 가입 주소와 같은 200, 재설정은 토큰이 틀린 것과
  같은 필드(token) 오류. 같은 주소의 재요청은 60초가 지나야 토큰이 갱신된다.

axes:
  endpoint:
    - login
    - register
    - logout
    - refresh
    - current_user
    - forgot_password
    - reset_password
    - validate_reset_token

