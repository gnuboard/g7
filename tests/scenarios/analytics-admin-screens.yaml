# audit:allow test-scenario-coverage[cross_product] reason: |
#   pairwise 전개(화면 17 × 상태 14 × 뷰포트 2 × 로케일 3 × E2E 5)는 audit 환경의 fallback YAML 파서로 전개하지 않는다.
#   조합은 Vitest 레이아웃 계약 테스트·Playwright E2E 가 테스트별 @scenario 로 나눠 덮고, 상태 14종 × 뷰포트 × 로케일 실측은
#   Chrome MCP 매트릭스(이력 문서)가 맡는다. effects·test_files 축은 면제하지 않는다.

feature: 방문자 통계 관리자 화면·사용자 위젯 (이슈 #682 S3)

description: |
  집계된 숫자를 운영자가 실제로 보는 자리 — 관리자 화면 14장, 대시보드 카드, 홈 방문자 카운터.

  배경:
    - 모든 통계 화면이 같은 기간 질의(`preset`·`from`·`to`·`unit`·`exclude`)를 쓴다. 화면 사이 이동은
      병합이라 기간이 따라가고, 서브탭 전환은 병합하지 않고 기간 키만 질의로 명시해 넘긴다 — 리포트마다
      행이 달라 쪽·검색·정렬을 물려받으면 빈 화면이 열린다. 주소를 공유하면 그 화면이 그대로 열린다.
      탭은 전역 상태 없이 질의 하나가 출처다.
    - 프리셋은 날짜 문자열만 계산한다 — 시각까지 붙인 값은 통계 API 가 422 로 거절한다.
    - 재집계 진행률은 방송이 기본이고 폴링이 폴백이다. 진행 상태의 출처는 실행 이력 행 하나라
      두 길이 같은 값을 본다.
    - 대시보드 알림 카드는 복구 API 가 있으면 복구 버튼, 없고 이동 주소가 있으면 이동 버튼을 그린다.
      버튼이 뜨는 조건은 알림 종류가 아니라 실어 온 값이다(C1).
    - 설정 › 리포트 탭의 정의 상태는 알림 정의 API 를 따로 읽는다 — 카드가 그 API 로 편집하므로
      같은 출처여야 편집 직후 상태가 어긋나지 않는다(§6.3-17).
    - 홈 방문자 카운터는 설정이 켜졌고 응답이 도착했을 때만 그린다 — 0 을 그리면 아무도 오지
      않은 것처럼 읽힌다.

  적용 지점:
    - `templates/_bundled/sirsoft-admin_basic/layouts/admin_analytics_*.g7.html` 14 화면.
    - `templates/_bundled/sirsoft-admin_basic/layouts/partials/admin_analytics/*` 조각 10.
    - `templates/_bundled/sirsoft-admin_basic/layouts/partials/admin_dashboard/_analytics_widget.g7.html` + `admin_dashboard.g7.html`.
    - `templates/_bundled/sirsoft-admin_basic/src/components/composite/LineChart.tsx`,
      `src/handlers/setAnalyticsPeriodHandler.ts`, `src/handlers/downloadAttachment.ts`.
    - `templates/_bundled/sirsoft-basic/src/components/composite/VisitorCounter.tsx`,
      `layouts/partials/_visitor_counter.g7.html`, `layouts/home.g7.html`.

coverage_strategy: pairwise

axes:
  screen: [overview, pages, referrers, environment, regions, patterns, actions, realtime, visitors, visitor_detail, bots, diagnostics, privacy_requests, settings, dashboard_widget, home_widget, component]
  state: [loading, normal, empty, forbidden, collection_off, consent_fallback, geoip_off, anonymous, unit_downgraded, queue_backlog, ws_polling, load_failed, running, locked, stale, too_many_visits]
  viewport: [1440, 390]
  locale: [ko, en, ja]
  e2e: [collect, overview, settings_privacy, permissions, home_counter, archive_on_view]

exclusions:
  - { screen: home_widget, state: forbidden, reason: "공개 요약은 인증을 요구하지 않는다 — 권한 상태가 성립하지 않는다" }
  - { screen: component, state: forbidden, reason: "순수 표시 컴포넌트에는 권한 상태가 없다" }
  - { state: geoip_off, screen: settings, reason: "GeoIP 꺼짐은 지역·봇 설정 힌트로만 드러난다 — 화면 상태가 아니다" }

