feature: 레이아웃·조각 영구 삭제 직전 기록과 버전 명시 삭제

description: |
  운영자 데이터(편집기로 고친 화면·조각, 편집기로 만든 화면)를 영구 삭제하는 경로 — 확장 제거, 덮어쓰기 갱신에서 새 판에
  없는 화면, 템플릿 제거, 설정 화면 파일이 빠진 갱신, 고아 오버라이드 정리 — 는 지우기 직전 활동 로그에 스냅샷
  (`layout.force_deleted`·`layout_extension.force_deleted`·`template_custom_translation.deleted`)을 남긴다. 스냅샷에는 본문·원본
  해시·최근 버전 50개(넘으면 `versions_truncated`)가 실린다. 버전 행은 서비스가 명시적으로 지운다 — FK 를 꺼도 고아 버전이 없다.
  템플릿 제거는 조각(다른 출처 포함)·커스텀 번역·레이아웃 첨부(스토리지 파일)·미리보기를 레이아웃보다 먼저 명시 삭제한다.
  keep 갱신은 설정 화면 파일이 빠져도 운영자가 고친 설정 화면 행을 남긴다. 편집기가 지운 행을 되살려 새 화면을 만들면
  원본 본문도 비워 고아 정리 대상이 되지 않는다.

# 축 의미:
#   case — {삭제 경로}__{행 상태}. 행 상태 modified = 운영자가 고침, unmodified = 파일 그대로, operator_created = 편집기로 만듦.
axes:
  case: [uninstall__modified, uninstall__unmodified, refresh_overwrite_removed__modified, template_uninstall__modified, settings_layout_removed__modified, orphan_override__operator_created]

effects:
  - deletion_snapshot_logged_for_operator_data
  - versions_deleted_explicitly
  - template_children_deleted_explicitly
  - settings_layout_kept_when_modified
  - restored_row_is_not_file_origin
  - activity_log_shows_deletion_snapshot

test_files:
  - tests/Feature/Layout/LayoutDeletionSnapshotTest.php
