feature: 압축 해제 안내 문구가 없앤 unzip 폴백을 대안으로 안내하지 않는다 (7.1.3)

description: |
  7.1.3 은 항목 이름을 검사하지 않는 `unzip -o` 폴백을 없애고 PHP zip 확장(ZipArchive)을 필수로 했다.
  zip 확장이 없는 서버의 오류 문구와 관리자 수동 업데이트 설명이 「zip 확장 또는 unzip 명령어」를 안내하면,
  운영자가 unzip 을 설치해도 업데이트는 여전히 실패한다. 코어·번들 언어팩·번들 확장 문구 전량에서 unzip 언급을 막는다.

axes:
  case:
    - no_message_mentions_unzip
    - population_not_empty

effects:
  - missing_zip_extension_message_requires_zip_extension_only

test_files:
  - tests/Unit/Lang/NoUnzipFallbackMessagesTest.php
