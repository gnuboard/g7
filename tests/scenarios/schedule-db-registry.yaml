# audit:allow test-scenario-coverage[cross_product] reason: 축이 서로 독립인 실행 경로 단계(등록·투입·실행·마감)라 각 테스트는 자기가 바꾸는 축만 @scenario 로 고정한다 — 전 축 곱(3×2×4×2×2×2×2×3×3)은 의미 없는 조합이 대부분이다. effects·test_files 는 그대로 검사한다.

feature: DB 스케줄 등록·실행 경로 (#17)

description: |
  모든 예약 작업이 DB `schedules` 행을 거쳐 같은 실행기로 돈다.

  배경:
    - 7.1.x 까지 실제 예약은 routes/console.php 의 코드 등록과 확장 getSchedules() 였고,
      화면에서 등록한 행은 틱마다 실행하는 경로가 없었다(즉시 실행만, HTTP 요청 안에서 동기).
    - 옛 구현(d5a480400)은 이벤트명이 모두 같아 onOneServer 잠금을 공유하고, 중복 방지가
      boolean 이라 TTL 이 뭉개지고, 큐 연결을 하드코딩했으며, 실행기가 Process/Http 를 직접 써서
      보안 가드 테스트의 fake 가 무력화됐다.

  적용 지점:
    - routes/console.php 한 줄 → ScheduleRegistrar: 활성 행마다 `schedule:{id}` 이벤트(30초 주기 / cron +
      행 시간대, onOneServer, 점검 모드, 실행 조건은 실행 시점 평가), 생존 신호 `schedule:heartbeat`.
    - ScheduleDispatcher: 바로 실행(실행기 직접 호출) / 큐로 보내기(RunScheduledTaskJob — 등록된 연결·큐만,
      timeout 은 retry_after 아래로). job 유형은 Job 자체를 선언 방식으로 보낸다(그 Job 의 큐·재시도·중복 방지 보존 설계).
    - ScheduleExecutor: 비활성 확장 거부 → 중복 방지 캐시 잠금(분) → 이력(모든 실행 / 실패만) →
      타입별 실행(Artisan::call · Process · Http · 허용목록 Job) → 행 상태(모델 이벤트 없이) → 훅.
    - 실패 알림: run_failed 훅 → 알림 정의 schedule_failed, 데이터 리스너가 수동 실행·알림 꺼짐·하루 1회를 거른다.
    - 활동 로그는 수동 실행만.

axes:
  trigger: [scheduled, manual, queue_worker]
  dispatch_mode: [sync, queue]
  schedule_type: [artisan, shell, url, job]
  frequency: [every_thirty_seconds, cron]
  history_mode: [all, failures_only]
  overlap: [off, minutes]
  condition: [met, unmet]
  owner: [core, custom, module_inactive]
  outcome: [success, failure, rejected]

exclusions:
  - { trigger: queue_worker, dispatch_mode: sync, reason: "큐 워커 계기는 큐로 보내기 행에서만 생긴다" }

