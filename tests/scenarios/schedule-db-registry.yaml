# E2E axis 없음: 이 매니페스트는 서버측 실행 경로(등록·투입·실행·알림)다. 화면(스케줄 목록·즉시 실행·
# 상태 카드)은 관리자 템플릿의 레이아웃 Vitest 와 Playwright spec(schedule-list-filter·queue-failed-retry),
# 라이브 점검 매트릭스(즉시 실행·틱·실패 알림 행)가 소유한다.

