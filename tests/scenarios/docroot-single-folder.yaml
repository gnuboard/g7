# Apache rewrite 실물이 필요해 P0 격리 환경 실측이 판정한다 — §9 S4(노출 차단·T10)·S11
# (설치 후 화면 정상)·T8("배포 레이아웃 ② 와 표준 배치 양쪽에서 S11")·T10("`.htaccess`
# 미동작 모사 시 자가 진단이 설치를 차단"). G3 DoD: 설치 완료 후 관리자·사용자 화면 정상
# + 설정 파일 직접 요청 차단. G8 이 결과 표를 소유한다.
