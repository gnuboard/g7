# audit:allow test-scenario-coverage[cross_product] reason: issue:#609 문서 루트 배치·.htaccess rewrite·노출 차단은 실제 웹서버(Apache AllowOverride)가 있어야 재현된다 — PHPUnit/Playwright(vitest jsdom) 런타임 밖 (계획서 §8 자동화 한계). 판정·갱신·게이팅의 단위 계약은 test_files 가 커버하고, 종단(레이아웃 ② 노출 차단·자산 이중 모드 200·관리자/사용자 화면 정상)은 P0 격리 환경 브라우저 실측(§9 S4·S11, G3 DoD)이 담당한다 — 결과는 G8 보고서에 누적된다.
# audit:allow scenario-referenced-test-file-marked reason: issue:#609 형제 표식(test-scenario-coverage)의 유예를 명시 승계 — 15차 F-21 에서 표식 연쇄를 끊으며 이 룰의 유예를 자기 표식으로 옮겼다. 선언한 test_files 의 @scenario/@effects 마킹은 후속

feature: 문서 루트 단일 폴더 (축 B 의 뼈대 — P3/G3)

description: |
  문서 루트를 바꿀 수 없는 호스팅(문서루트=프로젝트 루트, 레이아웃 ② — D2)의 지원.
  루트 진입점 2종(index.php shim + .htaccess, ZIP 동봉·코어 업데이트 동반 갱신 — D25)
  · 인스톨러 Step 2 웹 노출 자가 진단(노출 확정 시 설치 차단 D3 · 판정 불능 시 운영자
  확인 절차 D21) · public/storage 심볼릭 링크 불가 환경의 공개 자산 대체 서빙
  (dualAsset 이중 모드 — R33 · 스트리밍 — R35).

  회귀 불변식 (계획서 B-1②/B-2/B-3/B-4):
    1. 표준 배치(문서루트=public)의 동작 불변 — 루트 파일 2종은 그 배치에서 웹에 노출되지 않는다.
    2. 루트 shim 은 public/index.php 로 위임만 한다 — 확장 오토로드 블록 복제 금지 (R38 승계).
    3. 운영자가 루트 .htaccess 의 G7 블록 밖에 추가한 규칙은 코어 업데이트에서 보존된다 (D25).
    4. 노출 판정 주체는 브라우저다 — 서버 loopback 프로브는 vhost·프록시를 우회해 오판한다
       (checkAssetUrlMode 선례). 판정 불능은 노출 확정과 다른 상태로 다룬다 (D21).
    5. 프로브 페이로드에 비밀 무유출 (R3) — .env 원문 대신 .env.example·난수 sentinel 로 판정.
    6. public 디스크 공개 URL 의 형태는 서버가 정한다(SSoT) — 링크 가용 시 /storage/…,
       불가 시 읽기 전용 서빙 라우트(자산 URL 이중 모드 준수).

axes:
  deployment_layout: [docroot_public, docroot_project_root, docroot_parent_subdir]  # 표준 배치 / 레이아웃 ② / 레이아웃 ③(서브디렉토리 + /public 노출)
  protection: [htaccess_ok, htaccess_absent]                        # 루트 보호 동작 여부 (rewrite 유무 포함)
  exposure_probe: [safe, exposed, unknown, unknown_confirmed]       # Step 2 판정 상태 (D3·D21)
  probe_response: [marker_200, clean_200, denied_403, missing_404, auth_401, server_5xx, network_error]  # 프로브 1건의 응답 종류
  probe_target: [env_example, composer_json, storage_sentinel]      # 노출 계열 3종 (비밀 무유출 — R3)
  asset_url_mode: [extension, extensionless]                        # 서빙 라우트 이중 모드 (R33)
  storage_link: [usable, missing, broken, plain_dir]                # public/storage 링크 상태 (B-3 전환 판정). plain_dir = 링크가 아닌 일반 디렉토리 — 복구의 rename 백업 분기를 여는 유일한 상태다
  htaccess_operator_state: [pristine, modified_outside_block, marker_removed]  # D25 보존 축
  htaccess_write_access: [writable, read_only, not_a_file]          # 갱신 쓰기 결과 판정 (D25)
  update_targets_state: [current, stale_without_root_files]         # 구버전 targets → 자동 발견 폴백 (D25)
  redirect_context: [install_root, subpath]                         # 인스톨러 완료 리다이렉트 (G3 입력 ②)
  # 4차 검증 라운드 신규 축
  exposure_control: [reachable, unreachable]                        # 양성 대조 — 위임 부재·기준 URL 오도출 검출
  # 15차 검증 라운드 신규 축 — 음성 대조(negative control)
  # 레이아웃 ②는 모든 주소를 앱으로 위임해 「파일 없는 주소」도 200 앱 화면이 된다.
  # 그 형태를 함께 재야 D3 자동 판정이 성립한다(재지 않으면 전 배치가 D21 로 강등).
  exposure_absent_control: [signature, unavailable, empty_body]     # 음성 대조 — 형태 승격 · 재지 못함 · 빈 본문(승격 불가)
  project_root_candidate: [stripped, unstripped]                    # /public 꼬리 판정 (디렉토리 이름 충돌)
  api_validation_client: [xhr, browser]                             # api/* 검증 실패의 응답 형태 (302 금지)
  conditional_request: [none, if_none_match, if_modified_since]     # 조건부 요청 → 304 계약
  # 7차 검증 라운드 신규 축
  base_path: [root, subpath]                                        # 사이트 마운트 위치 (`/` vs `/g7`) — 자산 URL 생성·복구 양쪽이 같은 규칙을 써야 한다
  range_request: [none, partial, head]                              # HEAD·206 응답 계약 (압축 제외 이후 형제 라우트가 대표하지 않는다)
  # 16차 검증 라운드(W3) 등재 — 테스트에는 이미 쓰이고 있었으나 어느 매니페스트에도 없던 축
  response_kind: [streamed, binary]                                 # 파일 응답 헬퍼 두 지점 — 스토리지 스트림(streamedFileResponse) / 로컬 파일(fileResponse)
  accept_encoding: [weighted]                                       # `Accept-Encoding` 가중치(q) 판정 — 명시 거부·별칭·와일드카드
  # 8차 검증 라운드 신규 축
  allow_override: [full, restricted]                                # 루트 보호 파일이 허용받는 지시어 등급 — restricted(`FileInfo Limit Indexes`)에서 `Options`/`Require` 는 전 요청 500 이 된다. `<IfModule>` 은 모듈 유무만 보므로 그 가드가 되지 않는다
  # 12차 검증 라운드 신규 축
  navigation_direction: [request, navigation]                       # 접두사가 실려야 하는 두 방향 — 「데이터를 불러오는 주소」와 「화면을 이동하는 주소」. 11차까지는 앞의 것만 닫혀 있었고, 뒤의 것이 빠지면 라우트가 하나도 매칭되지 않아 **전 화면이 「없는 페이지」**가 된다(오류 없음)
  fetch_origin: [core_bundle, extension_bundle]                     # 그 주소를 만드는 번들 — 확장 번들은 코어와 별도 IIFE 라 코어 헬퍼를 import 할 수 없다. 게이트 모집단이 코어뿐이면 확장 28곳이 영구 사각이 된다
  probe_identity: [stable, rotating]                                # 프로브 상한의 클라이언트 신원 — `session_id()` 는 요청자가 고르는 값이라 rotating 축이 없으면 상한 우회가 재현되지 않는다
  server_kind: [apache_htaccess, iis_webconfig, nginx_snippet]      # 보호 규칙을 싣는 통로 — Apache/LiteSpeed 는 동봉 파일만으로 성립, IIS 는 web.config 동봉, nginx 는 서버 블록 조각 + 운영자 적용 + 재측정. IIS 는 로컬 실측 환경이 없어 정적 검토만이며 실측은 P0/G8 몫이다
  # 14차 검증 라운드 신규 축 — **브라우저에서만 재현되는 절반**
  #
  # 13차까지 이 매니페스트에는 E2E 축이 하나도 없었다. 그래서 이 기능의 Playwright
  # spec 3종(자산 URL 이중 모드 계열)이 **어느 매니페스트에도 등록돼 있지 않았고**,
  # 그 파일이 통째로 사라져도 test_files 실재 검사가 울지 않았다. 동시에
  # `frontend-change-requires-e2e` 는 「변경셋에 시나리오 yaml 이 있으면 통과」라
  # 이 yaml 을 건드린 것만으로 초록이 됐다 — 축이 없는 채로.
  #
  # `asset_url_mode` 축이 서버가 내주는 **형태**를 가른다면, 이 축은 그 형태를 만난
  # 브라우저가 **무엇을 하는가**를 가른다. 정적 최적화 블록(nginx 정규식 location)은
  # PHP 런타임 밖의 조건이라 PHPUnit 으로 재현할 수 없고, 자가 복구는 네트워크 재시도
  # 예산·리로드 유무·초기화 횟수 같은 브라우저 상태라 jsdom 으로도 재현되지 않는다.
  e2e_asset_url_recovery: [browser_self_heal, admin_drift_notice, admin_mode_detect]
  # 16차 검증 라운드 신규 축 — **마운트를 만드는 방법**
  #
  # `base_path` 축은 사이트가 하위 주소에 있는지만 갈랐고, 그 하위 주소를 **어떻게**
  # 만들었는지는 재지 않았다. 그런데 그 방법에 따라 웹서버가 진입 스크립트에 주는
  # 값이 달라진다 — 문서 루트 안의 실제 폴더는 `SCRIPT_NAME` 에 접두사를 싣는다.
  # 웹서버 별칭(`Alias`)은 **대상이 그 vhost 의 문서 루트와 같은 디렉토리일 때** 싣지
  # 않는다(17차 실측 — 대상이 문서 루트 **밖**이면 싣는다. 「별칭이면 항상」이 아니다).
  # 싣지 않는 그 배치에서는 접두사를 복원할 근거가 위임 규칙이 넘기는 값 하나뿐이고,
  # 없으면 미설치 안내와 주소 정리가 전부 **사이트 밖 주소**로 나간다(오류 없음).
  mount_shape: [docroot_relative, physical_subdir, server_alias]
  # 17차 회차 3 신규 축 — **마운트 접두사에 든 이름**
  #
  # 위 축은 마운트를 만드는 방법만 갈랐고, 그 접두사가 **무엇으로 불리는지**는 재지
  # 않았다. 접두사에 사이트의 공개 폴더와 같은 이름(`public`)이 들어가면 한 URL 안에
  # `/public/` 이 두 번 나타나고, 경로 판정이 어느 쪽을 사이트 폴더로 보는지가 갈린다.
  # 요청 라인 원문에서 판정하면 요청 쪽 이름을 인코딩으로 가렸을 때 접두사의 것만 남아
  # 그 자리를 잘라 **사이트 밖 주소**로 301 이 나갔다(P0 실측:
  # `/my/public/site/%70ublic/favicon.ico` → `Location: /my/site/%70ublic/…`).
  mount_prefix_shape: [plain, contains_public_segment]
  # 17차 회차 4 신규 축 — **라우트 경로에 든 이름**
  #
  # 위 축은 마운트 **접두사**에 `public` 이 들어간 경우만 갈랐다. 그런데 같은 이름은
  # 라우트 쪽에도 들어갈 수 있다(게시판 슬러그·페이지 슬러그·확장 자산 경로). 그러면
  # 한 URL 안에 `/public/` 이 두 번 나타나는 것은 같은데 **어느 쪽이 사이트 폴더인지가
  # 반대**다 — 접두사 축은 첫 것이 접두사이고, 이 축은 마지막 것이 라우트다. 그래서
  # 「첫 것을 고른다」·「마지막 것을 고른다」 어느 규칙도 두 축을 동시에 만족하지 못하고,
  # 접두사 축만 재면 반대쪽 오답이 그대로 남는다(P0 실측: 레이아웃 ②
  # `/public/board/public/1` → `Location: /public/board/1` 로 라우트 세그먼트가 사라지고,
  # 표준 배치에서는 `/storage/public/img.png` → `Location: /storage/img.png` 로 이 규칙이
  # 관여하지 말아야 할 배치의 주소까지 깎았다). 오류도 로그도 없이 다른 화면이 열린다.
  route_path_shape: [plain, contains_public_segment]
  # 15차 검증 라운드 F-42~F-45 — **마커가 쓰던 이름을 선언으로 올린다** (선언 = 마커)
  #
  # 세 테스트(DocrootExposureWarningReachTest · CoreUpdateRunLockWarningTest · RootIndexShimTest)가
  # 아래 축 이름으로 마킹해 왔는데 어느 매니페스트도 선언하지 않았고, 그중 둘은 `=` 없는
  # 산문 표기(`process_shape spawn_child·standalone / …`)였다. 그런 마킹은 어떤 조합의 지문과도
  # 맞지 않아 커버 계산에서 조용히 빠진다 — 작성자는 마킹했다고 믿고 룰은 세지도 않는다.
  process_shape: [spawn_child, standalone]                          # 업그레이드 스텝을 도는 프로세스 형태 — 통보 배수 지점 도출
  warning_channel: [console, update_record]                         # 노출 통보가 닿아야 하는 통로
  parent_path: [failure, handoff]                                   # 부모 커맨드의 예외 경로 — 배수가 cleanup 성패와 무관해야 한다
  cleanup_outcome: [ok, throws]                                     # 핸드오프 cleanup 결과
  lock_state: [unavailable, acquired]                               # 실행 잠금 확보 결과
  channel: [console, log]                                           # 잠금 강등 사유가 닿는 통로
  lock_failure: [cannot_open_file]                                  # 잠금 파일을 열지 못한 실패 형태
  reason_source: [php_error, fallback_message]                      # 강등 사유 문구의 출처
  lock_file: [stale, fresh]                                         # 잔존 잠금 파일의 나이
  mtime: [readable, unreadable]                                     # 잠금 파일 mtime 조회 가능 여부
  shim_detection: [literal]                                         # 루트 shim 판정 방식 — 단일 소유자
  # G3 회차 16 W2 — 마커 파일·서버 조각 원장·정적 서빙 헤더 축. 종전 마킹이 쓰던 이름을 선언으로 올린다.
  destination_state: [absent, with_block]                          # 갱신 대상 파일의 상태 — 없음(신규 복사) / 마커 블록 보유
  marker_syntax: [hash_comment, xml_comment]                        # 코어 관리 블록 마커 문법 — `.htaccess`(`# …`) / `web.config`(XML 주석). 판정 로직은 하나, 마커만 다르다
  deploy_fragment_state: [unmodified, operator_modified]            # `deploy/**` 조각의 디스크 상태 — 코어가 쓴 그대로인가 / 운영자가 고쳤는가
  deploy_fragment_ledger: [absent, present, unwritable]             # 해시 원장 상태 — 없음(이 규칙 이전 설치본·구버전 부모 적용) / 있음 / 쓸 수 없음(storage/app 권한)
  deploy_fragment_merge: [merged, unmerged]                         # 운영자가 `.dist` 를 합쳤는가 — 합치면 다음 업데이트가 정상 갱신으로 탈출해야 한다
  rollback_leftover: [deploy_dist_sidecar]                          # 되돌리기가 걷어야 하는 잔존물 — 백업에 없는 `.dist`·`.dist.new`
  server_parity: [iis, apache, caddy, canonical_address, empty_segment_guard, reverse_direction, rule_level_reverse, correspondence_table, autoindex, verification_token, nosniff]  # 네 서버 설정의 패리티 축 — 목록·규칙·헤더가 서버마다 갈리지 않는가
  servers: [apache+nginx+caddy+iis, nginx+caddy+iis, nginx+caddy]  # 그 축의 모집단
  forwarded_prefix_spelling: [raw, percent_encoded]                 # X-Forwarded-Prefix 와 요청 경로의 표기 — 정제기는 정규형을 내고 대조는 같은 정규형끼리 해야 한다(16차 A1·A6). 두 표기가 다른 판정을 받거나 대조에서 어긋나면 접두사가 이중으로 붙는다
  color_theme: [light, dark]                                        # 인스톨러 화면 테마 — 경고·오류 카드 위 문자의 AA 대비는 두 테마를 따로 잰다(16차 D-1~D-3)
  # G3 회차 16 W6 — 종전 마킹이 쓰던 이름을 선언으로 올린다 (선언 = 마킹, 제품 결정).
  # 이 매니페스트가 선언한 테스트 파일들의 @scenario 가 이미 쓰고 있던 축 이름 전수이며,
  # 값은 실제 마킹에서 도출했다. pairwise + :cross-product 면제라 조합 전개에는 영향이 없다.
  url_kind: [board_attachment, ecommerce_image_fallback, ckeditor5_image_fallback]  # 마운트 접두사를 실어야 하는 폴백 URL 의 종류
  hosting_restriction: [disabled_glob]                              # 호스팅이 차단한 함수 축 (glob)
  extension_discovery: [upgrade_steps]                              # glob 없이 살아남아야 하는 파일 열거 지점
  entry_file: [root_index, public_htaccess]                         # 루트 진입 파일 2종
  update_wiring: [targets, delegation, layout]                      # 루트 진입 파일의 업데이트 편입 계약
  canonical_address: [layout_gate]                                  # 정본 주소 규칙의 소유 위치
  apache_modules: [absent]                                          # mod_rewrite 부재 방어선
  source_state: [with_block]                                        # 갱신 원본의 마커 블록 상태
  block_delta: [same]                                               # 원본·대상 블록 수 관계
  copy_outcome: [silently_failed, succeeded, block_count_mismatch, clean]  # 루트 파일 복사 결과
  destination: [free, missing, stale_file]                          # 사본이 놓일 자리의 상태
  link_state: [usable]                                              # public/storage 링크 가용 판정
  link_kind: [symlink]                                              # 링크의 형태
  link_position: [leaf]                                             # 경로 안 링크의 위치
  consumer: [storage_driver, public_disk_url, server_sse, attachment]  # 대체 서빙 URL 의 소비처
  url_form: [path_segment]                                          # 서빙 라우트 URL 형태
  target: [regular_file, inside_root]                               # 서빙 대상의 종류
  method: [get_only]                                                # 허용 메서드
  path_shape: [null_byte]                                           # 거부해야 하는 경로 형태
  segment_position: [leaf, intermediate]                            # 숨김/오염 세그먼트의 위치
  public_disk_root: [non_local]                                     # public 디스크 root 신뢰 판정
  observability: [warn_once]                                        # 폴백 경고 채널
  residue: [none, present]                                          # 문서 루트 안 잔존물 유무
  entry_kind: [directory]                                           # 잔존물의 형태
  move_outcome: [skipped, all_moved]                                # 잔존물 이동 결과
  upgrade_step: [move_broken_backups]                               # 백필 업그레이드 스텝
  run: [second]                                                     # 멱등성(2회차 실행)
  encoding: [gzip]                                                  # 압축 응답 축
  range_advertised: [bytes]                                         # Accept-Ranges 광고
  target_file: [env_example]                                        # 노출 프로브 대상 파일
  file_presence: [present]                                          # 프로브 대상 실재 여부
  secret_channel: [env_real_absent]                                 # 비밀 무유출 (R3)
  symlink_probe: [supported]                                        # sentinel 심볼릭 링크 지원 여부
  entry_context: [api_script]                                       # 기준 URL 도출 진입 지점
  rate_limit: [client_identity]                                     # 프로브 상한의 신원 축
  deployment: [reverse_proxy_shared_ip]                             # 공유 IP 프록시 배치
  probe_outcome: [exposed]                                          # 클라이언트 프로브 결과
  judgement: [exposed]                                              # 종합 판정
  gate_state: [pending]                                             # Step 2 게이트 상태
  server_pass: [true]                                               # 서버측 판정 통과 여부
  asset_serving: [template]                                         # 확장 자산 서빙 통로
  defense_layer: [second_containment]                               # 2차 봉쇄 계층
  mime_table: [sourcemap]                                           # MIME 표 공유 축
  baseline_source: [request_rule, service]                          # 1차 봉쇄 기준선의 출처
  extension_type: [template, module, plugin]                        # 세 확장 통로
  derivation: [sensitive_dirs, release_payload, extensions+bare_names, regex_engine]  # 서버 조각 목록의 도출 근거
  surface: [request_filtering, seo_bot]                             # 대조 표면
  direction: [forward, reverse]                                     # 목록 대조 방향
  granularity: [axis]                                               # 미실측 선언의 입도
  disk_url: [default]                                               # public 디스크 url 설정 상태
  hook: [unregistered]                                              # 아바타 URL 훅 등록 상태
  url_mode: [path]                                                  # 자산 URL 이중 모드의 형태
  identifier_shape: [valid]                                         # 확장 식별자 형태
  tab: [general]                                                    # 관리자 설정 화면 탭 (E2E)
  permitted: [yes]                                                  # 화면 진입 권한 (E2E)
  page: [error_view]                                                # 마운트 접두사를 실어야 하는 화면
  mount: [subfolder]                                                # SEO 이미지의 마운트 배치

# cross product 가 크므로 pairwise 로 잰다 — 축을 줄이면 위 회귀 불변식 중 하나가
# 모집단에서 빠진다(축 자체가 결함이 났던 자리다).
coverage_strategy: pairwise

