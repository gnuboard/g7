feature: 컴포넌트 렌더 조건(evaluateRenderCondition)

description: |
  컴포넌트의 렌더 여부는 RenderHelpers.evaluateRenderCondition 이 정한다. 기존 if 속성(하위 호환)이 있으면 그것이
  우선하고, 없으면 conditions(문자열, AND, OR, 중첩, if/else 체인)를 평가하며, 둘 다 없으면 렌더한다. 표현식은
  옵셔널 체이닝, 논리, 삼항, nullish, 함수 호출을 받는다. 이 매니페스트는 그 단위 시험 파일
  (DynamicRenderer.conditions.test.tsx)을 소유한다(표식 소급, 설계 확정 2026-11-09).

axes:
  area: [if_legacy, string, and_group, or_group, nested, branch_chain, if_precedence, expression_compat, usage_scenario]

effects:
  - render_condition_if_legacy
  - render_condition_conditions_evaluated
  - render_condition_if_takes_precedence
  - render_condition_expression_compat

test_files:
  - resources/js/core/__tests__/DynamicRenderer.conditions.test.tsx
