# audit:allow test-scenario-coverage reason: |
#   cross product 자동 전개는 audit 실행 환경의 fallback YAML 파서가 nested axes 를 읽지 못해
#   검출되지 않는다(다른 시나리오와 동일 한계). 본 변경은 백엔드 검증 규칙 + 관리자 설정 화면이며
#   PHPUnit Feature 테스트와 Vitest 레이아웃 테스트가 축 조합을 커버하고 green 이다.

feature: 비밀번호 정책 설정 강제 (C4)

description: |
  관리자 보안 설정의 비밀번호 정책이 비밀번호를 받는 모든 경로에서 동일하게 적용되도록 한다.

  배경:
    - `security.password_min_length` · `security.password_require_special` 설정이 화면에는
      있었지만 어떤 검증 규칙도 읽지 않는 고아 설정이었다.
    - 비밀번호 길이 제한은 `LoginRequest` 에만 `min:6` 으로 하드코딩되어 있었다. 로그인은
      기존 비밀번호를 대조하는 자리라 정책을 걸 자리가 아니고(정책 강화 시 기존 사용자가
      로그인 불가), 정작 비밀번호를 **정하는** 경로에는 정책이 없었다.

  적용 지점:
    - 비밀번호를 새로 정하는 6개 경로가 `PasswordPolicy::rule()` 하나를 공유한다
      (회원가입 · 비밀번호 재설정 · 비밀번호 변경 · 관리자 회원 생성 · 관리자 회원 수정 · 프로필 수정).
    - 로그인은 길이 규칙을 갖지 않는다.

axes:
  entry_point:
    - register
    - reset_password
    - change_password
    - admin_create_user
    - admin_update_user
    - update_profile
  min_length_setting: [default, raised, lowered]
  special_char_setting: [required, not_required]
  input_state: [satisfies_policy, violates_length, violates_special]

exclusions:
  - { special_char_setting: not_required, input_state: violates_special, reason: "특수문자 미요구 설정에서는 위반 상태가 성립하지 않음" }

effects:
  - policy_rule_reads_min_length_from_settings
  - policy_rule_reads_special_requirement_from_settings
  - password_shorter_than_setting_is_rejected
  - password_meeting_setting_is_accepted
  - special_char_requirement_is_enforced_when_enabled
  - login_request_has_no_length_rule
  - all_password_setting_paths_share_one_rule
  - empty_security_settings_fall_back_to_defaults
  - saved_security_settings_are_visible_on_reload
  - admin_screen_min_length_bounds_follow_settings_limits

test_files:
  - tests/Feature/Auth/PasswordPolicyTest.php
  - tests/Feature/Settings/SettingsBoundaryContractTest.php
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-security-password-policy.test.ts

rules_layer_coverage:
  - rule: formrequest-numeric-boundary-drift
    coverage: 최소 길이 경계는 config('core.settings_limits.security_password_min_length_*') 단일 출처
  - rule: layout-input-boundary-hardcoded
    coverage: 보안 탭 입력 min/max 는 `_meta.limits` 바인딩 (리터럴 없음)
  - rule: i18n-throw-hardcoded-korean
    coverage: 정책 위반 메시지는 lang/{ko,en}/validation.php 의 password 키
