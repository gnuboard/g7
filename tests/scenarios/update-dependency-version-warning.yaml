feature: update_dependency_version_warning

description: |
  확장 갱신 경로의 의존 버전 검사 (7.1.0 출시 점검 Q-6 결정 — 경고·보고, 거부하지 않음).
  의존성 검사는 설치 때만 돌아 이커머스 1.2.1 위에 1.3.0 을 요구하는 결제 플러그인을 올려도 아무 말이 없었다.
  모듈·플러그인·템플릿 갱신은 성공 뒤 새 판 manifest 의 dependencies 를 설치 상태와 대조해, 없거나 꺼져 있거나 버전이
  모자란 의존을 결과 `dependency_warnings` 와 완료 문구로 알린다(명령행·번들 일괄 업데이트도 출력). 번들 일괄
  업데이트는 종류 순서(모듈 → 플러그인 → 템플릿 → 언어팩)에 더해 같은 종류 안에서도 의존 대상을 먼저 갱신한다.

coverage_strategy: full

axes:
  dependency_state: [version_unmet, not_installed_or_inactive, unreadable_manifest, bundled_order]
  extension_type: [module, plugin, template, all]

exclusions:
  - { dependency_state: bundled_order, extension_type: template, reason: "템플릿은 템플릿에 의존하지 않는다 — 같은 종류 정렬 대상 아님" }
  - { dependency_state: bundled_order, extension_type: plugin, reason: "모듈·플러그인 정렬은 같은 헬퍼(orderByDependencies) 한 벌 — 모듈 대표" }
  - { dependency_state: bundled_order, extension_type: all, reason: "종류별 정렬이라 all 조합은 형식적" }
  - { dependency_state: unreadable_manifest, extension_type: plugin, reason: "manifest 읽기는 종류 무관 단일 경로(forManifestFile)" }
  - { dependency_state: unreadable_manifest, extension_type: template, reason: "동일" }
  - { dependency_state: unreadable_manifest, extension_type: all, reason: "동일" }
  - { dependency_state: not_installed_or_inactive, extension_type: module, reason: "판정은 의존 대상의 종류(modules/plugins)로 갈리고 갱신 주체 종류와 무관 — 템플릿 대표" }
  - { dependency_state: not_installed_or_inactive, extension_type: plugin, reason: "동일" }
  - { dependency_state: not_installed_or_inactive, extension_type: all, reason: "동일" }

effects:
  - unmet_dependency_version_is_reported_as_warning
  - missing_or_inactive_dependency_is_reported
  - satisfied_dependency_yields_no_warning
  - unreadable_manifest_yields_no_warning
  - update_message_carries_dependency_warning
  - update_result_includes_dependency_warnings
  - bundled_update_orders_dependencies_first_within_type

test_files:
  - tests/Feature/Extension/UpdateDependencyVersionWarningTest.php
