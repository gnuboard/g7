# π3 레이아웃 편집기 시험 표식 부채 채우기 — 이 매니페스트는 아래 test_files 의 각 시험이 재는 효과를
# 시험 단위로 선언한다. 축 layer 은 시험 대상 단위이다.

feature: 레이아웃 편집기 크기 조절 핸들 — 축 게이팅, 델타 반영, 옵션 스냅, 캔버스와 속성 컨트롤 양방향 동기

description: |
  useResizeHandles 훅의 드래그 계산과 그 결과가 캔버스 렌더 및 width 컨트롤 역해석과 맞는지 잰다.

axes:
  layer: [hook, canvas_render]

effects:
  - resize_zero_delta_skips_resize_end
  - resize_pointerup_fires_resize_end_once
  - resize_explicit_style_width_wins_over_measure
  - resize_starts_from_measured_size_when_no_style
  - resize_e_handle_patches_style_width_px
  - resize_undeclared_axis_handle_ignored
  - resize_clamps_to_min_max
  - resize_select_control_snaps_to_nearest_option
  - resize_s_handle_changes_height_only
  - resize_e_handle_grows_width_by_delta_over_scale
  - resize_axes_follow_declared_width_height_controls
  - resize_undeclared_axis_leaves_render_unchanged
  - resize_width_control_reads_canvas_size
  - resize_width_control_reads_back_resized_value
  - resize_canvas_renders_new_width

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/hooks/useResizeHandles.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/layouts/resize-handle-canvas.test.tsx
