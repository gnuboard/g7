feature: 코어가 만드는 날짜·시각 문자열의 시간대 (#160)

description: |
  DB·app.timezone 은 UTC 다. 코어가 시간대 변환 없이 문자열로 만들던 곳을 고친다.
  - 화면 값(확장 업데이트 모달 「수정된 레이아웃」 시각, 회원 목록 1주/1달 기본 기간, SEO 날짜 파이프의 오프셋 입력,
    고급 탭 GeoIP 최근 갱신)은 보는 사람 시간대.
  - 탈퇴 접미사(_탈퇴_YYYYMMDD·_deleted_YYYYMMDD)는 사이트 날짜.
  - 사이트맵 lastmod 는 오프셋을 반영해 UTC 로 저장한다.

axes:
  surface: [modified_layout_updated_at, user_list_default_range, withdraw_suffix, sitemap_lastmod, seo_date_pipe, geoip_last_updated]

effects:
  - core_screen_times_use_viewer_timezone
  - withdraw_suffix_uses_site_date
  - sitemap_lastmod_stored_in_utc

test_files:
  - tests/Feature/Timezone/CoreDisplayTimezoneTest.php
