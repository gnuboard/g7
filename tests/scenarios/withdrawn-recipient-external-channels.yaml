feature: 탈퇴 회원 수신 — 없는 주소로 보내지 않고, 안 보낸 것을 남긴다

description: |
  탈퇴 처리는 이름·이메일·닉네임을 익명화한다(`…@example.test_deleted_20260921_1733`).
  그 주소는 **더 이상 존재하지 않는 우편함**이다. 그런데도 mail·sms·alimtalk 발송을 시도하면
  운영에서는 매번 바운스가 나고, 발송 평판이 깎이며, 이력에는 실패만 쌓인다.

  조용히 깨지는 지점은 **발송 실패가 환경에 가려지는 것**이다. #599 세션A 실측(2026-09-22)에서
  탈퇴한 회원의 `refund_approved` 4행이 익명화된 주소로 생성됐는데, 그 환경은 SMTP 가 없어
  `skipped` 로 남아 정상처럼 보였다. SMTP 가 붙은 운영에서는 그대로 나간다.

  이 저장소의 규율은 「보내지 않는다」가 아니라 **「보내지 않았음을 남긴다」**이다 —
  수신자 0명도 `logNoRecipient` 로 `skipped` 를 남겨 운영자가 "왜 안 왔지" 를 이력에서
  답하게 한다. 탈퇴 제외도 같은 규율을 따라 사유와 함께 `skipped` 로 남긴다.

  갈라지는 두 자리가 있다.

  ① **채널** — `database`(알림함)는 막지 않는다. 바깥으로 나가지 않고, 관리자가 탈퇴 회원의
     이력을 화면에서 보는 근거가 된다. 막으면 탈퇴 전후 이력이 끊긴다.

  ② **수신자 종류** — 회원이 아닌 수신자(비회원 주문 알림의 임시 notifiable)는 탈퇴 개념이
     없다. 여기까지 걸면 비회원 알림이 통째로 사라진다.

# axis 의미: 갈라지는 자리는 «수신자가 탈퇴했는가 × 채널이 바깥으로 나가는가» 인데,
# 두 축을 따로 세우면 «비회원 × 알림함» 처럼 계약이 애초에 갈리지 않는 칸을 채우라고 요구한다.
# 실제로 다르게 행동해야 하는 **네 경우**만 값으로 세운다. 네 칸이 서로를 지킨다 —
# withdrawn_external 만 보면 알림함까지 막는 과잉 수정이 통과하고, withdrawn_database 만 보면
# 원래 결함이 남으며, active_external 이 없으면 멀쩡한 회원의 알림이 조용히 사라진다.
axes:
  case: [withdrawn_external, withdrawn_database, active_external, non_member]

effects:
  - withdrawn_member_skips_external_channels    # 탈퇴 회원에게 mail·sms·alimtalk 를 보내지 않는다
  - withdrawn_member_keeps_database_channel     # 알림함은 그대로 남는다
  - active_member_is_never_skipped              # 활성 회원의 발송을 막지 않는다
  - non_member_recipient_is_out_of_scope        # 비회원 수신자는 판정 대상이 아니다
  - skipped_send_records_its_reason             # 안 보낸 것을 사유와 함께 이력에 남긴다

test_files:
  - tests/Feature/Notifications/WithdrawnUserExternalChannelTest.php

validation:
  audit_rule: backend-change-requires-test
  browser_check: |
    #599 세션A 실측(2026-09-22 · 탈퇴 회원 1733 의 RF20260922-0520290397 승인 전이).
    수정 전: mail/sms/alimtalk 이 익명화된 주소로 발송 대상이 됨(SMTP 부재로 가려짐).
    수정 후: mail·sms·alimtalk = skipped(사유 「탈퇴한 회원이라 바깥 채널…」) · database = sent.
  note: |
    판정은 `NotificationWithdrawnRecipientPolicy::blocksChannel()` 한 자리에 모았고, 리스너의
    `shouldSkipWithdrawnRecipient()` 는 그것에 위임한다(삭제 회원의 게스트 폴백 금지와 같은 정책 객체 —
    validate-p4-core.yaml).
    `User::isWithdrawn()`(withdrawn_at + status)이 정본이며, 리스너가 그 판정을 다시 쓰지 않는다.
    사유 문구는 `notification.skipped.withdrawn_recipient` (ko·en).
