feature: csp_header_setting

description: |
  코어 CSP 헤더 설정 (#158 스크립트 정책, #163 스타일 정책) — 관리자 환경설정 > 보안 > 「콘텐츠 보안 정책」.

  핵심 동작(스크립트 정책):
    - 모드 끔(기본)·점검만(Content-Security-Policy-Report-Only)·강제(Content-Security-Policy)
    - 지시어: script-src 'self' <자동 합산 + 운영자 추가> · worker-src 'self' blob: ·
      object-src 'none' · base-uri 'self' · report-uri /api/csp-report
    - 자동 합산 = 활성 확장 trusted_script_hosts(+필터 훅) ∪ 활성 템플릿 externals 외부 script 호스트
    - web 그룹 HTML 응답에만 붙고 /dev·봇 SEO 응답·자체 CSP 응답·비 HTML 은 제외
    - .env G7_CSP_MODE(config core.csp.mode_override)가 저장값보다 우선(탈출구)
    - 위반 보고는 204(형식 오류도 기록만 생략)·16KB 초과 413·분당 60, 로그 채널 csp 에 쿼리 없이 기록

  핵심 동작(스타일 정책 — 스크립트 정책과 따로 켜고 끈다):
    - 설정 키 3종: security.csp_style_mode(끔·점검만·강제, 기본 끔) · csp_style_level(basic·strict, 기본 basic) ·
      csp_extra_style_hosts(운영자 추가 호스트)
    - 강도 basic = `style-src-elem 'self' <호스트>` — `<style>` 요소와 허용 밖 CSS 파일만 막는다(style 속성은 허용)
    - 강도 strict = `style-src 'self' <호스트>; style-src-attr 'none'` — style 속성까지 막는다
    - 잘못된 강도 값은 basic 으로 읽는다
    - 호스트 = 'self' + 활성 템플릿 externals 의 외부 스타일시트 호스트(style·webfont·preload as=style, 자동) + 운영자 추가
    - 모드는 스크립트 정책과 독립이다. 두 모드가 같으면 헤더 1개(스크립트 지시어 → 스타일 지시어 → report-uri),
      다르면 강제용·점검용 헤더를 함께 낸다(헤더마다 report-uri). 스크립트만 켠 헤더 문자열은 종전과 같다
    - .env G7_CSP_STYLE_MODE(config core.csp.style_mode_override)가 저장값보다 우선하고, G7_CSP_MODE 와 서로 영향을 주지 않는다
    - 응답 메타(_meta.csp)에 style_override · style_preview · style_auto_hosts 가 실린다
    - 스타일 위반(style-src-elem · style-src-attr)도 같은 수신 주소·로그 채널에 기록된다

axes:
  case:
    - source_extension_declared
    - source_none
    - mode_off
    - mode_enforce
    - format_report_uri
    - format_reporting_api
    - format_malformed
    - format_oversized
    - input_valid_host
    - input_invalid_host
    # 스타일 정책 (#163)
    - style_level_basic               # 강도 기본 — style-src-elem
    - style_level_strict              # 강도 엄격 — style-src + style-src-attr 'none'
    - style_source_template_externals # 활성 템플릿 externals 의 외부 스타일시트 호스트 자동 합산
    - style_source_extension_declared # 켜진 모듈·플러그인의 trusted_style_hosts 선언 + 필터 훅 자동 합산
    - style_mode_override             # .env G7_CSP_STYLE_MODE 탈출구(스크립트 탈출구와 독립)
    - style_header_combination        # 스크립트 모드 × 스타일 모드 → 나가는 헤더 조합
    - style_settings_screen           # 환경설정 > 보안 카드의 스타일 정책 블록(관리자 템플릿 레이아웃)

effects:
  - csp_hosts_merged_deduped_sorted
  - csp_policy_fixed_directives
  - csp_invalid_hosts_dropped
  - csp_inactive_extension_hosts_excluded
  - csp_mode_override_precedence
  - csp_header_name_follows_mode
  - csp_header_skipped_for_excluded_responses
  - csp_report_logged_without_query
  - csp_report_malformed_returns_204_without_log
  - csp_report_oversized_returns_413
  - csp_report_throttled
  - csp_host_rule_accepts_host_sources
  - csp_host_rule_rejects_injection
  - csp_settings_persisted_normalized
  - csp_settings_rejects_invalid_input
  - csp_meta_reflects_saved_policy
  # 스타일 정책 (#163) — 정책 문자열·헤더
  - csp_style_directives_follow_level        # 강도별 지시어가 정확히 일치한다
  - csp_style_hosts_merged_deduped_sorted    # 'self' + 자동 + 추가 호스트를 합쳐 중복 제거·정렬한다
  - csp_style_extension_declared_hosts_included   # 켜진 확장이 선언한 스타일 호스트가 스타일 정책에 들어가고 script-src 에는 섞이지 않는다
  - csp_style_inactive_extension_hosts_excluded   # 꺼진 확장의 스타일 선언은 빠진다
  - csp_style_invalid_hosts_dropped          # 형식이 어긋난 호스트는 정책에 넣지 않는다
  - csp_style_level_fallback_basic           # 잘못된 강도 값은 basic
  - csp_style_mode_override_independent      # G7_CSP_STYLE_MODE 가 저장값보다 우선하고 G7_CSP_MODE 와 독립이다
  - csp_headers_combined_by_mode             # 두 모드 조합에 따라 헤더 0·1·2개, 헤더마다 report-uri
  - csp_script_policy_unchanged              # 스크립트 정책 문자열(build())은 종전과 같다
  - template_external_style_hosts_collected  # externals 에서 외부 스타일시트 호스트만 모은다
  # 스타일 정책 (#163) — 설정 저장·응답 메타·위반 보고
  - csp_style_settings_persisted_normalized  # 3키 저장 + 호스트 정규화
  - csp_style_settings_rejects_invalid_input # 잘못된 모드·강도·호스트는 422
  - csp_style_meta_reflects_saved_policy     # _meta.csp 의 style_* 3키가 저장값을 따른다
  - csp_style_settings_default_when_absent   # 새 키 없이 저장해도 기본값(끔·basic·빈 목록)
  - csp_style_report_logged                  # style-src-elem · style-src-attr 위반 보고가 기록된다
  # 스타일 정책 (#163) — 설정 화면
  - csp_style_block_structure                        # 미리보기 뒤에 소제목 + 필드 5개, 설정 키 바인딩
  - csp_style_block_renders_saved_policy             # 자동 호스트·미리보기·빈 상태 문구
  - csp_style_level_warning_follows_effective_mode   # 강도별 경고는 실제 적용 모드(.env 포함)를 본다
  - csp_style_enforce_warning_shown                  # 강제를 고르면 점검 먼저 경고
  - csp_style_mode_locked_by_env_override            # style_override 가 있으면 모드 잠금 + 잠금 문구(스크립트 잠금과 무관)
  - csp_style_fields_locked_when_readonly            # 읽기 전용이면 세 입력 모두 잠금
  - csp_style_host_errors_shown_per_field            # 추가 스타일 호스트의 검증 오류를 그 입력 아래에만
  - csp_style_keys_sent_on_save                      # 저장 요청 본문에 새 3키가 함께 나간다
  - csp_style_lang_keys_complete                     # 스타일 키 ko·en 동수, 조각이 참조하는 키 정의, 자리표시자 없음

test_files:
  - tests/Unit/Support/Csp/CspPolicyBuilderTest.php
  - tests/Unit/Support/TemplateExternalsStyleHostsTest.php
  - tests/Feature/Http/ContentSecurityPolicyMiddlewareTest.php
  - tests/Feature/Api/Public/CspReportControllerTest.php
  - tests/Feature/Settings/SaveSettingsCspTest.php
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-security-csp-style.test.tsx

notes: |
  비활성 확장의 호스트가 빠지는 것은 TrustedScriptHosts 가 활성 목록만 읽는 데서 오며
  CspPolicyBuilderTest 가 활성·전체 목록을 함께 내주는 모의로 잠근다(csp_inactive_extension_hosts_excluded).
  스크립트 정책 카드의 표시·저장·잠금 상태는 브라우저 실측(#158 이력 문서 §8 T2~T6)이 덮는다.

  스타일 정책(#163):
    - 헤더 조합(끔·점검만·강제 3×3)은 CspPolicyBuilderTest 의 데이터 프로바이더가 전수로,
      미들웨어 테스트가 실제 응답 헤더로 잠근다(style_header_combination).
    - 스타일 호스트를 확장이 선언하는 키는 두지 않는다(번들 확장의 외부 CSS 사용 0건) — 자동 합산은 활성 템플릿 externals 뿐이다.
    - 설정 화면 블록은 관리자 템플릿의 레이아웃 테스트(style_settings_screen)가 실제 조각 JSON 을 렌더해 잠근다.
      강도별 「깨지는 화면」 경고 문구는 브라우저 실측 결과로 채우며, 자리표시자가 남으면 csp_style_lang_keys_complete 테스트가 실패한다.
    - 정책을 건 화면이 실제로 위반 없이 그려지는지는 tests/scenarios/strict-style-csp-compat.yaml 이 소유한다.
