# 레이아웃 편집기 셸, 접근 오류 패널, 캔버스 오버레이 시험 표식
# tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_shell_canvas_pi1

description: |
  편집기 셸(LayoutEditorChrome)의 마운트 구성과 CSS 격리, 최소 너비, 템플릿 메타 인증 fetch,
  접근 오류 패널의 상태 코드별 분기와 401 자동 이동, 캔버스 오버레이의 이력 baseline 과 컴포넌트 영역 pick 수신을 잰다.

axes:
  subject: [access_error_panel, editor_canvas_overlay_history, editor_canvas_overlay_pick, layout_editor_chrome]

effects:
  - access_error_401_shows_title_and_login_button
  - access_error_403_shows_permission_chip_and_home
  - access_error_404_retry_and_home_without_chip
  - access_error_5xx_allows_retry
  - access_error_network_retry_and_debug_message
  - access_error_unknown_kind_fallback
  - access_redirect_401_moves_to_login_url
  - access_redirect_skipped_when_not_401
  - overlay_history_baseline_pushed_on_load
  - overlay_history_baseline_repushed_on_route_change
  - overlay_pick_request_renders_banner
  - overlay_pick_id_node_replies_picked_and_exits
  - overlay_pick_node_without_id_keeps_mode
  - overlay_pick_auto_id_node_not_selectable
  - overlay_pick_escape_replies_cancelled
  - overlay_pick_cancel_button_replies_cancelled
  - overlay_pick_legacy_node_id_fallback
  - overlay_pick_mode_hides_select_affordances
  - overlay_pick_end_restores_insertion_affordances
  - chrome_mounts_shell_toolbars_tree_and_canvas
  - chrome_shell_classes_use_g7le_prefix
  - chrome_toolbar_receives_t_via_use_translation
  - chrome_shows_template_identifier_label
  - chrome_shell_has_editor_min_width
  - chrome_toolbar_children_do_not_shrink_or_wrap
  - chrome_meta_fetch_sends_bearer_and_shows_version

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/AccessErrorPanel.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/EditorCanvasOverlay.history.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/EditorCanvasOverlay.pick.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/LayoutEditorChrome.test.tsx
