feature: 레이아웃 init 동작이 끝날 때까지 첫 화면을 그리지 않는다 — 엔진 대기 상한 되돌림 (설계 확정 2026-11-09, #869)

description: |
  엔진은 init 동작(<init>)을 첫 렌더 전에 끝까지 기다린다(종전 동작). #869 에서 init 대기에 8초 상한(INIT_ACTIONS_MAX_WAIT_MS)을
  두고 상한 뒤 그린 화면의 입력을 잠그는 방식까지 넣었으나, 늦게 끝나는 init 의 쓰기, 오류 화면, 경로 이동이 얽혀 경계 결함이 이어져
  결정 「8초 상한 되돌리기」로 되돌렸다. init 이 응답하지 않으면 백지로 남는 문제가 다시 생길 수 있음을 알고 고른 결정이다.
  사용자 템플릿 바탕 레이아웃의 장바구니 키 발급(initCartKey → POST cart/key)도 출시본처럼 키가 올 때까지 기다린다(핸들러 3초 상한도 설계 확정 2026-11-10 으로 걷음).
  축 init 은 init 동작이 끝나는 때다.

axes:
  init: [settles_after_eight_seconds, settles_quickly]

effects:
  - first_render_waits_for_init        # init 이 8초를 넘겨도 끝날 때까지 첫 화면을 그리지 않는다
  - init_runs_before_first_render      # 첫 화면은 init 이 쓴 상태로 그려진다

test_files:
  - resources/js/core/template-engine/__tests__/TemplateApp.initActionsTimeout.test.tsx

validation:
  browser_check: 사용자 화면에서 cart/key 요청을 개발자 도구로 늦춘(예 10초) 채 새로고침해, 응답이 올 때까지 첫 화면이 기다렸다가 키가 저장된 상태로 그려지는지
  note: |
    fail-first: 되돌린 8초 상한(대기 경쟁)을 다시 넣으면 settles_after_eight_seconds 가 red(8초에 init 값 없이 첫 화면). settles_quickly 는 회귀 잠금.
    장바구니 키 발급을 끝까지 기다리는 동작은 templates/_bundled/sirsoft-basic/src/handlers/__tests__/storageHandlers.test.ts 가 잠근다(상한을 다시 넣으면 red).
