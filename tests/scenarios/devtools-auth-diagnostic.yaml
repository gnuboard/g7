feature: DevTools 인증 진단 — 빈 사용자·남은 토큰을 로그인으로 오인하지 않는다

description: |
  G7DevToolsCore.getAuthDebugInfo() 는 저장된 토큰과 사용자 객체로 인증 상태를 진단한다.
  종전에는 빈 배열·빈 객체·null 사용자도 토큰만 남아 있으면 「인증됨」으로 표시했고,
  AuthManager 가 로그아웃을 판정한 뒤에도 남은 토큰이 진단을 뒤집었다.

  판정 순서:
    - AuthManager.isAuthenticated() 가 있으면 그 판정이 우선이다 — 빈 폴백 사용자로 뒤집지 않는다.
    - 없으면 유효한 사용자 객체(id 를 가진 비배열 객체)의 존재로 판정한다. 빈 값은 사용자로 세지 않는다.
    - 진단은 브라우저 컨텍스트 안에서 입력만 바꾸며 실제 인증·저장소·덤프를 바꾸지 않는다.

  probe 축의 값 하나가 spec 이 표로 도는 케이스 하나다 — 배포 번들에서 여섯 입력을 차례로
  넣고 같은 순서로 결과를 대조한다.

axes:
  probe: [empty_array_user_logged_out, empty_object_user_logged_out, null_user_logged_out, user_object_logged_out, null_user_auth_manager_authenticated, user_object_without_auth_manager]

effects:
  - empty_user_is_not_authenticated
  - auth_manager_verdict_outranks_empty_fallback_user
  - real_user_object_fallback_is_kept

test_files:
  - tests/Playwright/specs/layout-editor/devtools-auth-diagnostic.spec.ts

rules_layer_coverage:
  - rule: test-scenario-reverse-mapping
    coverage: 배포 번들의 진단기를 실제 브라우저에서 돌리는 spec 이 유일한 검증 통로 — 단위 테스트(G7DevToolsCore.test.ts)는 같은 판정을 jsdom 에서 재지만 그 파일은 다른 축(모달·상태)도 담아 여기서 소유하지 않는다
