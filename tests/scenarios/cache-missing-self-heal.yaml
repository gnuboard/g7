feature: 캐시 파일이 없을 때의 자기 복구

description: |
  `bootstrap/cache` 의 확장 오토로드·훅·설정·라우트 캐시는 명령이 만들어 두는 파일이다. 서버를 옮기거나 배포 도구가
  디렉토리를 비우면 파일이 통째로 사라지는데, 낡은 캐시를 알아채는 복구(7.1.3)는 파일이 있을 때만 돌았다.

  - 확장 오토로드: 파일이 없으면 부팅 때 다시 만든다(없으면 확장의 composer 의존성·헬퍼 파일이 빠져 500 이 난다).
  - 훅 · 설정 · 라우트: 운영 중인 사이트의 웹 요청에서만, 응답 뒤에 다시 만든다. 콘솔(일부러 지운 것과 싸우지 않게)과
    개발 환경(캐시 없이 돌리는 것이 의도)에서는 하지 않는다.
  - 공통: 끄는 스위치(`G7_CACHE_SELF_HEAL=false`), root 프로세스는 만들지 않음, 실패가 되풀이되지 않게 표식 파일로 쉼
    (확장 오토로드·훅 60초, 설정·라우트 300초).
  - 두 진입점(웹·콘솔)은 확장 오토로드 캐시의 같은 항목을 등록한다.

axes:
  case: [autoload_missing, autoload_present, autoload_regeneration_keeps_failing, autoload_root_process, autoload_switched_off, hooks_missing, hooks_not_production_web, autoload_entry_points, autoload_register_phase, config_route_missing, config_route_present, config_route_regeneration_keeps_failing, config_route_not_production_web, config_route_switched_off, config_route_rebuild_throws, config_route_switch_declared]

effects:
  - missing_autoload_cache_is_regenerated                     # 오토로드 캐시 없음 → 다시 만들고 표식 지움
  - present_autoload_cache_is_left_alone                      # 파일이 있으면 그대로
  - self_heal_backs_off_after_failed_attempt                  # 실패 뒤 간격 안에는 다시 하지 않음, 지나면 다시
  - self_heal_skipped_for_root_and_when_switched_off          # root · 스위치 끔 → 하지 않음
  - missing_hook_cache_schedules_regeneration_once            # 훅 캐시 없음 → 요청 끝 재생성 한 번 예약
  - hook_cache_self_heal_only_in_production_web               # 운영 웹 요청이 아니면 하지 않음
  - entry_points_register_same_autoload_sections              # 웹·콘솔 진입점의 등록 항목이 같음
  - missing_autoload_cache_healed_before_extension_providers  # 확장 공급자가 등록되기 전에 복구(첫 요청이 500 이 되지 않게)
  - missing_config_and_route_caches_rebuilt_after_response    # 설정·라우트 캐시 없음 → 응답 뒤 각각 한 번
  - present_config_or_route_cache_is_left_alone               # 있는 캐시는 그대로
  - config_route_self_heal_only_in_production_web             # 콘솔·개발·디버그·설치 전 → 하지 않음
  - rebuild_failure_does_not_break_request                    # 재생성 실패가 요청을 깨뜨리지 않음
  - self_heal_switch_is_declared                              # 설정 키·.env 예시에 스위치(기본 켬)

test_files:
  - tests/Unit/Extension/AutoloadMissingSelfHealTest.php
  - tests/Unit/Support/ConfigRouteCacheSelfHealTest.php
