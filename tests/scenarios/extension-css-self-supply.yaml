feature: 확장 CSS 자기 공급 — 층 평탄화·덮기 파일·다크 중립 표식·접두 클래스 (#816 S2)

description: |
  확장 화면이 템플릿 CSS 라이브러리에 기대지 않고 자기 CSS 로 보이도록 하는 코어 계약을 잠근다.
  서빙 시 층 평탄화(g7-extension·properties 만 남김), 템플릿 확장 CSS 덮기 파일의 호환 판정과 로드 순서,
  template.json features.color_scheme 선언 검증과 <html data-g7-color-scheme> 표식(편집기 프리뷰 프레임 포함),
  확장 접두 빌드 클래스(ecommerce:px-2)의 앞글자 해석, 번들 manifest 의 CSS 자산·namespace 선언.
  시험 하나가 시나리오 하나다 — case 값은 파일 접두어 + 시험 순번이다(이미 다른 매니페스트 표기를 단 시험은 그대로 둔다).

