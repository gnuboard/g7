effects:
  - extension_css_layers_flattened_keeping_named_layers   # 남길 층(g7-extension 등)만 래퍼째 두고 나머지 층 래퍼·순서 선언을 걷는다(주석 속 @layer 무시)
  - template_css_override_resolved_by_compatibility   # 대상 활성·버전 호환만 포함, 비호환 제외, 중복 target 오류
  - color_scheme_declaration_validated   # features.color_scheme 세 전략 선언 검증·정규화
  - html_color_scheme_marker_follows_template   # <html data-g7-color-scheme> 이 템플릿 다크 방식을 따라 갱신
  - preview_frame_carries_preview_scheme_marker   # 편집기 프리뷰 프레임이 프리뷰 테마를 같은 표식으로 단다
  - css_overrides_loaded_after_bundles_before_custom   # 덮기 파일을 확장 번들 CSS 뒤·운영자 추가 자산 앞에 붙임
  - extension_class_prefix_read_as_template_class   # 확장 앞글자를 떼고 Tailwind 이름으로 해석(md:·hover: 는 변형)
  - bundled_manifest_css_assets_declared   # 번들 확장 manifest 의 자산 선언이 실제 파일을 가리키고 CSS 확장은 고유 namespace 선언
  - extension_bundle_service_contract   # 번들 병합 서비스의 기타 계약(이미 표기한 시험 제외)
  - seo_render_loads_extension_css_in_user_order   # SEO 렌더: 라이트 표식·템플릿 CSS 뒤 층 선언·모듈→플러그인→호환 덮기 파일
  # ExtensionBundleServiceTest 가 이미 표기하던 효과 — 어느 소유 매니페스트에도 선언이 없던 것을 여기서 선언한다
  - extension_css_bundle_flattens_layers_for_namespaced_extensions   # namespace 를 선언한 확장 CSS 는 병합 시 층 평탄화
  - extension_css_bundle_keeps_layers_for_undeclared_extensions      # namespace 미선언 확장 CSS 는 층을 그대로 둔다
  - clear_bundles_preserves_current_version                          # 번들 비우기가 현재 판 파일은 남긴다
  - cleanup_removes_stale_atomic_write_temp_files                    # 원자적 쓰기 임시 파일 잔재를 정리한다

