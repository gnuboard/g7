feature: 권한 안내 무쉘 판본 (무CLI 환경 지원 축 B / P4·G4)

description: |
  권한이 부족할 때 인스톨러가 내는 안내를 **두 벌**로 만든다 — FTP 클라이언트 조작 절차와
  쉘 명령. 이 화면을 보는 사람의 다수는 SSH 를 쓸 수 없어, 종전의 쉘 명령 한 벌짜리 안내는
  그들에게 실행할 수 없는 지시만 남겼다. 그래서 FTP 판본이 기본이고 기본 펼침이며, 명령어는
  접힌 보조 판본이다.

  안내를 내기 **전에** PHP `chmod()` 로 직접 권한 부여를 시도한다 — 성공하면 안내 화면
  자체가 나오지 않는다. 적용 범위는 좁게 잡는다: 이미 쓸 수 있는 대상은 건드리지 않고
  (운영자가 의도해서 조인 권한을 되돌리지 않는다), 비트를 낮추지 않으며, 실패는 무해하다.

  무쉘 판본에는 **소유자 변경 안내를 넣지 않는다** — FTP 전용 계정에는 소유자·그룹을 바꿀
  수단이 자체가 없어 실행할 수 없는 지시이기 때문이다. FTP 판본은 퍼미션 값 안내로 한정한다.

  이것은 「소유자 변경 안내가 어디에도 없다」는 뜻이 아니다. 소유자 변경 안내는 **소유자 ≠
  웹 서버** 인 구성(전통적 Apache — 소유자=배포 계정, 웹서버=www-data)을 담당하는 별도
  갈래에 존치한다. 그 구성은 `chmod` 만으로는 원리상 고칠 수 없고, SSH 를 쓸 수 있는
  운영자에게는 그것이 정당한 해결책이다. 규칙은 환경별로 갈린다:

    · 표준 안내 경로(공유 호스팅 — 소유자 = FTP 계정)에는 `chown`·`chgrp` 를 두지 않는다.
      그 계정에는 `chmod` 단일 명령어로 충분하고, 소유자 변경은 실행 권한이 없어 실패한다.
    · 소유자 불일치 갈래는 권장(chgrp — 소유자는 배포 계정으로 남는다) → 대안(chown) →
      최후(디렉토리 777 · 파일 666) 순서를 유지한다. 셋은 안전도가 다르므로 순서 자체가
      안내의 일부다.

  Q7 — 표준 값(755)으로 부족한 서버 구성이 실재하는가:
    실재한다. 판정은 관측이 아니라 권한 모델 자체에서 나온다. 0755 의 others 비트는 `r-x`
    이므로 웹 서버가 파일 소유자와 다른 계정으로 돌고 공유 그룹도 없으면 쓰기가 없다.
    FTP 전용 계정에는 소유자·그룹을 바꿀 수단이 없으므로 남는 선택지는 others 에 쓰기를
    주는 값(디렉토리 707 · 파일 606)뿐이다. 그래서 **그 구성에서만** 보조 값을 병기한다.
    검증 환경(P0)은 Windows Apache 라 POSIX 권한 비트를 실행으로 재현할 수 없어, 이 축은
    권한 모델 판정 함수로 고정한다.

axes:
  target: [directory, file]           # 안내 대상 (디렉토리 755 · 파일 644)
  os: [linux, windows]                # OS 분기를 판본이 늘어도 유지한다
  ownership: [matched, mismatched]    # 소유자와 웹 서버 계정이 같은가 (Q7 보조 값 분기)

# 직접 권한 부여의 네 갈래(`chmod` 성공 · 이미 쓰기 가능 · 대상 부재 · `chmod` 차단)는 위
# 축의 조합이 아니라 **환경 상태**라 effects 로만 잰다. `chmod` 차단은 PHP_INI_SYSTEM 이라
# 하위 프로세스로만 만들 수 있고, 성공 갈래는 POSIX 권한 비트가 실효인 환경을 요구한다.

effects:
  # FTP 판본 (무쉘)
  - permission_guidance_ftp_steps_present_standard_value
  - permission_guidance_ftp_steps_target_file_permission_value
  - permission_guidance_keeps_windows_branch
  - permission_guidance_adds_fallback_value_on_ownership_mismatch
  - permission_guidance_shell_free_version_omits_ownership_change
  # 환경별 규칙 — 「어디에도 없다」가 아니라 「표준 경로에는 없고 불일치 갈래에는 있다」
  - permission_guidance_ownership_change_confined_to_mismatch_branch
  - permission_guidance_ownership_options_keep_safety_order
  # Q7 판정 근거
  - permission_value_write_grant_follows_posix_model
  # 직접 권한 부여 (안내보다 먼저) — 네 갈래를 모두 태운다
  - permission_repair_leaves_writable_targets_untouched
  - permission_repair_skips_missing_paths
  - permission_repair_runs_before_the_check_on_both_surfaces
  - permission_repair_grants_write_when_chmod_works
  - permission_repair_survives_blocked_chmod
  # 배선 — 헬퍼만 있고 부르는 곳이 없으면 화면은 종전과 똑같다
  - permission_guidance_renders_both_versions_on_every_surface
  - permission_guidance_server_steps_reach_the_screen

test_files:
  - tests/Unit/Installer/PermissionGuidanceShellFreeTest.php

# 브라우저 실측(§9 S12)이 담당하는 축 — 여기서 선언하지 않는 이유
#
# 두 판본이 라이트/다크에서 성립하는지, 아코디언 기본 펼침이 실제로 그렇게 보이는지,
# 권한을 실제로 바꾼 뒤 [다시 검사] 가 통과로 전환되는지는 하네스가 만들 수 없다.
# 그 축은 격리된 검증 환경에서 사람이 직접 수행하고 결과를 별도 보고서에 기록한다.
