feature: cache_invalidatable_trait

description: |
  CacheInvalidatable 트레이트를 쓰는 모델의 캐시 무효화 동작을 고정한다.
  무효화는 드라이버의 flushTags() 로 지정한 태그 키만 지우고 다른 태그 키는 남긴다.
  모델이 캐시 드라이버를 주지 않거나(null) 무효화 태그가 비어 있으면 무효화를 건너뛰며 예외를 던지지 않는다.

axes:
  case:
    - tag_flush     # 태그 단위 무효화
    - null_driver   # getCacheDriver() 가 null
    - empty_tags    # getCacheInvalidationTags() 가 빈 배열

exclusions:
  - { case: tag_flush, reason: "제외 없음 — 사례 단일 축" }

effects:
  - tag_flush_removes_only_target_tag     # 지정 태그(products) 키는 지워지고 다른 태그(config) 키는 남는다
  - invalidation_skipped_without_exception # 드라이버가 없거나 태그가 비면 예외 없이 건너뛴다

test_files:
  - tests/Unit/Cache/CacheInvalidatableTest.php
