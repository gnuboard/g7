manual_verification: |
  빈 사본에서 /install/ → Step 4 「선택 가능한 모든 항목 선택」 → SSE·폴링 각각 설치 → 100% 완료, PHP 오류 로그에
  「Maximum execution time」 새 줄 없음, 설치 로그의 「Install Worker … Started」 1회. 끊김 화면은 설치기
  includes/config.php 의 INSTALLER_TASK_TIME_LIMIT 를 잠시 20 으로 낮춰 설치 → 「설치 실패 - <작업>」 + 「설치 작업
  프로세스가 중간에 종료되었습니다…」 + 「재시도」(폴링 모드도 같은 화면). 600 으로 되돌리고 「재시도」 → 끊긴 작업부터 완료.
