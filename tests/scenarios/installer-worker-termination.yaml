# 인스톨러(설치 전 표면)는 설치 완료 사이트에 붙는 Playwright 인프라와 양립하지 않아(_guard 410) 브라우저 계층은 Chrome MCP 실측으로 대신한다.

feature: 설치 워커가 실행 시간 제한으로 죽거나 스트림이 끊겨도 설치 화면이 이어 받거나 결말(실패·중단·완료·멈춤)을 알리고, 완료 직후 .env 병합은 워커가 끝난 뒤 한다

description: |
  설치 워커(SSE install-worker.php, 폴링 install-process.php)는 모든 설치 작업을 한 요청 안에서
  차례로 돌리면서 실행 시간 제한을 진입 때 한 번(600초)만 걸었다. Windows 의 PHP 는 경과 시간으로
  재므로 확장을 모두 고른 설치가 중간 작업에서 "Maximum execution time of 600 seconds exceeded" 로 죽었다.
  그 fatal 이 상태 파일 쓰기 락 안에서 나면 shutdown 의 워커 락 해제가 같은 락을 기다리며 멈췄고,
  상태는 running 으로 남아 화면이 「설치 진행 중」에 고정됐다. SSE 모니터는 연결 수립 뒤의 끊김을
  무시해 폴링 모드에 있던 멈춤 감지도 없었다.

  고친 동작:
    - 작업을 시작할 때마다 set_time_limit() 으로 제한을 다시 건다(작업당 제한).
    - 상태 락은 재진입하고, shutdown 단계에서 끊긴 락을 풀어 교착하지 않는다.
    - 워커 shutdown 처리기가 fatal 을 감지하면 상태를 failed 로 바꾸고(완료 작업 보존, 재시도로 이어서 진행),
      SSE 모드면 error 이벤트를 보낸다. 두 진입점이 이 처리기를 정의 뒤에 등록한다.
    - SSE 모니터는 연결 수립 뒤 끊기면 EventSource 를 닫고 서버 상태로 결말을 판정한다.
      running 인 채 last_updated 가 임계 시간 동안 멈추거나 상태 조회가 계속 실패하면 멈춤으로 알린다.
    - 워커가 오류 없이 스트림을 닫은 경우(SSE 워커는 ignore_user_abort(false) 라 끊긴 연결을 다음 출력에서
      감지한 PHP 가 스크립트를 조용히 끝낸다 — 종료 이벤트 없음, 잠금은 shutdown 에서 풀림)에도
      위 판정만으로는 다시 연결하지 않아 남은 작업을 두고 실패로 끝났다. 상태 조회가 워커 잠금 유무
      (worker_active)를 알리고, 화면은 running 인데 잠금이 비었으면 새 워커로 다시 연결해 이어 받는다.
      잠금이 남아 있으면 앞 워커가 끝날 때까지 기다리고(같은 작업 동시 실행 없음), 이어 받기 연결이
      「다른 워커 진행 중」 으로 거절되면 중단 화면 없이 기다린다. 진척 없는 다시 연결은 3번까지.
    - 연결 끊김으로 끝난 SSE 워커는 shutdown 에서 그 사실을 설치 로그에 남긴다(상태는 running 유지).
    - 워커는 「설치 완료 처리」 에서 상태를 completed 로 쓴 뒤에도 설정 캐시·라우트 캐시·정적 게시를 돈다.
      완료 화면이 그 사이 부른 .env 최종 병합(finalize-env.php)이 워커의 config:cache 도중에 끼어들면 병합 전
      .env 의 DB 계정(root)이 설정 캐시에 굳어 사이트가 503 으로 열리지 않았고, 상태 파일을 잃은 워커는
      남은 작업을 건너뛰었다. 병합은 워커 잠금이 풀릴 때까지 기다리고(상한 뒤 진행), 병합 직전에 설정 캐시를
      지우고 병합 뒤 다시 만든다(실패하면 캐시 없이 둔다). 동시에 두 번 불려도 병합은 한 번.

axes:
  # 워커 프로세스 계층(tests/Unit/Installer/InstallerWorkerTimeLimitTest.php)
  #   timeout_inside_state_lock   — 상태 락을 쥔 채 실행 시간 초과(shutdown 교착 회귀)
  #   worker_fatal                — 작업 중 fatal(SSE·폴링 두 모드를 데이터 공급자로)
  #   normal_exit                 — fatal 없는 정상 종료
  #   cumulative_tasks_over_limit — 작업마다는 제한 안이지만 합계는 진입 제한을 넘는 설치
  #   worker_connection_aborted   — fatal 없이 연결 끊김으로 끝난 SSE 워커
  #   state_api_worker_presence   — 상태 조회 응답의 워커 잠금 유무
  # SSE 모니터 계층(resources/js/tests/installer/installationMonitorDisconnect.test.ts)
  #   after_connected_state_*     — 연결 수립 뒤 끊겼을 때 서버 상태별 결말
  #   after_connected_stream_closed_worker_released      — 종료 이벤트 없이 닫힘 + 잠금 풀림(running)
  #   after_connected_stream_closed_worker_still_running — 닫힘 + 앞 워커가 잠금을 아직 쥠
  #   reconnect_rejected_busy     — 이어 받기 연결이 「다른 워커 진행 중」 으로 거절
  #   reconnect_failing_repeatedly — 이어 받기 연결이 진척 없이 거듭 끊김
  #   worker_error_event_then_close — 워커가 error 이벤트를 보낸 뒤 닫음
  #   error_before_connected      — 연결 수립 전 오류(종전 동작 유지)
  # .env 최종 병합 계층(tests/Unit/Installer/InstallerFinalizeWaitsForWorkerTest.php)
  #   finalize_while_worker_builds_config_cache — 워커가 설정 캐시를 만드는 중에 병합 호출(폴링 완료 화면)
  #   finalize_worker_lock_never_released       — 잠금이 끝내 풀리지 않음(워커 강제 종료)
  #   finalize_after_worker_released            — 워커가 이미 끝남(SSE 완료 이벤트 뒤)
  #   finalize_config_cache_rebuild_fails       — 병합 뒤 설정 캐시 다시 만들기 실패
  #   finalize_called_twice_concurrently        — 완료 화면이 두 번 떠 병합이 동시에 두 번 불림
