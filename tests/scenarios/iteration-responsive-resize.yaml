feature: 반복 노드 자신에 둔 responsive 오버라이드(props·text·if)가 창 폭만 바뀌어도 항목에 반영된다 (engine-v1.89.0)

description: |
  반복 노드의 항목 렌더는 폭 판정이 끝난 병합 정의를 항목마다 복사해 넘긴다. 그 복사본을 만드는 메모가 정의의 일부
  (iteration·children·id)만 지켜봐서, 폭이 바뀌어 반복 노드 자신의 responsive props·text·if 만 달라지면 항목이 이전
  구간 값을 그대로 썼다(첫 렌더는 맞고, 다른 상태가 바뀔 때까지 틀린 값이 남음). 메모가 병합 정의 전체를 지켜보게 하고,
  병합 정의는 폭이 아니라 매칭된 분기 키가 바뀔 때만 새로 만든다. 축 case 는 바뀌는 필드(props·text·if)와 다시 그리기의
  계기(창 폭 구독·편집기 미리보기 폭·정의 교체·같은 구간 폭 변경·비반복 대조군)다.

axes:
  case: [props_resize, text_resize, if_resize, preview_width, definition_replaced, same_branch_resize, non_iteration_control]

effects:
  - iteration_items_follow_matched_branch  # 폭이 분기를 넘으면 항목이 새 분기의 props·text·if 를 쓴다
  - iteration_items_follow_definition      # 반복 노드 정의가 props 만 바뀐 새 객체로 와도 항목이 새 값을 쓴다
  - same_branch_resize_keeps_items         # 같은 분기 구간 안의 폭 변경은 항목 컴포넌트를 다시 그리지 않는다
  - non_iteration_unchanged                # 비반복 노드의 responsive 는 종전대로 폭을 따른다

test_files:
  - resources/js/core/template-engine/__tests__/DynamicRenderer.iterationResponsiveResize.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/basic/__tests__/Img.responsiveThumbPreset.test.tsx
  - templates/_bundled/sirsoft-basic/src/components/basic/__tests__/Img.responsiveThumbPreset.test.tsx

validation:
  browser_check: 반복 노드 자신에 responsive className 을 둔 화면(마이페이지 배송지·주문 목록, 주문서 결제수단, 관리자 주문 상세의 일괄 변경 확인·취소 창)을 넓은 화면으로 연 뒤 창 폭만 portable 로 줄였다가 되돌려 항목 클래스가 따라 바뀌는지
  note: |
    fail-first: 수정 전 코드에서 props_resize·text_resize·if_resize·preview_width·definition_replaced·same_branch_resize 가 red(6/7, 대조군만 green).
    병합 정의를 분기 키가 아니라 폭으로 다시 만들면(의존성에 responsiveWidth 추가) same_branch_resize 가 red(항목 렌더 2→6).
