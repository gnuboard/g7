feature: field_definition_admin_api

description: |
  관리자 항목 관리 API(/api/admin/field-sets/{set}/fields). 환경설정 > 회원 > 가입 항목 표의 즉시 저장 계약:
  목록과 정의 버전, 부분 수정, 운영자 항목 추가·삭제, 순서 변경, 낡은 표의 요청 거부(409 fields_changed),
  선택지 삭제 시 값 정리, 미입력 회원 수, 집합 권한 관문.

coverage_strategy: full

axes:
  action: [index, show, store, update, destroy, reorder, missing_count]

effects:
  - admin_field_list_contract
  - admin_field_partial_update_changes_version
  - admin_field_stale_version_rejected
  - admin_custom_field_created
  - admin_custom_field_validation
  - admin_field_update_validation
  - admin_declared_field_limited_edit
  - admin_scope_change_turns_off_existing_member_requirement
  - admin_locked_attribute_ignored
  - admin_option_usage_counts
  - admin_option_removal_clears_values
  - admin_field_reorder_persists
  - admin_custom_field_deleted_with_values
  - admin_declared_field_cannot_be_deleted
  - admin_field_in_use_blocks_delete
  - admin_missing_count_before_requiring
  - admin_field_permission_gate
  - admin_field_lifecycle_actions_fire
  - admin_field_lookup_is_scoped_to_set
  - admin_field_source_label_follows_installed_name_locale   # 확장 항목 출처 이름·확장 유형 배지(owner_label)는 설치 기록 다국어 이름(언어팩 ja 포함)에서 요청 언어로 고른다

test_files:
  - tests/Feature/Api/Admin/FieldDefinitionControllerTest.php
  - tests/Feature/Services/FieldDefinitionServiceTest.php
