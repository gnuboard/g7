feature: 밖으로 나가는 링크의 주소 — G7_PUBLIC_LINK_URL

description: |
  메일·알림·문자에 싣는 화면 링크의 베이스를 `.env` 의 G7_PUBLIC_LINK_URL(config core.public_link_url)로 정한다.
  같은 DB 를 쓰는 서버를 공개 주소와 다른 주소로 띄울 때 그 서버가 보내는 링크가 공개 주소를 가리키게 하는 용도다.
  SiteUrl::forOutboundLinks() = 공개 링크 주소 ?: 사이트 주소. 링크 빌더는 ScreenUrl 의 링크 변형
  (absoluteForLinks()·toAbsoluteForLinks()·userLinkBase())을 쓴다 — 회원 범위 베이스는 「사용자 화면 URL」 →
  공개 링크 주소 → 사이트 주소, 관리자 범위는 forOutboundLinks(). ScreenUrl 의 기본 베이스(absolute()·toAbsolute()·
  userBase()·isUserScreenOrigin())는 이 값을 따르지 않는다 — 결제·본인인증 뒤 브라우저 복귀 주소, 복귀 출처 검사,
  사이트맵이 쓴다. 결제·본인인증 콜백·정식 주소 이동처럼 이 서버가 받는 주소는 SiteUrl::base()/absolute()/forPath()
  그대로 사이트 주소다. 비워 두면 지금과 같다.

test_files:
  - tests/Feature/Screen/PublicLinkUrlTest.php

axes:
  case:
    - unset
    - configured
    - user_screen_url
    - server_received
    - identity_return

effects:
  - unset_keeps_site_url
  - member_links_use_public_link_url
  - admin_links_use_public_link_url
  - user_screen_url_wins_for_member_links
  - callbacks_keep_site_url
  - identity_return_keeps_site_url
