feature: 확장점(extension_point) 콜백 액션의 자리 — props 가 아니라 callbacks

description: |
  레이아웃 JSON 의 `extension_point` 노드에서 콜백 액션 객체는 `props` 가 아니라 `callbacks`
  에 있어야 한다. 엔진은 두 자리를 다르게 다룬다(`DynamicRenderer.tsx:1882-1897`):

    props     → 표현식을 **평가한 뒤** `extensionPointProps` 로 전달
    callbacks → 평가 없이 **그대로** `extensionPointCallbacks` 로 전달

  액션 객체를 `props` 에 두면 두 가지가 동시에 깨진다. 첫째, 주입된 컴포넌트가 읽는 자리는
  `extensionPointCallbacks` 라서 액션이 애초에 도달하지 않는다. 둘째, 도달하더라도 액션 안의
  `{{$event.zipcode}}` 같은 바인딩이 `$event` 가 존재하기 전에 렌더 시점 컨텍스트로 평가되어
  빈 값으로 굳는다.

  증상이 조용한 것이 이 결함의 성질이다 — 콘솔 오류도 422 도 없고 확장점 버튼은 정상으로
  보이며 자기 일까지 한다(우편번호 레이어가 열리고 주소도 고를 수 있다). 다만 고른 값이 폼에
  돌아오지 않아, 그 폼이 그 필드를 필수로 요구하면 사용자는 **어떤 조작으로도 저장에 도달하지
  못한다**. 2026-09-15 #599 세션3 실측에서 마이페이지 > 배송지 > 새 주소 추가가 이 형태로
  막혀 있었다(`_local.shipping.zipcode` 에는 `06236` 이 들어왔는데 모달이 읽는
  `_global.editingAddress` 는 비어 있어 "우편번호는 필수입니다." 가 영구히 남았다).

  따라서 개별 화면을 하나씩 고치는 대신 **레이아웃 트리 전수를 정적으로 훑어** 같은 형태가
  다시 들어오지 못하게 잠근다. 검사 범위는 소유 주체로 나눈다 — 코어·템플릿·플러그인은
  저장소 루트 테스트가, 모듈 레이아웃은 각 모듈 테스트가 맡는다.

axes:
  scope:
    - core_and_templates_and_plugins
    - ecommerce_module_layouts

exclusions: []

effects:
  - extension_point_props_carry_no_action_objects

