feature: core_sample_seed_chain

description: |
  코어 샘플 시드(db:seed --sample --force) 전체 경로가 끝까지 돈다(W3 실측). 레이아웃 버전 샘플 시더가 정수 칸(version)에 '1.0.0' 문자열을 넣어
  MySQL strict 에서 멈추고 뒤 시더가 돌지 않았다. 또 모든 레이아웃 버전 이력을 지웠다 — 샘플 표시(changes_summary.is_sample)가 있는 행만 다시
  만들고, 번호는 레이아웃별 기존 최댓값 다음 정수로 붙인다.

coverage_strategy: full

axes:
  seed_path: [database_seeder_sample, layout_version_seeder]
  existing_history: [none, operator_versions]

exclusions:
  - { seed_path: database_seeder_sample, existing_history: operator_versions, reason: "기존 이력 보존은 시더 단위 칸이 잰다 — 전체 경로 칸은 사슬 완주를 잰다" }
  - { seed_path: layout_version_seeder, existing_history: none, reason: "기존 이력이 없으면 번호가 1부터인 같은 분기 — operator_versions 칸이 더 넓게 잰다" }

effects:
  - core_sample_seed_completes_whole_chain
  - layout_version_sample_keeps_operator_history_and_uses_integer_versions

test_files:
  - tests/Feature/Database/DatabaseSeederSampleTest.php
