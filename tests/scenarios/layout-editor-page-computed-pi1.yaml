# 레이아웃 편집기 페이지 설정 계산값과 조건 값 편집기 (π1)
# tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_page_computed_pi1

description: |
  페이지 설정의 계산값(computed) 폼과 미리보기, 직접 만들기 빌더, 부모/자식 상속 매트릭스(C1~C14)를 다룬다.
  조건 값 편집기(ConditionalValueEditor), 분기 목록(conditions 액션), 세그먼트 값 편집기(SegmentedValueEditor)의
  조각 편집, 재결합, 드래그 재배치, 데이터 후보 연동, 읽기전용 디그레이드를 시험 단위로 잠근다.

axes:
