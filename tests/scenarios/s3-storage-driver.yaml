  - tests/Unit/Providers/SettingsServiceProviderS3ConfigTest.php
  - tests/Unit/Services/DriverConnectionTesterTest.php
  - tests/Unit/Services/DriverRegistryServiceUsabilityTest.php
  - tests/Feature/Api/Admin/SettingsControllerS3ValidationTest.php
  - tests/Feature/Api/Public/AttachmentS3DiskServingTest.php
  - tests/Unit/Services/TemplateLayoutAttachmentServingTest.php
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-drivers-s3-fields.test.tsx
