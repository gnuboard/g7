feature: 확장 업데이트 직후 훅 캐시에 그 확장의 새 리스너가 들어간다

description: |
  확장 업데이트(관리자 화면 [업데이트]·artisan 공통)는 부팅 때 구버전 module.php·plugin.php 를 읽어 둔 프로세스 안에서 파일을
  교체하고 끝에 훅 캐시를 다시 굽는다. 매니저가 목록을 다시 읽으며 이미 메모리에 있는 클래스를 new 하면 구버전
  getHookListeners() 가 나와, 새로 더한 리스너가 bootstrap/cache/hooks.php 에서 빠졌다(2026-10-07 TOTP 업데이트 실측 —
  UserTotpEnrollmentInfoListener 누락으로 관리자 회원 상세 인증 앱 카드가 「권한 없음」). 진입 파일 지문이 메모리 정의와
  다르면 새 파일을 임시 클래스명으로 읽어 그 인스턴스를 쓴다. 템플릿은 PHP 리스너가 없어 대상이 아니다.

axes:
  extension_type: [module, plugin, unchanged]

effects:
  - updated_extension_new_listener_in_hook_cache

test_files:
  - tests/Feature/Extension/ExtensionUpdateHookCacheFreshClassTest.php
