# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다(#798 A1).

feature: "관리자 「비밀번호 없이 만들기」 (#798 K11 · P7)"

description: |
  관리자 「비밀번호 없이 만들기」 (#798 K11 · P7)
  관리자가 회사 계정으로만 로그인할 회원을 미리 만든다. `create_without_password=true` 면 비밀번호를 받지 않고(`prohibited`) 비밀번호 없는
  회원이 된다 — 비밀번호 로그인은 실패하고 재설정 메일로 처음 만들 수 있다. 기존 경로(비밀번호 필수)는 그대로다.

axes:
  mode: [passwordless, passwordless_with_password, default]

effects:
  - passwordless_created
  - passwordless_cannot_password_login
  - passwordless_can_request_reset
  - passwordless_with_password_rejected
  - default_create_requires_password

test_files:
  - tests/Feature/User/CreatePasswordlessUserTest.php
