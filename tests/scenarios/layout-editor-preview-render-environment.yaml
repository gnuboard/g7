validation:
  note: |
    단위 테스트는 「호스트 값을 읽던 지점」마다 렌더 환경 우선을 잠그고, 제보자 요청 회귀(두 렌더 경로 패리티)는
    `ResponsiveOverride.renderPathParity.test.tsx` 가 실물 DynamicRenderer + ResponsiveProvider 로 잰다.
    CSS 격리는 브라우저만 판정할 수 있어(jsdom 은 @container·@layer 를 지원하지 않는다) 순수 함수·가짜 CSSOM 단위
    테스트 위에 Playwright spec 이 실제 Chromium 에서 열 수·방향·computed style 을 잰다.
    템플릿 쪽 잠금은 각 템플릿의 `tests/scenarios/preview-render-environment.yaml` 이 소유한다.
