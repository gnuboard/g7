feature: 환경설정 > 고급 > GeoIP [갱신] API 의 상태별 HTTP 응답

description: |
  `POST /api/admin/settings/geoip/update` 는 GeoIP DB 갱신 서비스가 돌려준 상태를 HTTP 상태 코드로 옮긴다.
  로그인하지 않은 요청은 서비스에 닿기 전에 401 로 거절된다. 설정 수정 권한을 가진 관리자의 요청은 서비스를
  강제 갱신으로 한 번 부르고, 라이선스 키 없음은 400, 라이선스 키 인증 실패는 401, 다운로드 실패는 500,
  성공은 200 과 서비스가 돌려준 데이터(파일 크기 등)로 응답한다.

  응답 message 의 번역 키는 geoip-update-message-keys.yaml 이 맡는다. 여기서는 상태 코드와 본문 형태만 본다.

axes:
  case: [unauthenticated, missing_license_key, updated, license_unauthorized, download_failed]

effects:
  - geoip_update_requires_authentication            # 토큰이 없으면 401
  - geoip_update_missing_license_key_returns_400    # 라이선스 키 없음 상태는 400, success=false
  - geoip_update_success_returns_200_with_data      # 성공은 200, success=true, 서비스 데이터가 data 에 실린다
  - geoip_update_invalid_license_returns_401        # 라이선스 키 인증 실패 상태는 401
  - geoip_update_download_failure_returns_500       # 다운로드 실패 상태는 500

# E2E axis 없음: 판정은 전부 서버측이고 레이아웃 JSON, 컴포넌트 변경이 없다.

test_files:
  - tests/Feature/Api/Admin/GeoIpControllerTest.php
