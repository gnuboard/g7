e2e:
  - spec: tests/Playwright/specs/admin/analytics-collect-e2e.spec.ts
    axes: [user_first_load, admin_screen]
    reason: |
      단위·Feature 테스트는 트래커와 적재 파이프라인을 따로 잠근다. 그 사이의 배선 —
      사용자 화면 부팅 시 트래커가 켜지고, 비콘이 만들어지고, 서버가 204 로 받는 것 —
      은 브라우저에서만 드러나며 깨져도 화면에 아무 증상이 없다.

# 관리자 화면(14면)의 E2E 는 S3 이 소유한다 — 이 단계에는 화면이 없다.
