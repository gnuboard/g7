# audit:allow test-scenario-coverage reason: |
#   cross product 자동 전개는 audit 실행 환경의 fallback YAML 파서가 nested axes 를 읽지
#   못한다(저장소 기존 시나리오와 같은 한계). 축 조합은 PHPUnit 단위·Feature 테스트가
#   커버하고 green 이다.

feature: 방문자 통계 수집 기반 — 방문 묶기·액션 적재·제외 판정 (이슈 #682 S1)

description: |
  방문자가 사이트를 보는 동안 일어난 일을 방문과 액션으로 남긴다. 세 경로(브라우저
  비콘·서버 폴백·사이트 내부 검색)가 모두 같은 적재 파이프라인으로 모인다.

  배경:
    - 코어에는 방문·페이지뷰를 세는 표면이 하나도 없었다. 운영자는 외부 도구 없이는
      방문자 규모조차 알 수 없었다.
    - SPA 라 서버 로그로는 페이지뷰가 방문당 1건으로만 찍힌다 — 브라우저가 알려 주지
      않으면 화면 이동이 보이지 않는다.
    - 수집 실패는 전부 조용하다. 방문이 두 개로 갈리거나 페이지뷰가 두 배가 되어도
      화면에는 그럴듯한 숫자가 나오므로, 행 수를 직접 단언해야 어긋남이 잡힌다.

  적용 지점:
    - `app/Analytics/**` 순수 로직(제외 판정·방문자 식별·환경/유입 분류·URL 정규화).
    - `app/Services/Analytics/VisitService` 가 트랜잭션 안에서 방문을 잠그고 적재한다.
    - 방문 묶기: 같은 방문자 키 + 마지막 활동이 창(기본 30분) 안.
    - 서버 폴백과 첫 비콘이 같은 페이지를 두 번 세지 않도록 60초 안의 행을 병합한다.

# 축 조합이 많아 전건을 도는 대신 쌍 단위로 덮는다(계획서 §7.1).
coverage_strategy: pairwise

axes:
  source: [beacon, server, search, server+beacon]
  mode: [full, consent, anonymous]
  visitor: [guest, member, admin, bot]
  exclusion:
    - none
    - disabled
    - prefetch
    - dnt
    - opt_out
    - url_pattern
    - ip_rule
    - ua_rule
    - headless
    - cloud_ip
    - country
    - bot
    - consent
  # 훅 리스너가 큐를 타는가. 수집·검색 리스너는 `sync => true` 라 발화 자리에서 돌고
  # (방문 1건이 잡 1개가 되지 않도록 — #682 S3 라운드 6), 활동 로그 같은 리스너는 큐로 간다.
  dispatch: [sync, queue]
  visit_state: [new, open, timed_out, max_actions]
  merge: [within_window, outside_window, different_url]
  init: [true, false]
  prev_time_spent: [present, absent]
  seo: [on, off]
  mask_octets: [0, 1, 2, 3]
  # 판정기 단위 축 — 조합을 만들려는 것이 아니라 UA·유입·URL·IP 판정기가 받는 입력 모양을 열거한다
  ua: [empty, conflicting]
  browser: [chrome, chromium_derivatives, edge, firefox, kakaotalk, naver_app, opera, safari, samsung, whale]
  os: [android, chromeos, ios, ipados, linux, macos, windows]
  os_version: [android, ios, macos, windows]
  device: [desktop, mobile, tablet]
  hints: [present, placeholder_only]
  referrer: [absent, empty, self_host, search, website]
  keyword: [present, absent]
  campaign: [present, absent]
  engine: [google, naver, daum, bing, yahoo, duckduckgo, baidu, yandex, zum, nate]
  prefix: [http, http_www, https, https_www]
  case: [mixed]
  restore: [all_prefixes]
  strip: [fragment, utm, fbclid, gclid]
  query: [preserved_for_campaign, reordered]
  display: [strip_site_host, decode_for_display]
  url: [relative]
  hash: [stable, type_separated]
  cidr: [v4_inside, v4_outside, v6_inside, v6_outside, exact, all, non_byte_boundary, cross_family]
  input: [invalid]
  list: [hit, miss]
  roundtrip: [ipv4, ipv6]

exclusions:
  - { visitor: bot, source: beacon, reason: "봇은 브라우저 비콘을 보내지 않는다 — 서버 경로에서만 판정된다" }
  - { exclusion: cloud_ip, reason: "대역 목록 파일이 있어야 판정된다 — 파일 부재 시 판정을 건너뛰는 동작만 단위로 커버" }
  - { mode: consent, visitor: bot, reason: "동의 판정 전에 봇이 먼저 걸러진다 — 순서가 계약이다" }

