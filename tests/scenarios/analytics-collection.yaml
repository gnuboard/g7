  - server_fallback_and_first_beacon_merge_into_one_action
  - merged_action_does_not_double_count_pageviews
  - cookieless_server_fallback_is_adopted_by_first_beacon
  - anonymous_server_fallback_and_beacon_share_a_visit
  - beacon_outside_merge_window_creates_new_action
  - beacon_for_different_url_creates_new_action
