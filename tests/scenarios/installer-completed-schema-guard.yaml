feature: 설치 완료 플래그의 스키마 조회 생략 가드

description: |
  `config('app.installer_completed')` 가 참이면 확장 활성 목록, 알림 동적 훅, 본인인증 정책 훅 대상,
  활성 확장 범위 조회가 매 요청 `information_schema.tables` 를 묻지 않는다(성능 회귀 방지).
  설치가 끝나지 않았으면 종전 hasTable 경로를 그대로 탄다. 마이그레이션 계열 명령 컨텍스트에서는
  플래그가 참이어도 빈 DB 배포 안전성을 위해 hasTable 실검증 경로로 돌아간다.

axes:
  installer_completed_state: [completed, not_completed, completed_during_migration]

effects:
  - schema_probe_skipped_when_installer_completed
  - schema_probe_runs_when_installer_not_completed
  - schema_probe_runs_during_migration_despite_installer_completed

test_files:
  - tests/Unit/Extension/InstallerCompletedGuardTest.php
