feature: 렌더 도우미(RenderHelpers) — 반복 렌더 자식과 유효 데이터 문맥

description: |
  renderItemChildren 은 셀과 카드 같은 반복 문맥의 자식 정의를 그린다. row 바인딩, 중첩 자식, iteration 반복,
  if 조건 거르기, responsive 오버라이드(모바일, 태블릿, 사용자 범위, text)를 다루고, 없는 컴포넌트는 결과에서 뺀다.
  getEffectiveContext 는 기본 문맥에 컴포넌트 상태(_local), 격리 상태(_isolated), 부모 데이터 문맥을 합친다.
  부모 데이터 문맥은 기본 문맥 키와 예약 키를 덮지 않는다(engine-v1.19.1). 축 area 는 기능 묶음 하나씩이다.

axes:
  area: [basic, iteration, if_condition, responsive, effective_context, parent_data_context]

effects:
  - item_children_render_bound_components
  - item_children_iteration_repeats
  - item_children_if_filters
  - item_children_responsive_overrides
  - effective_context_merges_state_layers
  - effective_context_merges_parent_data

test_files:
  - resources/js/core/template-engine/helpers/__tests__/RenderHelpers.test.tsx
