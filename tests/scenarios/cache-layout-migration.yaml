feature: cache_layout_migration

description: |
  레이아웃 캐시 3종(LayoutService 병합 결과 `template.{id}.layout.{name}`, PublicLayoutController 서빙
  `layout.{identifier}.{name}.v{version}`, LayoutResolverService 해석 `layout_resolver.{id}.{name}`)이
  코어 캐시 드라이버의 새 접두사(`g7:core:`)로 옮겨졌는지와 키 단위 무효화 패턴을 고정한다(계획서 §13 B-1 ~ B-4).
  넣은 값은 재조회해도 같고, 편집, 이름 변경, 부모 변경, 모듈 활성화와 비활성화, 템플릿 비활성화 때 지울 키를 지우면 사라진다.
  확장 변경으로 ext.cache_version 이 오르면 이전 버전 서빙 키는 지우지 않고(TTL 만료에 맡김) 새 버전 키가 따로 생긴다.

axes:
  case:
    - merged_layout          # 병합 결과 캐시 (B-1-1 ~ B-1-3)
    - layout_rename          # 레이아웃 이름 변경 (B-1-4)
    - module_source_hash     # 모듈 sourceHash 를 붙인 병합 키 (B-1-5)
    - extends_cascade        # 부모, 자식 extends 연쇄 무효화 (B-1-6)
    - serving                # 서빙 캐시 (B-2-1 ~ B-2-3)
    - version_bump           # 확장 캐시 버전 상승 (B-2-4)
    - resolver               # 해석 캐시 (B-3-1 ~ B-3-3)
    - module_deactivate      # 모듈 비활성화 (B-3-4)
    - module_activate        # 모듈 활성화 (B-4-1)
    - template_deactivate    # 템플릿 비활성화 (B-4-2)

exclusions:
  - { case: merged_layout, reason: "제외 없음 — 사례 단일 축(캐시 종류와 무효화 계기 조합은 사례로 고정)" }

effects:
  - key_uses_core_prefix              # resolveKey() 가 g7:core: 접두사가 붙은 키를 돌려준다
  - layout_value_cached               # 넣은 값이 has, get 으로 그대로 읽힌다(재조회도 같은 값)
  - layout_key_forgotten              # 무효화한 키가 has() 에서 false 다
  - layout_keys_bulk_forgotten        # 한 번에 무효화한 여러 레이아웃 키가 모두 없다
  - renamed_layout_key_replaced       # 이름 변경 뒤 이전 키는 없고 새 키는 있다
  - old_version_key_kept              # 버전 상승 뒤 이전 버전 키는 남고 새 버전 키는 다른 값으로 따로 있다

test_files:
  - tests/Unit/Cache/Migration/LayoutCacheTest.php
