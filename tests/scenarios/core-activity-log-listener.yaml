  - subscribed_hook_count_matches_the_hook_table
  - subscribed_hooks_map_to_existing_handlers
  - all_logging_hooks_registered_at_priority_20
  - hook_to_handler_mapping_matches_the_action_table
  - default_handle_is_a_no_op
  - user_crud_view_and_search_are_logged
  - user_bulk_update_logs_one_entry_per_existing_user
  - auth_events_are_logged_with_log_type_by_route
  - role_changes_are_logged_with_permission_diff
  - menu_changes_are_logged_with_role_diff
  - settings_save_and_set_are_logged_with_keys
  - schedule_changes_and_runs_are_logged
  - schedule_bulk_actions_log_one_entry_per_item
  - attachment_upload_delete_and_bulk_delete_are_logged
  - module_lifecycle_is_logged
  - plugin_lifecycle_is_logged
  - template_lifecycle_is_logged
  - layout_update_and_restore_are_logged
  - extension_settings_save_and_reset_are_logged
  - update_handlers_accept_a_snapshot_argument
  - missing_identifiers_fall_back_to_empty_strings
  - logging_exception_is_absorbed_into_log_error

