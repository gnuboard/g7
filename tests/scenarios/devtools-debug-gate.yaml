feature: 개발 도구 엔드포인트의 디버그 모드 게이트

description: |
  `/_boost/g7-debug/*` 와 `/_boost/browser-logs` 는 디버그 모드에서만 열린다. 게이트는 `config('app.debug')` 가
  참이면 바로 통과시키고, 거짓이면 환경설정의 `debug.mode` 값을 읽어 판정한다. 둘 다 꺼져 있으면 403 JSON 과
  번역된 안내 문구로 응답한다(500 이나 번역 키 원문이 아니다).

  게이트는 라우트 묶음의 미들웨어로 한 번만 걸려 GET, POST, DELETE 가 같은 판정을 쓴다. 덤프를 지우는
  `DELETE clear` 는 디버그가 꺼져 있으면 403 을 돌려주고 덤프 파일을 그대로 둔다. 디버그가 켜져 있으면 조회용
  GET 네 개(state, actions, cache, change-detection)와 `DELETE clear` 는 종전대로 동작한다.

  게이트가 라우트에 붙어 있는지(등록 계약)는 DevtoolsRouteGateContractTest 가 본다. 여기서는 응답 행위를 본다.

axes:
  case: [settings_debug_mode_on, app_debug_on,
         dump_state_debug_off, browser_logs_debug_off, log_debug_off,
         clear_debug_off, clear_debug_on,
         get_endpoints_debug_off, get_endpoints_debug_on]

effects:
  - devtools_gate_passes_on_settings_debug_mode          # app.debug 가 꺼져도 debug.mode 설정이 켜져 있으면 200
  - devtools_gate_passes_on_app_debug_without_settings   # app.debug 가 켜져 있으면 환경설정을 읽지 않고 통과
  - devtools_post_endpoints_return_403_when_debug_off    # dump-state, browser-logs, log 는 디버그가 꺼지면 403
  - devtools_gate_403_message_is_translated              # 403 응답의 message 는 번역 키 원문이 아니다
  - devtools_clear_rejected_keeps_dump_files             # clear 가 403 이면 덤프 파일 수와 표식 파일이 그대로다
  - devtools_clear_removes_dumps_when_debug_on           # 디버그가 켜져 있으면 clear 가 200 으로 덤프를 지운다
  - devtools_get_endpoints_return_403_json_when_debug_off  # 조회용 GET 네 개는 디버그가 꺼지면 403 JSON
  - devtools_get_endpoints_respond_when_debug_on         # 조회용 GET 네 개는 디버그가 켜지면 200

# E2E axis 없음: 판정은 전부 서버측 미들웨어이고 레이아웃 JSON, 컴포넌트 변경이 없다.

test_files:
  - tests/Feature/DevTools/DevtoolsDebugGateTest.php
