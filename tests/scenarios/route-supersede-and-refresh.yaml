effects:
  - queued_navigation_supersedes_in_flight                # 대기열의 새 이동이 앞 이동 응답을 기다리지 않고 곧바로 시작한다
  - late_previous_route_response_dropped                  # 늦게 온 앞 경로 응답(성공 처리 포함)이 새 화면·폼에 들어가지 않는다
  - previous_screen_input_locked_while_form_replaced      # 새 폼을 blocking initLocal 로 받는 동안 앞 화면은 흐림·inert, 렌더 뒤 풀린다
  - refetch_failure_context_flag                          # 다시 받기 실패는 error.refetch=true, 처음 받기 실패는 거짓
  - refetch_kept_value_does_not_reseed                    # 마지막 값으로 버틴 다시 받기는 initLocal 을 다시 심지 않는다(바꾼 선택 유지)
  - same_screen_refresh_blur                              # 같은 화면 쿼리 갱신 동안 data_sources 흐림이 앞 값 위에 선다
  - overlay_released_after_commit                         # 덮개는 커밋 뒤 걷히고 wait_for 소스만 기다린다
  - render_cycles_not_increased                           # 화면 이동 1회의 루트급 렌더 주기(startRenderCycle)가 수정 전 엔진 이하
  - replace_refetch_reseeds_form                          # 쿼리 갱신(탭 전환) 재조회는 편집 중이어도 서버 값으로 다시 심는다(계약 가드)
  - cancelled_screen_data_not_carried                     # init 대기 중 취소된 화면이 받아 둔 같은 id 값은 돌아온 앞 화면 첫 렌더에 심기지 않는다

