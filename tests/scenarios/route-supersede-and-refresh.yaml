feature: 경로 이동 중 다시 이동·늦은 응답·받는 동안 앞 화면·다시 받기 실패 문맥·같은 화면 받는 중 표시·덮개 해제 (engine-v1.82.0)

description: |
  진행 중인 이동 뒤에 새 이동이 대기열에 들어오면 진행 중인 화면 처리를 밀어내고(세대 증가), 화면을 옮긴 뒤 도착한 앞 화면 fetch 의
  성공 처리·오류 처리기를 실행하지 않는다. 이동 시작부터 전환 상태를 켜고, 새 화면 폼을 blocking initLocal 로 통째로 채우는 이동은 받는
  동안 앞 화면 내용(덮개 대상)을 inert 로 잠근다. 데이터 소스 오류 처리기 문맥에 다시 받기 여부(error.refetch)를 싣고, 마지막 값으로
  버틴 다시 받기는 initLocal 을 다시 심지 않는다. 같은 화면 쿼리 갱신이 앞 값을 둔 채 받는 소스는 data_sources 흐림이 받는 중으로 보고,
  덮개는 새 화면 커밋 뒤(wait_for 만 기다림) 걷는다. 쿼리 갱신(탭 전환) 재조회가 폼을 서버 값으로 다시 심는 계약은 그대로다.
  실물 Router·TemplateApp·DataSourceManager·DynamicRenderer 로 잰다.

