feature: base_resource_helper_visibility

description: |
  공용 응답 리소스(`BaseApiResource`)에 헬퍼를 추가해도 기존 자식이 죽지 않게 한다.

  PHP 는 오버라이드에서 **가시성 축소를 금지한다.** 부모에 `protected` 헬퍼를 새로 추가했는데
  자식이 우연히 같은 이름을 이미 `private` 로 갖고 있으면, 그 자식 클래스는 **로드되는 순간**
  `Access level to ...::x() must be protected (as in class ...) or weaker` FatalError 로 죽는다.

  이 결함이 특히 잘 숨는 이유:
    - **컴파일 타임이 아니라 클래스 로드 시점**에 터진다. 정적 분석에 안 걸린다.
    - 그 리소스를 쓰는 **엔드포인트만** 500 이 된다. 다른 엔드포인트 테스트는 전부 초록이다.
    - 부모를 고친 커밋의 diff 에는 **자식 파일이 등장하지 않는다.** 코드 리뷰에서 인과가 안 보인다.
    - 중복 헬퍼를 공용 부모로 올리는 것은 **바람직한 리팩터링**이라, 의도가 옳을수록 더 잘 걸린다.

  핵심 설계:
    - 검사는 **반드시 소스 텍스트로** 한다. 리플렉션으로 자식을 로드하면 위반 파일에서
      PHPUnit 프로세스 자체가 FatalError 로 즉사해 **실패한 단언조차 남지 않는다**
      (S3-D11 red 대조에서 러너가 실제로 즉사하는 것을 확인했다).
    - 헬퍼 이름을 나열하지 않고 **부모가 스스로 선언한 non-private 메서드 전체 × 자식 소스 전체**를
      돈다. 다음에 부모에 헬퍼가 하나 더 붙어도 자동으로 잡힌다.
    - 중복 헬퍼는 **가시성만 넓히지 않고 자식에서 제거한다.** 부모로 올린 목적이 "같은 변환이
      화면마다 갈리지 않게" 하는 것이므로, 자식에 남겨 두면 그 목적이 그대로 깨진다.

axes:
  child_declaration: [narrowed, inherited]

effects:
  # ── 가시성 계약 (P0) ──
  # 자식이 부모 헬퍼를 private 로 재선언하면 그 리소스를 쓰는 엔드포인트가 통째로 500 이 된다.
  # 검사 대상 헬퍼 집합은 부모에서 읽어 오고(하드코딩하지 않고), 자식은 소스 텍스트로만 본다
  # — 자식을 로드하면 위반 파일에서 러너가 죽어 결과가 아예 남지 않는다.
  - child_must_not_narrow_parent_helper_visibility
  # ── 중복 제거 + 소비 지점 (P0) ──
  # 공용 부모로 올린 헬퍼가 자식에 남아 있으면 단위·자릿수 규칙이 화면마다 갈린다.
  # 이 계약이 깨지면 레이아웃 편집기가 목록을 아예 못 불러온다(무조건 500).
  - layout_resources_inherit_shared_file_size_formatter

test_files:
  # 코어 — 부모 헬퍼 전체 × 리소스 소스 전체 가시성 스캔(소스 텍스트) + 레이아웃 리소스 3종 실제 로드
  - tests/Unit/Http/Resources/BaseApiResourceHelperVisibilityTest.php
