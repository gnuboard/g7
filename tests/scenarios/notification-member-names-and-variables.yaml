feature: notification_member_names_and_variables

description: |
  알림의 받는 사람 이름과 회원 항목 변수.
  받는 사람 이름 자리표시자(`{recipient_name}`)는 채널의 표시 이름 영역(`core:notification:{채널}`)으로 풀리고,
  큐 분할 발송을 거쳐도 같은 값이 나간다. 뒤따르는 개인화 필터의 인자는 그대로다.
  템플릿이 참조한 회원 항목 변수(`{member.<키>}`, `{member.custom.<키>}`, `{member.display_name}`)만 채우고,
  수신자 묶음마다 값을 한 번에 읽으며, 「관리자만 열람」 항목은 넣지 않는다.
  없는 변수를 쓴 템플릿은 저장되되 응답의 `warnings` 로 알려 준다.

coverage_strategy: full

