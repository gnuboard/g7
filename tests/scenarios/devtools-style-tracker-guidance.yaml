feature: DevTools 스타일 추적기 안내 — 폭 조건은 엔진 responsive 로 권한다

description: |
  StyleTracker 는 렌더된 요소의 클래스로 시각 이상을 감지하고 고칠 방법을 안내한다. 폭 조건 없이 `hidden` 만 있는 요소에는
  「조건에 따라 표시하려면 sm:block, desktop:flex 등을 추가하세요」라고 권했는데, 레이아웃과 부품의 Tailwind 폭 접두는
  금지 규정이고(docs/frontend/responsive-layout.md 2절, 감사 규칙 layout-no-tailwind-breakpoint-variant 가 막는다)
  `desktop:` 은 이 프로젝트에 없는 변형이다. 안내는 엔진 `responsive`(`<responsive on="desktop" class="…"/>`)로
  그 구간의 className 을 바꾸라고 권한다.
  폭 조건 유무는 노드 정의의 responsive 덮어쓰기로 본다(엔진은 지금 폭의 className 만 DOM 에 남기고 표식을 달지 않는다). 정의를 찾지 못하면
  판정하지 않아 오판을 내지 않고, 이 프로젝트에 없는 portable: desktop: 변형은 폭 조건으로 치지 않는다.
  TailwindValidator 도 폭 접두(sm md lg xl 2xl, max-*, min-[..], max-[..])와 이 프로젝트에 없는 portable, desktop 변형을 유효로 넘기지
  않고, 빌드 CSS 에 규칙이 있어도 경고하며 대응 구간(md → 768-, lg → desktop, max-[600px] → -599 등)을 권한다.

axes:
  guidance: [hidden_without_width_condition, hidden_engine_responsive_detection, tailwind_breakpoint_variant]

effects:
  - devtools_guidance_recommends_engine_responsive

test_files:
  - resources/js/core/devtools/__tests__/StyleTracker.test.ts
  - resources/js/core/devtools/__tests__/TailwindValidator.test.ts
