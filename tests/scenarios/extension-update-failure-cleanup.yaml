feature: 확장 업데이트 실패 처리 뒷정리

description: |
  확장 업데이트가 실패했을 때와 끝난 뒤의 부수 작업이 실패했을 때, 상태와 안내가 실제와 어긋나지 않게 한다.

  - 업데이트 실패 처리의 마지막은 「업데이트 중」 상태를 이전 상태로 되돌리는 DB 쓰기다. 실패 원인이 DB 연결 고갈이면
    이 쓰기도 실패해 확장이 「업데이트 중」에 남고 그 예외가 원래 실패를 가렸다. 한 번 실패하면 연결을 다시 맺고
    한 번 더 시도하고, 그래도 안 되면 기록만 남기고 원래 예외로 넘어간다.
  - 업데이트가 끝난 뒤 검색 인덱스 재생성이 실패하면 「업데이트 실패」가 아니라 「완료했지만 경고 있음」으로 알린다.

axes:
  case: [restore_first_try, restore_after_reconnect, restore_fails_twice, managers_use_helper, search_index_fails_after_update, search_index_ok_after_update]

effects:
  - status_restore_succeeds_without_reconnect                        # 첫 쓰기 성공 → 재연결 없음
  - status_restore_retries_once_after_reconnect                      # 첫 쓰기 실패 → 재연결 후 한 번 더 → 상태 복원
  - status_restore_failure_is_logged_not_thrown                      # 두 번 실패 → 기록만, 예외 없음
  - all_extension_managers_restore_status_safely                     # 모듈·플러그인·템플릿 관리자 모두 도우미 사용
  - search_index_failure_reported_as_warning_not_update_failure      # 재생성 실패 → 경고 표 + 종료코드 1, ❌ 없음
  - search_index_success_keeps_exit_zero                             # 재생성 요청이 없거나 성공하면 종료코드 0

test_files:
  - tests/Unit/Extension/ExtensionUpdateStatusRestoreTest.php
  - tests/Feature/Console/Commands/ExtensionUpdateSearchIndexWarningTest.php
