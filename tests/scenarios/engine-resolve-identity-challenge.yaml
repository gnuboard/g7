feature: resolveIdentityChallenge 핸들러 — launcher 결과 4상태 통보

description: |
  모달, 풀페이지, 외부 SDK callback 이 IdentityGuardInterceptor 의 deferred resolver 에 결과를 넘기는 핸들러.
  verified, pending, cancelled, failed 네 상태를 그대로 넘기되 필수 값이 빠지면 failed 계열로 강등하고,
  알 수 없는 result 는 cancelled 로 보정하며, 대기 resolver 가 없어도 throw 하지 않는다.

axes:
  case: [verified_with_token, verified_missing_token, cancelled, failed_with_code, failed_missing_code, pending_complete, pending_malformed, unknown_result, no_pending_resolver]

effects:
  - verified_result_passed_with_token
  - verified_without_token_downgraded_to_missing_token
  - cancelled_result_passed
  - failed_result_passed_with_code_and_reason
  - failed_without_code_normalized_to_unknown
  - pending_result_passed_with_poll_info
  - malformed_pending_downgraded
  - unknown_result_downgraded_to_cancelled
  - no_pending_resolver_does_not_throw

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.resolveIdentityChallenge.test.ts
