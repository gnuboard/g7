feature: network_resilience

description: |
  페이지 로드 요청 1건의 일시 실패가 앱 전체를 죽이지 않는다(#463). 한 페이지 로드가 쏘는 same-origin 요청 중
  일부는 1건만 취소돼도 앱 전체가 죽었다(전면 「초기화 실패」 / 백지 / raw 영문 토스트). 방어는 URL 목록이 아니라
  로드 계층(fetch 래퍼 / script 로더 / blade 인라인 부트스트랩)에 건다.
    - 일시 실패(1건 취소): 재시도 1회로 복구되고 사용자는 인지하지 못한다(과잉 재시도 없음).
    - 상시 부재: 백지·raw 식별자가 아니라 폴백 안내나 명시적 에러 + 새로고침 수단으로 끝나고, 재시도 상한을 지킨다.
  정적 게시(bake) 사이트에서는 /build/ext/** 를 404 로 강제해 API 폴백 경로의 복원력을 잰다.

# 입력 axis — 시험이 실제로 바꿔 넣는 실패 형태. 세 값 모두 시험이 잰다.
#  single_abort       : 첫 요청 1건만 취소(일시 실패) — routes·components·modules 번들·레이아웃 json 4경로와 다른 경로의 레이아웃
#  persistent_absence : 요청을 매번 실패(진짜 부재) — 코어 번들·템플릿 컴포넌트 번들·routes.json·모듈 번들
#  none               : 실패 주입 없음 — 부트스트랩 재시도 훅이 정상 로드를 방해하지 않는지
axes:
  failure: [single_abort, persistent_absence, none]

effects:
  # 요청 1건 취소 뒤 재시도 1회로 복구된다 — 취소 1 + 재시도 1 = 정확히 2회 (routes·components·modules 번들·레이아웃 json)
  - retry_on_network_failure
  # 화면이 백지로 끝나지 않는다 (본문 텍스트가 남는다)
  - no_blank_screen
  # 전면 에러 문구(초기화 실패 / 페이지 로딩 실패)나 내부 식별자(Unknown action handler)가 사용자 화면에 노출되지 않는다
  - no_raw_error_leak
  # 상시 부재 시 재시도 상한(초기 1 + 재시도 2 = 3시도)을 지킨다 — 무한 재시도·예산 신설 없음
  - retry_attempts_capped_at_three
  # 부트스트랩 재시도·폴백 훅(window.__g7Bootstrap)이 설치되고 정상 로드에서는 실패로 마킹되지 않는다
  - bootstrap_retry_hook_installed_without_false_failure
  # 코어·템플릿 컴포넌트 번들이 끝내 부재하면 폴백 안내와 새로고침 버튼이 렌더된다
  - bundle_absence_renders_fallback_with_reload_button
  # routes.json 이 끝내 부재하면 명시적 에러 화면(초기화 실패)과 새로고침 안내가 나온다
  - persistent_failure_shows_explicit_error_with_reload
  # 모듈 번들이 부재해도 오지 않을 핸들러를 기다리지 않아 5초 안에 렌더된다
  - missing_module_bundle_does_not_block_render

test_files:
  - tests/Playwright/specs/smoke/network-resilience.spec.ts
