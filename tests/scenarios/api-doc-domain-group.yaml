feature: API 레퍼런스 문서 도메인 그룹 — 하위 리소스를 별도 문서로 분리한다

description: |
  API 문서 생성기는 라우트명의 리소스 첫 세그먼트로 문서 파일(도메인)을 정한다. 스케줄 관리 화면
  아래 경로에 있는 큐 관리 API(api.admin.schedules.queue.*)는 별도 레퍼런스 문서로 다루므로,
  queue 도메인으로 분리돼야 생성기 재실행 때 스케줄 문서에 큐 블록이 다시 생기지 않는다.

axes:
  route: [schedules_queue, schedules_self]

effects:
  - queue_routes_grouped_into_queue_doc
  - schedule_routes_stay_in_schedules_doc

test_files:
  - tests/Unit/Support/ApiDoc/ApiRouteInventoryDomainGroupTest.php
