feature: 확장 활성 폴더를 번들 내용으로 덮어쓰기 (extension:reset-files-from-bundled, 예전 이름 extension:sync-files)

description: |
  같은 판인데 파일이 다른 확장(판 번호를 올리지 않은 번들 변경, DB 를 함께 쓰는 두 번째 서버)의 활성 폴더만 번들 폴더
  내용으로 원자 교체한다. 판정은 내용 해시(상대경로 정렬 + 파일 sha256, vendor·node_modules·.git·custom 제외)이고, 판이
  다르면 대상이 아니다(업데이트 명령 안내, 지정한 확장이면 종료 코드 1). 판 번호·업그레이드 스텝·레이아웃은 건드리지 않고
  운영자 `custom/` 은 보존한다. 같은 확장의 작업 잠금을 잡으며, `--dry-run` 은 파일을 바꾸지 않는다. 언어팩(`lang-packs/<id>`)도
  같은 규칙으로 대상이다 — 검수 서버가 먼저 새 판을 올려 공유 DB 판이 새 판이면 운영 서버는 이 명령으로만 새 언어팩 파일을 받는다.
  모듈·플러그인·템플릿은 교체 직전 활성 폴더(이전 판)로 비어 있는 레이아웃 병합 기준(`original_content`)을 원본 해시가 맞는 행에만
  채운다(본문·해시는 그대로) — 이어지는 keep 레이아웃 갱신이 운영자 수정본에 새 판을 병합할 수 있게.

# 축 의미:
#   case — 판·내용·옵션·잠금 상황.
axes:
  case: [same_version_differs, same_version_same_content, version_differs, dry_run, lock_contended, direction_notice, legacy_name, language_pack, layout_base_fill]

effects:
  - reset_files_announces_direction_and_targets_before_replacing
  - legacy_sync_files_name_keeps_working
  - sync_replaces_active_files_only_when_same_version_differs
  - version_mismatch_is_not_a_sync_target
  - dry_run_changes_no_files
  - sync_respects_extension_operation_lock
  - language_pack_active_files_are_reset_from_bundled
  - reset_files_fills_empty_layout_base_from_previous_files

test_files:
  - tests/Feature/Console/Commands/Extension/SyncExtensionFilesCommandTest.php
  - tests/Feature/Console/Commands/Extension/ResetFilesLayoutBaseTest.php
