feature: 확장 생명주기 부분 실패 경고 목록 — 결과 warnings·CLI 종료코드 1·관리자 결과 창 (7.1.3)

description: |
  레이아웃 파일별 등록·확장 조각 재등록·언어팩 시더 재실행·composer 설치·제거 정리·코어 재동기화 등 항목별 실패를
  로그만 남기고 성공(✅)을 내던 지점이 LifecycleWarnings 에 경고를 모은다. 작업 성공 여부는 바꾸지 않고, 매니저 결과와
  관리자 API 성공 응답 data.warnings 에 싣고, artisan 명령은 경고 표 + 표지([g7-lifecycle-warnings]) + 종료코드 1 을 낸다.
  설치 마법사·훅 캐시 새 프로세스는 표지 있는 1 을 「완료(경고 포함)」로 판정한다. 관리자 목록 화면은 노란 결과 창을 연다.

axes:
  surface: [collector, manager, api_response, cli]

effects:
  - warnings_collected_in_order
  - broken_layout_file_becomes_warning_not_silent
  - api_success_response_carries_warnings
  - cli_exit_code_one_with_marker
  - cli_marker_distinguishes_from_failure
  - cli_done_line_marks_warning_instead_of_success
  - db_connection_details_scrubbed_from_reason
  - notice_level_not_counted_as_failure
  - notice_only_command_keeps_exit_code
  - core_update_commands_show_warnings_keep_exit_code
  - failed_command_with_warnings_has_no_completion_marker
  - every_lifecycle_command_reports_warnings
  - storage_cleanup_left_behind_becomes_warning

test_files:
  - tests/Unit/Extension/LifecycleWarningsTest.php
