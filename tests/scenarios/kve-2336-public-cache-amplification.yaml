feature: 공개 템플릿 lane 미인증 서버 캐시 증식 차단 (KVE-2026-2336)

description: |
  공개·무인증 routes/lang 엔드포인트가 클라이언트 `?v=` 를 서버 캐시 키에 넣어 `?v=1,2,3,…`
  요청마다 캐시 엔트리(lang 은 건당 수백 KB)를 영구 기록했고, 공개 lane 에 속도 제한이 없었다.

  - 서버 캐시 키는 서버 현재 확장 캐시 버전(getExtensionCacheVersion)으로만 조립한다
    (#588 레이아웃 서빙과 같은 규율). `?v` 는 HTTP 캐시 정책 판단에만 쓴다.
  - routes 의 에러 결과는 캐시하지 않는다(cached() 헬퍼와 같은 규율).
  - 공개 데이터 응답(템플릿 routes·config·lang·components·editor-spec, 레이아웃, 모듈·플러그인
    components·editor-spec)에만 접두사 있는 throttle(auth.throttle.public, 기본 600/분, public_ext).
    JS/CSS 번들·정적 자산·아이콘·첨부 파일은 제한하지 않는다 — 프록시 뒤에서 전 방문자가 IP 하나로
    보일 때 화면 전체가 뜨지 않는 회귀를 막는다.
  - 확장 캐시 버전 bump 는 단조 증가(max(time(), 현재+1)) — 서버 키만으로 무효화가 성립하도록.

axes:
  endpoint: [routes, language, static_asset]
  client_version: [present, absent]

exclusions:
  - { endpoint: static_asset, client_version: present, reason: "정적 자산(번들·자산 프로브)은 서버 캐시 키에 버전 축이 없다 — throttle 제외 판정 전용" }

effects:
  - client_version_never_reaches_server_cache_key
  - versioned_url_keeps_http_cache_policy
  - error_result_is_not_cached
  - public_data_routes_are_throttled
  - static_asset_routes_are_not_throttled
  - cache_version_bump_is_strictly_monotonic

test_files:
  - tests/Feature/Api/Public/PublicTemplateCacheAmplificationTest.php
