  - api_client_passes_identity_target_to_identity_guard   # config.identity_target 을 가드의 target 인자로 넘긴다
  - api_client_api_path_is_neither_lost_nor_duplicated_under_subfolder   # 하위 폴더 마운트에서 /api 접두사가 빠지지도 겹치지도 않는다
  - same_origin_request_attaches_session_token   # 같은 출처 요청에는 Authorization 을 붙인다
  - api_client_absolute_urls_are_left_untouched_by_interceptor   # 절대 URL 은 인터셉터가 바꾸지 않는다
