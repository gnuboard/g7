rules_layer_coverage:
  - rule: no-storage-disk-direct
    coverage: 소비처는 StorageInterface 경유 — Storage facade 직접 호출 도입 없음
  - rule: repository-interface-injection
    coverage: 서비스 시그니처 무변경 — contextual binding 만 카테고리 디스크로 교체
