feature: 레이아웃 편집기 버전 히스토리 모달 — 최신 행 표시, diff 복귀, 더 보기 상한

description: |
  VersionHistoryModal 단위 시험 가운데 소유 매니페스트(layout-editor-version-preview,
  layout-editor-tree-version-badge-and-modal-scroll)가 선언하지 않은 동작만 여기 둔다. 목록, 복원,
  비교, 확장 타겟 효과는 그 매니페스트의 이름을 그대로 쓴다.

  - 최신 행은 최신 배지를 달고 복원 버튼을 숨긴다.
  - diff 뷰에서 목록으로 돌아온다.
  - 더 보기는 응답이 상한을 채울 때만 나오고, 누르면 상한을 넓혀 다시 조회하며, 서버 최대 상한을
    넘겨 요청하지 않는다.

axes:
  area: [version_list, version_restore, version_compare, extension_target, load_more]

effects:
  - version_latest_row_badged_without_restore
  - version_diff_back_returns_to_list
  - version_load_more_only_when_limit_filled
  - version_load_more_widens_limit_and_refetches
  - version_load_more_clamps_to_server_max

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/components/VersionHistoryModal.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/components/VersionHistoryModal.loadMore.test.tsx
  - resources/js/core/template-engine/layout-editor/__tests__/hooks/useLayoutVersions.loadMore.test.tsx

validation:
  note: |
    Vitest RTL 단위가 fetch 를 가로채 잰다.
