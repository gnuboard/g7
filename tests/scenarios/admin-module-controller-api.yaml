  - module_list_returns_paginated_data
  - custom_menus_included_only_when_requested
  - invalid_with_param_rejected_422
  - list_filters_accepted
  - menus_read_permission_gets_empty_list_with_custom_menus
  - list_without_relevant_permission_forbidden_403
  - abilities_reflect_user_permissions
  - upload_install_rejects_missing_wrong_type_or_oversized_file
  - github_install_requires_valid_github_url
  - valid_github_url_passes_validation
  - invalid_identifier_format_rejected_422
  - install_without_create_permission_forbidden_403
  - install_success_returns_201_with_identifier
  - domain_install_failure_returns_422_with_resolved_message
  - unexpected_install_failure_returns_500
  - unmet_dependency_activation_returns_409_warning
