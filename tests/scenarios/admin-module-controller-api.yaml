feature: 관리자 모듈 관리 API (목록·설치·활성화·changelog·라이선스)

description: |
  /api/admin/modules 계열 엔드포인트는 인증되지 않은 요청을 401 로 막고, 목록은 페이지네이션·필터·custom_menus(with[] 요청 시에만)와
  사용자 권한에 맞는 abilities 를 돌려주며 core.menus.read 만 있으면 빈 목록을, 관련 권한이 없으면 403 을 낸다.
  설치는 파일·GitHub URL·식별자 형식을 422 로 검증하고, 서비스의 도메인 실패는 해석된 문구와 함께 422, 예상 밖 실패는 500 으로 구분한다.
  활성화·비활성화는 의존성 미충족·의존 확장 존재 시 409 경고를 내고 force 로 우회하며, 응답에 모듈 에셋을 싣는다.
  changelog 는 파싱·버전 범위 필터를 지원하고 파일이 없으면 빈 배열, 라이선스는 _bundled 폴백을 쓰고 없으면 404 다.

axes:
  case: [unauthenticated, index_listing, index_permission, index_abilities, install_validation, install_permission, install_service_outcome, dependency_guard, asset_response, changelog, license]

