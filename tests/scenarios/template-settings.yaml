feature: 템플릿 환경설정 (선언 파일·설정 API·설정 화면 교차 등록·명령줄)

description: |
  #434. 템플릿은 PHP 클래스가 없어 `config/settings/defaults.json` 한 벌에서 기본값·검증·노출을 파생한다.
  모듈 설정과 같은 섹션 구조(`_meta.categories`·섹션별 저장 파일·섹션/키 2단 노출·비밀값 암호화)이고,
  직접 쓴 설정 화면이 없으면 켜진 관리자 템플릿의 공용 설정 화면(`admin_template_settings`)이 그린다.
  설정 화면(`templates/{id}/settings/template_settings.g7.html`)은 코어가 켜진 관리자 템플릿에 `{id}.template_settings` 로 교차 등록하고,
  `/admin/templates/{id}/settings` 라우트를 만든다. 보기는 core.templates.read, 저장은 core.templates.settings.

  축: case — 검증하는 표면 하나씩(표면마다 입력 모양이 달라 교차곱 대신 표면 열거).

