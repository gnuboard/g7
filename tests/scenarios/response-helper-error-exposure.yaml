feature: 오류 문구 자리표시자 치환 (ResponseHelper 호출부·예외 생성자·직접 번역 호출 전수)

description: |
  `:error` 같은 자리표시자를 가진 오류 문구 키를 파라미터 없이 불러 운영자 화면에 자리표시자가 그대로 보이는 것을
  막는다. ResponseHelper::error() 호출부 전수, *OperationException 생성자 전수, __()/trans() 단일 인자 직접 호출을
  코드베이스 정적 스캔으로 잰다.

  ResponseHelper 자신의 오류 응답 모양(디버그 여부·상태 코드별 노출)과 문구 번역은
  response-helper-error-shape.yaml 이 소유한다 — 같은 시험(ResponseHelperTest)을 두 매니페스트가 이중 소유하던 것을
  6차 병합 후속에서 그쪽으로 합쳤다(이 매니페스트의 세분 효과 이름도 그쪽 effects 로 옮겼다).

axes:
  method: [error, serverError, moduleError, success]
  caller: [codebase_scan]

exclusions:
  - { method: [serverError, moduleError, success], reason: "자리표시자 치환을 재는 호출부 스캔은 ->error() 호출부와 예외 생성자다 — serverError·moduleError 는 error 로 위임하고 success 는 오류 문구 키를 받지 않는다" }

effects:
  - error_placeholder_keys_always_receive_error_param   # ->error() 호출부 전수가 :error 키에 messageParams 의 'error' 를 싣는다
  - exception_constructors_pass_error_param_for_placeholder_keys   # *OperationException 생성자 전수가 :error 키에 둘째 인자로 'error' 를 싣는다
  - translator_direct_calls_supply_placeholder_params   # __()/trans() 단일 인자 직접 호출이 자리표시자 있는 문구를 만들지 않는다 (Validator 가 채우는 자리는 예외)

test_files:
  - tests/Feature/Http/ErrorMessageParamSubstitutionTest.php
