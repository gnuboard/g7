notes: |
  단위 테스트는 렌더 사이클(React 커밋·useLayoutEffect 클리어·브라우저 스케줄링)을 모사하지 못하므로
  잠금 역할만 한다. 실제 판정(성능 합격선·그림자 검증 불일치 0·표시값 전후 동일)은 브라우저 실측이다.

  파이프·$switch·iteration 변수·$parent computed 는 번들 레이아웃에 사용처가 없어, 미리보기 API 로 등록한
  합성 변형 레이아웃과 E2E(`engine-computed-scope.spec.ts`)로만 브라우저에서 검증된다.
