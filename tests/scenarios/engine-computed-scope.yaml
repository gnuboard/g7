feature: engine_computed_scope

description: |
  템플릿 엔진 표현식·computed 평가 성능 개선 (공개 이슈 140, engine-v1.74.0).

  레이아웃 `computed` 가 렌더되는 모든 DynamicRenderer 인스턴스마다, 재렌더마다 전량 재평가되고,
  표현식 1회 평가가 정규식 전처리·변수 추출·토큰화·파싱을 매번 처음부터 했다. 둘이 곱해져 제보 규모
  화면에서 키 입력마다 메인스레드가 0.5초 안팎 멈췄다.

  핵심 동작:
    - 전처리·변수 추출·AST 는 입력 문자열만으로 정해지므로 모듈 스코프 캐시(값은 담지 않음)
    - computed 는 상태 스코프 단위로 1회 계산하고, 입력이 같은 자식은 부모 값을 물려받는다.
      경계(루트급·iteration 항목·격리 상태·$parent·extensionPoint·미적용 _localInit·편집 모드)는 계산
    - 뒤쪽 키·자기·대상 불명 참조가 있는 정의는 물려받기를 끄고 종전처럼 전 렌더러가 계산(D12)
    - computed 계산 지점(렌더·액션 sequence·라우트 진입·편집기 미리보기)이 공용 평가기 하나를 쓴다 —
      정의 순서 참조, 앞뒤 공백 무시, 파이프·$switch·리터럴 규칙 통일
    - 안전 스위치 G7Core.engineFlags 로 기능별로 끄면 수정 전 계산 경로

axes:
  layer: [expression_cache, ast_cache, engine_flags, computed_evaluator, render_scope, action_sequence, route_entry, translation, structure, browser]

