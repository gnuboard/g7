# 시나리오 매니페스트 — 패키지 무결성(서명 검증·신뢰 키·릴리스 전용 다운로드)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: package_integrity

description: |
  확장(모듈·플러그인·템플릿)·외부 언어팩·코어 설치와 업데이트에 ed25519 패키지 서명 검증을 붙인다.
  서명 파일은 `{identifier}-{version}.zip.sig.json`, 서명 대상 문자열은 PHP·Node 가 같은 바이트로 만든다.

  - 검증기 `PackageSignatureVerifier`: 형식·알고리즘 → 크기·sha256 → 키 신뢰(코어 패키지는 내장 키만, 제작자 키는 vendor 범위 일치)
    → 서명 → 해제 후 manifest 식별자·버전 일치. 내장 키 retired 는 통과, revoked 는 거부. sodium 이 없으면 unverifiable.
  - 미서명 정책 `UnsignedPackagePolicy`: invalid·untrusted 는 늘 422, unsigned·unverifiable 은 차단 스위치면 409 고정(계속 불가),
    아니면 allow_unsigned 없을 때 409 package_unsigned. 차단 스위치는 보안 탭에서 저장한다.
  - 다운로드 경로: GitHub 는 릴리스가 없으면 main·master 로 폴백하지 않고 실패한다. 릴리스 자산에서 서명 짝을 찾고
    비공개 저장소 자산은 octet-stream + 토큰으로 받는다. 서명 자산이 없으면 zipball 을 받기 전에 확인을 묻는다.
  - 확장 설치·업데이트(ZIP·GitHub)·Artisan 명령(옆 `.sig.json` 자동 인식, 비대화형 미서명은 exit 1, --force 는 승인을 대신하지 않음),
    외부 언어팩(업로드 signature, URL 의 checksum·signature_url, GitHub 릴리스 자산), 코어 업데이트(CLI 는 내장 키만,
    웹은 조각 해제 전에 검증하고 착수 409, 확인 응답의 signature_available).
  - 신뢰 키: `extension:trust-key` 명령과 관리자 API 가 vendor 범위·key_id 재계산·예약 vendor(sirsoft) 거부를 같은 규칙으로 판정한다.
    API 는 비밀번호 재확인(비밀번호 없는 관리자는 본인 확인 요구)과 설정 권한을 요구한다. `extension:keygen`·`extension:sign`
    출력은 등록한 키로 검증된다.

  모듈·플러그인·템플릿 설치 시험은 기반 클래스 `ExtensionInstallSignatureTestCase` 의 시험을 세 하위 클래스가 각 유형으로 돈다.
  관리자 화면 쪽은 sirsoft-admin_basic `admin-package-integrity.yaml`, 업데이트 창의 409 분기는
  `extension-update-concurrency.yaml` 이 소유한다.

axes:
  case: [core_cli_signed_builtin, core_cli_unsigned, core_web_fetch_verified, core_web_start_unsigned, install_zip_signed_verified, install_zip_unsigned_confirm, install_zip_block_switch, install_zip_invalid_untrusted, install_github_signature, keygen_sign_roundtrip, trust_key_command_add_list_remove, trust_key_command_rejects, update_github_signed_asset, update_github_unsigned, update_github_missing_or_mismatch, update_zip_signature, update_command_unsigned_noninteractive, language_pack_upload_signature, language_pack_vendor_scope, language_pack_url_signature, language_pack_github_signature, verifier_vendor_key_verified, verifier_tamper_and_mismatch, verifier_trust_scope, verifier_builtin_key_status, verifier_sodium_missing, unsigned_policy, cross_language_vector, trust_key_api_crud, trust_key_api_validation, trust_key_api_passwordless_admin, trust_key_api_forbidden, block_unsigned_setting_saved, github_release_only, github_release_assets, github_private_asset_download, github_signed_asset_new_name, builtin_key_diagnostics, builtin_key_shape_guard, install_legacy_screen_compat, integrity_attribute_labels]

effects:
  # 코어 업데이트
  - core_update_requires_builtin_key_signature                         # CLI 코어 업데이트는 내장 키 서명만 신뢰한다
  - core_update_unsigned_needs_confirmation                            # CLI 코어 업데이트 미서명은 확인(--allow-unsigned) 없이 진행하지 않는다
  - web_core_update_verifies_before_chunked_extract                    # 웹 코어 업데이트는 조각 해제 전에 검증하고 버전을 확인한다
  - web_core_update_start_409_and_signature_available_flag             # 웹 착수 미서명은 409, 업데이트 확인 응답이 signature_available 을 알린다
  # 확장 설치 (모듈·플러그인·템플릿)
  - signed_zip_install_verified_and_recorded                           # 서명된 ZIP 설치는 verified 로 설치되고 integrity 상태가 기록된다
  - unsigned_zip_install_409_then_allow_unsigned_installs              # 미서명 ZIP 은 409 뒤 allow_unsigned 로 다시 보내면 설치된다
  - block_unsigned_switch_overrides_allow_unsigned                     # 차단 스위치가 켜지면 allow_unsigned 를 보내도 설치하지 않는다
  - invalid_or_untrusted_zip_rejected_without_files                    # 변조·미신뢰 ZIP 은 거부되고 파일이 남지 않는다
  - github_install_uses_signed_asset_or_asks_before_zipball            # GitHub 설치는 서명 자산을 쓰고, 없으면 zipball 을 받기 전에 묻는다
  # 확장 업데이트
  - github_update_downloads_signed_asset_and_verifies_before_backup    # GitHub 업데이트는 서명 자산을 받아 백업 전에 검증한다
  - github_update_unsigned_asks_before_zipball_download                # 서명 자산이 없으면 zipball 다운로드 전에 확인을 묻는다
  - github_update_missing_release_or_version_mismatch_rejected         # 태그 릴리스가 없거나 버전이 다르면 거부한다
  - zip_update_auto_detects_sidecar_signature                          # ZIP 업데이트는 옆 .sig.json 을 자동 인식하고 --signature 옵션을 받는다
  - noninteractive_unsigned_update_exits_1_and_force_does_not_bypass   # 비대화형 미서명 업데이트는 exit 1, --force 는 승인을 대신하지 않는다
  - yes_option_does_not_answer_unsigned_confirmation                   # --yes(-y) 는 진행 확인에만 답한다 — 비대화형 미서명은 exit 1, 대화형은 -y 가 있어도 묻는다
  - console_unsigned_refusal_has_no_screen_wording                     # 명령줄 미서명 거절 문장에 화면 단추 안내(「미서명으로 계속」을 눌러)가 섞이지 않는다
  # 외부 언어팩
  - language_pack_upload_signature_verified_or_confirmed               # 업로드는 signature 파일이 있으면 검증, 없으면 확인을 묻는다
  - language_pack_manifest_vendor_checked_against_key_scope            # manifest vendor 가 키 범위 밖이면 untrusted
  - language_pack_url_install_checks_checksum_and_signature_url        # URL 설치는 checksum 과 signature_url 을 함께 검사한다
  - language_pack_github_install_uses_signed_release_asset             # GitHub 설치는 서명된 릴리스 자산을 쓰고 API 는 409 로 묻는다
  # 검증기·정책
  - package_signed_by_trusted_vendor_key_is_verified                   # 신뢰한 제작자 키로 서명된 패키지는 verified
  - tampered_or_mismatched_package_is_invalid                          # 변조·크기·해시·식별자·버전 불일치는 사유별로 invalid
  - untrusted_key_or_vendor_scope_or_core_rejected                     # 미등록 키·vendor 범위 밖·코어 패키지의 제작자 키는 거부
  - builtin_retired_passes_revoked_rejected                            # 내장 키 retired 는 통과, revoked 는 거부
  - sodium_missing_marks_unverifiable_and_follows_unsigned_policy      # sodium 이 없으면 unverifiable 이고 미서명 정책을 따른다
  - unsigned_policy_confirm_block_switch_and_hard_reject               # 미서명 409·차단 스위치 409 고정·invalid/untrusted 422 판정
  - php_and_node_signatures_are_byte_identical                         # PHP 와 Node 서명 대상 바이트·서명이 교차 벡터로 같다
  # 신뢰 키·서명 도구
  - keygen_sign_output_verifies_with_registered_key                    # extension:keygen·extension:sign 출력이 등록한 키로 검증된다
  - trust_key_registered_with_vendor_scope_and_computed_key_id         # trust-key 명령이 vendor 범위와 다시 계산한 key_id 로 등록·목록·삭제한다
  - trust_key_requires_vendor_scope_and_rejects_reserved_sirsoft       # vendor 범위가 없거나 예약 vendor(sirsoft)·잘못된 키는 거부(명령·API 공통)
  - trust_key_api_requires_password_and_computes_key_id                # API 등록·조회·삭제는 비밀번호 재확인을 요구하고 key_id 를 계산한다
  - trust_key_api_passwordless_admin_gets_identity_challenge           # 비밀번호 없는 관리자는 본인 확인 요구를 받는다
  - trust_key_api_requires_settings_permission                         # 설정 권한 없는 관리자는 403
  - block_unsigned_switch_saved_with_security_tab                      # 미서명 차단 스위치는 보안 탭 저장으로 저장된다
  # GitHub 릴리스 전용 다운로드
  - github_install_without_release_fails_without_branch_fallback       # 릴리스가 없으면 main·master 폴백 없이 github_release_not_found
  - language_pack_github_release_not_found_is_422                       # 언어팩 GitHub 설치도 릴리스가 없으면 500 이 아니라 422 와 사유로 답한다
  - release_assets_listed_and_signed_pair_found                        # 릴리스 응답에 assets 가 실리고 ZIP·서명 짝을 찾는다
  - private_release_asset_downloaded_with_octet_stream_and_token       # 비공개 저장소 자산은 octet-stream 과 토큰으로 받는다
  - release_signature_new_name_preferred_and_legacy_name_still_read  # 릴리스 서명 파일은 {base}.sig.json 우선, 옛 {base}.zip.sig.json 도 읽는다(7.2.0 호환)
  # 내장 신뢰 키 진단 (계획서 §8)
  - about_shows_package_integrity_section_with_empty_builtin_warning   # about 에 패키지 무결성 구획이 나오고 내장 키가 비면 경고한다
  - core_check_updates_warns_when_no_usable_builtin_key                # 코어 업데이트 확인은 쓸 수 있는 내장 키가 없을 때만 경고한다
  - trust_key_list_warns_when_no_usable_builtin_key                    # extension:trust-key list 도 같은 판정(폐기 아닌 내장 키 0)으로 경고한다
  - legacy_screen_without_marker_installs_unsigned_but_keeps_hard_blocks  # 무결성 표식(integrity_aware)이 없는 옛 관리자 화면 요청은 미서명을 7.1 처럼 설치해 unsigned 로 기록하고 경고 로그를 남기며, 차단 스위치·서명 불일치·미신뢰 키는 그대로 막는다(확장 ZIP·GitHub, 언어팩, 업데이트 요청, 코어 착수)
  - builtin_keys_have_valid_shape_and_no_test_keys                     # 코어 내장 키 목록은 기록한 수와 같고, key_id 재계산·raw 32바이트 base64·TrustKeyStatus 상태 값을 지키며 시험 전용 키(fixture 공개키·TEST 이름)가 없다
  - integrity_rule_keys_have_field_labels                              # 무결성 트레잇이 준 검증 키(allow_unsigned·integrity_aware·signature·signature_url)는 그 트레잇을 쓰는 모든 요청에서 ko·en 칸 이름 라벨을 갖는다

