feature: IDV 가드 토스트 중복 억제 — 코어 handleToast

description: |
  provider 가 부가 목적 미달(성인인증 등) 사유 토스트를 이미 띄우고 markDomainNoticeShown() 신호를 남기면,
  코어 handleToast 가 같은 사이클의 generic IDV 가드 error 토스트 1건을 건너뛴다.
  신호가 없거나, IDV 가드가 아닌 error 토스트이거나, success 토스트면 그대로 표출한다. 신호는 1회 소비된다.
  플러그인 쪽 신호 발신은 `plugins/_bundled/sirsoft-verification_kginicis/tests/scenarios/adult-verification-guard.yaml` 이 소유한다.

axes:
  case: [signal_guard_error, no_signal_guard_error, signal_non_guard_error, signal_success_toast, signal_consumed_once]

effects:
  - guard_error_toast_skipped_when_domain_notice_signaled
  - guard_error_toast_shown_without_signal
  - non_guard_error_toast_not_skipped
  - success_toast_not_skipped
  - domain_notice_signal_consumed_once

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.identityGuardToastSuppress.test.ts
