# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변종이다. range, step_type 은 runUpgradeSteps 에만, filename 은 스텝 파일명 파싱에만 쓰이므로 subject 와 곱한 조합 대부분이 명목상이다. 회귀 가드는 effects 이고 모든 effect 가 test_files 의 @effects 로 귀속된다.
feature: 확장 버전별 업그레이드 스텝 실행 (runUpgradeSteps, UpgradeContext, 스텝 파일명 규약)

description: |
  ModuleManager::runUpgradeSteps() 는 확장이 선언한 업그레이드 스텝 중 fromVersion 초과 toVersion 이하만 버전순으로
  실행한다(프리릴리스 포함). 두 버전이 같으면 아무것도 실행하지 않지만 force 이면 그 버전의 스텝만 실행하고, force 라도
  버전이 다르면 일반 범위 규칙을 따른다. 스텝은 UpgradeStepInterface 나 callable 이며 UpgradeContext 를 받고, 스텝 예외는
  전파된다. UpgradeContext::withCurrentStep() 은 새 인스턴스를 만든다. 스텝 파일명(Upgrade_X_Y_Z, 프리릴리스 접미사 포함)은
  일반, 프리릴리스 버전으로 파싱되고 형식이 어긋난 이름은 매칭되지 않는다.

axes:
  subject: [runUpgradeSteps, UpgradeContext, step_filename]
  range: [empty_steps, normal_range, reversed_order, equal_versions, force_same_version, force_same_prerelease, force_different_versions, prerelease_range]
  step_type: [interface, callable, failing]
  filename: [standard, prerelease, invalid]

exclusions: []

effects:
  - empty_steps_no_op
  - steps_filtered_by_version_range
  - steps_executed_in_version_order
  - callable_step_receives_context
  - step_exception_propagates
  - context_with_current_step_is_immutable
  - equal_versions_run_nothing
  - force_same_version_runs_that_step
  - force_same_prerelease_runs_that_step
  - force_different_versions_uses_normal_range
  - filename_parses_standard_version
  - filename_parses_prerelease_version
  - filename_rejects_invalid_names
  - prerelease_range_filtered

test_files:
  - tests/Unit/Extension/UpgradeStepsTest.php
