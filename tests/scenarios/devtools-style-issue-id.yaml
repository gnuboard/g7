feature: DevTools 스타일 이슈 id — 추적기가 감지한 이슈도 id 를 가진다

description: |
  G7DevToolsCore 는 스타일 이슈를 styleIssues 에 쌓고 getStyleValidationInfo() 로 내보낸다. 이슈 타입(StyleIssue)은 id 를
  필수로 갖는데, StyleTracker 는 id 없는 이슈를 넘기고 코어는 받은 그대로 저장해 추적기 경로 이슈만 id 가 비어 있었다
  (#869 타입 검사가 private 접근과 함께 드러냄). 코어가 id 없는 이슈에 id 를 붙여 저장한다. 중복 판정
  (컴포넌트, 타입, 속성)은 그대로다.

axes:
  source: [style_tracker, core]

effects:
  - devtools_style_issue_has_id

test_files:
  - resources/js/core/devtools/__tests__/StyleTracker.issueId.test.ts
