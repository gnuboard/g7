# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변종이다. accept, endpoint 는 비인증 접근 시험에만 의미가 있고 login, logout, refresh 는 관리자에게만 시험하므로 actor 와 action 을 곱한 조합 대부분이 명목상이다. 회귀 가드는 effects 이고 모든 effect 가 test_files 의 @effects 로 귀속된다.
feature: 관리자 API 인증 (로그인, 로그아웃, 토큰 갱신, 비인증과 일반 사용자 차단)

description: |
  관리자는 관리자 로그인 API 로 Bearer 토큰을 받고, 로그아웃과 토큰 갱신을 할 수 있으며 갱신한 토큰으로 다시 접근된다.
  비인증 또는 무효 토큰으로 /api/admin/* 에 접근하면 Accept 헤더가 없거나 text/html 이어도 로그인 리다이렉트가 아니라
  401 JSON 으로 답한다(bootstrap/app.php 의 api/* 가드, 공개#39). 관리자 권한이 없는 일반 사용자는 403 으로 막힌다.

axes:
  actor: [admin, regular_user, guest, invalid_token]
  action: [login, logout, refresh, access_admin_api]
  accept: [json, none, html]
  endpoint: [auth_user, dashboard_resources]

exclusions: []

effects:
  - admin_login_issues_bearer_token
  - admin_logout_succeeds
  - guest_admin_api_401
  - guest_without_accept_gets_401_json_not_redirect
  - guest_html_accept_gets_401_json
  - invalid_token_gets_401_without_redirect
  - other_admin_endpoint_401_without_redirect
  - regular_user_admin_api_403
  - token_refresh_issues_usable_token

test_files:
  - tests/Feature/Api/Admin/AdminAuthTest.php
