feature: 확장 업데이트 확인의 GitHub 조회 실패(check_error)를 종료 코드로 드러낸다

description: |
  모듈·플러그인·템플릿 업데이트 확인(check*Update)은 GitHub 조회에 실패해도 예외 없이 번들로 대체하거나 「업데이트 없음」으로
  답해, 비대화형 실행이 「확인하지 못함」을 「최신」으로 읽었다. 이제 조회에 실패하면(연결 실패·404 가 아닌 실패 응답·주소 해석
  실패) 응답에 `check_error`(사유)를 싣는다. 릴리스가 아직 없는 것(404)은 실패가 아니다.
  - `{type}:update --source=github`(--dry-run 포함): 사유 출력 + 종료 코드 1 (번들로 대체하지 않음)
  - `{type}:update`(소스 자동): 번들 판정 유지 + 「GitHub 조회 실패, 번들 기준으로 판정」 경고 한 줄
  - `{type}:check-updates [identifier]`: 실패 표 + 종료 코드 1, 그 확장의 DB `update_available`·`latest_version`·`update_source` 를 덮지 않음
    (번들에 더 새 판이 있어도 — 번들 판은 출력에만 보인다)
  - 회귀: 조회 성공·릴리스 없음은 종료 코드 0

# 축 의미:
#   case — GitHub 응답(500·503·연결 실패·200·404)과 진입 명령(manager·update·update --dry-run·check-updates)의 조합.
axes:
  case:
    - check_error_on_github_failure
    - check_error_on_connection_failure
    - update_source_github_fails
    - update_auto_falls_back_with_warning
    - check_updates_fails_and_keeps_db
    - check_updates_fails_with_newer_bundled
    - successful_check_regression

effects:
  - update_check_carries_check_error
  - update_source_github_exits_one_on_check_error
  - update_auto_uses_bundled_with_warning
  - check_updates_exits_one_and_keeps_db_on_check_error
  - successful_check_exits_zero

test_files:
  - tests/Feature/Extension/ExtensionCheckUpdateErrorTest.php
