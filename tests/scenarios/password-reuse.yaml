# audit:allow test-scenario-coverage[cross_product] reason: |
#   진입 경로 × 재사용 설정 × 본인 증명 조합은 각 테스트가 메서드 안에서 경로별로 직접 돌린다(경로마다 요청 형태가
#   달라 한 조합 표로 펼치면 대부분이 성립하지 않는다). effects·test_files 는 계속 검사한다.

feature: 비밀번호 재사용 금지·변경 기록·다른 기기 로그아웃 (#736)

description: |
  본인 비밀번호를 바꾸는 모든 경로(메일 재설정·마이페이지·정보수정 API·관리자 본인)에 최근 N개 재사용 금지를
  걸고, 관리자가 다른 회원의 비밀번호를 정할 때는 걸지 않는다(그 회원이 다음 로그인 때 바꾼다). 재사용 검사는
  본인 증명(재설정 토큰·현재 비밀번호) 뒤에만 돌아 추측 오라클이 되지 않는다.

  모든 비밀번호 쓰기는 PasswordChangeService 한 곳에서 변경일·표지·변경 요구 플래그·이력(최대 9건)을 기록하고,
  경로·행위자를 아는 core.auth.password_change_recorded 를 발행한다. 본인 변경은 현재 기기만 남기고, 재설정·관리자
  지정은 모든 기기를 로그아웃시킨다. 정보수정 API 로 비밀번호를 바꿀 때도 전용 경로와 같은 본인인증 정책을 걸고
  원문을 로그·훅 인자에 남기지 않는다. 관리자 본인 변경은 현재 비밀번호를 확인한다.

axes:
  entry_point: [register, reset_password, change_password, update_profile, admin_update_user, admin_create_user, install, login_rehash, login_password_change]
  reason: [expired, admin_assigned]
  target: [self, other]
  reuse_setting: [off, n1, n3]
  input_state: [current_password, recent_password, old_password]
  proof: [valid, invalid]
  sessions: [current_and_other]

effects:
  - reuse_rule_off_allows_any
  - reuse_blocks_current_and_recent_n_minus_one
  - reuse_applies_to_every_self_path
  - reuse_check_runs_only_after_proof
  - admin_assigned_password_skips_reuse
  - history_capped_at_nine
  - history_purged_on_withdraw_and_delete
  - changed_at_recorded_on_create
  - reset_records_change_and_logs_reset
  - self_change_records_and_logs_self
  - login_stage_records_reason_specific_log
  - admin_assignment_sets_change_required
  - rehash_is_not_a_change
  - self_change_keeps_current_device_only
  - reset_and_admin_revoke_every_session
  - profile_update_password_enforces_idv_policy
  - profile_update_without_password_unaffected
  - password_originals_never_logged
  - admin_self_change_requires_current_password
  - admin_assignment_needs_no_current_password

