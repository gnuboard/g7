# 레이아웃 편집기 페이지 설정 초기 상태와 입력 기본 부품 (π1)
# tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_page_state_pi1

description: |
  페이지 설정의 초기 상태 폼(initLocal, initGlobal, initIsolated)과 값 편집기, 부모/자식 상속 매트릭스(I1~I18)를 다룬다.
  키-값 칩 편집기, 바인딩 칩 텍스트 입력(토큰 분해, 슬롯, 이동, 삽입, 제거), 공용 입력 부품(토글, 비활성 묶음, 출처 칸)을
  시험 단위로 잠근다.

axes:
  subject: [initial_state_inheritance, initial_state_isolated_inheritance, initial_state_form_isolated, initial_state_form, initial_state_value_editor, key_value_chip_editor, binding_chip_text_input, form_primitives]

