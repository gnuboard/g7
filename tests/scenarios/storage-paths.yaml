feature: storage 경로 분류 — config/g7-storage.php 와 storage:paths

description: |
  storage/ 아래 경로를 운영 데이터(shared_data)·서버별 파일(server_local)·업데이트 상태(update_state)·임시 파일
  (temporary) 네 목록으로 선언한다. 백업 대상과 서버 간 공유 경로를 정할 때 쓰는 목록이며 `php artisan storage:paths
  [--json]` 로 본다. 목록은 서로 겹치지 않고, 코어 업데이트 보호 경로(storage 전체)와 모순되지 않는다. 코드의
  storage_path(…) 정적 접두와 디스크 루트는 모두 네 목록 중 하나에 들어야 한다.

test_files:
  - tests/Unit/Config/StoragePathsConfigTest.php
  - tests/Unit/Architecture/StoragePathsClassifiedTest.php

axes:
  case:
    - lists
    - protected_paths
    - command
    - code_paths
    - disk_roots

effects:
  - lists_relative_and_disjoint
  - classified_paths_protected_by_core_update
  - command_json_lists_categories
  - code_storage_paths_classified
  - disk_roots_classified
