# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 축은 시험 주석(@scenario)에서 모은 입력 변종이고, 회귀 가드는 effects 다 — 모든 effect 가 test_files 의 @effects 로 귀속된다.

feature: "로그인 인계 코드의 브라우저 묶기"

description: |
  로그인 인계 코드의 브라우저 묶기
  인계 코드는 발급한 브라우저의 묶음 쿠키(`g7_login_bind`)가 있어야만 교환된다 — 공격자가 자기 신원으로 받은 코드를 피해자
  브라우저에 넣어 로그인시키는 로그인 CSRF 를 막는다. 쿠키가 다르거나 없으면 코드를 소비하고 같은 422 로 답한다.
  무묶음 로그인 인계 발급 명령 `auth:handoff-issue`
  실측·시험용으로 브라우저에 묶지 않은 코드를 만든다 — 묶음 쿠키 없이 교환되고, 운영 환경에서는 거절한다.

axes:
  context: [other, owner]
  cookie: [same, different, missing, absent, present, "present|absent"]
  guard: [user, admin, invalid, "bypass_missing|production"]
  binding: [none, ticket]
  env: [local, production]
  user: [missing]

effects:
  - other_context_redeem_422
  - code_consumed_by_mismatch
  - owner_context_redeem_200
  - bound_ticket_exchanges_with_cookie
  - bound_ticket_rejected_without_cookie
  - handoff_fixture_refused
  - bound_code_exchanges_with_same_cookie
  - bound_code_rejected_with_other_cookie
  - bound_code_consumed_on_mismatch
  - bound_code_rejected_without_cookie
  - unbound_code_exchanges_without_cookie
  - ticket_cookie_attributes
  - ticket_exchanges_with_cookie
  - handoff_command_refused_in_production
  - handoff_command_rejects_bad_input

test_files:
  - tests/Playwright/specs/auth/auth-handoff-binding.spec.ts
  - tests/Feature/Console/PlaywrightIssueHandoffTest.php
  - tests/Feature/Auth/LoginHandoffBindingTest.php
  - tests/Feature/Auth/AuthHandoffIssueCommandTest.php
