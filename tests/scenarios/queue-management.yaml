# audit:allow test-scenario-coverage[cross_product] reason: |
#   큐 관리 API 는 목록(대기·실패·처리 기록) × 동작(재시도·삭제) × 배치(등록·미등록·sync) 축이 서로 독립이다.
#   목록 필터는 한 테스트가 행 묶음을 심고 검색 대상·필터마다 응답을 대조하고, 재시도 배치는 경우마다 한 메서드로
#   나눈다(조합을 곱하면 같은 판정을 반복할 뿐이다). 화면 축(e2e)은 S6 의 Playwright spec 이 덮는다. effects·test_files 는
#   계속 검사한다.

feature: 큐 관리 — 대기·실패·처리 기록 조회, 실패 작업 재시도·삭제, 처리 기록·보관 기간 (#17)

description: |
  스케줄 관리 화면의 큐 탭이 쓰는 백엔드. `/api/admin/schedules/queue/*` 로 워커 상태 요약·대기 작업(database
  드라이버만 측정)·실패 작업(검색·필터·상세)·처리 기록을 조회하고, 실패 작업을 건별·일괄(요청당 100건) 재시도·삭제한다.
  재시도는 queue:retry 를 부르지 않고 RetryCommand 절차를 옮기되, 원래 연결·큐를 큐 워커 등록 목록(#780)으로 다시
  해석해 워커가 보지 않는 곳에 되넣지 않으며, sync 처럼 워커가 없는 드라이버면 거부한다. 처리 기록 리스너는 워커가
  마친 작업마다 성공·실패 1행을 남기고(sync 는 요청 종료에 일괄), 재시도 대기는 남기지 않는다. 처리 기록과 실패
  작업은 보관 기간 설정 1개(drivers.queue_record_retention_days, 기본 7일)를 함께 따르고 queue:prune-records 가 정리한다.

coverage_strategy: pairwise

axes:
  permission: [anonymous, none, read_only, full]
  list: [pending, failed, logs]
  driver: [database, sync]
  search_field: [all, job, error, uuid]
  action: [retry, retry_bulk, delete, delete_bulk]
  placement: [registered, unregistered_connection, non_worker_driver]
  connection: [sync, database]
  result: [processed, failed, released]
  switch: [enabled, disabled, excluded]
  retention_source: [default, setting, days_option]
  e2e: [queue_tab_failed_retry]
  sort: [default, created_at, available_at, attempts, failed_at, id, finished_at, duration_ms]

effects:
  - queue_api_requires_auth
  - queue_api_permission_gate
  - pending_list_parses_payload
  - pending_list_search
  - pending_list_unmeasurable_driver
  - failed_list_filters
  - failed_list_abilities
  - failed_detail_hides_serialized_command
  - retry_pushes_back_and_forgets
  - retry_fires_retry_requested
  - retry_falls_back_to_registered_connection
  - retry_refuses_non_worker_driver
  - retry_missing_is_404
  - bulk_retry_per_item_results
  - bulk_limit_100
  - delete_forgets_failed_job
  - logs_list_filters
  - status_carries_k7_summary
  - list_request_keys_match_k8
  - list_request_bounds
  - validation_messages_use_labels
  - parser_reads_display_meta
  - parser_reads_schedule_id
  - parser_tolerates_broken_payload
  - sync_records_buffered_until_flush
  - processed_row_has_timing
  - sync_records_flushed_on_terminate
  - sync_buffer_flushes_at_limit
  - failed_row_has_exception
  - released_job_not_recorded
  - log_can_be_disabled
  - log_excluded_jobs
  - worker_records_immediately
  - retry_then_processed_chain
  - prune_uses_retention_setting
  - prune_covers_logs_and_failed
  - prune_days_option_bounds
  - settings_keys_have_defaults
  - retention_setting_bounds_enforced
  - retention_days_clamped_to_default
  # 목록 정렬 기준은 목록마다 정한 열만, 정렬 순서는 asc·desc 만 받는다(#17 K-U3)
  - list_sort_whitelist
  # 대기·실패·처리 기록 목록이 sort_by·sort_order 로 정렬되고(동점은 id), 지정이 없으면 기존 최근순이다
  - list_sort_orders_rows

