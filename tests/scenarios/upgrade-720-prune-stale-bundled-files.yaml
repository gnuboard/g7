feature: upgrade_720_prune_stale_bundled_files

description: |
  코어 7.2.0 데이터 스텝 `11_PruneStaleBundledFiles`.
  7.1.x 부모의 증분 파일 적용은 번들 확장 디렉토리 내부의 지워진 파일을 남긴다. 뒤이은 확장 갱신이 `_bundled` 를
  활성 디렉토리로 통째 복사해 7.2.0 이 지운 옛 조각(쇼핑몰 `register-currency-field`, 마케팅 `user-marketing-register`,
  게시판 `user-notification-settings` 등)이 다시 등록돼 가입·회원 화면에 문구 키와 중복 칸이 보였다.
  동결 목록에 있고 본문이 이전 배포본과 같은 `_bundled` 파일만 지우고, 활성 디렉토리·고친 파일·목록 밖 파일은 둔다.

coverage_strategy: full

axes:
  case: [register_fragments_7_1_6, guarded_files, line_endings_and_rerun, class_files_retained, frozen_manifest]

effects:
  - stale_bundled_fragment_removed               # 7.1.6 판 옛 조각이 _bundled 에서 지워진다
  - update_copies_only_head_fragments            # 그 뒤 확장 갱신이 만든 활성 디렉토리에는 새 판 조각만 남는다
  - active_dir_untouched_by_core_step            # 갱신 전 활성 디렉토리는 코어 스텝이 건드리지 않는다
  - modified_file_kept_with_warning              # 본문이 바뀐 파일은 보존하고 경고를 남긴다
  - unlisted_and_custom_files_kept               # 목록 밖 파일·사용자 커스텀 확장은 보존한다
  - crlf_checkout_recognized                     # CRLF 체크아웃도 배포본으로 인식한다(LF 정규화 해시)
  - emptied_subdirectories_pruned                # 비게 된 하위 디렉토리를 정리한다
  - extension_root_kept                          # 확장 루트 디렉토리는 남긴다
  - prune_is_idempotent                          # 두 번 실행해도 같다
  - manifest_paths_inside_bundled_extensions     # 동결 목록은 번들 확장 내부 경로만 담는다
  - manifest_paths_absent_from_current_bundle    # 동결 목록의 경로는 현재 번들에 실재하지 않는다
  - manifest_covers_every_removed_bundled_file   # 7.1.x 태그에서 지운 번들 파일을 빠짐없이 담는다
  - src_php_class_files_retained                 # 확장 src/ 의 PHP 클래스 파일은 남긴다(옛 클래스맵·훅 캐시가 가리키는 동안 500 방지)
  - non_class_files_still_pruned                 # 같은 확장의 화면 조각·시험 PHP 파일은 지운다

test_files:
  - tests/Feature/Upgrades/Upgrade720PruneStaleBundledFilesTest.php
