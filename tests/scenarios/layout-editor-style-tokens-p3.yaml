# π3 레이아웃 편집기 시험 표식 부채 채우기 — 이 매니페스트는 아래 test_files 의 각 시험이 재는 효과를
# 시험 단위로 선언한다. 축 surface 은 시험 대상 단위이다.

feature: 레이아웃 편집기 스타일 토큰 — 셀 색 스킴별 교체와 S7 후속 스타일 컨트롤 적용과 역해석

description: |
  셀 색 토큰의 라이트와 다크 스킴 교체, 그림자와 테두리와 텍스트 서식 컨트롤의 적용과 역해석, 굵기 컨트롤 충돌 회피를 잰다.

axes:
  surface: [cell_color_scheme, s7_style_controls]

effects:
  - cell_color_pure_function
  - cell_color_empty_result_is_empty_string
  - cell_color_keeps_non_group_tokens
  - cell_border_bg_color_applied_per_scheme_as_classtoken
  - style_container_box_controls_attached
  - style_font_weight_excludes_font_bold
  - style_text_align_justify_roundtrip
  - style_whitespace_replaced
  - style_text_format_toggles
  - style_overflow_roundtrip
  - style_opacity_roundtrip
  - style_border_radius_roundtrip
  - style_border_color_independent_of_style
  - style_border_style_cleans_width_tokens
  - style_box_shadow_roundtrip
  - style_new_controls_declared

test_files:
  - resources/js/core/template-engine/layout-editor/__tests__/spec/cellColorScheme.test.ts
  - resources/js/core/template-engine/layout-editor/__tests__/spec/s7-followup-style-controls.test.ts
