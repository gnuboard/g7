feature: iteration 과 if 를 함께 쓴 노드가 항목별로 조건을 평가한다 (배포 번들 DynamicRenderer 기준)

description: |
  조건이 항목 변수(`{{comment.depth === 0}}` 등)를 참조하면 부모 시점 컨텍스트에는 그 변수가 없다. 조건을
  iteration 보다 먼저 평가하던 구조에서는 조건이 늘 거짓이 돼 목록 전체가 사라졌다(예외·콘솔 경고 없음).
  소스는 DynamicRenderer.iterationCondition.test.tsx, 봇(PHP) 렌더러는 SeoIterationConditionParityTest 가
  잠그고, 이 매니페스트는 브라우저에서 배포 번들의 DynamicRenderer 를 직접 렌더한 결과를 잠근다.

  축 case 는 조건이 참조하는 변수의 갈래와 자동 변수 주입이다.
    - item_variable_condition: 항목 변수만 참조 → 항목별 평가
    - outer_variable_only_condition: 외곽 변수만 참조 → 종전대로 목록 전체를 막거나 보인다
    - repository_mixed_condition: 저장소 실사용 작성(게시판 댓글 접기, 항목 변수 + `_local`·`$computed`)
    - item_index_variable: `{item_var}_index` 자동 변수가 단발 렌더 경로에도 주입된다

axes:
  case: [item_variable_condition, outer_variable_only_condition, repository_mixed_condition, item_index_variable]

effects:
  - iteration_renders_matching_items        # 항목 조건이 참인 항목만 렌더되고 목록 전체가 사라지지 않는다
  - outer_only_condition_gates_whole_list   # 외곽 변수만 쓴 if 가 거짓이면 항목 0개, 참이면 전부 렌더된다
  - iteration_injects_item_index            # `{item_var}_index` 가 0부터 항목 순서대로 주입된다

test_files:
  - tests/Playwright/specs/iteration-condition-render.spec.ts
