feature: custom 예약 자리 라우트·뷰·번역·마이그레이션·개발자 프로바이더 (#792)

description: |
  routes/web.php 맨 앞에서 routes/custom.php 를 custom.screen 묶음(정식 주소 이동·봇 표식·봇 기록·
  서버 폴백 집계)으로 불러와 G7 화면 catch-all 보다 먼저 등록한다. 등록하지 않은 주소는 G7 셸이 그린다.
  코어 예약 주소(/api·/plugins·/modules·/_boost·/build·/storage·/install·/dev, /sitemap.xml·/sitemap-{n}.xml, 정적 자산 확장자)를 가리는
  라우트는 등록하지 않고 경고한다. .html 뷰는 custom 뷰에서만 파일 그대로, lang/custom 은 custom 번역
  네임스페이스, database/migrations/custom 은 마이그레이션 경로, App\Custom\CustomServiceProvider 는 마지막에 등록.

test_files:
  - tests/Feature/Custom/CustomRouteTest.php
  - tests/Feature/Custom/CustomReservedServiceProviderTest.php
  - tests/Feature/Custom/CustomCheckCommandTest.php

