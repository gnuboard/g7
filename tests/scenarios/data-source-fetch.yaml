feature: 레이아웃 데이터 소스 로드 — 소스 해석 경로·파라미터 치환·조건부 선택·에러와 fallback

description: |
  레이아웃의 `data_sources` 는 엔진의 DataSourceManager 가 불러온다. 한 소스가 화면에 닿기까지
  세 단계를 거친다.
    1) 선택 — `if` 조건으로 같은 id 의 후보 중 하나를 고르거나 소스를 뺀다(filterByCondition).
    2) 해석 — 소스 타입과 인증 요구에 따라 값을 얻는 경로가 갈린다. 정적 값·라우트/쿼리 파라미터는
       요청 없이 채우고, API 소스는 인증이 필요 없으면 일반 fetch, 필요하면 ApiClient 로 부른다.
       인증이 필요한데 토큰이 없으면 요청을 보내지 않고 fallback 으로 채운다. 요청 파라미터의
       `{{route.*}}`·`{{query.*}}`·파이프·`||` 폴백은 보내기 전에 값으로 치환한다.
    3) 결과 — 응답·`errorCondition`·`errorHandling`·`fallback` 이 어떤 순서로 무엇을 결과에 남기는지,
       그리고 한 번 성공한 소스가 이후 실패에도 마지막 값을 지키는지 — 단 권한 오류(401·403)는
       지키지 않고 비운다(보관 값은 계정을 가리지 않는다).

  축은 2) 의 해석 경로 하나다. 경로마다 호출되는 전송 수단(없음·fetch·ApiClient)과 결과를 채우는
  주체가 다르고, 1)·3) 의 행동은 효과(effects)로 잠근다.

axes:
  resolution_path: [static_inline, route_params, query_params, public_fetch, auth_api_client, auth_skipped_no_token, optional_auth_fetch]

effects:
  # 소스 타입별 해석
  - static_source_returns_inline_data
  - route_params_source_returns_route_params
  - query_params_source_returns_query_object
  - public_api_uses_plain_fetch_with_declared_method
  - public_api_appends_params_to_query_string
  - auth_api_get_goes_through_api_client_without_api_prefix
  - auth_api_post_sends_params_as_body
  # 요청 파라미터 치환
  - route_placeholder_in_params_substituted
  - piped_param_with_arguments_sent_evaluated_not_raw
  - piped_param_without_arguments_not_read_as_bitwise_or
  - query_dot_notation_in_params_substituted
  - query_bracket_notation_in_params_substituted
  - or_fallback_applied_when_query_key_missing
  - or_fallback_skipped_when_query_key_present
  # auto_fetch·캐시
  - auto_fetch_false_source_not_loaded
  - fetched_data_cached_by_source_id
  - clear_cache_drops_cached_data
  # fetch 경로 에러 전달
  - fetch_failure_invokes_on_error_callback
  - fetch_http_error_preserves_status_on_error
  # 조건부 선택 (filterByCondition)
  - source_without_if_always_selected
  - source_with_truthy_if_selected
  - source_with_falsy_if_dropped
  - first_satisfied_source_wins_among_same_id
  - negated_if_condition_evaluated
  - if_condition_reads_query_context
  - if_condition_reads_global_state
  - compound_logical_if_condition_evaluated
  - ternary_if_condition_evaluated
  - selected_source_keeps_its_other_properties
  - distinct_source_ids_filtered_independently
  # errorHandling 과 fallback 의 우선순위
  - error_handling_runs_even_when_fallback_exists
  - last_successful_value_kept_after_later_failure
  - auth_failure_does_not_keep_last_successful_value
  - error_without_fallback_or_handler_leaves_result_empty
  - fallback_used_when_no_error_handler_resolved
  # errorCondition — 성공 응답을 에러로 판정
  - error_condition_true_triggers_error_handling
  - error_condition_false_returns_response
  - absent_error_condition_keeps_success_path
  - error_condition_without_fallback_reports_error_state
  - error_condition_with_fallback_reports_success_with_fallback
  # 인증 요구와 토큰 유무
  - required_auth_without_token_skips_request_and_uses_fallback
  - required_auth_without_token_or_fallback_leaves_result_empty
  - required_auth_with_token_calls_api
  - optional_auth_without_token_falls_back_to_plain_fetch
  # 요청 위생 — 값 없는 파라미터·예정된 실패의 콘솔 기록 (engine-v1.79.0)
  - undefined_or_null_get_params_left_out_of_query_string
  - suppressed_failure_not_logged_as_console_error
  - auth_skipped_request_not_logged_as_console_error
  - unhandled_failure_still_logged_as_console_error

test_files:
  - resources/js/core/template-engine/__tests__/DataSourceManager.test.ts
  - resources/js/core/template-engine/__tests__/DataSourceManager.requestHygiene.test.ts

notes: |
  테스트 53건(DataSourceManager.test.ts 46, requestHygiene 7) 전부가 `@effects` 를 갖는다. `@scenario` 는 해석 경로가 테스트 안에서 하나로
  정해지는 건에만 단다 — filterByCondition 단독 테스트(요청을 보내지 않는다), auto_fetch=false
  테스트(해석 자체를 건너뛴다), 인증 요구를 선언하지 않은 채 ApiClient 실패를 모킹하는 에러 우선순위
  테스트 2건은 경로 칸 대신 효과로만 잠근다(설계 결정 2026-09-26).
