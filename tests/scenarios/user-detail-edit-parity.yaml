# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 «어느 화면 쌍의 어느 항목인가» 를 가리키는 좌표이지, 조합마다 동작이
#   갈리는 분기가 아니다. 「상세에 있는 칸이 수정에도 있는가」 는 관리자·사용자 어느 쪽이든,
#   기록성 칸이든 편집 칸이든 같은 한 가지 사실이고, 그 사실을 축의 곱만큼 다시 재도 얻는 것이
#   없다. 실제 커버리지 계약은 effects 목록이다.

feature: 회원 상세 ↔ 수정 화면 항목 정합 (관리자 · 사용자)

description: |
  요구사항(2026-09-21): 「회원상세보기에 나오는 것은 수정하기 화면에서 모두 수정이 가능해야 한다.
  위치도 동일하고 양식도 동일해야 한다. 배송지 수정에만 한정하는 지시가 아니다.」 뒤이어
  「관리자만 해당되는 것이 아니다. 사용자도 포함이며」.

  같은 회원을 두 화면이 나눠 들고 있는데, 두 화면은 **파일이 따로다**. 그래서 한쪽에 칸을
  더하고 다른 쪽을 잊어도 아무 검사도 걸리지 않고, 화면에는 「보이는데 고칠 수 없는 값」 이
  남는다. 실제로 그렇게 빠져 있던 것이 관리자 쪽 여섯(이메일 인증 여부 · 잠금 상태 · 탈퇴일시 ·
  차단일시 · 동의정보 탭 · 알림함 탭), 사용자 쪽 다섯(아바타 · 계정 상태 · 가입일 · 마지막
  로그인 · 탈퇴일시)이었다. 반대 방향으로는 이커머스의 결제통화·배송국가가 **수정 화면에만**
  있어, 그 값을 보려면 고치는 화면을 열어야 했다.

  적용한 규칙은 셋이다.

  ① **상세가 정본이다.** 요구 문장의 주어가 「회원상세보기에 나오는 것」 이라, 탭 이름·탭 순서·
     구획 순서·구획 안의 칸 순서를 상세에 맞춰 수정 화면을 옮겼다(관리자 쪽 이메일이 기본정보
     에서 연락처로 간 것이 그 결과다).

  ② **「양식도 동일」 은 위젯을 같게 하라는 뜻이 아니다.** 상세의 이름은 글자이고 수정의
     이름은 입력칸이다. 운영자·회원이 정할 수 있는 값은 입력칸으로, 시스템이 적는 기록값
     (가입일 · IP · 인증 시각 · 동의 시각 · 알림 건수)은 **같은 자리에 잠근 채로** 세운다.
     자리를 비우지 않는 이유는, 비우면 「고칠 수 있는데 칸이 없는 것」 인지 「원래 고칠 수
     없는 것」 인지 화면이 말해 주지 않기 때문이다.

  ③ **행위는 항목이 아니다.** 회원 탈퇴는 되돌릴 수 없어 편집 중인 폼 옆에 두지 않고 보기
     화면에만 남겼다. 관리자 쪽의 찜·장바구니·마일리지·스크랩 같은 **목록 탭**도 수정 화면에
     복제하지 않는다 — 고칠 값이 아니라 다른 화면으로 가는 입구다.

# axis 의미:
#   surface   — 화면 쌍. 관리자(admin_user_detail ↔ admin_user_form)와
#               사용자(mypage/profile ↔ mypage/profile-edit).
#   field_kind— 칸의 성격. editable 은 저장 body 에 실리는 칸, record_only 는 잠긴 채 서는 칸,
#               screen_only 는 그 화면의 장치(제목 · 입구 버튼 · 저장/취소 · 비밀번호 재확인).
axes:
  surface: [admin, mypage]
  field_kind: [editable, record_only, screen_only]

effects:
  # 관리자 (admin-user-detail-form-parity.test.ts)
  - admin_user_form_tabs_match_detail_tabs
  - admin_user_form_carries_every_detail_field_in_the_same_order
  - admin_user_form_record_only_fields_are_locked
  - admin_user_form_editable_fields_carry_a_form_name
  # 두 화면을 같은 순서로 옮기면서 md:/lg: 구조 분기(선행 부채)도 걷었다 — 규약 §6-0.
  - admin_user_screens_have_no_tailwind_breakpoint_layout_branch
  # 사용자 (mypage-profile-view-edit-parity.test.ts)
  - mypage_profile_edit_carries_every_view_item
  - mypage_profile_edit_shows_account_status
  - mypage_profile_edit_carries_the_avatar_uploader
  - mypage_profile_edit_carries_record_only_dates
  # 역방향 — 수정 화면에만 있던 이커머스 선호값을 상세에도 세운다
  - admin_user_detail_shows_ecommerce_preferences

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-user-detail-form-parity.test.ts
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-profile-view-edit-parity.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/admin-user-preferences-detail.test.tsx

notes: |
  **정합은 목록이 아니라 규칙으로 잠근다.** 「이 칸이 있는지」 를 하나씩 세는 시험은 칸이
  늘 때마다 같이 고쳐야 하고, 고치는 것을 잊으면 그대로 초록이 된다. 그래서 관리자 쪽은
  **두 화면의 id 순서를 통째로 비교**하고, 사용자 쪽은 **화면이 쓰는 언어 키를 짝짓는다**.
  예외는 각 시험 파일 안에서 이름과 사유를 함께 적은 목록(FORM_ONLY · RECORD_ONLY ·
  VIEW_ONLY)으로만 허용한다 — 예외를 늘리려면 사유를 적어야 한다.

  **사용자 쪽에서 언어 키를 축으로 쓰는 이유**는 두 화면이 `data-ref` 를 거의 달지 않아서다.
  id 를 달아 두 파일을 맞추는 편이 더 곧지만, 그러려면 두 화면의 모든 칸에 id 를 새로 붙여야
  하고 그 편집 자체가 이 이슈의 범위를 넘는다. 라벨이 같으면 같은 항목이라는 가정은 이
  두 화면에서는 성립한다(같은 `mypage.profile.*` 절을 공유한다).
