feature: 테스트 프로세스의 런타임 오토로드 재등록은 실제 오토로드 캐시를 다시 걸지 않는다

description: |
  확장 시험은 `_bundled` 코드를 검증한다 — `tests/bootstrap.php` 가 확장 자기 코드를 `_bundled` 로 먼저 등록하고
  활성 설치본의 PSR-4·진입 classmap 은 건너뛴다. 시험 안에서 `ExtensionManager::reregisterRuntimeAutoload()` 가
  실제 `bootstrap/cache/autoload-extensions.php` 로 돌면 `src_classmap`(설치본 경로)이 주 Composer 로더 classmap 에
  들어가 PSR-4 보다 먼저 이기고 설치본 vendor 로더가 맨 앞에 붙어, 그 뒤 처음 로드되는 확장 클래스를 낡은 설치본에서
  읽는다(측정으로 확인한 유일한 경로).

  이 매니페스트가 고정하는 계약:
    - testing 환경에서 실제 캐시 경로로 부른 재등록은 아무것도 등록하지 않는다(`generateAutoloadFile()` 과 같은 조건).
    - 경로를 임시 파일로 바꾼 인스턴스(생성·재등록 로직 검증용)는 그대로 재등록한다(`RuntimeAutoloadEntryRedeclareTest`).

axes:
  cache_path: [real]

effects:
  - runtime_reregister_skips_real_cache_in_tests

test_files:
  - tests/Unit/Extension/RuntimeAutoloadTestEnvironmentGuardTest.php

validation:
  note: |
    실제 캐시 파일은 개발 환경에만 있어 없으면 시험을 건너뛴다. 수정 전에는 개발 사이트에 설치된 확장의
    src_classmap 항목이 주 로더 classmap 에 들어가 red.
