# audit:allow scenario-referenced-test-file-marked reason: issue:#609 형제 표식(test-scenario-coverage)의 유예를 명시 승계 — 표식 연쇄를 끊으며 이 룰의 유예를 자기 표식으로 옮겼다. 선언한 test_files 의 @scenario/@effects 마킹은 후속
# 원장: 이 매니페스트는 :cross-product 로 좁히면 effects 22건이 미검증으로 드러난다.
#   그 짝 맞추기는 이 공정(레이아웃 편집기)의 몫이며, 좁히는 시점에 함께 처리한다.

feature: 레이아웃 편집기 스타일 탭 — 색 모드(라이트/다크) × 디바이스별 스타일 편집

description: |
  속성 편집 모달 [스타일]/[표시조건] 탭에 색 모드 × 디바이스 세부탭을 두어, 선택 scope 가
  가리키는 위치(base props 또는 responsive.{preset|커스텀범위}.props, 다크는 dark: classToken)에
  스타일/flex/표시조건을 무손실로 기록·역해석한다.

  핵심 동작:
    - StyleScope = 색 모드(base|dark) × breakpoint(base|preset|커스텀범위) 직교 2축
    - recipeEngine.applyRecipe/reverseResolve 가 scope 인자로 컨테이너 리다이렉트(기본 BASE_SCOPE = 회귀 0)
    - 다크는 classToken 만 편집(dark: prefix 공존), 인라인은 읽기전용(darkReadonly)
    - scope≠base 오버라이드 없으면 base 상속값을 placeholder 로(baseFallback)
    - flexEnable on/off 2상태(off=명시 해제 토큰)로 디바이스별 flex 해제
    - 모달 scope = 열리는 순간 툴바 스냅샷(독립, 패치 재마운트 불변)
    - node-level responsive/if 저장·재로드 보존(백엔드 코드 변경 없음)

axes:
  color_scheme: [light, dark]
  device: [base, desktop, tablet, mobile, custom_range]
  apply_type: [classToken, styleProp, cssVar, propValue, flex]
  edit_target: [style, flex_enable, visibility_if]
  scope_override_state: [no_override_inherits_base, has_scope_override]

exclusions:
  - { color_scheme: dark, apply_type: styleProp, edit_target: style, reason: "다크 인라인은 읽기전용 — 편집 axis 아님(읽기전용 검증은 별도)" }
  - { color_scheme: dark, apply_type: cssVar, reason: "다크 인라인 불가" }
  - { color_scheme: dark, apply_type: propValue, reason: "다크 인라인 불가" }
  - { color_scheme: dark, edit_target: visibility_if, reason: "표시조건은 다크 무관(D9) — 색 모드 줄 숨김" }
  - { edit_target: flex_enable, apply_type: styleProp, reason: "flex enable 은 classToken 레시피" }
  - { edit_target: flex_enable, apply_type: cssVar, reason: "동일" }
  - { edit_target: flex_enable, apply_type: propValue, reason: "동일" }

effects:
  # 위치 결정 + 무손실
  # engine-v1.98.0 — 디바이스 탭 className 편집은 기본 대비 바뀐 토큰만 responsive.{bp}.classMerge 로 저장(종전 B안 시드 대체). 덧붙이기로 못 나타내는 삭제 편집·기존 props.className 구간은 통째 교체 유지
  - device_scope_class_edit_writes_only_changed_tokens_as_class_merge
  - base_scope_writes_node_props_byte_identical_to_pre_scope
  - device_scope_writes_responsive_breakpoint_props_base_unchanged
  - custom_range_scope_writes_responsive_range_key
  - empty_override_prunes_responsive_branch_keeping_code_authored_keys
  # 기본 토큰 보존(engine-v1.98.0 — 종전 B안 시드 대체: 바뀐 토큰만 classMerge) + 초기화 + 표시점
  - device_scope_keeps_base_tokens_via_class_merge
  - seeded_base_tokens_render_as_placeholder_only_user_changes_are_solid
  - device_class_merge_follows_later_base_changes_full_replace_branch_stays_copy
  - reset_to_base_clears_device_override_restoring_inheritance
  - reset_dark_clears_only_dark_tokens_keeping_light
  - override_dot_shown_only_when_scope_differs_from_base_not_for_seed_only
  # 다크
  - dark_classToken_coexists_with_light_token_in_one_className
  - dark_edit_preserves_light_token_and_vice_versa
  - dark_inline_control_readonly_value_never_overwritten
  - dark_and_device_compose_dark_prefix_in_responsive_props
  # placeholder
  - scope_without_override_shows_base_inherited_value_as_placeholder
  - editing_placeholder_creates_scoped_override_only
  # flex
  - device_flex_disable_writes_explicit_off_token_breaking_base_inheritance
  - scope_flex_judgment_uses_node_derivation_not_computed_style
  - no_enable_control_hides_flex_toggle_in_non_base_scope
  # 표시조건
  - device_visibility_if_writes_responsive_breakpoint_if
  - base_if_unchanged_when_device_if_edited
  - visibility_tab_shows_device_subtabs_only_without_color_scheme_row   # 표시조건 탭에는 디바이스 세부탭만 있고 색 모드 줄은 없다(D9)
  # 스냅샷 독립
  - modal_scope_snapshots_toolbar_on_open
  - modal_scope_independent_after_toolbar_change
  - modal_scope_survives_patch_remount
  # 저장/영속/실페이지
  - save_persists_responsive_and_if_on_reload
  - real_user_page_honors_responsive_override_at_matching_width
  - real_user_page_honors_dark_token_under_dark_ancestor
  # 프리뷰 토글
  - preview_color_scheme_toggle_applies_dark_wrapper_to_preview_frame_only
  # 2026-10-31 issue609 테스트 매핑 부채 정리: 레이아웃 편집기 단위 테스트가 실제로 재는 효과 (메서드 단위 마킹)
  - dark_scope_classToken_control_stays_editable   # 다크 scope 에서도 classToken 컨트롤은 읽기 전용이 아니라 편집된다
  # 선행 마킹 정리: styleScope.test.ts, recipeEngine.scope.test.ts 의 시험마다 재는 효과
  - scoped_props_read_from_scope_container          # getScopedProps 는 scope 가 가리키는 컨테이너(base props, responsive[bp].props, 범위 키)만 읽고 없으면 빈 객체
  - scoped_edit_never_mutates_input_node            # scope 편집 함수(withScopedProps, setScopedIf, applyRecipe)는 입력 노드를 바꾸지 않고 복제본을 돌려준다
  - empty_style_pruned_from_scoped_props            # 편집 뒤 빈 style 객체는 props 에서 지운다
  - device_scope_edit_leaves_other_breakpoint_branches_untouched  # 한 디바이스 편집이 다른 breakpoint 브랜치를 건드리지 않는다
  - base_scope_visibility_if_reads_writes_node_if   # 기본 scope 의 표시조건은 node.if 를 읽고 쓴다
  - cleared_visibility_if_prunes_key_keeping_branch_props  # 표시조건을 비우면 if 키와 빈 브랜치를 지우되 같은 브랜치의 props 는 남긴다
  - effective_device_visibility_if_falls_back_to_base_only_when_key_absent  # 디바이스 탭 표시조건은 그 브랜치에 if 키가 없을 때만 base if 로 폴백한다(빈 문자열은 명시값)
  - dark_prefix_helpers_detect_strip_add_idempotently  # dark: 접두 판정, 제거, 멱등 추가 도우미
  - dark_editable_only_for_classToken_apply_type    # 다크 편집 가능 판정은 classToken 적용 방식만 참이다
  - scope_breakpoint_validation_accepts_base_preset_and_ordered_range  # scope breakpoint 는 base, preset, min<=max 범위만 유효하다
  - device_maps_to_scope_breakpoint_preset_or_matching_custom_range  # 미리보기 디바이스를 동명 preset 키나 폭이 맞는 커스텀 범위 키로, 못 찾으면 base 로 바꾼다
  - reset_on_light_base_scope_returns_node_unchanged  # 라이트 기본값 scope 초기화는 노드를 그대로 돌려준다
  - branch_separation_merges_only_exact_range_children_branch  # 디바이스 분리 판정은 같은 범위의 children 분기가 있을 때만 해제(merge)다
  - branch_separation_creates_current_device_branch_with_covering_source_key  # 그 밖에는 현재 디바이스 전용 분기를 만들고(separate) 포괄 분기가 있으면 복제 원본(sourceKey)으로 건넨다
  - props_only_branch_not_counted_as_separation     # children 없는 props 전용 분기는 분리로 치지 않는다
  - reverse_resolve_reads_value_from_selected_scope_container  # 역해석은 선택한 scope 컨테이너(base props, responsive 키, dark: 토큰)에서만 값을 읽는다
  - color_preset_token_replaces_same_group_keeping_other_text_tokens  # 색 프리셋 토큰은 같은 group 토큰만 바꾸고 글자 크기, 정렬 토큰은 둔다
  - free_hex_color_writes_arbitrary_value_class_token  # 자유 HEX 색은 text-[#hex] 임의값 토큰으로 쓴다
  - color_class_token_reverse_resolves_preset_and_hex  # 색 classToken 역해석이 프리셋 토큰과 자유 HEX 를 모두 값으로 돌려준다

