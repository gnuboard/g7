feature: 점검 모드 통과 수단과 core:update 점검 해제 시점

description: |
  `php artisan down` 의 옵션을 점검 미들웨어(`MaintenanceModePage`)가 그대로 따른다. 비밀 경로(`--secret`)는 우회 쿠키를
  주고 첫 화면으로 보내며, 그 쿠키로 들어간다. `--except` 경로와 허용 IP(`G7_MAINTENANCE_ALLOW_IPS`, CIDR 허용, 신뢰 프록시
  기준 IP)는 통과한다. `--retry`·`--refresh` 는 `Retry-After`·`Refresh` 헤더, `--status` 는 상태 코드, `--redirect` 는 다른
  경로의 이동 대상이 된다. 웹 코어 업데이트 진행 경로 면제는 그대로다. `core:update` 는 번들 확장 일괄 업데이트가 끝난 뒤
  (실패·예외에서도 finally 로) 점검 모드를 푼다 — 웹 경로는 이미 번들 단계 뒤 마무리 단계에서 푼다.

# 축 의미:
#   case — 점검 옵션·요청 상황.
axes:
  case: [secret_path, except_path, allowed_ip, headers, redirect, release_order]

effects:
  - secret_path_issues_bypass_cookie
  - except_and_allowed_ip_pass_maintenance
  - down_options_shape_the_response
  - maintenance_released_after_bundled_updates

test_files:
  - tests/Feature/Middleware/MaintenanceModeBypassTest.php
  - tests/Feature/Console/CoreUpdateMaintenanceReleaseOrderTest.php
