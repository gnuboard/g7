feature: 화면 처리 — 첫 받기와 미룬 blocking onSuccess (#869)

description: |
  화면 처리(handleRouteChange)의 첫 받기는 화면 세대로만 걸러 그대로 실린다(출시본 동작). 다른 레이아웃으로 옮기는 전환의
  blocking onSuccess 는 새 화면 상태를 세운 뒤로 미뤄 돈다(χ2).

  계약:
    1) 화면을 처음 받는 사이 쪽 넘김(쿼리 갱신)이 나가도 첫 받기 응답은 그대로 실리고, initGlobal 과 실시간 알림 구독 문맥이 비지 않는다.
    2) 화면 처리 도중 기다리지 않고 부른 수동 소스 다시 받기는 첫 받기 때문에 버려지지 않는다.
    3) 다시 받기가 값을 싣지 못하고 끝나도 늦게 온 첫 받기 값은 실린다.
    4) 다른 레이아웃으로 옮기는 전환의 미룬 blocking onSuccess 는 앞 화면이 남긴 반영 대기 값을 비우고 화면을 잠근 채 돈다.
axes:
  case: [first_fetch_side_effects, deferred_blocking_on_success]

effects:
  - first_fetch_applied_for_subscription
  - manual_refetch_during_route_applied
  - first_fetch_applied_after_empty_refetch
  - deferred_on_success_clears_pending_and_locks_screen

test_files:
  - resources/js/core/__tests__/TemplateApp.firstFetchSideEffects.test.ts

notes: |
  설계 확정(2026-11-10)으로 언어 전환 연쇄를 걷으면서 언어 전환 회차의 시험 파일과 매니페스트를 지우고, 언어 전환과
  무관하게 성립하는 네 시험만 이 파일로 옮겼다.
