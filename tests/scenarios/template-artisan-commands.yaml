feature: 템플릿 Artisan 명령(설치·활성화·비활성화·제거·목록·캐시·업데이트)의 입력 거절과 전체 흐름

description: |
  template:* 명령이 없는 대상·잘못된 옵션·형식이 틀린 식별자를 실패(종료 코드 1)로 끝내고, 설치 → 활성화 → 비활성화 → 제거
  전체 흐름이 실제 번들 템플릿으로 끝까지 도는지 잰다. 유형의 마지막 활성 템플릿은 template:deactivate 가 --force 로만
  끈다(설계 확정 2026-11-08) — 그 거절 자체는 template-uninstall-command-options.yaml 이 소유하고, 여기서는 전체 흐름이
  --force 로 이어지는지만 본다.

# 명령마다 실패 경로와 성공 흐름을 잰다 — 조합은 명령 하나의 입력 검사라 축을 명령 하나로 둔다
axes:
  command: [install, activate, deactivate, uninstall, list, cache_clear, check_updates, update]

effects:
  - template_cli_rejects_missing_target              # 설치·활성화·비활성화·제거·캐시·업데이트 확인·업데이트가 없는 대상에 실패
  - template_cli_rejects_invalid_option              # 목록의 유형·상태, 업데이트의 레이아웃 전략이 틀리면 실패
  - template_cli_list_reports_empty                  # 설치된 템플릿이 없으면 빈 목록 문구
  - template_cli_install_rejects_malformed_identifier  # vendor-name 형식이 아니거나 숫자로 시작·특수문자 식별자는 실패
  - template_cli_full_lifecycle_workflow             # 설치 → 활성화 → (마지막 활성은 --force) 비활성화 → 제거

test_files:
  - tests/Feature/Console/Commands/Template/TemplateArtisanCommandsTest.php
