feature: 템플릿 자산(JS·CSS·이미지·글꼴·components.json) 공개 서빙

description: |
  활성 템플릿의 dist 아래 자산을 공개 API 로 내려준다. 경로 탈출·허용되지 않은 확장자는 막고, 응답에는 MIME·ETag·
  환경별 캐싱 헤더를 싣는다. 비활성·없는 템플릿과 없는 파일은 404(경로 검증 실패면 JSON 422)로 끝난다.

axis_notes:
  case: |
    serve 는 정상 서빙, missing 은 없는 템플릿·파일, traversal 은 경로 탈출 차단, file_type 은 확장자 화이트리스트,
    mime 은 형식별 MIME, caching 은 ETag·환경별 캐시 헤더, components 는 components.json, nested_path 는 하위 경로·특수
    문자 파일명, rate_limit 은 요청 제한이다.

axes:
  case: [serve, missing, traversal, file_type, mime, caching, components, nested_path, rate_limit]

