feature: 확장이 선언한 역할에 그 역할이 열 수 있는 확장 메뉴가 붙는다

description: |
  확장 메뉴는 설치·업데이트 때 관리자 역할과 설치한 사람의 역할에만 붙었다. 그래서 확장이 선언한 역할
  (이커머스 관리자, SSO 운영자 등)만 가진 운영자는 그 확장 권한을 갖고도 관리자 왼쪽 메뉴가
  「접근 가능한 메뉴가 없습니다」로 비었고, 확장 화면은 주소를 직접 쳐야만 열렸다.

  이제 확장 메뉴 동기화(새 설치·확장 업데이트·활성 확장 재동기화 공통 경로)가 확장이 선언한 역할마다
  그 확장 메뉴 중 역할이 가진 권한으로 열 수 있는 메뉴를 붙인다.
    - 메뉴의 필요 권한 = 메뉴 선언의 `permission` 키. 권한 범위(자기 것만 등)가 있어도 보유로 본다.
    - 필요 권한이 없는 상위 묶음 메뉴는 열 수 있는 하위 메뉴가 하나라도 있을 때 붙는다.
    - 필요 권한을 선언하지 않은 단독 메뉴는 판정 근거가 없어 붙이지 않는다.
    - 운영자가 역할 관리·메뉴 관리에서 그 역할을 넣거나 뺀 메뉴(메뉴의 user_overrides 에 역할 식별자)는 건드리지 않는다.
      상위 메뉴에서 뺐으면 그 아래도 붙이지 않는다.
    - 붙이기만 하고 떼지 않는다.

axes:
  extension_type: [module, plugin]
  entry: [declarative_sync, resync_backfill, operator_removed_then_resync, operator_removed_parent_then_resync]

effects:
  - declared_role_sees_openable_extension_menus
  - declared_role_does_not_see_menus_outside_its_permissions
  - existing_site_backfilled_on_resync
  - operator_removed_menu_not_regranted

test_files:
  - tests/Feature/Extension/ExtensionDeclaredRoleMenuGrantTest.php

notes:
  - 게시판의 게시판별 관리자 역할은 확장 선언 역할이 아니라 게시판 생성 때 만들어지며, 메뉴도 그때 붙는다(이 경로 밖).
  - 개인정보 운영자 역할(GDPR 플러그인)은 메뉴 선언에 필요 권한이 없고, 플러그인 활성화가 직접 메뉴를 붙인다(이 경로 밖).
