# audit:allow test-scenario-coverage[cross_product] reason: issue:#40 관문 × 비밀번호 유무 × 확인 수단 × 토큰 상태 중 관문마다 의미 있는 조합만 실체가 있다
# (토큰 재사용은 수단=토큰일 때만 등). 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 민감 작업 재확인 — 비밀번호 확인 관문의 이메일 인증번호 대체

description: |
  비밀번호 확인 관문 3곳(마이페이지 정보 수정 진입 · 앱 키 재생성 · 관리자 본인 정보 수정)이 공통 `ReauthenticationService` 를 쓴다(#40 K9 · R9).
    - 비밀번호 회원은 종전대로 비밀번호. 비밀번호 없는 회원은 코어 본인인증(목적 `sensitive_action`)으로 받은 `verification_token`.
    - 토큰은 그 회원 본인 것·그 목적·미소비·미만료여야 하고 관문을 통과하면 소비된다.
    - 비밀번호 없는 회원이 비밀번호를 보내면 422 「비밀번호 미설정」.

axes:
  gate: [verify_password, regenerate_app_key, admin_self_update]
  password: [set, none]
  method: [password, token, none, current_password, other_token]
  token: [fresh, reused, other_user, wrong_purpose]
  actor: [super_admin, admin]

effects:
  - password_holder_passes_with_password
  - passwordless_passes_with_token
  - token_single_use
  - token_bound_to_user
  - token_bound_to_sensitive_action
  - app_key_gate_reports_not_set
  - app_key_gate_rejects_other_token
  - app_key_gate_rejects_non_super_admin
  - app_key_route_carries_super_admin_gate
  - admin_self_update_requires_token_for_passwordless
  - admin_self_update_sets_first_password

test_files:
  - tests/Feature/Auth/ReauthenticationTest.php
