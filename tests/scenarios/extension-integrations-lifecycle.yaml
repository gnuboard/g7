feature: 선택 연동(integrations) 버전 제약·생명주기 안내·설치 창 연동 목록 (#822, 코어 7.1.4)

description: |
  7.1.4 부터 `integrations` 는 모듈·플러그인·템플릿 공통 스펙으로 `dependencies` 와 같은 수준이다. 객체형
  `{"modules": {"sirsoft-board": ">=1.2.1"}}` 으로 버전 제약을 선언하고, 목록형·설명형 값은 「버전 무관(*)」이다.
  연동은 막지 않는다 — 설치·활성화·업데이트 결과에 미설치·비활성·버전 미달을 `integration_notices` 로, 비활성화·제거
  결과에 이 확장을 연동으로 선언한 활성 확장을 `integrated_by` 로 알리고, HTTP 상태·종료 코드는 그대로다.
  관리자 설치 창은 연동 대상을 `integrations[]` 로 받아 미설치·비활성 항목을 기본 체크하고, 고른 항목은 의존 다음·본체
  이전에 설치·활성화한다(실패해도 본체 계속). 번들 정리는 활성 확장의 연동 대상을 보존한다.
  같은 결함군(D6): dependencies 목록형을 키로 읽던 곳을 ExtensionDependencies 정규화기로 통일했다.

