# audit:allow test-scenario-coverage reason: issue:#383 9축 cross product 는 105,840 조합이라 E2E 전수 전개가 불가능하다. 축별 판정은 test_files 의 단위/렌더 테스트(useDevicePreview 클램프·overlayGeometry 44px 임계·EditorToolbar hover/outline·ComponentPalette 태그 배지·admin-template-layout-edit replaceUrl)가 커버하고, 브라우저 통합은 chrome-controls.spec.ts(코어 chrome) + code-editor-route-sync.spec.ts(템플릿 소유 코드편집기)가 나눠 맡는다. effects 15건은 @effects 마킹으로 전건 커버(미커버 0)이며 이 면제는 cross_product 축에만 적용된다.

feature: 레이아웃 편집기 chrome 컨트롤 (디바이스 custom width / 툴바 나가기·코드편집·저장 스피너·hover / 오버레이 겹침 회피 / 팔레트 태그)
phase: 3
session: S5b-pre
issue: 383
# axis 의미:
#   본 매니페스트가 묶는 것은 "편집기 chrome" 이라는 화면 영역이지 하나의 상호작용
#   흐름이 아니다. 디바이스 미리보기 / 툴바 / 코드편집기 진입 / 오버레이 배치 / 팔레트는
#   서로 곱해지지 않는다 (툴바 버튼 상태가 오버레이 배치 판정을 바꾸지 않는다).
#   그래서 상호작용이 실재하는 축만 axes 에 두고, 나머지는 sub_flows 로 분리한다.
#
#   axes 로 남긴 것: 미리보기 디바이스 × custom 폭 입력.
#     custom 폭은 device=custom 일 때만 반영되고 그 외 디바이스에서는 무시되어야 하므로
#     두 축이 실제로 교차한다 (무시 여부가 조합으로 갈린다).
axes:
  preview_device: [desktop, tablet, mobile, custom]
  custom_width_input: [below_min_320, in_range, above_max_1920]
  # 코드편집기 진입 경로 (609 docblock 정리 — sub_flows.code_editor_route_sync 의 설명에만 있고 선언이 없던 축을 올린다)
  code_editor_entry: [from_wysiwyg_with_route, direct_route_query, no_route_query, stale_selection_from_other_template]
exclusions:
  - { preview_device: desktop, custom_width_input: below_min_320,
      reason: "custom 이 아닌 디바이스는 custom 폭을 무시 — 대표로 in_range 1건만 검증" }
  - { preview_device: desktop, custom_width_input: above_max_1920, reason: "동일" }
  - { preview_device: tablet, custom_width_input: below_min_320, reason: "동일" }
  - { preview_device: tablet, custom_width_input: above_max_1920, reason: "동일" }
  - { preview_device: mobile, custom_width_input: below_min_320, reason: "동일" }
  - { preview_device: mobile, custom_width_input: above_max_1920, reason: "동일" }

sub_flows:
  - id: toolbar_actions
    description: |
      툴바 버튼(나가기 / 코드편집 / 저장)의 동작과 시각 상태. 미리보기 디바이스와
      곱해지지 않는다 — 어느 디바이스에서 보든 툴바 동작은 같다.
      축: toolbar_action(exit_clean·edit_code_navigate·save_in_progress·save_done) ×
          toolbar_button_state(enabled_hover·disabled_no_hover·focused_after_click) ×
          edited_template_type(user·admin — 나가기 목적지 분기)
    effects:
      - toolbar_exit_navigates_to_template_list_by_type
      - toolbar_edit_code_opens_text_layout_editor_in_new_window_with_route
      - toolbar_save_shows_spinner_while_pending_then_restores
      - toolbar_buttons_hover_transition_when_enabled_not_when_disabled
      - toolbar_buttons_no_residual_focus_outline_after_click
  - id: code_editor_route_sync
    description: |
      코드편집기(텍스트 화면)의 `?route=` 쿼리 동기화. 진입 경로별로 쿼리를 싣거나 비운다.
      축: code_editor_entry(from_wysiwyg_with_route·direct_route_query·no_route_query·stale_selection_from_other_template) ×
          file_select_in_editor · extension_select_in_editor
    effects:
      - code_editor_restores_layout_from_route_query
      - code_editor_defaults_to_first_layout_without_route_query
      - code_editor_clears_selection_left_over_from_another_template
      - code_editor_file_select_syncs_route_query
      - code_editor_extension_select_clears_route_query
  - id: overlay_affordance_placement
    description: |
      선택 박스 크기에 따른 오버레이 버튼 배치. 툴바·팔레트와 무관한 기하 판정이다.
      축: selected_box_size(normal_ge_44·small_lt_44_width·small_lt_44_height·scaled_small) ×
          affordance_kind(info_menu·base_lock·extension_lock·nav_route_in_tree·nav_unreachable·insertion_cross)
    effects:
      - overlay_affordances_inside_when_box_ge_44
      - overlay_affordances_outside_when_box_lt_44_no_overlap
      - insertion_affordances_cross_layout_when_box_lt_44_no_overlap_no_clip
  - id: preview_fit_zoom
    description: |
      맞춤 줌 — 캔버스가 미리보기 기기 폭보다 좁으면 미리보기를 남는 폭에 맞춰 줄이고(줌 슬라이더 값은
      배율 상한, 100% 포함) 레이아웃 폭도 줄인 폭으로 잡는다(창 1280 문서 폭 1608px).
      미리보기 안 반응형 판정(frame 폭, ResponsiveProvider)은 기기 폭 그대로다.
      축: editor_preview_fit(canvas_narrower_than_device·canvas_wider_than_device) ×
          editor_window_width(1024_to_1920) × editor_canvas_resize(observer: shrink·grow_below_threshold·grow_above_threshold) ×
          editor_overlay_listener_target(preview_stage·hand_built_wrapper)
    effects:
      - editor_preview_scale_fits_available_width
      - editor_document_width_within_shell
      - editor_preview_stage_uses_scaled_layout_width
      - editor_overlay_outside_scale_transform
      - editor_preview_keeps_device_width_for_responsive
      - editor_canvas_capture_listener_on_common_ancestor
      - editor_document_no_preview_horizontal_scroll
      - editor_overlay_selection_box_aligned_when_scaled
      - editor_toolbar_wraps_lines_without_squish
      - editor_insertion_affordances_stay_inside_canvas
      - editor_canvas_height_follows_wrapped_header
      - editor_actual_size_toggle_shows_one_to_one
      # 50412256f3 좁은 창 압착 차단(찌그러짐 방지) — 하한 1024·툴바 자연 폭으로 바뀐 뒤에도 유지
      - shell_keeps_min_width_below_viewport
      - toolbar_items_keep_natural_width_no_wrap
      - narrow_window_produces_horizontal_scroll_not_compression
  - id: prop_slot_footer_edit
    description: |
      컴포넌트 배열 prop(`props.footer`) 안 노드 편집(공개#141) — Modal 하단 단추를 children 과 같은
      트리 함수로 고르고 고친다. path 표기 `{owner}.props.footer.{index}`.
      축: footer_operation(select·patch·remove·duplicate·move_within_footer·move_footer_to_children·
          move_children_to_footer·drop_slot·save_serialize)
    effects:
      - editor_footer_path_round_trips
      - editor_footer_node_selectable
      - editor_footer_node_patch_remove_move
      - editor_footer_edit_serialized_on_save
  - id: palette_entry_badge
    description: |
      팔레트 카드의 React 컴포넌트 태그 배지. 축: palette_entry_type(basic·composite·layout)
    effects:
      - palette_card_shows_react_component_tag_badge

