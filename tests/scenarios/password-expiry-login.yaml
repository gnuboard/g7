# audit:allow test-scenario-coverage[cross_product] reason: |
#   경로(사용자·관리자) 축은 메서드 안에서 두 경로를 루프로 돌리고, 캐시 실패·동시 제출·TTL 경계는 브라우저로
#   만들 수 없어 메서드별 단일 조합으로 만든다. effects·test_files 는 계속 검사한다.

feature: 로그인 비밀번호 변경 관문 (#736)

description: |
  비밀번호·2단계 인증을 통과해도 비밀번호가 만료됐거나 관리자가 정해 준 비밀번호면 토큰 대신 변경 단계
  식별자(10분·회원당 1개·발급 경로와 비밀번호 지문에 묶임)를 받고, 식별자와 새 비밀번호로만 로그인이 끝난다.
  순서 불변식은 자격증명 → 상태 → 잠금 → 2단계 인증 → 변경 관문 → (휴면 해제 + 토큰 발급)이다.
  '다음에 변경 허용' 모드는 연기할 수 있다. 관리자 로그인에 비관리자가 오면 관문을 건너뛰어 종전처럼 403 이고,
  관리자 완료 엔드포인트는 비밀번호를 쓰기 전에 관리자 여부를 본다. 변경 단계는 현재 비밀번호와 같은 값을
  항상 거부하고 재사용 금지가 켜져 있으면 최근 비밀번호도 거부한다.

axes:
  guard: [user, admin, cross]
  reason: [none, expired, admin_assigned]
  action: [force, remind]
  two_factor: [on, off]
  challenge: [valid, expired, consumed]

effects:
  - unexpired_login_issues_token
  - expired_login_returns_challenge_without_token
  - completion_issues_token_and_records_change
  - new_password_values_never_stored_in_global
  - remind_mode_allows_postpone_until_deadline
  - admin_assigned_requires_change_even_when_expiry_off
  - postpone_refusal_message_matches_reason       # 연기 불가 단계의 연기 요청은 상위 안내도 「연기 불가」(무효 식별자만 「만료·올바르지 않음」) — 7.1.0 실측 O-3
  - two_factor_precedes_password_change
  - challenge_bound_to_guard
  - non_admin_admin_login_gets_403_without_challenge
  - admin_completion_checks_admin_before_write
  - challenge_expires_and_is_single_use
  - login_stage_rejects_current_and_reused
  - confirmation_mismatch_reported_on_confirmation_field
  - dormant_user_restored_after_change
  - locked_account_cannot_complete
  - concurrent_submission_rejected
  - cache_failure_returns_503
  - endpoints_reachable_without_token

test_files:
  - tests/Feature/Auth/PasswordExpiryLoginTest.php
  - tests/Playwright/specs/auth/password-expiry-login.spec.ts
