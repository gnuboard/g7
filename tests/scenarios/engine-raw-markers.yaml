feature: 번역 면제 표식(rawMarkers) 유틸리티 (engine-v1.27.0)

description: |
  raw: 바인딩 결과를 번역에서 빼려고 문자열을 보이지 않는 표식으로 감싼다. wrapRaw 와 unwrapRaw 는 왕복하고,
  isRawWrapped 는 감싼 문자열인지, containsRawMarker 는 표식이 섞였는지 본다. wrapRawDeep 는 배열과 객체 안의
  문자열만 재귀로 감싸고 숫자, boolean, null 은 그대로 둔다. 축 area 는 함수 하나씩이다.

axes:
  area: [wrap_unwrap, detect, contains, wrap_deep]

effects:
  - raw_marker_round_trips
  - raw_marker_wrapping_detected
  - raw_marker_presence_detected
  - raw_marker_wraps_nested_strings

test_files:
  - resources/js/core/template-engine/__tests__/rawMarkers.test.ts
