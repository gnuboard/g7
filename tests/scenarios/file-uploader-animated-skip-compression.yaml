feature: 파일 업로더 — 움직이는 이미지는 압축하지 않고 원본을 올린다 (사용자·관리자 템플릿)

description: |
  이미지 압축이 켜진 업로더(사이트 로고 등)가 움직이는 GIF·WebP·APNG 를 browser-image-compression 으로 다시
  인코딩해 첫 프레임만 남은 정지 그림이 올라갔다. 두 템플릿 업로더 훅(`useFileUploader`)이 압축 전에
  파일 바이트로 움직임을 가려(utils `detectAnimatedImageFormat`) 움직이는 이미지는 압축을 건너뛴다. 판정 규칙은
  서버 썸네일 생성기(`ThumbnailGenerator::animatedFormat`)와 같다 — GIF 프레임 2개 이상, WebP `ANMF` 프레임 청크
  2개 이상, PNG `IDAT` 앞 `acTL` 의 프레임 수 2 이상. MIME·확장자는 믿지 않는다. 정지 그림은 종전대로 압축한다.

# axis 의미:
#   image_format — 판정할 형식. mime_mismatch 는 MIME·확장자가 실제 바이트와 다른 파일, still 은 정지 그림 묶음
#                  (1 프레임 GIF, acTL 없는 PNG). 움직이는 쪽은 프레임 2개 이상, 업로더 압축은 켠 상태로 잰다.
axes:
  image_format: [gif, webp, png, mime_mismatch, still]

effects:
  - animated_image_detected_by_bytes              # 파일 바이트로 GIF·WebP·APNG 의 움직임을 가린다(정지 그림·다른 형식은 null)
  - animated_image_uploaded_without_compression   # 움직이는 이미지는 압축기를 부르지 않고 원본 크기 그대로 올라간다
  - still_image_compressed                        # 정지 그림은 종전대로 압축한다
  - compressed_larger_than_original_uploads_original   # 압축본이 원본보다 크거나 같으면 원본을 올린다
  - compression_failure_message_translated        # 압축이 실패하면 오류 문구를 번역 키(attachment.compression_failed)로 만든다

