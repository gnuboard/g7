feature: 모듈 자산(JS·CSS·JSON·이미지·글꼴) 공개 서빙과 파일 경로 해석 — ModuleService::getAssetFilePath

description: |
  활성 모듈의 자산을 공개 API 로 내려준다. 경로 탈출·허용되지 않은 확장자는 막고, 응답에는 MIME·ETag·
  환경별 캐싱 헤더를 싣는다. 파일이 있어도 모듈이 비활성이면 404 로 끝나고, 경로 검증 실패는 JSON 422 다.
  소스맵 거부는 production-sourcemap-exposure, 운영자 custom/ 자산은 custom-extension-assets 가 다룬다.

  서빙에 앞서 ModuleService 가 dist 아래 자산의 실제 파일 경로와 MIME 을 정한다. 있는 파일은 경로와 형식별
  MIME 을 돌려주고, 로컬 환경 밖의 소스맵(.map)은 확장자 화이트리스트에서 거부한다. 없는 모듈과 비활성 모듈은
  module_not_found, 없는 파일은 file_not_found 로 끝난다. 형제 템플릿 통로는 template-asset-serving.yaml 이 소유한다.

axis_notes:
  case: |
    serve 는 활성 모듈의 정상 서빙, missing 은 비활성 모듈·없는 파일(404), traversal 은 경로 탈출·절대 경로·NULL 바이트
    차단, file_type 은 확장자 화이트리스트, caching 은 ETag·304·환경별 캐시 헤더, nested_path 는 하위 경로,
    mime 은 서비스가 확장자로 정하는 MIME 이다.

axes:
  case: [serve, missing, traversal, file_type, caching, nested_path, mime]

