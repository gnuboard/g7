feature: 트러블슈팅 회귀 — setState, init_actions, setLocal 의 dataKey 경로 회귀

description: |
  troubleshooting-regression.test.ts 의 해결된 트러블슈팅 사례를 잠그는 회귀 시험이다.
  사례마다 원인이 달라 사례끼리 곱할 입력 축이 없다. 축 case 는 문서의 사례(시험 파일의 가장 안쪽 describe) 하나씩이고,
  효과는 그 사례가 지키는 해결 성질 하나씩이다(같은 사례의 시험 여럿은 같은 칸과 같은 효과를 서로 다른 각도로 잠근다).

axes:
  case: [sequence_setstate_overwrite, dot_notation_key_conflict, dot_notation_null, nested_value_array, global_dot_notation_merge, datakey_forced_fields, init_actions_local, init_actions_underscore_local, setlocal_datakey]

effects:
  - sequence_setstates_keep_prior_changes
  - shared_root_dot_keys_all_applied
  - dot_notation_accepts_null
  - nested_set_keeps_array_type
  - global_dot_keys_merge_into_nested
  - setstate_updates_forced_local_fields
  - init_setstate_uses_component_context
  - underscore_local_target_equals_local
  - setlocal_sets_forced_local_fields

test_files:
  - resources/js/core/template-engine/__tests__/troubleshooting-regression.test.ts

notes: |
  2026-11-09(#869) tsc 오류를 정리하며 이 파일을 손대자 audit `test-scenario-reverse-mapping` 의 선행 부채(시험별 매핑 누락)가
  드러나 이 매니페스트로 해소했다. 시험 동작은 바꾸지 않았다(마킹 주석만). 선례는 troubleshooting-state-advanced.yaml(#757).
