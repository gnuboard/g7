# 레이아웃 편집기 인라인 텍스트 편집과 데이터 연결 위젯
# tsc 정리 때 건드린 편집기 시험의 시나리오 표식 누락을 채우며 만든 매니페스트다.
# 축 subject 는 각 시험 파일이 재는 대상(컴포넌트 또는 함수)이고, effects 는 시험 하나하나가 단언하는 동작이다.
feature: layout_editor_inline_text_pi1

description: |
  캔버스 인라인 텍스트 편집기(contentEditable 커밋과 취소, 키 힌트, 글자색 대비 배경)와 서식 툴바를 다룬다.
  인라인 데이터 연결(평문 키화, param 교체와 해제, lang named-param 오판 방지), 칩 편집기(로케일 버퍼, 커서 삽입, 미키화 노드 키 생성),
  반복 데이터 연결(array 후보, 안전 바인딩 인식, 복합식 디그레이드)과 로케일 전환기를 함께 잰다.

axes:
  subject: [inline_binding_section, inline_param_chip_editor, inline_text_editor, inline_text_toolbar, iteration_binding_section, locale_switcher]

