notes: |
  shape 축 7값은 LocaleTag(PHP)·localeTag(TS) 단위 테스트가 한 값씩 마킹한다. numeric_region(es-419)은 승인된
  언어팩이 없어 브라우저 실측에서는 라우트 매치만 보고 나머지는 단위로 커버한다. 엔진 부팅·로그인 직후의 꺼진 언어
  처리(D8)는 `engine-member-locale-align.yaml`, 오류 화면 주언어 비교는 `engine-toast-dedupe-and-error-screen-locale.yaml`,
  정적 게시 로케일 범위는 `ext-static-cache.yaml` 이 소유한다.
