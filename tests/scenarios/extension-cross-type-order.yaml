feature: 여러 확장을 한 번에 처리할 때 종류를 넘는 의존 순서를 지킨다

description: |
  모듈이 플러그인에 의존하거나 관리자 템플릿이 모듈에 의존할 수 있다(매니페스트 `dependencies.{modules,plugins}`).
  여러 확장을 한 번에 처리하는 경로가 종류별 고정 순서(관리자 템플릿 → 모듈 → 플러그인 → 사용자 템플릿)로 돌면
  의존 대상보다 의존하는 쪽이 먼저 처리돼 설치가 멈추거나(설치 마법사), 거짓 경고·업데이트 실패가 나거나(번들 일괄 업데이트),
  끄기가 막히거나(자동 비활성화), 두 번 실행해야 끝난다(언어팩 provision). 공개 g7#153.

  ## 왜 축이 이렇게 갈리는가

  `surface` 는 같은 정렬 규칙(종류 기본 순서 → 그 안의 기존 순서, 의존만 앞당김 — 순환은 오류·원래 순서)을
  **서로 다른 구현이 따로 들고 있는** 경로다. 설치 마법사는 Laravel 부팅 전이라 PHP 함수 + JS 사본(공용 픽스처),
  코어 경로는 `App\Support\ExtensionDependencyOrder` 를 쓴다. 자동 비활성화는 같은 결과를 뒤집어(의존하는 쪽부터) 쓰고,
  provision 은 언어팩 한 방향(코어 locale 팩 → 확장 팩)만 있다. 연동 함께 설치는 연동 대상의 필수 의존을 연쇄 설치 계획으로 푼다.

  `edge` 는 의존 그래프의 모양이다 — 모듈 → 플러그인(이슈 형태), 관리자 템플릿 → 모듈, 3단 사슬(플러그인 → 모듈 → 플러그인),
  종류를 넘는 순환, 그리고 언어팩의 코어 locale 팩 → 확장 팩(core_locale_pack). 모양마다 앞당겨지는 노드·실패 지점이 다르다.

axes:
  surface: [installer, bundled_update, auto_deactivate, provision, integration_install]
  edge: [module_to_plugin, admin_template_to_module, chain, cycle, core_locale_pack]

exclusions:
  - { surface: bundled_update, edge: admin_template_to_module, reason: "템플릿 업데이트는 모듈·플러그인 다음 단계에서 따로 돈다 — 템플릿 → 모듈 의존은 그 순서로 이미 맞다" }
  - { surface: auto_deactivate, edge: admin_template_to_module, reason: "부팅 자동 비활성화의 끄기 순서는 모듈·플러그인 사이에서만 막힌다(템플릿 의존자는 종전과 같이 다음 부팅 재시도)" }
  - { surface: auto_deactivate, edge: cycle, reason: "끄기는 의존자가 남아 있으면 막히는 판정이라 순환이면 진척 없이 다음 부팅 재시도 — 종전 동작과 같다" }
  - { surface: provision, edge: module_to_plugin, reason: "provision 은 언어팩만 다룬다 — 확장 사이 의존이 아니라 코어 locale 팩 → 확장 팩(core_locale_pack) 한 방향뿐이다" }
  - { surface: provision, edge: admin_template_to_module, reason: "언어팩 의존은 코어 locale 팩 → 확장 팩 한 방향뿐이다" }
  - { surface: provision, edge: chain, reason: "언어팩 의존은 코어 locale 팩 → 확장 팩 한 단계뿐이다" }
  - { surface: provision, edge: cycle, reason: "언어팩 사이에는 순환이 생길 수 없다(확장 팩끼리 의존 없음)" }
  - { surface: bundled_update, edge: core_locale_pack, reason: "일괄 업데이트의 언어팩 단계는 확장 갱신 뒤 새 프로세스로 돈다 — 이미 설치된 팩의 갱신이라 코어 locale 의존이 새로 생기지 않는다" }
  - { surface: auto_deactivate, edge: core_locale_pack, reason: "자동 비활성화는 모듈·플러그인·템플릿 대상이다(언어팩은 호스트와 함께 꺼짐 규칙이 따로 있다)" }
  - { surface: integration_install, edge: core_locale_pack, reason: "연동 함께 설치의 언어팩은 본체 뒤에 기존 연쇄 설치 언어팩 경로로 설치된다(변경 없음)" }
  - { surface: integration_install, edge: admin_template_to_module, reason: "연동 대상은 모듈·플러그인이고, 템플릿 대상 연동은 안내만 한다" }

