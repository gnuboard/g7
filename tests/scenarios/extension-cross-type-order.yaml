manual_verification: |
  사본 설치본(g7_cli)의 번들 매니페스트를 임시로 고쳐(모듈 sirsoft-page → 플러그인 sirsoft-ckeditor5 의존) /install/ 에서
  Step 4 「페이지」만 체크 → Step 5 에서 「CKEditor 5」 설치 행에 「페이지에 필요」 배지가 붙고 페이지보다 먼저 완료되는지,
  플러그인 쪽에도 모듈 의존을 넣어 순환을 만들면 데이터베이스 작업 전에 사전 검증이 멈추고 「Step 4 로 돌아가기」가 주 버튼인지 잰다.
