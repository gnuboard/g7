  - tests/Unit/Repositories/LayoutExtensionVersionRepositoryTest.php

notes:
  - 업데이트 확인 창의 「수정 유지」 안내 문구·목록 렌더는 admin-extension-update-screens.yaml(layout_strategy 영역)이 소유한다.
  - 활동 로그의 레이아웃 처리 요약은 core-activity-log-hooks.yaml 의 extension_update_records_layout_sync 가 소유한다.
  - 라이브 실측(업데이트 전·후 Chrome MCP 매트릭스)은 이력 문서에 남긴다.
  - 경로 × 출처 × 단위 칸은 LayoutSyncPathMatrixTest 의 데이터 제공자가 대부분 재고, 운영자가 지운·만든·이름 바꾼 템플릿 화면 칸은 LayoutKeepMergeTest 가 잰다.
  - 병합 결과 검증 실패(kept_invalid) 뒤 원본·해시 불변은 LayoutRowSynchronizerTest 가 동기화기 수준에서 잰다 — 설치 경로의 파일 검증이 data_sources id 중복을 먼저 막고 병합기가 중복을 만들 수 없어 refresh 경로로는 재현되지 않는다.
