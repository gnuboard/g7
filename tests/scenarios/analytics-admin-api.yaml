# audit:allow test-scenario-coverage reason: |
#   cross product 자동 전개는 audit 실행 환경의 fallback YAML 파서가 nested axes 를 읽지
#   못한다(저장소 기존 시나리오와 같은 한계). 축 조합은 PHPUnit Feature 테스트가 커버하고
#   green 이다.

feature: 방문자 통계 관리자·공개 API (이슈 #682 S2)

description: |
  집계된 숫자를 화면이 읽어 가는 길, 그리고 운영자가 설정·삭제·정보주체 요청을 수행하는 길.

  배경:
    - 권한이 셋으로 갈린다. read 는 숫자를 보는 것, update 는 설정·집계·삭제처럼 상태를
      바꾸는 것, privacy 는 개별 방문자를 들여다보는 것이다. 한 화면 안에서도 갈린다 —
      현재 접속자 목록은 read 로 보이되 그 IP 는 privacy 가 있어야 채워진다.
    - 되돌릴 수 없는 길(전체 삭제·소급 익명화·정보주체 삭제)에는 확인 없이 들어갈 수
      없다. 조건 없는 정보주체 삭제는 원장 전체를 지우는 사고가 된다.
    - 설정은 전용 API 와 코어 설정 API 두 길로 저장된다. 규칙을 한쪽에만 두면 다른 길로
      들어온 값이 검증 없이 저장되고, 그 값이 수집·정리·집계를 조용히 망가뜨린다.
    - 공개 요약은 로그인 없이 누구나 부른다 — 네 숫자만 나가고, 꺼져 있으면 0 이 아니라
      404 로 답한다(위젯이 0 을 보고 아무도 오지 않았다고 그리면 안 된다).

  적용 지점:
    - `app/Http/Controllers/Api/Admin/Analytics/**` 열한 컨트롤러, 라우트 27건(공개 요약 1건 제외).
    - `app/Http/Requests/Admin/Analytics/**` FormRequest — 기간·목록·확인 규약.
    - `app/Services/Analytics/{Overview,Series,Report,Pattern,Realtime,Diagnostics}Service`.
    - `app/Services/Analytics/{CsvExporter,DataSubjectService,ReportMailService}`.
    - `app/Http/Controllers/Api/Public/AnalyticsSummaryController` 공개 요약 1건.

coverage_strategy: pairwise

axes:
  endpoint: [overview, series, reports, patterns, realtime, visitors, visitor_detail, referrer_urls, diagnostics, collect_failures, archive_runs, settings, opt_out, data, privacy_subjects, cloud_ranges, summary]
  role: [none, read, update, privacy, superadmin]
  period: [valid, inverted, too_long, preset]
  format: [json, csv]
  confirm: [given, missing]

exclusions:
  - { endpoint: summary, role: none, reason: "공개 요약은 인증을 요구하지 않는다 — 권한 축이 성립하지 않는다" }
  - { format: csv, endpoint: settings, reason: "설정은 표가 아니다 — 내보낼 행이 없다" }
  - { confirm: missing, endpoint: overview, reason: "조회는 되돌릴 수 없는 작업이 아니라 확인을 받지 않는다" }
  - { format: csv, endpoint: referrer_urls, reason: "도메인 아래를 펼쳐 보는 목록이다 — 내려받기는 사이트 목록(reports)이 맡는다" }

