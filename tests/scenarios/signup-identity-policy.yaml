feature: 회원가입 본인확인 정책과 이메일 인증 기록

description: |
  본인인증 정책 `core.auth.signup_before_submit`(가입 제출 전 확인 토큰)과 `core.auth.signup_after_create`(가입 직후
  PendingVerification + challenge)가 가입을 막고 통과시키는지, 그리고 메일 수단으로 그 회원의 이메일을 확인한 가입만
  `users.email_verified_at` 을 기록하는지 본다(`RecordVerifiedSignupEmail`, `UserRepositoryInterface::markEmailVerified()`).
  휴대폰 같은 다른 수단으로 확인한 가입, 확인 없이 가입한 회원은 기록하지 않는다.

coverage_strategy: pairwise

axes:
  case: [no_policy, before_submit_no_token, before_submit_mail_token, before_submit_non_mail_token, before_submit_token_past_grace, before_submit_target_mismatch, after_create_pending, after_create_mail_verify, after_create_generic_enforcer, after_create_response_challenge, after_create_guest_resend, repository_mark_twice, before_submit_mark_fails, before_submit_input_errors_first]

effects:
  - signup_without_policy_active_email_unverified
  - signup_before_submit_requires_token
  - signup_before_submit_reports_input_errors_before_verification
  - signup_before_submit_mail_token_activates_and_marks_email
  - signup_email_marked_verified_only_for_mail_channel
  - signup_token_bypasses_grace_window
  - signup_token_target_mismatch_blocked
  - signup_after_create_pending_with_challenge
  - signup_after_create_response_carries_challenge
  - signup_after_create_resend_binds_pending_user
  - signup_after_create_verify_activates_and_marks_email
  - after_register_not_enforced_by_generic_listener
  - mark_email_verified_records_once
  - signup_survives_email_mark_failure

test_files:
  - tests/Feature/Api/Auth/RegisterPolicyDrivenSignupTest.php
  - tests/Unit/Repositories/UserRepositoryEmailVerifiedTest.php
