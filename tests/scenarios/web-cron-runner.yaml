rules_layer_coverage:
  - rule: web-artisan-spawn-requires-runner
    coverage: |
      러너는 커맨드를 스폰하지 않는다 — `CommandRunnerResolver::resolve(Inprocess)` 가
      돌려준 러너에게 넘긴다. 웹 크론의 존재 이유가 "스폰 불가" 이므로 이 경로는 모드
      판정과 무관하게 언제나 in-process 다.
  - rule: listener-must-implement-hooklistenerinterface
    coverage: |
      대시보드 경고 리스너는 HookListenerInterface 를 구현하고 `type: 'filter'` 를
      명시한다 — 미명시 시 반환값이 버려져 경고가 조용히 사라진다.
  - rule: dynamic-route-static-extension
    coverage: |
      웹 크론 주소는 정적 확장자로 끝나지 않으므로 이중 등록 헬퍼가 필요 없다.
      그 성질 자체를 `cron_route_has_no_static_extension` 이 잰다.
