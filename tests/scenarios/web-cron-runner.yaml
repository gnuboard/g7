# audit:allow test-scenario-coverage[cross_product] reason: issue:#609 이 기능의 축은 서로 독립이다 — 호출 주체·번호 상태·스케줄 계통·소급 창·실행 상한·설정 저장 경로는 한 조합 안에서 동시에 성립하지 않는다. pairwise 전개가 요구하는 16축 동시 마킹을 달면 그 테스트가 실제로 재지 않는 축까지 커버로 계상되어, 마커가 사실이 아니게 된다. 실제 커버는 test_files 가 축 단위로 나눠 담당하고(단위 8 + 레이아웃 1 + E2E 1), 상호작용이 실재하는 조합(소급 창 x 최소 간격, 실행 상한 x 이월, 권한 x 노출 통로)은 명시 케이스로 따로 잰다.

feature: 예약 작업 웹 러너 (웹 크론 — A-5/A-6 · P5/G5)

description: |
  서버에 예약 실행(크론)을 걸 수 없는 호스팅에서 예약 작업을 주소 호출로 돌린다.
  진입점은 둘(웹 크론 엔드포인트 · `g7:schedule-run` 커맨드)이고 본체는 하나다.

  회귀 불변식 (계획서 A-5 · A-6 · §7.3 · §7.4):
    1. 대상은 **등록된 스케줄에서 도출**한다 — 러너가 자체 목록을 두면 등록 전수를
       고정한 가드가 무의미해지고 확장이 등록한 스케줄이 통째로 빠진다 (R17).
    2. `when()`/`skip()` 은 **소급 실행에서도 실행 시점에** 평가한다 — 확장의
       `enabled_config` 가 OFF 인데 웹 크론에서만 되살아나면 안 된다 (R16).
    3. 중복 방지는 이벤트가 가진 mutex 를 그대로 쓴다 — 서버 크론과 웹 크론이 함께
       걸린 환경에서 두 진입점이 같은 자물쇠를 본다 (R18).
    4. 실행 창 소급 판정(D17): 호출 주기가 성겨 고정 시각을 지나쳐도 그 사이에 due 였던
       작업을 **1회씩** 따라잡는다. 최소 호출 간격에 걸려 건너뛴 호출은 작업을 잃지
       않는다 — 점검 시각이 전진하지 않아 다음 창이 그 구간을 덮는다.
    5. 실행 상한에 걸리면 남은 작업은 다음 호출로 이월된다. 점검 시각을 전진시키면
       그 잔여가 창 밖으로 밀려나 영영 실행되지 않는다.
    6. 호출 번호는 **일반 설정 통로 어디에도 실리지 않는다** (D20) — 목록 조회·단건
       조회·상태 조회 셋 다. 노출은 권한을 확인하는 전용 경로 한 곳뿐이다.
    7. 인증을 통과하면 실행 0건이어도 **200** 이다 — 외부 크론 서비스는 비-200 을
       장애로 보고 알림을 쏟는다. 인증 실패만 401/403.
    8. 미실행 경고는 **실행 모드와 무관하게** 발화하고, 조치 안내 문구만 갈린다 (D30).
    9. 되뽑기 실패는 조용히 건너뛰지 않는다 — 건너뛰면 그 예약이 오류 없이 사라진다.
    10. DB 스케줄 계통은 이 안에서 연결하지 않는다 (D8). 붙일 때 보안 검증기를 반드시
        경유해야 한다는 조건만 설계에 남긴다 (R15).

axes:
  caller: [panel, external, visit]                          # 호출 주체 — 관리자 화면 / 외부 크론 서비스 / 방문 트리거 폴백
  entry_point: [web, cli]                                   # 진입점 둘 — 본체는 하나여야 한다
  token: [valid, invalid, missing, rotated, unissued]       # 호출 번호 상태 (unissued = 발급 전 — 무인증 표면이 되면 안 된다)
  token_channel: [query, header]                            # 번호 전달 통로 — 헤더를 못 쓰는 외부 서비스가 많아 둘 다 받는다
  event_kind: [shell_event, callback_event, non_artisan]    # 스케줄 계통 — 되뽑기 대상 / in-process 그대로 / 되뽑기 불가(실패로 드러낸다)
  catch_up: [on_time, missed_window, long_gap, beyond_cap]  # 소급 판정 (D17) — beyond_cap = 창 상한 밖(소급하지 않는다)
  overlap: [none, filtered, other_server]                   # 실행 직전 판정 — 조건부 등록(R16) · 다중 서버(onOneServer)
  runtime_budget: [within, exceeded]                        # 실행 상한 — 초과 시 이월
  cron_mode: [auto, web, cron, both]                        # 실행 방식 설정 — cron 은 주소 호출을 실행으로 잇지 않는다
  min_interval: [zero, within, elapsed]                     # 최소 호출 간격 — within 은 실행 없이 200
  ip_allow_list: [empty, match, mismatch]                   # 허용 주소 (CIDR 포함)
  execution_mode: [subprocess, inprocess]                   # 유효 실행 모드 — 경고 발화는 무관, 조치 문구만 분기 (D30)
  actor_permission: [settings_read, settings_update, none]  # 관리자 API 권한 경계
  stale_state: [never_run, recent, stale]                   # 미실행 경고 발화 조건 (D19)
  setting_save_path: [bulk, single]                         # 설정 저장 두 경로 — 한쪽만 검증하면 다른 쪽이 우회로다
  schedule_declaration: [declared, empty, explicit_class, unresolvable, core_vendor, regeneration_path]  # 확장 예약 커맨드 해석 입력 (D42) — 선언분만/선언 없음/클래스 명시/해석 불가/코어가 진 벤더 커맨드/오토로드 재생성 경로
  # 브라우저에서만 재현되는 축
  vector: [browser_reveal, browser_run_now, browser_detect]  # 화면 동선 — 가림/노출·지금 실행·다시 감지

# 전 조합(1,680만 케이스)은 전개할 수 없다 — 축이 서로 독립이라 쌍 단위 커버로 충분하다.
# 실제로 상호작용하는 조합(소급 창 × 최소 간격, 실행 상한 × 이월, 권한 × 노출 통로)은
# test_files 가 명시 케이스로 따로 잰다.
coverage_strategy: pairwise

exclusions:
  - { caller: visit, token: invalid, reason: "방문 트리거는 번호를 쓰지 않는다 — 설정과 최소 간격만 판정한다" }
  - { entry_point: cli, token: invalid, reason: "CLI 진입점은 쉘 접근 자체가 인증이다 — 번호를 요구하지 않는다" }
  - { event_kind: non_artisan, catch_up: beyond_cap, reason: "되뽑기 실패는 due 판정 이후 단계라 창 밖 이벤트에는 도달하지 않는다" }

