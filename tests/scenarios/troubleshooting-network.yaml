feature: 트러블슈팅 회귀 — 네트워크 복원력(fetch 재시도, script 로더 실패, 확장 부재, CSS 로드 실패)

description: |
  troubleshooting-network.test.ts 의 해결된 트러블슈팅 사례를 잠그는 회귀 시험이다.
  사례마다 원인이 달라 사례끼리 곱할 입력 축이 없다. 축 case 는 문서의 사례(시험 파일의 가장 안쪽 describe) 하나씩이고,
  효과는 그 사례가 지키는 해결 성질 하나씩이다(같은 사례의 시험 여럿은 같은 칸과 같은 효과를 서로 다른 각도로 잠근다).

axes:
  case: [fetch_network_cancel, script_loader_onerror, missing_extension_blank, css_load_failure]

effects:
  - transient_fetch_failure_retried_bounded
  - script_load_failure_retried_then_rejected
  - missing_extension_fails_fast_without_raw_ids
  - css_load_failure_retried_then_rejected

test_files:
  - resources/js/core/template-engine/__tests__/troubleshooting-network.test.ts

notes: |
  2026-11-09 tsc 오류를 정리하며 이 파일을 손대자 audit `test-scenario-reverse-mapping` 의 선행 부채(시험별 매핑 누락)가
  드러나 이 매니페스트로 해소했다. 시험 동작은 바꾸지 않았다(마킹 주석만). 선례는 troubleshooting-state-advanced.yaml.
