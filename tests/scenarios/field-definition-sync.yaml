feature: field_definition_sync

description: |
  항목 선언 동기화(FieldDefinitionSyncHelper)와 교차 기여. 코어(config/core.php 의 fields)와 확장(getFields)의 선언이
  field_definitions 로 들어가고, 운영자가 고친 속성은 보존되며, 운영자가 만든 항목(custom)은 어떤 동기화에서도 남는다.
  한 확장이 가진 집합에 다른 확장이 항목을 선언하는 경우(교차 기여)의 수용·거절·복귀 규칙을 함께 잠근다.

coverage_strategy: full

axes:
  source: [core, plugin, module, custom]

exclusions:
  - { source: module, reason: "모듈과 플러그인은 같은 헬퍼를 출처 문자열만 바꿔 부른다. 플러그인 축이 같은 코드 경로를 덮는다. 모듈 고유 경로(ModuleManager 배선)는 7단계의 게시판·이커머스 선언 테스트가 잰다." }

effects:
  - core_fields_seeded_with_legacy_defaults
  - declared_sync_is_idempotent_and_preserves_operator_edits
  - stale_declared_field_removed_with_values
  - custom_fields_survive_every_sync
  - empty_declaration_never_wipes_rows
  - invalid_declaration_skipped_with_reason
  - core_resync_seeds_fields_on_upgrade
  - cross_contribution_creates_row_under_owner_bundle
  - owner_disabled_hides_contribution_and_restores_overrides
  - contributor_disabled_hides_only_its_fields
  - cross_contribution_rejections
  - contributor_removal_cleans_only_its_rows
  - filter_definitions_adjusts_fields_per_request
  - extension_type_availability_follows_registry

test_files:
  - tests/Feature/Fields/FieldDefinitionSyncTest.php
  - tests/Feature/Fields/CrossExtensionFieldContributionTest.php
