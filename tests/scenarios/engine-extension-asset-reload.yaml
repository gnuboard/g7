feature: 확장 자산 재로드 핸들러 — 출처 정책과 CSS 로드 보장

description: |
  `reloadModuleHandlers` / `reloadPluginHandlers` 는 확장 활성화 응답이 지시하는 URL 을 `<script>`/`<link>` 로 붙인다.
  레이아웃 `scripts[]` 와 같은 출처 정책(미신뢰 외부 URL 차단, 신뢰 호스트 허용)을 받고,
  script 가 이미 있어도 CSS 로드는 건너뛰지 않는다.

axes:
  case: [same_origin_js_css, untrusted_external_js, untrusted_external_css, script_already_present, css_only_extension, trusted_external_host]

effects:
  - same_origin_extension_assets_loaded
  - untrusted_external_extension_script_blocked
  - untrusted_external_extension_stylesheet_blocked
  - css_loaded_even_when_script_already_present
  - css_only_extension_assets_loaded
  - trusted_host_external_assets_allowed

test_files:
  - resources/js/core/template-engine/__tests__/ActionDispatcher.extensionAssets.test.ts
