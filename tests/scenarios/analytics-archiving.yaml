# audit:allow test-scenario-coverage reason: |
#   cross product 자동 전개는 audit 실행 환경의 fallback YAML 파서가 nested axes 를 읽지
#   못한다(저장소 기존 시나리오와 같은 한계). 축 조합은 PHPUnit Feature 테스트가 커버하고
#   green 이다.

feature: 방문자 통계 집계 — 원장을 시간·일·차원 표로 (이슈 #682 S2)

description: |
  쌓인 방문·액션·봇 기록을 읽어 화면이 보는 집계 표 셋(시간·일·차원)을 만든다.

  배경:
    - 화면은 원장을 직접 읽지 않는다. 몇 달치 방문을 화면을 열 때마다 훑으면 느리고,
      보존기간이 지나 원장을 지워도 과거 숫자는 남아야 한다.
    - 집계는 「지우고 넣기」다. 갱신(upsert)으로 하면 다시 계산했을 때 순위에서 빠진
      라벨이 남아 합계가 실제보다 커진다.
    - 원장은 UTC 로 적히고 집계는 사이트 표준시로 묶인다. 두 기준이 섞이면 한국 새벽
      방문이 어제로 가고, 운영자는 「오늘 방문자」가 왜 적은지 알 수 없다.
    - 집계가 조용히 실패하면 화면 숫자가 그 시점에 멈춘 채 그럴듯하게 남는다. 그래서
      실행마다 이력 행을 남기고 실패를 알림으로 밀어 올린다.

  적용 지점:
    - `app/Services/Analytics/ArchiveService` 가 하루치를 훑어 세 표를 한 트랜잭션으로 바꾼다.
    - 누적기 둘(`DailyAccumulator`·`HourlyAccumulator`)이 원장을 한 번만 읽고 지표를 쌓는다.
    - `ArchiveCollector` 가 확장이 만든 차원 행을 받아 같은 트랜잭션에 넣는다.
    - `analytics:archive` 가 스케줄러·수동 실행 버튼의 입구다.

coverage_strategy: pairwise

axes:
  period: [hour, day, range]
  trigger: [scheduled, manual]
  lock: [free, held]
  data: [empty, single_type, all_types, bot_only, extension_rows, conversions]
  timezone: [Asia/Seoul, America/New_York, UTC]
  final: [true, false]

exclusions:
  - { period: hour, final: true, reason: "오늘 숫자는 계속 변하므로 매시 집계는 확정하지 않는다 — 계약이다" }
  - { lock: held, data: extension_rows, reason: "락에 걸린 실행은 집계 자체를 시작하지 않아 확장 훅도 부르지 않는다" }
  - { period: range, trigger: scheduled, reason: "기간 재집계는 운영자가 화면·커맨드로 부르는 길이다" }

