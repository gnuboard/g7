  - on_view_runs_once_per_minute
  - recent_archive_is_not_repeated
  - on_view_skips_when_today_visits_exceed_limit
  - on_view_too_many_status_persists_across_requests
  - on_view_lock_miss_leaves_no_skipped_row
  - missed_days_are_finalized_by_catch_up
  - catch_up_respects_visit_budget
  - stale_running_rows_are_closed
  - on_view_failure_never_breaks_response
