  - bucket_bounds_setting_changes_labels
  - legacy_url_event_rows_are_excluded
  - free_text_dimensions_are_capped
  - duration_bucket_boundaries
  - pages_bucket_boundaries
  - bucket_labels_parse_back
  - broken_bounds_fall_back_to_default
  - every_stats_dimension_gets_rows_from_its_source
