feature: cache_notification_migration

description: |
  알림 정의 캐시와 템플릿 캐시가 코어 캐시 드라이버의 새 접두사(`g7:core:notification.*`)로 옮겨졌는지 고정한다
  (계획서 §13 D-1, D-2). NotificationDefinitionService 의 resolve(), getAllActive() 와
  NotificationTemplateService 의 resolve() 는 첫 호출 결과를 저장하고 다음 호출에는 Repository 를 다시 부르지 않는다
  (mock once()). 정의 수정과 활성 토글은 type 키와 all_active 키를 함께 지우고, 템플릿 수정, 활성 토글, 기본값 복원은
  `notification.template.{type}.{channel}` 키를 지운다. Repository 는 mock, 캐시는 실제 CoreCacheDriver(array) 를 쓴다.

axes:
  case:
    - definition_resolve      # 정의 resolve 저장과 재사용 (D-1-1, D-1-2)
    - definition_update       # 정의 수정 (D-1-3)
    - definition_toggle       # 정의 활성 토글 (D-1-4)
    - definition_all_active   # 전체 활성 정의 목록 (D-1-5)
    - template_resolve        # 템플릿 resolve 저장과 재사용 (D-2-1, D-2-2)
    - template_update         # 템플릿 수정 (D-2-3)
    - template_toggle         # 템플릿 활성 토글 (D-2-4)
    - template_reset          # 템플릿 기본값 복원 (D-2-5)

exclusions:
  - { case: definition_resolve, reason: "제외 없음 — 사례 단일 축(대상과 동작 조합은 사례로 고정)" }

effects:
  - definition_cached_under_core_key       # resolve() 뒤 notification.definition.{type} 키가 있고 g7:core: 접두사로 풀린다
  - definition_cache_hit_skips_repository  # 같은 type 을 두 번 resolve 해도 Repository 는 한 번만 불린다
  - definition_keys_invalidated            # 정의 수정이나 토글 뒤 type 키와 all_active 키가 모두 없다
  - all_active_cached_and_reused           # getAllActive() 결과가 all_active 키에 저장되고 재호출은 Repository 를 부르지 않는다
  - template_cached_under_core_key         # resolve() 뒤 notification.template.{type}.{channel} 키가 있고 g7:core: 접두사로 풀린다
  - template_cache_hit_skips_repository    # 같은 type, channel 을 두 번 resolve 해도 Repository 는 한 번만 불린다
  - template_key_invalidated               # 템플릿 수정, 토글, 복원 뒤 템플릿 키가 없다

test_files:
  - tests/Unit/Cache/Migration/NotificationCacheTest.php
