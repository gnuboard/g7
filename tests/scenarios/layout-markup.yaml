feature: 레이아웃 마크업 형식 (.g7.html) 컴파일러

description: |
  JSON 레이아웃 엔진을 런타임 SSoT 로 유지한 채, HTML 유사 마크업 형식 `.g7.html` 을
  설치 시 서버(PHP)가 JSON 으로 컴파일하는 파이프라인.

  본 매니페스트는 단계별로 누적된다 (S1 토크나이저 → S2 노드 → S2.5 확장 컴포넌트 →
  S3 액션 → S4 문서 5계층 → S5 임베딩 → S6 검증기/커맨드 → S7~S9 → S10 설치 재아키텍처).
  커버 범위를 **산문에 적지 않는다** — 그 문장은 낡는다(32차 실측: effects·test_files 는 S18 P1 과
  가드 회차분까지 등재돼 있는데 헤더만 "S1~S14" 에 멈춰 있었고, `GateMembershipGuardTest` 는
  `test_files` 만 읽으므로 그 불일치를 구조적으로 잡지 못했다). 무엇이 커버되는지는 아래
  `effects` 와 `test_files` 가 정본이고, 그 둘과 게이트 필터의 정합은 `GateMembershipGuardTest` 가
  양방향으로 잠근다.

  용어(설계 정의, D38): **compile = JSON → HTML**(소스 산출), **decompile = HTML → JSON**(설치·검증).

  S10 범위 — 설치 재아키텍처 (ValidatesLayoutFiles·RefreshesLayoutExtensions, D38·D39):
    - 소스 SSoT 는 `.g7.html`. 설치는 `.g7.html` 을 **설치 시점에 메모리로 컴파일**(강검증 포함)해
      DB 에 등록하고 산출 JSON 을 디스크에 쓰지 않는다. `.g7.html` 이 없으면 `.json` 을 직접 등록한다
      (병존 · 선택 설치원). 같은 논리 레이아웃에 둘이 나란히 있으면 소스 SSoT 인 `.g7.html` 이 이긴다.
    - 두 SSoT 가 애초에 공존하지 않으므로 provenance 표식·공존 판별·install-diff 는 폐기됐다.
    - fragment(확장 주입)도 대칭으로 `.g7.html`(있으면 우선)을 등록 시점에 컴파일한다.

  S6 범위 — LayoutValidator + LayoutLinter + LayoutMarkupCompiler(파사드) + layout:decompile 커맨드:
    - 강검증은 컴파일 산출 JSON 을 대상으로 한다. 현행 파일 설치 경로엔 구조 검증이 없어(계획서
      "검증·서빙 파이프라인 사실"), 편집기 저장 경로가 쓰는 `app/Rules/*`(ValidLayoutStructure·
      WhitelistedEndpoint·NoExternalUrls·ValidLayoutExtensionStructure)를 **그대로 재사용**해 동등
      강도로 잡고, 위반을 CompileError 로 승격한다. 규칙이 못 보는 셋 — wait_for cross-field
      (websocket·background 데이터소스는 오버레이가 안 걷힘)·`<script src>` 호스트 화이트리스트
      (NoExternalUrls 사각지대, Q4)·컴포넌트 존재 그물 — 은 직접 검사한다.
    - lint 은 컴파일을 막지 않는 경고 5종이다: 미등록 핸들러(코어 44·템플릿 등록·확장 `.` 밖)·
      플러그인 완전 레이아웃(gdpr_consent_log·plugin_settings 예외)·nesting 위반(빈 accepts 부모
      제외 — 오검출 회피)·responsive portable↔mobile/tablet 혼용·독립 레이아웃의 글로벌 호스트
      누락(toast·모달 silent failure). 강검증이 "못 만든다" 라면 lint 은 "만들되 권하지 않는다".
    - 파사드가 토큰→트리→문서→강검증→lint 사슬을 한 줄로 잇는다. 이 사슬은 `layout:decompile`
      (HTML→JSON 검증) 과 설치 시점 인메모리 컴파일이 공유한다 — 단일 파일/`--all` 스캔·검증 전용.

  S4 범위 — DocumentCompiler:
    - 루트 태그가 문서 종류를 정한다: `<layout>`(본 레이아웃)·`<partial>`(루트=노드)·
      `<extension>`(주입 fragment — 다른 봉투)·`<override>`(템플릿 오버라이드). 노드 층은 이 넷을
      노드 자리에서 거부한다(RootTagInNodePosition).
    - 최상위 섹션은 `<body>` 대신 섹션 태그로 온다: `<meta>`+`<seo>`·`<data-source>`(사전 B)·
      `<computed>`·`<init-*>`·`<init>`·`<action name>`·`<permissions>`·`<defines>`·`<error-handling>`·
      `<global-headers>`·`<transition-overlay>`·`<script>`·`<slot>`·`<modal>` → 각 JSON 최상위 키.
    - 같은 이름의 컴포넌트가 있는 태그는 위치로 갈린다: `<modal>` 은 문서 직속이면 섹션(modals),
      노드 안이면 Modal 컴포넌트. `<slot>` 은 문서 직속이면 slots 섹션, 노드 안이면 slot 자리표시 노드.
    - 상태 초기화는 `<field>`/`<from-source>` 트리다(JSON 리터럴 금지 — D5). `key` 없는 블록은
      필드가 각각 상태 키가 되고(레이아웃 루트 표준), `key` 지정 시 블록 전체가 그 키의 값이며
      `merge` 는 `<field>` 매핑에 `_merge` 로 얹는다(소스 값 블록에는 금지).

  S3 범위 — ActionCompiler + ActionHandlerManifest:
    - `<on>` 이 세 노드 키로 갈린다: type/event=actions[], mount/unmount=lifecycle, listen=onComponentEvent.
    - 병렬 3형태를 마크업 형태로 구분한다: 같은 이벤트 여러 `<on>` 블록=fire-and-forget, 한 블록
      여러 자식=암묵 sequence, `<parallel>`=명시 병렬. 기계 이관이 시맨틱을 조용히 바꾸지 않게.
    - 키가 top-level 이냐 params 냐는 핸들러가 정한다(매니페스트). target 은 apiCall 이면 엔드포인트,
      setState 면 상태 스코프라 위치가 다르다 — 넣는 자리가 틀리면 엔진이 조용히 무시한다.
    - confirm 은 이벤트에 직접 연결된 진입 액션에서만, init 루트는 축소 화이트리스트로 더 좁게.

  S1 범위 — MarkupTokenizer + CompileError:
    - 소스 문자열 → 평면 토큰 스트림(start_tag/end_tag/text/comment). 중첩·짝 맞춤은
      다루지 않는다(트리 구성은 S2).
    - HTML5 부분집합만 인정하고 나머지는 라인·컬럼이 붙은 CompileError 로 거부한다.
      브라우저 파서의 오류 복구(미닫힘 자동 보정)를 쓰지 않는 이유가 이것이다 —
      침묵 보정은 컴파일러의 존재 이유와 정반대다.
    - 부분집합: 속성값 항상 인용 / 불리언 속성은 존재·부재 / 태그명 소문자·kebab /
      속성명 원문 보존(대소문자·대괄호·콜론) / 문자 참조는 세미콜론 필수 / raw text 요소 없음.
    - void 요소 = HTML5 표준 14종 − `meta` = 13종. G7 에서 `<meta>` 는 `<seo>` 를 품는
      컨테이너 섹션이므로 void 일 수 없다(매핑 사전 A).

  S2 범위 — ComponentRegistry + MarkupTreeBuilder + NodeCompiler + StateTreeCompiler:
    - 토큰 스트림 → 요소 트리 → JSON 노드(매핑 사전 C). 액션(`<on>`)·임베딩 hoist
      (`<cell>`·`<responsive>`)·문서 루트(`<layout>`)는 각각 S3·S5·S4 몫이다.
    - 속성 3분할: 무접두 = props(원문 통과) / `data-*` 예약 = 엔진 지시자 / `:attr` = 타입 리터럴.
    - props 는 화이트리스트로 검증하지 않는다 — components.json 의 prop 선언 커버리지가
      실측 75~77% 에 그치고 미선언 상위가 `Button.type`·`Input.value` 같은 정상 props 다.
    - 표현식은 어느 위치에서도 선평가하지 않는다. 컴파일러가 표현식에 관여하는 지점은
      `data-if` 혼합형 판정 하나뿐이다(계획 D3/D4).

  S2.5 범위 — ComponentManifest + ComponentOverrideResolver + 런타임 self-register:
    - 태그 해석 소스 = **템플릿 + 활성 모듈 + 활성 플러그인 3계통**. 확장이 자기 컴포넌트를
      제공할 수 있게 되면서 마크업 어휘가 템플릿 단독 소유에서 벗어났다(D25 — D20 개정).
    - 좌표계는 소유자로 갈린다: 템플릿은 `DataGrid`/`<data-grid>`, 확장은
      `{식별자}.{이름}`/`<{정규화된-식별자}-{kebab}>`. 프리픽스 덕에 템플릿↔확장·확장↔확장
      이름 충돌이 구조적으로 불가능하다.
    - 태그 프리픽스는 식별자의 `_` 를 `-` 로 접는다 — 번들 확장 14개 중 7개가 언더스코어를
      품는데 마크업 태그명은 소문자·하이픈만 허용하기 때문이다. 접은 결과가 겹치는 두 확장은 거부.
    - 세 개념을 섞지 않는다: **제공**(확장) / **오버라이드**(템플릿만 — 남의 것을 대체) /
      **템플릿 전용 판본 `for`**(확장 — 자기 것을 그 템플릿에서만 다르게).
    - 오버라이드 승패는 **집합 필터링**이지 priority 가 아니고, 비호환이면 원본 폴백이다
      (레이아웃 오버라이드 규약 계승). 판본 **선택**은 런타임 관심사라 컴파일러가 모른다.

# 축은 컴파일 단위 × 소스 적법성 두 개다. 값 형태(태그 형태·토큰 종류·속성 표기·값 타입)를
# 축으로 두면 조합이 수천 건대로 발산하는데 그 대부분이 구조적으로 성립하지 않는다(텍스트
# 토큰에 속성이 없고, 레지스트리 검증에 토큰 종류가 없다). 조합 열거로 부풀리는 대신 effects
# 에서 값별로 직접 관측한다 — 아래 effects 는 전부 테스트 docblock @effects 로 개별 매핑되어
# 기계 검증된다.
axes:
  compile_unit: [tokenize, tree, registry, node, attribute, structural_tag, action, embedding, document, validator, linter, facade, install, decompile]
  source_health: [valid, invalid]

# S6 lint 은 컴파일을 막지 않는 경고라 "잘못된 소스" 축이 없다 — 항상 컴파일되는(valid) 산출
# JSON 을 대상으로 안티패턴을 경고할 뿐이다. 그래서 linter 단위는 invalid 와 짝짓지 않는다.
# 어떤 lint 이 무엇을 잡는가는 축이 아니라 effects 로 개별 관측한다(각 lint warn/no-warn 쌍).
exclusions:
  - { compile_unit: linter, source_health: invalid, reason: "lint 은 경고라 잘못된 소스 개념이 없음 — valid 산출 JSON 만 대상" }
  - { compile_unit: decompile, source_health: invalid, reason: "역변환은 컴파일 산출 JSON(항상 valid)을 입력받아 .g7.html 로 되돌린다 — 잘못된 소스 개념이 없음" }

effects:
  # 11차 develop 병합 유입(7.0.11) — 공개 서빙 캐시 키는 서버 현재 버전으로만 조립한다(클라이언트 ?v 는 HTTP 캐시 우회용).
  - serving_cache_key_uses_server_current_version
  # #747 유입 — 서빙 응답의 빈 객체·빈 배열 보존(LayoutServingEmptyObjectTest, 소유 매니페스트 layout-serving-empty-object.yaml).
  # 게이트 필터 `LayoutServing` 에 걸려 도는 테스트라 그 effect 도 등재한다. 코어 수정(#759 리베이스로 합류)으로 두 effect 모두 통과한다.
  - empty_object_served_as_object
  - empty_array_served_as_array
  # 같은 테스트 파일이 topic(#759) 쪽에서 단 효과 — issue759 → develop-7.1.0 리베이스로 한 파일에 합쳐져 게이트에서 함께 돈다.
  - init_state_empty_object_preserved
  - fallback_empty_object_preserved
  - action_params_empty_object_preserved
  - empty_list_stays_list
  - root_map_section_restored
  # --- S1 토큰 방출
  - start_tag_carries_name_attributes_and_source_position
  - end_tag_and_text_and_comment_tokens_are_emitted_in_authoring_order
  - self_closing_tag_is_marked_without_end_tag
  - void_element_is_auto_closed_without_slash
  - meta_is_a_container_not_a_void_element
  - script_is_a_normal_element_not_raw_text
  - empty_source_yields_no_tokens
  # --- S1 직렬화 충실도
  - boolean_attribute_value_is_null_and_distinct_from_empty_string
  - attribute_names_are_preserved_verbatim_including_case_brackets_and_colon
  - attribute_order_is_preserved
  - tag_names_are_lowercased_while_attribute_case_is_kept
  - character_references_are_decoded_in_text_and_attribute_values
  - bare_ampersand_is_preserved_for_expressions
  - angle_brackets_inside_quoted_values_pass_through
  - comment_content_is_verbatim_and_not_entity_decoded
  - text_whitespace_is_preserved_and_flagged_for_upper_layers
  - bom_is_stripped_and_crlf_is_normalized_to_lf
  # --- S1 좌표
  - line_and_column_are_tracked_across_lines
  - column_counts_characters_not_bytes
  - attribute_positions_are_recorded
  - tokenizer_instance_resets_state_between_runs
  # --- S1 거부 (부분집합 위반)
  - doctype_cdata_and_processing_instruction_are_rejected
  - unescaped_lt_in_text_is_rejected_with_entity_suggestion
  - eof_inside_tag_or_comment_is_rejected
  - uppercase_tag_is_rejected_with_lowercase_suggestion
  - invalid_tag_name_is_rejected
  - end_tag_with_attributes_or_self_closing_is_rejected
  - void_end_tag_is_rejected
  - unquoted_attribute_value_is_rejected
  - unterminated_attribute_value_is_rejected
  - duplicate_attribute_is_rejected
  - missing_attribute_separator_is_rejected
  - unknown_or_invalid_character_reference_is_rejected
  # --- 오류 보고 계약
  - error_carries_code_line_column_and_path
  - error_message_is_translated_per_locale
  - error_detail_is_not_mangled_by_envelope_replacement
  # ko/en(코어) + 번들 언어팩 로케일까지 — supported_locales 만 보면 ja 팩이 통째로 비어도 green 이 된다
  - every_error_code_has_a_message_in_every_shipped_locale
  # 위는 열거형 케이스만 본다 — 봉투 키(error_at*)와 tag_owner.* 는 ko 파일 리프 전체를 기준으로 따로 검사
  - every_layout_markup_message_key_exists_in_every_shipped_locale
  # --- S1 견고성
  - random_input_terminates_with_tokens_or_compile_error
  - mutated_valid_document_terminates_with_tokens_or_compile_error
  # --- S2 레지스트리
