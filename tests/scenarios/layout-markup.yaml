# S18.5 축 B — 설치/업데이트/삭제 × 소스 매트릭스.
#
# 계획서는 이 매트릭스를 최상위 axis 로 적으라고 했으나 착수 실측에서 실행 불가로 확인됐다:
# `test-scenario-coverage` 는 axes 전 곱집합을 전개하고 `@scenario` 마킹과 **정확 일치**로만
# 커버를 인정하므로, `layout_source`(4) · `install_operation`(7) 을 얹으면 곱집합이
# `14 × 2` → `14 × 2 × 4 × 7 = 784` 가 되고 **기존 마킹이 한 칸도 매칭되지 않는다**(키 개수가
# 달라진다). 그래서 매트릭스는 sub_flow 로 등재하고, 곱집합 전수 선언과 그 폐쇄는
# `LayoutSourceMatrixTest` 의 상수 둘(SOURCES · OPERATION_COLLECTION)이 코드로 진다.
sub_flows:
  - id: layout_source_matrix
    description: |
      소스 4(markup-only · json-only · both(auto) · both(--layout-source=json))
      × 동작 7(install · update(overwrite) · update(keep) · refresh-layout ·
      template:activate · deactivate · uninstall).

      일곱 동작은 소스를 각자 고르지 않고 셋으로 수렴한다 — 본 레이아웃 `validateLayoutFiles()` ·
      fragment `loadFragmentDefinitions()` · **읽지 않음**(deactivate·uninstall 은 DB 행 필터).
      수집 경로 둘은 소스 4 전량에 대해 행동으로 관측하고, 동작이 그 셋으로 수렴하는지는
      코드 대조로 잠근다.
    effects:
      - layout_registration_set_and_content_match_the_source_matrix
      - fragment_collection_follows_the_same_source_matrix
      - forced_json_on_markup_only_keeps_the_layout_and_logs_a_warning
      - forced_json_does_not_warn_when_the_json_twin_exists
      - orphan_cleanup_list_is_derived_from_the_selected_sources
      - every_extension_operation_routes_layout_sources_through_the_convention
      - operation_axis_declaration_covers_every_planned_operation
      - keep_strategy_preserves_admin_edits_regardless_of_source_selection

