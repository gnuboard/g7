  # S21 — 주석 귀속 폐쇄. 위 두 축은 트리 빌더가 보는 것(귀속 대상이 있는가)이고, 아래는 그 다음
  # 질문이다: **귀속된 그 자리가 산출 JSON 에 주석을 담을 수 있는가.** 착수 실측이 `<on>` 앞 주석의
