  # 마크업에만 있던 주석의 소실을 구조적으로 못 본다 — 그 사각을 이 축이 덮는다.
  - comment_before_on_block_is_a_compile_error
  - comment_on_first_action_lands_in_actions_entry
  - comment_on_explicit_sequence_lands_in_actions_entry
  - comment_before_modal_src_lands_in_modals_entry
  - wrapper_comment_hoists_onto_the_inline_modal_node
  - wrapper_and_node_comment_collision_is_a_compile_error
