feature: 압축 풀기 부트스트랩 (FTP 전용 계정 — 무CLI 환경 지원 축 B / P4·G4)

description: |
  쉘도 PHP CLI 도 없고 FTP 만 주어지는 호스팅에서 배포 ZIP 을 서버에서 푸는 단일 진입
  파일(`g7-setup.php`). 이 파일이 도는 시점에는 아직 아무것도 풀리지 않았으므로 코어·
  인스톨러의 어떤 코드도 require 할 수 없고, 필요한 판정을 자기 안에 갖는다.

  이 경로는 **인증되지 않은 파일 쓰기 표면**이다. 그래서 성립 조건이 넷이다:
    1. 설치가 끝난 사이트에서는 동작하지 않는다 (판정은 인스톨러 진입 가드와 같은 규칙).
    2. 최초 실행 시 만들어지는 1회용 확인 번호를 요구한다 — 그 번호는 서버 파일에 적히므로
       **파일 접근 권한이 곧 인증**이다. 6자리는 원격 대입 표면이라 지수 지연 + 잠금 +
       번호 재발급을 함께 건다. 잠금은 **번호 추측에만** 걸린다 (이미 인증된 브라우저의
       해제를 멈추면 원격에서 성립하는 서비스 거부가 된다).
    3. 압축 안의 경로 순회를 거부한다 — 안전한 엔트리 한 개도 쓰지 않고 계획 단계에서 멈춘다.
    4. 완료 후 진입 파일·ZIP·상태·번호 파일을 스스로 지운다. 지우지 못하면 화면에 알린다.

  해제 전략은 `ZipArchive` 단독이다. `PharData` 는 경로 100바이트 제한으로 파일을 조용히
  누락시킨 선례가 있어 쓰지 않고, 외부 명령은 이 파일의 존재 이유와 정면으로 어긋난다.

  재개 규약: 처리한 엔트리 개수를 상태 파일에 남기고 브라우저가 이어서 호출한다. 라우팅을
  가로채는 루트 파일(`.htaccess`·`index.php`·`web.config`)은 **맨 마지막에** 쓴다 — 그 둘이
  먼저 놓이면 모든 요청이 `public/` 으로 위임되어 이 파일 자신이 브라우저에서 사라지고,
  그 순간 재개가 불가능해진다.

  압축 파일 모양(#971): GitHub 소스 ZIP 은 감싼 폴더의 **폴더 항목**(`g7-7.2.0/`)을 맨 앞에 두고, Mac 재압축은
  `__MACOSX/` 부속 폴더를, Windows 압축 도구는 역슬래시 구분자를 쓴다. 셋 다 감싼 폴더를 벗겨 풀어야 한다.
  인증 규약: 맞는 번호로 인증한 요청은 그 뒤 판정이 실패해도 세션을 돌려준다 — 번호는 첫 인증에서 지워지므로,
  세션을 버리면 압축 파일만 바꿔 다시 시도할 길이 없다.

axes:
  archive: [g7_payload, github_dir_entries, backslash_dir_entries, macosx, traversal, foreign, absent]   # 대상 압축 파일의 성격·모양
  token: [valid, invalid, exhausted, session]         # 인증 수단과 그 상태
  entry: [fresh, resume, completed_site]              # 진입 상황

exclusions:
  # 완료된 사이트는 인증 **이전에** 차단된다 — 토큰·압축 축이 성립하지 않는다.
  - { entry: completed_site, token: invalid, reason: "완료 판정이 인증보다 앞서 차단한다" }
  - { entry: completed_site, token: exhausted, reason: "동일 — 시도 제한에 도달할 기회가 없다" }
  - { entry: completed_site, token: session, reason: "동일 — 세션 발급 경로가 열리지 않는다" }
  - { entry: completed_site, archive: traversal, reason: "압축을 열지 않고 차단하므로 내용 축이 무의미" }
  - { entry: completed_site, archive: foreign, reason: "동일" }
  - { entry: completed_site, archive: absent, reason: "동일" }
  # 압축 파일이 없으면 번호도 발급하지 않는다 — 인증·재개 축이 성립하지 않는다.
  - { archive: absent, token: invalid, reason: "번호를 발급하지 않으므로 오입력이 성립하지 않는다" }
  - { archive: absent, token: exhausted, reason: "동일" }
  - { archive: absent, token: session, reason: "동일 — 번호를 발급하지 않으므로 인증 세션도 생기지 않는다" }
  - { archive: absent, entry: resume, reason: "해제가 시작된 적이 없어 재개 상태가 없다" }
  # 거부되는 압축은 계획 단계에서 멈춘다 — 진행 인덱스가 생기지 않아 재개·시도 제한 축 밖이다.
  - { archive: traversal, token: invalid, reason: "인증 실패는 압축을 열기 전이라 내용 축과 무관" }
  - { archive: traversal, token: exhausted, reason: "동일" }
  - { archive: traversal, token: session, reason: "인증에 성공한 요청은 판정이 실패해도 세션을 돌려준다 — 그 세션으로 다시 보내는 축은 foreign × session 이 같은 실패 응답 함수(g7setup_fail)로 덮는다" }
  - { archive: traversal, entry: resume, reason: "계획 단계에서 멈춰 진행 인덱스가 생기지 않는다" }
  - { archive: foreign, token: invalid, reason: "인증 실패는 압축을 열기 전이라 내용 축과 무관" }
  - { archive: foreign, token: exhausted, reason: "동일" }
  - { archive: foreign, entry: resume, reason: "계획 단계에서 멈춰 진행 인덱스가 생기지 않는다" }
  # 압축 모양 변종 — 이름 판정(감싼 폴더·폴더 항목·부속 폴더)만 다르고 인증·재개 규칙은 g7_payload 와 같은 경로다.
  - { archive: github_dir_entries, token: invalid, reason: "인증 실패는 압축을 열기 전이라 모양 축과 무관" }
  - { archive: github_dir_entries, token: exhausted, reason: "동일" }
  - { archive: github_dir_entries, token: session, reason: "세션 재개는 g7_payload × session 이 덮는다 — 이름 판정은 매 요청 같은 함수" }
  - { archive: github_dir_entries, entry: resume, reason: "동일 — 분할 재개 규칙은 모양과 무관" }
  - { archive: github_dir_entries, entry: completed_site, reason: "완료 판정이 압축을 열기 전에 차단한다" }
  - { archive: backslash_dir_entries, token: invalid, reason: "인증 실패는 압축을 열기 전이라 모양 축과 무관" }
  - { archive: backslash_dir_entries, token: exhausted, reason: "동일" }
  - { archive: backslash_dir_entries, token: session, reason: "세션 재개는 g7_payload × session 이 덮는다" }
  - { archive: backslash_dir_entries, entry: resume, reason: "분할 재개 규칙은 모양과 무관" }
  - { archive: backslash_dir_entries, entry: completed_site, reason: "완료 판정이 압축을 열기 전에 차단한다" }
  - { archive: macosx, token: invalid, reason: "인증 실패는 압축을 열기 전이라 모양 축과 무관" }
  - { archive: macosx, token: exhausted, reason: "동일" }
  - { archive: macosx, token: session, reason: "세션 재개는 g7_payload × session 이 덮는다" }
  - { archive: macosx, entry: resume, reason: "분할 재개 규칙은 모양과 무관" }
  - { archive: macosx, entry: completed_site, reason: "완료 판정이 압축을 열기 전에 차단한다" }
  # 인증 실패 축은 최초 진입에서 판정된다 — 재개는 이미 인증을 통과한 상태다.
  - { archive: g7_payload, token: invalid, entry: resume, reason: "재개는 인증을 통과한 뒤의 상태" }
  - { archive: g7_payload, token: exhausted, entry: resume, reason: "동일" }
  - { archive: g7_payload, token: session, entry: fresh, reason: "세션 키는 최초 인증 성공에서만 생긴다" }

