# 브라우저 실측(§9 S3)이 담당하는 축 — 여기서 선언하지 않는 이유
#
# 라이트/다크 × 3디바이스 렌더링, FTP 클라이언트로 번호 파일을 여는 실제 동선, 84MB 급
# 배포 ZIP 의 분할 해제 소요는 하네스가 만들 수 없다. 그 축은 격리된 검증 환경에서 사람이
# 직접 수행하고 결과를 별도 보고서에 기록한다. 이 매니페스트가 잠그는 것은 그 실측이 시작되기
# 전에 성립해야 하는 판정·계약이다.
