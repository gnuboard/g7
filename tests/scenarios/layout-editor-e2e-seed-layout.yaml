  - tests/Unit/Repositories/LayoutRepositoryDeleteByNameTest.php
  - tests/Playwright/specs/layout-editor/table-editor.spec.ts
  - tests/Playwright/specs/layout-editor/table-inplace-overlay.spec.ts
  - tests/Playwright/specs/layout-editor/children-list-editor.spec.ts
  - tests/Playwright/specs/layout-editor/array-editor.spec.ts
  - tests/Playwright/specs/layout-editor/prop-i18n-text-field.spec.ts
  - tests/Playwright/specs/layout-editor/palette-i18n-and-globals.spec.ts
  - tests/Playwright/specs/layout-editor/data-builtins.spec.ts
