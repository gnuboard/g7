<!-- 사용자 401 화면 — 로그인이 필요한 상태 -->
<layout name="401" version="1.0.0" extends="_user_base">
  <meta title="$t:error.401.title" description="$t:error.401.description"/>
  <slot name="content">
    <div class="flex-center min-h-[50vh] justify-center">
      <div class="text-center px-4">
        <div class="text-6xl font-bold text-gray-200 mb-4">401</div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">$t:error.401.title</h1>
        <span class="block text-gray-600 mb-6">$t:error.401.description</span>
        <button class="px-5 py-2 rounded bg-blue-600 text-white hover:bg-blue-700 cursor-pointer">
          <on type="click">
            <navigate path="/"/>
          </on>
          $t:error.back_to_home
        </button>
      </div>
    </div>
  </slot>
</layout>
