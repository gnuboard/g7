<!-- 사용자 503 화면 — 일시적으로 처리할 수 없는 상태 -->
<layout name="errors/503" version="1.0.0" extends="_user_base">
  <meta title="$t:error.503.title" description="$t:error.503.description"/>
  <slot name="content">
    <div class="flex-center min-h-[50vh] justify-center">
      <div class="text-center px-4">
        <div class="text-6xl font-bold text-gray-200 dark:text-gray-700 mb-4">503</div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:error.503.title</h1>
        <span class="block text-gray-600 dark:text-gray-300 mb-6">$t:error.503.description</span>
      </div>
    </div>
  </slot>
</layout>
