feature: 관리자 바닥글(AdminFooter) 계약

description: |
  저작권 문구와 버전 정보를 보이고, 빠른 링크 목록을 링크로 그린다(빈 목록이면 링크가 없다). className 은 루트에 붙는다.

# axis 의미:
#   component — 이 매니페스트가 다루는 컴포넌트 하나(단위 시험이 그 컴포넌트를 직접 그린다).
axes:
  component: [admin_footer]

effects:
  - admin_footer_shows_copyright_and_version  # 저작권 문구, 버전 정보, className 이 보인다
  - admin_footer_renders_quick_links          # 빠른 링크를 링크로 그리고 빈 목록이면 그리지 않는다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/AdminFooter.test.tsx
