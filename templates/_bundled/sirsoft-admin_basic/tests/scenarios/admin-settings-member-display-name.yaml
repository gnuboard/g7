feature: 환경설정 「회원」 탭의 표시 이름 구획

description: |
  표시 이름 구획은 회원을 화면에 어떤 이름으로 보일지 정한다. 회원이 고를 수 있는 종류(체크 목록, 종류마다 표본 회원으로 계산한 미리보기),
  회원이 고르지 않았을 때 쓰는 회원 기본 종류, 이름이 보이는 자리(영역)마다의 방식(상위 자리를 따름, 한 종류로 고정, 회원이 고른 값)과
  고정할 종류를 다룬다. 종류와 자리 목록은 데이터소스 memberDisplayNameOptions 가 회원 탭에서만 준다. 자리는 서버가 나무 순서로 펴서 주고
  깊이만큼 들여 그리며, 확장이 선언한 종류와 자리는 그 확장의 식별자를 꼬리표로 붙인다. 사이트 기본 자리에는 「따름」이 없다.

  값은 설정 폼(_local.form.member.display_name_*)에 담고 화면 하단 「저장」이 회원 탭 몫을 한 번에 보낸다. 자리 설정은 객체를 통째로 담는다.
  회원 기본 종류의 선택지는 지금 체크한 종류뿐이고, 회원 기본 종류로 쓰는 종류는 뺄 수 없게 잠긴다.
  회원 기본 종류 아래에는 이 값을 지금 쓰는 영역(계산값 memberDefaultKindUsage — 방식이 「회원이 고른 값」인 자리, 상위를 따라 그렇게 된 자리,
  자리는 고정이어도 「회원이 고른 값」인 인스턴스)을 폼 값 기준으로 보이고, 하나도 없으면 바꿔도 변화가 없다고 알린다.

  고친 설정이 닉네임을 더 강하게 요구하게 되면(계산값 memberDisplayNamePending) 저장하기 전에 「닉네임 항목이 고정됩니다」와
  닉네임이 비어 있는 회원 수를 보이고, 전원 필수가 되는 경우에는 「로그인 시 닉네임 입력 요구」 체크칸을 함께 보인다(U12).
  그 지시 값은 안내가 보이고 전원 필수가 되는 저장에만 본문에 실린다. 저장에 성공하면 항목 정의와 표시 이름 데이터소스를 다시 받아
  가입 항목 표의 닉네임 행 잠금이 새로고침 없이 바뀐다(T5-a). 표시 이름 설정 때문에 잠긴 닉네임 행은 사유와 함께
  표시 이름 구획으로 가는 단추를 보인다(표와 좁은 화면 카드 양쪽).

