feature: 관리자 탭 막대 — 넘치면 단추째 다음 줄로, 단추 글자는 한 줄

description: |
  환경설정 탭이 14개로 늘자 1280 폭에서 단추가 줄어들며 글자가 꺾였다(「일/반」, 단추 높이 58px).
  설계 확정(2026-11-08)은 「두 줄은 두되 글자만 안 꺾임」이다. TabNavigation 의 막대(`tab-nav-default`, `tab-nav-underline`)는
  `flex-wrap`, 단추(`tab-btn-base`)는 `whitespace-nowrap shrink-0` 을 갖는다. 같은 부품을 쓰는 확장 설정 탭에도 걸린다.

# axis 의미:
#   element — 규칙을 보는 자리(막대, 단추). viewport, tabs — 실측 조건(1280 폭, 환경설정 탭 14개).
axes:
  element: [tab_nav, tab_button]

effects:
  - settings_tab_labels_stay_on_one_line          # 단추 글자는 한 줄이고 단추 밖으로 넘치지 않는다
  - settings_tab_bar_wraps_instead_of_squeezing   # 막대는 가로로 넘치거나 단추를 줄이지 않고 줄을 늘린다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/TabNavigationWrap.test.ts
