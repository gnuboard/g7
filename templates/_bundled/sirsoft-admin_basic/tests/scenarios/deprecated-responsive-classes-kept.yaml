feature: 폐지 예정 반응형 접두 클래스 — 공개 출시본 빌드 CSS 에 있던 클래스가 이번 버전 빌드 CSS 에 남는다

description: |
  번들 레이아웃·부품이 Tailwind 반응형 접두(`sm:`·`md:`·`lg:`·`xl:`·`2xl:`, 확장은 `{접두}:md:` 형태)를 엔진 `responsive`
  로 바꾸자 레이아웃 스캔으로 빌드 CSS 에 들어오던 반응형 접두 클래스(`md:w-96`·`sm:w-80` 등)가 빠졌다. 이미 설치한 사이트가
  편집기로 고쳐 저장한 레이아웃과 사이트 자체 확장은 그 클래스를 계속 쓸 수 있으므로 이번 버전에는 빌드에 남기고(폐지 예정)
  다음 출시 이후 뺀다.

  적용 지점:
    - 두 번들 템플릿 `src/styles/main.css` 와 확장 Tailwind 입력 CSS 의 `DEPRECATED-RESPONSIVE-START`~`END` 블록
      (`@source inline(...)`). 관리자 템플릿의 safelist 생성 구간(`SAFELIST-START`~`END`) 밖에 둔다.
    - 기준 집합: 마지막 공개 출시본의 빌드 CSS 에 실제로 있던 이름. 확장 출시본 CSS 의 접두 없는 반응형 클래스
      (이커머스 `md:w-24` 등)는 지금 접두 빌드가 만들 수 없어 관리자 템플릿 블록에 더한다. 출시된 적 없는 확장·접두 이름은
      대상이 아니다. 산출: `scripts/extension-css/deprecated-responsive-classes.mjs`.

# axis 의미:
#   case — 시험 하나가 시나리오 하나다. 템플릿 두 개와 확장은 시험 픽스처(기준 집합)에서 파생한 모집단으로 같은 시험이 잰다.
axes:
  case:
    # scripts/extension-css/__tests__/deprecated-responsive-classes.test.mjs
    - drc_c01   # 수집기 — CSS 이스케이프 풀기, 폭 변형만 세기(상태 변형·컨테이너 질의·임의 폭 유틸 제외)
    - drc_c02   # 보존 블록 주입 — 표식 사이만 바꾸고 다시 넣어도 같다, 확장은 생성 블록 뒤
    - drc_c03   # 기준 집합 전부가 지금 빌드 CSS 선택자에 있다(템플릿 두 개, 확장)
    - drc_c04   # 입력 CSS 보존 블록이 기준 집합과 같다
    - drc_c05   # 출시본 빌드 CSS 에 있던 이름만 — 출시된 적 없는 확장·접두 이름에는 보존 블록이 없다
    - drc_c06   # 관리자 템플릿 기준 집합에 출시본 확장 손 CSS 의 접두 없는 반응형 클래스가 들어 있다
    - drc_c07   # 출시본 빌드 CSS 의 일반 유틸리티 중 지금 빌드에서 빠진 이름(관리자 42, 사용자 34)이 남는다
    - drc_c08   # 확장 빌드 CSS 에 화면 폭 접두 클래스가 0 이다 — 진입 CSS 가 시험 디렉터리를 훑지 않는다

effects:
  - responsive_class_collector_reads_width_variants    # 빌드 CSS 에서 화면 폭 변형 클래스만 뽑는다
  - deprecated_responsive_block_is_idempotent          # 보존 블록 주입이 멱등이다
  - deprecated_responsive_classes_kept_in_build_css    # 공개 출시본의 반응형 접두 클래스가 지금 빌드 CSS 에 남는다
  - deprecated_responsive_block_matches_baseline       # 보존 블록이 기준 집합과 어긋나지 않는다
  - deprecated_responsive_block_only_for_released      # 공개 출시된 적 없는 확장·접두 이름에는 보존 블록을 두지 않는다
  - deprecated_responsive_admin_block_includes_extension_hand_css  # 확장 출시본 CSS 의 접두 없는 반응형 클래스를 관리자 블록이 싣는다
  - deprecated_utility_classes_kept_in_build_css       # 출시본에 있다가 레이아웃이 더 쓰지 않아 빠진 일반 유틸리티가 지금 빌드 CSS 에 남는다
  - extension_build_css_has_no_width_variant           # 확장 빌드 CSS 에 화면 폭 접두 클래스가 없다(시험 문자열 유입 차단)

test_files:
  - scripts/extension-css/__tests__/deprecated-responsive-classes.test.mjs

validation:
  browser_check: Chrome MCP
  note: |
    빌드 CSS 의 선택자 유무는 Vitest 가 잰다. 화면 확인은 레이아웃 편집기에서 관리자 화면 노드에 `md:w-96` 을 넣어 저장한 뒤
    768px 이상에서 폭 24rem 이 적용되는지 본다.
