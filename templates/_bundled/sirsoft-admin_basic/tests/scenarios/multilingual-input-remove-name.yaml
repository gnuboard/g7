feature: 다국어 입력 언어 제거 버튼 이름

description: |
  다국어 입력(MultilingualInput)에 언어를 더하면 언어마다 × 버튼이 붙는다. 아이콘만 그려 화면 낭독기가
  아이콘 이름 「xmark」 로 읽었다. 「English 입력 제거」 처럼 어느 언어를 지우는지 읽게 한다.

  수정 이력: 이커머스 전수 실측 S5-D34 (2026-10-07) — 상품 등록 화면 상품명 English·日本語 탭.

axes:
  case: [c01, c02]
  # c01: 탭 배치(tabs) · c02: 줄 배치(inline)

effects:
  - multilingual_remove_named

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/MultilingualInputRemoveName.test.tsx

validation:
  browser_check: 상품 등록 화면 상품명 — English·日本語 탭의 × 버튼이 「English 입력 제거」·「日本語 입력 제거」
