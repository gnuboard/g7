feature: 환경설정 정보 탭의 확장 카드 일반 렌더러 (#888)

description: |
  확장이 필터 훅 `core.settings.filter_system_info_sections` 로 시스템 정보 응답의 `extra_sections` 에 더한 섹션을
  「시스템 정보」 카드 옆에 응답 순서대로 그린다. 서버가 형식을 검증해 넘기므로 화면은 배지(색조 → StatusBadge 상태,
  neutral → default)·항목(라벨/값, mono 는 고정폭)·목록(접는 목록은 단추로 열고 닫는다)·알림(색조별 상자)만 따른다.
  값은 모두 글자로 그린다 — HTML 조각이 요소로 해석되지 않는다. 섹션이 없으면 카드를 하나도 그리지 않는다.

axes:
  section_shape: [none, badge_rows, list, notice]

effects:
  - extra_section_card_node_baked
  - extra_sections_render_nothing_when_empty
  - extra_sections_render_badge_and_rows
  - extra_sections_render_collapsible_list
  - extra_sections_render_notice_by_tone
  - extra_sections_render_text_only

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-info-extra-sections.test.tsx

notes: |
  레이아웃 테스트는 `_tab_info.json` 굽기 산출물의 `card_extra_section_*` 노드를 그대로 렌더한다. 서버 쪽 형식 검증·리스너 예외
  격리·캐시 밖 계산은 코어 `tests/Feature/Services/SettingsServiceSystemInfoTest.php` 가 잠근다.
