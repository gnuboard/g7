feature: 앱 키 재생성 비밀번호 확인 창을 어느 갈래로 닫든 입력한 비밀번호가 전역에 남지 않는다 (7.1.1)

description: |
  창은 입력한 비밀번호를 `_global.appKeyPassword` 에 담는다. 「취소」·성공은 직접 지웠지만 창 머리 닫기·Esc·바깥 클릭은 엔진 closeModal 로만
  이어져 비밀번호가 남았다(다시 열면 빈 입력칸에 실행 단추가 열려 있고 누르면 앞 비밀번호가 나갔다). 열려 있는 동안 내내 붙어 있는
  본문 틀의 unmount 에서 지운다. 엔진 무변경.

# axis 의미:
#   close — 창을 떠나는 방법(창 머리 닫기·Esc·바깥 클릭 묶음 / 취소·성공 / 정적 판정)
axes:
  close: [header_escape_backdrop, cancel_or_success, static]

effects:
  - password_cleared_on_any_close             # 어느 갈래로 닫든 _global.appKeyPassword 가 빈 문자열이다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/layouts/settingsPasswordConfirmCloseClears.test.ts

validation:
  browser_check: — 관리자 › 환경설정 › 보안 › 「앱 키 재생성」 → 비밀번호 입력 → Esc(또는 창 머리 X·바깥 클릭)로 닫기 → DevTools 콘솔 `G7Core.state.get().appKeyPassword` 가 '' → 다시 열면 실행 단추가 잠겨 있다
