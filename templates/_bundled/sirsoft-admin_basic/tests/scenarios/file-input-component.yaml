feature: 관리자 템플릿 기본 파일 입력(FileInput) 계약

description: |
  숨긴 file input 과 그것을 여는 버튼, 고른 파일 이름을 보이는 자리로 이루어진다. 고른 파일을 onChange 로 알리고
  (고르지 않으면 null), maxSize 를 넘으면 onError 를 부른다. 지우기 버튼으로 선택을 비우고, disabled 면 버튼과 input 이
  막힌다. 편집기 표식(data-editor-*, id)은 보이는 루트 div 에 붙고 기능 prop 은 file input 에 남는다.

# axis 의미:
#   component — 이 매니페스트가 다루는 컴포넌트 하나(단위 시험이 그 컴포넌트를 직접 그린다).
axes:
  component: [file_input]

effects:
  - file_input_renders_button_and_placeholder  # 버튼 문구, placeholder, 숨긴 file input 을 그린다
  - file_input_selection_reports_file          # 버튼이 file input 을 열고, 고른 파일(없으면 null)을 onChange 로 알리고 이름을 보인다
  - file_input_rejects_oversized_file          # maxSize 를 넘으면 onError 를 부르고 이내면 정상 처리한다
  - file_input_clear_resets_selection          # 고른 뒤 지우기 버튼이 보이고 누르면 선택이 비워진다
  - file_input_disabled_blocks_interaction     # disabled 면 버튼과 file input 이 막히고 지우기 버튼이 없다
  - file_input_attributes_passthrough          # accept 는 file input 에, className 은 감싸개에 붙는다
  - file_input_editor_markers_on_visual_root   # 편집기 표식은 보이는 루트 div 에 붙고 file input 에는 기능 prop 만 남는다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/basic/__tests__/FileInput.test.tsx
