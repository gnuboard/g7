feature: 관리자 템플릿 기본 체크박스(Checkbox) 계약

description: |
  네이티브 input[type=checkbox] 를 그리고 checked, defaultChecked 를 따르며, 클릭과 포커스 이벤트를 부른다.
  disabled 면 사용자 클릭으로 상태가 바뀌지 않고, HTML 속성과 사용자 정의 props 는 input 에 그대로 붙는다.
  폼 제출 값에 들어가고 indeterminate 는 ref 로 설정한다.

# axis 의미:
#   component — 이 매니페스트가 다루는 컴포넌트 하나(단위 시험이 그 컴포넌트를 직접 그린다).
axes:
  component: [checkbox]

effects:
  - checkbox_renders_native_input           # 네이티브 checkbox input 을 그리고 기본은 체크 안 됨
  - checkbox_checked_state_follows_props    # checked, defaultChecked 가 체크 상태로 보인다
  - checkbox_events_fire_and_toggle         # onChange, onFocus, onBlur 를 부르고 클릭으로 토글된다
  - checkbox_disabled_blocks_toggle         # disabled 면 사용자 클릭으로 체크 상태가 바뀌지 않는다
  - checkbox_attributes_passthrough         # required, name, value, id, readOnly, class, aria, data 속성이 input 에 붙는다
  - checkbox_value_included_in_form_submit  # 폼 제출 값에 체크된 checkbox 값이 들어간다
  - checkbox_indeterminate_via_ref          # ref 로 indeterminate 를 설정할 수 있다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/basic/__tests__/Checkbox.test.tsx
