feature: 레이아웃 갱신·업데이트 창 — 화면별 처리 미리보기 후 적용

description: |
  [레이아웃 갱신]·[업데이트] 창(템플릿·모듈·플러그인 6종)은 창을 열면 미리보기 API 를 불러 화면마다 어떻게 바뀌는지
  보여 준다(DB 는 바뀌지 않는다). 처리 방식은 기본 「수정 유지」, 「모두 교체」는 경고와 함께 고를 수 있다. 운영자 수정과
  겹친 화면은 화면마다 「겹치지 않는 곳만 반영(기본 — 결정을 싣지 않아 서버 기본 병합) / 운영자 판 유지 / 새 판 적용」을 고른다. 업데이트 창은 이 업데이트로 지워질 선언 항목(운영자
  수정본 표시)도 보여 준다. 미리보기가 실패하면 오류와 다시 시도 버튼을 보이고 적용 버튼은 잠긴다. 공통 조각
  (partials/_shared/_layout_sync_preview)이 한 벌로 그린다.

  업데이트 미리보기가 화면 판정을 건너뛰면(꺼 둔 확장·파일이 없는 설치본 — layouts_skipped) 0개 요약 대신 그 까닭을 알리고, 지워질
  선언 항목·내려받은 새 판 토큰은 그대로 지킨다. 업데이트 창도 갱신 창처럼 창부터 열고(로딩) 변경 이력·미리보기를 뒤이어 받는다.
  요약의 세 수(바뀌는 화면·겹친 화면·삭제 예정)는 따로 번역해 수마다 단수·복수를 고른다(en).

  같은 목록 화면의 API 계약(업데이트 확인 응답·페이지네이션 경로·옛 수정 레이아웃 확인 호출이 없음)과 업데이트 창의 검색 인덱스
  재생성 옵트인도 이 매니페스트가 소유한다.

