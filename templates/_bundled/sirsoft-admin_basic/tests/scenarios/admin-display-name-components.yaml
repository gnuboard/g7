feature: 관리자 화면의 사용자 표시 컴포넌트는 표시 이름을 쓴다 (#490 8단계)

description: |
  관리자 화면의 로그인 사용자 응답은 실명(name)을 그대로 두고 관리자 화면 자리에서 보일 이름을 display_name 으로 따로 싣는다.
  사용자 메뉴(UserProfile)와 관리자 헤더(AdminHeader)는 display_name 을 먼저 읽고, 없으면(옛 응답) 실명, 둘 다 없으면 빈 글자를 쓴다.
  이름 항목을 쓰지 않는 사이트는 name 이 null 이어도 터지지 않고 「null」 글자를 보이지 않는다.

# axis 의미:
#   case — 대상 컴포넌트와 응답 모양 (표시 이름 있음, 옛 응답, 이름 null)
axes:
  case:
    - user_profile_display_name
    - user_profile_legacy_response
    - user_profile_null_name
    - admin_header_display_name
    - admin_header_legacy_response
    - admin_header_null_name

effects:
  - user_profile_shows_display_name_before_real_name
  - user_profile_falls_back_to_real_name
  - user_profile_is_null_safe
  - admin_header_shows_display_name_before_real_name
  - admin_header_falls_back_to_real_name
  - admin_header_is_null_safe

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/DisplayNameComponents.test.tsx
