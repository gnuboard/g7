feature: 입력칸·글상자의 엔진 전용 속성 거르기

description: |
  레이아웃의 `:autoBinding="false"`(자동 바인딩 끄기)는 엔진이 읽은 뒤 props 로 그대로 넘긴다. Input·Textarea 가
  이를 DOM 에 펼쳐 React 가 「React does not recognize the `autoBinding` prop」 경고를 냈다. 두 부품이 이 속성을
  거른다.

  수정 이력: 이커머스 전수 실측 후속 B7 (2026-10-08) — 배송정책 등록 산정 방식 라디오 렌더 시험에서 발견.

axes:
  component: [input, textarea]

effects:
  - engine_only_prop_not_in_dom   # autoBinding 이 DOM 속성으로 나가지 않고 React 경고도 없음

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/basic/__tests__/EngineOnlyPropFilter.test.tsx

validation:
  browser_check: 배송정책 등록 화면의 산정 방식 라디오 요소에 autobinding 속성이 없음
