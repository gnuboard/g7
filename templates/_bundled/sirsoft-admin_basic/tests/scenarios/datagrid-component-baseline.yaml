feature: DataGrid 기본 계약 — 렌더·정렬·행 클릭·페이지·서브 행·열 리셋·행 액션·반복 렌더 레지스트리·선택 건수 문구

description: |
  관리자 목록 전반이 쓰는 DataGrid 의 컴포넌트 단위 기본 계약. 7.1.1 에서 정렬 머리 글자가 칸(th) 안의
  type="button" 단추로 옮겨 가며(`datagrid-sort-header-keyboard.yaml`) 기존 단위 테스트의 어포던스 단언이 칸(th)에서
  읽도록 바뀌었다. 그 파일의 테스트 가운데 다른 매니페스트가 소유하지 않던 것을 이 매니페스트가 기능 영역 축으로 묶는다.
  같은 파일의 선택 유효 범위 테스트는 `tests/scenarios/list-bulk-selection-scope.yaml`, 푸터 행 text 바인딩 해석 테스트는
  `modules/_bundled/sirsoft-ecommerce/tests/scenarios/admin-order-detail-footer-totals.yaml` 이 소유한다.

axes:
  area:
    - render                         # 머리·행 렌더, 빈 데이터, className, 데이터 셀 상단 정렬
    - sort                           # 머리 클릭 정렬 디스패치·화살표·정렬 불가 열·controlled/uncontrolled 순서·런타임 controllable-state 경로
    - row_click                      # 행 클릭이 그 행 데이터로 onRowClick 을 부른다
    - pagination                     # 클라이언트 페이지네이션 단추와 이동
    - server_pagination_sort_guard   # 서버 페이지네이션 + onSortChange 미배선이면 머리 정렬을 막고, 배선·클라이언트 목록은 유지 (#492 D-18)
    - sub_row                        # 서브 행 렌더·조건·colSpan·조건 판정의 엔진 위임
    - column_reset                   # SPA 이동으로 columns 가 바뀌면 visibleColumns 를 리셋(외부 제어 시 유지)
    - mobile_sub_row                 # 모바일 카드 뷰의 서브 행
    - row_action_disabled            # rowActions 의 disabledField
    - cell_registry                  # 반복 렌더 경로가 템플릿 레지스트리 전체를 넘긴다
    - selection_count_text           # 선택 건수 문구의 {{count}}·{count} 치환

effects:
  - datagrid_renders_headers_and_rows                         # 머리·데이터 행을 그리고 빈 데이터면 행이 없으며 className 이 뿌리에 붙는다
  - datagrid_body_cells_top_aligned                           # 모든 데이터 셀이 align-top 이다
  - datagrid_header_click_dispatches_sort                     # 머리 클릭이 (열, 방향) 으로 onSortChange — 같은 열은 방향 반전, 새 열은 asc
  - datagrid_sort_arrow_reflects_state                        # 정렬 상태(sortField·sortDirection)가 머리 화살표 ↑·↓ 로 보인다
  - datagrid_unsortable_column_ignored                        # sortable=false 열은 클릭해도 정렬·onSortChange 가 일어나지 않는다
  - datagrid_controlled_sort_keeps_server_order               # onSortChange 가 배선된 그리드는 서버가 내려준 순서(null 포함)를 그대로 그린다
  - datagrid_uncontrolled_sort_handled_locally                # onSortChange 가 없으면 컴포넌트가 로컬 데이터를 정렬하고 클릭이 오류 없이 처리된다
  - datagrid_runtime_sort_dispatches_once                     # G7Core.useControllableState 경로에서 정렬 디스패치가 올바른 (열, 방향) 으로 한 번만 나간다
  - datagrid_row_click_passes_row                             # 행 클릭이 그 행 데이터로 onRowClick 을 부른다
  - datagrid_client_pagination_navigates                      # 페이지 단추가 보이고 다음 페이지로 이동한다
  - datagrid_server_page_without_sort_handler_not_sortable    # 서버 페이지네이션 + onSortChange 없음 → 순서·화살표·클릭 커서 변화 없음
  - datagrid_sort_affordance_kept_where_sortable              # onSortChange 배선 시 서버 정렬 요청, 클라이언트 목록은 정렬 어포던스 유지
  - datagrid_sub_row_rendered_per_condition                   # subRowRender·subRowCondition·subRowClassName 대로 서브 행을 그리거나 감춘다
  - datagrid_sub_row_spans_all_columns                        # 서브 행 colSpan 이 데이터·체크박스·액션 열을 모두 덮는다
  - datagrid_sub_row_condition_delegated_to_engine            # subRowCondition 판정은 G7Core.evaluateCondition 에 위임(해석 실패 숨김·_local 참조·미노출 시 표시)
  - datagrid_visible_columns_reset_on_columns_change          # columns 가 바뀌면 visibleColumns 를 새 기준으로 리셋, 외부 visibleColumns 는 존중
  - datagrid_mobile_card_sub_row_rendered                     # 모바일 카드 뷰에서도 서브 행·조건·className 이 적용된다
  - datagrid_row_action_disabled_by_field                     # disabledField 가 거짓인 행의 액션은 비활성 표시, 미지정 액션은 활성
  - datagrid_repeat_render_uses_full_component_map            # cellChildren 반복 렌더에 G7Core.getComponentMap 전체를 넘긴다
  - datagrid_selected_count_text_fills_both_param_styles      # 번역 문구·prop 문구의 {{count}}·{count} 를 모두 채운다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/DataGrid.test.tsx

notes: |
  e2e_browser=not_applicable — 컴포넌트 단위 계약이라 jsdom 렌더(Vitest)로 잠근다. 정렬 머리의 키보드 조작·aria-sort 는
  `datagrid-sort-header-keyboard.yaml`(DataGrid.sortKeyboard.test.tsx)이 따로 잠근다.
