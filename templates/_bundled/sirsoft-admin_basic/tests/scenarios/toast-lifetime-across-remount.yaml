# 시나리오 매니페스트 — 알림(Toast)은 화면이 바뀌어도 만든 시각부터 정해진 시간만 보인다
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: toast_lifetime_across_remount

description: >-
  로그인 화면(`admin_login`)은 `_admin_base` 를 상속하지 않아 로그인이 끝나 관리자 화면으로 넘어가면 Toast 가 새로 마운트된다.
  비밀번호 변경·휴면 해제처럼 로그인 화면에서 띄운 알림은 첫 화면(`/admin`)을 거쳐 대시보드나 메뉴 첫 화면으로 한 번 더 넘어간다.
  새 Toast 는 같은 항목을 받자마자 자기 마운트 시각부터 표시 시간을 다시 셌고, 앞 Toast 가 남긴 타이머가 원래 시각에 상태에서 항목을
  빼면 숨김 동작 없이 갑자기 사라졌다. 표시 시간이 지난 항목도 늦게 그려진 화면이 다시 그릴 수 있었다. 이제 항목의 만든 시각
  (`createdAt`, 엔진 toast 핸들러가 넣는다)부터 세어 남은 시간만 보이고, 이미 지난 항목은 그리지 않고 상태에서 지운다. 떠나는 Toast 는
  타이머를 거둔다. 만든 시각이 없는 항목은 종전대로 처음 받은 시각부터 센다.

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/Toast.lifetime.test.tsx
  - templates/_bundled/sirsoft-admin_basic/tests/Playwright/specs/admin/toast-lifetime-after-login.spec.ts

axes:
  component: [toast]
  mount: [late, remount, after_blank, expired]   # 만든 뒤 처음 받음 / 레이아웃 교체로 다시 마운트 / Toast 없는 화면을 거침 / 표시 시간이 이미 지남

effects:
  - toast_shows_only_remaining_time_from_created_at   # 만든 시각 + 표시 시간에 숨기 시작하고 숨김 동작 뒤 상태에서 지운다(개별 duration 포함)
  - toast_keeps_lifetime_across_remount               # 다시 마운트돼도 끝나는 시각이 하나다 — 앞 Toast 타이머에 갑자기 지워지지 않는다
  - toast_expired_item_never_reappears                # 표시 시간이 지난 항목은 새 Toast 가 그리지 않고 상태에서 지운다
  - toast_without_created_at_counts_from_mount        # 만든 시각이 없으면 종전대로 처음 받은 시각부터 센다
  - toast_manual_close_removes_once                   # 닫기 버튼으로 닫으면 한 번만 지우고 자동 닫힘 타이머가 다시 지우지 않는다

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: 관리자가 정해 준 비밀번호로 /admin/login 로그인 → 「새 비밀번호를 설정해 주세요」 → 변경하고 로그인 → 「비밀번호를 변경했습니다」 알림이 대시보드까지 한 번만 보이고 처음 뜬 뒤 약 5초에 사라지며 다시 나타나지 않는다
