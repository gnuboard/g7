feature: 코어 환경설정 미저장 변경 탭 전환 확인 창

description: |
  저장은 지금 탭의 구획만 보내고, 탭을 옮기면 설정을 다시 받아 고친 값이 저장된 값으로 돌아간다.
  이 복귀는 의도된 동작이다(7.1.0 조치 G2, 2026-10-08 결정 — 엔진에서 고친 값을 보존하던 수정은 되돌렸다).
  다만 말없이 사라지면 운영자가 저장된 줄 알기 때문에, 고친 것이 있는 채 다른 탭을 누르면 확인 창을 띄운다.
  머무르기는 고친 값과 변경 표시를 그대로 두고, 옮기기는 평소 탭 전환과 같은 순서로 옮긴다.
  같은 탭 안 본인인증 정책 목록의 필터·검색·초기화·쪽 넘김은 목록 소스만 다시 받아, 위쪽 설정 칸에서 고친 값과 변경 표시를 덮지 않는다(7.1.0 조치 R1 ②).

axes:
