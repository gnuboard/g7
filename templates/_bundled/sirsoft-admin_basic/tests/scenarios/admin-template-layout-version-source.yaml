feature: 레이아웃 편집 화면의 버전 히스토리 창 — 판마다 어디서 왔는지 한 줄

description: |
  확장 업데이트·레이아웃 갱신·「새 판 적용」·업그레이드가 운영자 판을 덮기 직전에 남긴 판과, 레이아웃 갱신·확장 업데이트의
  병합 결과 판은 서버가 버전 목록 응답의 changes_summary.source·before_overwrite 로 알려 준다. [버전 히스토리]와
  [확장 버전 히스토리] 창은 줄 수 아래에 그 출처를 한 줄로 보여 준다. 출처가 없는 판(운영자가 저장한 판·옛 판)에는
  그 줄을 그리지 않고, 모르는 출처는 「덮기 전 운영자 판」·「병합 결과」로 뭉뚱그려 번역 키가 화면에 새지 않게 한다.

# axis 의미:
#   case — 재는 성질 하나 (문구 · 출처 없는 판 · 키 누출 · 밝은/어두운 짝 · 언어 키 · 맨 위 덮기 전 판의 [복구] · 동기화 판 저장자 「시스템」)
axes:
  case:
    - wording
    - no_source
    - raw_key
    - dark_pair
    - lang_keys
    - restore_latest_before_overwrite
    - saved_by_system

effects:
  - version_row_shows_sync_source_wording
  - version_row_hides_source_line_without_source
  - version_row_source_line_never_shows_raw_key
  - version_row_source_line_pairs_dark_class
  - version_row_source_labels_exist_in_ko_and_en
  - version_row_latest_before_overwrite_can_restore
  - version_row_saved_by_system_for_sync_rows

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-template-layout-version-source.test.tsx
  - templates/_bundled/sirsoft-admin_basic/tests/Playwright/specs/admin/code-editor-version-history-sync-source.spec.ts

notes: |
  서버 쪽 노출(출처·덮기 전 여부·충돌 수, 옛 행은 null/false/0)은 코어 tests/Feature/Api/Admin/LayoutControllerTest.php ·
  LayoutExtensionControllerTest.php 가 잰다(코어 매니페스트 layout-admin-api.yaml 의 layout_versions·extension_versions).
