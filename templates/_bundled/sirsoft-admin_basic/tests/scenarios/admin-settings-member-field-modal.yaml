feature: 환경설정 「회원」 탭의 항목 추가·수정 창과 삭제 확인 창

description: |
  항목 추가는 두 단계다(U2). 유형 타일을 고르고 「다음」으로 내용을 적으며, 저장 전에는 「바꾸기」로 유형을 다시 고른다
  (유형이 바뀌면 유형별 옵션만 비운다). 제공한 확장이 꺼진 유형은 흐리게 잠근다. 수정에서는 키와 유형이 잠긴다.

  운영자가 추가한 항목은 유형별 옵션, 선택지, 표시 이름 사용, 본인인증 연결까지 저장하고, 기본 항목과 확장이 선언한 항목은
  이름과 공통 옵션만 저장한다. 범위를 「관리자만 수정」「관리자만 열람」으로 고르면 「기존 회원에게도 입력 요구」가 꺼진 채 잠긴다.
  확장 유형의 옵션 자리는 확장점 `member_field_type_options` 다.

  수정 창은 선택지마다 사용 인원을 보인다(U3). 저장된 선택지의 값은 못 바꾸고, 지우면 「이 값을 고른 회원 N명의 값이 비워집니다」만
  보인 채 되돌릴 수 있으며 창을 저장할 때 적용된다. 하나 선택에는 「기타(직접 입력)」 허용이 있고(U8), 여러 줄을 붙여넣으면 줄마다
  선택지가 되며 값은 자동으로 만들어 겹치면 번호를 붙인다(U9, 50개까지).

  칸을 고친 뒤 [취소]나 Esc 는 한 번 묻는다(U7). 조회 권한만 있는 관리자는 [보기]로 모든 칸이 잠긴 창을 연다.
  저장이 409 `fields_changed` 로 거부되면 적은 내용을 창에 남기고 표를 다시 받으며, 다음 저장은 다시 받은 정의 버전을 싣는다.

  삭제 창은 입력된 값 수를 알리고 「위 내용을 확인했습니다」를 체크해야 삭제 단추가 풀린다. 삭제 요청은 정의 버전을 쿼리로 싣는다.
  표시 이름 종류로 쓰이는 항목은 서버가 삭제를 막는다(409 field_in_use, U4). 창은 사용처 목록과 표시 이름 구획으로 가는 단추를 보이고
  삭제 단추를 잠근다. 그 밖의 거부는 서버 문구를 알리고 창을 그대로 둔다.

