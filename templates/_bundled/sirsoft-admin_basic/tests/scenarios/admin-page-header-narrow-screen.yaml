feature: 관리자 페이지 헤더 — 좁은 화면에서 세 변형 모두 세로로 쌓이고 버튼이 꺾이지 않는다

description: |
  관리자 화면 헤더는 기본(`.page-header`)·여백형(`.page-header-padded`)·풀블리드형(`.page-header-fullbleed`) 세 변형이다.
  좁은 화면(≤640px) 규칙이 기본 변형에만 걸려 있어, 여백형·풀블리드형을 쓰는 클레임 상세·주문 상세·상품 폼·쿠폰 폼·
  게시판 폼·회원 상세는 375px 에서도 가로 한 줄로 남았고, 오른쪽 버튼 묶음이 눌려 버튼 글자가 한 글자씩 세로로 꺾였다.
  반응형 접두 클래스(`sm:`)는 이 템플릿 빌드 CSS 에 없어 쓸 수 없으므로 공통 CSS 에서 세 변형을 함께 묶고,
  버튼 묶음은 폭이 모자라면 줄을 바꾸게 한다.

# axis 의미:
#   header_variant — 관리자 헤더 변형 셋. 좁은 화면 규칙이 셋 모두에 걸려야 한다(모집단은 테스트가 main.css 에서 파생).
axes:
  header_variant: [page_header, page_header_padded, page_header_fullbleed]

effects:
  - page_header_variants_stack_on_narrow_screens    # 세 헤더 변형 모두 640px 이하에서 세로로 쌓임
  - page_actions_wrap_instead_of_squeezing_buttons  # 버튼 묶음이 눌리지 않고 줄바꿈

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/styles/pageHeaderNarrowScreen.test.ts

validation:
  browser_check: Chrome MCP
  note: |
    CSS 규칙은 Vitest 가 원본(main.css)에서 모집단을 파생해 잰다. 실제 꺾임 해소는 여섯 화면을 375px 로 Chrome 실측하고,
    데스크톱(1440px) 화면이 그대로인지도 함께 본다.
