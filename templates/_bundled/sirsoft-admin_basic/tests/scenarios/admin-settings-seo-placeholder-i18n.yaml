feature: 환경설정 SEO 탭 입력 칸 자리 표시 문구의 다국어화

description: |
  환경설정 > SEO 탭의 타이틀 접미사·메타 키워드 칸 예시 문구가 한국어로 박혀 있어
  영어·일본어 화면에서도 「 | 그누보드7」「CMS, 그누보드7, 오픈소스」가 보였다.
  한국어 예시는 다국어 키로 두고 화면 언어(ko/en/ja)를 따른다. 언어 중립 예시(숫자·도메인·버전)는 그대로 둔다.

axes:
  field: [meta_title_suffix, meta_keywords, other]

effects:
  - placeholder_has_no_hardcoded_korean
  - placeholder_follows_locale

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-seo-placeholder-i18n.test.tsx
