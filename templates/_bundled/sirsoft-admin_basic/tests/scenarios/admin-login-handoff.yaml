# audit:allow test-scenario-coverage[cross_product] reason: entry, step, response 축은 레이아웃 정적 계약(init 순서, 이름 붙은 액션 공유,
# 응답별 분기 조건)을 고르는 이름이다. 조합마다 화면을 띄우는 시험이 아니라 분기 식을 실제 값으로 평가해 갈래를 밟는다.
# 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 관리자 로그인 인계 교환과 확장점 (sirsoft-admin_basic 1.2.0, 7.2.0 A1t ①②)

description: |
  외부 인증이 본인 확인을 마친 관리자를 /admin/login?login_handoff={코드} 로 보내면 init 이 _local 초기화 뒤에
  loginHandoff(admin)로 교환한다. 성공 분기는 이름 붙은 액션 applyAdminLoginResult 를 폼 로그인과 공유하고(복제 금지),
  2단계 인증, 비밀번호 변경 응답이면 단계 상태만 심는다. 실패는 안내 + 주소에서 코드 제거.
  확장점 admin_login_extensions 는 로그인 폼 바로 아래.

axes:
  entry: [handoff_query, password_form]
  step: [init, success, failure]
  response: [two_factor, password_change, token]
  surface: [login_card]

effects:
  - handoff_exchanged_after_local_reset
  - login_result_branch_shared_not_duplicated
  - handoff_two_factor_and_password_change_steps
  - handoff_failure_shows_notice_and_strips_code
  - admin_login_extension_point_below_form

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-login-handoff.test.ts
