# 시나리오 매니페스트 — 환경설정 > 드라이버 「비공개 첨부 저장소」 카드
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: admin_settings_private_attachment_card

description: |
  관리자 환경설정 드라이버 탭의 공개 자산 카드 뒤에 「비공개 첨부 저장소」 카드를 둔다. 서버 저장·해석 규칙은
  코어 `tests/scenarios/private-attachment-storage.yaml` 이 소유하고, 여기서는 레이아웃 계약만 잰다.

  - select 는 `drivers.private_attachment_disk` 에 바인딩되고 선택지는 서버 카탈로그 `available_drivers.private_attachment` 를 그대로 쓴다.
  - S3 접속 블록은 스토리지·공개 자산·비공개 첨부 저장소 중 하나라도 s3 면 열린다.
  - 공개 자산과 같은 디스크일 때만 경고가 보이고(「기본」·「사용 안 함」끼리는 비교하지 않는다),
    `.env` 고정 주체(`_meta.private_attachment.pins`)가 있을 때만 안내가 보인다. 옛 코어(_meta 없음)에서도 깨지지 않는다.
  - 라벨·안내 키가 모든 로케일에 있다.

axes:
  case: [private_attachment_card]

effects:
  - private_attachment_select_bound_to_catalog  # 카드가 공개 자산 카드 뒤에 있고 select 가 카탈로그 선택지로 drivers.private_attachment_disk 에 바인딩
  - s3_block_opens_for_private_attachment       # S3 접속 블록은 세 칸 중 하나라도 s3 면 열린다
  - same_disk_warning_only_when_equal           # 공개 자산과 같은 디스크일 때만 경고, 「기본」·「사용 안 함」은 비교 안 함
  - env_pins_notice_only_when_pinned            # .env 고정 주체가 있을 때만 안내, _meta 가 없어도 깨지지 않는다
  - private_attachment_keys_all_locales         # 라벨·안내 번역 키가 모든 로케일에 있다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/layouts/admin-settings-private-attachment.test.ts
