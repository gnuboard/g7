feature: 레이아웃 갱신 창 — 겹친 화면별 결정의 기본값과 적용 본문 (브라우저)

description: |
  관리자 템플릿 목록의 [레이아웃 갱신] 창을 실제 브라우저에서 연다. 미리보기 요청은 식으로 정한 주소가 풀려
  POST /api/admin/templates/refresh-layouts/preview 로 나가야 한다(풀리지 않으면 405 — 엔진 수정 회귀 축).
  겹친 화면마다 결정 기본값은 「겹치지 않는 곳만 반영 (권장)」이고 세 선택지는 title 로 설명을 단다.
  한 화면만 「새 판 적용」을 고르면 적용 본문 decisions 에 그 화면 키만 take-theirs 로 실리고, 고른 결정을
  「겹치지 않는 곳만 반영」으로 되돌리면 그 키가 본문에서 빠진다.

# axis 의미:
#   case — 재는 순서 하나 (첫 열기 · 새 판 적용 후 적용 · 결정을 되돌린 뒤 적용)
axes:
  case:
    - first_open
    - apply_take_theirs
    - revert_to_merge

effects:
  - preview_request_uses_resolved_post_route
  - decision_default_is_merge_on_first_open
  - decision_choices_carry_hint_title
  - apply_body_carries_only_chosen_decision
  - reverting_to_merge_drops_decision_key

test_files:
  - templates/_bundled/sirsoft-admin_basic/tests/Playwright/specs/admin/layout-sync-preview-decisions.spec.ts

notes: |
  목록·미리보기 응답은 고정하고 적용 요청은 가로채 본문만 본다 — 개발 DB 의 레이아웃은 바뀌지 않는다.
  같은 창의 레이아웃 계약(결정 선택지·기본값·모두 교체 경고)은 layout-sync-preview-modal.yaml 의 Vitest 가 잰다.
