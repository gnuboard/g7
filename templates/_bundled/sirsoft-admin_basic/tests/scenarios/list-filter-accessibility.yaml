  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/TagInput.a11yMessages.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/TagInput.a11yCreateAnnounce.test.tsx
