feature: 목록 필터의 키보드·화면 읽기 접근성 — 빠른 기간 버튼·검색편집 체크박스·태그 입력 안내문

description: |
  7.1.0 실측:
    - 회원 목록 빠른 기간(오늘·1주일 …)이 div 라 Tab·Enter·Space 로 쓸 수 없었다 → type="button" 인 button
    - 검색편집 「기본 검색에 표시」 체크박스에 접근 가능한 이름이 없었다 → 필터 이름이 든 aria-label
    - 태그 입력(react-select)의 라이브 영역 안내문·태그 지우기 버튼 이름이 영어 고정이었다 → common.tag_input.*
  같은 결함군: 스케줄 목록 빠른 기간이 toISOString()(UTC 날짜)으로 오늘을 만들어 서버의 보는 사람 하루와
  어긋났다 → 브라우저 달력 날짜(toLocaleDateString('sv-SE')).
  #887 실측: 환경설정 > 본문 콘텐츠 「운영자 추가 태그」 에서 새 태그를 만들면 라이브 영역이 「[object Object] 선택됨」 을
    읽었다(만들기 행 label 이 화면용 요소) → 만들기 행은 친 값으로 읽는다. 같은 부품의 하나만 만들기 칸도 같은 경로.

axes:
  control: [quick_date, edit_visibility_checkbox, tag_input]

effects:
  - quick_date_buttons_are_keyboard_buttons
  - quick_date_uses_local_calendar_day
  - filter_edit_checkboxes_have_accessible_name
  - tag_input_screen_reader_text_localized
  - tag_input_created_value_announced_by_name

test_files:
