feature: 다국어 입력칸 이름 재료에 언어 이름을 박지 않는다 — 번들 레이아웃 전수 (7.1.1)

description: |
  다국어 입력칸(MultilingualInput)은 이름 prop·곁 라벨 글자 뒤에 칸마다 「({언어})」 를 붙여 읽힌다.
  이름 재료에 언어가 이미 들어 있으면 「항목명 (한국어) (English)」 처럼 언어를 두 번, 어긋나게 읽는다.
  이 부품을 쓰는 번들 확장(admin_basic·modules·plugins) 굽기 산출물 전수에서 이름 재료를 찾아
  ko·en·ja 문구로 풀었을 때 언어 이름이 없는지 본다. 모집단은 저장소에서 파생한다.

axes:
  source: [aria_label, form_field_label, adjacent_label]

effects:
  - population_derived_from_bundles
  - multilingual_input_name_has_no_language

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/multilingual-input-label-language.test.ts
