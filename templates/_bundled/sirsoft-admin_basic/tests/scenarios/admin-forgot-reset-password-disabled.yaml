# audit:allow test-scenario-coverage[cross_product] reason: surface × response × step 중 step(token_check)은 재설정 화면에만 있다.
# 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 관리자 비밀번호 찾기와 재설정 — 비밀번호 인증 막힘 안내 (sirsoft-admin_basic 1.2.0, 7.2.0 A5t)

description: |
  422 auth.password_auth_disabled 는 칸 오류가 아닌 안내 + 이동 버튼(forgotAlternate*, resetAlternate*).
  재설정 링크 검증 422 에서 같은 사유가 오면 「링크 무효」가 아니라 같은 안내. 안내 데이터는 error.errors.* 로만 읽는다.

axes:
  surface: [forgot, reset]
  response: [422_password_auth_disabled, 422_field_error, 422_invalid]
  step: [submit, token_check]

effects:
  - password_disabled_shows_notice_and_alternate_button
  - other_failures_keep_field_errors
  - reset_token_check_password_disabled_not_invalid_link
  - guidance_reads_error_errors_only
  - reset_blocked_hides_password_fields

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-forgot-reset-password-disabled.test.ts
