feature: 관리자 이미지 갤러리(ImageGallery) 편집 모드 자리표시 계약

description: |
  편집기가 editorAttrs 를 주입하면 갤러리는 인라인 자리표시를 그리고 그 루트에 editorAttrs 와 id 를 붙인다. 이미지가 있으면
  썸네일을 먼저 보이고, 없으면 안내 라벨을 보인다. 런타임(editorAttrs 없음)에는 자리표시를 그리지 않는다.

# axis 의미:
#   render_mode — editor 는 편집기가 editorAttrs 를 주입한 상태, runtime 은 주입하지 않은 실제 화면 상태.
axes:
  render_mode: [editor, runtime]

effects:
  - image_gallery_editor_placeholder_carries_editor_attrs  # 자리표시 루트에 editorAttrs 와 id 가 붙는다
  - image_gallery_editor_placeholder_prefers_thumbnail     # 이미지가 있으면 자리표시에 썸네일을 그린다
  - image_gallery_editor_placeholder_empty_label           # 이미지가 없으면 안내 라벨을 그린다
  - image_gallery_runtime_skips_editor_placeholder         # editorAttrs 가 없으면 인라인 자리표시를 그리지 않는다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/ImageGallery.test.tsx
