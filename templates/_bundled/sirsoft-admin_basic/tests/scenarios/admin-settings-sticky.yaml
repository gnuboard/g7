feature: 관리자 환경설정 — 상단 탭과 하단 저장 버튼이 스크롤해도 화면에 붙어 있다

description: |
  환경설정 화면은 내용이 길어 스크롤된다. 상단 탭 묶음(sticky_header)과 하단 저장 버튼(footer_buttons)은 스크롤 중에도
  보여야 한다. 알림 설정 탭 재설계 때 두 영역의 고정 스타일이 사라진 적이 있어, 레이아웃과 CSS 자산이 고정 토큰을
  계속 갖는지 잰다. 상단 탭 묶음의 좌우 여백은 폭에 따라 바뀌므로 엔진 responsive 구간 값마다 고정 토큰이 있어야 한다.
  고정·위치·계층(z) 토큰을 잃으면 긴 설정 화면에서 탭과 저장 버튼이 스크롤과 함께 사라지거나 헤더(z-50) 위로 올라온다.

  적용 지점:
    - `templates/_bundled/sirsoft-admin_basic/layouts/admin_settings.g7.html` 의 `sticky_header`·`footer_buttons`.
    - `templates/_bundled/sirsoft-admin_basic/src/styles/semantic.css` 의 `.sticky-tab-nav`·`.sticky-footer-buttons`.

# axis 의미:
#   region — 화면에 붙어 있어야 하는 영역.
axes:
  region: [top_tabs, footer_buttons]

effects:
  - settings_tabs_stay_pinned_while_scrolling        # 상단 탭 묶음이 모든 폭에서 sticky top-0 z-40
  - settings_save_buttons_stay_pinned_while_scrolling # 하단 저장 버튼이 sticky bottom-0

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-sticky.test.tsx

validation:
  browser_check: Chrome MCP
  note: |
    레이아웃·CSS 토큰은 Vitest 가 잰다. 실제 고정은 환경설정 화면을 375·768·1280 폭에서 끝까지 스크롤해 확인한다.
