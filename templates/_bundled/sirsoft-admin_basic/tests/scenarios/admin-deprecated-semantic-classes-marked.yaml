feature: 관리자 미사용 의미 클래스 폐지 예고 — 정의를 남기고 7.3.0 제거 예고 주석을 단다 (7.2.1)

description: |
  번들 관리자 레이아웃, 템플릿 컴포넌트, 코어 화면 코드, 확장이 복사해 쓰는 사본(`{ns}-x`, 생성 CSS 포함) 어디에서도 쓰지
  않는 의미 클래스 194종은 이번 출시에서 지우지 않는다. 사이트가 편집기로 고쳐 저장한 레이아웃이나 사이트 CSS 가 이 이름을
  쓰고 있을 수 있어서다. 정의 바로 위에 `deprecated(7.3.0 제거 예정)` 주석을 달고 7.3.0 에서 지운다.
  같은 정리에서 `.form-hint` 이중 정의를 하나로 합치고(뒤 정의 자리 유지), `.text-tertiary` 머리 주석을 실제 값
  (gray-600/300)에 맞춘다.

  적용 지점:
    - `templates/_bundled/sirsoft-admin_basic/src/styles/semantic.css`

# axis 의미:
#   family — 폐지 예고 목록의 계열(시험 파일 DEPRECATED 의 키).
axes:
  family:
    - status_tone
    - status_dot
    - button_badge
    - form_control
    - search_filter
    - dropdown_select
    - modal_toast
    - card_stats
    - list_tree_table
    - page_frame
    - layout_helper
    - icon_effect

effects:
  - unused_semantic_class_marked_and_kept          # 목록의 클래스는 semantic.css 에 정의가 남고, 정의 규칙마다 바로 위 주석 묶음에 예고 표식이 있다
  - deprecation_marker_only_on_listed_classes      # 예고 표식은 목록 밖 클래스의 정의에 붙지 않고, 표식 수는 대상 규칙 수와 같다
  - deprecated_class_absent_from_bundled_layouts   # 번들 관리자 레이아웃의 클래스 값에 목록의 이름이 없다
  - form_hint_defined_once                         # .form-hint 는 한 번만 정의되고 값은 text-xs gray-600 mt-1, 다크 gray-300
  - text_tertiary_comment_matches_definition       # .text-tertiary 머리 주석이 적은 색 값이 정의 값과 같다
  - component_muted_text_uses_semantic_class       # 템플릿 컴포넌트 TSX 는 보조 글자색 인라인 짝(gray-500 + 다크 gray-400) 대신 text-muted 를 쓴다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/styles/deprecatedSemanticClassesMarked.test.ts

validation:
  browser_check: none
  note: |
    표식은 주석이라 화면에 차이가 없고, 목록의 클래스는 번들 화면이 쓰지 않아 잴 자리가 없다. 원본 CSS 를 Vitest 가 잰다.
