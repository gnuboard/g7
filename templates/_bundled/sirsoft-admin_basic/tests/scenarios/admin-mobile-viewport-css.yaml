feature: 관리자 화면이 좁은 뷰포트(390px·320px)에서 가로로 넘치지 않는다

description: |
  브라우저 실측에서 드러난 넘침 결함 셋을 템플릿 소유 규칙으로 막는다 — 모달 상자 폭 제한(B1),
  페이지 번호 줄바꿈(C4), 여러 언어 입력의 로케일 탭 줄바꿈(C1). jsdom 은 폭을 계산하지 않으므로
  규칙·클래스가 선언돼 있는지만 단언하고 실제 폭은 Playwright `mobile-viewport-overflow.spec.ts` 가 잰다.
  축 surface 는 규칙이 사는 자리(의미 클래스 CSS 또는 컴포넌트 소스)다.

axes:
  surface: [semantic_css, component_source]

effects:
  - modal_container_clamped_to_viewport
  - pagination_wraps_on_narrow_viewport
  - locale_tabs_wrap_on_narrow_viewport

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-mobile-viewport-css.test.tsx
