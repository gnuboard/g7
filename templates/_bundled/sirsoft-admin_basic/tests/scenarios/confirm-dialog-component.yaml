feature: 관리자 확인 대화상자(ConfirmDialog) 계약

description: |
  isOpen 일 때만 그린다. 확인과 취소 버튼(문구 바꾸기 가능)을 두고, 메시지는 문자열이나 React 노드를 받는다.
  확인은 onConfirm, 취소는 onCancel 과 onClose 를 부른다. 확인 버튼 변형은 prop 을 따르고 취소 버튼은 고정 스타일이다.

# axis 의미:
#   component — 이 매니페스트가 다루는 컴포넌트 하나(단위 시험이 그 컴포넌트를 직접 그린다).
axes:
  component: [confirm_dialog]

effects:
  - confirm_dialog_open_state_controls_render  # isOpen 이 참일 때만 대화상자를 그린다
  - confirm_dialog_buttons_and_message_render  # 확인과 취소 버튼, 바꾼 문구, React 노드 메시지, 버튼 변형 스타일
  - confirm_dialog_buttons_fire_callbacks      # 확인은 onConfirm, 취소는 onCancel 과 onClose 를 부른다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/ConfirmDialog.test.tsx
