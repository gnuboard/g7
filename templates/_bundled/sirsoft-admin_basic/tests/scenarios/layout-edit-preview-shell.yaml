feature: admin_basic 코드 편집기 — 미리보기를 템플릿 종류의 화면 셸로 열기

description: |
  코드 편집기 미리보기는 서버가 내준 토큰으로 `/preview/{token}` 을 열었다. 이 주소는 사용자 화면 셸이라 관리자 템플릿 레이아웃이
  활성 사용자 템플릿(sirsoft-basic)의 컴포넌트·다국어·라우트로 그려졌다(7.1.0 O-G3-6). 서버가 템플릿 종류에 맞춰 내주는
  `preview_url`(관리자 템플릿은 `/admin/preview/{token}`)을 그대로 열고, 응답에 주소가 없을 때만 토큰으로 사용자 셸 주소를 만든다.
  레이아웃 파일, 덮어쓰기형 확장 조각, 주입형 확장 조각(대상 고르는 창) 세 진입점을 모두 고정한다.

axes:
  template_type: [admin, user, unknown]
  entry: [layout_file, extension_overlay, extension_picker]

effects:
  - preview_opens_server_preview_url
  - preview_falls_back_to_token_path

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-template-layout-edit-preview-shell.test.ts
