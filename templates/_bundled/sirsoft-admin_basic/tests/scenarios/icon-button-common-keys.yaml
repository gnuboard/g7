feature: 아이콘 버튼 이름용 공용 문구

description: |
  아이콘만 있는 버튼의 이름으로 쓰는 공용 문구가 ko·en·ja 에 모두 있는지
  
  확장 화면의 아이콘 버튼(휴지통·연필·×·체크·새로고침 등)은 이 템플릿의 공용 문구(`common.*`)를 aria-label 로 쓴다
  (이커머스 전수 실측 S5, 2026-10-07). 칩·선택 해제용 「제거」(`common.remove`)는 이때 새로 생긴 문구다.
  한 언어라도 빠지면 그 언어 화면에서는 키 이름이 그대로 읽힌다.

  수정 이력: 이커머스 전수 실측 S5-D30 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01]
  # c01: %s 에 모든 문구가 있다

effects:
  - icon_button_common_keys_localized

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/iconButtonCommonKeys.test.ts
