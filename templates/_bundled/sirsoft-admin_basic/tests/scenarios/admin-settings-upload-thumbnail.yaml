feature: 환경설정 업로드 탭 썸네일 카드와 드라이버 탭 이미지 처리 카드 (#869)

description: |
  업로드 탭의 「썸네일」 카드는 설정(켬/끔·본문 이미지 규격·정리 스케줄)과 캐시(저장 위치 두 줄의 디스크·사용량·비우기)를
  한 카드에 둔다. 저장 위치는 저장 버튼으로 반영되지만 비우기는 즉시 실행이라, 화면이 고친 디스크가 저장값과 다르면 그 줄의
  사용량 자리를 「저장 후 집계」로 바꾸고 규격 select·비우기를 잠근다 — 저장 전 디스크를 비우는 사고를 막는다.

  「썸네일 규격」 카드는 서버가 합쳐 내려 준 행(`thumbnail_presets_rows`, 행마다 kind)을 표로 고친다. og 행은 크기를 SEO 탭이
  소유하고 서버도 저장하지 않으므로 값 칸이 모두 잠긴다. 저장 본문은 이 행을 저장 키 `thumbnail_presets` 로 바꾸고 og 행과
  표시용 칸을 뺀다. 그래서 서버 422 의 행 번호는 og 를 뺀 번호이고, 화면은 그것을 표의 행 번호로 옮겨 그 칸 아래에 단다.

  「기존 이미지 썸네일 만들기」는 명명 액션이 next_cursor 가 null 이 될 때까지 자기 자신을 다시 부른다. 계속할지는 switch 값
  식(최신 `_global` 을 읽는다)으로 가르므로, 요청이 도는 사이 누른 멈춤·창 닫기가 다음 걸음 전에 반영된다.
  요청이 도는 동안(inflight)에는 여는 버튼·시작 단추가 잠겨 창을 닫고 다시 열어 사슬을 하나 더 걸 수 없고, 시작마다 받는
  실행 토큰(runId)이 요청을 보낼 때의 토큰(requestRun)과 다르면 늦게 온 응답을 버린다.

  규격 행을 추가·삭제하면 번호 달린 422 오류(`upload.thumbnail_presets.{번호}.*`)를 지운다 — 저장 때의 행 순서 기준이라
  행 구성이 바뀌면 엉뚱한 칸에 붙는다. 사용량 집계(thumbnailStats)는 background 로 받아 탭 전환 덮개가 기다리지 않는다.

axes:
  surface: [storage_rows, presets_table, save_body, pregenerate_chain, purge_chain, purge_all_modal, driver_card, i18n, animated_original_toggle, server_limits]

effects:
  - storage_rows_show_usage_and_unlocked_purge        # 저장값과 같으면 사용량·비우기가 보이고 풀려 있다
  - unsaved_disk_locks_row_purge                      # 저장 전 디스크 줄은 「저장 후 집계」 + 규격 select·비우기 잠금
  - gated_same_bucket_warning_shown                   # 권한 줄 디스크와 드라이버 탭 공개 자산 디스크가 둘 다 s3 일 때만 권한 줄 select 아래 같은 버킷 경고
  - remote_disk_not_counted_and_engine_missing_notice # 원격 디스크는 「집계 안 함」, 엔진 없음 안내 + 만들기 잠금
  - storage_rows_zero_usage_shown                     # 썸네일 0개: 두 줄 유지, 「0개 · 0 B」, 비우기·만들기 사용 가능
  - og_row_value_cells_locked                         # og 행 값 칸 전부 잠금 + 「SEO 탭에서 설정」
  - preset_errors_mapped_to_display_rows              # 422 번호(og 제외)를 화면 행 번호로 옮긴다
  - content_preset_options_are_enabled_presets        # 본문 이미지 규격 선택지 = 사용 중 규격(og 제외)
  - extension_row_shows_localized_label               # 확장 행은 label 을 현재 언어로(없는 언어는 폴백) 보이고 식별자를 아래에 작게, label 없으면 식별자만. 본문·비우기 규격 select 도 같은 이름
  - save_body_maps_rows_to_presets                    # 저장 본문이 행을 thumbnail_presets 로 바꾸고 og·표시용 칸을 뺀다
  - other_tab_save_body_unchanged                     # 다른 탭 본문은 종전 그대로
  - pregenerate_chain_continues_until_cursor_null     # next_cursor 가 있고 멈춤이 아니면 다시 부른다
  - thumbnail_modals_registered                       # 두 창이 창 목록에 있고 만들기 창은 닫힘 표지로 멈춘다
  - pregenerate_stale_response_discarded              # 요청 토큰과 지금 토큰이 다르면 성공·실패 응답 모두 버린다
  - pregenerate_start_issues_new_run_token            # 시작은 새 토큰($uuid), 여는 버튼은 토큰을 비운다
  - pregenerate_locked_while_inflight                 # inflight 동안 여는 버튼·시작 단추 잠금
  - pregenerate_modal_shows_extension_preset_label    # 만들기 창 규격 선택지에 확장 규격 이름(현재 언어)과 식별자
  - pregenerate_modal_no_sources_notice               # 원본 선택지 0개(응답 전 포함)면 no_sources 안내, 1개 이상이면 안내 없이 체크 칸
  - preset_row_change_clears_indexed_errors           # 행 추가·삭제가 번호 달린 규격 오류만 지운다
  - preset_placeholders_translated                    # 이름·세로 칸 placeholder 는 다국어 키
  - thumbnail_stats_not_awaited_by_transition         # 사용량 집계는 background, transition-overlay wait-for 밖
  - image_driver_card_bound_to_catalog                # 이미지 처리 카드는 available_drivers.image·drivers.image_driver·사용 불가 안내
  - thumbnail_keys_exist_in_three_locales             # ko·en·ja 키 노출 0
  - preset_row_aria_fallback_translated               # 이름이 빈 규격 행의 칸 이름은 번역된 행 번호, 고정 기호 없음
  - purge_all_confirm_shows_progress_text             # 모두 비우기 단추는 진행 중 문구·스피너·잠금을 함께 바꾼다
  - purge_chain_continues_until_cursor_null           # 비우기 걸음 액션이 next_cursor 가 있으면 다시 부르고, 없으면 부른 곳(줄·두 곳 모두)에 맞게 끝낸다
  - purge_chain_accumulates_counts                    # 걸음마다 위치별 삭제 수를 쌓고 디스크째 비운 -1 은 -1 로 남긴다
  - purge_uncounted_shows_server_message              # 개수를 세지 않은 위치(-1)는 「-1개」 대신 서버 문구로 알린다
  - purge_chain_locks_buttons                         # 비우기가 도는 동안 줄 비우기·규격 select·두 곳 모두 비우기가 잠기고 부른 줄에만 진행 표시
  - animated_original_toggle_rendered_with_hint       # 「움직이는 이미지는 원본 사용」 토글이 라벨·안내와 함께 있고 저장 키에 묶인다
  - animated_original_toggle_locked_when_read_only    # 설정 수정 권한이 없으면 토글이 잠기고 눌러도 바뀌지 않는다
  - animated_original_toggle_saved_and_persisted      # 토글을 바꿔 저장하면 본문에 실리고 서버 값·새로고침 뒤 화면이 바뀐 값이다
  - server_limits_fields_rendered_with_defaults       # 「고급」 다섯 칸이 라벨·안내와 함께 있고 placeholder 는 서버 기본값, min/max 는 _meta.limits, 저장 키에 묶인다
  - server_limits_env_locked_field_disabled_with_badge  # .env 가 정한 칸만 잠기고 「.env 고정」 배지
  - server_limits_locked_when_read_only               # 수정 권한이 없으면 다섯 칸 모두 잠김
  - server_limits_error_shown_under_field             # 서버 422 를 그 칸 아래에 단다
  - server_limits_saved_in_body                       # 저장 본문에 다섯 값이 그대로(비운 칸은 null)

