feature: 관리자 로그인 폼(LoginForm) 계약

description: |
  이메일, 비밀번호 입력과 제출 버튼, 비밀번호 찾기 링크를 그린다. 제출 전에 빈 값과 이메일 형식을 검사해 오류 문구와 오류 스타일을
  보이고 기본 동작을 막는다. 검사를 통과하면 onSubmit 에 폼 제출 이벤트를 그대로 넘긴다(ActionDispatcher 핸들러가 FormData 를
  꺼내 CSRF 와 로그인 API 를 부른다). 입력에는 label 과 name 이 연결되고 className, style 이 루트에 붙는다.

# axis 의미:
#   component — 이 매니페스트가 다루는 컴포넌트 하나(단위 시험이 그 컴포넌트를 직접 그린다).
axes:
  component: [login_form]

effects:
  - login_form_renders_fields_and_links       # 이메일, 비밀번호, 제출 버튼, 비밀번호 찾기 링크와 바꾼 문구를 그린다
  - login_form_validates_before_submit        # 빈 값과 잘못된 이메일에 오류 문구와 오류 스타일을 보이고 onSubmit 을 부르지 않는다
  - login_form_tracks_typed_values            # 입력한 이메일과 비밀번호가 입력 값에 남는다
  - login_form_submits_form_event             # 검사를 통과하면 onSubmit 에 폼 제출 이벤트를 넘기고 실패하면 기본 동작을 막는다
  - login_form_fields_labelled_and_named      # 입력에 label 이 연결되고 name 속성이 있다
  - login_form_custom_class_and_style         # className 과 style 이 루트에 붙는다
  - login_form_action_dispatcher_integration  # ActionDispatcher 핸들러가 CSRF 와 로그인 API 를 올바른 옵션으로 부른다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/LoginForm.test.tsx
