feature: 검수 서버(실행 역할 stage) 대시보드 호환성 [다시 활성화] 잠금 — 셸 주입값 기준 (브라우저, #888)

description: |
  실행 역할은 셸 HTML 의 설정 블록(appConfig.runtime_role)으로 실려 온다. 문서 응답의 그 값을 stage 로 바꿔 열면
  대시보드 상단 경고·시스템 알림 목록의 [다시 활성화] 두 단추가 disabled 이고 잠금 안내(title)·시각 비활성
  꾸밈(opacity 0.5·cursor not-allowed)을 가지며, 눌러도 복구 요청이 나가지 않는다. 상단 검수 서버 띠도 그린다.
  바꾸지 않고 열면(live) 두 단추는 활성이고 누르면 알림이 실어 온 복구 주소로 POST 가 나간다.

# axis 의미:
#   case — 셸에 실린 실행 역할 (stage 로 바꿈 · 원본 live)
axes:
  case:
    - stage
    - live

effects:
  - stage_shell_locks_dashboard_recover_buttons
  - stage_recover_click_sends_no_request
  - stage_banner_rendered_from_shell_role
  - live_shell_keeps_dashboard_recover_enabled

test_files:
  - templates/_bundled/sirsoft-admin_basic/tests/Playwright/specs/admin/stage-role-lifecycle-gating.spec.ts

notes: |
  알림 목록 응답은 고정하고 쓰기 요청(복구·닫기)은 모두 가로챈다 — 개발 DB·확장 상태는 바뀌지 않는다.
  같은 잠금의 레이아웃 계약(카드 스위치·설치·업데이트·진입 단추)은 admin-stage-role-gating.yaml 의 Vitest 가 잰다.
