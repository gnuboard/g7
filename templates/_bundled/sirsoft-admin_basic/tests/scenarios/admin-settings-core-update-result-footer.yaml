feature: 코어 새 버전 확인 결과 창 — 단추가 고정 하단에 있고 새 버전이 없으면 빈 바닥 줄이 없다

description: |
  변경 이력 보기와 업데이트 단추가 「업데이트 있음」 갈래 안 본문 줄에 있어 640px 이하에서 쌓이지 않았다.
  단추를 Modal 고정 하단으로 옮기고 같은 조건(`$parent._local.coreUpdateInfo.update_available`)을 단추마다 달았다.
  새 버전이 없으면 단추가 모두 빠지고 Modal 이 빈 바닥 줄(테두리와 여백)을 숨긴다(`empty:hidden`).

# axis 의미:
#   update_available — 확인 결과에 새 버전이 있는가.
axes:
  update_available: [yes, no]

effects:
  - core_update_result_buttons_in_footer     # 새 버전이 있으면 두 단추가 고정 하단에 그려지고 본문에는 없다
  - core_update_result_empty_footer_hidden   # 새 버전이 없으면 바닥 줄이 비고 숨김 규칙이 걸린다

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-core-update-result-footer.test.tsx
