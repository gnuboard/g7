# audit:allow test-scenario-coverage[cross_product] reason: issue:#835 칸 표시(판정 필드·모드)와 저장 403 문구(응답·서버 문구)는 서로 다른 표면이라 곱하면 성립하지 않는 조합만 늘어난다 — effects 로 잠근다.

feature: 관리자 회원 수정 — 비밀번호를 만들 수 없는 회원 안내와 저장 403 문구 (sirsoft-admin_basic, 7.2.0)

description: |
  회원 상세의 `password_status.can_set=false` 면 비밀번호 칸·규칙·본인 확인 자리·현재 비밀번호 칸·관리자 지정 안내 대신 서버 문구를 보인다.
  판정이 없는 응답(이전 서버)은 지금처럼 칸을 보인다. 저장 403 은 서버 문구를, 없을 때만 「권한이 없습니다」 를 보인다.

axes:
  can_set: ['false', 'true', absent]
  mode: [edit, create]
  self: ['true']
  typed_password: ['yes']
  response: ['403']
  server_message: [present, absent]

effects:
  - admin_form_hides_password_fields_when_unsettable
  - admin_form_shows_server_unsettable_notice
  - admin_form_hides_reauth_when_unsettable
  - admin_save_403_shows_server_message

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-user-form-password-unsettable.test.ts
