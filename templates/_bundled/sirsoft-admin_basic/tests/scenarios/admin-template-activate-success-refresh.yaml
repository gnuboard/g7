# 시나리오 매니페스트 — 템플릿 활성화 성공 갈래의 새로 고침 판정
# 참조: docs/frontend/actions-handlers-ui.md 「같은 onSuccess 안에서 방금 저장한 상태를 다시 읽지 않는다」

feature: admin_template_activate_success_refresh

description: >-
  수정으로 성공 갈래 첫머리에서 selectedTemplate 을 곧바로 비운 뒤, 새로 고침 판정이 창 상태(_global)를 읽어
  판정 시점에 비워진 값을 보았다(리허설 A 실측 — 관리자 템플릿을 켜도 새로 고침 0회). 판정과 언어팩 창 닫힌 뒤
  새로 고침 값을 활성화 응답 data.template.type 으로 가른다.

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-template-activate-success-refresh.test.ts

axes:
  template: [admin, user]

effects:
  - admin_template_activation_refreshes_once   # 관리자 템플릿을 켜면 한 번 새로 고친다(새로 고침 지연 표시 참)
  - admin_template_activation_skips_extension_reload   # 관리자 템플릿을 켜면 확장 다시 싣기를 건너뛴다 — 방금 꺼진 관리자 템플릿 파일 404 방지. 사용자 템플릿은 다시 싣는다
  - user_template_activation_does_not_refresh   # 앞서 관리자 템플릿을 켰어도 사용자 템플릿을 켜면 새로 고치지 않는다

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: 리허설 A — 관리자 > 템플릿 > 관리자 템플릿 「활성화」 → 페이지 새로 고침, 이어서 사용자 템플릿 「활성화」 → 새로 고침 없음
  note: |
    1차 red(2026-11-18): 판정 문맥을 클릭 때 사본으로 둔 시험 — 실측과 달라 1차 재수정이 통과했으나 리허설 A 에서 실패.
    2차 red: 문맥 _global 을 판정 시점 저장소 값으로 고친 시험이 1차 재수정 코드에서 관리자 활성화 refresh 0회(expected +0 to be 1).
    응답 판정으로 고친 뒤 green 2 / 2.
    확장 다시 싣기 red: 관리자 활성화에서 확장 다시 싣기 1회(expected 1 to be +0) → reload-extensions 에 응답 판정 if → green 2 / 2.
