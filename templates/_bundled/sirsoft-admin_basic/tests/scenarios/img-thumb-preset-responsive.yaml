feature: 이미지 썸네일 규격(thumbPreset) × 반응형 문법 — 관리자 템플릿 Img·DataGrid 셀

description: |
  레이아웃은 `responsive` 로 화면 폭마다 Img 에 다른 썸네일 규격을 줄 수 있다. 규격이 폭을 따라가지 않으면 화면은 멀쩡하고
  흐린 이미지나 큰 원본 전송으로만 드러나므로, 렌더된 `<img>` 의 src·srcset 이 요청하는 `size` 값으로 잠근다.
  시험은 실물 TemplateApp·renderTemplate(루트 ResponsiveProvider 가 창 폭 구독)·ResponsiveManager·DynamicRenderer·G7CoreGlobals
  (G7Core.thumbnail·renderItemChildren·useResponsive)와 이 템플릿의 실물 Img·DataGrid 를 거친다. 썸네일 판정은 코어 support 그대로다.
  - 프리셋: mobile 0-767, tablet 768-1023, desktop 1024-, portable 0-1023. 경계 767/768, 1023/1024 에서 정확히 갈린다.
    프리셋끼리 겹치면 좁은 쪽(mobile)이 portable 을 이긴다.
  - 커스텀 구간: `min-max`·`-max`·`min-`. 커스텀이 프리셋을 이기고(범위가 더 넓어도), 커스텀끼리는 좁은 범위가 이긴다.
  - 식: `thumbPreset="{{_global.x}}"` 은 전역 상태가 바뀌면 다시 계산되고, responsive 안의 식은 그 구간에서만 평가된다.
  - 노드 문법: responsive children 교체 안의 Img, 반복 안 자식 Img, 반복하는 Img 자신, responsive 의 iteration 교체, if 오버라이드.
  - DataGrid 셀(renderItemChildren + componentContext.renderEnvRef): 앱 화면에서는 창 폭, 편집기 미리보기에서는 미리보기 기기 폭을 따른다.
    휴대폰 폭의 카드 보기 셀도 같다.
  - 편집기 미리보기(ResponsiveProvider overrideWidth + isEditMode): 창 폭이 아니라 기기 폭을 따르고, 창을 줄여도 바뀌지 않는다.
  - 창 크기 변경: 실제 resize 이벤트(150ms 디바운스) 뒤 일반 노드·반복 안 자식·DataGrid 셀이 다시 그려진다.
    반복하는 노드 자신의 responsive props 도 폭이 바뀐 뒤 따라간다. 첫 렌더 폭에서만 맞고 폭이 바뀌면 낡은 값이 남던
    엔진 결함(`DynamicRenderer` 반복 렌더 useMemo 의존성에 병합된 정의가 없었다)은 engine-v1.95.0 에서 고쳐졌고,
    그 재현 시험(창 resize 1280→500→1280, 편집기 기기 1280→390)은 green 이다.
  봇 화면(서버 렌더)의 같은 규칙은 `tests/scenarios/seo-component-html-mapper.yaml` 이 본다. 사용자 템플릿 Img 는
  `templates/_bundled/sirsoft-basic/tests/scenarios/img-thumb-preset-responsive.yaml`.

axes:
  grammar: [preset_breakpoint, custom_range, expression_binding, responsive_children, iteration, if_override, datagrid_cell, editor_preview, window_resize]

effects:
  - thumb_preset_follows_preset_breakpoints
  - thumb_preset_breakpoint_boundaries_exact
  - thumb_preset_narrower_preset_wins_over_portable
  - thumb_preset_follows_custom_ranges
  - thumb_preset_custom_range_wins_over_preset
  - thumb_preset_narrower_custom_range_wins
  - thumb_preset_expression_rebinds_on_global_state_change
  - thumb_preset_expression_inside_responsive_evaluated
  - thumb_preset_in_responsive_children_override
  - thumb_preset_in_iteration_follows_width
  - thumb_preset_if_override_swaps_image
  - thumb_preset_in_datagrid_cell_follows_render_width
  - thumb_preset_editor_preview_follows_device_width
  - thumb_preset_rerenders_on_window_resize

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/basic/__tests__/Img.responsiveThumbPreset.test.tsx

notes: |
  e2e_browser=partial — 실제 브라우저 창 크기 변경과 편집기 기기 전환 뒤의 currentSrc·네트워크 요청 규격은 브라우저 실측으로 잰다.
