# audit:allow test-scenario-coverage[cross_product] reason: |
#   reason·can_postpone·response·dormancy 는 서로 조건부다(관리자 지정이면 연기 불가, 휴면 안내는 최종 성공 응답에서만).
#   축의 명목상 곱을 케이스로 나누지 않고 effects 단위로 잠근다 — 구조 테스트는 세 단계 상보·상호배타·분기 조건을,
#   렌더 테스트는 실제 login → AuthManager → 핸들러 반환값 → onSuccess 경로를 지난다. 응답별 화면 실측은 Playwright spec 이 맡는다.

feature: 관리자 로그인 비밀번호 변경 단계 (sirsoft-admin_basic, #736)

description: |
  비밀번호가 만료됐거나 관리자가 정해 준 비밀번호면 로그인·인증번호 확인 응답이 토큰 대신 변경 단계를 돌려준다
  (engine-v1.77.0 — `response.password_change_required`). 관리자 로그인 화면은 자격증명 / 2단계 인증 / 비밀번호 변경
  세 단계를 같은 카드에서 바꾼다.

  핵심 동작:
    - 세 단계 블록 `if` 와 제출 액션(login·loginTwoFactor·loginPasswordChange) `if` 가 상호배타다.
    - 성공 분기는 `password_change_required` 를 먼저 본다 — 아니면 토큰 없는 응답을 성공으로 오판해 이동한다.
    - 「다음에 변경」은 연기 허용(`can_postpone`)일 때만, 식별자 무효(422 challenge_id)면 처음부터 다시 로그인.
    - 최종 성공 지점마다 휴면 해제 안내(D20 — 엔진이 키를 버리던 결함의 레이아웃 쪽 잠금).

axes:
  reason: [none, expired, admin_assigned]
  can_postpone: [true, false]
  response: [password_change_required, ok, challenge_invalid, 422_password]
  dormancy: [restored, not_restored]

effects:
  - state_owned_inputs_skip_auto_binding
  - three_steps_are_mutually_exclusive
  - change_step_entered_without_token
  - credential_step_hidden_on_change_step
  - postpone_button_only_when_allowed
  - change_completion_logs_in_with_dormancy_notice
  - invalid_challenge_returns_to_credentials
  - field_errors_rendered_under_inputs
  - dormancy_notice_reaches_layout_on_plain_login
  - init_resets_change_step
  - restart_clears_both_steps

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-login-password-change-step.test.tsx
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-login-password-change-render.test.tsx
