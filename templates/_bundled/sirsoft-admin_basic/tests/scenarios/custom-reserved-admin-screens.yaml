feature: 관리자 화면 — custom 사전 검사 중단 안내와 사용자 화면 URL 칸 (#792)

description: |
  코어 업데이트 확인 결과 창은 새 코어로의 업데이트가 custom 패키지 충돌·예약 경로 파일 때문에 시작 전에
  멈췄다는 기록(custom_preflight)이 있을 때만 충돌 표·예약 파일·해결 순서를 보여 준다.
  환경설정 일반 탭의 「사용자 화면 URL」 칸은 general.user_screen_url 에 묶이고 칸 오류를 그 아래 보여 준다.
  두 영역이 쓰는 번역 키는 ko·en·ja 모두에 있다.

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/layouts/coreUpdateCustomPreflight.test.ts
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/layouts/userScreenUrlField.test.ts

