feature: 환경설정 「회원」 탭의 뼈대와 렌더

description: |
  관리자 환경설정에 「회원」 탭이 보안 뒤에 들어가 탭이 16개가 된다. 하위 탭 막대는 「가입 항목」「표시 이름」「닉네임 정책」 셋이고
  (「표시 이름」 구획의 내용은 admin-settings-member-display-name 이 잠근다), 탭 id 에 `member_section_` 을 붙인 구획으로 스크롤한다.

  항목 정의(`memberFieldDefs`)는 회원 탭에서만 받는다. 표는 항목마다 이름, 유형, 출처, 사용, 필수, 가입 표시, 범위를 그리고,
  선언한 쪽이 잠근 속성은 스위치를 잠그고 사유를 보이며, 유형을 제공한 확장이 꺼진 항목은 스위치 대신 「사용 불가」 배지를 보인다.
  선언 항목은 [설정], 운영자가 추가한 항목은 [수정][삭제]가 나온다. 조회 권한만 있는 관리자에게는 스위치, 손잡이, 「항목 추가」가
  잠기고(disabled, 흐림, 금지 커서) 행 단추는 [보기]만 나온다. 가입 화면이 수정본으로 유지되면 표 위에 경고를 띄운다.
  화면에 번역 키가 그대로 보이면 안 되며 ko 와 en 의 키 모양이 같아야 한다.

  닉네임 정책 구획은 설정 폼의 `member` 칸에 묶여 하단 「저장」으로 저장한다. 「중복 금지」를 켤 때는 겹치는 닉네임을 먼저 받아
  있으면 종 수와 회원 수를 보이고 확인을 받은 뒤 폼에 켠다(없으면 바로). 저장 뒤 서버가 도는 중복 검사 준비 작업의 진행을 보인다.

