# HtmlContent 는 Fragment 를 돌려주지만 부모 DOM 에는 본문 Div 하나만 놓인다
# 호출 레이아웃이 첫 자식, 형제 선택자, 줄 자르기로 HtmlContent 를 감쌀 때 기대는 DOM 구조를 잠근다.
feature: html_content_single_root_alpha4

description: |
  HtmlContent 는 본문 Div 와 확대 보기(ImageGallery)를 Fragment 로 돌려준다. ImageGallery 는 서드파티 Lightbox 라 닫혀 있으면 DOM 을
  그리지 않고 열리면 document.body 로 포털한다. 그래서 부모의 자식은 언제나 본문 Div 하나다. 축 gallery 는 확대 보기의 열림 상태다.

axes:
  gallery: [closed, open]

effects:
  - html_content_parent_sees_single_element     # 닫힌 확대 보기는 부모 안에 아무것도 그리지 않는다
  - html_content_gallery_portals_outside_parent # 열린 확대 보기는 부모 밖(body)에 붙고 부모 자식 수는 그대로다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/HtmlContentSingleRoot.test.tsx

validation:
  note: |
    시험 보강(결함 아님 판정의 잠금). ImageGallery 를 인라인 자리 표시로 바꾼 변형에서 2건 모두 실패(부모 자식 2)하는 것을 확인했다.
