feature: 역할·회원 수정 → 등록 전환 시 등록 폼의 직전 레코드 잔존 제거

description: |
  역할 수정/등록(admin_role_form)과 회원 수정/등록(admin_user_form)은 각각 한 레이아웃을 공유해
  엔진이 _local 을 비우지 않고(layout_name 불변), 레이아웃 state.form 기본값은 기존 키가 있으면 다시
  적용되지 않는다. 그래서 등록 화면의 식별자 칸에 직전 역할(admin)이, 회원 등록 폼에 직전 회원의
  이메일·이름이 그대로 보였다 (브라우저 실측 2026-09-14, #599). 생성 모드 init_actions 에서 form 을
  null 로 비우고(역할은 state.form 과 같은 기본값을 다시 씀) 등록 폼이 직접 진입과 같아지게 한다.
  복제 진입(clone_from)은 clone_source 데이터소스의 initLocal 이 init_actions 뒤에 병합되므로
  영향을 받지 않는다.

axes:
  form: [role, user]

effects:
  - create_mode_clears_previous_form   # 생성 조건의 form: null 액션
  - state_form_defaults_reapplied      # 역할: 비운 뒤 state.form 과 같은 기본값을 같은 조건으로 다시 씀
  - clone_source_untouched             # 역할: 복제 진입 데이터소스는 그대로
  - edit_datasource_untouched          # 회원: 수정 모드 user 데이터소스(initLocal form, if route?.id)는 그대로

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-role-form-create-mode-reset.test.ts
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-user-form-create-mode-reset.test.ts

validation:
  note: |
    브라우저 실측(수정 → 등록 SPA 도착 폼 = 등록 직접 진입 폼)은 코어 시나리오
    tests/scenarios/same-layout-create-form-reset.yaml 의 Playwright spec 이 담당한다(form=role, form=user).
