feature: Select 옵션 설명(description)

description: |
  커스텀 드롭다운(options 모드) Select 의 옵션에 `description` 을 주면, 목록을 펼쳤을 때 그 옵션의 라벨 아래에
  작은 글자로 설명을 보인다. 닫힌 상자에는 라벨만 보이고, description 이 없는 옵션은 종전 그대로다.
  게시판 「비밀 답변 열람 범위」 선택 상자(게시판 수정·환경설정)가 쓴다.

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/basic/__tests__/Select.description.test.tsx

axes:
  option:
    - with_description
    - without_description

effects:
  - description_shown_small_under_label   # 펼친 목록에서 라벨 아래 text-xs 설명
  - trigger_shows_label_only              # 닫힌 상자에는 라벨만
  - plain_option_unchanged                # description 없는 옵션은 라벨 하나
