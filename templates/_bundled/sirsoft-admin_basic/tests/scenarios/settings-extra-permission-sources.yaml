# 시나리오 매니페스트 — 환경설정에서 설정 조회 외 권한이 필요한 목록·링크가 그 권한이 없는 관리자에게 「없음」으로 그려지지 않는다
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: settings_extra_permission_sources

description: >-
  환경설정 화면의 레이아웃 권한은 설정 조회(core.settings.read) 하나라, 언어팩 조회·본인인증 프로바이더 설정 조회·정책 조회 권한이 없는
  관리자도 들어온다. 그 권한이 필요한 데이터소스(language_packs·unplaced_bundled_notice·identityProviders·policies·adminIdentityPolicies)는
  403 처리 없이 fallback 만 있어 403 이 빈 목록으로 처리됐다 — 「설치된 언어팩이 없습니다」·「등록된 프로바이더가 없습니다」·
  「등록된 정책이 없습니다」·「운영자 정책이 없습니다 … 먼저 등록해 주세요」로 그렸고, 엔진 기본 처리(toast)가 오류 알림을 띄웠다.
  이제 403 은 조용히 넘기고, 계산값(current_user 권한, 받기 전 null)이 거짓이면 그 목록 자리에 권한 안내를 보인다. 언어팩 탭은 탭 자체가
  언어팩 목록이라 탭 항목을 숨긴다(직접 진입은 권한 안내). 드라이버 탭 「처리 기록 보기」(큐 탭)는 베이스 판정 adminQueueJobsReadable 로,
  설정 탭 곳곳의 「스케줄 관리에서 변경」 링크는 스케줄 조회 권한(계산값 canReadSchedules)으로 가린다. 데이터소스 조건 문맥에는 사용자가
  없어 요청 자체는 그대로 나간다(403 은 조용히 넘김).

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin_settings-extra-permission-sources.test.tsx

axes:
  permission: [missing, granted]   # 그 목록·링크에 필요한 권한이 없음 / 있음

effects:
  - permission_notice_keys_exist          # 권한 안내 문구 키(언어팩·프로바이더·정책)가 ko·en 에 있다
  - forbidden_source_is_quiet             # 다섯 데이터소스의 403 은 suppress — 전역 오류 알림 없음
  - forbidden_list_shows_permission_notice # 권한이 없으면 빈 목록 문구 대신 권한 안내, 언어팩 탭 항목은 숨김
  - granted_lists_unchanged               # 권한이 있으면 탭·목록이 종전대로, 권한 안내 없음
  - forbidden_link_hidden                 # 큐 탭·스케줄 관리로 가는 링크는 권한이 없으면 숨김, 있으면 보임

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: 설정 조회·수정만 가진 관리자로 환경설정 → 언어팩 탭 없음, 본인인증 탭 프로바이더·정책 자리에 권한 안내, 드라이버 탭 처리 기록 보기·스케줄 링크 없음, 오류 알림 없음
