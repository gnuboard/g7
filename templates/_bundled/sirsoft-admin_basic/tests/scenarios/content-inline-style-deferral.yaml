feature: 본문·미리보기 HTML 의 서식을 인라인 스타일 없이 그린다 — 엄격한 스타일 정책 호환 (공개 #163)

description: |
  운영자가 `style-src 'self'; style-src-attr 'none'` 을 걸면 `<style>` 요소와 HTML 문자열(dangerouslySetInnerHTML·innerHTML)의
  `style="…"` 속성이 막힌다. 종전에는 본문 출력(HtmlContent)·아이콘 미리보기(IconPickerWidget)가
  style 속성이 든 HTML 을 그대로 꽂았고, 페이지 전환 로딩 막대는 keyframes 를 `<style>` 요소로 실었다.

  핵심 동작:
    - 코어 본문 서식 지연 장치(`G7Core.inlineStyle`)가 있으면 정화하면서 style 속성을 `data-g7-style` 로 받고,
      화면에 붙인 뒤 `el.style.cssText` 로 입힌다(이 대입은 막히지 않는다). 본문이 바뀌면 다시 입힌다
    - 본문 콘텐츠 규칙 경로(`G7Core.contentPolicy.sanitize`)에는 `G7_DEFER_STYLE: true` 를 넘긴다
    - 정화에는 전역 DOMPurify 가 아니라 전용 인스턴스를 넘긴다(코어 훅이 전역으로 새지 않게)
    - style 을 금지한 설정(prop 으로 덧붙인 금지)은 그대로 장치에 가서 서식이 버려진다
    - 장치가 없는 옛 코어에서는 종전 그대로다
    - 로딩 막대의 `@keyframes loading` 은 템플릿 CSS(`src/styles/main.css`) 최상위에 있다

axes:
  surface: [html_content, icon_picker_preview, page_transition_indicator]
  core: [with_inline_style, with_inline_style_and_policy, legacy, legacy_with_policy, any]

exclusions:
  - { surface: icon_picker_preview, core: [with_inline_style_and_policy, legacy_with_policy], reason: "본문 콘텐츠 규칙(G7Core.contentPolicy)은 HtmlContent 만 거친다" }
  - { surface: page_transition_indicator, core: [with_inline_style, with_inline_style_and_policy, legacy, legacy_with_policy], reason: "로딩 막대는 장치와 무관하게 CSS 파일의 keyframes 만 쓴다(core=any 가 대표)" }
  - { surface: [html_content, icon_picker_preview], core: any, reason: "장치 유무로 동작이 갈리는 표면이라 with_inline_style·legacy 로 나눠 잰다" }

effects:
  - style_attribute_deferred           # 꽂는 HTML 문자열에 style 속성이 없다
  - style_applied_via_cssom            # 붙인 뒤 el.style 에 서식이 있고 지연 속성은 남지 않는다
  - style_reapplied_on_content_change  # 본문이 바뀌면 다시 입힌다
  - hooks_stable_across_early_return   # 빈 값·일반 텍스트를 오가도 훅 순서가 유지된다
  - policy_path_gets_defer_flag        # 규칙 경로에 G7_DEFER_STYLE 을 넘긴다
  - dedicated_purify_instance          # 전용 DOMPurify 인스턴스를 넘긴다
  - forbid_config_passed_through       # style 금지 설정이 장치에 그대로 간다
  - legacy_core_unchanged              # 장치가 없으면 종전 출력
  - no_style_element_rendered          # 로딩 막대가 <style> 요소를 만들지 않는다
  - keyframes_in_template_css          # @keyframes loading 이 main.css 최상위에 있다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/HtmlContent.inlineStyle.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/PageTransitionIndicator.noInlineStyle.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/layout-editor/__tests__/IconPickerWidget.inlineStyle.test.tsx
