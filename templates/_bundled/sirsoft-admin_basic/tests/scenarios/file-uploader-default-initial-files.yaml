feature: sirsoft-admin_basic FileUploader — 생략된 배열 속성 기본값과 initialFiles 동기화

description: |
  initialFiles 를 생략하면 기본값 빈 배열이 렌더마다 새로 만들어져, 그 값을 의존성으로 쓰는 동기화 effect 가
  상태를 바꾸고 다시 그리기를 부르는 일이 끝없이 이어질 수 있었다(7.1.0 O-PD-2, 결정 ⑪).
  생략된 initialFiles·roleIds 의 기본값은 렌더마다 같은 얼린 빈 배열이고, 부모가 렌더마다 새 빈 배열을 넘겨도
  업로더는 한 번만 다시 그려진다. 내용이 바뀐 initialFiles 는 종전대로 목록에 반영된다.

axes:
  case: [omitted, omitted_role_ids, inline_empty_each_render, content_changed]

effects:
  - no_sync_loop
  - stable_default_reference
  - initial_files_sync_kept

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/FileUploaderDefaultInitialFiles.test.tsx
