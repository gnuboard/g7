feature: sirsoft-admin_basic 공통 컴포지트와 핸들러의 단위 계약 — 소유 매니페스트가 없던 시험 파일을 묶는다

description: |
  #869 타입 오류 정리에서 손댄 시험 파일 가운데 소유 시나리오 매니페스트가 없던 것들을 컴포넌트 축으로 묶는다.
  다국어 탭 패널, 풍부한 선택 상자, 검색 막대, 정렬 가능한 메뉴 항목과 목록, 사용자 프로필, 테마 설정 핸들러,
  편집기 아이콘 고르개의 기존 단위 계약을 그대로 소유한다(시험 본문은 바꾸지 않았다). 첨부 내려받기 핸들러 시험
  (handlers/__tests__/downloadAttachment.test.ts)은 board-attachment-download-actor.yaml(sirsoft-board)이 소유한다.

axes:
  component: [multilingual_tab_panel, rich_select, search_bar, sortable_menu_item, sortable_menu_list, user_profile, set_theme_handler, icon_picker_widget]

effects:
  - multilingual_tab_panel_renders_locale_tabs_and_variants   # 로케일 탭, 자식, variant 스타일, locales prop 에 따른 탭 목록
  - multilingual_tab_panel_switch_updates_active_locale       # 탭 클릭과 defaultLocale, locales 변경이 activeLocale 과 콜백에 반영된다
  - multilingual_tab_panel_context_propagates_active_locale   # Context 로 활성 로케일과 지원 로케일이 전파되고 중첩과 G7Core 폴백이 독립적이다
  - rich_select_dropdown_open_select_close                    # 열기, 옵션 선택, ESC 와 바깥 클릭 닫기, 비활성, 초기값, 빈 목록, children 대체
  - rich_select_styling_and_aria                              # className, maxHeight, 다크 모드 클래스, aria 속성
  - search_bar_input_and_submit_callbacks                     # 입력 onChange, 제출 onSubmit, 제어 값, className 과 style
  - search_bar_suggestions_shown_and_hidden                   # 제안 목록 표시와 클릭 콜백, 빈 입력과 포커스 잃음에 숨김
  - sortable_menu_item_renders_menu_fields                    # 이름, 아이콘 글리프, URL, 선택 강조, 들여쓰기, 모듈 아이콘, 펼침 아이콘
  - sortable_menu_item_callbacks_and_toggle                   # 클릭, 펼침, 토글, 수정, 삭제 콜백과 비활성 상태
  - sortable_menu_item_drag_handle_visibility                 # 끌기 손잡이가 보이고 enableDrag=false 면 숨는다
  - sortable_menu_list_renders_tree_and_selection             # 목록, 빈 목록, 제목, 선택 강조와 onSelect, 펼침 버튼, 들여쓰기, 검색, 로딩, 토글 비활성
  - sortable_menu_list_drag_handles                           # 끌기 손잡이가 항목마다 있고 부모와 자식이 서로 다른 DndContext 를 쓴다
  - sortable_menu_list_children_expand_and_select             # 자식 메뉴 펼침, 렌더, 선택, 토글, 컨테이너 클래스
  - user_profile_renders_user_info                            # 이름, 역할, 아바타와 기본 아이콘, 클래스
  - user_profile_dropdown_open_close_and_callbacks            # 드롭다운 열기와 닫기, 이메일, 위로 열림, 언어 선택기 없음, 프로필과 로그아웃 콜백
  - user_profile_custom_texts                                 # profileText, logoutText 와 기본 영어 문구
  - user_profile_buttons_accessible                           # 프로필 버튼과 드롭다운 버튼이 button 역할로 접근된다
  - set_theme_handler_applies_and_persists_theme              # light, dark, auto 를 적용하고 저장하며 context 가 없어도 동작한다
  - set_theme_handler_rejects_invalid_target_without_applying # 지원하지 않거나 빈 값, 템플릿 문자열, params.theme 단독, 저장 실패면 적용하지 않는다
  - icon_picker_widget_catalog_search_and_select              # 카탈로그 검색 그리드, 필터, 셀 클릭과 없음 선택, fa 글리프 미리보기
  - icon_picker_widget_falls_back_to_free_input               # 카탈로그가 없으면 자유 입력으로 물러선다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/MultilingualTabPanel.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/RichSelect.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/SearchBar.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/SortableMenuItem.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/SortableMenuList.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/UserProfile.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/handlers/__tests__/setThemeHandler.test.ts
  - templates/_bundled/sirsoft-admin_basic/src/layout-editor/__tests__/IconPickerWidget.test.tsx

notes: |
  e2e_browser=not_applicable — 컴포넌트와 핸들러 단위 계약이라 jsdom(Vitest)으로 잠근다. 테마 버튼의 브라우저 확인은
  admin-auth-theme-toggle.yaml 이, 첨부 내려받기의 브라우저 확인은 board-attachment-download-actor.yaml 이 맡는다.
