feature: 관리자 템플릿이 직접 보내는 요청의 토큰 첨부·이동 대상 출처 (KVE-2026-2350)

description: |
  이 템플릿의 컴포넌트·핸들러 일부는 코어 ApiClient 를 거치지 않고 `fetch` 로 직접 요청하며 관리자 토큰을
  싣는다. 대상 주소가 레이아웃 prop(`apiEndpoint`·`logoutEndpoint`)이나 서버 응답 본문
  (`challenge_start_url`)에서 오는데, 레이아웃은 주소를 표현식으로 조립할 수 있어 저장측 검사가 외부 주소를
  다 잡지 못한다. 출처를 보지 않고 토큰을 실으면 레이아웃 편집 권한만 있는 계정이 관리자 토큰을 외부로
  보내게 할 수 있었다(권한전이 → 설치 API).

  - 언어 선택(LanguageSelector): 관리자가 상단바에서 언어를 바꿀 때
  - 프로필 메뉴(UserProfile): 로그아웃을 누를 때. 로그아웃 뒤 이동 주소(`redirectPath`)도 prop 이라
    실행 스킴 주소면 관리자 화면에서 스크립트가 돌았다(KVE-2026-2348 과 같은 원인)
  - 본인인증 launcher: 교차 출처 서버가 428 을 흉내 내 자기 주소를 `challenge_start_url` 로 넣을 때

  토큰은 동일 출처 대상에만 싣는다(요청 자체는 막지 않는다). 이동은 동일 출처 주소만 따르고 아니면 기본
  로그인 경로로 간다. 판정은 코어 `G7Core.api.isSameOriginUrl`(apiCall 과 같은 기준)이며, 제공하지 않는
  코어에서는 같은 URL 파서로 판정한다(`src/support/sameOriginRequest.ts`).

axes:
  sink: [identity_launcher, language_selector, user_profile_logout, user_profile_redirect]
  target: [same_origin, cross_origin]

effects:
  - extension_token_same_origin_only              # 교차 출처 대상에는 Bearer·XSRF 를 싣지 않고, 동일 출처는 종전대로 싣는다
  - cross_origin_redirect_falls_back_to_default   # 동일 출처가 아닌 이동 주소(실행 스킴 포함)는 기본 경로로 대체된다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/support/__tests__/sameOriginRequest.test.ts
  - templates/_bundled/sirsoft-admin_basic/src/handlers/__tests__/identityLauncher.originPolicy.test.ts
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/LanguageSelector.originPolicy.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/UserProfile.originPolicy.test.tsx

validation:
  note: |
    외부 주소 변형은 절대(`https://`)·protocol-relative(`//`)·백슬래시(`/\`) 3형, 이동 주소는 실행 스킴 2형을
    더한다. 코어 경로(교차 출처 428 을 launcher 로 넘기지 않음)는 코어 매니페스트
    `tests/scenarios/layout-expression-sandbox.yaml` 과 배포 번들 Playwright 가 잰다.
