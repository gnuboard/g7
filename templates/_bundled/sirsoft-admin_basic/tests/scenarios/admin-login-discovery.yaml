# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 action, response, entry, login_identifier, locale 축은 판정 API 응답, 우회 쿼리,
# 식별자 설정을 열거한 것이다. 시험은 조건식을 값별로 평가해 갈래를 밟으며 축 전체의 곱을 화면으로 띄우지 않는다.
# 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 관리자 로그인 수단 판정, 자동 이동, 외부 인증 안내 (sirsoft-admin_basic 1.2.0, 7.2.0 A1t ③)

description: |
  이메일 칸 blur(값이 바뀐 경우만) → POST /api/auth/admin/login/discover → external 이면 _local.discovery 로
  비밀번호 칸과 로그인 버튼을 숨기고 「… 계정으로 계속」. 관리자 자동 이동(_global.appConfig.auth.auto_redirect.admin)은
  local, login_handoff, sso_error, sso_pending, sso_link 쿼리가 있으면 하지 않고, 그 사이트에는 ?local=1 링크가 있다.
  403 auth.password_auth_disabled 는 이동 버튼(loginAlternate*), 409 auth.external_step_required 는 이동.
  식별자 칸 type 은 login_identifier.admin 을 따른다. 안내 데이터는 error.errors.* 로만 읽는다.

axes:
  query: [local|none]
  label: [present|absent]
  discovery: [external]
  action: [email_blur, continue_click, submit]
  value: [changed, same, empty]
  response: [external, password, error, 403_password_auth_disabled, 409_external_step_required]
  entry: [plain, local, login_handoff, sso_error, sso_pending, sso_link]
  auto_redirect: ["on", "off"]
  redirect: [with, without]
  login_identifier: [email, email_or_username]
  surface: [login_card, email_field, whole_layout]
  locale: [ko, en]

effects:
  - discovered_notice_shown
  - local_notice_shown_on_local_entry
  - email_blur_requests_admin_discovery
  - discovery_state_never_touches_form_store
  - external_discovery_hides_password_and_offers_continue
  - auto_redirect_skipped_for_bypass_queries
  - local_link_when_auto_redirect
  - password_auth_disabled_offers_alternate_button
  - external_step_required_redirects
  - identifier_field_type_follows_config
  - guidance_reads_error_errors_only
  - login_external_lang_keys_present

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-login-discovery.test.ts
