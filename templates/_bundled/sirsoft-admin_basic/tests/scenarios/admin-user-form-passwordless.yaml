# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 mode × checked × locale 중 locale 은 lang 키 검사에만 의미가 있다.
# 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 회원 추가 「비밀번호 없이 만들기」 (sirsoft-admin_basic 1.2.0, 7.2.0 A2t, K11)

description: |
  추가 모드에만 체크박스 create_without_password(autoBinding false, change 로 boolean 저장, 켜면 form.password 와
  form.password_confirmation 을 비움). 켜져 있으면 비밀번호 두 칸과 규칙 안내 숨김. 수정 모드엔 체크박스 없음.
  저장 본문은 _local.form 그대로라 플래그가 실린다.

axes:
  mode: [create, edit]
  checked: [true, false]
  locale: [ko, en]

effects:
  - create_without_password_only_in_create_mode
  - checkbox_stores_boolean_and_clears_password
  - password_fields_hidden_when_passwordless
  - save_body_carries_passwordless_flag
  - passwordless_create_lang_keys_present
  - password_badge_follows_create_without_password

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-user-form-passwordless.test.ts
