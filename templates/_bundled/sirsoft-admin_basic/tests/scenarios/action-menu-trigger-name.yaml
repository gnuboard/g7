feature: 작업 메뉴(⋯) 버튼 이름

description: |
  글자 없이 아이콘만 그리는 작업 메뉴 버튼이 읽을 수 있는 이름을 갖는지
  
  목록(DataGrid)의 줄마다 붙는 작업 메뉴(⋯) 버튼은 `triggerLabel=""` 로 아이콘만 그려, 화면 낭독기가 버튼 이름을
  아이콘 이름 「ellipsis h」 로 읽었다(이커머스 전수 실측 S5, 2026-10-07 — 쿠폰 목록 줄 메뉴). 관리자 화면의 모든
  데이터 목록이 같은 부품을 쓴다. 글자가 없을 때는 「더보기」(`common.more_actions`) 를 버튼 이름으로 단다
  (글자를 생략한 기본 트리거의 보이는 글자 「작업」(`common.actions`) 과는 다른 문구다).

  수정 이력: 이커머스 전수 실측 S5-D29 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04]
  # c01: 글자 없이 아이콘만 그리면 「더보기」 를 버튼 이름으로 단다(아이콘 이름으로 읽히지 않게)
  # c02: 이름을 넘기면 그 이름을 쓴다
  # c03: 글자가 있으면 그 글자가 이름이다(aria-label 로 덮지 않는다)
  # c04: 컴포넌트 선언(components.json)에 triggerAriaLabel 이 있다

effects:
  - action_menu_trigger_named

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/ActionMenuTriggerName.test.tsx
