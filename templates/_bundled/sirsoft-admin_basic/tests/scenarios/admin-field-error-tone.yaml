feature: 관리자 부품의 칸 오류 문구 한 색 (1.2.1 입력값 오류 문구 통일, 7.2.1 출시 전 실측 W1-002)

description: |
  레이아웃 오류 문구는 .form-error(red-700 / 다크 red-300, 칸 아래 줄)로 맞췄지만, 부품이 직접 그리는 칸 오류 문구(메뉴 아이콘 칸·FormField·
  다국어 입력·태그 입력·라디오·동적 필드 목록)가 text-red-600 을 써서 같은 화면에 빨강이 두 가지로 보였다. 부품도 .form-error 를 쓴다.

axes:
  case: [field_error_tone, multilingual_error_single]

effects:
  - field_error_uses_form_error_class
  - multilingual_error_rendered_once

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/fieldErrorTone.test.ts
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/multilingual-error-single.test.ts
