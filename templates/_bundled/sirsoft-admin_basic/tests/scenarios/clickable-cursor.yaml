feature: 눌러 쓰는 비단추 요소의 손 모양 커서(sirsoft-admin_basic 부품)

description: |
  Tailwind v4 는 커서를 주지 않는다. 클릭을 받는 Flex, Grid 와 본문 확대 이미지(`data-g7-zoom`), 눌러 쓰는 카드(\`card-clickable\`)가
  화살표 커서였다(#869 κ). 부품이 클릭을 받을 때 `cursor-pointer` 를 더하고, 바탕 규칙과 의미 클래스가 커서를 준다.

# axis 의미:
#   element — 커서를 받는 요소 종류.
axes:
  element: [flex, grid, zoom_image, clickable_card]

effects:
  - clickable_element_shows_pointer_cursor   # 클릭을 받는 요소는 손 모양(확대 이미지는 확대) 커서를 갖는다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/__tests__/clickableCursor.test.tsx
