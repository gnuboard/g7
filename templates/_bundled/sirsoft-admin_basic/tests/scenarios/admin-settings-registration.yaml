# audit:allow test-scenario-coverage[cross_product] reason: value 축(true/false)은 토글이 싣는 boolean 의 두 값을 이름 붙인 것이고
# 시험은 자동 바인딩 계약과 서버 기본값, 노출 스키마, 저장 규칙을 대조한다. locale 은 lang 키 검사에만 의미가 있다.
# 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 환경설정 > 보안 「회원가입」 카드 (sirsoft-admin_basic 1.2.0, 7.2.0 A3t, K9)

description: |
  보안 탭 첫 카드 「회원가입」의 「일반 회원가입 받기」 토글이 security.registration_enabled 를 boolean 으로 저장한다.
  문구 키는 admin.settings.security.registration.*.

axes:
  surface: [security_tab]
  value: [true, false]
  locale: [ko, en]

effects:
  - registration_card_is_first
  - registration_toggle_binds_boolean_setting
  - registration_lang_keys_present

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-registration.test.ts
