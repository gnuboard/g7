feature: 고르거나 지운 직후 포커스가 body 로 빠지지 않는다

description: |
  선택지를 고르면 목록이 닫히고 태그를 지우면 지우기 단추가 사라져, 포커스가 body 로 빠졌다(#869 브라우저 실측, 결정
  「키보드 접근 전부」). 목록을 고르거나 Esc 로 닫으면 연 칸(단추)으로, 태그를 지우면 같은 자리의 다음 지우기 단추로,
  다음이 없으면 입력칸으로 돌린다. 입력칸이 없는 태그 선택은 앞 지우기 단추, 그것도 없으면 태그 상자로 간다.
  이미 처리하던 부품(SearchableDropdown, RichSelect, LanguageSelector, FileTreePicker, Select, 업로더, 갤러리)은 대상이 아니다.

# axis 의미:
#   component — 포커스를 돌려주는 부품.
axes:
  component: [permission_scope, multilingual_tag, tag_select, dropdown, icon_select, dropdown_button, column_selector]

effects:
  - focus_returns_after_select_or_remove   # 고르거나 닫거나 지운 직후 포커스가 알맞은 자리에 있다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/__tests__/focusReturnAfterSelect.test.tsx
