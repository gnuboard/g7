feature: sirsoft-admin_basic 화면 이동 링크 (#757 링크 단계)

description: |
  관리자 화면의 메뉴·목록 행 메뉴·탭·페이지 번호·바로가기 단추가 클릭으로만 이동해 가운데 클릭·Ctrl+클릭·우클릭
  「새 탭에서 열기」가 되지 않았다(G7 은 SPA 라 렌더 시점에 주소가 없음). 이동 자리를 `<a href>` 로 그리고 보통 클릭만
  지금처럼 SPA 로 옮긴다. 판정은 엔진 `G7Core.navigation.isPlainLeftClick`(W9), 목록 문맥 유지는 `mergeQueryIntoHref`(W8).
  레이아웃 잠금 시험은 click 이동 navigate 노드가 `<a href>` 인지, rowActions·탭·페이지 번호가 주소를 갖는지 잠근다.

