feature: 폼 자동 바인딩 아래 이름 있는 라디오 — 자동 바인딩을 끈다(번들 레이아웃 전체)

description: |
  이슈 #17 — 폼(dataKey) 안의 이름 있는 라디오는 엔진이 `{dataKey}.{name}` 상태에 자동으로 묶는다. 상태값이 boolean 이
  아니면 value 를 지금 상태값으로 덮어 같은 이름의 라디오가 모두 같은 value 를 갖고, 바꿀 때 옛 값이 다시 써질 수 있다.
  value 가 없는 라디오는 브라우저 기본값 "on" 을 폼 상태에 흘린다. 라디오는 checked 식과 change 액션으로 직접 다루므로
  자동 바인딩을 끈다. 손으로 고른 화면 목록(회원·상품·쿠폰·배송지 필터, 본인인증 설정)에서 빠진 게시판 설정(날짜 표시
  형식·일괄 적용)·상품 옵션(기본 옵션)·쇼핑몰 마일리지 통화 규칙(최대 사용 방식)까지, 저장소의 모든 번들 레이아웃을
  partial 포함으로 따라가며 확인한다.

axes:
  case: [named_radio_under_form]

effects:
  - named_radio_under_form_disables_auto_binding

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/named-radio-autobinding-guard.test.ts

validation:
  browser_check: 게시판 설정 > 일반 탭에서 날짜 표시 형식 라디오를 직접 눌러 바꾸고 저장 → 다시 열면 고른 값, 쇼핑몰 설정 > 마일리지에서 통화 규칙의 최대 사용 방식을 「정액」으로 바꿔 저장 → 유지
