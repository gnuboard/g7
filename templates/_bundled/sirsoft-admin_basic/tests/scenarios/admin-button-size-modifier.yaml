feature: 관리자 작은 단추 — 크기 변형 클래스가 기본 단추 여백을 이긴다

description: |
  `.btn-sm` 은 `.btn` 의 여백(px-4 py-2)을 px-3 py-1.5 로 줄이는 크기 변형이다. 두 클래스는 같은 `@layer components` 에
  있고 명시도도 같아 원문 순서가 승패를 정한다. 크기 변형이 기본보다 앞에 선언되면 `class="btn btn-sm"` 에서 기본 여백이
  이겨 작은 단추가 늘 기본 크기로 그려진다. 확장 화면 CSS(`g7-extension.generated.css`)는 이 템플릿 빌드 산출을 복사하므로
  `{ns}-btn-sm` 도 같은 순서를 물려받는다.

  적용 지점:
    - `templates/_bundled/sirsoft-admin_basic/src/styles/semantic.css` 의 `.btn-sm` 선언 위치(`.btn` 바로 뒤).
    - 번들 확장의 resources/css/g7-extension.generated.css(변환기로 다시 만든 복사본).

# axis 의미:
#   bundle — 크기 변형 순서를 재는 빌드 CSS 의 주인. 모집단은 시험이 빌드 산출에서 파생한다.
axes:
  bundle: [admin_template, extension]

effects:
  - size_modifier_overrides_base_padding   # 함께 쓰는 크기 변형이 같은 층 기본 클래스보다 뒤에 선언돼 여백을 이긴다

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/__tests__/styles/sizeModifierOrder.test.ts
  - scripts/extension-css/__tests__/size-modifier-order.test.mjs

validation:
  browser_check: Chrome MCP
  note: |
    빌드 CSS 순서는 Vitest 가 잰다. 실제 단추 여백(좌우 12px, 위아래 6px)은 작은 단추를 쓰는 대표 화면을 브라우저로 잰다.
