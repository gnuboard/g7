# 시나리오 매니페스트 — 관리자 첫 화면(/admin)이 볼 수 있는 화면으로 보낸다
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: admin_home_landing

description: >-
  `/admin` 은 라우트 redirect 로 `/admin/dashboard` 에 고정돼 있었다. 로그인이 끝나는 네 갈래(자격증명·2단계 인증·비밀번호 변경·
  로그인 인계)는 복귀 주소가 없으면 `/admin` 으로 오므로, 대시보드 권한(core.dashboard.read)이 없는 관리자(확장이 준 역할만 가진
  SSO 운영자·이커머스 관리자 등)는 로그인 직후 대시보드 레이아웃 403 → 왼쪽 메뉴·머리 없는 「페이지 로딩 실패」 전체 화면에 갇혔다.
  이제 `/admin` 은 `_admin_base` 를 상속한 첫 화면 레이아웃(admin_home, 레이아웃 권한 없음)을 그리고, 대시보드 권한이 있으면 대시보드,
  없으면 사이드바 메뉴(서버가 역할로 거른 목록)의 첫 관리자 화면으로 보낸다. 주소 없는 상위 메뉴·대시보드 메뉴·`/admin` 자신은
  건너뛴다. 열 화면이 하나도 없으면 메뉴·머리가 있는 화면에 「접근 가능한 메뉴가 없습니다」 안내를 둔다. 메뉴를 다 받기 전에는
  이동도 안내도 하지 않는다. 이동(mount)은 조건 노드 안쪽 노드에 둔다 — 엔진은 if 가 거짓인 노드의 렌더러도 만들고 그때 mount 를
  실행하므로, 조건 노드 자신에 걸면 데이터 도착 전 빈 갈 곳으로 한 번 실행되고 끝난다(브라우저 실측에서 드러난 결함).

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-home-landing.test.tsx
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-home-landing-engine.test.tsx
  - templates/_bundled/sirsoft-admin_basic/tests/Playwright/specs/admin/admin-home-landing.spec.ts

axes:
  role: [dashboard_reader, extension_role_only, no_menu]   # 대시보드 권한 보유 / 확장 역할만(메뉴 있음) / 열 화면 없음

effects:
  - admin_root_renders_home_layout        # /admin 라우트가 admin_home 을 그리고 redirect 고정이 없다, admin_home 은 _admin_base 상속·권한 없음
  - dashboard_reader_goes_to_dashboard    # 대시보드 권한 보유 → /admin/dashboard
  - no_dashboard_goes_to_first_menu       # 대시보드 권한 없음 → 메뉴 첫 관리자 화면(대시보드 메뉴·주소 없는 상위 건너뜀)
  - no_menu_shows_notice_in_shell         # 열 화면 없음 → 이동 없이 안내, 메뉴 못 받음 → 이동·안내 없음

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: SSO 운영자 계정으로 /admin/login 로그인 → /admin/plugins/sirsoft-sso/accounts, 왼쪽 메뉴 「SSO 연동 › 회원 연결·이력」
