# audit:allow test-scenario-coverage[cross_product] reason: |
#   화면이 다섯(보안 탭 카드·직권 실행 창·회원 폼·역할 폼·회원 상세)이라 축이 화면마다 다르다. 명목상 곱을 케이스로 나누지 않고
#   effects 단위로 잠근다. 서버 판정(적용 범위·우선순위·409)은 코어 PHPUnit(PasswordExpiry*·AdminSelfPasswordChangeTest)이,
#   화면 흐름 실측은 Playwright spec 이 맡는다.

feature: 관리자 화면의 비밀번호 정책·만료 칸 (sirsoft-admin_basic, #736)

description: |
  환경설정 > 보안의 「비밀번호 정책」·「비밀번호 만료」 카드(대상 행·지금 실행 창 포함), 회원 등록·수정의 본인 현재 비밀번호·
  다른 회원 안내·만료 개별 설정, 역할 폼의 만료 설정, 회원 상세의 비밀번호 구획.

  핵심 동작:
    - 체크박스는 자동 바인딩을 끄고 change 로 직접 담는다(저장값이 boolean 이 아니면 빈 문자열로 굳는다).
    - 조건부 칸은 자기 토글이 켜졌을 때만, 느슨한 참 판정으로 보인다.
    - 대상 행은 만료가 꺼져 있어도 보이고 「대상 보기」는 명단 권한만 본다. 「지금 실행」은 저장 안 한 변경·처리 중·저장된 만료 꺼짐이면 잠긴다.
    - 본인 비밀번호 변경은 현재 비밀번호를 묻고, 다른 회원에게 정해 준 비밀번호는 다음 로그인 때 바꿔야 한다고 안내한다.
    - 상세의 비밀번호 구획과 수정 화면의 구획이 같은 자리·같은 순서다(#599).
    - 수정 화면끼리 SPA 로 옮기면 직전 회원에 입력하다 만 비밀번호·확인·현재 비밀번호를 비운다(#736 S2 실측).

axes:
