feature: 관리자 템플릿 컴포넌트의 썸네일 규격 적용 — Img·상품 카드·갤러리·본문·업로더

description: |
  관리자 화면의 작은 이미지 자리가 원본을 그대로 받던 것을 막는다. 판정은 코어 `G7Core.thumbnail`(같은 출처 + 등록된
  서빙 경로) 한 곳이고, 컴포넌트 시험은 실제 코어 구현(`@core/support/thumbnailUrl`)을 G7Core 에 꽂아 컴포넌트가 그 판정을
  거치는지 본다.
  - Img: `thumbPreset` 으로 src·srcset 을 만들고 prop 은 DOM 에 내리지 않는다. loading 기본 lazy, decoding 기본 async.
    코어 API 가 없는 구버전 코어에서는 원 주소 그대로.
  - 관리자 상품 카드 이미지(가로 꽉 참 × 높이 256px)는 md. 갤러리 라이트박스 썸네일 줄(120×80 칸)은 sm, 메인 슬라이드는 원본.
  - HtmlContent 본문 이미지는 서빙 경로만 본문 규격 + lazy, srcset·sizes 는 img width(정수) 이하 후보만(모르면 없음), 저장 HTML 은 그대로.
    정화 결과는 비활성 문서의 DOM 조각으로 받아 고친 뒤 한 번만 직렬화하고, 재렌더에 본문 DOM 을 다시 만들지 않는다.
    작성자 확대 표식은 지우고, Enter 자동 반복은 무시하며, 확대 보기를 닫으면 누른 이미지로 초점이 돌아간다. 링크 밖 이미지는 원본 확대 보기.
  - FileUploader 기존 첨부 미리보기는 서빙 경로면 sm 썸네일 img 로 바로 그리고 원본을 받지 않는다. 확대 보기는 업로더가 받아 둔
    인증 blob(썸네일이 실패한 칸은 업로더가 대신 받는다) → 미리보기 주소 순이고, 둘 다 없으면 열 때 인증 요청으로 받는다.
  헤더 사진·로고 자리는 `admin-base-avatar-logo-thumbnail.yaml` 이 따로 본다.

