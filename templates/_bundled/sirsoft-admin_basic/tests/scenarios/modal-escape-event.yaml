feature: 관리자 창 Esc 닫기

description: |
  Esc 로 창을 닫을 때 닫기 처리기에 keydown 이벤트를 넘기는지
  
  관리자 화면의 창(레이아웃 `<modal>`)은 닫기 처리기로 템플릿 엔진의 액션 처리기를 받는다. 엔진 처리기는
  이벤트를 받는다고 보고 첫 줄에서 `event.type` 을 읽는데, Esc 경로만 `onClose()` 를 빈 인자로 불러
  `TypeError: Cannot read properties of undefined (reading 'type')` 가 나고 창이 닫히지 않았다
  (이커머스 전수 실측 S5, 2026-10-07 — 클레임 목록 「프리셋 관리」 창에서 Esc 무반응, X 로는 닫힘).
  닫기(X)·바깥 클릭처럼 Esc 도 원본 이벤트를 넘겨야 한다.

  수정 이력: 이커머스 전수 실측 S5-D25 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03]
  # c01: Modal — onClose 가 keydown 이벤트를 받는다
  # c02: Modal — closeOnEscape=false 면 부르지 않는다
  # c03: ConfirmModal — onClose 가 keydown 이벤트를 받는다

effects:
  - escape_close_passes_event

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/ModalEscapeEvent.test.tsx
