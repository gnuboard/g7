# audit:allow test-scenario-coverage[cross_product] reason: 화면(회원 상세·앱 키 재생성 창·자기 정보 수정) × 비밀번호 유무 × 로케일 중 로케일 축은 lang 키
# 검사에만 의미가 있다. 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 비밀번호 없는 회원 — 관리자 화면 (sirsoft-admin_basic 1.2.0)

description: |
  #40 소셜 로그인의 템플릿 선행분.
    - 회원 상세 기본 정보 「비밀번호」 배지(설정됨·미설정), 비밀번호가 없으면 비밀번호 정보 영역은 「해당 없음」 안내(A1).
    - 비밀번호 없는 관리자는 앱 키 재생성 창·자기 정보 수정(비밀번호 처음 설정)에서 이메일 인증번호로 확인하고 받은 토큰을
      `verification_token` 으로 싣는다(K9).

axes:
  surface: [user_detail, app_key_modal, admin_self_update]
  has_password: [true, false]
  locale: [ko, en]

effects:
  - password_state_badge_two_states
  - password_section_not_applicable_for_passwordless
  - app_key_modal_uses_email_code_for_passwordless
  - app_key_modal_title_follows_password_presence
  - self_update_uses_email_code_for_passwordless
  - passwordless_admin_lang_keys_present

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-passwordless-member.test.ts
