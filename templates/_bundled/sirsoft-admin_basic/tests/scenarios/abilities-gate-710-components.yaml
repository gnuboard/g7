# audit:allow test-scenario-coverage[cross_product] reason: 컴포넌트 disabled·권한 계약 회귀 묶음. 컴포넌트마다 독립 축(비활성 여부)이라 곱 대신 컴포넌트별 잠김 경로를 단언한다.

feature: 관리자 템플릿 컴포넌트의 disabled·권한 계약 (7.1.0 abilities 게이트)

description: |
  레이아웃의 읽기 전용 게이트는 입력 컴포넌트에 `disabled` 를 넘긴다. 컴포넌트가 그 값을 무시하면
  권한 없는 운영자에게 편집·추가·삭제가 살아 있다. 이 묶음은 컴포넌트가 `disabled`(또는 권한 prop)를
  받으면 쓰기 동작을 막는지를 잠근다.

  - G09 HtmlEditor · G11 DynamicFieldList · ChipCheckbox · FileUploader ★ — disabled 를 readOnly 와 같이 다룬다
  - SortableMenuItem — 끌기를 끈 읽기 전용에서도 펼침 버튼
  - TabNavigationScroll — 탭 목록의 null 항목 무시(N8)
  - ActionMenu — 잠긴 항목 안내(disabledReason), 해석되지 않은 disabledField 는 잠금
  - NotificationCenter — canUpdate·canDelete(G21)

axes:
  component: [HtmlEditor, ChipCheckbox, DynamicFieldList, SortableThumbnailItem, SortableMenuItem, TabNavigationScroll, ActionMenu, NotificationCenter]
  state: [disabled, enabled]

effects:
  - html_editor_disabled_blocks_editing
  - chip_checkbox_disabled_blocks_toggle
  - dynamic_field_list_disabled_blocks_add_remove
  - thumbnail_primary_button_disabled
  - sortable_menu_item_expands_without_drag
  - tab_navigation_scroll_ignores_null_tabs
  - action_menu_disabled_item_shows_reason
  - action_menu_enabled_item_hides_reason
  - action_menu_unresolved_disabled_field_fails_closed
  - notification_center_hides_write_actions_without_permission
  - notification_center_skips_read_batch_without_update_permission
  - notification_center_shows_write_actions_with_permission

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/ComponentDisabledContract.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/ActionMenu.disabledReason.test.tsx
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/NotificationCenter.abilities.test.tsx
