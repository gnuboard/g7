feature: 환경설정 — 탭별 데이터소스 격리(본인인증 정책 · 언어팩)

description: |
  환경설정의 policies(본인인증 탭)와 language_packs(언어팩 탭) 데이터소스가 활성 탭에서만 선택되는지 잰다.
  두 데이터소스가 함께 선택되면 한쪽의 scope 파라미터가 다른 쪽 요청으로 새어 목록이 잘못 걸러진다. 탭 전환 직후 낡은 _global 값이 남아도 query.tab 이 이긴다.

# axis 의미:
#   tab — 판정 대상 탭(identity · language_packs · general).
axes:
  tab: [identity, language_packs, general]

effects:
  - settings_tab_selects_only_its_datasource   # 활성 탭은 자기 데이터소스만 고른다
  - settings_tab_datasources_never_coselected   # 어느 탭에서도 두 데이터소스가 함께 선택되지 않는다
  - settings_tab_switch_ignores_stale_global   # 탭 전환 직후 낡은 _global 값이 있어도 query.tab 기준으로 고른다
  - settings_general_tab_skips_both_datasources   # 일반 탭은 두 데이터소스를 모두 뺀다
  - settings_tab_datasource_declares_active_tab_if   # 두 데이터소스 정의에 활성 탭 if 가 있다

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-settings-language-pack-scope-leak.test.tsx
