feature: 탭형 다국어 입력 — 비어 있는 필수 언어가 막히면 그 탭을 열어 칸을 보여 준다

description: |
  이슈 #17 — 탭형 다국어 입력의 숨은 필수 칸에서 저장이 조용히 멈추던 결함을 입력 컴포넌트에서 한 번에 고친다. `layout="tabs"` 는
  지금 탭이 아닌 언어 칸을 hidden 으로 숨긴다. 필수(사이트 기본 언어) 칸이 빈 채 다른 언어 탭에서 저장하면 브라우저 검증이
  숨은 칸에서 「not focusable」로 멈춰 요청 0·안내 0 이 된다(스케줄 편집 창에서 처음 확인). 서버 검증 오류도 숨은 탭 아래 문구로 가려진다.
  탭형+필수 다국어 칸을 쓰는 9개 화면(역할·메뉴·게시판 2·이커머스 4·페이지)이 같은 결함군이라 컴포넌트에서 한 번에 고친다.

axes:
  case: [browser_invalid_on_hidden_tab, server_error_on_other_tab, server_error_required_filled, compact_server_error, layout_error_wired]

effects:
  - required_locale_tab_opens_on_invalid
  - required_locale_tab_opens_on_error

test_files:
  - templates/_bundled/sirsoft-admin_basic/src/components/composite/__tests__/MultilingualRequiredTabReveal.test.tsx
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/multilingual-required-error-wired.test.ts
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/multilingual-required-error-wired.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/multilingual-required-error-wired.test.ts

validation:
  browser_check: 역할 편집에서 이름 한국어 칸을 비우고 English 탭을 연 채 저장 → 한국어 탭이 열리고 그 칸에 검증 안내가 뜬다
