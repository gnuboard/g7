feature: 본인인증 공통 모달 구조 계약

description: |
  본인인증 공통 모달 레이아웃이 지켜야 하는 구조 계약 — 모달 구성, 확인·취소·재전송 액션, 입력 상태 표기.
  
  이 시험들은 시나리오 연결 규칙이 생기기 전에 쓰였다. 재전송 대기를 서버의 재요청 제한(60초)에 맞추며
  기대값 한 줄을 고칠 때 기존 케이스를 시험 하나 = 시나리오 하나로 연결했다(2026-11-11). 각 case 는 아래 주석의
  시험 이름과 짝이다. 취소 흐름의 서버 연동 케이스는 `tests/scenarios/idv-permission-guard.yaml` 이 소유한다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19]
  # c01: id 가 identity-challenge-modal
  # c02: Modal composite 컴포넌트
  # c03: admin namespace i18n 키 사용 (admin.identity.challenge.*)
  # c04: 자동 닫기 차단 (verify 또는 명시 cancel 만)
  # c05: provider 슬롯 1개만 존재 (외부 plugin append 전용)
  # c06: 코어 OTP UI 는 슬롯이 아닌 인라인 Div 로 정의되어 mail/null provider 시 노출
  # c07: verify 엔드포인트 호출 존재
  # c08: verify onSuccess 안에 resolveIdentityChallenge(verified, token)
  # c09: verify onSuccess 가 closeModal 도 호출
  # c10: cancelled 통보 액션이 존재
  # c11: 모든 setState 가 target=global
  # c12: setState 키들이 identityChallenge.* 사용
  # c13: 재전송 sequence 의 첫 setState 가 identityChallenge.code 를 즉시 빈 문자열로 초기화
  # c14: code Input 이 비표준 events 래퍼를 사용하지 않는다
  # c15: code Input 의 onChange 가 actions: [{event:"onChange", setState global}] 패턴
  # c16: _admin_base.json modals 배열에 _identity_challenge_modal 포함
  # c17: routes.json 에 */admin/identity/challenge 라우트 등록
  # c18: verify onSuccess 가 resolveIdentityChallenge { verified } 호출
  # c19: extends 가 _admin_base 로 설정되어 admin 컨텍스트 일관

effects:
  - admin_identity_challenge_modal_contract

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/identity-challenge-modal.test.tsx
