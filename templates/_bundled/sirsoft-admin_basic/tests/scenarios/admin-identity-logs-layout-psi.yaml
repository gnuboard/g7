feature: 관리자 본인인증 이력 화면 레이아웃 계약 (4)

description: |
  본인인증 이력(`/admin/identity/logs`) 화면이 알림 발송 이력과 같은 수준의 검색, 필터, 표,
  상세 모달, 파기 확인 모달을 갖추는지를 레이아웃 JSON 구조로 잰다.

  회귀 사례:
    - 검색 입력이 사용자 ID 와 대상 해시 모두로 동작하지 않았고(백엔드는 AdminIdentityLogIndexTest),
      화면 구성(탭, 필터, 표, 반응형)이 알림 발송 이력과 달랐다. 파기 버튼이 등록되지 않은 confirm
      핸들러를 불러 동작하지 않았다.
    - 채널이 'email', 'ipin' 같은 식별자 그대로 보였다(필터, 표 컬럼, 상세 모달 세 곳). 상세 모달의
      인증 수단만 provider_id 원문을 보였다. 배열 필터를 `query.statuses` 로 읽어 항상 undefined 라
      상태, 목적, 채널, 발생 유형 필터가 전부 적용되지 않았다(`DataSourceManager` 는 `query['statuses[]']` 로 푼다).
    - 4: 인증수단 탭을 바꾸면 URL 은 필터 없이 바뀌는데 `_local.filter` 가 남아 체크박스와 목록이 어긋났다.
  모달 바닥 단추가 Modal 고정 하단(`props.footer`)으로 옮겨 가 시험의 노드 수집도 그 자리를 본다.

axes:
  # 계약이 걸린 레이아웃 조각. 조각마다 재는 대상이 달라 곱하지 않고 effect 로 고정한다.
  surface: [data_source, named_action, provider_tab, filter, datagrid, main_layout, detail_modal, purge_modal, forbidden_pattern]

effects:
  # 데이터소스
  - logs_datasource_passes_search_and_sort_params              # identityLogs 가 search, search_type, sort_by, sort_order 를 실어 보낸다
  - logs_datasource_progressive_with_403_error_page            # progressive 로딩, 403 은 showErrorPage
  - logs_datasource_fallback_has_data_pagination_abilities     # fallback 이 {data, pagination, abilities} 모양이다
  - datasource_reads_array_filters_with_bracket_keys           # 배열 필터 4종을 query['key[]'] 로 읽고 대괄호 없는 접근이 없다
  # 검색 액션
  - search_action_targets_datagrid_body_overlay                # searchIdentityLogs 가 표 본문을 부분 로딩 대상으로 쓴다
  - filter_search_triggers_reference_search_action             # 검색 입력 엔터와 검색 버튼이 actionRef 로 같은 액션을 부른다
  # 인증수단 탭
  - provider_tabs_concat_all_tab_with_providers                # 전체 탭에 identityProviders.data 를 이어 붙인 tabs 표현식
  - tab_change_is_sequence_handler                             # onTabChange 가 단계 2개 이상의 sequence 다
  - tab_change_resets_all_local_filter_fields                  # 첫 단계가 _local.filter 11개 필드를 기본값으로 비운다
  - tab_change_navigates_with_provider_id_replace_and_overlay  # 마지막 단계가 provider_id 로 replace 이동하고 부분 로딩 대상을 유지한다
  - tab_change_reset_precedes_navigate                         # 비우기가 이동보다 먼저 돈다
  # 필터
  - filter_search_type_offers_auto_user_target_hash            # 검색 유형 select 가 auto, user_id, target_hash 를 낸다
  - filter_status_checkboxes_iterate_seven_statuses            # 상태 체크박스가 상태 7개를 순서대로 돈다
  - filter_purpose_checkboxes_iterate_identity_purposes        # 목적 체크박스가 identityPurposes 를 돈다
  - filter_buttons_full_width_on_portable                      # 검색과 초기화 버튼이 portable 에서 flex-1 이다
  - filter_channel_labels_translated_via_channel_labels        # 채널 체크박스 라벨이 channel_labels 로 바뀌고 없으면 ch 로 떨어진다
  # 표
  - datagrid_composite_with_server_pagination                  # composite DataGrid, serverSidePagination
  - datagrid_not_selectable_without_row_actions                # 감사 로그라 선택과 행 액션이 없다
  - datagrid_rows_expand_inline_detail                         # 행을 펼쳐 target_hash, origin_type, properties, metadata 를 본다
  - datagrid_binds_logs_data_and_pagination                    # identityLogs?.data?.data 와 pagination 경로로 묶인다
  - datagrid_page_change_uses_body_overlay                     # 쪽 이동이 표 본문만 부분 로딩한다
  - datagrid_shows_eight_columns_in_order                      # 컬럼 8개가 정해진 순서다
  - datagrid_channel_column_translated_via_channel_labels      # 채널 컬럼이 channel_labels 로 바뀌고 없으면 '-' 다
  # 화면 본체
  - sort_select_offers_created_and_attempts_orders             # 정렬 select 가 created_at_desc, created_at_asc, attempts_desc 를 낸다
  - per_page_select_offers_10_20_50_100                        # 쪽당 건수 select 가 10, 20, 50, 100 이다
  - refresh_button_refetches_logs                              # 새로고침이 identityLogs 를 다시 읽는다
  - purge_button_gated_by_can_purge                            # 파기 버튼이 abilities.can_purge 일 때만 보인다
  - main_layout_references_filter_datagrid_detail_partials     # 필터, 표, 상세 모달 partial 을 모두 참조한다
  - init_actions_restore_array_filters_with_bracket_keys       # 진입 시 필터 복원이 배열 필터를 query['key[]'] 로 되살린다
  - layout_has_no_bracketless_array_filter_access              # 화면 어디에도 query.statuses 같은 대괄호 없는 접근이 없다
  - init_actions_array_filter_restore_falls_back_to_empty_array # 복원 표현식이 배열, 단일값, 부재를 각각 배열로 받고 부재는 [] 다
  # 상세 모달
  - detail_modal_is_composite_modal                            # composite Modal, id identity_log_detail_modal
  - detail_button_stores_row_in_global_namespace               # 상세 버튼이 row 를 _global.identity_log_modal_data 에 둔다 (_local.selected 잔재 없음)
  - detail_modal_reads_fields_from_global_namespace            # 모달 본문이 핵심 필드 9개를 그 _global 값에서 읽는다
  - detail_modal_channel_translated_via_channel_labels         # 채널 필드가 channel_labels 로 바뀐다
  - detail_modal_provider_shown_as_provider_label              # 인증 수단 필드가 identityProviders 의 label 로 바뀐다
  # 파기 확인 모달
  - purge_button_opens_modal_without_confirm_handler           # 파기 버튼이 confirm 없이 openModal 로 확인 모달을 연다
  - main_layout_references_purge_modal_partial                 # 화면이 파기 확인 모달 partial 을 참조한다
  - purge_modal_calls_purge_api_with_progress_flag_and_refetch # 확인 모달이 파기 API 를 부르고 진행 값과 목록 재조회를 쓴다
  - purge_modal_shows_spinner_and_locks_buttons_while_purging  # 진행 중 스피너가 보이고 취소, 파기 두 버튼이 잠긴다
  # 금지 패턴
  - no_tailwind_device_breakpoint_split                        # hidden md:block, md:hidden 같은 기기 분기 클래스를 쓰지 않는다
  - no_basic_table_markup                                      # basic Table 을 직접 쓰지 않는다

test_files:
  - templates/_bundled/sirsoft-admin_basic/__tests__/layouts/admin-identity-logs.test.tsx

validation:
  audit_rule: test-scenario-coverage
