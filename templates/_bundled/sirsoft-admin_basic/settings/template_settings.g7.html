<!-- sirsoft-admin_basic 템플릿 설정 화면 (#434 D28·D29). 이 템플릿이 공급한다 — 코어가 켜진 관리자 템플릿마다 `sirsoft-admin_basic.template_settings` 로
     교차 등록하고 `/admin/templates/sirsoft-admin_basic/settings` 라우트를 만든다. 켜진 관리자 템플릿은 `layouts/overrides/sirsoft-admin_basic/template_settings.g7.html`
     로 이 화면을, 부품 `overrides`(target `sirsoft-admin_basic`)로 화면 부품을 덮어쓸 수 있다.
     화면은 이 템플릿 설정 묶음 부품(`sirsoft-admin_basic.TemplateSettingsScreen`) 하나가 그린다 — 관리자 템플릿 부품(모달·토스트·탭 줄)에 기대지 않아
     부품이 다섯 개뿐인 관리자 템플릿에서도 뜬다. 받기·저장·되돌리기·주소 바꾸기는 이 레이아웃이 하고, 저장은 지금 탭 섹션만 보낸다(서버는 보낸 섹션만 합친다).
     e2e:allow 템플릿 설정 화면 — tests/Playwright/specs/admin/template-settings-favicon.spec.ts + Playwright MCP 실측(이력 문서 매트릭스) -->
<layout name="template_settings" version="1.0.0" extends="_admin_base">
  <meta leave_guard="{{_local.hasChanges === true}}" title="$t:core.template_settings.page_title_short"/>
  <!-- 현재 설정값. 화면에 들어올 때마다 다시 받아 응답의 settings 를 폼 값(_local.form)으로 넣는다 -->
  <data-source id="template_settings" label_key="$t:core.template_settings.page_title_short" type="api" endpoint="/api/admin/templates/{{route.identifier}}/settings" method="GET" :auto_fetch="true" :auth_required="true" :refetchOnMount="true">
    <init-local>
      <field name="form" value="{{data?.settings ?? null}}"/>
    </init-local>
    <error-handling>
      <default>
        <!-- 받기 실패(권한·없음 외) — 빈 폼으로 저장되지 않게 본문 오류 화면. 다시 받기 실패는 받아 둔 값을 두고 알린다 -->
        <conditions>
          <when if="{{error.refetch}}">
            <set-state target="local" saveStatus="{{ { type: 'error', message: error.message ?? null } }}"/>
          </when>
          <else>
            <show-error-page errorCode="{{error.status}}" target="content"/>
          </else>
        </conditions>
      </default>
    </error-handling>
  </data-source>
  <computed name="isReadOnly">{{template_settings?.data?.abilities?.can_update !== true}}</computed>
  <computed name="activeSection">{{(template_settings?.data?.sections ?? []).some(s => s.key === _local.activeTab) ? _local.activeTab : (template_settings?.data?.sections?.[0]?.key ?? null)}}</computed>
  <permissions>
    <permission>core.templates.read</permission>
  </permissions>
  <init>
    <set-state target="local" activeTab="{{query.tab ?? null}}"/>
  </init>
  <slot name="content">
    <div data-ref="template_settings_content">
      <sirsoft-admin_basic.template-settings-screen data-type="composite" data-ref="template_settings_screen" data="{{template_settings?.data ?? null}}" value="{{_local.form ?? {}}}" errors="{{_local.errors ?? {}}}" activeSection="{{_computed.activeSection}}" readOnly="{{_computed.isReadOnly}}" dirty="{{_local.hasChanges === true}}" saving="{{_local.isSaving === true}}" resetting="{{_local.isResetting === true}}" status="{{_local.saveStatus ?? null}}" uploadTriggerEvent="upload:template_settings">
        <on type="change" event="onChange">
          <!-- 칸 값이 바뀌었다 — 폼 값을 갈아 끼우고 변경 표시를 켜며, 지난 저장 결과 안내는 걷는다 -->
          <set-state target="local" :hasChanges="true" form="{{$args[0]}}" :saveStatus="null"/>
        </on>
        <on type="custom" event="onDirty">
          <!-- 파일만 고른 상태 — 올리기는 저장 때 — 저장 버튼만 풀어 준다 -->
          <set-state target="local" :hasChanges="true"/>
        </on>
        <on type="custom" event="onTabChange">
          <!-- 섹션 옮기기. 저장하지 않은 변경을 버리고 옮겼으면(부품이 확인 창을 거쳤다) 설정을 다시 받아 폼을 저장된 값으로 돌린다 -->
          <sequence>
            <set-state target="local" activeTab="{{$args[0]}}" :errors="null" :saveStatus="null"/>
            <replace-url path="/admin/templates/{{route.identifier}}/settings">
              <query tab="{{$args[0]}}"/>
            </replace-url>
            <conditions>
              <when if="{{$args[1] === true}}">
                <sequence>
                  <set-state target="local" :hasChanges="false"/>
                  <refetch-data-source dataSourceId="template_settings"/>
                </sequence>
              </when>
            </conditions>
          </sequence>
        </on>
        <on type="custom" event="onSave">
          <!-- 설정 저장 — 먼저 고른 파일을 올리라는 신호를 보내고(칸마다 업로더가 받아 올린 뒤 폼 값을 바꾼다, 신호는 업로더 전부를 기다린다)
               지금 탭 섹션의 폼 값만 보낸다. 성공하면 설정을 다시 받아 서버가 정규화한 값으로 화면을 맞춘다 -->
          <sequence>
            <emit-event event="upload:template_settings"/>
            <set-state target="local" :isSaving="true" :errors="null" :saveStatus="null"/>
            <api-call :auth_required="true" target="/api/admin/templates/{{route.identifier}}/settings" method="PUT" body="{{Object.fromEntries([[_computed.activeSection, (_local.form ?? {})[_computed.activeSection] ?? {}]])}}">
              <success>
                <set-state target="local" :isSaving="false" :hasChanges="false" saveStatus="{{ { type: 'success', message: null } }}"/>
                <toast type="success" message="$t:core.template_settings.saved"/>
                <refetch-data-source dataSourceId="template_settings"/>
              </success>
              <fail>
                <set-state target="local" :isSaving="false" errors="{{error.errors}}" saveStatus="{{ { type: 'error', message: error.message ?? null } }}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <on type="custom" event="onReset">
          <!-- 기본값으로 되돌리기(부품이 확인 창을 거쳤다) — 올린 파일도 지워진다. 되돌리면 설정을 다시 받아 폼을 기본값으로 맞춘다 -->
          <sequence>
            <set-state target="local" :isResetting="true" :saveStatus="null"/>
            <api-call :auth_required="true" target="/api/admin/templates/{{route.identifier}}/settings/reset" method="POST">
              <success>
                <set-state target="local" :isResetting="false" :hasChanges="false" :errors="null" saveStatus="{{ { type: 'success', action: 'reset' } }}"/>
                <refetch-data-source dataSourceId="template_settings"/>
              </success>
              <fail>
                <set-state target="local" :isResetting="false" saveStatus="{{ { type: 'error', action: 'reset', message: error.message ?? null } }}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <on type="custom" event="onBack">
          <navigate path="/admin/templates"/>
        </on>
        <on type="custom" event="onUploadError">
          <!-- 업로드 실패 — 서버 문구(형식·크기·SVG 안전 검사)를 그대로 보인다 -->
          <set-state target="local" saveStatus="{{ { type: 'error', message: $args[0] } }}"/>
        </on>
      </sirsoft-admin_basic.template-settings-screen>
    </div>
  </slot>
</layout>
