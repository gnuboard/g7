<layout name="admin_role_list" version="1.0.0" extends="_admin_base">
  <meta title="$t:admin.roles.page_title" description="$t:admin.roles.page_description"/>
  <data-source id="roles" label_key="$t:editor.data_source.roles" type="api" endpoint="/api/admin/roles" method="GET" :auto_fetch="true" auth_mode="required">
    <params search="{{query.search}}" page="{{query.page ?? 1}}" :per_page="20"/>
    <error-handling>
      <on-code code="403">
        <show-error-page target="content"/>
      </on-code>
      <default>
        <show-error-page target="content"/>
      </default>
    </error-handling>
    <fallback>
      <field name="data" :value="[]"/>
    </fallback>
  </data-source>
  <init-local>
    <field name="searchQuery" value=""/>
  </init-local>
  <permissions>
    <permission>core.permissions.read</permission>
  </permissions>
  <transition-overlay>
    <wait-for>roles</wait-for>
  </transition-overlay>
  <init>
    <set-state target="global">
      <field name="_local">
        <field name="searchQuery" value="{{query.search || ''}}"/>
      </field>
    </set-state>
  </init>
  <slot name="content">
    <div data-ref="role_list_content" class="admin-page-content">
      <responsive on="portable" class="admin-page-content-compact"/>
      <page-header data-ref="page_header" title="$t:admin.roles.title" description="$t:admin.roles.description">
        <button data-ref="refresh_button" class="btn-icon" aria-label="$t:admin.roles.refresh">
          <on type="click">
            <refetch-data-source dataSourceId="roles"/>
          </on>
          <icon data-ref="refresh_icon" name="refresh" size="md"/>
        </button>
        <button data-ref="add_role_button" disabled="{{roles?.data?.abilities?.can_create !== true}}" class="flex-center gap-2 px-4 h-10 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg hover:bg-gray-800 dark:hover:bg-gray-100 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <navigate path="/admin/roles/create"/>
          </on>
          <icon name="plus" size="md"/>
          <span>$t:admin.roles.add_role</span>
        </button>
      </page-header>
      <div data-ref="search_bar_wrapper" class="flex justify-end mb-6">
        <responsive on="portable" class="mb-6"/>
        <search-bar data-ref="search_bar" placeholder="$t:admin.roles.search_placeholder" value="{{_local.searchQuery || ''}}" class="w-64">
          <responsive on="portable" class="w-full"/>
          <on type="change">
            <set-state searchQuery="{{$event.target.value}}"/>
          </on>
          <on type="submit">
            <navigate path="/admin/roles" transition_overlay_target="roles_data_grid__body">
              <query search="{{_local.searchQuery || undefined}}" :page="1"/>
            </navigate>
          </on>
        </search-bar>
      </div>
      <data-grid data-ref="roles_data_grid" :data-blur-until-loaded="true" data="{{roles?.data?.data}}" :pagination="true" :serverSidePagination="true" serverCurrentPage="{{roles?.data?.pagination?.current_page ?? 1}}" serverTotalPages="{{roles?.data?.pagination?.last_page ?? 1}}" :pageSize="20" :alwaysShowPagination="true" idField="id" :responsiveBreakpoint="768" actionsColumnHeader="$t:common.actions">
        <column field="name" header="$t:admin.roles.columns.name" :sortable="false">
          <cell>
            <div class="flex-center gap-2">
              <span class="font-medium text-gray-900 dark:text-white">{{row.name}}</span>
              <div data-if="{{row.extension_type === 'core'}}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">
                <icon name="shield" size="sm"/>
                <span>$t:admin.roles.badges.core</span>
              </div>
              <div data-if="{{row.extension_type === 'module'}}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300">
                <icon name="cube" size="sm"/>
                <span>{{row.extension_name ?? '$t:admin.roles.badges.module'}}</span>
              </div>
              <div data-if="{{row.extension_type === 'plugin'}}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300">
                <icon name="plug" size="sm"/>
                <span>{{row.extension_name ?? '$t:admin.roles.badges.plugin'}}</span>
              </div>
            </div>
          </cell>
        </column>
        <column field="description" header="$t:admin.roles.columns.description" :sortable="false">
          <cell>
            <span class="text-gray-600 dark:text-gray-400 text-sm line-clamp-1">{{row.description ?? '-'}}</span>
          </cell>
        </column>
        <column field="users_count" header="$t:admin.roles.columns.users_count" :sortable="false">
          <cell>
            <div class="flex items-center gap-1 text-gray-600 dark:text-gray-400">
              <icon name="users" size="sm"/>
              <span>{{row.users_count ?? 0}}</span>
            </div>
          </cell>
        </column>
        <column field="is_active" header="$t:admin.roles.columns.status" :sortable="false">
          <cell>
            <toggle checked="{{row.is_active}}" disabled="{{row.abilities?.can_toggle_status !== true}}" size="sm">
              <on type="change">
                <api-call :auth_required="true" target="/api/admin/roles/{{row.id}}/toggle-status" method="PATCH">
                  <success>
                    <parallel>
                      <toast type="success" message="{{$event.target.checked ? '$t:admin.roles.activate_success' : '$t:admin.roles.deactivate_success'}}"/>
                      <refetch-data-source dataSourceId="roles"/>
                    </parallel>
                  </success>
                  <fail>
                    <toast type="error" message="$t:admin.roles.toggle_status_failed"/>
                  </fail>
                </api-call>
              </on>
            </toggle>
          </cell>
        </column>
        <column field="created_at" header="$t:admin.roles.columns.created_at" :sortable="false"/>
        <prop name="rowActions">
          <item id="edit" label="$t:common.edit" iconName="pencil" disabledField="abilities.can_update"/>
          <item id="clone" label="$t:admin.roles.actions.clone" iconName="copy" disabledField="abilities.can_create"/>
          <item id="delete" label="$t:common.delete" iconName="trash" variant="danger" disabledField="abilities.can_delete"/>
        </prop>
        <on type="change" event="onPageChange">
          <navigate path="/admin/roles" :replace="true" :mergeQuery="true" transition_overlay_target="roles_data_grid__body">
            <query page="{{$args[0]}}"/>
          </navigate>
        </on>
        <on type="action" event="onRowAction">
          <switch>
            <case when="edit">
              <navigate path="/admin/roles/{{$args[1].id}}/edit"/>
            </case>
            <case when="clone">
              <navigate path="/admin/roles/create">
                <query clone_from="{{$args[1].id}}"/>
              </navigate>
            </case>
            <case when="delete">
              <set-state target="global" deleteTargetId="{{$args[1].id}}" deleteTargetName="{{$args[1].name}}"/>
              <open-modal target="delete_confirm_modal"/>
            </case>
          </switch>
        </on>
      </data-grid>
    </div>
  </slot>
  <modal src="partials/admin_role_list/_modal_delete.json"/>
</layout>
