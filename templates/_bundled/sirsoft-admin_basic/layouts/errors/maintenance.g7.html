<layout name="errors/maintenance" version="1.0.0" extends="_admin_base">
  <meta title="$t:errors.maintenance.title" :is_error_layout="true" :error_code="503"/>
  <slot name="content">
    <div data-ref="maintenance_container" class="flex-center flex-col justify-center min-h-[60vh] text-center p-8">
      <icon name="gear" class="text-8xl text-blue-500 dark:text-blue-400 mb-6 animate-spin"/>
      <h1 class="text-primary text-3xl font-bold mb-4">$t:errors.maintenance.title</h1>
      <p class="text-secondary text-lg mb-2 max-w-md">$t:errors.maintenance.message</p>
      <p class="text-sm text-gray-500 dark:text-gray-500 max-w-md">$t:errors.maintenance.description</p>
    </div>
  </slot>
</layout>
