<!-- 로그인은 됐으나 그 화면에 대한 권한이 없을 때의 에러 화면.
  401 과 달리 되돌릴 수 있는 상태가 아니므로 재시도 안내 없이 대시보드로 나가는 길만 준다.
  권한 판정은 서버(permission 미들웨어)가 하고 이 레이아웃은 그 결과만 표시한다. -->
<layout name="errors/403" version="1.0.0" extends="_admin_base">
  <meta title="$t:errors.403.title" :is_error_layout="true" :error_code="403"/>
  <slot name="content">
    <div data-ref="error_container" class="flex-center flex-col justify-center min-h-[60vh] text-center p-8">
      <icon data-ref="error_icon" name="shield-halved" class="text-8xl text-red-400 dark:text-red-500 mb-6"/>
      <h1 data-ref="error_code" class="text-primary text-6xl font-bold mb-4">403</h1>
      <h2 data-ref="error_title" class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-2">$t:errors.403.title</h2>
      <p data-ref="error_message" class="text-gray-500 dark:text-gray-400 mb-8 max-w-md">$t:errors.403.message</p>
      <button data-ref="back_button" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
        <on type="click">
          <navigate path="/admin"/>
        </on>
        $t:errors.back_home
      </button>
    </div>
  </slot>
</layout>
