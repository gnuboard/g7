<!-- 라우트가 없거나 대상 자원이 사라졌을 때의 에러 화면.
  의존 확장이 없어 못 뜨는 경우는 여기가 아니라 `errors/503` 이 맡는다 — 그쪽만 미충족 의존
  목록을 화면에 싣는다. -->
<layout name="errors/404" version="1.0.0" extends="_admin_base">
  <meta title="$t:errors.404.title" :is_error_layout="true" :error_code="404"/>
  <slot name="content">
    <div data-ref="error_container" class="flex-center flex-col justify-center min-h-[60vh] text-center p-8">
      <icon data-ref="error_icon" name="file-circle-xmark" class="text-8xl text-gray-400 dark:text-gray-500 mb-6"/>
      <h1 data-ref="error_code" class="text-primary text-6xl font-bold mb-4">404</h1>
      <h2 data-ref="error_title" class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-2">$t:errors.404.title</h2>
      <p data-ref="error_message" class="text-gray-500 dark:text-gray-400 mb-8 max-w-md">$t:errors.404.message</p>
      <button data-ref="back_button" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
        <on type="click">
          <navigate path="/admin"/>
        </on>
        $t:errors.back_home
      </button>
    </div>
  </slot>
</layout>
