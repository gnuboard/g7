<!-- 메일 채널 끄기 확인 창(알림 설정 탭 [저장]). 메일 토글을 켜짐 → 꺼짐으로 바꾸고 저장할 때만 뜬다.

  7.1.0 부터 본인인증 메일(회원가입·비밀번호 찾기·정보 변경·관리자 2단계 인증)도 이 토글을 따른다. 메일을 끄면
  TOTP 를 등록하지 않은 관리자는 인증번호를 받지 못해 로그인할 수 없으므로, 끄기 전에 한 번 묻는다.
  - [취소] = 저장하지 않고 화면의 메일 토글을 켜짐으로 되돌린다(부모 화면 폼을 직접 고친다).
  - [끄기] = 창을 연 순간의 채널 목록으로 저장한다(창은 부모 화면 상태를 못 읽어 그 목록을 전역으로 받아 온다).
  사이트 내 알림 채널은 본인인증과 무관해 이 창을 띄우지 않는다. -->
<partial description="알림 설정 — 메일 채널 끄기 확인 모달 (본인인증 메일 중단 경고)" editor_label="$t:admin.modal_label.admin_settings.modal_notification_channel_off_confirm">
  <modal data-type="composite" data-ref="modal_notification_channel_off_confirm" title="$t:admin.settings.notification_definitions.channel_off_confirm.title" size="sm" :closeOnOverlayClick="false">
    <div class="alert-danger">
      <p class="text-error-soft">$t:admin.settings.notification_definitions.channel_off_confirm.message</p>
    </div>
    <div class="modal-footer-buttons">
      <button data-ref="channel_off_cancel_button" type="button" class="btn btn-secondary" disabled="{{_global.notification_channel_off_modal?.isSaving ?? false}}">
        <on type="click">
          <!-- 취소 — 저장을 멈추고 부모 화면의 메일 토글을 켜짐으로 되돌린다(다른 채널 변경은 그대로 둔다).
               부모 폼 커밋 규칙대로 두 자리에 같은 값을 쓴다 — 전역 쪽(저장이 읽는 자리)을 빼면 화면 토글은 켜졌는데
               다음 [저장] 이 꺼진 채로 보낸다. -->
          <sequence>
            <set-state target="global" _local.form.notifications.channels="{{(_global.notification_channel_off_modal?.channels ?? []).map(c =&gt; c.id === 'mail' ? Object.assign({}, c, {is_active: true}) : c)}}"/>
            <set-state target="$parent._local.form.notifications.channels" value="{{(_global.notification_channel_off_modal?.channels ?? []).map(c =&gt; c.id === 'mail' ? Object.assign({}, c, {is_active: true}) : c)}}"/>
            <set-state target="global" :notification_channel_off_modal="null"/>
            <close-modal target="modal_notification_channel_off_confirm"/>
          </sequence>
        </on>
        $t:admin.settings.notification_definitions.channel_off_confirm.btn_cancel
      </button>
      <button data-ref="channel_off_confirm_button" type="button" class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.notification_channel_off_modal?.isSaving ?? false}}">
        <on type="click">
          <!-- 끄기 — 화면 [저장]과 같은 요청(알림 채널 묶음)을 보낸다. 성공하면 부모 화면의 「고친 것 있음」 표시를
               끄고 설정을 다시 받는다. 실패하면 창을 열어 둔 채 서버 문구를 띄운다. -->
          <sequence>
            <set-state target="global" :notification_channel_off_modal.isSaving="true"/>
            <api-call :auth_required="true" target="/api/admin/settings" method="POST">
              <success>
                <set-state target="$parent._local" :isSaving="false" :hasChanges="false"/>
                <set-state target="global" settings="{{result.data.settings}}" uploadSettings="{{result.data.settings.upload}}" :notification_channel_off_modal="null"/>
                <toast type="success" message="$t:admin.settings.save_success"/>
                <refetch-data-source dataSourceId="settings"/>
                <close-modal target="modal_notification_channel_off_confirm"/>
              </success>
              <fail>
                <set-state target="global" :notification_channel_off_modal.isSaving="false"/>
                <toast type="error" message="{{error.message ?? '$t:admin.settings.save_error'}}"/>
              </fail>
              <field name="body">
                <field name="_tab" value="notifications"/>
                <field name="notifications">
                  <field name="channels" value="{{_global.notification_channel_off_modal?.channels ?? []}}"/>
                </field>
              </field>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.notification_channel_off_modal?.isSaving}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.notification_channel_off_modal?.isSaving ? '$t:common.saving' : '$t:admin.settings.notification_definitions.channel_off_confirm.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
