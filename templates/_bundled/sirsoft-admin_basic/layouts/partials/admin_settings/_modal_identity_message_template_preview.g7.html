<partial description="IDV 메시지 템플릿 미리보기 모달 — 변수 치환 결과 (subject/body) 렌더링" editor_label="$t:admin.modal_label.admin_settings.modal_identity_message_template_preview">
  <modal data-ref="modal_identity_message_template_preview" id="modal_identity_message_template_preview" size="lg" title="$t:admin.settings.identity.messages.modal.preview">
    <div class="space-y-4 p-4">
      <div class="rounded-md border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3">
        <p class="text-tertiary font-semibold mb-1">$t:admin.settings.identity.messages.modal.subject_label</p>
        <p class="text-heading">{{_global.identity_message_template_preview_modal?.subject ?? ''}}</p>
      </div>
      <div class="rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4">
        <p class="text-tertiary font-semibold mb-2">$t:admin.settings.identity.messages.modal.body_label</p>
        <html-content content="{{_global.identity_message_template_preview_modal?.body ?? ''}}" :isHtml="true" class="prose prose-sm max-w-none dark:prose-invert"/>
      </div>
      <div class="flex justify-end pt-3 border-t border-gray-200 dark:border-gray-700">
        <button type="button" class="px-3 py-2 text-body bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded hover:bg-gray-50 dark:hover:bg-gray-700"><on type="click"><close-modal target="modal_identity_message_template_preview"/></on>$t:common.close</button>
      </div>
    </div>
  </modal>
</partial>
