<partial description="알림 정의 기본값 복원 확인 모달 (스피너 포함)" editor_label="$t:admin.modal_label.admin_settings.modal_notification_definition_reset">
  <modal data-ref="modal_notification_definition_reset" title="$t:admin.settings.notification_definitions.reset_modal.title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:admin.settings.notification_definitions.reset_modal.confirm_message</p>
    <div class="mt-4 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
      <span class="form-sub-label">$t:admin.settings.notification_definitions.reset_modal.target_label</span>
      <span class="text-primary font-medium">{{_global.resetTargetName ?? ''}}</span>
    </div>
    <div class="alert-danger">
      <p class="text-error-soft">$t:admin.settings.notification_definitions.reset_modal.warning_message</p>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isResettingNotification}}"><on type="click"><close-modal target="modal_notification_definition_reset"/></on>$t:common.cancel</button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <set-state target="global" :isResettingNotification="true"/>
          <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.resetTargetId}}/reset" method="POST">
            <success>
              <set-state target="global" :isResettingNotification="false" :resetTargetId="null" resetTargetName=""/>
              <refetch-data-source dataSourceId="notificationDefinitions"/>
              <toast type="success" message="$t:admin.settings.notification_definitions.reset_success"/>
              <close-modal target="modal_notification_definition_reset"/>
            </success>
            <fail>
              <set-state target="global" :isResettingNotification="false"/>
              <toast type="error" message="{{error.message ?? '$t:admin.settings.notification_definitions.reset_failed'}}"/>
            </fail>
          </api-call>
        </on>
        <icon data-if="{{_global.isResettingNotification}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isResettingNotification ? '$t:admin.settings.notification_definitions.reset_modal.btn_confirming' : '$t:admin.settings.notification_definitions.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
