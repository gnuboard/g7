<partial description="본인인증 정책 삭제 확인 모달" editor_label="$t:admin.modal_label.admin_settings.identity_policy_delete_modal">
  <modal data-ref="identity_policy_delete_modal" title="$t:admin.identity.policies.delete_title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:admin.identity.policies.delete_confirm</p>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.identityPolicyDeleting}}"><on type="click"><close-modal target="identity_policy_delete_modal"/></on>$t:common.cancel</button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.identityPolicyDeleting}}">
        <on type="click">
          <set-state target="global" :identityPolicyDeleting="true"/>
          <api-call :auth_required="true" target="/api/admin/identity/policies/{{_global.identityPolicyDeleteId}}" method="DELETE">
            <success>
              <set-state target="global" :identityPolicyDeleting="false" :identityPolicyDeleteId="null"/>
              <toast type="success" message="$t:admin.identity.policies.delete_success"/>
              <refetch-data-source dataSourceId="policies"/>
              <close-modal target="identity_policy_delete_modal"/>
            </success>
            <fail>
              <set-state target="global" :identityPolicyDeleting="false"/>
              <toast type="error" message="{{error.message ?? '$t:admin.identity.policies.delete_failed'}}"/>
            </fail>
          </api-call>
        </on>
        <icon data-if="{{_global.identityPolicyDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.identityPolicyDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
