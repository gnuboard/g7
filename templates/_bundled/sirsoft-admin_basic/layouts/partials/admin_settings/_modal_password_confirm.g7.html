<!-- 앱 키를 다시 만들기 전에 본인 비밀번호를 다시 묻는 창.
  로그인 세션이 살아 있어도 한 번 더 묻는 이유는, 이 동작이 **이미 발급된 값들을 무효로 만들기**
  때문이다(자리를 비운 사이 남이 누르는 것을 막는다).
  입력한 비밀번호(_global.appKeyPassword)는 창을 닫으면 지운다 — 취소·성공은 직접 지우고, 창 머리 닫기·Esc·바깥 클릭(엔진 closeModal 로만
  이어져 레이아웃 동작을 타지 않는다)은 열려 있는 동안 내내 붙어 있는 본문 틀의 unmount 에서 지운다. 종전에는 이 세 갈래로 닫으면
  비밀번호가 전역에 남아, 다시 열었을 때 입력칸은 비었는데 실행 단추가 열려 있고 누르면 앞 비밀번호가 나갔다(7.1.1). -->
<partial editor_label="$t:admin.modal_label.admin_settings.settings_password_confirm_modal" description="앱 키 재생성 비밀번호 확인 모달">
  <modal data-type="composite" data-ref="settings_password_confirm_modal" title="{{current_user?.data?.has_password === false ? '$t:admin.settings.modals.identity_confirm_title' : '$t:admin.settings.modals.password_confirm_title'}}" size="sm">
    <div class="py-2">
      <on event="unmount">
        <!-- 창이 닫혀 본문이 내려갈 때(어느 갈래로 닫든) 입력한 비밀번호를 지운다. 비밀번호 없는 관리자의 인증번호·요청 번호도
             같이 지운다 — 남기면 다시 열었을 때 인증번호 칸은 비었는데 실행 단추가 열려 있고 누르면 앞 인증번호가 나간다.
             외부 수단으로 받아 온 확인 토큰(7.2.0)은 여기서 지우지 않는다 — 설정 화면 init 이 창을 연 직후 데이터가 도착하면 창 본문이
             다시 마운트되는데(이 정리는 마운트 때의 문맥으로 돌아 닫힘과 재마운트를 가릴 수 없다) 그때 지우면 돌아온 토큰을 잃는다.
             토큰은 [취소]·재생성 결과에서 지우고, 보안 탭 버튼으로 창을 열 때 먼저 비운다. -->
        <set-state target="global" appKeyPassword="" appKeyReauthCode="" :appKeyReauthChallengeId="null"/>
      </on>
      <div class="alert-warning">
        <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0 mt-0.5"/>
        <p class="text-warning-soft">$t:admin.settings.modals.app_key_warning</p>
      </div>
      <label data-if="{{current_user?.data?.has_password !== false}}" class="form-label">$t:admin.settings.modals.enter_password</label>
      <input data-if="{{current_user?.data?.has_password !== false}}" type="password" placeholder="$t:admin.settings.modals.password_placeholder" class="input">
        <on type="change">
          <!-- 입력한 비밀번호를 전역에 담는다 — 실행 버튼의 잠금 조건과 요청 본문이 이 값을 함께 읽는다. -->
          <set-state target="global" appKeyPassword="{{$event.target.value}}"/>
        </on>
      </input>
      <!-- 비밀번호가 없는 관리자(소셜 로그인 등 외부 인증으로만 가입) — 비밀번호 대신 이메일 인증번호로 확인한다.
           코어 본인인증(목적 `sensitive_action`)으로 인증번호를 받고, 실행할 때 확인해 받은 토큰을 재생성 요청에 싣는다. -->
      <div data-if="{{current_user?.data?.has_password === false}}" data-ref="app_key_reauth_section" class="space-y-3">
        <!-- 메일을 받을 수 없는 관리자(대체 이메일)에게는 「이메일로 받은 인증번호」 대신 일반 안내 — 서버가 회사 계정 다시 로그인 등을 고른다 -->
        <p data-if="{{current_user?.data?.email_deliverable !== false}}" class="text-sm text-gray-600 dark:text-gray-400">$t:admin.settings.modals.reauth_notice</p>
        <p data-if="{{current_user?.data?.email_deliverable === false}}" class="text-sm text-gray-600 dark:text-gray-400">$t:admin.settings.modals.reauth_notice_other</p>
        <!-- 외부 수단(회사 계정 다시 로그인 등)으로 확인을 마치고 돌아왔다(7.2.0) — 설정 화면 init 이 받아 온 토큰을 담고 이 창을 다시 연다.
             재생성은 관리자가 [재생성] 을 눌러야 나간다(자동 실행 안 함). -->
        <p data-if="{{!!_global.appKeyReauthToken}}" data-ref="app_key_reauth_verified" class="text-sm text-green-700 dark:text-green-300" role="status">$t:admin.settings.modals.reauth_verified</p>
        <button data-if="{{!_global.appKeyReauthToken}}" type="button" class="btn btn-secondary w-full" disabled="{{_global.isRequestingAppKeyCode || _global.isRegeneratingKey}}">
          <on type="click">
            <!-- 인증번호 받기 — 본인(로그인 관리자) 대상 재확인 요청을 보낸다. 수단은 고정하지 않고 서버가 이 관리자에게 쓸 수 있는 수단을 고른다(7.2.0). 다시 받으면 새 요청으로 바꾸고 입력값을 비운다. -->
            <sequence>
              <set-state target="global" :isRequestingAppKeyCode="true"/>
              <!-- 외부 수단이 확인을 마치고 돌려보낼 곳(같은 출처 경로만) — 설정 화면 init 이 `reauth=app_key` 를 보고 이 창을 다시 연다 -->
              <api-call :auth_required="true" target="/api/identity/challenges" method="POST">
                <success>
                  <!-- 서버가 수단을 고른다(7.2.0) — 외부 수단이면 그 화면으로 갔다가 돌아온다 -->
                  <redirect if="{{response.data?.render_hint === 'external_redirect' &amp;&amp; !!response.data?.redirect_url}}" url="{{response.data.redirect_url}}"/>
                  <!-- 외부 수단인데 갈 주소가 없으면 진행 표시를 풀고 안내한다 — 두면 버튼이 눌리지 않는 채로 남는다 -->
                  <set-state if="{{response.data?.render_hint === 'external_redirect' &amp;&amp; !response.data?.redirect_url}}" target="global" :isRequestingAppKeyCode="false"/>
                  <toast if="{{response.data?.render_hint === 'external_redirect' &amp;&amp; !response.data?.redirect_url}}" type="error" message="$t:admin.settings.modals.reauth_external_failed"/>
                  <set-state if="{{response.data?.render_hint !== 'external_redirect'}}" target="global" :isRequestingAppKeyCode="false" appKeyReauthChallengeId="{{response.data?.id}}" appKeyReauthCode=""/>
                  <toast if="{{response.data?.render_hint !== 'external_redirect' &amp;&amp; current_user?.data?.email_deliverable !== false}}" type="info" message="$t:admin.settings.modals.reauth_code_sent"/>
                  <toast if="{{response.data?.render_hint !== 'external_redirect' &amp;&amp; current_user?.data?.email_deliverable === false}}" type="info" message="$t:admin.settings.modals.reauth_code_sent_generic"/>
                </success>
                <fail>
                  <set-state target="global" :isRequestingAppKeyCode="false"/>
                  <toast type="error" message="{{error.message}}"/>
                </fail>
                <body purpose="sensitive_action" return_path="/admin/settings?tab=security&amp;reauth=app_key" scope="admin"/>
              </api-call>
            </sequence>
          </on>
          <span>{{_global.appKeyReauthChallengeId ? '$t:admin.settings.modals.reauth_resend_code' : (current_user?.data?.email_deliverable === false ? '$t:admin.settings.modals.reauth_start' : '$t:admin.settings.modals.reauth_request_code')}}</span>
        </button>
        <input data-if="{{!!_global.appKeyReauthChallengeId}}" type="text" name="app_key_reauth_code" value="{{_global.appKeyReauthCode ?? ''}}" inputMode="numeric" autoComplete="one-time-code" maxLength="10" placeholder="$t:admin.settings.modals.reauth_code_placeholder" class="input">
          <on event="onChange">
            <!-- 입력한 인증번호를 전역에 담는다 — [재생성] 의 잠금 조건과 요청 본문이 이 값을 함께 읽는다 -->
            <set-state target="global" appKeyReauthCode="{{$event.target.value}}"/>
          </on>
        </input>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isRegeneratingKey}}">
        <on type="click">
          <!-- 취소 — 입력한 비밀번호를 **반드시 지우고** 닫는다. 전역에 남기면 창을 닫은 뒤에도
               값이 살아 있고, 다시 열었을 때 채워진 채로 보인다. -->
          <sequence>
            <set-state target="global" appKeyPassword="" appKeyReauthCode="" :appKeyReauthChallengeId="null" :appKeyReauthToken="null"/>
            <close-modal/>
          </sequence>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <!-- 비밀번호 회원 — 비밀번호로 확인하고 재생성 -->
      <button type="button" data-if="{{current_user?.data?.has_password !== false}}" class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-600 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isRegeneratingKey || !_global.appKeyPassword}}">
        <on type="click">
          <!-- 앱 키 재생성 실행. 성공 갈래에서도 비밀번호를 지운다(취소와 같은 이유).
               실패 갈래는 지우지 않는다 — 비밀번호가 틀린 경우가 대부분이라 고쳐 다시 넣게 둔다.
               끝나면 키 표시를 다시 받아 새 값으로 갱신한다. -->
          <sequence>
            <set-state target="global" :isRegeneratingKey="true"/>
            <api-call :auth_required="true" target="/api/admin/settings/regenerate-app-key" method="POST">
              <success>
                <set-state target="global" :isRegeneratingKey="false" appKeyPassword=""/>
                <toast type="success" message="$t:admin.settings.app_key_regenerated"/>
                <refetch-data-source dataSourceId="appKey"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isRegeneratingKey="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body password="{{_global.appKeyPassword}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isRegeneratingKey}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isRegeneratingKey ? '$t:admin.settings.modals.regenerating' : '$t:admin.settings.modals.regenerate'}}</span>
      </button>
      <!-- 비밀번호 없는 관리자 — 인증번호를 확인해 받은 토큰으로 재생성. 성공하면 인증 상태를 비운다.
           외부 수단으로 확인을 마치고 돌아왔으면(7.2.0) 인증번호 확인 없이 받아 온 토큰으로 바로 재생성한다 — 토큰은 한 번만 쓰이므로 성공·실패 모두 비운다. -->
      <button type="button" data-if="{{current_user?.data?.has_password === false}}" data-ref="app_key_reauth_regenerate_button" class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-600 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isRegeneratingKey || (!_global.appKeyReauthToken &amp;&amp; (!_global.appKeyReauthChallengeId || !_global.appKeyReauthCode || _global.appKeyReauthCode.length &lt; 4))}}">
        <on type="click">
          <sequence>
            <set-state target="global" :isRegeneratingKey="true"/>
            <api-call if="{{!!_global.appKeyReauthToken}}" :auth_required="true" target="/api/admin/settings/regenerate-app-key" method="POST">
              <success>
                <set-state target="global" :isRegeneratingKey="false" :appKeyReauthToken="null"/>
                <toast type="success" message="$t:admin.settings.app_key_regenerated"/>
                <refetch-data-source dataSourceId="appKey"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isRegeneratingKey="false" :appKeyReauthToken="null"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body verification_token="{{_global.appKeyReauthToken}}"/>
            </api-call>
            <api-call if="{{!_global.appKeyReauthToken}}" :auth_required="true" target="/api/identity/challenges/{{_global.appKeyReauthChallengeId}}/verify" method="POST">
              <success>
                <api-call :auth_required="true" target="/api/admin/settings/regenerate-app-key" method="POST">
                  <success>
                    <set-state target="global" :isRegeneratingKey="false" appKeyReauthCode="" :appKeyReauthChallengeId="null"/>
                    <toast type="success" message="$t:admin.settings.app_key_regenerated"/>
                    <refetch-data-source dataSourceId="appKey"/>
                    <close-modal/>
                  </success>
                  <fail>
                    <set-state target="global" :isRegeneratingKey="false"/>
                    <toast type="error" message="{{error.message}}"/>
                  </fail>
                  <body verification_token="{{response.data?.verification_token}}"/>
                </api-call>
              </success>
              <fail>
                <set-state target="global" :isRegeneratingKey="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body code="{{_global.appKeyReauthCode}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isRegeneratingKey}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isRegeneratingKey ? '$t:admin.settings.modals.regenerating' : '$t:admin.settings.modals.regenerate'}}</span>
      </button>
    </div>
  </modal>
</partial>
