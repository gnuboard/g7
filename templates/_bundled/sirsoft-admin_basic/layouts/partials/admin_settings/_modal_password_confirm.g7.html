<!-- 앱 키를 다시 만들기 전에 본인 비밀번호를 다시 묻는 창.
  로그인 세션이 살아 있어도 한 번 더 묻는 이유는, 이 동작이 **이미 발급된 값들을 무효로 만들기**
  때문이다(자리를 비운 사이 남이 누르는 것을 막는다). -->
<partial editor_label="$t:admin.modal_label.admin_settings.settings_password_confirm_modal" description="앱 키 재생성 비밀번호 확인 모달">
  <modal data-type="composite" data-ref="settings_password_confirm_modal" title="$t:admin.settings.modals.password_confirm_title" size="sm">
    <div class="py-2">
      <div class="alert-warning">
        <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0 mt-0.5"/>
        <p class="text-warning-soft">$t:admin.settings.modals.app_key_warning</p>
      </div>
      <label class="form-label">$t:admin.settings.modals.enter_password</label>
      <input type="password" placeholder="$t:admin.settings.modals.password_placeholder" class="input">
        <on type="change">
          <!-- 입력한 비밀번호를 전역에 담는다 — 실행 버튼의 잠금 조건과 요청 본문이 이 값을 함께 읽는다. -->
          <set-state target="global" appKeyPassword="{{$event.target.value}}"/>
        </on>
      </input>
    </div>
    <div class="modal-footer-buttons">
      <button class="btn btn-secondary" disabled="{{_global.isRegeneratingKey}}">
        <on type="click">
          <!-- 취소 — 입력한 비밀번호를 **반드시 지우고** 닫는다. 전역에 남기면 창을 닫은 뒤에도
               값이 살아 있고, 다시 열었을 때 채워진 채로 보인다. -->
          <sequence>
            <set-state target="global" appKeyPassword=""/>
            <close-modal/>
          </sequence>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isRegeneratingKey || !_global.appKeyPassword}}">
        <on type="click">
          <!-- 앱 키 재생성 실행. 성공 갈래에서도 비밀번호를 지운다(취소와 같은 이유).
               실패 갈래는 지우지 않는다 — 비밀번호가 틀린 경우가 대부분이라 고쳐 다시 넣게 둔다.
               끝나면 키 표시를 다시 받아 새 값으로 갱신한다. -->
          <sequence>
            <set-state target="global" :isRegeneratingKey="true"/>
            <api-call :auth_required="true" target="/api/admin/settings/regenerate-app-key" method="POST">
              <success>
                <set-state target="global" :isRegeneratingKey="false" appKeyPassword=""/>
                <toast type="success" message="$t:admin.settings.app_key_regenerated"/>
                <refetch-data-source dataSourceId="appKey"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isRegeneratingKey="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body password="{{_global.appKeyPassword}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isRegeneratingKey}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isRegeneratingKey ? '$t:admin.settings.modals.regenerating' : '$t:admin.settings.modals.regenerate'}}</span>
      </button>
    </div>
  </modal>
</partial>
