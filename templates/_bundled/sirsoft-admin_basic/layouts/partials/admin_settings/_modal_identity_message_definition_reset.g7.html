<partial description="IDV 메시지 정의 기본값 복원 확인 모달 (스피너 포함) — 알림 reset 모달 미러" editor_label="$t:admin.modal_label.admin_settings.modal_identity_message_definition_reset">
  <modal data-ref="modal_identity_message_definition_reset" title="$t:admin.settings.identity.messages.reset_modal.title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:admin.settings.identity.messages.reset_modal.confirm_message</p>
    <div class="mt-4 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
      <span class="form-sub-label">$t:admin.settings.identity.messages.reset_modal.target_label</span>
      <span class="text-primary font-medium">{{_global.resetIdentityMessageTargetName ?? ''}}</span>
    </div>
    <div class="alert-danger">
      <p class="text-error-soft">$t:admin.settings.identity.messages.reset_modal.warning_message</p>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isResettingIdentityMessage}}"><on type="click"><close-modal target="modal_identity_message_definition_reset"/></on>$t:common.cancel</button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingIdentityMessage}}">
        <on type="click">
          <sequence>
            <set-state target="global" :isResettingIdentityMessage="true"/>
            <api-call :auth_required="true" target="/api/admin/identity/messages/definitions/{{_global.resetIdentityMessageTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :isResettingIdentityMessage="false" :resetIdentityMessageTargetId="null" resetIdentityMessageTargetName=""/>
                <refetch-data-source dataSourceId="identityMessages"/>
                <toast type="success" message="$t:admin.settings.identity.messages.reset_modal.reset_success"/>
                <close-modal target="modal_identity_message_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :isResettingIdentityMessage="false"/>
                <toast type="error" message="{{error.message ?? '$t:admin.settings.identity.messages.reset_modal.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingIdentityMessage}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isResettingIdentityMessage ? '$t:admin.settings.identity.messages.reset_modal.btn_confirming' : '$t:admin.settings.identity.messages.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
