<!--
  본인인증 메시지 정의를 **새로 만드는** 창(운영자 추가분). 알림 템플릿 창과 같은 뼈대다 —
  언어 탭 + 고정 푸터 + 상단 검증 오류 상자.

  이 창의 성질 셋:
  ⑴ 상태를 전역 **한 객체**(`identity_message_definition_add_modal`) 아래 모은다 — 폼·언어·저장중·
     오류가 한 덩어리라, 성공 시 그 객체를 통째로 비우면 다음에 열 때 새 창이 된다.
  ⑵ 다국어 입력은 언어 탭이 고른 로케일 한 칸만 보여 주고, 값은 `{ko: …, en: …}` 객체에 쌓는다.
     그래서 입력마다 **기존 객체를 복사해 그 로케일 키만 갈아 끼운다**(통째로 덮으면 다른 언어가 날아간다).
  ⑶ 제공자·범위 종류·채널은 고를 수 없다 — 메일 고정이고, 읽기 전용 칸으로 보여만 준다.
     변수 목록도 화면에 박아 둔 안내이고, 서버에 보내는 변수 정의는 아래 저장 본문에 따로 있다.
-->
<partial description="IDV 메시지 정의 신규 추가 모달 — 알림 템플릿 모달 패리티 (언어 탭 + 고정 footer + 검증 에러 영역)" editor_label="$t:admin.modal_label.admin_settings.modal_identity_message_definition_add">
  <modal data-ref="modal_identity_message_definition_add" size="xl" title="$t:admin.settings.identity.messages.add_modal.title" :closeOnOverlayClick="false">
    <div data-ref="identity_message_add_container" data-blur-until-loaded="{{_global.identity_message_definition_add_modal?.isSaving}}" class="flex flex-col max-h-[calc(90vh-140px)] -my-4">
      <div class="flex-1 overflow-y-auto space-y-5 pr-1">
        <div data-ref="identity_message_add_errors" data-if="{{_global.identity_message_definition_add_modal?.errors}}" class="rounded-md border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-900/20 px-4 py-3">
          <p class="text-error-strong mb-1">$t:admin.settings.identity.messages.add_modal.errors_title</p>
          <ul class="text-danger-soft list-disc pl-5 space-y-0.5">
            <li data-each="errMsg in {{Object.values(_global.identity_message_definition_add_modal?.errors ?? {}).flat()}}">{{errMsg}}</li>
          </ul>
        </div>
        <div data-ref="identity_message_add_meta" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="form-label">$t:admin.settings.identity.messages.add_modal.provider</label>
            <input type="text" value="{{_global.identity_message_definition_add_modal?.form?.provider_id ?? 'g7:core.mail'}}" :readonly="true" class="input-readonly w-full font-mono"/>
          </div>
          <div>
            <label class="form-label">$t:admin.settings.identity.messages.add_modal.scope_type</label>
            <input type="text" value="policy" :readonly="true" class="input-readonly w-full font-mono"/>
          </div>
        </div>
        <div data-ref="identity_message_add_policy_key">
          <label class="form-label">
            <span>$t:admin.settings.identity.messages.add_modal.policy_key</span>
            <span class="text-required">*</span>
          </label>
          <select data-if="{{(adminIdentityPolicies?.data?.data ?? []).length > 0}}" value="{{_global.identity_message_definition_add_modal?.form?.scope_value ?? ''}}" class="text-primary w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800" placeholder="$t:admin.settings.identity.messages.add_modal.policy_key_placeholder" options="{{(adminIdentityPolicies?.data?.data ?? []).map(p => ({ value: p.key, label: p.key }))}}">
            <on type="change">
              <!-- 어느 정책에 붙일 메시지인지 고른다. 선택지는 **관리자 정책 목록**에서 오고,
                   그 목록이 비면 이 선택기 대신 안내 문구가 뜬다(정책부터 만들어야 한다). -->
              <set-state target="global" identity_message_definition_add_modal.form.scope_value="{{$event.target.value}}"/>
            </on>
          </select>
          <p data-if="{{(adminIdentityPolicies?.data?.data ?? []).length === 0}}" class="text-warning-soft px-3 py-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-md">$t:admin.settings.identity.messages.add_modal.policy_empty</p>
        </div>
        <div data-ref="identity_message_add_variables" class="rounded-md bg-gray-100 dark:bg-gray-700 p-3">
          <h4 class="text-xs font-semibold text-gray-700 dark:text-gray-300 mb-2">$t:admin.settings.identity.messages.add_modal.variables_title</h4>
          <div class="flex flex-wrap gap-1">
            <span data-each='varItem in [{"key":"code"},{"key":"action_url"},{"key":"expire_minutes"},{"key":"purpose_label"},{"key":"app_name"},{"key":"site_url"},{"key":"recipient_email"}]' class="px-2 py-1 text-[11px] rounded bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 font-mono">{{'{' + varItem.key + '}'}}</span>
          </div>
        </div>
        <div data-ref="identity_message_add_lang_tabs" class="flex border-b border-gray-200 dark:border-gray-700">
          <button data-each="loc in {{$locales}}" type="button" class="{{(_global.identity_message_definition_add_modal?.editLang ?? $locale) === loc ? 'border-b-2 border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}} px-4 py-2 text-sm font-medium focus:outline-none"><on type="click"><!-- 편집 언어 전환 — 아래 세 칸(이름·제목·본문)이 함께 이 로케일을 바라본다.
     입력값은 언어별 객체에 남으므로 탭을 옮겨도 쓰던 것이 사라지지 않는다. --><set-state target="global" identity_message_definition_add_modal.editLang="{{loc}}"/></on>{{_global.appConfig?.localeNames?.[loc] ?? loc}}</button>
        </div>
        <div data-ref="identity_message_add_name" class="row-stack">
          <div>
            <label class="form-label">
              <span>$t:admin.settings.identity.messages.add_modal.name</span>
              <span class="text-required">*</span>
            </label>
            <input type="text" value="{{_global.identity_message_definition_add_modal?.form?.name?.[_global.identity_message_definition_add_modal?.editLang ?? $locale] ?? ''}}" class=" focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <on type="input">
                <!-- 정의 이름(언어별). 기존 객체를 복사해 **지금 탭의 로케일 키만** 갈아 끼운다 —
                     통째로 덮으면 다른 언어에 써 둔 값이 사라진다. -->
                <set-state target="global" identity_message_definition_add_modal.form.name="{{Object.assign({}, _global.identity_message_definition_add_modal?.form?.name, {[_global.identity_message_definition_add_modal?.editLang ?? $locale]: $event.target.value})}}"/>
              </on>
            </input>
          </div>
        </div>
        <div data-ref="identity_message_add_subject" class="row-stack">
          <div>
            <label class="form-label">
              <span>$t:admin.settings.identity.messages.add_modal.subject</span>
              <span class="text-required">*</span>
            </label>
            <input type="text" value="{{_global.identity_message_definition_add_modal?.form?.subject?.[_global.identity_message_definition_add_modal?.editLang ?? $locale] ?? ''}}" class=" focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <on type="input">
                <!-- 메일 제목(언어별) — 이름 칸과 같은 방식이다. -->
                <set-state target="global" identity_message_definition_add_modal.form.subject="{{Object.assign({}, _global.identity_message_definition_add_modal?.form?.subject, {[_global.identity_message_definition_add_modal?.editLang ?? $locale]: $event.target.value})}}"/>
              </on>
            </input>
          </div>
        </div>
        <div data-ref="identity_message_add_body" class="row-stack">
          <div>
            <label class="form-label">
              <span>$t:admin.settings.identity.messages.add_modal.body</span>
              <span class="text-required">*</span>
            </label>
            <html-editor content="{{_global.identity_message_definition_add_modal?.form?.body?.[_global.identity_message_definition_add_modal?.editLang ?? $locale] ?? ''}}" :isHtml="true" :showHtmlModeToggle="false" class="min-h-[200px]">
              <on type="change">
                <!-- 메일 본문(언어별). 위 두 칸과 같은 방식이고, 여기만 편집기라 `input` 이 아니라
                     `change` 로 받는다. 위 안내에 적힌 `{code}` 같은 변수를 그대로 쓸 수 있다. -->
                <set-state target="global" identity_message_definition_add_modal.form.body="{{Object.assign({}, _global.identity_message_definition_add_modal?.form?.body, {[_global.identity_message_definition_add_modal?.editLang ?? $locale]: $event.target.value})}}"/>
              </on>
            </html-editor>
          </div>
        </div>
      </div>
      <div data-ref="identity_message_add_footer" class="flex justify-end gap-2 pt-4 pb-4 border-t border-gray-200 dark:border-gray-700 mt-4 flex-shrink-0">
        <button type="button" class="text-sm px-4 py-2 rounded-md border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.identity_message_definition_add_modal?.isSaving ?? false}}"><on type="click"><close-modal target="modal_identity_message_definition_add"/></on>$t:common.cancel</button>
        <button type="button" class="flex-center gap-2 text-sm px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.identity_message_definition_add_modal?.isSaving ?? false}}">
          <on type="click">
            <!-- 저장. 화면에 없는 값(범위 종류·채널·변수 정의)은 **여기서 붙여 보낸다** — 고를 수 없는
                 것들이라 폼에 두지 않았다. 언어별 객체는 그대로 실려 나간다.
                 성공하면 목록을 다시 받고 창 상태를 통째로 비운다(다음에 열면 빈 폼이다).
                 실패는 필드 오류를 상단 상자에 남기고 창을 닫지 않는다. -->
            <sequence>
              <set-state target="global" :identity_message_definition_add_modal.isSaving="true" :identity_message_definition_add_modal.errors="null"/>
              <api-call :auth_required="true" target="/api/admin/identity/messages/definitions" method="POST">
                <success>
                  <refetch-data-source dataSourceId="identityMessages"/>
                  <toast message="$t:admin.settings.identity.messages.add_modal.save_success" type="success"/>
                  <close-modal target="modal_identity_message_definition_add"/>
                  <set-state target="global" :identity_message_definition_add_modal="null"/>
                </success>
                <fail>
                  <set-state target="global" :identity_message_definition_add_modal.isSaving="false" identity_message_definition_add_modal.errors="{{error.errors}}"/>
                  <toast message="$t:admin.settings.identity.messages.add_modal.save_failed" type="error"/>
                </fail>
                <field name="body">
                  <field name="provider_id" value="{{_global.identity_message_definition_add_modal?.form?.provider_id ?? 'g7:core.mail'}}"/>
                  <field name="scope_type" value="policy"/>
                  <field name="scope_value" value="{{_global.identity_message_definition_add_modal?.form?.scope_value ?? ''}}"/>
                  <field name="name" value="{{_global.identity_message_definition_add_modal?.form?.name ?? ''}}"/>
                  <field name="channels">
                    <item>mail</item>
                  </field>
                  <field name="variables">
                    <item key="code" description="인증 코드"/>
                    <item key="action_url" description="검증 링크"/>
                    <item key="expire_minutes" description="만료 분"/>
                    <item key="purpose_label" description="목적 라벨"/>
                    <item key="app_name" description="사이트명"/>
                    <item key="site_url" description="사이트 URL"/>
                    <item key="recipient_email" description="수신자 이메일"/>
                  </field>
                  <field name="templates">
                    <item channel="mail" subject="{{_global.identity_message_definition_add_modal?.form?.subject ?? ''}}" body="{{_global.identity_message_definition_add_modal?.form?.body ?? ''}}"/>
                  </field>
                </field>
              </api-call>
            </sequence>
          </on>
          <icon data-if="{{_global.identity_message_definition_add_modal?.isSaving}}" name="spinner" class="animate-spin" size="sm"/>
          <span>{{_global.identity_message_definition_add_modal?.isSaving ? '$t:common.saving' : '$t:common.save'}}</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
