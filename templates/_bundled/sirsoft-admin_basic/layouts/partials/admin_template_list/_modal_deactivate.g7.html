<partial description="템플릿 비활성화 확인 모달" editor_label="$t:admin.modal_label.admin_template_list.template_deactivate_modal">
  <modal data-ref="template_deactivate_modal" title="$t:admin.templates.modals.deactivate_title" size="sm">
    <div class="py-2">
      <p class="text-gray-700 dark:text-gray-300">$t:admin.templates.modals.deactivate_confirm|name={{_global.selectedTemplate.name}}</p>
    </div>
    <div class="modal-footer-buttons">
      <button class="btn btn-secondary" disabled="{{_global.isTemplateDeactivating}}">
        <on type="click">
          <close-modal/>
          <remount componentId="template_card_grid"/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button class="flex-center gap-2 px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg hover:bg-gray-800 dark:hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isTemplateDeactivating}}">
        <on type="click">
          <set-state target="global" :isTemplateDeactivating="true"/>
          <api-call :auth_required="true" target="/api/admin/templates/deactivate" method="POST">
            <success>
              <set-state target="global" :isTemplateDeactivating="false"/>
              <set-state target="global" :selectedTemplate="null"/>
              <toast type="success" message="$t:admin.templates.deactivate_success"/>
              <refetch-data-source dataSourceId="templates"/>
              <reload-extensions/>
              <close-modal/>
            </success>
            <fail>
              <set-state target="global" :isTemplateDeactivating="false"/>
              <toast type="error" message="{{error.message}}"/>
            </fail>
            <body template_name="{{_global.selectedTemplate.identifier}}"/>
          </api-call>
        </on>
        <icon data-if="{{_global.isTemplateDeactivating}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isTemplateDeactivating ? '$t:admin.templates.deactivating' : '$t:admin.templates.actions.deactivate'}}</span>
      </button>
    </div>
  </modal>
</partial>
