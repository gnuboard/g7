<!-- 템플릿이 들고 온 레이아웃을 **다시 심는** 확인 창. 레이아웃 편집기로 고친 것이 원본으로 덮이므로
  경고를 앞세운다 — 이 템플릿에서는 그 편집기가 바로 옆 화면이라 되돌릴 것이 있을 가능성이 높다. -->
<partial description="템플릿 레이아웃 갱신 확인 모달" editor_label="$t:admin.modal_label.admin_template_list.template_refresh_layouts_modal">
  <modal data-type="composite" data-ref="template_refresh_layouts_modal" title="$t:admin.templates.modals.refresh_layouts_title" size="sm">
    <div class="py-2">
      <div class="alert-warning">
        <icon name="exclamation-triangle" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0"/>
        <p class="text-warning-soft">$t:admin.templates.modals.refresh_layouts_warning</p>
      </div>
      <p class="text-gray-700 dark:text-gray-300">$t:admin.templates.modals.refresh_layouts_confirm|name={{_global.selectedTemplate.name}}</p>
      <p class="mt-2 text-label-subtle">$t:admin.templates.modals.refresh_layouts_description</p>
    </div>
    <div class="modal-footer-buttons">
      <button class="btn btn-secondary" disabled="{{_global.isTemplateRefreshingLayouts}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button class="flex-center gap-2 px-4 py-2 bg-amber-600 dark:bg-amber-500 text-white rounded-lg hover:bg-amber-700 dark:hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isTemplateRefreshingLayouts}}">
        <on type="click">
          <!-- 다시 심기 실행 — 편집기로 고친 레이아웃이 원본으로 덮인다. -->
          <sequence>
            <set-state target="global" :isTemplateRefreshingLayouts="true"/>
            <api-call :auth_required="true" target="/api/admin/templates/refresh-layouts" method="POST">
              <success>
                <set-state target="global" :isTemplateRefreshingLayouts="false"/>
                <toast type="success" message="$t:admin.templates.refresh_layouts_success"/>
                <refetch-data-source dataSourceId="templates"/>
                <close-modal/>
                <set-state target="global" :selectedTemplate="null"/>
              </success>
              <fail>
                <set-state target="global" :isTemplateRefreshingLayouts="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body template_name="{{_global.selectedTemplate.identifier}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isTemplateRefreshingLayouts}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isTemplateRefreshingLayouts ? '$t:admin.templates.refreshing_layouts' : '$t:admin.templates.actions.refresh_layouts'}}</span>
      </button>
    </div>
  </modal>
</partial>
