<!--
  관리자 메뉴 항목 하나를 지우기 전 되묻는 창. 하위 항목이 딸린 메뉴를 지울 때 그것들이 어떻게
  되는지는 서버가 정하며, 이 창은 그 사정을 보여 주지 않는다.
  **실패 갈래가 없다** — 지우지 못했을 때 창은 이미 닫혀 있고 아무 안내도 뜨지 않아, 화면에서는
  성공과 구분되지 않는다.
-->
<partial description="메뉴 삭제 확인 모달" editor_label="$t:admin.modal_label.admin_menu_list.delete_confirm_modal">
  <modal data-ref="delete_confirm_modal" title="$t:admin.menus.modals.delete_title" size="sm">
    <div>
      <p class="text-label">$t:admin.menus.modals.delete_confirm</p>
      <div class="flex-center gap-3 justify-end">
        <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"><on type="click"><close-modal target="delete_confirm_modal"/></on>$t:common.cancel</button>
        <button class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"><on type="click"><!-- 응답을 기다리지 않고 창부터 닫는다. 지운 뒤에는 목록과 사이드바 메뉴를 함께 다시 받고, 오른쪽 패널이 가리키던 대상을 비워 보기 모드로 되돌린다 — 지운 항목을 계속 펼쳐 두지 않기 위해서다. --><sequence><close-modal target="delete_confirm_modal"/><api-call :auth_required="true" target="/api/admin/menus/{{_global.selectedMenuId}}" method="DELETE"><success><parallel><toast type="success" message="$t:admin.menus.messages.deleted"/><refetch-data-source dataSourceId="menus"/><refetch-data-source dataSourceId="admin_menu"/><set-state target="global" :selectedMenuId="null" :selectedMenu="null" panelMode="view"/></parallel></success></api-call></sequence></on>$t:common.delete</button>
      </div>
    </div>
  </modal>
</partial>
