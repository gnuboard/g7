<!--
  쌓아 둔 언어 자료를 버리고 다시 읽게 하는 창. 팩을 손대지 않고 **읽은 것만 비우므로**
  설치 상태나 켜짐 여부는 그대로다. 파일을 직접 고쳤는데 화면에 안 비칠 때 쓰는 자리다.
-->
<partial description="언어팩 캐시 갱신 확인 모달 — registry / translator / template 캐시 무효화" editor_label="$t:admin.modal_label.admin_language_pack_list.language_pack_refresh_cache_modal">
  <modal data-ref="language_pack_refresh_cache_modal" title="$t:admin.language_packs.modal.refresh_cache.title" size="sm">
    <p class="text-body">$t:admin.language_packs.modal.refresh_cache.body</p>
    <div class="flex justify-end gap-2 mt-6">
      <button type="button" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 text-sm font-medium rounded-md"><on event="onClick"><close-modal target="language_pack_refresh_cache_modal"/></on>$t:admin.language_packs.actions.cancel</button>
      <button type="button" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-md"><on event="onClick"><!-- 비운 뒤 목록도 다시 받는다 — 읽히지 않던 팩이 이때 상태가 바뀔 수 있어 화면과 어긋나지 않게 한다. --><api-call :auth_required="true" target="/api/admin/language-packs/refresh-cache" method="POST"><success><toast type="success" message="$t:admin.language_packs.messages.refresh_cache_done"/><close-modal target="language_pack_refresh_cache_modal"/><refetch-data-source dataSourceId="language_packs"/></success><fail><toast type="error" message="{{error.message ?? '$t:admin.language_packs.messages.refresh_cache_failed'}}"/></fail></api-call></on>$t:admin.language_packs.actions.refresh_cache_now</button>
    </div>
  </modal>
</partial>
