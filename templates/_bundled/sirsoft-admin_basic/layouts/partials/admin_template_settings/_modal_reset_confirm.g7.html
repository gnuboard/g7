<!-- 템플릿 설정 기본값 되돌리기 확인 창 (#434). 올린 파일도 지워지므로 되돌리기 전에 확인을 받는다.
  되돌리면 설정을 다시 받아 폼을 서버 기본값으로 맞추고 이탈 경고 표시를 끈다. -->
<partial editor_label="$t:admin.modal_label.admin_template_settings.reset_modal" description="템플릿 설정 기본값 되돌리기 확인 모달">
  <modal data-type="composite" data-ref="template_settings_reset_modal" title="$t:core.template_settings.reset_title" size="sm">
    <div class="py-2">
      <p class="text-gray-700 dark:text-gray-300">$t:core.template_settings.reset_confirm</p>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isResettingTemplateSettings}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" data-ref="template_settings_reset_confirm_button" class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-600 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingTemplateSettings}}">
        <on type="click">
          <sequence>
            <set-state target="global" :isResettingTemplateSettings="true"/>
            <api-call :auth_required="true" target="/api/admin/templates/{{route.identifier}}/settings/reset" method="POST">
              <success>
                <set-state target="global" :isResettingTemplateSettings="false"/>
                <set-state target="local" :hasChanges="false" :errors="null"/>
                <close-modal/>
                <toast type="success" message="$t:core.template_settings.reset_done"/>
                <refetch-data-source dataSourceId="template_settings"/>
              </success>
              <fail>
                <set-state target="global" :isResettingTemplateSettings="false"/>
                <toast type="error" message="{{error.message ?? '$t:core.template_settings.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingTemplateSettings}}" name="spinner" class="spinner-sm"/>
        <span>$t:core.template_settings.reset</span>
      </button>
    </div>
  </modal>
</partial>
