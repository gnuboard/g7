<!-- 관리자 화면 아래쪽 바닥글의 버전 번호를 누르면 뜨는 창. 코어의 변경 이력 원문을 그대로
  보여 준다. 바닥글 컴포넌트가 이력을 먼저 받아 전역에 담고 창을 여는데, 받기에 실패해도
  창은 열리므로 본문이 비어 보이는 상태가 정상 갈래에 있다. -->
<partial description="코어 Changelog 모달" editor_label="$t:admin.modal_label.changelog_modal">
  <modal data-type="composite" data-ref="changelog_modal" title="$t:admin.settings.info.changelog_title" size="large">
    <div class="flex flex-col max-h-[70vh]">
      <div class="flex-1 overflow-y-auto min-h-0 px-1">
        <pre class="whitespace-pre-wrap text-body font-mono leading-relaxed">{{_global.coreChangelogContent ?? ''}}</pre>
      </div>
      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700 mt-4">
        <button class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
          <on type="click">
            <close-modal/>
          </on>
          <span>$t:common.close</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
