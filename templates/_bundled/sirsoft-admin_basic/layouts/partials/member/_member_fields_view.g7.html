<!-- 회원 항목 보기 조각(관리자) — 서버가 준 항목 계약을 돌며 라벨, 범위 배지와 보기용 값(display_value)을 그린다. 관리자 회원 상세가 구획마다 부른다.
     입력 조각(_member_fields)과 같은 방식으로 항목을 받는다: 부르는 화면이 `data-each="memberFieldGroup in …"` 안에 include 하고,
     memberFieldGroup = { key(묶음 이름), fields(항목 계약 배열), className(칸을 늘어놓는 클래스), wideClassName(768px 이상에서 쓸 클래스) }. 값이 없으면 「-」를 보인다.
     칸의 id 는 입력 조각과 같은 field_{키} 다 — 상세와 수정 화면이 같은 자리에 같은 칸을 둔다.
     여러 줄 글(서명, 자기소개 등)은 줄바꿈을 살려 그리고, 파일 항목은 파일 이름 목록(누르면 내려받는다)을 그린다. -->
<partial description="회원 항목 보기 (관리자)">
  <div data-ref="member_fields_view_group_{{memberFieldGroup.key}}" class="{{memberFieldGroup?.className ?? 'row-stack'}}">
    <responsive on="768-" class="{{memberFieldGroup?.wideClassName ?? memberFieldGroup?.className ?? 'row-stack'}}"/>
    <div data-each="field in {{(memberFieldGroup?.fields ?? [])}}" data-ref="field_{{field.key}}" class="{{(field.renderer === 'address' || field.renderer === 'file' || field.type === 'textarea') ? 'col-span-full min-w-0' : 'min-w-0'}}">
      <!-- 라벨과 범위 배지 — 배지는 그 항목을 누가 고치고 볼 수 있는지 알린다(본인 수정, 관리자만 수정, 관리자만 열람). 코어 항목은 본인 수정이 기본이라 범위를 바꾼 경우에만 붙인다. -->
      <div class="flex items-start justify-between gap-2">
        <label class="text-label-subtle block font-medium mb-1 min-w-0 break-words"><span data-if="{{!!field.source_label}}" data-ref="mf_source_{{field.key}}" class="badge badge-gray mr-1">{{field.source_label}}</span><span>{{field.label}}</span></label>
        <span data-if="{{['self', 'admin_edit', 'admin_only'].indexOf(field.edit_scope) !== -1 &amp;&amp; (field.owner !== 'core' || field.edit_scope !== 'self')}}" data-ref="mf_scope_{{field.key}}" class="{{'badge shrink-0 whitespace-nowrap ' + (({ admin_edit: 'badge-blue', admin_only: 'badge-yellow' })[field.edit_scope] ?? 'badge-gray')}}">$t:admin.settings.member.fields.scope.{{field.edit_scope}}</span>
      </div>
      <!-- 값 — 서버가 만든 보기용 글자. 여러 줄 글은 줄바꿈을 살린다. -->
      <div data-if="{{field.renderer !== 'file'}}" data-ref="mf_view_value_{{field.key}}" class="{{field.type === 'textarea' ? 'text-primary text-sm whitespace-pre-line break-words' : 'text-primary text-sm break-words'}}">{{field.display_value || '-'}}</div>
      <!-- 파일, 이미지 — 올라가 있는 파일 이름 목록. 없으면 「-」. -->
      <div data-if="{{field.renderer === 'file'}}" data-ref="mf_view_files_{{field.key}}">
        <div data-if="{{(field.files ?? []).length === 0}}" class="text-primary text-sm">-</div>
        <ul data-if="{{(field.files ?? []).length > 0}}" class="space-y-1">
          <li data-each="fieldFile in {{field.files ?? []}}" data-ref="mf_view_file_{{field.key}}_{{fieldFile.id}}" class="flex items-center gap-2 min-w-0">
            <icon name="paperclip" size="sm" class="shrink-0 text-muted"/>
            <button type="button" class="min-w-0 justify-start text-left text-sm text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">
              <on type="click">
                <!-- 내려받기 — 회원 본인과 관리자만 받을 수 있는 파일이라 로그인 토큰이 실리는 경로로 받는다. -->
                <action handler="downloadAttachment" url="{{fieldFile.url}}" filename="{{fieldFile.name}}"/>
              </on>
              <span class="block truncate">{{fieldFile.name}}</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</partial>
