<!-- 예약 작업을 지우기 전 되묻는 창. 단건(행 메뉴)과 일괄(표 위 선택 삭제)이 함께 쓴다 —
  `deleteTargetIds` 가 있으면 일괄(`DELETE /bulk`), 없으면 `deleteTargetId` 한 건이다.
  문장도 두 갈래다 — 한 건이면 「이 스케줄을…」 + 대상 작업명 상자, 여러 건이면 「선택한 N개 스케줄을…」(배송정책 일괄 삭제 창과 같다).
  되돌릴 수 없다는 사실은 경고 상자로 따로 알린다. 성공 문구도 한 건·여러 건이 다르고, 여러 건은 서버가 준 문장(지운 개수)을 먼저 쓴다.
  코어·확장이 등록한 작업은 서버가 거절한다(목록에서 이미 잠겨 이 창이 열리지 않는다). -->
<partial description="스케줄 삭제 확인 모달" editor_label="$t:admin.modal_label.admin_schedule_list.schedule_delete_modal">
  <modal data-type="composite" data-ref="schedule_delete_modal" title="$t:admin.schedules.modals.delete_title" size="sm">
    <div class="space-y-3">
      <p data-if="{{!((_global.deleteTargetIds ?? []).length &gt; 0)}}" class="text-gray-700 dark:text-gray-300">$t:admin.schedules.modals.delete_confirm</p>
      <p data-if="{{(_global.deleteTargetIds ?? []).length &gt; 0}}" class="text-gray-700 dark:text-gray-300">$t:admin.schedules.modals.delete_confirm_bulk|count={{(_global.deleteTargetIds ?? []).length}}</p>
      <div data-if="{{!((_global.deleteTargetIds ?? []).length &gt; 0)}}" class="p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
        <span class="text-primary font-medium">{{_global.deleteTargetName}}</span>
      </div>
      <div data-ref="schedule_delete_warning" class="alert-warning">
        <icon name="triangle-exclamation" class="text-amber-600 dark:text-amber-400 flex-shrink-0"/>
        <p class="text-warning-soft">$t:admin.schedules.modals.delete_warning</p>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isDeleting}}">
        <on type="click">
          <close-modal target="schedule_delete_modal"/>
        </on>
        $t:common.cancel
      </button>
      <button data-ref="schedule_delete_submit" type="button" class="btn btn-danger flex-center gap-2" disabled="{{_global.isDeleting}}">
        <on type="click">
          <!-- 지운 뒤 담아 뒀던 대상을 비운다 — 이름·번호가 전역이라 남겨 두면 다음에 연 창이 이미 없는 작업을 가리킨다.
               성공 문구(한 건/여러 건)는 **비우기 전에** 누른 때의 대상 목록으로 고른다 — 비운 뒤에 고르면 늘 한 건 문구가 된다. -->
          <sequence :debounce="300">
            <set-state target="global" :isDeleting="true"/>
            <api-call :auth_required="true" target="{{(_global.deleteTargetIds ?? []).length &gt; 0 ? '/api/admin/schedules/bulk' : '/api/admin/schedules/' + _global.deleteTargetId}}" method="DELETE">
              <success>
                <toast type="success" message="{{(_global.deleteTargetIds ?? []).length &gt; 0 ? (response.message ?? '$t:admin.schedules.messages.bulk_delete_success') : '$t:admin.schedules.messages.delete_success'}}"/>
                <set-state target="global" :isDeleting="false" :deleteTargetId="null" :deleteTargetIds="null" :selectedScheduleIds="[]" deleteTargetName=""/>
                <refetch-data-source dataSourceId="schedules"/>
                <close-modal target="schedule_delete_modal"/>
              </success>
              <fail>
                <set-state target="global" :isDeleting="false"/>
                <toast type="error" message="{{error.errors?.general?.[0] ?? error.message ?? '$t:admin.schedules.errors.delete_failed'}}"/>
              </fail>
              <body ids="{{(_global.deleteTargetIds ?? []).length &gt; 0 ? _global.deleteTargetIds : undefined}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
