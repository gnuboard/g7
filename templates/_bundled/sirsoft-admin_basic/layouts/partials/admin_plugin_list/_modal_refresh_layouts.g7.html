<!-- 플러그인이 들고 온 화면 정의를 **다시 심는** 창. 경고를 앞세우는 이유는 지금 깔려 있는 것을
  덮어쓰기 때문이다 — 그 화면을 편집기로 손봐 뒀다면 그 손질이 사라진다.
  플러그인 판본은 그대로이고 화면 정의만 다시 읽으므로, 설치나 갱신과는 다른 조작이다. -->
<partial description="플러그인 레이아웃 갱신 확인 모달" editor_label="$t:admin.modal_label.admin_plugin_list.plugin_refresh_layouts_modal">
  <modal data-type="composite" data-ref="plugin_refresh_layouts_modal" title="$t:admin.plugins.modals.refresh_layouts_title" size="sm">
    <div class="py-2">
      <div class="alert-warning">
        <icon name="exclamation-triangle" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0"/>
        <p class="text-warning-soft">$t:admin.plugins.modals.refresh_layouts_warning</p>
      </div>
      <p class="text-gray-700 dark:text-gray-300">$t:admin.plugins.modals.refresh_layouts_confirm|name={{_global.selectedPlugin.name}}</p>
      <p class="mt-2 text-label-subtle">$t:admin.plugins.modals.refresh_layouts_description</p>
    </div>
    <!-- 고급 설정 — 레이아웃 설치 소스(#144). 평소에는 자동(.g7.html 우선)이고, 새 형식 처리에 문제가 있을 때만
         원본 JSON 우선을 고른다. 값은 요청 본문 layout_source 로 보내고 서버는 그 요청 동안만 적용한다.
         창을 열 때마다 자동·접힘으로 되돌린다(여는 쪽이 전역값을 초기화한다). -->
    <div data-ref="plugin_refresh_layouts_layout_source_section" class="mt-4 border-t border-gray-200 dark:border-gray-700 pt-3">
      <button data-ref="plugin_refresh_layouts_layout_source_toggle" type="button" aria-expanded="{{_global.pluginLayoutSourceOpen === true}}" class="text-label hover:text-gray-900 dark:hover:text-gray-200 inline-flex items-center gap-1">
        <on type="click">
          <!-- 접힘/펼침만 바꾼다 — 고른 값은 그대로 둔다. -->
          <set-state target="global" pluginLayoutSourceOpen="{{_global.pluginLayoutSourceOpen !== true}}"/>
        </on>
        <icon name="{{_global.pluginLayoutSourceOpen === true ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'}}" class="text-xs"/>
        <span>$t:admin.plugins.modals.layout_source_advanced</span>
      </button>
      <div data-ref="plugin_refresh_layouts_layout_source_options" data-if="{{_global.pluginLayoutSourceOpen === true}}" class="mt-2 p-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg">
        <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:admin.plugins.modals.layout_source_title</div>
        <p class="text-tertiary mb-2">$t:admin.plugins.modals.layout_source_help</p>
        <div class="row-stack">
          <label class="flex-start gap-2 p-2 rounded cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
            <input type="radio" name="plugin_refresh_layouts_layout_source" value="auto" checked="{{(_global.pluginLayoutSource ?? 'auto') === 'auto'}}" class="radio mt-0.5">
              <on type="change">
                <!-- 자동(권장) — .g7.html 을 우선 설치하고 없으면 .json 을 쓴다. 기본값. -->
                <set-state target="global" pluginLayoutSource="auto"/>
              </on>
            </input>
            <div>
              <span class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:admin.plugins.modals.layout_source_auto</span>
              <p class="text-tertiary">$t:admin.plugins.modals.layout_source_auto_desc</p>
            </div>
          </label>
          <label class="flex-start gap-2 p-2 rounded cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
            <input type="radio" name="plugin_refresh_layouts_layout_source" value="json" checked="{{(_global.pluginLayoutSource ?? 'auto') === 'json'}}" class="radio mt-0.5">
              <on type="change">
                <!-- 원본 JSON 우선(문제 해결용) — 짝 .json 이 있는 화면은 .g7.html 대신 원본 JSON 으로 설치한다. -->
                <set-state target="global" pluginLayoutSource="json"/>
              </on>
            </input>
            <div>
              <span class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:admin.plugins.modals.layout_source_json</span>
              <p class="text-tertiary">$t:admin.plugins.modals.layout_source_json_desc</p>
            </div>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isPluginRefreshingLayouts}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-amber-700 dark:bg-amber-700 text-white rounded-lg hover:bg-amber-800 dark:hover:bg-amber-800 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isPluginRefreshingLayouts}}">
        <on type="click">
          <!-- 끝나면 고른 플러그인을 비운다 — 이 값이 목록과 다른 창들이 함께 쓰는 자리라, 닫은 뒤에도 남겨 두면 다음에 연 창이 엉뚱한 플러그인을 가리킨다. -->
          <sequence>
            <set-state target="global" :isPluginRefreshingLayouts="true"/>
            <api-call :auth_required="true" target="/api/admin/plugins/refresh-layouts" method="POST">
              <success>
                <set-state target="global" :isPluginRefreshingLayouts="false"/>
                <toast type="success" message="$t:admin.plugins.refresh_layouts_success"/>
                <refetch-data-source dataSourceId="plugins"/>
                <close-modal/>
                <set-state target="global" :selectedPlugin="null" pluginLayoutSource="auto" :pluginLayoutSourceOpen="false"/>
              </success>
              <fail>
                <set-state target="global" :isPluginRefreshingLayouts="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body plugin_name="{{_global.selectedPlugin.identifier}}" layout_source="{{_global.pluginLayoutSource ?? 'auto'}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isPluginRefreshingLayouts}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isPluginRefreshingLayouts ? '$t:admin.plugins.refreshing_layouts' : '$t:admin.plugins.actions.refresh_layouts'}}</span>
      </button>
    </div>
  </modal>
</partial>
