<!-- 모듈이 들고 온 레이아웃을 **다시 심는** 확인 창(활성 모듈만). 편집기로 고친 레이아웃이 원본으로
  덮이므로 경고를 앞세운다.
  성공 뒤 대상(`selectedModule`)을 비우는 것은 이 창만의 처리다 — 되돌릴 수 없는 동작이라
  같은 대상으로 곧바로 한 번 더 누르는 길을 남기지 않는다. -->
<partial description="모듈 레이아웃 갱신 확인 모달" editor_label="$t:admin.modal_label.admin_module_list.module_refresh_layouts_modal">
  <modal data-type="composite" data-ref="module_refresh_layouts_modal" title="$t:admin.modules.modals.refresh_layouts_title" size="sm">
    <div class="py-2">
      <div class="alert-warning">
        <icon name="exclamation-triangle" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0"/>
        <p class="text-warning-soft">$t:admin.modules.modals.refresh_layouts_warning</p>
      </div>
      <p class="text-gray-700 dark:text-gray-300">$t:admin.modules.modals.refresh_layouts_confirm|name={{_global.selectedModule.name}}</p>
      <p class="mt-2 text-label-subtle">$t:admin.modules.modals.refresh_layouts_description</p>
    </div>
    <!-- 고급 설정 — 레이아웃 설치 소스(#144). 평소에는 자동(.g7.html 우선)이고, 새 형식 처리에 문제가 있을 때만
         원본 JSON 우선을 고른다. 값은 요청 본문 layout_source 로 보내고 서버는 그 요청 동안만 적용한다.
         창을 열 때마다 자동·접힘으로 되돌린다(여는 쪽이 전역값을 초기화한다). -->
    <div data-ref="module_refresh_layouts_layout_source_section" class="mt-4 border-t border-gray-200 dark:border-gray-700 pt-3">
      <button data-ref="module_refresh_layouts_layout_source_toggle" type="button" aria-expanded="{{_global.moduleLayoutSourceOpen === true}}" class="text-label hover:text-gray-900 dark:hover:text-gray-200 inline-flex items-center gap-1">
        <on type="click">
          <!-- 접힘/펼침만 바꾼다 — 고른 값은 그대로 둔다. -->
          <set-state target="global" moduleLayoutSourceOpen="{{_global.moduleLayoutSourceOpen !== true}}"/>
        </on>
        <icon name="{{_global.moduleLayoutSourceOpen === true ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'}}" class="text-xs"/>
        <span>$t:admin.modules.modals.layout_source_advanced</span>
      </button>
      <div data-ref="module_refresh_layouts_layout_source_options" data-if="{{_global.moduleLayoutSourceOpen === true}}" class="mt-2 p-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg">
        <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:admin.modules.modals.layout_source_title</div>
        <p class="text-tertiary mb-2">$t:admin.modules.modals.layout_source_help</p>
        <div class="row-stack">
          <label class="flex-start gap-2 p-2 rounded cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
            <input type="radio" name="module_refresh_layouts_layout_source" value="auto" checked="{{(_global.moduleLayoutSource ?? 'auto') === 'auto'}}" class="radio mt-0.5">
              <on type="change">
                <!-- 자동(권장) — .g7.html 을 우선 설치하고 없으면 .json 을 쓴다. 기본값. -->
                <set-state target="global" moduleLayoutSource="auto"/>
              </on>
            </input>
            <div>
              <span class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:admin.modules.modals.layout_source_auto</span>
              <p class="text-tertiary">$t:admin.modules.modals.layout_source_auto_desc</p>
            </div>
          </label>
          <label class="flex-start gap-2 p-2 rounded cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
            <input type="radio" name="module_refresh_layouts_layout_source" value="json" checked="{{(_global.moduleLayoutSource ?? 'auto') === 'json'}}" class="radio mt-0.5">
              <on type="change">
                <!-- 원본 JSON 우선(문제 해결용) — 짝 .json 이 있는 화면은 .g7.html 대신 원본 JSON 으로 설치한다. -->
                <set-state target="global" moduleLayoutSource="json"/>
              </on>
            </input>
            <div>
              <span class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:admin.modules.modals.layout_source_json</span>
              <p class="text-tertiary">$t:admin.modules.modals.layout_source_json_desc</p>
            </div>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isModuleRefreshingLayouts}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-amber-700 dark:bg-amber-700 text-white rounded-lg hover:bg-amber-800 dark:hover:bg-amber-800 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isModuleRefreshingLayouts}}">
        <on type="click">
          <!-- 다시 심기 실행. 성공 갈래가 대상을 비우므로 **요청 본문은 그 전에 조립된 값을 쓴다**. -->
          <sequence>
            <set-state target="global" :isModuleRefreshingLayouts="true"/>
            <api-call :auth_required="true" target="/api/admin/modules/refresh-layouts" method="POST">
              <success>
                <set-state target="global" :isModuleRefreshingLayouts="false"/>
                <toast type="success" message="$t:admin.modules.refresh_layouts_success"/>
                <refetch-data-source dataSourceId="modules"/>
                <close-modal/>
                <set-state target="global" :selectedModule="null" moduleLayoutSource="auto" :moduleLayoutSourceOpen="false"/>
              </success>
              <fail>
                <set-state target="global" :isModuleRefreshingLayouts="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body module_name="{{_global.selectedModule.identifier}}" layout_source="{{_global.moduleLayoutSource ?? 'auto'}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isModuleRefreshingLayouts}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isModuleRefreshingLayouts ? '$t:admin.modules.refreshing_layouts' : '$t:admin.modules.actions.refresh_layouts'}}</span>
      </button>
    </div>
  </modal>
</partial>
