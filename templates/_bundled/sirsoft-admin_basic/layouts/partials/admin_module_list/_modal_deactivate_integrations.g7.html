<!-- 끄려는 모듈을 **다른 활성 확장이 연동으로 쓰고 있을 때**의 확인 창(코어 7.1.4 · #822).
  연동(integrations)은 의존과 달리 끄는 것을 막지 않는다 — 그 확장에서 이 모듈을 쓰던 메뉴·화면이 사라진다는 것만
  알리고 진행한다. 연동 중인 확장 목록은 목록 행의 `integrated_by` 를 읽는다(스위치가 `selectedModule` 에 담아 연다).
  비활성 호출은 목록 스위치와 같다 — 의존하는 쪽이 있어 서버가 409 로 거절하면 이 창을 닫고 강제 비활성 창으로 넘긴다.
  스위치는 여는 쪽이 이미 서버 값으로 되돌려 두었으므로 취소는 창만 닫는다. -->
<partial description="모듈 비활성화 연동 안내 모달" editor_label="$t:admin.modal_label.admin_module_list.module_deactivate_integrations_modal">
  <modal data-type="composite" data-ref="module_deactivate_integrations_modal" title="$t:admin.extension_integrations.deactivate_notice_title" size="sm">
    <div class="py-2">
      <div class="alert-warning">
        <icon name="exclamation-triangle" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0"/>
        <p class="text-warning-soft">$t:admin.extension_integrations.deactivate_notice_body|name={{_global.selectedModule?.name ?? _global.selectedModule?.identifier ?? ''}}</p>
      </div>
      <p class="mt-3 text-body font-medium">$t:admin.extension_integrations.integrated_by_label</p>
      <div data-ref="module_integrated_by_list" class="mt-2 row-stack">
        <div data-each="item in _global.selectedModule?.integrated_by ?? []" class="flex-center flex-wrap gap-2 p-2 bg-gray-50 dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-700">
          <icon data-if="{{item.type === 'module'}}" name="cube" class="text-base text-gray-500 dark:text-gray-400" aria-hidden="true"/>
          <icon data-if="{{item.type === 'plugin'}}" name="puzzle-piece" class="text-base text-gray-500 dark:text-gray-400" aria-hidden="true"/>
          <icon data-if="{{item.type === 'template'}}" name="palette" class="text-base text-gray-500 dark:text-gray-400" aria-hidden="true"/>
          <span class="text-body break-words">{{item.name || item.identifier}} ({{item.identifier}})</span>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary" disabled="{{_global.isModuleIntegrationDeactivating}}">
        <on type="click">
          <!-- 취소 — 스위치는 여는 쪽이 이미 서버 값으로 되돌려 두었으므로 창만 닫는다. -->
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg hover:bg-gray-800 dark:hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isModuleIntegrationDeactivating}}">
        <on type="click">
          <!-- 비활성 실행 — 목록 스위치의 비활성 갈래와 같은 호출이다. 성공하면 목록·사이드바 메뉴·확장 번들을 갱신하고,
               의존하는 쪽이 있어 409 로 거절되면 이 창을 닫고 강제 비활성 창을 연다(그 창이 의존 목록을 보이고 강제 여부를 묻는다). -->
          <sequence>
            <set-state target="global" :isModuleIntegrationDeactivating="true"/>
            <api-call :auth_required="true" target="/api/admin/modules/deactivate" method="POST">
              <success>
                <set-state target="global" :isModuleIntegrationDeactivating="false"/>
                <parallel>
                  <toast type="success" message="$t:admin.modules.deactivate_success"/>
                  <refetch-data-source dataSourceId="modules"/>
                  <refetch-data-source dataSourceId="admin_menu"/>
                  <refetch-data-source dataSourceId="auto_deactivated_banner"/>
                  <reload-extensions moduleInfo="{{result.data?.module ?? result}}" action="remove"/>
                </parallel>
                <close-modal/>
                <!-- 일부 항목이 실패했으면(응답 data.warnings, 코어 7.1.3) 노란 경고 결과 창을 연다 — 다른 창을 닫은 뒤라 맨 끝에 둔다. -->
                <set-state target="global" lifecycleWarnings="{{response?.data?.warnings ?? []}}" :lifecycleWarningsOpen="false"/>
                <open-modal if="{{(response?.data?.warnings?.length ?? 0) &gt; 0}}" target="lifecycle_warnings_modal"/>
              </success>
              <fail>
                <set-state target="global" :isModuleIntegrationDeactivating="false"/>
                <toast type="error" message="{{error.message}}"/>
                <refetch-data-source dataSourceId="modules"/>
              </fail>
              <error-handling>
                <on-code code="409">
                  <!-- 409(이 모듈에 의존하는 쪽이 있음)는 fail 을 거치지 않는다 — 이 창을 닫고 의존 목록을 담아 강제 비활성 창으로 넘긴다. -->
                  <sequence>
                    <set-state target="global" :isModuleIntegrationDeactivating="false"/>
                    <refetch-data-source dataSourceId="modules"/>
                    <close-modal/>
                    <!-- 같은 확장에 다른 작업(설치·업데이트·활성화 등)이 진행 중이라 거절된 409(errors.operation_in_progress, 코어 7.1.5)는
                         의존 경고·강제 비활성 창 응답과 다르다 — 창을 열지 않고 서버 문구를 안내 토스트로 보인다(#161). -->
                    <toast if="{{error.errors?.operation_in_progress}}" type="info" message="{{error.message}}"/>
                    <set-state if="{{!error.errors?.operation_in_progress}}" target="global" deactivateWarningData="{{error.errors ?? null}}"/>
                    <open-modal if="{{!error.errors?.operation_in_progress}}" target="module_force_deactivate_modal"/>
                  </sequence>
                </on-code>
              </error-handling>
              <body module_name="{{_global.selectedModule.identifier}}"/>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isModuleIntegrationDeactivating}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isModuleIntegrationDeactivating ? '$t:admin.modules.deactivating' : '$t:admin.extension_integrations.deactivate_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
