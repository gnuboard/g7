<partial description="역할 삭제 확인 모달" editor_label="$t:admin.modal_label.admin_role_list.delete_confirm_modal">
  <modal data-ref="delete_confirm_modal" title="$t:admin.roles.modals.delete_title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:admin.roles.modals.delete_confirm</p>
    <div class="modal-footer-buttons">
      <button class="btn btn-secondary" disabled="{{_global.isDeleting}}"><on type="click"><close-modal target="delete_confirm_modal"/></on>$t:common.cancel</button>
      <button class="flex-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <set-state target="global" :isDeleting="true"/>
          <api-call :auth_required="true" target="/api/admin/roles/{{_global.deleteTargetId}}" method="DELETE">
            <success>
              <set-state target="global" :isDeleting="false"/>
              <set-state target="global" :deleteTargetId="null" deleteTargetName=""/>
              <toast type="success" message="$t:admin.roles.modals.delete_success"/>
              <refetch-data-source dataSourceId="roles"/>
              <close-modal target="delete_confirm_modal"/>
            </success>
            <fail>
              <set-state target="global" :isDeleting="false"/>
              <toast type="error" message="{{error.message ?? $t:admin.roles.errors.delete_failed}}"/>
            </fail>
          </api-call>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
