<!-- 알림 발송 기록의 검색 조건 영역. 다른 목록 화면과 같은 흐름이다 — 고른 값은 로컬 `filter` 에
  쌓였다가 검색 버튼이나 Enter 가 주소 질의로 옮길 때 조회된다.
  조건은 둘뿐이고 둘 다 코드에 박힌 고정 목록이다: 발송 결과(보냄·실패·건너뜀)와 그 알림을
  낸 쪽(코어·모듈·플러그인). 어느 모듈·플러그인인지까지는 여기서 못 좁히고 표에서 읽는다. -->
<partial description="Notification Log List Filter Section">
  <div data-ref="filter_section" class="admin-card">
    <div data-ref="search_row" class="mb-4">
      <div class="flex-center gap-2">
        <select name="searchType" class="select-composite w-36" value="{{_local.filter.searchType || 'all'}}">
          <options>
            <option value="all">$t:admin.notification_log.filter.search_type_all</option>
            <option value="recipient">$t:admin.notification_log.filter.search_type_recipient</option>
            <option value="subject">$t:admin.notification_log.filter.search_type_subject</option>
          </options>
          <on type="change">
            <!-- 검색어를 받는 사람 쪽에서 찾을지 제목에서 찾을지 정한다 — 본문은 대상이 아니다(길어서 목록 질의에 태우지 않는다). -->
            <set-state target="local" filter.searchType="{{$event.target.value}}"/>
          </on>
        </select>
        <div class="relative flex-1">
          <icon name="fa-solid fa-search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 text-sm pointer-events-none"/>
          <input name="search" type="text" placeholder="$t:admin.notification_log.search_placeholder" class="input pl-10" value="{{_local.filter.search || ''}}">
            <on type="change">
              <!-- 받는 사람으로 찾을 때는 회원 이름뿐 아니라 비회원에게 보낸 주소·번호도 걸린다(그쪽은 회원 연결 없이 식별자만 남는다). -->
              <set-state target="local" filter.search="{{$event.target.value}}"/>
            </on>
            <on type="keydown" key="Enter">
              <action-ref name="searchNotificationLogs"/>
            </on>
          </input>
        </div>
      </div>
    </div>
    <div data-ref="filter_grid" class="filter-grid">
      <div data-ref="status_filter" class="filter-row">
        <span class="filter-label w-32">$t:admin.notification_log.filter.status_label</span>
        <div class="flex-center flex-wrap gap-2">
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{!_local.filter.statuses || _local.filter.statuses.length === 0}}">
              <on type="change">
                <!-- 결과 「전체」 = 고른 것 없음. 아래 셋을 다 켜는 것과 결과는 같지만 질의에서 조건이 아예 빠진다. -->
                <set-state target="local" filter.statuses="{{[]}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.filter.status_all</span>
          </label>
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{(_local.filter.statuses || []).includes('sent')}}">
              <on type="change">
                <!-- 채널로 넘긴 데까지 성공한 것. 상대가 실제로 받아 읽었는지까지는 이 기록이 알지 못한다. -->
                <set-state target="local" filter.statuses="{{$event.target.checked ? [...(_local.filter.statuses || []).filter(s => s !== 'sent'), 'sent'] : (_local.filter.statuses || []).filter(s => s !== 'sent')}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.status_sent</span>
          </label>
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{(_local.filter.statuses || []).includes('failed')}}">
              <on type="change">
                <!-- 보내려다 실패한 것 — 줄을 펼치면 사유가 나온다. 설정 점검의 출발점이 되는 갈래다. -->
                <set-state target="local" filter.statuses="{{$event.target.checked ? [...(_local.filter.statuses || []).filter(s => s !== 'failed'), 'failed'] : (_local.filter.statuses || []).filter(s => s !== 'failed')}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.status_failed</span>
          </label>
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{(_local.filter.statuses || []).includes('skipped')}}">
              <on type="change">
                <!-- **보내려는 시도조차 없었던** 갈래다. 발송 직전 걸러진 것으로, 사유는 넷 중 하나다 —
                  비회원에게 열어 두지 않은 채널 · 그 확장이 채널을 꺼 둠 · 채널 설정이 덜 됨 ·
                  그 알림 종류에 쓸 활성 템플릿 없음. 「보낸 적 없는데 기록만 있다」로 보이는 줄이
                  대개 여기라, 알림이 안 온다는 문의는 이 갈래부터 본다. -->
                <set-state target="local" filter.statuses="{{$event.target.checked ? [...(_local.filter.statuses || []).filter(s => s !== 'skipped'), 'skipped'] : (_local.filter.statuses || []).filter(s => s !== 'skipped')}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.status_skipped</span>
          </label>
        </div>
      </div>
      <div data-ref="extension_type_filter" class="filter-row">
        <span class="filter-label w-32">$t:admin.notification_log.filter.extension_type_label</span>
        <div class="flex-center flex-wrap gap-2">
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{!_local.filter.extensionTypes || _local.filter.extensionTypes.length === 0}}">
              <on type="change">
                <!-- 낸 쪽 「전체」도 비우기다 — 위 결과 조건과 서로 독립이라 둘을 함께 걸 수 있다. -->
                <set-state target="local" filter.extensionTypes="{{[]}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.filter.extension_type_all</span>
          </label>
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{(_local.filter.extensionTypes || []).includes('core')}}">
              <on type="change">
                <!-- 코어가 낸 알림(가입·비밀번호 등). 채널을 켜고 끄는 자리도 낸 쪽 단위라 이 구분이 곧 설정 단위와 같다. -->
                <set-state target="local" filter.extensionTypes="{{$event.target.checked ? [...(_local.filter.extensionTypes || []).filter(m => m !== 'core'), 'core'] : (_local.filter.extensionTypes || []).filter(m => m !== 'core')}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.extension_core</span>
          </label>
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{(_local.filter.extensionTypes || []).includes('module')}}">
              <on type="change">
                <!-- 모듈이 낸 알림 전부를 한 덩이로 본다 — 어느 모듈인지는 표의 「낸 쪽」 칸에 식별자로 따로 붙는다. -->
                <set-state target="local" filter.extensionTypes="{{$event.target.checked ? [...(_local.filter.extensionTypes || []).filter(m => m !== 'module'), 'module'] : (_local.filter.extensionTypes || []).filter(m => m !== 'module')}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.extension_module</span>
          </label>
          <label class="inline-clickable">
            <input type="checkbox" class="checkbox" checked="{{(_local.filter.extensionTypes || []).includes('plugin')}}">
              <on type="change">
                <!-- 플러그인이 낸 알림. 플러그인을 지운 뒤에도 지난 기록은 남으므로 지금 설치돼 있지 않은 식별자가 보일 수 있다. -->
                <set-state target="local" filter.extensionTypes="{{$event.target.checked ? [...(_local.filter.extensionTypes || []).filter(m => m !== 'plugin'), 'plugin'] : (_local.filter.extensionTypes || []).filter(m => m !== 'plugin')}}"/>
              </on>
            </input>
            <span class="text-label">$t:admin.notification_log.extension_plugin</span>
          </label>
        </div>
      </div>
    </div>
    <div data-ref="filter_actions" class="flex justify-center gap-3 mt-6">
      <responsive on="portable" class="flex gap-3 mt-6"/>
      <button type="button" class="btn btn-primary px-6">
        <responsive on="portable" class="btn btn-primary flex-1"/>
        <on type="click">
          <action-ref name="searchNotificationLogs"/>
        </on>
        $t:admin.notification_log.filter.search_button
      </button>
      <!-- 검색 실행. 폼에 담아 둔 조건을 주소로 옮겨 목록을 다시 세운다 -->
      <button type="button" class="btn btn-secondary px-6">
        <responsive on="portable" class="btn btn-secondary flex-1"/>
        <on type="click">
          <sequence>
            <set-state target="local">
              <field name="filter">
                <field name="searchType" value="all"/>
                <field name="search" value=""/>
                <field name="extensionTypes" :value="[]"/>
                <field name="statuses" :value="[]"/>
              </field>
            </set-state>
            <!-- audit:allow layout-list-context-navigate-merge-query 필터 초기화 — 걸려 있던 조건을 전부 비우는 것이 이 버튼의 목적이므로 병합하지 않는다. -->
            <navigate path="/admin/notification-logs" :mergeQuery="false"/>
          </sequence>
        </on>
        $t:admin.notification_log.filter.reset_button
      </button>
    </div>
  </div>
</partial>
