<!-- 한 항목 추이 창. 리포트 목록 행 끝의 추이 아이콘이 그 행의 리포트 이름·저장 라벨을 `_global.analyticsRowTrend` 에
  담고 연다. 화면의 데이터소스 `analytics_row_trend` 가 그 값에 매여 따라 받는다(기간·제외는 지금 주소 그대로).
  차원 집계는 일 단위뿐이라 92일까지는 일, 그 뒤는 주 단위로 온다. 다른 행을 열면 창 제목·요청 라벨이 그 행으로
  바뀌고, 받는 동안은 옛 차트를 흐려 잔상이 새 행의 값으로 읽히지 않게 한다.
  엔진은 실패한 요청에 오류 표식을 싣지 않고 마지막 성공 값(다른 행의 것일 수 있다)이나 fallback 을 성공처럼 준다 —
  그래서 응답의 report·label 이 고른 행과 같을 때만 차트·빈 상태를 그리고, 아니면 오류 카드를 띄운다. -->
<partial description="방문자 통계 — 한 항목 추이 창" editor_label="$t:admin.modal_label.analytics.row_trend_modal">
  <modal data-type="composite" data-ref="analytics_row_trend_modal" title="$t:admin.analytics.row_trend.title|label={{_global.analyticsRowTrend?.label_display ?? ''}}" size="xl">
    <div data-ref="row_trend_body" class="py-2 space-y-3">
      <div data-ref="row_trend_period" data-if="{{analytics_row_trend?.data?.label === _global.analyticsRowTrend?.label &amp;&amp; analytics_row_trend?.data?.report === _global.analyticsRowTrend?.report}}" class="flex-center gap-2 text-label-subtle">
        <span>$t:admin.analytics.row_trend.period|from={{analytics_row_trend?.data?.from ?? ''}}|to={{analytics_row_trend?.data?.to ?? ''}}</span>
        <span>·</span>
        <span>{{$t('admin.analytics.period.units.' + (analytics_row_trend?.data?.unit ?? 'day'))}}</span>
      </div>
      <p data-ref="row_trend_downgraded" data-if="{{analytics_row_trend?.data?.unit_downgraded === true}}" class="text-hint text-xs">$t:admin.analytics.row_trend.unit_downgraded</p>
      <div data-ref="row_trend_chart_wrap" class="relative h-64">
        <blur-until-loaded sources="analytics_row_trend"/>
        <line-chart data-type="composite" data-ref="row_trend_chart" data-if="{{analytics_row_trend?.data?.label === _global.analyticsRowTrend?.label &amp;&amp; analytics_row_trend?.data?.report === _global.analyticsRowTrend?.report &amp;&amp; (analytics_row_trend?.data?.points ?? []).length > 0}}" labels="{{(analytics_row_trend?.data?.points ?? []).map(p => String(p.ts ?? '').slice(5, 10))}}" datasets="{{[{label: $t('admin.analytics.common.visits'), data: (analytics_row_trend?.data?.points ?? []).map(p => p.visits ?? 0), color: '#0EA5E9', fill: true}, {label: $t('admin.analytics.common.hits'), data: (analytics_row_trend?.data?.points ?? []).map(p => p.hits ?? 0), color: '#F59E0B'}]}}" height="100%" :showLegend="true" :showYGrid="true" :showYAxis="true"/>
        <empty-state data-type="composite" data-ref="row_trend_empty" data-if="{{!analytics_row_trend?.loading &amp;&amp; analytics_row_trend?.data?.label === _global.analyticsRowTrend?.label &amp;&amp; analytics_row_trend?.data?.report === _global.analyticsRowTrend?.report &amp;&amp; (analytics_row_trend?.data?.points ?? []).length === 0}}" iconName="chart-line" title="$t:admin.analytics.row_trend.empty" class="py-10"/>
      </div>
      <div data-ref="row_trend_error" data-if="{{!analytics_row_trend?.loading &amp;&amp; !(analytics_row_trend?.data?.label === _global.analyticsRowTrend?.label &amp;&amp; analytics_row_trend?.data?.report === _global.analyticsRowTrend?.report)}}" class="alert-danger">
        <div class="flex-center gap-3">
          <icon name="triangle-exclamation" class="text-xl text-red-600 dark:text-red-400 flex-shrink-0"/>
          <p class="text-error-soft flex-1">$t:admin.analytics.row_trend.error</p>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-secondary">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.close</span>
      </button>
    </div>
  </modal>
</partial>
