<!-- 방문자 통계 공통 기간 바. 모든 통계 화면이 같은 질의 키(`preset`·`from`·`to`·`unit`·`exclude`)를
  쓰고 이동은 전부 `mergeQuery` 라, 화면·탭을 옮겨도 고른 기간이 따라가고 주소를 공유하면 그 화면이
  그대로 열린다. 프리셋을 누르면 URL 에는 프리셋만 남고, 달력 두 칸은 서버가 그 프리셋을 푼 구간을
  되돌려 준 값으로 채워진다(달력을 직접 고치면 반대로 프리셋이 빠진다 — 둘 다 있으면 서버가 날짜를
  우선하므로 하나만 둔다).
  기간·단위·제외를 바꾸는 이동은 `page=1` 을 함께 실어 옛 쪽 번호가 새 기간에 남지 않게 한다.
  이 13개 이동은 **이력에 쌓는다**(`replace` 를 쓰지 않는다) — 기간을 몇 번 바꿔 본 뒤 뒤로 가기로 직전 기간에
  돌아갈 수 있어야 한다는 설계 결정(#682 라운드 4, 검수 지적 ①ⓑ). 쪽 이동·탭 전환은 종전대로 `replace` 다.
  그래서 이 바가 보여 주는 것(고른 프리셋·날짜 두 칸·단위·제외 토글)은 **전부 주소에서 읽는다** — 화면 상태
  (`_local.period`)로 그리면 뒤로 가기는 주소만 되돌리고 바는 직전에 고른 기간을 가리킨 채 남아, 주소와 화면이
  서로 다른 말을 한다(실측: `?preset=30d` 로 돌아갔는데 칩은 90일, 달력은 90일 구간). 프리셋은 주소에 날짜를
  남기지 않으므로 달력 두 칸은 화면이 채워 주는 `_computed.periodFrom`·`periodTo`(서버가 echo 한 구간)를 읽는다.
  이 조각을 쓰는 화면은 `_local.periodPath`(이동 경로)·`_local.periodSource`(새로고침 대상 소스)와
  `_computed.periodFrom`·`periodTo`(달력 두 칸에 넣을 구간)를 채우고, CSV 가 있으면 `_computed.csvUrl`·
  `_computed.csvFilename` 을 둔다.
  파일명은 서버 규약 `analytics-{report}-{from}_{to}.csv` 에 달력 두 칸의 날짜를 채운다 — blob 저장은 응답 헤더의
  이름을 쓰지 못해 화면이 준 이름이 이기므로, 프리셋 이름(30d)만 적으면 어느 기간 파일인지 알 수 없다. -->
<partial description="방문자 통계 공통 기간 바 — 프리셋 8·달력·단위·제외 토글·CSV·새로고침">
  <div data-ref="analytics_period_bar" class="admin-card mb-4">
    <div data-ref="period_bar_row" class="flex flex-wrap items-center gap-2">
      <div data-ref="period_presets" class="flex flex-wrap gap-1">
        <button data-ref="preset_today" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === 'today' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <!-- 누르면 주소만 바꾼다 — 날짜는 서버가 프리셋을 풀어 되돌려 주므로 화면이 계산하지 않는다. -->
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="today" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.today
        </button>
        <button data-ref="preset_yesterday" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === 'yesterday' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="yesterday" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.yesterday
        </button>
        <button data-ref="preset_7d" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === '7d' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="7d" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.7d
        </button>
        <button data-ref="preset_30d" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === '30d' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="30d" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.30d
        </button>
        <button data-ref="preset_90d" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === '90d' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="90d" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.90d
        </button>
        <button data-ref="preset_this_month" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === 'this_month' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="this_month" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.this_month
        </button>
        <button data-ref="preset_last_month" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === 'last_month' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="last_month" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.last_month
        </button>
        <button data-ref="preset_this_year" type="button" class="{{(query.from ? '' : (query.preset || '7d')) === 'this_year' ? 'btn-date active' : 'btn-date cursor-pointer'}}">
          <on type="click">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query preset="this_year" from="{{undefined}}" to="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
          $t:admin.analytics.period.presets.this_year
        </button>
      </div>
      <!-- 두 칸은 지금 조건의 날짜 범위를 보여 준다. 프리셋이면 URL 에 날짜가 없으므로 화면이 넘겨 준
        `_computed.periodFrom`·`periodTo` 를 읽는다 — 그 값은 서버가 되돌려 준 구간이라 기간 해석이 서버와
        어긋나지 않고, 뒤로 가기처럼 화면을 다시 만들지 않는 이동에서도 주소를 따라간다(첫 응답이 오기 전
        한 순간만 초기화가 계산해 둔 값을 쓴다). 한 칸을 고치면 다른 칸은 화면에 보이던 값을 잇고,
        시작이 끝보다 늦어지면 그 하루로 줄인다 — 뒤집힌 기간은 서버가 422 로 거절한다. 비운 칸은 기간을 바꾸지 않는다.
        좁은 화면에서는 두 칸이 카드 폭을 나눠 쓴다(고정 폭 두 칸이 390px 카드 안쪽보다 넓다). -->
      <div data-ref="period_dates" class="flex items-center gap-1 w-full sm:w-auto">
        <input data-ref="period_from" name="analytics_period_from" type="date" class="input flex-1 min-w-0 sm:flex-none sm:w-40" value="{{_computed.periodFrom || ''}}" aria-label="$t:admin.analytics.period.from">
          <on type="change">
            <!-- 달력을 직접 고치면 프리셋 표시가 빠진다 — 버튼이 만든 범위를 손으로 바꾼 순간 그 버튼은 지금 조건이 아니다. -->
            <sequence if="{{!!$event.target.value}}">
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query from="{{$event.target.value}}" to="{{(function(f, t) { return t &amp;&amp; t >= f ? t : f; })($event.target.value, _computed.periodTo || '')}}" preset="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
        </input>
        <span class="text-gray-400 dark:text-gray-500">~</span>
        <input data-ref="period_to" name="analytics_period_to" type="date" class="input flex-1 min-w-0 sm:flex-none sm:w-40" value="{{_computed.periodTo || ''}}" aria-label="$t:admin.analytics.period.to">
          <on type="change">
            <sequence if="{{!!$event.target.value}}">
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query from="{{(function(f, t) { return f &amp;&amp; t >= f ? f : t; })(_computed.periodFrom || '', $event.target.value)}}" to="{{$event.target.value}}" preset="{{undefined}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
        </input>
      </div>
      <select data-ref="period_unit" data-if="{{_local.showUnit === true}}" name="analytics_period_unit" class="w-28" value="{{query.unit || 'auto'}}" aria-label="$t:admin.analytics.period.unit_label">
        <options>
          <option value="auto">$t:admin.analytics.period.units.auto</option>
          <option value="hour">$t:admin.analytics.period.units.hour</option>
          <option value="day">$t:admin.analytics.period.units.day</option>
          <option value="week">$t:admin.analytics.period.units.week</option>
          <option value="month">$t:admin.analytics.period.units.month</option>
          <option value="year">$t:admin.analytics.period.units.year</option>
        </options>
        <on type="change">
          <!-- 시계열 단위. `auto` 는 서버 기본이라 질의에서 뺀다. -->
          <sequence>
            <navigate path="{{_local.periodPath}}" :mergeQuery="true">
              <query unit="{{$event.target.value === 'auto' ? undefined : $event.target.value}}" :page="1"/>
            </navigate>
          </sequence>
        </on>
      </select>
      <div data-ref="period_excludes" data-if="{{_local.showExclude !== false}}" class="flex items-center gap-3">
        <toggle data-ref="exclude_admin_toggle" checked="{{(query.exclude || '').split(',').filter(Boolean).includes('admin')}}" size="sm" label="$t:admin.analytics.period.exclude_admin">
          <on type="change">
            <!-- 「관리자 제외」 — 합산에서 관리자 유형 행을 뺀다. 질의에는 콤마로 묶어 싣고, 비면 키를 지운다. -->
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query exclude="{{(function(cur, on) { const next = on ? [...cur.filter(t =&gt; t !== 'admin'), 'admin'] : cur.filter(t =&gt; t !== 'admin'); return next.length > 0 ? next.join(',') : undefined; })((query.exclude || '').split(',').filter(Boolean), ($event?.target?.checked ?? $event) === true)}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
        </toggle>
        <toggle data-ref="exclude_member_toggle" checked="{{(query.exclude || '').split(',').filter(Boolean).includes('member')}}" size="sm" label="$t:admin.analytics.period.exclude_member">
          <on type="change">
            <sequence>
              <navigate path="{{_local.periodPath}}" :mergeQuery="true">
                <query exclude="{{(function(cur, on) { const next = on ? [...cur.filter(t =&gt; t !== 'member'), 'member'] : cur.filter(t =&gt; t !== 'member'); return next.length > 0 ? next.join(',') : undefined; })((query.exclude || '').split(',').filter(Boolean), ($event?.target?.checked ?? $event) === true)}}" :page="1"/>
              </navigate>
            </sequence>
          </on>
        </toggle>
      </div>
      <div class="flex-1"/>
      <!-- 모바일에서는 기간 바 아래 전폭 — 390px 에서 칩 사이에 끼면 눌리는 면적이 칩 하나만 해진다(계획서 §4.11). -->
      <button data-ref="csv_download_button" data-if="{{!!_computed.csvUrl}}" type="button" class="btn btn-secondary btn-sm flex-center gap-1.5 w-full sm:w-auto">
        <on type="click">
          <!-- CSV 는 토큰이 실리는 blob 요청으로 받는다 — `<a href>` 는 Authorization 이 없어 401 이다. -->
          <action handler="downloadAttachment" url="{{_computed.csvUrl}}" filename="{{_computed.csvFilename ?? 'analytics.csv'}}"/>
        </on>
        <icon name="download" size="sm"/>
        <span>$t:admin.analytics.common.csv_download</span>
      </button>
      <button data-ref="period_refresh_button" type="button" class="btn-icon" aria-label="$t:admin.analytics.common.refresh">
        <on type="click">
          <refetch-data-source dataSourceId="{{_local.periodSource}}"/>
        </on>
        <icon name="refresh" class="text-xl"/>
      </button>
    </div>
    <!-- 주소로 들어온 기간이 서버 한도(366일, `PeriodRequest::MAX_RANGE_DAYS`)를 넘으면 그 자리에서 알린다.
      요청은 422 로 거절되는데 다시 시도해도 풀리지 않으므로, 실패 카드가 아니라 기간 바가 원인을 말해야 한다.
      프리셋은 한도를 넘지 않으므로 직접 지정 기간(`from`)만 본다. -->
    <p data-ref="period_range_error" data-if="{{!!query.from &amp;&amp; Math.round((Date.parse(query.to || query.from) - Date.parse(query.from)) / 86400000) + 1 > 366}}" class="mt-2 text-sm text-red-600 dark:text-red-400">$t:admin.analytics.period.range_too_long|days=366</p>
  </div>
</partial>
