<layout name="admin_forgot_password" version="1.0.0">
  <meta title="$t:auth.forgot_password.title" description="관리자 비밀번호 찾기 페이지" :auth_required="false"/>
  <init>
    <action handler="initTheme" target="{{query.theme}}"/>
    <set-state target="local" :isSubmitting="false" :success="false" :forgotError="null" :forgotErrors="null"/>
  </init>
  <div data-ref="forgot_page_wrapper" class="flex-center min-h-screen justify-center bg-gray-50 dark:bg-gray-900 px-4 sm:px-6 lg:px-8">
    <div data-ref="forgot_card_container" class="max-w-md w-full space-y-8">
      <div data-ref="forgot_card" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8">
        <!-- 헤더 -->
        <div data-ref="forgot_header" class="text-center mb-8">
          <div data-ref="forgot_lock_icon_wrapper" class="flex-center w-16 h-16 mx-auto mb-4 bg-blue-100 dark:bg-blue-900/30 rounded-full justify-center">
            <icon data-ref="forgot_lock_icon" name="lock" size="xl" color="text-blue-600 dark:text-blue-400"/>
          </div>
          <h1 data-ref="forgot_title" class="text-page-heading mb-2">$t:auth.forgot_password.title</h1>
          <p data-ref="forgot_subtitle" data-if="{{!_local.success}}" class="text-label">$t:auth.forgot_password.subtitle</p>
        </div>
        <!-- 성공 메시지 -->
        <div data-ref="forgot_success_message" data-if="{{_local.success}}" class="alert-success">
          <p data-ref="forgot_success_text" class="text-success-soft text-sm text-center">$t:auth.forgot_password.success</p>
        </div>
        <!-- 폼 -->
        <form data-ref="forgot_form" data-if="{{!_local.success}}">
          <on type="submit">
            <set-state target="local" :isSubmitting="true" :forgotError="null" :forgotErrors="null"/>
            <api-call target="/api/auth/forgot-password" method="POST">
              <success>
                <set-state target="local" :isSubmitting="false" :success="true"/>
              </success>
              <fail>
                <set-state target="local" :isSubmitting="false" forgotError="{{error.message ?? ''}}" forgotErrors="{{error.errors ?? null}}"/>
              </fail>
              <body email="{{form.email}}" redirect_prefix="admin"/>
            </api-call>
          </on>
          <!-- 일반 에러 메시지 (필드 에러가 아닌 경우) -->
          <div data-ref="forgot_error_message" data-if="{{_local.forgotError &amp;&amp; !_local.forgotErrors}}" class="alert-danger">
            <p data-ref="forgot_error_text" class="text-error-soft text-center">{{_local.forgotError}}</p>
          </div>
          <!-- 이메일 입력 -->
          <div data-ref="forgot_email_field">
            <label data-ref="forgot_email_label" for="email" class="form-label">$t:auth.forgot_password.email</label>
            <input data-ref="forgot_email_input" id="email" type="email" name="email" placeholder="$t:auth.forgot_password.email_placeholder" class="{{_local.forgotErrors?.email ? 'input-error px-4 disabled:opacity-50 disabled:cursor-not-allowed' : 'px-4 disabled:opacity-50 disabled:cursor-not-allowed'}}" :required="true" disabled="{{_local.isSubmitting ?? false}}"/>
            <p data-ref="forgot_email_error" data-if="{{_local.forgotErrors?.email}}" class="mt-2 text-sm text-red-600 dark:text-red-400">{{Array.isArray(_local.forgotErrors?.email) ? _local.forgotErrors.email[0] : _local.forgotErrors?.email}}</p>
          </div>
          <div>
            <!-- 제출 버튼 -->
            <button data-ref="forgot_submit_button" type="submit" class="flex-center w-full px-4 py-3 rounded-lg font-medium bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200 justify-center gap-2" disabled="{{_local.isSubmitting ?? false}}">
              <div data-ref="forgot_submit_spinner" data-if="{{_local.isSubmitting}}" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/>
              <span data-ref="forgot_submit_text" data-if="{{!_local.isSubmitting}}">$t:auth.forgot_password.submit</span>
              <span data-ref="forgot_submit_processing" data-if="{{_local.isSubmitting}}">$t:auth.forgot_password.processing</span>
            </button>
          </div>
        </form>
        <!-- 로그인 링크 -->
        <div data-ref="forgot_back_to_login" class="mt-6 text-center">
          <button data-ref="forgot_login_link" type="button" class="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-500 dark:hover:text-blue-300 transition-colors duration-200 cursor-pointer"><on type="click"><navigate path="/admin/login"/></on>$t:auth.forgot_password.back_to_login</button>
        </div>
      </div>
      <!-- 언어 셀렉터 -->
      <div data-ref="forgot_language_selector_container" class="mt-6">
        <select data-ref="forgot_language_selector" class="block w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm" value="{{$locale}}" options="{{$locales}}">
          <on type="change">
            <set-locale target="{{$event.target.value}}"/>
          </on>
        </select>
      </div>
      <!-- 테마 Segmented Control -->
      <div data-ref="forgot_theme_selector_container" class="mt-4 flex justify-center">
        <div data-ref="forgot_theme_segmented_control" class="inline-flex bg-gray-100 dark:bg-gray-800 rounded-lg p-1 gap-1">
          <button data-ref="forgot_theme_light_button" type="button" class="{{_global.theme === 'light' ? 'p-2 rounded-md bg-white dark:bg-gray-700 shadow-sm text-blue-600 dark:text-blue-400 transition-all duration-200' : 'p-2 rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-all duration-200'}}" title="$t:admin.theme.light">
            <on type="click">
              <action handler="setTheme" theme="light"/>
            </on>
            <icon data-ref="forgot_theme_light_icon" name="sun" size="sm"/>
          </button>
          <button data-ref="forgot_theme_dark_button" type="button" class="{{_global.theme === 'dark' ? 'p-2 rounded-md bg-white dark:bg-gray-700 shadow-sm text-blue-600 dark:text-blue-400 transition-all duration-200' : 'p-2 rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-all duration-200'}}" title="$t:admin.theme.dark">
            <on type="click">
              <action handler="setTheme" theme="dark"/>
            </on>
            <icon data-ref="forgot_theme_dark_icon" name="moon" size="sm"/>
          </button>
          <button data-ref="forgot_theme_auto_button" type="button" class="{{_global.theme === 'auto' || !_global.theme ? 'p-2 rounded-md bg-white dark:bg-gray-700 shadow-sm text-blue-600 dark:text-blue-400 transition-all duration-200' : 'p-2 rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-all duration-200'}}" title="$t:admin.theme.auto">
            <on type="click">
              <action handler="setTheme" theme="auto"/>
            </on>
            <icon data-ref="forgot_theme_auto_icon" name="desktop" size="sm"/>
          </button>
        </div>
      </div>
    </div>
  </div>
</layout>
