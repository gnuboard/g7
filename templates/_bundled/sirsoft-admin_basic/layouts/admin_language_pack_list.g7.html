<layout name="admin_language_pack_list" version="1.1.0" extends="_admin_base">
  <meta title="$t:admin.language_packs.page_title" description="$t:admin.language_packs.page_description"/>
  <data-source id="language_packs" label_key="$t:editor.data_source.language_packs" type="api" endpoint="/api/admin/language-packs" method="GET" :auto_fetch="true" :auth_required="true">
    <params page="{{query.page}}" per_page="{{query.per_page ?? 10}}" scope="{{route.path &amp;&amp; route.path.indexOf('/admin/modules/') === 0 ? 'module' : (route.path &amp;&amp; route.path.indexOf('/admin/plugins/') === 0 ? 'plugin' : (route.path &amp;&amp; route.path.indexOf('/admin/templates/') === 0 ? 'template' : query.scope))}}" target_identifier="{{route.identifier || query.target_identifier}}" locale="{{query.locale}}" status="{{query.status}}" search="{{query.search}}" exclude_protected="{{query.exclude_protected ?? '1'}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="total" :value="0"/>
          <field name="active" :value="0"/>
          <field name="installed" :value="0"/>
          <field name="inactive" :value="0"/>
          <field name="error" :value="0"/>
        </field>
        <field name="abilities" :value="[]"/>
      </field>
    </fallback>
  </data-source>
  <data-source id="language_pack_detail" label_key="$t:editor.data_source.language_pack_detail" type="api" endpoint="/api/admin/language-packs/{{_local.detailId}}" method="GET" :auto_fetch="false" :auth_required="true">
    <field name="depends_on">
      <item>_local.detailId</item>
    </field>
  </data-source>
  <data-source id="language_pack_changelog" label_key="$t:editor.data_source.language_pack_changelog" type="api" endpoint="/api/admin/language-packs/{{_local.detailId}}/changelog" method="GET" :auto_fetch="false" :auth_required="true">
    <field name="depends_on">
      <item>_local.detailId</item>
    </field>
  </data-source>
  <init-local>
    <field name="filterScope" value=""/>
    <field name="filterLocale" value=""/>
    <field name="filterStatus" value=""/>
    <field name="filterTarget" value=""/>
    <field name="filterSearch" value=""/>
    <field name="scopeLocked" :value="false"/>
    <field name="detailId" :value="null"/>
    <field name="updateId" :value="null"/>
    <field name="updateCurrent" :value="null"/>
    <field name="updateLatest" :value="null"/>
    <field name="uninstallId" :value="null"/>
    <field name="uninstallScope" :value="null"/>
    <field name="uninstallTarget" :value="null"/>
    <field name="uninstallLocale" :value="null"/>
    <field name="uninstallCascade" :value="false"/>
    <field name="showInstallModal" :value="false"/>
    <field name="installTab" value="zip"/>
    <field name="installFile" :value="null"/>
    <field name="githubUrl" value=""/>
    <field name="downloadUrl" value=""/>
    <field name="checksum" value=""/>
    <field name="autoActivate" :value="false"/>
    <field name="installingIdentifier" :value="null"/>
  </init-local>
  <permissions>
    <permission>core.language_packs.read</permission>
  </permissions>
  <transition-overlay>
    <wait-for>language_packs</wait-for>
  </transition-overlay>
  <init>
    <set-state target="local" filterScope="{{route.path &amp;&amp; route.path.indexOf('/admin/modules/') === 0 ? 'module' : (route.path &amp;&amp; route.path.indexOf('/admin/plugins/') === 0 ? 'plugin' : (route.path &amp;&amp; route.path.indexOf('/admin/templates/') === 0 ? 'template' : (query.scope || '')))}}" filterTarget="{{route.identifier ?? ''}}" scopeLocked="{{route.identifier ? true : false}}" filterSearch="{{query.search || ''}}" filterStatus="{{query.status || ''}}" filterLocale="{{query.locale || ''}}"/>
  </init>
  <slot name="content">
    <div data-ref="lang_pack_page_wrapper" class="admin-page-content-responsive-fluid">
      <include src="partials/admin_extension_language_packs/_content.g7.html"/>
    </div>
  </slot>
  <modal src="partials/admin_language_pack_list/_modal_install.g7.html"/>
  <modal src="partials/admin_language_pack_list/_modal_install_bundled.g7.html"/>
  <modal src="partials/admin_language_pack_list/_modal_detail.g7.html"/>
  <modal src="partials/admin_language_pack_list/_modal_update.g7.html"/>
  <modal src="partials/admin_language_pack_list/_modal_uninstall.g7.html"/>
  <modal src="partials/admin_language_pack_list/_modal_refresh_cache.g7.html"/>
  <modal src="partials/admin_language_pack_list/_modal_slot_conflict.g7.html"/>
  <modal src="partials/admin_language_pack_list/_drawer_manifest_preview.g7.html"/>
</layout>
