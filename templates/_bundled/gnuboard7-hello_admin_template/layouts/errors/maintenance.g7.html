<!-- 관리자 점검 안내 화면 — 점검 모드가 켜졌을 때 대신 뜬다 -->
<layout name="errors/maintenance" version="1.0.0" extends="_admin_base">
  <meta title="$t:errors.maintenance.title" :is_error_layout="true"/>
  <slot name="content">
    <div data-ref="error_container" class="flex-center flex-col justify-center min-h-[60vh] text-center p-8">
      <h1 data-ref="error_title" class="text-primary text-3xl font-bold mb-4">$t:errors.maintenance.title</h1>
      <span data-ref="error_message" class="text-gray-500 dark:text-gray-400">$t:errors.maintenance.message</span>
    </div>
  </slot>
</layout>
