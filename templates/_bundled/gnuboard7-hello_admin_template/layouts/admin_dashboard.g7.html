<layout name="admin_dashboard" version="1.0.0" extends="_admin_base">
  <meta title="$t:admin.dashboard.title" :auth_required="true"/>
  <slot name="content">
    <div data-ref="dashboard_content" class="p-8">
      <div data-ref="welcome_card" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-8 max-w-2xl" data-testid="welcome-card">
        <h1 data-ref="welcome_title" class="text-page-heading mb-2" data-testid="welcome-title">$t:admin.dashboard.welcome_title</h1>
        <span data-ref="welcome_message" class="text-secondary text-sm" data-testid="welcome-message">$t:admin.dashboard.welcome_message</span>
      </div>
    </div>
  </slot>
</layout>
