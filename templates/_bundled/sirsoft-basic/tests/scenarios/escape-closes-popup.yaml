feature: 펼친 목록 안 어디에서든 Esc 로 닫고 여는 단추로 돌아간다(사용자 템플릿)

description: |
  알림 판, 테마 메뉴, 작성자 메뉴(UserInfo), 검색어 제안은 바깥 클릭으로만 닫혀 목록 안에서 Esc 를 눌러도 열린 채였다
  (키보드 접근). 이제 Esc 로 닫고 여는 단추로 포커스를 돌린다(검색어 제안은 입력칸에 남는다). Esc 는 바깥으로 번지지
  않아 목록을 품은 창(Modal)을 닫지 않고, 여는 단추는 `aria-haspopup` 과 `aria-expanded` 를 단다.

# axis 의미:
#   element — Esc 를 받는 펼침 부품.
axes:
  element: [notification_center, theme_toggle, user_info, search_suggestions]

effects:
  - escape_inside_popup_closes_and_returns_focus   # 목록 안 Esc 로 닫히고 포커스가 여는 단추로 가며 바깥으로 번지지 않는다

test_files:
  - templates/_bundled/sirsoft-basic/src/components/__tests__/escapeClosesPopup.test.tsx
