# audit:allow test-scenario-coverage[cross_product] reason: 회원 응답의 판정 필드 조합 중 성립하는 것만 렌더해 effects 로 잠근다(막힌 회원은 재확인 수단과 무관하게 칸을 숨긴다).

feature: 마이페이지 비밀번호 변경 — 비밀번호를 만들 수 없는 회원과 재확인 수단 안내 (sirsoft-basic, 7.2.0)

description: |
  회원 응답(`/api/me`)의 `can_set_password=false` 면 칸·처음 설정 안내·본인 확인 자리 대신 서버 문구와 내 정보로 돌아가는 길을 보인다.
  메일을 받을 수 없는 비밀번호 없는 회원의 본인 확인 자리 기본 안내는 코어가 실제로 고를 재확인 수단(`reauth_provider`)을 따른다.

axes:
  can_set_password: ['false', 'true']
  has_password: ['false', 'true']
  email_deliverable: ['false', 'true']
  reauth_provider: [external, none]

effects:
  - change_password_shows_unsettable_notice           # 막힌 회원 — 서버 문구·돌아가는 길, 칸·처음 설정 안내·본인 확인 자리 없음
  - change_password_form_unchanged_when_settable      # 만들 수 있는 회원 — 지금 화면 그대로
  - change_password_reauth_notice_follows_actual_method  # 재확인 수단이 있으면 「저장하면 그 방법으로 확인」, 없으면 관리자 문의

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-change-password-availability.test.tsx
