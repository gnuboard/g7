feature: 사용자 공통 오류 화면 — 코드별 레이아웃이 없는 오류 코드

description: |
  엔진은 오류 코드에 맞는 레이아웃이 없으면 error_config.layouts.default → 엔진 내장 오류 화면 순서로 대신 그린다(engine-v1.94.0).
  이 템플릿에 default 가 없어 400·422·429·502·504 는 내장 화면이 머리글과 바닥글까지 화면 전체를 덮었다.
  공통 오류 레이아웃 errors/default 를 두고 default 로 등록한다. 레이아웃은 코드를 박지 않고 엔진이 넘기는 errorCode 를 보이며,
  일반 문구와 새로고침, 홈으로 단추를 둔다. 코드 레이아웃이 있는 코드(404 등)는 그대로 자기 레이아웃으로 그린다.

axes:
  surface: [error_config, engine_fallback, render, layout_contract, lang_keys]

effects:
  - error_default_registered
  - unmapped_code_renders_default_layout
  - mapped_code_keeps_own_layout
  - default_layout_shows_received_code
  - default_layout_has_no_fixed_code
  - default_layout_lang_keys

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/error-default-layout.test.tsx

validation:
  audit_rule: frontend-change-requires-e2e
