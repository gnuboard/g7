feature: 가로 상품 줄 (인기·신상품·최근 본·관련 상품)

description: |
  상품 목록·상세의 가로 상품 줄 네 개가 같은 컨테이너(ProductRail)를 쓴다. 자식 카드는 레이아웃이 넘기고,
  컨테이너가 손가락 넘김과 이전·다음 단추(카드 한 장씩, 끝에서 잠김)를 맡는다. 상품이 없으면 줄째로 숨는다.
  상품 상세는 관련 상품 줄을 따로 받아 온다. 카드에 찜 여부를 싣도록 상품 목록 데이터소스는 로그인 정보를 함께 보낸다.
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16]
  # c01: 제목으로 이름 붙은 section 안에 자식 카드를 그대로 그린다
  # c02: 다음 단추는 첫 카드 폭 + 간격만큼 넘기고, 처음에는 이전 단추가 잠겨 있다
  # c03: 줄 끝에 닿으면 다음 단추가 잠기고, 넘칠 것이 없으면 두 단추 모두 잠긴다
  # c04: 움직임 줄이기 설정이면 부드러운 스크롤을 쓰지 않는다
  # c05: 머리 줄·단추에 다크 모드 짝이 있고 라벨이 없으면 영문 기본값을 쓴다
  # c06: 루트가 ProductRail 이고 제목·넘김 단추 이름을 넘긴다
  # c07: 자식이 그 줄 데이터의 ProductCard 반복이다
  # c08: 줄이 비면 통째로 그리지 않는다
  # c09: 옛 단추형 구조가 레이아웃에 남아 있지 않다
  # c10: 관련 상품 데이터소스가 회원·비회원 모두에게 8개까지 받고 실패해도 빈 목록이다
  # c11: 검색 로봇용 렌더에도 관련 상품이 실리고, 관련 줄이 인기 줄 앞에 온다
  # c12: 쓰이지 않던 계산값(popularItems)을 지웠다
  # c13: 상품 API 데이터소스가 한 개 이상 있고 분류 화면이 포함된다
  # c14: 모두 auth_mode 가 optional 이다
  # c15: 이커머스 연동 요구 버전이 목록 응답 보강이 들어간 1.3.5 이상이다
  # c16: 한 화면 카드 수가 좁은 화면 2·중간 3·넓은 화면 4장이다(트랙 열 폭 = (100% - 간격) / 장수)

effects:
  - rail_wraps_children_in_named_section
  - rail_buttons_scroll_by_one_card
  - rail_buttons_lock_at_edges
  - rail_respects_reduced_motion
  - rail_has_dark_pairs
  - rail_shows_two_three_four_cards_per_screen
  - rails_share_product_rail_container
  - rails_hide_when_empty
  - rails_have_no_legacy_button_scroll
  - related_rail_loaded_on_product_detail
  - product_datasources_send_optional_auth
  - ecommerce_requirement_is_1_4_0

