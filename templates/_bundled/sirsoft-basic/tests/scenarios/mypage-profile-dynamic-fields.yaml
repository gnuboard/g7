feature: 내 정보 수정과 보기 화면은 운영자가 정한 내 정보 항목대로 카드별 칸을 그린다

description: |
  내 정보 수정·보기 화면이 GET /api/me/fields 의 항목 계약으로 회원 항목을 그린다. 화면에 박혀 있던 이름, 닉네임, 연락처,
  국가, 언어, 시간대, 주소, 서명, 자기소개 칸이 사라지고, 카드(기본 정보, 연락처, 위치, 추가 정보, 서명·자기소개)마다 그 묶음의
  항목을 공용 조각이 그린다. 묶음에 항목이 없으면 카드를 그리지 않는다. 위쪽 오류 상자는 어느 칸에도 속하지 않는 오류만 보여 준다.
  아바타, 읽기 전용 이메일과 저장 요청(PUT /api/me, 폼 상태 전체)은 그대로다.
  보기 화면은 같은 데이터소스, 같은 묶음 계산으로 보기 조각을 그린다.

  게시판 알림 4칸, 결제 통화, 배송 국가처럼 모듈과 플러그인이 가진 칸도 화면에 박혀 있지 않다. 그 확장이 회원 항목으로 선언한 것을
  계산값 profileExtensionGroups 가 확장(owner)마다 한 묶음으로 만들고(제목은 source_label, 없으면 owner), 확장별 카드가 그 묶음을 돌며
  같은 공용 조각으로 그린다. 확장 묶음은 약관 묶음(ui.group = agreements) 항목도 함께 그리고, 확장 항목이 없으면 카드가 없다.
  확장 항목의 오류는 그 칸 아래에 뜨므로 위쪽 오류 상자에 다시 넣지 않는다. 선택지를 모듈 전역 설정에서 읽지 않는다.

  표시 이름 종류 선택 칸(#490 8단계)은 항목 계약 응답의 display_name 묶음으로 그린다. 고를 수 있을 때만(can_choose) 닉네임 묶음 아래에 서고,
  선택지는 「기본값(회원 기본 종류)」과 고를 수 있는 종류다. 칸 아래에 그 종류로 보일 이름(미리보기)을 보이고, 종류를 바꾸면 입력해 둔 이름과
  닉네임으로 서버에 다시 계산을 맡긴다. 전에 고른 종류가 허용에서 빠졌으면 다시 골라 달라는 안내와 전에 고른 종류 이름을 보인다(U21).
  닉네임이 필요한 종류면 그 사실을 알린다. 저장 본문은 고를 수 있고 허용된 종류(또는 빈 값)일 때만 display_name_kind 를 싣고,
  저장에 성공하면 로그인 사용자를 다시 받아 헤더의 이름이 바뀐다.

# axis 의미:
#   part — 화면의 어느 부분의 계약인가 (데이터소스, 묶음 계산, 카드, 고정 칸과 앵커, 확장별 카드, 조각 문맥, 위쪽 오류 상자, 저장, 표시 이름 종류 선택, 잠금 안내, 파일 갈래, 보기 화면)
