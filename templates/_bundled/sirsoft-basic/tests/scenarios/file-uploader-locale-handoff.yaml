feature: 언어 전환 때 파일 업로더의 고른 미저장 첨부 넘기기

description: |
  작성 화면(사용자 게시글 작성 등)에서 첨부를 고른 뒤 저장 전에 화면 언어를 바꾸면 재진입 리마운트로 고른 첨부가 사라졌다
  (7.1.0 실측 O-G3-3). 업로더가 언어 전환 중에 내려갈 때만 대기 중 첨부와 순서를 `G7Core.locale.handoff` 에
  맡기고, 다시 올라올 때 한 번 꺼내 쓴다. 올리던 항목은 대기 상태로 되돌린다.

axes:
  case: [locale_switch_remount, normal_unmount, locale_switch_remount_reordered, locale_switch_while_uploading]

effects:
  - file_uploader_pending_files_survive_locale_switch
  - file_uploader_pending_files_not_carried_outside_locale_switch
  - file_uploader_custom_order_survives_locale_switch
  - file_uploader_in_flight_items_back_to_pending

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/FileUploaderLocaleHandoff.test.tsx
