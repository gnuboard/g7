feature: 사이트 헤더 구조(모의 헤더로 본 기본 구성)

description: |
  Header.test.tsx 는 모의 헤더로 사이트 헤더가 갖춰야 할 구성 요소를 고정한다. 사이트 이름과 로고,
  기본 메뉴와 게시판 목록, 로그인 상태에 따른 로그인/회원가입 단추와 사용자 이름, 장바구니 개수 표시가 대상이다.
  실제 Header.tsx 의 prop 반영은 header-prop-render-component.yaml 이 맡는다.

# axis 의미:
#   area — 헤더에서 확인하는 영역.
axes:
  area: [rendering, navigation, user_state, cart_badge]

effects:
  - header_renders_site_identity                 # 헤더와 사이트 이름이 그려지고 로고가 있으면 이미지로 보인다
  - header_shows_menu_and_boards                 # 기본 메뉴 항목과 게시판 목록이 보인다
  - header_auth_controls_follow_login_state      # 비로그인은 로그인/회원가입 단추, 로그인은 사용자 이름을 보인다
  - header_cart_count_shown_only_when_nonempty   # 장바구니에 담긴 것이 있을 때만 개수를 보인다

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/Header.test.tsx
