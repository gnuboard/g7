feature: 쿠폰 모두 받기

description: |
  쿠폰 받기 창과 상품 상세 쿠폰 줄에서 받지 않은 쿠폰을 한 번에 받는다.

  상품 상세에서 연 창은 그 상품에 쓸 수 있는 쿠폰 번호만 보내고, 주문서에서 연 창은 목록을 쪽 단위로 받아 오므로
  번호 없이 보내 서버가 받을 수 있는 전부를 발급한다. 성공하면 받은 쿠폰과 이미 받았다고 답한 쿠폰을 받음으로
  표시하고 목록을 다시 받는다. 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06]
  # c01: 받지 않은 쿠폰이 있을 때만 보이고 진행 중에는 잠긴다
  # c02: 상품 상세에서 연 창은 받지 않은 쿠폰 번호만, 주문서에서 연 창은 번호 없이 보낸다
  # c03: 성공하면 받은·이미 받은 쿠폰을 받음으로 표시하고 재조회·안내·주문서 갱신 순으로 간다
  # c04: 상품 상세의 더보기는 product, 주문서는 all 을 남긴다
  # c05: 받지 않은 쿠폰이 있을 때만 보이고, 비회원이면 요청 대신 로그인 안내를 연다
  # c06: 회원이면 그 상품의 받지 않은 쿠폰 번호로 요청하고 성공하면 목록을 다시 받는다

effects:
  - download_all_shown_only_when_something_left
  - download_all_body_follows_scope
  - download_all_marks_then_refreshes
  - coupon_modal_openers_record_scope
  - detail_download_all_guest_goes_to_login
  - detail_download_all_posts_product_coupons

