feature: 비밀번호 찾기·재설정 — 비밀번호 인증이 막힌 계정 안내 (sirsoft-basic 1.4.0, 코어 7.2.0 B3)

description: |
  회사 계정 로그인이 강제된 계정·도메인이면 비밀번호 찾기·재설정·재설정 링크 확인이 422 `errors.code=auth.password_auth_disabled` 로
  거절된다. 화면은 토스트 대신 조각 `partials/auth/_password_auth_blocked` 로 안내와 그 수단으로 가는 버튼(`errors.redirect_url` 이
  있을 때)을 보인다. 재설정 화면은 안내가 서면 폼을 숨기고, 링크 확인 단계에서는 「링크 무효」 대신 이 안내를 세운다.
  다른 422 는 지금처럼 토스트·링크 무효로 처리한다. 안내 데이터는 `error.errors.*` 로만 읽는다.

axes:
  surface: [forgot_password, reset_password]
  phase: [submit, token_validation]
  response: [password_auth_disabled, other_error]

exclusions:
  - { surface: forgot_password, phase: token_validation, reason: "링크 확인 단계는 재설정 화면에만 있다" }

effects:
  - forgot_password_blocked_shows_notice
  - password_blocked_offers_method_button
  - password_blocked_branch_ignores_other_failures
  - reset_password_blocked_hides_form
  - reset_token_check_blocked_shows_notice
  - password_blocked_reads_error_errors_only

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/forgot-password-disabled.test.tsx
