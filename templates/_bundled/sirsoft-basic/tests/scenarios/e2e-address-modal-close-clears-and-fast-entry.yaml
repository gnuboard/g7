  계정 필요(G7_E2E_TOKEN 등 실행 환경변수) — 없으면 건너뛴다.
  수정 전 대조는 G7_E2E_ENGINE_BUNDLE 로 직전 엔진 번들을 이 브라우저에만 끼운다 — mypage_new_fast_datakey_restored 가 red 여야 한다.
  레이아웃 고침(data-key 걷음)이 그대로인 *_edit_close_then_new_fast 는 옛 엔진에서도 green 일 수 있다(레이아웃 단독 방어).
