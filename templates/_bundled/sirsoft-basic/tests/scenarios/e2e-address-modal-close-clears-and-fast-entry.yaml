feature: 배송지 창 닫으면 이름 공간 비우기 · 수정 창 뒤 새 주소 빠른 입력 저장 본문 브라우저 회귀 (7.1.1)

description: |
  회원 마이페이지 배송지 창과 주문서 「배송지 관리」 창.
  ① 「수정」 창을 닫고 「새 주소」 를 열어 네 칸을 칸 사이 쉼 없이 넣은 뒤 저장 — 등록 POST 1회, 본문에 네 칸이 모두 있고
     앞 배송지 id·값이 섞이지 않으며 PUT 이 없다. 「쉼 없이」 는 칸마다 click 을 거치지 않고(동작 가능 대기가 미뤄진 전역 렌더를
     먼저 흘려보낸다) 한 작업 안에서 네이티브 value setter + input/change 이벤트를 네 칸에 잇달아 보내는 것이다(상태 직접 쓰기 아님).
     저장 성공 갈래도 비운다 — 마이페이지는 창이 닫히며 `_global.editingAddress` 가 null, 주문서는 창이 목록으로 남고
     `_global.checkoutAddressModal.editing` 만 null.
  ② 입력 중인 창을 X·Esc·바깥 클릭·취소·「선택」 으로 닫으면 `_global.editingAddress`·`_global.checkoutAddressModal` 이 null 이다.
     「선택」 은 이름 공간을 비우기 전에 고른 배송지를 이벤트로 넘겨 주문서 배송지 적용 요청(PUT checkout)의 우편번호가 그 배송지다.
  ③ data-key 복원 축 — 마이페이지 배송지 폼 레이아웃 응답에 `dataKey: "_global.editingAddress"` 를 되살리고 이름 있는 칸의
     change 점 경로 쓰기를 걷어(이 브라우저에서만) 엔진 고침만으로 네 칸이 남는지 잰다.
  배송지 목록 조회는 가짜 배송지 1건으로 모의하고 쓰기는 가로챈다. 주문서 축은 진행 중 주문서가 있을 때만 돈다.

