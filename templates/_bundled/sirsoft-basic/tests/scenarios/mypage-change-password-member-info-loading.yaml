feature: 마이페이지 비밀번호 변경 — 회원 정보를 받기 전에 누른 저장 (sirsoft-basic, 7.2.0)

description: |
  화면은 회원 정보(`/api/me`)를 받기 전에도 그려진다. 그동안은 비밀번호가 있는지 몰라 현재 비밀번호 칸(필수)이 보이고, 비밀번호 없는 회원이
  새 비밀번호만 채워 누르면 브라우저 필수 입력 검사가 제출을 막아 요청도 안내도 없이 끝났다. 회원 정보를 받기 전에는 저장 버튼을 잠그고
  「로딩 중」을 보인다. 받기에 실패하면 잠그지 않는다. 받은 뒤에는 같은 입력으로 누른 저장이 요청으로 나간다.

axes:
  member_info: [loading, failed, loaded]

effects:
  - change_password_submit_locked_until_member_info           # 받기 전 — 버튼 잠금·「로딩 중」, 요청 없음
  - change_password_submit_not_stuck_on_member_info_failure   # 받기 실패 — 버튼 풀림
  - change_password_submit_sends_after_member_info            # 받은 뒤 — 비밀번호 없는 회원의 저장이 현재 비밀번호 키 없이 나간다

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-change-password-member-info-loading.test.tsx
