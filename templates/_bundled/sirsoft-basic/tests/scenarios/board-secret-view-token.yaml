feature: 비밀글 열람 토큰 탭 세션 영속과 답변 화면 원글 비밀번호 폼 (sirsoft-basic, #789)

description: |
  비밀번호로 비밀글을 연 사실은 서버가 토큰 하나에 글별 인증(grant)으로 기록하고, 화면은 그 토큰을
  `_user_base.globalHeaders` 의 `X-Board-Secret-View-Token` 으로 게시판 요청에 싣는다.

  결함(수정 전, 제보 A): 토큰이 메모리(`_global.secretViewToken`)에만 있어 답변 링크(`<a href>` 전체 이동)·새로고침에서
  사라졌고, 답변 주소로 바로 들어온 비회원 질문자는 「로그인 후 확인」만 보고 원글 비밀번호를 넣을 곳이 없었다.

  처치:
    - 토큰·만료 시각을 탭 세션(sessionStorage)에 두고(`saveSecretViewToken`), 부팅마다 복원한다(`initSecretViewToken`).
      만료·날짜가 아닌 만료 시각이면 지운다. 로그인·로그아웃 경계에서 지운다(서버가 토큰을 발급 신원에 묶는다).
    - 상세 응답 `thread_password_available` 이 참이면 잠금 안내(로그인 버튼 포함) 아래에 원글 비밀번호 폼을 함께 보인다.
      성공하면 응답으로 글을 갈아끼우고 토큰을 보관한다.
    - `reply_locked_by_secret_ancestor` 가 참이면 답변 버튼을 감춘다(서버가 답변 폼 404·제출 422 로 막는 경로).

axes:
  surface: [token_storage, auth_boundary, post_detail, reply_detail]

effects:
  - secret_view_token_persists_in_tab_session
  - expired_secret_view_token_is_discarded
  - secret_view_token_cleared_at_auth_boundary
  - verify_success_saves_token_and_replaces_post
  - thread_password_form_follows_server_flag
  - reply_button_hidden_when_locked_by_secret_ancestor
  - board_api_requests_carry_secret_view_token
  - post_modify_token_sent_as_header

test_files:
  - templates/_bundled/sirsoft-basic/src/handlers/__tests__/storageHandlers.test.ts
  - templates/_bundled/sirsoft-basic/src/handlers/__tests__/authBoundaryStorage.test.ts
  - templates/_bundled/sirsoft-basic/__tests__/layouts/board-secret-thread-password.test.tsx
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/secret-view-token-wiring.test.ts

# E2E: 비회원 원글 비밀번호 → 답변 링크 전체 이동 → 답변 원문 / 답변 주소 직접 진입 → 원글 비밀번호 → 열림 /
# 새로고침 유지 / 로그아웃 후 잠김은 코어 Playwright spec(tests/Playwright/specs/user/board-secret-thread.spec.ts — 라이브
# 사이트 세션 소유)과 계획서 §8.2 Chrome MCP 매트릭스(T1·T2·T5·T6·T7)가 덮는다. 서버 판정은 게시판 PHPUnit 이 맡는다.
