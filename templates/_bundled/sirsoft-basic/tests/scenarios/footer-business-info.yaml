feature: 푸터 사업자 정보

description: |
  푸터가 쇼핑몰 설정의 법정 사업자 항목(상호·대표자·주소·전화·전자우편·사업자등록번호·통신판매업 신고번호·호스팅 제공자)을
  값이 있는 것만 「라벨: 값」 줄로 그린다. 값이 하나도 없거나 운영자가 표시를 꺼 서버가 값을 지워 보내면 블록을 그리지 않는다.
  기본 레이아웃(_user_base)은 이 속성을 넘기지 않는다 — 쇼핑몰 모듈이 푸터 바로 뒤 user_global_footer 자리에 직접 그린다.
  여기서 잠그는 것은 속성(businessInfo)을 바인딩한 레이아웃을 위해 남겨 둔 컴포넌트 계약이다.
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03]
  # c01: 값이 있는 항목만 라벨과 함께 그리고 전화·전자우편은 링크다
  # c02: 정보가 없거나 모든 값이 비면 블록을 그리지 않는다
  # c03: 블록이 저작권 줄 위에 있고 글자색에 다크 모드 짝이 있다

effects:
  - footer_shows_filled_business_fields_only
  - footer_business_phone_and_email_are_links
  - footer_hides_business_block_when_empty
  - footer_business_block_has_dark_pairs

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/Footer.businessInfo.test.tsx
