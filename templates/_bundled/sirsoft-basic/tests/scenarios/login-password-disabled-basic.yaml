feature: 비밀번호 로그인 거절 안내 · 외부 추가 단계 이동 (sirsoft-basic 1.3.0, 코어 7.2.0 B1③④)

description: |
  - 로그인 실패 403 `errors.code=auth.password_auth_disabled` → 로그인 칸 위 오류 자리에 서버 안내, `errors.redirect_url` 이 있으면
    「{method_label}(으)로 로그인」(이름 없으면 「회사 계정으로 로그인」) 버튼이 redirect 쿼리를 실어 그 수단으로 같은 탭 이동한다.
  - 409 `errors.code=auth.external_step_required` → `errors.redirect_url` 로 바로 이동한다.
  - 그 밖의 실패는 지금처럼 안내만. 안내 데이터는 `error.errors.*` 로만 읽는다(`error.data` 금지).

axes:
  response: [password_auth_disabled, external_step_required, invalid_credentials]
  method_link: [labeled, unlabeled, none]

exclusions:
  - { response: [external_step_required, invalid_credentials], method_link: [labeled, unlabeled], reason: "수단 버튼은 password_auth_disabled 거절에만 있다" }

effects:
  - password_disabled_shows_inline_notice
  - password_disabled_offers_method_button
  - external_step_redirects_to_server_path
  - password_disabled_branch_ignores_other_failures
  - password_disabled_reads_error_errors_only

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/login-password-disabled.test.tsx
