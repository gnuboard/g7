feature: 다른 템플릿 페이지에 실린 번들의 부트스트랩 (sirsoft-basic)

description: |
  레이아웃 편집기는 페이지의 활성 템플릿이 아닌 편집 대상 템플릿 번들을 그 페이지에 함께 싣는다.
  번들 부트스트랩은 페이지 루트 `#app[data-template-id]` 로 자기가 그 페이지의 템플릿인지 판정한다.
    - 관리자 템플릿 페이지(사용자 템플릿 레이아웃 편집기)에 실리면: 핸들러·본인인증 launcher·기기 보정·인증 경계 정리·로케일 전환 재등록 맵(`window.G7TemplateHandlers`)을 건드리지 않는다.
      호스트 템플릿의 같은 이름 핸들러(setTheme 등)가 그대로 남고 `[G7]` 소유권 경고가 나지 않는다. 편집기 위젯 등록은 그대로 한다.
    - 자기 페이지이거나 루트 표식이 없으면(단독 실행·옛 코어) 종전대로 모두 등록한다.

axes:
  page: [other_template, own_template, no_marker]

effects:
  - host_page_globals_untouched
  - page_globals_registered

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/guestBundleBootstrap.test.ts
