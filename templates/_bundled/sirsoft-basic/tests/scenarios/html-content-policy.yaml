feature: HtmlContent 가 코어 「본문 콘텐츠」 규칙(G7Core.contentPolicy)으로 본문을 정화한다 (#883 5단계)

description: |
  규칙이 있으면 켜진 후보(그림 캡션·외부 영상)를 살리고 외부 영상은 정해진 플레이어 iframe 으로 바꾼다. 사용자 iframe·script·
  이벤트 속성은 계속 지우고 허용 밖 서비스는 링크로. 컴포넌트 prop 으로 덧붙인 금지는 규칙으로 풀리지 않는다. 규칙이 없으면 종전 정화.

axes:
  case: [policy_on, prop_forbid, policy_off]

effects:
  - caption_kept
  - youtube_iframe
  - user_iframe_removed
  - unmatched_link
  - prop_forbid_not_unlocked
  - legacy_path_without_policy
  - candidates_off_respected
  - external_video_removed

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/HtmlContent.contentPolicy.test.tsx
