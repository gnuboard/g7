feature: 상품상세 담기·바로구매 — 메인 옵션을 product_option_id 로 전송 (브라우저)

description: |
  담기와 바로구매가 메인 옵션을 로케일 값 조합(option_values)으로 보내고 서버가 getLocalizedOptionValues()
  문자열 동등비교로 역매칭하던 방식은, 클라와 서버 로케일이 다르거나 관리자가 옵션 값 텍스트를 고치면
  매칭에 실패했다(option_values_not_found). 옵션 식별을 product_option_id 로 바꿔 클라가 이미 가진
  SelectedItem.optionId 를 보내고, 서버는 요청 상품의 옵션 집합 안에서 ID 로만 조회한다.

  engine-v1.63.5(트러블슈팅 사례 42) 이후 이 spec 은 이중 저장소 미러의 종단 회귀 핀도 겸한다 — 옵션 선택은
  템플릿 커스텀 핸들러가 context.setState 로 쓰고, 그 값이 저장소 B 에 닿지 않으면 요청 body 의 배열이 빈 채로
  나간다. 화면과 콘솔로는 드러나지 않으므로 요청 body 를 본다.

  시드를 만들지 않고 공개 상품 목록에서 메인 옵션 2개 이상인 상품을 찾아 쓴다. 없으면 시험마다 사유와 함께
  건너뛴다. 다른 상품의 옵션 ID 거부는 서버 쪽 검증이라 이 spec 이 재지 않는다.

# axis 의미:
#   case — 옵션 상품 상세에서 메인 옵션을 모두 고른 뒤의 동작. add_to_cart 담기(T1), buy_now 바로구매(T2),
#          cart_reflects_option 담은 뒤 장바구니 확인(T3).
axes:
  case: [add_to_cart, buy_now, cart_reflects_option]

effects:
  # 담기 요청 body.items[].product_option_id 가 숫자로 실리고 option_values 가 없다 (T1)
  - add_to_cart_sends_product_option_id
  # 바로구매 요청 body.direct_items[].product_option_id 가 숫자로 실리고 option_values 가 없다 (T2)
  - buy_now_direct_items_sends_product_option_id
  # 담은 뒤 장바구니 항목에 선택한 옵션 값이 그대로 보인다 (T3)
  - cart_reflects_exact_selected_option

test_files:
  - templates/_bundled/sirsoft-basic/tests/Playwright/specs/shop-cart-option-id.spec.ts
