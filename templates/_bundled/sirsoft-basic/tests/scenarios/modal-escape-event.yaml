feature: 사용자 창·모바일 메뉴 Esc 닫기

description: |
  Esc 로 창·모바일 메뉴를 닫을 때 닫기 처리기에 keydown 이벤트를 넘기는지
  
  레이아웃 창의 닫기 처리기는 템플릿 엔진의 액션 처리기이고, 엔진 처리기는 첫 줄에서 `event.type` 을 읽는다.
  Esc 경로만 `onClose()` 를 빈 인자로 불러 `TypeError … reading 'type'` 가 나고 창이 닫히지 않았다
  (이커머스 전수 실측 S5, 2026-10-07 — 관리자 창에서 발견, 사용자 템플릿 Modal·MobileNav 도 같은 꼴).

  수정 이력: 이커머스 전수 실측 S5-D25 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02]
  # c01: Modal — onClose 가 keydown 이벤트를 받는다
  # c02: MobileNav — onClose 가 keydown 이벤트를 받는다

effects:
  - escape_close_passes_event

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/ModalEscapeEvent.test.tsx
