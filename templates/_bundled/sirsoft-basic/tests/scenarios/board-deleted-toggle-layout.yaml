feature: 게시판 삭제 글·삭제 댓글 포함 토글은 권한이 있을 때만 보인다

description: |
  게시글 목록의 「삭제 글 포함」 토글은 can_view_deleted 가 참일 때만, 글 상세 댓글 머리의 「삭제 댓글 포함」 토글은
  can_manage 가 참일 때만 그려진다. 권한이 거짓이거나 응답에 권한 키가 없으면 토글을 그리지 않는다.

# axis 의미:
#   target     — 토글 대상(게시글 목록 / 댓글 머리)
#   permission — 응답의 권한 값(참 / 거짓 / 키 없음)
axes:
  target: [post, comment]
  permission: [granted, denied, missing]

effects:
  - deleted_post_toggle_shown_when_permitted       # can_view_deleted 가 참이면 게시글 토글이 그려진다
  - deleted_post_toggle_hidden_without_permission  # 거짓이거나 키가 없으면 게시글 토글이 없다
  - deleted_comment_toggle_shown_when_manageable   # can_manage 가 참이면 댓글 토글이 머리 오른쪽에 그려진다
  - deleted_comment_toggle_hidden_without_permission  # 거짓이거나 키가 없으면 댓글 토글이 없다

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/board-deleted-toggle.test.tsx
