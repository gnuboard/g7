feature: 리뷰 모아보기 화면

description: |
  쇼핑몰 전체의 구매 후기를 한 화면에서 본다. 정렬·사진 후기만 보기·별점 조건은 주소의 질의로 읽고 쓰며,
  쪽 번호 링크가 그 조건을 이어 간다. 후기 카드는 상품 상세의 후기 탭과 같은 조각을 쓴다.
  쇼핑몰이 켜져 있을 때만 경로와 메뉴가 생긴다.
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11]
  # c01: 전체 후기 API 를 주소 쿼리로 받고 회원·비회원 모두에게 연다
  # c02: 필터 세 가지가 같은 화면 주소로, 다른 조건을 지키며 1쪽으로 이동한다
  # c03: 쪽 번호가 실제 링크이고 필터를 지킨 채 이동한다
  # c04: 후기가 없을 때 문구가 필터 유무로 갈린다
  # c05: 후기 카드 조각을 상세 후기 탭과 같이 쓰고 큰 사진 창을 선언한다
  # c06: 상품 요약 링크가 상점 주소를 설정에서 읽는다
  # c07: 쇼핑 경로로 등록되고 쇼핑몰 모듈을 요구한다
  # c08: 모바일 서랍의 쇼핑 구역과 검색 로봇용 머리글에 링크가 있다
  # c09: 머리글 탭 줄에 리뷰 링크가 있고 그 화면에서 활성으로 표시된다
  # c10: 조건을 바꾸면 새 목록이 올 때까지 로딩 덮개를 한 번만 유지한다(앞 목록이 남거나 덮개가 반짝이지 않음)
  # c11: 상품 상세 후기 탭도 조건을 바꾸면 새 목록이 올 때까지 앞 목록을 흐리게 둔다(조건 6곳 전부)

