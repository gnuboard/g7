feature: 장바구니 줄 아이콘 버튼 이름

description: |
  장바구니 상품 줄의 아이콘 버튼(옵션 변경·삭제)이 화면 언어의 읽기 이름을 갖는지
  
  장바구니 줄의 톱니(옵션 변경)·휴지통(삭제) 버튼은 글자 없이 아이콘만 그린다. 버튼에 aria-label 이 없으면
  읽기 이름은 안쪽 `Icon` 이 내는 아이콘 이름(「cog」·「trash can」)이 되어, 한국어 화면에서도 화면 낭독기가
  영어 아이콘 이름을 읽는다(이커머스 전수 실측 S5, 2026-10-07 — 톱니에 붙은 title 은 내용 이름에 밀려 쓰이지 않는다).
  
  레이아웃 소스 _cart_item.g7.html 을 구운 결과에서 자식이 아이콘뿐인 버튼을 모두 찾아, `$t:` 번역 키 aria-label 이 있고
  그 키가 한국어·영어 문구에 있는지 본다.

  수정 이력: 이커머스 전수 실측 S5-D18 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02]
  # c01: 아이콘 버튼(옵션 변경·삭제)을 찾았다
  # c02: 「%s」 버튼은 번역된 aria-label 을 갖는다

effects:
  - cart_icon_buttons_named

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/cartItemIconButtonNames.test.ts
