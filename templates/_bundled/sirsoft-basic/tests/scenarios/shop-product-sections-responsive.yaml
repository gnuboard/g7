feature: 상점 인기상품·신상품·최근본상품 가로 섹션의 화면 폭별 카드 수

description: |
  상점 첫 화면의 인기상품·신상품·최근본상품 섹션은 한 줄 가로 격자로 카드를 늘어놓고 이전·다음 단추로 넘긴다.
  좁은 화면(0~639)은 한 번에 2장, 640~1023 은 3장, 1024 이상은 4장을 보인다. 카드 폭은 격자의 auto-cols 가 정하고
  화면 폭 분기는 엔진 responsive 구간으로 적는다(Tailwind 반응형 접두를 쓰지 않는다). 다음 단추의 비활성 조건도 같은
  구간에서 한 번에 보이는 카드 수(+2·+3·+4)를 기준으로 하고, 구간마다 기본값과 같은 상품 목록을 센다.
  넘치는 카드는 가로 스크롤 대신 숨기고, 섹션은 상품이 없으면 그리지 않는다.

axes:
  part:
    - card_grid
    - next_button
    - section_shell

effects:
  - scroll_container_is_grid_flow_col
  - card_columns_follow_responsive_ranges
  - card_has_no_own_width
  - next_button_threshold_per_range
  - next_button_counts_same_collection
  - section_hides_overflow_and_empty_state

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/shop-product-sections-responsive.test.tsx

notes: |
  e2e_browser=not_applicable — 레이아웃 JSON 계약 검사다. 실제 폭별 카드 수는 브라우저에서 375·768·1024·1280 폭으로 확인한다.
