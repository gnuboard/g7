feature: sirsoft-basic 꾸밈 아이콘 숨김과 아이콘만 담은 단추 이름, 컴포넌트 기본 문구 다국어화

description: |
  Icon 은 이름(ariaLabel)을 받지 않으면 영문 글리프 이름(「trash can」·「heart」·「chevron left」)을 role="img" 이름으로 달아,
  한국어·일본어 화면에서도 아이콘이 영문으로 읽혔다(7.1.0 O-C3b-3). 이름 없는 아이콘은 꾸밈(aria-hidden)으로 숨기고,
  이름을 받은 아이콘만 role="img" 로 읽힌다. 아이콘만 담은 번들 레이아웃 단추는 그 영문 이름에 기대던 이름을
  화면 언어 이름(aria-label)으로 직접 갖는다. FileInput·ThemeToggle 의 영문 기본 문구, Select 검색칸 이름,
  프로필 사진 미리보기 대체 글도 다국어 키로 바꾸고, 번역이 없거나 엔진 밖이면 종전 영문을 쓴다(O-C3b-4).

axes:
  control: [icon, layout_icon_only_control, default_text]

effects:
  - decorative_icon_hidden_from_a11y_tree
  - labelled_icon_exposes_given_name
  - layout_icon_only_control_named
  - default_text_follows_locale
  - fallback_without_engine

test_files:
  - templates/_bundled/sirsoft-basic/src/components/basic/__tests__/Icon.a11y.test.tsx
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/IconOnlyControlNames.test.tsx

notes: |
  e2e_browser=verified — 사용자 홈·게시판 목록·글 상세(ko/en/ja)에서 이름 없는 단추·링크 0, 아이콘 영문 이름 노출 0 을
  격리 브라우저 접근성 트리로 확인했다(7.1.0 종합 3c).
