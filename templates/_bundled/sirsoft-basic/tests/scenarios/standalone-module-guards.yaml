feature: sirsoft-basic 모듈별 단독 사용 — 선택 연동과 공통 화면 가드 (#822)

description: |
  sirsoft-basic 이 게시판·쇼핑몰·페이지 모듈과 우편번호 플러그인을 필수 의존으로 선언해, 하나라도 꺼진 사이트는
  템플릿 설치가 막히고 이미 켠 사이트의 방문자 화면 전체가 503 이었다. 넷을 선택 연동(integrations)으로 바꾸고,
  모듈 화면은 라우트 requires 로, 공통 화면(상속원·홈·검색·가입·로그인·마이페이지 탭·회원 프로필)의 데이터소스·
  노드·액션은 `{{_global.activeModules?.includes('<id>') ?? true}}` 한 모양의 if 로(데이터소스는 404 삼킴 동반),
  머리글·꼬리말 링크는 모듈 활성 props 로 가린다. 키가 없는 옛 코어에서는 모두 켜짐으로 본다.
  우편번호 플러그인이 꺼지면 주소칸을 직접 입력한다. 쇼핑몰이 켜지면 홈에 인기 상품·신상품 줄이 생긴다.
  조합별(게시판만·쇼핑몰만·쇼핑몰만+주소 직접 입력·페이지 끔·코어만) 브라우저 측정은 모듈 활성 상태를 바꿔야 해서
  Playwright 단독 실행이 아니라 조합을 만든 사이트에서 같은 선택자(헤더 data-testid nav-popular·nav-shop·header-cart·
  header-search, 서랍·홈의 data-ref id)로 잰다.

coverage_strategy: full

