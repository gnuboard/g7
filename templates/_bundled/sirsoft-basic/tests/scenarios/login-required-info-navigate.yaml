feature: 로그인을 마친 응답에 비어 있는 필수 항목이 실려 오면 추가 정보 입력 화면으로 보낸다

description: |
  로그인을 마친 응답(비밀번호 로그인, 로그인 인계, 2단계 인증 완료, 비밀번호 변경 완료, 다음에 변경)의 pending_required_fields 에 키가 있으면
  원래 가려던 곳을 redirect 로 실어 /mypage/required-info 로 보낸다. 없으면 종전처럼 원래 가려던 곳(없으면 홈)이다.
  로그인이 끝나는 지점은 넷이고 같은 식을 쓴다: 로그인 화면의 명명 액션 applyLoginResult(비밀번호 로그인, 로그인 인계, 회사 계정 동의 창과 연결 창이
  부른다)와 그 액션을 거치지 않는 폼 조각의 세 곳(2단계 인증 완료, 비밀번호 변경 완료, 다음에 변경). 소셜 가입 완료 창은 로그인 인계 주소로 돌아와
  같은 분기를 탄다.

# axis 의미:
#   case — 어느 진입인가 (목적지 식, 비밀번호 로그인, 로그인 인계, 회사 계정 창, 소셜 가입 완료 창, 2단계 인증 완료, 비밀번호 변경 완료, 다음에 변경, 입력을 마친 회원)
axes:
  case: [destination_expression, password_login, login_handoff, sso_modals, social_signup_modals, two_factor_complete, password_change_complete, password_change_postponed, complete_member]

effects:
  - pending_member_goes_to_required_info_with_original_destination
  - four_completion_points_share_one_expression
  - password_login_is_guided_through_apply_login_result
  - login_handoff_is_guided_through_apply_login_result
  - sso_consent_and_link_modals_are_guided_through_apply_login_result
  - sso_plugin_original_fragment_also_uses_apply_login_result
  - social_signup_modals_return_through_login_handoff
  - two_factor_completion_is_guided
  - password_change_completion_is_guided
  - password_change_postpone_is_guided
  - complete_member_keeps_original_destination

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/login-required-info-navigate.test.tsx
