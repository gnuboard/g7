feature: 장바구니 품목 「판매중지」 표시 — 서버 구매 가능 여부(available) 기준

description: |
  장바구니 품목의 「판매중지」 표시는 서버가 품목마다 내려주는 구매 가능 여부(`available`)를 따른다.

  수정 이력 (이커머스 전수 실측 S4 — S4-D6 화면분):
    - 품목 조각이 상품 판매 상태(`item.product.sales_status`)만 봐서, 상품은 판매 중이지만 담은 옵션이
      판매 중지된 품목·전시 중지된 상품이 표시 없이 정상 상품처럼 보였다(합계에서는 빠지는데 화면은 그대로).
      서버(CartItemResource)는 그런 품목에 available=false·unavailable_reason=suspended 를 준다.

# axis 의미: 품목의 상태 — 옵션만 판매 중지 / 상품 자체 판매 중지 / 구매 가능
axes:
  item_state: [option_suspended, product_not_on_sale, purchasable]

effects:
  - cart_marks_inactive_option_unavailable   # 옵션만 판매 중지(available=false)여도 「판매중지」 표시
  - product_status_badge_kept                # 상품 판매 상태가 판매 중이 아니면 종전처럼 표시
  - purchasable_item_has_no_badge            # 구매 가능한 품목에는 표시 없음

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/cartItemUnavailableBadge.test.tsx

validation:
  browser_check: 전용 Chrome 실측 — 옵션 2개를 모두 판매 중지한 상품 N 을 담은 장바구니에서 행 「판매중지」, [주문하기] → 400 → 「구매 불가 상품 안내」
