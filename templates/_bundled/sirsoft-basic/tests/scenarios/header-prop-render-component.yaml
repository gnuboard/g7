feature: 실제 Header 컴포넌트의 편집기 속성 반영

description: |
  편집기에 노출한 Header 의 핵심 prop(siteName, logo, maxVisibleBoards, availableLocales)이 실제 Header.tsx 를
  렌더한 DOM 에 반영되는지 고정한다. 모듈 통화 셀렉터가 들어갈 header_currency 슬롯 컨테이너도 함께 확인한다.
  데스크톱 폭으로 useResponsive 를 모킹해 데스크톱 헤더 분기를 그린다.

# axis 의미:
#   prop — 반영을 확인하는 Header 속성(또는 슬롯).
axes:
  prop: [site_name, logo, max_visible_boards, available_locales, header_currency_slot]

effects:
  - header_prop_renders_in_dom                        # siteName, logo, maxVisibleBoards 값이 화면 출력에 그대로 반영된다
  - language_selector_shown_only_for_multiple_locales # 로케일이 2개 이상일 때만 언어 선택기가 현재 로케일 코드로 보인다
  - currency_slot_container_rendered                  # header_currency 슬롯 컨테이너가 렌더된다

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/HeaderPropRender.test.tsx
