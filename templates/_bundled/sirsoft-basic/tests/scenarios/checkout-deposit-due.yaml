feature: 주문서 입금 기한 안내 — 미입금 자동취소 기한(auto_cancel_days)과 일치 (브라우저)

description: |
  공개 이슈 #81 — 입금 기한은 결제수단과 무관하게 `order_settings.auto_cancel_days` 하나만 쓰도록 서버를
  통일했는데, 주문서 화면은 서버에 없는 `vbank_due_days`/`dbank_due_days` 를 참조해 하드코딩 폴백
  (가상계좌 3일, 무통장입금 7일)이 그대로 보였다. 실측(2026-07-29): auto_cancel_days = 3 인 사이트에서
  무통장입금 주문서가 「입금 기한: 7일 이내」 로 안내했다.

  후속 결함(2026-08-01): 폴백이 `?? 3` 이라 빈 문자열이 통과해 `입금 기한: {{days}}일 이내` 가 그대로
  보였다. 그래서 숫자 일치와 함께 미치환 플레이스홀더 부재도 잰다.

  레이아웃 표현식의 오염값(빈 문자열, 0, 음수, 비숫자) 폴백은 Vitest checkout-deposit-due-days 가 잠근다.
  여기서는 브라우저 수준으로 설정 응답이 SSoT 키를 노출하는지, 렌더된 안내 숫자가 그 값과 같은지를 잰다.
  결제수단(무통장입금, 가상계좌)은 사이트 설정에 따라 한쪽만 있을 수 있어, 시험 하나가 화면에 있는 것만
  돌며 잰다 — 결제수단별로 조합을 보장할 수 없으므로 결제수단은 축으로 두지 않는다.

# axis 의미:
#   case — settings_response_ssot 결제 설정 응답의 키 구성, rendered_due_notice 주문서에 렌더된 입금 기한 안내.
axes:
  case: [settings_response_ssot, rendered_due_notice]

effects:
  # 결제 설정 응답 order_settings 에 auto_cancel_days 가 있고 폐기된 dbank_due_days/vbank_due_days 가 없다
  - payment_settings_exposes_auto_cancel_days
  # 렌더된 입금 기한 안내의 일수가 설정 응답 값(서버 규칙으로 해석)과 같다
  - due_notice_matches_auto_cancel_days
  # 입금 기한 안내에 미치환 플레이스홀더({{days}})가 남지 않는다
  - due_notice_has_no_unsubstituted_placeholder

test_files:
  - templates/_bundled/sirsoft-basic/tests/Playwright/specs/checkout-deposit-due-days.spec.ts
