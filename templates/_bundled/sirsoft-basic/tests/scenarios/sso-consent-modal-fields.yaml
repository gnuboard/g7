feature: SSO 첫 로그인 동의 창(사용자 템플릿 판본)은 코어 가입 화면과 같은 회원 항목을 받는다

description: |
  extensions/sirsoft-sso/auth-login-sso-modals 는 SSO 플러그인의 같은 조각을 통째로 대체하는 템플릿 오버라이드다.
  동의 창이 가입 항목 계약(/api/auth/register/fields, 동의 대기 토큰과 함께)을 받아 칸을 그리고 받은 정의 버전(fields_version)을
  동의 완료 요청에 싣는다. 회사 계정이 관리하는 칸은 서버가 읽기 전용(locked_reason = sso)으로 준다.
  항목을 받지 못하면 원본처럼 약관만 받고 버전 없이 보낸다.
  그 밖(오류 토스트, 만료 안내, 기존 회원 연결 확인 창, 로그인 인계)은 원본과 같아야 한다.

coverage_strategy: full

axes:
  part: [envelope, init, fields, locked, agreements, fallback, summary, submit, original]

effects:
  - override_targets_same_layout_and_priority_as_original
  - version_constraint_matches_bundled_plugin_version
  - init_resets_field_state_to_loading
  - fields_fetched_from_core_signup_api_with_pending_token
  - idp_defaults_seed_text_fields_only
  - fields_region_binds_to_global_field_form_when_ready
  - idp_managed_field_shows_company_notice_and_readonly_contract
  - agreements_group_draws_only_agreement_fields_below_consents
  - field_errors_show_under_each_field
  - loading_line_and_name_summary_follow_field_state
  - summary_values_wrap_in_narrow_modal
  - submit_waits_for_fields
  - body_carries_original_keys_field_values_and_fields_version
  - body_without_fields_is_the_original_body
  - validation_errors_are_stored_per_field
  - fields_changed_refetches_fields_and_keeps_input
  - link_verify_modal_is_identical_to_original
  - expiry_notice_and_consent_rows_are_identical_to_original
  - login_handoff_after_consent_is_identical_to_original
  - init_actions_keep_original_error_toast_and_link_fetch

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/sso-consent-modal-fields.test.ts
