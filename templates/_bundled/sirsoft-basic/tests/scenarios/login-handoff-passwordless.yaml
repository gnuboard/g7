# audit:allow test-scenario-coverage[cross_product] reason: issue:#40 화면(로그인·가입·비밀번호 변경·정보 수정 관문) × 응답 × 비밀번호 유무는 화면마다 의미 있는 축이
# 다르다(가입 화면에는 인계 응답 축이 없다 등). 회귀 가드는 effects 이며 전부 test_files 에 @effects 로 귀속.

feature: 로그인 인계 진입 · 로그인/가입 확장점 · 비밀번호 없는 회원 마이페이지 (sirsoft-basic 1.4.0)

description: |
  #40 소셜 로그인의 템플릿 선행분.
    - 로그인 화면이 `/login?login_handoff={코드}` 로 들어오면 진입 시 `loginHandoff` 액션으로 코드를 교환한다. 응답 분기는 비밀번호
      로그인과 같은 명명 액션 `applyLoginResult` — 2단계 인증·비밀번호 변경·로그인 완료가 똑같이 처리된다. 실패는 로그인 칸 위 안내.
    - 로그인 화면 폼 아래 `auth_login_extensions`, 가입 화면 폼 위 `auth_register_extensions` 확장점.
    - 비밀번호 없는 회원(has_password=false): 비밀번호 변경 화면은 현재 비밀번호 칸·키 없이 「처음 설정」, 정보 수정 관문은 이메일
      인증번호(코어 본인인증 `sensitive_action`)로 확인한다.

axes:
  surface: [login, register, change_password, profile_edit_gate]
  query: [none, login_handoff]
  redirect: [absent, present]
  response: [authenticated, two_factor_required, invalid_code]
  has_password: [true, false]
  email_deliverable: [true, false]

effects:
  - auth_extension_points_present
  - handoff_init_dispatches_login_handoff
  - handoff_shares_login_result_branch
  - handoff_two_factor_step_rendered
  - handoff_completes_login
  - handoff_failure_shows_error
  - handoff_keeps_redirect_target
  - change_password_hides_current_for_passwordless
  - change_password_keeps_current_for_holder
  - change_password_omits_current_key_for_passwordless
  - profile_gate_uses_email_code_for_passwordless
  - profile_gate_heading_follows_password_presence
  - profile_gate_offers_extension_for_undeliverable_email
  - change_password_offers_extension_for_undeliverable_email

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/login-handoff.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-passwordless.test.tsx
