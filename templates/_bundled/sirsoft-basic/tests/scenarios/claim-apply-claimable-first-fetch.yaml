feature: 클레임 신청서 — 주문 ID 를 모르는 진입에서 claimable-options 를 0 으로 부르지 않는다 (7.1.1)

description: |
  회원 클레임 신청서(작성·수정 겸용)는 claimable 데이터소스를 `?order_id` 또는 order 응답이 세운 claimOrderId 로 부른다.
  수정 주소(`/mypage/claims/{번호}/edit`)·주소 직접 입력처럼 `?order_id` 가 없는 진입에서는 첫 호출이
  `/user/orders/0/claimable-options` 404 로 한 번 더 나갔다(화면에는 안 보이고 콘솔 오류 1건). 비회원 셸도 토큰 없는 수정 진입에서
  `/guest/orders/0/claimable-options` 404 가 나갔다.
  같은 id 의 데이터소스 두 판을 서로 배타인 if 로 둔다 — 주문 식별자가 주소에 있는 진입은 곧바로 부르고(종전 그대로 —
  SPA 뒤로가기 회귀 방지), 없는 진입은 스스로 부르지 않고(auto_fetch false) order 응답의 refetch-data-source 가 부른다.
  데이터소스 조건은 init_actions 전에 평가되므로 route·query 로만 가른다(_global.guestOrderNumber 는 그 순간 믿을 수 없다).

# axis 의미:
#   shell — 회원 셸(mypage/claims/apply) / 비회원 셸(shop/guest_claim_apply)
#   entry — 주문 식별자가 주소에 있는 진입(회원 ?order_id · 비회원 :order_number) / 없는 진입(수정 주소·직접 입력)
axes:
  shell: [member, guest]
  entry: [id_in_address, id_not_in_address]

effects:
  - claimable_direct_fetch_when_id_in_address   # 주소에 식별자가 있는 판만 auto_fetch true
  - claimable_waits_for_order_chain             # 없는 판은 auto_fetch false 이고 order 성공 sequence 가 refetch 한다
  - claimable_variants_share_handlers           # 두 판의 성공·404 처리가 같다

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/claim-apply-claimable-first-fetch.test.ts

validation:
  browser_check: 재실측 — 수정 주소 진입의 네트워크에서 orders/0/claimable-options 0건
