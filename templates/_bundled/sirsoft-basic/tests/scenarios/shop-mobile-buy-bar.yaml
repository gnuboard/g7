feature: 좁은 화면 하단 구매바와 바텀시트

description: |
  상품 상세와 장바구니의 좁은 화면(768px 미만) 아래에 고정되는 구매바, 그리고 상품 상세에서 옵션을 아직 다 고르지
  않았을 때 올라오는 바텀시트.

  - 본문 단추·바텀시트 단추·하단 구매바는 화면의 이름 붙은 액션 하나씩을 같이 부른다(동작이 한 벌이다).
  - 바 단추는 진행 중·구매 불가·배송 불가일 때만 잠긴다. 옵션·필수 추가옵션·직접 입력을 아직 채우지 않았거나
    고른 수량이 구매 한도 밖이면 잠그는 대신 바텀시트를 열어 고르게 한다.
  - 바텀시트는 화면 레이아웃 안에 두는 대화 상자다. 안쪽 옵션 영역은 본문 구매 카드와 같은 조각·같은 화면 상태를 쓴다.
  - 바가 있는 동안 본문 끝이 가려지지 않게 body 에 표시를 남기고, 시트가 열려 있는 동안 본문 스크롤을 잠근다.
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, c25, c26, c27, c28]
  # c01: 아래에 고정되고 넓은 화면에서는 숨는다
  # c02: 있는 동안 body 에 표시를 남기고 사라지면 지운다
  # c03: 상품 바 — 찜·장바구니·바로구매가 각자의 동작을 부르고 찜은 눌림 상태를 알린다
  # c04: 잠긴 단추는 동작하지 않고, 진행 중이면 모두 잠긴다
  # c05: 판매 중이 아니면 가격·찜과 판매 상태만 보인다
  # c06: 장바구니 바 — 금액과 주 단추 하나만 있다
  # c07: 닫혀 있으면 DOM 에 없다
  # c08: 열리면 제목으로 이름 붙은 대화 상자이고 좁은 화면 전용이다
  # c09: Esc·배경 누름·닫기 단추가 모두 닫기를 부른다
  # c10: 열면 시트 안으로 초점이 가고 닫으면 연 단추로 돌아온다
  # c11: Tab 이 시트 밖으로 나가지 않는다
  # c12: 열려 있는 동안 본문 스크롤을 잠그고 닫히면 푼다
  # c13: 본문 단추·바텀시트 단추·하단 구매바가 같은 이름 붙은 액션을 부른다
  # c14: 구매 카드와 바텀시트가 같은 옵션 조각을 포함하고, 조각은 화면 상태를 그대로 쓴다
  # c15: 옵션을 골라야 하는데 고른 줄이 없으면 다 고르지 않은 것이다
  # c16: 필수 추가옵션이 빈 줄이 있으면 다 고르지 않은 것이다
  # c17: 직접 입력을 받는 선택지를 골랐는데 글자가 비면 다 고르지 않은 것이다
  # c18: 추가옵션이 있는 상품은 시트를 한 번 열어 고를 기회를 준다
  # c19: 고른 줄 수량의 합이 구매 한도 밖이면 수량을 고치도록 시트를 연다
  # c20: 다 고르지 않았으면 시트를 그 모드로 열고, 다 골랐으면 시트 없이 액션으로 간다
  # c21: 바 단추는 진행 중·구매 불가·배송 불가일 때만 잠긴다
  # c22: 시트 단추의 잠금 식이 본문 구매 카드 단추와 글자 그대로 같다
  # c23: 화면 상태로 열리고, 닫기·담기 성공이 그 상태를 끈다
  # c24: 장바구니 바의 금액·잠금 식이 요약 칸과 같고, 담긴 상품이 있을 때만 보인다
  # c25: 요약 칸의 주문하기와 바의 주 단추가 같은 이름 붙은 액션을 부른다
  # c26: 주문 권한이 없으면 바의 바로구매가 본문 단추처럼 잠긴다
  # c27: 합계와 단추는 시트 바닥에 붙어 있고, 옵션 영역만 스크롤된다
  # c28: 필수 추가옵션·직접 입력이 빈 채 담기·바로구매를 누르면 그 칸에 사유 줄이 뜬다(구매 카드·시트 공용 조각)

