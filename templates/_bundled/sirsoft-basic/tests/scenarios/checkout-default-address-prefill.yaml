feature: 주문서 배송지 기본 채움과 저장된 배송지 갱신

description: |
  2026-09-21 검수 지적. 저장해 둔 배송지가 있어도 주문서는 빈 배송지 칸으로 열렸고, 주문할 때마다
  같은 주소를 다시 골라야 했다. 그 자리에서 주소를 고쳐도 주소록에는 남지 않아 다음 주문서도
  옛 주소로 열렸다 — 같은 손질이 주문마다 반복됐다.

  두 가지를 세운다:

  1. **기본 채움** — 회원의 저장 배송지 목록(`/user/addresses`)이 도착하면 첫 줄(리포지토리가
     기본 배송지를 맨 앞에 놓는다)로 배송지 칸을 채운다. 옮겨 담는 모양은 저장 배송지 칩을 누른
     경로와 **같아야** 한다: 저장 형식(UserAddress)과 주문서 형식은 해외 주소에서 이름이 갈린다
     (`city`/`state`/`postal_code` ↔ `intl_city`/`intl_state`/`intl_postal_code`). 한 칸씩 옮기지
     않으면 국내 주소만 맞고 해외 주소는 빈 칸으로 열린다.

     채운 뒤 주문서를 다시 받는 것은 **배송비** 때문이다. 우편번호가 도서산간 할증을 가르는데
     미리보기가 그것을 모르면, 주문 확정에서 서버가 다시 계산한 금액과 결제예정금액이 어긋나
     금액 불일치로 막힌다. 그래서 주문서 조회(GET)가 `zipcode` 를 함께 싣고, 채움 직후
     `checkoutData` 를 다시 받는다. `refetchDataSource` 는 «현재» 로컬 상태를 읽으므로
     setState 가 같은 sequence 앞에 있어야 한다.

  2. **갱신** — 고른 배송지를 그 자리에서 고쳤을 때만 「저장된 배송지를 갱신할지」 묻는다
     (기본 켜짐). 고치지도 않았는데 뜨는 칸은 무엇을 묻는지 알 수 없어, 비교식(`shippingAddressDirty`)
     이 참일 때만 칸이 선다. 답은 주문 본문의 `save_shipping_address_id` 로 실린다 — 서버는 그
     행을 갱신하고 새 행을 쌓지 않는다. 배송지명(「집」·「회사」)은 건드리지 않는다.

# axis 의미: 갈라지는 축은 «채우는가 / 갱신하는가» 둘이다. 두 축은 교차하지 않는다 —
# 채움은 진입 시점의 일이고 갱신은 제출 시점의 일이며, 재는 대상(데이터소스 onSuccess ↔
# computed·제출 본문)이 서로 다르다.
axes:
  stage: [prefill, update]

effects:
  - checkout_prefills_only_when_saved_address_exists   # 저장 배송지가 있을 때만 채운다
  - checkout_prefill_maps_intl_address_fields          # 이름이 갈리는 해외 3칸을 한 칸씩 옮긴다
  - checkout_prefill_refetches_order_for_shipping_fee  # 채운 뒤 주문서를 다시 받아 배송비를 맞춘다
  - checkout_get_carries_zipcode_for_fee_preview       # 주문서 조회가 우편번호를 함께 싣는다
  - checkout_update_prompt_only_when_address_changed   # 고친 칸이 있을 때만 갱신 여부를 묻는다
  - checkout_order_payload_carries_address_to_update   # 갱신 대상 배송지 ID 가 주문 본문에 실린다

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/checkout-default-address-prefill.test.tsx

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: 브라우저 실측 대기   # 런타임 영향 수정이라 브라우저 재현 전까지 완료로 보고하지 않는다
  note: |
    이 변경의 Playwright spec 은 아직 없다. 재현에 「저장 배송지를 가진 회원 + 장바구니에 담긴
    주문 가능 상품」 이라는 상태가 필요해, 기존 주문서 spec(checkout-address-manual-entry)이
    쓰는 시드로는 세울 수 없다(그 spec 은 배송지가 **없는** 회원을 전제로 직접 입력 경로를 잰다).
    전용 시드를 세우는 일은 별도 과제로 남기고, 그때까지 위 레이아웃 계약 테스트가
    구조적 회귀를 막는다 — 채움 sequence 의 순서(setState → refetch), 해외 3칸 매핑,
    조회 파라미터의 zipcode, 갱신 칸의 노출 조건, 제출 본문의 갱신 ID 다.
    백엔드 쪽(고친 배송지를 그 행에 갱신 · 남의 행 ID 는 무시 · PG 는 order_meta 에 보관)은
    UserOrderControllerTest 의 3건이 라이브로 검증한다.
