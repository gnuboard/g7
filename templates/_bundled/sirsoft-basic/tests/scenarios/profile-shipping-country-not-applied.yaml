feature: 내 정보 배송국가 — 저장한 국가가 배송 불가로 내려간 뒤 미적용 안내

description: |
  회원이 내 정보 수정에서 저장한 배송국가를 운영자가 배송 가능 목록에서 내리면, 헤더·주문서·서버는 기본 국가로 계산한다.
  내 정보·내 정보 수정의 배송국가 칸은 그 사실과 지금 적용 중인 국가를 함께 보인다.

  수정 이력 (이커머스 전수 실측 S4 — S4-D15):
    - 내 정보 화면은 내려간 국가(미국)를 그대로 보이고, 수정 화면 콤보는 빈칸이 되어 무엇이 적용되는지 알 수 없었다.
      두 화면에 「저장된 배송국가 {저장 국가}: 지금 배송할 수 없는 국가라 적용되지 않습니다. 지금 적용 중인 배송국가: {국가}」 를 더한다.
    - (S4-D20) 첫 수정이 문장을 국가명 칸 + 번역 조각 3개로 이어 붙여, 영어 화면에서 「United Statesis not available …」 처럼
      국가명과 문장이 붙어 나왔다. 문장 전체를 한 키(`saved_not_applied`)에 두고 국가명은 파라미터로 넘긴다.

  7.2.0 계약 변경:
    - 배송국가 칸은 이커머스 모듈이 회원 항목으로 선언하고, 화면은 서버가 준 항목 계약을 확장별 카드에서 공용 항목 조각으로 그린다.
    - 미적용 문장은 서버가 요청 로케일로 완성해 항목 안내(`help`)로 준다(저장 국가 이름, 목록에서 빠진 국가의 코드 표시,
      지금 적용 중인 국가 이름 모두 서버가 정한다). 화면은 받은 문장을 그대로 그리고, 안내가 없으면 줄을 그리지 않는다.
    - 저장 국가가 선택지에서 빠져 콤보가 빈칸이 되던 문제는 서버가 저장 국가를 선택지에 다시 넣어 막는다.
    - 「수정 화면에서 배송 가능한 다른 국가를 고르면 안내가 사라진다」는 화면이 조건을 계산하던 때의 동작이라 축에서 뺐다
      (안내는 저장된 값에 대한 서버의 판정이다).

axes:
  case: [edit_inactive, edit_inactive_en, edit_active, view_inactive]

effects:
  - not_applied_notice_with_applied_country      # 서버가 준 미적용 문장(저장 국가 + 지금 적용 중인 국가)이 배송국가 칸에 보인다
  - notice_hidden_when_saved_country_is_shippable # 서버가 안내를 주지 않으면(저장 국가가 배송 가능) 안내 줄 없음
  - notice_sentence_spaced_in_every_locale       # 화면이 문장을 조각으로 잇지 않고 받은 문장을 그대로 그린다(S4-D20, 조각 이어 붙이기 결함)

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/profile-shipping-country-not-applied.test.ts

validation:
  browser_check: 전용 Chrome 실측 — 배타 창에서 해외 배송 켬·미국 내림·일본 활성, m1(저장 국가 US) /mypage/profile·/mypage/profile/edit 안내 문장
