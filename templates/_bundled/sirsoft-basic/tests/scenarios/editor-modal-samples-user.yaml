feature: 편집기 사용자 창 표본

description: |
  레이아웃 편집기에서 쇼핑 사용자 창이 표본 상태로 채워져 열리는지
  
  편집기 모달 목록의 쇼핑 사용자 창 37개를 하나씩 열어 보니(2026-10-07) 몇 창이 표본 없이 열렸다 —
  「{{number}} 신청을 철회하시겠습니까?」(신청 철회 확인 5곳), 빈 「첨부 사진 보기」·「배송지 변경」,
  깨진 상품 그림(구매 확정·리뷰 작성·상품 문의 작성). 운영 화면에서는 앞선 동작(목록 행의 버튼)이
  상태를 담아 주므로 정상이지만, 편집기는 `editor-spec/states.json` 의 창 표본이 그 자리를 채워야 한다.
  자동 생성 표본이 남긴 「샘플 값」 글자가 그림 주소·선택값 자리에 들어가면 깨진 그림·빈 본문이 된다.

  수정 이력: 이커머스 전수 실측 S5-D14 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05]
  # c01: 신청 철회 확인 창 표본이 신청번호를 채운다(자리 표시자 노출 방지)
  # c02: 첨부 사진 보기 창 표본이 그림 주소를 채운다
  # c03: 구매 확정·리뷰 작성 창 표본이 대상 상품 그림·이름을 채운다
  # c04: 상품 문의 작성 창 표본의 상품 그림이 그림 주소다(「샘플 값」 글자 아님)
  # c05: 배송지 변경 창 표본의 탭 값이 화면이 아는 값(saved·manual)이라 본문이 열린다

effects:
  - user_modal_samples_render

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/editorModalSamplesUser.test.ts
