feature: 장바구니 화면 렌더링과 선택, 창, 재계산 동작

description: |
  장바구니 화면 고정물로 기본 렌더링(빈 장바구니, 기본 구조, 주문 요약, 초기 상태)과 선택 동작(개별 선택 해제·재선택,
  전체 선택·해제), 창 동작(옵션 변경 창, 삭제 확인 창), 재계산 표시를 잰다. 선택과 창 동작은 운영 레이아웃과 같은
  핸들러 이름으로 실제 장바구니 핸들러(cartHandlers.ts)를 시험 디스패처에 끼워 상태 변화를 확인한다.

  수정 이력: 종전 시험은 `handler: 'custom', name: ...` 라는 엔진에 없는 액션 모양을 보내고 `toBeDefined`
  만 단언해 핸들러가 한 번도 돌지 않아도 통과했다. 실제 핸들러 이름과 효과 단언으로 바꿨다.
  같은 회차에 공개#128 은 이름과 달리 단추가 있는지만 봤다. 고정물 주문 단추가 운영 `_cart_summary.g7.html` 의 비활성 식을
  그대로 읽어 쓰게 하고, 고르기 전 비활성과 고른 뒤 활성을 함께 단언한다.

# axis 의미:
#   area — 시험 묶음(기본 렌더링 / 선택 상태 / 창 / 데이터 연동)
axes:
  area: [render, selection, modal, api]

effects:
  - cart_empty_state_renders              # 상품이 없으면 빈 장바구니 안내가 보인다
  - cart_structure_renders                # 제목, 전체 선택, 목록, 주문 단추 같은 기본 구조가 그려진다
  - cart_summary_panel_renders            # 주문 요약 판이 그려진다
  - cart_initial_state_seeded             # 화면 초기 상태(선택, 계산 중, 창)가 정해진 값이다
  - cart_item_toggle_updates_selection    # 개별 선택 핸들러가 selectedItems 에서 빼고 넣는다
  - cart_select_all_updates_selection     # 전체 선택 핸들러가 selectedItems 와 allSelected 를 함께 바꾼다
  - cart_option_modal_opens_with_target   # 옵션 변경 창이 대상 상품과 옵션, 수량을 싣고 열린다
  - cart_option_modal_closes              # 옵션 변경 창 상태를 닫힘으로 되돌린다
  - cart_delete_modal_opens_with_targets  # 삭제 확인 창이 대상 id 목록을 싣고 열린다
  - cart_recalculate_marks_calculating    # 선택 항목이 있으면 재계산 핸들러가 계산 중으로 표시한다
  - cart_mocked_data_renders              # 모의 응답으로 목록과 주문 단추가 그려진다
  - cart_empty_after_delete               # 삭제 뒤 빈 응답이면 빈 장바구니 안내로 바뀐다
  - cart_checkout_button_disabled_without_selection  # 주문하기 단추는 운영 레이아웃의 비활성 식을 따라 고른 상품이 없으면 비활성, 고르면 활성이다

