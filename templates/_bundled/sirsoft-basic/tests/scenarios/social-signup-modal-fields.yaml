feature: 소셜 가입 완료 창(사용자 템플릿 판본)은 코어 가입 화면과 같은 회원 항목을 받는다

description: |
  extensions/sirsoft-social_login/auth_register_social_modals 는 소셜 로그인 플러그인의 같은 조각을 통째로 대체하는 템플릿 오버라이드다.
  가입 완료 창이 가입 항목 계약(/api/auth/register/fields, 가입 대기 토큰과 함께)을 받아 칸을 그리고 받은 정의 버전(fields_version)을
  가입 요청에 싣는다. 항목을 받지 못하면 원본처럼 이름, 닉네임 칸을 그리고 버전 없이 보낸다.
  그 밖(만료 안내, 이메일 인증번호, 약관 동의, 이미 가입된 이메일 창, 로그인 인계)은 원본과 같아야 한다.

coverage_strategy: full

axes:
  part: [envelope, init, fields, agreements, fallback, submit, original]

effects:
  - override_targets_same_layout_and_priority_as_original
  - version_constraint_matches_bundled_plugin_version
  - init_resets_field_state_to_loading
  - fields_fetched_from_core_signup_api_with_pending_token
  - provider_defaults_seed_text_fields_only
  - field_state_becomes_ready_or_failed
  - fields_region_binds_to_global_field_form_when_ready
  - main_group_draws_fields_except_agreements
  - agreements_group_draws_only_agreement_fields_below_consents
  - field_errors_show_under_each_field
  - loading_line_and_original_inputs_follow_field_state
  - submit_waits_for_fields
  - body_carries_original_keys_field_values_and_fields_version
  - body_without_fields_is_the_original_body
  - validation_errors_are_stored_per_field
  - fields_changed_refetches_fields_and_keeps_input
  - existing_account_modal_is_identical_to_original
  - expiry_notice_and_email_verification_are_identical_to_original
  - locked_email_line_wraps_in_narrow_modal
  - consent_rows_are_identical_to_original
  - login_handoff_after_signup_is_identical_to_original
  - init_actions_keep_original_pending_fetch_and_code_timer

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/social-signup-modal-fields.test.ts
