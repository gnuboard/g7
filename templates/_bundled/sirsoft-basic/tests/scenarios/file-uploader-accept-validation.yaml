feature: 파일 업로더 accept 값의 파일 형식 판정 (sirsoft-basic)

description: |
  FileUploader 의 accept 값은 확장자(`.jpg`), MIME 와일드카드(`image/*`), 정확한 MIME(`image/jpeg`)를 쉼표로 섞어 쓸 수 있다.
  고른 파일이 이 중 하나라도 맞으면 받고, 하나도 맞지 않으면 거부한다. 확장자는 대소문자를 가리지 않는다.

axes:
  accept_form: [extension, mime_wildcard, mime_exact, mixed]
  verdict: [accepted, rejected]

effects:
  - extension_accept_matches_file_extension     # 확장자 목록에 있는 확장자는 받는다
  - extension_accept_rejects_unlisted_extension # 목록에 없는 확장자는 거부한다
  - extension_accept_ignores_case               # 대문자 확장자도 같은 확장자로 본다
  - mime_wildcard_accepts_same_major_type       # image/* 같은 와일드카드는 같은 주 형식을 받는다
  - mime_wildcard_rejects_other_major_type      # 다른 주 형식은 거부한다
  - mime_exact_accepts_identical_type           # 정확한 MIME 은 같은 형식만 받는다
  - mime_exact_rejects_different_subtype        # 하위 형식이 다르면 거부한다
  - mixed_accept_allows_any_matching_rule       # 섞인 accept 는 규칙 하나만 맞아도 받고 모두 어긋나면 거부한다

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/FileUploaderAcceptValidation.test.ts

validation:
  note: |
    판정 식은 FileUploader/utils.ts 의 isFileAccepted 하나이고, useFileUploader 와 이 시험이 같은 함수를 부른다.
    예전에는 시험 파일 안에 식을 옮겨 적어 제품 식이 바뀌어도 실패하지 않았다(함수로 꺼내 묶음).
