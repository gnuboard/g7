feature: 쓰임새가 끝난 비밀값을 전역에 남기지 않는다 — 비회원 댓글 확인 비밀번호·로그인 단계 요청 번호 (7.1.1)

description: |
  비회원 댓글 수정은 비밀번호 확인 창이 검증한 비밀번호를 _global.verifiedGuestPassword 에 두고 수정 저장 요청에 싣는다.
  저장·취소만 비워서, 수정 중에 다른 글·화면으로 이동하거나 회원 댓글·관리자 바로 수정으로 넘어가면 비밀번호가 전역에 남았다.
  수정 폼 unmount 가 「지금 수정 대상 = 이 댓글」 일 때 수정 모드와 비밀번호를 비우고(다른 비회원 댓글로 넘어갈 때는 새 값을 지킨다),
  바로 수정 진입은 비밀번호를 비운다.
  로그인 화면의 2단계 인증·비밀번호 변경 단계 상태(_global.twoFactor·passwordChange — 요청 번호 포함)는 진입 때만 되돌려 다른 화면에
  머무는 동안 남았다 — 화면 틀 unmount 에서 비운다.
  비회원 주문 조회 토큰(guestOrderToken)·비밀글 열람 토큰(secretViewToken)은 화면 간에 쓰는 소유 증명이라 이 매니페스트 밖이다
  (docs/frontend/security.md 「화면 간 소유 증명 토큰」 예외).

axes:
  surface: [comment_edit, login]
  exit: [leave_page, switch_guest_comment, switch_direct_edit]

exclusions:
  - { surface: login, exit: switch_guest_comment, reason: "댓글 수정 전용 갈래" }
  - { surface: login, exit: switch_direct_edit, reason: "댓글 수정 전용 갈래" }

effects:
  - guest_comment_password_cleared_when_edit_ends
  - login_step_state_cleared_on_leave

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/guest-secret-global-cleared.test.tsx
