feature: sirsoft-basic 긴 텍스트 넘침 방지 (#143)

description: |
  운영자·사용자가 입력하는 텍스트(사이트 이름, 게시판·상품·회원 이름, 글 제목·본문·댓글, 알림)가 공백 없이 길거나
  한글로 길어도 297~1280px 화면에서 문서 가로 스크롤·우측 단추 밀림·고정 높이 헤더 세로 넘침을 만들지 않는다.
  상단 바(모바일 헤더·PC 헤더)의 사이트 이름은 한 줄로 자르고 … 로 표시하며 우측 아이콘은 항상 제자리다.
  제목·본문·이름처럼 읽어야 하는 글은 줄바꿈해 모두 보이고, 배지·메뉴 라벨·목록 옆 좁은 칸은 한 줄 … 이다.
  표시 규칙: R1 상단 바 이름(min-w-0 flex-1 + truncate + 우측 shrink-0) · R2 블록 글(break-words) ·
  R3 flex 줄 안 글(min-w-0 + wrap-anywhere) · R4 좁은 칸(truncate + 폭 상한).

