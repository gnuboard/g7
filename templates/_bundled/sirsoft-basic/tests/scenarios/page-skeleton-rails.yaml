feature: 불러오는 동안의 뼈대 — 가로 상품 줄·분류 칩 줄

description: |
  가로 상품 줄(ProductRail)과 분류 칩 줄(ChipRows)은 자식(카드·칩)을 레이아웃이 넘기고 줄 배치 클래스가
  컴포넌트 안에 있다. 화면 전환 덮개를 뼈대(transition_overlay style "skeleton")로 둔 레이아웃에서 불러오는
  동안 그리는 PageSkeleton 이 두 컴포넌트를 범용 컨테이너로 다루면 카드·칩이 세로로 쌓여 실제 화면과 모양이
  달라진다. 뼈대도 같은 가로 배치로 감싼다. (기본 사용자 레이아웃의 전환 덮개는 스피너라 기본 설정에서는 뼈대가
  그려지지 않는다 — 운영자가 덮개를 뼈대로 바꿨을 때의 모양이다.)
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02]
  # c01: ProductRail 은 자식 카드를 실제와 같은 가로 줄(grid-flow-col, 한 화면 2·3·4장)로 그린다
  # c02: ChipRows 는 자식 칩을 측정 전 모양과 같은 줄바꿈 가로 배치(flex-wrap)로 그린다

effects:
  - skeleton_product_rail_is_horizontal_track
  - skeleton_chip_rows_is_wrapping_row

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/PageSkeleton.rails.test.tsx
