feature: 게시판 화면 세 곳(boards, index, show)의 SEO 메타 선언

description: |
  게시판 목록 모음(boards.g7.html), 게시판 글 목록(index.g7.html), 글 상세(show.g7.html)는 meta.seo 를 켜고 sirsoft-board 확장을
  싣는다. 화면마다 page_type 과 설정 토글 키가 다르고, 치환 변수는 빈 값 대비 폴백(??)을 둔다. og 값은 _seo 컨텍스트를
  읽고, 글 상세의 구조화 데이터는 화면 JSON 이 아니라 백엔드가 실행 중에 넣는다.

# axis 의미:
#   layout — 검사 대상 화면 JSON
axes:
  layout: [boards, index, show]

effects:
  - seo_meta_enabled_with_board_extension  # meta.seo 가 있고 enabled 가 참이며 extensions 에 sirsoft-board 가 있다
  - seo_page_type_and_toggle_setting       # 화면별 page_type 과 설정 토글 키가 맞다
  - seo_vars_declared                      # 화면이 쓰는 치환 변수가 선언돼 있다
  - seo_vars_have_fallback                 # 치환 변수 표현식에 폴백(??)이 있다
  - seo_og_uses_seo_context                # og 값이 _seo 컨텍스트를 참조한다
  - boards_bot_access_optional_auth        # 게시판 모음 화면은 auth_mode 가 optional 이라 봇이 들어올 수 있다
  - show_structured_data_runtime_injected  # 글 상세는 structured_data 를 정적으로 선언하지 않는다(백엔드 주입)
  - show_post_data_source_declared         # 글 상세에 post 데이터 소스가 있다

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/board-seo-meta.test.tsx
