feature: 사용자 로그인 복귀 주소 대체 경로 (sirsoft-basic, #757)

description: |
  엔진이 실행 스킴·다른 출처 주소로의 navigate 를 무동작으로 바꾼 뒤(결정 ③), 로그인 폼의 복귀 이동이
  엔진의 「거부 → `/`」에 기대고 있어 `?redirect=javascript:…`·`//host` 로 로그인하면 로그인 화면에 남았다.
  바깥에서 온 주소(쿼리·서버 응답·호출자가 심은 경로)로 가는 navigate 에 엔진 `fallbackPath` 인자로(기존 `fallback` 은 미등록 라우트 핸들러 — 다른 인자) 그 화면의 정상 착지점을 단다
  — 로그인·본인 확인 `/`, 비밀글 비밀번호 모달은 그 게시판 목록, 주문서는 주문 완료, 비회원 주문·클레임은 비회원 주문 조회,
  주문 완료는 로그인. 주소를 레이아웃 식으로 직접 거르지 않는다(판정은 엔진 한 곳).

axes:
  redirect: [javascript_scheme, protocol_relative, empty, same_origin]

effects:
  - rejected_redirect_lands_on_fallback
  - script_scheme_never_executes
  - valid_redirect_is_honored
  - external_navigate_declares_fallback_path

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/navigate-fallback-path.test.ts
  - templates/_bundled/sirsoft-basic/tests/Playwright/specs/login-redirect-fallback.spec.ts
