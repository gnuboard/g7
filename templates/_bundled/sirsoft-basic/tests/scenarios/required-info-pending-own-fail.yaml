feature: 스스로 실패 처리를 정한 쓰기 요청도 「추가 정보가 필요합니다」 창을 연다

description: |
  필수 항목이 비어 있는 회원의 쓰기 요청을 서버가 거부하면(403, error_code 가 required_fields_pending) template.json 의 템플릿 수준
  오류 처리가 안내 창을 연다. 그런데 자기 실패 처리를 가진 요청은 그 처리가 먼저라 창이 뜨지 않고 일반 오류 알림만 나왔다.
  회원이 보낼 수 있고 서버가 막을 수 있는 쓰기 요청(게시글과 댓글의 등록, 수정, 삭제, 신고, 반응, 스크랩, 장바구니, 주문서, 주문 생성,
  배송지, 찜, 쿠폰 받기, 상품 문의와 답변)의 실패 처리 맨 앞에서 안내 창을 열고, 일반 오류 알림은 그 거부가 아닐 때만 띄운다.
  로딩 표시를 끄는 상태 정리는 두 경우 모두 그대로 돈다. 다른 실패(다른 403, 422 등)의 처리는 바뀌지 않는다.
  서버가 미입력 회원에게도 열어 둔 요청(알림, 내 정보, 본인인증, 비밀번호 확인), 로그인 전 요청, 비회원 전용 요청, 관리자 요청은 대상이 아니다.

# axis 의미:
#   case — 어느 계약인가 (표의 요청이 조각에 있음, 그 거부면 안내 창, 다른 실패는 종전 처리, 상태 정리는 두 경우 모두, 돌아올 주소는 상속원이 적음)
axes:
  case: [targets_exist, pending_opens_modal, other_errors_unchanged, cleanup_in_both, gate_available]

effects:
  - every_listed_request_is_found_with_own_fail
  - pending_rejection_opens_modal_without_error_toast
  - other_failures_keep_previous_handling
  - state_cleanup_runs_for_pending_and_other_failures
  - go_button_origin_is_set_by_base_layout_on_every_screen

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/required-info-pending-own-fail.test.ts

validation:
  browser_check: 필수 항목이 비어 있는 회원으로 글쓰기 저장, 댓글 등록, 장바구니 담기, 바로 구매, 상품 문의 등록, 주문서 결제하기를 눌러 안내 창이 뜨고 오류 알림이 함께 뜨지 않는지, 「입력하러 가기」가 그 화면 주소를 싣고 가는지 확인
