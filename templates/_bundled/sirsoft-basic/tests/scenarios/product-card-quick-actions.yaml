feature: 상품 카드 장바구니·찜 단추와 옵션 선택 창

description: |
  상품 카드(목록·검색·가로 상품 줄)에서 상세로 들어가지 않고 장바구니에 담거나 찜하는 흐름.

  - 단추는 카드 링크 밖 형제로 선다(대화형 요소를 겹치지 않는다). 찜 여부를 모르는 응답이면 찜 단추를,
    판매 중이 아니거나 구매할 수 있는 옵션이 없으면 담기 단추를 그리지 않는다.
  - 고를 것이 없는 상품(옵션 하나·추가옵션 없음)은 최소 구매 수량으로 곧바로 담는다. 고를 것이 있거나 값을
    모르는 상품, 서버가 추가옵션 사유로 거절한 상품은 옵션 선택 창을 연다.
  - 옵션 선택 창은 사용자 화면 상속원에 한 번 선언되고, 상태는 창 고유 전역 이름 공간에만 둔다. 여는 쪽이
    그 이름 공간을 null 로 비운 뒤 채운다(계속 마운트된 창에 앞 상품의 줄이 남지 않게).
  - 창은 상세 구매 카드와 같은 옵션 핸들러를 쓰되 쓰는 곳만 전역 이름 공간으로 바꾼다. 여러 조합을 쌓아
    한 번에 담고, 필수 추가옵션이 빈 줄이 있으면 요청 대신 그 줄에 사유를 보인다.
  - 찜 결과는 같은 상품의 다른 카드와 나누고, 회원이 바뀌면 버린다. 마이페이지 찜 목록의 카드는 단추를 끈다.
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, c25, c26, c27, c28, c29, c30, c31, c32, c33]
  # c01: 단추가 카드 링크 밖 형제이고 이름·눌림 상태·다크 짝을 갖는다
  # c02: showActions 를 끄면 단추가 없다
  # c03: 찜 여부를 모르는 응답이면 찜 단추를 그리지 않는다
  # c04: %s → 담기 단추가 없다
  # c05: 담기를 누르면 장바구니 요청만 가고 상세로 이동하지 않는다
  # c06: 옵션이 둘 이상이면 담기 대신 옵션 선택 창을 연다
  # c07: 비회원이 찜을 누르면 요청 없이 로그인 안내만 뜬다
  # c08: 찜을 누르면 눌림 상태가 바뀌고, 같은 상품의 다른 카드도 함께 바뀐다
  # c09: 편집기·미리보기에서는 단추를 그리되 동작하지 않는다
  # c10: 고를 것이 없는 상품은 최소 구매 수량으로 곧바로 담고 장바구니 수를 갱신한다
  # c11: 장바구니 키가 없으면 기존 발급 경로로 먼저 받고 그 키로 담는다
  # c12: %s → 담지 않고 옵션 선택 창을 연다
  # c13: 서버가 추가옵션 사유로 거절하면 옵션 선택 창으로 넘긴다
  # c14: 그 밖의 실패는 서버 문구를 알리고 창을 열지 않는다
  # c15: 창 상태를 null 로 먼저 비운 뒤 채우고, 상세를 받은 다음 창을 연다
  # c16: 옵션이 하나 이하면 그 옵션으로 고정 줄 하나를 미리 채운다(최소 구매 수량)
  # c17: 옵션이 둘 이상이면 줄 0 에서 시작한다
  # c18: 상세를 받지 못하면 알리고 창을 열지 않는다
  # c19: 비회원은 요청 없이 로그인 안내만 받는다
  # c20: 회원은 찜을 바꾸고 결과를 같은 상품의 다른 카드와 나눈다
  # c21: 인자가 없으면 종전처럼 화면 상태(context.setState)에만 쓴다
  # c22: global + 경로를 주면 같은 키를 그 전역 이름 공간 아래에 쓰고 화면 상태는 건드리지 않는다
  # c23: 수량·삭제·추가옵션·옵션 없는 수량 핸들러도 같은 대상 규칙을 따른다
  # c24: 같은 조합을 다시 고르면 줄을 더 쌓지 않고 알린다 — 다른 조합은 줄이 늘어난다
  # c25: 옵션이 하나뿐인 상품의 고정 줄을 같은 계산으로 만든다(필수 추가옵션 기본값·수량 반영)
  # c26: 사용자 화면 상속원에 쇼핑몰이 켜져 있을 때만 한 번 선언된다
  # c27: 창 상태 참조가 전부 창 고유 전역 이름 공간이고 화면 상태·상세 데이터소스를 읽지 않는다
  # c28: 상세 구매 카드와 같은 옵션 핸들러를 쓰고, 모두 전역 이름 공간에 쓰게 돼 있다
  # c29: 두 조합을 쌓으면 한 번의 담기 요청에 두 줄이 실리고, 줄 계산은 구매 카드의 식과 같다
  # c30: 필수 추가옵션을 고르지 않은 줄이 있으면 요청 대신 안내하고 그 줄에 사유를 표시한다
  # c31: 찜 목록의 카드는 같은 자리에 찜 해제 단추가 있어 카드 단추를 끈다
  # c32: %s 화면의 카드 찜·곧바로 담기가 추가 정보 미입력 거부(403 required_fields_pending)를 받으면 오류 알림 대신 「추가 정보 필요」 창을 연다
  # c33: 다른 403 은 창을 열지 않고 서버 문구를 알린다(화면 수준 403 처리로 넘어가지 않는다)

