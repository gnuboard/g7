feature: 헤더, 모바일 메뉴, 작성자 표시 컴포넌트는 표시 이름을 쓴다

description: |
  로그인 사용자 응답은 실명(name)을 그대로 두고 그 화면에서 보일 이름을 display_name 으로 따로 싣는다.
  헤더(Header)의 사용자 메뉴와 모바일 메뉴(MobileNav)의 사용자 카드는 display_name 을 먼저 읽고, 없으면(옛 응답) 실명,
  둘 다 없으면 빈 글자(모바일 메뉴의 아바타 대체 글자는 U)를 쓴다. 이름 항목을 쓰지 않는 사이트는 name 이 null 이어도
  터지지 않고 「null」 글자를 보이지 않는다.
  작성자 표시(UserInfo)는 서버가 그 자리의 표시 이름을 실어 준 값을 그대로 쓰고, null 이면 다음 값으로 넘어간다.
  실제 컴포넌트를 렌더해 잠근다.

# axis 의미:
#   case — 대상 컴포넌트와 응답 모양 (표시 이름 있음, 옛 응답, 이름 null). 작성자 표시는 받은 값을 그대로 쓰므로 옛 응답 사례가 따로 없다
axes:
  case:
    - header_display_name
    - header_legacy_response
    - header_null_name
    - mobile_nav_display_name
    - mobile_nav_legacy_response
    - mobile_nav_null_name
    - user_info_display_name
    - user_info_null_name

effects:
  - header_shows_display_name_before_real_name
  - header_falls_back_to_real_name
  - header_is_null_safe
  - mobile_nav_shows_display_name_before_real_name
  - mobile_nav_falls_back_to_real_name
  - mobile_nav_is_null_safe
  - user_info_shows_server_given_name
  - user_info_is_null_safe

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/DisplayNameComponents.test.tsx
