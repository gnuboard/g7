feature: 정보 수정 재확인 관문 — 서버가 고르는 수단과 외부 재확인 복귀 (sirsoft-basic 1.3.0, 코어 7.2.0 B6)

description: |
  비밀번호 없는 회원의 정보 수정 관문(`partials/mypage/profile/_password_verify_section`)은 재확인 요청
  (`POST /api/identity/challenges`)에 `provider_id` 를 싣지 않는다 — 서버(K17)가 그 회원에게 쓸 수 있는 수단을 고른다.
  응답이 `render_hint=external_redirect` 면 `redirect_url` 로 같은 탭 이동, 아니면 지금처럼 인증번호 칸을 연다.
  `redirect_url` 이 비어 있으면 이동하지 않고 진행 표시를 풀어 안내를 싣는다(버튼 고착 방지). 요청 본문 `return_path`
  (`/mypage/profile/edit`)가 외부 수단이 돌려보낼 화면이다.
  외부 수단에서 `?verification_token=…` 으로 돌아오면 `mypage/profile-edit` `<init>` 이 그 토큰으로 `/api/me/verify-password` 를
  불러 재확인을 마치고 주소에서 토큰을 지운다. 거절되면 관문에 머물며 안내를 싣는다.
  메일을 받을 수 없는 회원(`email_deliverable=false` — 이메일을 주지 않는 회사 계정 등)도 「본인 확인 계속하기」로 같은 요청을
  보낸다(W17). 수정 전에는 그 요청이 메일 받을 수 있는 칸에만 있어 확장점(소셜 로그인)만 보였다. 인증번호 수단이 오면 번호 칸을
  열되 「이메일로 보냈습니다」 대신 「보냈습니다」 로 알리고, 실패하면 버튼을 다시 열어 서버 안내를 싣는다.

axes:
  phase: [request, return]
  outcome: [external_redirect, external_redirect_without_url, text_code, failed, verified, rejected]
  email_deliverable: [true, false]

exclusions:
  - { phase: request, outcome: [verified, rejected], reason: "확인 토큰 검증 결과는 복귀 단계에서만 나온다" }
  - { phase: return, outcome: [external_redirect, external_redirect_without_url, text_code, failed], reason: "수단 선택 응답은 요청 단계에서만 나온다" }
  - { phase: request, outcome: external_redirect_without_url, email_deliverable: false, reason: "두 칸의 성공 분기는 같은 식이라 메일 받는 칸에서만 잰다" }
  - { phase: request, outcome: failed, email_deliverable: true, reason: "메일 받는 칸의 실패 분기는 이 변경 전부터 같은 식 — 메일 없는 칸에서만 잰다" }
  - { phase: return, email_deliverable: false, reason: "복귀 단계는 정보 수정 화면 진입(init)이라 메일 여부와 무관 — 한 번만 잰다" }

effects:
  - reauth_challenge_omits_provider
  - reauth_external_redirects
  - reauth_external_without_url_releases_button
  - reauth_text_code_keeps_code_flow
  - reauth_return_completes_gate
  - reauth_return_failure_shows_error
  - reauth_return_only_with_token
  - reauth_mailless_reaches_server_choice   # 메일 없는 회원도 서버 판정 요청·외부 수단 이동, 복귀 경로 동일
  - reauth_mailless_code_flow               # 메일 없는 회원에게 인증번호 수단이면 번호 칸, 이메일 안내 없음
  - reauth_mailless_failure_shows_error     # 메일 없는 회원의 판정 실패 시 버튼 재개·서버 안내

