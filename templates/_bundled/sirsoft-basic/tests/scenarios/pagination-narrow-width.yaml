feature: 사용자 템플릿 쪽 이동 줄이 좁은 화면에서 칸 밖으로 넘치지 않는다

description: |
  마이페이지 게시판 활동의 쪽 이동 줄(«‹1 … 7›»)이 버튼 11개라 390px 화면의 343px 칸에 378px 로 그려져
  문서 전체가 가로로 19px 밀렸다(7.1.0 실측 K3 관측 O-K3T-4: scrollWidth 394 > clientWidth 375).
  좁은 화면에서는 맨 앞·맨 끝 쪽 버튼을 숨기고(번호 목록이 첫 쪽과 마지막 쪽을 늘 품는다),
  그래도 넘치면 줄을 바꾼다. 같은 컴포넌트를 쓰는 게시판 목록·스크랩·내 반응 화면에 함께 적용된다.

axes:
  viewport: [narrow, wide]

effects:
  - pagination_fits_narrow_width

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/PaginationNarrowWidth.test.tsx
