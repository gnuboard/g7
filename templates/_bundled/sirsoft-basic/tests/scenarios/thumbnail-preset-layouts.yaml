feature: 사용자 화면 이미지 자리의 썸네일 규격 적용 — 장바구니 항목, 게시판 카드형 목록, 상품 상세 (#869)

description: |
  업로드 이미지는 2000px 원본이 64~80px 장바구니 칸이나 카드 목록에 그대로 내려갔다. 레이아웃의 `<img>` 가 표시 크기에
  맞는 규격(`thumbPreset`)을 들고 있어야 Img 가 주소에 `?size=` 를 붙여 썸네일을 받는다. 규격이 빠져도 화면은 멀쩡해
  보이고 전송량으로만 드러나므로, 굽힌 `.json` 의 이미지 자리를 실제 엔진으로 렌더해 나온 주소로 고정한다.

  - 장바구니 항목 80px 상품 칸: sm, 지연 로딩
  - 게시판 카드형 썸네일: md, 지연 로딩. 썸네일 없는 글은 img 를 그리지 않는다. 서명 주소는 기존 쿼리를 그대로 두고 끝에 붙인다
    (순서가 바뀌면 서명 검증이 깨진다)
  - 상품 상세 리뷰 탭 80px 사진 칸: sm
  - 리뷰 확대 창의 큰 사진: 규격 없이 원본, 레이아웃 주석에 면제 사유(`thumb-exempt:`)
  - 상품 상세 메인 갤러리: ProductImageViewer 가 규격을 고르므로 레이아웃은 원 배열을 그대로 넘긴다
  - 공개 자산 디스크(CDN) 행(#878): `download_url` 은 직접 주소라 규격이 붙지 않는다. 리뷰 탭 사진 칸·카테고리 배너(lg)는
    `preview_url`(항상 API 서빙 주소)을 먼저 쓰고, 그 필드가 없는 예전 응답은 `download_url` 로 돌아간다. 확대 창은 원본
  - 반응 아이콘(글·댓글·마이페이지 반응 목록): object-contain 으로 모양을 보이는 자리라 자르기 규격(xs)을 붙이지 않고
    면제 사유를 남긴다(정사각이 아닌 아이콘의 양 끝이 잘린다)
  - 게시글 보기의 접힌 본문 미리보기(답글 목록 답글 본문, 답글 보기 위 원글 인용): 이미지·표 숨김을 `!hidden` 으로 쓴다.
    CKEditor5 확장 조각의 `.ck-content img { display: inline }` 은 레이어 밖 규칙이라 레이어 안 Tailwind `hidden` 을 이긴다 —
    숨긴 본문 이미지가 보이고 `?size=lg` 요청이 나가 「숨김 + lazy 면 요청 0」 전제가 깨졌다(브라우저 실측 2026-11-05)

  Img 컴포넌트 자체의 `thumbPreset` 처리는 컴포넌트 테스트가 따로 본다. 이 매니페스트의 축은 「레이아웃이 어느 자리에
  어느 규격을 주는가」 다.

axes:
  screen: [cart_item, board_card_list, product_detail_reviews, product_detail_gallery, reaction_icons, board_collapsed_preview, shop_category_banner]

