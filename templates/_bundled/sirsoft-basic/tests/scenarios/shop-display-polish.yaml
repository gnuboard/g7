feature: 상점 화면 표시 다듬기

description: |
  상품 목록의 쪽 번호, 상품 상세의 분류 경로 링크, 주문 품목·주문 목록의 송장 조회 링크, 쿠폰 받기 창의 할인율 표기,
  주문서 적립금의 상품 합계 기준 안내. 그리고 이 템플릿이 공개 설정 API 응답에서 읽는 키가 이커머스의 공개 키 목록 안에
  있는지(밖의 키를 읽으면 조용히 빈 값이 된다)와, 푸터가 쇼핑몰 사업자 정보를 받지 않고 쇼핑몰 모듈이 푸터 바로 뒤 공용 자리(user_global_footer)에
  그리게 두는지(두 곳에서 그리면 두 번 나온다).
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07, c08]
  # c01: 상품 목록의 쪽 이동이 쪽 번호 컴포넌트이고 다른 조건을 지킨 채 이동한다
  # c02: 상품 상세의 분류 경로가 대표 분류 화면으로 가는 링크이고, 주소를 모르면 글자로 남는다
  # c03: 주문 품목의 송장이 조회 주소가 있으면 새 창 링크, 없으면 글자다 (좁은 화면·넓은 화면 두 곳)
  # c04: 쿠폰 받기 창의 정률 할인율을 숫자로 바꿔 소수 끝 0 을 떼어 낸다
  # c05: 주문서 적립금 입력에 상품 합계가 기준에 못 미칠 때만 안내 줄이 보인다
  # c06: 주문 목록에 송장 조회 주소가 있는 주문만 새 창으로 여는 배송 조회 링크가 있다
  # c07: 레이아웃이 읽는 설정 키가 모두 이커머스 공개 키 목록에 있다
  # c08: 푸터는 사업자 정보를 받지 않고, 쇼핑몰이 그 바로 아래 공용 자리(user_global_footer)에 그린다

effects:
  - product_list_uses_pagination_component
  - product_category_path_is_link
  - order_item_tracking_is_link_when_url_known
  - coupon_modal_rate_has_no_trailing_zero
  - checkout_mileage_shows_min_product_total_notice
  - order_list_has_track_shipping_link
  - consumed_setting_keys_are_public
  - footer_leaves_business_info_to_ecommerce_fragment

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/shop-display-polish.test.ts
  - templates/_bundled/sirsoft-basic/__tests__/layouts/public-settings-consumed-keys.test.ts
