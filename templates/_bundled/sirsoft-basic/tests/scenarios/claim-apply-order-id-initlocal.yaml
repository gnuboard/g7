feature: 클레임 신청서 — 주문 데이터소스 initLocal 이 주문 ID 를 실제로 읽는다 (#869)

description: |
  엔진은 데이터소스 initLocal 의 경로를 응답 본문을 한 겹 벗긴 값(주문 객체)에 대고 읽는다. 회원 신청 셸은 claimOrderId 를
  `data.id` 로 적어 주문 객체의 `data.id`(없음)를 읽었고, 그 항목은 언제나 undefined 였다. 주문 상세 셸과 같이 `id` 로 읽는다.

# axis 의미:
#   shell — 회원 신청 셸 단독 판정 / 주문 상세 셸과의 대조
axes:
  shell: [member_apply, member_apply_vs_order_show]

effects:
  - claim_apply_order_id_initlocal_reads_order_object   # 신청 셸 order.initLocal.claimOrderId 가 주문 객체에서 ID 를 읽는다
  - claim_apply_initlocal_matches_order_show            # 주문 상세 셸과 같은 경로다

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/claim-apply-order-id-initlocal.test.ts

validation:
  browser_check: 총괄 번들 재빌드 뒤 — 주문 상세에서 신청 단추로 들어간 화면의 `_local.claimOrderId` 가 주문 ID
