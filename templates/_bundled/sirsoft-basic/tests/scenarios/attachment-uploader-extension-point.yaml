# 시나리오 매니페스트 — 사용자 FileUploader 의 업로더 계약 주소 해석
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: user_file_uploader_endpoints

description: |
  첨부 업로더 확장점(attachment_uploader)의 계약은 화면이 업로드·삭제·정렬 주소를 직접 넘긴다. 사용자 템플릿 FileUploader 는
  사용자 화면에 없는 종전 기본 주소(`/api/attachments*`)를 쓰지 않는다. 레이아웃 주입 동작은 코어
  `tests/scenarios/attachment-uploader-extension-point.yaml` 이 소유한다.

  - 주소를 넘기지 않으면 업로드·삭제 주소가 비고 정렬 주소가 없다. 그 상태로 올리면 요청 없이 실패로 두고
    onUploadError 와 개발 경고를 낸다(저장 흐름은 failedCount 로 멈춘다). 주소를 넘기면 그 주소로 보낸다.
  - reorder 가 null·빈 문자열·키 없음이면 정렬 주소가 없고(기본값 없음), 정렬 주소가 없으면 끌어 옮겨도 PATCH 를 보내지 않는다.

axes:
  case: [user_endpoints_without_defaults, user_upload_without_endpoint, user_upload_with_endpoint, user_reorder_null_empty_or_missing, user_component_passes_null_reorder, user_drag_with_null_reorder, user_drag_with_reorder_endpoint]

effects:
  - user_uploader_has_no_default_endpoint                          # 주소를 넘기지 않으면 업로드·삭제 주소가 비고 정렬 주소가 없다
  - user_uploader_missing_endpoint_reports_error_without_request   # 업로드 주소 없이 올리면 요청 없이 실패, onUploadError·개발 경고
  - user_uploader_posts_to_given_endpoint                          # 업로드 주소를 넘기면 그 주소로 보낸다(대조군)
  - user_uploader_reorder_has_no_default                           # reorder 가 null·빈 문자열·키 없음이면 정렬 주소가 없고 컴포넌트도 null 을 넘긴다
  - user_uploader_reorder_null_sends_no_patch                      # 정렬 주소가 없으면 끌어 옮겨도 PATCH 를 보내지 않는다
  - user_uploader_reorder_endpoint_sends_one_patch                 # 정렬 주소가 있으면 PATCH 를 한 번 보낸다(대조군)

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/FileUploaderNoDefaultEndpoint.test.tsx
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/FileUploaderReorderNull.test.tsx
