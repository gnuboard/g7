feature: 사용자 템플릿 첨부 다운로드 핸들러의 비밀글 토큰 동반과 요청 경계 (sirsoft-basic)

description: |
  `downloadAttachment` 핸들러(templates/_bundled/sirsoft-basic/src/handlers/downloadAttachment.ts)는 코어 ApiClient 로
  첨부를 blob 으로 받는다. 행위자 기록과 파일 이름, 실패 토스트는 sirsoft-board 매니페스트
  `board-attachment-download-actor.yaml` 이 소유한다. 이 매니페스트는 그 매니페스트가 선언하지 않은, 사용자 템플릿
  핸들러만의 요청 경계를 소유한다.

  - 비밀글 열람 확인 토큰(`_global.secretViewToken`)이 있으면 `X-Board-Secret-View-Token` 요청 헤더로 싣는다.
    비밀글의 첨부도 비밀번호로 연 사람만 받을 수 있어야 하기 때문이다(`board-secret-view-token.yaml` 의 토큰을 다운로드 요청에도 쓴다).
  - 토큰이 없으면 헤더를 만들지 않는다. 빈 값을 보내면 서버가 잘못된 토큰으로 읽는다.
  - url 이 없으면 요청 없이 조용히 끝낸다.

axes:
  download_case: [token_present, token_absent, no_url, request_failure]

effects:
  - download_carries_secret_view_token              # 토큰이 있으면 X-Board-Secret-View-Token 헤더로 싣는다
  - download_without_token_sends_no_secret_header   # 토큰이 없으면 헤더 객체가 비어 있다(빈 값 전송 금지)
  - download_without_url_skips_request              # url 이 없으면 api.get 을 부르지 않는다

test_files:
  - templates/_bundled/sirsoft-basic/src/handlers/__tests__/downloadAttachment.test.ts

validation:
  note: |
    단위 시험이 G7Core.api.get 호출 인자(헤더 포함)를 직접 단언한다. request_failure 갈래의 실패 토스트 효과는
    board-attachment-download-actor.yaml 의 download_failure_shows_error_toast 로 표식한다.
