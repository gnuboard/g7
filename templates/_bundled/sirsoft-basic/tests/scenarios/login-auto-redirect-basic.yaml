feature: 로그인 화면 자동 이동 · 비상 진입로 (sirsoft-basic 1.3.0, 코어 7.2.0 B1⑤⑥)

description: |
  사이트가 회사 계정 로그인으로 바로 보내도록 정했으면(`_global.appConfig.auth.auto_redirect.user`) `auth/login` `<init>` 이
  그 경로로 `redirect replace` 한다(redirect 쿼리 전달, 경로에 쿼리가 있으면 `&`). 주소에 `local`·`login_handoff`·`sso_error`·
  `sso_pending`·`sso_link` 중 하나라도 있으면 이동하지 않는다 — 오류로 돌아온 화면이 다시 IdP 로 튕기면 무한 왕복이다.
  자동 이동이 켜진 사이트에는 하단 「다른 방법으로 로그인」(`/login?local=1`) 링크가 있다.

axes:
  auto_redirect: [on, off]
  query: [none, redirect, local, login_handoff, sso_error, sso_pending, sso_link]

exclusions:
  - { auto_redirect: off, query: [redirect, local, login_handoff, sso_error, sso_pending, sso_link], reason: "자동 이동이 꺼진 사이트는 쿼리와 무관하게 이동하지 않는다 — off 는 query=none 한 칸으로 잰다" }

effects:
  - local_notice_shown_on_local_entry
  - auto_redirect_replaces_to_configured_path
  - auto_redirect_carries_redirect
  - auto_redirect_skipped_by_bypass_query
  - auto_redirect_off_stays_on_login
  - local_login_link_follows_auto_redirect

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/login-auto-redirect.test.tsx
