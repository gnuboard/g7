feature: sirsoft-basic TabNavigation — 탭 렌더·전환·반응형 분기와 탭 줄 가로 넘침

description: |
  탭 렌더(활성 스타일·뱃지)·전환(onTabChange)·disabled·hiddenTabIds·모바일 Select 분기(useResponsive)를 검증한다.
  TabNavigation 의 탭은 줄어들지 않는다(shrink-0·whitespace-nowrap). 화면 너비가 모바일 기준(768px) 이상이라 탭 줄로 그리는데
  탭이 많으면(마이페이지 탭 9개) nav 에 넘침 처리가 없어 페이지 전체가 가로로 밀렸다(768px 실측 ko 824·en 910·ja 1043px).
  nav 를 가로 스크롤 영역(overflow-x-auto)으로 두어 탭 줄만 스크롤한다. 밑줄(활성 탭 border-b-2)은 탭 상자 안이라 잘리지 않는다.
  가로 스크롤이 생기면 마운트·활성 변경 때 활성 탭이 보이도록 탭 줄의 가로 위치만 가장 가까운 쪽으로 옮긴다(끝 탭이 활성이어도
  처음 위치에 있어 탭이 안 보였다 — 768px en·ja 실측). 페이지 세로 스크롤은 건드리지 않는다(scrollIntoView 미사용).
  admin_basic 의 TabNavigation 은 탭이 줄어들며 접혀(shrink-0 없음) 같은 넘침이 없다.

axes:
  case: [desktop_render, badge, tab_change, disabled, hidden_tabs, mobile_select, overflow, active_visible]

effects:
  - tabs_rendered                    # 데스크톱은 nav 안 버튼으로 모든 탭
  - desktop_has_no_select            # 데스크톱은 Select 를 그리지 않음
  - active_tab_styled                # 활성 탭 border-b-2
  - badge_shown                      # 뱃지(0 포함) 표시
  - tab_change_called                # 클릭 시 onTabChange, 상태로 전환
  - disabled_tab_inert               # disabled 탭은 호출 없음·disabled 속성
  - hidden_tabs_omitted              # hiddenTabIds 의 탭은 그리지 않음(모바일 포함)
  - mobile_renders_select            # 모바일은 Select 만, 활성 라벨·뱃지 병기
  - mobile_root_keeps_editor_attrs   # 모바일 루트에도 id·editorAttrs
  - active_tab_scrolled_into_view    # 활성 탭이 탭 줄 밖이면 가장 가까운 쪽으로 가로 위치를 옮기고, 보이면 그대로
  - tab_row_scrolls_horizontally     # nav 가 overflow-x-auto 이고 탭은 shrink-0 그대로(세 variant)

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/TabNavigation.test.tsx
