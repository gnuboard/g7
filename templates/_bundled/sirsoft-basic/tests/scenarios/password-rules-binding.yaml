# audit:allow test-scenario-coverage[cross_product] reason: |
#   화면(마이페이지 변경)과 컴포넌트(PasswordInput) 두 표면이라 축이 표면마다 다르다. 명목상 곱을 케이스로 나누지 않고
#   effects 단위로 잠근다. 서버 판정(규칙·재사용·본인 증명 뒤 비교)은 코어 PHPUnit 이, 화면 흐름 실측은 Playwright spec 이 맡는다.

feature: 비밀번호 규칙 바인딩과 마이페이지 비밀번호 변경 (sirsoft-basic, #736)

description: |
  가입·재설정·마이페이지 변경·로그인 변경 단계의 새 비밀번호 칸은 보안 환경설정 값으로 규칙을 바인딩하고(8 하드코딩 제거),
  PasswordInput 의 특수문자·문자 종류 조합 판정을 서버와 같은 셈법으로 맞춘다. 마이페이지 변경 화면은 마지막 변경·만료 예정을
  보여 주고 422 를 칸 아래에 싣는다.

axes:
  surface: [mypage, password_input, register_reset]
  status: [expiring, not_applied]
  response: [ok, 422]
  settings: [defaults, all_rules_on, server_rules_partial]

effects:
  - mypage_shows_password_status
  - mypage_inline_field_errors
  - rules_hint_reflects_settings
  - mypage_success_announces_other_devices_logout
  - password_input_renders_rules_and_toggle
  - password_input_rules_match_backend
  - server_only_rules_note_shows_enabled_rules_only

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-change-password.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/layouts/auth-password-rules-binding.test.ts
  - templates/_bundled/sirsoft-basic/src/components/basic/__tests__/PasswordInput.test.tsx
  - tests/Playwright/specs/user/mypage-password-change.spec.ts
