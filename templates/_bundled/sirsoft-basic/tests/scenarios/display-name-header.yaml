feature: 헤더, 모바일 드로어, 댓글 입력 칸의 내 아바타는 표시 이름을 쓴다

description: |
  로그인 사용자 응답은 실명(name)과 닉네임(nickname)의 원본을 그대로 두고, 그 화면에서 보일 이름을 display_name 으로 따로 싣는다.
  실명을 표시용으로 쓰던 자리(데스크톱 헤더의 사용자 메뉴, 모바일 드로어의 사용자 카드, 댓글과 답글 입력 칸의 내 아바타)는
  display_name 을 먼저 읽고 없으면(옛 응답) 실명으로 넘어간다. 이름 항목을 쓰지 않는 사이트는 name 이 null 이어도 빈칸이나
  「null」 글자가 나오지 않아야 한다. 헤더는 로그인 사용자 객체를 통째로 받고, 내 정보에서 표시 이름 종류를 바꿔 저장하면
  로그인 사용자를 다시 받아 새로고침 없이 바뀐다.

  실명을 써야 하는 자리(주문서의 주문자 기본값, 내 정보의 이름 자리)는 그대로 둔다.

# axis 의미:
#   place — 이름이 보이는 자리 (데스크톱 헤더, 모바일 드로어, 댓글 입력 칸, 답글 입력 칸, 실명을 유지하는 자리, 번역)
axes:
  place: [desktop_header, mobile_drawer, comment_input, reply_input, real_name_kept, translations]

effects:
  - header_receives_current_user_with_display_name
  - drawer_card_shows_display_name_before_real_name
  - drawer_card_is_null_safe
  - comment_avatar_uses_display_name_then_real_name_then_guest_name
  - reply_avatar_uses_display_name_and_is_null_safe
  - orderer_default_and_profile_name_keep_real_name
  - display_name_keys_exist_in_ko_and_en

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/display-name-header.test.ts
