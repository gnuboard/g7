validation:
  browser_check: 재실측 — 주문서 「배송지 관리」 수정 폼 → 닫기 단추/Esc → 다시 열기(목록) → 새 배송지(빈 폼·POST), 빠른 입력 30자 글자 손실 0·입력 지연 체감, 국가 선택칸 US↔KR, 주소 검색 뒤 칸 값. — 마이페이지 회원 탈퇴 창 체크 → 취소 → 다시 열기, 클레임 상세 사진 2장 번갈아 열기. — 주문서 배송지 관리·마이페이지 배송지·주문 상세 배송지 변경·클레임 사진 창을 닫기 단추/Esc/바깥 클릭/취소/선택/저장으로 닫은 뒤 DevTools 콘솔 `G7Core.state.get()` 의 해당 이름 공간이 null(관리자 앱 키 비밀번호 창 `appKeyPassword` 는 빈 문자열)
