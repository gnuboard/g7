feature: 게시판 글쓰기 화면은 회원에게 이 게시판에서 보이는 이름을 미리 알린다

description: |
  게시판마다 작성자 표시 이름의 종류(닉네임, 가린 이름 등)가 다를 수 있다. 회원이 새 글을 쓰기 전에 자기 글에 어떤 이름이
  붙는지 알 수 있게, 글쓰기 폼의 작성자 자리에 「이 게시판에서 보이는 이름: {이름} ({종류 이름})」 한 줄을 그린다.

  - 값은 글쓰기 메타(form_meta)의 author_display_name 과 author_display_kind_label 을 그대로 쓴다(화면은 이름을 계산하지 않는다).
  - 종류 이름이 없으면 괄호 없이 이름만 적는다.
  - 로그인한 회원의 새 글(답글 포함)에서만 그린다. 비회원(서버가 null 을 준다), 수정 화면(작성자 정보 줄이 따로 있다),
    값을 주지 않는 응답(옛 서버)에서는 그리지 않는다.
  - DOM id 는 board_author_display_notice 다.
  - 같은 화면들의 작성자 이름 글자(수정 화면 머리의 작성자 배지, 상세 화면의 원글 작성자)는 이름이 없는 작성자(계정이 지워진 회원)를
    빈칸 대신 「알 수 없음」으로 그린다.

# 축은 하나(case)로 편다 — 화면의 어느 부분을 재는지다. 부분끼리 교차하지 않는다.
axes:
  case: [member_new_post, hidden, placement, missing_author_name]

effects:
  - notice_shown_to_member_writing_new_post
  - notice_omits_kind_when_label_missing
  - notice_hidden_for_guest_edit_and_missing_name
  - notice_sits_in_author_slot_with_safe_markup
  - author_name_falls_back_to_unknown_when_missing

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/board-author-display-notice.test.ts

validation:
  note: |
    표시 조건은 실제 식 엔진으로, 문구는 실제 번역 엔진과 ko, en 다국어 파일로 풀어 잰다.
    브라우저 확인(게시판의 표시 이름 종류를 바꾼 뒤 회원 글쓰기 화면의 한 줄, 긴 이름의 줄바꿈)은 통합 실측에서 한다.
