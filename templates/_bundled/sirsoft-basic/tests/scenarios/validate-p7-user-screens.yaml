notes: |
  적립 마일리지의 서버 포맷 키(`total_earned_points_amount_formatted`)를 미리보기 스냅샷과 신청서 비교 블록에
  싣는 일은 백엔드 몫이다. 화면은 그 키를 우선하고, 없는 응답에서만 종전 표기로 떨어진다.
