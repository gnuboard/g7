# audit:allow test-scenario-coverage[cross_product] reason: 결함 회귀 묶음이라 화면과 결함 종류가 서로 독립이다. 교차 조합(예: 주문서 × 적립 표기)에는 뜻이 없고, 효과마다 그 효과를 여는 조합을 테스트 docblock 이 직접 적는다.
feature: "#599 validate P7 — 사용자 화면(sirsoft-basic) 결함 회귀"

description: |
  브랜치 검증(2026-09-23)이 주문상세·주문서·클레임 신청/상세 화면에서 찾은 결함을 잠근다.

  - 주문상세: 선택 핸들러에 claimable 판정을 넘긴다(전체선택이 잠긴 칸까지 고르던 결함) · 행 체크박스 id/for ·
    철회 뒤 claimable 재조회 · 어디서도 읽지 않던 refundReasons 데이터소스 제거.
  - 주문서: 기본 배송지 채움이 배송지 관리 창의 목록 재조회마다 선택을 덮던 결함 — onSuccess 컨텍스트에는
    `_local` 이 없어 `sirsoft-basic.markLocalOnce` 가 첫 회만 참을 돌려준다.
  - 클레임 화면: 반복 노드의 간격 클래스를 부모로 · 상세 첨부 격자 · 수정 화면의 계좌 미입력 안내 ·
    결제 버튼 라벨의 금액을 번역 파라미터로 · 라디오 다크 짝 · 적립 마일리지를 서버 포맷으로 ·
    첨부 accept/maxSize 를 서버 설정으로.
  - 주문 목록: 추가옵션 「외 N건」 번역 키.
  - 첨부 컴포지트: 용량·형식 거절 문구를 `attachment.*` 키로.
  - (P7-B) 환불 계좌 세 칸은 `setClaimRefundAccountField` 를 거쳐 가린 프리필을 「전부 그대로 / 전부 새로」 로 다루고,
    가린 값이 채워진 동안 안내를 띄운다.

axes:
  screen: [order_detail, checkout, claim_detail, claim_apply, claim_edit, order_list]
  fault:
