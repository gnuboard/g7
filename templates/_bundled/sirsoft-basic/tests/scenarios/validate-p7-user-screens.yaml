  - claim_edit_hides_refund_account_required_notice
  - claim_submit_label_passes_amount_as_param
  - claim_apply_blue_text_has_dark_pair
  - claim_earned_points_reads_server_formatted
  - claim_uploader_limits_follow_server_settings
  - withdraw_refreshes_claimable_on_order_detail
  - order_detail_has_no_dead_refund_reasons_source
  - order_list_additional_option_more_is_translated
  - file_uploader_reject_messages_are_translated
