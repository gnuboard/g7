# 시나리오 매니페스트 — 알림(Toast)은 화면이 바뀌어도 만든 시각부터 정해진 시간만 보인다 (sirsoft-basic)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: toast_lifetime_across_remount

description: >-
  관리자 템플릿과 같은 Toast 구현이다. 이 템플릿은 화면 대부분이 `_user_base` 를 상속해 화면을 옮겨도 Toast 가 다시 마운트되지
  않지만, 베이스가 다른 화면을 거치거나 Toast 가 다시 그려지는 경우에 같은 결함(마운트마다 표시 시간을 처음부터 다시 셈, 지난 항목을
  다시 그림)이 난다. 항목의 만든 시각(`createdAt`, 엔진 toast 핸들러가 넣는다)부터 세어 남은 시간만 보이고, 이미 지난 항목은 그리지
  않고 상태에서 지운다. 떠나는 Toast 는 타이머를 거둔다. 만든 시각이 없는 항목은 종전대로 처음 받은 시각부터 센다.

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/Toast.lifetime.test.tsx

axes:
  component: [toast]
  mount: [late, remount, after_blank, expired]

effects:
  - toast_shows_only_remaining_time_from_created_at
  - toast_keeps_lifetime_across_remount
  - toast_expired_item_never_reappears
  - toast_without_created_at_counts_from_mount
  - toast_manual_close_removes_once

notes: |
  e2e_browser=not_applicable — 사용자 화면의 로그인과 첫 화면은 같은 `_user_base` 를 써서 브라우저 흐름에서 다시 마운트가 일어나지
  않는다(같은 결함이 화면에 드러나는 경로가 없다). 화면을 건너는 흐름은 관리자 템플릿의 Playwright spec 이 잰다.
