feature: 주문서는 운영자가 정한 주문서 항목대로 칸을 그리고 추가 항목 값을 주문 요청에 싣는다

description: |
  주문서의 주문자 이메일, 상세 주소, 배송 메모는 사용과 필수 여부가 레이아웃에 박혀 있었다. 운영자가 쇼핑몰 설정에서
  이 세 항목의 사용과 필수를 바꾸고 추가 항목을 더할 수 있게 되면서, 화면이 주문서 응답의 order_fields 를 따라 그린다.

  - 설정은 계산값 checkoutFields 한 곳에서 읽는다. order_fields 가 없는 응답(옛 서버, 받기 전)에서는 종전 화면과 같은
    기본값을 쓴다: 주문자 이메일은 사용하되 비회원만 필수, 상세 주소는 사용과 필수, 배송 메모는 사용과 선택, 추가 항목 없음.
  - 잠긴 항목(주문자와 수령인의 이름과 연락처, 주소)은 설정과 무관하게 늘 필수로 그린다.
  - 추가 항목은 주문자 구획과 배송지 구획의 끝에 회원 항목과 같은 입력 컴포넌트로 그리고, 값은 폼 상태
    _local.checkoutForm.extra_fields.{키} 에 담아 주문 요청의 extra_fields 로 보낸다. 사용이 꺼진 내장 항목은 보내지 않는다.
  - 검증 오류(422)의 키 extra_fields.{키}(묶음 유형은 하위 경로)는 그 칸 아래에 그린다.
  - 주문자 이름의 초깃값은 회원의 표시 이름이 아니라 실명이다.
  - 주문자 이름·연락처·이메일은 칸에 보이는 값을 그대로 보낸다 — 건드리기 전에는 계정 값을 채워 보이고, 사용자가 지운 칸은 빈 값으로 보낸다(계정 값으로 되채우지 않는다).
  - 주문 완료 화면은 주문 응답의 extra_fields 를 구획별로 「라벨: 값」으로 보인다.

# 축은 하나(case)로 편다 — 화면의 어느 부분을 재는지다. 부분끼리 교차하지 않는다.
