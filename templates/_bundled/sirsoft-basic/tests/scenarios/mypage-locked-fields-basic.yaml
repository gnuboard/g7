feature: 마이페이지 정보 수정 — 회사 계정이 관리하는 칸 잠금 (sirsoft-basic 1.4.0, 코어 7.2.0 B4)

description: |
  회사 계정이 잠근 칸(이름, 닉네임, 휴대폰, 전화, 언어)은 내 정보 항목 계약(`profileFields`)에 `readonly: true`, `locked_reason: 'sso'` 로 온다.
  정보 수정 폼(`partials/mypage/profile/_edit`)은 공용 항목 조각으로 그 칸을 `readOnly`(언어는 `disabled`)로 그리고 칸 아래에
  「회사 계정에서 관리하는 항목입니다」를 보인다. 서버가 잠긴 칸 변경을 422 `user.field_locked`(칸별 `errors.{field}`)로 거절하면
  그 칸 아래에 오류를 싣는다. 잠긴 칸이 없거나 잠금 키가 없는 계약이면 모두 고칠 수 있다.

# axis 의미:
#   locked_fields — 항목 계약에서 회사 계정이 잠근 칸: some 은 일부 칸이 잠김, empty 는 잠긴 칸 없음(readonly 가 모두 false),
#                   absent 는 계약에 readonly 와 locked_reason 키 자체가 없음
axes:
  locked_fields: [some, empty, absent]
  response: [none, field_locked]

exclusions:
  - { locked_fields: [empty, absent], response: field_locked, reason: "잠긴 칸이 없으면 서버가 field_locked 로 거절하지 않는다" }

effects:
  - locked_fields_render_read_only
  - locked_fields_show_company_notice
  - locked_fields_absent_keeps_editable
  - field_locked_error_shown_per_field

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-locked-fields.test.tsx
