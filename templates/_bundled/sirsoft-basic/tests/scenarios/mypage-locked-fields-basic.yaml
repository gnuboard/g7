feature: 마이페이지 정보 수정 — 회사 계정이 관리하는 칸 잠금 (sirsoft-basic 1.3.0, 코어 7.2.0 B4)

description: |
  `user` 응답의 `locked_fields` 에 든 칸(이름·닉네임·휴대폰·전화·언어)은 정보 수정 폼(`partials/mypage/profile/_edit`)에서
  `readOnly`(언어는 `disabled`)이고 칸 아래에 「회사 계정에서 관리하는 항목입니다」를 보인다. 서버가 잠긴 칸 변경을
  422 `user.field_locked`(칸별 `errors.{field}`)로 거절하면 그 칸 아래에 오류를 싣는다. `locked_fields` 가 비었거나 없으면
  (7.2.0 이전 응답) 지금처럼 모두 고칠 수 있다.

axes:
  locked_fields: [some, empty, absent]
  response: [none, field_locked]

exclusions:
  - { locked_fields: [empty, absent], response: field_locked, reason: "잠긴 칸이 없으면 서버가 field_locked 로 거절하지 않는다" }

effects:
  - locked_fields_render_read_only
  - locked_fields_show_company_notice
  - locked_fields_absent_keeps_editable
  - field_locked_error_shown_per_field

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-locked-fields.test.tsx
