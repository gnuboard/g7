feature: 바로 구매 — 장바구니를 거치지 않는 주문

description: |
  상품 상세의 「바로 구매」는 장바구니에 담지 않고 고른 항목을 곧바로 주문서로 보낸다. 먼저 담았다가 주문하면
  장바구니에 이미 있던 같은 상품과 수량이 합쳐져 구매 한도에 걸리거나 장바구니가 어질러진다.
  시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05]
  # c01: 바로 구매 버튼이 존재한다
  # c02: 바로 구매 흐름이 체크아웃을 호출한다
  # c03: 바로 구매 흐름이 장바구니 담기(POST /cart)를 거치지 않는다 (회귀 가드)
  # c04: 바로 구매 체크아웃 body 가 direct_items 를 전달한다
  # c05: 바로 구매 direct_items 가 옵션을 product_option_id(옵션 ID)로 전달한다 (값 기반 option_values 미사용)

effects:
  - buy_now_skips_cart

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/shop-buy-now-direct-checkout.test.tsx
