feature: sirsoft-basic 검색창 최근 검색어 — 머리글·모바일 서랍·통합검색 화면·상품 목록·분류·게시판 목록

description: |
  세 검색창을 RecentSearchCombobox 로 그린다. 빈 칸에 초점을 두면 같은 범위(core.site)의 최근 검색어가 펼쳐지고
  (항목 삭제·전체 삭제·자동 저장 끄기/켜기), 제출(Enter·검색 단추·항목 선택)할 때 검색창이 기록을 기다리지 않고 맡은 뒤
  onSearch 로 통합검색에 간다. 주소로 들어온 q 는 보이기만 하고 기록하지 않는다. 머리글·서랍 검색창은 resultPath(/search)를
  받아 주소를 따라간다 — 통합검색 화면이면 주소의 q, 다른 화면이면 빈칸(검색 뒤 다른 화면에 검색어가 남지 않게). 목록·기록은 코어 엔진
  G7Core.useSearchHistory 가 맡고, 엔진이 범위를 쓸 수 없다고 답하거나(기능 꺼짐·미선언·옛 엔진) 레이아웃 편집 모드·
  편집기 미리보기 화면이면 펼치지 않고 기록하지 않는 평범한 검색창이다.
  축 surface 는 검색창 자리(component 는 컴포넌트 자체 계약). 회원/비회원 저장 경로 차이는 엔진 시나리오
  (tests/scenarios/search-history.yaml)가 소유한다.
  상품 목록·분류 화면 검색줄은 상품 검색 범위(sirsoft-ecommerce.products), 게시판 목록 세 유형 검색칸은 게시글 검색 범위
  (sirsoft-board.posts)를 쓴다. 종전 검색 동작(다른 조건 유지·1쪽 복귀·칸을 비우고 제출하면 검색어 조건 풀기)과 모양을 그대로 두고,
  범위를 선언한 확장이 꺼져 있으면 평범한 검색칸이다. 최근 검색어가 0건이거나 자동 저장이 꺼져 안내만 보일 때는 listbox 가
  없으므로 입력칸이 펼침(aria-expanded)을 알리지 않고 없는 목록을 aria-controls 로 가리키지 않는다.
  게시판 목록 검색칸은 종전 type=search 입력칸의 × 지우기를 showClear 로 잇는다 — 글자가 있을 때만 보이고, 누르면(또는 Esc)
  칸만 비우고 초점을 남기며 검색·기록하지 않는다. 다른 검색칸은 종전에도 × 가 없었으므로 켜지 않는다.

