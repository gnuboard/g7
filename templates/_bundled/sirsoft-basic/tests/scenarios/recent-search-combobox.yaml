feature: sirsoft-basic 검색창 최근 검색어 — 머리글·모바일 서랍·통합검색 화면

description: |
  세 검색창을 RecentSearchCombobox 로 그린다. 빈 칸에 초점을 두면 같은 범위(core.site)의 최근 검색어가 펼쳐지고
  (항목 삭제·전체 삭제·자동 저장 끄기/켜기), 제출(Enter·검색 단추·항목 선택)할 때 검색창이 기록을 기다리지 않고 맡은 뒤
  onSearch 로 통합검색에 간다. 주소로 들어온 q 는 보이기만 하고 기록하지 않는다. 목록·기록은 코어 엔진
  G7Core.useSearchHistory 가 맡고, 엔진이 범위를 쓸 수 없다고 답하거나(기능 꺼짐·미선언·옛 엔진) 레이아웃 편집 모드·
  편집기 미리보기 화면이면 펼치지 않고 기록하지 않는 평범한 검색창이다.
  축 surface 는 검색창 자리(component 는 컴포넌트 자체 계약). 회원/비회원 저장 경로 차이는 엔진 시나리오
  (tests/scenarios/search-history.yaml)가 소유한다.

axes:
  surface: [component, header_desktop, mobile_drawer, search_page]

effects:
  - empty_focus_opens_recent_list
  - combobox_listbox_option_aria
  - keyboard_arrow_enter_escape_delete
  - item_select_searches_and_records
  - item_delete_and_clear_all
  - auto_save_off_hides_list_with_notice
  - submit_records_without_waiting
  - url_query_value_not_recorded
  - same_scope_boxes_share_list
  - unavailable_scope_falls_back_to_plain_search
  - editor_mode_and_preview_never_open_or_record
  - touch_targets_44px_and_dark_pairs
  - header_scope_prop_selects_list
  - blank_keyword_ignored
  - drawer_closes_then_navigates_search
  - search_page_shows_query_and_navigates
  - layout_has_no_duplicate_record_handler

test_files:
  - templates/_bundled/sirsoft-basic/src/components/composite/__tests__/RecentSearchCombobox.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/components/HeaderRecentSearch.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/layouts/user-base-mobile-search.test.tsx
  - templates/_bundled/sirsoft-basic/tests/Playwright/specs/recent-search-combobox.spec.ts

e2e:
  - spec: templates/_bundled/sirsoft-basic/tests/Playwright/specs/recent-search-combobox.spec.ts
    axes:
      surface: [header_desktop, mobile_drawer, search_page]
    effects:
      - empty_focus_opens_recent_list
      - submit_records_without_waiting
      - keyboard_arrow_enter_escape_delete
      - url_query_value_not_recorded
      - search_page_shows_query_and_navigates
      - same_scope_boxes_share_list
      - drawer_closes_then_navigates_search
