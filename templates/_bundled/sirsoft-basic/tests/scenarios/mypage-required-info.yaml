feature: 추가 정보 입력 화면은 비어 있는 필수 항목만 받아 저장하고 원래 가려던 곳으로 보낸다

description: |
  운영자가 「기존 회원에게도 입력 요구」를 켠 필수 항목이 비어 있는 회원이 로그인 뒤 거치는 화면(/mypage/required-info)이다.
  GET /api/me/fields?context=required 가 준 비어 있는 필수 항목을 공용 항목 조각으로 그리고, 비밀번호 재확인 없이 바로 입력을 받는다.
  저장(PUT /api/me/required-fields)이 성공하면 로그인 사용자를 다시 받고, 남은 항목이 없으면 주소의 redirect(없으면 홈)로 보낸다.
  남은 항목이 있으면(파일 항목 등) 화면에 남아 항목을 다시 받는다. 남은 항목 없이 들어온 회원은 입력 없이 곧바로 목적지로 보낸다.
  redirect 는 사이트 안 경로만 받는다. 화면에서 나가는 길은 저장과 로그아웃이다.

# axis 의미:
#   case — 화면의 어느 계약인가 (구조, 재확인 없음, 데이터소스, 불러오는 중, 저장 중, 칸 아래 오류, 남은 항목 0개 진입, redirect 검증,
#          저장 요청, 저장 성공(남은 항목 없음), 저장 성공(남은 항목 있음), 저장 실패, 로그아웃)
axes:
  case: [structure, no_reauth, data_source, loading, saving, field_errors, zero_pending_entry, redirect_validation, save_request, save_success_done, save_success_remaining, save_failed, logout]

