feature: 비밀번호 재확인 칸이 횟수 초과·잠김 응답을 서버 문구로 알린다

description: |
  내 정보 수정 진입 비밀번호 확인(`POST /api/me/verify-password`)과 게시판 비밀번호 확인 창(비회원 글 수정 진입, 비회원 글·댓글
  수정·삭제 확인)은 서버가 횟수 초과(429)나 잠김(423)으로 답하면 「비밀번호가 일치하지 않습니다」 대신 서버 문구(남은 시간 포함)를 보인다.
  비밀번호가 틀린 경우는 종전 고정 문구다..

axes:
  screen: [profile_verify, board_modal]
  status: [throttled, mismatch]

effects:
  - throttle_or_lock_shows_server_message
  - mismatch_keeps_fixed_message
  - error_message_cleared_on_retry

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/password-reconfirm-throttle-message.test.ts
