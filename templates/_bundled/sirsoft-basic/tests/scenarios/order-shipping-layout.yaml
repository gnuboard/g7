feature: 주문 상세 배송지 정보와 배송지 변경 창

description: |
  주문 상세는 배송지 정보와 배송 메모를 그린다. 배송지 수정 단추는 배송 시작 전(pending_payment, payment_complete)에만
  보인다. 배송지 변경 창의 저장(저장된 배송지 / 직접 입력) apiCall 은 확인 문구를 거친다.

# axis 의미:
#   surface — 검사 대상(배송지 정보 렌더링 / 배송지 변경 창 구조)
axes:
  surface: [shipping_info, change_address_modal]

effects:
  - shipping_info_renders              # 배송지 정보가 그려진다
  - edit_button_only_before_shipping   # 수정 단추는 배송 시작 전 상태에서만 보인다
  - shipping_memo_shown_when_present   # 배송 메모가 있으면 보인다
  - shipping_memo_hidden_when_absent   # 배송 메모가 없으면 숨긴다
  - address_change_requires_confirm    # 배송지 변경 apiCall(PUT)에 확인 문구가 있다

test_files:
  - templates/_bundled/sirsoft-basic/src/__tests__/layouts/order-shipping.test.tsx
