feature: 첨부 용량 상한 표시 — 화면은 자기가 지키는 선만 말한다

description: |
  첨부 드롭존은 「몇 개까지 · 하나에 몇 MB까지」를 광고한다. 그 숫자는 **실제로 거절되는
  선**과 같아야 한다 — 다르면 사용자는 광고를 믿고 올렸다가 거절당하거나, 반대로 올릴 수
  있는 파일을 스스로 포기한다.

  조용히 깨지는 지점은 **상한을 선언하지 않은 호출부**다.

  클레임 신청서는 용량 상한을 컴포지트에 **일부러 넘기지 않는다**. 넘기면 컴포지트가 초과
  파일을 자기가 먼저 걸러낸 뒤 change 를 쏘므로, 거절된 파일이 핸들러에 닿지 않아 사용자는
  사진을 골랐는데 화면에 아무 변화가 없다(S2-D10 실측: setInputFiles(2.4MB) → 핸들러 0건 ·
  토스트 0건). 용량 판정과 안내는 서버 설정 `claim.image_max_size_kb` 를 읽는 핸들러가 한다.

  그런데 컴포지트가 `maxSize` 리터럴 기본값 10 을 들고 있어서, 상한을 넘기지 않은 그 화면에도
  드롭존이 「최대 5개, 각 10MB까지」를 찍었다. 바로 위 안내는 서버값 그대로 「1장당 2048KB」라
  한 화면에서 두 상한이 맞선다(#599 세션A 실측 2026-09-21 · 회원·비회원 신청서 양쪽 재현).
  같은 도메인의 관리자 상세는 둘 다 2MB 로 일관해, 어긋난 쪽이 고객 화면임이 드러났다.
  원 계획서가 고정한 서버 설정은 `image_max_size_kb=2048`(= 2MB)이므로 **2MB 가 참**이다.

  계약: 호출부가 상한을 선언했으면 그 값을 말하고, 선언하지 않았으면 **장수만** 말한다.
  선언하지 않은 상한으로 컴포지트가 스스로 거르지도 않는다 — 판정은 호출부 몫이다.

# axis 의미: 갈라지는 축은 «호출부가 용량 상한을 선언했는가» 하나다. 선언했으면 표시·필터가
# 모두 그 값을 따르고, 안 했으면 둘 다 침묵한다. 로케일은 축이 아니다 — 문구만 갈릴 뿐
# 계약은 같아서, ko·en·ja 세 언어에 같은 키가 있는지를 한 케이스가 함께 잠근다.
axes:
  max_size_declared: [declared, omitted]

effects:
  - dropzone_states_only_the_limit_it_enforces   # 지키지 않는 상한을 광고하지 않는다
  - composite_filters_only_when_limit_declared   # 미선언이면 컴포지트가 조용히 거르지 않는다
  # 2026-09-23(T2-D2) — 종전 `claim_form_keeps_limit_out_of_composite` 를 대체한다. 상한을
  # 넘기지 않던 근거는 「넘기면 컴포지트가 먼저 걸러 화면에 아무 변화가 없다」였는데, 실은
  # 컴포지트가 `onUploadError` 를 부르고 있었고 화면이 그 이벤트를 받지 않았을 뿐이다.
  # 넘기지 않은 대가가 더 컸다 — 거절된 파일이 목록에 남아 첨부된 것처럼 보였다.
  - claim_form_declares_the_limit_and_takes_the_rejection  # 상한을 넘기고 거절 사유를 받는다
  - count_only_copy_exists_in_all_locales        # 장수 전용 문구가 ko·en·ja 에 모두 있다

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/components/fileUploaderSizeHint.test.tsx

validation:
  audit_rule: frontend-change-requires-test
  browser_check: |
    #599 세션A 실측(2026-09-22 · 비회원 신청서 `/shop/guest/orders/{no}/claims/apply/refund`).
    수정 전 드롭존 「최대 5개, 각 10MB까지」 ↔ 안내 「1장당 2048KB」.
    수정 후 드롭존 「최대 5개까지 (.jpg,.jpeg,.png,.gif,.webp)」 — 상한 문구는 안내 한 곳에만 남는다.
  note: |
    ja 문구는 템플릿이 아니라 별도 언어팩 확장(`lang-packs/_bundled/g7-template-sirsoft-basic-ja`)에
    있어 테스트가 그 경로를 함께 읽는다. 컴포지트를 고치면 `template:build` → `template:update`,
    언어팩은 `language-pack:update` 로 반영해야 화면이 새 코드를 돈다.
