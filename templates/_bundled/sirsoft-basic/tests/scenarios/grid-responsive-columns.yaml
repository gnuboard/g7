feature: Grid 부품 responsive 열 수 — 엔진 폭 판정

description: |
  Grid 부품의 responsive prop({sm, md, lg, xl, 2xl} 구간별 열 수)이 Tailwind 반응형 접두 대신
  엔진 폭(G7Core.useResponsive().width, 편집기 미리보기에서는 기기 폭)으로 열 수를 골라
  접두 없는 grid-cols-N 하나만 내는지 잠근다. 경계는 Tailwind 와 같다(sm 640, md 768, lg 1024,
  xl 1280, 2xl 1536). 값이 없는 구간은 아래 구간 값을 이어받고, 맞는 구간이 없으면 cols 를 쓴다.
  시험 하나가 시나리오 하나다.

axes:
  case:
    # templates/_bundled/sirsoft-basic/src/components/layout/__tests__/Grid.test.tsx — 폭별 열 수, 접두 없음, resize, 미리보기 폭
    - grid_c01
    - grid_c02
    - grid_c03
    - grid_c04
    - grid_c05
    - grid_c06

effects:
  - grid_responsive_columns_by_engine_width   # 폭에 맞는 접두 없는 열 클래스 하나

test_files:
  - templates/_bundled/sirsoft-basic/src/components/layout/__tests__/Grid.test.tsx
