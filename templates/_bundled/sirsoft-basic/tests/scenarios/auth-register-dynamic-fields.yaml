feature: 가입 화면은 운영자가 정한 가입 항목대로 칸을 그리고 정의 버전을 실어 보낸다

description: |
  가입 화면이 GET /api/auth/register/fields 의 항목 계약으로 회원 항목 칸을 그린다. 폼에 박혀 있던 이름, 닉네임, 연락처,
  언어 칸과 오류 분류용 필드 이름 배열이 사라지고, 위쪽 오류 상자는 어느 칸에도 속하지 않는 오류만 보여 준다.
  낡은 화면에서 제출하면(409 fields_changed) 항목을 다시 받고 입력값은 그대로 둔다.

  표시 이름 종류 선택 칸(#490 8단계)은 같은 응답의 display_name 묶음으로 그린다. 고를 수 있을 때만(can_choose) 회원 항목 아래에 서고,
  고른 종류는 폼 값 display_name_kind 로 가입 요청에 실린다. 칸 아래 미리보기는 처음에는 표본 회원의 예시이고 종류를 바꾸면 입력해 둔
  이름, 닉네임, 이메일로 서버가 다시 계산한 글자로 바뀐다. 닉네임이 필요한 종류면 알리고, 종류 오류는 선택 칸 아래에만 뜬다.

  본인인증 채움(#490 11단계): 본인인증을 거쳐 온 가입 화면은 항목을 받은 직후, 서버가 인증 값을 적용한 항목(verified_claims 의 filled, locked)의
  default 를 폼 값에 넣는다. 잠근 항목은 공용 조각이 읽기 전용과 안내 문구로 그린다. 토큰이 만료됐거나 알 수 없으면 아무 칸도 채우거나 잠그지 않고
  칸에 속하지 않는 오류로 폼 위쪽 상자에 알린다.

