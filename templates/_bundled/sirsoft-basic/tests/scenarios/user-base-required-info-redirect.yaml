feature: 필수 항목이 비어 있는 회원을 추가 정보 입력 화면으로 한 번 유도하고, 쓰기가 거부되면 안내 창을 연다

description: |
  공통 사용자 레이아웃(_user_base)이 로그인 사용자(current_user)를 받은 뒤, 응답의 pending_required_fields 에 키가 있고 지금 화면이
  유도 제외 화면이 아니면 원래 주소를 redirect 로 실어 /mypage/required-info 로 바꿔 보낸다(뒤로 가기 이력을 남기지 않는다).
  제외 화면: 추가 정보 입력 화면 자신, 문서 화면(약관, 개인정보처리방침 등), 본인인증 화면 둘, 비밀번호 변경, 탈퇴 창이 있는 내 정보 보기,
  로그인 전 화면 넷. 재확인을 마치고 verification_token 을 들고 돌아온 내 정보 수정은 제외가 아니다. 옮겨 간 화면에서는 다시 옮기지 않는다.

  서버가 쓰기를 거부하면(403, error_code 가 required_fields_pending) template.json 의 템플릿 수준 오류 처리가 「추가 정보가 필요합니다」 창을 연다
  (바로 이동하지 않는다). 다른 403 은 종전대로 오류 토스트이고, 데이터소스, 레이아웃, 액션이 스스로 정한 처리가 템플릿 수준보다 먼저다.
  관리자 템플릿에는 유도 로직이 없다.

# axis 의미:
#   case — 어느 계약인가 (미입력 회원 유도, 입력을 마친 회원과 비회원, 제외 화면, 내 정보 수정은 제외 아님, 유도 1회, 디스패처 실행,
#          템플릿 수준 처리 선언, 우선순위, 쓰기 거부 안내 창, 다른 403, 스스로 처리를 정한 요청, 안내 창 구조와 단추, 편집기 상태 표본, 관리자 템플릿)
axes:
  case: [guide_pending_member, no_guide_when_complete, exempt_paths, profile_edit_not_exempt, guide_once, guide_dispatch, template_level_handler, priority, write_blocked_modal, other_403, action_own_handler, modal, modal_over_modal, editor_states, admin_untouched]

