feature: 게시판 댓글과 답글 입력칸은 비회원 칸의 필수 표시와 게시판이 정한 비회원 항목을 그리고 그 값을 등록 요청에 싣는다

description: |
  댓글 입력칸의 비회원 이름과 비밀번호 칸에는 필수 표시도 접근 가능한 이름도 없어, 제출해 보아야 필수임을 알 수 있었다.
  이제 글 상세 응답(post)의 board.guest_fields 를 따라 그린다. 답글 입력칸(댓글 한 개 조각 안)도 같은 규칙이다.

  - fixed 가 이름과 비밀번호의 필수 여부를 준다. 칸 옆의 별표, required, aria-required 가 그 값을 따르고,
    값이 없는 응답(옛 서버, 로그인한 회원의 응답)에서는 필수로 본다. 두 칸에 접근 가능한 이름(aria-label)을 준다.
  - 이름과 비밀번호는 좁은 화면에서도 두 칸으로 나란히 놓인다.
  - comment 의 항목은 이름과 비밀번호 줄 아래에 공용 조각(partials/board/_guest_fields)으로 그린다. 값은 폼 자동 바인딩으로
    새 댓글은 _local.commentGuestForm.guest_fields.{키}, 답글은 _local.replyGuestForm.guest_fields.{키} 에 담긴다.
  - 등록 요청 본문에는 그려진 항목만 guest_fields 에 키별로 싣는다. 항목이 없는 게시판과 로그인한 회원의 요청에는 싣지 않는다.
  - 등록에 성공하면 이름, 비밀번호, 항목 값, 오류를 비운다.
  - 검증 오류(422)는 이름, 비밀번호 칸 아래와 항목 칸 아래에 그린다(알림창은 종전대로 뜬다).
  - 새 댓글과 답글 입력칸은 함께 열릴 수 있어 DOM id 와 상태를 나눈다.

# 축은 하나(case)로 편다 — 화면의 어느 부분을 재는지다. 부분끼리 교차하지 않는다.
axes:
  case: [fixed_marks, two_columns, fields_drawn, request_body, reset_after_submit, validation_errors, member, reply]

effects:
  - name_and_password_have_star_label_and_required
  - fixed_marks_follow_setting
  - name_and_password_stay_two_columns_on_narrow_screens
  - comment_fields_drawn_below_name_and_password
  - comment_field_values_bind_under_own_form_state
  - comment_body_carries_guest_fields_by_key
  - comment_body_omits_guest_fields_without_fields_or_for_member
  - submit_success_clears_guest_inputs
  - comment_failure_errors_drawn_under_fields
  - member_has_no_guest_inputs
  - comment_and_reply_each_have_one_submit_request
  - reply_and_comment_inputs_do_not_share_ids_or_state

test_files:
  - templates/_bundled/sirsoft-basic/__tests__/layouts/board-comment-input-guest-fields.test.ts

validation:
  note: |
    레이아웃의 식을 실제 식 엔진으로 계산해 잰다(새 댓글 입력칸과 답글 입력칸을 같은 단언으로 각각 잰다).
    공용 조각의 칸 그리기와 오류 줄은 board-guest-fields-post-form.yaml 이 맡는다.
    브라우저 확인(좁은 화면의 두 칸, 별표, 항목 입력과 등록 뒤 초기화, 필수 누락 시 칸 아래 오류)은 통합 실측에서 한다.
