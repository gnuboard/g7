<!-- 503 일시 중단 — 오류 코드를 레이아웃이 스스로 선언해(error_code) 코어가 이 코드에 이 화면을 짝지어 세운다. 점검 화면과 달리 «잠시 뒤 다시» 를 뜻한다. -->
<layout name="errors/503" version="1.0.0" extends="_user_base">
  <meta title="$t:error.503.title" description="$t:error.503.description" :is_error_layout="true" :error_code="503"/>
  <slot name="content">
    <div class="min-h-[60vh] flex items-center justify-center">
      <div class="text-center px-4 max-w-lg">
        <icon name="triangle-exclamation" class="text-8xl mx-auto text-orange-400 dark:text-orange-500 mb-6"/>
        <div class="text-8xl font-bold text-gray-200 dark:text-gray-700 mb-4">503</div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:error.503.title</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-4">$t:error.503.description</p>
        <div data-ref="dependency_info" data-if="{{_global.errorData &amp;&amp; ((_global.errorData.modules &amp;&amp; _global.errorData.modules.length > 0) || (_global.errorData.plugins &amp;&amp; _global.errorData.plugins.length > 0))}}" class="bg-orange-50 dark:bg-orange-900/20 border border-orange-200 dark:border-orange-800 rounded-lg p-4 mb-6 text-left">
          <p class="text-sm font-medium text-orange-800 dark:text-orange-200 mb-3">$t:error.503.unmet_dependencies</p>
          <div data-ref="modules_list" data-if="{{_global.errorData.modules &amp;&amp; _global.errorData.modules.length > 0}}" class="mb-3">
            <p class="text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">$t:error.503.required_modules</p>
            <div class="flex flex-wrap gap-2">
              <span data-each="mod in _global.errorData.modules" class="inline-flex items-center gap-1 px-2 py-1 text-xs bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded">
                <icon name="circle-xmark" class="text-xs"/>
                <span>{{mod.name}}({{mod.identifier}}) ({{mod.required_version}})</span>
              </span>
            </div>
          </div>
          <div data-ref="plugins_list" data-if="{{_global.errorData.plugins &amp;&amp; _global.errorData.plugins.length > 0}}">
            <p class="text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">$t:error.503.required_plugins</p>
            <div class="flex flex-wrap gap-2">
              <span data-each="plug in _global.errorData.plugins" class="inline-flex items-center gap-1 px-2 py-1 text-xs bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded">
                <icon name="circle-xmark" class="text-xs"/>
                <span>{{plug.name}}({{plug.identifier}}) ({{plug.required_version}})</span>
              </span>
            </div>
          </div>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-500 mb-8">$t:error.503.contact_admin</p>
        <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/"/>
          </on>
          <icon name="home" class="text-xl"/>
          <span>$t:error.503.back_to_home</span>
        </button>
      </div>
    </div>
  </slot>
</layout>
