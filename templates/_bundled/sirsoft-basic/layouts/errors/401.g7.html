<!-- 401 로그인 필요 — 로그인 화면으로 보내는 것은 이 레이아웃이 아니라 코어(TemplateApp 의 라우트 오류 가드)다. 여기서 직접 리다이렉트를 구현하면 그 가드와 이중으로 돈다. -->
<layout name="errors/401" version="1.0.0" extends="_user_base">
  <meta title="$t:error.401.title" description="$t:error.401.description"/>
  <slot name="content">
    <div class="min-h-[60vh] flex items-center justify-center">
      <div class="text-center px-4">
        <div class="text-8xl font-bold text-gray-200 dark:text-gray-700 mb-4">401</div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:error.401.title</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">$t:error.401.description</p>
        <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/"/>
          </on>
          <icon name="home" class="text-xl"/>
          <span>$t:error.401.back_to_home</span>
        </button>
      </div>
    </div>
  </slot>
</layout>
