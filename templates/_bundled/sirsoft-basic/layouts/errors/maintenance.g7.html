<!-- 점검 중 — 관리자가 사이트를 내려 둔 동안 모든 방문자에게 대신 나오는 화면이다. 특정 코드에 매이지 않아(error_code 없음) 점검 설정이 켜져 있는 동안 통째로 대체된다. -->
<layout name="errors/maintenance" version="1.0.0" extends="_user_base">
  <meta title="$t:error.maintenance.title" description="$t:error.maintenance.description" :is_error_layout="true"/>
  <slot name="content">
    <div class="min-h-[60vh] flex items-center justify-center">
      <div class="text-center px-4 max-w-lg">
        <icon name="gear" class="text-8xl mx-auto text-primary-400 dark:text-primary-500 mb-6 animate-spin"/>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">$t:error.maintenance.title</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">$t:error.maintenance.description</p>
        <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/"/>
          </on>
          <icon name="home" class="text-xl"/>
          <span>$t:error.maintenance.back_to_home</span>
        </button>
      </div>
    </div>
  </slot>
</layout>
