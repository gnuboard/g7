<layout name="errors/404" version="1.0.0" extends="_user_base">
  <meta title="$t:error.404.title" description="$t:error.404.description"/>
  <slot name="content">
    <div class="min-h-[60vh] flex items-center justify-center">
      <div class="text-center px-4">
        <div class="text-8xl font-bold text-gray-200 dark:text-gray-700 mb-4">404</div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:error.404.title</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">$t:error.404.description</p>
        <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/"/>
          </on>
          <icon name="home" class="w-5 h-5"/>
          <span>$t:error.404.back_to_home</span>
        </button>
      </div>
    </div>
  </slot>
</layout>
