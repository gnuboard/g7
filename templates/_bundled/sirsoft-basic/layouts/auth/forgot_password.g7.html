<!-- 비밀번호 찾기 — 재설정 링크를 메일로 보낸다. 계정 존재 여부를 알려 주지 않으려고 성공 화면은 입력한 주소와 무관하게 같은 문구를 보이며, 한 번 보내고 나면 폼 자리를 그 안내가 대신한다. -->
<layout name="auth/forgot_password" version="1.0.0" extends="_user_base">
  <meta title="$t:auth.forgot_password.title" :guest_only="true"/>
  <slot name="content">
    <div data-blur-until-loaded="{{_global?.currentUser?.uuid}}" class="min-h-[60vh] flex items-center justify-center py-12 px-4">
      <include src="partials/auth/_redirect_if_logged_in.g7.html"/>
      <!-- 비밀번호 찾기 폼 -->
      <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8">
          <responsive on="portable" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6"/>
          <!-- 헤더 -->
          <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:auth.forgot_password.title</h1>
            <p class="text-gray-600 dark:text-gray-400">$t:auth.forgot_password.subtitle</p>
          </div>
          <!-- 성공 메시지 -->
          <div data-if="{{_local.success}}" class="mb-6 p-4 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 rounded-lg">
            <p class="text-green-700 dark:text-green-300 text-sm">$t:auth.forgot_password.success</p>
          </div>
          <!-- 폼 -->
          <form data-if="{{!_local.success}}" class="space-y-6">
            <on type="submit">
              <set-state target="local" :isSubmitting="true"/>
              <api-call target="/api/auth/forgot-password" method="POST">
                <success>
                  <set-state target="local" :isSubmitting="false" :success="true"/>
                </success>
                <fail>
                  <set-state target="local" :isSubmitting="false"/>
                  <toast type="error" message="{{error.message}}"/>
                </fail>
                <body email="{{form.email}}"/>
                <field name="identity_target">
                  <field name="email" value="{{form.email}}"/>
                </field>
              </api-call>
            </on>
            <!-- 이메일 입력 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">$t:auth.forgot_password.email</label>
              <input type="email" name="email" placeholder="$t:auth.forgot_password.email_placeholder" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed" :required="true" disabled="{{_local.isSubmitting ?? false}}"/>
            </div>
            <!-- 제출 버튼 -->
            <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled="{{_local.isSubmitting ?? false}}">
              <!-- 스피너 -->
              <div data-if="{{_local.isSubmitting}}" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/>
              <span data-if="{{!_local.isSubmitting}}">$t:auth.forgot_password.submit</span>
              <span data-if="{{_local.isSubmitting}}">$t:auth.forgot_password.processing</span>
            </button>
          </form>
          <!-- 로그인 링크 -->
          <div class="mt-6 text-center">
            <button class="text-sm text-primary-600 dark:text-primary-400 hover:underline cursor-pointer">
              <on type="click">
                <navigate path="/login"/>
              </on>
              $t:auth.forgot_password.back_to_login
            </button>
          </div>
        </div>
      </div>
    </div>
  </slot>
</layout>
