<!-- 본인인증 확인 링크의 착지 화면 — 메일의 링크(/identity/verify?challenge=…&token=…)를 열면 그 토큰으로 확인한다. 확인 결과는 인증을 시작한 원래 화면이 일회용 비밀값으로 받아 가므로(다른 기기에서 열어도 된다), 이 화면은 결과만 알린다. -->
<layout name="auth/identity_verify" version="1.0.0" extends="_user_base">
  <meta title="$t:user.identity.verify_link.title"/>
  <init-local>
    <field name="state" value="verifying"/>
    <field name="error" :value="null"/>
  </init-local>
  <init>
    <!-- 건 번호나 토큰이 빠진 주소는 확인할 수 없다 — 요청을 보내지 않고 바로 실패를 알린다. -->
    <set-state target="local" state="{{query.challenge &amp;&amp; query.token ? 'verifying' : 'failed'}}"/>
    <api-call target="/api/identity/challenges/{{query.challenge ?? ''}}/verify" if="{{!!query.challenge &amp;&amp; !!query.token}}" method="POST">
      <success>
        <set-state target="local" state="verified"/>
      </success>
      <fail>
        <set-state target="local" state="failed" error="{{error.message ?? ''}}"/>
        <suppress/>
      </fail>
      <body token="{{query.token ?? ''}}"/>
    </api-call>
  </init>
  <slot name="content">
    <div class="min-h-[60vh] flex items-center justify-center py-12 px-4">
      <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 text-center" role="status" aria-live="polite">
        <!-- 확인 중 -->
        <div data-if="{{_local.state === 'verifying'}}">
          <div class="inline-flex items-center justify-center w-16 h-16 mb-4">
            <icon name="fas fa-spinner fa-spin" class="text-3xl text-indigo-600 dark:text-indigo-400"/>
          </div>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white">$t:user.identity.verify_link.verifying</h1>
        </div>
        <!-- 확인 완료 — 원래 화면이 결과를 받아 이어 간다 -->
        <div data-if="{{_local.state === 'verified'}}">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 dark:bg-green-900/40 rounded-full mb-4">
            <icon name="fas fa-check" class="text-3xl text-green-600 dark:text-green-400"/>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:user.identity.verify_link.verified_title</h1>
          <p class="text-sm text-gray-600 dark:text-gray-400">$t:user.identity.verify_link.verified_body</p>
        </div>
        <!-- 확인 실패 — 만료·이미 사용·잘못된 링크 -->
        <div data-if="{{_local.state === 'failed'}}">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 dark:bg-red-900/40 rounded-full mb-4">
            <icon name="fas fa-circle-exclamation" class="text-3xl text-red-600 dark:text-red-400"/>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:user.identity.verify_link.failed_title</h1>
          <p data-if="{{_local.error}}" class="text-sm text-red-700 dark:text-red-300 mb-2">{{_local.error}}</p>
          <p class="text-sm text-gray-600 dark:text-gray-400">$t:user.identity.verify_link.failed_body</p>
        </div>
      </div>
    </div>
  </slot>
</layout>
