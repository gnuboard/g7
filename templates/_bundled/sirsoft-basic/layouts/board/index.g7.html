<layout name="board/index" version="1.0.0" extends="_user_base">
  <meta>
    <seo :enabled="true" page_type="board" toggle_setting="$module_settings:sirsoft-board:seo.seo_board" :priority="0.6" changefreq="daily">
      <extensions>
        <item type="module" id="sirsoft-board"/>
      </extensions>
      <data-sources>
        <item>posts</item>
      </data-sources>
      <vars site_name="$core_settings:general.site_name" board_name="{{posts.data.board.name ?? ''}}" board_description="{{posts.data.board.description ?? ''}}"/>
      <og type="website" description="{{_seo.board.description ?? posts.data.board.description ?? ''}}"/>
      <structured-data @type="ItemList"/>
    </seo>
  </meta>
  <data-source id="posts" label_key="$t:editor.data_source.posts" type="api" endpoint="/api/modules/sirsoft-board/boards/{{route.slug}}/posts" method="GET" :auto_fetch="true" auth_mode="optional" :refetchOnMount="true">
    <params page="{{query.page ?? 1}}" search="{{query.search ?? ''}}" category="{{query.category ?? ''}}" filters[0][field]="{{query['filters[0][field]'] ?? ''}}" filters[0][value]="{{query['filters[0][value]'] ?? ''}}" filters[0][operator]="{{query['filters[0][operator]'] ?? ''}}" del="{{query.del ?? ''}}"/>
    <error-handling>
      <on-code code="401">
        <toast type="info" message="$t:board.login_required"/>
        <action handler="redirectToLoginWithReturn"/>
      </on-code>
      <on-code code="403">
        <show-error-page target="content"/>
      </on-code>
    </error-handling>
    <fail>
      <set-state target="global" :hasError="true"/>
    </fail>
  </data-source>
  <permissions/>
  <slot name="content">
    <!-- 로딩 스켈레톤 + 오류 페이지 (type 불명 시점에도 표시 필요 → _type_renderer 밖에 배치) -->
    <include src="partials/board/index/_loading_error.g7.html"/>
    <container data-if="{{posts?.data?.board}}" class="py-8">
      <!-- 유형별 렌더러 (basic/gallery/card + fallback) -->
      <include src="partials/board/index/_type_renderer.g7.html"/>
    </container>
  </slot>
</layout>
