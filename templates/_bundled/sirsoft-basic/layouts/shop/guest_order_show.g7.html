<!-- 비회원 주문 상세 — 회원 mypage/orders/show.g7.html 과 동일한 partial 5개를 재사용하되, 회원 전용 데이터/CTA 는 비노출. data_source endpoint 는 user/orders/{N} 통합 라우트 사용 (optional.sanctum) — 백엔드가 X-Guest-Order-Token 으로 비회원 분기, 토큰 매칭되면 GuestOrderResource 반환. 401/404 시 토큰 삭제 + 로그인 페이지로 안내. -->
<layout name="shop/guest_order_show" version="1.0.0" extends="_user_base">
  <meta title="$t:shop.guest_order_show.page_title" description="비회원 주문 상세"/>
  <!-- 비회원 주문 상세 — user/orders/{N} 통합 엔드포인트 (optional.sanctum). X-Guest-Order-Token 은 이 데이터소스에만 명시적으로 주입 (globalHeaders 의 user/orders/* 광역 패턴은 회원 라우트에도 토큰 노출되어 부적합). 401/404 시 토스트 + 백엔드 redirect_to 안내. -->
  <data-source id="order" label_key="$t:editor.data_source.order" type="api" endpoint="/api/modules/sirsoft-ecommerce/user/orders/{{route.order_number}}" method="GET" :auto_fetch="true" auth_mode="optional" loading_strategy="progressive" _errorHandling_comment="백엔드(UserOrderController::showByOrderNumber) 가 회원/비회원 분기 + 메시지 + errors.redirect_to 결정. 401/404 응답 시 sessionStorage 토큰을 즉시 비워야 다음 헤더 '주문 조회' 클릭에서 만료 안 된 토큰을 보고 무한 redirect 회귀가 일어나지 않는다. 위조 토큰 / 관리자 비밀번호 재설정 / 30분 만료 모두 동일 흐름.">
    <headers X-Guest-Order-Token="{{_global.guestOrderToken}}"/>
    <error-handling>
      <on-code code="401">
        <sequence>
          <action handler="clearGuestOrderToken"/>
          <toast type="warning" message="{{error.message ?? '$t:shop.order_complete.guest_token_expired'}}"/>
          <navigate path="{{error.errors?.redirect_to ?? ((_global.shopBase ?? '') + '/guest/orders')}}"/>
        </sequence>
      </on-code>
      <on-code code="404">
        <sequence>
          <action handler="clearGuestOrderToken"/>
          <toast type="warning" message="{{error.message ?? '$t:shop.order_complete.guest_token_expired'}}"/>
          <navigate path="{{error.errors?.redirect_to ?? ((_global.shopBase ?? '') + '/guest/orders')}}"/>
        </sequence>
      </on-code>
    </error-handling>
  </data-source>
  <!-- 클레임 가능 상품·유형 — 신청 버튼 3종의 노출·활성 근거다. 비회원 경로는 주문번호로 스코프가 잡히므로 주문 응답을 기다리지 않고 곧바로 부른다(회원 화면이 주문 ID 를 얻으려 체인을 태우는 것과 다른 점).
       신청·철회 뒤 이 화면으로 돌아오므로 캐시된 응답을 쓰면 방금 잠긴 수량이 반영되지 않는다. 클레임 가능 여부는 진입할 때마다 서버가 다시 판정해야 하는 값이다. -->
  <data-source id="claimable" label_key="$t:editor.data_source.claimable" type="api" endpoint="/api/modules/sirsoft-ecommerce/guest/orders/{{route.order_number}}/claimable-options" method="GET" :auto_fetch="true" auth_mode="optional" :cache="false" :refetchOnMount="true">
    <headers X-Guest-Order-Token="{{_global.guestOrderToken}}"/>
    <fallback>
      <field name="data">
        <field name="options" :value="[]"/>
      </field>
    </fallback>
  </data-source>
  <!-- 이 주문의 신청 내역 — 회원 신청내역과 같은 계약이다(유형 서브탭 하나 · 최신순 · 페이지). 주소에 유형이 없으면 type 을 비워 보낸다 — 서버가 접수 건이 있는 첫 유형(교환 → 반품 → 취소 → 환불)을 골라 응답 claim_type 으로 알려 주고 공유 partial 이 그 값으로 활성 서브탭을 세운다(회원 주문상세와 같은 규칙, 여기서 'exchange' 를 박으면 그 판정이 영영 돌지 않는다). 서버 게이트가 어휘 밖 값을 422 로 거절한다. 철회한 신청서도 목록에 남으므로(행이 사라지지 않는다) 페이지네이션은 필수다. 주석은 params 밖에 둔다 — params 의 키는 전부 쿼리스트링으로 전송된다. -->
  <data-source id="claims" label_key="$t:editor.data_source.claims" type="api" endpoint="/api/modules/sirsoft-ecommerce/guest/orders/{{route.order_number}}/claims" method="GET" :auto_fetch="true" auth_mode="optional" loading_strategy="progressive" :cache="false" :refetchOnMount="true">
    <headers X-Guest-Order-Token="{{_global.guestOrderToken}}"/>
    <params type="{{_local.claimsType ?? query.type ?? ''}}" page="{{_local.claimsPage ?? query.page ?? 1}}"/>
  </data-source>
  <init-local>
    <field name="isGuest" :value="true"/>
    <field name="withdrawRefreshDataSourceId" value="claims"/>
    <field name="withdrawRefreshClaimable" :value="true"/>
    <field name="claimDetailLinkMode" value="same_window"/>
    <field name="selectedItemIds" :value="[]"/>
    <field name="selectAllItems" :value="false"/>
    <field name="confirmTarget" :value="null"/>
    <field name="isConfirming" :value="false"/>
    <field name="isSubmittingAddress" :value="false"/>
  </init-local>
  <permissions/>
  <init>
    <!-- 클레임 관련 셸 계약값 — 철회 주소의 앞부분(비회원은 주문 스코프가 있다)과 공유 목록 partial 이 쓸 화면 주소 3종. `_global.guestOrderNumber` 를 쓰지 않고 주소의 주문번호를 읽는 것은 이 화면이 언제나 그 번호를 품기 때문이다. 레이아웃 initLocal 은 표현식을 해석하지 않으므로(값을 그대로 복사한다) 주문번호가 들어가는 값은 여기서 세운다. -->
    <set-state target="local" claimWithdrawApiBase="{{'/api/modules/sirsoft-ecommerce/guest/orders/' + (route.order_number ?? '') + '/claims'}}" claimListPath="{{(_global.shopBase ?? '') + '/guest/orders/' + (route.order_number ?? '')}}" claimDetailPathBase="{{(_global.shopBase ?? '') + '/guest/claims'}}" claimEmptyCtaPath="{{(_global.shopBase ?? '') + '/products'}}" claimsType="{{query.type ?? null}}" claimsPage="{{query.page ?? 1}}"/>
  </init>
  <slot name="content">
    <!-- blur_until_loaded: order 데이터소스 응답 도착 전까지 콘텐츠 가림. 데이터 빈 화면 노출 회귀 차단 (order_complete.g7.html 와 동일 패턴). -->
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900">
      <blur-until-loaded>
        <item>order</item>
      </blur-until-loaded>
      <container data-type="layout" class="py-8">
        <responsive on="portable" class="py-4"/>
        <!-- 주문 상세 카드 컨테이너 — 회원과 동일 partial 재사용. order.data.* 표현식 호환. 뒤로가기는 헤더 '주문 조회' 메뉴로 충분하므로 페이지 상단 뒤로가기 버튼은 두지 않음. -->
        <div class="max-w-3xl mx-auto space-y-4">
          <responsive on="portable" class="space-y-3"/>
          <include src="partials/mypage/orders/_status_header.g7.html"/>
          <include src="partials/mypage/orders/_items.g7.html"/>
          <!-- 클레임 신청 버튼 3종 — 체크한 상품에 그 유형이 열려 있고 권한이 있을 때만 활성이다(신청 권한 = abilities.can_request, 바로 취소되는 상품은 주문 취소 권한 = abilities.can_cancel 도). 열린 유형은 서버(claimable-options)가 상품마다 판정하므로 화면이 상태를 다시 해석하지 않는다. 열린 상품이 하나도 없으면 이 줄 자체가 나타나지 않는다. 회원 주문상세와 같은 규칙이며, 목적지만 비회원 라우트다(주문 스코프가 주소에 있다). -->
          <div data-if="{{(claimable?.data?.options ?? []).some(o => (o.claimable_types ?? []).length > 0)}}" class="flex flex-row items-center justify-center gap-3 bg-white dark:bg-gray-800 rounded-lg p-4">
            <responsive on="portable" class="flex flex-col gap-2 bg-white dark:bg-gray-800 rounded-lg p-4"/>
            <!-- [취소·환불 신청] — 체크한 상품을 미리 고른 채 비회원 신청서로 간다. 비회원 신청서는 주소의 주문번호로 신청 가능 상품을 곧바로 부르므로 회원 버튼처럼 주문 ID 를 싣지 않는다. -->
            <button type="button" class="px-5 py-2.5 bg-red-600 dark:bg-red-500 text-white rounded-lg font-medium hover:bg-red-700 dark:hover:bg-red-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{(_local.selectedItemIds ?? []).length === 0 || !(_local.selectedItemIds ?? []).every(id => ((claimable?.data?.options ?? []).find(o => o.option?.id === id)?.claimable_types ?? []).includes('refund')) || claimable?.data?.abilities?.can_request !== true || ((_local.selectedItemIds ?? []).some(id => (claimable?.data?.options ?? []).find(o => o.option?.id === id)?.refund_branch === 'auto') &amp;&amp; claimable?.data?.abilities?.can_cancel !== true)}}">
              <on type="click">
                <navigate path="{{_global.shopBase}}/guest/orders/{{route.order_number}}/claims/apply/refund" :mergeQuery="true">
                  <query options="{{(_local.selectedItemIds ?? []).join(',')}}"/>
                </navigate>
              </on>
              $t:claim.apply.entry_refund
            </button>
            <!-- [반품 신청] — 체크한 상품을 미리 고른 채 비회원 반품 신청서로 간다. 회수 배송비 계산과 청구 방식 선택은 회원과 같은 신청서 조각이 맡는다. -->
            <button type="button" class="px-5 py-2.5 bg-orange-600 dark:bg-orange-500 text-white rounded-lg font-medium hover:bg-orange-700 dark:hover:bg-orange-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{(_local.selectedItemIds ?? []).length === 0 || !(_local.selectedItemIds ?? []).every(id => ((claimable?.data?.options ?? []).find(o => o.option?.id === id)?.claimable_types ?? []).includes('return')) || claimable?.data?.abilities?.can_request !== true}}">
              <on type="click">
                <navigate path="{{_global.shopBase}}/guest/orders/{{route.order_number}}/claims/apply/return" :mergeQuery="true">
                  <query options="{{(_local.selectedItemIds ?? []).join(',')}}"/>
                </navigate>
              </on>
              $t:claim.apply.entry_return
            </button>
            <!-- [교환 신청] — 체크한 상품을 미리 고른 채 비회원 교환 신청서로 간다. 옵션을 바꾸는 교환이면 그 화면에서 상품 줄마다 교환 옵션을 고른다. -->
            <button type="button" class="px-5 py-2.5 bg-blue-600 dark:bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{(_local.selectedItemIds ?? []).length === 0 || !(_local.selectedItemIds ?? []).every(id => ((claimable?.data?.options ?? []).find(o => o.option?.id === id)?.claimable_types ?? []).includes('exchange')) || claimable?.data?.abilities?.can_request !== true}}">
              <on type="click">
                <navigate path="{{_global.shopBase}}/guest/orders/{{route.order_number}}/claims/apply/exchange" :mergeQuery="true">
                  <query options="{{(_local.selectedItemIds ?? []).join(',')}}"/>
                </navigate>
              </on>
              $t:claim.apply.entry_exchange
            </button>
          </div>
          <!-- 권한 때문에 잠긴 버튼의 안내 — 신청 권한이 없거나(전체), 바로 취소되는 상품(결제완료 이전)을 골랐는데 주문 취소 권한이 없을 때. 판정 키는 신청 가능 상품 응답의 abilities 이고 서버가 같은 기준으로 403 을 낸다. -->
          <p data-if="{{(claimable?.data?.options ?? []).some(o => (o.claimable_types ?? []).length > 0) &amp;&amp; claimable?.data?.abilities?.can_request === false}}" class="text-sm text-amber-600 dark:text-amber-400 text-center">$t:claim.apply.no_request_permission</p>
          <p data-if="{{claimable?.data?.abilities?.can_request === true &amp;&amp; claimable?.data?.abilities?.can_cancel === false &amp;&amp; (_local.selectedItemIds ?? []).some(id => (claimable?.data?.options ?? []).find(o => o.option?.id === id)?.refund_branch === 'auto')}}" class="text-sm text-amber-600 dark:text-amber-400 text-center">$t:claim.apply.no_cancel_permission</p>
          <include src="partials/mypage/orders/_orderer.g7.html"/>
          <include src="partials/mypage/orders/_shipping.g7.html"/>
          <include src="partials/mypage/orders/_payment.g7.html"/>
          <include src="partials/mypage/orders/_history.g7.html"/>
          <!-- 이 주문의 클레임 — 비회원에게는 주문을 가로지르는 신청내역 화면이 없으므로(§5-1-3) 이 섹션이 곧 비회원의 목록이다. 회원 신청내역과 **같은 partial** 을 무수정으로 쓴다 — 복제하면 카드 규칙이 두 벌이 되어 한쪽만 낡는다. 서브탭·페이지 왕복 주소는 셸이 준 _local.claimListPath(이 화면 자신)다. -->
          <div class="bg-white dark:bg-gray-800 rounded-lg p-6">
            <responsive on="portable" class="bg-white dark:bg-gray-800 rounded-lg p-4"/>
            <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">$t:claim.list.order_section_title</h2>
            <include src="partials/mypage/claims/_list.g7.html"/>
          </div>
          <!-- 비회원 액션 영역 — 쇼핑 계속하기만 노출. 리뷰 작성 / 재주문은 회원 전용이라 제외. -->
          <div class="flex flex-row gap-4">
            <responsive on="portable" class="flex flex-col gap-3"/>
            <button class="flex-1 flex items-center justify-center gap-2 px-6 py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors cursor-pointer">
              <on type="click">
                <!-- audit:allow layout-list-context-navigate-merge-query 쇼핑 계속하기 — 이 주문의 클레임 목록 밖(상품 목록)으로 나가는 이동이다. 유형 서브탭·페이지를 물려주면 상품 목록이 알지 못하는 파라미터가 실린다. -->
                <navigate path="{{_global.shopBase}}/products"/>
              </on>
              <icon name="shopping-bag" class="text-xl"/>
              <span>$t:mypage.order_detail.continue_shopping</span>
            </button>
          </div>
        </div>
      </container>
    </div>
  </slot>
  <!-- 철회 확인 — '이 주문의 클레임' 섹션의 [철회] 버튼이 여는 공용 모달. 마운트하지 않으면 클릭이 무반응이 된다(오류도 남지 않는다). 철회 뒤에는 목록을 다시 읽는다(withdrawRefreshDataSourceId). -->
  <modal src="partials/mypage/claims/_modal_withdraw.g7.html"/>
  <!-- 구매 확정 — 상품 줄의 [구매확정] 버튼이 그 항목 하나를 대상으로 연다. 버튼이 서는 상태(기본은 배송중·배송완료)는 운영자 설정과 권한으로 서버가 항목마다 판정한다. -->
  <modal src="partials/mypage/orders/_modal_confirm_purchase.g7.html"/>
  <!-- 배송 시작 전까지만 열리는 배송지 변경 창 -->
  <modal src="partials/mypage/orders/_modal_change_address.g7.html"/>
</layout>
