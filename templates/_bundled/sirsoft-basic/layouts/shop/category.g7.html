<layout name="shop/category" version="1.0.0" extends="_user_base">
  <meta title="{{category?.data?.name_localized ?? $t:shop.categories}}" description="{{category?.data?.description_localized ?? ''}}">
    <seo :enabled="true" page_type="category" toggle_setting="$module_settings:sirsoft-ecommerce:seo.seo_category" :priority="0.6" changefreq="weekly">
      <extensions>
        <item type="module" id="sirsoft-ecommerce"/>
      </extensions>
      <data-sources>
        <item>category</item>
        <item>products</item>
      </data-sources>
      <vars category_name="{{category.data.name ?? ''}}" category_description="{{category.data.description ?? ''}}" site_name="$core_settings:general.site_name" shopBase="$module_settings:sirsoft-ecommerce:basic_info.route_path"/>
      <og type="website" title="{{_seo.category.title ?? category.data.name ?? ''}}" description="{{_seo.category.description ?? category.data.description ?? ''}}"/>
      <structured-data @type="ItemList" name="{{_seo.category.title ?? category.data.name ?? ''}}"/>
    </seo>
  </meta>
  <data-source id="category" label_key="$t:editor.data_source.category" type="api" endpoint="/api/modules/sirsoft-ecommerce/categories/{{route.slug}}" method="GET" :auto_fetch="true" loading_strategy="progressive">
    <fallback :data="null"/>
  </data-source>
  <data-source id="categories" label_key="$t:editor.data_source.categories" type="api" endpoint="/api/modules/sirsoft-ecommerce/categories" method="GET" :auto_fetch="true" loading_strategy="progressive">
    <fallback>
      <field name="data" :value="[]"/>
    </fallback>
  </data-source>
  <data-source id="products" label_key="$t:editor.data_source.products" type="api" endpoint="/api/modules/sirsoft-ecommerce/products" method="GET" :auto_fetch="true">
    <params page="{{query.page ?? 1}}" :per_page="12" category_slug="{{route.slug}}" sort="{{query.sort ?? 'latest'}}" search="{{query.keyword ?? ''}}"/>
    <fallback>
      <field name="data" :value="[]"/>
      <field name="meta">
        <field name="current_page" :value="1"/>
        <field name="last_page" :value="1"/>
        <field name="per_page" :value="12"/>
        <field name="total" :value="0"/>
      </field>
    </fallback>
  </data-source>
  <permissions/>
  <slot name="content">
    <container class="py-8">
      <!-- 카테고리 헤더 -->
      <div class="mb-4">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
          <!-- 뒤로가기: 상위 카테고리 있으면 상위로, 없으면 /shop으로 -->
          <button class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <on type="click">
              <navigate path="{{(category?.data?.breadcrumb ?? []).length > 1 ? _global.shopBase + '/category/' + (category?.data?.breadcrumb ?? []).slice(-2, -1)[0]?.slug : _global.shopBase + '/products'}}"/>
            </on>
            <icon name="arrow-left" class="w-5 h-5"/>
          </button>
          <span>{{category?.data?.name_localized ?? $t:shop.categories}}</span>
        </h1>
        <!-- 설명 + 브레드크럼 한 줄 -->
        <div class="flex items-center justify-between mt-1">
          <p data-if="{{!!category?.data?.description_localized}}" class="text-gray-600 dark:text-gray-400">{{category?.data?.description_localized ?? ''}}</p>
          <!-- 브레드크럼 (전체 > 경로 > 현재) -->
          <div class="flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400">
            <a href="{{_global.shopBase}}/products" class="hover:text-gray-700 dark:hover:text-gray-300">$t:shop.category.all</a>
            <div data-each="crumb in {{category?.data?.breadcrumb ?? []}}">
              <span class="flex items-center gap-1">
                <icon name="chevron-right" class="w-3 h-3"/>
                <a data-if="{{crumb.slug !== route.slug}}" href="{{_global.shopBase}}/category/{{crumb.slug}}" class="hover:text-gray-700 dark:hover:text-gray-300">{{crumb.name}}</a>
                <span data-if="{{crumb.slug === route.slug}}" class="text-gray-900 dark:text-white font-medium">{{crumb.name}}</span>
              </span>
            </div>
          </div>
        </div>
      </div>
      <!-- 카테고리 배너 이미지 -->
      <div data-if="{{(category?.data?.images ?? []).length > 0}}" class="mb-6 rounded-lg overflow-hidden">
        <img src="{{category?.data?.images?.[0]?.download_url ?? ''}}" alt="{{category?.data?.images?.[0]?.alt_text ?? category?.data?.name_localized ?? ''}}" class="w-full h-auto object-cover max-h-64"/>
      </div>
      <!-- 검색 바 -->
      <div class="flex gap-2 mb-4">
        <input type="text" name="keyword" placeholder="$t:shop.search_placeholder" class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white" value="{{_local.keyword ?? query.keyword ?? ''}}">
          <on type="change">
            <set-state target="local" keyword="{{$event.target.value}}"/>
          </on>
          <on type="keydown" key="Enter">
            <navigate path="{{route.path}}" :mergeQuery="true">
              <query keyword="{{_local.keyword ?? ''}}" page="1"/>
            </navigate>
          </on>
        </input>
        <button class="px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium"><on type="click"><navigate path="{{route.path}}" :mergeQuery="true"><query keyword="{{_local.keyword ?? query.keyword ?? ''}}" page="1"/></navigate></on>$t:shop.search</button>
      </div>
      <!-- 하위 카테고리 칩 (자식 카테고리가 있을 때만 표시) -->
      <div data-if="{{(category?.data?.children ?? []).length > 0}}" class="flex flex-wrap gap-2 mb-4">
        <div data-each="sub in {{category?.data?.children ?? []}}">
          <button class="px-3 py-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-full text-sm hover:bg-gray-100 dark:hover:bg-gray-600"><on type="click"><navigate path="{{_global.shopBase}}/category/{{sub?.slug}}"/></on>{{sub?.name_localized}}</button>
        </div>
      </div>
      <!-- 정렬 바 -->
      <div class="flex items-center justify-between py-3 bg-gray-50 dark:bg-gray-800/50">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">$t:shop.total_count|count={{products?.data?.pagination?.total ?? 0}}</span>
        <select name="sort" value="{{query.sort ?? 'latest'}}" class="h-9 w-32">
          <options>
            <option value="latest">$t:shop.sort.latest</option>
            <option value="sales">$t:shop.sort.sales</option>
            <option value="price_asc">$t:shop.sort.price_asc</option>
            <option value="price_desc">$t:shop.sort.price_desc</option>
          </options>
          <on type="change">
            <navigate path="{{route.path}}" :mergeQuery="true">
              <query sort="{{$event.target.value}}" page="1"/>
            </navigate>
          </on>
        </select>
      </div>
      <include src="partials/shop/list/_product_grid.json"/>
    </container>
  </slot>
</layout>
