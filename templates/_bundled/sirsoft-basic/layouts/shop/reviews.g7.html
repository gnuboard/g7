<!-- 리뷰 모아보기 — 전시 중인 모든 상품의 후기를 한 화면에 모아 보여 준다. 정렬·사진 후기만·별점·쪽수는
     전부 URL 쿼리에 산다(뒤로가기와 링크 공유가 같은 화면을 되살린다). 작성자 이름 가림은 서버가 한다.
     조건을 바꾸면 바탕 레이아웃의 로딩 덮개가 새 목록(`reviewFeed`)이 올 때까지 남는다(`transition-overlay` 의 `wait-for`).
     기다릴 소스가 없으면 덮개가 렌더 직후 걷혀, 덮개가 두 번 반짝인 뒤 앞 목록이 응답 전까지 그대로 보였다. -->
<layout name="shop/reviews" version="1.0.0" extends="_user_base">
  <meta/>
  <!-- 후기 목록. 조건을 전부 URL 쿼리에서 읽으므로 `navigate` 로 쿼리만 바꿔도 다시 받는다. 비회원도 볼 수 있다 -->
  <data-source id="reviewFeed" label_key="$t:editor.data_source.reviewFeed" type="api" endpoint="/api/modules/sirsoft-ecommerce/reviews" method="GET" auth_mode="optional" :auto_fetch="true" loading_strategy="progressive">
    <params sort="{{query.sort ?? 'created_at_desc'}}" photo_only="{{query.photo_only ?? ''}}" rating="{{query.rating ?? ''}}" page="{{query.page ?? 1}}" :per_page="10"/>
    <fallback :data="null"/>
  </data-source>
  <permissions/>
  <transition-overlay>
    <wait-for>reviewFeed</wait-for>
  </transition-overlay>
  <init>
    <!-- 별 다섯 개를 그리는 반복용 목록 — 후기 카드 조각이 읽는다 -->
    <set-state target="local" :starList="[1,2,3,4,5]"/>
  </init>
  <slot name="content">
    <container data-type="layout" class="py-8">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">$t:shop.reviews.title</h1>
      <!-- 필터 줄: 총 건수 + 사진 후기만 + 별점 + 정렬 -->
      <div data-ref="review_feed_filters" class="flex flex-wrap items-center justify-between gap-3 py-3 mb-4 bg-gray-50 dark:bg-gray-800/50">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-300"><blur-until-loaded sources="reviewFeed"/>$t:shop.reviews.total_count|count={{reviewFeed?.data?.reviews?.meta?.total ?? 0}}</span>
        <div class="flex flex-wrap items-center gap-3">
          <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300 cursor-pointer">
            <checkbox id="review_feed_photo_only" name="photo_only" checked="{{query.photo_only === '1'}}" :autoBinding="false" class="w-4 h-4 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 rounded">
              <on type="change">
                <!-- 사진 후기만 — 쪽수는 1쪽으로 돌린다(빈 값은 주소에서 빠진다) -->
                <navigate path="{{route.path}}" :mergeQuery="true">
                  <query photo_only="{{$event.target.checked ? '1' : ''}}" page=""/>
                </navigate>
              </on>
            </checkbox>
            <span>$t:shop.reviews.photo_only</span>
          </label>
          <select name="rating" aria-label="$t:shop.reviews.rating_filter" value="{{query.rating ?? ''}}" class="h-9 w-28">
            <options>
              <option value="">$t:shop.reviews.rating_all</option>
              <option value="5">$t:shop.reviews.rating_n|n=5</option>
              <option value="4">$t:shop.reviews.rating_n|n=4</option>
              <option value="3">$t:shop.reviews.rating_n|n=3</option>
              <option value="2">$t:shop.reviews.rating_n|n=2</option>
              <option value="1">$t:shop.reviews.rating_one</option>
            </options>
            <on type="change">
              <!-- 별점 필터 — 「전체」는 빈 값이라 주소에서 빠지고, 쪽수는 1쪽으로 돌린다 -->
              <navigate path="{{route.path}}" :mergeQuery="true">
                <query rating="{{$event.target.value}}" page=""/>
              </navigate>
            </on>
          </select>
          <select name="sort" aria-label="$t:common.sort_order" value="{{query.sort ?? 'created_at_desc'}}" class="h-9 w-32">
            <options>
              <option value="created_at_desc">$t:shop.reviews.sort.latest</option>
              <option value="created_at_asc">$t:shop.reviews.sort.oldest</option>
              <option value="rating_desc">$t:shop.reviews.sort.rating_high</option>
              <option value="rating_asc">$t:shop.reviews.sort.rating_low</option>
            </options>
            <on type="change">
              <!-- 정렬을 바꾸면 쪽수는 1쪽으로 돌린다(다른 필터는 주소에 그대로 남는다) -->
              <navigate path="{{route.path}}" :mergeQuery="true">
                <query sort="{{$event.target.value}}" page=""/>
              </navigate>
            </on>
          </select>
        </div>
      </div>
      <!-- 목록·빈 안내·쪽 번호 묶음 — 새 목록을 받는 동안 흐리게 둔다. 덮개(wait-for)가 걷힌 뒤 새 목록이 그려지기까지의
           짧은 틈에 앞 목록이 또렷하게 비치지 않게 한다 -->
      <div data-ref="review_feed_list">
        <blur-until-loaded sources="reviewFeed"/>
        <!-- 후기 목록 — 카드 위에 그 후기가 달린 상품(대표 이미지·이름, 상세로 가는 링크)을 보인다 -->
        <div data-each="review in {{reviewFeed?.data?.reviews?.data ?? []}}">
          <a data-if="{{!!review.product}}" href="{{_global.shopBase}}/products/{{review.product?.product_code}}" class="flex items-center gap-3 mb-2 text-sm text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
            <on type="click">
              <!-- audit:allow layout-list-context-navigate-merge-query 후기 목록에서 상품 상세로 나가는 이동 — 후기 목록의 정렬·쪽 조건을 상품 상세로 가져가지 않는다 -->
              <navigate path="{{_global.shopBase}}/products/{{review.product?.product_code}}"/>
            </on>
            <img data-if="{{!!review.product?.thumbnail_url}}" src="{{review.product?.thumbnail_url}}" thumbPreset="sm" alt="" class="w-10 h-10 shrink-0 rounded object-cover border border-gray-200 dark:border-gray-700"/>
            <!-- 그림을 올리지 않은 상품 — 깨진 그림 대신 같은 크기의 아이콘 칸 -->
            <div data-if="{{!review.product?.thumbnail_url}}" class="w-10 h-10 shrink-0 rounded border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
              <icon name="image" size="sm" class="text-gray-500 dark:text-gray-400"/>
            </div>
            <span class="font-medium truncate">{{review.product?.name}}</span>
          </a>
          <include src="partials/shop/detail/_review_card.g7.html"/>
        </div>
        <!-- 후기 없음 — 필터가 걸려 있을 때와 아닐 때 문구가 다르다 -->
        <div data-if="{{reviewFeed !== undefined &amp;&amp; (reviewFeed?.data?.reviews?.data ?? []).length === 0}}" data-ref="review_feed_empty" class="text-center py-12 text-gray-800 dark:text-gray-300">
          <icon name="comment-dots" size="3x" class="mx-auto mb-3 opacity-50"/>
          <p data-if="{{!!query.photo_only || !!query.rating}}">$t:shop.reviews.empty_filtered</p>
          <p data-if="{{!query.photo_only &amp;&amp; !query.rating}}">$t:shop.reviews.empty</p>
        </div>
        <pagination pageHref="{{route.path}}?page={page}" :pageHrefMergeQuery="true" data-type="composite" currentPage="{{reviewFeed?.data?.reviews?.meta?.current_page ?? 1}}" totalPages="{{reviewFeed?.data?.reviews?.meta?.last_page ?? null}}" hasMorePages="{{reviewFeed?.data?.reviews?.meta?.has_more_pages ?? false}}" class="mt-6 flex justify-center">
          <on event="onPageChange">
            <!-- 쪽 번호만 바꾸고 필터·정렬은 주소에 그대로 둔다 -->
            <navigate path="{{route.path}}" :mergeQuery="true">
              <query page="{{$args[0]}}"/>
            </navigate>
          </on>
        </pagination>
      </div>
    </container>
  </slot>
  <!-- 후기 사진을 크게 보는 창 — 후기 카드의 사진 단추가 연다 -->
  <modal src="partials/shop/detail/_modal_review_image.g7.html"/>
</layout>
