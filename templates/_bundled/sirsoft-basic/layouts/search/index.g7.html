<!-- 통합 검색 — 글·상품·문서를 한 번에 찾는다. 검색어만 URL 질의에 남기고 탭·정렬·게시판 필터·페이지는 전역 상태에 두는데, 그것들을 바꿀 때마다 요청 주소가 다시 조립돼 결과를 새로 받는다(그래서 조건을 바꾼 뒤에는 반드시 다시 받기까지 해야 한다). -->
<layout name="search/index" version="1.0.0" extends="_user_base">
  <meta>
    <seo :enabled="true" page_type="search" toggle_setting="$module_settings:sirsoft-ecommerce:seo.seo_search_result" :priority="0.3" changefreq="daily">
      <extensions>
        <item type="module" id="sirsoft-ecommerce"/>
      </extensions>
      <data-sources>[]</data-sources>
      <vars site_name="$core_settings:general.site_name"/>
      <og type="website" title="{{_seo.search.title ?? ''}}"/>
      <structured-data @type="SearchResultsPage" name="{{_seo.search.title ?? ''}}"/>
    </seo>
  </meta>
  <!-- 검색 결과 — 검색어가 없으면 아예 부르지 않는다(condition). 한 응답에 종류별 묶음과 각 개수가 함께 오므로 탭 배지도 이 값으로 채운다. 상품 탭만 한 쪽에 12개, 나머지는 10개로 받는다. -->
  <data-source id="searchResults" label_key="$t:editor.data_source.searchResults" type="api" endpoint="/api/search?q={{query?.q}}&amp;type={{_global.searchActiveTab ?? 'all'}}&amp;board_slug={{_global.searchBoardFilter}}&amp;sort={{_global.searchSortBy ?? 'relevance'}}&amp;page={{_global.searchPage ?? 1}}&amp;per_page={{(_global.searchActiveTab === 'products') ? 12 : 10}}" method="GET" :auto_fetch="true" loading_strategy="progressive" condition="{{query?.q}}">
    <fallback>
      <field name="data">
        <field name="keyword" value=""/>
        <field name="total" :value="0"/>
        <field name="results">
          <field name="posts">
            <field name="total" :value="0"/>
            <field name="items" :value="[]"/>
          </field>
          <field name="products">
            <field name="total" :value="0"/>
            <field name="items" :value="[]"/>
          </field>
          <field name="pages">
            <field name="total" :value="0"/>
            <field name="items" :value="[]"/>
          </field>
        </field>
      </field>
    </fallback>
  </data-source>
  <init-local>
    <field name="q" value=""/>
  </init-local>
  <init-global>
    <field name="searchActiveTab" value="all"/>
    <field name="searchBoardFilter" value=""/>
    <field name="searchSortBy" value="relevance"/>
    <field name="searchPage" :value="1"/>
  </init-global>
  <permissions/>
  <init>
    <set-state target="global" searchActiveTab="all" searchBoardFilter="" searchSortBy="relevance" :searchPage="1">
      <field name="_local">
        <field name="q" value="{{query?.q || ''}}"/>
      </field>
    </set-state>
  </init>
  <slot name="content">
    <container class="py-4">
      <responsive on="desktop" class="py-8"/>
      <!-- 페이지 헤더 -->
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
          <icon name="search" size="lg"/>
          <span>$t:search.title</span>
        </h1>
      </div>
      <include src="partials/search/_search_input.g7.html"/>
      <include src="partials/search/_search_tabs.g7.html"/>
      <include src="partials/search/_search_filters.g7.html"/>
      <include src="partials/search/_search_states.g7.html"/>
      <include src="partials/search/_search_results.g7.html"/>
      <!-- 페이지네이션 -->
      <pagination data-if="{{query?.q &amp;&amp; (_global.searchActiveTab ?? 'all') !== 'all' &amp;&amp; searchResults?.data?.last_page > 1}}" currentPage="{{searchResults.data.current_page}}" totalPages="{{searchResults.data.last_page}}" class="mt-6 flex justify-center">
        <on event="onPageChange">
          <!-- 페이지 이동 — 페이지 번호가 URL 이 아니라 전역 상태라 바꾼 뒤 직접 다시 받아야 한다. 전체 탭에는 쪽 넘김이 없다(종류별 묶음이 섞여 있어 한 줄로 셀 수 없다). -->
          <sequence>
            <set-state target="global" searchPage="{{$args[0]}}"/>
            <refetch-data-source dataSourceId="searchResults"/>
          </sequence>
        </on>
      </pagination>
    </container>
  </slot>
</layout>
