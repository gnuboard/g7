<partial description="게시글 상단 네비게이션. 목록으로 버튼 + 게시판 이름 + 이전글/다음글 버튼">
  <!-- 상단 네비게이션 버튼 -->
  <div class="flex items-center justify-between mb-6">
    <!-- 모바일(0~767px)에서는 게시판명을 자기 줄로 올리고(order-first w-full) 아래 줄에 목록/이전글/다음글만 남긴다. 한 줄에 셋을 밀어넣으면 게시판명이 길수록 flex 가 좌우 버튼을 압착했다 (390px 실측: '이전글' 폭 5자 87px → 11자 73px → 21자 62px, chevron 과 텍스트가 겹침). 버튼 3개 고정폭 261px + 21자 제목 자연폭 323px = 584px 이므로 태블릿(768px+, 콘텐츠 735px)은 한 줄로 충분하다 — portable 이 아니라 mobile 로 한정한다. -->
    <responsive on="mobile" class="flex flex-wrap items-center justify-between gap-y-3 mb-6"/>
    <!-- 목록으로 버튼 — 상세 URL 에 실린 목록 상태(category/search/page/del/filters)를 그대로 목록으로 복귀 (45-1). shrink-0: 게시판명이 길어도 눌리지 않는다. -->
    <button class="shrink-0 flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 dark:text-white bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-all shadow-sm cursor-pointer">
      <on type="click">
        <navigate path="/board/{{route.slug}}" :mergeQuery="true">
          <query/>
        </navigate>
      </on>
      <icon name="list" size="sm"/>
      <span>$t:board.back_to_list</span>
    </button>
    <!-- 게시판 이름 (가운데) -->
    <span class="text-lg font-semibold text-gray-900 dark:text-white">
      <!-- order-first + w-full 로 첫 줄 전체를 차지. 이 노드가 형제를 압착하던 원인이므로 폭 경쟁에서 아예 빼낸다. -->
      <responsive on="mobile" class="order-first w-full text-center text-lg font-semibold text-gray-900 dark:text-white"/>
      {{post?.data?.board?.name ?? ''}}
    </span>
    <!-- 이전글/다음글 그룹. shrink-0: 게시판명이 길어도 눌리지 않는다. -->
    <div class="shrink-0 flex items-center gap-2">
      <!-- 이전글 버튼 - 아이콘 + 텍스트. 목록 상태(page/search/category/del/filters)를 형제 상세로 그대로 승계한다 (#75). -->
      <button data-if="{{navigation?.data?.prev?.id}}" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 dark:text-white bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-all shadow-sm cursor-pointer">
        <on type="click">
          <!-- 이전글로 이동하기 전 스크랩·반응 로컬 상태를 비워 형제 상세로 승계되지 않게 한다 — 비워두지 않으면 새 게시글의 실제 값(is_scraped·my_reaction_type_id·reaction_counts)보다 이전 게시글에서 세팅된 override 가 우선 적용돼, 옆 글의 반응이 눌린 것처럼 보인다 -->
          <set-state target="local" :isScraped="null" :scrapCount="null" :scrapLoading="null" :reactingTypeId="null" :reactionApplied="null" :myReactionTypeId="null" :reactionCounts="null" :commentReacting="null" :commentReactionApplied="null" :commentMyReaction="null" :commentReactionCounts="null"/>
          <navigate path="/board/{{route.slug}}/{{navigation.data.prev.id}}" :mergeQuery="true">
            <query/>
          </navigate>
        </on>
        <icon name="chevron-left" size="sm"/>
        <span>$t:board.prev</span>
      </button>
      <!-- 다음글 버튼 - 아이콘 + 텍스트. 목록 상태(page/search/category/del/filters)를 형제 상세로 그대로 승계한다 (#75). -->
      <button data-if="{{navigation?.data?.next?.id}}" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 dark:text-white bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-all shadow-sm cursor-pointer">
        <on type="click">
          <!-- 다음글로 이동하기 전 스크랩·반응 로컬 상태를 비워 형제 상세로 승계되지 않게 한다 — 비워두지 않으면 새 게시글의 실제 값(is_scraped·my_reaction_type_id·reaction_counts)보다 이전 게시글에서 세팅된 override 가 우선 적용돼, 옆 글의 반응이 눌린 것처럼 보인다 -->
          <set-state target="local" :isScraped="null" :scrapCount="null" :scrapLoading="null" :reactingTypeId="null" :reactionApplied="null" :myReactionTypeId="null" :reactionCounts="null" :commentReacting="null" :commentReactionApplied="null" :commentMyReaction="null" :commentReactionCounts="null"/>
          <navigate path="/board/{{route.slug}}/{{navigation.data.next.id}}" :mergeQuery="true">
            <query/>
          </navigate>
        </on>
        <span>$t:board.next</span>
        <icon name="chevron-right" size="sm"/>
      </button>
    </div>
  </div>
</partial>
