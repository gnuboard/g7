<partial description="비회원 비밀번호 검증 모달" editor_label="$t:user.modal_label.board_show.board_guest_password_modal">
  <!-- 비회원 게시글/댓글 수정/삭제 시 비밀번호 검증 -->
  <modal data-ref="board_guest_password_modal" title="{{_global.guestPasswordModal?.action === 'edit' ? (_global.guestPasswordModal?.targetType === 'comment' ? '$t:board.modals.edit_comment_title' : '$t:board.modals.edit_post_title') : (_global.guestPasswordModal?.targetType === 'comment' ? '$t:board.modals.delete_comment_title' : '$t:board.modals.delete_post_title')}}" icon="{{_global.guestPasswordModal?.action === 'edit' ? 'pen' : 'trash'}}" iconClassName="{{_global.guestPasswordModal?.action === 'edit' ? 'text-blue-500' : 'text-red-500'}}" size="sm">
    <div class="space-y-4">
      <!-- 안내 메시지 --><p class="text-sm text-gray-600 dark:text-gray-400">$t:board.password_verify.description</p>
      <!-- 비밀번호 입력 -->
      <div>
        <div class="flex items-center gap-1.5 mb-1">
          <icon name="lock" size="xs" class="text-gray-500 dark:text-gray-400"/>
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:board.guest_password</span>
        </div>
        <input type="password" placeholder="$t:board.guest_password_placeholder" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500" value="{{_local.guestPasswordForm?.password ?? ''}}">
          <on type="change">
            <!-- 비밀번호 입력 — 삭제 창과 달리 값을 _local 에 담는다(비밀번호는 확인이 끝나면 버릴 값이라 전역에 남길 이유가 없다). 대상 정보만 전역에서 읽는다. -->
            <set-state target="local">
              <field name="guestPasswordForm">
                <field name="password" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </input>
      </div>
      <!-- 에러 메시지 --><div data-if="{{_local.guestPasswordError}}" class="text-sm text-red-500">{{_local.guestPasswordError}}</div>
      <!-- 버튼 영역 -->
      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer"><on type="click"><!-- 취소 — 입력한 비밀번호와 오류 문구, 그리고 무엇을 하려던 것인지(대상·행동)까지 모두 비우고 닫는다. --><sequence><!-- 로컬 상태 초기화 --><set-state target="local" :guestPasswordForm="null" guestPasswordError=""/><!-- 모달 상태 초기화 --><set-state target="global" :guestPasswordModal="null"/><close-modal/></sequence></on>$t:common.cancel</button>
        <button disabled="{{_global.guestPasswordModal?.isVerifying || !_local.guestPasswordForm?.password}}" class="px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <!-- 비밀번호 확인 — 통과 뒤 갈 길이 둘이다: 갈 곳(redirectPath)이 있으면 글 수정 화면으로 넘기고, 없으면 이 화면에서 댓글을 고칠 수 있도록 확인된 비밀번호를 전역에 남긴다(그 뒤 수정 요청이 그 값을 다시 쓴다). 진행 중 표시는 전역 묶음의 한 항목이라 통째로 다시 실어야 나머지 대상 정보가 지워지지 않는다. -->
            <sequence>
              <set-state target="global">
                <field name="guestPasswordModal">
                  <field name="targetType" value="{{_global.guestPasswordModal?.targetType}}"/>
                  <field name="action" value="{{_global.guestPasswordModal?.action}}"/>
                  <field name="apiEndpoint" value="{{_global.guestPasswordModal?.apiEndpoint}}"/>
                  <field name="storageKey" value="{{_global.guestPasswordModal?.storageKey}}"/>
                  <field name="redirectPath" value="{{_global.guestPasswordModal?.redirectPath}}"/>
                  <field name="commentEdit" value="{{_global.guestPasswordModal?.commentEdit}}"/>
                  <field name="isVerifying" :value="true"/>
                </field>
              </set-state>
              <set-state target="local" guestPasswordError=""/>
              <api-call target="{{_global.guestPasswordModal?.apiEndpoint}}" method="POST">
                <success>
                  <!-- 댓글 수정 모드 진입 (global 상태로 저장) -->
                  <set-state if="{{!_global.guestPasswordModal.redirectPath &amp;&amp; _global.guestPasswordModal.commentEdit}}" target="global" commentEdit="{{_global.guestPasswordModal?.commentEdit}}" verifiedGuestPassword="{{_local.guestPasswordForm?.password}}"/>
                  <!-- 페이지 이동 (redirectPath가 있는 경우) -->
                  <navigate if="{{_global.guestPasswordModal.redirectPath}}" path="{{_global.guestPasswordModal.redirectPath}}"/>
                  <!-- 로컬 상태 초기화 -->
                  <set-state target="local" :guestPasswordForm="null" guestPasswordError=""/>
                  <!-- 모달 상태 초기화 -->
                  <set-state target="global" :guestPasswordModal="null"/>
                  <close-modal/>
                </success>
                <fail>
                  <set-state target="global">
                    <field name="guestPasswordModal">
                      <field name="targetType" value="{{_global.guestPasswordModal?.targetType}}"/>
                      <field name="action" value="{{_global.guestPasswordModal?.action}}"/>
                      <field name="apiEndpoint" value="{{_global.guestPasswordModal?.apiEndpoint}}"/>
                      <field name="storageKey" value="{{_global.guestPasswordModal?.storageKey}}"/>
                      <field name="redirectPath" value="{{_global.guestPasswordModal?.redirectPath}}"/>
                      <field name="commentEdit" value="{{_global.guestPasswordModal?.commentEdit}}"/>
                      <field name="isVerifying" :value="false"/>
                    </field>
                  </set-state>
                  <set-state target="local" guestPasswordError="$t:board.password_verify.incorrect"/>
                </fail>
                <body password="{{_local.guestPasswordForm?.password}}"/>
              </api-call>
            </sequence>
          </on>
          <icon data-if="{{_global.guestPasswordModal?.isVerifying}}" name="spinner" size="sm" class="animate-spin mr-2"/>
          <span>$t:board.password_verify.confirm</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
