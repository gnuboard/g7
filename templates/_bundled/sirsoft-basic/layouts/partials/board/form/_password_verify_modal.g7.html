<!-- 비회원 글 수정 진입 확인 창 — 글쓰기 화면이 «수정» 으로 열렸을 때 본문이 잠겨 오면 뜬다. 상세 화면의 같은 이름 조각과 다른 자리다(그쪽은 지우기·고치기 시작점, 이쪽은 폼을 여는 관문). 확인에 통과하면 받은 표를 들고 폼 데이터를 다시 받아 본문이 채워진다. -->
<partial description="비회원 게시글 수정 시 비밀번호 확인 모달" editor_label="$t:user.modal_label.board_form.password_verify_modal">
  <modal data-type="composite" data-ref="password_verify_modal" isOpen="{{form_meta?.data?.requires_password &amp;&amp; !_local?.passwordVerified &amp;&amp; !form_meta?.data?.board?.user_abilities?.can_manage}}" title="$t:board.modals.edit_post_title" icon="pen" iconClassName="text-blue-500" width="400px" :closeOnBackdropClick="false">
    <on type="click" event="onClose">
      <!-- 확인 없이 창을 닫으면 글 상세로 돌려보낸다 — 비밀번호를 확인하지 않은 채 수정 화면에 남겨 둘 수 없다 -->
      <navigate path="/board/{{route.slug}}/{{route.id}}" :mergeQuery="true">
        <query/>
      </navigate>
    </on>
    <div class="space-y-4">
      <!-- 안내 메시지 -->
      <p class="text-sm text-gray-600 dark:text-gray-400">$t:board.password_verify.description</p>
      <!-- 비밀번호 입력 -->
      <div>
        <div class="flex items-center gap-1.5 mb-1">
          <icon name="lock" size="xs" class="text-gray-500 dark:text-gray-400"/>
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:board.guest_password</span>
        </div>
        <input type="password" placeholder="$t:board.password_verify.placeholder" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500" value="{{_local.verifyPassword ?? ''}}">
          <on type="change">
            <!-- 비밀번호 입력 — 확인에 성공하면 곧바로 비운다(표를 받은 뒤에는 원문 비밀번호를 들고 있을 이유가 없다). -->
            <set-state target="local" verifyPassword="{{$event.target.value}}"/>
          </on>
        </input>
      </div>
      <!-- 에러 메시지 -->
      <div data-if="{{_local.passwordError}}" class="text-sm text-red-500">{{_local.passwordError}}</div>
      <!-- 버튼 영역 -->
      <div class="flex justify-end gap-3">
        <!-- 취소. 위 닫기와 같은 자리로 돌아간다 -->
        <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer">
          <on type="click">
            <navigate path="/board/{{route.slug}}/{{route.id}}" :mergeQuery="true">
              <query/>
            </navigate>
          </on>
          $t:common.cancel
        </button>
        <button disabled="{{_local.isVerifying || !_local.verifyPassword}}" class="px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <!-- 확인 — 통과하면 잠금을 풀고 폼의 틀과 값을 둘 다 다시 받는다: 틀은 «이제 비밀번호가 필요 없다»로 바뀌어야 하고, 값은 받은 표를 실어야 잠겨 있던 본문이 실려 온다. -->
            <sequence>
              <set-state target="local" :isVerifying="true" passwordError=""/>
              <!-- 수정용 비밀번호 검증 엔드포인트 사용 -->
              <api-call target="/api/modules/sirsoft-board/boards/{{route.slug}}/posts/{{route.id}}/verify-password-for-modify" auth_mode="optional" method="POST">
                <success>
                  <!-- 토큰 저장 + passwordVerified 설정 (form 키 제외: refetchDataSource가 덮어씌움) -->
                  <set-state target="local" :passwordVerified="true" :isVerifying="false" verificationToken="{{result?.data?.verification_token}}" verifyPassword=""/>
                  <!-- form_meta 리패치 (requires_password=false 반영) -->
                  <refetch-data-source dataSourceId="form_meta"/>
                  <!-- form_data 리패치 (verification_token 포함하여 폼 컨텐츠 로드) -->
                  <refetch-data-source dataSourceId="form_data"/>
                </success>
                <fail>
                  <set-state target="local" :isVerifying="false" passwordError="$t:board.password_verify.incorrect"/>
                </fail>
                <body password="{{_local.verifyPassword}}"/>
              </api-call>
            </sequence>
          </on>
          <icon data-if="{{_local.isVerifying}}" name="spinner" size="sm" class="animate-spin mr-2"/>
          <span>$t:board.password_verify.confirm</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
