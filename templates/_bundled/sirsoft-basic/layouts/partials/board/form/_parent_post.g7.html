<partial description="답글 작성/수정 시 원글 정보 표시 (인용 스타일)">
  <div data-ref="parent_post_card" data-if="{{(form_data?.data?.parent_id || query?.parent_id) &amp;&amp; form_meta?.data?.parent_post?.id}}" class="mb-6 p-4 bg-gray-50 dark:bg-gray-700/50 border-l-4 border-gray-400 dark:border-gray-500 rounded-r-lg">
    <div class="flex items-center gap-2 mb-3">
      <icon name="reply" class="w-4 h-4 text-blue-600 dark:text-blue-400"/>
      <span class="text-sm font-semibold text-gray-900 dark:text-white">$t:board.form.reply_to</span>
      <span data-if="{{form_meta?.data?.parent_post?.is_notice}}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300">$t:board.post.notice</span>
      <span data-if="{{form_meta?.data?.parent_post?.is_secret}}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300">$t:board.post.secret</span>
    </div>
    <div class="flex items-center gap-2 mb-2">
      <h4 class="text-base font-semibold text-gray-900 dark:text-white">{{form_meta?.data?.parent_post?.title}}</h4>
      <a href="/board/{{route.slug}}/{{form_meta?.data?.parent_post?.id}}" title="$t:board.form.view_original" class="text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors">
        <icon name="arrow-up-right-from-square" class="w-3.5 h-3.5"/>
      </a>
    </div>
    <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mb-3">
      <span>{{form_meta?.data?.parent_post?.author?.name ?? '$t:board.unknown_author'}}</span>
      <span>·</span>
      <span>{{form_meta?.data?.parent_post?.created_at}}</span>
    </div>
    <div data-if="{{form_meta?.data?.parent_post?.content}}" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded p-3">
      <extension-point name="html_content" content="{{form_meta?.data?.parent_post?.content ?? ''}}" isHtml="{{(form_meta?.data?.parent_post?.content_mode ?? 'text') === 'html'}}" class="{{_local.parentPostExpanded ? '' : 'line-clamp-3'}} text-sm text-gray-600 dark:text-gray-300 mb-2">
        <default>
          <html-content content="{{form_meta?.data?.parent_post?.content ?? ''}}" isHtml="{{(form_meta?.data?.parent_post?.content_mode ?? 'text') === 'html'}}" class="{{_local.parentPostExpanded ? '' : 'line-clamp-3'}} text-sm text-gray-600 dark:text-gray-300 mb-2"/>
        </default>
      </extension-point>
      <button data-if="{{(form_meta?.data?.parent_post?.content?.length ?? 0) > 150}}" type="button" class="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-medium transition-colors flex items-center gap-1">
        <on type="click">
          <set-state target="local" parentPostExpanded="{{!_local.parentPostExpanded}}"/>
        </on>
        <span>{{_local.parentPostExpanded ? '$t:board.form.hide_content' : '$t:board.form.show_full_content'}}</span>
        <icon name="{{_local.parentPostExpanded ? 'chevron-up' : 'chevron-down'}}" class="w-3 h-3"/>
      </button>
    </div>
  </div>
</partial>
