<!-- 카드형 게시판 목록 — 글을 카드로 늘어놓는다. 머리말·필터·페이지 처리는 일반형과 같은 짜임이고 가운데 목록만 다르다(세 유형이 파일을 나눠 갖는 이유). -->
<partial description="게시판 카드형(card) 인덱스. 헤더 + 필터 + 카드형 목록 + 빈상태 + 페이지네이션 + 글쓰기 버튼">
  <div>
    <!-- 헤더 (게시판명 + 설명 + 글쓰기 버튼)
         좁은 화면(390px)에서 [글쓰기] 가 줄어들며 「글쓰/기」 로 꺾였다 — 제목 칸이 줄고, 버튼 묶음은 줄지 않으며 글자를 한 줄로 둔다(7.1.0 J D-J12). -->
    <div class="flex justify-between items-start gap-3 mb-6">
      <div class="min-w-0">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{posts?.data?.board?.name ?? ''}}</h1>
        <p data-if="{{posts?.data?.board?.description}}" class="text-gray-600 dark:text-gray-400 mt-1">{{posts?.data?.board?.description}}</p>
      </div>
      <!-- 상단 액션 (관리자 진입 링크 + 글쓰기 버튼) -->
      <div class="flex items-center gap-2 shrink-0 whitespace-nowrap">
        <!-- 관리자 진입 크로스링크 (권한 보유 시) -->
        <include src="../../index/_admin_links.g7.html"/>
        <!-- 상단 글쓰기 버튼 -->
        <include src="../../index/_write_button.g7.html"/>
      </div>
    </div>
    <!-- 필터 바 (카테고리 필터 + 검색) -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-4">
      <!-- 카테고리 필터 (카테고리가 있을 때만 표시) -->
      <select data-if="{{posts?.data?.board?.categories &amp;&amp; posts?.data?.board?.categories.length > 0}}" value="{{query.category || 'all'}}" class="w-full sm:w-auto sm:min-w-48 px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white text-sm" options="{{[{value:'all', label:'$t:board.filter.category_all'},{value:'unclassified', label:'$t:board.filter.category_unclassified'}].concat((posts?.data?.board?.categories ?? []).map(function(c){return{value:c,label:c};}))}}">
        <on type="change">
          <navigate path="/board/{{route.slug}}" :mergeQuery="true">
            <query category="{{$event.target.value === 'all' ? '' : $event.target.value}}" :page="1"/>
          </navigate>
        </on>
      </select>
      <!-- 삭제된 게시글 포함 토글 버튼 (manager 권한 보유 시에만 표시) -->
      <button data-if="{{posts?.data?.abilities?.can_view_deleted}}" type="button" class="{{query.del === '1' ? 'inline-flex items-center gap-1.5 px-3 py-2 border-2 border-blue-600 dark:border-blue-400 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg text-sm font-medium' : 'inline-flex items-center gap-1.5 px-3 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-700'}}">
        <on type="click">
          <navigate path="/board/{{route.slug}}" :mergeQuery="true">
            <query del="{{query.del === '1' ? '' : '1'}}" :page="1"/>
          </navigate>
        </on>
        <icon name="eye" size="sm"/>
        <span>$t:board.filter.include_deleted</span>
      </button>
      <!-- 검색 줄 (오른쪽 정렬) — 검색 대상 셀렉트 + 검색 바. 셀렉트는 담아만 두고(_local.boardSearchField) 제출 시 URL 의 search_field 로 옮긴다. URL 에 값이 있으면 그것이 초기값이라 뒤로가기·링크 공유에서 고른 대상이 그대로 살아난다 -->
      <div class="w-full sm:w-auto sm:ml-auto flex gap-2">
        <select data-ref="board_search_field_select" value="{{_local.boardSearchField ?? query.search_field ?? 'title_content'}}" class="px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
          <options>
            <option value="title_content">$t:board.search_fields.title_content</option>
            <option value="title">$t:board.search_fields.title</option>
            <option value="content">$t:board.search_fields.content</option>
            <option value="author">$t:board.search_fields.author</option>
          </options>
          <on type="change">
            <!-- 검색 대상만 담아 둔다 — 조회는 검색창 제출 때 일어난다 -->
            <set-state target="local" boardSearchField="{{$event.target.value}}"/>
          </on>
        </select>
        <search-bar data-type="composite" name="search" placeholder="$t:board.search_placeholder" value="{{query.search || ''}}" :showButton="false" class="w-full sm:w-64">
          <on type="submit">
            <!-- 글 검색 — 다른 조건(분류·삭제글 보기)은 그대로 두고 검색어와 검색 대상만 갈아 끼운다. 결과가 줄어들면 보던 페이지 번호가 뜻을 잃으므로 반드시 1페이지로 되돌린다. -->
            <navigate path="/board/{{route.slug}}" :mergeQuery="true">
              <query search="{{$event.target.search.value}}" search_field="{{_local.boardSearchField ?? query.search_field ?? 'title_content'}}" :page="1"/>
            </navigate>
          </on>
        </search-bar>
      </div>
    </div>
    <!-- 카드형 게시글 목록 -->
    <grid data-type="layout" :cols="1" :gap="4" class="grid-cols-1">
      <responsive on="tablet" :cols="2" :gap="4" class="grid-cols-2"/>
      <responsive on="desktop" :cols="3" :gap="4" class="grid-cols-3"/>
      <!-- 카드 클릭 시 현재 목록 상태(category/search/page/del/filters)를 상세 URL 에 부착 (45-1 목록 복귀) -->
      <button data-each="post in {{posts?.data?.data ?? []}}" class="flex flex-col w-full h-full text-left bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-lg hover:border-blue-300 dark:hover:border-blue-700 transition-all duration-200 group cursor-pointer overflow-hidden items-stretch">
        <on type="click">
          <navigate path="/board/{{route.slug}}/{{post.id}}" :mergeQuery="true">
            <query/>
          </navigate>
        </on>
        <!-- 썸네일 이미지 영역 -->
        <div class="w-full h-48 bg-gray-100 dark:bg-gray-900 relative overflow-hidden">
          <!-- 썸네일 이미지 (블라인드/삭제 여부와 관계없이 있으면 표시) -->
          <img data-if="{{post?.thumbnail}}" src="{{post?.thumbnail}}" alt="{{post?.title}}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200"/>
          <!-- 이미지가 없는 경우 플레이스홀더 -->
          <div data-if="{{!post?.thumbnail}}" class="w-full h-full flex items-center justify-center gap-2 bg-gray-200 dark:bg-gray-700">
            <icon name="image" class="text-gray-400 dark:text-gray-500"/>
            <span class="text-xs text-gray-400 dark:text-gray-500">$t:userinfo.no_image</span>
          </div>
          <!-- 블라인드/삭제됨 반투명 오버레이 -->
          <div data-if="{{post?.status === 'blinded' || post?.deleted_at}}" class="absolute inset-0 bg-gray-900/40 dark:bg-gray-900/40 z-10"/>
          <!-- 비밀글 잠금 오버레이 — 원문을 열 수 있는 사람(작성자 본인·비밀글 열람·게시판 관리 권한)에게는 씌우지 않는다 -->
          <div data-if="{{post?.is_secret &amp;&amp; !(post?.is_author || posts?.data?.abilities?.can_read_secret || posts?.data?.abilities?.can_manage)}}" class="absolute inset-0 bg-gray-900/50 dark:bg-gray-900/50 flex items-center justify-center z-10">
            <icon name="lock" size="2x" class="text-white"/>
          </div>
          <!-- 이미지 위 오버레이 배지 (좌상단: 카테고리/공지, 우상단: N 신규) -->
          <div data-if="{{post?.category || post?.is_notice || post?.is_new}}" class="absolute inset-x-0 top-0 flex items-start justify-between p-2 z-10">
            <!-- 좌상단: 카테고리 + 공지 -->
            <div class="flex items-center gap-1 flex-wrap">
              <!-- 공지사항 배지 -->
              <span data-if="{{post?.is_notice}}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-sm font-medium bg-blue-600 text-white dark:bg-blue-500">
                <icon name="bell" size="xs"/>
                <span>$t:board.notice</span>
              </span>
              <!-- 카테고리 배지 -->
              <span data-if="{{post?.category}}" class="inline-flex items-center px-2 py-0.5 rounded-md text-sm font-medium bg-black/40 text-white backdrop-blur-sm">{{post?.category}}</span>
            </div>
            <!-- 우상단: N 신규 배지 -->
            <span data-if="{{post?.is_new}}" class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-bold bg-red-500 dark:bg-red-600 text-white flex-shrink-0">N</span>
          </div>
        </div>
        <!-- 카드 본문 영역 - 제목+요약 (flex-grow로 늘어나 메타를 하단 고정) -->
        <div class="flex flex-col flex-grow px-5 pt-3 pb-3 justify-start">
          <div class="flex items-center gap-1.5 min-w-0">
            <!-- 블라인드 아이콘 (제목 앞) -->
            <icon data-if="{{post?.status === 'blinded'}}" name="eye-slash" size="sm" class="text-orange-500 dark:text-orange-400 flex-shrink-0"/>
            <!-- 답글 배지 (제목 앞) -->
            <span data-if="{{post?.is_reply}}" class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300 flex-shrink-0">RE</span>
            <!-- 비밀글 아이콘 (제목 앞) -->
            <icon data-if="{{post?.is_secret}}" name="lock" size="sm" class="text-gray-400 dark:text-gray-500 flex-shrink-0"/>
            <h3 class="text-lg font-bold truncate min-w-0 transition-colors {{(post?.status === 'blinded' || post?.deleted_at) ? 'text-gray-400 dark:text-gray-500' : 'text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400'}}">{{post?.title ?? ''}}</h3>
            <!-- 첨부파일 아이콘 (제목 뒤) -->
            <icon data-if="{{post?.has_attachment}}" name="paperclip" size="sm" class="text-gray-400 dark:text-gray-500 flex-shrink-0"/>
            <!-- 삭제됨 배지 (제목 뒤) -->
            <span data-if="{{post?.deleted_at}}" class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300 flex-shrink-0">$t:board.post.deleted_badge</span>
          </div>
          <!-- 본문 요약 (비밀글 미열람/블라인드/삭제됨 제외) -->
          <html-content data-type="composite" data-if="{{post?.content_preview &amp;&amp; !(post?.is_secret &amp;&amp; !(post?.is_author || posts?.data?.abilities?.can_read_secret || posts?.data?.abilities?.can_manage))}}" content="{{post?.content_preview ?? ''}}" :isHtml="false" class="text-sm mt-1.5 line-clamp-2 overflow-hidden !whitespace-normal {{(post?.status === 'blinded' || post?.deleted_at) ? 'text-gray-400 dark:text-gray-600' : 'text-gray-500 dark:text-gray-400'}}"/>
        </div>
        <!-- 구분선 -->
        <div class="border-t border-gray-200 dark:border-gray-700"/>
        <!-- 카드 하단 - 메타 정보 -->
        <div class="px-5 py-3 bg-gray-50 dark:bg-gray-900/30">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <avatar data-type="composite" author="{{post?.author}}" size="xs" class="{{(post?.status === 'blinded' || post?.deleted_at) ? 'opacity-40' : ''}}"/>
              <user-info data-type="composite" author="{{post?.author}}" :showDropdown="true" :stopPropagation="true" class="text-xs font-medium {{(post?.status === 'blinded' || post?.deleted_at) ? 'text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-300'}}"/>
              <span class="text-xs text-gray-300 dark:text-gray-600">·</span>
              <span class="text-xs {{(post?.status === 'blinded' || post?.deleted_at) ? 'text-gray-400 dark:text-gray-500' : 'text-gray-500 dark:text-gray-400'}}" title="{{post?.created_at ?? ''}}">{{post?.created_at_formatted ?? ''}}</span>
            </div>
            <div class="flex items-center gap-3 flex-shrink-0">
              <!-- 조회수 -->
              <span data-if="{{posts?.data?.board?.settings?.show_view_count !== false}}" class="inline-flex items-center gap-1 text-xs {{(post?.status === 'blinded' || post?.deleted_at) ? 'text-gray-400 dark:text-gray-500' : 'text-gray-500 dark:text-gray-400'}}">
                <icon name="eye" size="sm"/>
                <span>{{post?.view_count ?? 0}}</span>
              </span>
              <!-- 댓글수 -->
              <span data-if="{{post?.comment_count > 0}}" class="inline-flex items-center gap-1 text-xs font-medium {{(post?.status === 'blinded' || post?.deleted_at) ? 'text-gray-400 dark:text-gray-500' : 'text-blue-600 dark:text-blue-400'}}">
                <icon name="message" size="sm"/>
                <span>{{post?.comment_count ?? 0}}</span>
              </span>
            </div>
          </div>
        </div>
      </button>
    </grid>
    <!-- 빈 상태 안내 (빈 페이지 / 게시글 없음 / 검색 결과 없음) -->
    <include src="../../index/_empty_states.g7.html"/>
    <!-- 페이지네이션 -->
    <pagination data-type="composite" currentPage="{{posts?.data?.pagination?.current_page ?? 1}}" totalPages="{{posts?.data?.pagination?.last_page ?? null}}" hasMorePages="{{posts?.data?.pagination?.has_more_pages ?? false}}" class="mt-6 justify-center">
      <on event="onPageChange">
        <navigate path="/board/{{route?.slug}}" :mergeQuery="true">
          <query page="{{$args[0]}}" category="{{query.category}}" filters[0][field]="{{query['filters[0][field]']}}" filters[0][value]="{{query['filters[0][value]']}}" filters[0][operator]="{{query['filters[0][operator]']}}"/>
        </navigate>
      </on>
    </pagination>
    <!-- 하단 글쓰기 버튼 -->
    <div class="flex justify-end mt-4">
      <include src="../../index/_write_button.g7.html"/>
    </div>
  </div>
</partial>
