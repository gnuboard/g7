<!-- 목록 화면의 로딩·오류 자리 — 유형 렌더러 «밖»에 두는 것이 요점이다. 게시판 유형은 응답이 와야 알 수 있어서, 아직 유형을 모르는 이 시점을 유형별 조각 안에 둘 수 없다. -->
<partial description="게시판 목록 로딩 스켈레톤 및 오류 페이지">
  <div>
    <!-- 로딩 페이지 - 스켈레톤 + 스피너 혼합 (오류 없을 때만) -->
    <container data-type="layout" data-if="{{!posts?.data?.board &amp;&amp; !_global.hasError}}" class="py-8">
      <!-- 헤더 스켈레톤 -->
      <div class="flex justify-between items-start mb-4">
        <div class="space-y-2">
          <div class="h-8 w-48 bg-gray-200 dark:bg-gray-700 rounded animate-pulse"/>
          <div class="h-4 w-64 bg-gray-200 dark:bg-gray-700 rounded animate-pulse"/>
        </div>
        <div class="h-10 w-28 bg-gray-200 dark:bg-gray-700 rounded-lg animate-pulse"/>
      </div>
      <!-- 검색바 스켈레톤 -->
      <div class="flex justify-end mb-8">
        <div class="h-10 w-64 bg-gray-200 dark:bg-gray-700 rounded-lg animate-pulse"/>
      </div>
      <!-- 스피너 + 메시지 -->
      <div class="flex flex-col items-center justify-center py-16">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 dark:border-gray-700 border-t-gray-900 dark:border-t-white mb-4"/>
        <p class="text-gray-600 dark:text-gray-400 text-base font-medium">$t:board.loading_posts</p>
      </div>
    </container>
    <!-- 오류 발생 시 - 오류 메시지 및 재시도 버튼 -->
    <container data-type="layout" data-if="{{_global.hasError}}" class="py-8">
      <div class="flex flex-col items-center justify-center py-16 text-center">
        <!-- 경고 아이콘 -->
        <div class="text-5xl rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center mb-6 p-4">
          <icon name="triangle-exclamation" class="text-amber-600 dark:text-amber-400"/>
        </div>
        <!-- 제목 -->
        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-3">$t:board.error_title</h2>
        <!-- 설명 -->
        <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md">$t:board.error_description</p>
        <!-- 새로고침 버튼 -->
        <button class="inline-flex items-center gap-2 px-6 py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg hover:bg-gray-800 dark:hover:bg-gray-100 font-medium transition-colors cursor-pointer">
          <on type="click">
            <refresh/>
          </on>
          <icon name="sync" size="lg"/>
          <span>$t:board.reload_page</span>
        </button>
      </div>
    </container>
  </div>
</partial>
