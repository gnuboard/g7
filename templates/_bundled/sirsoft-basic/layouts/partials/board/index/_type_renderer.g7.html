<!-- 목록 유형 갈래 — 게시판 설정의 유형에 따라 일반/갤러리/카드 중 하나를 그린다. 모르는 유형이 들어와도 화면이 비지 않도록 첫 갈래가 일반 목록을 겸한다. -->
<partial description="유형별 index 렌더러. 새 유형 추가: 1) types/새유형/index.json 생성, 2) 아래 유형 블록 추가, 3) basic 블록 !includes 배열에 새 유형 추가">
  <div>
    <!-- basic + fallback. 새 유형 추가 시 이 블록 아래에 해당 유형 블록 추가 후 !includes 배열에도 추가 -->
    <div data-if="{{posts?.data?.board?.type === 'basic' || !['gallery','card'].includes(posts?.data?.board?.type ?? 'basic')}}">
      <include src="../types/basic/index.g7.html"/>
    </div>
    <!-- gallery 유형 -->
    <div data-if="{{posts?.data?.board?.type === 'gallery'}}">
      <include src="../types/gallery/index.g7.html"/>
    </div>
    <!-- card 유형 -->
    <div data-if="{{posts?.data?.board?.type === 'card'}}">
      <include src="../types/card/index.g7.html"/>
    </div>
  </div>
</partial>
