<!-- 인기글 한 줄 — 순위 배지 색이 1·2·3위와 그 아래로 갈린다. 게시판을 가로지르는 목록이라 글 제목 옆에 어느 게시판인지를 함께 단다. 반복 변수 post·index 는 부르는 쪽에서 온다. -->
<partial description="인기 게시글 아이템 (2줄 배치, UserInfo 사용)">
  <div class="group flex w-full text-left gap-4 px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
    <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center font-bold text-white {{index === 0 ? 'bg-orange-500 dark:bg-orange-500' : index === 1 ? 'bg-yellow-500 dark:bg-yellow-500' : index === 2 ? 'bg-yellow-400 dark:bg-yellow-400' : 'bg-gray-400 dark:bg-gray-500'}}">{{index + 1}}</div>
    <div class="flex-1 min-w-0 flex flex-col gap-1.5">
      <div class="flex items-center gap-2">
        <span class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded text-xs flex-shrink-0">{{post.board_name}}</span>
        <button class="justify-start font-medium text-gray-900 dark:text-white truncate flex-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/board/{{post.board_slug}}/{{post.id}}"/>
          </on>
          {{post.title}}
        </button>
        <span data-if="{{post.is_new}}" class="px-1.5 py-0.5 text-xs bg-red-500 dark:bg-red-600 text-white rounded flex-shrink-0">N</span>
        <span class="text-sm text-gray-500 dark:text-gray-400 flex-shrink-0" title="{{post.created_at ?? ''}}">{{post.created_at_formatted ?? ''}}</span>
      </div>
      <div class="flex items-center justify-between">
        <!-- 작성자 (Avatar + UserInfo) -->
        <div class="flex items-center gap-2">
          <avatar data-type="composite" author="{{post.author}}" size="xs"/>
          <user-info data-type="composite" author="{{post.author}}" :showDropdown="true" class="text-sm"/>
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-xs flex items-center gap-1">
            <icon name="eye" size="xs"/>
            <span>{{post.view_count ?? 0}}</span>
          </span>
          <span class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-xs flex items-center gap-1">
            <icon name="message-square" size="xs"/>
            <span>{{post.comment_count ?? 0}}</span>
          </span>
        </div>
      </div>
    </div>
  </div>
</partial>
