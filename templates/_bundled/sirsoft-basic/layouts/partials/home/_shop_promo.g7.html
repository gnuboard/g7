<!-- 쇼핑 안내 카드 — 쇼핑몰 모듈이 켜져 있을 때만 뜻이 있어 카드 뿌리에 쇼핑몰 가드를 단다. 이동 경로 앞머리는 전역 shopBase 를 쓴다. -->
<partial description="쇼핑몰 홍보 카드">
  <a href="{{_global.shopBase}}/products" data-if="{{_global.activeModules?.includes('sirsoft-ecommerce') ?? true}}" class="block w-full text-left bg-gradient-to-br from-emerald-700 to-teal-700 rounded-xl p-5 text-white hover:shadow-lg transition-shadow cursor-pointer">
    <on type="click">
      <navigate/>
    </on>
    <div class="flex items-center gap-2 mb-2">
      <icon name="shopping-cart" class="text-xl"/>
      <span class="font-semibold">$t:home.shop</span>
    </div>
    <div class="text-sm opacity-90">$t:home.shop_description</div>
  </a>
</partial>
