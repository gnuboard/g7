<partial description="게시판 요약 카드">
  <div class="block w-full text-left bg-white dark:bg-gray-800 rounded-xl pt-4 shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md hover:border-blue-200 dark:hover:border-blue-800 transition-all">
    <div class="flex items-center justify-between mb-2 px-4">
      <button class="font-semibold text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer"><on type="click"><navigate path="/board/{{item.slug}}"/></on>{{item.name}}</button>
      <span class="text-xs font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded">{{item.posts_count | number}}</span>
    </div>
    <div class="px-4 pb-2">
      <div data-if="{{item.recent_posts &amp;&amp; item.recent_posts.length > 0}}" data-each="post in {{item.recent_posts ?? []}}" class="space-y-1">
        <div class="flex items-center justify-between w-full hover:bg-gray-50 dark:hover:bg-gray-700/50 rounded-lg py-2 transition-colors gap-2">
          <!-- 왼쪽: 배지 + 제목 + 댓글 -->
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span data-if="{{post.is_notice}}" class="text-xs font-medium text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded shrink-0">$t:board.notice</span>
            <span data-if="{{post.category &amp;&amp; !post.is_notice}}" class="text-xs font-medium text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/30 px-1.5 py-0.5 rounded shrink-0">{{post.category}}</span>
            <icon data-if="{{post.is_secret}}" name="lock" class="w-3.5 h-3.5 text-gray-400 dark:text-gray-500 shrink-0"/>
            <button class="text-sm text-gray-900 dark:text-white text-left line-clamp-1 hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer"><on type="click"><navigate path="/board/{{item.slug}}/{{post.id}}"/></on>{{post.title}}</button>
            <span data-if="{{post.is_new}}" class="px-1.5 py-0.5 text-xs bg-red-500 text-white rounded shrink-0">N</span>
            <span data-if="{{post.comment_count > 0}}" class="text-xs font-medium text-blue-500 dark:text-blue-400 shrink-0">[{{post.comment_count}}]</span>
          </div>
          <!-- 오른쪽: 날짜 --><span class="text-xs text-gray-500 dark:text-gray-400 shrink-0" title="{{post.created_at ?? ''}}">{{post.created_at_formatted ?? ''}}</span>
        </div>
      </div>
      <div data-if="{{!item.recent_posts || item.recent_posts.length === 0}}" class="py-10 my-1 text-center text-sm text-gray-400 dark:text-gray-500">
        <span>$t:home.no_posts</span>
      </div>
    </div>
    <!-- === 더보기 버튼 === -->
    <button class="w-full px-4 py-3 text-center text-sm font-medium text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors cursor-pointer border-t border-gray-100 dark:border-gray-700">
      <on type="click">
        <navigate path="/board/{{item.slug}}"/>
      </on>
      <span>$t:common.more</span>
      <icon name="arrow-right" class="w-4 h-4 inline-block ml-1"/>
    </button>
  </div>
</partial>
