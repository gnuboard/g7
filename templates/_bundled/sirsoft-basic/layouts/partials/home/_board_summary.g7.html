<!-- 게시판 소개 카드 — 첫 화면이 게시판 셋을 반복해 찍는다. 반복 변수는 부르는 쪽에서 오고, 데이터는 개수를 줄여 받은 home_boards 다. -->
<partial description="게시판 요약 카드">
  <div class="block w-full text-left bg-white dark:bg-gray-800 rounded-xl pt-4 shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md hover:border-blue-200 dark:hover:border-blue-800 transition-all">
    <!-- 이름 단추는 줄어들며 줄을 바꾸고 글 수 배지는 제 폭을 지킨다(#143). -->
    <div class="flex items-center justify-between gap-2 mb-2 px-4">
      <a href="/board/{{item.slug}}" class="inline-block justify-start min-w-0 wrap-anywhere text-left font-semibold text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer">
        <on type="click">
          <navigate/>
        </on>
        {{item.name}}
      </a>
      <span class="shrink-0 text-xs font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded">{{item.posts_count | number}}</span>
    </div>
    <div class="px-4 pb-2">
      <div data-if="{{item.recent_posts &amp;&amp; item.recent_posts.length > 0}}" data-each="post in {{item.recent_posts ?? []}}" class="space-y-1">
        <div class="flex items-center justify-between w-full hover:bg-gray-50 dark:hover:bg-gray-700/50 rounded-lg py-2 transition-colors gap-2">
          <!-- 왼쪽: 배지 + 제목 + 댓글 -->
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span data-if="{{post.is_notice}}" class="text-xs font-medium text-red-700 dark:text-red-300 bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded shrink-0">$t:board.notice</span>
            <span data-if="{{post.category &amp;&amp; !post.is_notice}}" class="text-xs font-medium text-purple-600 dark:text-purple-300 bg-purple-50 dark:bg-purple-900/30 px-1.5 py-0.5 rounded shrink-0 truncate max-w-32">{{post.category}}</span>
            <icon data-if="{{post.is_secret}}" name="lock" class="text-sm text-gray-500 dark:text-gray-400 shrink-0"/>
            <a href="/board/{{item.slug}}/{{post.id}}" class="justify-start min-w-0 wrap-anywhere text-sm text-gray-900 dark:text-white text-left line-clamp-1 hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer">
              <on type="click">
                <navigate/>
              </on>
              {{post.title}}
            </a>
            <!-- 확장 자리 — 확장이 글마다 배지를 붙인다(#149). 게시판 묶음 안의 글이라 게시판은 item.slug 에서 온다 -->
            <extension-point name="board_post_row_badges" class="contents" data-extension-point="board_post_row_badges" post="{{post}}" postId="{{post.id}}" boardSlug="{{item.slug}}" context="home_board_summary"/>
            <span data-if="{{post.is_new}}" class="px-1.5 py-0.5 text-xs bg-red-600 dark:bg-red-600 text-white rounded shrink-0">N</span>
            <span data-if="{{post.comment_count > 0}}" class="text-xs font-medium text-blue-600 dark:text-blue-400 shrink-0">[{{post.comment_count}}]</span>
            <span data-if="{{(post.reaction_total ?? 0) > 0}}" class="text-rose-700 dark:text-rose-300 text-xs font-medium shrink-0 inline-flex items-center gap-0.5"><icon name="fa-solid fa-thumbs-up" class="text-xs"/><span>{{post.reaction_total}}</span></span>
          </div>
          <!-- 오른쪽: 날짜 -->
          <span class="text-xs text-gray-500 dark:text-gray-400 shrink-0" title="{{post.created_at ?? ''}}">{{post.created_at_formatted ?? ''}}</span>
        </div>
      </div>
      <div data-if="{{!item.recent_posts || item.recent_posts.length === 0}}" class="py-10 my-1 text-center text-sm text-gray-500 dark:text-gray-400">
        <span>$t:home.no_posts</span>
      </div>
    </div>
    <!-- === 더보기 버튼 === -->
    <a href="/board/{{item.slug}}" class="inline-block w-full px-4 py-3 text-center text-sm font-medium text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors cursor-pointer border-t border-gray-100 dark:border-gray-700">
      <on type="click">
        <navigate/>
      </on>
      <span>$t:common.more</span>
      <icon name="arrow-right" class="text-base inline-block ml-1"/>
    </a>
  </div>
</partial>
