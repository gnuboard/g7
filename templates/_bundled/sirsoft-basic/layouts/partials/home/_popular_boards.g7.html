<!-- 활발한 게시판 카드 — 게시판 자체의 순위를 보여 준다. 옆의 최근 글 카드와 높이를 맞추려 세로로 늘어나게 두었다. -->
<partial description="인기 게시판 카드">
  <div class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 h-full flex flex-col">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center gap-2 mb-4">
      <icon name="flame" class="text-xl text-orange-500"/>
      <span>$t:home.popular_boards</span>
    </h3>
    <div data-if="{{popular_boards.data &amp;&amp; popular_boards.data.length > 0}}" data-each="board, index in {{popular_boards.data ?? []}}" class="space-y-2 mb-1">
      <button class="w-full text-left flex items-center justify-between py-2 hover:bg-gray-50 dark:hover:bg-gray-700/50 rounded-lg transition-colors cursor-pointer">
        <on type="click">
          <navigate path="/board/{{board.slug}}"/>
        </on>
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <span class="w-6 h-6 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-xs font-medium text-gray-600 dark:text-gray-300">{{index + 1}}</span>
          <span class="text-sm font-medium text-gray-900 dark:text-white">{{board.name}}</span>
        </div>
        <span class="text-xs font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded">{{board.posts_count | number}}</span>
      </button>
    </div>
    <div data-if="{{!popular_boards.data || popular_boards.data.length === 0}}" class="text-center py-8 text-gray-500 dark:text-gray-400 flex-grow flex flex-col items-center justify-center min-h-[200px]">
      <icon name="inbox" class="text-[2rem] mx-auto mb-2 opacity-50"/>
      <p class="text-sm">$t:home.no_boards</p>
    </div>
  </div>
</partial>
