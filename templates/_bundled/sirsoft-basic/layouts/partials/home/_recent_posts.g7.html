<!-- 최근 글 카드 — 게시판을 가리지 않고 새로 올라온 순서 다섯 건이다. -->
<partial description="최근 게시글 카드">
  <div class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 h-full flex flex-col">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center gap-2">
        <icon name="clock" class="text-xl text-gray-500 dark:text-gray-400"/>
        <span>$t:home.recent_posts</span>
      </h3>
      <button class="text-sm text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1 cursor-pointer">
        <on type="click">
          <navigate path="/boards/popular"/>
        </on>
        <span>$t:common.more</span>
        <icon name="arrow-right" class="text-base"/>
      </button>
    </div>
    <div data-if="{{recent_posts.data &amp;&amp; recent_posts.data.length > 0}}" data-each="post in {{recent_posts.data ?? []}}" class="space-y-2 mb-1">
      <button class="block w-full text-left hover:bg-gray-50 dark:hover:bg-gray-700/50 rounded-lg py-2 transition-colors cursor-pointer">
        <on type="click">
          <navigate path="/board/{{post.board_slug}}/{{post.id}}"/>
        </on>
        <div class="flex items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span class="text-blue-600 dark:text-blue-400 shrink-0">{{post.board_name}}</span>
            <icon data-if="{{post.is_secret}}" name="lock" class="text-sm text-gray-400 dark:text-gray-500 shrink-0"/>
            <span class="text-sm font-medium text-gray-900 dark:text-white text-left line-clamp-1">{{post.title}}</span>
            <span data-if="{{post.is_new}}" class="px-1.5 py-0.5 text-xs bg-red-500 dark:bg-red-600 text-white rounded shrink-0">N</span>
            <span data-if="{{post.comment_count > 0}}" class="text-xs font-medium text-blue-500 dark:text-blue-400 shrink-0">[{{post.comment_count}}]</span>
            <span data-if="{{(post.reaction_total ?? 0) > 0}}" class="text-rose-500 dark:text-rose-400 text-xs font-medium shrink-0 inline-flex items-center gap-0.5"><icon name="fa-solid fa-thumbs-up" class="text-xs"/><span>{{post.reaction_total}}</span></span>
          </div>
          <span class="text-xs text-gray-500 dark:text-gray-400 shrink-0" title="{{post.created_at ?? ''}}">{{post.created_at_formatted ?? ''}}</span>
        </div>
      </button>
    </div>
    <div data-if="{{!recent_posts.data || recent_posts.data.length === 0}}" class="text-center py-8 text-gray-500 dark:text-gray-400 flex-grow flex flex-col items-center justify-center">
      <icon name="inbox" class="text-[2rem] mx-auto mb-2 opacity-50"/>
      <p class="text-sm">$t:home.no_posts</p>
    </div>
  </div>
</partial>
