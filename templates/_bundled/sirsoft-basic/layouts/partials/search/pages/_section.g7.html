<!-- 문서 결과 묶음 — 전체 탭에서는 다섯 건 미리보기 + «전체보기», 문서 탭에서는 전부를 펼친다. 한 파일이 두 쓰임을 겸한다. -->
<partial description="페이지 섹션 (전체 탭: 5개 미리보기, 페이지 탭: 전체 목록)">
  <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
    <!-- 섹션 헤더 (전체 탭에서만 표시) -->
    <div data-if="{{(query?.type ?? 'all') === 'all'}}" class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50">
      <div class="flex items-center gap-2">
        <icon name="file-alt" size="sm" class="text-gray-500 dark:text-gray-400"/>
        <span class="font-medium text-gray-900 dark:text-white">$t:search.tabs.pages</span>
        <span class="text-sm text-blue-600 dark:text-blue-400">{{(searchResults?.data?.pages_count ?? 0) | number}}</span>
      </div>
      <!-- 전체보기 버튼 -->
      <button data-if="{{(searchResults?.data?.pages_count ?? 0) > 0}}" class="text-sm text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1">
        <on type="click">
          <!-- 같은 검색어 안에서 해당 탭 전체 목록으로 넘어가는 이동이라 mergeQuery 로 q 를 승계한다. 탭이 바뀌면 결과 집합이 달라지므로 게시판필터·페이지·커서는 빈 값으로 지운다 -->
          <navigate path="/search" :mergeQuery="true">
            <query type="pages" board_slug="" page="" cursor=""/>
          </navigate>
        </on>
        <span>$t:search.view_all</span>
        <icon name="chevron-right" size="sm"/>
      </button>
    </div>
    <!-- 페이지 리스트 -->
    <div data-if="{{searchResults?.data?.pages?.items?.length > 0}}" data-each="page, pageIdx in {{searchResults?.data?.pages?.items ?? []}}">
      <!-- 구분선 (첫 번째 아이템 제외) -->
      <div data-if="{{pageIdx > 0}}" class="border-t border-gray-200 dark:border-gray-700"/>
      <button class="block w-full text-left p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors cursor-pointer">
        <on type="click">
          <!-- audit:allow layout-list-context-navigate-merge-query 검색 결과 → 원문(페이지) 이동 — 검색 목록과 다른 클러스터로 나가는 이동이다. -->
          <navigate path="{{page.url}}"/>
        </on>
        <html-content data-type="composite" content="{{page.title_highlighted ?? page.title}}" class="font-medium text-gray-900 dark:text-white mb-1 [&amp;_mark]:bg-yellow-200 [&amp;_mark]:dark:bg-yellow-500/40 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        <html-content data-type="composite" content="{{page.content_preview_highlighted ?? page.content_preview}}" class="text-sm text-gray-600 dark:text-gray-400 mb-2 line-clamp-2 [&amp;_mark]:bg-yellow-200 [&amp;_mark]:dark:bg-yellow-500/40 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        <p class="text-xs text-gray-500 dark:text-gray-400">$t:search.page_published_at|date={{page.published_at ?? ''}}</p>
      </button>
    </div>
    <!-- 결과 없음 안내 (검색 실패는 결과 없음이 아니다 — categories_failed 로 구분, 키 부재(구버전 코어)는 종전 렌더 유지) -->
    <div data-if="{{(!searchResults?.data?.pages?.items || searchResults?.data?.pages?.items?.length === 0) &amp;&amp; !(searchResults?.data?.categories_failed?.pages ?? false)}}" class="px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
      <span>$t:search.empty.pages_in_all</span>
    </div>
    <!-- 검색 실패 안내 -->
    <div data-if="{{searchResults?.data?.categories_failed?.pages ?? false}}" class="px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
      <div class="flex items-center justify-center gap-2">
        <icon name="triangle-exclamation" size="sm" class="text-red-500 dark:text-red-400"/>
        <span>$t:search.failed.title</span>
      </div>
      <p class="mt-1 text-xs text-gray-400 dark:text-gray-500">$t:search.failed.suggestion</p>
    </div>
  </div>
</partial>
