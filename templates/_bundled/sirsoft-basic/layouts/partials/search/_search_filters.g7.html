<!-- 검색 결과 좁히기 — 전체 탭에는 뜻이 없어(종류가 섞여 있다) 글·상품 탭에서만 나온다. 고를 수 있는 정렬도 탭마다 다르므로 상자를 나눠 두었다. -->
<partial description="검색 필터 (게시글/상품 탭)">
  <div data-if="{{(_global?.searchActiveTab === 'posts' || _global?.searchActiveTab === 'products') &amp;&amp; query?.q}}" class="flex flex-wrap gap-2 mb-4">
    <select data-if="{{_global?.searchActiveTab === 'posts'}}" name="boardFilter" class="w-40 px-4 py-2.5 bg-gray-100 dark:bg-gray-700 border-0 rounded-xl text-gray-700 dark:text-gray-200 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer" value="{{_global?.searchBoardFilter ?? ''}}">
      <on type="change">
        <!-- 게시판 좁히기 — 고를 수 있는 게시판 목록은 검색 결과가 함께 실어 준다(결과가 실제로 나온 게시판만 나열된다). 범위가 바뀌면 쪽 번호를 1로 되돌리고 다시 받는다. -->
        <sequence>
          <set-state target="global" searchBoardFilter="{{$event.target.value}}" :searchPage="1"/>
          <refetch-data-source dataSourceId="searchResults"/>
        </sequence>
      </on>
      <option value="">$t:search.filter.all_boards</option>
      <option data-each="board in {{searchResults?.data?.posts?.available_boards ?? []}}" value="{{board?.slug}}">{{board?.name}}</option>
    </select>
    <select data-if="{{_global?.searchActiveTab === 'posts'}}" name="sortBy" class="w-32" value="{{_global?.searchSortBy ?? 'relevance'}}">
      <options>
        <option value="relevance">$t:search.sort.relevance</option>
        <option value="latest">$t:search.sort.latest</option>
        <option value="popular">$t:search.sort.popular</option>
      </options>
      <on type="change">
        <!-- 글 정렬 — 관련도·최신·인기 셋뿐이다(글에는 값이 없어 가격순이 없다). -->
        <sequence>
          <set-state target="global" searchSortBy="{{$event.target.value}}" :searchPage="1"/>
          <refetch-data-source dataSourceId="searchResults"/>
        </sequence>
      </on>
    </select>
    <select data-if="{{_global?.searchActiveTab === 'products'}}" name="sortBy" class="w-32" value="{{_global?.searchSortBy ?? 'relevance'}}">
      <options>
        <option value="relevance">$t:search.sort.relevance</option>
        <option value="latest">$t:search.sort.latest</option>
        <option value="price_asc">$t:search.sort.price_asc</option>
        <option value="price_desc">$t:search.sort.price_desc</option>
        <option value="popular">$t:search.sort.popular</option>
      </options>
      <on type="change">
        <!-- 상품 정렬 — 글 쪽에 없는 가격 오름·내림이 더 있다. 고른 값은 두 탭이 같은 자리에 담으므로 탭을 옮기면 정렬이 따라간다. -->
        <sequence>
          <set-state target="global" searchSortBy="{{$event.target.value}}" :searchPage="1"/>
          <refetch-data-source dataSourceId="searchResults"/>
        </sequence>
      </on>
    </select>
  </div>
</partial>
