<!-- 검색 입력 줄 — 검색어는 화면 상태가 아니라 URL 로 나간다(그래야 결과 주소를 그대로 공유할 수 있다). 입력칸은 주소의 q 를 보여 주기만 하고 기록하지 않는다 — 최근 검색어는 제출(Enter·검색 단추·목록 항목)할 때 검색창이 기록한다. -->
<partial description="검색 입력 영역">
  <div class="mb-6">
    <!-- 최근 검색어 검색창 — 머리글 검색칸·모바일 서랍과 같은 범위(core.site)라 목록을 함께 쓴다. 빈 칸에 초점을 두면 최근 검색어가 펼쳐진다. -->
    <recent-search-combobox data-type="composite" data-ref="search_page_input" scope="core.site" name="q" value="{{query?.q ?? ''}}" placeholder="$t:search.placeholder" :showButton="true" buttonText="$t:search.button" inputClassName="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      <on event="onSearch">
        <!-- audit:allow layout-list-context-navigate-merge-query 새 검색 실행 — 검색어를 바꾸면 결과 집합 자체가 달라지므로 이전 탭·정렬·페이지·커서를 물려받지 않는다. mergeQuery 가 없으므로 q 만 남고 나머지 키는 주소에서 사라진다. -->
        <navigate path="/search">
          <query q="{{$args[0]}}"/>
        </navigate>
      </on>
    </recent-search-combobox>
  </div>
</partial>
