<!-- 글 결과 묶음(전체 탭) — 다섯 건만 보이고 나머지는 글 탭으로 넘긴다. 그 탭의 전체 목록은 _list 조각이 맡는다. -->
<partial description="전체 탭 - 게시글 섹션 (단순 리스트 5개 + 전체보기)">
  <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden mt-4">
    <!-- 섹션 헤더 -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50">
      <div class="flex items-center gap-2">
        <icon name="file-text" size="sm" class="text-gray-500 dark:text-gray-400"/>
        <span class="font-medium text-gray-900 dark:text-white">$t:search.tabs.posts</span>
        <span class="text-sm text-blue-600 dark:text-blue-400">{{(searchResults?.data?.posts_count ?? 0) | number}}</span>
      </div>
      <!-- 전체보기 버튼 -->
      <button data-if="{{(searchResults?.data?.posts_count ?? 0) > 0}}" class="text-sm text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1">
        <on type="click">
          <set-state target="global" searchActiveTab="posts" :searchPage="1"/>
          <refetch-data-source dataSourceId="searchResults"/>
        </on>
        <span>$t:search.view_all</span>
        <icon name="chevron-right" size="sm"/>
      </button>
    </div>
    <!-- 게시글 리스트 (최대 5개) -->
    <div data-if="{{searchResults?.data?.posts?.items?.length > 0}}" data-each="post, idx in {{searchResults?.data?.posts?.items ?? []}}">
      <!-- 구분선 (첫 번째 아이템 제외) -->
      <div data-if="{{idx > 0}}" class="border-t border-gray-200 dark:border-gray-700"/>
      <button class="block w-full text-left p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors cursor-pointer">
        <on type="click">
          <navigate path="{{post?.url}}"/>
        </on>
        <!-- 제목 라인 (게시판명 + 제목) -->
        <div class="flex items-start gap-2 mb-1">
          <!-- 게시판명 배지 --><span data-if="{{post?.board_name}}" class="flex-shrink-0 text-xs font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded">{{post?.board_name}}</span>
          <!-- 제목 (HTML 하이라이트 지원) -->
          <html-content content="{{post?.title_highlighted ?? post?.title}}" class="font-medium text-gray-900 dark:text-white [&amp;_mark]:bg-yellow-200 [&amp;_mark]:dark:bg-yellow-500/40 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        </div>
        <!-- 발췌 내용 (HTML 하이라이트 지원) -->
        <html-content data-if="{{post?.content_preview}}" content="{{post?.content_preview_highlighted ?? post?.content_preview}}" class="text-sm text-gray-600 dark:text-gray-400 mb-2 line-clamp-2 [&amp;_mark]:bg-yellow-200 [&amp;_mark]:dark:bg-yellow-500/40 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        <!-- 메타 정보 -->
        <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
          <span>{{post?.author_name}}</span>
          <span title="{{post?.created_at ?? ''}}">{{post?.created_at_formatted ?? ''}}</span>
          <span data-if="{{(post?.view_count ?? 0) > 0}}" class="flex items-center gap-1">
            <icon name="eye" size="xs"/>
            <span>{{post?.view_count}}</span>
          </span>
          <span data-if="{{(post?.comment_count ?? 0) > 0}}" class="flex items-center gap-1">
            <icon name="message-square" size="xs"/>
            <span>{{post?.comment_count}}</span>
          </span>
        </div>
      </button>
    </div>
    <!-- 결과 없음 안내 -->
    <div data-if="{{!searchResults?.data?.posts?.items || searchResults?.data?.posts?.items?.length === 0}}" class="px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
      <span>$t:search.empty.posts_in_all</span>
    </div>
  </div>
</partial>
