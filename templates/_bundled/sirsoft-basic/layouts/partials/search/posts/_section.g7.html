<!-- 글 결과 묶음(전체 탭) — 다섯 건만 보이고 나머지는 글 탭으로 넘긴다. 그 탭의 전체 목록은 _list 조각이 맡는다. -->
<partial description="전체 탭 - 게시글 섹션 (단순 리스트 5개 + 전체보기)">
  <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden mt-4">
    <!-- 섹션 헤더 -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50">
      <div class="flex items-center gap-2">
        <icon name="file-text" size="sm" class="text-gray-500 dark:text-gray-400"/>
        <span class="font-medium text-gray-900 dark:text-white">$t:search.tabs.posts</span>
        <span class="text-sm text-blue-600 dark:text-blue-400">{{(searchResults?.data?.posts_count ?? 0) | number}}</span>
      </div>
      <!-- 전체보기 버튼 -->
      <a href="/search?type=posts&board_slug=&page=&cursor=" :mergeQuery="true" data-if="{{(searchResults?.data?.posts_count ?? 0) > 0}}" class="text-sm text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1">
        <on type="click">
          <!-- 같은 검색어 안에서 해당 탭 전체 목록으로 넘어가는 이동이라 mergeQuery 로 q 를 승계한다. 탭이 바뀌면 결과 집합이 달라지므로 게시판필터·페이지·커서는 빈 값으로 지운다 -->
          <navigate :mergeQuery="true">
            <query type="posts" board_slug="" page="" cursor=""/>
          </navigate>
        </on>
        <span>$t:search.view_all</span>
        <icon name="chevron-right" size="sm"/>
      </a>
    </div>
    <!-- 게시글 리스트 (최대 5개) -->
    <div data-if="{{searchResults?.data?.posts?.items?.length > 0}}" data-each="post, idx in {{searchResults?.data?.posts?.items ?? []}}">
      <!-- 구분선 (첫 번째 아이템 제외) -->
      <div data-if="{{idx > 0}}" class="border-t border-gray-200 dark:border-gray-700"/>
      <!-- 카드 전체가 링크다 — 하이라이트 HTML 을 링크 밖에 두려고 빈 링크가 카드를 덮는다(이름은 일반 글자 제목). 초점 테두리는 안쪽(ring-inset) — 바깥 목록 상자가 overflow:hidden 이라 바깥 테두리는 잘린다 -->
      <div class="relative block w-full text-left p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors cursor-pointer">
        <a href="{{post?.url}}" aria-label="{{post?.title ?? ''}}" class="absolute inset-0 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-500 dark:focus-visible:ring-blue-400">
          <on type="click">
            <!-- audit:allow layout-list-context-navigate-merge-query 검색 결과 → 원문(게시글) 이동 — 검색 목록과 다른 클러스터로 나가는 이동이다. -->
            <navigate/>
          </on>
        </a>
        <!-- 제목 라인 (게시판명 + 제목) -->
        <div class="flex items-start gap-2 mb-1">
          <!-- 게시판명 배지 -->
          <span data-if="{{post?.board_name}}" class="flex-shrink-0 truncate max-w-32 text-xs font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded">{{post?.board_name}}</span>
          <!-- 제목 (HTML 하이라이트 지원) -->
          <html-content data-type="composite" content="{{post?.title_highlighted ?? post?.title}}" class="min-w-0 wrap-anywhere font-medium text-gray-900 dark:text-white [&amp;_mark]:bg-yellow-200 [&amp;_mark]:dark:bg-yellow-500/40 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
          <!-- 확장 자리 — 확장이 글마다 배지를 붙인다(#149). 조각은 extensionPointProps.postId 등으로 이 결과의 글을 읽는다 -->
          <extension-point name="board_post_row_badges" class="contents" data-extension-point="board_post_row_badges" post="{{post}}" postId="{{post?.id}}" boardSlug="{{post?.board_slug}}" context="search_all"/>
        </div>
        <!-- 발췌 내용 (HTML 하이라이트 지원) -->
        <html-content data-type="composite" data-if="{{post?.content_preview}}" content="{{post?.content_preview_highlighted ?? post?.content_preview}}" class="text-sm text-gray-600 dark:text-gray-400 mb-2 line-clamp-2 [&amp;_mark]:bg-yellow-200 [&amp;_mark]:dark:bg-yellow-500/40 [&amp;_mark]:px-0.5 [&amp;_mark]:rounded"/>
        <!-- 메타 정보 -->
        <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
          <span>{{post?.author_name}}</span>
          <span title="{{post?.created_at ?? ''}}">{{post?.created_at_formatted ?? ''}}</span>
          <span data-if="{{(post?.view_count ?? 0) > 0}}" class="flex items-center gap-1">
            <icon name="eye" size="xs"/>
            <span>{{post?.view_count}}</span>
          </span>
          <span data-if="{{(post?.comment_count ?? 0) > 0}}" class="flex items-center gap-1">
            <icon name="message-square" size="xs"/>
            <span>{{post?.comment_count}}</span>
          </span>
        </div>
      </div>
    </div>
    <!-- 결과 없음 안내 (검색 실패는 결과 없음이 아니다 — categories_failed 로 구분, 키 부재(구버전 코어)는 종전 렌더 유지) -->
    <div data-if="{{(!searchResults?.data?.posts?.items || searchResults?.data?.posts?.items?.length === 0) &amp;&amp; !(searchResults?.data?.categories_failed?.posts ?? false)}}" class="px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
      <span>$t:search.empty.posts_in_all</span>
    </div>
    <!-- 검색 실패 안내 -->
    <div data-if="{{searchResults?.data?.categories_failed?.posts ?? false}}" class="px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
      <div class="flex items-center justify-center gap-2">
        <icon name="triangle-exclamation" size="sm" class="text-red-500 dark:text-red-400"/>
        <span>$t:search.failed.title</span>
      </div>
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">$t:search.failed.suggestion</p>
    </div>
  </div>
</partial>
