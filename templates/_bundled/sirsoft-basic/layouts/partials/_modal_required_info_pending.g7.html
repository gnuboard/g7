<!-- 추가 정보 필요 안내 창 — 필수 항목이 비어 있는 회원이 글쓰기, 주문 같은 쓰기를 시도해 서버가 거부했을 때(403, error_code 가 required_fields_pending) 템플릿 수준 오류 처리가 연다.
     바로 입력 화면으로 보내지 않고 묻는다 — 쓰던 글이 있는 화면에서 갑자기 옮겨지지 않게. 「입력하러 가기」는 지금 주소를 돌아올 곳으로 실어 추가 정보 입력 화면으로 보낸다. -->
<partial description="추가 정보 필요 안내 모달 (User)" editor_label="$t:member.required_info.pending_modal.editor_label">
  <modal data-type="composite" data-ref="required_info_pending_modal" title="$t:member.required_info.pending_modal.title" size="sm">
    <p data-ref="required_info_pending_message" class="text-gray-700 dark:text-gray-300 break-words">$t:member.required_info.pending_modal.message</p>
    <footer>
      <button data-ref="required_info_pending_close" type="button" class="inline-flex items-center justify-center min-h-11 px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer">
        <on type="click">
          <close-modal target="required_info_pending_modal"/>
        </on>
        $t:member.required_info.pending_modal.close
      </button>
      <a data-ref="required_info_pending_go" href="{{'/mypage/required-info' + (_global.requiredInfoGate?.from ? '?redirect=' + encodeURIComponent(_global.requiredInfoGate.from) : '')}}" class="inline-flex items-center justify-center min-h-11 px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 cursor-pointer">
        <on type="click">
          <!-- 입력하러 가기 — 열린 창을 모두 닫고 추가 정보 입력 화면으로 간다(화면 이동이라 링크다). 이 창은 다른 창(장바구니 「옵션 변경」 등) 위에서도
               뜨므로 맨 위만 닫으면 밑의 창이 창 스택에 남아 돌아왔을 때 다시 열려 있다 — 그래서 all 로 전부 닫는다.
               돌아올 곳은 화면에 들어올 때 적어 둔 지금 주소다(없으면 싣지 않아 홈으로 돌아온다). -->
          <sequence>
            <close-modal target="required_info_pending_modal" :all="true"/>
            <navigate path="{{'/mypage/required-info' + (_global.requiredInfoGate?.from ? '?redirect=' + encodeURIComponent(_global.requiredInfoGate.from) : '')}}" fallbackPath="/mypage/required-info"/>
          </sequence>
        </on>
        $t:member.required_info.pending_modal.go
      </a>
    </footer>
  </modal>
</partial>
