<!-- 알림 전체 삭제 확인 창 — 헤더 드롭다운과 모바일 드로어, 마이페이지 알림함이 모두 이 하나를 연다. -->
<partial description="알림 전체 삭제 확인 모달 (User)" editor_label="$t:user.modal_label.notification_delete_all_confirm_modal">
  <modal data-type="composite" data-ref="notification_delete_all_confirm_modal" title="$t:mypage.notifications.delete_all_title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:mypage.notifications.delete_all_confirm</p>
    <div class="flex justify-end gap-3 mt-6">
      <button class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeletingAllNotifications}}" type="button">
        <on type="click">
          <close-modal target="notification_delete_all_confirm_modal"/>
        </on>
        $t:common.cancel
      </button>
      <button class="flex items-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeletingAllNotifications}}" type="button">
        <on type="click">
          <!-- 전체 삭제 — 알림을 보여 주는 곳이 셋이라(헤더·드로어·마이페이지 알림함) 셋의 데이터소스를 모두 다시 받아야 한 곳만 비고 나머지가 남는 일이 없다. 마이페이지 것(userNotifications)은 그 화면에서만 실재하고 없으면 조용히 지나간다. -->
          <sequence>
            <set-state target="global" :isDeletingAllNotifications="true"/>
            <api-call :auth_required="true" target="/api/user/notifications/all" method="DELETE">
              <success>
                <set-state target="global" :isDeletingAllNotifications="false" :notificationsCurrentPage="1" :notificationsHasMore="null" :notificationsLoadingMore="false"/>
                <toast type="success" message="$t:mypage.notifications.delete_all_success"/>
                <refetch-data-source dataSourceId="notifications"/>
                <refetch-data-source dataSourceId="notification_unread_count"/>
                <refetch-data-source dataSourceId="userNotifications"/>
                <close-modal target="notification_delete_all_confirm_modal"/>
              </success>
              <fail>
                <set-state target="global" :isDeletingAllNotifications="false"/>
                <toast type="error" message="{{error.message ?? $t:mypage.notifications.delete_all_failed}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeletingAllNotifications}}" name="spinner" class="text-base animate-spin"/>
        <span>{{_global.isDeletingAllNotifications ? $t:common.deleting : $t:common.delete}}</span>
      </button>
    </div>
  </modal>
</partial>
