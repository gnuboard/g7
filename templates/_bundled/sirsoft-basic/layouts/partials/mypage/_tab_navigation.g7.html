<!-- 마이페이지 탭 줄 — 탭이 각각 독립 레이아웃이라 «지금 어디인가» 를 스스로 알 수 없다. 각 화면이
     `currentTab` 계산값으로 알려 주고 이 조각은 그 값만 읽어 강조한다. -->
<partial description="마이페이지 공통 탭 네비게이션">
  <tab-navigation data-ref="mypageTabNavigation" variant="underline" class="mb-6" hiddenTabIds="{{_global.modules?.['sirsoft-ecommerce']?.inquiry?.board_slug ? [] : ['inquiries']}}" activeTabId="{{_computed?.currentTab}}">
    <prop name="tabs">
      <item id="profile" label="$t:mypage.tabs.profile" iconName="user"/>
      <item id="board" label="$t:mypage.tabs.board" iconName="message-square"/>
      <item id="scrap" label="$t:mypage.tabs.scrap" iconName="bookmark"/>
      <item id="orders" label="$t:mypage.tabs.orders" iconName="package"/>
      <item id="mileage" label="$t:mypage.tabs.mileage" iconName="coins"/>
      <item id="wishlist" label="$t:mypage.tabs.wishlist" iconName="heart"/>
      <item id="addresses" label="$t:mypage.tabs.addresses" iconName="map-pin"/>
      <item id="notifications" label="$t:mypage.tabs.notifications" iconName="bell"/>
      <item id="inquiries" label="$t:mypage.tabs.inquiries" iconName="comment"/>
    </prop>
    <on type="change" event="onTabChange">
      <!-- audit:allow layout-list-context-navigate-merge-query 마이페이지 탭 전환 — 탭마다 다루는 목록이 달라 이전 탭의 페이지·필터를 물려받으면 잘못된 화면이 된다. -->
      <navigate path="{{`/mypage/${$args[0]}`}}"/>
    </on>
  </tab-navigation>
</partial>
