<!-- 찜한 상품 목록 — 찜을 풀면 그 줄이 사라진다(상품 상세의 찜하기와 같은 엔드포인트를 쓴다). -->
<partial description="마이페이지 찜목록 탭">
  <div class="space-y-6">
    <blur-until-loaded sources="wishlist"/>
    <responsive on="portable" class="space-y-4"/>
    <!-- 섹션 헤더 - 찜목록 + 총 개수 (카드 외부, profile 패턴) -->
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white">
        <responsive on="portable" class="text-lg font-semibold text-gray-900 dark:text-white"/>
        $t:mypage.wishlist.title
      </h2>
      <span class="text-sm text-gray-500 dark:text-gray-400">$t:mypage.wishlist.count|count={{wishlist.data.pagination.total ?? 0}}</span>
    </div>
    <!-- 찜 목록 카드 -->
    <div>
      <!-- 찜 목록 그리드 -->
      <grid data-type="layout" data-if="{{wishlist.data.data &amp;&amp; wishlist.data.data.length > 0}}" :cols="5" :gap="4" class="p-6">
        <responsive on="portable" :cols="2" :gap="3" class="p-4"/>
        <div data-each="item in {{wishlist.data.data ?? []}}" class="relative group">
          <product-card data-type="composite" product="{{item.product}}" shopBase="{{_global.shopBase ?? '/shop'}}"/>
          <!-- 찜 해제 버튼 (카드 우상단 오버레이) -->
          <button type="button" aria-label="$t:shop.product.remove_from_wishlist" class="absolute top-2 right-2 z-10 w-9 h-9 flex items-center justify-center bg-white dark:bg-gray-700 rounded-full shadow-md border border-gray-200 dark:border-gray-600 text-red-500 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 hover:scale-110 transition-all cursor-pointer">
            <on type="click">
              <api-call :auth_required="true" auth_mode="required" target="/api/modules/sirsoft-ecommerce/wishlist/{{item.id}}" method="DELETE">
                <success>
                  <refetch-data-source dataSourceId="wishlist"/>
                  <toast type="success" message="$t:mypage.wishlist.removed"/>
                </success>
                <fail>
                  <toast type="error" message="{{error.message}}"/>
                </fail>
              </api-call>
            </on>
            <icon name="heart" iconStyle="solid" size="lg"/>
          </button>
        </div>
      </grid>
      <!-- 찜 목록 없음 -->
      <div data-if="{{!wishlist.data.data || wishlist.data.data.length === 0}}" class="p-8 text-center">
        <responsive on="portable" class="p-6 text-center"/>
        <icon name="heart" size="3x" class="mx-auto text-gray-300 dark:text-gray-600 mb-3"/>
        <p class="text-gray-500 dark:text-gray-400">$t:mypage.wishlist.empty</p>
        <button class="inline-block mt-4 px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg cursor-pointer">
          <on type="click">
            <!-- audit:allow layout-list-context-navigate-merge-query 쇼핑하러 가기 — 찜 목록이 비었을 때 상품 목록으로 내보내는 이동이다. -->
            <navigate path="{{_global.shopBase}}/products"/>
          </on>
          $t:mypage.wishlist.go_shopping
        </button>
      </div>
      <!-- 페이지네이션 -->
      <pagination data-type="composite" data-if="{{((wishlist.data.pagination.last_page ?? 0) > 1) || (wishlist.data.pagination.has_more_pages === true) || ((wishlist.data.pagination.current_page ?? 1) > 1)}}" currentPage="{{wishlist.data.pagination.current_page}}" totalPages="{{wishlist.data.pagination.last_page ?? null}}" hasMorePages="{{wishlist.data.pagination.has_more_pages ?? false}}" class="pt-4 flex justify-center">
        <on event="onPageChange">
          <set-state target="local" wishlistPage="{{$args[0]}}"/>
          <refetch-data-source dataSourceId="wishlist"/>
        </on>
      </pagination>
    </div>
  </div>
</partial>
