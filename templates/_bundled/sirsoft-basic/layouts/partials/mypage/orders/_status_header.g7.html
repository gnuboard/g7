<!-- 주문 상세 맨 윗줄 — 주문번호·일시와 지금 상태. 취소·확정·배송지 변경 버튼이 이 상태에 따라 열리고 닫힌다. -->
<partial description="주문 상세 - 주문 상태 헤더">
  <div class="bg-white dark:bg-gray-800 rounded-lg p-6">
    <responsive on="portable" class="bg-white dark:bg-gray-800 rounded-lg p-4"/>
    <div class="flex items-center gap-4">
      <responsive on="portable" class="flex items-center gap-3"/>
      <!-- 상태 아이콘 -->
      <div class="w-12 h-12 rounded-full flex items-center justify-center {{order.data.order_status_variant === 'warning' ? 'bg-yellow-100 dark:bg-yellow-900/30' : order.data.order_status_variant === 'success' ? 'bg-green-100 dark:bg-green-900/30' : order.data.order_status_variant === 'danger' ? 'bg-red-100 dark:bg-red-900/30' : 'bg-blue-100 dark:bg-blue-900/30'}}">
        <responsive on="portable" class="w-10 h-10 rounded-full flex items-center justify-center {{order.data.order_status_variant === 'warning' ? 'bg-yellow-100 dark:bg-yellow-900/30' : order.data.order_status_variant === 'success' ? 'bg-green-100 dark:bg-green-900/30' : order.data.order_status_variant === 'danger' ? 'bg-red-100 dark:bg-red-900/30' : 'bg-blue-100 dark:bg-blue-900/30'}}"/>
        <icon name="{{order.data.order_status_variant === 'warning' ? 'clock' : order.data.order_status_variant === 'success' ? 'check-circle' : order.data.order_status_variant === 'danger' ? 'x-circle' : order.data.order_status === 'shipping' ? 'truck' : 'credit-card'}}" class="text-2xl {{order.data.order_status_variant === 'warning' ? 'text-yellow-600 dark:text-yellow-400' : order.data.order_status_variant === 'success' ? 'text-green-600 dark:text-green-400' : order.data.order_status_variant === 'danger' ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'}}">
          <responsive on="portable" name="{{order.data.order_status_variant === 'warning' ? 'clock' : order.data.order_status_variant === 'success' ? 'check-circle' : order.data.order_status_variant === 'danger' ? 'x-circle' : order.data.order_status === 'shipping' ? 'truck' : 'credit-card'}}" class="w-5 h-5 {{order.data.order_status_variant === 'warning' ? 'text-yellow-600 dark:text-yellow-400' : order.data.order_status_variant === 'success' ? 'text-green-600 dark:text-green-400' : order.data.order_status_variant === 'danger' ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'}}"/>
        </icon>
      </div>
      <!-- 상태 텍스트 및 주문번호 -->
      <div>
        <h2 class="text-xl font-bold {{order.data.order_status_variant === 'warning' ? 'text-yellow-600 dark:text-yellow-400' : order.data.order_status_variant === 'success' ? 'text-green-600 dark:text-green-400' : order.data.order_status_variant === 'danger' ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'}}"><responsive on="portable" class="text-lg font-bold {{order.data.order_status_variant === 'warning' ? 'text-yellow-600 dark:text-yellow-400' : order.data.order_status_variant === 'success' ? 'text-green-600 dark:text-green-400' : order.data.order_status_variant === 'danger' ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400'}}"/>{{order.data.order_status_label ?? ''}}</h2>
        <!-- 부분취소 보조 배지 — 일부 옵션만 취소된 주문(별도 주문상태 아님, 파생 플래그) --><span data-if="{{order.data.is_partially_cancelled}}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium whitespace-nowrap bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400 mt-1">$t:mypage.orders.partial_cancelled_badge</span>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
          <span>$t:mypage.order_detail.order_number</span>
          <span>: </span>
          <span class="font-medium">{{order.data.order_number ?? ''}}</span>
        </p>
      </div>
    </div>
  </div>
</partial>
