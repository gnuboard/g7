<!-- 주문 배송지 변경 창 — 배송이 시작되기 전까지만 열린다. 회원은 저장된 배송지에서 고르거나 직접 쓸 수
     있고 비회원은 주소록이 없어 직접 입력만 보인다. 창이 별도 컨텍스트라 고른 값이 `_global` 에 산다.
     직접 입력 값(`_global.editingShippingAddress` — 받는 분·연락처·주소)은 창을 닫으면 비운다 — 취소·창 머리 닫기·Esc·적용 성공
     (핸들러가 창을 닫는다) 모두 창 본문이 내려가므로, 열려 있는 동안 내내 붙어 있는 본문 틀의 unmount 에서 비운다. 바깥 클릭으로는
     닫히지 않는 창이다(7.1.1 security.md 「_global 민감 정보 금지」 의 창 이름 공간 예외). -->
<partial description="주문 배송지 변경 모달" editor_label="$t:user.modal_label.mypage_orders.changeAddressModal">
  <modal data-type="composite" data-ref="changeAddressModal" title="$t:mypage.order_detail.change_shipping_address" size="md" :closeOnBackdropClick="false">
    <div class="space-y-4">
      <on event="unmount">
        <!-- 창이 닫혀 본문이 내려갈 때 직접 입력 배송지를 지운다 — 적용 핸들러는 창을 닫기 전에 이 값을 읽어 보낸다 -->
        <set-state target="global" :editingShippingAddress="null"/>
      </on>
      <!-- 탭: 저장된 배송지 / 직접 입력 — 회원만. 비회원은 주소록이 없어 탭 없이 직접입력 폼만 노출. -->
      <div data-if="{{_global.currentUser?.uuid}}" class="flex border-b border-gray-200 dark:border-gray-700">
        <button type="button" class="{{(_global.changeAddressMode ?? 'saved') === 'saved' ? 'px-4 py-2 text-sm font-medium border-b-2 border-gray-900 dark:border-white text-gray-900 dark:text-white' : 'px-4 py-2 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}}">
          <on type="click">
            <!-- 저장된 배송지 탭 -->
            <set-state target="global" changeAddressMode="saved"/>
          </on>
          $t:mypage.order_detail.saved_addresses
        </button>
        <button type="button" class="{{(_global.changeAddressMode ?? 'saved') === 'manual' ? 'px-4 py-2 text-sm font-medium border-b-2 border-gray-900 dark:border-white text-gray-900 dark:text-white' : 'px-4 py-2 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}}">
          <on type="click">
            <!-- 직접 입력 탭 — 비회원에게는 이 모드만 있고 탭 줄 자체가 보이지 않는다 -->
            <set-state target="global" changeAddressMode="manual"/>
          </on>
          $t:mypage.order_detail.manual_input
        </button>
      </div>
      <!-- 저장된 배송지 목록 — 회원 + saved 탭. 비회원은 주소록이 없어 비노출. -->
      <div data-if="{{_global.currentUser?.uuid &amp;&amp; (_global.changeAddressMode ?? 'saved') === 'saved'}}" class="space-y-2 max-h-80 overflow-y-auto">
        <!-- 배송지 있을 때 -->
        <div data-if="{{(userAddresses?.data?.addresses?.data ?? []).length > 0}}" data-each="addr, addrIdx in {{userAddresses?.data?.addresses?.data ?? []}}" class="space-y-2">
          <!-- 카드는 단추다 — Tab 으로 닿고 Enter·Space 로 고른다. 고른 카드는 aria-pressed 로 알린다(결제수단 카드·후기 별점과 같은 관례). 종전 클릭만 받는 카드는 키보드로 고를 수 없어, 고르지 않으면 잠기는 「변경」 단추 때문에 키보드 사용자가 진행할 수 없었다(7.1.1 출시 전). 단추 안이라 블록 상자 대신 span 으로 줄을 나눈다. -->
          <button type="button" aria-pressed="{{_global.selectedAddressId === addr.id}}" class="{{_global.selectedAddressId === addr.id ? 'block w-full text-left border-2 border-gray-900 dark:border-white rounded-lg p-3 cursor-pointer bg-gray-50 dark:bg-gray-700' : 'block w-full text-left border border-gray-200 dark:border-gray-700 rounded-lg p-3 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors'}}">
            <on type="click">
              <!-- 카드 전체가 고르기 영역이다 — 고르기만 하고 실제 반영은 아래 확인 버튼이 한다 -->
              <set-state target="global" selectedAddressId="{{addr.id}}"/>
            </on>
            <span class="flex items-center gap-2 mb-1">
              <span class="font-medium text-gray-900 dark:text-white text-sm">{{$localized(addr.name)}}</span>
              <span data-if="{{addr.is_default}}" class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded font-medium">
                <icon name="star" class="text-[10px]"/>
                <span>$t:mypage.addresses.default</span>
              </span>
            </span>
            <span class="block text-sm text-gray-600 dark:text-gray-300">{{addr.recipient_name}} | {{addr.recipient_phone}}</span>
            <span class="block text-sm text-gray-500 dark:text-gray-300">[{{addr.zipcode}}] {{addr.address}} {{addr.address_detail}}</span>
          </button>
        </div>
        <!-- 배송지 없을 때 -->
        <div data-if="{{!(userAddresses?.data?.addresses?.data ?? []).length}}" class="text-center py-8">
          <icon name="map-pin" class="text-[2.5rem] mx-auto text-gray-500 dark:text-gray-500 mb-2"/>
          <p class="text-sm text-gray-500 dark:text-gray-400">$t:mypage.addresses.empty</p>
        </div>
      </div>
      <!-- 직접 입력 폼 — 비회원은 항상 노출(탭 없음), 회원은 manual 탭 선택 시 노출. 모달은 부모 _local 미접근이므로 값은 _global.editingShippingAddress 에 산다(트리거가 현재 배송지로 채움). 칸마다 value 를 상태에서 읽고 change 로 전역 점 경로에 쓴다 — 폼 자동바인딩(data-key)은 «마지막 렌더 때의 전역 스냅샷»에 이번 칸만 얹어 통째로 쓰므로, 다음 칸 입력이 미뤄진 다시 그리기보다 먼저 오면 앞 칸 값을 지웠다(7.1.1 무거운 주문서에서 20ms 간격 입력 1/4). -->
      <div data-if="{{!_global.currentUser?.uuid || (_global.changeAddressMode ?? 'saved') === 'manual'}}" class="space-y-3">
        <!-- 받는 분 + 연락처 -->
        <div class="grid grid-cols-2 gap-3">
          <responsive on="portable" class="grid grid-cols-1 gap-3"/>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
              <span>$t:mypage.addresses.form.recipient</span>
              <span class="text-red-600 dark:text-red-400 ml-0.5">*</span>
            </label>
            <input aria-label="$t:mypage.addresses.form.recipient" type="text" name="recipient_name" value="{{_global.editingShippingAddress?.recipient_name ?? ''}}" placeholder="$t:mypage.addresses.form.recipient_placeholder" :required="true" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-gray-900 dark:focus:ring-white focus:border-transparent transition-colors text-sm">
              <on type="change">
                <set-state target="global" editingShippingAddress.recipient_name="{{$event.target.value}}"/>
              </on>
            </input>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
              <span>$t:mypage.addresses.form.phone</span>
              <span class="text-red-600 dark:text-red-400 ml-0.5">*</span>
            </label>
            <input aria-label="$t:mypage.addresses.form.phone" type="tel" name="recipient_phone" value="{{_global.editingShippingAddress?.recipient_phone ?? ''}}" placeholder="$t:mypage.addresses.form.phone_placeholder" :required="true" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-gray-900 dark:focus:ring-white focus:border-transparent transition-colors text-sm">
              <on type="change">
                <set-state target="global" editingShippingAddress.recipient_phone="{{$event.target.value}}"/>
              </on>
            </input>
          </div>
        </div>
        <!-- 주소 검색 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            <span>$t:mypage.addresses.form.address</span>
            <span class="text-red-600 dark:text-red-400 ml-0.5">*</span>
          </label>
          <div class="space-y-2">
            <div class="flex gap-2">
              <input aria-label="$t:shop.checkout.zipcode" type="text" name="zipcode" value="{{_global.editingShippingAddress?.zipcode ?? ''}}" placeholder="$t:shop.checkout.zipcode_placeholder" class="w-28 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white text-sm" :readOnly="true"/>
              <extension-point name="address_search_slot" data-ref="modal_change_address_search_slot">
                <prop name="readOnlyFields">
                  <item>zipcode</item>
                  <item>address</item>
                </prop>
                <callback name="onAddressSelect">
                  <set-state target="global" editingShippingAddress.zipcode="{{$event.zipcode}}" editingShippingAddress.address="{{$event.address}}" editingShippingAddress.region="{{$event.region}}" editingShippingAddress.city="{{$event.city}}"/>
                </callback>
              </extension-point>
            </div>
            <input aria-label="$t:shop.checkout.address" type="text" name="address" value="{{_global.editingShippingAddress?.address ?? ''}}" placeholder="$t:shop.checkout.address_placeholder" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white text-sm" :readOnly="true"/>
          </div>
        </div>
        <!-- 상세 주소 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:mypage.addresses.form.detail_address</label>
          <input aria-label="$t:mypage.addresses.form.detail_address" type="text" name="address_detail" value="{{_global.editingShippingAddress?.address_detail ?? ''}}" placeholder="$t:mypage.addresses.form.detail_placeholder" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-gray-900 dark:focus:ring-white focus:border-transparent transition-colors text-sm">
            <on type="change">
              <set-state target="global" editingShippingAddress.address_detail="{{$event.target.value}}"/>
            </on>
          </input>
        </div>
      </div>
      <!-- 버튼 영역 -->
      <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
        <responsive on="portable" class="flex gap-2 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700"/>
        <button type="button" class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          <responsive on="portable" type="button" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"/>
          <on type="click">
            <close-modal/>
          </on>
          $t:common.cancel
        </button>
        <button type="button" class="flex items-center justify-center gap-2 px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.isSubmittingAddress === true || (_global.currentUser?.uuid &amp;&amp; (_global.changeAddressMode ?? 'saved') === 'saved' &amp;&amp; !_global.selectedAddressId)}}">
          <responsive on="portable" type="button" class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.isSubmittingAddress === true || (_global.currentUser?.uuid &amp;&amp; (_global.changeAddressMode ?? 'saved') === 'saved' &amp;&amp; !_global.selectedAddressId)}}"/>
          <on type="click">
            <!-- 적용 — 저장된 배송지 탭에서 아무것도 고르지 않았으면 잠겨 있다(address_id 없이 나가면 서버가 직접 입력 칸을 요구해 422, #703).
                 회원/비회원 단일 커스텀 핸들러. 핸들러가 _global(changeAddressMode/selectedAddressId/editingShippingAddress/guestOrderToken) 을 읽어 endpoint(user vs guest)+body(address_id vs 직접입력)+토큰 헤더를 분기하고, isSubmittingAddress 처리중 상태·모달 닫기·order 리패치·토스트까지 모두 처리한다 (cancel/confirm-option 과 동일 패턴). confirm 1회는 핸들러 호출 액션에 둔다. -->
            <action handler="sirsoft-ecommerce.changeShippingAddress" confirm="$t:mypage.order_detail.confirm_change_address" orderId="{{order.data.id}}"/>
          </on>
          <icon data-if="{{_local.isSubmittingAddress}}" name="spinner" class="animate-spin" size="sm"/>
          <span>{{_local.isSubmittingAddress ? '$t:common.processing' : '$t:mypage.order_detail.apply_change'}}</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
