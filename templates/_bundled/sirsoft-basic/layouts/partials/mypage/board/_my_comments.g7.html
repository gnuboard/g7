<partial description="마이페이지 내 게시판 활동 - 내가 쓴 댓글 탭">
  <div>
    <!-- 필터 영역 -->
    <div class="flex flex-col sm:flex-row gap-3 mb-4">
      <!-- 게시판 필터 -->
      <select value="{{_global.myCommentsBoard ?? ''}}" class="min-w-[120px] px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
        <on type="change">
          <set-state target="global" myCommentsBoard="{{$event.target.value}}" :myCommentsPage="1"/>
          <refetch-data-source dataSourceId="myComments"/>
        </on>
        <option value="">$t:mypage.board_activities.filter.all_boards</option>
        <option data-each="board in {{boards?.data ?? []}}" value="{{board.slug}}">{{board.name}}</option>
      </select>
      <!-- 정렬 필터 -->
      <select value="{{_global.myCommentsSort ?? 'latest'}}" class="min-w-[100px] px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
        <on type="change">
          <set-state target="global" myCommentsSort="{{$event.target.value}}" :myCommentsPage="1"/>
          <refetch-data-source dataSourceId="myComments"/>
        </on>
        <option value="latest">$t:mypage.board_activities.sort.latest</option>
        <option value="oldest">$t:mypage.board_activities.sort.oldest</option>
      </select>
      <!-- 검색 영역 -->
      <div class="flex-1 flex gap-2">
        <input type="text" placeholder="$t:mypage.board_activities.search_placeholder_comments" value="{{_global.myCommentsSearch ?? ''}}" class="flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500">
          <on type="change">
            <set-state target="global" myCommentsSearch="{{$event.target.value}}"/>
          </on>
        </input>
        <button class="px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg text-sm font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors"><on type="click"><set-state target="global" :myCommentsPage="1"/><refetch-data-source dataSourceId="myComments"/></on>$t:common.search</button>
        <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"><on type="click"><set-state target="global" myCommentsBoard="" myCommentsSearch="" myCommentsSort="latest" :myCommentsPage="1"/><refetch-data-source dataSourceId="myComments"/></on>$t:common.reset</button>
      </div>
    </div>
    <!-- 검색 조건 표시 영역 (API 응답의 query 값 기반) -->
    <div data-if="{{myComments?.data?.query?.search || myComments?.data?.query?.board_slug}}" class="mb-4 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg flex items-center justify-between">
      <div class="flex items-center gap-2 text-sm text-blue-700 dark:text-blue-300">
        <icon name="search" size="sm"/>
        <span>$t:mypage.board_activities.search_result</span>
        <span data-if="{{myComments?.data?.query?.search}}" class="font-medium">"{{myComments?.data?.query?.search}}"</span>
        <span>({{myComments?.data?.total ?? 0}}$t:mypage.board_activities.search_result_unit)</span>
      </div>
      <button class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-200 text-sm"><on type="click"><set-state target="global" myCommentsBoard="" myCommentsSearch="" myCommentsSort="latest" :myCommentsPage="1"/><refetch-data-source dataSourceId="myComments"/></on>$t:common.reset</button>
    </div>
    <!-- 댓글 목록 -->
    <div class="space-y-3">
      <!-- 댓글 카드 반복 -->
      <div data-if="{{myComments?.data?.data &amp;&amp; myComments.data.data.length > 0}}" data-each="comment in {{myComments?.data?.data ?? []}}">
        <button class="w-full text-left block bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4 hover:border-gray-300 dark:hover:border-gray-600 transition-colors cursor-pointer">
          <on type="click">
            <navigate path="/board/{{comment.board_slug}}/{{comment.post_id_val}}"/>
          </on>
          <!-- 상단: [게시판명] 원글 제목 + 작성일 -->
          <div class="flex items-center justify-between gap-3">
            <div class="flex-1 min-w-0 flex items-center gap-2">
              <!-- 게시판 이름 --><span class="inline-flex items-center px-2 py-0.5 text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded flex-shrink-0">{{comment.board_name}}</span>
              <!-- 원글 제목 --><span class="text-base font-medium text-gray-900 dark:text-white truncate">{{comment.post_title}}</span>
            </div>
            <!-- 댓글 작성일시 --><span class="text-xs text-gray-500 dark:text-gray-400 flex-shrink-0 whitespace-nowrap" title="{{comment.created_at ?? ''}}">{{comment.created_at_formatted ?? ''}}</span>
          </div>
          <!-- 댓글 내용 요약 (2줄) --><p data-if="{{comment.content}}" class="mt-2 text-sm text-gray-600 dark:text-gray-300 line-clamp-2">{{comment.content}}</p>
        </button>
      </div>
      <!-- 댓글 없음 -->
      <div data-if="{{!myComments?.data?.data || myComments.data.data.length === 0}}" class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-8 text-center">
        <icon name="comment" size="3x" class="mx-auto text-gray-300 dark:text-gray-600 mb-3"/>
        <p class="text-gray-500 dark:text-gray-400">$t:mypage.board_activities.empty_comments</p>
        <button class="inline-block mt-4 px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg text-sm font-medium cursor-pointer hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors"><on type="click"><navigate path="/boards"/></on>$t:mypage.board_activities.go_boards</button>
      </div>
    </div>
    <!-- 페이지네이션 -->
    <pagination data-if="{{myComments?.data?.last_page > 1}}" currentPage="{{myComments?.data?.current_page ?? 1}}" totalPages="{{myComments?.data?.last_page ?? 1}}" class="mt-4 flex justify-center">
      <on event="onPageChange">
        <set-state target="global" myCommentsPage="{{$args[0]}}"/>
        <refetch-data-source dataSourceId="myComments"/>
      </on>
    </pagination>
  </div>
</partial>
