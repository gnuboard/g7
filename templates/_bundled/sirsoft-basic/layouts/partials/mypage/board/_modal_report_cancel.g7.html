<!-- 아직 처리되지 않은 내 신고를 거두는 창. 취소해도 신고 대상은 그대로다 — 「신고를 넣은
     사실」만 없애는 것이라는 점을 본문이 말한다.

     이 창은 대기 중인 건에서만 열린다(목록의 취소 버튼이 `can_cancel` 로 걸러진다). -->
<partial description="마이페이지 게시판 활동 - 신고 취소 확인" editor_label="$t:user.modal_label.mypage_board.reportCancelModal">
  <modal data-type="composite" data-ref="report_cancel_modal" id="report_cancel_modal" title="$t:mypage.board_activities.reports.cancel_title" icon="flag" iconClassName="text-red-500" size="sm">
    <div data-testid="report-cancel-modal" class="space-y-4">
      <p class="text-gray-600 dark:text-gray-400">$t:mypage.board_activities.reports.cancel_confirm</p>
      <!-- 어느 신고를 거두는지 — 목록이 담아 둔 대상(글은 제목, 댓글은 본문 요약)을 그대로 보인다.
           반응 해제 창과 같은 자리이며, 여러 건을 차례로 취소할 때 엉뚱한 행을 누르지 않게 한다. -->
      <p data-testid="report-cancel-target" data-if="{{!!_global.reportCancelModal?.title}}" class="px-3 py-2 text-sm font-medium text-gray-900 dark:text-white bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg line-clamp-2">{{raw:_global.reportCancelModal?.title}}</p>
      <p class="text-sm text-gray-500 dark:text-gray-500">$t:mypage.board_activities.reports.cancel_notice</p>
      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer">
          <on type="click">
            <!-- 취소 — 이 창은 여러 행이 돌려 쓰므로 대상 정보를 비우지 않으면 다음에 열 때 앞의 행이 남는다 -->
            <sequence>
              <set-state target="global" :reportCancelModal="null"/>
              <close-modal/>
            </sequence>
          </on>
          $t:common.cancel
        </button>
        <button data-testid="report-cancel-confirm" disabled="{{_local.reportCancelSubmitting}}" class="px-4 py-2 bg-red-600 dark:bg-red-700 text-white rounded-lg font-medium hover:bg-red-700 dark:hover:bg-red-800 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <!-- 신고 취소 — 접수(pending) 상태에서만 허용되고 다른 상태는 서버가 422 로 막는다. 성공하면 목록·통계를 다시 받는다 -->
            <sequence>
              <set-state target="local" :reportCancelSubmitting="true"/>
              <api-call target="/api/modules/sirsoft-board/me/reports/{{_global.reportCancelModal?.id}}" :auth_required="true" method="DELETE">
                <success>
                  <set-state target="local" :reportCancelSubmitting="false"/>
                  <toast type="success" message="{{result.message}}"/>
                  <refetch-data-source dataSourceId="myReports"/>
                  <!-- 위쪽 통계 카드의 「신고한 건」 숫자도 같이 줄어야 한다 -->
                  <refetch-data-source dataSourceId="myActivityStats"/>
                  <set-state target="global" :reportCancelModal="null"/>
                  <close-modal/>
                </success>
                <fail>
                  <set-state target="local" :reportCancelSubmitting="false"/>
                  <toast type="error" message="{{error.message}}"/>
                </fail>
              </api-call>
            </sequence>
          </on>
          <icon data-if="{{_local.reportCancelSubmitting}}" name="spinner" size="sm" class="animate-spin mr-2"/>
          <span>$t:mypage.board_activities.reports.cancel_confirm_button</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
