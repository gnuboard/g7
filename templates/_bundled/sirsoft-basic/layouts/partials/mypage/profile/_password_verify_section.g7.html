<!-- 내 정보를 고치기 전에 본인 확인을 한 번 더 받는 칸 — 로그인 세션이 남의 손에 있을 때 개인정보가
     그대로 바뀌지 않게 하는 자리다. 확인을 통과해야 아래 편집 폼이 열린다. -->
<partial description="프로필 편집 전 비밀번호 검증 섹션">
  <div data-if="{{!_local?.isPasswordVerified}}" class="max-w-lg mx-auto mt-16">
    <div class="p-8 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 shadow-sm">
      <!-- 헤더 영역 -->
      <div class="text-center mb-8">
        <!-- Lock 아이콘 -->
        <div class="inline-flex items-center justify-center w-12 h-12 mb-4 rounded-full bg-gray-100 dark:bg-gray-700">
          <icon name="lock" size="lg" class="text-gray-600 dark:text-gray-400"/>
        </div>
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">$t:mypage.profile.verify_password_title</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400">$t:mypage.profile.verify_password_message</p>
      </div>
      <!-- 비밀번호 검증 폼 -->
      <form id="verifyPasswordForm" class="space-y-5">
        <on type="submit">
          <set-state target="local" :isVerifyingPassword="true" :verifyPasswordError="false"/>
          <api-call :auth_required="true" target="/api/me/verify-password" method="POST">
            <success>
              <set-state target="local" :isVerifyingPassword="false" :isPasswordVerified="true" verifyPassword=""/>
            </success>
            <fail>
              <set-state target="local" :isVerifyingPassword="false" :verifyPasswordError="true"/>
            </fail>
            <body password="{{_local.verifyPassword}}"/>
          </api-call>
        </on>
        <div>
          <password-input name="password" value="{{_local?.verifyPassword ?? ''}}" placeholder="$t:mypage.profile.verify_password_placeholder" :showToggle="true" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-gray-900 dark:focus:ring-white focus:border-transparent transition-colors">
            <on type="change">
              <!-- 확인용 비밀번호 — 담기만 하고 대조는 확인 버튼이 서버에 묻는다 -->
              <set-state target="local" verifyPassword="{{$event.target.value}}"/>
            </on>
          </password-input>
          <p data-if="{{_local?.verifyPasswordError}}" class="mt-2 text-sm text-red-600 dark:text-red-400">$t:mypage.profile.verify_password_error</p>
        </div>
        <!-- 버튼 영역 -->
        <div class="flex gap-3 pt-2">
          <button type="button" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
            <on type="click">
              <navigate path="/mypage/profile"/>
            </on>
            $t:common.cancel
          </button>
          <button type="submit" form="verifyPasswordForm" loading="{{_local.isVerifyingPassword}}" disabled="{{_local.isVerifyingPassword || !_local.verifyPassword}}" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <icon data-if="{{_local.isVerifyingPassword}}" name="spinner" size="sm"/>
            <span>$t:mypage.profile.verify_password_button</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</partial>
