<!-- 내 정보를 고치기 전에 본인 확인을 한 번 더 받는 칸 — 로그인 세션이 남의 손에 있을 때 개인정보가
     그대로 바뀌지 않게 하는 자리다. 확인을 통과해야 아래 편집 폼이 열린다. -->
<partial description="프로필 편집 전 비밀번호 검증 섹션">
  <div data-if="{{!_local?.isPasswordVerified}}" class="max-w-lg mx-auto mt-16">
    <div class="p-8 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 shadow-sm">
      <!-- 헤더 영역 -->
      <div class="text-center mb-8">
        <!-- Lock 아이콘 -->
        <div class="inline-flex items-center justify-center w-12 h-12 mb-4 rounded-full bg-gray-100 dark:bg-gray-700">
          <icon name="lock" size="lg" class="text-gray-600 dark:text-gray-400"/>
        </div>
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">$t:mypage.profile.verify_password_title</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400">$t:mypage.profile.verify_password_message</p>
      </div>
      <!-- 비밀번호 검증 폼 — 비밀번호가 있는 회원 -->
      <form id="verifyPasswordForm" data-if="{{(user?.data?.has_password ?? _global.currentUser?.has_password) !== false}}" class="space-y-5">
        <on type="submit">
          <set-state target="local" :isVerifyingPassword="true" :verifyPasswordError="false"/>
          <api-call :auth_required="true" target="/api/me/verify-password" method="POST">
            <success>
              <set-state target="local" :isVerifyingPassword="false" :isPasswordVerified="true" verifyPassword=""/>
            </success>
            <fail>
              <set-state target="local" :isVerifyingPassword="false" :verifyPasswordError="true"/>
            </fail>
            <body password="{{_local.verifyPassword}}"/>
          </api-call>
        </on>
        <div>
          <password-input name="password" value="{{_local?.verifyPassword ?? ''}}" placeholder="$t:mypage.profile.verify_password_placeholder" :showToggle="true" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-300 focus:ring-2 focus:ring-gray-900 dark:focus:ring-white focus:border-transparent transition-colors">
            <on type="change">
              <!-- 확인용 비밀번호 — 담기만 하고 대조는 확인 버튼이 서버에 묻는다 -->
              <set-state target="local" verifyPassword="{{$event.target.value}}"/>
            </on>
          </password-input>
          <p data-if="{{_local?.verifyPasswordError}}" class="mt-2 text-sm text-red-600 dark:text-red-400">$t:mypage.profile.verify_password_error</p>
        </div>
        <!-- 버튼 영역 -->
        <div class="flex gap-3 pt-2">
          <a href="/mypage/profile" class="inline-flex items-center justify-center flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
            <on type="click">
              <navigate/>
            </on>
            $t:common.cancel
          </a>
          <button type="submit" form="verifyPasswordForm" loading="{{_local.isVerifyingPassword}}" disabled="{{_local.isVerifyingPassword || !_local.verifyPassword}}" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <icon data-if="{{_local.isVerifyingPassword}}" name="spinner" size="sm"/>
            <span>$t:mypage.profile.verify_password_button</span>
          </button>
        </div>
      </form>
      <!-- 이메일 인증번호 확인 — 비밀번호가 없는 회원(소셜 로그인 등 외부 인증으로만 가입). 코어 본인인증(목적 `sensitive_action`)으로
           인증번호를 받아 확인하면 받은 확인 토큰을 비밀번호 확인 API 에 실어 보낸다 — 서버가 본인 것인지·한 번만 쓰는지 확인한다. -->
      <div data-if="{{(user?.data?.has_password ?? _global.currentUser?.has_password) === false}}" data-ref="reauth_email_code_section" class="space-y-5">
        <p class="p-3 rounded-lg bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-sm text-blue-700 dark:text-blue-300" role="status">$t:mypage.profile.reauth_notice</p>
        <div data-if="{{!!_local?.reauthChallengeId}}">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">$t:mypage.profile.reauth_code_label</label>
          <!-- 자동바인딩을 쓰지 않는다 — 다시 받으면 입력값을 비워야 하므로 상태가 값을 소유한다 -->
          <input type="text" name="reauth_code" value="{{_local?.reauthCode ?? ''}}" inputMode="numeric" autoComplete="one-time-code" maxLength="10" placeholder="$t:mypage.profile.reauth_code_placeholder" class="w-full px-4 py-3 text-center text-xl tracking-widest font-mono border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-gray-900 dark:focus:ring-white focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local?.isVerifyingReauth ?? false}}">
            <on event="onChange">
              <set-state target="local" reauthCode="{{$event.target.value}}" :reauthError="null"/>
            </on>
          </input>
          <p data-if="{{_local?.reauthExpiresAt}}" class="mt-2 text-xs text-gray-500 dark:text-gray-400">$t:mypage.profile.reauth_valid_until|until={{_local?.reauthExpiresAt | datetime}}</p>
        </div>
        <p data-if="{{_local?.reauthError}}" class="text-sm text-red-600 dark:text-red-400" role="alert">{{_local?.reauthError ?? ''}}</p>
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button type="button" data-ref="reauth_request_code_button" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{(_local?.isRequestingReauthCode ?? false) || (_local?.isVerifyingReauth ?? false)}}">
            <on type="click">
              <!-- 인증번호 받기 — 진행 표시를 켜고 본인(로그인 회원) 대상 재확인 요청을 메일 수단으로 보낸다. 다시 받으면 새 요청으로 바꾸고 입력값을 비운다. -->
              <sequence>
                <set-state target="local" :isRequestingReauthCode="true" :reauthError="null"/>
                <api-call :auth_required="true" target="/api/identity/challenges" method="POST">
                  <success>
                    <set-state target="local" :isRequestingReauthCode="false" reauthChallengeId="{{response.data?.id}}" reauthExpiresAt="{{response.data?.expires_at}}" reauthCode=""/>
                    <toast type="info" message="$t:mypage.profile.reauth_code_sent"/>
                  </success>
                  <fail>
                    <set-state target="local" :isRequestingReauthCode="false" reauthError="{{error.message}}"/>
                  </fail>
                  <body purpose="sensitive_action" provider_id="g7:core.mail"/>
                </api-call>
              </sequence>
            </on>
            <span data-if="{{!_local?.reauthChallengeId}}">$t:mypage.profile.reauth_request_code</span>
            <span data-if="{{!!_local?.reauthChallengeId}}">$t:mypage.profile.reauth_resend_code</span>
          </button>
          <button type="button" data-ref="reauth_confirm_button" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{!_local?.reauthChallengeId || !_local?.reauthCode || _local.reauthCode.length &lt; 4 || (_local?.isVerifyingReauth ?? false)}}">
            <on type="click">
              <!-- 확인 — 인증번호를 확인해 받은 토큰을 비밀번호 확인 API 에 보낸다. 통과하면 편집 폼을 연다. 실패 문구는 이 칸 아래에 싣는다. -->
              <sequence>
                <set-state target="local" :isVerifyingReauth="true" :reauthError="null"/>
                <api-call :auth_required="true" target="/api/identity/challenges/{{_local.reauthChallengeId}}/verify" method="POST">
                  <success>
                    <api-call :auth_required="true" target="/api/me/verify-password" method="POST">
                      <success>
                        <set-state target="local" :isVerifyingReauth="false" :isPasswordVerified="true" reauthCode="" :reauthChallengeId="null"/>
                      </success>
                      <fail>
                        <set-state target="local" :isVerifyingReauth="false" reauthError="{{error.message}}"/>
                      </fail>
                      <body verification_token="{{response.data?.verification_token}}"/>
                    </api-call>
                  </success>
                  <fail>
                    <set-state target="local" :isVerifyingReauth="false" reauthError="{{error.message}}"/>
                  </fail>
                  <body code="{{_local.reauthCode}}"/>
                </api-call>
              </sequence>
            </on>
            <icon data-if="{{_local?.isVerifyingReauth}}" name="spinner" size="sm"/>
            <span>$t:mypage.profile.reauth_confirm</span>
          </button>
        </div>
        <button type="button" class="w-full px-4 py-2.5 text-sm text-gray-600 dark:text-gray-400 hover:underline cursor-pointer">
          <on type="click">
            <navigate path="/mypage/profile"/>
          </on>
          $t:common.cancel
        </button>
      </div>
    </div>
  </div>
</partial>
