<!-- 내 리뷰 삭제 확인 창 (#952) — 지우면 사진도 함께 지워지고 되돌릴 수 없다. 대상은 창 고유 전역 이름 공간 `_global.reviewDeleteModal`
     (reviewId·productName·isDeleting)에 있고 여는 쪽이 매번 비운다. 성공하면 목록을 다시 받는다. -->
<partial description="내 리뷰 삭제 확인 모달" editor_label="$t:user.modal_label.mypage_reviews.reviewDeleteModal">
  <modal data-type="composite" data-ref="reviewDeleteModal" title="$t:mypage.reviews.delete_modal.title" size="sm">
    <div class="py-2">
      <p class="text-sm text-gray-700 dark:text-gray-300">$t:mypage.reviews.delete_modal.message|product={{_global.reviewDeleteModal?.productName ?? ''}}</p>
      <p class="mt-2 text-xs text-muted">$t:mypage.reviews.delete_modal.warning</p>
    </div>
    <footer>
      <button type="button" class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors" disabled="{{_global.reviewDeleteModal?.isDeleting === true}}">
        <on type="click">
          <close-modal/>
        </on>
        $t:common.cancel
      </button>
      <button data-ref="review_delete_confirm" type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.reviewDeleteModal?.isDeleting === true}}">
        <on type="click">
          <!-- 삭제 — 버튼을 잠그고, 성공하면 창을 닫고 목록을 다시 받는다(실패하면 잠금을 푼다) -->
          <sequence>
            <set-state target="global" :reviewDeleteModal.isDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/user/reviews/{{_global.reviewDeleteModal?.reviewId}}" method="DELETE">
              <success>
                <set-state target="global" :reviewDeleteModal.isDeleting="false"/>
                <close-modal/>
                <refetch-data-source dataSourceId="myReviews"/>
                <toast type="success" message="$t:mypage.reviews.delete_modal.success"/>
              </success>
              <fail>
                <set-state target="global" :reviewDeleteModal.isDeleting="false"/>
                <toast type="error" message="{{error.message ?? '$t:mypage.reviews.delete_modal.failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.reviewDeleteModal?.isDeleting === true}}" name="spinner" size="sm" class="animate-spin"/>
        <span>$t:mypage.reviews.delete</span>
      </button>
    </footer>
  </modal>
</partial>
