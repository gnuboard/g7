<!-- 주문서를 열었는데 임시 주문이 이미 사라진 경우(만료·정리) 알리는 창. 닫기·바깥클릭·ESC 를 모두
     막았다 — 이 상태로는 주문서가 아무 의미가 없어 장바구니로 돌아가는 것 말고 할 일이 없기 때문이다. -->
<partial description="임시 주문 정보 없음 알림 모달" editor_label="$t:user.modal_label.shop.tempOrderNotFoundModal">
  <modal data-type="composite" data-ref="tempOrderNotFoundModal" title="$t:shop.checkout.temp_order_not_found_title" size="sm" :showCloseButton="false" :closeOnOverlayClick="false" :closeOnEscape="false">
    <div class="text-center py-4">
      <icon name="exclamation-circle" class="text-yellow-500 text-4xl mb-4"/>
      <p class="text-gray-700 dark:text-gray-300">$t:shop.checkout.temp_order_not_found_message</p>
    </div>
    <div class="flex justify-center mt-6">
      <button type="button" class="px-6 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors">
        <on type="click">
          <!-- 확인이 곧 유일한 출구다 — 임시 주문이 없으면 주문서에 머물 이유가 없어 장바구니로 되돌린다 -->
          <sequence>
            <close-modal/>
            <navigate path="{{_global.shopBase}}/cart"/>
          </sequence>
        </on>
        $t:common.confirm
      </button>
    </div>
  </modal>
</partial>
