<!-- 장바구니에서 지우기 전 확인 창. 개별 삭제와 선택 삭제가 같은 창을 쓰고, 지울 대상은
     `_local.deleteModal.targetIds` 에 담겨 온다 — 창이 스스로 대상을 고르지 않는다. -->
<partial description="장바구니 상품 삭제 확인 모달" editor_label="$t:user.modal_label.shop.cart_delete_confirm_modal">
  <modal data-type="composite" data-ref="cart_delete_confirm_modal" title="$t:shop.cart.delete_modal.title" size="sm">
    <!-- 모달 내용 -->
    <div class="p-4">
      <div class="flex items-center gap-3 mb-4">
        <icon name="triangle-exclamation" class="text-2xl text-red-500"/>
        <span class="text-gray-900 dark:text-white font-medium">$t:shop.cart.delete_modal.confirm</span>
      </div>
      <p class="text-gray-700 dark:text-gray-300">{{$parent._local.deleteModal.targetIds?.length > 1 ? '$t:shop.cart.delete_modal.message_multiple' : '$t:shop.cart.delete_modal.message_single'}}</p>
      <p data-if="{{$parent._local.deleteModal.targetIds?.length > 1}}" class="text-sm text-gray-500 dark:text-gray-400 mt-2">$t:shop.cart.delete_modal.count|count={{$parent._local.deleteModal.targetIds?.length}}</p>
    </div>
    <!-- 모달 푸터 -->
    <div class="flex justify-end gap-3 p-4 border-t border-gray-200 dark:border-gray-700">
      <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{_global.isDeleting}}">
        <on type="click">
          <close-modal/>
        </on>
        $t:common.cancel
      </button>
      <button class="flex items-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 hover:bg-red-700 dark:hover:bg-red-600 text-white rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" disabled="{{_global.isDeleting}}">
        <on type="click">
          <!-- 삭제 확정. 진행 표시가 `_global` 인 이유는 이 창과 뒤 장바구니 목록이 함께 잠겨야 하기 때문이다 -->
          <sequence>
            <set-state target="global" :isDeleting="true"/>
            <api-call auth_mode="optional" target="/api/modules/sirsoft-ecommerce/cart" method="DELETE">
              <success>
                <set-state target="global" :isDeleting="false"/>
                <set-state target="$parent._local">
                  <field name="deleteModal">
                    <field name="visible" :value="false"/>
                    <field name="targetIds" :value="[]"/>
                  </field>
                </set-state>
                <refetch-data-source dataSourceId="cartItems"/>
                <refetch-data-source dataSourceId="cart"/>
                <toast type="success" message="$t:shop.cart.items_deleted"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isDeleting="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
              <body ids="{{$parent._local.deleteModal.targetIds}}"/>
              <field name="headers">
                <field name="X-Cart-Key" value="{{_global.cartKey}}"/>
              </field>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" :spin="true" size="sm"/>
        <span>{{_global.isDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
