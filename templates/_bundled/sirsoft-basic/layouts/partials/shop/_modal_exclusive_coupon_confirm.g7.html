<!-- 다른 쿠폰과 함께 쓸 수 없는 쿠폰을 고를 때 뜨는 확인 창 — 진행하면 먼저 걸려 있던 쿠폰이 풀린다.
     그 사실을 미리 알리지 않으면 할인이 줄어든 이유를 알 수 없기 때문에 둔 자리다. -->
<partial editor_label="$t:user.modal_label.shop.exclusiveCouponConfirm" description="중복 불가 쿠폰 적용 확인 모달">
  <modal data-type="composite" data-ref="exclusiveCouponConfirm" title="$t:shop.checkout.exclusive_coupon_title" size="medium">
    <p class="text-base text-gray-700 dark:text-gray-300">$t:shop.checkout.exclusive_coupon_message</p>
    <div class="flex justify-end gap-3 mt-6">
      <button type="button" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        <on type="click">
          <close-modal/>
        </on>
        $t:common.cancel
      </button>
      <!-- 단독 사용 쿠폰을 그대로 적용한다. 이 쿠폰은 다른 할인과 겹쳐 쓸 수 없어 이미 걸린 할인을 내리게 되므로 확인을 한 단계 둔다 -->
      <button type="button" class="px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors">
        <on type="click">
          <set-state target="local" checkout="{{Object.assign({}, _local.checkout, { order_coupon_issue_id: _global.pendingExclusiveCoupon?.id })}}"/>
          <set-state target="global" :pendingExclusiveCoupon="null"/>
          <close-modal/>
          <api-call target="/api/modules/sirsoft-ecommerce/checkout" method="PUT" body="{{_local.checkout}}">
            <success>
              <update-data-source dataSourceId="checkoutData" data="{{response}}"/>
            </success>
            <fail>
              <toast type="error" message="{{error.message}}"/>
            </fail>
          </api-call>
        </on>
        $t:common.confirm
      </button>
    </div>
  </modal>
</partial>
