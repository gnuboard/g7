<!-- 목록 위의 정렬 줄 — 전체 상품 목록과 분류 화면이 같이 쓴다. 모든 조건이 URL 쿼리로 나가므로 이 조각은 목록을
     직접 다시 받지 않는다(주소가 바뀌면 목록 데이터소스가 따라온다). 이동은 전부 보던 화면 주소(`route.path`)로 한다 —
     전체 목록에서는 상품 목록 주소, 분류 화면에서는 그 분류 주소다. -->
<partial description="정렬 줄 (총 상품 수, 초기화, 품절 제외, 정렬)">
  <div data-ref="shop_sort_bar" class="flex flex-wrap items-center justify-between gap-2 py-3 bg-gray-50 dark:bg-gray-800/50">
    <!-- 총 상품 수 -->
    <span class="text-sm font-semibold text-gray-700 dark:text-gray-300"><blur-until-loaded sources="products"/>$t:shop.total_count|count={{products?.data?.pagination?.total ?? 0}}</span>
    <!-- 오른쪽: 초기화 버튼 + 품절 제외 + 정렬 -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- 전체 초기화 버튼 (필터 적용 시에만 표시) -->
      <button type="button" data-if="{{!!query.category || !!query.keyword || query.exclude_sold_out === '1'}}" class="h-9 px-3 text-sm text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
        <on type="click">
          <!-- audit:allow layout-list-context-navigate-merge-query 필터 초기화 — 검색어·카테고리·품절 제외·정렬·페이지를 모두 비우는 의도적 리셋이므로 병합하지 않는다 -->
          <navigate path="{{route.path}}">
            <query/>
          </navigate>
        </on>
        $t:shop.reset_all
      </button>
      <!-- 품절 제외 — 판매상태 품절·재고 없는 상품을 목록에서 뺀다 -->
      <label class="flex items-center gap-2 h-9 text-sm text-gray-700 dark:text-gray-300 cursor-pointer">
        <checkbox id="shop_exclude_sold_out" name="exclude_sold_out" checked="{{query.exclude_sold_out === '1'}}" :autoBinding="false" class="w-4 h-4 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 rounded">
          <on type="change">
            <!-- 조건이 바뀌면 쪽수 구성이 달라지므로 1쪽으로 돌아간다(빈 값은 주소에서 빠진다) -->
            <navigate path="{{route.path}}" :mergeQuery="true">
              <query exclude_sold_out="{{$event.target.checked ? '1' : ''}}" page=""/>
            </navigate>
          </on>
        </checkbox>
        <span>$t:shop.exclude_sold_out</span>
      </label>
      <!-- 정렬 Select -->
      <select name="sort" aria-label="$t:common.sort_order" value="{{query.sort ?? 'latest'}}" class="h-9 w-32">
        <options>
          <option value="latest">$t:shop.sort.latest</option>
          <option value="sales">$t:shop.sort.sales</option>
          <option value="reviews">$t:shop.sort.reviews</option>
          <option value="price_asc">$t:shop.sort.price_asc</option>
          <option value="price_desc">$t:shop.sort.price_desc</option>
        </options>
        <on type="change">
          <!-- 정렬을 바꾸면 순서가 통째로 달라지므로 보던 쪽수를 유지하지 않고 1쪽으로 돌아간다 -->
          <navigate path="{{route.path}}" :mergeQuery="true">
            <query sort="{{$event.target.value}}" page="1"/>
          </navigate>
        </on>
      </select>
    </div>
  </div>
</partial>
