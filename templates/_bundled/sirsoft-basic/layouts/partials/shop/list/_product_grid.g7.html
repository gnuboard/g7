<!-- 상품 카드 격자와 쪽 넘김 — 목록 화면(전체·카테고리)이 함께 쓴다. 어느 화면에 실리든 지금 경로
     (`route.path`)에 쿼리만 갈아 끼우므로 조각이 어느 목록인지 알 필요가 없다. -->
<partial description="상품 그리드 + 페이지네이션 (products 데이터소스 사용, route.path 기반 navigate)">
  <div>
    <!-- 상품 그리드 -->
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 mb-8">
      <div data-each="product in {{products?.data?.data ?? []}}">
        <product-card data-type="composite" product="{{product}}" shopBase="{{_global.shopBase ?? '/shop'}}" :preserveListQuery="true"/>
      </div>
    </div>
    <!-- 빈 상태 -->
    <div data-if="{{products !== undefined &amp;&amp; (products?.data?.data ?? []).length === 0}}" class="flex flex-col items-center justify-center py-20 px-4 my-16">
      <div class="w-20 h-20 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-5">
        <icon name="search" size="2x" class="text-gray-500 dark:text-gray-400"/>
      </div>
      <p class="text-lg font-medium text-gray-700 dark:text-gray-300 mb-1">$t:shop.no_products</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">$t:shop.no_search_results</p>
    </div>
    <!-- 쪽 번호 — 다른 목록과 같은 쪽 번호 컴포넌트(번호마다 실제 링크). 총 건수가 상한에 걸리면 last_page 가 null 로 온다.
         그때 last_page 만 보고 판단하면 쪽 이동이 통째로 사라지므로 has_more_pages 와 현재 쪽도 함께 본다 -->
    <pagination pageHref="{{route.path}}?page={page}" :pageHrefMergeQuery="true" data-type="composite" data-if="{{((products?.data?.pagination?.last_page ?? 0) > 1) || (products?.data?.pagination?.has_more_pages ?? false) || ((products?.data?.pagination?.current_page ?? 1) > 1)}}" currentPage="{{products?.data?.pagination?.current_page ?? 1}}" totalPages="{{products?.data?.pagination?.last_page ?? null}}" hasMorePages="{{products?.data?.pagination?.has_more_pages ?? false}}" class="mb-12 flex justify-center">
      <on event="onPageChange">
        <!-- 검색어·분류·정렬·품절 제외는 그대로 두고 쪽수만 바꾼다 -->
        <navigate path="{{route.path}}" :mergeQuery="true">
          <query page="{{$args[0]}}"/>
        </navigate>
      </on>
    </pagination>
  </div>
</partial>
