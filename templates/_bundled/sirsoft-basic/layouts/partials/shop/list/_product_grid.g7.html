<!-- 상품 카드 격자와 쪽 넘김 — 목록 화면(전체·카테고리)이 함께 쓴다. 어느 화면에 실리든 지금 경로
     (`route.path`)에 쿼리만 갈아 끼우므로 조각이 어느 목록인지 알 필요가 없다. -->
<partial description="상품 그리드 + 페이지네이션 (products 데이터소스 사용, route.path 기반 navigate)">
  <div>
    <!-- 상품 그리드 -->
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 mb-8">
      <div data-each="product in {{products?.data?.data ?? []}}">
        <product-card data-type="composite" product="{{product}}" shopBase="{{_global.shopBase ?? '/shop'}}" :preserveListQuery="true"/>
      </div>
    </div>
    <!-- 빈 상태 -->
    <div data-if="{{(products?.data?.data ?? []).length === 0}}" class="flex flex-col items-center justify-center py-20 px-4 my-16">
      <div class="w-20 h-20 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-5">
        <icon name="search" size="2x" class="text-gray-400 dark:text-gray-500"/>
      </div>
      <p class="text-lg font-medium text-gray-700 dark:text-gray-300 mb-1">$t:shop.no_products</p>
      <p class="text-sm text-gray-400 dark:text-gray-500">$t:shop.no_search_results</p>
    </div>
    <!-- 페이지네이션 — 총 건수가 상한에 걸리면 last_page 가 null 로 온다. 그때 last_page 만 보고 판단하면 페이저가 통째로 사라져 1페이지 밖 상품에 도달할 방법이 없어지므로, has_more_pages 와 현재 페이지도 함께 본다 -->
    <div data-if="{{((products?.data?.pagination?.last_page ?? 0) > 1) || (products?.data?.pagination?.has_more_pages ?? false) || ((products?.data?.pagination?.current_page ?? 1) > 1)}}" class="flex justify-center items-center gap-2 mb-12">
      <!-- 이전 페이지 버튼 -->
      <button type="button" aria-label="$t:common.prev" class="p-2 border border-gray-300 dark:border-gray-600 rounded-lg {{(products?.data?.pagination?.current_page ?? 1) <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer'}}" disabled="{{(products?.data?.pagination?.current_page ?? 1) <= 1}}">
        <on type="click">
          <navigate path="{{route.path}}" :mergeQuery="true">
            <query page="{{(products?.data?.pagination?.current_page ?? 1) - 1}}"/>
          </navigate>
        </on>
        <icon name="chevron-left" class="text-base"/>
      </button>
      <!-- 페이지 번호 표시 — 마지막 페이지를 모를 때(총 건수 상한 초과) 1 로 채우면 '1 / 1' 로 굳어 끝난 것처럼 보인다. 그때는 현재 페이지만 표기한다 -->
      <span class="px-3 py-1 text-sm text-gray-700 dark:text-gray-300">{{products?.data?.pagination?.last_page ? ((products?.data?.pagination?.current_page ?? 1) + ' / ' + products.data.pagination.last_page) : (products?.data?.pagination?.current_page ?? 1)}}</span>
      <!-- 다음 페이지 버튼 — 이동 가능 여부는 총 건수와 무관하게 has_more_pages 가 정확히 말해 준다. last_page 로 판정하면 그 값이 null 인 목록에서 첫 페이지부터 비활성이 된다 -->
      <button type="button" aria-label="$t:common.next" class="p-2 border border-gray-300 dark:border-gray-600 rounded-lg {{(products?.data?.pagination?.has_more_pages ?? false) ? 'hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer' : 'opacity-50 cursor-not-allowed'}}" disabled="{{!(products?.data?.pagination?.has_more_pages ?? false)}}">
        <on type="click">
          <navigate path="{{route.path}}" :mergeQuery="true">
            <query page="{{(products?.data?.pagination?.current_page ?? 1) + 1}}"/>
          </navigate>
        </on>
        <icon name="chevron-right" class="text-base"/>
      </button>
    </div>
  </div>
</partial>
