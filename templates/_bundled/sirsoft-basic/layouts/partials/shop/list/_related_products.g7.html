<!-- 관련 상품(「이 상품은 어떠세요?」) 가로 줄 — 상품 상세에서 같은 분류의 상품을 보여 준다.
     인기·신상품·최근 본 줄과 같은 짜임이고, 관련 상품이 없으면 통째로 그리지 않는다. -->
<partial description="이 상품은 어떠세요 섹션">
  <product-rail data-type="composite" data-if="{{relatedProducts.data &amp;&amp; relatedProducts.data.length > 0}}" class="mb-12" title="$t:shop.related_products" icon="thumbs-up" iconClassName="text-xl text-blue-600 dark:text-blue-400" prevLabel="$t:common.prev" nextLabel="$t:common.next" roleDescription="$t:shop.product_rail.roledescription">
    <div data-each="product in {{relatedProducts.data ?? []}}">
      <product-card data-type="composite" product="{{product}}" shopBase="{{_global.shopBase ?? '/shop'}}"/>
    </div>
  </product-rail>
</partial>
