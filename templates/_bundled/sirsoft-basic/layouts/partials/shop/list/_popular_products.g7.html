<partial description="인기 상품 섹션">
  <div data-if="{{popularProducts.data &amp;&amp; popularProducts.data.length > 0}}" class="mb-12">
    <isolated-state scope-id="popular-products-scroll">
      <field name="scrollIdx" :value="0"/>
    </isolated-state>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
        <icon name="flame" class="text-xl text-orange-500"/>
        <span>$t:shop.popular_products</span>
      </h2>
      <div class="flex gap-2">
        <button class="{{_isolated.scrollIdx <= 0 ? 'p-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'p-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700'}}" disabled="{{_isolated.scrollIdx <= 0}}">
          <on type="click">
            <set-state target="isolated" scrollIdx="{{_isolated.scrollIdx - 1}}"/>
            <scroll-into-view selector="#popular-product-{{_isolated.scrollIdx}}" behavior="smooth" inline="start" :waitForElement="true" :timeout="1000"/>
          </on>
          <icon name="chevron-left" class="text-base"/>
        </button>
        <button class="{{(_isolated.scrollIdx + 4) >= (popularProducts.data.length) ? 'p-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'p-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700'}}" disabled="{{(_isolated.scrollIdx + 4) >= (popularProducts.data.length)}}">
          <responsive on="0-639" class="{{(_isolated.scrollIdx + 2) >= (popularProducts.data.length) ? 'p-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'p-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700'}}" disabled="{{(_isolated.scrollIdx + 2) >= (popularProducts.data.length)}}"/>
          <responsive on="640-1023" class="{{(_isolated.scrollIdx + 3) >= (popularProducts.data.length) ? 'p-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-300 dark:text-gray-600 cursor-not-allowed' : 'p-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700'}}" disabled="{{(_isolated.scrollIdx + 3) >= (popularProducts.data.length)}}"/>
          <on type="click">
            <set-state target="isolated" scrollIdx="{{_isolated.scrollIdx + 1}}"/>
            <scroll-into-view selector="#popular-product-{{_isolated.scrollIdx}}" behavior="smooth" inline="start" :waitForElement="true" :timeout="1000"/>
          </on>
          <icon name="chevron-right" class="text-base"/>
        </button>
      </div>
    </div>
    <div class="grid grid-flow-col auto-cols-[calc(50%_-_8px)] sm:auto-cols-[calc(33.333%_-_11px)] lg:auto-cols-[calc(25%_-_12px)] gap-4 overflow-x-hidden">
      <div data-each="product, idx in {{popularProducts.data ?? []}}" id="popular-product-{{idx}}">
        <product-card product="{{product}}" shopBase="{{_global.shopBase ?? '/shop'}}"/>
      </div>
    </div>
  </div>
</partial>
