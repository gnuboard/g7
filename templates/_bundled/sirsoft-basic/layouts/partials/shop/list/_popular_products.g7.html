<!-- 인기 상품 가로 줄 — 신상품·최근 본·관련 상품 줄과 같은 짜임이다. 넘기기(손가락 넘김·이전/다음 단추)는
     ProductRail 컴포넌트가 맡는다. 줄이 비면 통째로 그리지 않는다. -->
<partial description="인기 상품 섹션">
  <product-rail data-type="composite" data-if="{{popularProducts.data &amp;&amp; popularProducts.data.length > 0}}" class="mb-12" title="$t:shop.popular_products" icon="flame" iconClassName="text-xl text-orange-600 dark:text-orange-400" prevLabel="$t:common.prev" nextLabel="$t:common.next" roleDescription="$t:shop.product_rail.roledescription">
    <div data-each="product in {{popularProducts.data ?? []}}">
      <product-card data-type="composite" product="{{product}}" shopBase="{{_global.shopBase ?? '/shop'}}"/>
    </div>
  </product-rail>
</partial>
