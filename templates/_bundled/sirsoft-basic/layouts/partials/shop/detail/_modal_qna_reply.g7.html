<!-- 상품 문의 답변 창 — 판매자 권한이 있는 사람만 연다. 새 답변과 기존 답변 수정이 같은 창을 쓰고,
     들고 있는 답변 id 유무로 갈린다. -->
<partial description="상품 1:1 문의 답변 작성/수정 모달" editor_label="$t:user.modal_label.shop_detail.qna_reply_modal">
  <modal data-type="composite" data-ref="qna_reply_modal" title="{{_global.qnaReplyEditId ? $t('shop.qna.reply_edit_title') : $t('shop.qna.reply_write_title')}}" size="md" :closeOnBackdropClick="false">
    <!-- 답변 내용 입력 -->
    <div class="space-y-4">
      <div class="space-y-1">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">$t:shop.qna.reply_content</label>
        <textarea class="{{(_global.qnaErrors?.content) ? 'w-full px-3 py-2 border border-red-500 dark:border-red-400 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 resize-none' : 'w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none'}}" placeholder="$t:shop.qna.reply_content_placeholder" :rows="5" value="{{_global.qnaReplyForm.content ?? ''}}" disabled="{{_global.qnaSubmitting}}">
          <on event="onChange">
            <!-- 답변 본문. 문의 작성 창과 같은 이유로 값이 `_global` 에 산다(모달은 부모 `_local` 을 못 읽는다) -->
            <set-state target="global">
              <field name="qnaReplyForm">
                <field name="content" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </textarea>
        <span data-if="{{_global.qnaErrors?.content}}" class="text-red-500 dark:text-red-400 text-xs mt-1 block">{{(_global.qnaErrors?.content ?? [])[0] ?? ''}}</span>
      </div>
    </div>
    <!-- 모달 푸터 - 취소 / 등록 -->
    <div class="flex gap-3 pt-4 border-t border-gray-200 dark:border-gray-700 mt-4">
      <button type="button" class="flex-1 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.qnaSubmitting}}">
        <on type="click">
          <!-- 취소 — 진행 표시와 오류를 걷어 낸 뒤 닫는다 -->
          <sequence>
            <set-state target="global" :qnaSubmitting="false" :qnaErrors="null"/>
            <close-modal/>
          </sequence>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="flex-1 py-2.5 bg-blue-600 dark:bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.qnaSubmitting}}">
        <on type="click">
          <!-- 답변 등록/수정 — `qnaReplyEditId` 유무로 갈린다. 먼저 버튼을 잠가 답변이 둘 달리는 것을 막는다 -->
          <sequence>
            <set-state target="global" :qnaSubmitting="true"/>
            <conditions>
              <!-- 수정 모드: PUT /user/inquiries/{id}/reply -->
              <when if="{{!!_global.qnaReplyEditId}}">
                <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/user/inquiries/{{_global.qnaReplyEditId}}/reply" method="PUT">
                  <success>
                    <set-state target="global" :qnaSubmitting="false" :qnaErrors="null" :qnaReplyEditId="null"/>
                    <close-modal/>
                    <refetch-data-source dataSourceId="qna"/>
                    <toast type="success" message="$t:shop.qna.reply_updated"/>
                  </success>
                  <fail>
                    <set-state target="global" :qnaSubmitting="false" qnaErrors="{{error.errors ?? null}}"/>
                    <toast type="error" message="{{error.message ?? $t('shop.qna.reply_update_failed')}}"/>
                  </fail>
                  <body content="{{_global.qnaReplyForm.content ?? ''}}"/>
                </api-call>
              </when>
              <!-- 등록 모드: POST /user/inquiries/{id}/reply -->
              <else>
                <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/user/inquiries/{{_global.qnaReplyTargetId}}/reply" method="POST">
                  <success>
                    <set-state target="global" :qnaSubmitting="false" :qnaErrors="null" :qnaReplyTargetId="null"/>
                    <close-modal/>
                    <refetch-data-source dataSourceId="qna"/>
                    <toast type="success" message="$t:shop.qna.reply_submitted"/>
                  </success>
                  <fail>
                    <set-state target="global" :qnaSubmitting="false" qnaErrors="{{error.errors ?? null}}"/>
                    <toast type="error" message="{{error.message ?? $t('shop.qna.reply_submit_failed')}}"/>
                  </fail>
                  <body content="{{_global.qnaReplyForm.content ?? ''}}"/>
                </api-call>
              </else>
            </conditions>
          </sequence>
        </on>
        <icon data-if="{{_global.qnaSubmitting}}" name="spinner" class="text-sm animate-spin"/>
        <span>{{_global.qnaReplyEditId ? $t('shop.qna.save') : $t('shop.qna.reply_submit')}}</span>
      </button>
    </div>
  </modal>
</partial>
