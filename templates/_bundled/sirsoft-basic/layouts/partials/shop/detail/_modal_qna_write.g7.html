<!-- 상품 문의 작성·수정 창. 폼 값과 검증 오류를 전부 `_global` 에 두는 이유는 이 창을 여는 곳이 상품 상세의
     문의 탭이고(모달은 별도 컨텍스트라 부모 `_local` 을 읽지 못한다), 여는 쪽이 대상 상품·게시판 설정·수정
     대상 id 를 미리 세워 주기 때문이다. 새 글과 수정이 같은 창을 쓰고 `qnaEditId` 유무로 갈린다. -->
<partial description="상품 1:1 문의 작성 모달" editor_label="$t:user.modal_label.shop_detail.qna_write_modal">
  <modal data-type="composite" data-ref="qna_write_modal" title="{{_global.qnaEditId ? $t('shop.qna.edit_title') : $t('shop.product.write_question')}}" size="md" :closeOnBackdropClick="false">
    <!-- 상품 정보 헤더 (qnaProductImage 또는 qnaProductName이 있을 때) -->
    <div data-if="{{!!_global.qnaProductImage || !!_global.qnaProductName}}" class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg mb-4 border border-gray-100 dark:border-gray-600">
      <!-- 상품 썸네일 -->
      <div data-if="{{!!_global.qnaProductImage}}" class="shrink-0 w-12 h-12 rounded-lg overflow-hidden bg-gray-200 dark:bg-gray-600">
        <img src="{{_global.qnaProductImage}}" alt="{{_global.qnaProductName ?? ''}}" class="w-full h-full object-cover"/>
      </div>
      <!-- 이미지 없을 때 아이콘 placeholder -->
      <div data-if="{{!_global.qnaProductImage &amp;&amp; !!_global.qnaProductName}}" class="shrink-0 w-12 h-12 rounded-lg bg-gray-200 dark:bg-gray-600 flex items-center justify-center">
        <icon name="box" class="text-gray-400 dark:text-gray-500"/>
      </div>
      <div class="flex-1 min-w-0">
        <span class="block text-sm font-medium text-gray-700 dark:text-gray-200 truncate">{{_global.qnaProductName ?? ''}}</span>
        <!-- 작성일 (수정 모드일 때만) -->
        <span data-if="{{!!_global.qnaEditId &amp;&amp; !!_global.qnaCreatedAt}}" class="block text-xs text-gray-400 dark:text-gray-500 mt-0.5">$t:shop.qna.written_at|value={{_global.qnaCreatedAt | datetime}}</span>
      </div>
    </div>
    <!-- 폼 본문 -->
    <div class="space-y-4">
      <!-- 비밀글 체크박스 (secret_mode가 disabled이면 숨김) -->
      <div data-if="{{((_global.qnaModalBoardSettings)?.secret_mode ?? 'disabled') !== 'disabled'}}" class="flex items-center gap-2">
        <input type="checkbox" id="qna_is_secret" class="w-4 h-4 text-blue-600 border-gray-300 dark:border-gray-600 rounded cursor-pointer" checked="{{_global.qnaForm.is_secret ?? true}}" disabled="{{_global.qnaSubmitting || ((_global.qnaModalBoardSettings)?.secret_mode ?? 'disabled') === 'always'}}">
          <on event="onChange">
            <!-- 비밀글 여부. 게시판이 «항상 비밀» 이면 칸이 잠기고, «사용 안 함» 이면 줄 자체가 안 보인다 -->
            <set-state target="global">
              <field name="qnaForm">
                <field name="is_secret" value="{{$event.target.checked}}"/>
              </field>
            </set-state>
          </on>
        </input>
        <label for="qna_is_secret" class="text-sm text-gray-700 dark:text-gray-300 flex items-center gap-1 cursor-pointer select-none">
          <icon name="lock" class="text-xs text-gray-500 dark:text-gray-400"/>
          <span>$t:shop.qna.is_secret</span>
        </label>
      </div>
      <!-- 문의 유형 (categories가 있을 때만 노출) -->
      <div data-if="{{(_global.qnaModalBoardSettings)?.categories &amp;&amp; (_global.qnaModalBoardSettings).categories.length > 0}}" class="space-y-1">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">$t:shop.qna.category</label>
        <select class="{{(_global.qnaErrors?.category) ? 'w-full px-3 py-2 border border-red-500 dark:border-red-400 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-500' : 'w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500'}}" value="{{_global.qnaForm.category ?? ''}}" options="{{[{ value: '', label: $t('shop.qna.category_placeholder') }].concat(((_global.qnaModalBoardSettings)?.categories ?? []).map(function(c) { return typeof c === 'object' ? { value: c.value, label: c.label ?? c.value } : { value: c, label: c }; }))}}" disabled="{{_global.qnaSubmitting}}">
          <on type="change">
            <!-- 문의 유형 — 고를 값은 게시판 설정에서 오므로 설정이 비면 이 줄이 통째로 사라진다 -->
            <set-state target="global">
              <field name="qnaForm">
                <field name="category" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </select>
        <span data-if="{{_global.qnaErrors?.category}}" class="text-red-500 dark:text-red-400 text-xs mt-1 block">{{(_global.qnaErrors?.category ?? [])[0] ?? ''}}</span>
      </div>
      <!-- 제목 입력 -->
      <div class="space-y-1">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">$t:shop.qna.title</label>
        <input type="text" class="{{(_global.qnaErrors?.title) ? 'w-full px-3 py-2 border border-red-500 dark:border-red-400 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500' : 'w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500'}}" placeholder="$t:shop.qna.title_placeholder" value="{{_global.qnaForm.title ?? ''}}" disabled="{{_global.qnaSubmitting}}">
          <on event="onChange">
            <!-- 제목. 길이 제한은 화면에서 막지 않고 서버 검증 결과를 아래 오류 줄에 보여 준다 -->
            <set-state target="global">
              <field name="qnaForm">
                <field name="title" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </input>
        <span data-if="{{_global.qnaErrors?.title}}" class="text-red-500 dark:text-red-400 text-xs mt-1 block">{{(_global.qnaErrors?.title ?? [])[0] ?? ''}}</span>
      </div>
      <!-- 문의 내용 -->
      <div class="space-y-1">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">$t:shop.qna.content</label>
        <textarea class="{{(_global.qnaErrors?.content) ? 'w-full px-3 py-2 border border-red-500 dark:border-red-400 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 resize-none' : 'w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none'}}" placeholder="$t:shop.qna.content_placeholder" :rows="5" value="{{_global.qnaForm.content ?? ''}}" disabled="{{_global.qnaSubmitting}}">
          <on event="onChange">
            <!-- 본문. 제목과 같은 이유로 길이 판정은 서버에 맡긴다 -->
            <set-state target="global">
              <field name="qnaForm">
                <field name="content" value="{{$event.target.value}}"/>
              </field>
            </set-state>
          </on>
        </textarea>
        <span data-if="{{_global.qnaErrors?.content}}" class="text-red-500 dark:text-red-400 text-xs mt-1 block">{{(_global.qnaErrors?.content ?? [])[0] ?? ''}}</span>
      </div>
    </div>
    <!-- 모달 푸터 - 취소 / 등록 -->
    <div class="flex gap-3 pt-4 border-t border-gray-200 dark:border-gray-700 mt-4">
      <button type="button" class="flex-1 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.qnaSubmitting}}">
        <on type="click">
          <!-- 취소 — 진행 표시와 오류를 걷어 낸 뒤 닫는다. 폼 값은 `_global` 에 남지만 여는 쪽이 열 때마다 다시 세운다 -->
          <sequence>
            <set-state target="global" :qnaSubmitting="false" :qnaErrors="null"/>
            <close-modal/>
          </sequence>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="flex-1 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.qnaSubmitting}}">
        <on type="click">
          <!-- 등록/수정 확정 — `qnaEditId` 유무로 보낼 곳과 메서드가 갈린다. 먼저 버튼을 잠가 두 번 눌러
               같은 문의가 둘 생기는 것을 막는다 -->
          <sequence>
            <set-state target="global" :qnaSubmitting="true"/>
            <conditions>
              <!-- 수정 모드: PUT /user/inquiries/{id} -->
              <when if="{{!!_global.qnaEditId}}">
                <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/user/inquiries/{{_global.qnaEditId}}" method="PUT">
                  <success>
                    <set-state target="global" :qnaSubmitting="false" :qnaErrors="null" :qnaEditId="null" :qnaProductImage="null" :qnaProductName="null" :qnaModalBoardSettings="null"/>
                    <close-modal/>
                    <refetch-data-source dataSourceId="qna"/>
                    <refetch-data-source dataSourceId="myInquiries"/>
                    <toast type="success" message="$t:shop.qna.updated"/>
                  </success>
                  <fail>
                    <set-state target="global" :qnaSubmitting="false" qnaErrors="{{error.errors ?? null}}"/>
                    <toast type="error" message="{{error.message ?? $t('shop.qna.update_failed')}}"/>
                  </fail>
                  <body title="{{_global.qnaForm.title ?? ''}}" category="{{_global.qnaForm.category ?? ''}}" content="{{_global.qnaForm.content ?? ''}}" is_secret="{{_global.qnaForm.is_secret ?? true}}"/>
                </api-call>
              </when>
              <!-- 등록 모드: POST /products/{id}/inquiries -->
              <else>
                <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/products/{{_global.qnaProductId}}/inquiries" method="POST">
                  <success>
                    <set-state target="global" :qnaSubmitting="false" :qnaErrors="null"/>
                    <close-modal/>
                    <refetch-data-source dataSourceId="qna"/>
                    <toast type="success" message="$t:shop.qna.submitted"/>
                  </success>
                  <fail>
                    <set-state target="global" :qnaSubmitting="false" qnaErrors="{{error.errors ?? null}}"/>
                    <toast type="error" message="{{error.message ?? $t('shop.qna.submit_failed')}}"/>
                  </fail>
                  <body title="{{_global.qnaForm.title ?? ''}}" category="{{_global.qnaForm.category ?? ''}}" content="{{_global.qnaForm.content ?? ''}}" is_secret="{{_global.qnaForm.is_secret ?? true}}"/>
                </api-call>
              </else>
            </conditions>
          </sequence>
        </on>
        <icon data-if="{{_global.qnaSubmitting}}" name="spinner" class="text-sm animate-spin"/>
        <span>{{_global.qnaEditId ? $t('shop.qna.save') : $t('shop.qna.submit')}}</span>
      </button>
    </div>
  </modal>
</partial>
