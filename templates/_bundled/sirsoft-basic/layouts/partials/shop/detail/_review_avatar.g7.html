<partial description="리뷰 작성자 아바타 (sm 사이즈, iteration 내부 review 변수 사용)">
  <div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0">
    <img data-if="{{review?.author?.avatar}}" src="{{review.author.avatar}}" alt="{{review.author.name}}" class="w-full h-full object-cover"/>
    <div data-if="{{!review?.author?.avatar}}" class="w-full h-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-semibold text-sm">{{(review?.author?.name ?? '?').charAt(0).toUpperCase()}}</div>
  </div>
</partial>
