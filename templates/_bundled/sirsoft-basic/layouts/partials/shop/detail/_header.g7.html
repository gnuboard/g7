<!-- 상품 상세 맨 윗줄 — 상품명·카테고리 경로와 찜하기. 찜하기는 회원만 되므로 비회원이 누르면
     로그인 안내 창으로 갈린다. -->
<partial description="상품명, 카테고리, 찜하기">
  <div>
    <div class="flex items-start justify-between">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">{{product.data?.category_name}}</span>
        <div class="flex items-center gap-2 mt-1">
          <h1 class="text-xl font-bold text-gray-900 dark:text-white">{{product.data?.name_localized}}</h1>
          <!-- 라벨 뱃지 -->
          <div data-if="{{product.data?.labels?.length > 0}}" class="flex items-center gap-1 flex-wrap">
            <span data-each="labelItem in {{product.data?.labels ?? []}}" class="inline-block px-1.5 py-0.5 rounded text-[10px] font-medium text-white" style="background-color: {{labelItem.color ?? '#6B7280'}}">{{labelItem.name}}</span>
          </div>
        </div>
      </div>
      <!-- 우측 액션 그룹 (관리자 수정 링크 + 찜하기) -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- 관리자 상품 수정 링크 (권한 게이트, 새 탭) -->
        <include src="./_admin_edit_link.g7.html"/>
        <button type="button" aria-label="{{(_local.isWishlisted ?? product.data?.is_wishlisted) ? '$t:shop.product.remove_from_wishlist' : '$t:shop.product.add_to_wishlist'}}" aria-pressed="{{!!(_local.isWishlisted ?? product.data?.is_wishlisted)}}" class="p-2 text-gray-400 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.wishlistLoading}}">
          <on type="click">
            <!-- 찜하기 — 회원이면 켜고 끄고, 비회원이면 로그인 안내 창으로 갈린다. 낙관적 갱신을 하지 않고
                 서버 응답을 기다렸다 반영하므로 그동안 버튼이 잠긴다 -->
            <conditions>
              <!-- 비회원: 로그인 필요 안내 -->
              <when if="{{!_global.currentUser?.uuid}}">
                <toast type="warning" message="$t:shop.wishlist_login_required"/>
              </when>
              <!-- 회원: 찜하기 토글 -->
              <else>
                <sequence>
                  <!-- 낙관적 UI: 즉시 아이콘 토글 + 로딩 상태 -->
                  <set-state target="local" :wishlistLoading="true" isWishlisted="{{!(_local.isWishlisted ?? product.data?.is_wishlisted)}}"/>
                  <api-call auth_mode="required" target="/api/modules/sirsoft-ecommerce/wishlist/toggle" method="POST">
                    <success>
                      <set-state target="local" :wishlistLoading="false" isWishlisted="{{response.data.added}}"/>
                      <refetch-data-source dataSourceId="product"/>
                      <toast type="success" message="{{response.data.added ? '$t:shop.wishlist_added' : '$t:shop.wishlist_removed'}}"/>
                    </success>
                    <fail>
                      <!-- 실패 시 원래 상태로 복원 -->
                      <set-state target="local" :wishlistLoading="false" isWishlisted="{{product.data?.is_wishlisted}}"/>
                    </fail>
                    <body product_id="{{product.data?.id}}"/>
                  </api-call>
                </sequence>
              </else>
            </conditions>
          </on>
          <icon name="heart" iconStyle="{{(_local.isWishlisted ?? product.data?.is_wishlisted) ? 'solid' : 'regular'}}" size="xl" class="{{(_local.isWishlisted ?? product.data?.is_wishlisted) ? 'text-red-500' : ''}} transition-colors"/>
        </button>
      </div>
    </div>
  </div>
</partial>
