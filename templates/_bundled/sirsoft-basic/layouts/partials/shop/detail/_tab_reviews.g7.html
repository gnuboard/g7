<!-- 리뷰 탭 — 별점 분포와 리뷰 목록. 정렬·사진만·별점 조건은 `_local` 에 살고 `reviews` 소스가 그 값을
     읽어 다시 받는다(조건이 URL 에 남지 않는 이유는 탭 안에서만 쓰는 값이기 때문).
     e2e:allow 회원 없이 등록한 후기의 작성자 이름·HTML 본문 표시 — 이관 도구가 넣는 데이터라 화면 조작 흐름이 없다. 레이아웃 소비 계약은 이커머스 importedReviewDisplay.test.ts, 응답은 PHPUnit ImportedProductReviewTest 가 고정 -->
<partial description="상품 상세 리뷰 탭">
  <div data-if="{{(_local.activeTab ?? 'info') === 'reviews'}}" class="py-6">
    <!-- 리뷰 요약 (이미지1: 좌측 평균 별점 + 우측 분포 바) -->
    <div class="flex items-center gap-6 mb-4 px-16 py-6 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
      <!-- 평균 별점 (좌측) -->
      <div class="text-center shrink-0 min-w-24">
        <span class="text-4xl font-bold text-gray-900 dark:text-white">{{reviews.data?.rating_stats?.avg ?? 0}}</span>
        <div class="flex items-center justify-center gap-0.5 my-1">
          <span data-each="star in {{_local.starList}}">
            <icon name="star" size="sm" class="{{star <= (reviews.data?.rating_stats?.avg ?? 0) ? 'text-yellow-700 dark:text-yellow-600' : 'text-muted'}}"/>
          </span>
        </div>
        <span class="text-xs text-muted">$t:shop.product.rating_out_of_5|count={{reviews.data?.total_count ?? 0}}|total={{reviews.data?.total_count ?? 0}}</span>
      </div>
      <!-- 구분선 -->
      <div class="w-px h-16 bg-gray-200 dark:bg-gray-600 shrink-0"/>
      <!-- 별점 분포 바 (우측) -->
      <div class="flex-1 space-y-4">
        <div data-each="starNum in {{_local.starNums}}" class="flex items-center gap-2">
          <span class="text-xs text-muted w-3 shrink-0 text-right">{{starNum}}</span>
          <icon name="star" size="sm" class="text-yellow-700 dark:text-yellow-400 shrink-0"/>
          <div class="flex-1 bg-gray-200 dark:bg-gray-600 rounded-full h-2">
            <div class="bg-yellow-400 dark:bg-yellow-400 h-2 rounded-full">
              <prop name="style">
                <field name="width" value="{{(reviews.data?.rating_stats?.[starNum + '']?.percent ?? 0) + '%'}}"/>
              </prop>
            </div>
          </div>
          <span class="text-xs text-muted w-5 text-right shrink-0">{{reviews.data?.rating_stats?.[starNum + '']?.count ?? 0}}</span>
        </div>
      </div>
    </div>
    <!-- 옵션 필터 행 (옵션 키별 동적 Select들 + 별점 Select + 초기화) -->
    <div class="flex flex-wrap items-center gap-2 mb-4 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
      <!-- 옵션 키별 Select (동적 생성, 건수 포함) -->
      <select data-each="optionFilter in {{reviews.data?.option_filters ?? []}}" aria-label="{{optionFilter.key}}" value="{{_local.reviewOptionFilters?.[optionFilter.key] ?? ''}}" options="{{[{ value: '', label: optionFilter.key }].concat((optionFilter.values ?? []).map(v => ({ value: v.value, label: v.value + ' (' + v.count + ')' })))}}" class="text-sm border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-1.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300">
        <on type="change">
          <sequence>
            <set-state target="local" reviewOptionFilters="{{Object.assign(Object.create(null), _local.reviewOptionFilters, { [optionFilter.key]: $event.target.value })}}" :reviewsPage="1" :reviewsLoading="true"/>
            <refetch-data-source dataSourceId="reviews" :sync="true"/>
            <set-state target="local" :reviewsLoading="false"/>
          </sequence>
        </on>
      </select>
      <!-- 별점 필터 Select (정적, min-w는 가장 긴 항목 기준으로 고정) -->
      <select aria-label="$t:shop.product.rating" value="{{_local.reviewRating ?? ''}}" class="w-40 text-sm border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-1.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300">
        <options>
          <option value="">$t:shop.product.filter_all_rating</option>
          <option value="5">$t:shop.product.filter_rating_5</option>
          <option value="4">$t:shop.product.filter_rating_4</option>
          <option value="3">$t:shop.product.filter_rating_3</option>
          <option value="2">$t:shop.product.filter_rating_2</option>
          <option value="1">$t:shop.product.filter_rating_1</option>
        </options>
        <on type="change">
          <sequence>
            <set-state target="local" reviewRating="{{$event.target.value}}" :reviewsPage="1" :reviewsLoading="true"/>
            <refetch-data-source dataSourceId="reviews" :sync="true"/>
            <set-state target="local" :reviewsLoading="false"/>
          </sequence>
        </on>
      </select>
      <!-- 초기화 버튼 -->
      <button type="button" class="ml-auto text-sm px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
        <on type="click">
          <!-- 깊은 병합(기본)은 빈 객체 {} 로 이전 값을 지우지 못한다 — null 로 먼저 지우고 {} 로 다시 쓴다(7.1.1). 종전에는 초기화를 눌러도 옵션 필터가 「블랙 (0)」 으로 남고 요청도 걸러진 채였다. -->
          <sequence>
            <set-state target="local" :reviewOptionFilters="null"/>
            <set-state target="local" :reviewOptionFilters="{}" reviewRating="" :reviewPhotoOnly="false" :reviewsPage="1" :reviewsLoading="true"/>
            <refetch-data-source dataSourceId="reviews" :sync="true"/>
            <set-state target="local" :reviewsLoading="false"/>
          </sequence>
        </on>
        $t:shop.product.filter_reset
      </button>
    </div>
    <!-- 정렬 + 포토리뷰 필터 행 -->
    <div class="flex items-center justify-between mb-4 gap-3">
      <!-- 포토리뷰 필터 토글 -->
      <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border transition-colors {{(_local.reviewPhotoOnly ?? false) ? 'bg-gray-900 dark:bg-white text-white dark:text-gray-900 border-gray-900 dark:border-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border-gray-300 dark:border-gray-600'}}">
        <on type="click">
          <sequence>
            <set-state target="local" reviewPhotoOnly="{{!(_local.reviewPhotoOnly ?? false)}}" :reviewsPage="1" :reviewsLoading="true"/>
            <refetch-data-source dataSourceId="reviews" :sync="true"/>
            <set-state target="local" :reviewsLoading="false"/>
          </sequence>
        </on>
        <icon name="image" size="sm"/>
        <span>$t:shop.product.photo_reviews_only</span>
      </button>
      <!-- 정렬 선택 -->
      <select aria-label="$t:common.sort_order" value="{{_local.reviewSortBy ?? 'created_at_desc'}}" class="text-sm border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-1.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300">
        <options>
          <option value="created_at_desc">$t:shop.product.sort_latest</option>
          <option value="rating_desc">$t:shop.product.sort_rating_high</option>
          <option value="rating_asc">$t:shop.product.sort_rating_low</option>
        </options>
        <on type="change">
          <sequence>
            <set-state target="local" reviewSortBy="{{$event.target.value}}" :reviewsPage="1" :reviewsLoading="true"/>
            <refetch-data-source dataSourceId="reviews" :sync="true"/>
            <set-state target="local" :reviewsLoading="false"/>
          </sequence>
        </on>
      </select>
    </div>
    <!-- 목록·빈 안내·쪽 번호 묶음 — 조건을 바꾼 뒤 새 목록이 올 때까지 흐리게 둔다. 이 탭은 주소 이동 없이 소스만
         다시 받는데, 다시 받기는 엔진의 「받는 중」 표시를 세우지 않으므로 조건 조작이 켜고 끄는 `reviewsLoading` 을
         읽는다(조건 단추·칸은 묶음 밖이라 누른 상태가 또렷하다). 종전에는 단추만 바로 켜지고 앞 목록이 그대로 보이다 바뀌었다 -->
    <div data-ref="review_tab_list" data-blur-until-loaded="{{_local.reviewsLoading ?? false}}">
      <!-- 리뷰 목록 (이미지3: 카드 레이아웃 수정) -->
      <div data-each="review in {{reviews.data?.reviews?.data ?? []}}">
        <include src="partials/shop/detail/_review_card.g7.html"/>
      </div>
      <!-- 리뷰 없음 -->
      <div data-if="{{reviews !== undefined &amp;&amp; (!reviews.data?.reviews?.data || reviews.data.reviews.data.length === 0)}}" class="text-center py-12 text-gray-800 dark:text-gray-300">
        <icon name="comment-dots" size="3x" class="mx-auto mb-3 opacity-50"/>
        <p>$t:shop.product.no_reviews</p>
      </div>
      <!-- 리뷰 페이지네이션 -->
      <pagination data-type="composite" currentPage="{{reviews.data?.reviews?.meta?.current_page ?? 1}}" totalPages="{{reviews.data?.reviews?.meta?.last_page ?? null}}" hasMorePages="{{reviews.data?.reviews?.meta?.has_more_pages ?? false}}" class="mt-6 flex justify-center">
        <on event="onPageChange">
          <sequence>
            <set-state target="local" reviewsPage="{{$args[0]}}" :reviewsLoading="true"/>
            <refetch-data-source dataSourceId="reviews" :sync="true"/>
            <set-state target="local" :reviewsLoading="false"/>
          </sequence>
        </on>
      </pagination>
    </div>
  </div>
</partial>
