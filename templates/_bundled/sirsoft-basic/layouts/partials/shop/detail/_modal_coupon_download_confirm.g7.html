<!-- 쿠폰을 받기 직전의 확인 창 — 한 번 받으면 되돌릴 수 없고 사용 기한이 그 시점부터 흐르기 때문에
     묻는 자리다. -->
<partial description="쿠폰 다운로드 확인 모달 - 상품 상세에서 개별 쿠폰 다운로드 확인" editor_label="$t:user.modal_label.shop_detail.coupon_download_confirm_modal">
  <modal data-type="composite" data-ref="coupon_download_confirm_modal" title="$t:shop.coupon_download.confirm_title" size="sm">
    <div class="py-2">
      <!-- 쿠폰 정보 카드 -->
      <div class="bg-blue-50 dark:bg-blue-900/20 rounded-lg p-4 mb-4">
        <!-- 할인 혜택 -->
        <div class="text-center mb-2">
          <span class="text-2xl font-bold text-blue-600 dark:text-blue-400">{{$parent._local.selectedCouponForDownload?.benefit_formatted ?? ''}}</span>
        </div>
        <p class="text-sm text-center text-gray-700 dark:text-gray-300 font-medium">{{$parent._local.selectedCouponForDownload?.localized_name ?? ''}}</p>
      </div>
      <p class="text-sm text-gray-600 dark:text-gray-400 text-center mb-4">$t:shop.coupon_download.confirm_message</p>
      <!-- 버튼 그룹 -->
      <div class="flex justify-center gap-3">
        <button type="button" class="px-4 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          <on type="click">
            <close-modal/>
          </on>
          $t:common.cancel
        </button>
        <button data-if="{{!_local.isDownloading}}" type="button" class="px-4 py-2 text-sm bg-blue-600 dark:bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors">
          <on type="click">
            <!-- 받기 확정. 버튼을 감추는 대신 «받는 중» 버튼으로 갈아 끼우는 방식이라 진행 표시를 먼저 켠다 -->
            <sequence>
              <set-state target="local" :isDownloading="true"/>
              <api-call target="/api/modules/sirsoft-ecommerce/user/coupons/{{$parent._local.selectedCouponForDownload?.coupon_id}}/download" auth_mode="required" method="POST">
                <success>
                  <set-state target="local" :isDownloading="false"/>
                  <!-- 데이터소스 갱신 - 다운로드 상태 반영 -->
                  <refetch-data-source dataSourceId="productDownloadableCoupons"/>
                  <toast type="success" message="$t:shop.coupon_download.download_success"/>
                  <close-modal/>
                </success>
                <fail>
                  <set-state target="local" :isDownloading="false"/>
                  <toast type="error" message="{{error.message ?? '$t:shop.coupon_download.download_failed'}}"/>
                </fail>
              </api-call>
            </sequence>
          </on>
          $t:shop.coupon_download.download_btn
        </button>
        <!-- 다운로드 중 버튼 -->
        <button data-if="{{_local.isDownloading}}" type="button" :disabled="true" class="px-4 py-2 text-sm bg-blue-400 dark:bg-blue-400 text-white rounded-lg font-medium cursor-not-allowed">$t:shop.coupon_download.downloading</button>
      </div>
    </div>
  </modal>
</partial>
