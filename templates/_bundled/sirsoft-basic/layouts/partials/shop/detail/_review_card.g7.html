<!-- 후기 카드 한 장 — 상품 상세 후기 탭과 리뷰 모아보기 화면이 같이 쓴다. 반복 변수 `review` 와
     별 다섯 개 목록(`_local.starList`)은 include 하는 쪽이 준다. 사진 단추는 전역의 큰 사진 창
     (review_image_modal)을 여므로, include 하는 화면이 그 창을 선언해야 한다. -->
<partial description="후기 카드 (작성자·별점·옵션·본문·사진·판매자 답변)">
  <div class="p-4 mb-4 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700">
    <!-- 카드 헤더: 좌측(Avatar+이름+날짜) / 우측(별점) -->
    <div class="flex items-start justify-between mb-3">
      <!-- 작성자 정보 -->
      <div class="flex items-center gap-2">
        <!-- 작성자 표시 이름 — 회원 후기는 회원 이름, 회원 없이 등록된 후기(다른 쇼핑몰에서 이관)는 저장된 이름 그대로.
             author_name 이 없는 옛 응답(이커머스 1.4.0 미만)은 회원 이름으로 -->
        <avatar data-type="composite" name="{{review.author_name ?? review.user?.name ?? '?'}}" avatar="{{review.user?.avatar ?? null}}" size="sm"/>
        <div class="flex flex-col">
          <span class="font-medium text-sm text-gray-900 dark:text-white">{{review.author_name ?? review.user?.name}}</span>
          <span class="text-xs text-gray-500 dark:text-gray-400">{{review.created_at}}</span>
        </div>
      </div>
      <!-- 별점 (우측) -->
      <div class="flex items-center gap-0.5 shrink-0">
        <span data-each="star in {{_local.starList}}">
          <icon name="star" size="sm" class="{{star <= review.rating ? 'text-yellow-700 dark:text-yellow-600' : 'text-gray-500 dark:text-gray-500'}}"/>
        </span>
      </div>
    </div>
    <!-- 옵션 스냅샷 배지 (option_snapshot.option_values 배열에서 직접 표시) -->
    <div data-if="{{review.option_snapshot?.option_values?.length > 0}}" class="flex flex-wrap gap-1 mb-2">
      <span data-each="opt in {{review.option_snapshot?.option_values ?? []}}">
        <span data-if="{{!(opt.key?.ko === '기본' &amp;&amp; opt.value?.ko === '기본')}}" class="inline-block text-xs px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded">{{$localized(opt.key)}}: {{$localized(opt.value)}}</span>
      </span>
    </div>
    <p data-if="{{review.content_mode !== 'html'}}" class="text-gray-700 dark:text-gray-300 mb-3 text-sm">{{review.content}}</p>
    <!-- HTML 본문(다른 쇼핑몰에서 이관한 후기) — 서버가 저장 때 정화했고 컴포넌트가 한 번 더 정화한다 -->
    <html-content data-if="{{review.content_mode === 'html'}}" data-type="composite" content="{{review.content ?? ''}}" :isHtml="true" class="text-gray-700 dark:text-gray-300 mb-3 text-sm prose prose-sm dark:prose-invert max-w-none"/>
    <!-- 리뷰 이미지 (최대 4개, 초과 시 +N 오버레이) — 사진마다 단추라 Tab 으로 닿고 Enter·Space 로 큰 사진 창을 그 사진부터 연다(7.1.1 — 종전 클릭만 받는 img). 사진은 장식(alt 빈 값)이고 이름은 단추의 aria-label(몇 번째 사진인지)이 맡는다 -->
    <div data-if="{{review.image_count > 0}}" class="flex gap-2 mt-3">
      <!-- 이미지 1 -->
      <button type="button" data-if="{{(review.images ?? []).length > 0}}" aria-label="$t:shop.product.review_image_open|n=1" class="w-20 h-20 shrink-0 rounded-lg overflow-hidden cursor-pointer hover:opacity-80">
        <on type="click">
          <set-state target="global" :reviewImageIndex="0">
            <field name="reviewForModal">
              <field name="userName" value="{{review.author_name ?? review.user?.name ?? ''}}"/>
              <field name="userAvatar" value="{{review.user?.avatar ?? null}}"/>
              <field name="rating" value="{{review.rating}}"/>
              <field name="createdAt" value="{{review.created_at}}"/>
              <field name="optionValues" value="{{review.option_snapshot?.option_values ?? []}}"/>
              <field name="content" value="{{review.content_plain ?? review.content ?? ''}}"/>
              <field name="images" value="{{review.images ?? []}}"/>
            </field>
          </set-state>
          <open-modal target="review_image_modal"/>
        </on>
        <img src="{{review.images[0].download_url}}" alt="" class="w-full h-full object-cover"/>
      </button>
      <!-- 이미지 2 -->
      <button type="button" data-if="{{(review.images ?? []).length > 1}}" aria-label="$t:shop.product.review_image_open|n=2" class="w-20 h-20 shrink-0 rounded-lg overflow-hidden cursor-pointer hover:opacity-80">
        <on type="click">
          <set-state target="global" :reviewImageIndex="1">
            <field name="reviewForModal">
              <field name="userName" value="{{review.author_name ?? review.user?.name ?? ''}}"/>
              <field name="userAvatar" value="{{review.user?.avatar ?? null}}"/>
              <field name="rating" value="{{review.rating}}"/>
              <field name="createdAt" value="{{review.created_at}}"/>
              <field name="optionValues" value="{{review.option_snapshot?.option_values ?? []}}"/>
              <field name="content" value="{{review.content_plain ?? review.content ?? ''}}"/>
              <field name="images" value="{{review.images ?? []}}"/>
            </field>
          </set-state>
          <open-modal target="review_image_modal"/>
        </on>
        <img src="{{review.images[1].download_url}}" alt="" class="w-full h-full object-cover"/>
      </button>
      <!-- 이미지 3 -->
      <button type="button" data-if="{{(review.images ?? []).length > 2}}" aria-label="$t:shop.product.review_image_open|n=3" class="w-20 h-20 shrink-0 rounded-lg overflow-hidden cursor-pointer hover:opacity-80">
        <on type="click">
          <set-state target="global" :reviewImageIndex="2">
            <field name="reviewForModal">
              <field name="userName" value="{{review.author_name ?? review.user?.name ?? ''}}"/>
              <field name="userAvatar" value="{{review.user?.avatar ?? null}}"/>
              <field name="rating" value="{{review.rating}}"/>
              <field name="createdAt" value="{{review.created_at}}"/>
              <field name="optionValues" value="{{review.option_snapshot?.option_values ?? []}}"/>
              <field name="content" value="{{review.content_plain ?? review.content ?? ''}}"/>
              <field name="images" value="{{review.images ?? []}}"/>
            </field>
          </set-state>
          <open-modal target="review_image_modal"/>
        </on>
        <img src="{{review.images[2].download_url}}" alt="" class="w-full h-full object-cover"/>
      </button>
      <!-- 이미지 4 (4장 정확히일 때 일반 이미지) -->
      <button type="button" data-if="{{(review.images ?? []).length == 4}}" aria-label="$t:shop.product.review_image_open|n=4" class="w-20 h-20 shrink-0 rounded-lg overflow-hidden cursor-pointer hover:opacity-80">
        <on type="click">
          <set-state target="global" :reviewImageIndex="3">
            <field name="reviewForModal">
              <field name="userName" value="{{review.author_name ?? review.user?.name ?? ''}}"/>
              <field name="userAvatar" value="{{review.user?.avatar ?? null}}"/>
              <field name="rating" value="{{review.rating}}"/>
              <field name="createdAt" value="{{review.created_at}}"/>
              <field name="optionValues" value="{{review.option_snapshot?.option_values ?? []}}"/>
              <field name="content" value="{{review.content_plain ?? review.content ?? ''}}"/>
              <field name="images" value="{{review.images ?? []}}"/>
            </field>
          </set-state>
          <open-modal target="review_image_modal"/>
        </on>
        <img src="{{review.images[3].download_url}}" alt="" class="w-full h-full object-cover"/>
      </button>
      <!-- +N 오버레이 (5장 이상일 때 4번째 자리) -->
      <button type="button" data-if="{{(review.images ?? []).length >= 5}}" aria-label="$t:shop.product.review_image_open_more|n=4|count={{(review.images ?? []).length - 3}}" class="relative w-20 h-20 shrink-0 cursor-pointer rounded-lg overflow-hidden">
        <on type="click">
          <set-state target="global" :reviewImageIndex="3">
            <field name="reviewForModal">
              <field name="userName" value="{{review.author_name ?? review.user?.name ?? ''}}"/>
              <field name="userAvatar" value="{{review.user?.avatar ?? null}}"/>
              <field name="rating" value="{{review.rating}}"/>
              <field name="createdAt" value="{{review.created_at}}"/>
              <field name="optionValues" value="{{review.option_snapshot?.option_values ?? []}}"/>
              <field name="content" value="{{review.content_plain ?? review.content ?? ''}}"/>
              <field name="images" value="{{review.images ?? []}}"/>
            </field>
          </set-state>
          <open-modal target="review_image_modal"/>
        </on>
        <img src="{{review.images[3].download_url}}" alt="" class="w-full h-full object-cover"/>
        <span class="absolute inset-0 bg-black/60 flex items-center justify-center rounded-lg" aria-hidden="true">
          <span class="text-white font-semibold text-sm">+{{(review.images ?? []).length - 3}}</span>
        </span>
      </button>
    </div>
    <!-- 판매자 답변 (이미지3: 날짜 추가) -->
    <div data-if="{{review.has_reply}}" class="mt-3 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg border-l-4 border-gray-400 dark:border-gray-500">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-semibold text-gray-600 dark:text-gray-400">$t:shop.product.seller_reply</span>
        <span class="text-xs text-gray-500 dark:text-gray-400">{{review.replied_at}}</span>
      </div>
      <p data-if="{{review.reply_content_mode !== 'html'}}" class="text-sm text-gray-700 dark:text-gray-300">{{review.reply_content}}</p>
      <html-content data-if="{{review.reply_content_mode === 'html'}}" data-type="composite" content="{{review.reply_content ?? ''}}" :isHtml="true" class="text-sm text-gray-700 dark:text-gray-300 prose prose-sm dark:prose-invert max-w-none"/>
    </div>
  </div>
</partial>
