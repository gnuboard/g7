<partial description="통화 선택 드롭다운">
  <div class="relative">
    <button class="flex items-center gap-1.5 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
      <on type="click">
        <set-state target="local" showCurrencyDropdown="{{!_local.showCurrencyDropdown}}"/>
      </on>
      <icon name="globe" class="text-base"/>
      <span>{{_global.preferredCurrency ?? 'KRW'}}</span>
      <icon name="chevron-down" class="text-xs"/>
    </button>
    <!-- 드롭다운 메뉴 -->
    <div data-if="{{_local.showCurrencyDropdown}}" class="absolute right-0 top-full mt-1 w-44 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-50 py-1 overflow-hidden">
      <div data-each="currency in {{_global.availableCurrencies ?? []}}">
        <button class="w-full px-4 py-2.5 text-left text-sm flex items-center gap-3 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors {{_global.preferredCurrency === currency.code ? 'bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'}}">
          <on type="click">
            <set-state target="global" preferredCurrency="{{currency.code}}"/>
            <save-to-local-storage key="g7_preferred_currency" value="{{currency.code}}"/>
            <set-state target="local" :showCurrencyDropdown="false"/>
          </on>
          <span class="text-base">{{currency.flag}}</span>
          <div class="flex-1">
            <span class="font-medium">{{currency.code}}</span>
            <span class="text-gray-500 dark:text-gray-400 ml-1">({{currency.symbol}})</span>
          </div>
          <icon data-if="{{_global.preferredCurrency === currency.code}}" name="check" class="text-base"/>
        </button>
      </div>
    </div>
    <!-- 배경 클릭 시 닫기 -->
    <div data-if="{{_local.showCurrencyDropdown}}" class="fixed inset-0 z-40">
      <on type="click">
        <set-state target="local" :showCurrencyDropdown="false"/>
      </on>
    </div>
  </div>
</partial>
