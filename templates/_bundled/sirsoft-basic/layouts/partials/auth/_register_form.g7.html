<partial description="회원가입 폼">
  <form data-key="registerForm" id="registerForm" class="space-y-4 relative">
    <on type="submit">
      <set-state target="local" :isRegistering="true" :registerError="null" :errors="null"/>
      <api-call target="/api/auth/register" method="POST" body="{{Object.assign({}, _local.registerForm, query.verification_token ? { verification_token: query.verification_token } : {})}}">
        <success>
          <set-state target="local" :isRegistering="false"/>
          <toast type="success" message="$t:auth.register_success"/>
          <navigate path="/login"/>
        </success>
        <fail>
          <set-state target="local" :isRegistering="false" errors="{{error.response?.errors ?? error.errors}}" registerError="{{error.response?.message ?? error.message}}"/>
        </fail>
      </api-call>
    </on>
    <!-- 로딩 오버레이 (블러 처리) -->
    <div data-if="{{_local?.isRegistering}}" class="absolute inset-0 bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm z-10 flex items-center justify-center rounded-lg">
      <div class="flex flex-col items-center gap-2">
        <!-- 로딩 스피너 -->
        <div class="w-8 h-8 border-4 border-gray-300 dark:border-gray-600 border-t-blue-500 rounded-full animate-spin"/>
        <span class="text-sm text-gray-600 dark:text-gray-400">$t:auth.register.processing</span>
      </div>
    </div>
    <!-- API 에러 메시지 표시 — 전체 응답 message + form field 외 errors (identity/verification_token 등 plugin 기여 에러) -->
    <div data-if="{{_local?.registerError}}" class="p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
      <p class="text-sm font-medium text-red-600 dark:text-red-400">{{_local.registerError}}</p>
      <!-- 비-form-field 에러 메시지 (identity / verification_token 등 plugin 기여 에러)를 추가 안내 -->
      <ul data-if="{{_local.errors &amp;&amp; Object.keys(_local.errors).filter(function(k) { return ['email','password','password_confirmation','name','nickname','language','agree_terms','agree_privacy'].indexOf(k) === -1; }).length > 0}}" data-each="message in Object.entries(_local.errors ?? {}).filter(function(entry) { return ['email','password','password_confirmation','name','nickname','language','agree_terms','agree_privacy'].indexOf(entry[0]) === -1; }).flatMap(function(entry) { return Array.isArray(entry[1]) ? entry[1] : [entry[1]]; })" class="mt-2 list-disc list-inside space-y-1">
        <li class="text-sm text-red-600 dark:text-red-400">{{message}}</li>
      </ul>
    </div>
    <!-- 이메일 필드 -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        <span>$t:auth.email</span>
        <span class="text-red-500 ml-1">*</span>
      </label>
      <input type="email" name="email" placeholder="$t:auth.email_placeholder" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" :required="true" disabled="{{_local?.isRegistering}}"/>
      <span data-if="{{_local.errors?.email}}" class="text-red-500 text-xs mt-1">{{_local.errors?.email?.[0] ?? ''}}</span>
    </div>
    <!-- 비밀번호 필드 -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        <span>$t:auth.password</span>
        <span class="text-red-500 ml-1">*</span>
      </label>
      <password-input name="password" placeholder="$t:auth.register.password_placeholder|count=8" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" :required="true" disabled="{{_local?.isRegistering}}" :showToggle="true" :showValidation="true" error="{{_local.errors?.password?.[0] ?? ''}}">
        <prop name="enableRules">
          <item>minLength:8</item>
        </prop>
      </password-input>
    </div>
    <!-- 비밀번호 확인 필드 -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        <span>$t:auth.password_confirm</span>
        <span class="text-red-500 ml-1">*</span>
      </label>
      <password-input name="password_confirmation" placeholder="$t:auth.password_confirm_placeholder" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" :required="true" disabled="{{_local?.isRegistering}}" :showToggle="true" :isConfirmField="true" confirmTarget="{{_local.registerForm?.password ?? ''}}" error="{{_local.errors?.password_confirmation?.[0] ?? ''}}"/>
    </div>
    <!-- 이름 필드 (필수) -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        <span>$t:auth.name</span>
        <span class="text-red-500 ml-1">*</span>
      </label>
      <input type="text" name="name" placeholder="$t:auth.name_placeholder" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" :required="true" disabled="{{_local?.isRegistering}}"/>
      <span data-if="{{_local.errors?.name}}" class="text-red-500 text-xs mt-1">{{_local.errors?.name?.[0] ?? ''}}</span>
    </div>
    <!-- 닉네임 필드 (선택) -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:auth.nickname</label>
      <input type="text" name="nickname" placeholder="$t:auth.nickname_placeholder" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" disabled="{{_local?.isRegistering}}"/>
      <span data-if="{{_local.errors?.nickname}}" class="text-red-500 text-xs mt-1">{{_local.errors?.nickname?.[0] ?? ''}}</span>
    </div>
    <!-- 언어 설정 필드 -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:auth.language</label>
      <select name="language" value="{{_local?.registerForm?.language ?? $locale ?? 'ko'}}" options="{{($locales ?? []).map(l => ({ value: l, label: _global.appConfig?.localeNames?.[l] ?? l }))}}" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" disabled="{{_local?.isRegistering}}"/>
    </div>
    <!-- 확장 주입 앵커 — 모듈이 layout_extensions 로 가입폼 추가 필드(결제 통화 등)를 주입한다. 미설치 시 빈 슬롯(렌더 영향 없음). -->
    <div data-ref="register_extension_fields"/>
    <!-- 약관 동의 -->
    <div class="space-y-2 pt-2">
      <div>
        <div class="flex items-center gap-2">
          <checkbox name="agree_terms" value="1" :required="true" disabled="{{_local?.isRegistering}}"/>
          <label class="text-sm text-gray-700 dark:text-gray-300">
            <button type="button" class="text-blue-600 dark:text-blue-400 hover:underline cursor-pointer"><on type="click"><refetch-data-source dataSourceId="termsContent"/><open-modal target="termsModal"/></on>$t:auth.terms</button>
            <span> $t:auth.agree_required</span>
          </label>
        </div>
        <span data-if="{{_local.errors?.agree_terms}}" class="text-red-500 text-xs mt-1 ml-6">{{_local.errors?.agree_terms?.[0] ?? ''}}</span>
      </div>
      <div data-ref="register_privacy_agreement">
        <div class="flex items-center gap-2">
          <checkbox name="agree_privacy" value="1" :required="true" disabled="{{_local?.isRegistering}}"/>
          <label class="text-sm text-gray-700 dark:text-gray-300">
            <button type="button" class="text-blue-600 dark:text-blue-400 hover:underline cursor-pointer"><on type="click"><refetch-data-source dataSourceId="privacyContent"/><open-modal target="privacyModal"/></on>$t:auth.privacy</button>
            <span> $t:auth.agree_required</span>
          </label>
        </div>
        <span data-if="{{_local.errors?.agree_privacy}}" class="text-red-500 text-xs mt-1 ml-6">{{_local.errors?.agree_privacy?.[0] ?? ''}}</span>
      </div>
    </div>
    <button type="submit" class="w-full py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors mt-4 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled="{{_local?.isRegistering}}">
      <!-- 버튼 내 스피너 -->
      <div data-if="{{_local?.isRegistering}}" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/>
      <span data-if="{{!_local?.isRegistering}}">$t:auth.register.submit</span>
      <span data-if="{{_local?.isRegistering}}">$t:auth.register.processing</span>
    </button>
  </form>
</partial>
