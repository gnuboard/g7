<!-- 비밀번호 인증이 막힌 계정 안내 — 비밀번호 찾기·재설정·변경 화면이 같이 쓴다. 서버가 「이 계정은 비밀번호로 로그인할 수 없습니다(회사 계정 로그인)」로 거절하면(`auth.password_auth_disabled`) 화면이 _local.passwordAuthBlocked(문구)·passwordAuthUrl(그 수단 시작 경로)·passwordAuthLabel(수단 이름)을 채운다. 경로가 있으면 그 수단으로 가는 버튼을 함께 보인다. -->
<partial description="비밀번호 인증 거절 안내 (회사 계정 로그인 강제)">
  <div data-if="{{!!_local.passwordAuthBlocked}}" data-ref="password_auth_blocked" class="mb-6 p-4 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 space-y-3" role="alert">
    <p class="text-sm text-amber-800 dark:text-amber-200">{{_local.passwordAuthBlocked}}</p>
    <button data-if="{{!!_local.passwordAuthUrl}}" type="button" class="w-full py-2 border border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-200 rounded-lg text-sm font-medium hover:bg-amber-100 dark:hover:bg-amber-900/40 transition-colors cursor-pointer">
      <on type="click">
        <!-- 서버가 알려 준 다른 로그인 수단(회사 계정 등)으로 보낸다 -->
        <action handler="redirect" url="{{_local.passwordAuthUrl}}"/>
      </on>
      <span data-if="{{!!_local.passwordAuthLabel}}">$t:auth.external.login_with|method={{_local.passwordAuthLabel}}</span>
      <span data-if="{{!_local.passwordAuthLabel}}">$t:auth.external.login_with_company</span>
    </button>
  </div>
</partial>
