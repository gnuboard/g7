<!-- 회원 항목 보기 조각 — 서버가 준 항목 계약을 돌며 라벨과 보기용 값(display_value)을 그린다. 내 정보 보기 화면이 카드마다 부른다.
     입력 조각(_member_fields)과 같은 방식으로 항목을 받는다: 부르는 화면이 `data-each="memberFieldGroup in …"` 안에 include 하고,
     memberFieldGroup = { key(묶음 이름), fields(항목 계약 배열) }. 값이 없으면 「-」를 보인다.
     여러 줄 글(서명, 자기소개 등)은 라벨 아래에 줄바꿈을 살려 그리고, 파일 항목은 파일 이름 목록(누르면 내려받는다)을 그린다. 그 밖의 항목은 라벨과 값을 한 줄 양 끝에 둔다. -->
<partial description="회원 항목 보기">
  <div data-ref="member_fields_view_group_{{memberFieldGroup.key}}" class="space-y-3">
    <div data-each="field in {{(memberFieldGroup?.fields ?? []).filter(function(f) { return !!memberFieldGroup?.includeAgreements || (f.ui?.group ?? '') !== 'agreements'; })}}" data-ref="field_view_{{field.key}}">
      <!-- 한 줄 항목 — 라벨은 왼쪽, 값은 오른쪽. 긴 값(주소, 공백 없는 홈페이지 주소 등)은 줄 폭의 60% 안에서 줄을 바꾼다. -->
      <div data-if="{{field.type !== 'textarea' &amp;&amp; field.renderer !== 'file'}}" class="flex justify-between items-start gap-3">
        <span class="text-sm text-gray-600 dark:text-gray-400 min-w-0 break-words">{{field.label}}</span>
        <span class="text-sm text-gray-900 dark:text-white text-right min-w-0 max-w-[60%] wrap-anywhere">{{field.display_value || '-'}}</span>
      </div>
      <!-- 여러 줄 글 — 라벨 아래에 줄바꿈을 살려 그린다. -->
      <div data-if="{{field.type === 'textarea' &amp;&amp; field.renderer !== 'file'}}" class="space-y-2">
        <span class="block text-sm font-medium text-gray-600 dark:text-gray-400 break-words">{{field.label}}</span>
        <p class="text-sm text-gray-900 dark:text-white whitespace-pre-wrap break-words">{{field.display_value || '-'}}</p>
      </div>
      <!-- 파일, 이미지 — 올라가 있는 파일 이름 목록. 없으면 「-」. -->
      <div data-if="{{field.renderer === 'file'}}" data-ref="mf_view_files_{{field.key}}" class="flex justify-between items-start gap-3">
        <span class="text-sm text-gray-600 dark:text-gray-400 min-w-0 break-words">{{field.label}}</span>
        <span data-if="{{(field.files ?? []).length === 0}}" class="text-sm text-gray-900 dark:text-white text-right">-</span>
        <ul data-if="{{(field.files ?? []).length > 0}}" class="min-w-0 max-w-[60%] space-y-1">
          <li data-each="fieldFile in {{field.files ?? []}}" data-ref="mf_view_file_{{field.key}}_{{fieldFile.id}}" class="flex justify-end min-w-0">
            <button type="button" class="min-w-0 justify-start text-left text-sm text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">
              <on type="click">
                <!-- 내려받기 — 본인만 받을 수 있는 파일이라 로그인 토큰이 실리는 경로로 받는다. -->
                <action handler="downloadAttachment" url="{{fieldFile.url}}" filename="{{fieldFile.name}}"/>
              </on>
              <span class="block truncate">{{fieldFile.name}}</span>
            </button>
          </li>
        </ul>
      </div>
      <!-- 값에 붙는 알림 — 항목을 선언한 확장이 「이 값은 지금 적용되지 않는다」처럼 보기 화면에서도 알려야 할 문장을 주면(ui.notice) 값 아래에 그린다. 문장은 서버가 요청 언어로 완성해 준다. -->
      <p data-if="{{!!field.ui?.notice}}" data-ref="mf_view_notice_{{field.key}}" class="mt-1 text-xs text-amber-700 dark:text-amber-400 text-right break-words">{{field.ui?.notice}}</p>
    </div>
  </div>
</partial>
