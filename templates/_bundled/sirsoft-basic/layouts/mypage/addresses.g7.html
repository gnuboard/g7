<!-- 마이페이지 «배송지» 탭. 마이페이지의 탭들은 한 화면이 아니라 **각각 독립 레이아웃**이고,
     `currentTab` 계산값으로 공통 탭 줄이 지금 어디인지 안다. 로그인 전용(auth_mode required). -->
<layout name="mypage/addresses" version="1.0.0" extends="_user_base">
  <!-- 저장된 배송지 전량. 쪽 나눔이 없어 조건 없이 한 번 받고, 등록·수정·삭제 뒤에는 다시 받는다 -->
  <data-source id="addresses" label_key="$t:editor.data_source.addresses" type="api" endpoint="/api/modules/sirsoft-ecommerce/user/addresses" method="GET" :auto_fetch="true" auth_mode="required" loading_strategy="progressive"/>
  <init-local/>
  <computed name="currentTab">addresses</computed>
  <permissions/>
  <transition-overlay enabled style="spinner" target="mypage_tab_content" fallback-target="main_content_area">
    <spinner component="PageLoading"/>
  </transition-overlay>
  <slot name="content">
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900">
      <container data-type="layout" class="py-8">
        <responsive on="portable" class="py-4"/>
        <!-- 페이지 제목 -->
        <div class="flex items-center gap-2 mb-6">
          <icon name="user" size="xl" class="text-gray-900 dark:text-white"/>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">$t:mypage.title</h1>
        </div>
        <!-- 탭 네비게이션 -->
        <include src="partials/mypage/_tab_navigation.g7.html"/>
        <!-- 탭 컨텐츠 영역 (스켈레톤 타겟) -->
        <div data-ref="mypage_tab_content">
          <!-- 배송지 관리 -->
          <include src="partials/mypage/addresses/_list.g7.html"/>
        </div>
      </container>
    </div>
  </slot>
  <!-- 배송지 등록·수정 폼 창(한 창이 두 모드) -->
  <modal src="partials/mypage/addresses/_modal_address.g7.html"/>
  <!-- 저장 자리가 꽉 찼을 때 어느 것을 덮어쓸지 묻는다 -->
  <modal src="partials/mypage/addresses/_modal_confirm_overwrite.g7.html"/>
  <!-- 삭제 확인 — 기본 배송지는 지울 수 없어 그 카드에는 버튼이 없다 -->
  <modal src="partials/mypage/addresses/_modal_confirm_delete.g7.html"/>
</layout>
