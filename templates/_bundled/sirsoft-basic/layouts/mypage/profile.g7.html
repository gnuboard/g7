<!-- 마이페이지 «내 정보» 탭 — 보기 전용이고 고치기는 `profile-edit` 로 넘어간다. 회원 탈퇴도 여기 있다. -->
<layout name="mypage/profile" version="1.0.0" extends="_user_base">
  <!-- 로그인한 본인 정보. `initLocal` 로 폼 상태의 초깃값도 함께 채워, 수정 화면으로 넘어가도 값이 이어진다 -->
  <data-source id="user" label_key="$t:editor.data_source.user" type="api" endpoint="/api/me" method="GET" :auto_fetch="true" :auth_required="true" loading_strategy="progressive" initLocal="profileEditForm"/>
  <computed name="currentTab">profile</computed>
  <permissions/>
  <transition-overlay enabled style="spinner" target="mypage_tab_content" fallback-target="main_content_area">
    <spinner component="PageLoading"/>
  </transition-overlay>
  <slot name="content">
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900">
      <container data-type="layout" class="py-8">
        <responsive on="portable" class="py-4"/>
        <!-- 페이지 제목 -->
        <div class="flex items-center gap-2 mb-6">
          <icon name="user" size="xl" class="text-gray-900 dark:text-white"/>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">$t:mypage.title</h1>
        </div>
        <!-- 탭 네비게이션 -->
        <include src="partials/mypage/_tab_navigation.g7.html"/>
        <!-- 탭 컨텐츠 영역 (스켈레톤 타겟) -->
        <div data-ref="mypage_tab_content">
          <!-- 프로필 보기 -->
          <include src="partials/mypage/profile/_view.g7.html"/>
        </div>
      </container>
    </div>
  </slot>
  <!-- 회원 탈퇴 확인 창 — 되돌릴 수 없는 동작이라 별도 창에서 한 번 더 받는다 -->
  <modal src="partials/mypage/profile/_modal_withdraw.g7.html"/>
</layout>
