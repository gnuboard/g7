<layout name="mypage/change-password" version="1.0.0" extends="_user_base">
  <permissions/>
  <init>
    <set-state target="local" :isSubmitting="false" :success="false"/>
  </init>
  <slot name="content">
    <div class="min-h-[60vh] flex items-center justify-center py-12 px-4">
      <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8">
          <responsive on="portable" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6"/>
          <!-- 헤더 -->
          <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center">
              <icon name="lock" size="xl" class="text-primary-600 dark:text-primary-400"/>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">$t:mypage.profile.change_password_title</h1>
            <p class="text-gray-600 dark:text-gray-400">$t:mypage.profile.change_password_subtitle</p>
          </div>
          <!-- 성공 메시지 -->
          <div data-if="{{_local?.success}}" class="text-center">
            <div class="w-16 h-16 mx-auto mb-4 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center">
              <icon name="check" size="xl" class="text-green-600 dark:text-green-400"/>
            </div>
            <p class="text-green-700 dark:text-green-300 mb-6">$t:mypage.profile.change_password_success</p>
            <button class="inline-block px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors cursor-pointer"><on type="click"><navigate path="/mypage/profile"/></on>$t:mypage.profile.back_to_profile</button>
          </div>
          <!-- 폼 -->
          <form data-key="form" data-if="{{!_local?.success}}" class="space-y-6" id="form">
            <on type="submit">
              <set-state target="local" :isSubmitting="true"/>
              <api-call :auth_required="true" target="/api/me/password" method="PUT">
                <success>
                  <set-state target="local" :isSubmitting="false" :success="true"/>
                </success>
                <fail>
                  <set-state target="local" :isSubmitting="false"/>
                  <toast type="error" message="{{response.message ?? '$t:mypage.profile.change_password_failed'}}"/>
                </fail>
                <body current_password="{{form?.current_password}}" password="{{form?.password}}" password_confirmation="{{form?.password_confirmation}}"/>
              </api-call>
            </on>
            <!-- 현재 비밀번호 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">$t:mypage.profile.current_password</label>
              <password-input name="current_password" placeholder="$t:mypage.profile.current_password_placeholder" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed" :required="true" :showToggle="true" disabled="{{_local?.isSubmitting ?? false}}"/>
            </div>
            <!-- 새 비밀번호 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">$t:mypage.profile.new_password</label>
              <password-input name="password" placeholder="$t:mypage.profile.new_password_placeholder" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed" :required="true" :showToggle="true" :showValidation="true" disabled="{{_local?.isSubmitting ?? false}}">
                <prop name="enableRules">
                  <item>minLength:8</item>
                </prop>
              </password-input>
            </div>
            <!-- 새 비밀번호 확인 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">$t:mypage.profile.confirm_password</label>
              <password-input name="password_confirmation" placeholder="$t:mypage.profile.confirm_password_placeholder" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed" :required="true" :showToggle="true" :isConfirmField="true" confirmTarget="{{_local?.form?.password ?? ''}}" disabled="{{_local?.isSubmitting ?? false}}"/>
            </div>
            <!-- 버튼 영역 -->
            <div class="flex flex-col gap-3 pt-2">
              <!-- 제출 버튼 -->
              <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled="{{_local?.isSubmitting ?? false}}">
                <!-- 스피너 -->
                <div data-if="{{_local?.isSubmitting}}" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/>
                <span data-if="{{!_local?.isSubmitting}}">$t:mypage.profile.change_password_submit</span>
                <span data-if="{{_local?.isSubmitting}}">$t:mypage.profile.change_password_processing</span>
              </button>
              <!-- 취소 버튼 --><button type="button" class="w-full py-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors font-medium cursor-pointer" disabled="{{_local?.isSubmitting ?? false}}"><on type="click"><navigate path="/mypage/profile"/></on>$t:common.cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </slot>
</layout>
