<!-- 마이페이지 «찜한 상품» 탭. -->
<layout name="mypage/wishlist" version="1.0.0" extends="_user_base">
  <!-- 찜 목록. 쪽수를 URL 이 아니라 `_local` 에 두므로 엔드포인트 문자열에 직접 끼워 넣는다 -->
  <data-source id="wishlist" label_key="$t:editor.data_source.wishlist" type="api" endpoint="/api/modules/sirsoft-ecommerce/wishlist?page={{_local.wishlistPage ?? 1}}" method="GET" :auto_fetch="true" :auth_required="true" loading_strategy="progressive"/>
  <computed name="currentTab">wishlist</computed>
  <permissions/>
  <transition-overlay enabled style="spinner" target="mypage_tab_content" fallback-target="main_content_area">
    <spinner component="PageLoading"/>
  </transition-overlay>
  <init>
    <set-state target="local" :wishlistPage="1"/>
  </init>
  <slot name="content">
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900">
      <container data-type="layout" class="py-8">
        <responsive on="portable" class="py-4"/>
        <!-- 페이지 제목 -->
        <div class="flex items-center gap-2 mb-6">
          <icon name="user" size="xl" class="text-gray-900 dark:text-white"/>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">$t:mypage.title</h1>
        </div>
        <!-- 탭 네비게이션 -->
        <include src="partials/mypage/_tab_navigation.g7.html"/>
        <!-- 탭 컨텐츠 영역 (스켈레톤 타겟) -->
        <div data-ref="mypage_tab_content">
          <!-- 찜 목록 -->
          <include src="partials/mypage/wishlist/_list.g7.html"/>
        </div>
      </container>
    </div>
  </slot>
</layout>
