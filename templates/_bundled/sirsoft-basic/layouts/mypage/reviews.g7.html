<!-- 마이페이지 «리뷰» 탭 — 내가 쓴 상품 리뷰 목록과 삭제. 리뷰 수정은 하지 않는다(수정 API 가 없다).
     목록·쪽은 URL 쿼리에 있어 쪽을 넘기면 다시 받는다. 삭제는 확인 창을 거친다. -->
<layout name="mypage/reviews" version="1.0.0" extends="_user_base">
  <!-- 내 리뷰 목록 -->
  <data-source id="myReviews" label_key="$t:editor.data_source.myReviews" type="api" endpoint="/api/modules/sirsoft-ecommerce/user/reviews" method="GET" :auto_fetch="true" :auth_required="true" loading_strategy="progressive" :blur_until_loaded="true">
    <params page="{{query.page ?? 1}}" :per_page="10"/>
  </data-source>
  <computed name="currentTab">reviews</computed>
  <permissions/>
  <transition-overlay enabled style="spinner" target="mypage_tab_content" fallback-target="main_content_area">
    <spinner component="PageLoading"/>
  </transition-overlay>
  <slot name="content">
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900">
      <container data-type="layout" class="py-8">
        <responsive on="portable" class="py-4"/>
        <!-- 페이지 제목 -->
        <div class="flex items-center gap-2 mb-6">
          <icon name="user" size="xl" class="text-gray-900 dark:text-white"/>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">$t:mypage.title</h1>
        </div>
        <!-- 탭 네비게이션 -->
        <include src="partials/mypage/_tab_navigation.g7.html"/>
        <!-- 탭 컨텐츠 영역 (스켈레톤 타겟) -->
        <div data-ref="mypage_tab_content">
          <include src="partials/mypage/reviews/_list.g7.html"/>
        </div>
      </container>
    </div>
  </slot>
  <!-- 리뷰 삭제 확인 -->
  <modal src="partials/mypage/reviews/_modal_review_delete.g7.html"/>
</layout>
