feature: 통합 검색의 페이지 결과 리스너

description: |
  SearchPagesListener 가 통합 검색에 페이지 결과를 넣는 기본 동작을 고정한다.
  훅 구독 선언, 탭과 정렬에 따른 조회 분기, 결과 항목의 모양, 응답 조립, 검증 규칙 추가가 대상이다.

  같은 시험 파일의 다른 시험은 각자의 매니페스트가 맡는다. 하이라이트 이스케이프는 security-fixes-2026-08.yaml,
  잘린 총 건수와 마지막 페이지는 코어 bounded-total-pagination.yaml, 검색 실패 표면화는 기본 템플릿의
  search-category-failure.yaml 이다.

axis_notes:
  listener_case: |
    hook_subscription 은 훅 구독 선언, empty_keyword 부터 keyword_highlight 까지는 searchPages(),
    response_* 는 buildPagesResponse(), validation_rules 는 addValidationRules() 의 사례다.

axes:
  listener_case: [hook_subscription, empty_keyword, unrelated_tab, all_tab, pages_tab, sort_oldest, sort_latest,
                  result_item_shape, keyword_highlight, response_without_pages, response_all_tab, response_pages_tab,
                  validation_rules]

effects:
  # 훅 구독 선언
  - search_hooks_subscribed_for_results_response_and_validation   # 결과, 응답 조립, 검증 규칙 훅 3개를 구독한다
  - search_hooks_declared_as_filters                              # 세 훅 모두 type 이 filter 다
  - search_hooks_declare_method_and_priority                      # 세 훅 모두 method 와 priority 를 가진다
  # searchPages()
  - empty_keyword_returns_results_unchanged                       # 검색어가 비면 받은 결과를 그대로 돌려준다
  - unrelated_tab_returns_count_without_items                     # 다른 탭에서는 건수만 세고 항목은 비운다
  - all_tab_returns_limited_page_results                          # 전체 탭은 all_tab_limit 만큼 조회해 싣는다
  - pages_tab_returns_paged_results                               # 페이지 탭은 기본 쪽 크기로 조회해 싣는다
  - oldest_sort_resolves_to_ascending                             # sort=oldest 는 created_at 오름차순 조회가 된다
  - latest_sort_resolves_to_descending                            # sort=latest 는 created_at 내림차순 조회가 된다
  - result_item_carries_highlight_fields_and_public_url           # 항목에 강조 필드와 /page/{slug} 주소가 실린다
  - keyword_wrapped_in_mark_tag                                   # 제목의 검색어가 mark 태그로 감싸진다
  - other_category_results_preserved_on_failure                   # 페이지 검색이 실패해도 다른 분류의 결과는 그대로다
  # buildPagesResponse()
  - response_unchanged_without_pages_results                      # 페이지 결과가 없으면 응답을 건드리지 않는다
  - all_tab_response_carries_count_and_fetched_items              # 전체 탭 응답에 pages_count 와 조회된 항목이 그대로 실린다
  - pages_tab_response_carries_pagination_meta                    # 페이지 탭 응답에 현재 쪽, 쪽 크기, 마지막 쪽, 다음 쪽 여부가 실린다
  # addValidationRules()
  - sort_validation_rule_added                                    # sort 에 nullable, string 규칙이 더해진다
  - existing_validation_rules_preserved                           # 기존 q, type 규칙은 그대로 남는다

# E2E axis 없음: 리스너 단위 계약이고 레이아웃 JSON 과 컴포넌트 변경이 없다.

test_files:
  - modules/_bundled/sirsoft-page/tests/Unit/Listeners/SearchPagesListenerTest.php
