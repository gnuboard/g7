feature: 임시 첨부를 페이지에 연결할 때의 첨부 순서

description: |
  수정 화면에서 새 첨부를 올려 저장하면 임시 첨부를 페이지에 연결하면서 순서를 1 부터 다시 매겨, 이미 첨부가 있는
  페이지에서는 새 첨부가 기존 첨부와 같은 번호를 받아 목록 중간에 끼었다(7.1.0 전수 실측 영역 L 후속, O-L1
  재실측에서 발견). 새 첨부는 기존 첨부 뒤에 고른 순서대로 붙고, 새 페이지는 종전대로 1..N 이다.

axes:
  form_mode: [create, edit]

effects:
  - linked_temp_attachments_follow_existing_ones
  - linked_temp_attachments_numbered_from_one_on_new_page

test_files:
  - modules/_bundled/sirsoft-page/tests/Feature/TempAttachmentLinkOrderTest.php
