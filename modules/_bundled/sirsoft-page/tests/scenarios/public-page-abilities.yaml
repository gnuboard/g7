feature: 공개 페이지 관리자 링크 판정 — 편집·버전 배지·페이지 만들기 (7.1.0 abilities 게이트 G28)

description: |
  공개 페이지 화면의 [편집]·버전 배지·없는 페이지의 [페이지 만들기]가 is_admin 만 보고 열려, 페이지 수정·등록 권한이 없는
  관리자도 링크를 눌러 403 화면을 만났다. 페이지가 있으면 data.abilities.can_update, 없으면(404) errors.abilities.can_create 를 싣는다.

test_files:
  - modules/_bundled/sirsoft-page/tests/Feature/User/PublicPageAbilitiesTest.php

axes:
  case:
    - page_update_ability
    - missing_page_create_ability

effects:
  - public_page_reports_can_update
  - missing_page_reports_can_create
