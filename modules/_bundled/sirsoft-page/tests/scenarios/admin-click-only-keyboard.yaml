feature: 관리자 페이지 상세 접기 머리·첨부 카드 — 단추로 바꿔 키보드로 누르기

description: |
  「본문 미리보기」·「첨부파일」 접기 머리와 첨부 카드가 클릭 동작만 달린 Div 라 Tab 이 닿지 않고 Enter·Space 로 접거나
  내려받을 수 없었으며 접힘 여부도 알리지 않았다(7.1.1 — 「같은 모양」 표). 머리는 aria-expanded 단추,
  카드는 type="button" 단추(내려받기는 이 모듈의 핸들러)로 그린다. 잠금 시험의 첫 단언은 페이지 모듈 레이아웃 전체에서 모집단을 파생한다.

axes:
  surface: [admin_page_detail]

effects:
  - admin_click_only_regions_are_keyboard_buttons

test_files:
