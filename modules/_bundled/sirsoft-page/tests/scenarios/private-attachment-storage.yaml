# 시나리오 매니페스트 — 페이지 비공개 원본의 저장 디스크 (#916 ①, 공개 #83 후속)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: page_private_attachment_storage

description: |
  페이지 첨부와 본문 미디어는 권한 게이트가 걸린 비공개 원본이다. `PageAttachmentService`·`PageContentMediaFlow` 를
  `private_attachments` 바인딩으로 옮겨 관리자가 고른 비공개 첨부 저장소를 따르게 한다(「기본」이면 modules).
  코어 해석 규칙은 `tests/scenarios/private-attachment-storage.yaml`, 행 disk 기준 서빙·복제·삭제는
  `page-content-media-row-disk.yaml` 이 소유한다.

axes:
  case: [private_attachment_selection]

effects:
  - page_private_services_follow_private_attachment_selection  # 페이지 첨부·본문 미디어 서비스가 비공개 첨부 선택을 따르고 「기본」이면 modules

test_files:
  - modules/_bundled/sirsoft-page/tests/Feature/PageContentMediaRowDiskTest.php
