feature: 관리자 페이지 화면(목록·등록/수정 폼·상세) 레이아웃 계약

description: |
  관리자 페이지 목록(admin_page_list)·등록/수정 폼(admin_page_form)·상세(admin_page_detail) 레이아웃 JSON 이
  지켜야 할 계약을 화면 영역별로 고정한다 — 데이터 소스와 오류 처리, 권한(abilities)에 따른 버튼 비활성,
  모달·이동 대상, 발행 필터, 읽기 전용 모드, 슬러그 중복 확인, 첨부 업로더, 공용 스타일 자산.

  기존 레이아웃 계약 테스트(admin-page-layouts.test.ts)의 소유권을 7.1.0 abilities 게이트 작업 중 시험 파일을 고치며
  테스트별로 사후 매핑했다. 축 case 는 화면과 영역을 묶은 단위이고, 한 영역의 여러 테스트가 같은 효과를 함께 받친다.
  첨부 순서·폼 잔존·버전 변경 라벨 효과(edit_mode_drag_persists_via_reorder_api 등)는
  page-attachment-order-and-seo-cache.yaml 이 선언하고 이 파일의 해당 테스트가 같은 이름으로 마킹한다.

