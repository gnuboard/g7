feature: PageService 페이지 생성·수정·삭제·발행·버전·조회 비즈니스 로직

description: |
  PageService 가 관리자 화면과 사용자 화면 뒤에서 수행하는 페이지 도메인 동작을 서비스 단위로 고정한다.

  동작 축(case):
    - create          — 생성 시 모델 반환, 버전 1 스냅샷, 발행 생성 시 published_at 설정.
    - update          — 제목 반영, current_version 증가, 새 버전 스냅샷 저장.
    - delete          — 물리 삭제, 버전 이력을 DB 외래키 연쇄 없이 명시적으로 삭제.
    - publish         — 단건 발행·미발행 전환.
    - bulk_publish    — 일괄 발행·미발행, 페이지별 after_publish 훅 발화, 실패 시 전체 롤백.
    - restore_version — 지정 버전 내용으로 복원하고 버전 번호를 올린다.
    - slug_exists     — 슬러그 중복 판정과 자기 자신 제외.
    - published_lookup — 사용자 화면용 슬러그 조회(발행만 반환, 미리보기 허용 시 미발행 반환).
    - scope_gate      — scope=self 권한 사용자는 타인 페이지 조회·수정·삭제·발행·복원·일괄 발행이
                        거부되고 자기 페이지는 허용된다.

axes:
  case: [create, update, delete, publish, bulk_publish, restore_version, slug_exists, published_lookup, scope_gate]

effects:
  - page_create_returns_model_with_version_one
  - page_create_stores_version_one_snapshot
  - page_create_published_sets_published_at
  - page_update_applies_title
  - page_update_increments_current_version
  - page_update_stores_new_version_snapshot
  - page_delete_hard_deletes_row
  - page_delete_removes_versions_explicitly
  - page_publish_sets_published_at
  - page_unpublish_clears_published_flag
  - bulk_publish_updates_every_page
  - bulk_publish_fires_after_publish_hook_per_page
  - bulk_unpublish_fires_hook_with_false_per_page
  - bulk_publish_rolls_back_all_on_failure
  - restore_version_reverts_content_and_bumps_version
  - slug_exists_true_for_existing
  - slug_exists_false_for_missing
  - slug_exists_excludes_own_id
  - published_lookup_returns_published_page
  - published_lookup_hides_draft
  - published_lookup_returns_draft_when_preview_allowed
  - published_lookup_returns_null_for_missing_slug
  - scope_self_denies_get_other_page
  - scope_self_allows_get_own_page
  - scope_self_denies_update_other_page
  - scope_self_denies_delete_other_page
  - scope_self_denies_publish_other_page
  - scope_self_denies_restore_other_page
  - scope_self_denies_bulk_publish_with_other_page
  - scope_self_allows_bulk_publish_own_pages

