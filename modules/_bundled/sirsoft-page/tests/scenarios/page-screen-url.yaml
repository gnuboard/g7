feature: 페이지 화면 주소 래퍼 — 검색·사이트맵은 화면 주소 헬퍼, SEO 캐시는 기본 경로

description: |
  페이지 검색 결과·사이트맵 주소는 코어 ScreenUrl(키 page.show)을 거쳐 「사용자 화면 URL」과 주소 필터를 따른다.
  G7 엔진 SEO 캐시는 필터 없는 기본 경로를 쓴다.

test_files:
  - modules/_bundled/sirsoft-page/tests/Unit/PageScreenUrlTest.php

axes:
  case:
    - wrapper
    - sitemap_incremental

effects:
  - page_urls_use_helper
  - page_default_path_unfiltered
  - page_incremental_index_follows_filter
