feature: 페이지 본문 미디어 — 관리자 편집기 본문 이미지·동영상·오디오 (#883 4단계)

description: |
  `page_attachments` 의 `collection = content_media`. 파일은 처음부터 `content-media/Y/m/d/` 에 두고 행은 임시(page_id=null +
  임시 키)다. 페이지 저장 트랜잭션 안에서 본문(로케일마다)이 참조한 것만 잇고, 빠진 것은 어느 버전도 참조하지 않을 때만
  지운다(행 + 커밋 뒤 파일 — #887 G5, 버전이 참조하면 페이지에 붙인 채 둔다). 첨부
  연결(파일 이동)·첨부 목록·첨부 개수는 본문 미디어를 빼고 본다. 서빙 게이트는 「발행 또는 열람권 또는 서명」, 응답 본문은
  미발행일 때만 서명한다(발행 페이지는 정식 주소).
  본문 이미지 서빙 주소에 `?size=`·`?w=` 를 붙이면 같은 게이트를 지난 뒤 줄인 이미지를 낸다(권한 원본 — private). 서명은 그 두
  파라미터를 빼고 검증한다. 본문 미디어 이미지는 페이지 첨부 썸네일 원본 제공자가 함께 맡아 한 번만 센다(#869 와의 접합).

