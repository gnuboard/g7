feature: 행·카드 메뉴 항목 href 의 목록 조건 (7.1.1 출시 전 점검)

description: |
  보통 클릭(onRowAction·onItemClick 의 navigate)이 지금 목록의 쪽·검색 조건을 싣는(mergeQuery) 메뉴 항목은 href 항목에도
  mergeQuery 를 둔다 — 가운데 클릭·Ctrl+클릭·새 탭이 보통 클릭과 같은 주소로 열린다.

axes:
  surface:
    - row_actions   # DataGrid rowActions
    - menu_items    # ActionMenu items

exclusions:
  - { surface: menu_items, reason: "페이지 모듈 레이아웃·조각에 보통 클릭이 mergeQuery 로 가는 ActionMenu 항목이 없다(2026-10-18 집계 0건) — 판정 함수는 items 도 같은 규칙으로 보므로 그런 항목이 생기면 바로 잡는다" }

effects:
  - menu_href_keeps_list_query

test_files:
  - modules/_bundled/sirsoft-page/resources/js/__tests__/layouts/menu-item-href-merge-query.test.ts
