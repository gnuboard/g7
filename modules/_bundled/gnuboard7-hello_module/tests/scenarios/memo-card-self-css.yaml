feature: Hello 모듈 화면 — 모듈 자기 순수 CSS 로 그리기

description: |
  0.2.x 까지 MemoCard 와 모듈 레이아웃은 Tailwind 유틸리티와 관리자 템플릿 의미 클래스를 써서, 스타일시트가 없는
  Hello 사용자 템플릿에서는 카드 테두리·제목 서식이 오류 없이 빠졌다. 0.3.0 은 모듈이 자기 CSS(resources/css/main.css)를
  싣고 화면은 그 파일에 정의된 hellomodule-* 클래스만 쓴다. 색·테두리(의미)는 @layer g7-extension 안, 여백(배치)은 층 밖에
  두고, 다크는 중립 표식 data-g7-color-scheme 만 쓰며 다크 속 라이트 구역은 뺀다. 축 surface 는 확인 대상(컴포넌트,
  레이아웃, 스타일시트)이다.

axes:
  surface: [component, layout, stylesheet]

effects:
  - memo_card_uses_module_css_classes
  - caller_class_name_is_appended
  - layouts_use_only_module_css_classes
  - meaning_in_extension_layer_layout_outside
  - dark_uses_neutral_color_scheme_marker

test_files:
  - modules/_bundled/gnuboard7-hello_module/resources/js/components/__tests__/MemoCardSelfCss.test.tsx
