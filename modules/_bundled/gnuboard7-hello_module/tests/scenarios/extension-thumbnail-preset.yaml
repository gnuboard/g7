feature: 확장 썸네일 규격 등록 예시 (`gnuboard7-hello_module.sample`)

description: |
  학습용 모듈이 코어 필터 `core.thumbnail.filter_presets` 에 규격 하나(가로 480 · 세로 270 자르기)를 더한다.
  문서 예제 겸 확장 규격의 통합 테스트다 — 레지스트리·관리자 표(「기본값으로」)·저장 병합·서빙까지 실제 훅
  체인으로 잰다.

  회귀 불변식:
    1. 확장 규격은 이름이 잠긴 채 출처가 모듈 식별자로 들어오고, 고정 슬롯·og 뒤에 온다.
    2. 운영자 저장 행은 값만 덮는다(이름·출처는 못 바꾼다).
    3. 관리자 표의 확장 행 `defaults` 로 저장하면 등록값으로 돌아간다.
    4. 모듈이 꺼져 필터가 빠지면 규격도 빠지지만 운영자 저장값은 저장 병합에서 남는다.
    5. `{확장 식별자}.{키}` 형식을 어긴 행은 버려지고 고정 슬롯을 덮지 못한다.
    6. 코어 첨부 주소에 `?size=gnuboard7-hello_module.sample` 을 붙이면 480×270 썸네일이 나간다.
    7. 앞선 필터가 배열이 아닌 값을 넘기면 리스너는 그 값을 그대로 돌려준다(빈 배열로 바꿔 지우지 않는다).
    8. 규격 행의 `label` 다국어 키는 관리자 표에 로케일 맵으로 실리고 저장 행에는 남지 않는다.

