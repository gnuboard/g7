<layout name="admin_memo_form" version="1.0.0" extends="_admin_base">
  <meta title="{{route?.id ? '$t:gnuboard7-hello_module.admin.memos.form.title_edit' : '$t:gnuboard7-hello_module.admin.memos.form.title_create'}}"/>
  <data-source id="memoData" label_key="$t:gnuboard7-hello_module.editor.data_source.memoData" type="api" endpoint="/api/modules/gnuboard7-hello_module/admin/memos/{{route?.id}}" method="GET" :auto_fetch="true" :auth_required="true" if="{{route?.id}}" initLocal="form">
    <fallback :data="null"/>
  </data-source>
  <permissions>
    <permission>gnuboard7-hello_module.memos.read</permission>
  </permissions>
  <init>
    <!-- 생성 모드에서 폼 기본값 초기화 -->
    <set-state if="{{!route?.id}}" target="local">
      <field name="form">
        <field name="title" value=""/>
        <field name="content" value=""/>
      </field>
    </set-state>
  </init>
  <slot name="content">
    <div data-ref="memo_form_wrapper" class="admin-page-content">
      <div data-ref="memo_form_card" data-key="form" class="max-w-2xl mx-auto p-6 bg-white dark:bg-gray-800 rounded-lg shadow">
        <h1 data-ref="memo_form_title" class="text-page-heading mb-6">{{route?.id ? '$t:gnuboard7-hello_module.admin.memos.form.title_edit' : '$t:gnuboard7-hello_module.admin.memos.form.title_create'}}</h1>
        <div data-ref="memo_field_title" class="mb-4">
          <label class="form-label-block">$t:gnuboard7-hello_module.admin.memos.form.fields.title</label>
          <input type="text" name="title" class=""/>
        </div>
        <div data-ref="memo_field_content" class="mb-6">
          <label class="form-label-block">$t:gnuboard7-hello_module.admin.memos.form.fields.content</label>
          <textarea name="content" :rows="6" class=""/>
        </div>
        <div data-ref="memo_form_actions" class="flex-center justify-end gap-2">
          <button data-ref="memo_cancel_button" type="button" class="px-4 py-2 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 font-medium transition-colors">
            <on type="click">
              <navigate path="/admin/memos"/>
            </on>
            <span>$t:gnuboard7-hello_module.admin.memos.form.actions.cancel</span>
          </button>
          <button data-ref="memo_save_button" type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors">
            <on type="click">
              <api-call :auth_required="true" target="{{route?.id ? '/api/modules/gnuboard7-hello_module/admin/memos/' + route?.id : '/api/modules/gnuboard7-hello_module/admin/memos'}}" method="{{route?.id ? 'PUT' : 'POST'}}" body="{{_local.form}}">
                <success>
                  <toast type="success" message="{{route?.id ? '$t:gnuboard7-hello_module.admin.memos.form.title_edit' : '$t:gnuboard7-hello_module.admin.memos.form.title_create'}}"/>
                  <navigate path="/admin/memos"/>
                </success>
                <fail>
                  <toast type="error" message="{{error.message ?? 'error'}}"/>
                </fail>
              </api-call>
            </on>
            <span>$t:gnuboard7-hello_module.admin.memos.form.actions.save</span>
          </button>
        </div>
      </div>
    </div>
  </slot>
</layout>
