<!-- 관리자 메모 목록 화면 — 페이지 이동은 URL query 로만 하고 목록 상태를 따로 들고 있지 않다. -->
<layout name="admin_memo_list" version="1.0.0" extends="_admin_base">
  <meta _e2e_allow="e2e:allow 클래스를 모듈 자기 CSS(hellomodule-*)로 바꾼 것뿐이라 동작 변화 없음. 클래스가 실제 CSS 에 있는지는 빌드 산출물(dist/css/module.css)에서 확인. 샘플 모듈 전용 화면이라 Playwright spec 부재." title="$t:gnuboard7-hello_module.admin.memos.index.title" description="$t:gnuboard7-hello_module.admin.memos.index.description"/>
  <!-- 메모 목록. 페이지·건수를 URL query 에서 받으므로 주소만 바뀌어도 다시 받아온다. 실패 시 fallback 이 빈 목록 + 1페이지 메타를 세워 화면이 깨지지 않게 한다. -->
  <data-source id="memos" label_key="$t:gnuboard7-hello_module.editor.data_source.memos" type="api" endpoint="/api/modules/gnuboard7-hello_module/admin/memos" method="GET" :auto_fetch="true" :auth_required="true">
    <params page="{{query.page ?? 1}}" per_page="{{query.per_page ?? 10}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="current_page" :value="1"/>
          <field name="last_page" :value="1"/>
          <field name="per_page" :value="10"/>
          <field name="total" :value="0"/>
        </field>
      </field>
    </fallback>
  </data-source>
  <permissions>
    <permission>gnuboard7-hello_module.memos.read</permission>
  </permissions>
  <slot name="content">
    <!-- 클래스는 모두 이 모듈 CSS(resources/css/main.css)의 hellomodule-* 다. 관리자 템플릿의 의미 클래스에 기대지 않는다. -->
    <div data-ref="memo_list_wrapper" class="hellomodule-admin-page">
      <div data-ref="memo_list_header" class="hellomodule-toolbar">
        <h1 data-ref="memo_list_title" class="hellomodule-page__title">$t:gnuboard7-hello_module.admin.memos.index.title</h1>
        <a href="/admin/memos/create" :mergeQuery="true" data-ref="memo_create_button" class="hellomodule-button hellomodule-button--primary" disabled="{{memos?.data?.abilities?.can_create !== true}}" title="{{memos?.data?.abilities?.can_create === true ? '' : '$t:gnuboard7-hello_module.admin.memos.index.create_no_permission'}}">
          <on type="click">
            <!-- 새 메모 작성. 작성을 취소하고 돌아올 때를 위해 목록 상태를 함께 넘긴다 -->
            <navigate :mergeQuery="true">
              <query/>
            </navigate>
          </on>
          <span>$t:gnuboard7-hello_module.admin.memos.form.title_create</span>
        </a>
      </div>
      <!-- 메모가 0건이면 빈 화면 대신 안내 문구를 보인다 -->
      <p data-ref="memo_empty" data-if="{{memos !== undefined &amp;&amp; ((memos?.data?.data ?? []).length === 0)}}" class="hellomodule-empty">$t:gnuboard7-hello_module.admin.memos.index.empty</p>
      <!-- 반복은 카드에 둔다 — 묶음에 두면 메모마다 자식 하나뿐인 묶음이 생기고, 카드가 간격 없이 붙는다(사용자 메모 목록과 같은 결함군). 카드 사이 간격은 묶음(hellomodule-list)이 준다. -->
      <div data-ref="memo_items" class="hellomodule-list">
        <div data-ref="memo_item_{{idx}}" data-each="memo, idx in {{memos?.data?.data ?? []}}" class="hellomodule-card">
          <h2 class="hellomodule-card__title">{{memo.title ?? ''}}</h2>
          <p class="hellomodule-card__body">{{memo.content ?? ''}}</p>
        </div>
      </div>
    </div>
  </slot>
</layout>
