<!-- 관리자 메모 목록 화면 — 페이지 이동은 URL query 로만 하고 목록 상태를 따로 들고 있지 않다. -->
<layout name="admin_memo_list" version="1.0.0" extends="_admin_base">
  <meta title="$t:gnuboard7-hello_module.admin.memos.index.title" description="$t:gnuboard7-hello_module.admin.memos.index.description"/>
  <!-- 메모 목록. 페이지·건수를 URL query 에서 받으므로 주소만 바뀌어도 다시 받아온다. 실패 시 fallback 이 빈 목록 + 1페이지 메타를 세워 화면이 깨지지 않게 한다. -->
  <data-source id="memos" label_key="$t:gnuboard7-hello_module.editor.data_source.memos" type="api" endpoint="/api/modules/gnuboard7-hello_module/admin/memos" method="GET" :auto_fetch="true" :auth_required="true">
    <params page="{{query.page}}" per_page="{{query.per_page ?? 10}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="current_page" :value="1"/>
          <field name="last_page" :value="1"/>
          <field name="per_page" :value="10"/>
          <field name="total" :value="0"/>
        </field>
      </field>
    </fallback>
  </data-source>
  <permissions>
    <permission>gnuboard7-hello_module.memos.read</permission>
  </permissions>
  <slot name="content">
    <div data-ref="memo_list_wrapper" class="admin-page-content">
      <div data-ref="memo_list_header" class="flex-between mb-6">
        <h1 data-ref="memo_list_title" class="text-page-heading">$t:gnuboard7-hello_module.admin.memos.index.title</h1>
        <button data-ref="memo_create_button" type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors">
          <on type="click">
            <navigate path="/admin/memos/create"/>
          </on>
          <span>$t:gnuboard7-hello_module.admin.memos.form.title_create</span>
        </button>
      </div>
      <div data-ref="memo_items_{{idx}}" data-each="memo, idx in {{memos?.data?.data ?? []}}" class="row-stack">
        <div data-ref="memo_item_{{idx}}" class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700">
          <h2 class="section-heading">{{memo.title ?? ''}}</h2>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">{{memo.content ?? ''}}</p>
        </div>
      </div>
    </div>
  </slot>
</layout>
