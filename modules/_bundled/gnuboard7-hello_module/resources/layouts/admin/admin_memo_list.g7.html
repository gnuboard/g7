<!-- 관리자 메모 목록 화면 — 페이지 이동은 URL query 로만 하고 목록 상태를 따로 들고 있지 않다. -->
<layout name="admin_memo_list" version="1.0.0" extends="_admin_base">
  <meta _e2e_allow="e2e:allow 다크 모드 대비 클래스(dark:bg-blue-500/dark:hover:bg-blue-600) 추가만으로 동작 변화 없음. 클래스가 실제 CSS 로 생성되는지는 빌드 산출물에서 확인. 샘플 모듈 전용 화면이라 Playwright spec 부재." title="$t:gnuboard7-hello_module.admin.memos.index.title" description="$t:gnuboard7-hello_module.admin.memos.index.description"/>
  <!-- 메모 목록. 페이지·건수를 URL query 에서 받으므로 주소만 바뀌어도 다시 받아온다. 실패 시 fallback 이 빈 목록 + 1페이지 메타를 세워 화면이 깨지지 않게 한다. -->
  <data-source id="memos" label_key="$t:gnuboard7-hello_module.editor.data_source.memos" type="api" endpoint="/api/modules/gnuboard7-hello_module/admin/memos" method="GET" :auto_fetch="true" :auth_required="true">
    <params page="{{query.page ?? 1}}" per_page="{{query.per_page ?? 10}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="current_page" :value="1"/>
          <field name="last_page" :value="1"/>
          <field name="per_page" :value="10"/>
          <field name="total" :value="0"/>
        </field>
      </field>
    </fallback>
  </data-source>
  <permissions>
    <permission>gnuboard7-hello_module.memos.read</permission>
  </permissions>
  <slot name="content">
    <div data-ref="memo_list_wrapper" class="admin-page-content">
      <div data-ref="memo_list_header" class="flex-between mb-6">
        <h1 data-ref="memo_list_title" class="text-page-heading">$t:gnuboard7-hello_module.admin.memos.index.title</h1>
        <button data-ref="memo_create_button" type="button" class="px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{memos?.data?.abilities?.can_create !== true}}" title="{{memos?.data?.abilities?.can_create === true ? '' : '$t:gnuboard7-hello_module.admin.memos.index.create_no_permission'}}">
          <on type="click">
            <!-- 새 메모 작성. 작성을 취소하고 돌아올 때를 위해 목록 상태를 함께 넘긴다 -->
            <navigate path="/admin/memos/create" :mergeQuery="true">
              <query/>
            </navigate>
          </on>
          <span>$t:gnuboard7-hello_module.admin.memos.form.title_create</span>
        </button>
      </div>
      <!-- 메모가 0건이면 빈 화면 대신 안내 문구를 보인다 -->
      <p data-ref="memo_empty" data-if="{{(memos?.data?.data ?? []).length === 0}}" class="py-8 text-center text-sm text-gray-500 dark:text-gray-400">$t:gnuboard7-hello_module.admin.memos.index.empty</p>
      <!-- 반복은 카드에 둔다 — 묶음(row-stack)에 두면 메모마다 자식 하나뿐인 묶음이 생기고, row-stack 은 첫·마지막 자식의 위아래 여백을 0 으로 두어 카드가 간격 없이 붙는다(사용자 메모 목록과 같은 결함군). -->
      <div data-ref="memo_items" class="space-y-3">
        <div data-ref="memo_item_{{idx}}" data-each="memo, idx in {{memos?.data?.data ?? []}}" class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700">
          <h2 class="section-heading">{{memo.title ?? ''}}</h2>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">{{memo.content ?? ''}}</p>
        </div>
      </div>
    </div>
  </slot>
</layout>
