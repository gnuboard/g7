<!-- 사용자용 메모 목록 화면 — 관리자 목록과 같은 데이터를 비인증 공개 엔드포인트로 받는다. -->
<layout name="user_memo_list" version="1.0.0" extends="_user_base">
  <meta title="$t:gnuboard7-hello_module.user.memos.index.title"/>
  <!-- 공개 메모 목록(비인증). 페이지·건수를 URL query 에서 받고, 실패 시 fallback 이 빈 목록 + 1페이지 메타를 세운다. -->
  <data-source id="memos" label_key="$t:gnuboard7-hello_module.editor.data_source.memos" type="api" endpoint="/api/modules/gnuboard7-hello_module/memos" method="GET" :auto_fetch="true" :auth_required="false">
    <params page="{{query.page ?? 1}}" per_page="{{query.per_page ?? 10}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="current_page" :value="1"/>
          <field name="last_page" :value="1"/>
          <field name="per_page" :value="10"/>
          <field name="total" :value="0"/>
        </field>
      </field>
    </fallback>
  </data-source>
  <slot name="content">
    <div data-ref="user_memo_wrapper" class="max-w-3xl mx-auto p-6">
      <!-- 사용자 화면은 어느 사용자 템플릿에서나 있는 유틸리티 클래스로 쓴다(관리자 템플릿의 의미 클래스는 사용자 템플릿에 정의가 없다). -->
      <h1 data-ref="user_memo_title" class="text-2xl font-bold text-gray-900 dark:text-white mb-6">$t:gnuboard7-hello_module.user.memos.index.title</h1>
      <!-- 메모가 0건이면 빈 화면 대신 안내 문구를 보인다 -->
      <span data-ref="user_memo_empty" data-if="{{(memos?.data?.data ?? []).length === 0}}" class="block py-8 text-center text-sm text-gray-500 dark:text-gray-400">$t:gnuboard7-hello_module.user.memos.index.empty</span>
      <!-- 반복은 카드에 둔다 — 묶음(space-y-3)에 두면 메모마다 묶음이 새로 생겨 카드 사이 간격이 사라진다. -->
      <div data-ref="user_memo_items" class="space-y-3">
        <div data-ref="user_memo_item_{{idx}}" data-each="memo, idx in {{memos?.data?.data ?? []}}" class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700">
          <h2 class="text-lg font-semibold text-gray-900 dark:text-white">{{memo.title ?? ''}}</h2>
          <span class="block mt-2 text-sm text-gray-600 dark:text-gray-300">{{memo.content ?? ''}}</span>
        </div>
      </div>
    </div>
  </slot>
</layout>
