<!-- 사용자용 메모 목록 화면 — 관리자 목록과 같은 데이터를 비인증 공개 엔드포인트로 받는다. -->
<layout name="user_memo_list" version="1.0.0" extends="_user_base">
  <meta title="$t:gnuboard7-hello_module.user.memos.index.title"/>
  <!-- 공개 메모 목록(비인증). 페이지·건수를 URL query 에서 받고, 실패 시 fallback 이 빈 목록 + 1페이지 메타를 세운다. -->
  <data-source id="memos" label_key="$t:gnuboard7-hello_module.editor.data_source.memos" type="api" endpoint="/api/modules/gnuboard7-hello_module/memos" method="GET" :auto_fetch="true" :auth_required="false">
    <params page="{{query.page}}" per_page="{{query.per_page ?? 10}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="current_page" :value="1"/>
          <field name="last_page" :value="1"/>
          <field name="per_page" :value="10"/>
          <field name="total" :value="0"/>
        </field>
      </field>
    </fallback>
  </data-source>
  <slot name="content">
    <div data-ref="user_memo_wrapper" class="max-w-3xl mx-auto p-6">
      <h1 data-ref="user_memo_title" class="text-page-heading mb-6">$t:gnuboard7-hello_module.user.memos.index.title</h1>
      <div data-ref="user_memo_items_{{idx}}" data-each="memo, idx in {{memos?.data?.data ?? []}}" class="space-y-3">
        <div data-ref="user_memo_item_{{idx}}" class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700">
          <h2 class="section-heading">{{memo.title ?? ''}}</h2>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">{{memo.content ?? ''}}</p>
        </div>
      </div>
    </div>
  </slot>
</layout>
