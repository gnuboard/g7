<!-- 사용자용 메모 목록 화면 — 관리자 목록과 같은 데이터를 비인증 공개 엔드포인트로 받는다. -->
<layout name="user_memo_list" version="1.0.0" extends="_user_base">
  <meta title="$t:gnuboard7-hello_module.user.memos.index.title"/>
  <!-- 공개 메모 목록(비인증). 페이지·건수를 URL query 에서 받고, 실패 시 fallback 이 빈 목록 + 1페이지 메타를 세운다. -->
  <data-source id="memos" label_key="$t:gnuboard7-hello_module.editor.data_source.memos" type="api" endpoint="/api/modules/gnuboard7-hello_module/memos" method="GET" :auto_fetch="true" :auth_required="false">
    <params page="{{query.page ?? 1}}" per_page="{{query.per_page ?? 10}}"/>
    <fallback>
      <field name="data">
        <field name="data" :value="[]"/>
        <field name="meta">
          <field name="current_page" :value="1"/>
          <field name="last_page" :value="1"/>
          <field name="per_page" :value="10"/>
          <field name="total" :value="0"/>
        </field>
      </field>
    </fallback>
  </data-source>
  <slot name="content">
    <!-- 클래스는 모두 이 모듈 CSS(resources/css/main.css)의 hellomodule-* 다. 템플릿 CSS·Tailwind 에 기대지 않으므로 어느 사용자 템플릿에서나 같은 짜임으로 그려진다. -->
    <div data-ref="user_memo_wrapper" class="hellomodule-page">
      <h1 data-ref="user_memo_title" class="hellomodule-page__title">$t:gnuboard7-hello_module.user.memos.index.title</h1>
      <!-- 메모가 0건이면 빈 화면 대신 안내 문구를 보인다 -->
      <span data-ref="user_memo_empty" data-if="{{memos !== undefined &amp;&amp; ((memos?.data?.data ?? []).length === 0)}}" class="hellomodule-empty">$t:gnuboard7-hello_module.user.memos.index.empty</span>
      <!-- 반복은 카드에 둔다 — 묶음(hellomodule-list)에 두면 메모마다 묶음이 새로 생겨 카드 사이 간격이 사라진다. -->
      <div data-ref="user_memo_items" class="hellomodule-list">
        <!-- 메모 한 건은 이 모듈이 제공하는 MemoCard 로 그린다. 템플릿이 이 컴포넌트를 대체하면(Hello 사용자 템플릿) 레이아웃을 고치지 않아도 그 판본이 그려진다. -->
        <gnuboard7-hello_module.memo-card data-type="composite" data-ref="user_memo_item_{{idx}}" data-each="memo, idx in {{memos?.data?.data ?? []}}" title="{{memo.title ?? ''}}" body="{{memo.content ?? ''}}"/>
      </div>
    </div>
  </slot>
</layout>
