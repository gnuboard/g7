<!-- 알림 문안 미리보기 — 편집 창이 서버에서 받아 둔 치환 결과(`preview`)를 그대로 펼쳐 보여주기만 한다. 여기서는 아무것도 보내지 않고 고치지도 않는다 -->
<partial description="게시판 메일 템플릿 미리보기 모달">
  <modal data-type="composite" data-ref="modal_board_notification_template_preview" title="$t:sirsoft-board.admin.settings.notification_definitions.preview_modal.title" size="lg">
    <div data-ref="board_preview_content">
      <div>
        <span class="board-text-table-header">$t:sirsoft-board.admin.settings.notification_definitions.preview_modal.subject_label</span>
        <p class="board-text-primary board:text-base board:font-medium board:bg-gray-50 board:dark:bg-gray-900 board:rounded-md board:px-3">{{_global.board_notification_template_form_modal?.preview?.subject ?? ''}}</p>
      </div>
      <div>
        <span class="board-text-table-header">$t:sirsoft-board.admin.settings.notification_definitions.preview_modal.body_label</span>
        <!-- 미리보기의 HTML 해석 여부는 **그 채널의 편집기 종류**를 따른다. 사이트내 알림은 알림센터가 평문으로 그리는데 여기서만 HTML 로 해석하면, 운영자가 본 문구와 사용자가 받는 문구가 다르다 — 태그가 글자 그대로 보이는 쪽은 사용자다. 채널은 지금 편집 중인 템플릿의 것을 먼저 보고, 없으면 목록 탭과 같은 기준(주소의 channel)으로 떨어진다. -->
        <html-content data-type="composite" content="{{_global.board_notification_template_form_modal?.preview?.body ?? ''}}" isHtml="{{((availableChannels?.data?.channels ?? []).find(c => c.id === (_global.board_notification_template_form_modal?.template?.channel ?? query.channel ?? 'mail'))?.template_editor ?? 'plain') === 'rich'}}" class="{{(availableChannels?.data?.channels ?? []).find(c => c.id === (_global.board_notification_template_form_modal?.template?.channel ?? query.channel ?? 'mail'))?.template_editor === 'rich' ? 'board:prose-p:my-2 board:prose-headings:font-bold board:prose-headings:mt-6 board:prose-headings:mb-4 board:prose-h1:text-2xl board:prose-h2:text-xl board:prose-h3:text-lg board:prose-a:text-blue-600 board:dark:prose-a:text-blue-400 board:prose-a:no-underline board:hover:prose-a:underline board:prose-blockquote:border-l-4 board:prose-blockquote:border-gray-300 board:dark:prose-blockquote:border-gray-600 board:prose-blockquote:pl-4 board:prose-blockquote:italic board:prose-code:bg-gray-100 board:dark:prose-code:bg-gray-800 board:prose-code:px-1 board:prose-code:py-0.5 board:prose-code:rounded board:prose-pre:bg-gray-100 board:dark:prose-pre:bg-gray-800 board:prose-pre:p-4 board:prose-pre:rounded-lg board:prose-pre:overflow-x-auto' : 'board:prose board:dark:prose-invert'}} board:prose-sm board:max-w-none board:border board:border-gray-200 board:dark:border-gray-700 board:rounded-md board:p-4 board:max-h-[400px] board:overflow-y-auto board:bg-white board:dark:bg-gray-900"/>
      </div>
      <div class="board:flex board:justify-end board:border-t board:border-gray-200 board:dark:border-gray-700">
        <button data-ref="board_btn_close_preview" type="button" class="board-text-body board:px-4 board:py-2 board:rounded-md board:border board:border-gray-300 board:dark:border-gray-600 board:hover:bg-gray-50 board:dark:hover:bg-gray-700 board:transition-colors">
          <on type="click">
            <close-modal target="modal_board_notification_template_preview"/>
          </on>
          $t:common.close
        </button>
      </div>
    </div>
  </modal>
</partial>
