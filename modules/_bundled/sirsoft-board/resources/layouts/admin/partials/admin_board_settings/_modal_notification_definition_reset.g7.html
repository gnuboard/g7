<!-- 알림 정의를 처음 상태로 되돌리는 확인 창 — 손으로 고쳐 둔 문안이 사라지므로 어느 정의인지(`resetTargetName`)를 이름으로 먼저 보여주고 경고를 함께 세운다 -->
<partial description="게시판 알림 정의 기본값 복원 확인 모달 (스피너 포함)">
  <modal data-type="composite" data-ref="modal_board_notification_definition_reset" title="$t:sirsoft-board.admin.settings.notification_definitions.reset_modal.title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:sirsoft-board.admin.settings.notification_definitions.reset_modal.confirm_message</p>
    <div class="mt-4 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
      <span class="form-sub-label">$t:sirsoft-board.admin.settings.notification_definitions.reset_modal.target_label</span>
      <span class="text-primary font-medium">{{_global.resetTargetName ?? ''}}</span>
    </div>
    <div class="alert-danger">
      <p class="text-error-soft">$t:sirsoft-board.admin.settings.notification_definitions.reset_modal.warning_message</p>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <close-modal target="modal_board_notification_definition_reset"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-orange-600 dark:bg-orange-500 text-white rounded-lg hover:bg-orange-700 dark:hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <!-- 복원 실행 — 성공하면 대상 id·이름을 함께 비워 다음에 열릴 때 지난 대상이 남지 않게 하고, 목록을 다시 읽어 되돌아간 문안을 보여준다 -->
          <sequence>
            <set-state target="global" :isResettingNotification="true"/>
            <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.resetTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :isResettingNotification="false" :resetTargetId="null" resetTargetName=""/>
                <refetch-data-source dataSourceId="boardNotificationDefinitions"/>
                <toast type="success" message="$t:sirsoft-board.admin.settings.notification_definitions.reset_success"/>
                <close-modal target="modal_board_notification_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :isResettingNotification="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-board.admin.settings.notification_definitions.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingNotification}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isResettingNotification ? '$t:sirsoft-board.admin.settings.notification_definitions.reset_modal.btn_confirming' : '$t:sirsoft-board.admin.settings.notification_definitions.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
