<!-- 본인인증 정책 삭제 확인 — 지울 대상은 목록에서 담아 둔 `_global.boardIdentityPolicyDeleteId` 다. 문구는 코어 것을 그대로 쓰고, API 는 게시판 모듈 경로다(정책 표는 코어 소유이고 게시판은 그중 자기 몫만 게시판 권한으로 다룬다). 수정 권한이 없으면(목록 abilities.can_delete) [삭제]가 잠긴다 -->
<partial description="게시판 본인인증 정책 삭제 확인 모달">
  <modal data-type="composite" data-ref="board_identity_policy_delete_modal" title="$t:admin.identity.policies.delete_title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:admin.identity.policies.delete_confirm</p>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.boardIdentityPolicyDeleting}}">
        <on type="click">
          <close-modal target="board_identity_policy_delete_modal"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.boardIdentityPolicyDeleting || boardIdentityPolicies?.data?.abilities?.can_delete !== true}}">
        <on type="click">
          <!-- 삭제 실행 — 성공하면 대상 id 까지 함께 비워, 창이 다시 열렸을 때 지워진 정책을 가리키지 않게 한다. 목록은 다시 읽어 사라진 줄을 반영한다 -->
          <sequence>
            <set-state target="global" :boardIdentityPolicyDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-board/admin/identity-policies/{{_global.boardIdentityPolicyDeleteId}}" method="DELETE">
              <success>
                <set-state target="global" :boardIdentityPolicyDeleting="false" :boardIdentityPolicyDeleteId="null"/>
                <toast type="success" message="$t:admin.identity.policies.delete_success"/>
                <refetch-data-source dataSourceId="boardIdentityPolicies"/>
                <close-modal target="board_identity_policy_delete_modal"/>
              </success>
              <fail>
                <set-state target="global" :boardIdentityPolicyDeleting="false"/>
                <toast type="error" message="{{error.message ?? '$t:admin.identity.policies.delete_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.boardIdentityPolicyDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.boardIdentityPolicyDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
