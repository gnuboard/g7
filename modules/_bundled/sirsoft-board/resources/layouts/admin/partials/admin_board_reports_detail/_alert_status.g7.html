<partial description="Status Stats Grid and Alert Box with Dynamic Actions for Admin Report Detail View">
  <div data-ref="status_wrapper" data-if="{{report_detail?.data}}" class="mb-6">
    <div data-ref="status_alert" class="px-6 py-4 border rounded-lg {{report_detail?.data?.status === 'pending' || report_detail?.data?.status === 'review' || report_detail?.data?.status === 'rejected' || report_detail?.data?.status === 'suspended' || report_detail?.data?.status === 'deleted' ? 'flex flex-row items-end justify-between gap-4' : ''}} {{report_detail?.data?.status === 'pending' ? 'bg-yellow-50 dark:bg-yellow-900 border-yellow-300 dark:border-yellow-800' : report_detail?.data?.status === 'review' ? 'bg-blue-50 dark:bg-blue-900 border-blue-300 dark:border-blue-800' : report_detail?.data?.status === 'rejected' ? 'bg-purple-50 dark:bg-purple-900 border-purple-200 dark:border-purple-700' : report_detail?.data?.status === 'deleted' ? 'bg-gray-200 dark:bg-gray-700 border-gray-400 dark:border-gray-600' : 'bg-red-50 dark:bg-red-900 border-red-300 dark:border-red-800'}}">
      <responsive on="portable" class="px-6 py-4 border rounded-lg {{report_detail?.data?.status === 'pending' || report_detail?.data?.status === 'review' || report_detail?.data?.status === 'rejected' || report_detail?.data?.status === 'suspended' || report_detail?.data?.status === 'deleted' ? 'row-stack' : ''}} {{report_detail?.data?.status === 'pending' ? 'bg-yellow-50 dark:bg-yellow-900 border-yellow-300 dark:border-yellow-800' : report_detail?.data?.status === 'review' ? 'bg-blue-50 dark:bg-blue-900 border-blue-300 dark:border-blue-800' : report_detail?.data?.status === 'rejected' ? 'bg-purple-50 dark:bg-purple-900 border-purple-200 dark:border-purple-700' : report_detail?.data?.status === 'deleted' ? 'bg-gray-200 dark:bg-gray-700 border-gray-400 dark:border-gray-600' : 'bg-red-50 dark:bg-red-900 border-red-300 dark:border-red-800'}}"/>
      <div class="{{report_detail?.data?.status === 'pending' || report_detail?.data?.status === 'review' || report_detail?.data?.status === 'rejected' || report_detail?.data?.status === 'suspended' ? 'flex items-start gap-3 flex-1' : 'flex items-start gap-3'}}">
        <div>
          <div class="flex-center gap-2 mb-1">
            <icon data-if="{{report_detail?.data?.status === 'pending'}}" name="exclamation-circle" class="w-5 h-5 text-yellow-600 dark:text-yellow-400"/>
            <icon data-if="{{report_detail?.data?.status === 'review'}}" name="clock" class="w-5 h-5 {{report_detail?.data?.status === 'review' ? 'text-blue-600 dark:text-blue-400' : ''}}"/>
            <icon data-if="{{report_detail?.data?.status === 'rejected'}}" name="times-circle" class="w-5 h-5 text-purple-600 dark:text-purple-400"/>
            <icon data-if="{{report_detail?.data?.status === 'suspended'}}" name="exclamation-triangle" class="w-5 h-5 {{report_detail?.data?.status === 'suspended' ? 'text-red-600 dark:text-red-400' : ''}}"/>
            <icon data-if="{{report_detail?.data?.status === 'deleted'}}" name="ban" class="w-5 h-5 text-gray-700 dark:text-gray-300"/>
            <h3 class="font-semibold text-base {{report_detail?.data?.status === 'pending' ? 'text-warning-soft' : report_detail?.data?.status === 'review' ? 'text-info-soft' : report_detail?.data?.status === 'rejected' ? 'text-purple-700 dark:text-purple-200' : report_detail?.data?.status === 'deleted' ? 'text-gray-900 dark:text-gray-300' : 'text-danger-soft'}}"><responsive on="portable" class="font-semibold text-sm {{report_detail?.data?.status === 'pending' ? 'text-warning-soft' : report_detail?.data?.status === 'review' ? 'text-info-soft' : report_detail?.data?.status === 'rejected' ? 'text-purple-700 dark:text-purple-200' : report_detail?.data?.status === 'deleted' ? 'text-gray-900 dark:text-gray-300' : 'text-danger-soft'}}"/>$t:sirsoft-board.admin.reports.detail.alert_title_{{report_detail?.data?.status}}</h3>
          </div>
          <p class="text-sm {{report_detail?.data?.status === 'pending' ? 'text-yellow-600 dark:text-yellow-400' : report_detail?.data?.status === 'review' ? 'text-blue-600 dark:text-blue-400' : report_detail?.data?.status === 'rejected' ? 'text-purple-600 dark:text-purple-400' : report_detail?.data?.status === 'deleted' ? 'text-gray-600 dark:text-gray-400' : 'text-red-600 dark:text-red-400'}}"><responsive on="portable" class="text-xs {{report_detail?.data?.status === 'pending' ? 'text-yellow-600 dark:text-yellow-400' : report_detail?.data?.status === 'review' ? 'text-blue-600 dark:text-blue-400' : report_detail?.data?.status === 'rejected' ? 'text-purple-600 dark:text-purple-400' : report_detail?.data?.status === 'deleted' ? 'text-gray-600 dark:text-gray-400' : 'text-red-600 dark:text-red-400'}}"/>$t:sirsoft-board.admin.reports.detail.alert_message_{{report_detail?.data?.status}}</p>
        </div>
      </div>
      <div data-if="{{report_detail?.data?.available_actions?.length > 0}}" class="flex flex-wrap gap-2 items-end">
        <button data-if="{{report_detail?.data?.available_actions?.includes('pending') &amp;&amp; report_detail?.data?.status !== 'rejected' &amp;&amp; report_detail?.data?.status !== 'suspended'}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="flex-center gap-2 px-3 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <responsive on="portable" class="flex-center gap-2 px-3 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 text-xs font-medium transition-colors"/>
          <on type="click">
            <set-state target="global" actionType="pending" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="chevron-left" class="w-4 h-4">
            <responsive on="portable" name="chevron-left" class="w-3.5 h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.back_to_pending</span>
        </button>
        <button data-if="{{report_detail?.data?.available_actions?.includes('review')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="flex-center gap-2 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <responsive on="portable" class="flex-center gap-2 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-xs font-medium transition-colors"/>
          <on type="click">
            <set-state target="global" actionType="review" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="{{report_detail?.data?.status === 'pending' ? 'check-circle' : 'clock'}}" class="w-4 h-4">
            <responsive on="portable" name="{{report_detail?.data?.status === 'pending' ? 'check-circle' : 'clock'}}" class="w-3.5 h-3.5"/>
          </icon>
          <span>{{report_detail?.data?.status === 'pending' ? '$t:sirsoft-board.admin.reports.detail.actions.start_review' : '$t:sirsoft-board.admin.reports.detail.actions.re_review'}}</span>
        </button>
        <button data-if="{{report_detail?.data?.available_actions?.includes('rejected')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="flex-center gap-2 px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <responsive on="portable" class="flex-center gap-2 px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-xs font-medium transition-colors"/>
          <on type="click">
            <set-state target="global" actionType="rejected" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="times-circle" class="w-4 h-4">
            <responsive on="portable" name="times-circle" class="w-3.5 h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.reject</span>
        </button>
        <button data-if="{{report_detail?.data?.available_actions?.includes('suspended')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="flex-center gap-2 px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <responsive on="portable" class="flex-center gap-2 px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-xs font-medium transition-colors"/>
          <on type="click">
            <set-state target="global" actionType="suspended" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="exclamation-triangle" class="w-4 h-4">
            <responsive on="portable" name="exclamation-triangle" class="w-3.5 h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.suspend</span>
        </button>
        <button data-if="{{report_detail?.data?.available_actions?.includes('deleted')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="flex-center gap-2 px-3 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <responsive on="portable" class="flex-center gap-2 px-3 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-xs font-medium transition-colors"/>
          <on type="click">
            <set-state target="global" actionType="deleted" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="trash" class="w-4 h-4">
            <responsive on="portable" name="trash" class="w-3.5 h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.delete</span>
        </button>
      </div>
    </div>
  </div>
</partial>
