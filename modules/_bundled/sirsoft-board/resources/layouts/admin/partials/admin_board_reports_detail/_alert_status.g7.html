<!-- 신고 상세 맨 위의 상태 배너와 조치 버튼들. 색·아이콘·문구가 전부 현재 상태 하나에서 갈리고, 버튼은 «서버가 허용한 것»(`available_actions`)만 선다 — 어떤 전환이 가능한지를 화면이 스스로 판단하지 않는다. 각 버튼은 갈래를 전역에 적어 두고 부모 화면의 확인 모달을 여는 두 단으로 되어 있다 -->
<partial description="Status Stats Grid and Alert Box with Dynamic Actions for Admin Report Detail View">
  <div data-ref="status_wrapper" data-if="{{report_detail?.data}}" class="board:mb-6">
    <div data-ref="status_alert" class="board:px-6 board:py-4 board:border board:rounded-lg {{report_detail?.data?.status === 'pending' || report_detail?.data?.status === 'review' || report_detail?.data?.status === 'rejected' || report_detail?.data?.status === 'suspended' || report_detail?.data?.status === 'deleted' ? 'board:flex board:flex-row board:items-end board:justify-between board:gap-4' : ''}} {{report_detail?.data?.status === 'pending' ? 'board:bg-yellow-50 board:dark:bg-yellow-900 board:border-yellow-300 board:dark:border-yellow-800' : report_detail?.data?.status === 'review' ? 'board:bg-blue-50 board:dark:bg-blue-900 board:border-blue-300 board:dark:border-blue-800' : report_detail?.data?.status === 'rejected' ? 'board:bg-purple-50 board:dark:bg-purple-900 board:border-purple-200 board:dark:border-purple-700' : report_detail?.data?.status === 'deleted' ? 'board:bg-gray-200 board:dark:bg-gray-700 board:border-gray-400 board:dark:border-gray-600' : 'board:bg-red-50 board:dark:bg-red-900 board:border-red-300 board:dark:border-red-800'}}">
      <responsive on="portable" class="board:px-6 board:py-4 board:border board:rounded-lg {{report_detail?.data?.status === 'pending' || report_detail?.data?.status === 'review' || report_detail?.data?.status === 'rejected' || report_detail?.data?.status === 'suspended' || report_detail?.data?.status === 'deleted' ? 'board-row-stack' : ''}} {{report_detail?.data?.status === 'pending' ? 'board:bg-yellow-50 board:dark:bg-yellow-900 board:border-yellow-300 board:dark:border-yellow-800' : report_detail?.data?.status === 'review' ? 'board:bg-blue-50 board:dark:bg-blue-900 board:border-blue-300 board:dark:border-blue-800' : report_detail?.data?.status === 'rejected' ? 'board:bg-purple-50 board:dark:bg-purple-900 board:border-purple-200 board:dark:border-purple-700' : report_detail?.data?.status === 'deleted' ? 'board:bg-gray-200 board:dark:bg-gray-700 board:border-gray-400 board:dark:border-gray-600' : 'board:bg-red-50 board:dark:bg-red-900 board:border-red-300 board:dark:border-red-800'}}"/>
      <div class="{{report_detail?.data?.status === 'pending' || report_detail?.data?.status === 'review' || report_detail?.data?.status === 'rejected' || report_detail?.data?.status === 'suspended' ? 'board:flex board:items-start board:gap-3 board:flex-1' : 'board:flex board:items-start board:gap-3'}}">
        <div>
          <div class="board-flex-center board:gap-2 board:mb-1">
            <icon data-if="{{report_detail?.data?.status === 'pending'}}" name="exclamation-circle" class="board:text-xl board:text-yellow-700 board:dark:text-yellow-400"/>
            <icon data-if="{{report_detail?.data?.status === 'review'}}" name="clock" class="board:text-xl {{report_detail?.data?.status === 'review' ? 'board:text-blue-600 board:dark:text-blue-400' : ''}}"/>
            <icon data-if="{{report_detail?.data?.status === 'rejected'}}" name="times-circle" class="board:text-xl board:text-purple-600 board:dark:text-purple-400"/>
            <icon data-if="{{report_detail?.data?.status === 'suspended'}}" name="exclamation-triangle" class="board:text-xl {{report_detail?.data?.status === 'suspended' ? 'board:text-red-600 board:dark:text-red-400' : ''}}"/>
            <icon data-if="{{report_detail?.data?.status === 'deleted'}}" name="ban" class="board:text-xl board:text-gray-700 board:dark:text-gray-300"/>
            <h3 class="board:font-semibold board:text-base {{report_detail?.data?.status === 'pending' ? 'board-tone-warning' : report_detail?.data?.status === 'review' ? 'board-tone-info' : report_detail?.data?.status === 'rejected' ? 'board:text-purple-700 board:dark:text-purple-200' : report_detail?.data?.status === 'deleted' ? 'board:text-gray-900 board:dark:text-gray-300' : 'board-tone-danger'}}">
              <responsive on="portable" class="board:font-semibold board:text-sm {{report_detail?.data?.status === 'pending' ? 'board-tone-warning' : report_detail?.data?.status === 'review' ? 'board-tone-info' : report_detail?.data?.status === 'rejected' ? 'board:text-purple-700 board:dark:text-purple-200' : report_detail?.data?.status === 'deleted' ? 'board:text-gray-900 board:dark:text-gray-300' : 'board-tone-danger'}}"/>
              $t:sirsoft-board.admin.reports.detail.alert_title_{{report_detail?.data?.status}}
            </h3>
          </div>
          <p class="board:text-sm {{report_detail?.data?.status === 'pending' ? 'board:text-yellow-800 board:dark:text-yellow-400' : report_detail?.data?.status === 'review' ? 'board:text-blue-700 board:dark:text-blue-300' : report_detail?.data?.status === 'rejected' ? 'board:text-purple-700 board:dark:text-purple-300' : report_detail?.data?.status === 'deleted' ? 'board:text-gray-600 board:dark:text-gray-300' : 'board:text-red-700 board:dark:text-red-300'}}">
            <responsive on="portable" class="board:text-xs {{report_detail?.data?.status === 'pending' ? 'board:text-yellow-800 board:dark:text-yellow-400' : report_detail?.data?.status === 'review' ? 'board:text-blue-700 board:dark:text-blue-300' : report_detail?.data?.status === 'rejected' ? 'board:text-purple-700 board:dark:text-purple-300' : report_detail?.data?.status === 'deleted' ? 'board:text-gray-600 board:dark:text-gray-300' : 'board:text-red-700 board:dark:text-red-300'}}"/>
            $t:sirsoft-board.admin.reports.detail.alert_message_{{report_detail?.data?.status}}
          </p>
        </div>
      </div>
      <div data-if="{{report_detail?.data?.available_actions?.length > 0}}" class="board:flex board:flex-wrap board:gap-2 board:items-end">
        <button type="button" data-if="{{report_detail?.data?.available_actions?.includes('pending') &amp;&amp; report_detail?.data?.status !== 'rejected' &amp;&amp; report_detail?.data?.status !== 'suspended'}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-yellow-700 board:dark:bg-yellow-700 board:text-white board:rounded-lg board:hover:bg-yellow-800 board:dark:hover:bg-yellow-800 board:text-sm board:font-medium board:transition-colors board:disabled:opacity-50 board:disabled:cursor-not-allowed">
          <responsive on="portable" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-yellow-700 board:dark:bg-yellow-700 board:text-white board:rounded-lg board:hover:bg-yellow-800 board:dark:hover:bg-yellow-800 board:text-xs board:font-medium board:transition-colors"/>
          <on type="click">
            <!-- 「대기로 되돌리기」 — 서버가 허용해도 기각·정지 상태에서는 이 버튼을 감춘다(결론이 난 건을 손대지 않은 상태로 되돌리는 길은 열어 두지 않는다). 직전 사유는 비워 다음 창에 묻어오지 않게 한다 -->
            <set-state target="global" actionType="pending" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="chevron-left" class="board:text-base">
            <responsive on="portable" name="chevron-left" class="board:w-3.5 board:h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.back_to_pending</span>
        </button>
        <button type="button" data-if="{{report_detail?.data?.available_actions?.includes('review')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-blue-600 board:dark:bg-blue-600 board:text-white board:rounded-lg board:hover:bg-blue-700 board:dark:hover:bg-blue-700 board:text-sm board:font-medium board:transition-colors board:disabled:opacity-50 board:disabled:cursor-not-allowed">
          <responsive on="portable" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-blue-600 board:dark:bg-blue-600 board:text-white board:rounded-lg board:hover:bg-blue-700 board:dark:hover:bg-blue-700 board:text-xs board:font-medium board:transition-colors"/>
          <on type="click">
            <!-- 「검토 시작」 또는 「재검토」 — 같은 전환이지만 지금이 대기 상태인지에 따라 아이콘과 글자가 갈린다 -->
            <set-state target="global" actionType="review" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="{{report_detail?.data?.status === 'pending' ? 'check-circle' : 'clock'}}" class="board:text-base">
            <responsive on="portable" name="{{report_detail?.data?.status === 'pending' ? 'check-circle' : 'clock'}}" class="board:w-3.5 board:h-3.5"/>
          </icon>
          <span>{{report_detail?.data?.status === 'pending' ? '$t:sirsoft-board.admin.reports.detail.actions.start_review' : '$t:sirsoft-board.admin.reports.detail.actions.re_review'}}</span>
        </button>
        <button type="button" data-if="{{report_detail?.data?.available_actions?.includes('rejected')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-purple-600 board:dark:bg-purple-600 board:text-white board:rounded-lg board:hover:bg-purple-700 board:dark:hover:bg-purple-700 board:text-sm board:font-medium board:transition-colors board:disabled:opacity-50 board:disabled:cursor-not-allowed">
          <responsive on="portable" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-purple-600 board:dark:bg-purple-600 board:text-white board:rounded-lg board:hover:bg-purple-700 board:dark:hover:bg-purple-700 board:text-xs board:font-medium board:transition-colors"/>
          <on type="click">
            <!-- 「기각」 — 신고를 받아들이지 않는다. 대상이 이미 가려져 있었다면 다시 공개되므로 확인 창이 그 사실을 따로 알린다 -->
            <set-state target="global" actionType="rejected" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="times-circle" class="board:text-base">
            <responsive on="portable" name="times-circle" class="board:w-3.5 board:h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.reject</span>
        </button>
        <button type="button" data-if="{{report_detail?.data?.available_actions?.includes('suspended')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-red-600 board:dark:bg-red-600 board:text-white board:rounded-lg board:hover:bg-red-700 board:dark:hover:bg-red-700 board:text-sm board:font-medium board:transition-colors board:disabled:opacity-50 board:disabled:cursor-not-allowed">
          <responsive on="portable" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-red-600 board:dark:bg-red-600 board:text-white board:rounded-lg board:hover:bg-red-700 board:dark:hover:bg-red-700 board:text-xs board:font-medium board:transition-colors"/>
          <on type="click">
            <!-- 「정지」 — 신고를 받아들여 대상 글·댓글을 가린다. 글 자체는 남는다 -->
            <set-state target="global" actionType="suspended" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="exclamation-triangle" class="board:text-base">
            <responsive on="portable" name="exclamation-triangle" class="board:w-3.5 board:h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.suspend</span>
        </button>
        <button type="button" data-if="{{report_detail?.data?.available_actions?.includes('deleted')}}" disabled="{{report_detail?.data?.abilities?.can_manage !== true}}" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-gray-800 board:text-white board:rounded-lg board:hover:bg-gray-900 board:dark:bg-gray-700 board:dark:hover:bg-gray-600 board:text-sm board:font-medium board:transition-colors board:disabled:opacity-50 board:disabled:cursor-not-allowed">
          <responsive on="portable" class="board-flex-center board:gap-2 board:px-3 board:py-2 board:bg-gray-800 board:text-white board:rounded-lg board:hover:bg-gray-900 board:dark:bg-gray-700 board:dark:hover:bg-gray-600 board:text-xs board:font-medium board:transition-colors"/>
          <on type="click">
            <!-- 「삭제」 — 다섯 갈래 중 유일하게 대상을 지우는 쪽이라 되돌릴 수 없다 -->
            <set-state target="global" actionType="deleted" actionReason=""/>
          </on>
          <on type="click">
            <open-modal target="status_action_modal"/>
          </on>
          <icon name="trash" class="board:text-base">
            <responsive on="portable" name="trash" class="board:w-3.5 board:h-3.5"/>
          </icon>
          <span>$t:sirsoft-board.admin.reports.detail.actions.delete</span>
        </button>
      </div>
    </div>
  </div>
</partial>
