<!-- 글 작성 폼의 입력 칸 전부(글쓴이·분류·제목·본문과 공지·비밀 같은 스위치)를 한 카드에 담는다. 본문 편집기는 확장점이라 위지윅 플러그인이 깔려 있으면 그것으로 갈리고, 없으면 기본 편집기가 선다 -->
<partial description="Post Form - All Form Fields in One Card">
  <div data-ref="post_form_fields">
    <div data-ref="main_form_card" class="board-admin-card">
      <div class="board-row-stack">
        <div data-ref="author_section" data-if="{{route?.id &amp;&amp; form_meta?.data?.author}}" class="">
          <div class="board:grid board:grid-cols-1 board:gap-4">
            <responsive on="768-" class="board:grid board:grid-cols-2 board:gap-4"/>
            <div data-ref="field_author_name">
              <label class="board-text-label-subtle board:block board:font-medium board:mb-1">$t:sirsoft-board.admin.posts.form.author_info</label>
              <div class="board-flex-center board:gap-2">
                <span class="board-text-heading">{{form_meta?.data?.author?.email ? form_meta.data.author.name + ' (' + form_meta.data.author.email + ')' : form_meta?.data?.author?.name}}</span>
                <span data-if="{{form_meta?.data?.author?.is_guest}}" class="board:inline-flex board:items-center board:px-2 board:py-0.5 board:rounded board:text-xs board:font-medium board:bg-gray-100 board:text-gray-700 board:dark:bg-gray-700 board:dark:text-gray-300">$t:sirsoft-board.admin.posts.guest</span>
              </div>
            </div>
            <div data-ref="field_created_at">
              <label class="board-text-label-subtle board:block board:font-medium board:mb-1">$t:sirsoft-board.admin.posts.form.created_at</label>
              <div class="board-flex-center board:gap-2 board-text-heading">
                <span>{{form_meta?.data?.created_at}}</span>
              </div>
            </div>
          </div>
        </div>
        <div data-ref="post_options_section" data-if="{{form_meta?.data?.board?.user_abilities?.can_write_notice || form_meta?.data?.board?.secret_mode !== 'disabled'}}" class="">
          <h3 class="board-text-label-subtle board:font-medium board:mb-3">$t:sirsoft-board.admin.posts.form.post_options</h3>
          <div class="board:grid board:grid-cols-1 board:gap-4">
            <responsive on="768-" class="board:grid board:grid-cols-2 board:gap-4"/>
            <label data-ref="notice_card" data-if="{{!_local.form?.parent_id}}" disabled="{{_computed.isReadOnly || !form_meta?.data?.board?.user_abilities?.can_write_notice}}" class="board:bg-gray-50 board:dark:bg-gray-800 board:rounded-lg board:p-4 board:border board:border-gray-200 board:dark:border-gray-700 board:cursor-pointer board:hover:border-blue-400 board:dark:hover:border-blue-600 board:transition-colors">
              <div class="board-flex-start board:gap-3">
                <input type="checkbox" name="is_notice" disabled="{{_computed.isReadOnly || !form_meta?.data?.board?.user_abilities?.can_write_notice}}" class="board:mt-0.5 board:w-4 board:h-4 board:text-blue-600 board:dark:text-blue-400 board:rounded board:dark:focus:ring-blue-600 board:dark:ring-offset-gray-800"/>
                <div class="board:flex-1">
                  <div class="board-flex-center board:gap-2 board:mb-1">
                    <icon name="bullhorn" class="board:text-base board:text-blue-600 board:dark:text-blue-400"/>
                    <span class="board-text-primary board:text-sm board:font-semibold">$t:sirsoft-board.admin.posts.form.is_notice</span>
                  </div>
                  <p class="board-text-tertiary">$t:sirsoft-board.admin.posts.form.notice_description</p>
                </div>
              </div>
            </label>
            <label data-ref="secret_card" data-if="{{form_meta?.data?.board?.secret_mode !== 'disabled'}}" class="board:bg-gray-50 board:dark:bg-gray-800 board:rounded-lg board:p-4 board:border board:border-gray-200 board:dark:border-gray-700 board:cursor-pointer board-secret-card board:transition-colors">
              <div class="board-flex-start board:gap-3">
                <input type="checkbox" name="is_secret" disabled="{{_computed.isReadOnly || form_meta?.data?.board?.secret_mode === 'always'}}" class="board:mt-0.5 board:w-4 board:h-4 board:text-amber-600 board:rounded board:focus:ring-amber-500 board:dark:focus:ring-amber-600 board:dark:ring-offset-gray-800 board:disabled:opacity-50 board:disabled:cursor-not-allowed"/>
                <div class="board:flex-1">
                  <div class="board-flex-center board:gap-2 board:mb-1">
                    <icon name="lock" class="board:text-base board:text-amber-600 board:dark:text-amber-400"/>
                    <span class="board-text-primary board:text-sm board:font-semibold">$t:sirsoft-board.admin.posts.form.is_secret</span>
                  </div>
                  <p class="board-text-tertiary">$t:sirsoft-board.admin.posts.form.secret_description</p>
                </div>
              </div>
            </label>
          </div>
        </div>
      </div>
      <div data-ref="category_section" data-if="{{form_meta?.data?.board?.categories &amp;&amp; form_meta.data.board.categories.length > 0}}" class="board:pb-6">
        <label class="board-form-label">$t:sirsoft-board.admin.posts.form.category</label>
        <select name="category" aria-label="$t:sirsoft-board.admin.posts.form.category" value="{{_local.form?.category ?? ''}}" options="{{[{ value: '', label: $t('sirsoft-board.admin.posts.form.select_category') }].concat((form_meta?.data?.board?.categories ?? []).map(category => ({ value: category, label: category })))}}" disabled="{{_computed.isReadOnly || !!_local.form?.parent_id}}" class="board:block board:w-full board:rounded-lg board:border board:border-gray-300 board:dark:border-gray-600 board:bg-white board:dark:bg-gray-800 board:px-3 board:py-2 board:focus:border-blue-500 board:focus:outline-none board:focus:ring-1 board:focus:ring-blue-500 board:dark:focus:ring-blue-400 board:disabled:opacity-50 board:disabled:cursor-not-allowed">
          <responsive on="640-" class="board:block board:w-64 board:rounded-lg board:border board:border-gray-300 board:dark:border-gray-600 board:bg-white board:dark:bg-gray-800 board:px-3 board:py-2 board:focus:border-blue-500 board:focus:outline-none board:focus:ring-1 board:focus:ring-blue-500 board:dark:focus:ring-blue-400 board:disabled:opacity-50 board:disabled:cursor-not-allowed"/>
        </select>
      </div>
      <div class="board-row-stack">
        <div data-ref="title_section" class="">
          <div>
            <label class="board-text-label-subtle board:block board:font-medium">$t:sirsoft-board.admin.posts.form.title</label>
            <input type="text" name="title" value="{{_local.form?.title ?? ''}}" disabled="{{_computed.isReadOnly}}" placeholder="$t:sirsoft-board.admin.posts.form.title_placeholder" class="board:block board:focus:ring-1 board:dark:focus:ring-blue-400"/>
          </div>
        </div>
        <!-- 편집기는 처음 세워질 때의 업로드 계약만 쓴다 — 계약을 담은 소스(표준 계약 엔드포인트 content_media_target, #887)와 form_meta 를 받기(실패 포함) 전에는 세우지 않는다(#883 실측: 먼저 서면 업로드 단추가 끝내 생기지 않음) -->
        <extension-point name="html_editor" data-if="{{form_meta !== undefined &amp;&amp; content_media_target !== undefined}}" data-ref="content_section" mediaUpload="{{content_media_target?.data ? Object.assign({}, content_media_target.data, { fields: Object.assign({}, content_media_target.data.fields ?? {}, { temp_key: _local.tempKey }) }) : null}}" placeholder="$t:sirsoft-board.admin.posts.form.content_placeholder" label="$t:sirsoft-board.admin.posts.form.content" :rows="15" :showHtmlModeToggle="true">
          <prop name="name">"content"</prop>
          <default>
            <html-editor data-type="composite" name="content" content="{{_local.form?.content ?? ''}}" isHtml="{{(_local.form?.content_mode ?? 'text') === 'html'}}" disabled="{{_computed.isReadOnly}}" readOnly="{{_computed.isReadOnly}}" :rows="15" placeholder="$t:sirsoft-board.admin.posts.form.content_placeholder" label="$t:sirsoft-board.admin.posts.form.content" :showHtmlModeToggle="true">
              <on type="change" event="onChange">
                <!-- 본문 글자를 담는다 — 편집기는 폼 자동 바인딩을 타지 않아 여기서 직접 넣고, 「변경 있음」도 함께 켠다 -->
                <set-state target="local" :hasChanges="true">
                  <field name="form">
                    <field name="content" value="{{$args[0].target.value}}"/>
                  </field>
                </set-state>
              </on>
              <on type="change" event="onIsHtmlChange">
                <!-- HTML 모드 토글 — 글자와 따로 저장되는 값이라 이벤트도 따로 받는다. 켜짐/꺼짐(boolean)을 그대로 두지 않고 `html`·`text` 문자열로 바꿔 담는 것은 서버가 그 두 값으로 본문 해석을 가르기 때문이다 -->
                <set-state target="local" :hasChanges="true">
                  <field name="form">
                    <field name="content_mode" value="{{$args[0].target.checked ? 'html' : 'text'}}"/>
                  </field>
                </set-state>
              </on>
            </html-editor>
          </default>
        </extension-point>
      </div>
    </div>
  </div>
</partial>
