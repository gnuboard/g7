<!-- 대시보드 퀵메뉴에 게시판 관리·신고 관리 두 타일을 덧붙인다. 타일마다 옮겨 갈 화면의 진입 권한을 걸어 권한이 없으면 그리지 않는다(눌러도 403 화면뿐). 타일 순서는 `priority` 오름차순이라 숫자가 작을수록 앞이고, 50 은 이커머스 타일(40)보다 뒤에 선다 -->
<extension extension-point="admin_dashboard_quick_menu" mode="append" priority="50">
  <a data-ref="qm_boards" href="/admin/boards" class="board:flex board:items-center board:flex-col board:justify-center board:gap-1 board:w-16 board:h-16 board:md:w-20 board:md:h-20 board:text-[10px] board:md:text-xs board:font-medium board:rounded-xl board:bg-slate-100 board:dark:bg-slate-700 board:text-slate-600 board:dark:text-slate-300 board:hover:bg-slate-700 board:hover:text-white board:dark:hover:bg-slate-200 board:dark:hover:text-slate-800 board:hover:-translate-y-0.5 board:focus:outline-none board:focus:ring-2 board:focus:ring-slate-400 board:dark:focus:ring-slate-500 board:transition-all board:duration-200">
    <permissions>
      <permission>sirsoft-board.boards.read</permission>
    </permissions>
    <icon name="clipboard-list" class="board:text-lg board:md:text-xl"/>
    <span class="board:text-center board:leading-tight">$t:sirsoft-board.admin.dashboard.quick_menu.boards</span>
  </a>
  <a data-ref="qm_reports" href="/admin/boards/reports" class="board:flex board:items-center board:flex-col board:justify-center board:gap-1 board:w-16 board:h-16 board:md:w-20 board:md:h-20 board:text-[10px] board:md:text-xs board:font-medium board:rounded-xl board:bg-slate-100 board:dark:bg-slate-700 board:text-slate-600 board:dark:text-slate-300 board:hover:bg-slate-700 board:hover:text-white board:dark:hover:bg-slate-200 board:dark:hover:text-slate-800 board:hover:-translate-y-0.5 board:focus:outline-none board:focus:ring-2 board:focus:ring-slate-400 board:dark:focus:ring-slate-500 board:transition-all board:duration-200">
    <permissions>
      <permission>sirsoft-board.reports.view</permission>
    </permissions>
    <icon name="flag" class="board:text-lg board:md:text-xl"/>
    <span class="board:text-center board:leading-tight">$t:sirsoft-board.admin.dashboard.quick_menu.reports</span>
  </a>
</extension>
