<!-- 이커머스 설정의 「문의 게시판」 자리를 게시판 모듈이 통째로 대체한다(mode=replace) — 게시판이 설치돼 있을 때만 실제 게시판 목록에서 고르게 하고, 고른 게시판으로 바로 넘어가는 경로까지 함께 준다 -->
<extension extension-point="inquiry_board_setting" mode="replace" priority="100">
  <div data-ref="inquiry_board_setting_active" class="board:space-y-4">
    <p data-ref="inquiry_board_setting_description" class="board:text-sm board:text-gray-700 board:dark:text-gray-300">$t:sirsoft-board.admin.ecommerce_settings.inquiry.description</p>
    <div data-ref="inquiry_board_field" class="board:flex board:flex-col board:gap-2">
      <div>
        <label data-ref="inquiry_board_label" class="board:block board:text-sm board:font-medium board:text-gray-900 board:mb-1 board:dark:text-white">$t:sirsoft-board.admin.ecommerce_settings.inquiry.board_label</label>
        <select data-ref="inquiry_board_select" name="inquiry.board_slug" value="{{_local.form?.inquiry?.board_slug ?? ''}}" options="{{[{value: '', label: $t('sirsoft-board.admin.ecommerce_settings.inquiry.board_placeholder')}].concat((board_list_for_inquiry?.data?.data ?? []).map(b => ({value: b.slug, label: b.name})))}}" class="{{_local.errors?.['inquiry.board_slug'] ? 'board:h-9 board-input-error' : 'board:h-9'}}" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <span data-ref="inquiry_board_select_error" data-if="{{_local.errors?.['inquiry.board_slug']}}" class="board:block board:text-xs board:text-red-600 board:mt-1 board:dark:text-red-400">{{_local.errors?.['inquiry.board_slug']?.[0] ?? ''}}</span>
    </div>
    <div data-ref="inquiry_board_hints" class="board:space-y-3">
      <p data-ref="inquiry_board_hint_secret" class="board:text-xs board:text-gray-500 board:dark:text-gray-400">$t:sirsoft-board.admin.ecommerce_settings.inquiry.hint_secret</p>
      <p data-ref="inquiry_board_hint_category" class="board:text-xs board:text-gray-500 board:dark:text-gray-400">$t:sirsoft-board.admin.ecommerce_settings.inquiry.hint_category</p>
      <div data-ref="inquiry_board_actions" data-if="{{!!(board_list_for_inquiry?.data?.data ?? []).find(b => b.slug === (settings?.data?.inquiry?.board_slug ?? ''))?.id}}" class="board:flex board:flex-col board:gap-2 board:md:flex-row">
        <div data-ref="inquiry_board_go_edit_card" class="board:flex board:flex-col board:justify-between board:gap-3 board:flex-1 board:p-3 board:bg-gray-50 board:dark:bg-gray-800 board:border board:border-gray-200 board:dark:border-gray-700 board:rounded-lg">
          <p class="board:flex board:items-start board:gap-1.5 board:text-xs board:text-gray-500 board:dark:text-gray-400">
            <icon name="gear" class="board:text-xs board:shrink-0 board:mt-0.5"/>
            <span>$t:sirsoft-board.admin.ecommerce_settings.inquiry.go_to_board_edit_desc</span>
          </p>
          <a href="/admin/boards/{{settings?.data?.inquiry?.board_slug ?? ''}}/edit" data-ref="inquiry_board_go_edit" class="board-button board:self-start board:inline-flex board:items-center board:gap-1.5 board:px-3 board:py-1.5 board:text-xs board:font-medium board:text-gray-700 board:dark:text-gray-300 board:bg-white board:dark:bg-gray-900 board:border board:border-gray-300 board:dark:border-gray-600 board:rounded board:hover:bg-gray-50 board:dark:hover:bg-gray-700 board:transition-colors">
            <on type="click">
              <navigate/>
            </on>
            <icon name="pen-to-square" class="board:text-xs"/>
            <span>$t:sirsoft-board.admin.ecommerce_settings.inquiry.go_to_board_edit</span>
          </a>
        </div>
        <div data-ref="inquiry_board_go_posts_card" class="board:flex board:flex-col board:justify-between board:gap-3 board:flex-1 board:p-3 board:bg-gray-50 board:dark:bg-gray-800 board:border board:border-gray-200 board:dark:border-gray-700 board:rounded-lg">
          <p class="board:flex board:items-start board:gap-1.5 board:text-xs board:text-gray-500 board:dark:text-gray-400">
            <icon name="clipboard-list" class="board:text-xs board:shrink-0 board:mt-0.5"/>
            <span>$t:sirsoft-board.admin.ecommerce_settings.inquiry.go_to_posts_desc</span>
          </p>
          <div class="board:flex board:gap-2">
            <a href="/admin/board/{{settings?.data?.inquiry?.board_slug}}" data-ref="inquiry_board_go_posts" class="board-button board:inline-flex board:items-center board:gap-1.5 board:px-3 board:py-1.5 board:text-xs board:font-medium board:text-gray-700 board:dark:text-gray-300 board:bg-white board:dark:bg-gray-900 board:border board:border-gray-300 board:dark:border-gray-600 board:rounded board:hover:bg-gray-50 board:dark:hover:bg-gray-700 board:transition-colors">
              <on type="click">
                <navigate/>
              </on>
              <icon name="list" class="board:text-xs"/>
              <span>$t:sirsoft-board.admin.ecommerce_settings.inquiry.go_to_posts</span>
            </a>
            <!-- 메뉴 추가 API 는 그 게시판의 수정 권한(boards.update)을 요구한다 — 고른 게시판 행의 abilities.can_update 가 true 일 때만 연다(행이 아직 없으면 잠금) -->
            <button data-ref="inquiry_board_add_menu" type="button" class="board:inline-flex board:items-center board:gap-1.5 board:px-3 board:py-1.5 board:text-xs board:font-medium board:text-blue-600 board:dark:text-blue-400 board:bg-white board:dark:bg-gray-900 board:border board:border-blue-500 board:dark:border-blue-400 board:rounded board:hover:bg-blue-50 board:dark:hover:bg-blue-900/20 board:transition-colors board:disabled:opacity-50 board:disabled:cursor-not-allowed" title="{{(board_list_for_inquiry?.data?.data ?? []).find(b => b.slug === (settings?.data?.inquiry?.board_slug ?? ''))?.abilities?.can_update === true ? '' : '$t:sirsoft-board.admin.ecommerce_settings.inquiry.add_to_admin_menu_no_permission'}}" disabled="{{(board_list_for_inquiry?.data?.data ?? []).find(b => b.slug === (settings?.data?.inquiry?.board_slug ?? ''))?.abilities?.can_update !== true}}">
              <on type="click">
                <!-- 문의 게시판을 관리자 메뉴에 등록한다 — 성공하면 메뉴 데이터소스를 동기로 다시 읽어 사이드바에 즉시 나타나게 한다 -->
                <api-call target="/api/modules/sirsoft-board/admin/boards/{{settings?.data?.inquiry?.board_slug ?? ''}}/add-to-menu" :auth_required="true" method="POST">
                  <success>
                    <toast type="success" message="{{result.message}}"/>
                    <refetch-data-source dataSourceId="admin_menu" :sync="true"/>
                  </success>
                  <fail>
                    <toast type="error" message="{{error.message}}"/>
                  </fail>
                </api-call>
              </on>
              <icon name="plus" class="board:text-xs"/>
              <span>$t:sirsoft-board.admin.ecommerce_settings.inquiry.add_to_admin_menu</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- 문의로 쓸 수 있는 게시판 후보 — 셀렉트 하나를 채우는 용도라 200건까지만 받고, 이 확장이 붙는 기본정보 탭이 열렸을 때만 읽는다 -->
  <data-source id="board_list_for_inquiry" label_key="$t:sirsoft-board.editor.data_source.board_list_for_inquiry" type="api" endpoint="/api/modules/sirsoft-board/admin/boards" method="GET" if="{{(query.tab || _global.activeEcommerceSettingsTab || 'basic_info') === 'basic_info'}}" :auto_fetch="true" :auth_required="true">
    <params per_page="200"/>
    <fallback>null</fallback>
  </data-source>
</extension>
