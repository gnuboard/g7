feature: 비밀글 열람 토큰과 스레드 비밀번호 (#789 제보 A · D3·D4·D5·D16)

description: |
  비밀번호를 맞힌 사실을 다음 요청으로 넘기는 열람 토큰을 「브라우저 토큰 1개 + 서버의 글별 grant」로
  바꾸고(SecretViewTokenService), 답변 화면으로 바로 들어온 비회원이 원글(비회원 조상) 비밀번호로
  답변을 여는 엔드포인트(verify-thread-password)를 더한다.

  - 토큰: 40자. 레지스트리 키는 토큰 해시. 재사용은 서버가 발급해 살아 있고 발급 신원이 같은 토큰만.
    두 번째 글을 인증하면 같은 토큰에 grant 만 더하고, grant 마다 만료가 따로이며 50개 상한.
  - 스레드 비밀번호: 후보는 가까운 조상부터 비회원·비밀번호 있음·살아 있는 글(비밀 여부 무관 — D16).
    처음 일치한 조상에 grant. 오답 403, 원글·공개 답변·후보 없음·per_post 게시판은 400.
    응답에 조상 ID 를 싣지 않는다. 글 비밀번호 확인과 합쳐 IP 당 분당 10회.
  - 화면(템플릿): 토큰을 sessionStorage 에 두어 답변 링크 전체 이동·새로고침에서 복원하고,
    로그인·로그아웃 경계에서 지운다. 상세 응답 thread_password_available 이 원글 비밀번호 폼을 띄운다.

