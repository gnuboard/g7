feature: 비밀 콘텐츠 게이트 우회 경로 차단 (KVE-2026-2371 · 2375 · 2377)

description: |
  비밀글 원문 게이트(SecretContentGate)가 정상 조회 경로에만 걸려 있어, 부가 경로로 비밀 원문·
  읽기제한 게시판 글이 나가던 결함군을 한 번에 닫는다. 뿌리가 하나(게이트가 SSoT 가 아닌 경로)라
  개별 패치하면 남은 경로가 서로를 재오픈하므로 같은 게이트로 일원화한다.

  1. 비밀 댓글 (2371) — CommentResource 가 댓글 자신의 is_secret 을 보지 않았다.
     SecretContentGate::canViewSecretComment 신설: 댓글 작성자 · 부모 댓글 작성자(대댓글, 설계 결정) ·
     부모 게시글을 열 수 있는 사람(canView 재사용: 글 작성자 · 열람 토큰 · 비밀글 읽기 권한자 · 매니저).
     그 밖에는 content=null + is_secret=true. 화면은 '비밀 댓글입니다' 안내 — 사용자 상세와, 비밀글 조회·
     게시판 관리 권한 없이 게시글 조회(관리자)만 가진 관리자 역할의 관리자 상세 둘 다(설계 결정).
  2. 사용자 활동 목록 (2371 동반) — 공개 프로필 작성글·내가 댓글 단 글이 게시판별 posts.read 를
     거치지 않았다. 읽을 수 없는 게시판의 행을 쿼리 단계(whereNotIn)에서 뺀다. 본인 프로필·본인 작성글은 예외,
     「내가 댓글 단 글」은 행이 남의 글이라 본인 화면에서도 뺀다.
  3. 글쓰기 폼 (2375) — toFormArray 가 게이트를 거치지 않았고 답글 폼 진입이 비밀 부모를 막지 않았다.
     폼 원문은 비밀 아님 · canView · 게시판 관리 권한자(설계 결정)만, 답글 폼은 canWriteChild 실패 시 404.
  4. 신고 응답 (2377 심층방어) — 사용자 신고 생성 응답에서 대상 본문을 뺀다. 관리자 목록 미리보기와
     마이페이지 「내 신고」 발췌는 유지(설계 결정).

