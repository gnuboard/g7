validation:
  note: |
    백엔드 효과는 4개 Feature 테스트가 viewer 별로 단언한다(각 결함은 수정 전 fail 확인).
    화면 안내 블록의 게이트(is_secret + content===null)는 Vitest 레이아웃 테스트가 고정하고,
    E2E 는 실서버에서 회원·비회원 세션으로 API 차단과 상세 화면 안내 렌더를 함께 잰다.
