  - last_manager_board_skipped
  - scope_filtered
  - skipped_entries_carry_board_name
  - bulk_members_user_search_skips_blank_keyword
  - role_membership_synced
  - rollback_on_failure
  - not_grantable_board_skipped_on_apply_all
  - bulk_members_labels_resolve_in_both_locales
  - bulk_members_inputs_do_not_pollute_settings_form
  - bulk_members_card_renders_on_defaults_tab
  - bulk_members_card_lock_follows_boards_update
  - unchanged_boards_counted
  - role_missing_boards_skipped
  - bulk_members_reason_distinguishes_forbidden_and_failed

