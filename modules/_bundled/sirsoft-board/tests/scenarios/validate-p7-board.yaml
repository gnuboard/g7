feature: 게시판 환경설정 알림 템플릿 편집 창 — 수신자 규칙 종류 전환·관계 선택 (#599 validate P7)

description: |
  코어 알림 템플릿 편집 창과 같은 결함(종류 전환 시 이전 값 잔존 → 수신자 0명, 관련 사용자 relation 미시드 → 422,
  다중 선택 영어 문구, 미리보기 버튼에 붙은 엉뚱한 주석)을 게시판 사본에서 닫는다. 표현식을 엔진에 그대로 넣어 평가한다.

