feature: 게시판 글쓰기 첨부 — 저장 때 미뤄 둔 업로드를 먼저 올리고 글을 보낸다(관리자·사용자 폼)

description: |
  글쓰기 첨부 업로더는 자동 업로드를 끄고 임시 키(temp_key)로 묶어 둔다. 저장 단추가 `upload:board_attachments` 신호로
  업로드를 먼저 돌린 뒤 글 저장 요청을 보내고, 업로드 오류는 저장 중 표시를 되돌린다. 업로드가 실패하면 저장 요청을
  건너뛴다(#869 브라우저 실측 — 실행 검증은 관리자 템플릿 uploadFailureStopsSave.test.ts).

# axis 의미:
#   area — admin_attachments 관리자 첨부 조각, admin_save 관리자 저장 단추, user_form 사용자 폼, upload_error 업로드 오류 처리.
axes:
  area: [admin_attachments, admin_save, user_form, upload_error]

effects:
  - board_attachments_deferred_upload_wired     # 업로더가 자동 업로드 끔, 신호 이름, temp_key 업로드 인자로 묶인다
  - board_save_uploads_before_request           # 저장 시퀀스가 업로드 신호를 저장 요청보다 먼저 보낸다
  - board_upload_error_restores_saving          # 업로드 오류가 저장 중 표시를 되돌리고 post_id 를 싣지 않는다

test_files:
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-board-post-form-attachments.test.tsx
