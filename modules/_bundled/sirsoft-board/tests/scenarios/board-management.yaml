validation:
  note: |
    - 케이스 20 = BoardManagementTest 의 마킹 없던 테스트 20건과 1:1. 같은 파일의 나머지 테스트는
      board-reaction · board-admin-list-role-payload-pruning · board-conditional-validation ·
      board-form-restriction-fields 매니페스트가 소유한다.
    - slug 라우팅 4케이스는 하나의 effect(slug_resolves_board_in_admin_routes)를 나눠 검증한다 —
      경로마다 바인딩이 다르므로 케이스는 나누되 계약은 하나다.
