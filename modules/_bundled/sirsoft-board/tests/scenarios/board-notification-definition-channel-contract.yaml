feature: 게시판 알림 정의 탭의 채널 계약 (#518 / 공개 #76)

description: |
  알림 정의 목록은 정의 하나당 (채널 × 로케일) 템플릿 본문을 전부 실었다. 화면은 한 번에 한
  채널만 그리므로, 서버는 `template_channel` 로 지정된 채널의 템플릿만 싣도록 좁혔다.

  그 좁힘은 **요청과 화면이 같은 채널을 볼 때만** 성립한다. 이 매니페스트가 고정하는 것은
  두 종류의 어긋남이다.

  1. 화면이 채널을 서버에 넘기지 않는 경우 — 응답에 `templates` 키 자체가 없어 전 행이
     「이 채널에 대한 템플릿이 없습니다」가 된다. 제목·수신자·활성 토글·편집 모달 초기값이
     통째로 빈다. `(def.templates ?? [])` 가드 뒤라 예외도 콘솔 경고도 없고 응답은 200,
     행 수도 정상이라 "템플릿을 아직 안 만들었나 보다" 로 읽힌다.
  2. 넘기는 채널과 화면이 찾는 채널이 다른 경우 — 서버는 A 채널을 실어 보내고 화면은 B 채널을
     찾아 같은 증상이 난다. 채널 출처가 URL 하나여야 하는 이유다.

  「기본값 복원」 노출은 채널을 가리지 않는 판정이다. templates 가 한 채널로 좁혀 실리므로
  배열 순회로는 다른 채널의 커스터마이즈를 알 수 없다 — 서버 집계가 유일한 출처다.

# axis 의미:
#   갈리는 입력은 (화면이 보는 채널) × (그 채널의 템플릿 커스터마이즈 상태) 다.
#   채널 전환 경로는 URL 만 바꾸므로 초기 진입과 같은 규칙이고, effects 로 검증한다.
axes:
  channel: [mail, database]
  template_state: [default, customized]

effects:
  - board_notification_channel_reads_single_source
  - board_notification_list_requests_template_channel
  - board_notification_reset_button_uses_server_aggregate

test_files:
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-board-notification-channel-single-source.test.ts
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-notification-definition-channel.spec.ts

notes: |
  회귀 이력: 목록 프루닝 도입 시 코어 설정 화면만 `template_channel` 을 보내도록 고쳐지고
  게시판 탭 데이터소스가 빠져, 7건 전 행이 빈 상태로 표시됐다 (2026-08-05 브라우저 실측).

  그래서 단언은 소비와 전송을 **함께** 묶는다 — templates 를 읽는 표현식이 있는데 데이터소스가
  채널을 넘기지 않으면 실패한다. 한쪽만 보면 "화면은 templates 를 안 쓴다" 는 잘못된 전제로
  통과해 버린다.

  활성 토글은 URL 을 `templates[...].id` 로 조립한다. 템플릿이 없으면 그 값이 `undefined` 가
  되어 존재하지 않는 경로로 요청이 나가므로, 실제 템플릿 ID 로 나가는지까지 축에 포함한다.
