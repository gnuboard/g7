feature: 마이페이지 「내 신고」 (조회 + 접수 상태 취소)

description: |
  이슈 #525 전수조사 §4.3 파생 — 회원이 남긴 신고를 본인이 조회할 표면이 없었다(생성만 가능).
  반응·스크랩과 동형의 반쪽 표면이라 이번에 닫는다 (결정 R7·R10).

  핵심 동작 (확정):
    - 본인이 남긴 **신고 로그(boards_report_logs)** 기준 목록이다 — 케이스가 아니라 로그가 행
    - 제목·본문은 **신고 시점 스냅샷**에서 읽는다 — 원본이 수정·삭제돼도 "내가 무엇을
      신고했는지" 가 흔들리지 않아야 한다
    - **다른 신고자·처리자·관리자 메모·신고자 IP/UA 는 싣지 않는다** (결정 R10)
    - 취소는 **접수(pending) 상태에서만** 가능 — 운영자가 검토에 착수했거나 처리를 끝낸
      신고를 되돌리면 처리 이력과 조치(자동 숨김 등)의 근거가 사라진다
    - 내가 마지막 신고자였으면 케이스를 **영구 삭제(forceDelete)** 한다 — 소프트 삭제로
      남기면 unique(board,target) 제약이 살아 있어 같은 대상을 다시 신고할 수 없다
    - 다른 신고자가 남아 있으면 케이스는 유지하고 last_reported_at·처리 이력만 갱신한다
    - 취소는 이미 적용된 자동 숨김 등 조치를 되돌리지 않는다
    - 남의 로그는 404 (존재 여부를 흘리지 않는다)

