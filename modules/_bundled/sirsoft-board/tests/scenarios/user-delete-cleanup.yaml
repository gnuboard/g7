feature: 회원 삭제 시 게시판 소유 회원 데이터의 명시 삭제와 집계 재계산

description: |
  코어 회원 삭제는 `core.user.before_delete` 훅으로 게시판에 정리를 맡긴다. 게시판은 회원 행에 삭제 연쇄 외래키로 걸린
  알림 설정·반응·스크랩을 DB 연쇄에 기대지 않고 지우고, 영향받은 게시글·댓글의 반응 수·스크랩 수를 남은 행 기준으로
  다시 계산한다. 외래키 검사를 끈 채 회원을 지워도 고아 행이 남지 않아야 한다 (#888).

# 축 의미:
#   case — purge_and_recalc = 정리와 집계 재계산, target_gone = 반응 대상이 이미 하드 삭제됨,
#          sync_listener = 리스너가 삭제 직전 훅을 동기로 구독.
axes:
  case: [purge_and_recalc, target_gone, sync_listener]

effects:
  - member_board_rows_deleted_without_fk_cascade
  - reaction_and_scrap_counts_match_remaining_rows
  - cleanup_listener_runs_before_user_row_deleted

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/User/UserDeleteCleanupTest.php
