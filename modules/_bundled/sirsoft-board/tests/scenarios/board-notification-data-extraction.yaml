feature: 게시판 알림 데이터 추출 — 알림 유형별 데이터·수신자 컨텍스트 (BoardNotificationDataListener)

description: |
  `sirsoft-board.notification.extract_data` 필터가 7종 알림(new_comment · reply_comment ·
  post_reply · post_action · report_action · new_post_admin · report_received_admin)마다
  본문 데이터와 수신자 컨텍스트(trigger_user · related_users)를 만든다. 보내지 않아야 하는
  경우(게시판·회원 알림 설정 OFF, 답변글·대댓글, 신고 처리·자동 블라인드 등)는 빈 결과에
  `context.skip=true` 를 실어 템플릿 수신자 규칙이 정책을 우회하지 못하게 한다.

  관리자 대상 알림의 게시판 관리자(`board_managers`)와 신고 로그는 Repository 로만 읽는다
  (#599 validate — validate-p4-board.yaml 참조).

axes:
  notification_type:
    - dispatch
    - new_comment
    - reply_comment
    - post_reply
    - post_action
    - report_action
    - new_post_admin
    - report_received_admin

