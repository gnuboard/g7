# audit:allow test-scenario-coverage[cross_product] reason: 설정 3값 × 열람자 12종 × 대상 A~E 전 조합은 SecretThreadVisibilityTest::test_thread_matrix_show_content 의 데이터 프로바이더(threadMatrixProvider)가 한 케이스에서 다섯 대상을 모두 단언하며 돈다 — 기대값의 원본은 계획서 §3 두 표이고 프로바이더가 그 SSoT 다(조합별 docblock 마킹 대신)
feature: 비밀글 스레드 경로 규칙 (#789 제보 A · D1·D2·D9·D15·D17·D19)

description: |
  비밀 답변을 답변 자기 행으로만 판정하던 SecretContentGate::canView 에 5번 규칙(스레드 경로)을 더한다.
  요청자가 앵커(살아 있는 자기 글 · 토큰 grant 글)로 삼을 수 있는 조상이 있으면 그 하위를,
  게시판 설정이 경로 규칙(thread_path)이면 자손 앵커의 조상 경로도 연다. 형제 가지는 닫힌다.

  스레드: A ─┬─ B ── D / └─ C ── E(비회원 e-pass). 원글 A 는 회원(a) 글 또는 비회원(a-pass) 글.

  게시판 설정 secret_reply_visibility:
    - thread_path (기본): 하위 + 조상 경로
    - descendants_only: 하위만 (답변 작성자는 조상을 못 봄)
    - per_post: 답변마다 따로 (수정 전 동작)

  경로 규칙이 여는 권한 상승 구멍(남의 비밀글 아래 공개 답변에 답변을 달아 앵커가 되기)은
  canWriteReply 로 같은 단위에서 막는다 — 부모의 모든 비밀 조상을 지금 열 수 있어야 답변 가능.

  비밀글 조회 권한(posts.read-secret) 스코프도 실제로 적용한다(D9·B1): self=본인 글, role=역할을
  공유하는 회원의 글, 비회원 글은 self/role 에서 닫힌다.

