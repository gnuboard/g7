# audit:allow test-scenario-coverage[cross_product] reason: issue:#857 이 매니페스트의 조합을 재는 시험은 test_files 의 spec 뿐인데, 그 spec 은 test.describe.skip 상태라(활성화 조건은 spec 머리말) 실행되지 않는다. 건너뛴 시험의 마킹은 커버로 세지 않으므로(docs/testing-guide.md 「describe.skip 인 spec 의 그 축 커버리지는 0」) 조합이 미커버로 남는다. 같은 조합을 재는 다른 실행 시험은 없다(#857 후속 대조). spec 의 skip 을 풀면 이 표식을 걷고 pending_effects 를 effects 로 되돌린다.

feature: 게시판 무변경 저장 성공과 저장 실패 안내 노출 (브라우저)

description: |
  이슈 #78 — 관리자 폼은 조회 응답 전체를 _local.form 에 담아 그대로 PUT 하므로 요청에는 항상 모든 키가
  있다. 토글이 꺼진 종속 필드까지 검증을 타면 아무것도 바꾸지 않은 저장조차 422 로 거부된다. 첨부를 쓰지
  않는 게시판(notice)과 NEW 배지 표시 기간이 0 인 게시판(archive)이 여기에 해당했다.

  백엔드 계약은 board-conditional-validation(BoardRequestTest 매트릭스, BoardManagementTest 왕복 저장)이
  고정한다. 여기서는 브라우저에서 무변경 저장이 성공하는지, 저장이 422 로 거부될 때 서버 메시지가 담긴
  안내가 실제로 보이는지를 잰다. 후자는 오류 처리가 붙어 있어도 바인딩 키가 틀리면 빈 안내가 뜨므로 따로 잰다.

  spec 은 PlaywrightIssueToken 발급이 가능한 환경에서 test.describe.skip 을 풀어 실행한다.

# axis 의미:
#   case 는 (대상 게시판의 첨부 사용 여부 + 확장자 값 또는 NEW 배지 기간 + 저장 결과) 의 의미 있는 조합을
#   한 축으로 열거한다. 값 이름은 board-conditional-validation 의 case 값과 같은 이름을 쓴다.
#     upload_disabled_extensions_empty   — notice, 첨부 미사용, 무변경 저장 → 200
#     new_display_hours_zero             — archive, NEW 배지 기간 0, 무변경 저장 → 200
#     upload_enabled_extensions_nonempty — gallery, 첨부 사용, 무변경 저장 → 200 (회귀 방지)
#     upload_enabled_extensions_empty    — gallery, 첨부 사용 + 확장자를 모두 비움 → 422 와 안내 노출
axes:
  case: [upload_disabled_extensions_empty, new_display_hours_zero, upload_enabled_extensions_nonempty, upload_enabled_extensions_empty]

effects: []

# 아래 효과는 아직 실행되는 시험이 재지 않는다 — test_files 의 spec 이 test.describe.skip 상태라 건너뛴 시험의 @effects 는
# 커버가 아니다(#857 후속). spec 의 skip 을 풀면 effects 로 되돌린다.
pending_effects:
  # 첨부 미사용 게시판(notice)을 무변경 저장하면 200 이고 확장자 안내가 없다
  - unchanged_save_succeeds_for_upload_disabled_board
  # NEW 배지 표시 기간이 0 인 게시판(archive)을 무변경 저장하면 200 이다
  - unchanged_save_succeeds_for_zero_new_display_hours
  # 첨부 사용 게시판(gallery)의 무변경 저장이 계속 200 이다
  - unchanged_save_succeeds_for_upload_enabled_board
  # 저장이 422 로 거부되면 서버 메시지(최소 1개 안내)가 화면에 실제로 보인다
  - save_failure_surfaces_toast_with_server_message

test_files:
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-unchanged-save-and-error-visibility.spec.ts
