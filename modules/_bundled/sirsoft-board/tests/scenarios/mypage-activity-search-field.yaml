  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-board-search-field.test.tsx
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-board-search-enter.test.tsx
  - templates/_bundled/sirsoft-basic/tests/Playwright/specs/mypage-board-search-enter.spec.ts

