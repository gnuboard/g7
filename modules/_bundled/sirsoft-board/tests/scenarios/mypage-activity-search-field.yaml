# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 마이페이지 게시판 활동 검색 대상 구분 · 댓글 OFF 게시판 제외

description: |
  이슈 #524 WP-B·WP-C1. 마이페이지 「게시판 활동」의 두 하위 탭은 축이 다르다.

  - 내 글: 제목+내용 / 제목 / 내용 — 글을 찾는 축이다.
  - 내 댓글: 댓글 내용 / 원글 제목 — 「어떤 글에 단 댓글인지」로 찾는 쪽이 자연스럽다.

  같은 셀렉트를 양쪽에 복사하지 않는다. 내 댓글에 「제목」 갈래를 두면 그것이 «댓글의 제목» 인지
  «원글의 제목» 인지 화면만 보고는 알 수 없다.

  WP-C1: 게시판이 댓글 기능을 끈 뒤에도(`use_comment=false`) 그 게시판에 달렸던 내 댓글이
  마이페이지 목록에 남아 있었다. 회원 화면에서는 이미 사라진 댓글이라 눌러도 갈 곳이 없다 —
  비활성 게시판과 같은 규칙으로 목록에서 뺀다. 「댓글 단 글」 활동도 같은 이유로 제외한다.

  서버가 모르는 `search_field` 는 422 로 막지 않고 기본값으로 되돌린 뒤 **적용된 값을 응답에
  실어** 돌려준다 — 링크를 손으로 고친 사용자가 빈 화면 대신 결과를 본다.

# 입력 axis
#  tab          : 하위 탭 (내 글 / 내 댓글 / 활동 집계)
#  search_field : 검색 대상 (탭마다 유효 집합이 다르다)
#  board_setting: 원글이 속한 게시판의 댓글 설정
axes:
  tab: [posts, comments, activities]
  search_field: [title_content, title, content, post_title, unset]
  board_setting: [use_comment_on, use_comment_off]

# 의미 없는 조합 컷:
#  - 내 글에는 원글 제목(post_title) 갈래가 없다 (자기 글의 제목이 곧 title 이다)
#  - 내 댓글에는 제목·제목+내용 갈래가 없다 (댓글에 제목이 없다)
#  - 활동 집계 탭은 검색을 받지 않는다
exclusions:
  - { tab: posts, search_field: post_title, reason: "내 글의 제목은 title 갈래다" }
  - { tab: comments, search_field: title, reason: "댓글에 제목이 없다" }
  - { tab: comments, search_field: title_content, reason: "댓글에 제목이 없다" }
  - { tab: activities, search_field: title, reason: "집계 탭 — 검색 없음" }
  - { tab: activities, search_field: content, reason: "집계 탭 — 검색 없음" }
  - { tab: activities, search_field: title_content, reason: "집계 탭 — 검색 없음" }
  - { tab: activities, search_field: post_title, reason: "집계 탭 — 검색 없음" }

effects:
  - mypage_filtered_empty_says_no_results
  # 백엔드 — 검색 갈래
  - mypage_my_posts_search_field_title_content
  - mypage_my_posts_search_field_title_only
  - mypage_my_posts_search_field_content_only
  - mypage_my_posts_echoes_applied_search_field
  - mypage_my_comments_search_field_content
  - mypage_my_comments_search_field_post_title
  # 백엔드 — 댓글 OFF 게시판 제외 (WP-C1)
  - mypage_my_comments_excludes_comment_disabled_board
  - mypage_activities_commented_excludes_comment_disabled_board
  # 레이아웃 — 두 탭의 축이 다르다
  - mypage_posts_search_field_offers_three_targets
  - mypage_comments_search_field_offers_content_and_post_title
  - mypage_posts_search_field_defaults_to_title_content
  - mypage_comments_search_field_defaults_to_content
  - mypage_activity_endpoints_are_separate
  - mypage_activity_state_is_namespaced_per_tab
  - mypage_activity_select_only_stores_value
  # 검색어를 비우는 자리는 전부 검색 대상도 되돌린다 — 한 곳만 되돌리면 다음 검색이
  # 조용히 이전 갈래로 나간다(검색 바 초기화 / 검색 결과 배너 초기화 두 자리).
  - mypage_activity_every_reset_clears_search_field
  - mypage_activity_search_field_labels_have_ko_en
  # K2 실측(2026-10-06) — 390px 에서 입력칸 고유 최소 폭 때문에 검색 줄이 칸 밖으로 넘쳐 페이지가 가로로 밀렸다
  - mypage_activity_search_input_shrinks_on_narrow_screen
  # 7.1.0 실측 O-K3-10 — 네 하위 탭(내 글·내 댓글·내 반응·내 신고) 검색칸 Enter 가 검색 버튼과 같은 순서를 탄다
  - mypage_activity_enter_runs_search_button_sequence

test_files:
