feature: 게시판 환경설정 API (조회·저장·일괄 적용·요청 범위·캐시 삭제)

description: |
  BoardSettingsController 의 조회·저장·일괄 적용·캐시 삭제와 설정 요청의 범위 검증을 잠근다.
  인증 없는 요청 거부, 알림 채널·신고 알림 강제값, 허용 카테고리 필터, 일괄 적용의 필드 검증과
  대상 지정, config SSoT 를 따르는 상·하한, 첨부 정리 설정 저장을 한 테스트 파일이 다룬다.
  일괄 적용의 첫 실패 전체 롤백은 board-settings-bulk-apply-rollback.yaml 이, 권한 필드 일괄 적용과
  기본 권한 저장의 권한 부여 상한은 board-acl-escalation-ceiling.yaml 이 소유한다 — 여기의 일괄
  적용 허용 필드 케이스는 상한이 없는 슈퍼관리자로 검증 축만 본다.

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Admin/BoardSettingsControllerTest.php

