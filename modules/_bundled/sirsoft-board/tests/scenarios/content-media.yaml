feature: 게시판 본문 미디어 — 편집기 본문 이미지·동영상·오디오 업로드·연결·서빙 (#883 4단계)

description: |
  편집기 본문에 바로 넣는 미디어를 `board_attachments` 의 `collection = content_media` 로 저장한다. 파일은 처음부터
  최종 경로(`{slug}/content-media/Y/m/d/uuid.ext`), 행은 임시(board_id=0 + 임시 키)다. 글 저장 트랜잭션 안에서 본문이
  참조한 것만(같은 임시 키 + 첨부와 같은 소유 규칙) DB 갱신으로 잇고, 본문에서 빠진 것은 소프트 삭제한다. 문서당 최대
  개수를 넘으면 422 로 저장 전체를 되돌린다. 업로드 판정은 「파일 첨부 사용」과 무관하게 본문 미디어 정책 +
  `attachments.upload` 권한(D26). 서빙에는 권한 미들웨어가 없고 서명 또는 글 읽기 권한 + 삭제·비밀·블라인드 게이트가 맡는다.
  글 응답은 본문 주소를 서명 주소로 내보내고(봇 렌더는 정식 주소), 저장 때 서명 쿼리를 뗀다. 첨부 목록·첨부 개수·목록
  썸네일에 들지 않는다.

