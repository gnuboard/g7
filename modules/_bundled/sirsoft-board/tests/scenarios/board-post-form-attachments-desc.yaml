# audit:allow test-scenario-coverage[cross_product] reason: issue:#857 이 매니페스트의 조합을 재는 시험은 test_files 의 spec 뿐인데, 그 spec 은 test.describe.skip 상태라(활성화 조건은 spec 머리말) 실행되지 않는다. 건너뛴 시험의 마킹은 커버로 세지 않으므로(docs/testing-guide.md 「describe.skip 인 spec 의 그 축 커버리지는 0」) 조합이 미커버로 남는다. 같은 조합을 재는 다른 실행 시험은 없다(후속 대조). spec 의 skip 을 풀면 이 표식을 걷고 pending_effects 를 effects 로 되돌린다.

feature: 관리자 게시글 폼 첨부 안내 — 게시판 설정의 개수와 용량으로 렌더 (브라우저)

description: |
  공개 #81 L-01 — 관리자 게시글 폼의 첨부 영역에는 안내 문구가 없었고, 어디에도 렌더되지 않는
  사장된 lang 키(「최대 5개 파일, 각 10MB 이하」)만 남아 있었다. 그 문구는 게시판마다 다른 실제
  제한과 무관한 고정 숫자였다.

  안내는 `form_meta.data.board.max_file_count/max_file_size` 를 파라미터로 받는다. Vitest
  admin-board-post-form-attachments-desc 는 안내 노드만 떼어 렌더하므로, form_meta 데이터소스가 도착한
  뒤 실제 폼에서의 치환 결과는 여기서 브라우저로 잰다(위지윅 발행 회귀의 교훈).

  글쓰기 첨부의 지연 업로드 흐름은 board-post-form-attachments 가 따로 다룬다(주제가 달라 합치지 않았다).
  spec 은 PlaywrightIssueToken 발급이 가능한 환경에서 test.describe.skip 을 풀어 실행한다.

# axis 의미:
#   case — 같은 화면(관리자 글쓰기, free)에서 시험마다 재는 관점.
#     hint_renders_limits   안내 숫자가 게시판 설정에서 온다
#     no_raw_placeholders   치환 전 플레이스홀더가 남지 않는다
#     no_legacy_fixed_hint  사장된 고정 숫자 안내가 되살아나지 않는다
axes:
  case: [hint_renders_limits, no_raw_placeholders, no_legacy_fixed_hint]

# 아래 효과는 Vitest(admin-board-post-form-attachments-desc.test.tsx)가 레이아웃 선언과 안내 노드 단독 렌더로 잰다.
# 실제 폼에서 form_meta 도착 뒤의 치환은 pending_effects 의 브라우저 효과로 따로 남긴다(선행 마킹 정리).
effects:
  # 안내 노드가 form_meta.data.board 의 max_file_count, max_file_size 를 번역 파라미터로 넘긴다
  - admin_attachment_hint_node_passes_board_limit_params
  # 안내 글자색이 다크 짝을 갖는다(확장 의미 클래스면 확장 생성 CSS 의 다크 규칙으로 확인)
  - admin_attachment_hint_pairs_dark_color
  # ko 번역 문구가 {{maxFiles}}, {{maxSize}} 자리를 담는다
  - admin_attachment_hint_lang_key_has_limit_placeholders
  # 사장된 고정 숫자 안내 키(attachments_limit, max_10mb)가 lang 에 남아 있지 않다
  - admin_attachment_legacy_fixed_hint_keys_removed
  # 안내 노드만 떼어 렌더하면 게시판 설정 숫자로 치환되고 설정이 바뀌면 문구도 따라 바뀐다
  - admin_attachment_hint_isolated_render_shows_board_limits

# 아래 효과는 아직 실행되는 시험이 재지 않는다 — test_files 의 spec 이 test.describe.skip 상태라 건너뛴 시험의 @effects 는
# 커버가 아니다. spec 의 skip 을 풀면 effects 로 되돌린다.
pending_effects:
  # 첨부 안내가 「최대 N개, 각 NMB 이하」 형태로 게시판 설정 숫자를 담아 보인다
  - admin_attachment_hint_renders_board_limits
  # raw 플레이스홀더({{maxFiles}}, {{maxSize}})가 화면에 남지 않는다
  - admin_attachment_hint_placeholders_not_raw
  # 사장된 고정 숫자 안내(「최대 5개 파일, 각 10MB 이하」)가 다시 나타나지 않는다
  - admin_attachment_legacy_fixed_hint_absent

test_files:
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-post-form-attachments-desc.spec.ts
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-board-post-form-attachments-desc.test.tsx
