validation:
  audit_rule: test-scenario-coverage
  note: |
    <!-- audit:allow test-scenario-coverage[cross_product] reason: surface × op × type_state ×
    icon_file × permission 의 전 조합은 의미 없는 칸(예: icon_delete × duplicate_code)이
    대부분이다. 기획서가 확정한 조합만 case 로 열거하고, 각 테스트가 @scenario 로 자기
    조합을 밝힌다 (board-conditional-validation.yaml 관례). -->

    프론트(vitest) 커버리지는 레이아웃 JSON 계약 테스트로 잠근다 — 저작본(.g7.html)의 기계
    산출물인 .json 을 직접 읽으므로, 화면을 고치고 다시 굽지 않으면 red 가 된다.
    E2E(Playwright) 는 `playwright:seed-board-reaction` 시드로 세 상태의 행·비활성 유형·
    탈퇴 회원을 고정해 두고 실브라우저로 잰다(되돌리기는 같은 커맨드 `--teardown`).
