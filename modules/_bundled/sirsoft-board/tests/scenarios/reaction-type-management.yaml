  # 독립 축을 곱하면 무의미한 칸(icon_delete × duplicate_code 등)이 폭증하므로
  # 기획서가 확정한 시나리오만 case 로 둔다 (board-conditional-validation.yaml 관례).
  case:
    - settings_read_lists_all_types_including_inactive
    - settings_create_update_reorder_in_one_save
    - settings_code_immutable_on_update
    - settings_duplicate_code_rejected
    - settings_invalid_code_rejected
    - settings_missing_default_name_rejected
    - settings_delete_unreferenced_type
    - settings_delete_referenced_type_blocked
    - settings_deactivate_survives_seeder
    - icon_upload_png_returns_uploader_shape
    - icon_upload_rejects_svg_wrong_mime_and_oversize
    - icon_upload_without_permission_forbidden
    - icon_bound_on_save_and_replaced_icon_deleted
    - icon_delete_foreign_collection_rejected
    - icon_delete_clears_type_reference
    - icon_url_downloadable_by_guest
    - type_list_exposes_icon_url
    - defaults_single_source_and_backfill_no_drift
    - settings_editor_renders_form_rows
    - settings_editor_add_form_validates
    - settings_editor_icon_uploader_wired
