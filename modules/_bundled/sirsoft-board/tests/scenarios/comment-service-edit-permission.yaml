feature: 댓글 수정, 삭제 자격 판정 — 비회원 댓글은 비밀번호, 회원 댓글은 작성자 본인

description: |
  CommentService::canUpdate / canDelete 가 댓글 종류와 요청자, 입력한 비밀번호로 수정과 삭제 자격을 가르는지 고정한다.
  비회원 댓글은 요청자가 로그인했는지와 무관하게 비밀번호가 맞아야 하고, 회원 댓글은 작성자 본인만 고칠 수 있다.

  기존 회귀 테스트의 소유권을 2026-11-11 시험 기반 클래스를 고치며 사후 등재했다.
  축 `case` 는 시험 하나하나다(판정 함수 단위 시험이라 조합 축을 따로 두지 않는다).

axes:
  case:
    - guest_comment_update_correct_password_by_guest
    - guest_comment_update_wrong_password_by_guest
    - guest_comment_update_correct_password_by_member
    - guest_comment_update_wrong_password_by_member
    - member_comment_update_by_author
    - member_comment_update_by_other_member
    - guest_comment_delete_correct_password_by_guest
    - guest_comment_delete_correct_password_by_member
    - guest_comment_delete_wrong_password_by_member

effects:
  - guest_comment_update_allowed_with_correct_password
  - guest_comment_update_denied_with_wrong_password
  - member_comment_update_allowed_for_author
  - member_comment_update_denied_for_other_member
  - guest_comment_delete_allowed_with_correct_password
  - guest_comment_delete_denied_with_wrong_password

test_files:
  - modules/_bundled/sirsoft-board/tests/Unit/CommentServiceTest.php
