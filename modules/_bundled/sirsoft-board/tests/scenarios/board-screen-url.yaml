feature: 게시판 화면 주소 래퍼 — 알림·검색·사이트맵은 화면 주소 헬퍼, SEO 캐시는 기본 경로

description: |
  게시판 알림의 글 주소·검색 결과·사이트맵 주소는 코어 ScreenUrl(키 board.index·board.list·board.post)을 거쳐
  「사용자 화면 URL」과 주소 필터 core.screen_url.filter_path 를 따른다. 관리자 글·신고 링크는 관리자 범위(사이트 주소).
  G7 엔진 SEO 캐시 무효화·재생성은 필터 없는 기본 경로를 그대로 쓴다.

test_files:
  - modules/_bundled/sirsoft-board/tests/Unit/BoardScreenUrlTest.php

axes:
  case:
    - wrapper
    - notification

effects:
  - board_urls_use_helper
  - board_filter_applied
  - board_default_path_unfiltered
  - board_notification_post_url_user_screen
  - board_admin_url_site
