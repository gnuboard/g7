feature: 게시판 서버 영어 문구 중 늘 복수로 적혀 있던 것의 단·복수

description: |
  게시판이 내는 영어 문구 중 수 뒤 명사를 늘 복수로 적은 것(작성일 「1 minutes ago」, 연속 작성 제한
  「1 minutes」, 신고 한도 「(1 reports)」, 설정 일괄 적용 「1 boards」, 첨부 상한 「1 files」, 신고 일괄 처리
  활동 로그 「(1 items)」)을 `단수|복수` + `trans_choice` 로 1 이면 단수로 고른다. 두 단위가 함께 나오는 제한
  시간은 단위마다 고른다. 한국어는 그대로.

axes:
  surface: [dictionary, relative_time, validation_rule]

effects:
  - english_message_singular_for_one_plural_otherwise
  - korean_message_unchanged
  - relative_time_follows_count
  - cooldown_duration_pluralises_each_unit
  - report_limit_message_follows_limit

test_files:
  - modules/_bundled/sirsoft-board/tests/Unit/Lang/AlwaysPluralMessagesTest.php
