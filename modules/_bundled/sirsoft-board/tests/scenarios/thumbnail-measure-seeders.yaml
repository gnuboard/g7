feature: thumbnail_measure_seeders

description: |
  게시판 이미지 썸네일 실측 시더(개발 DB 전용 샘플 시더, `--sample` 밖)는 생성, 정리 모두 run() 첫머리에서 사이트 언어의
  시작 안내를 찍고, 옵트인(G7_PLAYWRIGHT_BYPASS=1)이 없으면 데이터에 손대기 전에 멈춘다. 실측 데이터 표의 행을 만드는
  함수는 DB 없이 부를 수 있고, 첨부를 다시 읽지 못한 행까지 열 수가 머리글 수(8)와 같다.

axes:
  seeder: [generate]

effects:
  - start_message_printed_first
  - table_rows_match_headers

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Seeders/ThumbnailMeasureSeederTest.php
