# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 게시판 목록 검색 대상 구분

description: |
  이슈 #524 WP-B. 게시판 목록의 검색은 언제나 제목과 내용을 함께 훑었다. 「제목에 그 말이 든
  글만」을 고를 방법이 없어, 본문에 흔한 낱말이 들어간 글까지 전부 걸려 나왔다 — 공지 제목을
  찾으려던 사용자가 본문에 그 낱말이 스친 잡담 글 수십 건을 먼저 지나쳐야 했다.

  그래서 `search_field` 를 넷으로 연다: `title_content`(기본, 종전 동작) · `title` · `content` ·
  `author`. 값을 주지 않으면 예전과 똑같이 동작한다 — 기존 링크·북마크가 깨지지 않아야 한다.

  성능축: `title_content` 는 FULLTEXT(MATCH…AGAINST)를 타고, `title`·`content` 는 단일 컬럼
  LIKE 로 간다. 두 갈래는 SQL 모양이 다르므로 테스트도 행 수가 아니라 **질의 모양**으로 가른다
  (InnoDB FULLTEXT 인덱스는 트랜잭션 격리 안에서 보이지 않아 행 단언이 성립하지 않는다).

  화면은 세 형(기본·카드·갤러리)이 각각 다른 조각 파일이다 — 한 곳만 고치면 다른 형의
  게시판에서는 예전대로 동작한다. 그 비대칭을 테스트가 막는다.

# 입력 axis
#  search_field: 검색 대상 (미지정 = 종전 동작)
#  board_type  : 목록 형 (조각 파일이 셋으로 갈린다)
axes:
  search_field: [title_content, title, content, author, unset, invalid]
  board_type: [basic, card, gallery]

# 의미 없는 조합 컷:
#  - 잘못된 값 거부와 미지정 승계는 서버 규칙이라 목록 형과 무관하다
exclusions:
  - { search_field: invalid, board_type: card, reason: "서버 검증 — 목록 형 무관" }
  - { search_field: invalid, board_type: gallery, reason: "서버 검증 — 목록 형 무관" }
  - { search_field: unset, board_type: card, reason: "서버 기본값 — 목록 형 무관" }
  - { search_field: unset, board_type: gallery, reason: "서버 기본값 — 목록 형 무관" }

effects:
  # 백엔드
  - board_list_search_field_title_content_uses_fulltext
  - board_list_search_field_title_only
  - board_list_search_field_content_only
  - board_list_search_field_author_only
  # 7.1.0 실측 O-K3-3 — 모르는 값은 422 대신 기본 검색 대상(제목+내용)
  - board_list_unknown_search_field_falls_back_to_title_content
  - board_list_without_search_field_keeps_all_behaviour
  # 레이아웃 — 세 형이 같은 계약을 쓴다
  - board_list_datasource_passes_search_field
  - board_list_search_field_offers_four_targets
  - board_list_search_field_defaults_to_title_content
  - board_list_search_submits_field_to_query
  - board_list_search_field_labels_have_ko_en
  # 레이아웃이 쓰는 반응형 클래스가 Tailwind safelist 에 있는가 — 빠지면 오류 없이 스타일만 사라진다
  - board_list_responsive_classes_are_safelisted

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/User/BoardListSearchFieldTest.php
  - templates/_bundled/sirsoft-basic/__tests__/layouts/board-list-search-field.test.tsx

validation:
  audit_rule: test-scenario-coverage
