feature: 게시판 설정 폼 — 작성자 표시 이름과 비회원 작성자 항목 표 (#490)

description: |
  게시판 생성, 수정 화면의 「글 설정」 탭에 두 구획이 있다.

  작성자 표시 이름: 방식(사이트 기본값 따름, 특정 종류 고정, 회원이 고른 값)과, 「고정」일 때만 보이는 종류 선택.
  값은 form.display_name_setting = { mode, kind } 한 객체로 저장 본문에 실린다.

  비회원 작성자 항목 표: 행은 서버가 준 form.guest_author_field_rows(고정 항목 이름과 비밀번호 + 항목 엔진의 항목),
  스위치가 바꾸는 값은 form.guest_author_fields[항목 키].{post|comment}.{enabled|required} 이다.

  조용히 깨지는 지점:
    - 방식을 「고정」이 아닌 것으로 바꿨는데 kind 가 남으면 다음에 「고정」으로 돌아올 때 엉뚱한 종류가 채워진다.
    - 스위치 값이 불리언이 아니면("on" 등) 서버가 422 로 거부한다.
    - 「사용」이 꺼졌는데 「필수」가 켜진 채 남으면 쓰지 않는 항목이 필수로 보인다.
    - 다른 확장이 잠근 칸을 누를 수 있으면 저장 뒤 값이 되돌아가 운영자가 이유를 알 수 없다.
    - 넓은 화면 표와 좁은 화면 카드가 다른 식을 쓰면 화면 폭에 따라 다른 값이 저장된다.
  축 case 는 검증하는 동작이다.

axes:
  case:
    - display_name_inherit              # 「따름」: 종류 선택 없음, 지금 적용되는 값 안내
    - display_name_fixed                # 「고정」: 종류 선택 노출, 서버가 준 종류 전부, 고른 값이 담김
    - display_name_requires_nickname    # 닉네임이 필요한 종류를 고정하면 닉네임 잠금 안내
    - display_name_member               # 「고정」이 아닌 방식으로 바꾸면 kind 가 null
    - display_name_save_body            # 저장 본문에 display_name_setting 이 실림
    - display_name_validation_error     # 서버 검증 오류가 칸 아래에 보임
    - display_name_read_only            # 수정 권한 없는 운영자에게 잠김
    - display_name_i18n                 # 문구 키가 ko 와 en 에 있음
    - guest_fields_fixed_rows           # 고정 행은 네 칸이 켜진 채 잠김
    - guest_fields_toggle_boolean       # 스위치가 그 칸만 불리언으로 바꿈
    - guest_fields_enabled_off_clears_required   # 사용을 끄면 필수도 꺼지고 잠김
    - guest_fields_locked_cells         # 기여한 쪽이 잠근 칸은 비활성, 이유 표시
    - guest_fields_source_badge         # 출처 배지(확장 이름, 추가, 게시판)
    - guest_fields_unavailable_row      # 꺼진 확장의 항목은 「사용 불가」 행
    - guest_fields_add_delete           # 「항목 추가」가 추가 창을 열고 운영자 행만 지울 수 있음, 추가와 지우기가 표 상태에 반영
    - guest_fields_module_defaults      # 「게시판 기본 설정」의 같은 표가 basic_defaults 아래 값을 바꿈
    - guest_fields_admin_detail         # 관리자 글 상세와 댓글이 비회원 항목 값을 보임
    - guest_fields_accessible_names     # 스위치가 행 이름과 열 이름으로, 지우기 단추가 「{항목} 항목 삭제」로 읽힘
    - guest_fields_read_only            # 수정 권한 없는 운영자에게 잠김
    - guest_fields_validation_error     # 서버 검증 오류가 표 아래에 보임
    - guest_fields_mobile_cards         # 좁은 화면 카드가 표와 같은 값, 같은 규칙
    - guest_fields_save_body            # 저장 본문에 guest_author_fields 가 불리언으로 실림
    - guest_fields_i18n                 # 문구 키가 ko 와 en 에 있음

