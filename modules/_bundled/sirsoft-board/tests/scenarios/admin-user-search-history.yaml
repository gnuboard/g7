feature: 관리자 회원 상세 「게시글 검색어」 탭

description: |
  최근 검색어는 회원 정보라 관리자 회원 조회에서 볼 수 있어야 한다(코어 7.1.5). 저장과 응답은 코어가 맡는다 —
  코어 회원 상세 응답 `search_history.scopes` 에 범위 id 를 키로 싣는다. 이 모듈이 선언한 게시글 검색 범위
  (`sirsoft-board.posts`)는 모듈의 회원 데이터라 코어 본문이 아니라 이 모듈의 탭에 선다(모듈 소유 회원 데이터는
  모듈 탭 — 설계 결정 2026-09-21). 스크랩·반응 탭과 같은 짜임(탭 버튼 inject_props + 본문 append_child, id 하나로 연결).

  범위가 응답에 없으면(범위 선언이 빠진 사이트·옛 코어·프로필 응답) 탭도 본문도 서지 않는다. 0건이면 자리를 남긴다.

axes:
  case:
    - board_scope_tab

effects:
  - board_tab_button_and_body_share_one_id       # 탭 버튼·본문이 다른 앵커에 붙고 id 로 이어진다
  - board_tab_hidden_without_scope               # 범위가 응답에 없으면 탭·본문 모두 서지 않는다
  - board_tab_lists_post_scope_keywords_only     # 게시글 검색 범위만, 받은 순서(최신순)·일시·건수
  - board_tab_stands_when_empty                  # 0건이면 자리를 남기고 없다고 말한다

test_files:
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-user-search-history-tab.test.tsx

limitations:
  - "게시판 목록 안 검색창은 아직 이 범위로 기록하지 않는다(이번 범위 밖 — 선언만) — 탭은 기록이 생기면 바로 보인다."
  - "응답 모양(범위 키·최신순·끈 확장 범위 제외)은 코어 시험(tests/Feature/Api/Admin/UserSearchHistoryDetailTest.php)이 잠근다."
