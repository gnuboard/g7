# 시나리오 매니페스트 — 게시판 공개 계약 BoardDirectory
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: board_directory_contract

description: |
  다른 확장(히어로섹션 등)이 게시판 내부 Model·Repository 대신 쓰는 공개 계약 `Contracts\BoardDirectory`.
  게시판 manifest 의 `public_api` 는 `Contracts` 하나만 선언한다.

  - 계약이 컨테이너에 바인딩되고 slug·id·id 묶음으로 찾은 요약에 현재 언어 이름과 목록 경로가 담긴다.
  - 검색은 slug·이름 부분 일치이고 건수를 지킨다. 빈 검색어는 앞에서부터, 0 건 요청은 빈 배열이다.

axes:
  case: [find, search]

effects:
  - board_directory_finds_by_slug_id_and_ids_with_label_and_path  # 바인딩된 계약이 slug·id·id 묶음 조회에 현재 언어 이름과 목록 경로를 담아 돌려준다
  - board_directory_search_matches_keyword_and_respects_limit     # slug·이름 부분 일치 검색, 건수 제한, 빈 검색어는 앞에서부터, 0 건은 빈 배열

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Contracts/BoardDirectoryTest.php
