feature: 관리자 반응 관리 (전 회원 반응 조회·삭제)

description: |
  이슈 #525 제보 ④ — 반응 내역을 권한 있는 운영자가 관리자에서 관리할 수단이 없었다.
  게시판 관리 › 「반응 관리」 메뉴를 신설하고 회원 상세에 요약 탭을 붙인다 (결정 R6).
  스크랩 관리(admin-post-scrap-management.yaml)와 1:1 동형이다.

  핵심 동작 (확정):
    - 반응은 회원 소유 데이터라 게시판 경계를 넘어 조회된다 → 게시판별 권한이 아니라
      **모듈 레벨 권한**(sirsoft-board.reactions.view|manage)을 쓴다
    - 권한 5중 게이트: 라우트 미들웨어 · 컨트롤러 · 리소스(abilities) · 레이아웃 · 메뉴
    - view 만 가진 매니저는 삭제가 403이고, 목록 응답의 abilities.can_manage 가 false 라
      화면이 체크박스·일괄 버튼을 아예 내지 않는다
    - 관리자 목록은 **삭제된 대상도 보여준다** — 정리할 대상을 찾는 화면이기 때문
    - 없는 회원 uuid 필터는 빈 결과다 — 필터를 무시하고 전체를 보여주면 "이 회원의 반응"을
      요청한 화면에 남의 반응이 뜬다
    - 유형 필터 옵션은 **목록 응답 메타**로 준다 — reactions.view 만 가진 매니저는
      settings.read 가 없어 유형 API 를 부를 수 없다. 비활성 유형도 포함한다
    - 삭제는 소유자 무관이며 대상의 reaction_counts 를 재집계한다
    - 일괄 삭제는 회원용과 달리 exists 를 건다 — 관리자는 전 회원 반응을 다루므로 탐색
      통로가 되지 않고, 잘못된 ID 를 조용히 넘기면 실제 삭제 건수와 어긋난다
    - 회원 상세 요약은 filter 훅으로 **관리자 응답에만** 주입한다(프로필 제외)
    - 이메일은 관리자 응답에만, 탈퇴 회원 이름은 익명화한다

