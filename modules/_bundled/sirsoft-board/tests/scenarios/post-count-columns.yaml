feature: 게시판·게시글·댓글 카운트 컬럼 — 정수 캐스트·단수형 응답 키·관리자 화면 사용

description: |
  게시판(posts_count·comments_count), 게시글(replies_count·comments_count·attachments_count),
  댓글(replies_count)에 미리 세어 둔 카운트 컬럼이 있다. 이 컬럼이 모델에서 정수로 읽히고,
  응답에는 단수형 키(reply_count·comment_count·attachment_count)로 실리며, 관리자 게시글 상세
  화면은 배열 길이 대신 이 서버 값을 헤더 숫자로 쓰는지 잰다.

  관리자 화면의 목록 표시는 응답 배열을 그대로 쓴다. 그래서 삭제 댓글 표시(del_cmt)를 켜면
  헤더 숫자(활성 댓글만)와 표시 항목 수(삭제 포함)가 다를 수 있다 — 의도된 정책이다.

axes:
  layer: [model_cast, resource, repository_raw, admin_layout]

effects:
  - board_count_columns_cast_to_integer
  - post_count_columns_cast_to_integer
  - comment_replies_count_cast_to_integer
  - count_columns_integer_when_loaded_from_db
  - post_resource_exposes_attachment_count_integer
  - has_attachment_matches_attachment_count
  - post_resource_count_keys_singular
  - user_activity_response_uses_singular_comment_count
  - admin_reply_header_uses_reply_count
  - admin_comment_header_uses_comment_count
  - admin_attachment_section_uses_server_columns
  - admin_count_not_derived_from_array_length
  - admin_iteration_keeps_response_arrays

