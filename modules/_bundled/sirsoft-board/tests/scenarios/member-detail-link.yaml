feature: 관리자 게시판 화면의 회원 상세 링크 가드 (#757 2단계 후속)

description: |
  작성자·회원 자리의 회원 상세 링크(/admin/users/{uuid})는 uuid 가 있을 때만 링크·메뉴로 그린다.
  회원 글인데 회원 계정이 남지 않으면 작성자 응답이 is_guest=false · uuid=null 이라, is_guest 만 보면
  글자 없는 「/admin/users/」 링크가 생긴다(M1 실측 — 게시글 목록 첫 행). uuid 가 없으면 이름(없으면 「알 수 없음」)만 그린다.

axes:
  guard:
    - member_link              # 링크·작성자 메뉴·신고자 메뉴·행 메뉴(rowActions)

exclusions:
  - { guard: member_link, reason: "제외 없음 — 굽기 산출물 전수 대조 단일 축" }

effects:
  - member_link_requires_uuid          # uuid 가 자기·조상 조건(행 메뉴는 disabledField)에 들어 있다
  - member_name_shown_without_uuid     # uuid 가 없을 때 이름을 그리는 자리가 옆에 있다

test_files:
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/member-detail-link-guard.test.ts
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-member-link-guard.spec.ts
