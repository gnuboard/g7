feature: 신고 케이스 영구 삭제의 신고 로그 명시 삭제

description: |
  신고 케이스(`boards_reports`)를 영구 삭제할 때 그 케이스의 신고 로그(`boards_report_logs`)를 DB 외래키 연쇄에
  맡기지 않고 저장소가 먼저 지운다. 외래키 검사를 끈 채 지워도 고아 로그가 남지 않고, 다른 케이스의 로그는 남는다.

  동작 축(case):
    - force_delete — ReportRepository::forceDelete: 로그 삭제 → 케이스 영구 삭제를 한 트랜잭션으로 처리.

axes:
  case: [force_delete]

effects:
  - force_delete_removes_case_logs_without_fk_cascade
  - force_delete_keeps_other_case_logs

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Report/ReportForceDeleteTest.php
