feature: BoardPermissionService 게시판 권한 생성·역할 동기화·삭제

description: |
  BoardPermissionService 가 게시판 권한 트리를 만들고, 권한별 역할 부여를 차분(diff) 방식으로
  동기화하고, 게시판 삭제 시 권한 트리를 지우는 동작을 서비스 단위로 고정한다.

  동작 축(case):
    - service_contract     — 서비스 인스턴스화와 모듈 식별자 상수.
    - ensure_permissions   — 게시판 권한 생성 시 루트·카테고리·admin.* 는 Admin, 나머지는 User 타입.
    - sync_module_roles    — syncModulePermissionRoles: 변경 없음이면 granted_at 보존, 추가분만 attach,
                             제거분만 detach, 전체 교체.
    - assign_roles         — assignRolesToPermission: 위와 같은 차분 동기화 + permissions 가 비면
                             defaultPermissions 로 폴백.
    - remove_permissions   — removeBoardPermissions: 카테고리·액션 권한·역할 부여·훅 매핑을 DB 외래키
                             연쇄 없이 명시적으로 지우고, 다른 게시판 권한과 모듈 루트 권한은 남긴다.

axes:
  case: [service_contract, ensure_permissions, sync_module_roles, assign_roles, remove_permissions]

effects:
  - service_resolves_instance
  - module_identifier_constant_is_sirsoft_board
  - board_permissions_typed_admin_or_user
  - sync_roles_no_change_preserves_granted_at
  - sync_roles_attaches_only_new_roles
  - sync_roles_detaches_only_dropped_roles
  - sync_roles_full_replacement
  - assign_roles_no_change_preserves_granted_at
  - assign_roles_attaches_only_new_roles
  - assign_roles_detaches_only_dropped_roles
  - assign_roles_falls_back_to_default_permissions
  - remove_board_permissions_deletes_subtree_explicitly
  - remove_board_permissions_keeps_other_boards_and_root

test_files:
  - modules/_bundled/sirsoft-board/tests/Unit/BoardPermissionServiceTest.php
