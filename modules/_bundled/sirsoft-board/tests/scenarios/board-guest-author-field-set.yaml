feature: 게시판 비회원 작성자 항목 집합 (#490 11단계)

description: |
  집합 sirsoft-board.guest_author 의 선언, 게시판별(글과 댓글별) 사용과 필수, 요청 규칙, 값 저장과 파기, 다른 확장이 기여한 항목, 게시판 설정 폼, 추가 정보를 입력하지 않은 회원의 쓰기 차단과 허용 라우트.

axes:
  case:
    - set_and_field_declared
    - default_board_unchanged
    - board_requires_email_on_post
    - surface_settings_are_independent
    - member_writing_unaffected
    - form_payload_for_guest_screens
    - hooks_fire_in_order
    - contributed_field
    - values_purged
    - board_form_round_trip
    - pending_member_write_gate
    - module_defaults          # 「게시판 기본 설정」의 비회원 항목 기본값과 새 게시판 물려받기
    - custom_field_rows        # 운영자 항목 행의 ID 와 is_custom
    - admin_detail_values      # 관리자 글 상세의 비회원 항목 값과 권한

