feature: custom:example board 견본 화면 (#792 WP-S)

description: |
  견본 컨트롤러는 InternalApiClient 로 게시판 공개 API 를 그 회원 자격으로 불러 Blade 로 그린다.
  목록·글보기는 G7 셸(#app) 없이 API 와 같은 글을 보여 주고, 본문은 코어 정리기(HtmlSanitizer)를 거친다.
  볼 권한이 없는 비밀글(API 200 + 본문 null)은 403, 없는 글은 404 견본 오류 화면이다. 관리자 견본은
  비회원 → 관리자 로그인, 일반 회원 → 403, 관리자 → 200. HTML+jQuery 견본은 .html 원문을 그대로 내보낸다.

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Custom/CustomExampleBoardSampleTest.php

axes:
  case:
    - list
    - show
    - errors
    - admin
    - jquery

effects:
  - list_matches_api
  - no_engine_shell
  - locale_switch
  - show_matches_api
  - content_sanitized
  - secret_403_for_other_member
  - missing_404
  - member_header
  - admin_guest_redirect
  - admin_member_403
  - admin_ok_with_status
  - html_view_served_raw
