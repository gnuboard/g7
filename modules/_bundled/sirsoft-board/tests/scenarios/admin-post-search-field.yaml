# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 관리자 게시글 목록 검색 대상 구분

description: |
  이슈 #524 WP-B. 관리자 게시글 목록의 검색 대상은 「전체 / 작성자」뿐이었다. 전체는 제목과
  내용을 함께 훑으므로, 운영자가 「제목에 그 말이 든 글만」을 골라낼 방법이 없었다 — 신고를
  확인하러 들어와 본문에 흔한 낱말이 스친 글 수십 건을 눈으로 다시 걸렀다.

  사용자 목록과 같은 세 갈래(`title_content` · `title` · `content`)를 연다. 값 문자열은 서버
  화이트리스트(`PostIndexRequest`)와 같아야 한다 — 다르면 화면에는 보이지만 서버가 조용히
  무시하는 «장식 셀렉트» 가 된다(계획서 부록 B D7 가 기록한 발송 이력 화면의 전례).

  `all` 의 동작은 건드리지 않는다. 기존 링크·저장된 검색이 그대로 살아 있어야 한다.

  답글 검색(7.1.0 실측 O-K3-13): 관리자 목록 검색은 원글만 훑었다. 이제 어느 검색 대상이든 답글(제목·내용·작성자)도
  찾는다. 목록은 원글 한 줄 아래 답글 줄을 잇고 페이지·총 건수를 원글 단위로 세므로, 답글이 걸리면 그 답글이 달린
  맨 위 원글을 결과로 세고 원글 아래 답글 줄을 함께 보인다. 총 건수와 페이지는 같은 원글 ID 로 센다.

# 입력 axis
#  search_field: 검색 대상 (all 은 종전 동작 유지)
axes:
  search_field: [all, title_content, title, content, author]

effects:
  # 백엔드
  - admin_post_list_search_field_title_only
  - admin_post_list_search_field_content_only
  - admin_post_list_search_field_all_unchanged
  - admin_post_list_search_matches_replies
  - admin_post_list_search_reply_match_counts_parents_once
  # 레이아웃
  - admin_post_search_field_offers_five_targets
  - admin_post_search_field_values_match_server_whitelist
  - admin_post_search_field_labels_have_ko_en
  - admin_post_search_field_travels_in_filters_query

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Admin/AdminPostSearchFieldTest.php
  - modules/_bundled/sirsoft-board/tests/Feature/Admin/AdminPostReplySearchTest.php
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-board-posts-search-fields.test.ts

validation:
  audit_rule: test-scenario-coverage
