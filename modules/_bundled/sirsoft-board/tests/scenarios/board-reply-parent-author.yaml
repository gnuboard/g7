# audit:allow test-scenario-coverage[cross_product] reason: issue:#857 이 매니페스트의 조합을 재는 시험은 test_files 의 spec 뿐인데, 그 spec 은 test.describe.skip 상태라(활성화 조건은 spec 머리말) 실행되지 않는다. 건너뛴 시험의 마킹은 커버로 세지 않으므로(docs/testing-guide.md 「describe.skip 인 spec 의 그 축 커버리지는 0」) 조합이 미커버로 남는다. 같은 조합을 재는 다른 실행 시험은 없다(후속 대조). spec 의 skip 을 풀면 이 표식을 걷고 pending_effects 를 effects 로 되돌린다.

feature: 관리자 답변 작성 폼 — 원본 게시글 카드에 부모글 작성자명 노출 (브라우저)

description: |
  답변 작성 폼 상단의 「원본 게시글」 카드가 부모글 작성자를 `parent_post.user.name`
  으로 읽어 항상 undefined 가 되고 「작성자 미상」 폴백만 보였다. 백엔드 form-meta 응답은 작성자를
  `parent_post.author.name` 으로 내려주므로 레이아웃 바인딩을 그 키로 고쳤다.

  레이아웃 JSON 이 author.name 을 참조하는지는 Vitest admin-reply-parent-author 가, form-meta 응답이
  author.name 을 포함하는지는 Feature 테스트가 고정한다. 여기서는 실제 작성자명이 DOM 에 렌더되는지를
  잰다. 조합은 하나(게시판 관리자, 공개된 부모글, 작성자명 렌더)뿐이라 case 축에 그 하나만 둔다.

  spec 은 PlaywrightIssueToken 발급이 가능하고 작성자가 있는 부모글이 시드된 환경에서 test.describe.skip 을
  풀어 실행한다.

# axis 의미:
#   case — manager_reply_to_published_parent 게시판 관리자가 작성자(회원)가 있는 공개 부모글에 답변 폼을 연다.
axes:
  case: [manager_reply_to_published_parent]

effects:
  # Vitest admin-reply-parent-author — 레이아웃 JSON 바인딩 계약(조합 축이 아니라 효과로만 매핑)
  - reply_form_layout_binds_parent_author_name   # 원본 게시글 카드가 parent_post.author.name 을 읽는다
  - reply_form_layout_avoids_missing_user_key    # 백엔드에 없는 parent_post.user.name 을 읽지 않는다

# 아래 효과는 아직 실행되는 시험이 재지 않는다 — test_files 의 spec 이 test.describe.skip 상태라 건너뛴 시험의 @effects 는
# 커버가 아니다. spec 의 skip 을 풀면 effects 로 되돌린다.
pending_effects:
  # 답변 작성 폼의 원본 게시글 카드에 부모글 작성자명이 보이고 「작성자 미상」 폴백이 없다
  - reply_form_renders_parent_post_author_name

test_files:
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-reply-parent-author.spec.ts
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-reply-parent-author.test.tsx
