# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 관리자 스크랩 관리 (전 회원·전 게시판)

description: |
  이슈 #524 WP-A. 스크랩은 회원 본인만 볼 수 있었다 — 운영자는 「누가 무엇을 스크랩했나」를
  알 방법이 없어, 특정 글이 왜 갑자기 조회수가 뛰는지·어떤 회원이 무엇을 모으고 있는지를
  물어 오면 DB 를 직접 열어야 했다. 이 작업은 그 축을 화면으로 세운다.

  회원 상세 「스크랩」 탭은 **요약만** 낸다(결정 R1) — 건수와 최근 시각, 그리고 이 회원으로
  좁힌 목록으로 가는 링크. 같은 표를 회원 상세 안에 한 벌 더 두지 않는다.

  스크랩 레코드는 원글·게시판이 지워져도 남는다. 목록에서 감추면 정리할 대상을 찾지 못하므로,
  삭제된 원글의 제목과 게시판 삭제 여부를 배지로 드러낸다.

  엔드포인트:
    - GET    /api/modules/sirsoft-board/admin/scraps        (전 회원 목록, 검색 6갈래·게시판·기간·회원)
    - DELETE /api/modules/sirsoft-board/admin/scraps/bulk   (일괄 해제 — `{id}` 보다 먼저 선언)
    - DELETE /api/modules/sirsoft-board/admin/scraps/{id}   (단건 해제)

  권한: `sirsoft-board.scraps.view`(조회) · `sirsoft-board.scraps.manage`(삭제).
  삭제는 훅 `after_toggle` 을 «스크랩 소유자» id 로 발화하되, 활동 로그의 행위자는 관리자다
  (`ResolvesActivityLogType::logActivity` 가 로그인한 주체로 채운다 — 계획서 §8.2 T4b).

# 입력 axis
#  surface     : 조회 지점 (관리자 목록 / 회원 상세 탭)
#  permission  : 운영자가 가진 권한 (view 만 / manage 까지)
#  search_field: 검색 대상 6갈래
#  member_scope: 회원 한정(user_uuid) 으로 들어왔는가
#  board_state : 원글이 속한 게시판 상태
axes:
  surface: [admin_list, member_detail_tab]
  permission: [view, manage]
  search_field: [all, post_title, post_content, board_name, member, author_name]
  member_scope: [true, false]
  board_state: [alive, deleted]

# 의미 없는 조합 컷:
#  - 회원 상세 탭은 요약만 내므로 검색 갈래가 없다
#  - 회원 상세 탭은 언제나 그 회원 한정이라 member_scope=false 가 성립하지 않는다
exclusions:
  - { surface: member_detail_tab, search_field: post_title, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, search_field: post_content, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, search_field: board_name, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, search_field: member, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, search_field: author_name, reason: "요약만 내는 탭 — 검색 UI 없음" }
  - { surface: member_detail_tab, member_scope: false, reason: "탭 자체가 그 회원 한정" }

