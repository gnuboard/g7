feature: 게시글 검색엔진용 화면의 og:image

description: |
  이미지 첨부가 있는 게시글을 소셜 봇이 열면 검색엔진용 화면에 첨부 미리보기 주소로 og:image 메타가 실린다.
  사용자 템플릿이 설치·활성 상태여야 SEO 라우트가 해석되므로, 템플릿 의존 모듈(게시판 포함)은 매니페스트
  실버전으로 등록한다.

axis_notes:
  case: |
    image_attachment 는 이미지 첨부가 있는 공개 게시글이다.

axes:
  case: [image_attachment]

effects:
  - post_seo_emits_og_image_from_attachment_preview  # og:image 가 첨부 미리보기 절대 주소로 실린다
  # docblock 정리 때 사후 등재 — 모듈 SEO 선언 단위 테스트(BoardModuleSeoTest)의 og 기본값 단언
  - og_defaults_read_image_from_thumbnail_key        # og:image 를 PostResource 의 thumbnail 키에서 꺼낸다
  - og_defaults_omit_image_without_thumbnail         # thumbnail 이 없으면 예외 없이 image 키만 뺀다
  - seo_image_is_absolute_without_mount_prefix       # 표준 배치에서 og:image 와 schema.image 가 절대 주소로 실린다

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/Seo/PostSeoOgImageRenderingTest.php
  - modules/_bundled/sirsoft-board/tests/Unit/BoardModuleSeoTest.php
