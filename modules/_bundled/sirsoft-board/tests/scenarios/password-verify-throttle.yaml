feature: 비밀번호 확인 엔드포인트 요청 제한 (#891)

description: |
  비밀글 비밀번호 확인만 IP 분당 10회로 묶여 있고, 비회원 댓글 비밀번호 확인은 제한이 없으며 비회원 글의 수정·삭제용
  확인은 그룹 제한(분당 600회)뿐이었다. 세 엔드포인트(스레드 비밀번호 확인 포함 네 라우트)가 같은 제한기를 써서
  합산으로 센다.

  글·댓글의 수정·삭제 요청도 비밀번호를 본문으로 직접 받아 비교하므로, 비밀번호가 실린 수정·삭제 요청은 같은
  제한기로 센다. 비밀번호가 없는 요청(회원 본인 수정, 확인 토큰으로 오는 요청)은 세지 않는다.

axes:
  case:
    - comment_verify_password
    - post_verify_password_for_modify
    - shared_across_endpoints
    - modify_request_carrying_password
    - modify_request_without_password

effects:
  - eleventh_attempt_returns_429
  - verify_endpoints_share_one_counter
  - requests_without_password_are_not_counted

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/PasswordVerifyThrottleTest.php
