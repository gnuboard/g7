validation:
  note: |
    각 결함 테스트는 수정 전 코드(origin/develop 기준 게시판 모듈)에서 fail 을 확인했다. 대조군(자기 게시판·본인 글·
    역할 공유)으로 회귀(전체 차단)가 아님을 함께 단언한다. 상태 코드는 403 을 직접 단언해 500 으로 새지 않음을 고정한다.
    신고 관리(reports.*)는 범위를 두지 않는다 — 범위 메타를 선언에서 빼고, 옛 「본인만」 부여 행이 남아도 보유만으로 동작함을 고정한다.
