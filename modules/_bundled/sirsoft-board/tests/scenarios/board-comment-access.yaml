  - admin_can_create_comment
  - unauthenticated_cannot_create_comment
  - user_without_permission_cannot_create_comment
  - cannot_create_comment_when_comments_disabled
  - admin_manage_can_update_any_comment
  - admin_write_can_update_own_comment
  - admin_write_cannot_update_others_comment
  - admin_write_cannot_update_guest_comment
  - admin_manage_can_delete_any_comment
  - admin_write_can_delete_own_comment
  - user_without_permission_cannot_delete_comment
  - admin_manage_can_blind_comment
  - blind_comment_reason_at_max_length_passes
  - blind_comment_reason_over_max_length_fails
  - blind_comment_does_not_change_comments_count
  - admin_write_cannot_blind_comment
  - cannot_blind_comment_when_comments_disabled
  - admin_manage_can_restore_blinded_comment
  - restore_comment_syncs_comments_count
  - admin_write_cannot_restore_comment
