feature: 게시판 댓글 관리 권한과 비회원 댓글 비밀번호 확인

description: |
  관리자 화면의 댓글 작성, 수정, 삭제 권한 경계와 비회원 댓글의 비밀번호 확인 API 를 고정한다.

  기존 회귀 테스트의 소유권을 2026-10-04 PHPUnit 12 대비 속성 전환 때 시험 파일을 고치며 사후 등재했다.
  축 action 은 댓글에 하는 요청(관리자 작성, 수정, 삭제, 블라인드, 복구, 비회원 댓글 비밀번호 확인), entitlement 는 요청자가 그 요청을 할 자격이 있는지다.
  자격은 권한(관리, 작성 전용, 권한 없음, 미인증)과 소유 여부, 게시판 댓글 사용 설정, 비회원 댓글 비밀번호가 함께 정한다.
  자격이 있어도 입력이 잘못되거나 대상이 없으면 entitled 칸에서 거절 응답을 본다.

axes:
  action: [create, update, delete, blind, restore, verify_password]
  entitlement: [entitled, not_entitled]

