# audit:allow test-scenario-coverage[cross_product] reason: issue:#857 이 매니페스트의 조합을 재는 시험은 test_files 의 spec 뿐인데, 그 spec 은 test.describe.skip 상태라(활성화 조건은 spec 머리말) 실행되지 않는다. 건너뛴 시험의 마킹은 커버로 세지 않으므로(docs/testing-guide.md 「describe.skip 인 spec 의 그 축 커버리지는 0」) 조합이 미커버로 남는다. 같은 조합을 재는 다른 실행 시험은 없다(후속 대조). spec 의 skip 을 풀면 이 표식을 걷고 pending_effects 를 effects 로 되돌린다.

feature: 허용 확장자 미지정 게시판의 첨부 선택 — 사용자 글쓰기 accept 기본 확장자 폴백 (브라우저)

description: |
  이슈 #78 R3 — 백엔드는 빈 확장자를 기본 확장자로 폴백하도록 이미 고쳐졌지만, 프런트에 같은
  `[]`-truthiness 쌍둥이가 남아 사용자는 파일 선택 단계에서 막혔다. 요청 자체가 나가지 않으므로 서버측
  회귀 테스트(board-conditional-validation 의 AttachmentAllowedExtensionsFallbackTest)로는 잡히지 않는다.

  연쇄: DB `NULL` → API 가 `allowed_extensions: []` 로 직렬화 → 레이아웃 `ext ? '.' + ext.join(',.') : fallback`
  에서 `[]` 가 truthy → `accept="."` → useFileUploader 확장자 게이트가 전 파일 거부, 안내문이 `(.)` 로 깨짐.

  화면은 사용자 글쓰기(`free` 확장자 미지정, `gallery` 확장자 지정)만 잰다. 관리자 글쓰기 화면은 이 spec 이
  재지 않으므로 축에 두지 않았다.

  spec 은 PlaywrightIssueToken 발급이 가능한 환경에서 test.describe.skip 을 풀어 실행한다.

# axis 의미:
#   allowed_extensions — 대상 게시판의 허용 확장자 설정. empty 미지정(free), specified 목록 지정(gallery).
axes:
  allowed_extensions: [empty, specified]

effects: []

# 아래 효과는 아직 실행되는 시험이 재지 않는다 — test_files 의 spec 이 test.describe.skip 상태라 건너뛴 시험의 @effects 는
# 커버가 아니다. spec 의 skip 을 풀면 effects 로 되돌린다.
pending_effects:
  # 확장자 미지정 게시판의 파일 입력 accept 가 「.」 이 아니라 기본 확장자 목록이다
  - empty_extensions_accept_falls_back_to_defaults
  # 확장자 미지정 게시판에서 png 를 고르면 형식 거부 안내 없이 첨부된다
  - empty_extensions_file_selection_succeeds
  # 확장자를 지정한 게시판의 accept 는 그 목록을 반영하고 기본 목록으로 떨어지지 않는다
  - specified_extensions_accept_reflects_list

test_files:
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/user/board-empty-extensions-attachment.spec.ts
