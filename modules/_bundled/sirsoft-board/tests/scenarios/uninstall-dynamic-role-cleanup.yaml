feature: 모듈 제거 시 게시판별 동적 역할 정리

description: |
  게시판 모듈을 제거하면 게시판별 동적 역할(sirsoft-board.*.manager·step)을 모두 지운다.

  동작 축(case):
    - chunk_beyond_offset   — 역할이 첫 청크(1000건)를 넘어도 키셋 순회(chunkById)로 전건을 지운다.
    - pivot_detach          — OFFSET 순회가 건너뛰던 뒤쪽 역할의 권한 연결도 뗀다.
    - menu_links_without_fk — 역할의 메뉴 연결(role_menus)·메뉴 권한(menu_permissions)을 DB 외래키 연쇄 없이
                              명시적으로 지운다(#888).
    - other_extension_kept  — 다른 확장이 소유한 역할은 지우지 않는다.

axes:
  case: [chunk_beyond_offset, pivot_detach, menu_links_without_fk, other_extension_kept]

effects:
  - every_dynamic_role_removed
  - tail_role_permission_pivots_removed
  - role_menu_links_removed_without_fk_cascade
  - other_extension_roles_kept

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/UninstallDynamicRoleCleanupTest.php
