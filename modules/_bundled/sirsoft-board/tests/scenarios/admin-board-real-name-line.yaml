feature: 게시판 관리자 화면 — 작성자(회원) 이름의 실명 보조 줄 (#490 P17)

description: |
  관리자 응답의 이름 키에는 「관리자 화면의 표시 이름」이 실리고, 요청한 관리자에게 회원 조회 권한이 있고
  실명이 표시 이름과 다를 때만 실명이 별도 키(real_name, author_real_name)로 실린다.
  레이아웃은 그 키가 있을 때만 이름 곁에 작고 흐린 실명 줄을 그리고 화면 낭독기용 이름(「실명: 홍길동」)을 준다.
  대상: 게시글 관리 목록, 글 상세(본문, 답글, 댓글), 스크랩 관리, 반응 관리, 신고 목록과 상세, 대시보드 조각.

  조용히 깨지는 지점:
    - 키가 없는데 빈 줄이 그려지면 권한 없는 관리자 화면에 빈 자리가 생긴다.
    - 표 칸 안에서 번역 인자를 「$t:키|인자」 로 쓰면 행 값 없이 먼저 번역돼 낭독 이름이 「실명: 」 으로 빈다.
    - 이름 자리의 식을 실명 키로 바꾸면 표시 이름 대신 실명이 드러난다.
  축 case 는 검증하는 화면과 상태다.

axes:
  case:
    - posts_index_with_real_name      # 게시글 관리 목록: 실명 키가 있으면 보조 줄
    - posts_index_without_real_name   # 게시글 관리 목록: 키가 없으면(권한 없음, 같음, 비회원) 그리지 않음
    - other_screens_real_name         # 나머지 화면: 같은 규칙
    - real_name_i18n                  # 문구 키가 ko 와 en 에 있고 표 칸은 호출식으로 이름을 넘김

effects:
  - real_name_line_drawn_when_key_present
  - real_name_line_absent_when_key_missing
  - name_expression_unchanged
  - real_name_label_exists_in_ko_and_en

test_files:
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-board-posts-real-name.test.tsx
