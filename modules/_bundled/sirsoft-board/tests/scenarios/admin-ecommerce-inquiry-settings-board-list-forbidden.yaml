# 시나리오 매니페스트 — 쇼핑몰 환경설정 「문의 게시판」, 게시판 목록을 볼 권한이 없는 운영자
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: admin_ecommerce_inquiry_settings_board_list_forbidden

description: >-
  쇼핑몰 설정 권한만 있고 게시판 조회 권한은 없는 운영자가 쇼핑몰 환경설정을 열면 게시판 모듈이 붙인
  「문의 게시판」 칸의 게시판 목록이 403 이 된다. 종전에는 오류 처리가 없어 「해당 권한이 없습니다.」 알림이 뜨고,
  칸에는 저장된 게시판 대신 「게시판을 선택하세요」 가 보였으며, 칸이 열려 있어 그 안내(빈 값)를 고르고 저장하면
  문의 게시판이 지워졌다. 403 은 알림 없이 넘기고, 목록을 못 받으면 칸을 잠근 채 저장된 게시판을 보이고 안내를
  낸다. 저장 본문의 문의 게시판은 저장값 그대로다. 목록을 받은 운영자는 종전대로 목록에서 고른다.

test_files:
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-ecommerce-inquiry-settings-board-list-forbidden.test.tsx

coverage_strategy: full

# axis 의미:
#   board_list_response — 게시판 목록 데이터소스 응답. 200 은 게시판 조회 권한이 있는 운영자,
#                         403 은 쇼핑몰 설정 권한만 있는 운영자, 500 은 권한과 무관한 서버 실패.
axes:
  board_list_response: [200, 403, 500]

effects:
  - board_list_403_is_silent   # 403 은 데이터소스 처리기(suppress)가 받아 알림을 내지 않는다
  - board_list_server_error_still_alerts   # 권한 외 실패는 종전대로 알림
  - board_list_failure_marks_list_unavailable   # 받기 실패면 목록 자리가 「못 받음」 표시가 있는 빈 목록
  - inquiry_select_locked_showing_saved_board   # 목록을 못 받으면 칸이 잠기고 저장된 게시판을 보인다
  - inquiry_list_unavailable_notice_shown   # 목록을 못 받으면 바꿀 수 없다는 안내
  - inquiry_board_slug_kept_on_save   # 다른 칸을 고쳐 저장해도 문의 게시판은 저장값 그대로 실린다
  - inquiry_select_editable_with_board_list   # 목록을 받으면 칸이 열려 있고 안내가 없다
  - inquiry_board_change_saved   # 목록에서 고른 게시판이 저장 본문에 실린다
