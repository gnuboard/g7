feature: 게시글 SEO 이미지의 사이트 주소 고정 (요청 Host 비신뢰)

description: |
  게시글 og:image·JSON-LD image 가 url() 로 만들어져 위조 Host 로 그린 봇 화면이 캐시에 남아 모든 크롤러·SNS
  미리보기에 퍼졌다. 사이트 주소로 만든다.

axes:
  # forged = 위조 Host 변종 4종(외부 도메인·사이트 하위 도메인·포트만 바꾼 Host·신뢰 프록시 X-Forwarded-Host)을
  #          코어 `Tests\Concerns\ForgesRequestHost::forgedHosts()` 데이터 제공자가 모두 돈다. 같은 제공자에
  #          사이트 주소(canonical) 행이 함께 있어, 그 행이 사이트 주소 Host 에서도 같은 값을 내는지 본다.
  host_header: [canonical, forged]
  sink: [seo_image]

exclusions:
  - { sink: seo_image, host_header: canonical, reason: "forged 데이터 제공자가 사이트 주소(canonical) 행을 함께 돈다 — 같은 테스트가 두 축을 덮는다" }

effects:
  - seo_image_uses_site_address

test_files:
  - modules/_bundled/sirsoft-board/tests/Unit/BoardSeoHostTrustTest.php
