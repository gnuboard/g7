feature: board_author_display_name_e2e

description: |
  표시 이름 설정이 게시글 작성자 표시에 실제 브라우저에서 이어지는지 잰다 (#490 계획서 10절 ④의 게시글 작성자, T6-c).
  게시판 글 영역(sirsoft-board:posts)은 사이트 기본 영역(core:site)을 따른다. 사이트 기본이 「이름」이면 회원이 쓴 글의 작성자는 실명이고,
  「닉네임」으로 고정하면 같은 글(이미 쓴 글 포함)의 작성자가 게시판 목록과 글 보기에서 닉네임으로 바뀐다.
  운영자 화면 조작은 코어 매니페스트 member-fields-e2e(display_name_nickname)가 재고, 여기서는 설정을 API 로 바꾼다.
  스펙은 임시 게시판(playwright:seed-board-posts), 시험 회원, 회원 탭 설정을 afterAll 에서 되돌린다.

coverage_strategy: full

axes:
  case:
    - site_name
    - site_nickname

effects:
  - board_author_shows_real_name_when_site_default_is_name
  - board_author_follows_site_default_nickname

test_files:
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/user/board-author-display-name.spec.ts
