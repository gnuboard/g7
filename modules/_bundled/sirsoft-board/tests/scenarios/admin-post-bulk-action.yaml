  - modules/_bundled/sirsoft-board/tests/Feature/Admin/AdminPostBlindRestoreTest.php
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/admin-board-posts-bulk.test.tsx
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-posts-bulk.spec.ts

