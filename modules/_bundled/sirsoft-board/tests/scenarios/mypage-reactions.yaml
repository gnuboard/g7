feature: 마이페이지 「내 반응」 (조회·단건/선택 해제)

description: |
  이슈 #525 제보 ③ — 반응을 남긴 내역을 회원이 마이페이지에서 확인·관리할 수단이 없었다.
  게시판 활동 탭 안 「내 반응」 서브탭으로 내 글·내 댓글과 같은 수준으로 제공한다 (결정 R3).

  핵심 동작 (확정):
    - 게시글 반응과 댓글 반응이 **한 목록**에 섞여 나온다 (target_type 으로 구분)
    - 댓글 반응도 이동은 부모 글 상세로 간다 — 제목은 언제나 글 제목, 발췌는 댓글 본문 80자
    - 대상이 삭제됐거나 게시판이 사라졌어도 행은 남는다. 어느 상태든 **해제는 허용**한다
      (결정 R11) — 남긴 기록의 회수는 게시판 설정과 무관한 회원의 권리다
    - 해제 시 대상의 reaction_counts 를 실제 행 수로 재집계한다. 대상이 하드 삭제됐으면
      재집계할 캐시가 없으므로 조용히 넘어간다(행만 사라지면 된다)
    - 선택 해제는 남의 ID·없는 ID 를 **조용히 건너뛰고** 실제 건수만 돌려준다 —
      exists 를 걸면 "그 ID 가 존재하는가" 가 422/200 으로 갈려 ID 탐색 통로가 된다
    - 필터 셀렉트 옵션(유형)은 목록 응답 메타로 온다. **비활성 유형도 포함** —
      이미 끈 유형으로 남긴 과거 반응도 골라낼 수 있어야 한다
    - 제목 전용 검색은 댓글 분기를 켜지 않는다(댓글에는 제목이 없다).
      검색은 삭제된 대상을 결과에서 뺀다 — 링크 없는 행을 찾아 내도 할 일이 없다

