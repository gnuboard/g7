feature: 개별 게시판 수정 화면 숫자 입력 경계값과 서버 한계값 일치 (브라우저)

description: |
  공개 이슈 #81 — 같은 설정 항목이 게시판 환경설정(모듈 기본값)과 개별 게시판 수정 두 화면에 있는데
  경계 안내는 환경설정에만 있었다. 개별 게시판 수정 화면에는 min/max 가 없어, 사용자는 저장을 눌러
  422 를 받아야만 범위를 알 수 있었다.

  레이아웃 표현식(_local.form._meta.limits.*)과 폴백 값은 Vitest board-form-range-contract 가 고정한다.
  여기서는 폼 데이터 응답의 `_meta.limits` 를 직접 읽어, 개별 게시판 수정 화면(샘플 시드 `free`)의
  숫자 입력 min/max 속성이 그 값과 같은지 잰다. 폴백 값이 서버 기본치와 같으면 화면만 봐서는 잘못된
  경로를 구분할 수 없어서다. 모듈 기본값 화면의 min/max 는 board-settings-range-hints 가 잰다.

  시험이 하나라 case 축에 그 시험 하나만 둔다(모듈 기본값 화면은 board-settings-range-hints 몫이라 값으로 두지 않는다).

# axis 의미:
#   case — per_board_edit 개별 게시판 수정 화면(샘플 시드 free)의 숫자 입력 전체.
axes:
  case: [per_board_edit]

effects:
  # 개별 게시판 수정 화면의 숫자 입력 min/max 가 폼 데이터 응답의 _meta.limits 와 같다
  - form_boundary_matches_server_limits
  # Vitest board-form-range-contract — 레이아웃 표현식·폴백 계약(조합 축이 아니라 효과로만 매핑)
  - per_board_form_number_inputs_have_min_max                 # 개별 게시판 수정 화면 숫자 입력이 min/max 를 갖는다
  - per_board_form_bounds_read_meta_limits_with_server_fallback # 그 값이 _local.form._meta.limits 표현식이고 폴백이 서버 기본치와 같다

test_files:
  - modules/_bundled/sirsoft-board/tests/Playwright/specs/admin/board-form-range-parity.spec.ts
  - modules/_bundled/sirsoft-board/resources/js/__tests__/layouts/board-form-range-contract.test.ts
