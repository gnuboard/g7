feature: 게시판 첨부의 원래 파일 이름 저장

description: |
  브라우저는 multipart/form-data 의 파일 이름에서 큰따옴표를 `%22`, CR 을 `%0D`, LF 를 `%0A` 로 바꿔 보낸다.
  첨부 업로드가 그 값을 그대로 저장하면 글 보기 화면의 첨부 목록과 내려받은 파일 이름에 `%22` 가 남는다.
  업로드는 코어 도우미(`App\Support\UploadedFileName`)로 이름을 읽어 원래 이름으로 저장하고, 회원과 관리자
  내려받기 두 통로의 `filename*` 에도 원래 이름이 실린다. 이미 저장된 이름은 바꾸지 않는다.

  복원 규칙 자체(세 문자만, 대소문자 무관, 다른 퍼센트 보존)는 코어 매니페스트
  tests/scenarios/upload-original-filename.yaml 이 잰다.

axes:
  download_route: [user, admin]

effects:
  - board_upload_response_carries_original_name
  - board_attachment_stores_original_name
  - board_download_declares_original_name

test_files:
  - modules/_bundled/sirsoft-board/tests/Feature/User/AttachmentOriginalFilenameTest.php
