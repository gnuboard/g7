validation:
  audit_rule: frontend-change-requires-e2e
  note: |
    입력 조합 전수(case)는 백엔드/프론트/E2E 테스트가 @scenario/@effects 마킹으로 커버한다.
    브라우저 수준의 등록→전환→해제 사용자 흐름은 board-reaction-flow.spec.ts 가 담당한다
    (PlaywrightIssueToken 발급 가능 환경에서 describe.skip 해제).
