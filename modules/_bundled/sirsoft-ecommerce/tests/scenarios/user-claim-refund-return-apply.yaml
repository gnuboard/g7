feature: 구매자 클레임 신청서 작성 — 반품 · 취소/환불 유형 고유 축 (#599 S12)

description: |
  S11 이 세 유형을 모두 여는 작성 셸을 놓았고, 이 세션은 그 셸에서 **유형이 갈리는 지점**만
  잇는다 — 반품 요약의 세 줄, 취소·환불의 분기(즉시취소 ↔ 환불신청), 계좌 환불 주문의 환불계좌
  입력, 그리고 접수 뒤의 철회. 조용히 깨지는 지점은 다섯이다.

  ① **반품의 환불 예정액은 청구 방식에 따라 뜻이 달라진다.** 회수비를 환불금에서 차감하는
     방식(`deduct_from_refund`)이면 서버의 `adjustment.refund_total` 은 **이미 차감된 뒤**의
     금액이다. 그 값 하나만 "환불 예정액" 으로 그리면 §6-3 이 요구하는 세 줄(환불예정 / 회수비 /
     최종) 가운데 첫 줄이 사라지고, 구매자는 회수비가 어디서 빠졌는지 알 수 없다. 반대로 화면이
     회수비를 되더해 차감 전 금액을 만들면 예고와 청구가 서로 다른 식을 쓰게 된다 — 훅이 금액을
     덮어쓴 상점에서 둘이 어긋나도 어느 쪽이 맞는지 알 수 없다. 그래서 차감 전 금액과 차감액을
     **서버가 함께 낸다**. 별도 결제 방식에서는 차감액이 0 이고 두 금액이 같아 세 줄이 서지 않는다.

  ② **취소·환불은 한 화면이지만 서버는 두 파이프라인으로 갈린다.** 결제완료 상품은 즉시취소로
     바로 환불되고, 배송준비 이후 상품은 환불신청서로 심사를 받는다. 두 분기의 상품을 한
     신청서에 섞으면 서버가 신청 **전체**를 거절한다(`claim_refund_branch_mixed`). 화면이 그
     조합을 만들 수 있게 두면 구매자는 사유까지 다 채운 뒤에야 "나누어 신청해 주세요" 를 받는데,
     미리보기도 같은 이유로 실패하므로 금액조차 보지 못한 채 막힌다. 그래서 다른 분기의 상품은
     애초에 잠그고, 잠근 이유를 밝힌다 — 밝히지 않으면 체크가 먹지 않는 고장으로 보인다.

  ③ **분기는 화면 라벨도 정한다** (§6-3 — 헤더 라벨 / 안내 문구 / 실행 버튼). 그런데 그 판정을
     서버의 `resolved_type` 에 맡기면 두 분기가 섞인 주문에서 값이 `mixed` 라, 구매자가
     결제완료 상품만 골라 **즉시 취소되는데도** 화면은 "환불 신청" 이라 부르고 "판매자 확인을
     거친다" 고 안내한다. 라벨은 **지금 고른 상품**의 분기를 따라야 한다. 아직 아무것도 고르지
     않았을 때만 서버 판정으로 떨어진다.

  ④ **어느 결제수단이 계좌 환불인지는 서버가 정한다.** 확장 결제수단은 자기 카탈로그에
     `refund_method` 를 선언하고 미선언 수단은 PG 필요 여부로 갈린다
     (`PaymentMethodResolver::refundMethod`). 화면이 결제수단 코드를 보고 그 규칙을 재현하면
     확장이 수단을 더할 때마다 판정이 갈리고, 어긋난 쪽은 오류 없이 "계좌 입력칸이 없는 계좌
     환불"(승인 뒤 관리자가 다시 받아야 한다) 또는 "PG 환불인데 계좌를 요구"(구매자가 쓸모없는
     정보를 넣는다)가 된다. 그리고 **이미 저장된 계좌를 프리필하지 않는다** — 주문 결제 리소스는
     계좌번호·예금주를 열람자 자격에 따라 마스킹하므로, 그 값을 입력칸에 채우면 구매자가 손대지
     않고 제출했을 때 별표가 섞인 계좌번호가 저장된다. 검증은 통과하고 환불 실행 때가 되어서야
     드러난다.

  ⑤ **철회는 되돌릴 수 없고 이미 받은 추가결제를 함께 환급한다.** 대상 없이 모달을 열면 확인
     버튼이 어느 신청서를 가리키는지 알 수 없고, 그 상태의 확인은 아무 일도 하지 않으면서 오류도
     남기지 않는다. 닫을 때 대상을 지우지 않으면 다음에 다른 신청서로 열었을 때 앞 대상이 남아
     고르지 않은 신청서가 철회된다. 승인 뒤 철회는 서버가 409 로 거절하는데, 그 사유는 구매자가
     고칠 수 있는 것이 아니지만 **왜 안 되는지**는 알아야 하므로 모달 안에 남긴다.

# axis 의미:
#   claim_type    — 반품과 취소·환불은 요약 구성도 페이로드도 다르다. 교환은 S11 이 관통까지
#                   덮었으므로 이 매니페스트의 축이 아니다.
#   charge_method — 반품 요약의 줄 수를 가르는 유일한 축이다. 차감 방식만 세 줄이 서고, 별도
#                   결제 방식은 두 줄이다. 교환은 이 축이 금액 구성을 바꾸지 않는다(S11 판단).
#   환불계좌는 유형 축이 아니다 — 반품·취소·환불 셋 다 구매자에게 돈이 돌아가므로 계좌 환불
#   주문이면 세 화면 모두 입력칸을 세운다(§6-3). 교환만 서지 않는다(돌려줄 돈이 없다).
#   refund_branch — 취소·환불의 분기. 두 값 **모두 환불신청서를 만들고** 전이 방식만 갈린다 —
#                   `auto`(구 `cancel`)는 승인·환불완료까지 자동, `request`(구 `refund`)는
#                   접수에서 멈춘다. `mixed` 는 서버가 거절하는 조합이라 화면이 만들 수 없어야
#                   하므로 값이 아니라 **차단**이 산출물이다. `none` 은 그 축이 걸리지 않는
#                   유형(반품)을 가리키는 자리표시이며 exclusions 가 그 조합을 잘라낸다.
#
# 청구 **수단**(축2: card / point)은 축이 아니다 — 화면이 하는 일은 운영자 허용 목록만 노출하고
# 차감 방식에서 비활성으로 표시하는 것이며(S11 이 덮었다), 결제 실행은 서버·PG 플러그인이 갖는다.
# 계좌 환불 여부(`refund_account.required`)도 축이 아니라 서버가 내려주는 값이라 이름 붙은
# effect 가 양쪽(필요/불필요)을 덮는다.
axes:
  claim_type: [return, refund]
  charge_method: [deduct_from_refund, pay_on_request, none]
  refund_branch: [auto, request, mixed, none]

# 두 축은 서로 다른 유형에 걸린다 — 반품은 분기가 없고, 취소·환불은 회수 배송이 없어 청구가
# 발생하지 않는다(§6-3). 전 교차곱을 세우면 성립하지 않는 조합이 커버된 것처럼 보이므로 그
# 조합을 사유와 함께 제외한다. 남는 것은 5 케이스다 — 반품 2(청구 방식) + 취소·환불 3(분기).
exclusions:
  - { claim_type: return, refund_branch: [auto, request, mixed], reason: "반품은 자동 전이/운영자 승인으로 갈리지 않는다 — 분기 판정은 취소·환불 유형만의 축이다" }
  - { claim_type: return, charge_method: none, reason: "반품은 회수 배송비가 있으므로 청구 방식이 언제나 정해진다" }
  - { claim_type: refund, charge_method: [deduct_from_refund, pay_on_request], reason: "취소·환불은 회수 배송이 없어 청구가 발생하지 않는다 — 청구 2축 자체가 미노출이다(§6-3)" }
  - { claim_type: refund, refund_branch: none, reason: "취소·환불은 상품 상태가 언제나 한 분기를 지목한다 — 어느 분기에도 속하지 않는 상품은 이 화면의 줄이 되지 않는다" }

