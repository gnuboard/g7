notes: |
  **철회 모달의 진입점은 S13 소유다.** 이 세션은 확인 절차(`templates/_bundled/sirsoft-basic/layouts/partials/mypage/claims/_modal_withdraw.g7.html`)와 실행
  핸들러를 놓고, 목록·상세의 [철회] 버튼은 S13 이 세운다 — 계획서 §8-1 이 철회 실측을 S13 에
  배정한 것과 같은 순서다. 화면마다 확인 모달을 복제하지 않으려면 공용 partial 이 먼저 있어야
  하므로 여기서 만든다. 진입점이 없는 동안에도 구조·상태 전이는 렌더 테스트와 핸들러 테스트가
  덮으므로 검증되지 않은 채로 남지 않는다.

  **분기 혼재는 화면이 만들 수 없어야 하는 조합이다.** 그래서 `refund_branch: mixed` 는 "그
  조합으로 신청했을 때 무엇이 되는가" 가 아니라 "그 조합을 만들 수 없는가" 를 잰다 — 잠금(체크
  disabled) · 안내 문구 · 전체 선택이 한 분기만 고르는가 셋이다.

  **브라우저 실측이 결함 둘을 찾았다** (2026-08-31, 확인). 둘 다 단위 테스트가 전부 초록인
  상태에서 나왔고, 오류도 로그도 남기지 않았다.

   ⓐ **결제를 마치고 돌아오면 404 였다.** 복귀 주소가 신청서 상세로 고정돼 있었는데 그 화면은
      뒤 세션이 만든다 — 성공·실패·취소 전부 같은 404 라 구매자는 돈이 나갔는지조차 알 수 없었다.
      복귀 주소를 지금 서 있는 화면으로 바꾸고, 그 화면에 세 결과를 구분하는 안내를 세웠다.

   ⓑ **철회 주소를 핸들러가 잘못 조립했다.** 회원 철회 라우트는 주문 스코프가 **아닌데**
      (`/user/claims/{no}/withdraw`) 신청서 작성용 주문 스코프 주소로 이어 붙여 404 가 됐다.
      비회원은 반대로 주문 스코프가 있어 한 규칙으로 조립할 수 없다 — 앞부분을 셸이 준다.
      단위 테스트가 핸들러가 만든 주소를 그대로 단언하고 있어 **자기 자신과만 맞았다**;
      이제 두 라우트의 실제 모양을 각각 고정한다.

  **PG 실호출은 이 매니페스트의 축이 아니다.** 클레임 추가결제의 채번·승인·철회 환급은 서버와
  결제 플러그인이 갖는 축이라 `claim-additional-payment.yaml` 이 덮고, 이 화면이 하는 일은
  응답이 지목한 핸들러를 그대로 dispatch 하는 것뿐이다(S11 이 덮은
  `claim_apply_submit_dispatches_server_named_pg_handler`).

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: Playwright MCP   # #599 3차 실측 세션2 — 실제 주문·신청으로 재실측
  note: |
    T2-D5(계좌가 비면 [환불 신청하기]가 잠긴다)의 브라우저 축은 Playwright MCP 재실측이 덮는다.
    Playwright spec 을 새로 두지 않는 이유는 이 축이 **주문 → 결제(무통장) → 배송완료 → 환불신청**
    까지 실제 상태를 만들어야 성립하는데, 이 템플릿의 spec 들은 그 앞단 결제 왕복을 만들지 못해
    spec 안에서 재현하면 계좌 칸 자체가 서지 않아 **잠금이 아니라 부재를 재게 되기 때문이다**
    (가짜 초록 — 게이트를 지워도 통과한다).

    대신 두 겹으로 받친다. ① 레이아웃 렌더 테스트가 게이트를 정적으로 잠근다
    (`userClaimApplyRender.test.tsx` 3건: 비면 disabled·채우면 해제·PG 주문은 애초에 미대상 —
    게이트를 빼면 첫 건이 red). ② 서버가 같은 술어로 422 를 낸다
    (`UserClaimRefundBranchTest::test_bank_refund_is_rejected_without_an_account`).
    화면과 서버가 같은 술어(`OrderRefundRequestService::refundsToBankAccount()`)를 쓰므로
    한쪽만 통과하는 상태가 생기지 않는다.
