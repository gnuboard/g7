# 시나리오 매니페스트 — 마일리지 내역 표 머리 정렬이 서버 허용값으로 나간다 (7.1.1 13e)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: admin_mileage_sort_query

description: >-
  마일리지 내역 표의 「일시」·「금액」 머리 정렬이 방향을 버린 `sort=created_at`·`sort=amount` 로 나가 서버가 422 를 돌려줬다
  (허용값은 created_at_desc·created_at_asc·amount_desc·amount_asc). 표는 (열, 방향) 두 값을 내고, 레이아웃이 `{열}_{방향}` 으로 합친다.
  반대 방향(7.1.1, 2026-10-19): 표가 지금 정렬을 받지 않아 머리 화살표가 주소의 sort 를 따르지 않았고, 선택칸에 created_at_asc 항목이 없었다.
  레이아웃이 query.sort(없으면 created_at_desc)를 sortField·sortDirection 으로 풀어 넘기고, 선택칸은 서버 허용 4값을 모두 갖는다.

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminMileageSortQuery.test.tsx

coverage_strategy: pairwise

axes:
  column: [created_at, amount]
  direction: [asc, desc]

effects:
  - mileage_sort_query_matches_server   # 정렬 가능한 열 × 방향이 모두 서버 허용값 안의 sort 로 이동한다
  - mileage_sort_header_reflects_query   # 머리 화살표(sortField·sortDirection)가 query.sort 를 따르고, 정렬 선택칸 항목이 서버 허용 4값(ko·en·ja 문구)과 같다

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: 7.1.1 출시 전 캠페인 재실측(머리 정렬 뒤 목록 요청 200·순서 바뀜)
  note: |
    수정 전 red(2026-10-18): 4 failed / 5(sort=created_at·amount). 수정 후 5 passed.
    화살표·선택칸(2026-10-19): 수정 전 6 failed / 11(화살표 5건 — sortField undefined, 선택칸 1건 — created_at_asc 없음) → 수정 후 11 passed.
    메인 레이아웃 시험(admin_ecommerce_mileage_transaction_index.test.tsx)의 정렬 Select 항목 고정값(3항목)을 4항목으로 갱신.
