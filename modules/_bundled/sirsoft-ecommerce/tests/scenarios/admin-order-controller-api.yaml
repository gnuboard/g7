notes: |
  이 매니페스트는 역매핑 룰(test-scenario-reverse-mapping)이 테스트마다 @scenario/@effects 를 요구하면서
  드러난 «소유자 없는 테스트 43건» 을 받기 위해 세웠다(#699). 전이·진행단계·비회원 관심사는 위 세
  매니페스트가 계속 소유하고, 이 파일은 그 셋에 속하지 않는 엔드포인트 계약만 담는다.

  E2E 미해당: API 계약 층이며, 같은 동작의 화면 축은 관리자 주문 목록·상세 레이아웃 매니페스트
  (admin-order-list-layouts · admin-order-detail-layout-structure)가 맡는다.
