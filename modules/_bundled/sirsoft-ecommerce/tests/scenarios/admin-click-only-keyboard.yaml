# 시나리오 매니페스트 — 이커머스 화면에서 클릭만 받던 영역을 키보드·화면 낭독기로 쓴다 (7.1.1)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: admin_click_only_keyboard

description: >-
  이커머스 관리자 화면의 저장한 검색 조건 칩·상태 필터 배지·기간 빠른 선택·상품 등록 구획 머리(접기)·분류 고르기·
  배너 목록·후기 사진·분류 이미지·개인결제 회원/주문 찾기 창 행이 클릭만 받는 `<div>`(사진은 `<img>`, 결제 실패 이력은
  `<tr>`·`<td>`)라 Tab 으로 닿지 않고 Enter·Space 로 누를 수 없었으며, 화면 낭독기에는 단추로 읽히지 않았다(7.1.1 출시 전
  실측 대조 「같은 모양」 표, 이커머스 레이아웃 정적 스캔 110 노드).

  고침은 요소를 `<button type="button">` 으로 그리고 액션은 그대로 둔 것이다. 고르는 칩·카드는 `aria-pressed`, 접는 머리는
  `aria-expanded`, 노출 스위치는 `role="switch"`·`aria-checked` 로 상태를 알린다. 표 행처럼 통째로 단추가 될 수 없는 자리는
  자기 동작 없는 대리 단추(상태 속성 + 이름)를 품어 그 단추의 눌림이 행 클릭으로 올라가게 했다. 같은 동작을 하는 이름 링크를
  이미 품은 목록 카드(공통정보·상품정보고시)는 카드를 그대로 둔다.

  잠금 시험은 이커머스 레이아웃 JSON 전체에서 클릭을 받는 요소를 모집단으로 파생한다 — 새 화면에도 그대로 걸린다.

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminClickOnlyKeyboard.test.tsx
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/headerCurrencySelectorEscape.test.tsx
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/buttonTypeExplicit.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/headerCurrencySelectorSlotOpenFocus.test.tsx

coverage_strategy: pairwise

axes:
  surface:
    - admin_layout   # 관리자 레이아웃 전체(칩·접는 머리·분류·배너·사진·창 안 행) — 모집단 파생 정적 단언 + 대표 화면 렌더
    - admin_row   # 표 행(결제 실패 이력) — 대리 단추로 행 클릭을 키보드로 올린다
    - admin_extension   # 헤더 통화·배송국가 선택 확장 조각(관리자·사용자) — 열린 목록을 Esc 로 닫고 초점을 트리거로 돌린다

exclusions:
  - { surface: admin_row, reason: "표 행은 결제 실패 이력 한 화면뿐이다 — 같은 모집단 단언이 새 표 행에도 걸린다" }

effects:
  - click_only_region_keyboard_operable   # 클릭을 받는 요소가 단추·링크(또는 role·tabIndex·keydown, 대리 단추, 같은 동작 링크)라 Tab·Enter·Space 로 쓴다
  - button_type_explicit   # 레이아웃·확장 조각의 모든 단추가 type 을 적는다 — 폼 안에 주입돼도 제출 단추가 되지 않는다(관찰)
  - currency_dropdown_keeps_focus_on_open   # 슬롯 실물 구조(첫 그림 앵커 사본 포함)에서 통화 단추를 Enter 로 연 뒤에도 초점이 살아 있는 통화 단추에 있고 Tab 으로 항목에 닿는다(E2E)
  - currency_dropdown_closes_on_escape   # 헤더 통화 선택 목록이 Esc 로 닫히고(항목·트리거 어디서든) 초점이 트리거 단추로 돌아온다. 닫혀 있을 때 Esc 는 아무것도 바꾸지 않는다. 열려 있을 때의 트리거 Esc 는 바깥(서랍 닫기)으로 올라가지 않고, 닫혀 있을 때는 올라가 서랍이 닫힌다(2026-10-19)

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: 7.1.1 출시 전 캠페인 재실측(필터 칩·상품 등록 구획 머리·기간 빠른 선택·결제 실패 이력 행을 키보드로 조작, 접근성 트리 button pressed/expanded)
  note: |
    수정 전 red(2026-10-18, 잠금 시험 첫 실행): 7 failed / 7 — 모집단 108(같은 동작 링크를 품은 목록 카드 2 는 판정 ④ 로 제외),
    칩 aria-pressed 미비 63, 구획 머리 15, 렌더 4건은 단추 0개(Unable to find role "button").
    수정 후 green 7 / 7. 이미 단추였던 클레임·주문 목록 기간 칩 12개는 aria-pressed 만 더했다.
    통화 선택 Esc(같은 날 추가): 수정 전 6 failed / 8(관리자·사용자 각 2건 — Esc 뒤 showCurrencyDropdown 이 true 그대로, focusElement 핸들러 없음 2건) → 수정 후 8 passed.
    단추 type 명시: 수정 전 2 failed / 2(type 없는 Button 75개 · 31파일 — 헤더 통화 선택 조각 6 포함) → 수정 후 2 passed.
    통화 연 뒤 초점: 운영 렌더 경로(TemplateApp·renderTemplate·SlotProvider) 시험 수정 전 2 failed / 2(관리자·사용자 — 초점 BODY) → 수정 후 4 passed(+ defer 단위 2).
    통화 트리거 Esc 전파(2026-10-19): 조각을 뿌리 Esc(열려 있을 때만 서랍 닫기) 상자 안에 그린 시험 수정 전 4 failed / 12(관리자·사용자 각 2 — 열린 채 트리거 Esc 가 서랍까지 닫음) → 수정 후 13 passed(+ stopEventPropagation 단위 1).
    액션 키 stopPropagation + if 로 나누는 안은 닫혀 있을 때도 막아 2 failed(닫힘 → 서랍 닫기 단언) — 키가 if 보다 먼저 적용된다.
