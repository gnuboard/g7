feature: 이커머스 본문 미디어 전용 표 → 범용 첨부 표 이관 (1.3.4 업그레이드 데이터 단계, #887)

description: |
  1.3.4 개발 중 만든 전용 표 `ecommerce_content_media` 의 행을 이 모듈 범용 첨부 표 `ecommerce_attachments`(collection=content_media)
  로 옮긴다(`upgrades/data/1.3.4/migrations/03_MoveContentMediaToEcommerceAttachments`). 저장된 본문이 해시 주소로 참조하므로 해시를
  그대로 옮기고, 파일은 옮기지 않으므로 디스크·카테고리 기준 경로를 그대로 적는다(서빙이 같은 파일을 읽음). 소유 종류는 상품·공통
  정보 모델 클래스, 임시 키·meta·올린 사람·시각·소프트 삭제 시각은 그대로. 모두 옮기면 전용 표와 그 마이그레이션 기록을 지운다.
  다른 행과 해시가 겹치거나 소유 종류를 모르면 그 행을 옮기지 않고 전용 표를 남기며, 걷어 낸 뒤 다시 돌리면 이미 옮긴 행은
  건너뛰고 마저 옮긴다. 새 표가 아직 없으면 보류한다. 공개판(전용 표 없음)은 no-op(남은 옛 마이그레이션 기록만 지움).
  모듈 마이그레이션 `2026_11_10_000002_drop_ecommerce_content_media_table` 은 빈 전용 표만 지운다(행이 있으면 업그레이드 단계 몫).

