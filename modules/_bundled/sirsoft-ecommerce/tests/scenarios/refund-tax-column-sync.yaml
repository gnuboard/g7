feature: refund_tax_column_sync

description: |
  환불이 끝나면 **주문 헤더가 현재 상태를 반영한다** — 세금 분류·현금성 컬럼 (S3-D17)

  **증상**: 전액 환불된 주문에 **현금영수증이 발급 가능하다고 답한다.**
  실측(2026-09-16 · 주문 964): 전액 환불 후에도 `issuable.amount = 62,000`.

  **원인**: `CashReceiptService::calculateIssuableAmount()` 은 주문 헤더의 세금·현금성
  컬럼을 **그대로** 읽고, 그 주석이 「**지금 이 주문이 얼마짜리인가**만 읽으면 된다」를
  계약으로 명시한다. 전액취소 경로는 이미 0 으로 내리는데(세션1 S1-D22) **반품·교환 발
  환불만 빠져 있었다** — 같은 「돈을 다 돌려준 주문」인데 **경로에 따라 헤더가 달랐다.**

  핵심 계약:
    - 동기화 컬럼 목록의 정본은 `RefundExecutionService::TAX_SYNC_COLUMNS` **하나**다(환불신청 서비스도 이 상수를 참조한다).
      `RefundExecutionService` 는 받은 것을 그대로 쓴다 — 두 곳이 각자 목록을 들면
      한쪽만 늘렸을 때 조용히 잘린다(실측: 실행 쪽이 3개뿐이라 `total_cash_equivalent_amount`
      가 빠져 발급 가능액이 62,000 으로 남았다).
    - **금액 컬럼은 건드리지 않는다.** 클레임 환불은 `total_refunded_amount` 로 누적한다 —
      `total_paid_amount` 까지 깎으면 잔여 한도(`paid - refunded`)가 같은 금액을 두 번 뺀다
      (`RefundExecutionService::execute()` 독블록). 그래서 이 스위트는 세금 컬럼이 0 이 되는
      것과 **금액 컬럼이 그대로인 것**을 함께 잠근다 — 한쪽만 잠그면 반대 방향으로 돈이 어긋난다.
    - `mc_*` 는 base 와 짝을 맞춘다 — 한쪽만 내리면 한 행 안에서 어긋난다(S1-D22 전례).

  테스트 작성 주의:
    - 신청서에 **`refundOptions` 행을 반드시 단다.** 없으면 실행 경로가 「덜어낼 상품이
      없다」로 보고 재계산을 건너뛰어, 결함이 고쳐졌는데도 red 가 선다(실데이터 RF166·167
      은 그 행이 1·2건이다).
    - `refund_method` 는 `bank` 로 둔다 — `pg` 면 테스트가 실제 PG 를 호출해 죽는다.
    - 픽스처가 카드 주문이라 `total_cash_equivalent_amount = 0` 이고(실측: 주문 965),
      발급 가능액은 그 자리에서 0 을 낸다. 그래서 단언 대상은 **세금 컬럼 자체**다 —
      컬럼이 맞으면 무통장 주문의 발급 판정도 따라 맞는다(주문 964 실측이 그 경로).

axes:
  claim_type: [refund]
  coverage: [full, partial]

effects:
  # ── 헤더 동기화 (P0) ──
  # 전액 환불이면 세금·현금성 컬럼이 0 이어야 한다. 아니면 세금 문서를 끊을 수 있다.
  - fully_refunded_order_is_not_cash_receipt_issuable
  # ── 이중 차감 방지 (P0) ──
  # 세금을 맞추면서 금액 컬럼까지 건드리면 잔여 한도가 같은 금액을 두 번 뺀다.
  - refund_does_not_touch_paid_amount

test_files:
  # 환불 후 주문 헤더 세금·현금성 컬럼 동기화
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/RefundTaxColumnSyncTest.php
