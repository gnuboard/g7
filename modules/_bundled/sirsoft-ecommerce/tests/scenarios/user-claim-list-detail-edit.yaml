notes: |
  **§9-1 의 매니페스트 수가 10 → 11 이 된다.** §7 S15 DoD 가 그 숫자를 인용하므로 함께 정정한다.
  이 화면들은 앞의 두 작성 매니페스트가 덮지 않는 축(목록 왕복 · 목록 응답의 하위 컬렉션 ·
  상세 관계 · 수정 모드)을 갖는다.

  **E2E 는 S15 소유다.** §9-3 이 `user-claim-list(철회+수정 edit 포함)` spec 을 S15 에 배정했다.
  이 세션은 렌더 테스트(3종)와 핸들러 테스트로 축을 덮고, 브라우저 실측(§8-1 S13 — T1·T3·T4·T6)
  으로 관통을 확인한다. spec 골격은 S15 가 이 매니페스트의 축을 그대로 옮겨 세운다.

  **비회원(guest)은 이 매니페스트의 축이 아니다.** 비회원 셸 2종과 guest 라우트는 S14 소유이며,
  같은 partial 을 재사용하고 셸 계약값(isGuest · claimWithdrawApiBase · claimEditApiBase ·
  데이터소스 endpoint)만 바꾼다. 수정 주소 해석이 비회원 경로(`{shopBase}/guest/claims/{번호}/edit`)
  에서도 같은 위치로 읽히는지는 이 세션의 핸들러 테스트가 이미 고정했다.

  **`pay_on_approval` 로 접수된 신청서의 결제 진입점** — 2026-09-01 2차 계획 검증 에서
  "S13 에서 지금 만든다" 로 확정됐다. 상세의 추가결제 블록에 결제 버튼이 서고
  `sirsoft-ecommerce.payClaimOutstanding` 이 `POST {payApiBase}/{결제번호}/pay` 를 부른다
  (그전까지 그 엔드포인트의 프로덕션 소비처는 0 건이었다). 결제 수단은 보내지 않는다 —
  서버가 결제 대기 건을 만들 때 이미 상점의 허용 수단으로 확정해 두었고, 여기서 다시 고르게
  하면 주문 스코프인 `claimable-options` 를 상세도 읽어야 한다. **수단 변경은 별개 축으로
  남는다.** 비회원 진입점은 S14 소유다 — 같은 partial 을 쓰고 셸이 `claimPayApiBase` 에
  주문 스코프가 붙은 주소를 세운다.
