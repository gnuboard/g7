feature: 구매자 클레임 신청내역 — 목록 · 상세 · 수정 (#599 S13)

description: |
  S11·S12 가 신청서를 **내는** 화면을 놓았고, 이 세션은 낸 뒤에 보고 고치는 화면을 놓는다 —
  유형 서브탭 목록, 신청서 상세, 그리고 승인 전 수정(edit). 조용히 깨지는 지점은 여섯이다.

  ① **유형마다 서버가 다른 테이블을 읽는다.** 목록은 한 번에 한 유형만 받고(`type`) 그 유형의
     테이블을 페이지네이션한다. 그래서 서브탭 전환은 같은 목록 안의 이동이 아니라 **목록
     정체성이 바뀌는 이동**이다 — 앞 유형의 페이지 번호를 물려받으면 3페이지가 없는 유형에서
     빈 화면이 열리고, 응답은 200 이라 어긋난 사실이 어디에도 남지 않는다. 반대로 페이지 이동과
     상세 왕복은 같은 목록 안의 이동이므로 서브탭·페이지를 그대로 물려줘야 한다.

  ② **금액 열의 구성이 유형마다 다르다** (§6-1). 교환은 왕복 배송비와 옵션 차액이 총 청구액으로
     모이고, 반품은 회수 편도 배송비가, 환불·취소는 환불액이 그 자리에 온다. 분기가 어긋나면
     다른 유형의 줄이 서거나 있어야 할 줄이 빠지는데 둘 다 오류를 남기지 않는다.
     **반품 행에는 환불액을 싣지 않는다** — 그 금액은 환불신청서가 접수되기(D26 완료 처리)
     전에는 도메인 어디에도 없고, 화면이 미리보기를 행마다 다시 돌려 추정치를 세우면 목록 한
     번이 페이지 크기만큼의 계산이 되며 그 수는 실제 환불액과 다를 수 있다. 관리자 목록도 같은
     근거로 싣지 않는다.

  ③ **목록은 화면이 그 행에서 그리는 것만 실어야 한다.** 이 리소스는 목록·상세 겸용이라 상세용
     필드(첨부 전량 · 주소/배송비 스냅샷 JSON · 상세 사유 · 반려 사유 · 환불 계좌)까지 행마다
     실렸다. `per_page` 상한이 50 이고 신청서 하나가 상품 200줄까지 가질 수 있어, 그대로 두면
     한 페이지를 여는 것만으로 수천 줄이 응답에 실린다. 정적 룰은 `*ListResource`/`toListArray()`
     만 보는데 이 리소스는 겸용이라 모집단 밖이다 — "0 error" 가 준수 증거가 아니다.
     상품 행(`items`)은 남는다: 목록 카드가 상품마다 썸네일·옵션·수량·금액을 그린다.

  ④ **상세는 목록보다 많은 관계를 필요로 한다.** 번호 해석(`resolveByNumber`)이 싣는 관계는
     소유권 판정에 필요한 최소한(상품 행·첨부·주문)이라 그대로 내보내면 상품명·옵션명·썸네일과
     회수·재발송 배송사명·추적 URL 이 **오류 없이 전부 null** 이 된다. 응답은 200 이고 키도
     그대로 있어 어긋난 흔적이 어디에도 남지 않는다.

  ⑤ **수정 라우트에는 유형도 주문번호도 없다** (`/mypage/claims/{번호}/edit`). 둘 다 신청서가
     알려 준다 — 작성 화면의 유형 가드를 그대로 적용하면 수정 진입이 통째로 404 가 되고, 주문
     데이터소스의 첫 호출은 주문번호를 아직 모르므로 **반드시 404** 다. 그 404 에 오류 화면을
     세우면 수정 화면이 열리지 않고, 반대로 무조건 삼키면 작성 진입에서 열 수 없는 주문이 빈
     신청서로 열린다. 그리고 수정 미리보기에 **자기 신청서 번호를 빼놓으면** 자기가 잡아 둔
     수량에 자기가 막혀 거절되어, 재발송지를 바꿔도 배송비가 다시 계산되지 않는다(D14).

  ⑥ **수정에서 이미 귀속된 첨부를 그 자리에서 지우면 안 된다.** 삭제 엔드포인트는 소유만 확인하고
     파일까지 지우므로, 저장을 취소하고 나가도 첨부만 영구히 사라진다. 서버의 장수 상한 판정은
     "삭제 후 남을 장수" 를 함께 보므로 화면이 먼저 지우면 그 판정도 갈린다 — 삭제 목록에 담아
     저장할 때 `remove_image_ids` 로 한 흐름에 넘긴다.

# axis 의미:
#   claim_type — 목록 서브탭이자 금액 열·상세 섹션의 분기다. 네 유형이 서로 다른 테이블이라
#                하나라도 빠지면 그 탭만 조용히 다른 모양이 된다.
#   screen     — 같은 리소스를 읽는 두 표현(목록/상세)과 그것을 고치는 화면(수정). 목록과 상세는
#                **실어야 할 것이 다르다**(③④)는 것이 이 축의 요지다.
#   entry      — 목록에서 들어왔는가 상세에서 들어왔는가. 수정·철회의 진입점이 두 곳이고 두
#                진입이 같은 확인 절차·같은 저장 경로를 써야 한다.
#
# 청구 방식·환불 분기는 이 매니페스트의 축이 아니다 — 신청서를 내는 시점의 축이라
# `user-claim-exchange-apply.yaml` / `user-claim-refund-return-apply.yaml` 이 덮는다. 이 화면은
# 접수된 값을 읽고 그중 D13 이 여는 것만 고친다.
axes:
  claim_type: [exchange, return, refund, cancel]
  screen: [list, detail, edit]
  entry: [list, detail, none]

# 취소 이력은 신청서가 아니라 처리 결과다 — 되돌릴 것도 고칠 것도 없어 수정·철회 진입점이
# 서지 않는다(`is_editable`/`is_withdrawable` 이 언제나 false). 환불신청서도 D13 이 여는 축
# (사유·상세 사유·첨부)은 있으나 재발송지가 없어 수정 화면의 교환 전용 절이 성립하지 않는다.
exclusions:
  - { claim_type: cancel, screen: edit, reason: "취소 이력은 신청서가 아니라 처리 결과다 — 수정 경로 자체가 없다(서버가 notEditable 로 거절한다)" }
  - { screen: [list, detail], entry: [list, detail], reason: "진입 축은 수정·철회에만 걸린다 — 목록·상세 자신은 진입점이 아니라 도착지다" }
  - { screen: edit, entry: none, reason: "수정은 언제나 목록 또는 상세의 [수정] 버튼으로 들어온다 — 주소를 직접 입력한 진입도 그 둘과 같은 화면이다" }

