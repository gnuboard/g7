feature: 저장된 다통화(mc_*) 금액 절사 잔차 정규화 업그레이드 (1.3.0)

description: |
  1.3.0 이전에 기록된 mc_* 금액은 4505 × 0.01 = 45.050000000000004 같은 부동소수 잔차를 들고 있다.
  NormalizeStoredMultiCurrencyRounding 이 과거 행의 잔차만 제거하되 실제 정밀값·정수 표기·_formatted·_meta 는
  바꾸지 않고, 재실행해도 결과가 같으며, 대상 테이블을 하드코딩하지 않고 스키마의 mc_* 컬럼에서 찾는다.

axes:
  case: [float_residue, formatted_and_meta, integer_amount, precise_value, rerun, target_discovery]

effects:
  - float_residue_removed
  - formatted_and_meta_untouched
  - integer_amounts_kept_integer
  - precise_values_unchanged
  - normalization_idempotent
  - targets_derived_from_schema

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Upgrades/NormalizeStoredMultiCurrencyRoundingTest.php
