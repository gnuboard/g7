feature: 관리자 쇼핑몰 설정 본인인증 정책 탭 — 정책 삭제는 확인 모달로 연다 (#297)

description: |
  쇼핑몰 환경설정 "본인인증 정책" 탭의 삭제 버튼이 등록되지 않은 `confirm` 핸들러를 불러
  "Unknown action handler: confirm" 토스트만 뜨고 삭제가 실행되지 않던 결함(#297)의 회귀 방지다.
  고친 구조는 세 조각으로 나뉜다.

  - 탭 partial: 삭제 버튼(PC 표와 모바일 카드 두 곳)은 `setState(_global.ecommerceIdentityPolicyDeleteId)`
    뒤에 `openModal(ecommerce_identity_policy_delete_modal)` 을 부르는 sequence 다. confirm 핸들러는 어디에도 없다.
  - 삭제 모달: 그 id 로 DELETE 를 보내고 성공하면 `ecommerceIdentityPolicies` 를 다시 읽는다. 진행 중
    값 `_global.ecommerceIdentityPolicyDeleting` 이 취소와 삭제 버튼을 함께 잠그고 스피너를 띄운다.
    바닥 단추는 #869 P1 에서 Modal 고정 하단(`props.footer`)으로 옮겨 갔다.
  - 설정 레이아웃: 그 모달 partial 이 `modals` 배열에 등록돼 있어야 openModal 이 찾는다.

  같은 탭의 쪽 링크(admin-settings-identity-policies-pager)와 재는 동작이 달라 따로 둔다.

axes:
  # 삭제 흐름이 걸친 레이아웃 조각
  surface: [tab_partial, delete_modal, settings_layout]

effects:
  - identity_policy_tab_has_no_confirm_handler                  # 탭 partial 어디에도 handler "confirm" 이 없다
  - delete_button_sets_target_id_and_opens_delete_modal         # 삭제 버튼 sequence 가 id 를 세우고 삭제 모달을 연다 (PC, 모바일 2곳 이상)
  - delete_modal_registered_in_settings_modals                  # 설정 레이아웃 modals 에 삭제 모달 partial 이 있다
  - delete_modal_calls_delete_api_and_refetches_policies        # 삭제 모달이 그 id 로 DELETE 를 보내고 ecommerceIdentityPolicies 를 다시 읽는다
  - delete_modal_locks_buttons_and_shows_spinner_while_deleting # 진행 중 값이 두 버튼 disabled 와 스피너 if 를 함께 잡는다

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/identityPolicyDeleteModal.test.ts

validation:
  audit_rule: test-scenario-coverage
