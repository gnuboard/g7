feature: 상품 후기 모델의 테이블·캐스트·관계 계약 (ProductReview)

description: |
  ProductReview 모델의 기본 계약(테이블명·소프트 삭제·속성 캐스트·관계·이미지 정렬)을 고정한다.
  이 단위 테스트는 매니페스트 없이 존재했고, 주문옵션당 활성 후기 1건 유니크(member-review-write-and-reply.yaml)
  도입에 맞춰 KVE-2026-3187~3195 보안 작업이 픽스처를 고치며 함께 등재한다.

# axis 의미: 모델 계약의 영역. 영역마다 독립 단언이라 조합 분기는 없다.
axes:
  aspect: [table, cast, relation]

effects:
  - product_review_uses_reviews_table_with_soft_deletes        # 테이블 ecommerce_product_reviews, SoftDeletes 사용
  - product_review_casts_status_rating_snapshot_and_reply_time # status→ReviewStatus, rating→int, option_snapshot→array, replied_at→Carbon
  - product_review_belongs_to_product_option_user_and_admin    # 상품·주문옵션·작성 회원·답변 관리자 관계
  - product_review_reply_admin_null_without_reply              # 답변이 없으면 답변 관리자 관계는 null
  - product_review_images_loaded_in_sort_order                 # 이미지 관계는 여러 건, sort_order 오름차순

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Models/ProductReviewTest.php
