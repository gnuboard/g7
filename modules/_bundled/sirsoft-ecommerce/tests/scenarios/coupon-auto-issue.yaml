feature: 쿠폰 자동발급 — 가입·첫구매·생일, 발급 한도 공유, 만료 임박 알림, 폼·설정 탭 (#952 A)

description: |
  가입(활성 가입·활성화 시점)·첫구매(발급 시점 5종·회수·재발급)·생일(사이트 날짜·2/29) 자동발급과 직접발급 한도 공유,
  만료 임박 알림 명령, 발급 규칙 검증, 쇼핑몰 설정 쿠폰 탭, 마이그레이션·1.4.1 업그레이드, 관리자 폼과 가입 브라우저 흐름을 잰다.

