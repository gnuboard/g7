# audit:allow test-scenario-coverage[cross_product] reason: issue:#857 이 매니페스트의 조합을 재는 시험은 test_files 의 spec 뿐인데, 그 spec 은 test.describe.skip 상태라(활성화 조건은 spec 머리말) 실행되지 않는다. 건너뛴 시험의 마킹은 커버로 세지 않으므로(docs/testing-guide.md 「describe.skip 인 spec 의 그 축 커버리지는 0」) 조합이 미커버로 남는다. 같은 조합을 재는 다른 실행 시험은 없다(후속 대조). spec 의 skip 을 풀면 이 표식을 걷고 pending_effects 를 effects 로 되돌린다.

feature: 통화별 사용 언어(locales) 저장 검증과 오류 표시 (관리자 E2E)

description: |
  시드 기본값이 사이트 지원 언어(ko/en/ja) 밖의 locale(zh, de/fr/es/it)을 박아 두어 통화 설정 저장이
  in:supported_locales 검증에 영구 차단되고("설정 저장에 실패했습니다"), 오류가 다른 폼처럼 필드 강조와
  친화 필드명 메시지로 나오지 않던 결함의 브라우저 회귀 가드다.

  시드 정리 자체는 normalize-currency-locales.yaml(업그레이드 단위 테스트)이 잰다. 이 매니페스트는
  환경설정 화면에서 저장이 통과하는지와, 지원하지 않는 언어가 들어 있을 때 그 입력칸에 오류가 붙는지만 본다.

  spec 은 testid 보강 전까지 test.describe.skip 이다(placeholder).

axes:
  locale_input:
    - supported_locale     # 지원 언어만 지정 (기본값 상태)
    - unsupported_locale   # 지원하지 않는 언어가 섞인 통화

effects: []

# 아래 효과는 아직 실행되는 시험이 재지 않는다 — test_files 의 spec 이 test.describe.skip 상태라 건너뛴 시험의 @effects 는
# 커버가 아니다. spec 의 skip 을 풀면 effects 로 되돌린다.
pending_effects:
  - supported_locales_save_without_error              # 지원 언어만이면 저장 실패 토스트와 입력칸 오류가 뜨지 않는다
  - unsupported_locale_error_shown_on_currency_field  # 지원 외 언어가 있으면 그 통화의 locales 입력칸에 오류가 붙는다
  - unsupported_locale_error_uses_friendly_field_name # 오류 문구가 raw 경로(language_currency.currencies)가 아닌 친화 필드명을 쓴다

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Playwright/specs/admin/currency-locale-save.spec.ts
