  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Notifications/ClaimNotificationDefinitionsTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Notifications/ClaimStatusNotificationTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Listeners/ClaimNotificationDataListenerTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Listeners/ClaimActivityLogListenerTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/ClaimPaymentServiceTest.php

validation:
  audit_rule: test-scenario-coverage
