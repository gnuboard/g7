feature: 관리자 주문상세 레이아웃 — 셸·주문정보·결제정보·활동로그·모달의 구조 계약

description: |
  관리자 주문 상세(`admin/ecommerce/orders/:orderNumber`)는 셸 레이아웃 하나와 탭 partial 셋,
  모달 일곱 개로 이루어진다. 이 매니페스트는 **그 JSON 들이 서로 약속한 배선**을 잠근다 —
  데이터소스 아이디, 바인딩 경로, 핸들러 이름, 모달 집합. 값이 아니라 배선이라 화면은
  깨진 뒤에도 조용하다(빈 칸·미표시).

  ① **금액은 서버가 만든다.** 셸 `computed` 는 표시 축(탭 배열·서브탭)만 담고 금액을 계산하지
     않는다. 화면이 통화 기호·자릿수·합계를 조립하면 기본 통화가 다른 상점에서 값은 맞고
     단위만 틀린 금액이 나가고, 서버 집계와 갈려도 오류가 남지 않는다. 합계행·개별 행·
     다통화 표시 모두 `order.data` / `row.*` 의 백엔드 필드만 읽는다.

  ② **환불 집계의 정본은 주문(Order) 레벨이다.** `OrderPaymentResource` 에 없는
     `payment.refund_*` · `payment.refunded_amount` 를 바인딩하면 예외 없이 빈 칸이 된다
     (결함 C-2) — 그 키는 **있어서는 안 되는 것**이라 부재까지 함께 잠근다.

  ③ **폼 초기화는 데이터소스 `initLocal` 맵이 한다.** 핸들러(`initOrderDetailForm`) 경로가
     제거됐으므로 맵이 사라지면 수취인 폼이 통째로 비어서 뜬다.

  ④ **모달 집합은 개수가 아니라 이름으로 고정한다.** 개수만 세면 무엇이 늘고 줄었는지
     진단되지 않는다.

  ⑤ **비회원 조회 비밀번호 재설정**은 비회원 블록(`!order.data?.user_id`)에서만 열리며,
     평문 입력은 `type=password` 로 마스킹하고 성공 시 토스트 + 모달 닫기로 끝난다.

  ⑥ **활동 로그는 `order_logs` API 가 소스다.** 더미 배열이 남아 있으면 화면은 정상으로
     보이면서 실제 로그를 한 건도 보여주지 않는다. 처리자 열은 회원(`user.uuid` 존재)일
     때만 ActionMenu 를 달고, 시스템 사용자는 아바타+이름만 남는다.

# axis 의미:
#   surface — 같은 화면을 이루는 JSON 조각. 각 조각이 독립된 구조 계약이라 이것이 유일한 직교 축이다.
#             바인딩 경로·핸들러 이름·다국어 네임스페이스는 조각과 직교하지 않아(조각마다 다른 키를
#             본다) 축으로 세우지 않고 이름 붙은 effect 가 덮는다.
axes:
  surface: [shell, order_info, payment_info, activity_log, modals]

effects:
  - admin_claim_request_buttons_stay_disabled_without_permission  # 접수 권한이 없으면 버튼 셋이 꺼진 채 서고 권한 안내가 선다(Chrome 실측 P-6)
  - admin_claim_request_context_error_distinguishes_forbidden_from_failure  # 문맥 조회 실패는 403=권한 없음, 그 밖=불러오지 못함 (2026-09-26 3차 검증 인터뷰)
  - admin_return_request_carries_refund_priority_and_prefilled_bank  # 반품 직권 접수 창은 종전 취소 창 조건으로 환불 계좌·우선순위 칸을 세우고 주문 결제 정보로 계좌를 미리 채운다(validate-plan A1)
  - admin_claim_textareas_use_camelcase_max_length  # 직권 접수·대리 철회·신청 수정 입력칸이 maxLength(camelCase)로 한도를 건다(validate branch M9)
  - admin_request_modal_seeds_the_international_redelivery_address  # 직권 접수 창 재발송지의 해외 도시·주 칸(S2-D8)
