notes: |
  **마커와 이 목록은 양방향으로 맞춘다.** 정적 검사는 선언된 effect 에 테스트가 붙었는지만
  본다 — 테스트가 건 핀이 여기에 없으면 커버리지가 실제보다 작게 보이는데도 초록이다.

  **금액 합계의 표기 기준.** 화면에 그려지는 금액은 전부 서버가 만든 `*_formatted` 다. 예외는
  운영자가 지금 입력 중인 두 칸의 합계 하나뿐이며, 그것은 서버 왕복 없이 화면이 더한 값이라
  통화 기호를 붙이지 않고 서버가 준 통화 코드를 그대로 병기한다 — 기호를 화면이 만들면
  기본 통화가 원이 아닌 상점에서 값은 맞고 단위만 틀린 금액이 나간다.

  **상한 안내는 가드가 아니다.** 입력 합이 취소 가능 금액을 넘으면 화면이 미리 알리지만,
  실제 차단은 서버가 실행 직전에 같은 식으로 재계산해 한다(422). 화면 안내를 가드로 삼으면
  저장·실행 사이에 다른 클레임이 선점한 금액이 반영되지 않는다.

  **`payment_state: none` 축이 실재한다.** 전액 할인·전액 마일리지 주문은 결제행이 없다.
  안내를 두지 않으면 카드가 통째로 사라져 운영자가 "아직 안 불러왔다" 와 "결제 건이 없다" 를
  구분할 수 없다.

  **브라우저 실측의 선행 조건**은 S9a 와 같다 — `playwright:seed-ecommerce` 의 클레임 축이
  아직 stub 이라(계획서 이월 4) spec 은 목록 API 로 신청서를 발견해 진행하고, 한 건도 없으면
  그 사실을 드러내며 건너뛴다.

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: Playwright MCP   # #599 3차 실측 세션2 — 실제 주문·신청으로 재실측
  note: |
    T2-D6(계좌도 동의도 없으면 [환불하기]가 잠긴다)의 브라우저 축은 Playwright MCP 재실측이
    덮는다. spec 을 새로 두지 않는 이유는 이 축이 **무통장 결제 → 배송완료 → 환불신청 → 승인**
    까지 실제 상태를 만들어야 성립하는데, 이 모듈의 spec 들은 클레임 시드가 stub 이라(위 선행
    조건) 승인된 무통장 환불신청서를 만들지 못하고, 그 상태에서 재현하면 창이 아예 뜨지 않아
    **잠금이 아니라 부재를 재게 되기 때문이다**(가짜 초록 — 게이트를 지워도 통과한다).

    대신 세 겹으로 받친다. ① 레이아웃 테스트가 창의 게이트와 입력 칸을 정적으로 잠근다
    (`adminClaimDetail.test.ts` 2건). ② 핸들러 테스트가 본문에 실리는 값을 잠근다
    (`claimDetailHandlers.test.ts` 3건 — 게이트를 빼면 red 임을 실측 확인). ③ 서버가 같은
    술어로 422 를 낸다(`AdminRefundExecuteRequiresBankTest` 7건). 화면과 서버가 같은 판정
    (`refund_account_required` ← `OrderRefundRequestService::refundsToBankAccount()`)을 쓰므로
    한쪽만 통과하는 상태가 생기지 않는다.
