feature: 관리자 클레임 상세 결제 정보·정산·환불 실행 (#599 S9b — D17-③·D18·D19)

description: |
  S9a 가 의도적으로 비워 둔 두 탭을 섹션과 함께 세운다. 결제 정보(원 주문의 결제수단 카드와
  금액 행 세트 + '이 클레임의 정산')는 네 유형 모두에 있고, 환불 실행(취소 가능 금액 산정 +
  환불 금액 수정 + 실행)은 환불신청서에만 있다. 이 화면에서 조용히 깨지는 지점은 여섯이다.

  ① **주문 결제 정보를 주문 상세 엔드포인트에서 읽으면** 그 게이트가 `orders.read` 라 클레임
     권한만 가진 운영자(기본 역할 `manager`)에게만 403 이 되어 결제 정보 탭이 통째로 빈다.
     전권 계정에서는 재현되지 않는다 — 상세 봉투(`data.order`)가 그 값의 통로다. 청구 방식·
     환불 수단 어휘도 같은 이유로 봉투가 나른다(설정 조회는 `settings.read` 게이트다).

  ② **그 봉투에 주문 상세를 통째로 실으면** 이 화면이 그리지도 않는 주문 옵션·배송·주소가
     응답에 실리고, 미로드 관계가 직렬화 시점에 터진다. 결제 정보 섹션이 실제로 그리는 축만
     싣는다.

  ③ **행 마크업이나 라벨이 주문상세 정본과 갈리면** 같은 주문이 두 화면에서 다르게 보인다
     (D17-③). 눈으로는 알아채기 어렵고 오류도 남지 않으므로, 정본이 쓰는 행 클래스 밖의
     형태를 결제 정보 카드에 새로 만들지 않고 **라벨 키도 정본의 것을 그대로 읽는다** —
     사본을 두면 정본의 문구가 바뀔 때 이 화면만 옛 문구로 남는다(실측이 "과세 금액" ↔
     "과세금액" 처럼 갈린 세 행을 잡았다).

  ④ **환불 예정액을 화면이 다시 계산하면** 완료 처리 모달이 보여 주는 숫자와 갈린다. 교환·
     반품의 환불 예정액은 헤더 컬럼이 아니라 완료 시점의 주문 재계산 결과이고, 그 값의 SSoT
     는 완료 미리보기 경로다. 접수 불가 사유 둘(이미 접수됨 / 대상 없음)은 뜻이 달라 구분해
     알린다 — 감추면 0원 예고가 정상으로 보인다.

  ⑤ **취소 가능 금액의 세 축을 감추면** 왜 그 금액인지 알 수 없다 (D19). 한도를 정한 축에
     따라 조치가 갈린다 — 선점이면 다른 클레임을 먼저 끝내야 하고, 결제수단 잔여면 더
     되돌릴 수 없다. 산정도 표기도 서버가 하며, 형제 엔드포인트와 **같은 지점**에서 만든다.
     "산정 불가" 와 "0원" 은 다른 사실이라 뭉뚱그리지 않는다.

  ⑥ **환불 실행이 곧바로 나가면** 오클릭 한 번이 되돌릴 수 없는 환불이 된다. 확인 모달을
     거치되, 모달은 부모 화면과 다른 컨텍스트라 `_local` 을 해석하지 못한다 — 여는 핸들러가
     지금 입력된 값을 전역 문맥으로 넘겨야 **모달이 예고한 값 = 실행하는 본문** 이 성립한다.
     저장과 실행은 게이트가 다르며(`claims.update-amounts` vs `claims.execute-refund`), 재실행
     (더블클릭)은 입력 오류가 아니라 충돌(409)이라 확정된 상태를 다시 읽어 보여 준다.

# axis 의미:
#   claim_type — 결제 정보는 전 유형에 있고, 정산 블록은 청구(교환·반품) / 환불 요약(환불)로
#                갈리며, 환불 실행 섹션은 환불신청서에만 있다. 취소(cancel)는 관리자 상세
#                화면 자체가 없다 (S9a 와 같다).
#   cancellable — 취소 가능 금액 산정 결과의 유무. `present` 는 세 축과 한도를 정한 축이 함께
#                 온 상태, `absent` 는 산정 자체가 없는 상태다 — "산정 불가" 와 "0원" 은 다른
#                 사실이라 화면이 뭉뚱그리지 않는다.
#
# 원 주문의 결제 사실(결제행 유무 · 누적 환불 유무)은 이 두 축과 직교하지 않는 파생 상태라
# axis 로 세우지 않고 이름 붙은 effect 가 덮는다 — `claim_payment_shows_empty_notice`(결제행
# 없는 주문) · `claim_payment_renders_refund_rows_after_execution`(§4-3-1 의 누적 환불 두 행).
# 쓰기 권한 조합도 같은 이유로 `claim_amount_controls_gate_on_update_amounts` 와
# `claim_refund_save_and_execute_are_separate` 두 effect 가 덮는다.
axes:
  claim_type: [exchange, return, refund]
  cancellable: [present, absent]

exclusions:
  - { claim_type: exchange, cancellable: present, reason: "취소 가능 금액은 환불신청서 문맥의 산정이라 교환 상세에는 그 섹션 자체가 없다" }
  - { claim_type: return, cancellable: present, reason: "위와 같다 — 반품의 환불은 완료 처리가 접수한 환불신청서가 맡는다 (D26)" }

