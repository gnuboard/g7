notes: |
  **§9-1 의 매니페스트 수가 11 → 12 가 된다.** §7 S15 DoD 가 그 숫자를 인용하므로 함께 정정한다.

  **E2E 는 S15 소유다.** §9-3 이 spec 배정을 갖고 있고 이 매니페스트는 그 축의 출처가 된다.
  이 세션은 계약 테스트·렌더 테스트·Feature 테스트로 축을 덮고 브라우저 실측(§8-1 S14 —
  T1·T3·T6)으로 관통을 확인한다.

  **회원 축은 이 매니페스트가 다시 덮지 않는다.** 목록 카드의 금액 열 분기, 상세 섹션 구성,
  수정 모드의 잠금 규칙은 `user-claim-list-detail-edit.yaml` 소유이며 비회원은 **같은 partial** 을
  쓰므로 그 축이 그대로 성립한다. 이 매니페스트가 새로 세우는 것은 "그 partial 이 비회원에서도
  같은 것을 그리고, 누르면 비회원 주소로 간다" 는 축뿐이다.

  **응답 형태가 바뀐 엔드포인트가 하나 있다.** `GET guest/orders/{주문번호}/claims` 가 네 유형
  그룹(`claims.{유형}[]` + `counts`)에서 회원 목록과 같은 페이지 봉투(`data[]` + `pagination`)로
  바뀌었다. 프로덕션 소비처는 이 세션이 만드는 섹션이 처음이라 깨질 화면은 없고, 기존 Feature
  단언 3건을 새 계약으로 고쳤다(API 문서 `modules/_bundled/sirsoft-ecommerce/docs/api/guest.md` 동반 갱신).
