feature: 비회원 클레임 화면 — 주문상세 섹션 · 상세 · 작성/수정 (#599 S14)

description: |
  회원 화면은 S11~S13 이 놓았고, 이 세션은 **같은 화면을 비회원에게 여는** 셸 2종과 guest 라우트,
  그리고 비회원 주문상세의 '이 주문의 클레임' 섹션을 놓는다. 새로 그리는 것은 없다 — partial 은
  전부 회원 것을 무수정으로 쓰고 셸이 계약값과 데이터소스 주소만 바꾼다. 조용히 깨지는 지점은
  다섯이다.

  ① **비회원 클레임 API 는 전부 주문 스코프인데 화면 주소는 아니다.** 상세·수정 라우트
     (`{shopBase}/guest/claims/{번호}` · `.../edit`)에는 주문번호가 없다(§5-3, 서버측 주소 SSoT
     `ClaimUrl::GUEST_DETAIL` 도 같은 모양이다). 조회 토큰이 주문 하나에 묶여 있으므로 그 짝인
     주문번호가 곧 스코프이며, 토큰과 같은 자리에서 `_global.guestOrderNumber` 로 세워진다.
     한쪽만 남으면 — 주문번호는 있고 토큰이 없으면 — 셸은 주소를 만들고 요청은 404 가 된다.

  ② **레이아웃 `initLocal` 은 표현식을 해석하지 않는다.** 값을 그대로 복사하므로(JSON deep clone)
     주문번호가 들어가는 주소를 거기 두면 `{{_global.guestOrderNumber}}` 라는 **문자열 자체**가
     주소에 실린다. 그래서 비회원 셸은 그 값을 `init_actions` 의 `setState` 로 세운다. 반대로
     `init_actions` 에서 `_local` 을 **읽는** 것은 언제나 빈 값이다(2026-09-01 회원 화면 실측
     결함 ⓑ) — `_global` 은 부모 레이아웃이 이미 세웠으므로 그 제약을 받지 않는다.

  ③ **공유 partial 이 회원 전용 주소를 리터럴로 들고 있었다.** `templates/_bundled/sirsoft-basic/layouts/partials/mypage/claims/_list.g7.html` 의 서브탭·상세·수정·
     페이지 이동과 `templates/_bundled/sirsoft-basic/layouts/partials/mypage/claims/_apply_summary.g7.html` 의 접수·저장 뒤 목적지가 `/mypage/claims…` 였다. 비회원이
     그 주소를 타면 로그인 화면이 열리고, 카드는 정상으로 그려지므로 **누르기 전에는 드러나지
     않는다**. 주소도 셸 계약값이 된다(claimListPath · claimDetailPathBase · claimEmptyCtaPath).

  ④ **비회원에게는 주문을 가로지르는 신청내역 화면이 없다** (§5-1-3). 그래서 주문상세의 '이 주문의
     클레임' 섹션이 곧 비회원의 목록이고, 그 목록도 유형 서브탭 하나를 페이지 단위로 읽는다.
     네 유형을 한 응답에 전량 싣던 종전 형태는 "한 주문의 건수가 그 주문의 상품 수에 묶인다" 는
     전제에 기댔는데, 철회는 행을 남기므로(수량 잠금만 풀린다) 신청↔철회를 반복하면 계속 쌓인다.

  ⑤ **비회원 클레임 13라우트에 요청 빈도 제한이 없었다.** 형제 라우트(`guest/orders/verify`)만
     `throttle:20,1` 을 갖고 전역 API 리미터는 없다. 조회 토큰을 손에 넣은 쪽이 신청·미리보기·첨부
     업로드를 무제한으로 반복할 수 있으면 파일 쓰기(`claim-images.store`)가 디스크를 채운다 —
     응답은 정상 2xx 라 어느 로그에도 남지 않는다.

  비회원 추가결제의 **복귀 화면은 신청서 상세가 아니라 주문 조회 폼**이다. 결제창에서 돌아온
  브라우저에 조회 토큰이 남아 있다고 보장할 수 없어서다(`ClaimPaymentRedirect` 가 그렇게 정한다 —
  알림 링크도 같은 이유로 이미 그 화면을 가리킨다). 그래서 결과 안내 배너도 그 화면에 선다.

# axis 의미:
#   screen  — 비회원이 여는 네 화면. `order_section` 은 회원의 신청내역 목록에 해당하고
#             (§5-1-3 — 비회원에게는 횡단 목록이 없다) 나머지 셋은 회원 화면과 1:1 이다.
#   entry   — 그 화면에 어떻게 닿았는가. 토큰 없이 직접 주소를 친 진입과 만료된 토큰으로 돌아온
#             진입이 같은 처분(토큰 폐기 → 조회 폼)을 받아야 한다.
#   claim_type — 유형마다 서버가 다른 테이블을 읽는다. 섹션 서브탭이 곧 그 축이고, 작성 진입은
#             세 유형(교환·반품·취소/환불)만 열린다.
axes:
  screen: [order_section, detail, apply, edit]
  entry: [with_token, without_token, expired_token]
  claim_type: [exchange, return, refund, cancel]

exclusions:
  - { screen: apply, claim_type: cancel, reason: "취소는 신청 유형이 아니라 취소·환불 신청(refund)의 서버측 분기 결과다 — 작성 라우트의 :type 은 exchange|return|refund 셋뿐이다" }
  - { screen: edit, claim_type: cancel, reason: "취소 이력은 신청서가 아니라 처리 결과다 — 수정 경로 자체가 없다(서버가 notEditable 로 거절한다)" }
  - { screen: [detail, apply, edit], entry: [without_token, expired_token], claim_type: [return, refund, cancel], reason: "토큰이 없거나 만료된 진입의 처분은 유형과 무관하다 — 서버가 신청서를 읽기 전에 404 로 끝나므로 유형 하나(exchange)로 대표한다" }
  - { screen: order_section, entry: [without_token, expired_token], claim_type: [return, refund, cancel], reason: "같은 근거 — 토큰 처분은 목록 유형과 무관하다" }

