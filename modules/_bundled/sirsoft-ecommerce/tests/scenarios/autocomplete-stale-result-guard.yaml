feature: 원시 자동완성이 늦게 도착한 옛 응답으로 목록을 덮어쓰지 않는다

description: |
  이커머스 관리자 화면의 회원 검색 자동완성은 두 형태로 나뉜다.

    `event: "onSearch"` + SearchableDropdown → 컴포넌트가 `searchTerm` 으로 다시 거른다(안전)
    `type: "input"` + 원시 목록 렌더        → 응답이 오는 대로 목록이 바뀐다(이 시나리오의 대상)

  후자는 마일리지 수동 지급/차감과 쿠폰 직접 발급 두 곳이며, 둘 다 **고른 회원에게 값이 나가는**
  화면이다. 디바운스가 걸려 있어도 느린 응답이 빠른 응답보다 늦게 도착하면 목록이 옛 키워드의
  결과를 그린다. 그 상태를 운영자가 알아챌 방법이 없다 — 입력칸에는 자기가 친 문자열이 그대로
  있고 목록도 멀쩡해 보인다. 엉뚱한 회원에게 마일리지가 지급되거나 쿠폰이 발급될 수 있다.

  계약: 원시 자동완성은 결과 목록과 함께 **그 결과를 만든 키워드**를 상태에 저장해야 한다.
  그래야 렌더 시점에 현재 입력과 대조해 stale 응답을 버릴 수 있다. 레이아웃 트리를 정적으로
  훑어 이 저장이 빠진 자동완성을 잡는다.

axes:
  autocomplete_shape:
    - raw_input_list

exclusions:
  - { autocomplete_shape: raw_input_list, reason: "SearchableDropdown(event onSearch) 형태는 컴포넌트가 searchTerm 으로 재필터링하므로 이 검사 대상이 아니다" }

effects:
  - raw_autocomplete_stores_keyword_with_results

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Layouts/AutocompleteStaleResultGuardTest.php
