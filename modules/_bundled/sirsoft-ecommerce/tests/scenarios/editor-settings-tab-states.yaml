feature: 편집기 환경설정 탭 상태

description: |
  레이아웃 편집기 「상태」 고르개가 쇼핑몰 환경설정의 탭을 모두 고를 수 있는지
  
  편집기에서 쇼핑몰 환경설정을 열면 상단 「상태:」 고르개로 보여 줄 탭을 고른다. 1.3.0 에서 마일리지 설정이
  별도 화면(마일리지·예치금 설정)에서 환경설정의 「마일리지」 탭으로 옮겨 왔는데, 고르개에는 그 탭 상태가 없어
  편집기에서 마일리지 탭을 열어 고칠 방법이 없었다(2026-10-07 실측 — 탭 11개, 고르개 10개).
  화면의 탭 항목(id)마다 같은 탭을 여는 상태(`query.tab`·`activeEcommerceSettingsTab`)가 있어야 한다.

  수정 이력: 이커머스 전수 실측 S5-D16 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03]
  # c01: 환경설정 화면의 탭 항목을 읽었다
  # c02: 「%s」 탭을 여는 상태가 있다
  # c03: 상태 이름 번역 키가 관리자 편집기 문구(ko·en)에 있다

effects:
  - settings_tab_states_exist

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/editorSettingsTabStates.test.ts
