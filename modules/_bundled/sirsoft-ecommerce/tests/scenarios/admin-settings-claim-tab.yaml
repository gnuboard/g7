  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Layouts/ClaimSettingsStatusVocabularyTest.php

notes: |
  **신청 가능 상태 4축은 Enum 전체가 아니라 축마다 다른 부분집합이다.** 그래서 Enum 이
  단일 출처가 될 수 없고, 화면(레이아웃 JSON)과 게이트(FormRequest)가 각자 목록을 갖는다 —
  어긋나면 화면에만 있는 값은 저장 시 422, 게이트에만 있는 값은 화면으로 만들 수 없는
  조합을 API 경로로 통과시킨다. 둘 다 예외도 로그도 남기지 않는다.

  **추가결제 수단 선택지는 주문 설정에서 파생한다.** 서버 허용 어휘가 확장 결제수단까지
  포함하므로, 화면이 기본 7종을 리터럴로 박으면 서버는 받아들이는데 운영자는 고를 수 없고,
  API 로 심어 둔 확장 ID 도 이 탭을 한 번 저장하면 사라진다.

  **`_meta.limits` 가 경계값의 단일 출처다.** 화면이 리터럴을 재기입하면 서버 규칙이 바뀔 때
  화면만 옛 경계로 남는다 — 더 좁으면 저장 가능한 값을 입력조차 못 하고, 더 넓으면 저장
  단계에서만 실패한다. 클레임 축은 리뷰 축(`max_images_*`)과 이름이 겹치므로 `claim_` 접두사를
  쓴다.

  **사유 카탈로그는 DB 관리 대상이라 JSON 설정에 남지 않는다.** 남으면 같은 목록의 출처가
  둘이 되고, 그 뒤로는 어느 쪽이 정본인지가 호출 순서에 좌우된다.

  **읽기전용 축(`_computed.isReadOnly`)은 셸 레이아웃의 computed 다.** `createLayoutTest` 는
  레이아웃 computed 를 dataContext 에 싣지 않으므로(S9c 인계 ①) 렌더 테스트로는 볼 수 없고
  구조 검사가 "모든 입력에 disabled 가 붙었는지" 로 대신 고정한다.
