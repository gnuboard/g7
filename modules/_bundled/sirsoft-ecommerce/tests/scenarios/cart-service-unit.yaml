  - cart_key_differs_per_issue
  - cart_key_reissued_on_duplicate
  # 조회
  - cart_read_by_member_id
  - cart_read_by_guest_cart_key
  - cart_read_empty_without_identity
  - cart_item_count_passthrough
  # 합계 계산
  - cart_calculation_returns_items_and_summary
  - cart_calculation_for_guest_cart_key
  - cart_calculation_skipped_for_empty_cart
  - cart_calculation_receives_coupons_and_points
  # 담기
  - cart_add_creates_line_for_member
  - cart_add_sums_quantity_on_same_option
  - cart_add_creates_line_for_guest
  - cart_add_keeps_separate_line_per_option
  # 수량 변경
  - cart_quantity_updated
  - cart_quantity_update_rejects_missing_line
  - cart_quantity_update_rejects_other_owner
  # 삭제
  - cart_line_deleted_by_owner
  - cart_lines_bulk_deleted
  - cart_cleared_for_member
  - cart_cleared_for_guest_cart_key
  - cart_clear_returns_zero_without_identity
  - cart_clear_returns_zero_for_empty_cart
  # 옵션 변경
  - cart_option_changed_keeping_quantity
  - cart_option_and_quantity_changed_together
  - cart_option_change_merges_into_existing_line
  - cart_option_change_rejects_other_product_option
  # 비회원 장바구니 병합
  - guest_merge_moves_line_to_member
  - guest_merge_sums_same_option_and_removes_guest_line
  - guest_merge_handles_mixed_lines
  - guest_merge_skipped_without_guest_lines
  - guest_merge_clamps_quantity_to_stock
  # 재고 검증
  - cart_add_rejects_quantity_over_stock
  - cart_add_rejects_combined_quantity_over_stock
  - cart_add_rejects_out_of_stock_option
  - cart_quantity_update_rejects_quantity_over_stock
  - cart_option_change_rejects_quantity_over_stock
  - stock_validation_out_of_stock_raises_stock_reason
  - stock_validation_over_stock_carries_quantity_and_stock
  - stock_validation_passes_within_stock

# E2E axis 없음: 리포지토리를 목으로 둔 서비스 단위 계약이고 레이아웃 JSON, 컴포넌트 변경이 없다.

test_files:
