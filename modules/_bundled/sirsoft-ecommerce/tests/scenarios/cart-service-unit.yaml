feature: cart_service_unit

description: |
  장바구니 서비스(CartService)의 키 발급, 조회, 합계 계산, 담기, 수량 변경, 삭제, 옵션 변경,
  비회원 장바구니 병합, 재고 검증 계약을 리포지토리 목으로 고정하는 Unit 테스트의 시나리오
  소유 매니페스트.

  핵심 동작:
    - 장바구니 키는 `ck_` 로 시작하는 35자이고, 이미 쓰이는 키가 나오면 다시 만든다.
    - 조회는 회원 ID 가 있으면 회원 장바구니를, 없으면 장바구니 키의 비회원 장바구니를 읽는다.
      둘 다 없으면 빈 컬렉션이다.
    - 합계 계산은 항목과 계산 결과를 함께 돌려주고, 쿠폰 발급 ID 와 사용 마일리지를 계산 입력에
      그대로 싣는다. 빈 장바구니는 계산 서비스를 부르지 않는다.
    - 담기는 같은 옵션이 이미 있으면 수량을 더하고, 다른 옵션이면 항목을 따로 만든다.
    - 수량 변경과 삭제는 본인 항목에만 통한다. 없는 항목과 남의 항목은 예외다.
    - 옵션 변경은 같은 상품의 옵션으로만 되고, 바꿀 옵션이 이미 담겨 있으면 그 항목에 합친다.
    - 병합은 회원 장바구니에 같은 옵션이 있으면 수량을 합치고 비회원 항목을 지우며, 없으면
      항목을 회원에게 옮긴다. 합친 수량이 재고를 넘으면 재고까지만 담는다.
    - 재고가 없거나 모자라면 일반 예외가 아니라 사유가 stock 인 CartUnavailableException 이다.

  판매상태에 따른 담기 차단은 mp05-cart-unavailable-product.yaml 이, 상품별 최소/최대 구매수량은
  mp05-purchase-quantity-limit.yaml 이 선언한다. 이 파일의 해당 시험은 그 매니페스트의 축과
  효과로 표식한다.

axes:
  area:
    - cart_key
    - read
    - calculation
    - add
    - update_quantity
    - delete
    - change_option
    - guest_merge
    - stock

