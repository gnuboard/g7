feature: validate_p4p5_data_upgrade_hook_i18n

description: |
  #599 브랜치 검증이 찾은 데이터·업그레이드·훅·다국어 결함(P4·P5·P6)을 닫는다. 결함마다
  한 축이며, 테스트는 결함 하나를 수정 전 코드에서 실패하게 짜서 수정의 근거로 삼는다.

  데이터·업그레이드(P4)
    - 운영자·시스템 발 환불 사유 2종(`admin_cancel`·`auto_cancel_expired`)은 업그레이드 스텝
      (02_SeedClaimReasons) 한 곳이 시더와 같은 이름으로 보장하고 언어팩 번역을 병합한다. 모듈
      마이그레이션이 다른 이름으로 먼저 넣어 일본어 상점에서 한국어로 남던 경로를 없앴다.
    - 03 설정 병합은 1.2.x 기본값을 상수로 고정하고 자동 승인 3키를 넣는다.
    - 04 배송지 백필은 배송지를 청크 단위로 읽는다.
    - 배송정책·주문 삭제는 회수지·신청 상품 행을 FK CASCADE 에 기대지 않고 명시 삭제하며, 주문
      삭제의 DB 정리는 한 트랜잭션이다.
    - 클레임 마이그레이션은 DB 전용 raw SQL 을 쓰지 않고, 재실행 가드와 값 목록 주석을 갖춘다.

  훅(P5)
    - 지워진 첨부의 로그도 신청서 이력에 남는다.
    - 주문상품 동기화 훅은 Service 가 쏜다(Repository 는 쓰기만).
    - 사유·배송유형 일괄 동기화는 바뀐 행만 갱신하고 before/filter 를 거치며 after 는 커밋 뒤에 쏜다.
    - 알림·활동 로그의 본문 값은 발행 시점에 캡처한다 — 큐 워커가 신청서를 다시 읽지 않는다.
    - 클레임 첨부 업로드에 before_upload 가 있다.
    - 범용 morph 별칭 충돌을 로그로 드러낸다(별칭 자체는 유지 — 1.3.0 미출시라 이관할 행이 없다).
    - 잠금 조회의 옛 이름을 호환 별칭으로 두고, 실패 시 예외를 던지는 버전을 둔다.
    - 호출처 없는 삭제 메서드를 계약에서 걷어 낸다.

  다국어(P6)
    - 클레임 사유 로그의 `:reason_type` 을 표시 시점 로케일 라벨로 해석한다.
    - 이름을 되찾지 못한 엔티티의 `ID:` 표기를 다국어 키로 옮긴다.

