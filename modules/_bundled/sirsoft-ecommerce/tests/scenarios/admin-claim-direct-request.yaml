feature: admin_claim_direct_request

description: |
  관리자 직권 접수 (#599 후속 §3-11 · D5~D8) 와 같은 종류 결함 S13~S15

  운영자가 주문 상세에서 고객을 대신해 교환·반품·취소·환불을 접수한다. 고객 창구와 갈리는 지점은
  넷이다.

  ① **게이트는 물리 게이트 하나다**(D5). 신청 기간·신청 가능 상태·취소 가능 상태 설정은 고객 축이다 —
     운영자는 물건이 고객에게 갔으면 교환·반품을, 아직 안 보냈으면 취소·환불을 받는다. 반대쪽은
     거절한다. 수량 잠금은 그대로다.

  ② **청구는 사유로 자동 계산하고 운영자가 고친다**(D7). 판매자 귀책(고객 화면 비노출) 사유도 고를 수
     있고, 배송비를 직접 입력하거나 「무료」(배송비 0, 청구 방식 없음)로 접수한다.

  ③ **접수와 승인은 다른 사실이다**(D6). 「접수와 함께 승인」 이 기본이고, 끄면 신청 상태로 남는다.

  ④ **판매자 접수는 고객이 거두거나 고칠 수 없다**(D8). 운영자는 고객 요청으로 대신 철회할 수 있고(S14),
     신청 사유를 고칠 수 있다(S15). 완료 때 놓친 재고 복구는 뒤늦게 할 수 있고 두 번 되지 않는다(S13).

# axis 의미:
#   claim_type — 직권 접수 유형. `cancel_refund` 는 종전 관리자 [주문취소] 를 흡수한 환불신청서 접수다.
#   gate_side  — 주문 상품이 물리 게이트의 어느 쪽인가. `shipped` 는 배송중·배송완료·구매확정,
#                `not_shipped` 는 결제완료·배송보류·상품준비중 등 아직 보내지 않은 상태.
axes:
  claim_type: [exchange, return, cancel_refund]
  gate_side: [shipped, not_shipped]

