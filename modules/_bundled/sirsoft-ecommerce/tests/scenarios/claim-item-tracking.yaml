feature: claim_item_tracking

description: |
  클레임 상품 행 송장 (#599 후속 §3-1·§3-2 R1~R12·§3-6~§3-8·§3-10 · D4·D10·D12·D13)

  송장은 신청서 헤더가 아니라 **상품 행**에 붙는다 — 주문이 주문 상품 행마다 송장을 두는 것과 같은
  행 쪼개기 방식이다. 새 「상자」 테이블은 없다. 한 상자에 여러 상품이면 같은 운송장을 여러 행에 적고,
  같은 상품을 나눠 보내면 수량을 지정해 행을 쪼갠 뒤 쪼갠 행에 적는다.

  조용히 갈리는 지점은 넷이다.

  ① **다른 행의 송장을 빌려 쓰지 않는다**(R6·S1). 예전 헤더 한 칸 구조는 송장 없이 두 번째 상품을
     회수중으로 옮기면 첫 상자 번호를 몰래 물려받았다. 이동 전이는 대상 행 전부가 자기 송장을 가져야 한다.

  ② **송장 수정은 그 행만 바꾼다**(R3·D10). 같은 운송장을 가진 다른 행은 그대로다 — 주문과 같다.

  ③ **수량 지정 = 행 쪼개기**(R4). 지정 수량 행에만 쓰고 잔여 행은 원래 값을 잇는다. 금액 합은 보존된다.

  ④ **한 회수 송장은 한 회수지로 간다**(R8·S4). 회수지가 다른 행을 한 송장으로 묶지 않는다.

  운송장 단위 [도착 처리](R9)는 같은 방향·같은 운송장의 행 전부를 옮긴다 — 선교환 회수 행은 상태를 바꾸지
  않고 도착 시각만 찍는다. 후속 주문옵션 배송 행은 그 행의 재발송 송장을 싣는다(R11·S9). 택배사 사용 집계는
  행 송장을 센다(R12). 알림은 발행 시점의 운송장 줄을 스냅샷으로 싣고(S10), 「송장만 저장」 은 송장 등록 알림
  1통을 내되 같은 요청에서 상태 알림이 나가면 억제한다(§3-10). 부분 처리 알림은 심사 결정에만 나간다(S11).

# axis 의미:
#   claim_type    — 송장이 있는 두 유형. 환불·취소에는 회수·발송이 없다.
#   exchange_mode — 교환 진행 방식. 선교환은 쓸 수 있는 상태(R5)와 도착 처리(R9)가 다르다.
#   direction     — 송장 방향. 반품의 재발송은 거절 계약(R1) 자체가 칸이다.
axes:
  claim_type: [exchange, return]
  exchange_mode: [standard, advance]
  direction: [collection, redelivery]

exclusions:
  - { claim_type: return, exchange_mode: advance, reason: "선교환은 교환 전용 진행 방식이다 — 반품에는 진행 방식 축이 없다" }

