notes: |
  백필 마이그레이션(`2026_09_25_000003`)의 `down()` 과 헤더 송장 칸이 남은 스키마에서의 `up()` 은 ALTER TABLE 을
  내므로(MySQL 암묵 커밋 — 테스트 트랜잭션과 공유 테스트 DB 스키마를 깨뜨린다) PHPUnit 에서 돌리지 않는다.
  백필 규칙은 마이그레이션의 데이터 이동 함수(`copyDirection`·`copyReturnAddress`)를 직접 불러 재고, 재실행
  멱등은 적용된 스키마에서 `up()` 이 DDL·쓰기 없이 끝나는 것으로 잰다. 반품 헤더 `refund_id` → 완료 행 복사는
  헤더 칸이 있어야만 도는 분기라 같은 이유로 PHPUnit 밖(설치본 업그레이드 실측)의 몫이다.
