feature: 클레임 사유 user_overrides 의 다국어 하위 키(dot-path) 변환 업그레이드 (1.0.0-beta.3)

description: |
  이커머스 1.0.0-beta.3 업그레이드 스텝이 ecommerce_claim_reasons.user_overrides 에 최상위 키(`name`)로 기록된
  사용자 수정 표시를 지원 로케일별 dot-path(`name.ko`·`name.en`·…)로 펼치는지 고정한다.
  이미 dot-path 인 값은 다시 펼치지 않아 재실행해도 결과가 같고, sort_order·is_active 같은 스칼라 컬럼 표시는 그대로 둔다.

axes:
  case: [top_level_key, already_dot_path, mixed_scalar_columns]

effects:
  - top_level_override_expanded_to_locale_dot_paths
  - existing_dot_path_override_left_unchanged
  - scalar_column_override_preserved

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Upgrades/EcommerceUserOverridesSubKeyMigrationTest.php
