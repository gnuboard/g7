# audit:allow test-scenario-coverage[cross_product] reason: |
#   이 매니페스트의 세 축(환불 수단 × PG 왕복 여부 × 복원 대상)은 한 Unit 메서드가 동시에
#   재현하지 않는다 — 복원(쿠폰·마일리지·재고·현금영수증)은 `execute()` 와 별개로 직접 호출해
#   격리 검증하고, 장부 누적은 수단·왕복 축만 곱한다. 조합의 실체는 클레임 접수 경로
#   (mp02-order-cancellation · user-claim-refund-return-apply)가 화면·통합에서 잰다.
#   effects 축은 면제하지 않는다 — 여기 적은 effect 는 전부 실제 검증 메서드에 매핑한다.
feature: 환불 실행 서비스 — PG 왕복 · 복원 훅 · 장부 누적 (#599)

description: |
  `RefundExecutionService` 는 `OrderCancellationService` 에서 뽑아낸 **환불이 실제로 나가는
  지점**이다. 돈이 PG 로 나가고, 쿠폰·마일리지·재고가 돌아오고, 현금영수증이 맞춰지고,
  그 사실이 장부(주문 누적 · 결제행 취소 누적)에 남는다. 화면 매니페스트가 "구매자가 무엇을
  신청하는가" 를 잰다면 여기는 **"접수된 환불이 나갈 때 무엇이 움직이는가"** 를 잰다.

  조용히 깨지는 지점은 넷이다.

  ① **송금 대상 계좌는 결제행 한 자리에서만 읽힌다.** PG 의 `refundReceiveAccount` 도, 무통장
     수동 이체도 그 자리를 본다. 구매자가 신청서에서 고친 계좌는 실행 직전 거기에 닿아야
     실제 송금에 반영된다 — 닿지 않으면 오류 없이 옛 계좌로 돈이 나간다. 반대로 계좌를 들지
     않은 환불(카드 취소)이 그 자리를 **비우면** 뒤이어 계좌로 나가야 할 환불에서 이체 근거가
     사라진다. 은행·계좌번호·예금주 셋 중 하나라도 비면 반영하지 않는다 — 은행만 바뀌고
     번호는 옛 값으로 남은 조합이 송금 대상이 되면 남의 계좌로 간다.

  ② **PG 왕복은 성공 뒤에만 장부를 쌓는다.** 훅 진입 전 `processing`, 성공하면 `completed` +
     거래 ID, 실패하면 오류 코드·메시지를 남기고 예외로 올린다. 실패한 환불이 누적을 깎으면
     다음 환불의 잔여 한도가 실제보다 좁아진다. 금액은 **주문 통화**로 넘긴다 — 기준 통화
     금액을 그대로 주면 다통화 상점의 PG 청구가 자릿수째 어긋난다.

  ③ **복원 훅의 실패는 환불을 죽이지 않는다.** 쿠폰·마일리지·현금영수증은 외부(플러그인·
     국세청)에 닿으므로 리스너 예외가 호출부로 올라오면, **돈은 이미 나갔는데** 트랜잭션이
     말려 환불 기록이 사라진다. 복원할 대상이 없으면 훅 자체를 쏘지 않고, 마일리지 복원은
     취소 ID 를 멱등 축으로 함께 넘긴다. 재고 복원은 상점 설정이 켜져 있고 그 옵션이 실제로
     차감됐을 때만 되돌린다.

  ④ **장부의 두 축을 동시에 깎지 않는다.** 예전에는 취소가 원 결제금액(`total_paid_amount`)을
     재계산값으로 덮어써 잔여를 좁혔고, 거기에 환불 누적까지 쌓으면 같은 금액이 두 번 빠졌다
     (10만원 주문의 6만원 환불 뒤 2차 부분환불이 0원으로 실행되던 결함). 지금은 원금을 두고
     **누적이 잔여를 말한다**. 그리고 PG 를 부르지 않은 환불(카드 주문의 수동 계좌 송금)은
     결제행의 취소 누적을 건드리지 않는다 — 카드사 잔액은 그대로이기 때문이다. 다만 바깥에서
     이미 집행된 PG 환불은 장부에 그대로 남아야 한다(그 둘을 묶어 막으면 정상 취소의 누적이
     사라진다).

# axis 의미:
#   refund_method — 환불 수단. `pg` 는 PG 왕복 대상, `bank` 는 사람이 송금하는 계좌 환불,
#                   `points_only` 는 마일리지만 돌려주는 건(PG 훅에 진입하지 않는다).
#   pg_roundtrip  — 코어가 이번 실행에서 PG 를 직접 부르는가. `skipped_settled_outside` 는
#                   바깥(가상계좌 환불 화면 등)에서 이미 집행돼 왕복만 건너뛰는 경우로,
#                   `skipped_not_applicable`(애초에 PG 로 나가지 않음)과 장부 취급이 갈린다.
#   restore_target — 복원 대상. 각 값이 서로 다른 훅/설정을 태운다.
axes:
  refund_method: [pg, bank, points_only]
  pg_roundtrip: [called, skipped_settled_outside, skipped_not_applicable]
  restore_target: [coupons, mileage, stock, cash_receipt, none]

exclusions:
  - { refund_method: bank, pg_roundtrip: called, reason: "사람이 송금하는 계좌 환불은 PG 왕복 자체가 없다" }
  - { refund_method: points_only, pg_roundtrip: [called, skipped_settled_outside], reason: "마일리지만 돌려주는 건은 결제수단을 건드리지 않는다 — PG 경로가 성립하지 않는다" }

