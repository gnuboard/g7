  - refund_account_on_the_refund_reaches_the_payment_row_at_execution
  - refund_without_an_account_keeps_the_existing_payout_target
  - partially_filled_refund_account_is_ignored_entirely
  # ② PG 왕복
  - pg_refund_marks_the_refund_completed_with_the_transaction_id_on_success
  - pg_refund_marks_processing_before_calling_the_hook
  - pg_refund_records_the_error_and_throws_on_failure
  - pg_refund_hands_the_refund_record_to_the_listener
  - pg_refund_stays_compatible_with_a_five_argument_listener
  - pg_refund_sends_the_amount_in_the_order_currency
  - pg_refund_falls_back_to_the_base_amount_without_an_order_currency_entry
  - order_currency_refund_amount_prefers_the_order_currency_over_the_base_amount
  # ③ 복원 훅 — 대상이 없으면 쏘지 않고, 돈·권리 복원 실패는 환불을 중단시킨다(D2)
  - coupon_restore_hook_carries_the_restored_issue_ids
  - coupon_restore_hook_is_not_fired_without_anything_to_restore
  - coupon_restore_listener_failure_aborts_the_refund
  - mileage_restore_skips_when_the_order_never_deducted_points
  - mileage_restore_skips_when_there_are_no_points_to_refund
  - mileage_restore_hook_carries_the_cancel_id_as_its_idempotency_axis
  - mileage_restore_listener_failure_aborts_the_refund
  - stock_restore_failure_aborts_the_refund
  # 「마일리지로 환불」 현금분 지급 (D1·Q2)
  - points_refund_credits_the_cash_amount_as_mileage
  - credit_mileage_skips_a_zero_amount
  - credit_mileage_rejects_a_guest_order
  - credit_mileage_listener_failure_aborts_the_refund
  - credit_mileage_fails_closed_when_no_ledger_row_appears
  # P-D5 — 장부 준비는 트랜잭션 안에서만
  - prepare_ledger_refuses_to_run_outside_a_transaction
  - stock_restore_returns_the_cancelled_quantity_when_the_setting_is_on
  - stock_restore_is_skipped_entirely_when_the_setting_is_off
  - stock_restore_skips_options_that_were_never_deducted
  - cash_receipt_sync_is_delegated_with_the_order_and_the_reason
  - cash_receipt_provider_failure_does_not_reach_the_caller
  # ④ 장부 누적 (§4-3-1 · §12-B)
  - execute_accumulates_the_orders_total_refunded_amount
  - execute_accumulates_the_orders_total_refunded_points_amount
  - execute_adds_to_the_values_already_accumulated
  - execute_accumulates_the_payment_rows_cancelled_amount
  - execute_accumulates_the_multi_currency_cancelled_amount_per_currency
  - execute_accumulates_on_every_round_not_just_the_first
  - execute_leaves_the_cancel_only_payment_fields_untouched
  - execute_accumulates_order_totals_even_without_a_payment_row
  - execute_skips_the_pg_hook_for_a_non_pg_payment_method_but_still_accumulates
  - execute_skips_the_pg_hook_when_the_caller_asks_it_not_to
  - execute_skips_the_pg_hook_when_only_points_are_refunded
  - execute_does_not_accumulate_anything_when_the_pg_call_fails
  - cancelled_amount_updates_share_one_rule_with_the_cancellation_path
  - accumulated_refunds_narrow_the_remaining_refundable_capacity
  # 취소 경로를 탄 환불도 결제행의 취소 누적을 쌓고 부분취소 상태를 찍는다 —
  # 주문 축 누적만 쌓고 결제행을 비워 두면 PG 환불가능액이 실제보다 크게 남는다.
  - cancellation_path_also_accumulates_the_payment_rows_cancelled_amount
  # 카드 주문을 계좌이체로 환불하면 PG 왕복이 없으므로 카드 결제행의 취소 누적은 그대로다
  # (운영 결정 2026-09-16 — 허용하되 장부는 건드리지 않는다). 주문 축 누적은 쌓인다.
  - non_pg_refund_leaves_payment_cancelled_amount_untouched
  # 바깥(가상계좌 환불 화면 등)에서 이미 집행된 PG 환불은 왕복만 건너뛰고 장부에는 남는다.
  - externally_settled_pg_refund_still_records_ledger
  # 누적 지점은 하나다 — 취소 경로도 원 결제금액을 깎지 않고 환불 누적으로 잔여를 말한다
  # (잔여 = total_paid_amount − total_refunded_amount). 두 축을 함께 깎으면 이중 차감이 된다.
  - cancellation_path_reports_remaining_capacity_through_refund_accumulation

