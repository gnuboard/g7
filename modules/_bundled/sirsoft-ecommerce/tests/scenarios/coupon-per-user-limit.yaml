feature: 쿠폰 회원당 한도 칸 검증 (직접·다운로드 쿠폰)

description: |
  회원당 한도(per_user_limit) 0(무제한)·양수 저장과 누락·null·음수 거절을 잰다.
  자동발급 쿠폰은 한도를 0 으로 고정하므로 이 시험은 직접발급 쿠폰으로 본다 — 자동발급 쪽은 coupon-auto-issue.yaml.

axes:
  case:
    - limit_zero
    - limit_positive
    - limit_missing
    - limit_null
    - limit_negative

effects:
  - per_user_limit_zero_saved
  - per_user_limit_positive_saved
  - per_user_limit_required
  - per_user_limit_non_negative

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Admin/CouponPerUserLimitTest.php
