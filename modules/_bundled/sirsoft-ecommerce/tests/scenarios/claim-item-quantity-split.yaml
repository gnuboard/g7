  - { claim_type: exchange, concern: header_amount, reason: "헤더 금액 재계산은 환불신청서의 축이다(교환 차액은 행 금액이 곧 헤더다)" }
  - { claim_type: return, concern: header_amount, reason: "같은 사유 — 반품 헤더 금액은 환불신청서로 넘어간다" }
  - { claim_type: exchange, concern: header_sync, reason: "헤더 동기화 계약은 교환·반품이 이미 같은 형태로 있고 이번 변경은 환불 이식분이다" }
  - { claim_type: return, concern: header_sync, reason: "같은 사유" }
  - { claim_type: exchange, concern: revert_quantity, reason: "복귀 수량 인자는 반품·교환이 같은 메서드 모양을 쓰고, 반품 축이 그 계약을 대표한다" }
  - { claim_type: exchange, concern: partial_notification, reason: "안내는 유형 구분 없이 한 종이고 발화 판정도 유형에 무관하다 — 반품 축이 그 계약을 대표한다" }
  - { claim_type: refund, concern: partial_notification, reason: "같은 사유" }
  - { claim_type: exchange, concern: live_screen, reason: "라이브 계측은 3유형을 한 spec 이 순회한다 — 유형마다 별도 축을 두면 같은 실행을 세 번 적는다" }
  - { claim_type: return, concern: live_screen, reason: "같은 사유" }

