# audit:allow test-scenario-coverage[cross_product] reason: |
#   축(유형 × 관심사)의 조합마다 테스트를 두지 않는다 — 분할 자체는 세 유형이 **한 협력자**를
#   공유하므로 커버리지 단위는 "그 유형의 안분 대상 컬럼이 전부 보존되는가" 이고, 전이·복귀·
#   헤더 동기화는 유형마다 계약이 다르다(환불에는 복귀가 없고, 교환·반품에는 처리중이 없다).
#   effects 축은 면제하지 않는다.
feature: claim_item_quantity_split

description: |
  운영자가 신청 상품 **3개 중 2개만** 받아 주거나 반려할 수 있게 되면서, 행 하나가 두 줄로
  갈린다. 갈랐을 때 어긋날 수 있는 것은 전부 **오류 없이 돈·수량으로만** 드러난다.

  핵심 동작:
    - 분할은 전용 협력자(`ClaimItemSplitter`) 하나가 한다. 세 서비스에 복제하면 비율 안분이
      세 벌이 되고, 한쪽만 고쳐졌을 때 그 유형의 금액만 조용히 어긋난다.
    - 금액은 **원본 × 비율**로 전이분을 내고 **잔여 = 원본 − 전이분**으로 맞춘다. 조각마다
      따로 반올림하면 합이 몇 원씩 어긋난 채 남는다.
    - 원본이 전이분, 신규가 잔여다(주문상세 분할과 반대). 부분 성공 계약이 `succeeded: [id]`
      로 **운영자가 체크한 행 ID** 를 돌려주기 때문이다.
    - 분할은 상품별 **저장점 맨 앞**에서 일어난다. 밖에서 나누면 "갈라졌는데 전이는 실패한"
      행이 남아, 운영자가 아무것도 안 했는데 표가 두 줄이 된다.
    - 교환의 후속 주문옵션은 `quantity = exchange_quantity` 1:1 산출물이라 그 행은 나눌 수
      없다 — 두 조각이 같은 것을 가리키면 재발송 수량이 어긋난다.
    - 상품 단위 반려의 원 주문옵션 복귀가 **그 수량만** 되돌린다. 전량이면 남은 진행분이
      코스 밖으로 빠져 이후 취소가 가드를 통과하고 같은 상품이 두 번 환불된다.
    - 환불 헤더는 `processing`·`completed` 로 따라가지 않는다 — 둘 다 환불 실행의 소유라,
      따라가면 돈이 움직이지 않았는데 신청서가 처리중으로 보인다.
    - 금액 재계산은 **반려분만큼만** 줄인다. 미판단 행을 빼면 상한과 저장 금액이 갈려
      운영자가 아무것도 건드리지 않았는데 저장이 422 로 막힌다.
    - 반려 행은 환불액을 들고 남지 않는다 — 남으면 D19 선점액 집계가 그 돈을 계속 센다.
    - API 는 `items: [{id, quantity?}]` **한 모양**만 받는다. 스칼라 배열을 함께 받으면 상위
      스코프 검사가 두 벌이 되어 다른 신청서의 행이 통과하는 결함이 되살아나고, 배포 중 두
      형태가 섞여도 아무 데도 드러나지 않는다.
    - 같은 행을 두 줄로 보내면 각 줄이 따로 잔여를 보고 통과한 뒤 합계가 넘는다 — 422 다.
    - 상품이 갈리면 헤더가 움직이지 않아 기존 상태 알림이 발화하지 않는다. 그 구멍을 부분
      처리 안내 한 통이 메우며, 발화 단위는 **[일괄 적용] 1회**다. 전건이 같은 결정으로
      모이면 보내지 않는다 — 헤더 전이 알림과 두 통이 된다.

