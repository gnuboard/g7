# audit:allow test-scenario-coverage reason: issue:#609 |
# audit:allow scenario-referenced-test-file-marked reason: issue:#609 형제 표식(test-scenario-coverage)의 유예를 명시 승계 — 표식 연쇄를 끊으며 이 룰의 유예를 자기 표식으로 옮겼다. 선언한 test_files 의 @scenario/@effects 마킹은 후속
#   cross product 자동 전개는 audit 실행 환경에 js-yaml 부재로 nested axes 를 읽지 못하는
#   한계로 검출되지 않는다(동일 한계로 다른 번들 시나리오도 audit:allow). 본 변경은 계산 API
#   연동 고도화(메서드/인증/필드매핑/응답추출/테스트호출)를 PHPUnit Unit/Feature 가
#   method × auth × response_type × field_map cross product 로 커버하며 green.
# 원장(2026-11-14): 이 표식을 [cross_product] 로 좁히면 effects 미검증 10건이 드러난다 —
#   method_get_sends_query_string, method_post_sends_json_body, bearer_attaches_authorization_header,
#   custom_header_attaches_named_header, field_map_renames_request_keys, json_nested_path_extracted,
#   text_currency_stripped_to_number, non_numeric_falls_back_to_base_fee(ShippingApiAdvancedCalculationTest),
#   custom_header_requires_header_name(ShippingPolicyValidationMessageTest), options_from_backend_enum_ssot
#   (EcommerceSettingsMileageTest·mp12ApiConfigSettings.test.tsx). 전부 test_files 안의 테스트가 실제로 재지만
#   @effects 마킹이 없다. 그 파일들에 마킹을 달면 좁힐 수 있다(재는 테스트가 있으므로 pending_effects 대상 아님).
feature: 배송정책 외부 API 연동 고도화 (MP12 — 메서드/토큰/필드매핑/응답추출/테스트호출)

description: |
  배송정책 계산 API(charge_policy=api) 호출을 실사용 가능하게 확장한다.
  - HTTP 메서드 GET/POST 선택 (GET 은 items 배열을 bracket 표기 query string 직렬화)
  - 인증 방식 none/bearer/custom_header + 토큰(encrypted 저장, 응답 마스킹)
  - 요청 필드 외부 키 매핑(field_map) — 우리 키를 외부 API 키 이름으로 리네임
  - 응답 형식 json(점표기 중첩 경로)/text(숫자/소수점 추출)
  - 테스트 호출 엔드포인트 — 요청 미리보기 + 응답 + 추출 배송비 반환

axes:
  http_method:
    - GET                # query string bracket 직렬화
    - POST               # JSON body
  auth_type:
    - none
    - bearer             # Authorization: Bearer
    - custom_header      # 지정 헤더명
  response_type:
    - json_single        # 단일 키
    - json_nested        # 점표기 중첩 경로
    - text_currency      # "₩3,000" → 3000
    - text_non_numeric   # 숫자 아님 → base_fee 폴백
  field_map:
    - none               # 우리 키 그대로
    - rename             # 외부 키 리네임
  request:
    - store
    - update             # 토큰 재전송 유지(빈 토큰 → 기존 유지)
    - test_call          # 테스트 호출 엔드포인트

effects:
  - method_get_sends_query_string         # GET bracket 직렬화
  - method_post_sends_json_body
  - bearer_attaches_authorization_header
  - custom_header_attaches_named_header
  - field_map_renames_request_keys
  - json_nested_path_extracted
  - text_currency_stripped_to_number
  - non_numeric_falls_back_to_base_fee
  - auth_token_masked_in_response          # 응답 비노출
  - custom_header_requires_header_name     # cross-field
  - test_call_returns_preview_and_fee
  - test_call_requires_update_permission
  - options_from_backend_enum_ssot         # 프론트 하드코딩 부재
  # 테스트 호출 엔드포인트 진단·안전 (#148 감사 정리에서 기존 테스트에 매핑)
  - test_call_reports_failure_diagnostics   # 4xx/5xx·연결 실패에도 요청 미리보기 + 응답/오류 반환
  - test_call_requires_endpoint             # endpoint 누락 422
  - test_call_blocks_internal_endpoint      # 내부망·유니코드 위장·userinfo 위장 주소 422, 요청 미전송
  - test_call_allows_internal_endpoint_when_opted_in  # 운영 옵트인 설정을 켜면 사내 주소 호출 허용
  # 관리자 화면 입력란 노출 (shipping-api-config.spec.ts — data-testid 보강 전이라 describe.skip 인 placeholder spec 이 마킹한다)
  - custom_header_reveals_header_name_and_token_inputs  # 인증 custom_header 선택 → 헤더명·토큰 입력란 노출
  - text_response_hides_response_path_input            # 응답 형식 text 선택 → 응답 경로 입력란 숨김
  - test_call_result_panel_shown                       # 테스트 호출 버튼 → 결과 영역 표시

pending_effects:
