# audit:allow test-scenario-coverage[cross_product] reason: |
#   축(진입 경로 × 이전 상태 × 세 체크 × 잔액 × 재고 × 회원 × 복원 × 취소 경로 × 쿠폰 × 스냅샷)의 전 조합은
#   수천 개다. 판정은 한 메서드(planManualPaidTransitionEffects)가 하므로 축마다 대표 조합과 실패·가드
#   경로를 메서드 하나씩 못박는다(세 체크의 8조합은 dataProvider 로 전수). effects 축은 면제하지 않는다.
# e2e:allow 확인 창의 표시·잠금은 레이아웃 구조 테스트와 핸들러 테스트가, 실제 화면 동작은 07 문서
#   Chrome MCP 실측(M 시나리오)이 잰다. Playwright 스펙은 두지 않는다.
feature: 수동 결제 처리·재활성 확인 창의 세 항목(재고 차감·사용 마일리지 차감·결제금액 기록)과 재활성 복원 (#747 C3)

description: |
  관리자가 결제 전 주문을 결제완료 이후로 직접 올리거나(P) 취소된 주문·상품을 되살릴 때(R-주문·R-상품),
  확인 창이 세 항목을 묻는다(Q13·Q14 — 기본 모두 켬, 해당 없는 항목은 숨김). 예전에는 수동 전이가 PG
  승인·입금확인을 거치지 않아 사용 마일리지·재고가 빠지지 않고 결제금액이 0 원으로 남았으며, 취소 주문을
  되살려도 취소 때 돌려준 마일리지를 다시 빼지 않았다.

    - 판정은 미리보기 API 와 실행이 같은 메서드를 쓴다. 미리보기는 아무것도 쓰지 않는다.
    - 요청에 세 값이 없으면 켬이다(기존 API 호환). 결제행에 입금이 이미 기록된 주문은 체크와 무관하게
      헤더 결제금액을 맞춘다(S2-D4).
    - 잔액 부족은 422 로 막고 일괄은 모자란 주문번호를 모두 알린다(Q4). 재고 부족도 500 대신 422 와 주문번호.
    - 재활성 마일리지는 원장 순계산(취소로 돌려준 합 − 재활성으로 다시 뺀 합)으로 회수한다 — 반품·교환 발
      환급과 클레임 추가결제 축은 제외한다. 돌려준 현금은 환불 누적에서 되돌린다(결제행은 PG 사실대로 둔다).
    - 재활성은 상품 행과 주문 합계를 취소 엔진과 같은 입력(최초 취소 직전 스냅샷)으로 복원한다(Q26).
      다른 주문이 이미 쓴 쿠폰이 있으면 막는다(Q27). 입금 전에 취소된 주문은 「결제금액 기록」으로
      복원 합계를 받은 것으로 기록한다(Q28). PG 결제가 이미 취소된 주문은 경고만 한다(Q24).

coverage_strategy: pairwise

axes:
  entry_point: [single_update, bulk_update, bulk_update_status, option_bulk_parent_sync, option_bulk_revive]
  from: [pending_order, pending_payment, cancelled_after_refund, cancelled_unpaid, live_with_cancelled_row]
  option_stock: [checked, unchecked, omitted, not_applicable]
  option_mileage: [checked, unchecked, omitted, not_applicable]
  option_record: [checked, unchecked, omitted, not_applicable, auto_sync]
  balance: [enough, short]
  stock: [enough, short]
  member: [member, guest]
  restoration: [whole_order, partial_rows, live_order_row, none]
  cancel_path: [refund, no_refund, partial_then_full]
  coupon: [none, reclaimable, expired, used_elsewhere, dropped_by_condition]
  pre_cancel_snapshot: [present, legacy]

