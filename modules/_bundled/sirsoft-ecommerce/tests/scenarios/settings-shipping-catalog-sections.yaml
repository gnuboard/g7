feature: 쇼핑몰 환경설정 배송 탭 — 택배사·배송유형 카탈로그 섹션

description: |
  배송설정 탭의 택배사·배송유형 관리 섹션(인라인 추가 폼·표/카드·행 편집·삭제·오류 표시)과, 배송유형을 읽는
  주문목록 필터·배송정책 폼 배송방법. 기존 레이아웃 구조 테스트 두 파일을 소유한다.

  수정 이력: 후속 B 세션 B3 (2026-10-08) — 이름 필수 언어를 보는 언어에서 사이트 기본 언어
  (`_global.appConfig.siteLocale`, 서버 `app.site_locale`)로 바꾸면서 두 파일을 고쳐, 매니페스트를 세우고
  describe 묶음별로 효과를 매핑했다. 추가 폼 게이트·오류 플래그·행 오류 조회 키 모두 서버 422 키
  `…name.{사이트 기본 언어}` 와 같은 축을 본다.

