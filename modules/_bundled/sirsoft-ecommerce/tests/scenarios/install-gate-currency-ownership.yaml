feature: 유저별 통화 설치 게이트 (A5)

description: |
  "유저별 통화 = 커머스 책임" 이 구조적으로 보장되는지 고정한다. 통화 관련 자산이 전부
  모듈 소유이면, 모듈 미설치(비활성) 시 코어 회원 화면·가입 흐름·권한 목록에서 통화가
  저절로 사라진다 — 코어를 따로 분기할 필요가 없다.

  기존 회귀 테스트(InstallGateCurrencyTest)를 사후 등재한 매니페스트다. 관리자 통화 필드
  판정은 주입 순서가 아니라 코어 확장 슬롯(extension_form_content) 주입 존재로 본다 —
  같은 확장 파일이 탭 목록(user_form_tabs)에도 props 를 얹기 때문이다.

axis_notes:
  asset: |
    hook_listeners = 가입 시 기본 통화 부여·회원 응답 통화 주입 리스너.
    admin_form_extension = 관리자 회원 폼의 통화 필드(layout_extension JSON).
    user_profile_migration = 회원별 통화를 담는 ecommerce_user_profiles 테이블.
    permission = 회원 통화 관리 권한 카테고리(user-currency).

axes:
  asset: [hook_listeners, admin_form_extension, user_profile_migration, permission]

effects:
  - currency_listeners_registered_by_module
  - admin_currency_field_injected_via_extension_slot
  - user_profile_table_created_by_module_migration
  - user_currency_permission_defined_by_module

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/InstallGateCurrencyTest.php
