feature: 관리자 화면이 클레임 선점 수량을 알고 상한을 그린다

description: |
  주문상품 한 행을 고객과 운영자가 **동시에** 클레임할 수 있다. 먼저 접수한 쪽이 수량을
  선점하고, 서버는 그 선점을 빼고 남은 수량까지만 허용한다(`ClaimQuantityGuard`).

  사용자 측은 이 계산을 이미 받아 쓴다 — `claimable-options` 가 `available_quantity` ·
  `locked_quantity` 를 실어 주고, 신청서 화면이 「신청 가능 N개」와 입력칸 `max` 를 그 값으로
  잡는다.

  그러나 **관리자 주문상세 응답에는 그 필드가 아예 없었다.** 그래서 [주문취소] 모달은
  수량 상한을 `cancelItem.quantity`(주문행의 원 수량)로 묶었고(`modules/_bundled/sirsoft-ecommerce/resources/layouts/admin/partials/admin_ecommerce_order_detail/_modal_cancel_order.g7.html:89`),
  운영자에게 고를 수 없는 수를 기본값으로 제시했다.

  조용한 지점은 여기다 — 서버는 선점을 정확히 알고 있어서 422 로 거절한다. 즉 **데이터는
  옳은데 화면만 모른다.** 운영자는 제출하고 나서야 한도를 알게 되고, 그 사이 무엇이 왜
  막혔는지는 화면 어디에도 없다.

  실측(#599 통합실측 세션1 · 주문 20260915-1352103470): 고객이 양말 4개 중 2개를 접수한 뒤
  관리자 모달이 `max=4` · 기본값 `4` 로 떴다. 3 을 넣어 제출하자 422
  「이미 진행 중인 신청 건이 있어 3개를 신청할 수 없습니다. (신청 가능 수량: 2개)」.

  계약: 관리자 주문상세의 주문옵션도 사용자 측과 **같은 어휘**(`available_quantity` ·
  `locked_quantity`)로 가용 수량을 싣는다. 산정은 `ClaimQuantityGuard` 한 곳이 소유한다 —
  두 화면이 서로 다른 계산을 하면 한쪽만 고치는 일이 반복된다. 화면은 그 값으로 수량을
  잡고, 가용이 0 인 행은 애초에 목록에서 뺀다.

axes:
  claim_state:
    - pending_refund   # 진행 중인 직접 환불신청이 수량을 선점한 상태
    - none             # 선점이 없는 상태 (과잉 차단 방지 대조군)

effects:
  - admin_order_options_expose_claim_availability   # 관리자 응답이 가용·선점 수량을 싣고, 선점이 없으면 원 수량과 같다

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Admin/AdminOrderClaimAvailabilityTest.php
