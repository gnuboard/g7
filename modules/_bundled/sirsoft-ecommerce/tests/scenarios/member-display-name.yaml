feature: 이커머스의 회원 표시 이름 (#490)

description: |
  이커머스가 회원 이름을 응답과 기록에 실을 때 회원 이름 컬럼을 직접 읽지 않고 코어 표시 이름 계산기를 거친다.
  영역은 셋이다. 사용자 화면의 상품 후기(`sirsoft-ecommerce:review`, 사이트 기본을 따름), 사용자 화면의 상품 문의
  (`sirsoft-ecommerce:inquiry`, 가린 이름 고정), 이커머스 관리자 화면(`sirsoft-ecommerce:admin`, 관리자 화면을 따름).

  설정을 바꾸지 않은 사이트의 응답은 수정 전과 같다. 상품 문의 작성자는 종전과 같은 가림 글자이고(영역 기본값이 종전
  가림을 대신하므로 두 번 가려지지 않는다), 상품 후기 작성자는 회원 이름이다. 주문의 주문자 이름과 수령인, 내보낸 파일의
  회원 칸은 표시 이름과 무관하게 적힌 그대로다.

  공개 후기의 작성자 이름 가림(리뷰 설정, 7.1.6)은 실명을 가리는 장치다 — 후기 영역 표시 이름 안의 회원 실명만 가리고,
  닉네임·이미 가린 종류·탈퇴 문구는 다시 가리지 않는다. 그래서 설정을 바꾸지 않은 사이트의 후기 작성자는 가린 회원 이름이다.

  실명은 이름 키에 싣지 않는다. 관리자 컨트롤러에 도달한 요청이고 보는 사람에게 회원 조회 권한이 있으며, 탈퇴 회원이 아니고
  실명이 표시 이름과 다를 때만 별도 키(`real_name`, `author_real_name`, `user_real_name`, `granted_by_real_name`,
  `created_by_real_name`)로 싣는다. 사용자 화면 응답에는 어떤 경우에도 실명 키가 없다.

  기능별 설정(후기, 문의)은 쇼핑몰 환경설정에서 바꾸지만 값은 코어 설정의 영역 묶음에 저장된다. 그래서 환경설정의 회원 탭과
  값이 하나이고, 닉네임으로 고정하면 코어가 닉네임 항목을 잠근다.

  축은 하나(`case`)다. 영역, 화면, 권한을 축으로 나누면 곱이 미커버로 남으므로 잠그는 사실 하나를 한 사례로 편다.

