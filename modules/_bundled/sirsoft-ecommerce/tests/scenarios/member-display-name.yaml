notes:
  - |
    사용자 화면에는 작성자 이름으로 후기나 문의를 찾는 검색이 없다(상품 상세의 후기 목록은 별점과 옵션으로만 거른다).
    그래서 「사용자 화면 검색은 그 영역에서 보이는 종류만 찾는다」 사례는 이 매니페스트에 없다. 그 규칙 자체는 코어의
    검색 헬퍼 테스트가 잠근다.
  - |
    알림의 받는 사람 이름은 이커머스가 자리표시(`{recipient_name}`)만 싣고 코어가 받는 사람과 채널마다 푼다. 채널별로 풀린
    값은 코어 알림 테스트가 잠근다. 교환, 반품, 환불 알림의 받는 사람 이름 자리표시는 기존 클레임 알림 테스트가 잠근다.
  - |
    `EcommerceNotificationDataListenerTest` 는 주문 알림 매니페스트(`order-status-notification.yaml`)에도 올라 있다.
    이 매니페스트에는 표시 이름 사례 하나(`notification_member_names`)만 귀속한다.
