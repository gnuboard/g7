feature: 임시 주문 서비스의 생성, 조회, 갱신, 삭제, 만료 정리, 만료 연장

description: |
  TempOrderService 가 장바구니로 임시 주문을 만들고(회원은 회원 ID, 비회원은 장바구니 키), 유효한 임시 주문을
  조회하고, 프로모션과 마일리지와 배송지를 받아 다시 계산해 저장하고, 삭제하고, 만료분을 정리하고, 만료 시각을
  연장하는 계약을 저장소와 계산 서비스를 모의 객체로 바꾼 단위 시험으로 지킨다.

  갱신은 보낸 값만 바꾼다. 프로모션과 마일리지를 보내지 않으면 기존 값이 재계산 입력과 저장 값에 남고,
  명시해 보내면 그 값으로 바뀌며, 일부만 보내면 보낸 항목만 바뀐다.

  같은 시험 파일의 체크아웃 최종 검증(판매상태, 구매수량) 시험은 mp05-cart-unavailable-product.yaml 과
  mp05-purchase-quantity-limit.yaml 이 맡는다. 만료된 임시 주문의 404 응답은 mp06-checkout-temp-order-expiry.yaml 이 맡는다.

axis_notes:
  case: |
    create_* 는 createTempOrder, get_* 는 getTempOrder, update_* 는 updateTempOrder,
    delete_* 와 delete_by_id_* 는 deleteTempOrder 와 deleteTempOrderById, cleanup_expired 는 cleanupExpiredTempOrders,
    has_* 는 hasTempOrder, extend_* 는 extendExpiration 이다.

axes:
  case: [create_member, create_empty_cart, create_guest,
         get_found, get_missing,
         update_recalculate, update_missing, update_promotions_omitted, update_promotions_explicit, update_promotions_partial,
         delete_found, delete_missing, delete_by_id_found, delete_by_id_missing,
         cleanup_expired, has_found, has_missing, extend_found, extend_missing]

effects:
  # 생성
  - temp_order_created_for_member                              # 회원 장바구니 → 계산 후 저장, 그 회원의 임시 주문
  - temp_order_create_rejects_empty_cart                       # 빈 장바구니는 예외
  - temp_order_created_for_guest_cart_key                      # 비회원은 회원 없이 장바구니 키에 묶인다
  # 조회
  - temp_order_lookup_returns_valid_order
  - temp_order_lookup_returns_null_when_missing
  # 갱신
  - temp_order_update_recalculates_and_saves                   # 한 번 다시 계산해 저장한다
  - temp_order_update_throws_when_missing                      # 갱신 대상이 없으면 예외
  - temp_order_update_keeps_promotions_and_points_when_omitted # 보내지 않은 프로모션과 마일리지는 기존 값 유지
  - temp_order_update_replaces_promotions_when_sent            # 명시해 보낸 빈 값은 기존 값을 지운다
  - temp_order_update_merges_partial_promotions                # 보낸 항목만 바뀌고 나머지는 유지
  # 삭제
  - temp_order_deleted_by_owner_key
  - temp_order_delete_returns_false_when_missing
  - temp_order_deleted_by_id                                   # 회원 ID 와 장바구니 키 없이 ID 만으로 삭제
  - temp_order_delete_by_id_returns_false_when_missing
  # 만료 정리, 존재 확인, 만료 연장
  - temp_order_cleanup_returns_deleted_count
  - temp_order_existence_true_when_valid_order_exists
  - temp_order_existence_false_when_missing
  - temp_order_expiration_extended
  - temp_order_extend_returns_null_when_missing

# E2E axis 없음: 서비스 단위 계약이고 레이아웃 JSON 과 컴포넌트 변경이 없다.

test_files:
