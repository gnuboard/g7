feature: 편집기 창 표본 매개변수

description: |
  레이아웃 편집기에서 쇼핑몰 관리 창이 표본 상태로 채워져 열리는지(번역 인자 기준)
  
  편집기 모달 목록 115개를 하나씩 열어 보니(2026-10-07) 몇 창이 문구 자리 표시자를 그대로 드러내거나 빈 채로 열렸다 —
  「{{number}} 신청서의 환불을 실행합니다」·「선택한 상품을 {{status}} 상태로…」·「'{{name}}' 프리셋을…」(클레임),
  「'false' 프리셋을 삭제…」(주문·상품 목록), 「'{name}' 공통정보를 복사…」, 본문 없는 「진행 방식 변경」,
  직권 실행 창의 대상·건수. 창 본문 문구의 인자는 목록 행 클릭 같은 앞선 동작이 `_global` 에 담는 값이라, 편집기는
  `editor-spec.json` 의 창 상태 표본으로 그 값을 채워야 한다. 표본이 없거나 인자를 거짓값(false)·빈 문자열로 주면
  운영 화면에서는 생기지 않는 깨진 문구가 편집 화면에만 보인다.
  
  쇼핑몰 관리 창 마크업에서 `|인자={{… _global …}}` 꼴의 번역 인자를 모두 찾아, 같은 창 id 의 기본 표본 상태로

  수정 이력: 이커머스 전수 실측 S5 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04]
  # c01: 검사할 번역 인자가 있다
  # c02: $modalId ($file) 의 |$param 인자
  # c03: 리뷰 이미지 미리보기 창 표본이 보여 줄 그림 주소를 채운다(빈 주소면 깨진 그림)
  # c04: 표본 상태 이름에 쓴 모듈 번역 키가 한국어·영어 문구에 있다

effects:
  - modal_sample_params_render

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/editorModalSampleParams.test.ts
