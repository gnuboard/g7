notes: |
  **결제 정보·환불 실행 탭은 이 세션의 범위 밖이었고 S9b 가 섹션과 함께 더했다.** 그 축의
  커버리지는 별도 매니페스트(`admin-claim-detail-payment.yaml`)가 소유한다 — 이 매니페스트의
  `claim_detail_tabs_match_sections` 는 두 세션의 탭·섹션을 함께 세는 축으로 남는다.

  완료 처리 모달의 세 진입점 중 이 세션이 둘(신청서 내 상품 일괄 · 상세 [완료 처리])을 더해
  D26 의 공유 계약이 처음으로 세 지점에서 성립한다. 모달 partial 은 목록 세션(S8b)이 소유한
  파일 그대로이며 복제본이 없다는 것을 구조 테스트가 파일 부재로 단언한다.

  관리자 메모의 저장 경로는 금액 수정 엔드포인트(`PUT {claimType}/{id}/amounts`, D18)다 —
  메모가 그 요청이 받는 축이기 때문이고, 게이트도 `claims.update-amounts` 다. 버튼 활성
  조건을 상태 전이 권한으로 잡으면 그 권한만 가진 운영자에게 버튼은 살아 있고 저장만
  403 이 된다. 환불신청서에는 저장 컬럼 자체가 없어 입력을 그리지 않는다.

  **브라우저 실측의 선행 조건**: 상세를 열려면 신청서 한 건이 필요한데
  `playwright:seed-ecommerce` 의 클레임 축이 아직 stub 이다(계획서 이월 5). spec 은 목록
  API 로 신청서를 발견해 진행하고, 한 건도 없으면 그 사실을 드러내며 건너뛴다 — 없는
  데이터를 있는 척 단언하지 않는다. 시드가 생기면 그 분기가 저절로 사라진다.

  **실측이 만든 세 effect**. `claim_detail_tabs_read_computed_with_prefix` 는 computed 값이
  `_computed.` 접두로만 읽힌다는 사실에서 나온다 — 맨 이름으로 읽으면 표현식이 `undefined`
  가 되고 `?? []` 폴백이 그 사실을 덮어, 섹션 탭이 **한 칸도 그려지지 않는데 오류는 나지
  않는다**. `claim_items_grid_marks_option_change_by_flag` 는 서버가 옵션 변경이 아닌 행에도
  `new_unit_price_formatted` 를 원 값으로 폴백해 채운다는 사실에서 나온다 — 값의 존재로
  분기하면 동일 옵션 교환에 교환 대상이 지정된 것처럼 보인다.
  `claim_detail_refetches_claim_and_logs` 는 상태 전이·송장·메모가 활동 로그도 남기기
  때문이다 — 신청서만 다시 읽으면 헤더는 갱신되는데 활동 로그 섹션만 옛 목록으로 남아
  운영자는 방금 자기가 한 처리가 이력에 없는 것으로 본다. 셋 다 오류를 남기지 않아
  구조·렌더 테스트를 통과했고 브라우저에서만 드러났다.
