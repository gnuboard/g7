feature: 관리자 클레임 상세 골격 (#599 S9a — D17·D14·D24·D25·D26)

description: |
  목록의 클레임번호가 가리키던 화면을 만든다. 셸(섹션 탭 + scrollSpy) · 신청 정보(진행단계 ·
  신청상품 일괄 변경 · 완료 처리 카드 · 사유/메모) · 배송 정보(회수·재발송 통합) · 활동 로그
  넷이다. 이 화면에서 조용히 깨지는 지점은 일곱이다.

  ① **탭 배열과 섹션 존재가 다른 조건으로 갈리면** 탭은 보이는데 클릭이 아무 일도 하지
     않거나(섹션 없음), scrollSpy 가 없는 탭 id 를 활성화하려다 무시된다(탭 없음). 어느
     쪽도 예외·로그를 남기지 않는다 (D17-①). 그래서 배송 축의 조건식을 셸의 탭 배열과
     섹션 `if` 가 **문자 그대로** 공유한다.

  ② **회수·재발송을 두 섹션으로 나누면** 탭이 하나 더 생기고, 재발송이 없는 반품에서 빈
     탭이 남는다 (D17-②). 한 카드 안의 두 항목이며, 반품에는 '해당 없음' 안내가 그 자리를
     지킨다 — 통째로 빼면 운영자가 '아직 안 보이는 것' 과 '해당 없음' 을 구분할 수 없다.

  ③ **유형 스코프 경로 세그먼트를 화면이 조립하면**(`claim_type + 's'`) 그 조립이 세그먼트
     규칙의 두 번째 출처가 된다. 규칙이 바뀌어도 오류 없이 404 만 나는 URL 이 만들어지므로
     서버가 준 `claim_path_segment` 만 쓴다.

  ④ **화면이 읽는 데이터소스의 게이트가 이 화면의 라우트 권한보다 좁으면** 그 권한 조합의
     운영자에게만 값이 조용히 빈다. 완료 처리 기본값(설정)과 택배사 목록은 둘 다
     `settings.read` 게이트라, 상세 응답이 그 값의 통로다 — 전권 계정에서는 재현되지 않는다.

  ⑤ **진행단계 순서를 화면이 다시 적으면** 상태가 늘어도 화면만 낡은 채로 남는다. 순서는
     상태 Enum 의 지식이고, 결제 두 칸은 **결제형 청구**에서만 지나간다 — 금액만 보면 반품
     배송비 차감 건에 영영 지나가지 않는 칸 두 개가 남는다. 보류·반려·철회는 흐름을 따라가는
     단계가 아니라 멈추는 사건이라 순서 밖의 이탈 칸으로 붙인다.

  ⑥ **완료 처리 모달을 복제하면** 세 진입점 중 한 곳만 고쳐졌을 때 나머지 둘이 조용히 옛
     규칙으로 남는다 (D26). 상세는 목록이 소유한 파일을 그대로 참조하고, 대상·실행 경로·
     재조회 대상은 여는 쪽이 넘긴다 — 성공 후 다시 읽을 데이터소스까지 모달이 알고 있으면
     나머지 진입점의 화면이 옛 값을 그린 채 남는다.

  ⑧ **뒤집힌 전제 (2026-09-14 정정)** — 이 화면을 처음 만들 때 「환불에는 상품 단위 전이
     축이 없다」를 전제로 삼았다. 그 판단은 **틀렸다.** 환불에 회수 공정이 없다는 사실이
     승인·반려의 상품 단위 분기까지 함께 없앤 것이고, 설계축 D24·D25 는 유형을 제한한 적이
     없다. 지금은 환불도 교환·반품과 같은 상품·수량 단위 전이를 쓴다 — 일괄 바는 **취소만**
     빠지고(생성이 곧 확정), 완료만 환불 실행의 소유로 남는다(위 `exclusions` 의 refund×final).
     옛 전제를 지우지 않고 여기 남기는 이유는, 그 전제가 만든 리터럴 배열(`['exchange','return']`)이
     화면·라우트·테스트 세 곳에 흩어져 있었고 같은 형태가 다시 들어오면 알아볼 수 있어야
     하기 때문이다.

  ⑦ **재발송지 뱃지 2종을 하나로 합치면** "값이 다르다" 와 "고객이 손댔다" 를 구분할 수 없다
     (D14). 운영자가 나중에 주소를 되돌리면 값은 같아지지만 손댄 사실은 남는다.

# axis 의미:
#   claim_type — 탭 배열·섹션 존재·상품 단위 전이 가능 여부·메모 저장 가능 여부·진행단계
#                순서가 전부 여기서 갈린다. 취소(cancel)는 조회 전용 상세다 — 전이·송장·청구·
#                환불 실행 축이 없고 취소 정보 카드(구분·환불 상태·환불 금액·취소 일시)가 선다.
#                주문상세 클레임 내역과 클레임 목록 취소 탭의 번호가 이 화면으로 이어진다.
#   claim_stage — 진행단계가 그리는 모양이 갈리는 축. `in_progress` 는 순서 안의 한 칸이
#                 현재이고, `off_path` 는 순서 밖(보류·반려·철회)이라 현재 칸이 없다,
#                 `final` 은 완료 처리 카드가 사라지는 지점이다.
axes:
  claim_type: [exchange, return, refund, cancel]
  claim_stage: [in_progress, off_path, final]

exclusions:
  - { claim_type: refund, claim_stage: final, reason: "환불의 완료는 환불 실행(S9b)이 옮기는 상태라 이 세션의 화면에 그 전이 지점이 없다" }
  - { claim_type: cancel, claim_stage: in_progress, reason: "취소는 접수 즉시 완료로 기록된다(CancelStatusEnum requested→completed 가 한 트랜잭션) — 진행 중 상태로 열리는 화면이 없다" }
  - { claim_type: cancel, claim_stage: off_path, reason: "취소 상태 Enum 에는 보류·반려·철회 같은 이탈 상태가 없다" }

