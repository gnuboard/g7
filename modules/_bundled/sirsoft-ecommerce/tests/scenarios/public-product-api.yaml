feature: 공개 상품 API (목록·인기·신상품·최근 본 상품·상세)

description: |
  쇼핑몰 화면이 읽는 공개 상품 API 의 노출 규칙과 응답 필드를 잰다. 카테고리 하위 포함은
  `mp09-category-descendant.yaml`, 상품 수정 링크 게이트는 코어
  `tests/scenarios/admin-user-cross-navigation.yaml` 이 맡는다.

  조용히 깨지는 지점은 셋이다.
  ① 숨김 상품이 목록·최근 본 상품·상세 어디로든 새면 운영자가 내린 상품이 다시 보인다.
  ② 상세가 배송정책·상품정보제공고시·공통정보·브랜드·라벨·추가옵션 중 하나를 떨어뜨리거나
     없을 때 null 대신 다른 모양을 내면 상세 화면의 그 칸이 오류 없이 비거나 깨진다.
  ③ 라벨은 활성이고 기간 안인 할당만 실려야 한다 — 만료·비활성 라벨이 남으면 끝난 행사가 보인다.

# axis 의미:
#   endpoint — 호출하는 공개 API.
axes:
  endpoint: [index, popular, new, recent, show]

