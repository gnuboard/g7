feature: 이커머스 관리자 목록의 실명 보조 줄

description: |
  관리자 화면의 회원 이름 칸은 관리자 영역 표시 이름이다. 서버는 요청한 관리자에게 회원 조회 권한이 있고 실명이 표시 이름과
  다를 때만 실명 키를 더한다. 화면은 그 키가 있을 때만 이름 아래에 작은 글씨 보조 줄(접근 가능한 이름 「실명 ○○」)을 그리고,
  없으면 줄 자체를 그리지 않는다.

  대상은 장바구니 관리, 위시리스트 관리, 배송지 관리, 상품 문의 관리(`member.real_name`), 주문 목록과 주문 상세
  (`user.real_name`), 상품 후기 관리(`author_real_name`, 없으면 `user.real_name`), 쿠폰 발급 내역(`user_real_name`),
  마일리지 내역(회원 `user_real_name`, 처리자 `granted_by_real_name`)이다. 목록은 DataGrid 한 벌이 넓은 화면 표와 좁은 화면
  카드를 같은 칸 정의로 그리므로 칸 정의 한 곳에 넣는다.

  주문 목록과 주문 상세는 주문서에 적힌 주문자 이름을 먼저 보이므로, 그 이름이 실명과 같으면 같은 글자를 두 번 적지 않는다.
  데이터 내보내기 이력의 요청자는 기록물이라 손대지 않는다.

