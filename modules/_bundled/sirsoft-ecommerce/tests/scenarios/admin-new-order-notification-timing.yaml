feature: 관리자 신규주문 알림 발송 시점 — 주문 생성과 결제완료 중 한 번만

description: |
  운영자에게 가는 「새로운 주문이 접수되었습니다」(`new_order_admin`)는 한 주문에 **한 번만**
  서야 한다. 두 번 서면 알림함에서 어느 쪽이 새 주문인지 구분할 수 없다.

  그런데 «언제» 보낼지는 결제수단에 따라 갈린다.

  - **무통장·비-PG**: 주문 «생성» 시점. 입금 전이라도 접수 사실은 운영자가 알아야 한다.
  - **카드(PG)**: 생성 시점은 아직 `pending_order`(결제 전)라 보내지 않는다. 결제창을 닫고
    떠난 주문까지 알리면 알림함이 유령 주문으로 찬다. **결제완료** 시점에 보낸다.
  - **0원(전액 마일리지·예치금)**: 생성 트랜잭션 안에서 곧바로 결제완료가 되므로 그 경로
    (`fireZeroAmountPaymentCompleteHooks`)가 한 번 보낸다.

  두 시점의 조건은 서로 **대칭**이어야 한다. 한쪽만 조건을 걸면 그 결제수단은 두 번 받는다.

  결함(#599 세션A 브라우저 실측 2026-09-21 · 주문 `20260921-1316400577`):
  `completePayment()` 이 조건 없이 발화해, 무통장 주문이 접수 13:16 에 71행 + 관리자
  입금확인 13:31 에 다시 71행, 합계 **142행**을 남겼다(수신 운영 계정 71). 같은 자리의 주석은
  「무통장/비-PG/0원 주문은 각자 다른 시점에 이미 발화하므로 여기서 발화하지 않는다」로
  적혀 있어 문서와 코드가 어긋나 있었다.

  결제완료 시점의 판정 기준은 **결제행에 기록된 `pg_provider`** 다(`paymentWentThroughPg`).
  생성 시점처럼 설정을 다시 읽으면(`orderRequiresPgPayment`), PG 플러그인을 끈 사이트에서
  카드 주문의 관리자 알림이 조용히 사라진다 — 결제행은 실제로 무엇을 탔는지를 이미 안다.
  금액은 보지 않는다: 결제완료 뒤 `total_due_amount` 는 이미 0 이다.

  결제완료에 «도달한» 사실은 `order_confirmed_admin` 이 따로 알린다(같은 훅 `order.after_confirm`).

# axis 의미: 갈라지는 축은 «결제수단이 PG 를 타는가»와 «어느 시점인가» 둘이다.
# 두 축의 곱이 곧 계약이다 — 각 결제수단이 정확히 한 칸에서만 발화한다.
axes:
  payment_kind: [pg, non_pg]
  moment: [order_created, payment_completed]

effects:
  - pg_order_defers_admin_notify_to_payment_complete   # 카드(PG)는 생성 시점에 보내지 않는다
  - non_pg_order_sends_admin_notify_at_creation        # 무통장(비-PG)은 생성 시점에 보낸다
  - pg_order_sends_admin_notify_once_on_completion     # 카드(PG)는 결제완료 시점에 한 번 보낸다
  - non_pg_order_does_not_resend_admin_notify          # 무통장은 입금확인에서 다시 보내지 않는다

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/OrderProcessingServiceTest.php

validation:
  audit_rule: backend-change-requires-test
  browser_check: |
    #599 세션A 실측(2026-09-21). 수정 전 무통장 주문 `20260921-1316400577` 은 접수 71행 +
    입금확인 71행. 수정 후 새 무통장 주문 `20260921-1352121066` 은 접수 `new_order_admin` 71 ·
    입금확인 `new_order_admin` **0** · `order_confirmed` 1 · `order_confirmed_admin` 71.
  note: |
    이 매니페스트는 이 클래스의 「관리자 신규주문 알림 발송 시점」 블록(4 케이스)만 소유한다.
    같은 파일의 다른 블록(초기 상태 결정·금액 검증·결제 실패 동기화 등)은 각자의 축이 다르다.
