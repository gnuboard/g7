feature: review_image_upload_delete_api

description: |
  회원이 자기 리뷰에 이미지를 올리고 지우는 API(ReviewImageController 의 store, destroy)의
  응답 계약을 고정하는 Feature 테스트의 시나리오 소유 매니페스트. 파일 저장소는 목으로 바꿔
  실제 파일을 쓰지 않는다.

  핵심 동작:
    - 올리기는 본인 리뷰에만 된다. 성공하면 201 과 함께 이미지 행이 생긴다.
    - image 필드가 없거나, 이미지가 아니거나, 용량 한도를 넘으면 422 다.
    - 리뷰 한 건의 이미지 수 한도(기본 5장)를 넘기면 422 다.
    - 지우기는 본인 리뷰의 이미지에만 된다. 성공하면 200 과 함께 이미지 행이 소프트 삭제된다.
    - 다른 리뷰에 속한 이미지 ID 나 없는 이미지 ID 는 404 다.
    - 남의 리뷰는 403, 로그인하지 않은 요청은 401 이다.

  같은 시험 파일의 해시 주소 내려받기(숨김 리뷰 차단, 서명 URL)는 코어의
  tests/scenarios/file-serving-parent-state-gate.yaml 이 선언한다. 이미지 수와 용량 한도를
  설정으로 바꾸는 경로는 mp11-review-image-policy.yaml 이 선언한다.

axes:
  area:
    - upload
    - delete

effects:
  # 올리기
  - review_image_upload_creates_row_with_201
  - review_image_upload_requires_image_field
  - review_image_upload_rejects_non_image_file
  - review_image_upload_rejects_oversized_file
  - review_image_upload_forbidden_on_other_member_review
  - review_image_upload_rejected_over_max_count
  - review_image_upload_requires_login
  # 지우기
  - review_image_delete_soft_deletes_own_image
  - review_image_delete_forbidden_on_other_member_review
  - review_image_delete_not_found_for_image_of_other_review
  - review_image_delete_not_found_for_missing_image
  - review_image_delete_requires_login

# E2E axis 없음: 판정은 전부 서버측이고 레이아웃 JSON, 컴포넌트 변경이 없다.

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/User/ReviewImageControllerTest.php

validation:
  audit_rule: test-scenario-coverage
