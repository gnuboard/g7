feature: 이커머스 환경설정 → 알림 정의 → 알림 문안 편집 창 — 닫으면 회원 검색 결과(이름·이메일)를 비운다

description: |
  「특정 회원」 수신자 검색 결과(이름·이메일)와 고른 회원 이름을 창 이름 공간 _global.ecommerce_notification_template_form_modal 에 담는다.
  저장 성공만 비웠고 「취소」·창 머리 닫기·Esc 로 닫으면 다음에 열 때까지 전역에 남았다(7.1.1).
  열려 있는 동안 내내 붙어 있는 본문 틀의 unmount 와 「취소」 단추가 이름 공간을 null 로 비운다. 축 close 는 닫는 갈래다
  (바깥 클릭은 closeOnOverlayClick=false 라 닫히지 않는다).

axes:
  close: [header_escape, cancel, save_success]

effects:
  - notification_template_user_search_cleared_on_any_close

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/notificationTemplateEditCloseClears.test.ts
