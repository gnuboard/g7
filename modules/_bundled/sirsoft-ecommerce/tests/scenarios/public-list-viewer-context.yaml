feature: 공개 상품 목록 응답 보강(카드 단추용) + 관련·최근 본 상품 확장 지점

description: |
  공개 상품 목록·인기·신상품·최근 본·관련 상품·통합검색 결과에 카드의 찜·장바구니 단추가 쓰는 값을 싣는다:
  is_wishlisted(보는 회원의 찜 여부, 비회원 false), options_count(활성 옵션 수), has_additional_options(추가옵션 그룹 유무).
  값은 ProductService::attachPublicListViewerContext() 한 곳이 응답당 정해진 수의 쿼리로 붙인다(상품 수에 비례하지 않음).
  관련 상품·최근 본 상품 조회에 before·결과 필터·after 훅과 관련 상품 검증 규칙 필터 훅을 더한다.

axes:
  endpoint: [index, popular_new_recent_related, related, admin_index, search]
  viewer: [member, guest, member_query_count, extension_hooks, admin]

exclusions:
  - { endpoint: admin_index, viewer: [member, guest, member_query_count, extension_hooks], reason: "관리자 목록은 관리자만 본다 — 보는 사람 키가 없다는 사실 하나를 잰다" }
  - { endpoint: [index, popular_new_recent_related, related, search], viewer: admin, reason: "공개 끝점에서 관리자는 보는 회원 한 명이다 — member 경로와 같다" }
  - { endpoint: [index, search, related], viewer: extension_hooks, reason: "확장 지점(훅 세 개·검증 규칙 필터)은 관련·최근 본 상품 묶음에만 있다" }
  - { endpoint: [related, search], viewer: member_query_count, reason: "행마다 쿼리를 늘리지 않는 계약은 공개 목록(index)과 나머지 공개 목록 묶음(popular_new_recent_related, 관련 포함)이 잰다" }
  - { endpoint: [popular_new_recent_related, related], viewer: guest, reason: "비회원 판정(찜 false·찜 쿼리 없음)은 공개 목록 리소스 한 곳이다 — index×guest 가 잰다" }
  - { endpoint: search, viewer: member, reason: "통합검색은 공개 목록과 같은 카드 리소스를 거친다 — 보는 회원 판정은 index×member 가 재고, 검색은 카드 필드가 실리는지를 잰다" }

effects:
  - list_marks_wishlisted_products_for_member
  - list_counts_active_options_only
  - list_flags_additional_options
  - list_wishlist_false_for_guest
  - guest_list_never_queries_wishlist
  - other_public_lists_carry_the_same_flags
  - list_viewer_context_adds_no_per_row_query
  - other_lists_add_no_per_row_query
  - related_list_carries_flags_after_result_hook
  - admin_list_has_no_viewer_context_keys
  - related_list_fires_three_hooks
  - recent_list_fires_three_hooks
  - result_filter_changes_response
  - related_validation_rules_are_filterable
  - search_result_carries_card_fields

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Product/PublicListViewerContextTest.php
