# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 찜 목록의 숨김 상품 노출 차단

description: |
  이슈 #524 WP-C2. 상품을 숨긴 뒤에도 그 상품이 회원의 찜 목록에는 그대로 남아 있었다.
  눌러 들어가면 「없는 상품」 화면이 뜨는데, 회원은 판매가 끝난 것인지 오류인지 알 수 없다 —
  숨김은 «공개 화면에서 보이지 않게 한다» 는 뜻이므로 찜 목록도 그 규칙을 따라야 한다.

  판정은 `Product::scopeVisible` 한 곳에 둔다. 목록마다 조건을 복사하면 새 목록이 생길 때마다
  같은 결함이 되살아난다.

  구분해야 할 두 상태:
  - 숨김(비공개): 목록에서 뺀다.
  - 일시 품절·판매 중지: 목록에 **남긴다**. 다시 팔릴 수 있고, 회원이 기다리는 중일 수 있다.
    찜을 지워 버리면 그 대기가 사라진다.

  다시 공개하면 찜 목록에 되돌아온다 — 찜 레코드 자체는 지우지 않았기 때문이다.

# 입력 axis
#  product_state: 찜한 상품의 현재 상태
axes:
  product_state: [visible, hidden, suspended, hidden_then_visible]

effects:
  - wishlist_excludes_hidden_products
  - wishlist_keeps_suspended_products
  - wishlist_hidden_product_reappears_when_visible_again

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Public/WishlistVisibilityTest.php

validation:
  audit_rule: test-scenario-coverage
