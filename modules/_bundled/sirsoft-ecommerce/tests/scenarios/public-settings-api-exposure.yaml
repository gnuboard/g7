feature: 공개 설정 API 의 노출 키

description: |
  비회원도 부를 수 있는 설정 API(settings/shipping·payment·review·checkout)가 설정 카테고리 원본을 통째로
  돌려주지 않고, 설정 기본값 파일의 공개 키 목록(public_api_schema)에 있는 키만 돌려준다.
  주문서·주문 상세가 쓰는 키(배송 국가·결제수단·은행·입금 계좌·입금 기한·후기 사진 한도)는 그대로다.

axes:
  endpoint: [shipping_and_review, payment, checkout]
  viewer: [guest]

effects:
  - shipping_settings_only_public_keys
  - review_settings_only_public_keys
  - payment_settings_only_public_keys
  - payment_settings_keep_checkout_keys
  - checkout_settings_use_the_same_public_keys

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Public/PublicSettingsExposureTest.php
