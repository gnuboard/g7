feature: 적립금 정책 3종 — 가입 적립금 · 적립금 쓴 주문 적립 없음 · 사용 가능 최소 상품 합계

description: |
  세 정책 모두 환경설정(마일리지)에서 켜며 기본은 꺼짐이다.
  - 가입 적립금: 스스로 가입한 회원에게 한 번(가입 훅·활성화 훅, 관리자 생성 제외), 시스템 지급(granted_by NULL), 유효기간 설정을 따름.
  - 적립금 쓴 주문 적립 없음: 새 주문은 설정과 실제 사용액, 재계산은 주문 스냅샷(earn_policy·used_points)으로 판정.
  - 사용 가능 최소 상품 합계: 상품 합계(할인 전 소계)가 기준 미만이면 사용 검증 422, 안내값(최대 사용액) 0, 스냅샷에 기준 기록.

axes:
  policy: [signup_earn, no_earn_when_points_used, min_product_total_for_use]
  setting: ["on", off_or_zero, changed_after_order]
  trigger: [register_active, pending_then_activated, withdrawn, admin_created, enum_contract, order_with_points, order_without_points, recalculation, below_threshold, at_or_above_threshold, guidance_values, max_usable_api]

exclusions:
  - { policy: signup_earn, trigger: [order_with_points, order_without_points, recalculation, below_threshold, at_or_above_threshold, guidance_values, max_usable_api], reason: "발동 조건은 정책마다 다른 값 집합이다 — 가입 적립은 가입·활성화 훅으로만 발동한다" }
  - { policy: no_earn_when_points_used, trigger: [register_active, pending_then_activated, withdrawn, admin_created, enum_contract, below_threshold, at_or_above_threshold, guidance_values, max_usable_api], reason: "적립금 쓴 주문 적립 없음은 주문 생성·재계산으로만 발동한다" }
  - { policy: min_product_total_for_use, trigger: [register_active, pending_then_activated, withdrawn, admin_created, enum_contract, order_with_points, order_without_points, recalculation], reason: "사용 가능 최소 상품 합계는 사용 검증·안내값·최대 사용액 API 로만 발동한다" }
  - { policy: signup_earn, setting: changed_after_order, reason: "가입 적립에는 주문 스냅샷이 없다 — 주문 뒤 설정 변경 축이 성립하지 않는다" }
  - { policy: signup_earn, setting: off_or_zero, trigger: [pending_then_activated, withdrawn, admin_created, enum_contract], reason: "꺼짐·0 은 지급 판정 맨 앞에서 끊긴다 — 발동 경로와 무관한 한 분기라 register_active 로 잰다(admin_created·enum_contract 는 설정과 무관한 구독·분류 계약)" }
  - { policy: no_earn_when_points_used, setting: off_or_zero, trigger: order_without_points, reason: "적립금을 쓰지 않은 주문은 정책 켜짐·꺼짐과 무관하게 적립한다 — 켜짐(on)에서 잰 것과 같은 경로" }
  - { policy: no_earn_when_points_used, setting: changed_after_order, trigger: [order_with_points, order_without_points], reason: "「주문 뒤 설정 변경」은 이미 만들어진 주문의 재계산에서만 판정을 가른다" }
  - { policy: no_earn_when_points_used, setting: ["on", off_or_zero], trigger: recalculation, reason: "재계산은 현재 설정이 아니라 주문 스냅샷을 따른다 — 설정이 주문 뒤 바뀐 경우(changed_after_order)만 판정이 달라진다" }
  - { policy: min_product_total_for_use, setting: off_or_zero, reason: "기준 0(끔)은 검증·안내값을 건너뛰는 한 분기다 — guidance_values 시험이 min_product_total_ignored_when_disabled 효과로 잰다" }
  - { policy: min_product_total_for_use, setting: changed_after_order, trigger: [at_or_above_threshold, guidance_values, max_usable_api], reason: "주문 뒤 기준 변경은 주문 생성 재검증(below_threshold)에서만 판정을 가른다" }

