# audit:allow test-scenario-coverage[cross_product] reason: 세 정책의 발동 조건 축(trigger)이 정책마다 다른 값 집합이라 전수 곱이 아니라 정책별 경로를 잠근다.

feature: 적립금 정책 3종 — 가입 적립금 · 적립금 쓴 주문 적립 없음 · 사용 가능 최소 상품 합계

description: |
  세 정책 모두 환경설정(마일리지)에서 켜며 기본은 꺼짐이다.
  - 가입 적립금: 스스로 가입한 회원에게 한 번(가입 훅·활성화 훅, 관리자 생성 제외), 시스템 지급(granted_by NULL), 유효기간 설정을 따름.
  - 적립금 쓴 주문 적립 없음: 새 주문은 설정과 실제 사용액, 재계산은 주문 스냅샷(earn_policy·used_points)으로 판정.
  - 사용 가능 최소 상품 합계: 상품 합계(할인 전 소계)가 기준 미만이면 사용 검증 422, 안내값(최대 사용액) 0, 스냅샷에 기준 기록.

axes:
  policy: [signup_earn, no_earn_when_points_used, min_product_total_for_use]
  setting: ["on", off_or_zero, changed_after_order]
  trigger: [register_active, pending_then_activated, withdrawn, admin_created, enum_contract, order_with_points, order_without_points, recalculation, below_threshold, at_or_above_threshold, guidance_values, max_usable_api]

