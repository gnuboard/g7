feature: extension_payment_method
description: >
  PG 플러그인이 등록하는 확장 결제수단(간편결제)을 1급 시민으로 처리한다.
  능력(PG 필요 여부 / 라벨 / 환불수단 / PG 고정)의 해석은 결제수단 설정 카탈로그를 SSoT 로
  삼으며, 코어 PaymentMethodEnum 에 case 가 없는 확장 ID 도 동일하게 판정된다.

  이슈 #475: 확장 결제수단이 pg_provider=null 로 등록돼 서버가 "PG 결제가 아닌 주문" 으로
  오인했고, 그 결과 (a) 결제 실패한 주문에 관리자 신규주문 알림이 발송되고 (b) 임시주문이
  즉시 삭제돼 재결제가 불가능했다. 두 결함은 하나의 원인이다.

