feature: 전량 반품 완료 주문의 주문 상태 — 「반품완료」와 개인정보 보존기간 종결

description: |
  교환·반품은 진행 중에는 주문 상태를 바꾸지 않고 신청서 상태로 보인다(docs/settings.md). 그런데 완료 뒤에도 주문을
  그대로 두어, 상품이 전부 반품완료(일부는 취소)인 주문이 「배송완료」로 남았다. 공통 파생 규칙(`deriveParentStatus`)은
  활성 상품이 0 건이면 「취소」를 내므로 반품 서비스는 동기화를 부르지 않았고, 개인정보 보존기간 파기는 구매확정·취소만
  종결로 봐서 전량 반품 주문은 영영 대상이 되지 못했다.

  반품 완료 뒤 살아 있는 상품(취소·반품완료 외)이 하나도 없고 반품완료 상품이 있으면 주문을 반품완료로 바꾼다(상태 변경 훅 발화).
  부분 반품·진행 중 클레임이 남은 주문·전량 교환은 종전대로다. 상태 동기화도 이런 주문을 취소로 뒤집지 않는다.
  파기는 마지막 반품 완료 시각으로 보존기간을 잰다. 기존 주문은 1.3.0 업그레이드가 보정한다.

# axis 의미:
#   remaining — 반품 완료 뒤 살아 있는 상품: 없음 / 있음(부분 반품) / 다른 클레임 진행 중.
#   mix       — 끝난 상품의 구성: 반품완료만 / 반품완료 + 취소 / 교환완료 원 행 + 받은 상품 반품완료 / 교환완료 원 행 + 받은 상품 취소.
#               교환완료 원 행은 받은 상품이 승계해 닫힌 행이라 살아 있는 상품으로 세지 않는다.
axes:
  remaining: [none, some, in_progress]
  mix: [returned_only, returned_and_cancelled, exchanged_then_returned, exchanged_then_cancelled]

exclusions:
  - { remaining: some, mix: returned_and_cancelled, reason: "살아 있는 상품이 남으면 끝난 상품 구성과 무관하게 주문 상태를 바꾸지 않는다 — some×returned_only 가 그 분기를 잰다" }
  - { remaining: in_progress, mix: returned_and_cancelled, reason: "진행 중 클레임이 남으면 끝난 상품 구성과 무관하게 바꾸지 않는다 — in_progress×returned_only 가 그 분기를 잰다" }
  - { remaining: some, mix: exchanged_then_returned, reason: "살아 있는 상품이 남으면 끝난 상품 구성과 무관 — some×returned_only 가 잰다" }
  - { remaining: some, mix: exchanged_then_cancelled, reason: "살아 있는 상품이 남으면 끝난 상품 구성과 무관 — some×returned_only 가 잰다" }
  - { remaining: in_progress, mix: exchanged_then_returned, reason: "진행 중 클레임이 남으면 끝난 상품 구성과 무관 — in_progress×returned_only 가 잰다" }
  - { remaining: in_progress, mix: exchanged_then_cancelled, reason: "진행 중 클레임이 남으면 끝난 상품 구성과 무관 — in_progress×returned_only 가 잰다" }

effects:
  - fully_returned_order_becomes_returned            # 살아 있는 상품이 없으면 반품완료, 동기화도 취소로 뒤집지 않음
  - partial_or_in_progress_return_keeps_order_status # 부분 반품·진행 중 클레임은 주문 상태 불변
  - fully_returned_order_is_a_retention_target       # 보존기간이 지난 반품완료 주문은 파기 대상(마지막 반품 완료 시각)
  - upgrade_backfills_fully_returned_orders          # 1.3.0 업그레이드가 기존 전량 반품 주문을 반품완료로 보정(멱등)
  - returned_order_reachable_by_status_filter        # 관리자 주문 목록 주문 상태 필터 칩이 반품완료를 포함(주문이 가질 수 있는 상태 전부)

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Playwright/specs/admin/admin-order-list-returned-status-filter.spec.ts
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Claims/FullyReturnedOrderStatusTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Upgrades/BackfillFullyReturnedOrderStatusTest.php

validation:
  browser_check: Chrome MCP
  note: |
    서버 전이·파기 대상·업그레이드는 PHPUnit 으로 잰다. 실브라우저는 전량 반품을 완료한 주문의 관리자 목록·상세 상태 배지를 본다.
