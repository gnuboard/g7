notes: |
  **어휘 집합은 Enum 단일 출처에서 파생한다.** 화면 칩 값을 손으로 적으면 Enum 이 늘 때
  칩만 옛 집합으로 남고, 그 상태로 기록된 행은 도달 불가가 된다. 구조 검사가 칩 값 집합과
  `OrderListRequest` 게이트의 Enum 집합을 **정확히 같은 집합**으로 비교한다 — 부분집합도
  초과집합도 위반이다.

  **클레임 유무는 스칼라다.** 서버 규칙이 `in:none,any,active` 라 배열이 아니다. 칩을 배열
  토글로 만들면 두 값이 동시에 선택되어 마지막 값만 URL 에 실리고, 화면은 둘 다 켜진 것으로
  보인다.

  **컬럼 표시의 출처는 하나다.** 서버가 클레임 요약을 항상 싣고, 표시 여부는 컬럼 선택
  (브라우저 저장값)만이 정한다. 요약 요청을 주소로 나르는 축을 다시 만들면 표시와 값
  수신이 두 근거를 갖게 되어 같은 결함이 재현된다 — 구조 검사가 세 레이아웃 파일에
  `with_claim_summary` 가 없음을 고정한다.

  **클레임 기준 블록은 기본 노출이다** (계획서 §6-4-2). 검색 편집에서 숨길 수는 있지만
  기본 목록에 들어 있어, 운영자가 편집을 열어보지 않아도 이 기능이 있다는 것을 안다.
