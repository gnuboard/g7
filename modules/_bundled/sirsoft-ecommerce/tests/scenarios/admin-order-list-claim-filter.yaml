feature: 주문 목록 클레임 기준 필터 · 클레임 컬럼 (#599 S10 — D22)

description: |
  주문관리 필터 카드에 **클레임 기준 블록**을 신설하고, DataGrid 에 유형별 최신 상태를
  보여주는 **클레임 컬럼**을 더한다. 서버 축(파라미터·whereExists·요약 직렬화)은 S6c 가
  놓았고 이 세션은 그것을 화면에 잇는다. 조용히 깨지는 지점은 넷이다.

  ① **화면 어휘가 서버 게이트를 벗어나면** 칩 하나를 누른 순간 목록 전체가 422 가 되는데,
     화면에는 직전 목록이 그대로 남아 "필터가 걸렸다" 로 보인다. 반대로 Enum 값이 칩에서
     빠지면 그 상태로 기록된 클레임이 달린 주문은 어떤 필터 조합으로도 도달 불가가 된다.
     취소 축의 어휘는 상태가 아니라 **취소 유형**(전체/부분)이다 (S6c 판정 ①).

  ② **왕복이 한 지점이라도 빠지면** 새로고침에서 그 필터만 사라진다. 필터 상태 → URL →
     데이터소스 파라미터 → 재진입 복원 네 지점이 같은 축 집합을 나른다.

  ③ **컬럼 표시의 근거가 둘이면 어긋난다.** 종전에는 요약을 `with_claim_summary` 요청에만
     싣는 opt-in 이었는데, 컬럼 표시는 브라우저 저장값이 정하고 값 수신은 주소가 정해
     서로 갈렸다 — 컬럼을 한 번 켠 운영자의 다음 진입에서 컬럼은 보이는데 전 행이 "-" 가
     되고, 반대로 공유 링크 수신자는 서버가 계산한 값을 받고도 컬럼을 못 봤다. 오류·로그가
     남지 않는다. 서버가 항상 싣도록 되돌려(확정) 근거를 하나로 만든다.

  ④ **총 건수가 부풀면** 목록은 정상으로 보이는데 페이지 경계가 어긋난다. 저장소가
     `whereExists` 대신 조인으로 걸면 1:N 이라 원 행이 늘어난다.

  같은 화면에 **서버가 모르는 단수 키**(`claimRefundStatus` → `claim_refund_status[]`)가
  프리셋·엑셀 배선에 남아 있었다. 어느 서버 경로도 그 이름을 읽지 않아 프리셋이 클레임
  조건을 저장한 것처럼 보이고 실제로는 아무것도 거르지 않았다 — 계약상의 복수 키로 옮긴다.

# axis 의미:
#   claim_axis — 필터 축의 성격. presence 는 스칼라(한 값만, 다시 누르면 해제)이고
#                type_status 는 유형별 배열 누적이며, fault_and_date 는 유형과 직교한다.
#                세 성격이 상태 저장·URL 직렬화 형태를 서로 다르게 만든다.
axes:
  claim_axis: [presence, type_status, fault_and_date]

