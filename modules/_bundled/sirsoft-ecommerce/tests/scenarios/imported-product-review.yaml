notes:
  - |
    재이관 때 관리자가 이미 바꾼 값은 지우지 않는다 — `status` 와 답변은 입력에 그 키가 있을 때만 덮어쓴다.
    관리자가 지운(소프트 삭제) 후기는 되살리지 않고 그대로 돌려준다(`trashed()` 가 참).
