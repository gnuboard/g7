feature: 관리자 회원 상세의 마케팅 동의 이력 표 (Marketing Consent History Overlay)

description: |
  마케팅 플러그인이 관리자 회원 상세에 붙이는 동의 이력 표 overlay 의 렌더링을 잰다. 이력 행(`histories`)을 반복해
  일시, 동의 유형, 변경(동의/철회), 경로(회원가입/관리자 등)를 그리고, 이력이 없으면 빈 안내 문구를 보인다.

  회원가입 폼과 마이페이지 프로필 overlay 묶음은 지웠다(마케팅 동의가 회원 항목 약관 묶음으로 옮겨 감).
  그 동작은 마케팅 플러그인의 항목 선언 시험과 사용자 템플릿 공용 항목 조각의 약관 묶음 시험이 잠근다.

axes:
  histories: [empty, one_row, granted_and_revoked]

effects:
  - empty_history_message_shown
  - history_table_header_rendered
  - history_rows_render_action_and_source

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/marketing-extension-point.test.tsx
