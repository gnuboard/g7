# audit:allow test-scenario-coverage[cross_product] reason: |
#   이 매니페스트의 커버리지 단위는 «유형 × 무엇» 의 조합이 아니라 **엔드포인트 계약 1건**이다.
#   유형별 매트릭스(상태 어휘·귀책·청구 축)는 admin-claim-list-filter-section 과 각 유형의
#   lifecycle 매니페스트가 이미 소유하고 있어, 여기서 조합마다 @scenario 를 또 달면 같은 축을
#   두 곳에서 세게 된다. effects·test_files 축은 면제하지 않는다.
feature: 관리자 클레임 컨트롤러 API 계약 (#599 — 목록 게이트 · 상세 · 상태 전이 · 일괄 · 송장 · 첨부)

description: |
  `Admin\ClaimController` 는 운영자 화면 하나가 아니라 **네 유형(교환·반품·환불·취소)을 한
  라우트로 받는 창구**다. 유형마다 소유 모델·상태 Enum·금액 컬럼이 다른데 응답 형태는 하나여야
  하므로, 어긋나도 500 이 아니라 **조용한 오표시**로 나타난다 — 그것이 이 표면의 성질이다.

  조용히 깨지는 지점을 네 갈래로 나눈다.

  ① **목록이 나르는 봉투.** 이 화면의 라우트 게이트는 `claims.read` 인데, 모달 초기값의 원래
     출처인 설정 엔드포인트는 `settings.read` 다. 기본 역할 `manager` 는 클레임 권한만 갖기
     때문에, 모달이 설정 응답에서 기본값을 읽으면 **그 운영자에게만** 도달하지 않는다. 상점이
     재고 복구를 꺼 두어도 모달은 켜진 채 열려 그대로 실행된다(오류 없음). 그래서 완료 기본값은
     목록 응답이 나르고, 저장값이 불리언이 아니어도 «끈 것을 켜진 것으로» 읽지 않는다.

  ② **금액 축이 유형마다 다른 컬럼을 짚는다.** 환불은 PG 와 마일리지의 **합**이고 취소는
     연결된 환불 행을 되짚어야 한다. 목록이 보여 주는 금액과 범위 필터가 같은 컬럼을 보지
     않으면 «보이는 값으로 걸었는데 안 걸리는» 필터가 된다 — 빈 결과라서 장애로 보이지 않는다.

  ③ **상태 전이의 거절 사유가 두 층이다.** 쓰기 게이트가 먼저 «이 경로가 소유하지 않는 상태»
     를 막고(전용 경로가 따로 있는 상태), 그다음 전이 게이트가 «불가능한 도약» 을 막는다. 두
     층을 하나로 합치면 한쪽이 열려도 초록이 된다. 청구가 남은 승인은 청구 방식에 따라 갈린다 —
     `pay_on_approval` 은 결제 요청으로 가고 `pay_on_request` 는 거절이다.

  ④ **완료는 입구가 여럿인데 계약은 하나여야 한다.** 단건·일괄·옵션 일괄이 모두 완료로 갈 수
     있고, 완료 페이로드(환불신청서 생성·재고 복구)를 요구하지 않는 입구가 하나라도 있으면
     그 경로로 들어온 완료만 환불신청서 없이 끝난다. 그 주문은 잔여가 남은 채 «완료» 로 선다.

  일괄 경로는 **부분 성공**이 정상 결과다 — 건너뛴 건과 사유를 응답이 돌려주지 않으면 운영자는
  전건 성공으로 읽는다. 옵션 단위 일괄은 남의 클레임 항목·스칼라 배열·중복 id 를 422 로 끊고,
  수량 분할은 유형별로 각자의 범위에서만 움직인다.

  송장(수거·재발송)은 택배사와 번호가 **쌍**이라 한쪽만 와도 받지 않는다. 첨부는 운영자 업로드가
  staff 로 기록되어야 고객 업로드와 구분되고, 남의 클레임 첨부를 지우는 요청은 404 다.

