notes: |
  이 매니페스트는 같은 테스트 파일을 이미 소유하던 넷(admin-claim-list-filter-section ·
  admin-claim-list-body · claim-attachment-uploader-type · claim-item-quantity-split)이
  **각자의 관심사에 속하지 않아 남겨 둔 효과**를 받는다. 역매핑 룰은 소유 매니페스트 전량의
  effects 합집합으로 판정하므로, 넷 중 아무 데나 밀어 넣으면 그 매니페스트의 서술과 effects 가
  어긋나 다음 사람이 「이 효과가 왜 여기 있나」를 되짚게 된다(2026-09-22 실측: 미선언 35건).

  브라우저 축은 #599 세션 A·B 의 실측이 덮는다 — 이 파일은 API 계약 층이고, 같은 동작을
  화면으로 다시 재는 것은 Playwright spec 과 계획서 인계 로그가 맡는다.
