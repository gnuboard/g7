feature: 7.1.0 abilities 게이트 — 쓰기 버튼·서버 권한 축 정렬 (이커머스)

description: |
  7.1.0 출시 전 점검에서 찾은 「권한이 없는데 버튼이 살아 있는」 결함과 「접수 권한만으로 다른 권한의 일을
  하는」 서버 결함을 함께 닫는다. 화면은 응답의 abilities 키로 잠그고, 서버는 같은 권한으로 403 을 낸다.

  설계에서 못박은 것:
    - 직권 취소 「환불까지 한 번에 처리」 = 환불 실행 권한(`claims.execute-refund`). 직권 접수·예전 주문 취소 API 모두.
      관리자 주문 응답은 `abilities.can_execute_refund` 를 싣는다(결제 플러그인 [환불 재시도]도 이 키를 쓴다).
    - 직권 교환·반품 「접수와 함께 승인」 = 클레임 상태 변경 권한(`claims.update-status`). 권한이 없으면 접수 전에 403.
    - 취소 창 예상금액 조회 = 접수와 같은 `claims.create`.
    - 회원·비회원 [취소·환불 신청]이 즉시 취소 분기(`auto`)면 `user-orders.cancel` 도 요구한다.
    - 「주문 삭제」(`orders.delete`) 권한을 정의하고 admin 역할에 기본 부여한다(업그레이드 스텝이 기존 설치를 보정).
    - 응답에 키가 없던 곳(리뷰 목록·문의·회원 클레임·구매 흐름·회원 상세 통화/국가)에 키를 싣는다.
    - 상품 폼은 등록·복사 진입도 수정 진입처럼 입력칸까지 잠근다 — 폼 계산값 `isReadOnly` 가 수정 진입은 상품 can_update,
      등록·복사 진입은 목록 컬렉션 can_create 를 보고, 권한 응답이 아직 없으면 잠긴 쪽으로 시작한다(제품 결정 2026-10-10).
    - 배송정책 폼도 같은 기준이다 — `isReadOnly` 가 등록·복사 진입에서 목록 응답(`policy_abilities`)의 can_create 를 본다.
      쿠폰 폼은 수정 진입이 수정 권한 없으면 403 화면으로 접히므로, 등록 진입도 목록 응답(`coupon_abilities`)의
      can_create=false 면 폼을 그리기 전에 403 화면으로 접고 [저장]은 응답 키가 없어도 잠긴 쪽이다.
    - 레이아웃 게이트는 굽기 산출 `.json` 을 정적으로 대조한다(브라우저 실측은 통합 단계).
    - 환경설정 「본인인증 정책」 탭은 이커머스 권한 `identity.policies.read`/`.update` 로 동작한다(제품 결정 2026-10-10).
      이커머스 모듈 경로(/api/modules/sirsoft-ecommerce/admin/identity-policies)가 같은 권한으로 403 을 내고 이커머스 몫 정책만
      다룬다(다른 출처 정책 ID 는 404). 화면은 조회 권한이 없으면 「권한 없음」, 수정 권한이 없으면 읽기 전용 안내 + 쓰기 잠금.
      운영자 정책의 대상은 이커머스 지점으로 묶는다 — 훅·사용자 지정 범위는 `sirsoft-ecommerce.`, 경로 범위는
      `api.modules.sirsoft-ecommerce.` 로 시작해야 하고, 아니면 추가·수정이 422(target)다.

