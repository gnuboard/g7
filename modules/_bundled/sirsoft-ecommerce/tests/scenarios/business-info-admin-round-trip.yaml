feature: 관리자 「기본정보」 탭 조회·저장 왕복 (사업자 연락처 보존)

description: |
  쇼핑몰 환경설정 「기본정보」 탭은 사업자등록번호·전화·팩스·이메일을 나눔 칸으로 입력받고, 설정은 합친 값으로 저장한다.
  관리자 조회가 합친 값을 나눔 칸으로 펼쳐 폼에 채워야, 운영자가 다른 칸(사업자 정보 표시·호스팅 서비스 제공자 등)만 고쳐
  저장해도 네 값이 빈 칸으로 덮이지 않는다. 저장 응답도 같은 모양이라 그 응답으로 폼을 다시 채워도 나눔 칸이 비지 않는다.

axes:
  surface: [admin_index, admin_save_round_trip]
  stored: [merged_only]

effects:
  - admin_settings_expand_split_fields
  - admin_basic_info_save_keeps_contacts
  - admin_save_response_keeps_split_fields

