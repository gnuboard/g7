feature: 주문 목록 응답의 송장 조회 주소

description: |
  회원 주문 목록(마이페이지)과 관리자 주문 목록의 대표 배송 요약에 송장 조회 주소(tracking_url)를 싣는다.
  주소는 주문 상세와 같은 규칙 — 택배사의 조회 주소 틀에 송장 번호를 넣는다. 송장·택배사가 없으면 null.
  택배사는 목록 조회가 이미 함께 읽으므로 주문 수에 따라 쿼리가 늘지 않는다.

axes:
  shipping: [with_tracking_and_without, many_orders]

effects:
  - list_carries_tracking_url_when_tracked
  - list_tracking_url_null_without_tracking
  - list_tracking_url_adds_no_per_row_query

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/User/OrderListTrackingUrlTest.php
