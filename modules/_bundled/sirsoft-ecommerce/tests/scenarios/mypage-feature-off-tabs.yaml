# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 마이페이지 — 꺼진 기능의 탭 숨김

description: |
  이슈 #524 WP-C3. 적립금 탭이 마일리지 기능을 꺼 둔 쇼핑몰에서도 보였다. 눌러 봐야
  「사용하지 않는 기능입니다」 안내만 나오는 탭이라, 회원은 자기 적립금이 사라진 것으로 읽고
  문의를 넣었다.

  문의 탭은 이미 같은 이유로 연결 게시판 유무를 보고 있었다 — 적립금도 같은 규칙에 맞춘다.
  판정 근거는 «그 기능이 실제로 켜져 있는가» 이고, 그 값은 `frontend_schema` 로 노출되어
  부팅 시 `_global.modules` 에 실린다. 화면이 따로 조회하지 않는다.

  `expose` 를 빠뜨리면 값이 `undefined` 가 되어 탭이 **조용히 사라진다** — 기능을 켜 둔
  쇼핑몰에서 적립금 탭이 없어지는 반대 방향의 결함이다. 그래서 노출 선언 자체를 백엔드
  테스트가 함께 지킨다.

# 입력 axis
#  mileage: 마일리지 기능 설정
#  inquiry: 문의 게시판 연결 여부
axes:
  mileage: [on, off]
  inquiry: [linked, unlinked]

effects:
  # 백엔드 — frontend_schema 노출 선언
  - ecommerce_exposes_mileage_enabled_to_frontend
  - ecommerce_keeps_inquiry_board_slug_exposure
  - ecommerce_mileage_default_disabled
  # 레이아웃 — 탭 숨김 규칙
  - mypage_tabs_declare_all_nine
  - mypage_tabs_hide_mileage_when_disabled
  - mypage_tabs_hide_inquiries_without_board
  - mypage_tabs_read_settings_from_global_modules
  - mypage_tabs_hidden_list_covers_only_two_ids
  - mypage_tabs_switch_does_not_merge_query
  - mypage_tabs_active_state_comes_from_each_screen

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Config/FrontendSchemaExposureTest.php
  - templates/_bundled/sirsoft-basic/__tests__/layouts/mypage-tab-navigation.test.tsx

validation:
  audit_rule: test-scenario-coverage
