# audit:allow test-scenario-coverage reason: |
#   cross product 자동 전개는 audit 실행 환경에 js-yaml 이 없어 fallback YAML 파서가
#   nested axes 배열을 읽지 못하는 한계로 검출되지 않는다(동일 한계로 다른 번들 시나리오도
#   audit:allow 처리됨). 본 기능의 백엔드 axis 조합은 PHPUnit Unit/DTO 테스트가,
#   프론트 항상-items 전송·취소 모달 조건부 UI 는 Vitest 핸들러/레이아웃 테스트가 커버하며
#   모두 green 이다. effects ↔ 테스트 매핑은 본 매니페스트 effects 블록과 각 테스트가 대응한다.
feature: 주문 취소·환불 도메인 통합 (U1/U2/U20①②③④/U18②③④/A28)

description: |
  주문 취소 경로의 환불 판정·상태 로직·취소 모달을 통합 정비한다.

  핵심 동작:
    - U1: 무통장(dbank) 등 PG 미사용 결제수단은 취소 시 PG 환불 훅을 건너뛰고(needsPgProvider 가드)
      운영자 수동 환불 대기(RefundStatusEnum::APPROVED) 로 둔다. 카드/가상계좌는 기존대로 PG 환불(COMPLETED).
    - U2/U20②: 부분취소 차단 판정(AdjustmentResult::isCancelBlocked)에 "실제 결제 발생" 게이트를 도입.
      실결제 0원(미입금·운영자 0원 결제완료)은 무조건 허용, 실결제 주문에서만 추가결제 필요 시 차단.
      취소 계산기(refundAmount)는 불변.
    - U20①: 프론트(유저/관리자)는 선택 항목을 항상 items 로 전송. 전체취소 승격은 백엔드
      shouldConvertToFullCancel 이 담당(프론트 isFullCancel 휴리스틱 제거).
    - U20③: 취소 차단 메시지를 쿠폰 단정 없이 일반화.
    - U20④: cancelled_at native 컬럼에 전체·부분취소 모두 기록 + Resource 노출(cancelled_at_formatted).
    - 부분취소 모델 변경(2026-06-22): partial_cancelled 주문 상태를 제거. 부분취소는 별도 상태가 아니라
      "취소 옵션 + 잔여 활성 옵션 공존"이며, 주문 상태는 잔여 활성 옵션 기준으로 파생(syncParentOrderStatus).
      잔여 항목 재취소는 진행 상태(payment_complete 등)가 취소 가능 목록에 있어 자연 허용. 잔여 전량 취소 시 CANCELLED 전이.
      "일부 취소됨" 표시는 파생 플래그 is_partially_cancelled(취소옵션∧활성옵션)로 노출(목록·상세 보조 배지).
      주문내역 카운터는 부분취소 주문을 잔여 진행 상태 카운터에 집계(별도 partial_cancelled 키 없음).
      상품준비중 카운터↔필터 집합 통일(OrderStatusEnum::statisticsFilterGroups SSoT)은 유지.
    - A28: 취소 모달의 'PG 함께취소' 체크박스·'환불 우선순위' 라디오를 requires_pg_cancellation /
      포인트 사용분 기준으로 조건부 노출.

axes:
  item_selection:
    - single_full         # 단일 옵션 전량
    - multi_subset_full   # 다중 옵션 중 일부 전량
    - multi_partial_qty   # 다중 옵션 일부 부분수량
    - all_full            # 전 옵션 전량(=진짜 전체취소 → FULL 승격)
  payment_state:
    - unpaid_dbank        # 무통장 미입금 (payment_status≠PAID, paid=0)
    - operator_zero_paid  # 운영자 0원 결제완료 (payment_status≠PAID, paid=0)
    - card_paid           # 카드 결제완료 (PAID, paid>0)
    - dbank_paid          # 무통장 입금완료 (PAID)
    - vbank_paid          # 가상계좌 결제완료 (PAID)
    - points_used         # 포인트 일부 사용
  refund_branch:
    # #599 후속 D2 — 두 값 모두 환불신청서를 만든다. 다른 것은 전이 방식뿐이다.
    - auto                # 접수 후 승인·완료까지 자동 전이 (구 cancel)
    - request             # 접수 후 정지, 운영자 승인 대기 (구 refund)
    - none                # 취소·환불 신청 축이 아닌 경로 (관리자 취소·만료 자동취소)
  payment_method:
    # #599 후속 §7-2 — 수단마다 취소·환불이 다른 경로를 타고 다른 기록을 남긴다.
    - card                # PG (리스너 있음 / 없음 두 상태)
    - vbank_settled       # PG · 입금완료 (환불받을 계좌 필수)
    - vbank_awaiting      # PG · 미입금 (계좌 불필요)
    - dbank               # BANK — 사람이 송금, 승인에서 멈춘다
    - point_only          # POINTS — 마일리지 환급이 곧 실지급
    - zero_amount         # 0원 — 환불신청서를 만들지 않는다
  coupon:
    - none                # 쿠폰 없음
    - min_order_broken    # 최소주문금액 쿠폰(취소 시 조건미달)
  verify_stage:
    - api_response        # API 응답 성공/차단
    - order_status        # CANCELLED vs PARTIAL_CANCELLED 전이
    - cancel_accuracy     # 취소 옵션·수량 정확성(부분집합 유지)
    - cancelled_at        # cancelled_at 기록(전체+부분)
    - refund_record       # refund_method·refund_status(PG=COMPLETED, 무통장=APPROVED)
    - block_message       # 차단 메시지 텍스트(일반화)

effects:
  # U1 — 무통장 PG 환불 스킵 + 환불상태 정상화 (PHPUnit Unit)
  - dbank_cancel_skips_pg_and_succeeds           # 무통장 취소가 PG 훅 없이 성공
  - dbank_cancel_refund_method_is_bank           # 무통장 환불수단 BANK
  - dbank_cancel_refund_status_is_requested      # 무통장 환불상태 REQUESTED(운영자 승인 대기 · P16)
  - dbank_cancel_updates_order_and_payment       # 주문/결제 상태 갱신
  - card_cancel_fires_pg_hook_and_completes      # 카드 PG 환불 COMPLETED(비회귀)
  - vbank_cancel_fires_pg_hook                   # 가상계좌 PG 가드 통과(비회귀)
  # 3회차 계획서 검증 §9-1 — 상태 × 결제수단 매트릭스 (구매자 접수 표면)
  - refund_branch_matrix_covers_every_refund_method      # 수단 모집단을 enum 에서 파생해 전수 검산
  - refund_branch_matrix_covers_every_configured_status  # 상태 모집단을 설정에서 파생해 전수 검산
  - refund_branch_terminus_is_decided_by_the_refund_method  # PG·POINTS 완료 / BANK 승인
  # T2-D5 (#599 3차 실측 L-8) — 돈이 계좌로 돌아가는데 받을 계좌가 없으면 접수 자체를 막는다
  - refund_request_requires_a_bank_account_when_money_returns_by_transfer
  - refund_branch_is_decided_by_the_item_status          # 상품 상태가 auto/request 를 정한다
  # U2/U20② — 0원·미입금 부분취소 허용 (PHPUnit Unit + DTO)
  - partial_cancel_allowed_for_unpaid_order      # 미입금 부분취소 허용
  - partial_cancel_allowed_for_operator_zero_paid # 운영자 0원 결제완료 부분취소 허용
  - partial_cancel_passes_for_normal_paid_order  # 정상결제 부분취소 통과+환불 생성
  - cancel_block_gated_by_actual_payment         # isCancelBlocked 실결제 게이트(DTO)
  - cancel_block_epsilon_rounding                # 반올림 오차 epsilon 허용(DTO)
  - cancel_block_no_points_double_count          # 포인트 이중계산 방지(DTO)
  # U20① — 일부 부분취소 정확성 (PHPUnit Unit + Vitest)
  - partial_subset_keeps_remaining_active        # 부분집합 취소 시 잔여 활성 유지
  - all_items_promotes_to_full_cancel            # 전량 취소는 백엔드 FULL 승격
  - frontend_always_sends_items_user             # 유저 핸들러 항상 items 전송
  - frontend_always_sends_items_admin            # 관리자 핸들러 항상 items 전송
  # U20④ — 취소일시 (PHPUnit Unit + Resource)
  - full_cancel_records_cancelled_at             # 전체취소 cancelled_at 기록
  - partial_cancel_records_cancelled_at          # 부분취소 cancelled_at 기록
  - resource_exposes_cancelled_at_formatted      # Resource cancelled_at_formatted 노출
  # 부분취소 = 파생 상태 (PHPUnit Unit + Model)
  - partial_cancel_keeps_status_and_sets_partial_flag  # 부분취소 후 잔여 진행 상태 유지 + is_partially_cancelled
  - partial_cancelled_order_can_cancel_remaining       # 부분취소 주문 잔여 재취소 → 전량 시 CANCELLED 전이
  - partially_cancelled_remains_cancellable_via_progress_status  # 진행 상태 기준 재취소 허용, cancelled 차단
  # 카운터·필터 정합화 (PHPUnit Unit + Enum)
  - statistics_has_no_partial_cancelled_key      # getUserStatistics partial_cancelled 키 없음(진행 상태 집계)
  - statistics_preparing_sums_two_states         # 상품준비중 = PREPARING + SHIPPING_READY
  - statistics_hides_pending_order               # 주문대기 숨김 유지
  - preparing_filter_expands_to_group            # 상품준비중 필터 그룹 확장(카운터=필터 일치)
  # A28 — 취소 모달 조건부 UI (Vitest 레이아웃)
  - refund_priority_radio_conditional            # 환불 우선순위 라디오 조건부 노출
  - pg_checkbox_conditional                       # PG 함께취소 체크박스 조건부 노출
  - resource_exposes_requires_pg_cancellation    # OrderPaymentResource requires_pg_cancellation
  # 공개 #108 — 환불 예상(preview)은 조회만 수행한다
  - preview_refund_issues_zero_write_queries_on_coupon_issues   # 미리보기 중 coupon_issues 대상 UPDATE 0건
  - preview_refund_keeps_coupon_issue_updated_at_unchanged      # 왕복 UPDATE 로 인한 updated_at 오염 없음
  - preview_refund_keeps_coupon_status_used_at_order_id_unchanged # status/used_at/order_id 불변
  - partial_cancel_preview_reaches_recalculation_path_not_full_cancel_shortcut # 잔여 옵션이 있어야 재계산 경로 진입(전량취소 조기반환 아님)
  - recalculation_never_reads_coupon_usage_state_in_snapshot_mode # 스냅샷 모드 재계산은 쿠폰 사용 상태를 읽지 않음
  - coupon_restore_on_min_amount_shortfall_unchanged_after_reset_removal # 최소주문금액 미달 쿠폰 복원 동작 불변(회귀 가드)
  - partial_cancel_after_a_prior_refund_compares_against_the_amount_still_paid # 일부 환불 뒤 「취소 전 실결제」·보조 통화는 남은 결제액(S3-D14)
  - zero_refund_closed_row_is_not_refunded_again # 0원으로 닫힌 행은 마지막 상품 취소에서 다시 환불되지 않는다(S3-D18)

  # 치환 입력이 없는 취소·반품·교환 미리보기는 변경 전과 바이트 단위로 같다 (#599 후속 등가성 픽스처)
  - cancel_preview_output_unchanged_with_empty_substitutions

  # ── #599 후속 — 취소·환불 프로세스 재설계 ──────────────────────────────
  # 취소신청서 생성 지점 이동 (D3) + 자동 전이 엔진 (§4-2)
  - cancellation_record_is_created_only_on_refund_completion     # 환불완료 순간에만 취소신청서 생성
  - bank_refund_stops_at_requested_without_cancellation_record   # 계좌 환불은 접수에서 멈추고 취소신청서도 없다 (P16)
  - unpaid_cancel_skips_the_refund_request                       # 미결제·0원은 환불신청서 없음 (D1·P11) + 결제행 정리 (P4)
  - auto_advance_sends_one_notification_but_logs_every_step      # 알림 1건 · 로그 단계별 (§4-2)
  - cancellation_record_walks_requested_then_completed           # 취소 문서도 단계를 밟는다 (D16 · B3·B4)
  - admin_filed_refund_is_not_buyer_withdrawable                 # 운영자 대리 접수는 구매자 철회 불가 (§4-3-1)
  # 운영자 취소 게이트 = 물리 게이트 (D5) — 취소 가능 상태 설정은 고객 축으로만 남는다
  - admin_cancel_ignores_the_cancellable_status_setting_for_unshipped_items  # 설정 밖 상품준비중도 운영자는 취소
  - admin_cancel_refuses_shipped_items_even_when_the_setting_allows          # 설정이 허용해도 배송중은 거절
  # 일원화 입구의 호출부 구분 · 구조 가드 (§12-F C-2 · §9-1) — 테스트가 이미 표시하던 효과의 선언 누락 보충
  - user_cancel_is_filed_on_the_buyer_axis                       # 회원 주문취소는 고객 신청(DIRECT)으로 접수
  - cancel_intake_rejects_empty_items                            # 상품 행 없는 취소 문서는 만들지 않는다
  # 관리자 주문취소·환불 예상 API 계약 (Admin\OrderCancellationControllerTest)
  - admin_estimate_refund_returns_the_refund_amount              # 환불 예상 응답이 환불 예상액을 싣는다
  - admin_estimate_refund_requires_items                         # 대상 없는 환불 예상은 422
  - admin_estimate_refund_carries_shipping_details               # 환불 예상 응답이 배송비 상세를 싣는다
  - admin_estimate_refund_carries_restored_coupons               # 쿠폰 주문의 환불 예상 응답이 복원 쿠폰을 싣는다
  - admin_auto_advance_full_cancel_cancels_the_order             # 자동 전이 전체취소 → 주문 CANCELLED
  - admin_auto_advance_partial_cancel_is_accepted                # 자동 전이 부분취소 접수 성공
  - admin_auto_advance_cancel_is_accepted_in_one_request         # 자동 전이 취소는 한 요청으로 끝난다
  - admin_cancel_of_a_shipping_order_is_rejected                 # 배송중 주문 취소 422
  - admin_cancel_of_a_cancelled_order_is_rejected                # 이미 취소된 주문 재취소 422
  - admin_cancel_of_a_missing_order_is_404                       # 없는 주문번호 404
  - admin_cancel_accepts_a_refund_priority                       # 환불 우선순위를 지정한 취소 성공
  - admin_cancel_restores_the_used_coupon                        # 전체취소가 사용 쿠폰을 복원한다
  - admin_cancel_requires_a_reason                               # 취소 사유 없으면 422
  # 잔여 한도 이중 차감 금지 (§12-B) + 전량 제외 경로의 기존 환불 차감 (새 결함 N1)
  - second_partial_refund_is_not_zeroed_by_double_deduction
  # 돈·재고가 어긋나는 결함의 회귀 잠금 (§7-2)
  - skipping_pg_never_stamps_refund_completed                    # P2 — PG 미호출이면 완료를 찍지 않는다
  - cancelled_order_is_not_revived_by_a_late_deposit             # P4 — 취소된 주문은 되살아나지 않는다
  - missing_pg_listener_falls_back_to_bank_refund                # P14 — 플러그인 제거 뒤에도 취소 가능
  - registered_pg_listener_keeps_pg_refund_method                # P14 비회귀
  - bank_transfer_cancel_requires_a_refund_account               # P9 — 송금 수단은 계좌 필수
  - settled_virtual_account_requires_a_refund_account            # P9 — 입금완료 vbank 도 계좌 필수
  - card_cancel_does_not_require_a_refund_account                # P9 비회귀
  - auto_cancel_expired_stores_a_reason_code_not_a_sentence      # P17 — 영문 로케일 만료 자동취소
  - auto_cancel_expired_reason_code_is_locale_independent
  - auto_cancel_expired_prints_the_real_payment_method
  # 프런트 계약
  - frontend_sends_auto_advance_refund_not_cancel_pg             # P2·D7 — 관리자 모달 페이로드
  - frontend_auto_advance_defaults_to_off                        # D7 — 기본 꺼짐
  - order_item_checkbox_follows_claimable_types_only             # U-3 — 미결제 주문의 헛 체크박스 제거

  # ── #599 후속 2회차 — 전면 일원화 (§12-D·§12-E) ────────────────────────
  - second_partial_refund_returns_only_the_remaining_share       # N13 — 이미 돌려준 몫을 다시 세지 않는다 (과다 환불)
  - order_ledger_is_settled_exactly_once_per_intake              # DoD 2 — 합계 재계산·취소 기록은 한 번
