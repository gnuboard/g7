notes: |
  E2E: 서버 계약(선언 동기화, 실제 HTTP 요청의 검증과 저장, 응답)은 PHPUnit 이 잰다. 화면은 따로 잰다 —
  운영자 표는 adminCheckoutFieldsTable(Vitest), 주문서 입력과 주문 요청 본문은 사용자 템플릿의 checkout-order-fields(Vitest),
  주문 상세의 값 표시는 order-detail-extra-fields 와 admin-order-detail-extra-fields(Vitest)다.
  운영자가 표에서 항목을 켜고 끈 뒤 주문서에 반영되는 흐름은 브라우저 실측으로 확인한다.
