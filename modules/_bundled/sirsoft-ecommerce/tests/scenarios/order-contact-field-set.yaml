feature: 주문서 항목 집합

description: |
  주문서에서 받는 주문자와 배송지 항목을 항목 집합 sirsoft-ecommerce.order_contact 으로 선언한다. 운영자는 이커머스 환경설정의
  주문 설정 탭에서 코어 공용 항목 API 로 표를 보고 고친다(권한은 이커머스 설정 권한).

  - 잠긴 항목(주문자 이름과 연락처, 수령인 이름과 연락처, 배송 주소)은 주문 요청의 고정 규칙이다. 표에는 잠긴 행으로 보이고
    운영자도, 다른 확장의 기여나 필터도 사용과 필수를 바꿀 수 없다.
  - 설정 가능한 기본 항목(주문자 이메일, 상세 주소, 배송 메모)은 기존 요청 키와 기존 저장 컬럼을 그대로 쓰고 사용과 필수만
    운영자 설정을 따른다. 꺼진 항목은 규칙에서 빠지고 요청에 실려 와도 저장하지 않는다. 비회원의 주문자 이메일은 늘 필수다.
  - 추가 항목(운영자가 추가한 항목, 다른 확장이 기여한 항목)의 요청 키는 extra_fields.{키}, 값은 주문과 같은 트랜잭션에서
    공용 값 테이블(소유자 종류 ecommerce_order)에 저장하고 주문 응답의 extra_fields 로 내보낸다. 보유기간 처리와 주문 삭제가 함께 지운다.
  - 주문서 조회와 다시 계산 응답은 같은 order_fields(정의 버전, 기본 항목의 사용과 필수, 구획별 추가 항목 계약)를 싣는다.
  - 설정을 바꾸지 않은 사이트의 주문 생성 규칙은 수정 전과 키와 값까지 같다.
  - 훅이 없던 요청 8개가 rules() 끝에서 자기 검증 필터를 부른다.

# 축은 하나(case)로 편다 — 집합의 어느 계약을 재는지다. 계약끼리 교차하지 않는다.
