feature: 이커머스 관리자 아이콘 버튼 이름·상품 목록 새로고침

description: |
  관리자 설정·카탈로그·판촉·배송정책·배너·회원 배송지 화면의 아이콘만 있는 버튼이 읽을 수 있는 이름을 갖는지
  
  글자 없이 아이콘만 그리는 버튼(휴지통·연필·×·체크·새로고침·뒤로·이전/다음·펼침)은 aria-label 이 없으면 화면 낭독기가
  아이콘 이름(「trash」·「xmark」·「pencil」 등)으로 읽거나 그냥 「버튼」 이라고만 읽는다(이커머스 전수 실측 S5, 2026-10-07 —
  환경설정 통화·결제수단·택배사 표, 상품 옵션 줄, 쿠폰 회원 칩 등 26개 파일 50여 곳). 각 버튼에 하는 일을 이름으로 단다.
  
  상품 목록 머리의 새로고침 버튼은 이름에 더해 **눌러도 아무 일이 없었다**(처리기 없음) — 목록을 다시 부르게 한다.
  
  예시 값만 박힌 골격 화면(개인결제·입금·결제 실패·엑셀 내려받기·할인코드)은 배선 때 함께 다루므로 여기서 제외한다.

  수정 이력: 이커머스 전수 실측 S5-D30·D31 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03]
  # c01: %s — 아이콘만 있는 버튼마다 aria-label 이 있다
  # c02: 상품 목록 새로고침 버튼은 목록(products)을 다시 부른다
  # c03: 대표 계좌 버튼은 눌림 상태를 알린다(aria-pressed)

effects:
  - icon_only_buttons_named

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminIconOnlyButtonNames.test.ts
