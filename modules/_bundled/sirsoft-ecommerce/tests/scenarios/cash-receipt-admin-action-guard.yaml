    - cancel
    - reissue
    - issue

effects:
  - cash_receipt_cancel_requires_confirmation # 발급취소는 확인 문구를 받는 순차 동작 안에서 DELETE 한다
  - cash_receipt_actions_lock_while_requesting # 발급·재발급·발급취소는 요청 중 잠기고 성공·실패에서 풀린다

