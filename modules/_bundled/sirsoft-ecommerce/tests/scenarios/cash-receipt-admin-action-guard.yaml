feature: 관리자 현금영수증 발급·재발급·발급취소 보호 (S3-D22)

description: |
  [발급취소] 가 확인 없이 한 번에 결제사 취소를 걸었고, 발급·재발급·발급취소 버튼이 요청 중에도 눌렸다(실측: 주문
  20261007-0657560638 — 발급번호 730008052 가 클릭 한 번에 취소). `<sequence confirm>` + 진행 플래그 + 버튼 disabled.

axes:
