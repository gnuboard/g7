notes: |
  **유형은 축이 아니다.** 번호 링크와 썸네일 자리는 카드 헤더·상품 줄에 있고 유형별 4열째(금액)와
  무관하다 — 테스트는 반품·교환 한 건으로 그 자리를 잰다. 취소 유형의 상세 자체는
  `admin-claim-detail` 이 소유한다.

  **비회원 새 창 불가는 설계가 아니라 제약이다.** 조회 토큰의 저장 위치(sessionStorage)가 바뀌면
  비회원도 `new_window` 로 올릴 수 있다 — 그때 셸 값 하나만 바꾸면 된다.
