notes: |
  조건부 요청(304)·원본 캐시 계약은 기존 이미지 서빙 시나리오(product-image-service · category-image-service ·
  mp11-review-image-policy)가 소유한다 — 이 매니페스트의 변경 뒤에도 그 시나리오가 green 이어야 한다.
