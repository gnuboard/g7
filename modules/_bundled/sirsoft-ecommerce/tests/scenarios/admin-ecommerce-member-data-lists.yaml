# audit:allow test-scenario-coverage[cross_product] reason: |
#   cross product 면제는 `cross_product` 축 하나로 한정한다 — effects 커버리지는 계속 강제된다.
#   이 매니페스트의 축은 화면이 받는 «입력 공간의 서술» 이고, 조합마다 서로 다른 동작이
#   갈리는 분기가 아니다. 예컨대 표 컬럼 구성을 재는 테스트에 검색 대상·읽음 상태·회원
#   한정 값을 곱해도 재는 대상이 달라지지 않는다 — 전개하면 인위적인 조합만 늘어난다.
#   실제 커버리지 계약은 effects 목록이며, 선언한 항목은 모두 테스트가 재고 green 이다.

feature: 관리자 이커머스 회원 데이터 목록 4종 (찜·장바구니·배송지·상품문의)

description: |
  이슈 #524 WP-E. 회원이 남긴 이커머스 데이터 네 갈래는 회원 본인만 볼 수 있었다. 운영자는
  「이 회원이 무엇을 담아 뒀나」·「이 상품을 몇 명이 찜했나」를 물어 오면 DB 를 열어야 했고,
  탈퇴·정리 요청이 들어와도 화면에서 지울 방법이 없었다.

  네 화면은 같은 뼈대를 쓴다 — 조건은 주소에서 읽고, 검색 조립은 명명 액션 한 자리에 모이며,
  선택은 보이는 쪽에만 걸리고, 삭제는 `can_manage` 능력이 있을 때만 열린다. 다른 것은
  «무엇이 행의 주어인가» 와 전용 필터뿐이다:

  - 찜: 숨김·품절 상품은 목록에서 빠진다(`Product::scopeVisible`) — 회원 화면에서 사라진
    상품이 관리자 목록에만 남아 있으면 그 행을 설명할 수 없다.
  - 장바구니: 비회원 것이 섞이므로 `owner` 로 가른다(정리 기준이 다르다).
  - 배송지: 받는 사람·주소가 회원 이름과 다를 수 있어 별도 검색 갈래를 둔다. 회원 한정은
    검색 대상/검색어와 **다른 축**이라 전용 다중선택 필터가 쥐고(`user_uuids[]`), 고른 회원의
    이름표는 목록 응답이 `filters.members` 로 되돌려 준다 — 코어 회원 검색은 uuid 를 한 건씩만
    받아, 한정이 세 명이면 화면이 왕복을 세 번 해야 한다(2026-09-21 검수 지적).
  - 상품문의: 본문 검색이 다형 관계를 넘어가야 해서 서버가 morph 타입을 먼저 푼다.
    해석되지 않는 타입이 섞여 있어도 화면이 500 으로 죽지 않고 그 타입만 건너뛴다.

  회원 상세 「쇼핑 데이터」 탭은 네 건수만 보여 주고 각 전용 목록으로 넘긴다 — 같은 표를
  회원 상세에 네 벌 더 두면 검색·일괄 삭제가 두 곳으로 갈린다.

# 입력 axis
#  list       : 목록 갈래
#  permission : 운영자 권한 (read 만 / manage 까지)
#  member_scope: 회원 한정(user_uuid) 으로 들어왔는가
#  extra_filter: 그 목록만의 전용 필터
axes:
  list: [wishlist, cart, user_address, inquiry]
  permission: [read, manage]
  member_scope: [true, false, multi]
  extra_filter: [none, owner, is_default, is_answered]

# 의미 없는 조합 컷: 전용 필터는 그 목록에만 있다
exclusions:
  - { list: wishlist, extra_filter: owner, reason: "찜은 회원만 남긴다 — 비회원 축 없음" }
  - { list: wishlist, extra_filter: is_default, reason: "배송지 전용" }
  - { list: wishlist, extra_filter: is_answered, reason: "문의 전용" }
  - { list: cart, extra_filter: is_default, reason: "배송지 전용" }
  - { list: cart, extra_filter: is_answered, reason: "문의 전용" }
  - { list: user_address, extra_filter: owner, reason: "장바구니 전용" }
  - { list: user_address, extra_filter: is_answered, reason: "문의 전용" }
  - { list: inquiry, extra_filter: owner, reason: "장바구니 전용" }
  - { list: inquiry, extra_filter: is_default, reason: "배송지 전용" }

