feature: langpack_active_copy_parity

description: |
  언어팩 `_bundled` 원본의 키가 **활성 사본에도 있는가** (S2-D12)

  **증상**: 일본어 사용자의 주문 이력 날짜 줄에 라벨 대신 원문 키가 떴다.

    mypage.order_detail.delivered_at      2026-09-15 14:02
    mypage.order_detail.confirmed_at      2026-09-16 09:31

  **원인**: 언어팩은 `lang-packs/_bundled/<pack>/`(원본)과 `lang-packs/<pack>/`(활성 사본)
  두 벌로 산다. **화면이 읽는 것은 활성 사본**이다. S2-D8 로 두 줄을 추가하며 ko·en
  템플릿과 ja **원본**에는 넣고 ja **활성 사본**에 넣지 않아, 고친 사람의 화면(ko)에서는
  정상이고 일본어 사용자에게만 키가 노출됐다.

  **같은 모양이 세 번 났다**:

    - S2-D11                    `languages.ja` 라벨이 원본에만
    - 계획서준수검증 결함1      구매확정 경고 ja 오역이 원본에만 수정됨
    - S2-D12                    이 건

  앞의 둘은 **그 키를 아는 사람이 그 키만** 검사하는 가드로 닫았다. 그 방식은 다음에
  추가되는 키를 지키지 못한다 — 실제로 지키지 못해 이 건이 났다. 두 번은 우연이지만
  세 번은 구조다.

  그래서 이 계약은 **키를 열거하지 않는다.** 「`_bundled` 에 있는 키는 활성 사본에도
  있다」는 구조만 잰다 — 앞으로 어떤 키가 늘어나든 한쪽만 고치면 red 가 선다.
  실측 기준 **19 패키지 · 172 파일**을 돈다.

  **값이 다른 것은 잡지 않는다.** 활성 사본은 운영자가 화면에서 번역을 덮어쓸 수 있는
  자리이고, 그 수정을 회귀로 다루면 정당한 운영 행위가 red 가 된다. 세 번 다 문제는
  **키의 부재**(원문 키 노출)였지 값의 차이가 아니었다.

  탐색 자체가 비면 전수 검사가 「위반 0」으로 조용히 통과하므로, 대상 발견을 먼저
  단언하는 축을 따로 둔다.

axes:
  langpack_copy:
    - active_parity

effects:
  # `_bundled` 의 모든 키가 활성 사본에 존재한다 — 없으면 화면에 원문 키가 노출된다
  - every_bundled_langpack_key_exists_in_the_active_copy

test_files:
