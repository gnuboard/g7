feature: 같은 환불 전이를 두 번 지시해도 한 번만 처리된다

description: |
  전이는 「현재 상태를 읽어 → 갈 수 있는지 보고 → 쓴다」 순서다. 판정을 **메모리에 들고 있는
  모델 값**으로 하면 동시에 들어온 두 요청이 **둘 다 같은 출발 상태를 보고 둘 다 가드를 통과**한다.

  쓰기는 같은 값이라 **상태·시각만 보면 1회처럼 보인다.** 그런데 전이 훅은 두 번 돈다 —
  활동로그가 두 줄 남고, 구매자에게 같은 알림이 채널마다 2통씩 간다.

  **상태가 멀쩡해 보이는 것이 이 결함을 숨긴다.** 상태·`approved_at`·옵션을 아무리 봐도
  정상이라, 알림 로그를 세어 보기 전에는 드러나지 않는다. 게다가 개발 환경은 mail/sms/alimtalk
  이 전건 skipped 라 외부 채널 중복이 눈에 띄지도 않는다 — 운영에서만 2통이 실제로 나간다.

  세션3 이 교환·반품에서 같은 형태를 찾아 고쳤고(S3-D16), 환불 `transition()` 도 **글자 그대로
  같은 형태**였다(`OrderRefundRequestService:1457` 판정이 트랜잭션 밖). 한 유형만 고치면 나머지에
  같은 중복이 남는다.

  계약: 판정을 **행 잠금 아래 재조회**로 옮긴다(`lockForUpdate` + `canTransitionTo` 재판정).
  첫 호출이 커밋한 뒤 두 번째가 잠금 아래에서 다시 읽으면 출발 상태가 이미 바뀌어 있어 거절된다.
  호출층 인스턴스도 잠금 시점 값으로 맞춘다 — 빼면 뒤따르는 훅이 낡은 값을 `previous` 로 읽어
  **활동로그 전/후 표가 실제와 어긋난다**(상태는 맞는데 기록만 틀리는 형태).

  판정 축은 **상태가 아니라 「두 번째 호출이 거절되는가」** 다 — 상태는 고쳐지기 전에도
  정상으로 보였으므로, 상태를 단언하면 red 가 서지 않는다.

axes:
  claim_type:
    - refund        # 환불 — 훅에 활동로그·알림이 걸린다
  concurrency:
    - simultaneous  # 같은 전이 2회 (더블클릭·재시도) → 두 번째 거절
    - sequential    # 정상 순차 전이 → 계속 진행 (과잉 차단 방지 대조군)

effects:
  - duplicate_refund_transition_fires_hooks_once  # 같은 전이 2회 → 전이 훅은 1회만 (활동로그 1줄·알림 1통)
  - sequential_refund_transition_still_succeeds             # 승인→보류→승인 정상 진행 · 훅의 직전 상태가 잠금 시점 값

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/OrderRefundRequestServiceTest.php
