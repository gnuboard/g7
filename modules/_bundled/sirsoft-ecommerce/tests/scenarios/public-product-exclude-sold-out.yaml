feature: 공개 상품 목록·통합검색 품절 제외 필터

description: |
  공개 상품 목록(GET products — 전체·분류 화면)과 통합검색이 exclude_sold_out=1 을 받으면 품절 상품을 뺀다.
  품절 = 판매상태 「품절」 또는 활성 옵션 재고가 모두 0. 판정 기준은 Product::scopeInStock 한 곳이다.

axes:
  surface: [public_list, search]
  exclude_sold_out: ["off", "on", invalid, request_param]

exclusions:
  - { surface: public_list, exclude_sold_out: request_param, reason: "요청 값 해석 축은 통합검색 리스너에만 있다 — 공개 목록은 요청 검증이 값을 받는다" }
  - { surface: search, exclude_sold_out: "off", reason: "필터를 끄면 검색 조건에 아무것도 더하지 않는 공용 경로다 — 기본 유지 회귀 핀은 public_list×off 가 잡는다" }

effects:
  - list_keeps_sold_out_products_by_default
  - list_excludes_status_sold_out
  - list_excludes_all_active_options_empty
  - list_excludes_only_inactive_stock
  - list_keeps_partial_stock
  - list_rejects_invalid_exclude_sold_out
  - search_excludes_sold_out_products
  - search_count_excludes_sold_out_products
  - search_listener_reads_request_param
  - search_rejects_invalid_exclude_sold_out

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Public/PublicProductListSoldOutTest.php
