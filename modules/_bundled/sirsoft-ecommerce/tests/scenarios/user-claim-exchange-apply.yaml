feature: 구매자 클레임 신청서 작성 — 주문상세 진입 + 교환 신청 (#599 S11)

description: |
  주문상세의 [교환 신청]·[반품 신청]·[취소·환불 신청] 세 버튼이 하나의 작성 셸
  (`templates/_bundled/sirsoft-basic/layouts/mypage/claims/apply.g7.html`, 라우트 `:type`)로 들어가고, 그 셸이 유형별 partial 로 화면을
  만든다. 이 세션은 교환을 관통까지 완성하고, 반품·취소·환불의 유형 고유 축(환불계좌·분기
  라벨·철회)은 S12 가 잇는다. 조용히 깨지는 지점은 일곱이다.

  ① **교환 방식을 신청서 전체의 라디오로 접으면** 상품마다 다른 교환 대상을 표현할 수 없다
     (D29). 그래서 '교환 방식' 카드는 없고, 행마다 [교환상품 변경] 버튼이 그 행의 index 를
     모달에 넘긴다. index 를 흘리면 언제나 첫 상품만 바뀌고 **오류 없이** 잘못된 신청서가
     저장된다 — 응답도 200 이고 화면도 정상으로 보인다.

  ② **미리보기는 낙관적 선택 ↔ 서버 재계산의 왕복이다.** 선택은 로컬에서 앞서 나가고 응답은
     나중에 온다. 늦게 도착한 옛 응답이 새 선택 위에 덮이면 화면이 예고한 금액과 실제 청구가
     갈리는데, 처리는 정상 성공하므로 어긋났다는 사실이 화면에도 로그에도 남지 않는다. 요청
     마다 세대 번호를 붙여 최신 요청의 응답만(성공·실패 양 경로) 반영한다.

  ③ **미리보기가 거절되면 금액을 남기지 않는다.** 미리보기는 신청과 같은 자격 가드를 타므로
     그 422 가 곧 신청 거절 사유다(§7 S5 DoD — P13). 옛 요약을 남긴 채 제출을 열어 두면 화면이
     예고한 금액과 청구가 어긋난다. 사유는 요약 자리에 남기고 제출을 잠근다 — 토스트로만
     알리면 사라진 뒤 왜 막혔는지 화면에 남지 않는다.

  ④ **청구는 2축이다 (D6).** 한 축(라디오 1그룹)으로 접으면 '승인 후 결제 + 마일리지' 조합이
     표현 불가해진다. 두 축 모두 운영자 허용 목록에서만 나오고, 화면이 리터럴 기본값을 들고
     있으면 운영자가 그 방식을 껐을 때 제출이 422 가 된다.

  ⑤ **상한·사유는 운영자 설정이 정한다.** 사유 카탈로그는 유형별로 다른 목록이고(S10 인계 ①),
     첨부 장수·용량은 `claim.max_images`·`claim.image_max_size_kb` 다(S10 인계 ③). 화면이
     리터럴을 들면 안내 문구와 실제 거절선이 갈린다. 라벨은 `localized_name` 이며 `name` 은
     다국어 맵이라 바인딩하면 객체가 그대로 찍힌다(S10 인계 ②).

  ⑥ **회원 클레임 API 는 주문 ID(정수)를 받는데 이 화면의 라우트는 주문번호를 쓴다.** 그래서
     주문 응답에서 받은 id 를 세운 뒤 `claimable-options` 를 부른다. `refetchDataSource` 는
     액션 params 의 localStateOverride 를 읽지 않고 현재 로컬 상태를 병합하므로, setState 가
     같은 sequence 의 **앞**에 있어야 한다 — 뒤에 두면 빈 URL 로 조회돼 404 가 된다.

  ⑦ **주문상세의 취소 버튼과 클레임 버튼이 함께 남으면** 같은 일을 하는 입구가 둘이 된다.
     `templates/_bundled/sirsoft-basic/layouts/partials/mypage/orders/_items.g7.html` 은 비회원 주문상세와 공유하므로 셸 표식(`useClaimActions`)으로 가른다 —
     표식이 없는 비회원 셸은 종전 취소 모달을 그대로 쓰고, S14 가 같은 표식을 세워 전환한다.

# axis 의미:
#   exchange_mode  — 교환 대상. 상품마다 정하는 속성이라 신청서 축이 아니라 상품 축이다(D29).
#                    동일상품/옵션변경이 페이로드(`new_product_option_id`)와 차액 표기를 가른다.
#   preview_result — 서버 재계산의 결과. 거절은 곧 신청 거절이므로 금액이 지워지고 제출이 잠겨야
#                    한다. 거절이 사용자의 선택(교환 대상)까지 지우면 그것도 결함이다.
#
# **유형(claim_type)은 이 매니페스트의 축이 아니다.** 이 세션이 관통까지 완성한 것은 교환이고,
# 반품·취소·환불의 유형 고유 축(환불계좌 · resolved_type 라벨 · mixed 분기 · 철회)은 S12 가 잇는다.
# 여기서 세 유형을 축으로 세우면 검증되지 않은 조합이 커버된 것처럼 보인다. 유형이 바꾸는
# 화면 규칙(청구 2축 미노출 등)은 이름 붙은 effect 가 덮는다.
#
# 청구 방식(pay_on_request / pay_on_approval / deduct_from_refund)도 축이 아니다 — 화면이 하는
# 일은 "운영자 허용 목록만 노출하고 환불이 없으면 deduct_from_refund 를 잠근다" 이며 계산 분기는
# 서버가 갖는다. 첨부 장수·수량 경계·화면 너비도 같은 이유로 이름 붙은 effect 가 덮는다.
axes:
  exchange_mode: [same, change]
  preview_result: [ok, rejected]

effects:
  # 진입 (주문상세)
  - order_detail_claim_entry_buttons_gated_by_claimable_types
  - order_detail_claim_entry_passes_checked_options
  - order_detail_old_cancel_button_removed
  - order_detail_claim_additional_paid_row_present
  # 작성 셸
