notes: |
  **반품·취소·환불은 S12 소유다.** 이 세션이 만든 공유 partial 로 이미 그려지지만, 무통장
  주문의 환불계좌 입력·`resolved_type` 에 따른 라벨 전환·즉시취소/환불신청 혼재(`mixed`)
  분기·철회 모달은 S12 가 잇는다. 그래서 유형을 이 매니페스트의 축으로 세우지 않았다 —
  검증되지 않은 조합이 커버된 것처럼 보이는 쪽이 미선언보다 나쁘다.

  **브라우저 실측의 선행 조건은 S9c 와 같다.** `playwright:seed-ecommerce` 의 주문 축이 아직
  stub 이라(계획서 이월) spec 은 그 회원의 주문 중 교환이 열린 건을 API 로 발견해 진행하고,
  한 건도 없으면 그 사실을 드러내며 건너뛴다 — 없는 데이터를 있는 척 단언하지 않는다.
  라우트 가드(잘못된 `:type`)는 주문이 없어도 성립하므로 항상 실행된다.
