  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Listeners/PurgeCashReceiptIdentifierListenerTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/CashReceiptHookFiringTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/CashReceiptCancellationSyncTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Enums/PaymentMethodCashEquivalentTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Resources/CashReceiptResourceTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/CashReceiptControllerTest.php
