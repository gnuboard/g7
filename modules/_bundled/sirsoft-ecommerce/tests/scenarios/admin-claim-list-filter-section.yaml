notes: |
  브라우저 축: S8a 는 목록 본체(서브탭·DataGrid·일괄 바)를 아직 갖지 않으므로 이 세션의
  브라우저 확인은 Chrome MCP 실측(T1~T3·T6)으로 수행하고 그 결과를 계획서 인계 로그에 남긴다.
  Playwright spec 은 목록 본체가 생기는 S8b 이후에 얹는다 — 필터가 만든 URL 로 목록이 실제로
  다시 그려지는지까지가 그 spec 의 검증 대상이고, 본체 없이 쓰면 그 절반만 검증하는 spec 이
  먼저 자리를 잡아 이후에 넓히기 어려워진다.

  상태 어휘 대조는 레이아웃과 PHP Enum 파일을 함께 읽어 집합 동일성을 단언한다. 값 목록을
  테스트에 다시 적으면 그 사본이 세 번째 출처가 되어, Enum 이 늘 때 화면과 테스트가 같이
  낡은 채로 초록이 된다.
