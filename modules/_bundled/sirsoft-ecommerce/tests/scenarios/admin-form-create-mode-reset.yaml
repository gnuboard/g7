feature: 같은 레이아웃 수정 → 등록 전환 시 등록 폼의 직전 레코드 잔존 제거 (상품·배송정책 폼)

description: |
  엔진은 layout_name 이 바뀔 때만 _local 을 비운다. 상품 수정 → 상품 등록, 배송정책 수정 →
  배송정책 등록은 같은 레이아웃이라 _local.form 이 그대로 남고, init_actions 의 기본값 setState 는
  깊은 병합이라 직전 상품의 product_code·이름, 직전 정책의 id·이름이 등록 화면에 살아남았다
  (브라우저 실측 2026-09-14, #599). 생성 모드 init_actions 첫 자리에서 form 을 null 로 비운 뒤
  기본값을 다시 쓴다(sirsoft-page admin_page_form 선례).

  상품 복사 진입(copy_id)은 copy_source 데이터소스가 폼을 채우는데, 문자열 initLocal 은 엔진이
  응답을 기존 _local.form 과 깊은 병합해 두므로(TemplateApp processInitOptions) 수정 화면에서
  넘어온 잔존이 복사 페이로드에 섞였다 — replace 맵 initLocal 로 바꿔 페이로드만 남긴다.

axes:
  form: [product, shipping_policy]

effects:
  - create_mode_clears_previous_form_before_defaults   # 생성 조건의 form: null 액션이 기본값보다 앞
  - defaults_follow_clear                              # 비운 뒤 레이아웃 기본값(state.form 상당)을 다시 씀
  - clear_precedes_country_settings_handler            # 배송정책: initShippingPolicyForm(복사 모드 country_settings 기록)보다 앞
  - copy_source_payload_not_merged_with_previous_form  # 상품 복사 진입 페이로드가 기존 form 과 병합되지 않음
  - edit_mode_untouched                                # 수정 모드 데이터소스·조건은 그대로

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminFormCreateModeReset.test.ts

validation:
  note: |
    레이아웃 JSON 구조 테스트가 액션 존재·순서·조건·데이터소스 initLocal 형식을 고정한다.
    브라우저 실측(수정 → 등록 SPA 도착 폼 = 등록 직접 진입 폼)은 코어 시나리오
    tests/scenarios/same-layout-create-form-reset.yaml 의 Playwright spec 이 담당한다.
