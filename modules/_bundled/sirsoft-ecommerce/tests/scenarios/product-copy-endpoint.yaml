feature: 상품 복사용 데이터 조회(showForCopy)

description: |
  상품 복사 화면이 부르는 복사용 데이터 조회가 복사 항목 선택(copy_options)대로 칸을 걸러 돌려주고,
  권한·없는 상품·잘못된 플래그를 막으며, 가격은 기준 통화 자릿수로 돌려준다.

  수정 이력: 이커머스 전수 실측 S5 (2026-10-07) — 기준 통화 자릿수 시험을 보탰다.

