feature: 관리자 클레임 목록 본체와 완료 처리 모달 (#599 S8b — D26)

description: |
  S8a 가 놓은 셸의 자리표시 노드 자리에 유형 서브탭 · 일괄 상태 변경 바 · DataGrid ·
  완료 처리 모달(D26)을 얹는다. 이 화면에서 조용히 깨지는 지점은 여섯이다.

  ① 일괄 상태 어휘가 유형마다 다르다(교환 11 / 반품 8 / 환불 3). 게이트
     (`BulkClaimStatusRequest::assignableStatuses()`)의 부분집합이면 운영자가 지정할 수
     있어야 할 상태가 화면에서 사라지고, 초과집합이면 그 값을 고른 순간 요청 전체가 422 가
     되면서 목록은 그대로 남아 실패가 보이지 않는다. 유형을 바꾼 뒤 앞 유형에서 고른 값이
     남아 있어도 같은 422 다 — 그래서 탭 전환이 그 선택을 비운다.

  ② 완료 전이는 곧바로 실행되면 안 된다(D26 — 자동 접수 금지). 재고 복구 여부와 환불신청서
     접수 여부를 운영자가 고르기 전에 상태가 바뀌면 그 선택 기회 자체가 사라지고, 접수된
     환불신청서는 되돌리는 절차가 따로 필요해진다.

  ③ 완료 처리 모달은 세 진입점(목록 일괄 · 신청서 내 상품 일괄 · 상세 [완료 처리])이
     파일 하나를 공유해야 한다. 모달이 특정 화면의 데이터소스를 읽으면 나머지 두 진입점에서
     그 바인딩이 비어 표가 통째로 사라지는데, 오류는 나지 않는다.

  ④ 미리보기와 실행의 페이로드 모양이 다르다. 미리보기는 신청서마다 재고 맵을 나눠 싣고,
     실행은 전 신청서의 상품 행 ID 를 `completion.restore_stock_by_item` 한 맵에 모은다.
     같은 객체를 재사용하면 서버가 체크를 읽지 못해 전건이 재고 복구 없이 폐기로 처리된다
     (복구·폐기 어느 쪽도 활동 로그에 남지 않으므로 사후에 구분할 근거가 없다).

  ⑤ 금액을 화면이 조립하면 기본 통화가 원이 아닌 상점에서 값은 맞고 단위만 틀린 금액이
     나간다. 목록 행과 완료 모달 모두 서버가 준 `*_formatted` 만 그린다 — 그 표기의 통화는
     거래 시점 스냅샷이 정하고, 합계는 대상이 한 통화로 모일 때만 낸다.

  ⑥ 선택은 화면 밖 상태에 남는다. 페이지·필터를 바꿔 목록에서 빠진 행의 선택이 살아 있으면
     일괄 처리가 운영자가 보지도 체크하지도 않은 행을 대상으로 삼는다.

# axis 의미:
#   claim_type       — 상태 어휘·일괄 바 노출·선택 가능 여부·금액 필드가 전부 여기서 갈린다.
#   completion_choice — D26 의 핵심 선택. `not_applicable` 은 완료가 아닌 전이(승인·반려 등)로,
#                       확인 모달 경로를 탄다. `file_now`/`file_later` 는 완료 처리 모달의
#                       환불신청서 라디오이며, 그 값이 실행 본문까지 도달해야 한다.
#
#   일괄 결과(성공·결제 요청 우회·건너뜀)와 재고 체크(전건·일부·없음)는 유형과 직교하지 않고
#   같은 코드 경로를 지나므로 축으로 세지 않고 effects 로 고정한다 — 축으로 곱하면 화면이
#   실제로 갈라지지 않는 조합이 수백 개 생긴다.
axes:
  claim_type: [exchange, return, refund, cancel]
  completion_choice: [file_now, file_later, not_applicable]

exclusions:
  - { claim_type: refund, completion_choice: file_now, reason: "완료 처리 모달은 교환·반품 전용이다 — 환불의 완료는 환불 실행이 옮기는 상태라 목록에서 지정할 수 없다" }
  - { claim_type: refund, completion_choice: file_later, reason: "동일" }
  - { claim_type: cancel, completion_choice: file_now, reason: "취소는 일괄 전이 대상 자체가 아니다 — 게이트의 `type` 어휘에 없다" }
  - { claim_type: cancel, completion_choice: file_later, reason: "동일" }

