notes: |
  세 진입점 중 이 세션이 소유하는 것은 목록 일괄 하나다. 나머지 둘(신청서 내 상품 일괄 ·
  상세 [완료 처리])은 상세 화면(S9)이 만들며, 그때 이 모달 partial 을 복제하지 않고
  `sirsoft-ecommerce.openClaimCompleteModal` 에 대상과 실행 경로(`execute`)를 넘겨 연다.
  모달이 `_global.claimComplete*` 계약만 읽는 것이 그 공유를 가능하게 하는 조건이고,
  구조·렌더 테스트가 그 조건을 고정한다.

  `create_refund_request=false` 경로에서 `order_refunds` 가 생기지 않는다는 축은 서비스
  계층(S3 `OrderReturnServiceTest` 완료 절)이 이미 DB 로 단언한다. 이 세션이 더하는 것은
  그 선택이 **화면에서 요청 본문까지 도달하는가** 이고, 핸들러 테스트가 그 지점을 본다 —
  둘을 한 파일에서 다시 재현하면 같은 계약이 두 벌이 된다.

  일괄 전이 **바**에는 택배사·송장 입력을 두지 않는다 — 송장은 신청서마다 다르기 때문이다. 대신
  회수중·발송중을 고르면 확인 창이 신청서마다 택배사·운송장 한 줄씩을 받는다(#599 후속 운영 결정,
  `trackings[]`). 예전에는 이 경로로 송장 없이 회수중이 되어 고객 알림의 운송장 칸이 비어 나갔다.
