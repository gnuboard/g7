# audit:allow test-scenario-coverage[cross_product] reason: |
#   축은 서로 독립인 판정 축(유형·범위·행 단위·권한·관리 동작)이라 곱집합 전부가 의미 있는 조합이 아니다.
#   각 테스트가 자기 축 값을 @scenario 로 적고, effects ↔ 테스트가 1:1 로 대응한다.
#   화면(내보내기 창·내보내기 관리)은 Vitest(핸들러)와 Playwright 사양이 같은 매니페스트의 화면 effects 를 맡는다.
feature: 이커머스 내보내기 (상품·주문·마일리지 내역 → 파일, 내보내기 관리) (#787)

description: |
  주문·상품·마일리지 목록의 [내보내기] 창에서 요청하면 큐 작업으로 CSV 를 만들고, 「이커머스 › 내보내기 관리」에서
  내려받는다. 창·진행 표시는 세 목록이 함께 쓰는 공용 조각(partials/admin_ecommerce_export)이다.

  핵심 동작:
    - 요청: 202 접수, 같은 요청자·같은 중복 방지 키는 기존 작업 반환, 요청자당 대기+진행중 3건 상한,
      기간은 시작일 포함 1년 상한.
    - 권한: 내보내기 권한 + 그 유형의 원본 조회 권한(orders.read 등), 개인정보 필드는 개인정보 권한과 사유.
      「본인/전체」 범위는 「다른 운영자의 내보내기 관리」(exports.all) 권한으로 나눈다.
    - 범위: 목록의 검색 조건을 목록 저장소와 같은 필터 경로로 적용(필터 파리티), 기준 시각 뒤 행 제외.
    - 생성: 행은 청크(500)로 순회, 하위 단위 행에서 상위 금액은 첫 행에만(합계 이중 계산 방지),
      CSV 는 BOM·CRLF·수식 무력화(숫자 열 제외), 합계는 정수 눈금으로 정확히.
    - 관리: 다운로드 이력·횟수·활동 로그, 선택 삭제는 진행중·범위 밖을 건너뜀, 실패 건 다시 요청, 보관 기간 만료 정리.
    - 다운로드: 60초·1회용 주소를 발급하고 브라우저가 그 주소를 직접 연다(파일을 메모리에 올리지 않음). 받을 때 토큰 주인의
      권한·범위를 다시 본다.
    - 선언: 「내보내기 관리」 메뉴는 이커머스 하위 맨 뒤, 정리 예약 작업(prune-exports)은 등록된 명령을 가리킨다.
    - 모델 선언(D19): 모델의 모든 컬럼은 내보내기 선언 또는 제외 사유 중 한 곳에만 있다(반자동 매핑의 잠금).
    - 생애주기: 모듈 비활성화 직전 만료 파일 정리, 제거는 「데이터 유지」여도 파일을 모두 지운다.

axes:
  type:
    - orders
    - products
    - mileage
  scope:
    - filter       # 현재 검색 조건 (목록 필터 그대로)
    - selected     # 선택한 행
    - all          # 조건 없음 (기간만)
  row_unit:
    - order_option # 주문상품 1건당 1행 (상위 금액은 첫 행에만)
  totals:
    - on
  format:
    - csv
  permission:
    - no_domain_read  # 원본 조회 권한 없음
    - personal_data   # 개인정보 권한·사유
    - self_scope      # 전체 범위 권한(all) 없음
  action:
    - bulk_delete
    - retry
    - prune
    - declaration
    - activity_log
    - settings
    - download
    - notify
    - requester_menu
  model:
    - declared            # 실제 모델 선언
    - undeclared_personal # personal 누락 선언 (고정물)

