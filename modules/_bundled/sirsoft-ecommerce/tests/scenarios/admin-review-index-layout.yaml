feature: 관리자 리뷰 관리 목록 레이아웃 (admin_ecommerce_product_review_index)

description: |
  리뷰 관리 목록 화면의 레이아웃 계약을 고정한다. 이 레이아웃 테스트는 매니페스트 없이 존재했고,
  2026-09-28 기존 레이아웃 위반 정리(DataGrid 가 읽지 않는 `loading` prop 을 엔진의 첫 로딩 블러
  `blur_until_loaded` 로 옮김)에서 테스트가 바뀌며 함께 등재한다.

