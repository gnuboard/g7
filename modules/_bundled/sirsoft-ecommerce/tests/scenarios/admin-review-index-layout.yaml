# audit:allow test-scenario-coverage[cross_product] reason: |
#   축은 이 화면의 영역 목록이고 조합마다 다른 동작이 갈리는 분기가 아니다 — 영역별 테스트가 각 효과를 잰다.

feature: 관리자 리뷰 관리 목록 레이아웃 (admin_ecommerce_product_review_index)

description: |
  리뷰 관리 목록 화면의 레이아웃 계약을 고정한다. 이 레이아웃 테스트는 매니페스트 없이 존재했고,
  2026-09-28 기존 레이아웃 위반 정리(DataGrid 가 읽지 않는 `loading` prop 을 엔진의 첫 로딩 블러
  `blur_until_loaded` 로 옮김)에서 테스트가 바뀌며 함께 등재한다.

axes:
  area: [bulk, datasource, filter, grid, header, i18n, pagination, permission, state]

effects:
  - review_admin_list_bulk_action_targets_selected_reviews
  - review_admin_list_datasource_reads_every_filter_param
  - review_admin_list_filter_controls_bind_to_query_params
  - review_admin_list_grid_binds_reviews_and_blurs_until_first_load
  - review_admin_list_header_renders_title_and_description
  - review_admin_list_pagination_follows_response_meta
  - review_admin_list_requires_read_permission_and_extends_admin_base
  - review_admin_list_selection_state_starts_empty
  - review_admin_list_translation_keys_exist_in_module_lang
  # 아래는 하네스 렌더 시험(admin_ecommerce_product_review_index.test.tsx)이 실제로 단언하는 범위만 적는다
  - review_admin_list_layout_identity_declared   # 레이아웃 이름·버전
  - review_admin_list_reviews_source_targets_admin_endpoint_and_auto_fetches   # 후기 소스 주소·자동 조회
  - review_admin_list_permissions_include_reviews_read   # 권한 목록에 후기 읽기
  - review_admin_list_initial_state_declares_selection_and_expansion_arrays   # 선택·펼침 초기 배열
  - review_admin_list_renders_markup_with_reviews_response   # 응답이 있으면 마크업이 그려짐
  - review_admin_list_header_renders_title   # 제목(설명은 보지 않음)
  - review_admin_list_test_registry_provides_datagrid   # 시험 레지스트리 전제
  - review_admin_list_empty_result_shows_translated_empty_message   # 0건이면 번역된 빈 문구
  - review_admin_list_local_state_exists_after_render   # 렌더 뒤 지역 상태
  - review_admin_list_render_has_no_slot_or_binding_warnings   # 슬롯·바인딩 경고 없음
  - review_admin_list_grid_data_reads_reviews_data_path   # 표 data 가 reviews.data 경로
  - review_admin_list_selected_reviews_state_is_writable   # 선택 목록 상태 쓰기

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminEcommerceProductReviewIndex.test.tsx
  # 같은 화면의 하네스 렌더 시험 — 소유 없이 있던 것을 빈 문구 조건(받은 뒤에만 표시) 변경 때 등재한다
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/admin_ecommerce_product_review_index.test.tsx
