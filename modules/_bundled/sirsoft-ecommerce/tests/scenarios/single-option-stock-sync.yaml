feature: 옵션 없는 상품의 재고 칸 정합

description: |
  옵션 없는 상품(has_options=false)도 기본 옵션 한 개로 재고를 차감·복원한다. 종전에는 상품 표의 재고 칸을
  맞추는 두 동기 함수가 옵션 없는 상품을 건너뛰어, 주문·취소 뒤에도 상품 재고 칸이 옛 값으로 남았다.
  이제 옵션 행이 있으면 활성 옵션 재고 합으로 맞춘다. 옵션 있는 상품의 동작은 그대로다.

axes:
  product: [without_options, with_options]
  movement: [deduct, restore]

exclusions:
  - { product: with_options, movement: restore, reason: "옵션 있는 상품의 복원은 차감과 같은 동기 함수 한 줄 — deduct 칸이 덮는다" }

effects:
  - product_stock_follows_option_stock_on_deduct
  - product_stock_follows_option_stock_on_restore
  - product_with_options_keeps_option_stock_sum

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Stock/SingleOptionStockSyncTest.php
