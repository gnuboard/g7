feature: 도서산간 추가배송비 템플릿 창의 빈 목록 표시 (#636 후속 · 2026-09-26)

description: |
  배송정책 편집의 「템플릿 불러오기」 창은 템플릿이 없거나 검색 결과가 0건이면 상자 아이콘과
  「등록된 템플릿이 없습니다」를 보인다. 아이콘에 준 `mx-auto`·`mb-3` 은 Font Awesome 의
  `display: inline-block`(레이어 밖)에 무시되어 아이콘과 인라인 문구가 한 줄에 겹쳐 붙었다.
  배치는 감싸는 줄(`flex flex-col items-center`)이 맡고 아이콘은 크기만 가진다.

  개인정보 조치 대상 명단 창(코어·이커머스·게시판·gdpr)이 이 마크업을 복사해 와 같은 결함을
  가졌다 — 그쪽 단언은 각 화면의 레이아웃 테스트가 소유한다.

# axis 의미:
#   빈 목록에 이르는 경로 — 템플릿 자체가 0개인 경우와 검색 결과가 0건인 경우. 둘 다 같은
#   `empty_state` 노드를 그리므로 레이아웃 단언 하나가 두 경로를 함께 덮는다.
axes:
  empty_reason: [no_templates, search_no_match]

exclusions:
  - { empty_reason: no_templates, reason: "템플릿 0개와 검색 0건은 같은 `empty_state` 노드·같은 조건식(`length === 0`)으로 그려진다 — 레이아웃 단언은 경로와 무관하고, 브라우저 실측은 데이터를 지우지 않도록 검색 0건 경로로 쟀다" }

effects:
  - empty_state_stacks_icon_above_message

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/extraFeeTemplateEmptyState.test.ts
