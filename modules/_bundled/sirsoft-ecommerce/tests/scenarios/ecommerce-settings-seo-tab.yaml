feature: 이커머스 환경설정 SEO 탭 레이아웃 계약

description: |
  관리자 이커머스 환경설정 「SEO」 탭(`resources/layouts/admin/partials/admin_ecommerce_settings/_tab_seo.json`)의 구조·폼 바인딩
  (`seo.*`)·다국어 키를 잠근다. 1.3.4 부터 상품·분류·검색 제목 틀의 입력 예시(placeholder)는 쇼핑몰명을 넣지 않는다 —
  코어 7.1.5 의 제목 규칙이 사이트 이름을 「타이틀 접미사」로 붙이고, 같은 규칙이 방문자 브라우저 탭 제목에도 쓰인다.

  축 `case` 는 시험 하나하나다(레이아웃 정적 계약이라 조합 축이 없다).

