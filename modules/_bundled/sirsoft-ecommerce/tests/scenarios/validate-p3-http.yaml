# audit:allow test-scenario-coverage[cross_product] reason: |
#   결함 목록이다 — 축 값 하나가 결함 하나이고 결함끼리는 조합이 없다(권한 스코프 결함과 요청 빈도
#   결함을 곱할 이유가 없다). 설정 저장 축(save_path × payload × target_key)은 경로마다 의미 있는
#   조합만 있다(서비스 경로에는 단건 키가 없다). effects 축은 면제하지 않는다.
# 시나리오 매니페스트 — HTTP·권한·보안 결함 수정 (#599 validate P3)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"
feature: validate_p3_http

description: |
  브랜치 전체 검증이 이커머스 HTTP 계층(컨트롤러·요청·리소스·라우트·권한 선언)에서 찾은 결함을
  닫는다. 권한·노출 결함은 모두 **정상 응답 코드로 새어 나가는** 종류라 항목마다 실패하는 테스트를
  먼저 세웠다.

  핵심 동작:
    - 클레임 권한의 스코프 축은 주문의 것을 물려받는다(`order` · `user_id`). 목록·건수는 저장소가,
      `{claimType}/{id}`·번호 경로는 스코프 가드가, `orders/{order}/…` 는 미들웨어가 같은 판정을 한다.
    - 비회원 클레임 라우트는 guest 역할의 `user-claims.*` 권한을 판정한다.
    - 비회원 경로의 요청 빈도 상한은 이름 있는 리미터라 블록·업로드·조회 인증 카운터가 갈린다.
    - 공개 면은 PG 원문을 싣지 않고, 관리자 면 500 에는 원인 요약이 실린다.
    - 관리자 [주문취소] 응답 문구가 신청서 접수와 실제 취소를 가른다.
    - [환불하기] 수단 게이트가 [금액 수정]과 같은 강도다 — 카드 주문의 계좌 수동 환불을 받되 계좌를 요구한다.
    - 계좌로 돈이 돌아가는 주문은 반품·교환(차액이 있을 때) 신청에서도 계좌를 받는다.
    - 신청 화면의 등록 계좌는 가린 모양으로 나가고, 손대지 않은 제출은 서버가 원문으로 되돌린다.
    - 환불 계좌 원문은 주문 관리 또는 클레임 관리 권한 보유자가 본다.
    - 설정 저장 조립은 서비스에 있고, 결정 이력(`_decided`)은 서버만 쓰며, 규칙 없는 키는 422 다.

