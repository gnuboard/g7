notes: |
  E2E: 저장 배선과 서버 검증은 PHPUnit(실제 HTTP 요청, 선언 동기화, DB)이, 전역 값 동기화는 Vitest(구독 핸들러)가 잰다.
  화면에서의 동작(가입 화면의 두 칸, 관리자 회원 폼과 상세의 「확장 항목」 구획, 내 정보에서 통화를 바꾼 직후
  새로고침 없이 가격 표시가 바뀜)은 코어 템플릿 쪽 변경과 함께 브라우저 실측으로 확인한다.
