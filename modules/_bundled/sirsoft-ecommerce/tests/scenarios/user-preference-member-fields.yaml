feature: 회원 결제 통화와 배송국가의 회원 항목 편입

description: |
  회원의 결제 통화와 배송국가를 회원 항목 집합(core.user)의 항목으로 선언하고 값은 종전 테이블
  (ecommerce_user_profiles)에 핸들러로 잇는다. 가입, 관리자 수정, 내 정보 수정이 같은 규칙과 같은 저장 경로를 쓴다.
  관리자 회원 추가는 종전처럼 받지 않고 기본값 지정 리스너가 정한다. 요청 키는 수정 경로의 키
  (ecommerce_preferred_currency, ecommerce_preferred_shipping_country)로 통일하고 가입 요청의 옛 키
  (preferred_currency, preferred_shipping_country)는 옛 키로 받는다. 선택지는 사이트 설정에 따라 달라져 요청 시점에 채운다.
  이커머스 리스너는 검증과 저장 훅을 더는 구독하지 않아 같은 칸을 두 번 검증하거나 두 번 저장하지 않는다.
  내 정보에서 값을 바꾼 뒤 화면 전역 값을 맞추는 일은 사용자 템플릿이 아니라 이커머스의 구독 핸들러가 한다.

