feature: 클레임 요청의 형식이 틀린 입력 — 서버 오류(500)가 아니라 입력 오류(422)로 돌려준다

description: |
  규칙 계산(`rules()`)은 검증보다 먼저 돌고, 사후 검증(`withValidator()` 의 `after`)은 규칙이 실패해도 돈다.
  그 안에서 입력을 `(string)` 으로 바꾸면 문자열 칸에 목록이 온 요청에서 「Array to string conversion」 으로
  500 이 난다 — 규칙이 이미 422 로 막으려던 요청이다.

  배경:
    - 16차 병합 후속 브라우저 실측에서 관리자 클레임 일괄 상태 변경이 목록 형태의 목표 상태에 500 을 돌려줬다.
      같은 형 변환을 가진 클레임 요청을 전수로 돌려 관리자 직권 접수 미리보기·일괄 상태 변경·완료 미리보기·
      클레임 목록(관리자·마이페이지)·환경설정 저장(배송사 코드)에서 같은 500 을 찾았다.

  핵심 동작:
    - 규칙 계산·사후 검증은 문자열이 아닌 입력을 형 변환하지 않고 건너뛴다(빈 값으로 읽는다). 그 칸의 형식 오류는
      규칙이 422 로 돌려준다.

axes:
  input: [list_in_string_field]

effects:
  - malformed_claim_input_returns_validation_error_not_server_error

test_files:
