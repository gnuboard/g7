feature: 관리자 주문 상세 › 주문 취소 창 — 레이아웃 구조 계약

description: |
  주문 취소 창 조각(_modal_cancel_order)의 구획별 구조를 레이아웃 JSON 판독으로 잠근다 — 기본 구조, 취소 사유
  선택칸(환불 사유 설정을 펼친 목록형 드롭다운), 기타 사유 입력, 환불 우선순위, 환불 예정 금액 비교표, 복원 쿠폰,
  배송비 표시, 검증 오류 표시, 실행 단추, 다통화 표기.
  축 section 은 창의 구획이다. 효과는 그 구획의 구조 계약이 지켜지는 것 하나씩이다.

axes:
