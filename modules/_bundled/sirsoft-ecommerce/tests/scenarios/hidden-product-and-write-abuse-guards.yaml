feature: 숨김 상품 노출·쓰기 API 남용 막기

description: |
  - 숨김·삭제 상품은 상세·관련 상품만이 아니라 그 아래 공개 API(후기 목록·문의 목록·문의 작성·받을 수 있는 쿠폰)도 404.
    판정은 EnsuresPublicProduct 한 곳.
  - 찜 토글은 전시 중이고 삭제되지 않은 상품만 새로 받는다. 숨기기 전에 찜해 둔 상품의 해제는 허용.
  - 회원 쓰기 API 요청 제한: 쿠폰 받기(단건·일괄 공유)·찜(토글·삭제 공유)·상품 문의 작성·상품 후기 작성.
  - 관리자 직접 발급의 건너뜀 사유를 코드(reason)와 문구(message)로 나눠 준다.

axes:
  guard: [hidden_product_subresource, wishlist_visibility, write_rate_limit, direct_issue_reason_code]
  actor: [guest, member, admin]

exclusions:
  - { guard: hidden_product_subresource, actor: admin, reason: "관리자 화면은 공개 하위 API 를 거치지 않는다 — 숨김 판정(EnsuresPublicProduct)은 공개 끝점의 방어선이다" }
  - { guard: [wishlist_visibility, write_rate_limit], actor: [guest, admin], reason: "찜·회원 쓰기 API 는 회원 인증 라우트다 — 비회원은 인증 단계에서 막히고 관리자 주체 경로가 없다" }
  - { guard: direct_issue_reason_code, actor: [guest, member], reason: "직접 발급은 관리자 API 다" }

effects:
  - hidden_product_subresources_return_404
  - visible_product_subresources_still_open
  - hidden_product_inquiry_write_returns_404
  - hidden_product_new_wishlist_rejected
  - hidden_product_existing_wishlist_can_be_removed
  - visible_product_wishlist_still_works
  - coupon_download_is_rate_limited_and_shared
  - wishlist_write_is_rate_limited
  - inquiry_write_is_rate_limited
  - review_write_is_rate_limited
  - direct_issue_skip_carries_reason_code_and_message

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Public/PublicProductHiddenSubresourceTest.php
