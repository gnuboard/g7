feature: 쇼핑몰 화면 공개 API 의 알 수 없는 실패 원인 기록

description: |
  쇼핑몰 화면이 부르는 공개 API(상품 목록·상세·인기·신상품·최근 본·관련 상품, 장바구니 키 발급·조회·개수,
  분류 목록·상세, 분류 이미지, 쇼핑몰 설정 4종, 상품 문의 목록·작성, 상품 후기 목록, 내려받을 쿠폰, 찜 토글·목록·삭제)는
  알려진 도메인 사유를 각자 안내하고, 그 밖의 예외는 광역 catch 에서 종전과 같은 응답(대부분 500, 분류 이미지는 400)을 낸다.
  이 광역 catch 들이 아무것도 기록하지 않아, 상품 목록 API 가 실제 DB 오류(FULLTEXT 오류 191)로 500 을 낼 때
  로그에 흔적이 남지 않았다. 이제 같은 응답을 내면서 원인(예외 종류·메시지·위치, 관련 ID)을 오류 로그로 남긴다.

  확인 방법: 브라우저에서 알 수 없는 예외를 일으킬 수 없어 장애 주입 테스트로 잰다 — 컨트롤러가 받는 서비스의 한 메서드만
  예외를 던지는 목으로 바꾸고(컨트롤러 바인딩에만 주입), 응답 상태·본문이 종전과 같고 오류 로그가 남는지 단언한다.
  각 controller 조합은 그 컨트롤러의 바뀐 광역 catch 전부를 데이터 공급자로 돈다.

axes:
  controller: [product, cart, category, category_image, settings, inquiry, review, coupon, wishlist]
  failure: [unexpected_exception]

effects:
  - unexpected_failure_logged_with_cause   # '<엔드포인트>.<동작> failed' {exception, message, file(파일:줄)} 오류 로그 1회
  - response_status_and_body_unchanged     # 종전 상태코드 + {success:false, message} 본문 그대로

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/Public/PublicApiUnexpectedFailureLogTest.php

validation:
  browser_check: 해당 없음 — 장애 주입은 테스트로만
