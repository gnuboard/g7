feature: 편집기 일괄 변경 확인 창 표본

description: |
  레이아웃 편집기에서 상품 일괄 변경 확인 창이 표본으로 채워져 열리는지
  
  편집기에서 「일괄 변경 확인」(상품 관리) 창을 열면 「변경될 상품 (1개)」 아래 목록이 비고, 「변경될 옵션 (3개)」 는
  「>」 만, 실패 칸에는 「샘플 값」 이 보였다. 뒤 화면 버튼도 「판매가 변경 (샘플 값)」 이었다(이커머스 전수 실측 S5,
  2026-10-07). 같은 창 id(`modal_bulk_confirm`)를 주문 목록 일괄 확인 창도 써서 자동 표본이 두 창의 키를 섞어
  만들었고, 상품 창이 읽는 꼴(`products[].name`·`options[].productName`)이 아니라 「샘플 값」 글자 배열이 들어 있었다.
  
  표본은 두 창을 모두 채워야 한다 — 상품 창: 상품·옵션 객체, 옵션 수 합계 = 머리글 개수, 판매가·재고 조건 표시 문자열,
  기본 상태의 실패 목록은 비어 있음(실패 칸은 실패가 있을 때만 보인다). 주문 창: 주문 상태·택배사·송장 번호.

  수정 이력: 이커머스 전수 실측 S5-D23 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06]
  # c01: 표본 항목이 있다
  # c02: %s — 「샘플 값」 자리 채움 글자가 없다
  # c03: %s — 상품 창이 읽는 상품·옵션 객체를 갖는다
  # c04: %s — 주문 창이 읽는 주문 상태·택배사·송장 번호를 갖는다
  # c05: 기본 상태는 실패 목록이 비어 있고, 실패 칸은 대안 상태가 채운다
  # c06: 판매가·재고 조건은 화면이 버튼에 덧붙이는 표시 문자열이다

effects:
  - bulk_confirm_sample_renders

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/editorBulkConfirmSample.test.ts
