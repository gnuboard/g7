feature: 쿠폰 혜택 문구의 할인율 표기

description: |
  쿠폰 할인값 칸이 소수 둘째 자리 형변환이라 정률 쿠폰 문구가 「10.00% 할인」으로 나왔다.
  서버가 만드는 혜택 문구(benefit_formatted, 통화별 문구)에서 소수 끝 0 과 점을 떼어 「10% 할인」으로 맞춘다.

axes:
  surface: [decimal_trim, benefit_formatted, multi_currency_benefit]
  value: [boundary, rate, fixed]

exclusions:
  - { surface: decimal_trim, value: [rate, fixed], reason: "다듬기 함수는 숫자 문자열만 받는다 — 쿠폰 할인 종류(정률·정액)가 없는 표면이라 경계값 하나로 잰다" }
  - { surface: [benefit_formatted, multi_currency_benefit], value: boundary, reason: "문구 표면의 입력은 쿠폰 할인 종류다 — 소수 경계값은 다듬기 함수(decimal_trim)가 잰다" }
  - { surface: multi_currency_benefit, value: fixed, reason: "정액 문구는 이 변경이 손대지 않은 통화별 금액 서식 경로다 — 무변경 회귀 핀은 benefit_formatted×fixed 가 잡는다" }

effects:
  - trailing_zero_and_dot_removed
  - rate_benefit_has_no_trailing_zero
  - multi_currency_rate_benefit_has_no_trailing_zero
  - fixed_benefit_unchanged

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Models/CouponBenefitFormattedTest.php
