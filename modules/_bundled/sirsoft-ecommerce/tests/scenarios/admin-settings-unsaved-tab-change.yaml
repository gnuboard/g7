feature: 쇼핑몰 환경설정 — 저장하지 않은 변경이 있을 때 탭 이동 전 확인 창

description: |
  관리자 › 쇼핑몰 환경설정에서 값을 고친 뒤 저장하지 않고 다른 탭을 누르면, 탭 전환이 같은 화면으로의
  `navigate(replace)` 라 설정 소스(`refetchOnMount` + `initLocal`)가 다시 받아 폼을 덮어 입력이 경고 없이
  사라졌다(S5-D41, 출시본 동일). 레이아웃 주석은 「탭을 옮겨도 다시 부르지 않는다」였지만 실제와 달랐다.

  제품 결정 (a): 변경이 있으면 탭을 옮기기 전에 확인 창 「저장하지 않은 변경이 있습니다 — 이동하면 사라집니다」
  [머무르기]/[이동]. 변경이 없으면 종전대로 바로 옮긴다. [이동] 은 창이 자기 지역 상태를 따로 가지므로
  `$parent._local` 에 탭 줄과 같은 정리(인라인 추가 폼 플래그·버퍼·오류 + 변경 표시)를 하고 옮긴다 — 두
  정리 목록이 어긋나면 S10 17차(열어 둔 인라인 폼 플래그가 남아 어느 탭에서도 저장이 막힘)가 창 경로로만
  되살아나므로 키 일치를 단언한다.

  수정 이력: 이커머스 1.3.0 전수 실측 S5-D41 → 제품 결정 (2026-10-08), 후속 B 세션 B2.

axes:
  case: [no_changes, changes_pending, confirm_leave, confirm_stay]

effects:
  - settings_tab_change_without_changes_moves_immediately
  - settings_tab_change_with_changes_opens_confirm
  - settings_tab_change_with_changes_keeps_tab_and_values
  - settings_tab_change_confirm_leave_moves_to_pending_tab
  - settings_tab_change_confirm_stay_keeps_everything

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminEcommerceSettingsUnsavedTabChange.test.tsx

validation:
  browser_check: 쇼핑몰 환경설정 기본정보 탭에서 상점명을 고친 채 [주문설정] 탭 → 확인 창, [머무르기] 면 기본정보 탭·고친 값 유지, 다시 눌러 [이동] 이면 주문설정 탭으로 가고 기본정보 값은 저장값으로 돌아감. 변경 없이 탭을 누르면 창 없이 이동
