  - new_ui_has_no_tailwind_breakpoint             # md:/lg: 로 마크업 구조 분기 금지
  - portable_override_applies_below_1024_on_render  # 실렌더: 세로 스택 전환 (F5)
  - portable_override_absent_at_1024_on_render      # 실렌더: 1024px 부터 base 복귀

  # 데이터 위생 (감사 지적 C8, 프로젝트 결정 2026-07-10)
  - cash_receipt_request_not_persisted_for_non_dbank  # 발급 불가 주문에 암호문 미보관

  # 자진발급 설정 안내 (감사 지적 W-5)
  - self_issue_links_to_nts_mandatory_industry_guide  # 의무발행 업종 판단 경로 제공

  # 부수 복구
