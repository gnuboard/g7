feature: 마일리지 기한 연장 선택 초기화

description: |
  마일리지 내역 「유효기간 연장」 성공 뒤 표의 선택이 풀리는지 회귀
  
  연장이 성공하면 창은 닫히고 목록은 새로 받지만, 표에서 체크한 적립건(`_local.selectedItems`)은
  그대로 남았다 — 체크가 켜진 채 [유효기간 연장] 이 다시 눌리는 상태라, 한 번 더 누르면 같은 적립건이
  또 연장된다(2026-10-07 실측: 적립건 3건 30일 연장 뒤 세 행 체크·버튼 활성 유지). 창의 성공 갈래가
  창 바깥(목록 화면)의 선택을 `$parent._local` 로 비우는지 확인한다.

  수정 이력: 이커머스 전수 실측 S5 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05]
  # c01: 연장 요청 액션이 하나 있다
  # c02: 성공 갈래가 목록 화면의 선택(selectedItems)을 비운다
  # c03: 선택 해제는 창을 닫기 전에 한다(닫힌 뒤에는 $parent 문맥이 없어 쓰기가 버려진다)
  # c04: 실패 갈래는 선택을 건드리지 않는다(창 유지, 고쳐서 다시 시도)

effects:
  - mileage_extend_selection_reset

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/mileageExtendSelectionReset.test.ts
