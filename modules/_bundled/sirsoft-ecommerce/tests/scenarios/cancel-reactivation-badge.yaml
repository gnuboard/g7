  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/CancelReactivationRecorderTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Admin/ManualPaidReactivationRestorationTest.php
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminClaimListBody.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminClaimListBodyRender.test.tsx
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminClaimDetailRender.test.tsx
