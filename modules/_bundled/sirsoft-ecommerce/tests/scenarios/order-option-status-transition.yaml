  - manual_deposit_confirm_syncs_option_status_via_complete_payment  # B2 위임
  - manual_deposit_confirm_rejects_amount_mismatch_422               # B2 정확일치
  - manual_deposit_confirm_accepts_payment_currency_amount           # 소수 결제 통화(USD) 주문은 창이 안내한 결제 통화 금액($17.06)으로 결제완료된다 — 입금액을 최소 화폐단위로 바꿔 비교
  - manual_deposit_record_keeps_payment_currency_amount              # 「기록만」 경로도 결제 통화 입금액을 센트까지 남긴다 (정수 절사 금지)
  - manual_deposit_mismatch_reports_due_and_received_in_payment_currency # 불일치 진단 문구는 결제 통화로 예상 = 결제예정금액, 실제 = 입금액
  - manual_deposit_confirm_rejects_non_dbank_order_422                # 무통장이 아닌 주문의 입금확인은 422 로 거절
  - manual_deposit_confirm_requires_orders_update_permission         # 주문 수정 권한이 없으면 입금확인은 403
  - manual_deposit_confirm_records_depositor_name                    # B2 입금자명 기록
  - deposit_button_visible_by_payment_status_not_order_status        # 입금확인 버튼 노출 = payment.payment_status(ready/waiting_deposit) 기준 (order_status 무관)
  - create_order_payment_populates_started_at_buyer_vat_name_device  # 주문 생성 시 결제요청일시·구매자·부가세·결제명·디바이스 기록 (PG 콜백 없는 수단 포함)
  - dbank_account_info_summarizes_bank_account                       # getAccountInfo dbank 분기 (계좌 요약 표시)
  - manual_deposit_records_payment_only_without_order_transition     # markOrderComplete=false: 입금(payment)만 기록, 주문 상태 전이 없음
  - manual_deposit_reconciles_payment_only_for_already_completed_order # order_status=결제완료/payment=미입금 불일치: payment 만 정합화(부수효과 미재실행)
  - manual_deposit_reconciles_order_totals_when_payment_already_paid # S2-D4: payment=PAID/주문 결제금액 0 불일치를 결제완료 일괄 전이가 정합화
  # 2026-09-17 실측 주문 1496: 결제대기 → 상품준비중처럼 결제완료를 건너뛰는 일괄 전이도 같은 정합화를 탄다
  - manual_deposit_reconciles_order_totals_when_bulk_status_skips_payment_complete
  - manual_deposit_rejects_when_payment_already_paid                 # payment 가 이미 PAID 면 입금확인 거부(422) / 서비스는 멱등
  # 2026-10-03 실측: 상태를 먼저 상품준비중까지 올린 뒤 입금을 「기록만」 하면 주문 결제금액이 0 으로 남아 환불 예정액 0원
  - manual_deposit_fills_order_paid_amount_when_status_already_past_payment
  - manual_deposit_recorded_hook_carries_before_snapshot # 입금 기록 훅이 기록 전 주문 스냅샷을 세 번째 인자로 넘긴다
  - manual_deposit_does_not_regress_order_already_past_payment       # 「결제완료로 처리」 체크여도 상품준비중 이후 주문은 되돌리지 않음
  - zero_amount_order_syncs_option_status_on_create
  - admin_status_update_syncs_option_status_excluding_cancelled
  - cancelled_option_not_revived_by_sync                             # syncExcludedValues
