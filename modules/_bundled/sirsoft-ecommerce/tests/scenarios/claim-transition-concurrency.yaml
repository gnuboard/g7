feature: claim_transition_concurrency

description: |
  같은 전이를 **동시에 두 번** 받아도 한 번만 처리한다. (더블클릭 · 재시도 · 중복 제출)

  신청서 전이는 「현재 상태를 읽어 → 갈 수 있는지 보고 → 쓴다」 순서다. 이 판정을 **메모리에
  들고 있는 모델 값**으로 하면, 동시에 들어온 두 요청이 **둘 다 같은 출발 상태를 보고 둘 다
  가드를 통과**한다. 쓰기는 같은 값이라 **상태만 보면 1회처럼 보이지만**, 전이 훅은 두 번 돌아
  **알림이 채널마다 2통씩** 나간다 — 구매자에게 같은 메일·SMS 가 두 번 도착한다.

  상태가 멀쩡해 보이는 것이 이 결함을 숨긴다. `return_status` 도 `approved_at` 도 단일값이고
  주문 옵션 상태도 정상이라, **알림 로그를 세어 보기 전에는 드러나지 않는다.**

  핵심 계약:
    - 판정은 **행 잠금 아래에서 다시 읽은 값**으로 한다(`lockForUpdate`). 잠금을 늦게 잡은 쪽은
      앞선 전이가 커밋된 뒤의 상태를 보므로 `canTransitionTo` 에서 정상적으로 거절된다.
    - 호출층이 들고 있는 인스턴스도 잠금 시점 값으로 맞춘다 — 뒤따르는 훅이 낡은 값을 읽지 않게.
    - 교환·반품이 **같은 형태**를 쓴다. 한쪽만 고치면 다른 쪽에 같은 중복이 남는다.

axes:
  claim_type: [exchange, return]
  concurrency: [sequential, simultaneous]

effects:
  # ── 멱등 (P0) ──
  # 동시 2회에도 전이는 1회 · 알림도 1세트다.
  - duplicate_transition_is_rejected_under_row_lock
  # ── 단일 경로 보존 (P0) ──
  # 잠금을 넣었다고 정상 순차 전이가 막히면 안 된다.
  - sequential_transition_still_succeeds

test_files:
  # 교환·반품 전이의 동시성 멱등 (행 잠금 아래 재판정)
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Services/ClaimTransitionConcurrencyTest.php
