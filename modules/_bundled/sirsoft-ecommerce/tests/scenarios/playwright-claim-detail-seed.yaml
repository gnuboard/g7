feature: E2E·실측용 관리자 클레임 상세 신청서 시드 — 옵션 변경 교환·1건 승인 반품·계좌 빈 승인 환불을 워커별 tag 로 세우고 지우기 (#757)

description: |
  `playwright:seed-claim-detail` 은 관리자 클레임 상세 spec(`admin-claim-detail.spec.ts`)의 세 시험이 끝까지 잴 신청서를
  세운다. 운영 데이터에 그 모양이 없으면 그 시험들은 건너뛰어 통과로 세어졌다(#757 M1 실측 skip 3).

  - 옵션 변경 교환(수량 2, 상위 옵션) — 교환 전후 소계가 단가와 갈리는 것은 수량 2 이상, 차액 줄은 차액 ≠ 0 에서만 드러난다.
  - 상품 1건짜리 승인 반품(송장 없음) — 상품 칸 선택지에 회수중이 서고, 송장 미리 채움이 빈 값으로 선다.
  - 계좌가 빈 승인 환불신청서(입금된 가상계좌 주문, 저장 현금 > 0) — 계좌 환불이면 현금이 있을 때 계좌를 요구한다.

  주문은 실제 계산 경로(`OrderCalculationService`)로 만든다 — 상세 응답의 정산 미리보기가 주문을 다시 계산하므로 금액을 손으로
  박으면 재계산과 어긋난다. 신청서는 팩토리·모델 생성으로 목표 상태에 바로 세운다 — 접수·전이 서비스는 라이브 사이트에 알림을
  보내고 정리로 되돌릴 수 없다.

  축 op 는 시드·같은 tag 재시드·정리. 축 tag 는 호출자가 준 꼬리표의 상태 — 형식에 맞음(valid)·없거나 형식 위반(invalid)·
  생략(omitted, 정리에서만 뜻이 있다 — 전량). `fullyParallel` 워커마다 다른 tag 를 써야 한 워커의 재시드·정리가 다른 워커의
  신청서를 지우지 않는다.

axes:
  op: [seed, reseed, teardown]
  tag: [valid, invalid, omitted]

exclusions:
  - { op: seed, tag: omitted, reason: "시드에서 tag 생략은 invalid 칸의 시험(test_seed_without_a_valid_tag_fails_without_side_effects)이 함께 확인한다 — 같은 거절 경로" }
  - { op: reseed, tag: invalid, reason: "재시드는 앞선 시드가 있다는 전제라 유효 tag 에서만 성립한다 — 형식 거절은 seed×invalid 가 대표" }
  - { op: reseed, tag: omitted, reason: "재시드는 앞선 시드가 있다는 전제라 유효 tag 에서만 성립한다 — tag 없는 시드는 거절된다" }
  - { op: teardown, tag: invalid, reason: "tag 형식 검사는 시드·정리 분기 앞의 같은 자리에서 한 번 한다 — seed×invalid 가 대표" }

effects:
  - seeds_option_change_exchange_with_quantity_two
  - seeds_collectable_single_item_return
  - seeds_approved_refund_without_account
  - reseed_same_tag_replaces_previous_set
  - teardown_by_tag_keeps_other_tags
  - teardown_without_tag_sweeps_every_seed_only
  - seed_without_valid_tag_fails_without_side_effects

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Console/PlaywrightSeedClaimDetailCommandTest.php
