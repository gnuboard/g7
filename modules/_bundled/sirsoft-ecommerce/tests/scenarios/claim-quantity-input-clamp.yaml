  # 단위 — state 클램프 + (활성 입력이 있을 때의) 칸 동기화
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/handlers/claimApplyHandlers.test.ts
  # 브라우저 — 리액트가 DOM 값을 되돌리는 것이 본질이라 jsdom 으로는 재현되지 않는다
  - modules/_bundled/sirsoft-ecommerce/tests/Playwright/specs/shop/claim-quantity-input-clamp.spec.ts
