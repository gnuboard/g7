# 시나리오 매니페스트 — 창을 닫는 성공 갈래는 창 상태를 다시 받기보다 먼저 비운다
# 참조: docs/frontend/modal-usage.md 「편집 모달의 form 데이터 — _global namespace 패턴」(저장 onSuccess — 명시적 정리)

feature: admin_modal_success_clear_before_refetch

description: >-
  주문서 항목 추가·수정·삭제 창, 본인인증 정책 창, 마일리지 수정·만료 연장·수동 지급 창, 쿠폰 직접 발급 창의 성공 갈래가
  「창 닫기 → 목록 다시 받기 → 창 상태 비우기」 순서라, 다시 받는 동안 다시 연 창의 상태(입력값·고른 회원)가 늦은 비우기에
  지워졌다. 비우기를 창 닫기 바로 뒤로 옮긴다.

test_files:
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminModalSuccessClearBeforeRefetch.test.ts

axes:
  surface:
    - admin_modal   # 위 관리자 창 8개
  close_path:
    - success   # 저장·삭제·발급 성공(과 주문서 항목 삭제 409 충돌)으로 닫힘

effects:
  - admin_modal_state_cleared_before_refetch   # closeModal → refetchDataSource 뒤에 창 상태를 비우는 액션 목록이 이커머스 레이아웃 전체에 없다
  - admin_modal_success_carries_new_fields_version   # 주문서 항목 창 성공 갈래는 다시 받기 전에 응답의 새 정의 버전을 표 데이터 소스에 싣는다

validation:
  audit_rule: frontend-change-requires-e2e
  browser_check: — 저장·발급 직후 같은 창을 다시 열어 창 상태가 유지되는지
  note: |
    수정 전 red(2026-11-18, HEAD JSON 대조): 위반 12건(창 8개). 수정 후 green 2 / 2.
