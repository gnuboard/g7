feature: 배송 계산 API 요청 필드 정리 업그레이드 (1.3.0)

description: |
  1.3.0 이전 설치본의 api_request_fields 에 남은 전송 후보 밖 값(order_amount·weight·zipcode 등) 때문에
  조회한 그대로 다시 저장해도 422 가 되던 정책을 NormalizeShippingApiRequestFields 가 푼다.
  후보 밖 값만 지우고 후보 안 값·이미 정상인 행·null·비배열 값은 그대로 두며 재실행해도 결과가 같다.
  백필에 복제한 후보 목록은 ShippingApiRequestField Enum 과 같아야 한다.

axes:
  case: [mixed_fields, all_allowed, already_clean, rerun, all_out_of_candidates, non_array_value, enum_ssot]

effects:
  - out_of_candidate_fields_removed
  - allowed_fields_preserved
  - clean_rows_untouched
  - cleanup_idempotent
  - all_invalid_list_becomes_empty
  - null_and_non_array_untouched
  - candidate_list_matches_enum_ssot

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/Upgrades/NormalizeShippingApiRequestFieldsTest.php
