  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Privacy/OrderRetentionHandlerTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Privacy/OrderPrivacyRetentionSettingsTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Privacy/OrderRetentionClaimRecordsTest.php
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Privacy/OrderPrivacyRetentionServiceTest.php
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/admin-ecommerce-privacy-retention-settings.test.ts
  - modules/_bundled/sirsoft-ecommerce/resources/js/__tests__/layouts/adminEcommerceSettingsSavePerTab.test.tsx
  - modules/_bundled/sirsoft-ecommerce/tests/Playwright/specs/admin/ecommerce-settings-privacy-retention.spec.ts

rules_layer_coverage:
  - rule: offset-chunk-mutates-filter
    coverage: |
      대상 순회는 `chunkById` 다 — 익명화는 표지가 찍히며, 삭제는 행이 사라지며 조건에서 빠지므로
      OFFSET 순회는 커서가 밀려 건을 건너뛴다.
  - rule: console-confirm
    coverage: 핸들러는 코어 무인 커맨드(`privacy:process-retention`)가 실행한다 — 안전장치는 설정 토글·5년 하한·보유기간이다.
