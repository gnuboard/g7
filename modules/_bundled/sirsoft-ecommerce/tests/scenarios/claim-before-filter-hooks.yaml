  - non_array_filter_result_keeps_the_original_payload
  - refund_request_before_hook_blocks_the_intake_before_any_write
  - refund_request_filter_changes_the_detail_but_not_the_intake_channel
  - exchange_update_before_hook_blocks_the_edit
  - return_update_filter_changes_the_detail_but_not_the_refund_account
  - refund_update_filter_changes_the_detail
  - return_status_before_hook_blocks_the_transition
  - exchange_status_filter_changes_the_reject_reason_but_not_the_processor
  - refund_status_filter_changes_the_reject_reason
  - bulk_transition_skips_only_the_claim_an_extension_blocked
  - tracking_driven_transition_passes_the_before_hook
  - withdraw_before_hook_blocks_the_withdrawal
  - option_status_before_hook_blocks_every_item_write
  - option_rejection_reason_passes_the_status_filter
  - header_sync_before_hook_rolls_back_the_item_transition
  - return_complete_before_hook_blocks_completion_and_restock
  - exchange_complete_filter_changes_the_restock_choice
  - refund_complete_before_hook_blocks_the_execution
  # 상품 행 송장 · 진행 방식 (#599 후속 §3-7)
  - tracking_update_before_hook_blocks_the_write
  - tracking_update_filter_changes_only_the_tracking_pair
  - exchange_mode_before_hook_blocks_the_change

