feature: 편집기 표본 값 꼴

description: |
  레이아웃 편집기 표본이 금액·일시·주소·오류 자리에 자동 채움 글자 「샘플 값」 을 넣지 않는지
  
  편집기 표본 일부가 자동 생성되며 자리의 꼴과 관계없이 「샘플 값」 으로 채워져, 화면에 그대로 드러났다
  (이커머스 전수 실측 S5, 2026-10-07):
  - 마일리지 적립건 수정 창 — 금액 「샘플 값 KRW」, 적립일 「샘플 값」, 기본 상태인데 사유·만료일 칸에 검증 오류
  - 현금영수증 발급 창 — 식별번호 칸 「샘플 값」, 기본 상태인데 빨간 오류 「샘플 값」
  - 배송정책 기본 지정·삭제 창 — 정책 이름 「샘플 값」
  - 상품 관리 — [판매가 변경 (샘플 값)]·[재고 일괄 변경 (샘플 값)] 버튼
  - 브랜드·분류·공통정보·고시 화면 — 브랜드 웹사이트 「샘플 값」
  - 배송정책 등록 — 배송비 API 시험 결과의 금액·요청 방식·오류

  수정 이력: 이커머스 전수 실측 S5-D24 (2026-10-07). 시험 하나가 시나리오 하나다 — 각 case 는 아래 주석의 시험 이름과 짝이다.

axes:
  case: [c01, c02, c03, c04, c05, c06, c07]
  # c01: 마일리지 적립건 수정 창: 금액·적립일이 값이고, 기본 상태는 검증 오류가 없다
  # c02: 마일리지 적립건 수정 창: 「검증 실패」 대안 상태가 칸별 오류를 보여 준다
  # c03: 현금영수증 발급 창: 식별번호가 사업자번호 꼴이고, 기본 상태는 오류가 없다
  # c04: 배송정책 기본 지정·삭제 창: 정책 이름·국가 표시가 값이다
  # c05: 상품 관리: 판매가·재고 조건이 버튼에 덧붙는 표시 문자열이다
  # c06: %s: 브랜드 웹사이트가 주소다
  # c07: 배송정책 등록: 배송비 API 시험 결과가 금액·요청 방식·상태 코드 꼴이고 오류가 없다

effects:
  - sample_values_typed_not_placeholder

