feature: 관리자 메뉴의 취소/반품/교환 관리 항목 등록 (S6c)

description: |
  이커머스 모듈의 관리자 메뉴 선언에 '취소/반품/교환 관리' 항목이 /admin/ecommerce/claims URL 과
  sirsoft-ecommerce.claims.read 권한으로 들어 있어야 한다. 이 항목은 주문 관리 바로 다음 순서에 놓이고,
  끼워 넣으면서 뒤 항목의 order 값을 밀어 중복이 없어야 한다.
  메뉴 선언은 syncDeclarativeArtifacts() 가 업데이트마다 다시 맞추므로 선언 자체가 계약이다.

axes:
  case: [claims_menu_after_orders]

effects:
  - claims_menu_registered_with_claim_read_permission
  - claims_menu_ordered_right_after_orders
  - admin_menu_order_values_unique

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Unit/ModuleAdminMenuClaimTest.php
