feature: 회원 후기 이미지 업로드·삭제 API (User ReviewImageController)

description: |
  회원이 자기 후기에 이미지를 올리고 지우는 API 의 계약을 고정한다. 이 Feature 테스트는 업로드·삭제 부분이
  매니페스트 없이 존재했고(해시 서빙 게이트 테스트만 file-serving-parent-state-gate.yaml 이 소유),
  KVE-2026-3187~3195 보안 작업이 이 파일을 고치며 함께 등재한다.

  - 비로그인은 401, 남의 후기에 올리거나 남의 후기 이미지를 지우면 403.
  - 이미지 필드 누락·이미지가 아닌 파일·용량 초과(10MB 초과)는 422, 후기당 최대 장수(기본 5장)를 넘기면 422.
  - 삭제는 소프트 삭제이고, 요청한 후기에 속하지 않은 이미지·없는 이미지는 404.
  - 최대 장수·용량을 설정으로 바꾸는 정책 축은 mp11-review-image-policy.yaml 이 다룬다.

# axis 의미: 컨트롤러의 처리 동작. 응답 분기(성공·401·403·404·422)는 동작마다 갈리는 값이 달라 효과로 둔다.
axes:
  operation: [upload, delete]

effects:
  - user_review_image_upload_saved_for_own_review            # 자기 후기 업로드는 201, 이미지 행 저장
  - user_review_image_upload_rejects_invalid_file_with_422   # 이미지 필드 누락·이미지 아님·용량 초과는 422
  - user_review_image_upload_limit_exceeded_returns_422      # 이미 최대 장수면 다음 업로드는 422
  - user_review_image_api_forbids_others_review              # 남의 후기 업로드·남의 이미지 삭제는 403
  - user_review_image_api_requires_authentication            # 비로그인 업로드·삭제는 401
  - user_review_image_delete_soft_deletes_own_image          # 자기 이미지 삭제는 소프트 삭제
  - user_review_image_delete_returns_404_for_foreign_or_missing_image  # 다른 후기 소속·없는 이미지는 404
  # 세분 효과 — 7.2.0 의 쌍둥이 매니페스트(review-image-upload-delete-api.yaml, axis area)가 같은 시험을 이중 소유하던 것을
  # 6차 병합 후속에서 이 매니페스트로 합쳤다. 각 시험 메서드는 위 효과와 아래 세분 효과를 함께 마킹한다.
  - review_image_upload_creates_row_with_201
  - review_image_upload_requires_image_field
  - review_image_upload_rejects_non_image_file
  - review_image_upload_rejects_oversized_file
  - review_image_upload_forbidden_on_other_member_review
  - review_image_upload_rejected_over_max_count
  - review_image_upload_requires_login
  - review_image_delete_soft_deletes_own_image
  - review_image_delete_forbidden_on_other_member_review
  - review_image_delete_not_found_for_image_of_other_review
  - review_image_delete_not_found_for_missing_image
  - review_image_delete_requires_login

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Feature/Http/Controllers/User/ReviewImageControllerTest.php
