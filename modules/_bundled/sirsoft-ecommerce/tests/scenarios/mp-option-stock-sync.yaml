# audit:allow test-scenario-coverage[cross_product] reason: issue:#857 이 매니페스트의 조합을 재는 시험은 test_files 의 spec 뿐인데, 그 spec 은 test.describe.skip 상태라(활성화 조건은 spec 머리말) 실행되지 않는다. 건너뛴 시험의 마킹은 커버로 세지 않으므로(docs/testing-guide.md 「describe.skip 인 spec 의 그 축 커버리지는 0」) 조합이 미커버로 남는다. 같은 조합을 재는 다른 실행 시험은 없다(#857 후속 대조). spec 의 skip 을 풀면 이 표식을 걷고 pending_effects 를 effects 로 되돌린다.

feature: 옵션 목록 변경 시 원 상품 재고 자동 동기화 (관리자 E2E)

description: |
  옵션 생성(generateOptions), 행 추가(addOptionRow), 삭제(deleteOption) 때 원 상품 재고(form.stock_quantity)가
  활성 옵션 재고 합계로 즉시 갱신되지 않아, 옵션 재고를 한 번 조작(updateFormOptionField)해야만 반영되던 결함의
  브라우저 회귀 가드다. 상품 재고 입력칸은 옵션 보유 시 읽기전용이라 표시값이 옵션 합계와 항상 같아야 한다.

  행 추가, 재고 필드 갱신, has_options 설정과 해제는 핸들러 단위 테스트(optionHandlers.generateOptions.test.ts,
  productOptionHandlers.test.ts, optionHandlers.test.ts)가 잰다. 이 매니페스트는 브라우저에서 일괄 생성과 삭제
  두 동작만 본다.

  spec 은 testid 보강 전까지 test.describe.skip 이다(placeholder).

axes:
  option_change:
    - generate   # 옵션 일괄 생성
    - delete     # 생성 뒤 옵션 1개 삭제

effects: []

# 아래 효과는 아직 실행되는 시험이 재지 않는다 — test_files 의 spec 이 test.describe.skip 상태라 건너뛴 시험의 @effects 는
# 커버가 아니다(#857 후속). spec 의 skip 을 풀면 effects 로 되돌린다.
pending_effects:
  - product_stock_synced_on_generate   # 옵션 일괄 생성 직후 원 상품 재고가 옵션 재고 합계로 표시된다
  - product_stock_synced_on_delete     # 옵션 삭제 직후 원 상품 재고가 남은 활성 옵션 합계로 재계산된다

test_files:
  - modules/_bundled/sirsoft-ecommerce/tests/Playwright/specs/admin/product-option-stock-sync.spec.ts
