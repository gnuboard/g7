# audit:allow test-scenario-coverage[cross_product] reason: 결함 회귀 묶음이라 축이 서로 독립이다(화면·결함 종류). 교차 조합에 뜻이 없고, 효과마다 그 효과를 여는 조합을 테스트 docblock 이 직접 적는다.
feature: "#599 validate P7 — 이커머스 관리자 화면(클레임·주문·배송정책·회원 배송지·쿠폰·설정) 결함 수정"

description: |
  브랜치 검증(2026-09-23)이 이커머스 관리자 화면과 그 핸들러에서 찾은 결함을 잠근다.
  레이아웃은 구워진 짝 `.json`(런타임 값)으로, 주석 정합처럼 JSON 에 남지 않는 것은 소스로 잰다.

  ① 클레임 목록의 설정 게이트 소스(사유 카탈로그·쇼핑몰 설정)가 claims.read 만 가진 운영자에게
     진입마다 403 토스트를 띄웠다 — 403 을 억제한다.
  ② 되돌릴 수 없는 첨부 일괄 정리에 확인 창이 없었다.
  ③ Select 는 placeholder 를 그리지 않는다 — 택배사를 비울 수 없어 송장 삭제에 도달할 수 없었다.
  ④ 정의 없는 클래스(btn-square·text-caption·input-sm)·prop(DataGrid loading·columnSelectorId)을 걷어냈다.
  ⑤ 재진입 초기화 누락: 클레임 상세 전이 선택, 배송정책 폼 회수지·저장 id, 주문 취소의 「환불까지 한 번에 처리」.
  ⑥ 금액 표기: 환불 합계의 부동소수 오차를 걷고, 은행 코드는 코드표에서 고른다.
  ⑦ 권한·실패 경로: 취소 뒤 클레임 권한 없는 운영자를 신청서로 보내지 않고, orderClaims 실패가 화면 전체를
     막지 않으며, 클레임 신청일 역전 구간이 목록 전체를 422 로 만들지 않는다.
  ⑧ 문구: 모듈 핸들러 키를 모듈 접두사로 옮기고(번역 없으면 폴백), 취소신청서 전용 안내·ID 라벨 키·
     쿠폰 모바일 라벨 키·누락 키 2개를 바로잡았다.

