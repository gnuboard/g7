notes: |
  P7 후속(HTTP 묶음이 응답 필드를 확정한 뒤): 신청자 링크는 `requester_user_uuid`, 적립 포인트 표기는
  `total_earned_points_amount_formatted`(결제 카드 · 비교 스냅샷 양쪽)를 먼저 읽고 필드가 없는 옛 응답만
  종전 표기로 떨어진다. [주문취소] 안내는 서버 `message`(cancelled 로 둘로 갈림)를 그대로 쓴다.
  사유 카탈로그 게이트가 `claims.read` 로도 열려 목록의 403 억제는 걷어냈다(게이트가 다시 좁혀지면 드러나야 한다).
  환불 우선순위 서버값은 이 묶음 범위 밖이다.
  2026-10-04: 쿠폰 목록과 회원 배송지 목록의 좁은 화면 카드 블록은 아무도 채우지 않는 `_global.isPortable` 에 묶여
  한 번도 보이지 않아 걷어냈다(2026-10-04 결정 3). ⑧ 의 쿠폰 모바일 라벨 키 잠금은 블록과 그 키가 남지 않음을 잠그는 것으로 바꿨다.
