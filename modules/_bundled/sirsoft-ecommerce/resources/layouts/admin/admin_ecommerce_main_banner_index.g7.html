<!-- 메인 배너 관리 (운영자) — 위쪽 미리보기 슬라이더 아래에 목록/상세·등록 폼을 나란히 둔다.
  오른쪽 영역은 `viewMode` 하나로 상세·등록을 갈아 끼우고, 고른 배너가 없으면 안내만 남긴다. -->
<layout name="admin_ecommerce_main_banner_index" version="1.0.0" extends="_admin_base">
  <meta title="$t:sirsoft-ecommerce.admin.main_banner.title" description="$t:sirsoft-ecommerce.admin.main_banner.description"/>
  <init-local>
    <field name="selectedBannerId" value="banner_1"/>
    <field name="viewMode" value="detail"/>
    <field name="activeTab" value="all"/>
    <field name="activeLanguageTab" value="ko"/>
    <field name="previewLanguage" value="en"/>
    <field name="bannerStatus">
      <field name="banner_1" :value="true"/>
      <field name="banner_2" :value="false"/>
    </field>
  </init-local>
  <permissions>
    <permission>sirsoft-ecommerce.settings.read</permission>
  </permissions>
  <slot name="content">
    <div data-ref="main_banner_content" class="ecommerce-admin-page-content">
      <responsive on="portable" class="ecommerce-admin-page-content-compact"/>
      <div data-ref="page_header" class="ecommerce-flex-start ecommerce:justify-between ecommerce:gap-4 ecommerce:mb-6">
        <responsive on="portable" class="ecommerce-row-stack ecommerce:mb-6"/>
        <div data-ref="page_header_left">
          <h1 class="ecommerce:text-xl ecommerce:font-semibold ecommerce:text-gray-900 ecommerce:dark:text-white ecommerce:mb-1"><responsive on="640-" class-merge="ecommerce:text-2xl"/>$t:sirsoft-ecommerce.admin.main_banner.title</h1>
          <p class="ecommerce-text-secondary ecommerce:text-sm">$t:sirsoft-ecommerce.admin.main_banner.description</p>
        </div>
        <div data-ref="page_header_actions" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:flex-shrink-0">
          <button type="button" class="ecommerce-btn ecommerce-btn-icon" aria-label="$t:common.reset">
            <on type="click">
              <!-- 쿼리를 떨어뜨린 처음 상태로 되돌린다 — 화면 상태가 전부 _local 이라 재진입이 곧 초기화다 -->
              <navigate path="/admin/ecommerce/main-banners" :mergeQuery="false"/>
            </on>
            <icon name="arrows-rotate" class="ecommerce:text-base"/>
          </button>
          <button type="button" class="ecommerce-btn ecommerce-btn-outline">
            <icon name="eye-slash" class="ecommerce:text-base ecommerce:mr-1"/>
            <span>$t:sirsoft-ecommerce.admin.main_banner.actions.preview_close</span>
          </button>
          <button type="button" class="ecommerce-btn ecommerce-btn-primary">
            <on type="click">
              <!-- 오른쪽 영역을 등록 폼으로 바꾼다 — 선택을 비워야 상세 패널이 물러난다 -->
              <set-state target="_local" :selectedBannerId="null" viewMode="add"/>
            </on>
            <icon name="plus" class="ecommerce:text-base ecommerce:mr-1"/>
            <span>$t:sirsoft-ecommerce.admin.main_banner.actions.create</span>
          </button>
        </div>
      </div>
      <include src="partials/admin_ecommerce_main_banner_index/_partial_preview_slider.g7.html"/>
      <div data-ref="panel_layout" class="ecommerce:grid ecommerce:grid-cols-1 ecommerce:gap-6">
        <responsive on="1024-" class="ecommerce:grid ecommerce:gap-6 ecommerce:grid-cols-3"/>
        <div data-ref="left_panel" class="ecommerce:col-span-1">
          <include src="partials/admin_ecommerce_main_banner_index/_partial_banner_list.g7.html"/>
        </div>
        <div data-ref="right_panel" class="ecommerce:col-span-1">
          <responsive on="1024-" class="ecommerce:col-span-2"/>
          <include src="partials/admin_ecommerce_main_banner_index/_partial_banner_detail.g7.html"/>
          <include src="partials/admin_ecommerce_main_banner_index/_partial_banner_form.g7.html"/>
          <div data-ref="empty_state" data-if="{{_local.viewMode === 'detail' &amp;&amp; _local.selectedBannerId === null}}" class="ecommerce-admin-card">
            <div class="ecommerce-flex-center ecommerce:flex-col ecommerce:justify-center ecommerce:py-12">
              <icon name="image" class="ecommerce:text-[4rem] ecommerce:text-gray-500 ecommerce:dark:text-gray-500 ecommerce:mb-4"/>
              <p class="ecommerce-text-secondary ecommerce:text-sm">$t:sirsoft-ecommerce.admin.sample.misc.select_banner_hint</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </slot>
  <!-- 배너 삭제 확인 -->
  <modal src="partials/admin_ecommerce_main_banner_index/_modal_delete_confirm.g7.html"/>
  <!-- 편집을 접을 때 저장하지 않은 입력을 버릴지 묻는다 -->
  <modal src="partials/admin_ecommerce_main_banner_index/_modal_edit_cancel.g7.html"/>
  <!-- 노출/숨김 전환 확인 — 배너는 바꾸는 즉시 앞단에 반영된다 -->
  <modal src="partials/admin_ecommerce_main_banner_index/_modal_status_change.g7.html"/>
</layout>
