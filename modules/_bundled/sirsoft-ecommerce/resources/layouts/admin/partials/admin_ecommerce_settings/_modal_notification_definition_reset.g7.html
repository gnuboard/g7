<!-- 쇼핑몰 설정 — 알림 정의 초기화 확인 창. 손으로 고친 알림 설정을 모듈이 제공하는 기본값으로
  되돌린다. 되돌리면 그동안의 수정이 사라지므로 되묻는다. -->
<partial description="이커머스 알림 정의 기본값 복원 확인 모달 (스피너 포함)">
  <modal data-type="composite" data-ref="modal_ecommerce_notification_definition_reset" title="$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_modal.title" size="sm">
    <p class="ecommerce:text-gray-700 ecommerce:dark:text-gray-300">$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_modal.confirm_message</p>
    <div class="ecommerce:mt-4 ecommerce:p-3 ecommerce:bg-gray-100 ecommerce:dark:bg-gray-700 ecommerce:rounded-lg">
      <span class="ecommerce-form-sub-label">$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_modal.target_label</span>
      <span class="ecommerce-text-primary ecommerce:font-medium">{{_global.resetTargetName ?? ''}}</span>
    </div>
    <div class="ecommerce-alert-danger">
      <p class="ecommerce-tone-error-soft ecommerce:text-sm">$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_modal.warning_message</p>
    </div>
    <footer>
      <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:text-gray-700 ecommerce:dark:text-gray-300 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:hover:bg-gray-50 ecommerce:dark:hover:bg-gray-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <close-modal target="modal_ecommerce_notification_definition_reset"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:px-4 ecommerce:py-2 ecommerce:bg-orange-700 ecommerce:dark:bg-orange-700 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-orange-800 ecommerce:dark:hover:bg-orange-800 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <!-- 초기화. 성공하면 알림 목록을 다시 불러 되돌아간 값을 보여 준다. -->
          <sequence>
            <set-state target="global" :isResettingNotification="true"/>
            <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.resetTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :isResettingNotification="false" :resetTargetId="null" resetTargetName=""/>
                <refetch-data-source dataSourceId="ecommerceNotificationDefinitions"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_success"/>
                <close-modal target="modal_ecommerce_notification_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :isResettingNotification="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingNotification}}" name="spinner" class="ecommerce-spinner-sm"/>
        <span>{{_global.isResettingNotification ? '$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_modal.btn_confirming' : '$t:sirsoft-ecommerce.admin.settings.notification_definitions.reset_modal.btn_confirm'}}</span>
      </button>
    </footer>
  </modal>
</partial>
