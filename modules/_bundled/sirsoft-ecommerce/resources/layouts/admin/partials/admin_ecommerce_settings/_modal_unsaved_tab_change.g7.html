<!-- 쇼핑몰 설정 — 저장하지 않은 변경이 있을 때 탭을 옮기기 전에 묻는 창. 탭 전환은 같은 화면으로의
  재진입이라 설정을 다시 받아 폼을 덮으므로, 옮기면 입력이 사라진다는 것을 먼저 알린다. 이 조각은
  묻기만 하고, [이동] 을 고르면 탭 줄의 「변경 없음」 갈래와 같은 정리를 부모 폼에 하고 옮긴다. -->
<partial description="저장하지 않은 변경이 있을 때 탭 이동 확인 모달">
  <modal data-type="composite" data-ref="unsaved_tab_change_modal" title="$t:sirsoft-ecommerce.admin.settings.unsaved_tab_change.title" size="md">
    <div>
      <div class="alert-warning">
        <icon name="triangle-exclamation" class="text-amber-500 dark:text-amber-400 text-lg mt-0.5 shrink-0"/>
        <span class="text-warning-soft">$t:sirsoft-ecommerce.admin.settings.unsaved_tab_change.message</span>
      </div>
      <div class="flex justify-end gap-2">
        <button data-ref="unsaved_tab_change_stay" type="button" class="btn btn-secondary">
          <on type="click">
            <!-- 머무르기 — 가려던 탭만 잊고 창을 닫는다. 폼·변경 표시·주소는 건드리지 않는다 -->
            <sequence>
              <set-state target="global" :pendingEcommerceSettingsTab="null"/>
              <close-modal/>
            </sequence>
          </on>
          <span>$t:sirsoft-ecommerce.admin.settings.unsaved_tab_change.stay</span>
        </button>
        <button data-ref="unsaved_tab_change_leave" type="button" class="btn btn-danger">
          <on type="click">
            <!-- 이동 — 변경을 버리고 가려던 탭으로 간다. 창은 자기 지역 상태를 따로 가지므로 부모 폼 정리는 $parent._local 에 한다. 정리 목록은 탭 줄의 「변경 없음」 갈래와 같아야 한다(회귀 테스트가 키 일치를 단언) — 버린 변경의 표시(hasChanges)도 함께 내린다. 가려던 탭은 이동을 마친 뒤에 잊는다 -->
            <sequence>
              <set-state target="$parent._local" :hasChanges="false" :errors="null" :isAddingExchangeReason="false" :exchangeReasonForm="null" :exchangeReasonFormErrors="null" :isAddingReturnReason="false" :returnReasonForm="null" :returnReasonFormErrors="null" :isAddingRefundReason="false" :refundReasonForm="null" :refundReasonFormErrors="null" :isAddingCarrier="false" :carrierForm="null" :carrierFormErrors="null" :isAddingShippingType="false" :shippingTypeForm="null" :shippingTypeFormErrors="null" :isAddingCountry="false" :newCountry="null" :isAddingCurrency="false" :form.newCurrency="null" :isAddingMileageCurrency="false" :form.newMileageCurrency="null" :claimReasonTab="null"/>
              <set-state target="global" activeEcommerceSettingsTab="{{_global.pendingEcommerceSettingsTab}}"/>
              <close-modal/>
              <!-- audit:allow layout-list-context-navigate-merge-query 탭 전환 — 탭마다 다루는 대상이 달라 이전 탭의 목록 상태를 물려받으면 오히려 잘못된 화면이 된다. -->
              <navigate path="/admin/ecommerce/settings" :replace="true">
                <query tab="{{_global.pendingEcommerceSettingsTab}}"/>
              </navigate>
              <set-state target="global" :pendingEcommerceSettingsTab="null"/>
            </sequence>
          </on>
          <span>$t:sirsoft-ecommerce.admin.settings.unsaved_tab_change.leave</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
