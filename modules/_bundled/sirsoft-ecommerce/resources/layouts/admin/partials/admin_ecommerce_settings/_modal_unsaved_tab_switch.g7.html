<!-- 저장하지 않은 변경이 있을 때 다른 탭으로 옮기기 전에 묻는 창 — 저장은 지금 탭의 구획만 보내고, 탭을 옮기면 설정을 다시 받아 고친 값이 저장된 값으로 돌아간다. 말없이 사라지지 않게 먼저 알리고, 옮기기로 하면 탭 전환과 같은 정리와 순서로 옮긴다 -->
<partial description="이커머스 환경설정 미저장 변경 탭 전환 확인 모달">
  <modal data-type="composite" data-ref="modal_ecommerce_settings_unsaved_tab" title="$t:sirsoft-ecommerce.admin.settings.unsaved_tab_modal.title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:sirsoft-ecommerce.admin.settings.unsaved_tab_modal.message</p>
    <div class="modal-footer-buttons">
      <button type="button" data-testid="ecommerce-settings-unsaved-tab-stay" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <!-- 머무르기 — 옮기려던 탭을 지우고 창만 닫는다(고친 값과 「변경 있음」은 그대로) -->
          <sequence>
            <set-state target="global" :pendingEcommerceSettingsTab="null"/>
            <close-modal target="modal_ecommerce_settings_unsaved_tab"/>
          </sequence>
        </on>
        $t:sirsoft-ecommerce.admin.settings.unsaved_tab_modal.btn_stay
      </button>
      <button type="button" data-testid="ecommerce-settings-unsaved-tab-leave" class="px-4 py-2 bg-orange-600 dark:bg-orange-500 text-white rounded-lg hover:bg-orange-700 dark:hover:bg-orange-600">
        <on type="click">
          <!-- 저장하지 않고 옮기기 — 창을 먼저 닫고(이동이 끝날 때까지 창이 떠 있지 않게) 탭 전환 이벤트만 보낸다. 정리(「변경 있음」 끄기·오류·인라인 추가 폼)와 전역 탭·URL 갱신은 탭 본문 틀의 이벤트 받기가 한다 — 그 받기는 페이지 문맥이라 페이지 폼 렌더러 상태에 닿는다. 설정을 다시 받으며 고친 값은 저장된 값으로 돌아간다 -->
          <sequence>
            <close-modal target="modal_ecommerce_settings_unsaved_tab"/>
            <emit-event event="sirsoft-ecommerce:settings-switch-tab">
              <field name="data">
                <field name="tab" value="{{_global.pendingEcommerceSettingsTab}}"/>
              </field>
            </emit-event>
          </sequence>
        </on>
        $t:sirsoft-ecommerce.admin.settings.unsaved_tab_modal.btn_leave
      </button>
    </div>
  </modal>
</partial>
