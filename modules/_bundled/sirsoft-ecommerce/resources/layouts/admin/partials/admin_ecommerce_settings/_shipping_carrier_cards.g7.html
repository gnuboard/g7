<partial description="배송사 관리 - Mobile 카드 뷰">
  <div data-ref="carrier_cards_container">
    <div data-ref="carrier_card_{{$cIdx}}" data-each="$carrier, $cIdx in (_local.form?.shipping?.carriers ?? []).map((c, i) => ({...c, _idx: i}))" class="excel-card mb-3">
      <div class="excel-card-header">
        <div class="flex-center gap-2 min-w-0">
          <div class="min-w-0">
            <div class="excel-card-title font-mono">{{$carrier.code}}</div>
            <div class="text-tertiary truncate">{{typeof $carrier.name === 'object' ? $localized($carrier.name) : ($carrier.name ?? '')}}</div>
          </div>
        </div>
        <div class="flex-center gap-2 shrink-0">
          <toggle checked="{{$carrier.is_active ?? false}}" size="sm" disabled="{{_computed.isReadOnly}}">
            <on type="change">
              <set-state target="local" form.shipping.carriers="{{(_local.form?.shipping?.carriers ?? []).map((c, i) => i === $carrier._idx ? {...c, is_active: !(c.is_active)} : c)}}" :hasChanges="true"/>
            </on>
          </toggle>
          <button type="button" class="btn-icon text-error disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_computed.isReadOnly}}">
            <on type="click">
              <set-state confirm="$t:sirsoft-ecommerce.admin.settings.shipping.carriers.confirm_delete" target="local" form.shipping.carriers="{{(_local.form?.shipping?.carriers ?? []).filter((_, i) => i !== $carrier._idx)}}" :hasChanges="true"/>
            </on>
            <icon name="fa-solid fa-trash" class="text-sm"/>
          </button>
        </div>
      </div>
      <div class="excel-card-body">
        <div class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.settings.shipping.carriers.columns.code</label>
          <input type="text" value="{{$carrier.code ?? ''}}" placeholder="$t:sirsoft-ecommerce.admin.settings.shipping.carriers.form.code_placeholder" class="{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.code'] ? 'input input-error font-mono' : 'input font-mono'}}" disabled="{{_computed.isReadOnly}}">
            <on type="change">
              <set-state target="local" form.shipping.carriers="{{(_local.form?.shipping?.carriers ?? []).map((c, i) => i === $carrier._idx ? {...c, code: $event.target.value} : c)}}" :hasChanges="true"/>
            </on>
          </input>
          <span data-if="{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.code']}}" class="form-error">{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.code']?.[0] ?? ''}}</span>
        </div>
        <div class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.settings.shipping.carriers.columns.name</label>
          <multilingual-input value="{{$carrier.name ?? {}}}" layout="compact" placeholder="$t:sirsoft-ecommerce.admin.settings.shipping.carriers.form.name_ko_placeholder" error="{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.name.ko']?.[0] ?? _local.errors?.['shipping.carriers.' + $carrier._idx + '.name']?.[0] ?? ''}}" disabled="{{_computed.isReadOnly}}">
            <on type="change">
              <set-state target="local" form.shipping.carriers="{{(_local.form?.shipping?.carriers ?? []).map((c, i) => i === $carrier._idx ? {...c, name: $event.target.value} : c)}}" :hasChanges="true"/>
            </on>
          </multilingual-input>
        </div>
        <div class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.settings.shipping.carriers.columns.type</label>
          <select value="{{$carrier.type ?? 'domestic'}}" class="{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.type'] ? 'select-error w-full' : 'w-full'}}" disabled="{{_computed.isReadOnly}}">
            <options>
              <option value="domestic">$t:sirsoft-ecommerce.admin.settings.shipping.carriers.form.type_domestic</option>
              <option value="international">$t:sirsoft-ecommerce.admin.settings.shipping.carriers.form.type_international</option>
            </options>
            <on type="change">
              <set-state target="local" form.shipping.carriers="{{(_local.form?.shipping?.carriers ?? []).map((c, i) => i === $carrier._idx ? {...c, type: $event.target.value} : c)}}" :hasChanges="true"/>
            </on>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.settings.shipping.carriers.columns.tracking_url</label>
          <input type="text" value="{{$carrier.tracking_url ?? ''}}" placeholder="$t:sirsoft-ecommerce.admin.settings.shipping.carriers.form.tracking_url_placeholder" class="{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.tracking_url'] ? 'input input-error' : 'input'}}" disabled="{{_computed.isReadOnly}}">
            <on type="change">
              <set-state target="local" form.shipping.carriers="{{(_local.form?.shipping?.carriers ?? []).map((c, i) => i === $carrier._idx ? {...c, tracking_url: $event.target.value} : c)}}" :hasChanges="true"/>
            </on>
          </input>
          <span data-if="{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.tracking_url']}}" class="form-error">{{_local.errors?.['shipping.carriers.' + $carrier._idx + '.tracking_url']?.[0] ?? ''}}</span>
        </div>
      </div>
    </div>
  </div>
</partial>
