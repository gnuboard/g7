<partial description="마일리지 통화별 사용 규칙 - Mobile 카드 뷰">
  <div data-ref="currency_rules_cards_container" class="space-y-4">
    <div data-ref="currency_rule_card" data-each="rule, ruleIndex in (Array.isArray(_local.form?.mileage?.currency_rules) ? _local.form.mileage.currency_rules : []).map((c, i) => ({ ...c, _idx: i }))" class="relative border border-gray-200 dark:border-gray-700 rounded-lg p-4 space-y-3">
      <button data-if="{{rule._idx !== 0}}" type="button" class="absolute top-3 right-3 text-red-500 hover:text-red-700 dark:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed" disabled="{{_computed.isReadOnly}}">
        <on type="click">
          <set-state target="local" form.mileage.currency_rules="{{(_local.form?.mileage?.currency_rules ?? []).filter((c, i) => i !== rule._idx)}}" :hasChanges="true"/>
        </on>
        <icon name="trash" size="sm"/>
      </button>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.code</label>
        <input type="text" name="{{'mileage.currency_rules.' + rule._idx + '.currency_code'}}" value="{{rule.currency_code ?? ''}}" maxLength="3" class="input w-full uppercase" disabled="{{_computed.isReadOnly || rule._idx === 0}}"/>
        <span data-if="{{rule._idx === 0}}" class="block text-xs text-gray-400 dark:text-gray-500 mt-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.default_label</span>
        <span data-if="{{_local.errors?.['mileage.currency_rules.' + rule._idx + '.currency_code']}}" class="block text-red-500 dark:text-red-400 text-xs mt-1">{{_local.errors?.['mileage.currency_rules.' + rule._idx + '.currency_code']?.[0] ?? ''}}</span>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.point_value</label>
        <input type="number" name="{{'mileage.currency_rules.' + rule._idx + '.point_value'}}" value="{{rule.point_value ?? 1}}" min="0.001" step="0.001" class="input w-full" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.min_use</label>
        <input type="number" name="{{'mileage.currency_rules.' + rule._idx + '.min_use_amount'}}" value="{{rule.min_use_amount ?? 0}}" min="0" class="input w-full" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.use_unit</label>
        <input type="number" name="{{'mileage.currency_rules.' + rule._idx + '.use_unit'}}" value="{{rule.use_unit ?? 1}}" min="1" class="input w-full" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use</label>
        <div class="space-y-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <on type="click">
              <set-state if="{{!_computed.isReadOnly}}" target="local" form.mileage.currency_rules="{{(_local.form?.mileage?.currency_rules ?? []).map((c, i) => i === rule._idx ? { ...c, max_use_type: 'percent' } : c)}}" :hasChanges="true"/>
            </on>
            <input type="radio" name="{{'mileage.currency_rules.' + rule._idx + '.max_use_type'}}" value="percent" checked="{{rule.max_use_type === 'percent'}}" disabled="{{_computed.isReadOnly}}" class="pointer-events-none"/>
            <span class="text-xs text-gray-600 dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use_percent</span>
            <input type="number" name="{{'mileage.currency_rules.' + rule._idx + '.max_use_percent'}}" value="{{rule.max_use_percent ?? 30}}" min="0" max="100" class="input w-16 text-center" disabled="{{_computed.isReadOnly || rule.max_use_type !== 'percent'}}"/>
            <span class="text-xs text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use_percent_suffix</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <on type="click">
              <set-state if="{{!_computed.isReadOnly}}" target="local" form.mileage.currency_rules="{{(_local.form?.mileage?.currency_rules ?? []).map((c, i) => i === rule._idx ? { ...c, max_use_type: 'fixed' } : c)}}" :hasChanges="true"/>
            </on>
            <input type="radio" name="{{'mileage.currency_rules.' + rule._idx + '.max_use_type'}}" value="fixed" checked="{{rule.max_use_type === 'fixed'}}" disabled="{{_computed.isReadOnly}}" class="pointer-events-none"/>
            <span class="text-xs text-gray-600 dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use_fixed</span>
            <input type="number" name="{{'mileage.currency_rules.' + rule._idx + '.max_use_value'}}" value="{{rule.max_use_value ?? 0}}" min="0" class="input w-28 text-center" disabled="{{_computed.isReadOnly || rule.max_use_type !== 'fixed'}}"/>
          </label>
        </div>
      </div>
    </div>
    <div data-ref="new_mileage_currency_card" data-if="{{_local.isAddingMileageCurrency === true}}" class="relative border border-blue-300 dark:border-blue-700 bg-blue-50 dark:bg-blue-900/20 rounded-lg p-4 space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.code</label>
        <select name="newMileageCurrency.currency_code" value="{{_local.form?.newMileageCurrency?.currency_code ?? ''}}" options="{{[{ value: '', label: $t('sirsoft-ecommerce.admin.mileage_settings.currency.code_placeholder') }].concat((_local.form?.language_currency?.currencies ?? []).filter(lc => !(_local.form?.mileage?.currency_rules ?? []).some(r => (r.currency_code || '').toUpperCase() === (lc.code || '').toUpperCase())).map(lc => ({ value: lc.code, label: lc.code })))}}" class="{{_local.form?.newMileageCurrency?.hasError ? 'input w-full border border-red-500 dark:border-red-500 focus:ring-red-500' : 'input w-full'}}" disabled="{{_computed.isReadOnly}}">
          <on type="change">
            <set-state target="local" :form.newMileageCurrency.hasError="false"/>
          </on>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.point_value</label>
        <input type="number" name="newMileageCurrency.point_value" value="{{_local.form?.newMileageCurrency?.point_value ?? 1}}" min="0" step="0.001" class="input w-full" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.min_use</label>
        <input type="number" name="newMileageCurrency.min_use_amount" value="{{_local.form?.newMileageCurrency?.min_use_amount ?? 0}}" min="0" class="input w-full" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">$t:sirsoft-ecommerce.admin.mileage_settings.currency.use_unit</label>
        <input type="number" name="newMileageCurrency.use_unit" value="{{_local.form?.newMileageCurrency?.use_unit ?? 1}}" min="1" class="input w-full" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use</label>
        <div class="space-y-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <on type="click">
              <set-state if="{{!_computed.isReadOnly}}" target="local" form.newMileageCurrency.max_use_type="percent"/>
            </on>
            <input type="radio" name="newMileageCurrency.max_use_type" value="percent" checked="{{(_local.form?.newMileageCurrency?.max_use_type ?? 'percent') === 'percent'}}" disabled="{{_computed.isReadOnly}}" class="pointer-events-none"/>
            <span class="text-xs text-gray-600 dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use_percent</span>
            <input type="number" name="newMileageCurrency.max_use_percent" value="{{_local.form?.newMileageCurrency?.max_use_percent ?? 30}}" min="0" max="100" class="input w-16 text-center" disabled="{{_computed.isReadOnly || (_local.form?.newMileageCurrency?.max_use_type ?? 'percent') !== 'percent'}}"/>
            <span class="text-xs text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use_percent_suffix</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <on type="click">
              <set-state if="{{!_computed.isReadOnly}}" target="local" form.newMileageCurrency.max_use_type="fixed"/>
            </on>
            <input type="radio" name="newMileageCurrency.max_use_type" value="fixed" checked="{{(_local.form?.newMileageCurrency?.max_use_type ?? 'percent') === 'fixed'}}" disabled="{{_computed.isReadOnly}}" class="pointer-events-none"/>
            <span class="text-xs text-gray-600 dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.currency.max_use_fixed</span>
            <input type="number" name="newMileageCurrency.max_use_value" value="{{_local.form?.newMileageCurrency?.max_use_value ?? 0}}" min="0" class="input w-28 text-center" disabled="{{_computed.isReadOnly || (_local.form?.newMileageCurrency?.max_use_type ?? 'percent') !== 'fixed'}}"/>
          </label>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-1">
        <button type="button" class="px-3 py-1.5 text-sm text-gray-600 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50" disabled="{{_computed.isReadOnly}}">
          <on type="click">
            <set-state target="local" :isAddingMileageCurrency="false" :form.newMileageCurrency="null"/>
          </on>
          <span>$t:common.cancel</span>
        </button>
        <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50" disabled="{{_computed.isReadOnly}}">
          <on type="click">
            <toast if="{{_local.form?.newMileageCurrency?.currency_code?.trim() &amp;&amp; (_local.form?.mileage?.currency_rules ?? []).some(c => (c.currency_code || '').toUpperCase() === (_local.form?.newMileageCurrency?.currency_code || '').toUpperCase().trim())}}" type="error" message="$t:sirsoft-ecommerce.admin.mileage_settings.currency.duplicate_currency_error"/>
            <set-state if="{{_local.form?.newMileageCurrency?.currency_code?.trim() &amp;&amp; (_local.form?.mileage?.currency_rules ?? []).some(c => (c.currency_code || '').toUpperCase() === (_local.form?.newMileageCurrency?.currency_code || '').toUpperCase().trim())}}" target="local" :form.newMileageCurrency.hasError="true"/>
            <set-state if="{{_local.form?.newMileageCurrency?.currency_code?.trim() &amp;&amp; !((_local.form?.mileage?.currency_rules ?? []).some(c => (c.currency_code || '').toUpperCase() === (_local.form?.newMileageCurrency?.currency_code || '').toUpperCase().trim()))}}" target="local" form.mileage.currency_rules="{{[...(_local.form?.mileage?.currency_rules ?? []), { currency_code: (_local.form?.newMileageCurrency?.currency_code || '').toUpperCase().trim(), point_value: _local.form?.newMileageCurrency?.point_value ?? 1, min_use_amount: _local.form?.newMileageCurrency?.min_use_amount ?? 0, use_unit: _local.form?.newMileageCurrency?.use_unit ?? 1, max_use_type: _local.form?.newMileageCurrency?.max_use_type ?? 'percent', max_use_percent: _local.form?.newMileageCurrency?.max_use_percent ?? 30, max_use_value: _local.form?.newMileageCurrency?.max_use_value ?? 0 }]}}" :isAddingMileageCurrency="false" :form.newMileageCurrency="null" :hasChanges="true"/>
          </on>
          <icon name="check" size="sm"/>
          <span>$t:sirsoft-ecommerce.admin.mileage_settings.currency.add</span>
        </button>
      </div>
    </div>
    <div data-if="{{(_local.form?.mileage?.currency_rules ?? []).length === 0 &amp;&amp; _local.isAddingMileageCurrency !== true}}" class="py-6 text-center text-sm text-gray-400 dark:text-gray-500">$t:sirsoft-ecommerce.admin.mileage_settings.currency.empty</div>
  </div>
</partial>
