<!-- 쇼핑몰 설정 — 마일리지 소멸 설정 카드. 기본 카드와 같이 폼 자동 바인딩만 쓴다.
  실제 소멸 처리는 서버 스케줄이 하고 이 화면은 그 기준만 정한다. -->
<partial description="마일리지 설정 - 유효기간 카드">
  <div data-ref="mileage_expiry_card" class="ecommerce-admin-card">
    <h3 class="ecommerce:text-lg ecommerce:font-semibold ecommerce:text-gray-900 ecommerce:dark:text-white ecommerce:mb-4">$t:sirsoft-ecommerce.admin.mileage_settings.expiry.title</h3>
    <div class="ecommerce:flex ecommerce:items-center ecommerce:justify-between ecommerce:py-3">
      <div>
        <label class="ecommerce:block ecommerce:text-sm ecommerce:font-medium ecommerce:text-gray-900 ecommerce:dark:text-white">$t:sirsoft-ecommerce.admin.mileage_settings.expiry.enabled</label>
        <p class="ecommerce:text-xs ecommerce:text-gray-500 ecommerce:dark:text-gray-400 ecommerce:mt-0.5">$t:sirsoft-ecommerce.admin.mileage_settings.expiry.enabled_hint</p>
      </div>
      <toggle data-type="composite" name="mileage.expiry_enabled" value="{{_local.form?.mileage?.expiry_enabled ?? true}}" disabled="{{_computed.isReadOnly}}"/>
    </div>
    <div data-if="{{_local.form?.mileage?.expiry_enabled ?? true}}" class="ecommerce:border-t ecommerce:border-gray-200 ecommerce:dark:border-gray-700 ecommerce:pt-4">
      <label class="ecommerce:block ecommerce:text-sm ecommerce:font-medium ecommerce:text-gray-900 ecommerce:dark:text-white ecommerce:mb-2">$t:sirsoft-ecommerce.admin.mileage_settings.expiry.days</label>
      <div class="ecommerce:flex ecommerce:items-center ecommerce:gap-2">
        <input type="number" name="mileage.expiry_days" value="{{_local.form?.mileage?.expiry_days ?? 365}}" min="{{_local?.form?._meta?.limits?.expiry_days_min ?? 1}}" class="ecommerce-input ecommerce:w-28 ecommerce:text-center" disabled="{{_computed.isReadOnly}}"/>
        <span class="ecommerce:text-sm ecommerce:text-gray-600 ecommerce:dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.expiry.days_suffix|count={{_local.form?.mileage?.expiry_days ?? 365}}</span>
      </div>
      <span data-if="{{_local.errors?.['mileage.expiry_days']}}" class="ecommerce:text-red-600 ecommerce:dark:text-red-400 ecommerce:text-xs ecommerce:mt-1 ecommerce:block">{{_local.errors?.['mileage.expiry_days']?.[0] ?? ''}}</span>
    </div>
  </div>
</partial>
