<!-- 쇼핑몰 설정 — SEO 캐시 비우기 확인 창. 검색엔진용으로 미리 구워 둔 페이지를 지운다.
  지운 뒤에는 다음 방문 때 다시 만들어지므로 데이터가 사라지는 동작은 아니지만, 트래픽이
  많은 몰에서는 잠깐 느려질 수 있어 되묻는다. -->
<partial description="SEO 캐시 삭제 확인 모달">
  <modal data-type="composite" data-ref="modal_clear_seo_cache" title="$t:sirsoft-ecommerce.admin.settings.seo.seo_friendly.clear_cache_confirm_title" size="md">
    <div class="ecommerce:relative">
      <!-- 삭제 중 오버레이 (spinner + blur) -->
      <div data-if="{{$parent._local.isClearingCache}}" class="ecommerce-flex-center ecommerce:absolute ecommerce:inset-0 ecommerce:bg-white/60 ecommerce:dark:bg-gray-900/60 ecommerce:z-10 ecommerce:justify-center ecommerce:rounded-lg">
        <div class="ecommerce-flex-center ecommerce:flex-col ecommerce:gap-2">
          <icon name="spinner" class="ecommerce:text-2xl ecommerce:text-blue-500 ecommerce:dark:text-blue-400 ecommerce:animate-spin"/>
          <span class="ecommerce:text-sm ecommerce:text-gray-600 ecommerce:dark:text-gray-300 ecommerce:font-medium">$t:sirsoft-ecommerce.admin.settings.seo.seo_friendly.clearing_cache</span>
        </div>
      </div>
      <div class="ecommerce-alert-warning">
        <icon name="triangle-exclamation" class="ecommerce:text-amber-600 ecommerce:dark:text-amber-400 ecommerce:text-lg ecommerce:mt-0.5 ecommerce:shrink-0"/>
        <span class="ecommerce-tone-warning-soft ecommerce:text-xs">$t:sirsoft-ecommerce.admin.settings.seo.seo_friendly.clear_cache_confirm</span>
      </div>
    </div>
    <footer>
      <button type="button" class="ecommerce-btn ecommerce-btn-secondary" disabled="{{$parent._local.isClearingCache === true}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button data-ref="seo_clear_cache_confirm" data-if="{{$parent._local.isClearingCache !== true}}" type="button" class="ecommerce-btn ecommerce-btn-danger" disabled="{{$parent._computed?.isReadOnly !== false}}">
        <on type="click">
          <!-- 캐시 비우기. 성공·실패 어느 쪽이든 처리중 표시를 먼저 내린다 — 실패하면 창을 열어 둔 채 다시 시도할 수 있어야 한다 -->
          <sequence>
            <set-state target="$parent._local" :isClearingCache="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/settings/clear-cache" method="POST">
              <success>
                <set-state target="$parent._local" :isClearingCache="false"/>
                <refetch-data-source dataSourceId="seoStats"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.settings.seo.seo_friendly.clear_cache_success"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="$parent._local" :isClearingCache="false"/>
                <toast type="error" message="{{error.message ?? $t('sirsoft-ecommerce.admin.settings.seo.seo_friendly.clear_cache_failed')}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <span>$t:sirsoft-ecommerce.admin.settings.seo.seo_friendly.clear_cache</span>
      </button>
      <button data-if="{{$parent._local.isClearingCache === true}}" type="button" class="ecommerce-btn ecommerce-btn-danger" :disabled="true">
        <span>$t:sirsoft-ecommerce.admin.settings.seo.seo_friendly.clearing_cache</span>
      </button>
    </footer>
  </modal>
</partial>
