<!-- 쇼핑몰 설정 — 알림 템플릿 미리보기 창. 편집 창이 만들어 둔 결과를 보여 주기만 하고
  입력이 없다 — 그래서 이 조각에는 액션이 하나도 없다. -->
<partial description="이커머스 메일 템플릿 미리보기 모달">
  <modal data-type="composite" data-ref="modal_ecommerce_notification_definition_preview" title="$t:sirsoft-ecommerce.admin.settings.notification_definitions.preview_modal.title" size="lg">
    <div data-ref="ecommerce_preview_content">
      <div>
        <label class="form-label">$t:sirsoft-ecommerce.admin.settings.notification_definitions.preview_modal.rendered_subject</label>
        <p class="text-primary text-sm bg-gray-50 dark:bg-gray-900 rounded-md p-3 border border-gray-200 dark:border-gray-700">{{_global.ecommerce_notification_template_form_modal?.preview?.subject ?? ''}}</p>
      </div>
      <div>
        <label class="form-label">$t:sirsoft-ecommerce.admin.settings.notification_definitions.preview_modal.rendered_body</label>
        <!-- 미리보기의 HTML 해석 여부는 **그 채널의 편집기 종류**를 따른다. 사이트내 알림은 알림센터가 평문으로 그리는데 여기서만 HTML 로 해석하면, 운영자가 본 문구와 사용자가 받는 문구가 다르다 — 태그가 글자 그대로 보이는 쪽은 사용자다. 채널은 지금 편집 중인 템플릿의 것을 먼저 보고, 없으면 목록 탭과 같은 기준(주소의 channel)으로 떨어진다. -->
        <html-content data-type="composite" content="{{_global.ecommerce_notification_template_form_modal?.preview?.body ?? ''}}" isHtml="{{((availableChannels?.data?.channels ?? []).find(c => c.id === (_global.ecommerce_notification_template_form_modal?.template?.channel ?? query.channel ?? 'mail'))?.template_editor ?? 'plain') === 'rich'}}" class="prose dark:prose-invert prose-sm max-w-none bg-white dark:bg-gray-900 rounded-md p-4 border border-gray-200 dark:border-gray-700 max-h-[400px] overflow-y-auto"/>
      </div>
      <div class="flex justify-end border-t border-gray-200 dark:border-gray-700">
        <button data-ref="ecommerce_btn_close_preview" type="button" class="text-body px-4 py-2 rounded-md border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700 transition-colors">
          <on type="click">
            <close-modal target="modal_ecommerce_notification_definition_preview"/>
          </on>
          $t:sirsoft-ecommerce.admin.settings.notification_definitions.preview_modal.btn_close
        </button>
      </div>
    </div>
  </modal>
</partial>
