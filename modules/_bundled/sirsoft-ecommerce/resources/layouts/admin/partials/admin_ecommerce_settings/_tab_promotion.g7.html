<!-- 쇼핑몰 설정 — 쿠폰 탭. 생일 쿠폰이 쓸 회원 항목과 쿠폰 만료 임박 알림을 정한다.
  생일 항목 후보는 서버가 `_meta.birthday_field_candidates` 로 준다(회원 항목 중 날짜 유형 + 값 테이블 저장, 꺼진 항목은 「(꺼짐)」).
  값 입력은 폼 자동 바인딩이고 저장은 페이지 [저장]이 이 탭 구획(`promotion`)만 보낸다. -->
<partial description="쇼핑몰 설정 쿠폰 탭 콘텐츠">
  <div data-ref="tab_content_promotion" data-if="{{(_global.activeEcommerceSettingsTab || query.tab || 'basic_info') === 'promotion'}}" class="ecommerce:mt-6 ecommerce:space-y-6">
    <div data-ref="promotion_birthday_card" class="ecommerce-admin-card">
      <h3 class="ecommerce-section-heading ecommerce:mb-4">$t:sirsoft-ecommerce.admin.settings.promotion.birthday.title</h3>
      <div class="ecommerce:space-y-3">
        <label for="promotion_birthday_field_key" class="ecommerce:block ecommerce:text-sm ecommerce:font-medium ecommerce:text-gray-900 ecommerce:dark:text-white">$t:sirsoft-ecommerce.admin.settings.promotion.birthday.field_label</label>
        <select id="promotion_birthday_field_key" data-ref="promotion_birthday_field_select" name="promotion.birthday_field_key" aria-label="$t:sirsoft-ecommerce.admin.settings.promotion.birthday.field_label" value="{{_local.form?.promotion?.birthday_field_key ?? ''}}" options="{{[{ value: '', label: $t('sirsoft-ecommerce.admin.settings.promotion.birthday.none') }, ...((_local.form?._meta?.birthday_field_candidates ?? settings?.data?._meta?.birthday_field_candidates ?? []).map(c => ({ value: c.value, label: c.label })))]}}" class="ecommerce-input ecommerce:w-72" disabled="{{_computed.isReadOnly}}"/>
        <p class="ecommerce:text-xs ecommerce-text-muted">$t:sirsoft-ecommerce.admin.settings.promotion.birthday.field_hint</p>
        <!-- 후보가 없다 — 회원 항목에 날짜 유형 항목을 먼저 만들어야 한다 -->
        <div data-ref="promotion_birthday_no_candidates" data-if="{{settings !== undefined &amp;&amp; (_local.form?._meta?.birthday_field_candidates ?? settings?.data?._meta?.birthday_field_candidates ?? []).length === 0}}" class="ecommerce:flex ecommerce:items-start ecommerce:gap-2 ecommerce:p-3 ecommerce:rounded-lg ecommerce:bg-amber-50 ecommerce:dark:bg-amber-900/20 ecommerce:border ecommerce:border-amber-200 ecommerce:dark:border-amber-800">
          <icon name="triangle-exclamation" size="sm" class="ecommerce:text-amber-500 ecommerce:dark:text-amber-400 ecommerce:flex-shrink-0 ecommerce:mt-0.5"/>
          <div class="ecommerce:flex ecommerce:flex-wrap ecommerce:items-center ecommerce:gap-2">
            <span class="ecommerce:text-sm ecommerce:text-amber-800 ecommerce:dark:text-amber-200">$t:sirsoft-ecommerce.admin.settings.promotion.birthday.no_candidates</span>
            <a data-ref="promotion_member_fields_link" href="/admin/settings?tab=member" class="ecommerce:text-sm ecommerce:font-medium ecommerce:text-amber-900 ecommerce:dark:text-amber-100 ecommerce:underline">$t:sirsoft-ecommerce.admin.settings.promotion.birthday.go_member_fields</a>
          </div>
        </div>
      </div>
    </div>
    <div data-ref="promotion_expiry_notification_card" class="ecommerce-admin-card">
      <h3 class="ecommerce-section-heading ecommerce:mb-4">$t:sirsoft-ecommerce.admin.settings.promotion.expiry.title</h3>
      <div class="ecommerce-flex-between ecommerce:py-3">
        <div>
          <span class="ecommerce:block ecommerce:text-sm ecommerce:font-medium ecommerce:text-gray-900 ecommerce:dark:text-white">$t:sirsoft-ecommerce.admin.settings.promotion.expiry.enabled</span>
          <span class="ecommerce:block ecommerce:text-xs ecommerce-text-muted ecommerce:mt-0.5">$t:sirsoft-ecommerce.admin.settings.promotion.expiry.enabled_hint</span>
        </div>
        <toggle data-type="composite" name="promotion.coupon_expiry_notification_enabled" ariaLabel="$t:sirsoft-ecommerce.admin.settings.promotion.expiry.enabled" value="{{_local.form?.promotion?.coupon_expiry_notification_enabled ?? true}}" disabled="{{_computed.isReadOnly}}"/>
      </div>
      <div data-if="{{_local.form !== undefined &amp;&amp; (_local.form?.promotion?.coupon_expiry_notification_enabled ?? true)}}" class="ecommerce:border-t ecommerce:border-gray-200 ecommerce:dark:border-gray-700 ecommerce:pt-4">
        <label class="ecommerce:block ecommerce:text-sm ecommerce:font-medium ecommerce:text-gray-900 ecommerce:dark:text-white ecommerce:mb-2">$t:sirsoft-ecommerce.admin.settings.promotion.expiry.days_before</label>
        <div class="ecommerce:flex ecommerce:items-center ecommerce:gap-2">
          <span class="ecommerce:text-sm ecommerce:text-gray-600 ecommerce:dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.notification.days_before_prefix</span>
          <input type="number" name="promotion.coupon_expiry_notification_days_before" aria-label="$t:sirsoft-ecommerce.admin.settings.promotion.expiry.days_before" value="{{_local.form?.promotion?.coupon_expiry_notification_days_before ?? 7}}" min="{{_local?.form?._meta?.limits?.coupon_expiry_notification_days_before_min ?? 1}}" max="{{_local?.form?._meta?.limits?.coupon_expiry_notification_days_before_max ?? 30}}" class="ecommerce-input ecommerce:w-20 ecommerce:text-center" disabled="{{_computed.isReadOnly}}"/>
          <span class="ecommerce:text-sm ecommerce:text-gray-600 ecommerce:dark:text-gray-400">$t:sirsoft-ecommerce.admin.mileage_settings.notification.days_before_suffix|count={{_local.form?.promotion?.coupon_expiry_notification_days_before ?? 7}}</span>
        </div>
        <p class="ecommerce:mt-3 ecommerce:text-xs ecommerce-text-muted">$t:sirsoft-ecommerce.admin.settings.promotion.expiry.template_hint</p>
      </div>
    </div>
  </div>
</partial>
