<!-- 관리자 주문상세의 현금영수증 발급 창. 구매자가 신청하지 않았거나 발급이 실패한 건을 운영자가 사후에 발급하는 자리다 -->
<partial description="관리자 주문상세 - 현금영수증 발급 모달 (사후 발급 포함)">
  <modal data-type="composite" data-ref="modal_issue_cash_receipt" title="$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.issue_title" width="480px">
    <!-- 모달은 부모와 별도 컨텍스트라 iteration 변수(payment)나 부모 _local 을 참조할 수 없다. 발급 버튼이 열기 전에 _global.adminCashReceiptForm 을 시드하며, 주문 식별은 데이터소스(order) 응답을 직접 참조한다. -->
    <div class="ecommerce:space-y-4">
      <on event="unmount">
        <!-- 창 닫힘 정리 — X·바깥 클릭·Esc 는 엔진 창 닫기로만 이어져 레이아웃 동작을 타지 않는다. 창이 닫히면 본문을 그리지 않으므로 늘 붙어 있는 이 본문 틀이 내려갈 때 개인정보를 담은 창 이름 공간을 비운다(7.1.1) -->
        <set-state target="global" :adminCashReceiptForm="null"/>
      </on>
      <!-- 용도 -->
      <div>
        <label class="ecommerce-form-label">$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.purpose</label>
        <div class="ecommerce:flex ecommerce:flex-row ecommerce:gap-4">
          <responsive on="portable" class="ecommerce:flex ecommerce:flex-col ecommerce:gap-2"/>
          <label class="ecommerce:flex ecommerce:items-center ecommerce:gap-2 ecommerce:text-sm ecommerce:text-gray-700 ecommerce:dark:text-gray-300">
            <input type="radio" name="receipt_type" value="income" checked="{{(_global.adminCashReceiptForm?.receipt_type ?? 'income') === 'income'}}" class="ecommerce:w-4 ecommerce:h-4 ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:text-blue-600 ecommerce:focus:ring-blue-500">
              <on type="change">
                <!-- 소득공제 전환 시 사업자등록번호 선택을 phone 으로 리셋한다 (소득공제에는 사용할 수 없다) -->
                <set-state target="global" adminCashReceiptForm.receipt_type="income" adminCashReceiptForm.identifier_type="{{_global.adminCashReceiptForm?.identifier_type === 'business' ? 'phone' : (_global.adminCashReceiptForm?.identifier_type ?? 'phone')}}" adminCashReceiptForm.identifier="{{_global.adminCashReceiptForm?.identifier_type === 'business' ? '' : (_global.adminCashReceiptForm?.identifier ?? '')}}"/>
              </on>
            </input>
            <span>$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.purpose_income</span>
          </label>
          <label class="ecommerce:flex ecommerce:items-center ecommerce:gap-2 ecommerce:text-sm ecommerce:text-gray-700 ecommerce:dark:text-gray-300">
            <input type="radio" name="receipt_type" value="expense" checked="{{_global.adminCashReceiptForm?.receipt_type === 'expense'}}" class="ecommerce:w-4 ecommerce:h-4 ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:text-blue-600 ecommerce:focus:ring-blue-500">
              <on type="change">
                <!-- 지출증빙. 사업자가 비용 처리에 쓰는 형태라 아래 식별번호 칸이 사업자등록번호를 받는다 -->
                <set-state target="global" adminCashReceiptForm.receipt_type="expense"/>
              </on>
            </input>
            <span>$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.purpose_expense</span>
          </label>
        </div>
      </div>
      <!-- 발급수단 — 지출증빙일 때만 사업자등록번호를 옵션에 포함한다 (D10: 휴대폰은 양쪽 모두 유효) -->
      <div>
        <label class="ecommerce-form-label">$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.identifier_type</label>
        <select data-ref="modal_cash_receipt_identifier_type" name="identifier_type" value="{{_global.adminCashReceiptForm?.identifier_type ?? 'phone'}}" options="{{(_global.adminCashReceiptForm?.receipt_type === 'expense' ? [{ value: 'business', label: $t('sirsoft-ecommerce.admin.order.detail.cash_receipt.identifier_business') }] : []).concat([{ value: 'phone', label: $t('sirsoft-ecommerce.admin.order.detail.cash_receipt.identifier_phone') }, { value: 'card', label: $t('sirsoft-ecommerce.admin.order.detail.cash_receipt.identifier_card') }])}}" class="ecommerce:w-full ecommerce:px-4 ecommerce:py-2 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:text-gray-900 ecommerce:dark:text-white ecommerce:focus:ring-2 ecommerce:focus:ring-blue-500">
          <on type="change">
            <!-- 발급수단이 바뀌면 번호를 비운다 — 형식이 달라 그대로 두면 서버 검증에서 422 가 난다. -->
            <set-state target="global" adminCashReceiptForm.identifier_type="{{$event.target.value}}" adminCashReceiptForm.identifier=""/>
          </on>
        </select>
      </div>
      <!-- 번호 -->
      <div>
        <label class="ecommerce-form-label">$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.identifier</label>
        <input data-ref="modal_cash_receipt_identifier" type="text" name="identifier" value="{{_global.adminCashReceiptForm?.identifier ?? ''}}" placeholder="$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.identifier_placeholder" class="ecommerce:w-full ecommerce:px-4 ecommerce:py-2 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:text-gray-900 ecommerce:dark:text-white ecommerce:focus:ring-2 ecommerce:focus:ring-blue-500">
          <on type="change">
            <!-- 식별번호. 소득공제면 휴대폰번호나 현금영수증카드, 지출증빙이면 사업자등록번호가 들어간다 — 전역에 담는 것은 이 창이 부모와 별도 컨텍스트여서다 -->
            <set-state target="global" adminCashReceiptForm.identifier="{{$event.target.value}}"/>
          </on>
        </input>
        <!-- 서버 검증 메시지 인라인 노출 (사업자번호 체크섬 · 용도×수단 조합 위반 등) -->
        <span data-if="{{!!_global.adminCashReceiptForm?.error}}" class="ecommerce:block ecommerce:text-red-600 ecommerce:dark:text-red-400 ecommerce:text-xs ecommerce:mt-1">{{_global.adminCashReceiptForm?.error ?? ''}}</span>
      </div>
      <p class="ecommerce:text-xs ecommerce-text-secondary">$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.immutable_help</p>
      <!-- 액션 — 데스크톱 가로 우측정렬 → portable full-width 세로 스택 -->
      <div class="ecommerce:flex ecommerce:flex-row ecommerce:justify-end ecommerce:gap-2 ecommerce:pt-2">
        <responsive on="portable" class="ecommerce:flex ecommerce:flex-col ecommerce:gap-2 ecommerce:w-full ecommerce:pt-2"/>
        <button type="button" class="ecommerce-btn ecommerce-btn-secondary">
          <on type="click">
            <!-- 취소 — 창을 닫은 뒤 창 이름 공간의 개인정보를 비운다(닫기보다 먼저 비우면 닫히기 전 한 번 빈 칸이 그려진다) -->
            <sequence>
              <close-modal/>
              <set-state target="global" :adminCashReceiptForm="null"/>
            </sequence>
          </on>
          $t:sirsoft-ecommerce.admin.order.detail.cash_receipt.cancel
        </button>
        <button data-ref="modal_cash_receipt_submit" type="button" class="ecommerce-btn ecommerce-btn-primary" disabled="{{!(_global.adminCashReceiptForm?.identifier ?? '') || _global.isCashReceiptBusy === true || order?.data?.abilities?.can_update !== true}}">
          <on type="click">
            <!-- 요청 중에는 잠근다 — 두 번 누르면 결제사 발급이 두 번 나간다(S3-D22). -->
            <sequence>
            <set-state target="global" :isCashReceiptBusy="true"/>
            <!-- 관리자 API 는 auth_required 를 선언해야 Bearer 토큰이 부착된다 — 미선언 시 401. -->
            <api-call target="/api/modules/sirsoft-ecommerce/admin/orders/{{order.data?.id}}/cash-receipt" :auth_required="true" method="POST">
              <success>
                <!-- setState 를 먼저 하고 closeModal 을 나중에 한다 (순서 역전 시 상태가 남는다) -->
                <set-state target="global" :adminCashReceiptForm="null" :isCashReceiptBusy="false"/>
                <close-modal/>
                <refetch-data-source dataSourceId="order"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.order.detail.cash_receipt.issue_success"/>
              </success>
              <fail>
                <set-state target="global" :isCashReceiptBusy="false" adminCashReceiptForm.error="{{error.errors?.identifier?.[0] ?? error.message ?? $t('sirsoft-ecommerce.admin.order.detail.cash_receipt.issue_failed')}}"/>
              </fail>
              <body receipt_type="{{_global.adminCashReceiptForm?.receipt_type ?? 'income'}}" identifier_type="{{_global.adminCashReceiptForm?.identifier_type ?? 'phone'}}" identifier="{{_global.adminCashReceiptForm?.identifier ?? ''}}"/>
            </api-call>
            </sequence>
          </on>
          $t:sirsoft-ecommerce.admin.order.detail.cash_receipt.issue
        </button>
      </div>
    </div>
  </modal>
</partial>
