<partial description="Order Detail - Send SMS Modal">
  <modal data-ref="modal_send_sms" title="$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.title" size="md">
    <div>
      <p class="text-label-subtle">$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.description</p>
      <div>
        <span class="form-label-block">$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.phone</span>
        <input type="text" class="input-readonly" value="{{_local.smsPhone}}" :readOnly="true"/>
      </div>
      <div>
        <div class="flex justify-between mb-1">
          <span class="text-body font-medium">$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.message</span>
          <span class="text-hint">{{(_local.smsMessage || '').length}}자</span>
        </div>
        <textarea class="input w-full min-h-[100px]" placeholder="$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.message_placeholder" value="{{_local.smsMessage}}">
          <prop name="dataKey">"smsMessage"</prop>
        </textarea>
      </div>
      <div class="flex-center text-hint gap-1">
        <icon name="puzzle-piece" class="text-xs"/>
        <span>$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.plugin_label</span>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 text-body border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isSending}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.cancel</span>
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isSending}}">
        <icon data-if="{{_global.isSending}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isSending ? '$t:common.sending' : '$t:sirsoft-ecommerce.admin.order.detail.modal.send_sms.send'}}</span>
      </button>
    </div>
  </modal>
</partial>
