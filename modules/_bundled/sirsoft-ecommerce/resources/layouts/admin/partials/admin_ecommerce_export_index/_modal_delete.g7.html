<!-- 내보내기 작업 한 건을 지우는 확인 창. 대상은 표가 `_global.ecommerceExportTarget` 에 담아 준 행이고, 파일명을 회색 상자로
  다시 보여 줘 무엇을 지우는지 확인시킨다. 파일은 저장소에서 지우고 작업 기록은 소프트 삭제한다 — 다운로드 이력과
  활동 로그는 남는다(경고 문장이 그 사실을 적는다). 진행중인 작업은 서버가 409 로 거절한다.
  성공하면 대상과 체크 목록을 비운다(지운 id 가 남으면 다음 일괄 작업의 건수가 어긋난다). -->
<partial description="Export Delete Confirmation Modal">
  <modal data-type="composite" data-ref="export_delete_modal" title="$t:sirsoft-ecommerce.admin.export.modal_delete.title" size="medium">
    <div>
      <p class="ecommerce:text-gray-700 ecommerce:dark:text-gray-300">$t:sirsoft-ecommerce.admin.export.modal_delete.message</p>
      <div class="ecommerce:bg-gray-50 ecommerce:dark:bg-gray-700/50 ecommerce:rounded-lg ecommerce:p-4">
        <span class="ecommerce-text-primary ecommerce:font-medium ecommerce:break-all ecommerce-break-all">{{_global.ecommerceExportTarget?.file_name ?? (_global.ecommerceExportTarget?.type_label + ' #' + _global.ecommerceExportTarget?.id)}}</span>
      </div>
      <div class="ecommerce-alert-warning">
        <icon name="triangle-exclamation" class="ecommerce:text-xl ecommerce:text-amber-600 ecommerce:dark:text-amber-400 ecommerce:flex-shrink-0 ecommerce:mt-0.5"/>
        <div class="ecommerce:text-xs ecommerce:text-yellow-700 ecommerce:dark:text-yellow-300">
          <p>$t:sirsoft-ecommerce.admin.export.modal_delete.warning</p>
        </div>
      </div>
    </div>
    <footer>
      <button type="button" class="ecommerce-btn ecommerce-btn-secondary" disabled="{{_global.ecommerceExportIsDeleting}}">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.export.common.cancel
      </button>
      <button type="button" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:px-4 ecommerce:py-2 ecommerce:bg-red-600 ecommerce:dark:bg-red-500 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-red-700 ecommerce:dark:hover:bg-red-600 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.ecommerceExportIsDeleting}}">
        <on type="click">
          <!-- 삭제 실행. 성공 갈래가 대상·체크 목록을 비운 뒤 목록을 다시 부른다. 진행 깃발은 성공·실패 양쪽에서 푼다. -->
          <sequence>
            <set-state target="global" :ecommerceExportIsDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/exports/{{_global.ecommerceExportTarget?.id}}" method="DELETE">
              <success>
                <set-state target="global" :ecommerceExportIsDeleting="false" :ecommerceExportTarget="null" ecommerceExportBulkSelectedItems="{{(_global.ecommerceExportBulkSelectedItems ?? []).filter(id => id !== _global.ecommerceExportTarget?.id)}}"/>
                <refetch-data-source dataSourceId="exports"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.export.messages.deleted"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :ecommerceExportIsDeleting="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.ecommerceExportIsDeleting}}" name="spinner" class="ecommerce-spinner-sm"/>
        <span>{{_global.ecommerceExportIsDeleting ? '$t:sirsoft-ecommerce.admin.export.common.deleting' : '$t:sirsoft-ecommerce.admin.export.common.delete'}}</span>
      </button>
    </footer>
  </modal>
</partial>
