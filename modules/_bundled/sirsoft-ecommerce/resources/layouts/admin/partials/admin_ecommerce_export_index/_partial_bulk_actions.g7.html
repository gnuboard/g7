<!-- 내보내기 관리의 일괄 작업 줄 — 체크한 건수와 [선택 삭제] 하나.
  체크 목록은 표와 확인 창이 함께 봐야 하므로 전역(`_global.ecommerceExportBulkSelectedItems`)에 있다. 버튼은 서버
  권한(`abilities.can_delete`)까지 함께 본다. 진행중이거나 범위 밖인 행이 섞여 있어도 막지 않는다 — 서버가 그
  행을 건너뛰고 건수를 알려 준다(확인 창이 그 사실을 미리 적는다). 이 줄은 아무것도 실행하지 않는다. -->
<partial description="Export Index Bulk Actions Bar">
  <div data-ref="bulk_action_bar" class="ecommerce-flex-center ecommerce:bg-gray-100 ecommerce:dark:bg-gray-700/50 ecommerce:border ecommerce:border-gray-200 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:p-3 ecommerce:mb-4 ecommerce:flex-wrap ecommerce:gap-3">
    <span class="ecommerce-text-body ecommerce:font-medium ecommerce:whitespace-nowrap">$t:sirsoft-ecommerce.admin.export.bulk.selected_count|count={{(_global.ecommerceExportBulkSelectedItems || []).length}}</span>
    <div class="ecommerce:flex-1"/>
    <button type="button" class="ecommerce:px-3 ecommerce:py-1.5 ecommerce:text-sm ecommerce:border ecommerce:border-red-300 ecommerce:dark:border-red-600 ecommerce:text-red-600 ecommerce:dark:text-red-400 ecommerce:rounded-lg ecommerce:hover:bg-red-50 ecommerce:dark:hover:bg-red-900/20 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{!_global.ecommerceExportBulkSelectedItems || _global.ecommerceExportBulkSelectedItems.length === 0 || exports?.data?.abilities?.can_delete !== true}}">
      <on type="click">
        <open-modal target="export_bulk_delete_modal"/>
      </on>
      $t:sirsoft-ecommerce.admin.export.action.bulk_delete
    </button>
  </div>
</partial>
