<!-- 개인결제를 이어 붙일 기존 주문을 찾는 창. 검색 대상(주문번호·회원명·상품명)과 기간을 고른다.
  **아직 시안이다** — 두 선택칸은 고른 값을 화면 상태에 담아 단추에 보이기만 하고 검색어와 함께 검색에는
  쓰이지 않는다. 결과 건수("7개의 주문이…")와
  목록은 마크업에 박힌 예시다. 행을 눌러도 고른 주문이 폼으로 전달되지 않는다.
  옆의 회원 검색 창과 짝이고 상태도 같다. -->
<partial description="Personal Payment Create - Order Search Modal">
  <modal data-type="composite" data-ref="modal_order_search" title="$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.title" size="lg">
    <div data-ref="order_search_filters" class="space-y-3 mb-4">
      <div data-ref="search_field_row" class="flex gap-2">
        <select class="w-32 flex-shrink-0" aria-label="$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.search_field" value="{{_local.orderSearchField ?? ''}}">
          <on type="change">
            <!-- 검색 대상 — 시안 단계라 아직 검색에 쓰이지 않는다. 목록형 선택칸은 값을 스스로 들고 있지 않으므로 고른 값을 담아 둬야 단추에 남는다 -->
            <set-state target="local" orderSearchField="{{$event.target.value}}"/>
          </on>
          <options>
            <option value="">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.search_field_all</option>
            <option value="order_number">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.search_field_order_number</option>
            <option value="member_name">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.search_field_member_name</option>
            <option value="product_name">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.search_field_product_name</option>
          </options>
        </select>
        <input type="text" class="input flex-1" placeholder="$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.search_placeholder"/>
      </div>
      <div data-ref="order_date_row">
        <select class="w-full" aria-label="$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.order_date" value="{{_local.orderSearchPeriod ?? ''}}">
          <on type="change">
            <!-- 주문 기간 — 검색 대상과 같이 아직 검색에 쓰이지 않고, 고른 값을 담아 단추에 남긴다 -->
            <set-state target="local" orderSearchPeriod="{{$event.target.value}}"/>
          </on>
          <options>
            <option value="">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.order_date_all</option>
            <option value="7">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.order_date_last_7_days</option>
            <option value="30">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.order_date_last_30_days</option>
            <option value="90">$t:sirsoft-ecommerce.admin.personal_payment_create.modal.order_search.order_date_last_90_days</option>
          </options>
        </select>
      </div>
    </div>
    <div data-ref="order_search_result_count" class="text-sm text-secondary mb-3">$t:sirsoft-ecommerce.admin.sample.fmt.orders_found|count=7</div>
    <div data-ref="order_search_results" class="card-stack">
      <button type="button" data-ref="order_item_1" class="w-full justify-start text-left flex-start gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors border border-gray-200 dark:border-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span class="flex-center w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-lg justify-center flex-shrink-0">
          <icon name="file-text" class="text-xl text-gray-500 dark:text-gray-400"/>
        </span>
        <span class="block flex-1 min-w-0">
          <span class="flex-center gap-2 mb-1">
            <span class="font-medium text-heading">ORD20251027-1234</span>
            <span class="badge badge-yellow">$t:sirsoft-ecommerce.admin.personal_payment.status.pending</span>
          </span>
          <span class="block text-secondary text-sm">$t:sirsoft-ecommerce.admin.sample.fmt.date_name|date=2025-10-27|name=$t:sirsoft-ecommerce.admin.sample.people.kim_cheolsu</span>
          <span class="block text-secondary text-sm truncate">$t:sirsoft-ecommerce.admin.sample.products.premium_membership_1y</span>
        </span>
        <span class="block text-heading font-medium flex-shrink-0">₩120,000</span>
      </button>
      <button type="button" data-ref="order_item_2" class="w-full justify-start text-left flex-start gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors border border-gray-200 dark:border-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span class="flex-center w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-lg justify-center flex-shrink-0">
          <icon name="file-text" class="text-xl text-gray-500 dark:text-gray-400"/>
        </span>
        <span class="block flex-1 min-w-0">
          <span class="flex-center gap-2 mb-1">
            <span class="font-medium text-heading">ORD20251027-1235</span>
            <span class="badge badge-yellow">$t:sirsoft-ecommerce.admin.personal_payment.status.pending</span>
          </span>
          <span class="block text-secondary text-sm">$t:sirsoft-ecommerce.admin.sample.fmt.date_name|date=2025-10-27|name=$t:sirsoft-ecommerce.admin.sample.people.lee_younghee</span>
          <span class="block text-secondary text-sm truncate">$t:sirsoft-ecommerce.admin.sample.products.standard_plan_6m</span>
        </span>
        <span class="block text-heading font-medium flex-shrink-0">₩50,000</span>
      </button>
      <button type="button" data-ref="order_item_3" class="w-full justify-start text-left flex-start gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors border border-gray-200 dark:border-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span class="flex-center w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-lg justify-center flex-shrink-0">
          <icon name="file-text" class="text-xl text-gray-500 dark:text-gray-400"/>
        </span>
        <span class="block flex-1 min-w-0">
          <span class="flex-center gap-2 mb-1">
            <span class="font-medium text-heading">ORD20251026-9876</span>
            <span class="badge badge-green">$t:sirsoft-ecommerce.admin.personal_payment.status.completed</span>
          </span>
          <span class="block text-secondary text-sm">$t:sirsoft-ecommerce.admin.sample.fmt.date_name|date=2025-10-26|name=$t:sirsoft-ecommerce.admin.sample.people.park_minsu</span>
          <span class="block text-secondary text-sm truncate">$t:sirsoft-ecommerce.admin.sample.products.basic_plan_3m</span>
        </span>
        <span class="block text-heading font-medium flex-shrink-0">₩30,000</span>
      </button>
      <button type="button" data-ref="order_item_4" class="w-full justify-start text-left flex-start gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors border border-gray-200 dark:border-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span class="flex-center w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-lg justify-center flex-shrink-0">
          <icon name="file-text" class="text-xl text-gray-500 dark:text-gray-400"/>
        </span>
        <span class="block flex-1 min-w-0">
          <span class="flex-center gap-2 mb-1">
            <span class="font-medium text-heading">ORD20251026-5432</span>
            <span class="badge badge-yellow">$t:sirsoft-ecommerce.admin.personal_payment.status.pending</span>
          </span>
          <span class="block text-secondary text-sm">$t:sirsoft-ecommerce.admin.sample.fmt.date_name|date=2025-10-26|name=$t:sirsoft-ecommerce.admin.sample.people.jung_sujin</span>
          <span class="block text-secondary text-sm truncate">$t:sirsoft-ecommerce.admin.sample.products.professional_plan_1y</span>
        </span>
        <span class="block text-heading font-medium flex-shrink-0">₩200,000</span>
      </button>
    </div>
  </modal>
</partial>
