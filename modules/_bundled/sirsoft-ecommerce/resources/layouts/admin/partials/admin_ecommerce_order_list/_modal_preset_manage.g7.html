<!-- 주문 목록 — 검색조건 프리셋 관리 창. 저장해 둔 조건 묶음의 이름을 바꾸거나 지운다. 이름 바꾸기·
  삭제·새로 저장은 각각 **다른 창**을 열고 이 창은 닫히지 않은 채 그 위에 겹친다 — 그래서 대상
  프리셋을 `_global` 에 먼저 담고 연다(창끼리는 서로의 `_local` 을 보지 못한다). -->
<partial description="Order List - Preset Management Modal">
  <modal data-type="composite" data-ref="modal_preset_manage" title="$t:sirsoft-ecommerce.admin.order.modal.preset_manage.title" size="md">
    <div data-if="{{!presets.data || presets.data.length === 0}}" class="text-center py-8 text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.admin.order.modal.preset_manage.empty</div>
    <div data-if="{{presets.data &amp;&amp; presets.data.length > 0}}" class="stack-tight">
      <div data-each="presetItem in presets.data" class="flex-between p-3 border border-gray-200 dark:border-gray-700 rounded-lg">
        <span class="text-heading">{{presetItem.name}}</span>
        <div class="flex-center gap-2">
          <button type="button" class="p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" aria-label="$t:common.edit">
            <on type="click">
              <!-- 이름 바꾸기. 반복 변수 `presetItem` 은 이 목록 안에서만 살아 있으므로, 열릴 창이 읽을 수 있도록 값을 `_global` 로 옮겨 담고 연다. -->
              <sequence>
                <set-state target="global" editingPresetId="{{presetItem.id}}" editingPresetName="{{presetItem.name}}"/>
                <open-modal target="modal_preset_edit"/>
              </sequence>
            </on>
            <icon name="pen-to-square" class="text-sm"/>
          </button>
          <button type="button" class="p-1.5 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg" aria-label="$t:common.delete">
            <on type="click">
              <!-- 삭제. 확인 창이 이름을 문장에 넣어 보여 주는데 그 창은 프리셋 목록을 따로 조회하지 않으므로, id 만이 아니라 이름도 함께 넘긴다. -->
              <sequence>
                <set-state target="global" deletingPresetId="{{presetItem.id}}" deletingPresetName="{{presetItem.name}}"/>
                <open-modal target="modal_preset_delete_confirm"/>
              </sequence>
            </on>
            <icon name="trash" class="text-sm"/>
          </button>
        </div>
      </div>
    </div>
    <div class="mt-6">
      <button type="button" class="w-full px-4 py-2 text-sm bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600">
        <on type="click">
          <open-modal target="modal_preset_save"/>
        </on>
        $t:sirsoft-ecommerce.admin.order.modal.preset_manage.add_new
      </button>
    </div>
  </modal>
</partial>
