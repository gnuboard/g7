<partial description="Order List - Preset Save Modal">
  <modal data-ref="modal_preset_save" title="$t:sirsoft-ecommerce.admin.order.modal.preset_save.title" description="$t:sirsoft-ecommerce.admin.order.modal.preset_save.description" size="sm">
    <input type="text" placeholder="$t:sirsoft-ecommerce.admin.order.modal.preset_save.placeholder" class="input" value="{{_local.presetName}}">
      <on type="input">
        <set-state target="local" presetName="{{$event.target.value}}"/>
      </on>
    </input>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 text-body border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isSaving}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{!_local.presetName || _local.presetName.trim() === '' || _global.isSaving}}">
        <on type="click">
          <set-state target="global" :isSaving="true"/>
          <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/presets" method="POST">
            <success>
              <set-state target="global" :isSaving="false"/>
              <set-state target="local" presetName=""/>
              <refetch-data-source dataSourceId="presets"/>
              <toast type="success" message="$t:sirsoft-ecommerce.messages.presets.created"/>
              <close-modal/>
            </success>
            <fail>
              <set-state target="global" :isSaving="false"/>
              <toast type="error" message="{{$error.message}}"/>
            </fail>
            <field name="body">
              <field name="target_screen" value="orders"/>
              <field name="name" value="{{_local.presetName}}"/>
              <field name="conditions">
                <field name="searchField" value="{{_global.savingPresetConditions.searchField || 'all'}}"/>
                <field name="searchKeyword" value="{{_global.savingPresetConditions.searchKeyword || ''}}"/>
                <field name="dateType" value="{{_global.savingPresetConditions.dateType || 'ordered_at'}}"/>
                <field name="startDate" value="{{_global.savingPresetConditions.startDate || ''}}"/>
                <field name="endDate" value="{{_global.savingPresetConditions.endDate || ''}}"/>
                <field name="dateQuick" value="{{_global.savingPresetConditions.dateQuick || ''}}"/>
                <field name="orderStatus" value="{{_global.savingPresetConditions.orderStatus || []}}"/>
                <field name="claimRefundStatus" value="{{_global.savingPresetConditions.claimRefundStatus || []}}"/>
                <field name="claimReturnStatus" value="{{_global.savingPresetConditions.claimReturnStatus || []}}"/>
                <field name="claimExchangeStatus" value="{{_global.savingPresetConditions.claimExchangeStatus || []}}"/>
                <field name="deliveryMethods" value="{{_global.savingPresetConditions.deliveryMethods || []}}"/>
                <field name="paymentMethods" value="{{_global.savingPresetConditions.paymentMethods || []}}"/>
                <field name="category1" value="{{_global.savingPresetConditions.category1 || ''}}"/>
                <field name="category2" value="{{_global.savingPresetConditions.category2 || ''}}"/>
                <field name="category3" value="{{_global.savingPresetConditions.category3 || ''}}"/>
                <field name="category4" value="{{_global.savingPresetConditions.category4 || ''}}"/>
                <field name="minPrice" value="{{_global.savingPresetConditions.minPrice || ''}}"/>
                <field name="maxPrice" value="{{_global.savingPresetConditions.maxPrice || ''}}"/>
                <field name="countries" value="{{_global.savingPresetConditions.countries || []}}"/>
                <field name="devices" value="{{_global.savingPresetConditions.devices || []}}"/>
              </field>
            </field>
          </api-call>
        </on>
        <icon data-if="{{_global.isSaving}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isSaving ? '$t:common.saving' : '$t:sirsoft-ecommerce.admin.order.modal.preset_save.save'}}</span>
      </button>
    </div>
  </modal>
</partial>
