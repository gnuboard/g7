<!-- 공통정보 삭제 확인 창. 지울 대상은 여는 쪽이 `_global.deleteModal` 에 담아 준 이름·id 두 값이다.
  파란 안내가 이 창의 요점이다 — 공통정보는 여러 상품이 함께 참조하므로 지우면 그 상품들에서도
  사라진다. 그래서 되돌릴 수 없다는 경고를 따로 한 줄 더 둔다.
  삭제 후 선택을 비우고 보기 모드로 되돌린다 — 지운 항목이 선택된 채 남으면 빈 상세가 뜬다. -->
<partial description="Common Info Delete Confirm Modal">
  <modal data-type="composite" data-ref="delete_confirm_modal" title="$t:sirsoft-ecommerce.admin.common_info.modal.delete.title" size="sm">
    <title-prefix>
      <div class="ecommerce:w-6 ecommerce:h-6 ecommerce:rounded-full ecommerce:bg-red-100 ecommerce:dark:bg-red-900/30 ecommerce:flex ecommerce:items-center ecommerce:justify-center ecommerce:text-center">
        <icon name="exclamation" class="ecommerce:text-base ecommerce:text-red-600 ecommerce:dark:text-red-400 ecommerce:block"/>
      </div>
    </title-prefix>
    <p class="ecommerce-text-body ecommerce:mb-3">
      <span class="ecommerce:font-semibold">'{{_global.deleteModal.itemName}}'</span>
      <span> $t:sirsoft-ecommerce.admin.common_info.modal.delete.confirm_suffix</span>
    </p>
    <div class="ecommerce:p-3 ecommerce:bg-blue-50 ecommerce:dark:bg-blue-900/20 ecommerce:rounded-lg ecommerce:mb-3">
      <div class="ecommerce-flex-start ecommerce:gap-2">
        <icon name="box" class="ecommerce:text-base ecommerce:text-blue-600 ecommerce:dark:text-blue-400 ecommerce:flex-shrink-0 ecommerce:mt-0.5"/>
        <p class="ecommerce-tone-info-soft ecommerce:text-xs">$t:sirsoft-ecommerce.admin.common_info.modal.delete.warning</p>
      </div>
    </div>
    <p class="ecommerce:text-sm ecommerce:text-red-600 ecommerce:dark:text-red-400">$t:sirsoft-ecommerce.admin.common_info.modal.delete.irreversible</p>
    <footer>
      <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce-text-body ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:hover:bg-gray-50 ecommerce:dark:hover:bg-gray-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.common_info.button.cancel
      </button>
      <button type="button" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:px-4 ecommerce:py-2 ecommerce:text-sm ecommerce:bg-red-600 ecommerce:dark:bg-red-600 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-red-700 ecommerce:dark:hover:bg-red-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <!-- 삭제 실행. 성공 갈래가 선택을 비우고 보기 모드로 되돌린 뒤 목록을 다시 부른다 — 지운 항목이 선택된 채 남으면 빈 상세가 그려진다. -->
          <sequence>
            <set-state target="global" :isDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/product-common-infos/{{_global.deleteModal.itemId}}" method="DELETE">
              <success>
                <set-state target="global" :isDeleting="false" :selectedId="null" :selectedItem="null" panelMode="view"/>
                <refetch-data-source dataSourceId="commonInfos"/>
                <toast type="success" message="{{response.message}}"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isDeleting="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="ecommerce-spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:sirsoft-ecommerce.common.deleting' : '$t:sirsoft-ecommerce.admin.common_info.button.delete'}}</span>
      </button>
    </footer>
  </modal>
</partial>
