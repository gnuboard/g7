<partial description="Common Info Copy Confirm Modal">
  <modal data-ref="copy_confirm_modal" title="$t:sirsoft-ecommerce.admin.common_info.modal.copy.title" size="sm">
    <p class="text-body text-center">$t:sirsoft-ecommerce.admin.common_info.modal.copy.message|name={{$localized(_global.selectedItem?.name)}}</p>
    <div class="modal-footer-buttons">
      <button class="px-4 py-2 text-body border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700"><on type="click"><close-modal/></on>$t:sirsoft-ecommerce.admin.common_info.button.cancel</button>
      <button class="px-4 py-2 text-sm bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg hover:bg-gray-800 dark:hover:bg-gray-100"><on type="click"><set-state target="global" panelMode="copy"/><close-modal/><emit-event event="common_info:init_copy_form"><field name="data"><field name="name" value="{{_global.selectedItem.name}}"/><field name="content" value="{{_global.selectedItem.content}}"/><field name="content_mode" value="{{_global.selectedItem.content_mode}}"/><field name="is_default" :value="false"/><field name="is_active" value="{{_global.selectedItem.is_active}}"/></field></emit-event></on>$t:sirsoft-ecommerce.admin.common_info.modal.copy.confirm</button>
    </div>
  </modal>
</partial>
