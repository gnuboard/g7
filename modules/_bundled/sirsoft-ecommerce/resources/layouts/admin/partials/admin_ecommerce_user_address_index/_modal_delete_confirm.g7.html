<!-- e2e:allow 2026-09-21 회원 배송지 화면 전면 재작성 — Playwright spec 대신 **작성자가 직접 브라우저로 관통 실측**했다(로그인 → 회원 2명 다중선택 → 28건→10건 → 「이 회원으로 검색」 10건→5건, 콘솔 오류 0). 전용 시드(저장 배송지를 가진 회원 다수 + manage 권한 운영자)가 필요해 기존 admin spec 의 시드로는 세울 수 없고, 그 시드 신설은 별도 과제다. 구조 회귀는 레이아웃 계약 테스트 18건이 막는다.

  회원 배송지 목록 — 단건 삭제 확인 창. 지울 대상은 목록이 `_global.deleteTarget` 에 담아 둔 것을
  읽는다(창은 목록의 `_local` 을 보지 못한다). 수령인·회원 이름을 함께 넘겨받는 이유는 확인 문장에
  넣어야 하는데 이 창이 배송지를 따로 조회하지 않기 때문이다.
  지우는 것은 회원이 담아 둔 기록이라 「무엇이 사라지고 무엇은 남는가」 를 본문이 분명히 말한다. -->
<partial description="User Address - Delete Confirm Modal">
  <modal data-type="composite" data-ref="modal_addresses_delete" title="$t:sirsoft-ecommerce.admin.user_addresses.modal.delete.title" size="sm">
    <div>
      <div>
        <p class="text-primary text-base">$t:sirsoft-ecommerce.admin.user_addresses.modal.delete.message|recipient={{_global.deleteTarget?.recipient_name}}|member={{_global.deleteTarget?.member_name}}</p>
        <p class="text-sm text-red-600 dark:text-red-400 font-medium">$t:sirsoft-ecommerce.admin.user_addresses.modal.delete.warning</p>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button data-testid="admin-addresses-delete-confirm" class="flex-center gap-2 px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <!-- 배송지 단건 삭제. 성공하면 대상을 비우는 것이 창 닫기보다 앞이다 — 남겨 두면 다음에 다른
               행으로 창을 열 때 이전 이름이 잠깐 보인다. 실패 사유는 창으로 세운다(토스트는 스쳐 간다) -->
          <sequence>
            <set-state target="global" :isDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/user-addresses/{{_global.deleteTarget?.id}}" method="DELETE">
              <success>
                <set-state target="global" :isDeleting="false" :deleteTarget="null"/>
                <refetch-data-source dataSourceId="addresses"/>
                <toast type="success" message="{{result.message}}"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isDeleting="false" errorMessage="{{error.message}}"/>
                <close-modal/>
                <open-modal target="modal_addresses_error"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
