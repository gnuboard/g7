<!-- 쿠폰 목록 — 쿠폰 삭제 확인 창. 발급취소(한 장 회수)와 달리 **쿠폰 자체**를 지운다.
  지울 대상은 목록이 `_global.deleteTarget` 에 담아 둔 것을 읽고, 이름을 함께 넘겨받는
  이유는 확인 문장에 넣어야 하는데 이 창이 쿠폰 목록을 따로 조회하지 않기 때문이다. -->
<partial description="Coupon - Delete Confirm Modal">
  <modal data-type="composite" data-ref="modal_delete_confirm" title="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.delete.title" size="sm">
    <div>
      <div>
        <p class="ecommerce-text-primary ecommerce:text-base">$t:sirsoft-ecommerce.admin.promotion_coupon.modal.delete.message|name={{_global.deleteTarget?.name}}</p>
        <p class="ecommerce:text-sm ecommerce:text-red-600 ecommerce:dark:text-red-400 ecommerce:font-medium">$t:sirsoft-ecommerce.admin.promotion_coupon.modal.delete.warning</p>
      </div>
    </div>
    <footer>
      <button type="button" class="ecommerce-btn ecommerce-btn-secondary" disabled="{{_global.isDeleting}}">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:px-4 ecommerce:py-2 ecommerce:bg-red-600 ecommerce:dark:bg-red-600 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-red-700 ecommerce:dark:hover:bg-red-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <!-- 쿠폰 삭제. 성공하면 대상을 비우는 것이 창 닫기보다 앞이다 — 남겨 두면 다음에 다른 쿠폰으로 창을 열 때 이전 이름이 잠깐 보인다 -->
          <sequence>
            <set-state target="global" :isDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/promotion-coupons/{{_global.deleteTarget?.id}}" method="DELETE">
              <success>
                <set-state target="global" :isDeleting="false" :deleteTarget="null"/>
                <refetch-data-source dataSourceId="coupons"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.promotion_coupon.toast.deleted"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isDeleting="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="ecommerce-spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:common.deleting' : '$t:common.delete'}}</span>
      </button>
    </footer>
  </modal>
</partial>
