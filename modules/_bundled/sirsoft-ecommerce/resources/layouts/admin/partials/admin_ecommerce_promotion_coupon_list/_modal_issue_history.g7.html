<!-- 쿠폰 목록 — 발급내역 창. 이 쿠폰이 누구에게 언제 나갔는지 보고, 아직 안 쓴 건은 회수한다.
  
  **창 안에 자기 목록이 하나 더 있다** — 그래서 페이지·페이지당 개수·회원 필터를 이 창이
  따로 들고 있고(`issueHistory*`), 값을 바꿀 때마다 `couponIssues` 데이터소스를 다시 부른다.
  쿠폰 목록 쪽 페이지 상태와는 별개다.
  
  그 상태를 `_local` 이 아니라 `_global` 에 두는 이유는 발급취소 확인 창이 겹쳐 뜰 때 그
  창도 같은 값을 읽어야 하기 때문이다(창끼리는 서로의 `_local` 을 보지 못한다). -->
<partial description="Coupon - Issue History Modal">
  <modal data-type="composite" data-ref="modal_issue_history" title="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.title" width="920px">
    <div class="flex-between mb-4">
      <div class="flex-center gap-2">
        <span class="text-label">$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.total|count={{couponIssues?.data?.pagination?.total || 0}}</span>
        <badge data-type="composite" data-if="{{_global.issueHistoryFilterUser}}" color="blue" size="sm" class="flex-center gap-1">
          <span>{{_global.issueHistoryFilterUser?.name}}</span>
          <button class="ml-1 -mr-1 p-0.5 hover:bg-blue-200 dark:hover:bg-blue-800 rounded" aria-label="$t:sirsoft-ecommerce.common.remove">
            <on type="click">
              <!-- 회원 필터 해제. 필터를 지우면서 페이지도 1로 되돌린다 — 안 되돌리면 3쪽을 보던 상태에서 전체 목록의 3쪽으로 튄다. -->
              <sequence>
                <set-state target="global" :issueHistoryFilterUser="null" :issueHistoryPage="1"/>
                <refetch-data-source dataSourceId="couponIssues"/>
              </sequence>
            </on>
            <icon name="x" class="text-xs"/>
          </button>
        </badge>
      </div>
      <select name="issueHistoryPerPage" class="w-20" value="{{String(_global.issueHistoryPerPage || 10)}}">
        <options>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </options>
        <on type="change">
          <!-- 페이지당 개수. 개수를 바꾸면 페이지도 1로 되돌린다(같은 이유). -->
          <sequence>
            <set-state target="global" issueHistoryPerPage="{{parseInt($event.target.value)}}" :issueHistoryPage="1"/>
            <refetch-data-source dataSourceId="couponIssues"/>
          </sequence>
        </on>
      </select>
    </div>
    <data-grid data-type="composite" data="{{couponIssues?.data?.data || []}}" emptyMessage="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.empty">
      <blur-until-loaded sources="couponIssues"/>
      <column field="issued_at" header="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.columns.issued_at" width="180px"/>
      <column field="user_info" header="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.columns.user" width="200px">
        <cell>
          <div class="group flex-between">
            <div class="flex flex-col">
              <div class="flex items-center gap-1">
                <icon name="user" class="text-base text-gray-400 dark:text-gray-500"/>
                <span class="font-medium text-gray-900 dark:text-white">{{row.user_name}}</span>
              </div>
            </div>
            <action-menu data-type="composite" triggerLabel="" triggerIconName="ellipsis-vertical" position="right" class="opacity-0 group-hover:opacity-100">
              <prop name="items">
                <item id="view_member" label="$t:sirsoft-ecommerce.admin.promotion_coupon.action.view_member" iconName="user"/>
                <item id="filter_by_user" label="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.action.filter_by_user" iconName="filter"/>
              </prop>
              <on event="onItemClick">
                <!-- 회원 이름을 눌렀을 때의 갈래. "회원 보기" 는 관리자 회원 화면으로 나가고, "이 회원만" 은 창을 벗어나지 않고 목록만 좁힌다 — 후자는 필터를 담고 페이지를 1로 되돌린 뒤 다시 부른다. -->
                <switch>
                  <case when="view_member">
                    <navigate path="/admin/users/{{row.user_id}}"/>
                  </case>
                  <case when="filter_by_user">
                    <set-state target="global" :issueHistoryPage="1">
                      <field name="issueHistoryFilterUser">
                        <field name="uuid" value="{{row.user_id}}"/>
                        <field name="name" value="{{row.user_name}}"/>
                      </field>
                    </set-state>
                    <refetch-data-source dataSourceId="couponIssues"/>
                  </case>
                </switch>
              </on>
            </action-menu>
          </div>
        </cell>
      </column>
      <column field="status" header="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.columns.status" width="140px">
        <cell>
          <!-- 배지가 셀 전체 너비를 차지하지 않도록 items-start 로 콘텐츠 너비만 차지 -->
          <div class="flex flex-col items-start gap-1">
            <badge data-type="composite" color="{{row.status_badge_color}}" text="{{row.status_label}}"/>
            <span data-if="{{row.used_at}}" class="form-hint">{{row.used_at}}</span>
          </div>
        </cell>
      </column>
      <column comment="사용처: 사용된 건은 주문번호 링크, 아니면 - 표시" field="order_number" header="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.columns.used_order" width="160px">
        <cell>
          <a data-if="{{!!row.order_number}}" href="/admin/ecommerce/orders/{{row.order_id}}" class="text-blue-600 dark:text-blue-400 hover:underline text-sm font-medium">{{row.order_number}}</a>
          <span data-if="{{!row.order_number}}" class="text-gray-400 dark:text-gray-500 text-sm">-</span>
        </cell>
      </column>
      <column comment="작업: 미사용(취소 가능) 건만 발급취소 버튼 노출" field="actions" header="$t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.columns.actions" width="120px">
        <cell>
          <!-- 발급취소는 쿠폰 수정 권한(서버 promotion-coupon.update)의 일이다 — 그 쿠폰 행의 can_update 를 창을 열 때 담아 둔다. -->
          <button data-ref="issue_cancel_button" data-if="{{row.is_cancellable}}" type="button" class="px-2 py-1 text-xs font-medium text-red-600 dark:text-red-400 border border-red-300 dark:border-red-600 rounded hover:bg-red-50 dark:hover:bg-red-900/20 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.issueHistoryCoupon?.can_update !== true}}">
            <on type="click">
              <!-- 발급취소 창 열기. 회수 가능한 건에만 버튼이 뜨고(그 판정은 서버가 준 값이다), 어느 발급분인지 담아 두고 연다 — 그 창은 발급내역을 따로 조회하지 않는다. -->
              <sequence>
                <set-state target="global">
                  <field name="cancelIssueTarget">
                    <field name="id" value="{{row.id}}"/>
                    <field name="user_name" value="{{row.user_name}}"/>
                  </field>
                </set-state>
                <open-modal target="modal_cancel_issue_confirm"/>
              </sequence>
            </on>
            $t:sirsoft-ecommerce.admin.promotion_coupon.modal.issue_history.action.cancel_issue
          </button>
          <span data-if="{{!row.is_cancellable}}" class="text-gray-300 dark:text-gray-600 text-sm">-</span>
        </cell>
      </column>
    </data-grid>
    <div class="mt-4 flex justify-center">
      <pagination data-type="composite" currentPage="{{couponIssues?.data?.pagination?.current_page || 1}}" totalPages="{{couponIssues?.data?.pagination?.last_page ?? null}}" hasMorePages="{{couponIssues?.data?.pagination?.has_more_pages ?? false}}" totalItems="{{couponIssues?.data?.pagination?.total || 0}}" perPage="{{couponIssues?.data?.pagination?.per_page || 10}}">
        <on event="onPageChange">
          <!-- 쪽 이동. 이 목록은 URL 을 쓰지 않는다 — 창 안의 목록이라 주소로 되돌아올 자리가 없다(바깥 목록은 URL 로 쪽을 옮긴다). -->
          <sequence>
            <set-state target="global" issueHistoryPage="{{$args[0]}}"/>
            <refetch-data-source dataSourceId="couponIssues"/>
          </sequence>
        </on>
      </pagination>
    </div>
    <div class="flex justify-end mt-6">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.close</span>
      </button>
    </div>
  </modal>
</partial>
