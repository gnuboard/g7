<!-- 분류 편집·등록 중 다른 분류를 고르려 할 때 뜨는 이탈 확인 창(브랜드·공통정보·상품정보고시와 같은 규칙, 7.1.1 출시 전).
  가려던 분류는 트리가 대기 자리(`_global.pendingCategory*`)에 잡아 두고, 이 창의 "취소하고 이동" 이 그 값을 실제 선택으로
  옮긴다 — 이 창이 **이동을 완결하는 자리**이자 **입력을 버리는 유일한 경로**이고, 여기서 옮기지 않으면 클릭이 사라진다.
  "계속 편집" 은 창만 닫는다. 이동 쪽은 폼 입력(`_local`)도 비우므로 창 닫기를 맨 뒤에 둔다(공통정보 창과 같은 순서). -->
<partial description="Category Editing Discard Confirmation Modal">
  <modal data-type="composite" data-ref="editing_confirm_modal" title="$t:sirsoft-ecommerce.admin.category.modal.editing.title" size="medium">
    <div>
      <div class="flex-start gap-3">
        <div class="flex-shrink-0 mt-0.5">
          <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400"/>
        </div>
        <div class="flex-1">
          <p class="text-primary text-base mb-2">$t:sirsoft-ecommerce.admin.category.modal.editing.message</p>
          <p class="text-label">$t:sirsoft-ecommerce.admin.category.modal.editing.confirm_message</p>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:sirsoft-ecommerce.admin.category.modal.editing.continue</span>
      </button>
      <button type="button" class="px-4 py-2 bg-red-600 dark:bg-red-600 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-700">
        <on type="click">
          <!-- 입력을 버리고 대기 중이던 분류로 이동 — 대기 값을 실제 선택으로 옮기고 주소도 그 분류로 갈아끼운 뒤(대기 값을 비우기 전에),
            폼 입력·오류를 비우고 창을 닫는다. 대기 값이 없으면(트리 밖에서 열린 경우) 선택을 비운다. -->
          <sequence>
            <replace-url if="{{!!_global.pendingCategoryId}}" :mergeQuery="true">
              <query id="{{_global.pendingCategoryId}}" mode="view"/>
            </replace-url>
            <set-state target="global" selectedCategoryId="{{_global.pendingCategoryId}}" selectedCategory="{{_global.pendingCategory}}" panelMode="view" :pendingCategoryId="null" :pendingCategory="null"/>
            <set-state target="local" :form="null" :errors="null" :isSaving="false"/>
            <close-modal/>
          </sequence>
        </on>
        <span>$t:sirsoft-ecommerce.admin.category.modal.editing.discard</span>
      </button>
    </div>
  </modal>
</partial>
