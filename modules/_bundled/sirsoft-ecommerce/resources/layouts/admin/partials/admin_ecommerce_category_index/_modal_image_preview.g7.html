      <button type="button" class="btn btn-outline"><on type="click"><close-modal target="modal_image_preview"/></on>$t:sirsoft-ecommerce.admin.category.modal.image_preview.close</button>
    </footer>
    <div class="flex-center w-full justify-center bg-gray-50 dark:bg-gray-900 rounded-lg overflow-hidden">

  </modal>
</partial>
