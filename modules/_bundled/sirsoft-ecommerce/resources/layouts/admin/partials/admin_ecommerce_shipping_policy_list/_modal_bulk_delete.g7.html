<partial description="Shipping Policy Bulk Delete Confirmation Modal">
  <modal data-ref="bulk_delete_modal" title="$t:sirsoft-ecommerce.admin.shipping_policy.modal.bulk_delete.title" size="medium">
    <div>
      <div>
        <p class="text-gray-700 dark:text-gray-300">$t:sirsoft-ecommerce.admin.shipping_policy.modal.bulk_delete.message|count={{(_global.bulkSelectedItems || []).length}}</p>
        <div class="alert-warning">
          <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0 mt-0.5"/>
          <div class="text-warning-soft">
            <p>$t:sirsoft-ecommerce.admin.shipping_policy.modal.bulk_delete.warning</p>
            <p class="mt-1">$t:sirsoft-ecommerce.admin.shipping_policy.modal.bulk_delete.product_warning</p>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isBulkDeleting}}"><on type="click"><close-modal/></on>$t:sirsoft-ecommerce.admin.shipping_policy.common.cancel</button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isBulkDeleting}}">
        <on type="click">
          <set-state target="global" :isBulkDeleting="true"/>
          <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/shipping-policies/bulk" method="DELETE">
            <success>
              <set-state target="global" :isBulkDeleting="false" :bulkSelectedItems="[]"/>
              <refetch-data-source dataSourceId="shipping_policies"/>
              <toast type="success" message="$t:sirsoft-ecommerce.admin.shipping_policy.messages.bulk_deleted"/>
              <close-modal/>
            </success>
            <fail>
              <set-state target="global" :isBulkDeleting="false"/>
              <toast type="error" message="{{$error.message}}"/>
            </fail>
            <body ids="{{_global.bulkSelectedItems}}"/>
          </api-call>
        </on>
        <icon data-if="{{_global.isBulkDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isBulkDeleting ? '$t:sirsoft-ecommerce.admin.shipping_policy.common.deleting' : '$t:sirsoft-ecommerce.admin.shipping_policy.common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
