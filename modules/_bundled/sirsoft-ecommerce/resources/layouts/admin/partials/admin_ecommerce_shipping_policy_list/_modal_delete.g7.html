<!-- 배송정책 한 건을 지우는 확인 창. 대상은 목록이 `_global.targetPolicy` 에 담아 준 정책이고,
  이름을 회색 상자로 다시 보여 줘 무엇을 지우는지 확인시킨다.
  경고 두 줄은 일괄 삭제 창과 같다 — 되돌릴 수 없고, 그 정책을 쓰던 상품이 배송비 기준을 잃는다.
  성공하면 대상을 비운다(지운 정책이 남아 있으면 창을 다시 열었을 때 없는 것을 가리킨다). -->
<partial description="Shipping Policy Delete Confirmation Modal">
  <modal data-type="composite" data-ref="delete_modal" title="$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.title" size="medium">
    <div>
      <p class="ecommerce:text-gray-700 ecommerce:dark:text-gray-300">$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.message</p>
      <div class="ecommerce:bg-gray-50 ecommerce:dark:bg-gray-700/50 ecommerce:rounded-lg ecommerce:p-4">
        <span class="ecommerce-text-primary ecommerce:font-medium">{{_global.targetPolicy?.name_localized}}</span>
      </div>
      <div class="ecommerce-alert-warning">
        <icon name="triangle-exclamation" class="ecommerce:text-xl ecommerce:text-amber-600 ecommerce:dark:text-amber-400 ecommerce:flex-shrink-0 ecommerce:mt-0.5"/>
        <div class="ecommerce-tone-warning-soft ecommerce:text-xs">
          <p>$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.warning</p>
          <p class="ecommerce:mt-1">$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.product_warning</p>
        </div>
      </div>
    </div>
    <div class="ecommerce-modal-footer-buttons">
      <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:text-gray-700 ecommerce:dark:text-gray-300 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:hover:bg-gray-50 ecommerce:dark:hover:bg-gray-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.shipping_policy.common.cancel
      </button>
      <button type="button" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:px-4 ecommerce:py-2 ecommerce:bg-red-600 ecommerce:dark:bg-red-600 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-red-700 ecommerce:dark:hover:bg-red-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <!-- 삭제 실행. 성공 갈래가 대상을 비운 뒤 목록을 다시 부른다. -->
          <sequence>
            <set-state target="global" :isDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/shipping-policies/{{_global.targetPolicy?.id}}" method="DELETE">
              <success>
                <set-state target="global" :isDeleting="false" :targetPolicy="null"/>
                <refetch-data-source dataSourceId="shipping_policies"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.shipping_policy.messages.deleted"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isDeleting="false"/>
                <toast type="error" message="{{error.message}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="ecommerce-spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:sirsoft-ecommerce.admin.shipping_policy.common.deleting' : '$t:sirsoft-ecommerce.admin.shipping_policy.common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
