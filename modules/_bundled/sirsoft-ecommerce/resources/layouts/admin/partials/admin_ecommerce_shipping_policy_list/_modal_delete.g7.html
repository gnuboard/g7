<partial description="Shipping Policy Delete Confirmation Modal">
  <modal data-ref="delete_modal" title="$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.title" size="medium">
    <div>
      <p class="text-gray-700 dark:text-gray-300">$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.message</p>
      <div class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-4">
        <span class="text-primary font-medium">{{_global.targetPolicy?.name_localized}}</span>
      </div>
      <div class="alert-warning">
        <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400 flex-shrink-0 mt-0.5"/>
        <div class="text-warning-soft">
          <p>$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.warning</p>
          <p class="mt-1">$t:sirsoft-ecommerce.admin.shipping_policy.modal.delete.product_warning</p>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}"><on type="click"><close-modal/></on>$t:sirsoft-ecommerce.admin.shipping_policy.common.cancel</button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isDeleting}}">
        <on type="click">
          <set-state target="global" :isDeleting="true"/>
          <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/shipping-policies/{{_global.targetPolicy?.id}}" method="DELETE">
            <success>
              <set-state target="global" :isDeleting="false" :targetPolicy="null"/>
              <refetch-data-source dataSourceId="shipping_policies"/>
              <toast type="success" message="$t:sirsoft-ecommerce.admin.shipping_policy.messages.deleted"/>
              <close-modal/>
            </success>
            <fail>
              <set-state target="global" :isDeleting="false"/>
              <toast type="error" message="{{$error.message}}"/>
            </fail>
          </api-call>
        </on>
        <icon data-if="{{_global.isDeleting}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isDeleting ? '$t:sirsoft-ecommerce.admin.shipping_policy.common.deleting' : '$t:sirsoft-ecommerce.admin.shipping_policy.common.delete'}}</span>
      </button>
    </div>
  </modal>
</partial>
