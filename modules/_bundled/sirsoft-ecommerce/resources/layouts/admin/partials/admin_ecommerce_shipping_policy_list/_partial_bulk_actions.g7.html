<!-- 배송정책 목록의 일괄 작업 줄 — 체크한 건수와 두 작업(일괄 삭제·상태 일괄 적용).
  **체크한 항목은 전역, 고른 상태는 지역**에 있다. 체크는 표와 확인 창이 함께 봐야 하지만 상태
  선택은 이 줄에서만 쓰기 때문이다. 그래서 [적용]을 누를 때 그 값을 전역으로 한 번 옮겨 준다 —
  확인 창이 지역 상태에 손이 닿지 않는다.
  두 버튼 모두 서버 권한(`abilities`)까지 함께 본다 — 삭제 권한과 수정 권한이 갈린다.
  이 줄은 아무것도 실행하지 않는다. 실제 처리는 각 확인 창의 몫이다. -->
<partial description="Shipping Policy List Bulk Actions Bar">
  <div data-ref="bulk_action_bar" class="ecommerce-flex-center ecommerce:bg-gray-100 ecommerce:dark:bg-gray-700/50 ecommerce:border ecommerce:border-gray-200 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:p-3 ecommerce:mb-4 ecommerce:flex-wrap ecommerce:gap-3">
    <span class="ecommerce-text-body ecommerce:font-medium ecommerce:whitespace-nowrap">$t:sirsoft-ecommerce.admin.shipping_policy.bulk.selected_count|count={{(_global.bulkSelectedItems || []).length}}</span>
    <div class="ecommerce-flex-center ecommerce:gap-2">
      <select name="bulkToggleValue" aria-label="$t:sirsoft-ecommerce.admin.shipping_policy.table.column.is_active" class="ecommerce:w-36 ecommerce:px-3 ecommerce:py-1.5 ecommerce:text-sm ecommerce:bg-white ecommerce:dark:bg-gray-700 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:disabled:opacity-50" value="{{_local.bulkToggleValue || ''}}" disabled="{{!_global.bulkSelectedItems || _global.bulkSelectedItems.length === 0 || shipping_policies?.data?.abilities?.can_update !== true}}">
        <options>
          <option value="" disabled>$t:sirsoft-ecommerce.admin.shipping_policy.bulk.select_status</option>
          <option value="true">$t:sirsoft-ecommerce.admin.shipping_policy.bulk.toggle_active</option>
          <option value="false">$t:sirsoft-ecommerce.admin.shipping_policy.bulk.toggle_inactive</option>
        </options>
        <on type="change">
          <!-- 바꿀 상태 고르기 — 지역에만 담는다. 값이 `'true'`/`'false'` 라는 **글자**이고, 확인 창도 그 글자로 비교한다. -->
          <set-state target="_local" bulkToggleValue="{{$event.target.value}}"/>
        </on>
      </select>
    </div>
    <div class="ecommerce:flex-1"/>
    <button type="button" class="ecommerce:px-3 ecommerce:py-1.5 ecommerce:text-sm ecommerce:border ecommerce:border-red-300 ecommerce:dark:border-red-600 ecommerce:text-red-700 ecommerce:dark:text-red-400 ecommerce:rounded-lg ecommerce:hover:bg-red-50 ecommerce:dark:hover:bg-red-900/20 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{!_global.bulkSelectedItems || _global.bulkSelectedItems.length === 0 || shipping_policies?.data?.abilities?.can_delete !== true}}">
      <on type="click">
        <open-modal target="bulk_delete_modal"/>
      </on>
      $t:sirsoft-ecommerce.admin.shipping_policy.action.bulk_delete
    </button>
    <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce:bg-blue-600 ecommerce:dark:bg-blue-600 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-blue-700 ecommerce:dark:hover:bg-blue-700 ecommerce:font-medium ecommerce:transition-colors ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{!_global.bulkSelectedItems || _global.bulkSelectedItems.length === 0 || !_local.bulkToggleValue || shipping_policies?.data?.abilities?.can_update !== true}}">
      <on type="click">
        <!-- [적용] — 고른 상태를 전역으로 옮긴 뒤 확인 창을 연다. 창은 지역 상태를 볼 수 없으므로 이 옮겨 담기가 빠지면 창의 미리보기 배지가 늘 '중지' 로 보인다. -->
        <sequence>
          <set-state target="global" bulkToggleValue="{{_local.bulkToggleValue}}"/>
          <open-modal target="bulk_toggle_modal"/>
        </sequence>
      </on>
      $t:sirsoft-ecommerce.admin.shipping_policy.action.bulk_apply
    </button>
  </div>
</partial>
