<!-- 할인코드 사용 상태를 바꾸기 전 확인받는 창.
  **아직 시안이다** — 확인 버튼이 창을 닫기만 하고, 대상 코드도 바꿀 상태도 넘겨받지 않는다.
  옆 삭제 확인 창(`_modal_delete_confirm`)과 같은 상태다. -->
<partial description="Discount Code Status Change Modal">
  <modal data-type="composite" data-ref="modal_status_change" title="$t:sirsoft-ecommerce.admin.promotion_discount_code.modal.status_change.title" size="sm">
    <footer>
      <button type="button" class="btn btn-outline">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.promotion_discount_code.modal.status_change.cancel
      </button>
      <button type="button" class="btn btn-primary">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.promotion_discount_code.modal.status_change.confirm
      </button>
    </footer>
    <p class="text-sm text-secondary">$t:sirsoft-ecommerce.admin.promotion_discount_code.modal.status_change.description</p>
  </modal>
</partial>
