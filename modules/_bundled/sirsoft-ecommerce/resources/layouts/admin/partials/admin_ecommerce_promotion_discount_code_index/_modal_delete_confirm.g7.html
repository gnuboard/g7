<!-- 할인코드 삭제 확인 창.
  **아직 시안이다** — 확인 버튼이 창을 닫기만 하고 삭제 요청을 보내지 않으며, 어떤 코드를 지우는지도
  넘겨받지 않는다.
  배선된 형태는 다른 화면의 같은 성격 창들을 참고하면 된다 — 대상은 여는 쪽이 `_global.modal_data`
  에 담아 주고, 실행 후 목록 재조회와 선택 비우기가 뒤따른다. -->

      <button type="button" class="btn btn-primary">

          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.promotion_discount_code.modal.delete.confirm
      </button>
    </footer>
    <p class="text-sm text-secondary">$t:sirsoft-ecommerce.admin.promotion_discount_code.modal.delete.description</p>
