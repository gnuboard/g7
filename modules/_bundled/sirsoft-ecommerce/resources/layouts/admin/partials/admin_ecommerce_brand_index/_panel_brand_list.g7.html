<!-- 브랜드 화면 왼쪽 목록. 검색·정렬·선택·노출토글을 다 쥐고 있고, 오른쪽 패널은 여기서 정한
  `_global.selectedBrandId` 를 따라 움직인다.
  **검색과 정렬은 화면 상태가 아니라 URL 로 간다** — 주소를 그대로 붙여넣으면 같은 목록이 나오고,
  뒤로가기가 이전 검색으로 돌아간다. 반면 어떤 브랜드를 골랐는지는 주소를 갈아끼우기만 해서
  (`replace-url`) 뒤로가기 이력에 쌓이지 않는다 — 목록을 훑는 동안 이력이 브랜드 수만큼 늘어나는
  것을 막는 선택이다.
  드래그 정렬은 꺼 두었다(`enableDrag=false`). 브랜드 순서는 정렬 조건이 정하지 손으로 끌어
  바꾸는 값이 아니다. -->
<partial description="Brand List Panel - Left Sidebar with Search/Sort">
  <div data-ref="brand_list_panel" class="ecommerce-admin-card ecommerce:col-span-1 ecommerce:flex ecommerce:flex-col">
    <div data-ref="brand_list_header" class="ecommerce:px-4 ecommerce-panel-header ecommerce-flex-between">
      <div class="ecommerce-flex-center ecommerce:gap-2">
        <icon name="tag" class="ecommerce:text-xl ecommerce:text-gray-700 ecommerce:dark:text-gray-300"/>
        <h3 class="ecommerce-text-heading">$t:sirsoft-ecommerce.admin.brand.list.title</h3>
        <span class="ecommerce:px-2 ecommerce:py-0.5 ecommerce:text-xs ecommerce:font-medium ecommerce:rounded-full ecommerce:bg-gray-100 ecommerce:dark:bg-gray-700 ecommerce:text-gray-700 ecommerce:dark:text-gray-300">{{brands?.data?.data?.length ?? 0}}</span>
      </div>
    </div>
    <div data-ref="search_sort_area" class="ecommerce:px-4 ecommerce-panel-header">
      <div class="ecommerce:flex ecommerce:flex-col ecommerce:gap-3">
        <responsive on="768-" class="ecommerce:flex ecommerce:flex-row ecommerce:gap-3 ecommerce:flex-wrap ecommerce:items-center"/>
        <div class="ecommerce:flex-1 ecommerce:min-w-0">
          <search-bar data-type="composite" placeholder="$t:sirsoft-ecommerce.admin.brand.list.search_placeholder" value="{{query.search || ''}}" class="ecommerce:w-full">
            <on type="submit">
              <!-- 검색어를 URL 에 실어 다시 들어간다. `mergeQuery` 로 기존 조건을 남기면서도 정렬을
                명시로 다시 넣는 이유는, 정렬이 없던 주소에서 검색했을 때 기본값이 URL 에도 박혀
                이후 정렬 변경이 같은 자리를 덮어쓰게 하기 위해서다. -->
              <navigate path="/admin/ecommerce/brands" :mergeQuery="true">
                <query search="{{$event.target.search.value}}" sort="{{query.sort || 'name_asc'}}"/>
              </navigate>
            </on>
          </search-bar>
        </div>
        <div class="ecommerce:shrink-0">
          <select name="sortOrder" aria-label="$t:common.sort_order" class="ecommerce:h-9" value="{{query.sort || 'name_asc'}}">
            <responsive on="768-" class-merge="ecommerce:shrink-0"/>
            <options>
              <option value="name_asc">$t:sirsoft-ecommerce.admin.brand.list.sort.name_asc</option>
              <option value="name_desc">$t:sirsoft-ecommerce.admin.brand.list.sort.name_desc</option>
              <option value="created_desc">$t:sirsoft-ecommerce.admin.brand.list.sort.created_desc</option>
              <option value="created_asc">$t:sirsoft-ecommerce.admin.brand.list.sort.created_asc</option>
            </options>
            <on type="change">
              <!-- 정렬 변경도 URL 로 간다. 검색 쪽과 달리 `mergeQuery` 없이 두 값을 통째로 다시 쓰므로,
                브랜드 선택 같은 다른 파라미터는 여기서 떨어져 나간다 — 정렬을 바꾸면 오른쪽 패널
                선택이 풀리는 것이 그 결과다. -->
              <navigate path="/admin/ecommerce/brands" :mergeQuery="true">
                <query search="{{query.search}}" sort="{{$event.target.value}}"/>
              </navigate>
            </on>
          </select>
        </div>
      </div>
    </div>
    <div>
      <sortable-menu-list data-type="composite" data-ref="sortable_brand_list" itemHref="/admin/ecommerce/brands?id={{row.id}}&amp;mode=view" :itemHrefMergeQuery="true" data-if="{{(brands?.data?.data?.length ?? 0) > 0}}" items="{{brands?.data?.data ?? []}}" selectedId="{{_global.selectedBrandId}}" class="ecommerce:p-2 ecommerce:max-h-[calc(90vh-140px)] ecommerce:overflow-y-auto" itemClassName="ecommerce:py-1 ecommerce:px-5 ecommerce:mb-1 ecommerce:rounded-lg ecommerce:border" itemSelectedClassName="ecommerce:bg-blue-50 ecommerce:dark:bg-blue-900/30 ecommerce:border-blue-500" itemDefaultClassName="ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:border-gray-200 ecommerce:dark:border-gray-700 ecommerce:hover:border-gray-300 ecommerce:dark:hover:border-gray-600" :enableDrag="false" toggleDisabled="{{brands?.data?.abilities?.can_update !== true}}">
        <on type="action" event="onSelect">
          <!-- 브랜드 선택 — 목록이 이미 들고 있는 행 전체(`$args[0]`)를 그대로 전역에 옮긴다. 오른쪽
            보기 패널은 이 값을 읽어 그리므로 상세를 따로 부르지 않는다(목록 응답에 없는 필드는
            상세에도 없다는 뜻이다).
            주소는 `replace-url` 로 갈아끼운다 — 새로고침·공유에는 선택이 남지만 뒤로가기 이력에는
            쌓이지 않는다. -->
          <sequence>
            <!-- 편집·등록 중이면 곧바로 넘어가지 않고 고른 브랜드를 대기 자리(_global.pendingBrand*)에 두고 이탈 확인 창을 연다 —
              이동을 완결하는 것은 그 창이다(공통정보·고시 목록과 같은 규칙, 7.1.1 출시 전 실측). -->
            <switch on="{{_global.panelMode === 'edit' || _global.panelMode === 'create'}}">
              <case when="true">
                <set-state target="global" pendingBrandId="{{$args[0].id}}" pendingBrand="{{$args[0]}}"/>
                <open-modal target="editing_confirm_modal"/>
              </case>
              <case when="false">
                <set-state target="global" selectedBrandId="{{$args[0].id}}" selectedBrand="{{$args[0]}}" panelMode="view"/>
                <!-- 선택 상태만 주소에 기록한다 — 왼쪽 목록에 걸어둔 검색어·정렬은 그대로 둔다. 병합하지 않으면 항목을 고르는 순간 목록이 초기화된다 (공개 #75). -->
                <replace-url :mergeQuery="true">
                  <query id="{{$args[0].id}}" mode="view"/>
                </replace-url>
              </case>
            </switch>
          </sequence>
        </on>
        <on type="action" event="onToggleStatus">
          <!-- 행의 노출 스위치. **실패 갈래에서도 목록을 다시 부른다** — 토글은 화면에서 먼저 넘어가
            버리므로, 서버가 거부했을 때 되돌려 놓지 않으면 꺼진 브랜드가 켜진 것처럼 남는다.
            그 되돌리기를 손으로 계산하지 않고 목록 재조회로 처리하는 것이 이 두 갈래의 요점이다. -->
          <sequence>
            <set-state target="global" :isTogglingStatus="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/brands/{{$args[0]}}/toggle-status" method="PATCH">
              <success>
                <set-state target="global" :isTogglingStatus="false"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.brand.messages.status_changed"/>
                <refetch-data-source dataSourceId="brands"/>
              </success>
              <fail>
                <set-state target="global" :isTogglingStatus="false"/>
                <toast type="error" message="{{error.message}}"/>
                <refetch-data-source dataSourceId="brands"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <on event="mount">
          <action handler="sirsoft-ecommerce.initBrandFromUrl"/>
        </on>
      </sortable-menu-list>
    </div>
    <div data-ref="empty_brand_state" data-if="{{brands !== undefined &amp;&amp; ((brands?.data?.data?.length ?? 0) === 0)}}" class="ecommerce-flex-center ecommerce:flex-1 ecommerce:justify-center ecommerce:gap-3 ecommerce:px-4">
      <icon name="tag" class="ecommerce:text-xl ecommerce:text-gray-500 ecommerce:dark:text-gray-500"/>
      <p class="ecommerce-text-label-subtle">$t:sirsoft-ecommerce.admin.brand.list.empty</p>
    </div>
  </div>
</partial>
