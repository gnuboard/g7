<partial>
  <div data-ref="issue_settings_section" class="admin-card">
    <h2 class="card-title">$t:sirsoft-ecommerce.admin.promotion_coupon.form.section.issue_settings</h2>
    <div class="space-y-5">
      <!-- 발급수량 -->
      <form-field data-ref="field_issue_quantity" label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.field.issue_quantity" error="{{_local.errors?.total_quantity?.[0] ?? ''}}">
        <div>
          <div>
            <radio-group value="{{_local.issue_quantity_type}}" :inline="true">
              <responsive on="mobile" :inline="false"/>
              <prop name="options">
                <item label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.option.unlimited" value="unlimited"/>
                <item label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.option.issue_quantity_limited" value="limited"/>
              </prop>
              <on type="change">
                <sequence>
                  <set-state target="_local" issue_quantity_type="{{$event.target.value}}"/>
                  <set-state target="_local" form.total_quantity="{{$event.target.value === 'unlimited' ? null : _local.form?.total_quantity}}"/>
                </sequence>
              </on>
            </radio-group>
            <!-- 수량제한 시: 수량 입력 -->
            <div data-ref="issue_quantity_input" data-if="{{_local.issue_quantity_type === 'limited'}}" class="flex-center gap-2">
              <input type="number" name="total_quantity" class="input w-32" :min="1"/>
              <span class="text-label">$t:sirsoft-ecommerce.admin.promotion_coupon.form.hint.unit_quantity</span>
            </div>
          </div>
        </div>
      </form-field>
      <!-- 발급기간 -->
      <form-field data-ref="field_issue_period" label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.field.issue_period" error="{{_local.errors?.issue_from?.[0] ?? _local.errors?.issue_to?.[0] ?? ''}}">
        <div>
          <div>
            <radio-group value="{{_local.issue_period_type}}" :inline="true">
              <responsive on="mobile" :inline="false"/>
              <prop name="options">
                <item label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.option.unlimited" value="unlimited"/>
                <item label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.option.issue_period_limited" value="limited"/>
              </prop>
              <on type="change">
                <sequence>
                  <set-state target="_local" issue_period_type="{{$event.target.value}}"/>
                  <set-state target="_local" form.issue_from="{{$event.target.value === 'unlimited' ? null : _local.form?.issue_from}}" form.issue_to="{{$event.target.value === 'unlimited' ? null : _local.form?.issue_to}}"/>
                </sequence>
              </on>
            </radio-group>
            <!-- 기간설정 시: 시작일 ~ 종료일. flex-center 는 nowrap 이고 datetime-local 입력이 각 208px(w-52) 이라 좁은 뷰포트에서 행이 콘텐츠 영역을 넘친다 → portable 에서 줄바꿈 + 입력 전폭. -->
            <div data-ref="issue_period_range" data-if="{{_local.issue_period_type === 'limited'}}" class="flex-center gap-2">
              <responsive on="portable" class="flex-center flex-wrap gap-2"/>
              <input type="datetime-local" name="issue_from" class="input w-52">
                <responsive on="portable" type="datetime-local" name="issue_from" class="input w-full"/>
              </input>
              <span class="text-label-subtle">~</span>
              <input type="datetime-local" name="issue_to" class="input w-52">
                <responsive on="portable" type="datetime-local" name="issue_to" class="input w-full"/>
              </input>
            </div>
          </div>
        </div>
      </form-field>
      <!-- 재발급 (중복 다운로드) -->
      <form-field data-ref="field_reissue" label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.field.reissue" error="{{_local.errors?.per_user_limit?.[0] ?? ''}}">
        <div>
          <div>
            <radio-group value="{{_local.reissue_type}}" :inline="true">
              <responsive on="mobile" :inline="false"/>
              <prop name="options">
                <item label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.option.unlimited" value="unlimited"/>
                <item label="$t:sirsoft-ecommerce.admin.promotion_coupon.form.option.reissue_limited" value="limited"/>
              </prop>
              <on type="change">
                <sequence>
                  <set-state target="_local" reissue_type="{{$event.target.value}}"/>
                  <set-state target="_local" form.per_user_limit="{{$event.target.value === 'unlimited' ? 0 : (_local.form?.per_user_limit || 1)}}"/>
                </sequence>
              </on>
            </radio-group>
            <!-- 제한 시: 횟수 입력 -->
            <div data-ref="reissue_limit_input" data-if="{{_local.reissue_type === 'limited'}}" class="flex-center gap-2">
              <span class="text-label">$t:sirsoft-ecommerce.admin.promotion_coupon.form.hint.per_user</span>
              <input type="number" name="per_user_limit" class="input w-24" :min="1"/>
              <span class="text-label">$t:sirsoft-ecommerce.admin.promotion_coupon.form.hint.unit_times</span>
            </div>
          </div>
        </div>
      </form-field>
    </div>
  </div>
</partial>
