<!-- 상품 폼 — 상품 복사 창. 원본의 어느 구획을 가져올지 고른 뒤 등록 폼을 복사 진입으로 연다.
  고른 항목은 폼이 들고 있어야 하므로(창이 아니라 그쪽이 복사 주소를 만든다) `$parent` 로 건너
  써넣고, 원본 미리보기도 같은 경로로 폼의 값을 읽는다. -->
<partial description="Product Form - Copy Product Modal">
  <modal data-type="composite" data-ref="modal_copy_product" title="$t:sirsoft-ecommerce.admin.product.modal.copy.title" size="md">
    <div>
      <div data-ref="copy_source_info" class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4">
        <div class="flex-center gap-3">
          <div data-if="{{$parent._local.form.images?.length > 0}}" class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0">
            <img src="{{$parent._local.form.images?.[0]?.download_url}}" alt="{{$localized($parent._local.form.name)}}" class="w-full h-full object-cover"/>
          </div>
          <div data-if="{{!$parent._local.form.images?.length}}" class="flex-center w-12 h-12 rounded-lg bg-gray-200 dark:bg-gray-700 justify-center flex-shrink-0">
            <icon name="image" class="text-2xl text-gray-400 dark:text-gray-500"/>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-primary font-medium truncate">{{$localized($parent._local.form.name) || '$t:sirsoft-ecommerce.admin.product.modal.copy.no_name'}}</p>
            <p class="text-label-subtle">{{$parent._local.form.product_code ?? ''}}</p>
          </div>
        </div>
      </div>
      <div data-ref="copy_options_section">
        <p class="text-body font-medium">$t:sirsoft-ecommerce.admin.product.modal.copy.options_label</p>
        <div data-ref="copy_option_images" class="flex-center gap-3">
          <checkbox name="copy_images" checked="{{$parent._local.ui.copyOptions?.images ?? true}}">
            <on type="change">
              <!-- 이미지 — 원본 파일을 복사해 새 상품에 붙인다(가리키기만 하면 원본을 지울 때 함께 사라진다) -->
              <set-state target="$parent._local" ui.copyOptions.images="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_images</label>
        </div>
        <div data-ref="copy_option_options" class="flex-center gap-3">
          <checkbox name="copy_options" checked="{{$parent._local.ui.copyOptions?.options ?? true}}">
            <on type="change">
              <!-- 옵션 — 조합과 추가금까지 가져오되 재고는 따라오지 않는다 -->
              <set-state target="$parent._local" ui.copyOptions.options="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_product_options</label>
        </div>
        <div data-ref="copy_option_categories" class="flex-center gap-3">
          <checkbox name="copy_categories" checked="{{$parent._local.ui.copyOptions?.categories ?? true}}">
            <on type="change">
              <!-- 분류 -->
              <set-state target="$parent._local" ui.copyOptions.categories="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_categories</label>
        </div>
        <div data-ref="copy_option_sales_info" class="flex-center gap-3">
          <checkbox name="copy_sales_info" checked="{{$parent._local.ui.copyOptions?.sales_info ?? true}}">
            <on type="change">
              <!-- 판매정보 — 가격·판매상태 -->
              <set-state target="$parent._local" ui.copyOptions.sales_info="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_sales_info</label>
        </div>
        <div data-ref="copy_option_description" class="flex-center gap-3">
          <checkbox name="copy_description" checked="{{$parent._local.ui.copyOptions?.description ?? true}}">
            <on type="change">
              <!-- 상세설명 -->
              <set-state target="$parent._local" ui.copyOptions.description="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_description</label>
        </div>
        <div data-ref="copy_option_notice" class="flex-center gap-3">
          <checkbox name="copy_notice" checked="{{$parent._local.ui.copyOptions?.notice ?? true}}">
            <on type="change">
              <!-- 상품정보제공고시 -->
              <set-state target="$parent._local" ui.copyOptions.notice="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_notice</label>
        </div>
        <div data-ref="copy_option_common_info" class="flex-center gap-3">
          <checkbox name="copy_common_info" checked="{{$parent._local.ui.copyOptions?.common_info ?? true}}">
            <on type="change">
              <!-- 공통정보 -->
              <set-state target="$parent._local" ui.copyOptions.common_info="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_common_info</label>
        </div>
        <div data-ref="copy_option_other_info" class="flex-center gap-3">
          <checkbox name="copy_other_info" checked="{{$parent._local.ui.copyOptions?.other_info ?? true}}">
            <on type="change">
              <!-- 기타정보 -->
              <set-state target="$parent._local" ui.copyOptions.other_info="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_other_info</label>
        </div>
        <div data-ref="copy_option_shipping" class="flex-center gap-3">
          <checkbox name="copy_shipping" checked="{{$parent._local.ui.copyOptions?.shipping ?? true}}">
            <on type="change">
              <!-- 배송정보 -->
              <set-state target="$parent._local" ui.copyOptions.shipping="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_shipping</label>
        </div>
        <div data-ref="copy_option_seo" class="flex-center gap-3">
          <checkbox name="copy_seo" checked="{{$parent._local.ui.copyOptions?.seo ?? false}}">
            <on type="change">
              <!-- SEO — 혼자 기본이 꺼져 있다. 같은 제목·설명이 둘로 노출되면 검색엔진이 중복으로 본다 -->
              <set-state target="$parent._local" ui.copyOptions.seo="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_seo</label>
        </div>
        <div data-ref="copy_option_identification" class="flex-center gap-3">
          <checkbox name="copy_identification" checked="{{$parent._local.ui.copyOptions?.identification ?? true}}">
            <on type="change">
              <!-- 식별코드 — 바코드처럼 상품마다 고유해야 하는 값은 서버가 복사에서 걸러 낸다 -->
              <set-state target="$parent._local" ui.copyOptions.identification="{{$event.target.checked}}"/>
            </on>
          </checkbox>
          <label class="text-label cursor-pointer">$t:sirsoft-ecommerce.admin.product.modal.copy.option_identification</label>
        </div>
      </div>
      <div data-ref="copy_note" class="alert-info">
        <div class="flex-start gap-2">
          <icon name="info-circle" class="text-base text-blue-500 dark:text-blue-400 flex-shrink-0 mt-0.5"/>
          <p class="text-info-soft">$t:sirsoft-ecommerce.admin.product.modal.copy.note</p>
        </div>
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isCopyingProduct}}">
          <on type="click">
            <close-modal target="modal_copy_product"/>
          </on>
          <span>$t:sirsoft-ecommerce.common.cancel</span>
        </button>
        <button type="button" class="flex-center gap-2 px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isCopyingProduct}}">
          <on type="click">
            <!-- 복사 시작 — 진행 표시를 전역에 두는 것은 이 창과 그 뒤 폼이 같은 값을 봐야 하기 때문이다. 실제 이동은 핸들러가 고른 항목을 쿼리로 엮어 처리한다 -->
            <sequence>
              <set-state target="global" :isCopyingProduct="true"/>
              <action handler="sirsoft-ecommerce.copyProduct"/>
            </sequence>
          </on>
          <icon data-if="{{_global.isCopyingProduct}}" name="spinner" class="spinner-sm"/>
          <span>{{_global.isCopyingProduct ? '$t:sirsoft-ecommerce.common.processing' : '$t:sirsoft-ecommerce.admin.product.modal.copy.submit'}}</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
