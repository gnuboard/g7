<!-- 상품 폼 — 삭제 확인. 폼이 열기 전에 서버에 물어 둔 삭제 가능 여부(`_global.deleteProduct`)로
  두 얼굴을 갖는다 — 지울 수 있으면 무엇을 지우는지 보여 주고, 못 지우면 그 사유를 보여 준다. -->
<partial description="Product Form - Delete Confirmation Modal">
  <modal data-type="composite" data-ref="modal_delete_confirm" title="$t:sirsoft-ecommerce.admin.product.modal.delete.title" size="sm">
    <!-- 삭제 가능 분기 — 목록 모달과 동일하게 can-delete 선행 결과로 분기 -->
    <div data-if="{{_global.deleteProduct?.canDelete}}">
      <div class="ecommerce:text-center">
        <div class="ecommerce-flex-center ecommerce:w-16 ecommerce:h-16 ecommerce:mx-auto ecommerce:mb-4 ecommerce:rounded-full ecommerce:bg-red-100 ecommerce:dark:bg-red-900/30 ecommerce:justify-center">
          <icon name="triangle-exclamation" class="ecommerce:text-[2rem] ecommerce:text-red-500 ecommerce:dark:text-red-400"/>
        </div>
        <p class="ecommerce-text-primary ecommerce:text-lg ecommerce:font-medium ecommerce:mb-2">$t:sirsoft-ecommerce.admin.product.modal.delete.confirm_question</p>
        <div class="ecommerce:bg-gray-50 ecommerce:dark:bg-gray-800 ecommerce:rounded-lg ecommerce:p-3 ecommerce:mb-4">
          <div class="ecommerce-flex-center ecommerce:justify-center ecommerce:gap-3">
            <div data-if="{{_local.form.images?.length > 0}}" class="ecommerce:w-10 ecommerce:h-10 ecommerce:rounded-lg ecommerce:overflow-hidden ecommerce:flex-shrink-0">
              <img src="{{_local.form.images?.[0]?.download_url}}" alt="" class="ecommerce:w-full ecommerce:h-full ecommerce:object-cover"/>
            </div>
            <div data-if="{{!_local.form.images?.length}}" class="ecommerce-flex-center ecommerce:w-10 ecommerce:h-10 ecommerce:rounded-lg ecommerce:bg-gray-200 ecommerce:dark:bg-gray-700 ecommerce:justify-center ecommerce:flex-shrink-0">
              <icon name="image" class="ecommerce:text-xl ecommerce:text-gray-500 ecommerce:dark:text-gray-400"/>
            </div>
            <div class="ecommerce:text-left">
              <p class="ecommerce-text-primary ecommerce:font-medium ecommerce:text-sm">{{$localized(_local.form.name)}}</p>
              <p class="ecommerce-text-tertiary">{{_local.form.product_code ?? ''}}</p>
            </div>
          </div>
        </div>
        <p class="ecommerce-text-label-subtle">$t:sirsoft-ecommerce.admin.product.modal.delete.warning_message</p>
        <div class="ecommerce-alert-warning">
          <div class="ecommerce-flex-start ecommerce:gap-2">
            <icon name="exclamation-circle" class="ecommerce:text-base ecommerce:text-yellow-700 ecommerce:dark:text-yellow-400 ecommerce:flex-shrink-0 ecommerce:mt-0.5"/>
            <p class="ecommerce-tone-warning-soft ecommerce:text-left ecommerce:text-xs">$t:sirsoft-ecommerce.admin.product.modal.delete.permanent_warning</p>
          </div>
        </div>
      </div>
    </div>
    <!-- 삭제 불가 분기 — 주문 이력 등으로 삭제 불가 시 사유 노출 -->
    <div data-if="{{_global.deleteProduct?.canDelete === false}}">
      <alert data-type="composite" type="error" title="$t:sirsoft-ecommerce.admin.product.modal.delete.cannot_delete_title" message="{{_global.deleteProduct?.reason}}"/>
    </div>
    <div class="ecommerce-modal-footer-buttons">
      <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:text-gray-700 ecommerce:dark:text-gray-300 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:hover:bg-gray-50 ecommerce:dark:hover:bg-gray-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{_global.isProductDeleting}}">
        <on type="click">
          <close-modal target="modal_delete_confirm"/>
        </on>
        <span>$t:sirsoft-ecommerce.common.cancel</span>
      </button>
      <button type="button" class="ecommerce-flex-center ecommerce:gap-2 ecommerce:px-4 ecommerce:py-2 ecommerce:bg-red-600 ecommerce:dark:bg-red-600 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-red-700 ecommerce:dark:hover:bg-red-700 ecommerce:disabled:opacity-50 ecommerce:disabled:cursor-not-allowed" disabled="{{!_global.deleteProduct?.canDelete || _global.isProductDeleting}}">
        <on type="click">
          <!-- 삭제 — 성공하면 목록으로 나간다(지워진 상품의 수정 화면에 남아 있을 수 없다). 진행 표시를 전역에 두는 것은 창과 그 뒤 폼이 같은 값을 봐야 하기 때문이다 -->
          <sequence>
            <set-state target="global" :isProductDeleting="true"/>
            <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/products/{{route.itemCode}}" method="DELETE">
              <success>
                <set-state target="global" :isProductDeleting="false"/>
                <close-modal target="modal_delete_confirm"/>
                <toast type="success" message="$t:sirsoft-ecommerce.admin.product.messages.deleted_success"/>
                <navigate :bypassLeaveGuard="true" path="/admin/ecommerce/products" :mergeQuery="true">
                  <query/>
                </navigate>
              </success>
              <fail>
                <set-state target="global" :isProductDeleting="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-ecommerce.admin.product.messages.deleted_error'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isProductDeleting}}" name="spinner" class="ecommerce-spinner-sm"/>
        <span>{{_global.isProductDeleting ? '$t:common.deleting' : '$t:sirsoft-ecommerce.admin.product.modal.delete.confirm_button'}}</span>
      </button>
    </div>
  </modal>
</partial>
