<!-- 상품 폼 — 라벨 삭제 확인. 이 상품에서 떼는 것이 아니라 라벨 자체를 지우는 것이라, 같은 라벨을
  쓰는 다른 상품에서도 함께 떨어진다. 지울 라벨은 전역에 담긴 id 로 라벨 목록에서 되찾아 보여 준다
  (창은 별도 컨텍스트라 폼의 선택 상태를 못 본다). -->
<partial description="Product Form - Label Delete Confirmation Modal">
  <modal data-type="composite" data-ref="modal_label_delete_confirm" title="$t:sirsoft-ecommerce.admin.product.labels.delete_modal.title" size="sm">
    <div data-ref="delete_confirm_content">
      <div class="ecommerce-flex-center ecommerce:gap-3">
        <div class="ecommerce-flex-center ecommerce:w-10 ecommerce:h-10 ecommerce:rounded-full ecommerce:bg-red-100 ecommerce:dark:bg-red-900/20 ecommerce:justify-center ecommerce:flex-shrink-0">
          <icon name="trash" class="ecommerce:text-xl ecommerce:text-red-600 ecommerce:dark:text-red-400"/>
        </div>
        <div>
          <p class="ecommerce-text-primary ecommerce:font-medium">
            <!-- 라벨 칩 — 운영자 색은 바탕에만 쓰고 글자색은 Badge 가 바탕과 4.5 이상이 되도록 계산한다(색을 글자에 그대로 쓰면 밝은 색이 2 안팎) -->
            <badge data-type="composite" size="md" className="ecommerce:mr-1" customColor="{{(product_labels?.data?.data ?? []).find(l => l.id === _global.labelToDeleteId)?.color ?? '#6B7280'}}">{{$localized((product_labels?.data?.data ?? []).find(l => l.id === _global.labelToDeleteId)?.name) ?? ''}}</badge>
            <span>$t:sirsoft-ecommerce.admin.product.labels.delete_modal.message</span>
          </p>
          <p class="ecommerce-text-label-subtle ecommerce:mt-1">$t:sirsoft-ecommerce.admin.product.labels.delete_modal.description</p>
        </div>
      </div>
    </div>
    <footer>
      <button type="button" class="ecommerce-btn ecommerce-btn-outline" disabled="{{_global.isDeletingLabel}}">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.common.cancel
      </button>
      <button type="button" class="ecommerce-btn ecommerce-btn-danger" disabled="{{_global.isDeletingLabel}}">
        <on type="click">
          <action handler="sirsoft-ecommerce.deleteLabel"/>
        </on>
        <icon data-if="{{_global.isDeletingLabel}}" name="spinner" class="ecommerce-spinner-sm ecommerce:mr-2"/>
        <span>{{_global.isDeletingLabel ? '$t:sirsoft-ecommerce.admin.product.labels.delete_modal.deleting' : '$t:sirsoft-ecommerce.admin.product.labels.remove'}}</span>
      </button>
    </footer>
  </modal>
</partial>
