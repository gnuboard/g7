<!-- 상품 폼 — 옵션 재생성 확인. 옵션 조합을 다시 만들면 기존 줄에 넣어 둔 재고·추가금·판매상태가
  함께 지워지므로 되묻는다. -->
<partial description="Product Form - Confirm Regenerate Options Modal">
  <modal data-type="composite" data-ref="modal_confirm_regenerate" title="$t:sirsoft-ecommerce.admin.product.create.modal.confirm.title" size="sm">
    <div>
      <div class="ecommerce-alert-warning">
        <icon name="triangle-exclamation" class="ecommerce:text-xl ecommerce:text-amber-600 ecommerce:shrink-0 ecommerce:mt-0.5"/>
        <div>
          <div>
            <p class="ecommerce:text-sm ecommerce:font-medium ecommerce-tone-warning-soft">$t:sirsoft-ecommerce.admin.product.create.modal.confirm.regenerate_options</p>
            <p class="ecommerce-tone-warning-soft ecommerce:text-xs">$t:sirsoft-ecommerce.admin.product.create.modal.confirm.regenerate_options_note</p>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <button type="button" class="ecommerce-btn ecommerce-btn-outline">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.common.cancel
      </button>
      <button type="button" class="ecommerce-btn ecommerce-btn-warning">
        <on type="click">
          <!-- 창을 먼저 닫고 재생성한다 — 조합이 많으면 만드는 동안 화면이 멈춘 것처럼 보이기 때문이다. 확인을 이미 받았으므로 핸들러의 재확인은 건너뛴다 -->
          <sequence>
            <close-modal/>
            <action handler="sirsoft-ecommerce.generateOptions" :skipConfirm="true" isCreate="{{!route.itemCode}}"/>
          </sequence>
        </on>
        $t:sirsoft-ecommerce.common.confirm
      </button>
    </footer>
  </modal>
</partial>
