<partial description="Product Form - Identification Codes Section">
  <div data-ref="identification" class="admin-card-accordion">
    <div class="card-header">
      <on type="click">
        <set-state target="local" ui.identificationExpanded="{{!_local.ui.identificationExpanded}}"/>
      </on>
      <icon name="barcode" class="text-gray-500 dark:text-gray-400"/>
      <span class="card-title">$t:sirsoft-ecommerce.admin.product.sections.identification</span>
      <icon name="chevron-down" class="admin-card-accordion-icon transition-transform duration-200 {{_local.ui.identificationExpanded !== false ? 'rotate-180' : ''}}"/>
    </div>
    <div data-ref="identification_body" data-if="{{_local.ui.identificationExpanded !== false}}" class="row-stack">
      <div data-ref="identification_grid" class="grid grid-cols-2 gap-6">
        <responsive on="portable" class="grid grid-cols-1 gap-4"/>
        <div data-ref="field_product_code" class="form-group">
          <label class="form-label">
            <span>$t:sirsoft-ecommerce.admin.product.create.identification_codes.product_code.label</span>
            <span class="text-required">*</span>
          </label>
          <input type="text" name="product_code" class="input" placeholder="$t:sirsoft-ecommerce.admin.product.create.identification_codes.product_code.placeholder" disabled="{{!!route?.itemCode || (route.itemCode &amp;&amp; product?.data?.abilities?.can_update !== true)}}">
            <on type="change">
              <set-state target="local" hasChanges="{{!!route?.itemCode}}"/>
            </on>
          </input>
        </div>
        <div data-ref="field_sku" class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.product.fields.sku</label>
          <input type="text" name="sku" class="{{_local.errors?.sku ? 'input input-error' : 'input'}}" placeholder="$t:sirsoft-ecommerce.admin.product.placeholders.sku" disabled="{{route.itemCode &amp;&amp; product?.data?.abilities?.can_update !== true}}">
            <on type="change">
              <set-state target="local" hasChanges="{{!!route?.itemCode}}"/>
            </on>
          </input>
          <span data-if="{{_local.errors?.sku}}" class="form-error-xs mt-1">{{_local.errors?.sku?.[0]}}</span>
        </div>
        <div data-ref="field_barcode" class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.product.create.identification_codes.barcode.label</label>
          <input type="text" name="barcode" class="{{_local.errors?.barcode ? 'input input-error' : 'input'}}" placeholder="$t:sirsoft-ecommerce.admin.product.create.identification_codes.barcode.placeholder" disabled="{{route.itemCode &amp;&amp; product?.data?.abilities?.can_update !== true}}">
            <on type="change">
              <set-state target="local" hasChanges="{{!!route?.itemCode}}"/>
            </on>
          </input>
          <span data-if="{{_local.errors?.barcode}}" class="form-error-xs mt-1">{{_local.errors?.barcode?.[0]}}</span>
        </div>
        <div data-ref="field_hs_code" class="form-group">
          <label class="form-label">$t:sirsoft-ecommerce.admin.product.create.identification_codes.hs_code.label</label>
          <input type="text" name="hs_code" class="{{_local.errors?.hs_code ? 'input input-error' : 'input'}}" placeholder="$t:sirsoft-ecommerce.admin.product.create.identification_codes.hs_code.placeholder" disabled="{{route.itemCode &amp;&amp; product?.data?.abilities?.can_update !== true}}">
            <on type="change">
              <set-state target="local" hasChanges="{{!!route?.itemCode}}"/>
            </on>
          </input>
          <span data-if="{{_local.errors?.hs_code}}" class="form-error-xs mt-1">{{_local.errors?.hs_code?.[0]}}</span>
        </div>
      </div>
    </div>
  </div>
</partial>
