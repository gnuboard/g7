<partial description="Product Form - Description Section">
  <div data-ref="description" class="admin-card-accordion">
    <div class="card-header">
      <on type="click">
        <set-state target="local" ui.descriptionExpanded="{{!_local.ui.descriptionExpanded}}"/>
      </on>
      <icon name="file-lines" class="text-gray-500 dark:text-gray-400"/>
      <span class="card-title">$t:sirsoft-ecommerce.admin.product.sections.description</span>
      <icon name="chevron-down" class="admin-card-accordion-icon transition-transform duration-200 {{_local.ui.descriptionExpanded !== false ? 'rotate-180' : ''}}"/>
    </div>
    <div data-ref="description_body" data-if="{{_local.ui.descriptionExpanded !== false}}" class="row-stack">
      <div data-ref="description_editor_wrapper" class="{{_local.errors?.description ? 'border border-red-500 dark:border-red-500 rounded-lg overflow-hidden' : ''}}">
        <extension-point name="html_editor" data-ref="description_editor" :multilingual="true" value="{{_local.form?.description ?? ''}}" :rows="15" placeholder="$t:sirsoft-ecommerce.admin.product.placeholders.description" label="$t:sirsoft-ecommerce.admin.product.fields.description" disabled="{{route.itemCode &amp;&amp; product?.data?.abilities?.can_update !== true}}" :showHtmlModeToggle="true" isHtml="{{(_local.form?.description_mode ?? 'text') === 'html'}}">
          <prop name="name">"description"</prop>
          <default>
            <html-editor name="description" :multilingual="true" value="{{_local.form?.description ?? ''}}" :rows="15" placeholder="$t:sirsoft-ecommerce.admin.product.placeholders.description" label="$t:sirsoft-ecommerce.admin.product.fields.description" disabled="{{route.itemCode &amp;&amp; product?.data?.abilities?.can_update !== true}}" :showHtmlModeToggle="true" isHtml="{{(_local.form?.description_mode ?? 'text') === 'html'}}">
              <on type="change" event="onChange">
                <set-state target="local" form.description="{{$event.target.value}}" :hasChanges="true"/>
              </on>
              <on type="change" event="onIsHtmlChange">
                <set-state target="local" form.description_mode="{{$args[0].target.checked ? 'html' : 'text'}}" :hasChanges="true"/>
              </on>
            </html-editor>
          </default>
        </extension-point>
      </div>
      <span data-if="{{_local.errors?.description || _local.errors?.['description.ko']}}" class="form-error-xs mt-1">{{_local.errors?.description?.[0] ?? _local.errors?.['description.ko']?.[0]}}</span>
    </div>
  </div>
</partial>
