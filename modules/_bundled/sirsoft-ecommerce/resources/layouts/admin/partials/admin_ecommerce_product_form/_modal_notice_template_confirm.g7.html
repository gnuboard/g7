<!-- 상품 폼 — 고시 템플릿 적용 확인. 템플릿을 고르면 지금 넣어 둔 고시 내용이 템플릿 값으로 갈리므로
  되묻는다. 고른 템플릿은 확정 전까지 전역에 대기시켜 두고, 어느 쪽으로 끝나든 그 자리를 비운다. -->
<partial description="Product Form - Notice Template Change Confirmation Modal">
  <modal data-type="composite" data-ref="notice_template_confirm_modal" title="$t:sirsoft-ecommerce.admin.product.notice.confirm_change_title" size="sm">
    <div>
      <div class="alert-warning">
        <icon name="triangle-exclamation" class="text-xl text-amber-500 shrink-0 mt-0.5"/>
        <div>
          <p class="text-sm font-medium text-warning-soft">$t:sirsoft-ecommerce.admin.product.notice.confirm_change_warning</p>
          <p class="text-warning-soft">$t:sirsoft-ecommerce.admin.product.notice.confirm_change_description</p>
        </div>
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn btn-outline">
          <on type="click">
            <!-- 취소 — 대기시켜 둔 선택을 버린다(그대로 두면 다음에 창을 열 때 지난 선택이 적용된다) -->
            <sequence>
              <set-state target="global" :pendingNoticeTemplateId="null"/>
              <close-modal/>
            </sequence>
          </on>
          $t:sirsoft-ecommerce.common.cancel
        </button>
        <button type="button" class="btn btn-warning">
          <on type="click">
            <!-- 확정 — 창을 닫고 대기 중이던 템플릿을 적용한 뒤 그 자리를 비운다 -->
            <sequence>
              <close-modal/>
              <action handler="sirsoft-ecommerce.selectNoticeTemplate" templateId="{{_global.pendingNoticeTemplateId}}"/>
              <set-state target="global" :pendingNoticeTemplateId="null"/>
            </sequence>
          </on>
          $t:sirsoft-ecommerce.admin.product.notice.confirm_change_button
        </button>
      </div>
    </div>
  </modal>
</partial>
