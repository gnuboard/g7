<!-- 상품 폼 — 추가옵션 비우기 확인. 넣어 둔 추가옵션 줄이 모두 사라지므로 되묻는다 -->
<partial>
  <modal data-type="composite" data-ref="additional_options_clear_modal" title="$t:sirsoft-ecommerce.common.confirm" size="sm">
    <div class="ecommerce:text-center">
      <icon name="triangle-exclamation" size="3x" class="ecommerce:text-amber-600 ecommerce:dark:text-amber-400 ecommerce:mx-auto ecommerce:mb-4"/>
      <p class="ecommerce-text-secondary">$t:sirsoft-ecommerce.admin.product.options.additional_clear_confirm</p>
    </div>
    <footer>
      <button type="button" variant="secondary" class="ecommerce-btn ecommerce-btn-outline" data-testid="additional-clear-cancel">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.common.cancel
      </button>
      <button type="button" variant="danger" class="ecommerce-btn ecommerce-btn-danger" data-testid="additional-clear-confirm">
        <on type="click">
          <action handler="sirsoft-ecommerce.clearAdditionalOptions"/>
        </on>
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.common.confirm
      </button>
    </footer>
  </modal>
</partial>
