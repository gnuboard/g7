<!-- 상품 폼 — 고시 항목 일괄 변경 확인. 한 항목의 값을 이 상품의 모든 고시 줄에 한꺼번에 채우는
  동작이라, 이미 손으로 다르게 적어 둔 줄까지 덮는다는 것을 먼저 알린다. -->
<partial description="Product Form - Notice Items Bulk Change Confirmation Modal">
  <modal data-type="composite" data-ref="notice_bulk_change_modal" title="$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.title" size="medium">
    <div>
      <div class="ecommerce-flex-start ecommerce:gap-3">
        <div class="ecommerce:flex-shrink-0 ecommerce:mt-0.5">
          <icon name="info-circle" class="ecommerce:text-xl ecommerce:text-blue-600 ecommerce:dark:text-blue-400"/>
        </div>
        <div class="ecommerce:flex-1">
          <p class="ecommerce-text-primary ecommerce:text-base ecommerce:mb-2">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.message</p>
          <div class="ecommerce:bg-gray-100 ecommerce:dark:bg-gray-700 ecommerce:rounded-lg ecommerce:p-3">
            <p class="ecommerce-text-label-subtle">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.preview_label</p>
            <p class="ecommerce-text-primary ecommerce:font-medium ecommerce:mt-1">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.preview_value</p>
          </div>
          <p class="ecommerce:text-sm ecommerce:text-amber-700 ecommerce:dark:text-amber-400 ecommerce:mt-3">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.notice</p>
        </div>
      </div>
    </div>
    <footer>
      <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce:bg-white ecommerce:dark:bg-gray-800 ecommerce:text-gray-700 ecommerce:dark:text-gray-300 ecommerce:border ecommerce:border-gray-300 ecommerce:dark:border-gray-600 ecommerce:rounded-lg ecommerce:hover:bg-gray-50 ecommerce:dark:hover:bg-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="ecommerce:px-4 ecommerce:py-2 ecommerce:bg-blue-600 ecommerce:dark:bg-blue-600 ecommerce:text-white ecommerce:rounded-lg ecommerce:hover:bg-blue-700 ecommerce:dark:hover:bg-blue-700">
        <on type="click">
          <!-- 확정 — 창이 직접 폼을 고치지 못하므로(별도 컨텍스트) 채울 값을 실어 사건으로 넘기고 닫는다. 실제 반영은 고시 구획이 받아서 한다 -->
          <sequence>
            <emit-event event="notice:productBulkChangeConfirmed">
              <field name="data">
                <field name="form" value="{{_global.tempFormForBulkChange}}"/>
              </field>
            </emit-event>
            <close-modal/>
          </sequence>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.confirm</span>
      </button>
    </footer>
  </modal>
</partial>
