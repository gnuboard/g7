<!-- 상품 폼 — 고시 항목 일괄 변경 확인. 한 항목의 값을 이 상품의 모든 고시 줄에 한꺼번에 채우는
  동작이라, 이미 손으로 다르게 적어 둔 줄까지 덮는다는 것을 먼저 알린다. -->
<partial description="Product Form - Notice Items Bulk Change Confirmation Modal">
  <modal data-type="composite" data-ref="notice_bulk_change_modal" title="$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.title" size="medium">
    <div>
      <div class="flex-start gap-3">
        <div class="flex-shrink-0 mt-0.5">
          <icon name="info-circle" class="text-xl text-blue-600 dark:text-blue-400"/>
        </div>
        <div class="flex-1">
          <p class="text-primary text-base mb-2">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.message</p>
          <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3">
            <p class="text-label-subtle">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.preview_label</p>
            <p class="text-primary font-medium mt-1">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.preview_value</p>
          </div>
          <p class="text-sm text-amber-600 dark:text-amber-400 mt-3">$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.notice</p>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button class="px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600">
        <on type="click">
          <!-- 확정 — 창이 직접 폼을 고치지 못하므로(별도 컨텍스트) 채울 값을 실어 사건으로 넘기고 닫는다. 실제 반영은 고시 구획이 받아서 한다 -->
          <sequence>
            <emit-event event="notice:productBulkChangeConfirmed">
              <field name="data">
                <field name="form" value="{{_global.tempFormForBulkChange}}"/>
              </field>
            </emit-event>
            <close-modal/>
          </sequence>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product.notice.modals.bulk_change.confirm</span>
      </button>
    </div>
  </modal>
</partial>
