<!-- 다국어 태그 입력 창 — 옵션값 태그 한 개를 지원 언어별로 나눠 넣는다. 태그 칸에서 바로 여러 언어를
  받을 수 없어 창으로 뺐고, 새로 넣는지 고치는지는 편집 대상 자리(`editingIndex`)의 유무로 가른다.
  편집 중인 값은 입력 컴포넌트가 채운 전역 `_global.multilingualTagEdit` 에 있고, 저장하면 창을 연 상품 폼의
  `_local`(편집 상태의 `statePath`, 예: `ui.optionInputs.0.values`)에 태그 배열을 쓴다. 입력·취소·저장은
  어느 관리자 템플릿으로 그려지든 같아야 하므로 이 모듈의 핸들러를 쓴다. -->
<partial description="MultilingualTagInput 다국어 태그 편집 모달" editor_label="$t:sirsoft-ecommerce.admin.product.modal.multilingual_tag_edit_editor_label">
  <modal data-type="composite" data-ref="multilingual_tag_edit_modal" title="{{_global.multilingualTagEdit?.editingIndex !== null ? '$t:common.edit' : '$t:common.add'}}" size="sm">
    <div class="space-y-4 p-4">
      <div data-each="localeItem, localeIdx in {{_global.multilingualTagEdit?.supportedLocales ?? []}}">
        <div>
          <div class="flex-center gap-2">
            <span class="text-body font-medium">{{localeItem.label}}</span>
            <span class="text-hint">({{localeItem.code | uppercase}})</span>
          </div>
          <input type="text" value="{{_global.multilingualTagEdit?.values[localeItem.code] ?? ''}}" placeholder="$t:common.enter_value" class="dark:focus:ring-blue-400">
            <on type="change">
              <!-- 언어별 입력칸이 반복으로 서므로 어느 언어인지 함께 넘긴다 — 값은 전역 편집 상태의 그 언어 칸에 들어간다 -->
              <action handler="sirsoft-ecommerce.updateMultilingualTagValue" locale="{{localeItem.code}}" value="{{$event.target.value}}"/>
            </on>
          </input>
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-2 pt-4 border-t border-gray-200 dark:border-gray-700 px-4 pb-4">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <!-- 태그 배열은 그대로 두고 창을 닫으며 편집 상태를 비운다 -->
          <action handler="sirsoft-ecommerce.cancelMultilingualTag"/>
        </on>
        <span>$t:common.cancel</span>
      </button>
      <button type="button" class="px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600">
        <on type="click">
          <!-- 새 태그면 끝에 붙이고 고치는 중이면 그 자리를 바꿔 상품 폼 _local 에 쓴 뒤 창을 닫는다(언어별 값이 모두 비면 반영하지 않는다) -->
          <action handler="sirsoft-ecommerce.saveMultilingualTag"/>
        </on>
        <span>{{_global.multilingualTagEdit?.editingIndex !== null ? '$t:common.save' : '$t:common.add'}}</span>
      </button>
    </div>
  </modal>
</partial>
