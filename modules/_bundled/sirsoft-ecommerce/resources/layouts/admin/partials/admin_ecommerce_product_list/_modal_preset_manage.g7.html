<partial description="Product Index - Preset Management Modal">
  <modal data-ref="modal_preset_manage" title="$t:sirsoft-ecommerce.admin.product.modal.preset_manage.title" description="$t:sirsoft-ecommerce.admin.product.modal.preset_manage.description" size="md">
    <div data-ref="preset_empty_message" data-if="{{!presets.data || presets.data.length === 0}}" class="text-center py-8 text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.admin.product.modal.preset_manage.empty</div>
    <div data-ref="preset_list" data-if="{{presets.data &amp;&amp; presets.data.length > 0}}">
      <div data-ref="preset_item_dynamic" data-each="presetItem in presets.data" class="flex-between p-3 border border-gray-200 dark:border-gray-700 rounded-lg">
        <span class="text-heading">{{presetItem.name}}</span>
        <div class="flex-center gap-2">
          <button type="button" class="btn-icon">
            <on type="click">
              <set-state target="global" editingPresetId="{{presetItem.id}}" editingPresetName="{{presetItem.name}}"/>
              <open-modal target="modal_preset_edit"/>
            </on>
            <icon name="fa-solid fa-pen" class="w-4 h-4"/>
          </button>
          <button type="button" class="btn-icon text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
            <on type="click">
              <set-state target="global" deletingPresetId="{{presetItem.id}}" deletingPresetName="{{presetItem.name}}"/>
              <open-modal target="modal_preset_delete_confirm"/>
            </on>
            <icon name="fa-solid fa-trash" class="w-4 h-4"/>
          </button>
        </div>
      </div>
    </div>
    <div data-ref="preset_footer" class="mt-4">
      <button type="button" class="btn btn-primary w-full"><on type="click"><open-modal target="modal_preset_save"/></on>$t:sirsoft-ecommerce.admin.product.modal.preset_manage.add_new</button>
    </div>
  </modal>
</partial>
