<!-- 상품 목록 — 검색조건 프리셋 관리 창. 이름 바꾸기·삭제·새로 저장은 각각 **다른 창**을 열고 이
  창은 닫히지 않은 채 그 위에 겹친다 — 그래서 대상 프리셋을 `_global` 에 먼저 담고 연다
  (창끼리는 서로의 `_local` 을 보지 못한다). "새로 저장" 만 담을 것 없이 바로 여는데, 저장할
  조건은 필터 영역이 이미 `_global` 에 넣어 두었기 때문이다. -->
<partial description="Product Index - Preset Management Modal">
  <modal data-type="composite" data-ref="modal_preset_manage" title="$t:sirsoft-ecommerce.admin.product.modal.preset_manage.title" size="md">
    <div data-ref="preset_empty_message" data-if="{{!presets.data || presets.data.length === 0}}" class="text-center py-8 text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.admin.product.modal.preset_manage.empty</div>
    <div data-ref="preset_list" data-if="{{presets.data &amp;&amp; presets.data.length > 0}}" class="stack-tight">
      <div data-ref="preset_item_dynamic_{{presetIdx}}" data-each="presetItem, presetIdx in presets.data" class="flex-between p-3 border border-gray-200 dark:border-gray-700 rounded-lg">
        <span class="text-heading">{{presetItem.name}}</span>
        <div class="flex-center gap-2">
          <button data-ref="preset_rename_button_{{presetIdx}}" type="button" class="btn-icon disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{products?.data?.abilities?.can_update !== true}}" aria-label="$t:common.edit">
            <on type="click">
              <!-- 이름 바꾸기. 반복 변수 `presetItem` 은 이 목록 안에서만 살아 있으므로, 열릴 창이 읽을 수 있도록 값을 `_global` 로 옮겨 담고 연다. -->
              <sequence>
                <set-state target="global" editingPresetId="{{presetItem.id}}" editingPresetName="{{presetItem.name}}"/>
                <open-modal target="modal_preset_edit"/>
              </sequence>
            </on>
            <icon name="fa-solid fa-pen" class="text-base"/>
          </button>
          <button data-ref="preset_delete_button_{{presetIdx}}" type="button" class="btn-icon text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{products?.data?.abilities?.can_update !== true}}" aria-label="$t:common.delete">
            <on type="click">
              <!-- 삭제. 확인 창이 이름을 문장에 넣어 보여 주는데 그 창은 프리셋 목록을 따로 조회하지 않으므로, id 만이 아니라 이름도 함께 넘긴다. -->
              <sequence>
                <set-state target="global" deletingPresetId="{{presetItem.id}}" deletingPresetName="{{presetItem.name}}"/>
                <open-modal target="modal_preset_delete_confirm"/>
              </sequence>
            </on>
            <icon name="fa-solid fa-trash" class="text-base"/>
          </button>
        </div>
      </div>
    </div>
    <div data-ref="preset_footer" class="mt-4">
      <button data-ref="preset_save_new_button" type="button" class="btn btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{products?.data?.abilities?.can_update !== true}}">
        <on type="click">
          <open-modal target="modal_preset_save"/>
        </on>
        $t:sirsoft-ecommerce.admin.product.modal.preset_manage.add_new
      </button>
    </div>
  </modal>
</partial>
