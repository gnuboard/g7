<!-- 상품 목록 — 지금 걸린 검색조건을 프리셋으로 저장하는 창. 저장 대상은 화면에 보이는 결과가
  아니라 **조건 22개 묶음**이고, 그 값은 필터 영역이 창을 열기 전에 `_global.savingPresetConditions`
  로 옮겨 담아 둔다. 조건마다 `|| ''`/`|| []`/`|| false` 를 붙이는 이유는 비어 있는 조건도 키를
  남기기 위해서다 — 키가 빠지면 나중에 이 프리셋을 불러올 때 그 자리가 직전 검색값으로 남는다.
  `target_screen` 이 "products" 로 고정돼 있어 주문·쿠폰 목록의 프리셋과 한 저장소를 나눠 쓴다. -->
<partial description="Product Index - Preset Save Modal">
  <modal data-type="composite" data-ref="modal_preset_save" title="$t:sirsoft-ecommerce.admin.product.modal.preset_save.title" size="sm">
    <input data-ref="preset_name_input" type="text" placeholder="$t:sirsoft-ecommerce.admin.product.modal.preset_save.placeholder" class="input" value="{{_local.presetName}}">
      <on type="input">
        <!-- 이름만 이 창의 `_local` 에 둔다 — 저장할 조건은 이미 `_global` 에 담겨 왔고, 이름은 저장이 끝나면 비워 다음 저장에 남지 않게 한다. -->
        <set-state target="local" presetName="{{$event.target.value}}"/>
      </on>
    </input>
    <div data-ref="preset_save_footer" class="flex justify-end gap-2 mt-4">
      <button type="button" class="btn btn-secondary">
        <on type="click">
          <close-modal/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="btn btn-primary" disabled="{{!_local.presetName || _local.presetName.trim() === ''}}">
        <on type="click">
          <!-- 저장. 조건을 통째로 넘기지 않고 `<field>` 트리로 하나씩 펴는 이유는 화면이 쓰지 않는 키가 섞여 들지 않고, 조건이 하나 늘 때 고칠 자리가 여기 한 곳으로 보이기 때문이다. -->
          <api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/presets" method="POST">
            <success>
              <set-state target="local" presetName=""/>
              <refetch-data-source dataSourceId="presets"/>
              <toast type="success" message="$t:sirsoft-ecommerce.messages.presets.created"/>
              <close-modal/>
            </success>
            <fail>
              <toast type="error" message="{{error.message}}"/>
            </fail>
            <field name="body">
              <field name="target_screen" value="products"/>
              <field name="name" value="{{_local.presetName}}"/>
              <field name="conditions">
                <field name="searchField" value="{{_global.savingPresetConditions.searchField || 'all'}}"/>
                <field name="searchKeyword" value="{{_global.savingPresetConditions.searchKeyword || ''}}"/>
                <field name="category1" value="{{_global.savingPresetConditions.category1 || ''}}"/>
                <field name="category2" value="{{_global.savingPresetConditions.category2 || ''}}"/>
                <field name="category3" value="{{_global.savingPresetConditions.category3 || ''}}"/>
                <field name="category4" value="{{_global.savingPresetConditions.category4 || ''}}"/>
                <field name="noCategoryRegistered" value="{{_global.savingPresetConditions.noCategoryRegistered || false}}"/>
                <field name="dateType" value="{{_global.savingPresetConditions.dateType || 'created_at'}}"/>
                <field name="startDate" value="{{_global.savingPresetConditions.startDate || ''}}"/>
                <field name="endDate" value="{{_global.savingPresetConditions.endDate || ''}}"/>
                <field name="dateQuick" value="{{_global.savingPresetConditions.dateQuick || ''}}"/>
                <field name="salesStatus" value="{{_global.savingPresetConditions.salesStatus || []}}"/>
                <field name="displayStatus" value="{{_global.savingPresetConditions.displayStatus || 'all'}}"/>
                <field name="brandId" value="{{_global.savingPresetConditions.brandId || ''}}"/>
                <field name="noBrandRegistered" value="{{_global.savingPresetConditions.noBrandRegistered || false}}"/>
                <field name="taxStatus" value="{{_global.savingPresetConditions.taxStatus || 'all'}}"/>
                <field name="priceType" value="{{_global.savingPresetConditions.priceType || 'selling_price'}}"/>
                <field name="minPrice" value="{{_global.savingPresetConditions.minPrice || ''}}"/>
                <field name="maxPrice" value="{{_global.savingPresetConditions.maxPrice || ''}}"/>
                <field name="minStock" value="{{_global.savingPresetConditions.minStock || ''}}"/>
                <field name="maxStock" value="{{_global.savingPresetConditions.maxStock || ''}}"/>
                <field name="shippingPolicy" value="{{_global.savingPresetConditions.shippingPolicy || ''}}"/>
              </field>
            </field>
          </api-call>
        </on>
        $t:sirsoft-ecommerce.admin.product.modal.preset_save.save
      </button>
    </div>
  </modal>
</partial>
