<partial description="Product Index - Preset Save Modal">
  <modal data-ref="modal_preset_save" title="$t:sirsoft-ecommerce.admin.product.modal.preset_save.title" description="$t:sirsoft-ecommerce.admin.product.modal.preset_save.description" size="sm">
    <input data-ref="preset_name_input" type="text" placeholder="$t:sirsoft-ecommerce.admin.product.modal.preset_save.placeholder" class="input" value="{{_local.presetName}}">
      <on type="input">
        <set-state target="local" presetName="{{$event.target.value}}"/>
      </on>
    </input>
    <div data-ref="preset_save_footer" class="flex justify-end gap-2 mt-4">
      <button type="button" class="btn btn-secondary"><on type="click"><close-modal/></on>$t:common.cancel</button>
      <button type="button" class="btn btn-primary" disabled="{{!_local.presetName || _local.presetName.trim() === ''}}"><on type="click"><api-call :auth_required="true" target="/api/modules/sirsoft-ecommerce/admin/presets" method="POST"><success><set-state target="local" presetName=""/><refetch-data-source dataSourceId="presets"/><toast type="success" message="$t:sirsoft-ecommerce.messages.presets.created"/><close-modal/></success><fail><toast type="error" message="{{error.message}}"/></fail><field name="body"><field name="target_screen" value="products"/><field name="name" value="{{_local.presetName}}"/><field name="conditions"><field name="searchField" value="{{_global.savingPresetConditions.searchField || 'all'}}"/><field name="searchKeyword" value="{{_global.savingPresetConditions.searchKeyword || ''}}"/><field name="category1" value="{{_global.savingPresetConditions.category1 || ''}}"/><field name="category2" value="{{_global.savingPresetConditions.category2 || ''}}"/><field name="category3" value="{{_global.savingPresetConditions.category3 || ''}}"/><field name="category4" value="{{_global.savingPresetConditions.category4 || ''}}"/><field name="noCategoryRegistered" value="{{_global.savingPresetConditions.noCategoryRegistered || false}}"/><field name="dateType" value="{{_global.savingPresetConditions.dateType || 'created_at'}}"/><field name="startDate" value="{{_global.savingPresetConditions.startDate || ''}}"/><field name="endDate" value="{{_global.savingPresetConditions.endDate || ''}}"/><field name="dateQuick" value="{{_global.savingPresetConditions.dateQuick || ''}}"/><field name="salesStatus" value="{{_global.savingPresetConditions.salesStatus || []}}"/><field name="displayStatus" value="{{_global.savingPresetConditions.displayStatus || 'all'}}"/><field name="brandId" value="{{_global.savingPresetConditions.brandId || ''}}"/><field name="noBrandRegistered" value="{{_global.savingPresetConditions.noBrandRegistered || false}}"/><field name="taxStatus" value="{{_global.savingPresetConditions.taxStatus || 'all'}}"/><field name="priceType" value="{{_global.savingPresetConditions.priceType || 'selling_price'}}"/><field name="minPrice" value="{{_global.savingPresetConditions.minPrice || ''}}"/><field name="maxPrice" value="{{_global.savingPresetConditions.maxPrice || ''}}"/><field name="minStock" value="{{_global.savingPresetConditions.minStock || ''}}"/><field name="maxStock" value="{{_global.savingPresetConditions.maxStock || ''}}"/><field name="shippingPolicy" value="{{_global.savingPresetConditions.shippingPolicy || ''}}"/></field></field></api-call></on>$t:sirsoft-ecommerce.admin.product.modal.preset_save.save</button>
    </div>
  </modal>
</partial>
