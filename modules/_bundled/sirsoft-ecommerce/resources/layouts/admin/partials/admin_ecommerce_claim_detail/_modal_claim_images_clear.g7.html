<partial description="Claim Images Bulk Clear Confirm Modal (F6) - detail screen only">
  <!-- 첨부 일괄 정리 확인 모달 — 사유 카드의 [첨부 일괄 정리] 가 연다. 이 처리는 올린 사람과 무관하게 신청서의 첨부를 파일째 전부 지우고 되돌릴 수 없다(고객 증빙 포함). 개별 삭제는 업로더가 이미 확인창을 거치는데 일괄 쪽만 곧바로 지우면, 한 번의 오클릭으로 증빙이 모두 사라진다. 모달은 부모 화면의 `_local` 을 해석하지 못하므로 여는 쪽이 `_global.claimImagesClearContext` 에 대상 식별 축과 장수를 넣는다. -->
  <modal data-type="composite" data-ref="modal_claim_images_clear" title="$t:sirsoft-ecommerce.admin.claim.detail.reason.images_clear_confirm.title" size="md">
    <div class="space-y-4">
      <p data-ref="cic_001_message" class="text-label">$t:sirsoft-ecommerce.admin.claim.detail.reason.images_clear_confirm.message|count={{_global.claimImagesClearContext?.count ?? 0}}</p>
      <p data-ref="cic_002_warning" class="p-3 rounded-lg bg-yellow-50 dark:bg-yellow-900/20 text-sm text-yellow-700 dark:text-yellow-400">$t:sirsoft-ecommerce.admin.claim.detail.reason.images_clear_confirm.warning</p>
      <div class="flex justify-end gap-2 pt-2">
        <button data-ref="cic_003_cancel" type="button" class="btn btn-outline" disabled="{{_global.isProcessing}}">
          <on type="click">
            <close-modal/>
          </on>
          $t:common.cancel
        </button>
        <!-- 진행 표식을 실행보다 먼저 세워 응답 전 두 번째 클릭을 막는다. 실패 사유 토스트는 핸들러가 이미 띄우므로 fail 은 진행 표식만 되돌리고 창을 남긴다 — 운영자가 그 자리에서 다시 누르거나 닫는다. -->
        <button data-ref="cic_004_confirm" type="button" class="btn btn-danger" disabled="{{!_global.claimImagesClearContext || _global.isProcessing}}">
          <on type="click">
            <set-state target="global" :isProcessing="true"/>
            <action handler="sirsoft-ecommerce.clearClaimImages" pathSegment="{{_global.claimImagesClearContext?.pathSegment ?? ''}}" claimType="{{_global.claimImagesClearContext?.claimType ?? ''}}" claimId="{{_global.claimImagesClearContext?.claimId ?? null}}">
              <success>
                <set-state target="global" :isProcessing="false" :claimImagesClearContext="null"/>
                <close-modal/>
              </success>
              <fail>
                <set-state target="global" :isProcessing="false"/>
              </fail>
            </action>
          </on>
          <icon data-if="{{_global.isProcessing}}" name="spinner" class="spinner-sm"/>
          <span data-if="{{!_global.isProcessing}}">$t:sirsoft-ecommerce.admin.claim.detail.reason.images_clear_confirm.confirm</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
