<!-- 공지 템플릿 편집 중 이탈을 막는 확인 창. "계속 편집" 은 창만 닫고, "취소하고 나가기" 는 패널을
  보기 모드로 되돌리며 선택을 비운다 — 입력을 버리는 유일한 경로다.
  나가기 쪽은 창을 먼저 닫고 상태를 쓴다 — 쓰는 대상이 `_global` 이라 모달이 사라져도 남기
  때문이고, `_local` 이었다면 닫기를 뒤에 두어야 한다. 브랜드 화면의 같은 성격 창도 같은 순서다. -->
<partial description="Product Notice Template Editing Discard Confirmation Modal">
  <modal data-type="composite" data-ref="editing_confirm_modal" title="$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.title" size="medium">
    <div>
      <div class="flex-start gap-3">
        <div class="flex-shrink-0 mt-0.5">
          <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400"/>
        </div>
        <div class="flex-1">
          <p class="text-primary text-base mb-2">$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.message</p>
          <p class="text-label">$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.confirm_message</p>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.continue</span>
      </button>
      <button class="px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600">
        <on type="click">
          <!-- 입력을 버리고 나간다 — 창을 닫고 보기 모드로 되돌리며 선택을 비운다. -->
          <sequence>
            <close-modal/>
            <set-state target="global" panelMode="view" :selectedTemplateId="null" :selectedTemplate="null"/>
          </sequence>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.discard</span>
      </button>
    </div>
  </modal>
</partial>
