<!-- 공지 템플릿 편집 중 다른 항목을 고르려 할 때 뜨는 이탈 확인 창(공통정보 화면의 같은 창과 같은 규칙).
  가려던 항목은 목록이 `_global.pendingTemplate*` 에 잡아 두고, 이 창의 "취소하고 이동" 이 그 값을 실제
  선택으로 옮긴다 — 이 창이 이동을 완결하는 자리이고, 여기서 옮기지 않으면 클릭이 사라진다. 입력을 버리는
  유일한 경로이기도 하다. "계속 수정" 은 창만 닫는다.
  이동 쪽은 폼 입력(`_local`)도 비우므로 창 닫기를 맨 뒤에 둔다 — 모달이 먼저 사라지면 그 뒤의 `_local`
  쓰기가 닿을 자리가 흔들린다(공통정보 창과 같은 순서). -->
<partial description="Product Notice Template Editing Discard Confirmation Modal">
  <modal data-type="composite" data-ref="editing_confirm_modal" title="$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.title" size="medium">
    <div>
      <div class="flex-start gap-3">
        <div class="flex-shrink-0 mt-0.5">
          <icon name="triangle-exclamation" class="text-xl text-amber-600 dark:text-amber-400"/>
        </div>
        <div class="flex-1">
          <p class="text-primary text-base mb-2">$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.message</p>
          <p class="text-label">$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.confirm_message</p>
        </div>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <close-modal/>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.continue</span>
      </button>
      <button type="button" class="px-4 py-2 bg-red-600 dark:bg-red-600 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-700">
        <on type="click">
          <!-- 입력을 버리고 대기 중이던 항목으로 이동 — 목록이 잡아 둔 대기 값(_global.pendingTemplate*)을 실제 선택으로
            옮기고 주소도 그 항목으로 갈아끼운 뒤, 폼 입력·오류를 비우고 창을 닫는다. 주소 갈아끼우기는 대기 값을 비우기 전에
            한다(비운 뒤에는 갈 곳을 모른다). 대기 값이 없으면(목록 밖에서 창이 열린 경우) 종전처럼 선택을 비운다. -->
          <sequence>
            <replace-url if="{{!!_global.pendingTemplateId}}" :mergeQuery="true">
              <query id="{{_global.pendingTemplateId}}" mode="view"/>
            </replace-url>
            <set-state target="global" selectedTemplateId="{{_global.pendingTemplateId}}" selectedTemplate="{{_global.pendingTemplate}}" panelMode="view" :pendingTemplateId="null" :pendingTemplate="null"/>
            <set-state target="local" :form="null" :errors="null" :isSaving="false"/>
            <close-modal/>
          </sequence>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product_notice_template.modals.editing.discard</span>
      </button>
    </div>
  </modal>
</partial>
