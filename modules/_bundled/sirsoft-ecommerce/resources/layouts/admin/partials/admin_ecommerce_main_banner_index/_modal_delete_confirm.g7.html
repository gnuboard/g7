<!-- 메인 배너 삭제 확인 창.
  **아직 시안이다** — 확인 버튼이 창을 닫기만 하고 삭제 요청을 보내지 않는다(메인 배너 화면
  전체가 같은 상태이고 모듈에 대응 라우트가 없다). 어떤 배너를 지우는지도 넘겨받지 않는다.
  배선할 때는 대상 배너를 받는 자리와 확인 버튼의 삭제 호출이 함께 생긴다. -->
<partial description="Main Banner Delete Confirm Modal">
  <modal data-type="composite" data-ref="modal_delete_confirm" title="$t:sirsoft-ecommerce.admin.main_banner.modal.delete.title" size="sm">
    <footer>
      <button type="button" class="btn btn-outline">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.main_banner.modal.delete.cancel
      </button>
      <button type="button" class="btn btn-primary">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.main_banner.modal.delete.confirm
      </button>
    </footer>
    <p class="text-body">$t:sirsoft-ecommerce.admin.main_banner.modal.delete.message</p>
  </modal>
</partial>
