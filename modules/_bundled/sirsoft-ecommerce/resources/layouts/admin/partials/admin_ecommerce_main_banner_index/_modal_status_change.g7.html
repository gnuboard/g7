<!-- 배너 노출 상태를 바꾸기 전 확인받는 창.
  **아직 시안이다** — 확인 버튼이 창을 닫기만 한다. 게다가 목록의 스위치는 이 창을 거치지 않고
  곧바로 상태를 뒤집으므로, 지금은 이 창이 열리는 경로 자체가 없다.
  배선할 때는 목록 스위치가 이 창을 먼저 열고, 확인 쪽에서 상태 변경 요청을 보내는 형태가 된다. -->
<partial description="Main Banner Status Change Modal">
  <modal data-type="composite" data-ref="modal_status_change" title="$t:sirsoft-ecommerce.admin.main_banner.modal.status_change.title" size="sm">
    <footer>
      <button type="button" class="btn btn-outline">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.main_banner.modal.status_change.cancel
      </button>
      <button type="button" class="btn btn-primary">
        <on type="click">
          <close-modal/>
        </on>
        $t:sirsoft-ecommerce.admin.main_banner.modal.status_change.confirm
      </button>
    </footer>
    <p class="text-body mb-4">$t:sirsoft-ecommerce.admin.main_banner.modal.status_change.message</p>
  </modal>
</partial>
