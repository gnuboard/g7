<!-- 배너가 쇼핑몰에서 어떻게 보일지 미리 보여 주는 자리. 언어를 골라 그 언어의 배너를 확인한다.
  **아직 시안이다** — 캐러셀 자리는 회색 상자이고 실제 배너를 그리지 않는다. 살아 있는 것은
  언어 선택뿐이며, 그 선택도 `_local.previewLanguage` 에만 남을 뿐 아래 미리보기를 바꾸지 않는다.
  언어 목록은 하드코딩이 아니라 앱 설정의 지원 로케일에서 온다 — 이 부분은 배선 후에도 그대로 쓴다. -->
<partial description="Main Banner Preview Slider Partial">
  <div data-ref="preview_slider_section" class="ecommerce-admin-card ecommerce:mb-6">
    <div data-ref="preview_header" class="ecommerce-flex-between ecommerce:mb-4">
      <h3 class="ecommerce-card-title">$t:sirsoft-ecommerce.admin.main_banner.preview.title</h3>
      <select name="previewLanguage" aria-label="$t:common.language" class="ecommerce:w-28" value="{{_local.previewLanguage}}" options="{{(_global.appConfig?.supportedLocales ?? ['ko', 'en']).map(l => ({ value: l, label: _global.appConfig?.localeNames?.[l] ?? l }))}}">
        <on type="change">
          <!-- 미리보기 언어 선택. 값만 지역 상태에 남고 아래 캐러셀은 아직 이 값을 읽지 않는다(시안). -->
          <set-state target="_local" previewLanguage="{{$event.target.value}}"/>
        </on>
      </select>
    </div>
    <div data-ref="carousel_placeholder" class="ecommerce:relative ecommerce:bg-gray-100 ecommerce:dark:bg-gray-800 ecommerce:rounded-lg ecommerce:overflow-hidden">
      <div class="ecommerce-flex-center ecommerce:aspect-[3/1] ecommerce:justify-center">
        <div class="ecommerce:absolute ecommerce:inset-0 ecommerce:bg-gradient-to-r ecommerce:from-gray-700 ecommerce:to-gray-600"/>
        <div class="ecommerce:relative ecommerce:z-10 ecommerce:text-center ecommerce:text-white">
          <p class="ecommerce:text-2xl ecommerce:font-bold ecommerce:mb-2">Always On Event</p>
          <p class="ecommerce:text-sm ecommerce:opacity-80">Special benefits available anytime</p>
        </div>
        <button data-ref="carousel_nav_prev" type="button" class="ecommerce-flex-center ecommerce:absolute ecommerce:left-4 ecommerce:top-1/2 ecommerce:-translate-y-1/2 ecommerce:w-10 ecommerce:h-10 ecommerce:rounded-full ecommerce:bg-white/20 ecommerce:hover:bg-white/30 ecommerce:justify-center ecommerce:text-white ecommerce:z-20" aria-label="$t:common.prev">
          <icon name="chevron-left" class="ecommerce:text-xl"/>
        </button>
        <button data-ref="carousel_nav_next" type="button" class="ecommerce-flex-center ecommerce:absolute ecommerce:right-4 ecommerce:top-1/2 ecommerce:-translate-y-1/2 ecommerce:w-10 ecommerce:h-10 ecommerce:rounded-full ecommerce:bg-white/20 ecommerce:hover:bg-white/30 ecommerce:justify-center ecommerce:text-white ecommerce:z-20" aria-label="$t:common.next">
          <icon name="chevron-right" class="ecommerce:text-xl"/>
        </button>
        <div data-ref="carousel_dots" class="ecommerce:absolute ecommerce:bottom-4 ecommerce:left-1/2 ecommerce:-translate-x-1/2 ecommerce-flex-center ecommerce:gap-2 ecommerce:z-20">
          <span class="ecommerce:w-2 ecommerce:h-2 ecommerce:rounded-full ecommerce:bg-white/50"/>
          <span class="ecommerce:w-2 ecommerce:h-2 ecommerce:rounded-full ecommerce:bg-white/50"/>
          <span class="ecommerce:w-2 ecommerce:h-2 ecommerce:rounded-full ecommerce:bg-white/50"/>
          <span class="ecommerce:w-2 ecommerce:h-2 ecommerce:rounded-full ecommerce:bg-white ecommerce:dark:bg-gray-800"/>
        </div>
      </div>
    </div>
    <div data-ref="preview_info" class="ecommerce:mt-3 ecommerce:text-sm ecommerce-text-secondary">
      <span>$t:sirsoft-ecommerce.admin.sample.fmt.slider_summary|count=4</span>
    </div>
  </div>
</partial>
