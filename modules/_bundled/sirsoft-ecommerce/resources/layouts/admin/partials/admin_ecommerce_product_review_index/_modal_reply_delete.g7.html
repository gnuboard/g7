<!-- 리뷰에 달린 관리자 답변을 지우는 확인 창. 리뷰 자체가 아니라 **답변만** 사라진다.
  대상은 여는 쪽이 정해 둔 `_global.editReviewId` 이고, 이 창은 그 값만 읽는다.
  실패해도 아무 알림이 없다 — 진행 깃발만 풀리고 창은 열린 채 남는다. 왜 안 지워졌는지는 화면에
  드러나지 않는다. -->
<partial>
  <modal data-type="composite" data-ref="modal_reply_delete" title="$t:sirsoft-ecommerce.admin.product_review.modal.reply_delete.title" size="sm">
    <div>
      <div>
        <p class="text-primary text-base">$t:sirsoft-ecommerce.admin.product_review.modal.reply_delete.message</p>
        <p class="text-sm text-red-600 dark:text-red-400 font-medium">$t:sirsoft-ecommerce.admin.product_review.modal.reply_delete.warning</p>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
        <on type="click">
          <close-modal target="modal_reply_delete"/>
        </on>
        <span>$t:sirsoft-ecommerce.admin.product_review.modal.reply_delete.cancel</span>
      </button>
      <button type="button" class="px-4 py-2 bg-red-600 dark:bg-red-500 text-white rounded-lg hover:bg-red-700 dark:hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.isDeleting || reviews.data?.abilities?.can_update !== true}}">
        <on type="click">
          <!-- 답변 삭제 실행. 성공하면 목록을 다시 불러 답변 표시를 없앤다. 진행 깃발은 양쪽 갈래에서 모두 푼다(한쪽만 풀면 버튼이 영영 잠긴다). -->
          <sequence>
            <set-state target="_local" :isDeleting="true"/>
            <api-call target="/api/modules/sirsoft-ecommerce/admin/reviews/{{_global.editReviewId}}/reply" :auth_required="true" method="DELETE">
              <success>
                <set-state target="_local" :isDeleting="false"/>
                <refetch-data-source dataSourceId="reviews"/>
                <close-modal target="modal_reply_delete"/>
              </success>
              <fail>
                <set-state target="_local" :isDeleting="false"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <span data-if="{{!_local.isDeleting}}">$t:sirsoft-ecommerce.admin.product_review.modal.reply_delete.confirm</span>
        <span data-if="{{_local.isDeleting}}">$t:common.loading</span>
      </button>
    </div>
  </modal>
</partial>
