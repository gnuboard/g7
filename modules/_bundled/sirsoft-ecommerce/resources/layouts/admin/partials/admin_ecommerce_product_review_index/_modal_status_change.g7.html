<partial description="Product Review Status Change Confirm Modal">
  <modal data-ref="modal_status_change" title="$t:sirsoft-ecommerce.admin.product_review.modal.status_change.title" size="sm">
    <div>
      <div>
        <p class="text-primary text-base">$t:sirsoft-ecommerce.admin.product_review.modal.status_change.message|count={{(_global.reviewBatchIds ?? []).length}}|status={{_global.reviewBatchAction === 'visible' ? '전시중' : '숨김'}}</p>
      </div>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="btn btn-outline"><on type="click"><close-modal target="modal_status_change"/><set-state target="local" batchAction=""/></on>$t:sirsoft-ecommerce.admin.product_review.modal.status_change.cancel</button>
      <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_local.isBatchProcessing ?? false}}">
        <on type="click">
          <set-state target="local" :isBatchProcessing="true"/>
          <api-call target="/api/modules/sirsoft-ecommerce/admin/reviews/bulk" :auth_required="true" method="POST">
            <success>
              <set-state target="local" :isBatchProcessing="false" batchAction="" :selectedReviews="[]"/>
              <refetch-data-source dataSourceId="reviews"/>
              <close-modal target="modal_status_change"/>
            </success>
            <fail>
              <set-state target="local" :isBatchProcessing="false"/>
            </fail>
            <body ids="{{_global.reviewBatchIds ?? []}}" action="change_status" status="{{_global.reviewBatchAction}}"/>
          </api-call>
        </on>
        <span data-if="{{!(_local.isBatchProcessing ?? false)}}">$t:sirsoft-ecommerce.admin.product_review.modal.status_change.confirm</span>
        <span data-if="{{_local.isBatchProcessing ?? false}}">$t:common.loading</span>
      </button>
    </div>
  </modal>
</partial>
