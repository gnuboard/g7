<!-- 리뷰에 첨부된 사진을 크게 보는 창. 사진만 띄우는 것이 아니라 위쪽에 작성자·별점·날짜·옵션·본문을
  함께 보여 준다 — 사진만으로는 어떤 리뷰인지 알 수 없기 때문이다.
  보여줄 리뷰와 지금 몇 번째 사진인지를 스스로 정하지 않고 여는 쪽이 `_global.reviewForModal` ·
  `_global.reviewImageIndex` 에 담아 준다.
  좌우 이동은 그 번호를 ±1 하는 것이 전부이고, 양 끝에서는 버튼이 잠긴다 — 범위를 넘으면 사진
  경로가 비어 빈 상자가 뜬다.
  옵션 배지에서 '기본: 기본' 조합만 걸러낸다 — 옵션이 없는 상품에 붙는 자리표시라 보여 줄 뜻이 없다. -->
<partial>
  <modal data-type="composite" data-ref="modal_image_preview" title="$t:sirsoft-ecommerce.admin.product_review.detail.image_preview.title" width="90vw" :closeOnBackdropClick="true">
    <div class="ecommerce:p-4">
      <!-- 리뷰 정보 영역 -->
      <div class="ecommerce:border-b ecommerce:border-gray-200 ecommerce:dark:border-gray-700">
        <!-- 이름 + 별점 + 날짜 -->
        <div class="ecommerce-flex-between">
          <span class="ecommerce-text-primary ecommerce:font-medium ecommerce:text-sm">{{_global.reviewForModal?.userName ?? ''}}</span>
          <div class="ecommerce-flex-center ecommerce:gap-2 ecommerce:shrink-0">
            <!-- 별점 아이콘 -->
            <div class="ecommerce-flex-center ecommerce:gap-0.5">
              <span data-each="star in {{[1,2,3,4,5]}}">
                <icon name="star" size="sm" class="{{star <= (_global.reviewForModal?.rating ?? 0) ? 'ecommerce:text-yellow-700 ecommerce:dark:text-yellow-300' : 'ecommerce:text-gray-500 ecommerce:dark:text-gray-500'}}"/>
              </span>
            </div>
            <span class="ecommerce-text-hint">{{_global.reviewForModal?.createdAt ?? ''}}</span>
          </div>
        </div>
        <!-- 옵션 배지 (있을 때만) -->
        <div data-if="{{(_global.reviewForModal?.optionValues ?? []).length > 0}}" class="ecommerce:flex ecommerce:flex-wrap ecommerce:gap-1">
          <span data-each="opt in {{_global.reviewForModal?.optionValues ?? []}}">
            <span data-if="{{!(opt.key?.ko === '기본' &amp;&amp; opt.value?.ko === '기본')}}" class="ecommerce-text-secondary ecommerce:dark:text-gray-300 ecommerce:inline-block ecommerce:text-xs ecommerce:px-2 ecommerce:py-0.5 ecommerce:bg-gray-100 ecommerce:dark:bg-gray-700 ecommerce:rounded">{{$localized(opt.key)}}: {{$localized(opt.value)}}</span>
          </span>
        </div>
        <div>
          <!-- 리뷰 내용 (2줄 말줄임) -->
          <p class="ecommerce-text-body ecommerce:line-clamp-2">{{_global.reviewForModal?.content ?? ''}}</p>
        </div>
      </div>
      <!-- 이미지 슬라이더 영역 -->
      <div class="ecommerce-flex-center ecommerce:flex-col ecommerce:gap-3">
        <!-- 이미지 + 좌우 버튼 -->
        <div class="ecommerce-flex-center ecommerce:relative ecommerce:justify-center ecommerce:w-full ecommerce:px-16">
          <img src="{{(_global.reviewForModal?.images ?? [])[Number(_global.reviewImageIndex)]?.download_url ?? ''}}" alt="" class="ecommerce:w-full ecommerce:max-w-full ecommerce:max-h-[500px] ecommerce:object-contain ecommerce:rounded-lg"/>
          <button type="button" class="ecommerce-flex-center ecommerce:absolute ecommerce:left-0 ecommerce:top-1/2 ecommerce:-translate-y-1/2 ecommerce:z-10 ecommerce:w-12 ecommerce:h-12 ecommerce:justify-center ecommerce:rounded-full ecommerce:bg-gray-200 ecommerce:dark:bg-gray-700 ecommerce:hover:bg-gray-300 ecommerce:dark:hover:bg-gray-600 ecommerce:text-gray-700 ecommerce:dark:text-gray-200 ecommerce:leading-none ecommerce:disabled:opacity-20 ecommerce:disabled:cursor-not-allowed" disabled="{{Number(_global.reviewImageIndex) <= 0}}">
            <on type="click">
              <!-- 이전 사진 — 번호를 하나 줄인다. 첫 장에서는 버튼이 잠기므로 음수로 내려가지 않는다. `Number()` 로 감싸는 것은 이 값이 글자로 들어올 수 있어 `'0' - 1` 이 아니라 숫자 뺄셈이 되게 하기 위해서다. -->
              <set-state target="global" reviewImageIndex="{{Number(_global.reviewImageIndex) - 1}}"/>
            </on>
            ❮
          </button>
          <button type="button" class="ecommerce-flex-center ecommerce:absolute ecommerce:right-0 ecommerce:top-1/2 ecommerce:-translate-y-1/2 ecommerce:z-10 ecommerce:w-12 ecommerce:h-12 ecommerce:justify-center ecommerce:rounded-full ecommerce:bg-gray-200 ecommerce:dark:bg-gray-700 ecommerce:hover:bg-gray-300 ecommerce:dark:hover:bg-gray-600 ecommerce:text-gray-700 ecommerce:dark:text-gray-200 ecommerce:leading-none ecommerce:disabled:opacity-20 ecommerce:disabled:cursor-not-allowed" disabled="{{Number(_global.reviewImageIndex) >= (_global.reviewForModal?.images?.length ?? 1) - 1}}">
            <on type="click">
              <!-- 다음 사진 — 마지막 장에서는 버튼이 잠긴다. 더하기에서 `Number()` 가 없으면 `'0' + 1` 이 `'01'` 이 되어 사진 경로가 깨진다. -->
              <set-state target="global" reviewImageIndex="{{Number(_global.reviewImageIndex) + 1}}"/>
            </on>
            ❯
          </button>
        </div>
        <!-- 이미지 카운터 (이미지 2장 이상일 때만) -->
        <div data-if="{{(_global.reviewForModal?.images?.length ?? 0) > 1}}" class="ecommerce-text-label-subtle">{{(Number(_global.reviewImageIndex) + 1) + ' / ' + (_global.reviewForModal?.images?.length ?? 1)}}</div>
      </div>
    </div>
  </modal>
</partial>
