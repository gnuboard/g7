<!-- 배송정책 폼의 국가별 기본 설정 — 배송 방법·통화·사용 여부, 그리고 그 나라 설정 자체의 삭제.
  부과 정책 조각과 마찬가지로 **국가 탭이 고른 한 나라만** 편집하고, 값은 `country_settings` 배열의
  그 번째 칸으로 들어간다.
  배송 방법으로 '직접 입력' 을 고르면 이름 칸이 하나 더 나타나고, 그 이름은 언어별 값이다.
  나라 삭제는 **마지막 하나는 지울 수 없다**(정책에 나라가 하나도 없으면 배송비를 매길 수 없다).
  수정 권한도 함께 본다. -->
<partial description="배송정책 폼 - 국가별 기본 배송 설정 (배송방법, 통화, 활성화, 국가 삭제)">
  <div data-ref="country_basic_fields_section" data-if="{{_computed.activeCountrySetting}}" class="admin-card">
    <h2 class="card-title">$t:sirsoft-ecommerce.admin.shipping_policy.form.section_country_basic</h2>
    <div data-ref="country_basic_content">
      <div data-ref="country_basic_fields" class="grid-2col-responsive">
        <div data-ref="field_country_shipping_method">
          <div>
            <label class="form-label">
              <span>$t:sirsoft-ecommerce.admin.shipping_policy.form.shipping_method</span>
              <span class="text-required">*</span>
            </label>
            <select class="{{_local.errors?.['country_settings.' + (_local.activeCountryTab ?? 0) + '.shipping_method'] ? 'input input-error w-full' : 'input w-full'}}" value="{{_computed.activeCountrySetting?.shipping_method ?? (ecommerce_settings?.data?.shipping?.types ?? []).find(t => t.is_active)?.code ?? 'parcel'}}" options="{{_computed.shippingMethodOptions ?? []}}" disabled="{{_computed.isReadOnly}}">
              <on type="change">
                <!-- 배송 방법 — 초깃값이 설정에서 활성인 첫 방법이라, 쇼핑몰이 쓰는 방법이 바뀌면 새 나라의 기본값도 따라 바뀐다. '직접 입력' 을 고르면 아래 이름 칸이 나타난다. -->
                <action handler="sirsoft-ecommerce.updateCountryField" field="shipping_method" value="{{$event.target.value}}"/>
              </on>
            </select>
            <span data-if="{{_local.errors?.['country_settings.' + (_local.activeCountryTab ?? 0) + '.shipping_method']}}" class="form-error-xs mt-0.5">{{_local.errors?.['country_settings.' + (_local.activeCountryTab ?? 0) + '.shipping_method']?.[0]}}</span>
            <div data-if="{{_computed.activeCountrySetting?.shipping_method === 'custom'}}" class="">
              <label class="text-secondary block text-xs font-medium mb-1">$t:sirsoft-ecommerce.admin.shipping_policy.form.custom_shipping_name</label>
              <multilingual-input data-type="composite" value="{{_computed.activeCountrySetting?.custom_shipping_name ?? {}}}" layout="inline" placeholder="$t:sirsoft-ecommerce.admin.shipping_policy.form.custom_shipping_name_placeholder" error="{{_local.errors?.['country_settings.' + (_local.activeCountryTab ?? 0) + '.custom_shipping_name.' + ($locale || 'ko')]?.[0] ?? ''}}" disabled="{{_computed.isReadOnly}}">
                <on type="change">
                  <!-- 직접 입력한 배송 방법 이름 — 언어별 묶음을 통째로 받아 그대로 저장한다(언어 하나씩 쪼개지 않는다). -->
                  <action handler="sirsoft-ecommerce.updateCountryField" field="custom_shipping_name" value="{{$event.target.value}}"/>
                </on>
              </multilingual-input>
            </div>
          </div>
        </div>
      </div>
      <div data-ref="country_currency_fields" class="grid-2col-responsive">
        <div data-ref="field_country_currency">
          <div>
            <label class="form-label">
              <span>$t:sirsoft-ecommerce.admin.shipping_policy.form.currency_code</span>
              <span class="text-required">*</span>
            </label>
            <div class="input w-full opacity-60 cursor-not-allowed flex items-center">{{_computed.defaultCurrencyLabel}}</div>
            <span class="text-field-hint block">$t:sirsoft-ecommerce.admin.shipping_policy.form.currency_code_fixed_hint</span>
          </div>
        </div>
        <div data-ref="field_country_is_active" class="flex items-end">
          <toggle data-type="composite" label="$t:sirsoft-ecommerce.admin.shipping_policy.form.country_active" checked="{{_computed.activeCountrySetting?.is_active ?? true}}" disabled="{{_computed.isReadOnly}}">
            <on type="change">
              <!-- 그 나라 설정 사용 여부. 스위치가 준 값을 읽지 않고 **현재 값을 뒤집는다** — 기본이 켬(`?? true`)이라 아직 아무도 쓴 적 없는 상태에서도 첫 클릭이 끔으로 가야 한다. -->
              <action handler="sirsoft-ecommerce.updateCountryField" field="is_active" value="{{!(_computed.activeCountrySetting?.is_active ?? true)}}"/>
            </on>
          </toggle>
        </div>
      </div>
      <div data-ref="country_remove_area" data-if="{{(_local.form?.country_settings ?? []).length > 1 &amp;&amp; !_computed.isReadOnly}}" class="flex justify-end border-t border-gray-100 dark:border-gray-700">
        <button type="button" class="btn btn-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
          <on type="click">
            <!-- 이 나라 설정 삭제 — 확인 문구를 액션에 달아 별도 창 없이 묻는다. 이 버튼 자체가 나라가 둘 이상일 때만 나타나므로 마지막 하나는 지워지지 않는다. -->
            <action handler="sirsoft-ecommerce.removeCountrySetting" confirm="$t:sirsoft-ecommerce.admin.shipping_policy.form.country_tab_remove_confirm" index="{{_local.activeCountryTab ?? 0}}"/>
          </on>
          <icon name="trash" class="text-xs mr-1"/>
          <span>$t:sirsoft-ecommerce.admin.shipping_policy.form.country_tab_remove</span>
        </button>
      </div>
    </div>
  </div>
</partial>
