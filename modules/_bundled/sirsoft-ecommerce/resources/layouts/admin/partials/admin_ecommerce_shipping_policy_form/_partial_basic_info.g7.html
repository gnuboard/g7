<partial description="배송정책 폼 - 기본정보 섹션 (정책명, 사용여부, 기본정책)">
  <div data-ref="basic_info_section" class="admin-card">
    <h2 class="card-title">$t:sirsoft-ecommerce.admin.shipping_policy.form.section_basic</h2>
    <div data-ref="basic_info_fields" class="row-stack">
      <div data-ref="field_name">
        <div>
          <label class="form-label">
            <span>$t:sirsoft-ecommerce.admin.shipping_policy.form.name</span>
            <span class="text-required">*</span>
          </label>
          <multilingual-input name="name" placeholder="$t:sirsoft-ecommerce.admin.shipping_policy.form.name_placeholder" :maxLength="200" :required="true" layout="tabs" disabled="{{_computed.isReadOnly}}"/>
          <span data-if="{{_local.errors?.name}}" class="form-error-xs">{{_local.errors?.name?.[0] ?? ''}}</span>
        </div>
      </div>
      <div data-ref="field_row_status" class="grid-2col-responsive">
        <div data-ref="field_is_active">
          <div>
            <toggle label="$t:sirsoft-ecommerce.admin.shipping_policy.form.is_active" name="is_active" disabled="{{_computed.isReadOnly}}"/>
          </div>
        </div>
        <div data-ref="field_is_default">
          <div>
            <toggle label="$t:sirsoft-ecommerce.admin.shipping_policy.form.is_default" name="is_default" disabled="{{_computed.isReadOnly}}"/>
          </div>
        </div>
      </div>
    </div>
  </div>
</partial>
