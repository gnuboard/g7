<!-- 회원가입 폼의 배송국가 선택. 위 통화 칸(priority 330) 바로 뒤에 서고 저장 경로도 같다
  — `name` 바인딩으로 가입 폼에 실려 가입 API 한 번에 넘어간다.
  해외배송을 켜지 않았으면 칸 자체가 나오지 않는다. 초깃값은 방문자의 현재 배송국가이고, 그 값은
  헤더 셀렉터 선택 > GeoIP 추정 > 기본 국가 순으로 정해진 것이다. -->
<extension target-layout="auth/register" priority="331">
  <inject target-id="register_extension_fields" position="append_child">
    <!-- 가입폼 배송국가 선택 (MP08 후속 / D6 — 이커머스 설치 + 해외배송 활성 시에만). 기본값=세션 배송국가(>GeoIP>기본국가). name 바인딩으로 registerForm 에 자동 포함 → /api/auth/register 제출. -->
    <div data-ref="ext_register_shipping_country" data-if="{{_global.modules?.['sirsoft-ecommerce']?.shipping?.international_shipping_enabled === true}}">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:sirsoft-ecommerce.auth.register_shipping_country.label</label>
      <select name="preferred_shipping_country" value="{{_local?.registerForm?.preferred_shipping_country ?? _global.preferredShippingCountry ?? _global.modules?.['sirsoft-ecommerce']?.shipping?.default_country ?? 'KR'}}" options="{{(_global.modules?.['sirsoft-ecommerce']?.shipping?.available_countries ?? []).filter(c => c.is_active).map(c => ({ value: c.code, label: ($localized(c.name, 'sirsoft-ecommerce::settings.countries.' + (c.code ?? '') + '.name') || c.code) }))}}" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500" disabled="{{_local?.isRegistering}}"/>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">$t:sirsoft-ecommerce.auth.register_shipping_country.hint</p>
    </div>
  </inject>
</extension>
