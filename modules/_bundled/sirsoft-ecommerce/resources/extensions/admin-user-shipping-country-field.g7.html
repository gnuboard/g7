<!-- 회원 편집 화면에 덧붙이는 배송국가 칸. 위 통화 칸(priority 330)과 같은 구조이고 바로 뒤에 선다.
  표시 조건이 하나 더 엄격하다 — 해외배송을 켜지 않은 쇼핑몰에서는 고를 나라가 하나뿐이라 칸
  자체를 내지 않는다(`international_shipping_enabled`).
  통화 칸과 마찬가지로 저장 버튼이 없고 회원정보 폼의 [저장]에 함께 실린다. -->
<extension target-layout="admin_user_form" priority="331">
  <inject target-id="extension_form_content" position="append_child">
    <!-- 회원 배송국가 설정 (MP08 후속 — 편집 모드 + 이커머스 설치 + 해외배송 활성 시에만) -->
    <div data-ref="ext_user_shipping_country" data-if="{{route?.id &amp;&amp; user?.data?.ecommerce_preferred_shipping_country !== undefined &amp;&amp; _global.modules?.['sirsoft-ecommerce']?.shipping?.international_shipping_enabled === true}}" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6 mt-6">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <icon name="earth-asia" size="md" class="text-gray-600 dark:text-gray-400"/>
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">$t:sirsoft-ecommerce.admin.user_shipping_country.title</h3>
        </div>
        <extension-badge type="module" identifier="sirsoft-ecommerce" installedModules="{{_global.installedModules}}"/>
      </div>
      <!-- 배송국가 Select — name 바인딩으로 회원정보 폼(dataKey=form)에 자동 포함. 별도 저장버튼 없음: 화면 하단 회원정보 [저장] 시 함께 저장된다. -->
      <div class="flex items-end gap-3">
        <select name="ecommerce_preferred_shipping_country" value="{{_local.form?.ecommerce_preferred_shipping_country ?? user?.data?.ecommerce_preferred_shipping_country ?? _global.modules?.['sirsoft-ecommerce']?.shipping?.default_country ?? 'KR'}}" options="{{(_global.modules?.['sirsoft-ecommerce']?.shipping?.available_countries ?? []).filter(c => c.is_active).map(c => ({ value: c.code, label: ($localized(c.name, 'sirsoft-ecommerce::settings.countries.' + (c.code ?? '') + '.name') || c.code) }))}}" class="w-full sm:w-64"/>
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">$t:sirsoft-ecommerce.admin.user_shipping_country.description</p>
    </div>
  </inject>
</extension>
