<!-- 체크아웃 현금영수증 신청 폼 (W-1 / #454). 템플릿 sirsoft-basic 의 _checkout_payment.json 이 dbank 블록 내부 말단에 연 슬롯에 주입한다. 슬롯이 무통장 블록 안이므로 결제수단 게이트는 불필요하고, 프로바이더 미설정 시에만 전체를 숨긴다. 발급 프로바이더는 PG 플러그인이 담당하지만 신청 폼은 PG 비종속이라 모듈이 소유한다 — 플러그인이 주입하면 두 PG 동시 활성 시 폼이 2개 렌더된다. -->
<extension extension-point="shop_checkout_cash_receipt_slot" mode="append" priority="100">
  <!-- 프로바이더 미설정이면 슬롯 전체 미렌더 (M2 — DOM 카운트 0) -->
  <div data-ref="ext_checkout_cash_receipt" data-if="{{!!paymentSettings?.data?.order_settings?.cash_receipt_provider}}" class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-600">
    <responsive on="portable" class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-600"/>
    <!-- 신청 체크박스 — 해제 시 하위 3필드를 if 로 숨기고 확장 칸을 비운다. 표시 게이트는 모듈 스크래치(cashReceiptRequested)와 제출 payload(checkoutExtraPayload.cash_receipt_requested)의 **합의**를 본다: 해제는 스크래치를 false 로 내려 꺼지고, 결제수단 전환은 템플릿이 payload 를 통째로 치환해 꺼진다. 한쪽만 보면 다른 경로에서 화면과 제출 내용이 갈린다 — 전환 후에는 화면이 신청 켜짐인데 payload 는 비어 있었다. -->
    <div class="flex items-center gap-2">
      <input data-ref="ext_checkout_cash_receipt_toggle" type="checkbox" name="cash_receipt_requested" checked="{{!!_local.cashReceiptRequested &amp;&amp; !!_local.checkoutExtraPayload?.cash_receipt_requested}}" class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
        <on type="change">
          <!-- 체크 시 기본값(소득공제 × 휴대폰번호)으로 확장 칸을 시드하고, 해제 시 확장 칸을 비워 주문 payload 에서 제거한다. 해제의 빈 객체는 기본(깊은) 병합이면 기존 키가 하나도 지워지지 않으므로 최상위 키를 통째로 바꾸는 shallow 병합으로 쓴다. -->
          <set-state target="local" merge="shallow" cashReceiptRequested="{{$event.target.checked}}" cashReceiptType="{{$event.target.checked ? (_local.checkoutExtraPayload?.cash_receipt_type ?? 'income') : null}}" cashReceiptIdentifierType="{{$event.target.checked ? (_local.checkoutExtraPayload?.cash_receipt_identifier_type ?? 'phone') : null}}" cashReceiptIdentifier="{{$event.target.checked ? (_local.checkoutExtraPayload?.cash_receipt_identifier ?? '') : null}}" checkoutExtraPayload="{{Object.assign(Object.fromEntries(Object.entries(_local.checkoutExtraPayload ?? {}).filter(entry => !String(entry[0]).startsWith('cash_receipt_'))), $event.target.checked ? { cash_receipt_requested: true, cash_receipt_type: (_local.checkoutExtraPayload?.cash_receipt_type ?? 'income'), cash_receipt_identifier_type: (_local.checkoutExtraPayload?.cash_receipt_identifier_type ?? 'phone'), cash_receipt_identifier: (_local.checkoutExtraPayload?.cash_receipt_identifier ?? '') } : {})}}"/>
        </on>
      </input>
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">$t:sirsoft-ecommerce.checkout.cash_receipt.request</label>
    </div>
    <!-- 신청 시에만 렌더 (M4 — 클릭 전후 필드 수 0 → 3).
         표시 상태는 조각 미러(cashReceiptRequested)와 확장 칸(checkoutExtraPayload) 양쪽이
         살아 있을 때만 참이다. 결제수단을 바꾸면 템플릿이 확장 칸만 비우므로, 미러만 읽으면
         칸은 비었는데 체크는 남아 "신청함으로 보이지만 주문에는 실리지 않는" 상태가 된다. -->
    <div data-ref="ext_checkout_cash_receipt_fields" data-if="{{!!_local.cashReceiptRequested &amp;&amp; !!_local.checkoutExtraPayload?.cash_receipt_requested}}" class="mt-3 space-y-3">
      <!-- 용도 — 라디오 2종 (가로 → portable 세로 스택) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">$t:sirsoft-ecommerce.checkout.cash_receipt.purpose</label>
        <div data-ref="ext_checkout_cash_receipt_purpose" class="flex flex-row gap-4">
          <responsive on="portable" class="flex flex-col gap-2"/>
          <!-- 소득공제용 -->
          <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
            <input type="radio" name="cash_receipt_type" value="income" checked="{{(_local.cashReceiptType ?? 'income') === 'income'}}" class="w-4 h-4 border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
              <on type="change">
                <!-- 소득공제로 전환 — 사업자등록번호는 소득공제에 쓸 수 없으므로 발급수단이 business 면 phone 으로 리셋 (M5) -->
                <set-state target="local" cashReceiptType="income" cashReceiptIdentifierType="{{_local.cashReceiptIdentifierType === 'business' ? 'phone' : (_local.cashReceiptIdentifierType ?? 'phone')}}" cashReceiptIdentifier="{{_local.cashReceiptIdentifierType === 'business' ? '' : (_local.cashReceiptIdentifier ?? '')}}" checkoutExtraPayload="{{ { cash_receipt_requested: true, cash_receipt_type: 'income', cash_receipt_identifier_type: (_local.cashReceiptIdentifierType === 'business' ? 'phone' : (_local.cashReceiptIdentifierType ?? 'phone')), cash_receipt_identifier: (_local.cashReceiptIdentifierType === 'business' ? '' : (_local.cashReceiptIdentifier ?? '')) } }}"/>
              </on>
            </input>
            <span>$t:sirsoft-ecommerce.checkout.cash_receipt.purpose_income</span>
          </label>
          <!-- 지출증빙용 -->
          <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
            <input type="radio" name="cash_receipt_type" value="expense" checked="{{_local.cashReceiptType === 'expense'}}" class="w-4 h-4 border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500">
              <on type="change">
                <!-- 지출증빙으로 전환 — 발급수단 3종이 모두 유효하므로 현재 선택을 유지한다 (D10: 휴대폰도 지출증빙 가능) -->
                <set-state target="local" cashReceiptType="expense" checkoutExtraPayload="{{ { cash_receipt_requested: true, cash_receipt_type: 'expense', cash_receipt_identifier_type: (_local.cashReceiptIdentifierType ?? 'phone'), cash_receipt_identifier: (_local.cashReceiptIdentifier ?? '') } }}"/>
              </on>
            </input>
            <span>$t:sirsoft-ecommerce.checkout.cash_receipt.purpose_expense</span>
          </label>
        </div>
      </div>
      <!-- 발급수단 / 번호 — 2열 → portable 1열 -->
      <div data-ref="ext_checkout_cash_receipt_identifier_row" class="grid grid-cols-2 gap-3">
        <responsive on="portable" class="grid grid-cols-1 gap-3"/>
        <!-- 발급수단 options — 소득공제는 2종, 지출증빙은 사업자등록번호 포함 3종 (D10). computed 대신 표현식으로 {value,label} 변환 (valueKey/labelKey prop 금지). -->
        <select data-ref="ext_checkout_cash_receipt_identifier_type" name="cash_receipt_identifier_type" value="{{_local.cashReceiptIdentifierType ?? 'phone'}}" options="{{(_local.cashReceiptType === 'expense' ? [{ value: 'business', label: $t('sirsoft-ecommerce.checkout.cash_receipt.identifier_business') }] : []).concat([{ value: 'phone', label: $t('sirsoft-ecommerce.checkout.cash_receipt.identifier_phone') }, { value: 'card', label: $t('sirsoft-ecommerce.checkout.cash_receipt.identifier_card') }])}}" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
          <responsive on="portable" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 text-sm"/>
          <on type="change">
            <!-- 발급수단 변경 시 번호를 비운다 — 휴대폰번호를 사업자등록번호 칸에 남겨두면 검증에서 422 가 난다. -->
            <set-state target="local" cashReceiptIdentifierType="{{$event.target.value}}" cashReceiptIdentifier="" checkoutExtraPayload="{{ { cash_receipt_requested: true, cash_receipt_type: (_local.cashReceiptType ?? 'income'), cash_receipt_identifier_type: $event.target.value, cash_receipt_identifier: '' } }}"/>
          </on>
        </select>
        <input data-ref="ext_checkout_cash_receipt_identifier" type="text" name="cash_receipt_identifier" value="{{_local.cashReceiptIdentifier ?? ''}}" placeholder="$t:sirsoft-ecommerce.checkout.cash_receipt.identifier_placeholder" class="{{_local.errors?.cash_receipt_identifier ? 'w-full px-4 py-2 border-2 border-red-500 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-red-500' : 'w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500'}}">
          <responsive on="portable" class="{{_local.errors?.cash_receipt_identifier ? 'w-full px-3 py-2 border-2 border-red-500 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-red-500 text-sm' : 'w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 text-sm'}}"/>
          <on type="change">
            <!-- 식별번호를 입력할 때마다 주문서가 서버로 보낼 꾸러미를 통째로 다시 만든다 — 개별 키만 고치면 신청 여부·유형과 어긋난 채 전송될 수 있다 -->
            <set-state target="local" cashReceiptIdentifier="{{$event.target.value}}" checkoutExtraPayload="{{ { cash_receipt_requested: true, cash_receipt_type: (_local.cashReceiptType ?? 'income'), cash_receipt_identifier_type: (_local.cashReceiptIdentifierType ?? 'phone'), cash_receipt_identifier: $event.target.value } }}"/>
          </on>
        </input>
      </div>
      <!-- 서버 검증 오류 인라인 노출 (M6 — 사업자번호 체크섬 오류 등) -->
      <span data-if="{{!!_local.errors?.cash_receipt_identifier}}" class="block text-red-500 text-xs">{{_local.errors?.cash_receipt_identifier?.[0] ?? ''}}</span>
      <p class="text-xs text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.checkout.cash_receipt.purpose_help</p>
      <p class="text-xs text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.checkout.cash_receipt.immutable_help</p>
    </div>
  </div>
</extension>
