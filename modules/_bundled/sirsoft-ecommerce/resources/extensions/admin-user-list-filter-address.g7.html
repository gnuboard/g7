<!-- 회원관리 목록 필터에 덧붙이는 「배송지」 행 (#705 예제 E2). 마일리지 행(priority 200) 바로 뒤에 선다.
  e2e:allow 값 조립 핸들러의 소유만 관리자 템플릿에서 이 모듈로 옮겼다 — 조립 규칙은 그대로이고 모듈 Vitest 가 같은 계약을 고정한다.
  두 조건을 한 행에 둔다 — 배송지 국가(그 나라 배송지를 하나라도 가진 회원)와 배송지 등록 여부.
  「없음」을 고르면 국가는 무시된다(배송지가 없는 회원은 어느 나라 배송지도 없다) — 그래서 「없음」일 때
  국가 칸을 잠근다.
  값 채널은 마일리지 행과 같다 — 이 모듈의 핸들러 `sirsoft-ecommerce.setUserFilterExt` 로 `_local.userFilterExtraQuery` 에
  넣고, 확장점을 연 관리자 템플릿의 검색 버튼이 `ext_filters[]` 로 보낸다. 서버 쪽은 `UserListAddressFilterListener` 가 맡는다.
  국가 선택지는 쇼핑몰 설정의 배송 가능 국가다(회원 편집 화면의 배송국가 칸과 같은 출처). -->
<extension extension-point="admin_user_list_filters" mode="append" priority="201">
  <div data-ref="ext_ecommerce_address_filter_row" class="flex flex-col gap-2 md:flex-row md:items-center">
    <permissions>
      <permission>sirsoft-ecommerce.user-addresses.read</permission>
    </permissions>
    <responsive on="portable" class="flex flex-col gap-2 items-start"/>
    <span class="block mb-2 w-32 text-sm text-gray-600 dark:text-gray-400 md:mb-0 shrink-0 md:flex md:items-center">$t:sirsoft-ecommerce.admin.user_filter.shipping_country</span>
    <div class="flex items-center flex-wrap gap-3">
      <select name="ecommerceShippingCountry" class="w-40" aria-label="$t:sirsoft-ecommerce.admin.user_filter.shipping_country" disabled="{{(_local.userFilterExtraQuery || []).includes('sirsoft-ecommerce.has_address=0')}}" value="{{((_local.userFilterExtraQuery || []).find(e => e.startsWith('sirsoft-ecommerce.shipping_country=')) || '').slice('sirsoft-ecommerce.shipping_country='.length)}}" options="{{[{ value: '', label: '$t:sirsoft-ecommerce.admin.user_filter.shipping_country_all' }, ...((_global.modules?.['sirsoft-ecommerce']?.shipping?.available_countries ?? []).filter(c => c.is_active).map(c => ({ value: c.code, label: ($localized(c.name, 'sirsoft-ecommerce::settings.countries.' + (c.code ?? '') + '.name') || c.code) })))]}}">
        <on type="change">
          <!-- 배송지 국가. 고르면 그 나라 배송지를 하나라도 가진 회원만 남는다 — 기본 배송지만 보지 않는다. -->
          <sequence>
            <action handler="sirsoft-ecommerce.setUserFilterExt" key="sirsoft-ecommerce.shipping_country" value="{{$event.target.value}}" current="{{_local.userFilterExtraQuery || []}}"/>
            <set-state target="_local" userFilterExtraQuery="{{$prev}}"/>
          </sequence>
        </on>
      </select>
      <span class="text-sm text-gray-500 dark:text-gray-400">$t:sirsoft-ecommerce.admin.user_filter.has_address</span>
      <label class="flex items-center gap-1 cursor-pointer">
        <input type="radio" name="ecommerceHasAddress" value="" checked="{{!(_local.userFilterExtraQuery || []).some(e => e.startsWith('sirsoft-ecommerce.has_address='))}}" class="radio">
          <on type="change">
            <!-- 배송지 등록 — 전체(조건 없음). -->
            <sequence>
              <action handler="sirsoft-ecommerce.setUserFilterExt" key="sirsoft-ecommerce.has_address" value="" current="{{_local.userFilterExtraQuery || []}}"/>
              <set-state target="_local" userFilterExtraQuery="{{$prev}}"/>
            </sequence>
          </on>
        </input>
        <span class="text-sm text-gray-700 dark:text-gray-300">$t:common.all</span>
      </label>
      <label class="flex items-center gap-1 cursor-pointer">
        <input type="radio" name="ecommerceHasAddress" value="1" checked="{{(_local.userFilterExtraQuery || []).includes('sirsoft-ecommerce.has_address=1')}}" class="radio">
          <on type="change">
            <!-- 배송지가 하나라도 있는 회원. -->
            <sequence>
              <action handler="sirsoft-ecommerce.setUserFilterExt" key="sirsoft-ecommerce.has_address" value="1" current="{{_local.userFilterExtraQuery || []}}"/>
              <set-state target="_local" userFilterExtraQuery="{{$prev}}"/>
            </sequence>
          </on>
        </input>
        <span class="text-sm text-gray-700 dark:text-gray-300">$t:sirsoft-ecommerce.admin.user_filter.has_address_yes</span>
      </label>
      <label class="flex items-center gap-1 cursor-pointer">
        <input type="radio" name="ecommerceHasAddress" value="0" checked="{{(_local.userFilterExtraQuery || []).includes('sirsoft-ecommerce.has_address=0')}}" class="radio">
          <on type="change">
            <!-- 배송지가 하나도 없는 회원. 국가 조건과 함께 참일 수 없으므로 서버가 국가를 무시하고, 화면도 국가 칸을 잠근다. -->
            <sequence>
              <action handler="sirsoft-ecommerce.setUserFilterExt" key="sirsoft-ecommerce.has_address" value="0" current="{{_local.userFilterExtraQuery || []}}"/>
              <set-state target="_local" userFilterExtraQuery="{{$prev}}"/>
            </sequence>
          </on>
        </input>
        <span class="text-sm text-gray-700 dark:text-gray-300">$t:sirsoft-ecommerce.admin.user_filter.has_address_no</span>
      </label>
      <extension-badge data-type="composite" type="module" identifier="sirsoft-ecommerce" installedModules="{{_global.installedModules}}"/>
    </div>
  </div>
</extension>
