<!-- 회원관리 목록 필터에 덧붙이는 「마일리지 잔액」 행 (#705 예제 E1).
  관리자 템플릿의 회원 목록이 상세검색 아래에 연 확장점(`admin_user_list_filters`)에 붙으므로 기본/상세
  이동 대상이 아니고, 상세검색을 펼쳤을 때만 보인다.
  e2e:allow 값 조립 핸들러의 소유만 관리자 템플릿에서 이 모듈로 옮겼다 — 조립 규칙은 그대로이고 모듈 Vitest 가 같은 계약을 고정한다.
  값은 직접 URL 에 싣지 않는다 — 이 모듈의 핸들러 `sirsoft-ecommerce.setUserFilterExt` 로
  `_local.userFilterExtraQuery` 배열에 `sirsoft-ecommerce.mileage_min=…` 원소를 넣고 빼면, 확장점을 연
  관리자 템플릿의 검색 버튼이 그 배열을 `ext_filters[]` 로 보낸다. 핸들러는 템플릿이 아니라 이 모듈이
  소유한다 — 조각은 어느 관리자 템플릿으로 그려지든 같은 동작을 해야 한다. 칸의 표시값도 같은 배열에서 되읽으므로 새로고침·뒤로가기에서 URL 로부터 복원된다.
  서버 쪽 규칙·조건은 `UserListMileageFilterListener` 가 맡는다. 잔액은 상점 기본 통화 기준이다.
  마일리지를 볼 권한이 없는 운영자에게는 행 자체를 내지 않는다(서버도 조건을 무시한다). -->
<extension extension-point="admin_user_list_filters" mode="append" priority="200">
  <div data-ref="ext_ecommerce_mileage_filter_row" class="flex flex-col gap-2 md:flex-row md:items-center">
    <permissions>
      <permission>sirsoft-ecommerce.mileage.read</permission>
    </permissions>
    <responsive on="portable" class="flex flex-col gap-2 items-start"/>
    <span class="block mb-2 w-32 text-sm text-gray-600 dark:text-gray-400 md:mb-0 shrink-0 md:flex md:items-center">$t:sirsoft-ecommerce.admin.user_filter.mileage</span>
    <div class="flex items-center flex-wrap gap-2">
      <input type="number" name="ecommerceMileageMin" min="0" class="input w-32" placeholder="$t:sirsoft-ecommerce.admin.user_filter.mileage_min" value="{{((_local.userFilterExtraQuery || []).find(e => e.startsWith('sirsoft-ecommerce.mileage_min=')) || '').slice('sirsoft-ecommerce.mileage_min='.length)}}">
        <on type="change">
          <!-- 잔액 하한. 0 도 유효한 값이다 — 비우면 조건에서 빠진다(핸들러가 빈 값의 원소를 지운다). -->
          <sequence>
            <action handler="sirsoft-ecommerce.setUserFilterExt" key="sirsoft-ecommerce.mileage_min" value="{{$event.target.value}}" current="{{_local.userFilterExtraQuery || []}}"/>
            <set-state target="_local" userFilterExtraQuery="{{$prev}}"/>
          </sequence>
        </on>
      </input>
      <span class="text-gray-400 dark:text-gray-500">~</span>
      <input type="number" name="ecommerceMileageMax" min="0" class="input w-32" placeholder="$t:sirsoft-ecommerce.admin.user_filter.mileage_max" value="{{((_local.userFilterExtraQuery || []).find(e => e.startsWith('sirsoft-ecommerce.mileage_max=')) || '').slice('sirsoft-ecommerce.mileage_max='.length)}}">
        <on type="change">
          <!-- 잔액 상한. 하한보다 작으면 서버가 422 로 거절한다. 잔액 행이 없는 회원은 0 으로 보고 상한 안에 든다. -->
          <sequence>
            <action handler="sirsoft-ecommerce.setUserFilterExt" key="sirsoft-ecommerce.mileage_max" value="{{$event.target.value}}" current="{{_local.userFilterExtraQuery || []}}"/>
            <set-state target="_local" userFilterExtraQuery="{{$prev}}"/>
          </sequence>
        </on>
      </input>
      <extension-badge data-type="composite" type="module" identifier="sirsoft-ecommerce" installedModules="{{_global.installedModules}}"/>
    </div>
  </div>
</extension>
