# 시나리오 매니페스트 — 관리자 PG 연동 경로의 주문 권한 범위 재적용 (#789 전수조사)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"
# audit:allow test-scenario-coverage[cross_product] reason: |
#   이 플러그인에는 거래번호로 받는 관리자 경로가 없다(주문번호 경로·배지 목록·원장 감사만). route_shape 축은
#   kginicis·nicepayments 와 같은 이름을 쓰되 해당 경로가 없는 값은 두지 않는다.
feature: admin_order_scope_guard

description: |
  관리자 PG 연동 경로는 이커머스 주문 권한(`orders.read`·`orders.update`)을 걸지만 주문을 주문번호 경로로
  받아 권한 미들웨어의 범위 검사가 돌지 않았다. 「본인만」·「소유역할」 범위의 관리자가 남의 주문의 거래 상태·
  에스크로 배송을 보고 바꿀 수 있었다.

  - 주문번호 경로: 주문을 찾은 직후 범위 판정, 범위 밖이면 403(500 아님), PG 를 부르지 않는다.
  - 테스트 결제 배지 맵: 범위 밖 주문번호를 싣지 않는다.
  - 원장: 이 플러그인의 관리자 라우트와 강제 지점이 원장에 있고, 감사가 낡은 지점을 잡는다.

axes:
  target:
    - others
    - own
  route_shape:
    - order_number
    - list
    - ledger_audit

effects:
  - out_of_scope_order_is_denied_with_403
  - in_scope_order_is_not_denied
  - out_of_scope_orders_are_filtered_from_list
  - plugin_routes_are_ledgered_with_scope_enforcers

test_files:
  - plugins/_bundled/sirsoft-pay_nhnkcp/tests/Feature/Controllers/AdminOrderScopeGuardTest.php

validation:
  audit_rule: test-scenario-coverage
