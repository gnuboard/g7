feature: NHN KCP 영수증 조회 API — 회원·비회원 접근 판정과 공통 형식 응답

description: |
  마이페이지·비회원 주문 상세·주문 완료의 영수증 버튼과 결제 정보 카드 스크립트가 부르는 API 다. 회원이면 본인 주문만,
  비로그인이면 조회 토큰 헤더(X-Guest-Order-Token) 또는 결제 직후 영수증 쿠키로만 통과하고 그 밖에는 404(대상 없음)다.
  로그인한 회원은 비회원 조회 토큰을 실어도 회원 분기가 먼저라 비회원 주문에 닿지 않는다.
  응답은 공통 형식({ success, message, data })이고 매출전표·현금영수증 주소와 결제수단 표시 이름은 data 안에 있다.

axes:
  viewer: [member_session, guest_valid_token, guest_receipt_cookie, guest_invalid_token, guest_other_order_token, member_with_guest_token]

effects:
  - receipt_url_returned
  - easy_pay_display_label_returned
  - lookup_denied_as_not_found
  - response_uses_common_envelope

test_files:
  - plugins/_bundled/sirsoft-pay_nhnkcp/tests/Feature/Controllers/UserReceiptControllerTest.php
