# 시나리오 매니페스트 — NHN KCP 클레임 추가결제 환급 리스너
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: nhnkcp_claim_payment_refund_listener

description: |
  클레임 추가결제 환급은 이커머스의 `claim_payment.refund` 필터를 KCP 환급 리스너가 받아 처리한다.
  리스너는 컨테이너에서 풀려 이커머스 공개 계약을 주입받는다(#916 ②, 훅 인자 Model 은 읽기만).
  승인 쪽은 `claim-payment-approve-listener.yaml` 이 소유한다.

  - 환급 훅을 필터로 구독하고, 다른 PG 의 결제 건은 처리하지 않는다. 거래번호(tno)가 없으면 거절한다.
  - 전액 환급은 결제 당시 자격증명(site_cd)을 복원해 전체 취소로, 부분 환급은 이미 환급된 금액을 뺀 잔액을
    rem_mny 로 함께 보낸다. 결제대행사 호출 오류는 실패 결과다.

axes:
  case: [hook_subscription, other_provider, missing_transaction_id, full_refund, partial_refund, pg_api_error]

effects:
  - kcp_claim_refund_listener_subscribes_the_refund_filter         # 환급 훅을 필터로 구독
  - kcp_claim_refund_listener_skips_other_providers                # 다른 PG 결제 건은 처리하지 않는다
  - kcp_claim_refund_without_tno_is_rejected                       # 거래번호(tno) 없는 결제 건 환급은 거절
  - kcp_claim_full_refund_restores_credentials_and_cancels_in_full # 전액 환급 → 결제 당시 site_cd 복원 후 전체 취소
  - kcp_claim_partial_refund_passes_remaining_balance_as_rem_mny   # 부분 환급 → 취소 가능 잔액을 rem_mny 로 함께 보낸다
  - kcp_claim_refund_pg_api_error_returns_failure                  # 결제대행사 호출 오류 → 실패 결과

test_files:
  - plugins/_bundled/sirsoft-pay_nhnkcp/tests/Unit/Listeners/ClaimPaymentRefundListenerTest.php
