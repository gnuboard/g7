feature: NHN KCP 시스템 점검 요약

description: |
  설정 화면 「시스템 점검」 카드가 결제서버 IP(공인 송신 IP, 실패 시 서버 IP 후보)와 그 출처를 알려 주고,
  항목 이름·결과·조치 안내와 출처 문구가 관리자 화면 언어를 따른다.

  수정 이력: 이커머스 전수 실측 S5-D12 (2026-10-07) — 영어 화면에서도 한국어로 나오던 문구.

