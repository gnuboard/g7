  - plugins/_bundled/sirsoft-pay_nhnkcp/resources/js/__tests__/layouts/orderCompleteReceiptCredentials.test.tsx
  - plugins/_bundled/sirsoft-pay_nhnkcp/resources/js/__tests__/entryNoCoreOverrides.test.ts
