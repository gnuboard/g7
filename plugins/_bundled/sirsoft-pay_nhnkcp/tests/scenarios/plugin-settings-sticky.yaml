feature: NHN KCP 결제 환경설정 화면 — 기본 배치·하단 버튼 고정·저장 오류 처리

description: |
  환경설정 화면의 하단 저장 버튼이 긴 내용을 스크롤하는 동안 화면 아래에 붙어 있는지, 화면 루트의 여백이
  폭에 따라(기본 p-4, 640~1023px p-6, 1024px 이상 p-8 — 엔진 responsive 갈래) 정해지는지, 저장 실패 때
  검증 오류를 error 컨텍스트에서 읽어 상단 오류 영역으로 옮기는지 고정한다.

axes:
  plugin: [sirsoft-pay_nhnkcp]
  element: [vbank_noti_url, cancel_server_ip, footer, health_card, health_card_divider, root]

effects:
  - vbank_noti_url_guide_shown
  - cancel_server_ip_guide_shown
  - footer_buttons_stick_to_bottom
  - health_card_uses_admin_card_tone
  - health_card_dividers_use_card_tone
  - settings_root_layout_by_width

test_files:
  - plugins/_bundled/sirsoft-pay_nhnkcp/resources/js/__tests__/layouts/pluginSettingsSticky.test.tsx
