# 시나리오 매니페스트 — NHN KCP 클레임 결제 경로의 #599 validate P2 결함 (07-core-plugins)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: nhnkcp_validate_p2_claim_payment_hardening

description: |
  #599 브랜치 검증 07-core-plugins 가 찾은 결제 플러그인 결함 중 NHN KCP 몫.

  - #8 클라이언트 승인 API 경로(`claim-payments/{no}/approve` → `respondApprove`)는 서버 콜백과 같은
    `claim_payment.approve` 필터를 타지만, 승인 뒤 거절의 보상(취소)은 서버 콜백의 클로저에만 있었다.
    리스너가 ① 결제창 금액(good_mny)을 승인 **전에** 청구액과 대조하고(낡은 결제창 거절, PG 호출 없음)
    ② KCP 응답이 금액을 싣고 왔는데 청구액과 다르면 승인분을 취소한 뒤 거절한다 — 어느 경로로
    들어와도 같다. (응답에 금액이 없을 때의 거절과 승인 요청의 ordr_mony 는
    approval-amount-verification.yaml 이 소유한다.)
  - CP 분기의 콜백 락 획득이 try 밖이라 대기 초과(`LockTimeoutException`)가 500 이 됐다. 이제 신청서 상세
    복귀(이미 결제됐으면 성공, 아니면 `callback_locked`)다.
  - 콜백·승인키 컨트롤러의 `app()` Repository 로케이터를 생성자 주입으로 바꿨다.
  - 모듈이 승인 **뒤**에 따로 거절한 건(승인 금액 대조 실패·승인액 미보고)은 모듈의
    `claim_payment.void_approval` 필터로 되돌린다 — 승인 리스너가 그 필터도 구현하고, 콜백 컨트롤러는
    보상 클로저를 넘기지 않아 서버 콜백·API 승인 두 경로의 보상이 한 구현이다.

axes:
  concern:
    - approve_path_independence
    - pre_approval_amount
    - callback_serialization
    - repository_injection
    - void_approval

effects:
  - kcp_claim_approval_is_cancelled_on_either_path_when_the_response_disagrees  # 응답 금액 ≠ 청구액이면 취소 + 거절 (API 경로 포함)
  - kcp_claim_stale_window_amount_is_refused_before_approval                     # good_mny ≠ 청구액이면 PG 호출 전 거절
  - kcp_claim_callback_lock_timeout_redirects_instead_of_500                     # 락 대기 초과는 정상 리다이렉트
  - kcp_repositories_are_constructor_injected                                    # Repository 생성자 주입
  - kcp_claim_void_approval_cancels_the_approval                                  # void_approval 필터 → KCP 취소

test_files:
  - plugins/_bundled/sirsoft-pay_nhnkcp/tests/Feature/ValidateP2ClaimPaymentHardeningTest.php
