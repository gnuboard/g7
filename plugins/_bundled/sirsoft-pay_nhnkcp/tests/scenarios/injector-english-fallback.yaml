feature: 화면 스크립트 번역 폴백 영어

description: |
  주문 상세(가상계좌 입금 안내·모의입금·영수증 줄)·주문 완료(영수증·현금영수증 버튼) 화면 스크립트의 번역 호출
  `t('키', '폴백')` 은 번역 사전을 못 읽었을 때 폴백을 보인다. 규정(actions-handlers.md 「영어 폴백 메시지 제공」)대로
  폴백은 플러그인 영어 사전(resources/lang/en.json)의 같은 키 값이다.

  수정 이력 (이커머스 전수 실측 S4 마감 검증):
    - 두 스크립트의 폴백 20곳이 한국어라, 사전이 늦거나 빠진 영어·일본어 화면에 한국어가 그대로 보일 수 있었다.

axes:
  case: [injector_fallbacks]

effects:
  - injector_fallback_is_english   # t() 폴백 = en.json 같은 키 값

test_files:
  - plugins/_bundled/sirsoft-pay_nhnkcp/resources/js/__tests__/injectorEnglishFallback.test.ts
