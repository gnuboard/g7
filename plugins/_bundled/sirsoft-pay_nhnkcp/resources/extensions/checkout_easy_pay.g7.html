<!-- 주문서에 NHN KCP 간편결제 버튼과 결제 실패 안내 창을 붙이는 조각 -->
<extension target-layout="shop/checkout">
  <!-- 상점에 켜져 있는 간편결제 수단 목록 — 하나도 없으면 버튼 영역 자체가 뜨지 않는다 -->
  <data-source id="nhnkcp_easy_pay_config" label_key="$t:sirsoft-pay_nhnkcp.editor.data_source.nhnkcp_easy_pay_config" type="api" endpoint="/api/modules/sirsoft-ecommerce/payments/client-config/nhnkcp" method="GET" :auto_fetch="true"/>
  <modal>
    <!-- 결제 실패 안내 창 — PG 가 준 사유가 있으면 함께 보여 준다 -->
    <modal data-type="composite" data-ref="nhnkcp_payment_error_modal" title="$t:sirsoft-pay_nhnkcp.payment_error.title" size="sm" :showCloseButton="true">
      <div class="paynhnkcp:text-center paynhnkcp:py-4">
        <icon name="exclamation-circle" class="paynhnkcp:text-red-500 paynhnkcp:text-4xl paynhnkcp:leading-none paynhnkcp:mb-4"/>
        <p class="paynhnkcp:text-gray-700 paynhnkcp:dark:text-gray-300">$t:sirsoft-pay_nhnkcp.payment_error.message</p>
        <p data-if="{{_local.paymentErrorMessage}}" class="paynhnkcp:text-sm paynhnkcp:text-red-600 paynhnkcp:dark:text-red-400 paynhnkcp:mt-2">{{_local.paymentErrorMessage}}</p>
      </div>
      <div class="paynhnkcp:flex paynhnkcp:justify-center paynhnkcp:mt-6">
        <button type="button" class="paynhnkcp:px-6 paynhnkcp:py-2 paynhnkcp:bg-blue-600 paynhnkcp:text-white paynhnkcp:rounded-lg paynhnkcp:font-medium paynhnkcp:hover:bg-blue-700 paynhnkcp:transition-colors">
          <on type="click">
            <!-- 확인 — 남아 있던 실패 사유를 지우고 창을 닫는다(지우지 않으면 다음에 열 때 옛 사유가 그대로 보인다) -->
            <sequence>
              <set-state target="local" :paymentErrorMessage="null"/>
              <close-modal/>
            </sequence>
          </on>
          $t:common.confirm
        </button>
      </div>
    </modal>
  </modal>
</extension>
