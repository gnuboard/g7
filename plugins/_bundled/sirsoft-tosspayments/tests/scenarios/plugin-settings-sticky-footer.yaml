feature: 토스페이먼츠 환경설정 화면 — 하단 저장 버튼 고정

description: |
  환경설정 화면(plugin_settings.json)이 길어도 하단 저장·취소 버튼 영역이 화면 아래에 붙어 있어야 한다.
  고정 스타일은 admin 템플릿의 `.sticky-footer-buttons` 의미 클래스가 갖고 있고,
  레이아웃은 그 의미 클래스만 적는다(고정용 유틸리티 클래스를 직접 늘어놓지 않는다).

axes:
  case: [semantic_class_present, no_utility_listing]

effects:
  - footer_buttons_use_sticky_semantic_class      # footer_buttons 에 sticky-footer-buttons 클래스가 있다
  - footer_buttons_do_not_list_sticky_utilities   # bottom-0·z-10 같은 유틸리티를 직접 적지 않는다

test_files:
  - plugins/_bundled/sirsoft-tosspayments/resources/js/__tests__/layouts/pluginSettingsSticky.test.tsx
