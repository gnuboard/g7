# 시나리오 매니페스트 — 토스페이먼츠 클레임 추가결제 환급 리스너
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: tosspayments_claim_payment_refund_listener

description: |
  클레임 추가결제 환급은 이커머스의 `claim_payment.refund` 필터를 토스 환급 리스너가 받아 처리한다.
  리스너는 컨테이너에서 풀려 이커머스 공개 계약을 주입받는다.

  - 환급 훅을 필터로 구독하고 processRefund 로 처리하며, 다른 결제사 결제 건은 결과를 그대로 돌려준다.
  - 토스 결제 키가 없으면 취소를 부르지 않고 실패로 답한다.
  - 전액 환급은 취소 금액을 빼고 모듈 멱등키를 Idempotency-Key 로 싣는다. 부분 환급은 취소 금액을 싣고,
    부분 환급 이력이 있으면 남은 잔액 전액도 부분취소로 보낸다. 토스가 거절하면 PG_API_ERROR 실패 결과다.

axes:
  case: [hook_subscription, other_provider, missing_payment_key, full_refund, partial_refund, remaining_balance_after_partial_refund, pg_api_error]

effects:
  - toss_claim_refund_listener_subscribes_the_refund_filter            # claim_payment.refund 를 필터로 구독
  - toss_claim_refund_listener_skips_other_providers                   # 다른 결제사 결제 건은 결과를 그대로 돌려준다
  - toss_claim_refund_without_payment_key_is_rejected                  # 결제 키 없으면 취소 호출 없이 실패
  - toss_claim_full_refund_omits_amount_and_sends_idempotency_key      # 전액 환급 → 취소 금액 생략, Idempotency-Key 전송
  - toss_claim_partial_refund_sends_cancel_amount                      # 부분 환급 → 취소 금액을 싣는다
  - toss_claim_remaining_balance_after_partial_refund_is_partial_cancel # 부분 환급 이력 뒤 잔액 전액도 부분취소
  - toss_claim_refund_pg_api_error_returns_failure                     # 토스 거절 → PG_API_ERROR 실패 결과

test_files:
  - plugins/_bundled/sirsoft-tosspayments/tests/Unit/Listeners/ClaimPaymentRefundListenerTest.php
