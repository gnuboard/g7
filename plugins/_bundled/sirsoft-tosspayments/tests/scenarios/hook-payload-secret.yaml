# 시나리오 매니페스트 — 결제 승인·취소 완료 훅 인자에서 가상계좌 웹훅 검증값 제외
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스", 코어 선례 tests/scenarios/register-hook-payload-secret.yaml

feature: 결제 승인·취소 완료 훅 인자에서 가상계좌 웹훅 검증값(secret) 제외

description: |
  토스 Payment 객체의 `secret` 은 가상계좌 입금통보 웹훅이 진짜인지 대조하는 값이다. 승인 완료 훅
  (`sirsoft-tosspayments.payment.after_confirm`)과 취소 완료 훅(`sirsoft-tosspayments.payment.after_cancel`)이
  토스 응답을 통째로 넘겨, 큐로 실행되는 구독자가 생기면 작업 표(실패 시 실패 작업 표)에 그 값의 사본이 남았다.
  구독자 중 이 값을 읽어야 하는 곳은 없다 — 웹훅 대조는 결제행 `payment_meta.toss_secret` 으로 한다.
  두 훅 모두 넘기기 전에 `secret` 만 빼고, 나머지 응답 필드와 서비스 반환값·결제행 저장값은 그대로 둔다.

axes:
  hook: [after_confirm, after_cancel]

effects:
  - after_confirm_payload_excludes_webhook_secret
  - after_cancel_payload_excludes_webhook_secret
  - hook_payload_keeps_other_response_fields
  - webhook_secret_is_still_stored_for_deposit_verification

test_files:
  - plugins/_bundled/sirsoft-tosspayments/tests/Feature/HookPayloadSecretTest.php

notes: |
  번들 확장 중 두 훅의 구독자는 0 이다(`plugin.php` 의 훅 정의는 선언). 그래서 큐 작업 표를 직접 재는 대신
  훅 발화 인자 자체를 캡처해 단언한다 — 큐 구독자가 받는 사본은 이 인자의 직렬화다.
