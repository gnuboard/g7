# 시나리오 매니페스트 — 토스페이먼츠 클레임 결제·환불 경로의 #599 validate P2 결함 (07-core-plugins)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: tosspayments_validate_p2_claim_payment_hardening

description: |
  #599 `/validate branch` 07-core-plugins 가 찾은 결제 플러그인 결함 중 토스페이먼츠 몫.

  - #8 클라이언트 승인 API 경로(`claim-payments/{no}/approve` → `respondApprove` → `UserClaimService::approve`)는
    서버 콜백과 같은 `claim_payment.approve` 필터를 타지만, 승인 뒤 거절의 보상(취소)은 서버 콜백의
    `ClaimPaymentCallback` 클로저에만 있었다. 그 경로로 들어온 승인은 모듈이 금액 불일치로 거절해도
    토스에 청구된 채 남는다. 승인 응답(금액·주문번호)을 리스너가 판정하고 어긋나면 리스너가 취소한다 —
    어느 경로로 들어와도 같다. 승인액은 응답 `totalAmount` 만 쓴다(콜백 금액으로 채우면 대조가 항등식).
  - CP 콜백에 결제번호 단위 직렬화 락이 없었다(형제 kginicis·nhnkcp 는 있다). 락 획득은 try 안이라
    대기 초과는 500 이 아니라 신청서 상세 복귀(이미 결제됐으면 성공, 아니면 `callback_locked`)다.
  - 주문 환불의 취소 장부 동기화(`syncCancelSnapshot`) 실패가 이미 성립한 토스 취소를 `success=false` 로
    바꿨다. 동기화 실패는 로그로 떼어 내고, 다음 취소 응답(전체 이력)이 장부를 다시 맞춘다.
  - 콜백 컨트롤러·환불 리스너의 `app()` Repository 로케이터를 생성자 주입으로 바꿨다.
  - 모듈이 승인 **뒤**에 따로 거절한 건(승인 금액 대조 실패·승인액 미보고)은 모듈의
    `claim_payment.void_approval` 필터로 되돌린다 — 승인 리스너가 그 필터도 구현하고, 콜백 컨트롤러는
    보상 클로저를 넘기지 않아 서버 콜백·API 승인 두 경로의 보상이 한 구현이다.

axes:
  concern:
    - approve_path_independence
    - response_amount_source
    - callback_serialization
    - refund_ledger_sync
    - repository_injection
    - void_approval

effects:
  - toss_claim_approval_is_cancelled_on_either_path_when_the_response_disagrees  # 응답 금액·주문번호가 어긋나면 리스너가 취소 + 거절 (API 경로 포함)
  - toss_claim_paid_amount_comes_only_from_the_response                         # 응답에 금액이 없으면 콜백 값으로 채우지 않고 취소 + 거절
  - toss_claim_clean_confirmation_is_unchanged                                  # 비회귀 — 깨끗한 승인은 그대로
  - toss_claim_callback_is_serialized_per_payment_number                        # CP 콜백 락, 대기 초과는 정상 리다이렉트
  - toss_refund_success_is_independent_of_the_cancel_ledger_sync                # 장부 동기화 실패가 환불 성공을 뒤집지 않는다
  - toss_repositories_are_constructor_injected                                  # Repository 생성자 주입
  - toss_claim_void_approval_cancels_the_confirmation                            # void_approval 필터 → 토스 취소

test_files:
  - plugins/_bundled/sirsoft-tosspayments/tests/Feature/ValidateP2ClaimPaymentHardeningTest.php
