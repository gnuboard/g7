feature: 현금영수증 발급·취소 실패 사유의 원문 가림

description: |
  현금영수증 리스너가 돌려준 실패 사유는 현금영수증 이력에 남아 관리자 주문 상세 결제 정보와 구매자 응답에
  그대로 보인다. 토스페이먼츠가 돌려준 거절 사유(오류 코드와 함께 온 message)는 그대로 싣고, 통신 예외의 원문(결제대행사 API 주소·cURL 문구)은
  서버 로그에만 남긴 채 번역된 일반 문구(cash_receipt.pg_failed)를 싣는다. 디버그 모드는 코어 관례대로 원문을 둔다.

axes:
  case: [issue_transport, issue_pg_rejected]

exclusions: []

effects:
  - cash_receipt_failure_hides_internal_detail
  - cash_receipt_failure_keeps_pg_reason

test_files:
  - plugins/_bundled/sirsoft-tosspayments/tests/Unit/Listeners/CashReceiptFailureReasonTest.php
