feature: 토스페이먼츠 가상계좌 입금 안내 — 주문 상세 결제 정보 카드(회원·비회원·신청서 상세)

description: |
  토스 가상계좌 주문의 주문 상세에는 「결제 방법: 가상계좌」만 있고 입금할 계좌 정보가 없었다(7.0.11 부터). KG이니시스·NHN KCP·
  나이스페이먼츠와 같은 형태로 은행·계좌번호·예금주·입금 금액(결제예정금액, 없으면 주문금액)·입금 기한과 입금 전 자동 취소 경고를
  결제 정보 카드 슬롯 조각이 그린다. 같은 슬롯이 회원·비회원 주문 상세와 신청서 상세에 붙으므로 주문 데이터만 읽고 인증이 필요한
  데이터 소스를 두지 않는다(비회원 상세 로그인 튕김 교훈). 색은 토스 자체 CSS 접두 클래스(결정 2026-10-10).

axes:
  payment_state: [waiting_deposit, paid, cancelled]
  viewer: [member, guest]

effects:
  - guide_shows_account_amount_due            # 은행·계좌번호·예금주·결제예정금액·입금 기한·자동 취소 경고
  - guest_guide_falls_back_to_order_amount    # 결제예정금액이 없는 비회원 응답은 주문금액
  - warning_hidden_after_deposit              # 입금 뒤 자동 취소 경고 숨김
  - guide_hidden_for_cancelled_or_other_pg    # 취소 주문·취소 결제·다른 결제대행사·가상계좌 아님 → 숨김
  - guide_text_translated                     # 화면 언어 문구
  - guide_uses_order_data_only                # 인증 필요 데이터 소스 없음

test_files:
