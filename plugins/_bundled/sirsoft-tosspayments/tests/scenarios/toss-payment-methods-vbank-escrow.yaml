  # 클레임 추가결제(CP 채번) 상태변경 웹훅은 주문 조회로 내려가지 않는다 — 정상 동작마다
  # `order not found` warning 이 남으면 운영자 로그에서 결함으로 읽힌다
  - claim_payment_status_webhook_terminates_without_an_order_lookup
  - non_krw_domestic_method_blocked
  - sdk_method_mapped_from_enabled_methods
  - virtual_account_payload_built
  - escrow_products_attached
  - escrow_flag_off_true_or_key_absent
  - escrow_products_localized_unit_price_per_item
  # 관리자 주문설정의 PG 표시 (카탈로그 능력 선언)
  - toss_methods_declare_pg_locked_to_tosspayments
  - locked_pg_id_matches_registered_provider
  - other_plugin_methods_untouched_by_toss_injection
  # 환불 자동 승인 능력 선언 (코어 P16·P17) — 카드 계열만 true
  - only_card_backed_methods_declare_auto_approve_refund
  # 코어 결제수단 번역 (본 이슈 수정분)
  - core_payment_method_preserved_through_settings_merge
  - core_payment_method_preserved_through_save_snapshot
  - checkout_body_sends_core_payment_method
  - non_mapped_method_falls_back_to_raw_id
  - order_created_with_core_payment_method
  # 관리자 설정 서버측 범위 검증 (본 이슈 수정분)
  - out_of_range_vbank_hours_rejected
  - invalid_use_escrow_rejected
  - other_plugin_settings_not_validated
  # SDK 페이로드 경계 (감사 후속 — 서버 조립과 SDK 전달은 별개 계약)
  - escrow_products_attached_to_virtual_account_sdk_payload
  - escrow_products_absent_when_escrow_off
  - escrow_products_absent_for_card
  # 에스크로 운영 안내 (W-6)
