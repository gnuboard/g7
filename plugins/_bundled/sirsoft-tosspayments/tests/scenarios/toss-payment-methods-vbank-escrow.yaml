  # 설정 화면 입금통보 웹훅 URL — 경로만이 아니라 사이트 주소까지 붙은 전체 주소로 표시·복사
  - webhook_url_returned_as_absolute_url
  - webhook_url_display_and_copy_use_absolute_url
