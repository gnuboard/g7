  # KVE-2026-2434 — 결제창 닫힘 보고·재결제 준비·결제 인증 콜백의 주문 소유자 확인과 승인-주문 결속
  - skips_when_settings_json_is_malformed
  - skips_when_settings_file_is_missing
  - is_idempotent
  - does_not_touch_other_plugins_or_builtin_methods
