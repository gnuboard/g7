<!-- 구매자 주문 상세의 결제 정보 패널에 토스 영수증 링크를 덧붙인다. 영수증 주소는 PG 가 발급하므로 코어가 갖고 있지 않다. target_layout(mypage/orders/show) 대신 공용 확장 슬롯을 겨냥한다 — 이 결제 정보 카드(partials/mypage/orders/_payment)는 주문 상세 말고도 클레임 신청서 상세가 그대로 재사용한다. 레이아웃 이름을 겨냥하면 그 한 화면에서만 뜨고 나머지 화면은 카드는 나오는데 이 블록만 빠진 채 열린다(오류·경고 없음). 슬롯은 partial 을 따라간다. 2026-09-01 확정. -->
<extension extension-point="mypage_order_payment_provider_slot" mode="append" priority="100">
    <div data-if="{{order.data.payment?.pg_provider === 'tosspayments' &amp;&amp; !!order.data.payment?.pg_receipt_url}}" class="pt-4 mt-2 border-t border-gray-200 dark:border-gray-700 space-y-3">
      <div data-if="{{!!order.data.payment?.is_escrow}}" class="flex-between">
        <span class="text-label-subtle">$t:sirsoft-tosspayments.user.payment_type_label</span>
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300">$t:sirsoft-tosspayments.user.escrow_yes</span>
      </div>
      <div class="flex-between">
        <span class="text-label-subtle">$t:sirsoft-tosspayments.user.receipt_label</span>
        <a href="{{order.data.payment.pg_receipt_url}}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">$t:sirsoft-tosspayments.user.receipt_view</a>
      </div>
    </div>
    <div data-if="{{order.data.payment?.pg_provider === 'tosspayments' &amp;&amp; !!order.data.cash_receipt?.receipt_url}}" class="pt-4 mt-2 border-t border-gray-200 dark:border-gray-700 flex-between">
      <span class="text-label-subtle">$t:sirsoft-tosspayments.user.cash_receipt_label</span>
      <a href="{{order.data.cash_receipt.receipt_url}}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">$t:sirsoft-tosspayments.user.cash_receipt_view</a>
    </div>
</extension>
