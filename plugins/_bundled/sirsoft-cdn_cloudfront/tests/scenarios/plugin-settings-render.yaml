feature: sirsoft-cdn_cloudfront 설정 화면 — 연결 시험, 무효화 대기 현황, 저장 실패의 상태별 표시

description: |
  실물 레이아웃과 실물 ko 언어 파일을 렌더해 응답별 표시를 고정한다.
  연결 시험이 성공하면 배포 상태를 번역해 보이고(Deployed, InProgress, 그 밖의 값은 원문), 배포가 꺼져 있거나 CDN 주소가
  배포와 맞지 않으면 경고한다. 실패(422)는 서버 사유 토스트만 띄우고 결과 칸을 그리지 않는다. 현황 403 은 안내만 보이고
  통계를 숨기되 설정 폼은 그대로 둔다. purge_ready=false 는 무효화를 보내지 않는다고 알린다. 저장 실패(422)는 errors 를
  상단 목록과 해당 칸에 보인다.

test_files:
  - plugins/_bundled/sirsoft-cdn_cloudfront/resources/js/__tests__/layouts/plugin-settings-render.test.tsx

axes:
  case:
    - connection_success    # 성공, 상태 번역, cdn_host_matches=false 경고
    - connection_disabled   # enabled=false 안내, InProgress 번역
    - connection_failed     # 422 토스트, 결과 칸 없음
    - status_forbidden      # 현황 403 안내, 통계 숨김, 폼 유지
    - status_not_ready      # purge_ready=false 안내
    - status_ready          # 안내 없음, 마지막 오류 표시
    - status_empty          # 대기열 0건: 대기·중단 0, 안내 없음
    - save_failed           # 저장 422 errors 표시

effects:
  - connection_result_shown_with_localized_status
  - host_mismatch_warning_shown
  - disabled_distribution_warning_shown
  - connection_failure_toasts_without_result
  - status_forbidden_hides_stats_keeps_form
  - status_not_ready_notice_shown
  - status_empty_queue_shows_zero
  - save_failure_shows_field_errors
