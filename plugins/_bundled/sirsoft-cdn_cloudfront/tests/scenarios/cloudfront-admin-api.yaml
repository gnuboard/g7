feature: sirsoft-cdn_cloudfront 설정 화면 보조 API — 무효화 대기 현황과 연결 시험

description: |
  설정 화면의 「무효화 대기 현황」은 GET admin/purge-status(core.plugins.read), 「연결 시험」은 POST admin/test-connection
  (core.plugins.update)을 부른다. 연결 시험은 저장된 배포 ID·무효화용 키로 GetDistribution 을 보내며, 자격이 비면
  CloudFront 를 부르지 않고 422 다. 어떤 응답에도 자격 증명 값이 담기지 않는다. 설정 저장은 코어 플러그인 설정 API 를
  쓰고, 이 플러그인이 검증 규칙 훅으로 CDN 주소·배포 ID 모양을 더 검사한다.

axes:
  case:
    - permission        # 비회원 401, 권한 없음 403, 조회 권한만으로 연결 시험 403
    - status            # 대기·중단 건수, 마지막 오류
    - test_connection   # 자격 없음 422(호출 0), 성공 상태·도메인·호스트 일치, 거절 422 사유, 분당 상한
    - settings_validation  # CDN 주소·배포 ID 모양 검증, 자격 값 가림·가린 값 재전송 시 유지

effects:
  - status_requires_plugins_read
  - test_requires_plugins_update
  - status_reports_pending_and_last_error
  - test_connection_reports_distribution
  - test_connection_throttled
  - settings_shape_validated_and_secrets_masked

test_files:
  - plugins/_bundled/sirsoft-cdn_cloudfront/tests/Feature/AdminApiTest.php
