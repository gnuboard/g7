feature: sirsoft-cdn_cloudfront 디스크 cloudfront 정의와 공개 자산 디스크 카탈로그 노출

description: |
  활성 플러그인의 서비스 프로바이더가 코어 S3 디스크 설정을 복제하고 url 만 CDN 주소로 바꾼 디스크 cloudfront 를
  정의하고, 리스너가 필터 core.settings.available_public_asset_drivers 에 {id, label, provider} 를 올린다. 코어는 이
  카탈로그로 공개 썸네일 디스크·공개 자산 디스크 선택지를 만든다. 플러그인을 끄면 디스크 정의가 사라지고, 그 디스크를
  고른 저장값은 남은 채 코어의 고아 디스크 폴백(공개 썸네일 → 비공개 썸네일 디스크, 공개 자산 → 스트리밍)을 탄다.
  디스크 정의는 부팅 때 한 번 만들어지므로 설정 저장·초기화·비활성화 때 그 프로세스의 정의를 고치고 큐 워커에 재시작
  신호를 보낸다. 워커가 옛 CDN 주소를 들고 있으면 무효화 대상에서 조용히 빠진다.

axes:
  case:
    - disk_definition      # S3 설정 복제 + CDN url, 파생본 URL 이 CDN 호스트
    - catalog              # 카탈로그 노출(로케일별 라벨·제공자), 디스크 정의 없으면 미노출
    - inactive_fallback    # 비활성이면 디스크 미정의, 고아 디스크 폴백과 재활성 복귀
    - no_bucket            # S3 버킷이 비면 디스크 미정의, 선택지 없음
    - settings_sync        # 설정 저장·초기화·비활성화 때 프로세스 디스크 갱신과 워커 재시작 신호

effects:
  - disk_clones_s3_with_cdn_url
  - thumbnail_urls_on_cdn_host
  - catalog_lists_cloudfront_disk
  - disk_defined_only_while_active
  - orphan_disk_falls_back_while_inactive
  - disk_undefined_without_bucket
  - disk_refreshed_and_workers_restarted_on_settings_save
  - disk_removed_and_workers_restarted_on_deactivate

test_files:
  - plugins/_bundled/sirsoft-cdn_cloudfront/tests/Feature/CloudFrontDiskTest.php
