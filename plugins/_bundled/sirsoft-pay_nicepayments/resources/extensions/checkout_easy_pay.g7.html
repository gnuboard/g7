<extension target-layout="shop/checkout">
  <inject target-id="nicepay_checkout_payment_section" position="append_child">
    <!-- 간편결제 섹션 - enabled_easy_pays 가 하나 이상인 경우에만 표시 -->
    <div data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).length > 0}}" class="mt-4 pt-4">
      <responsive on="portable" class="mt-3 pt-3"/>
      <p class="text-body font-medium mb-3"><responsive on="portable" class="text-body font-medium mb-2"/>$t:sirsoft-pay_nicepayments.easy_pay.section_title</p>
      <div class="nicepay-easy-pay-btns flex flex-wrap gap-2">
        <!-- 네이버페이 --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('NAVERPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-green-500 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_naverpay"/></on>네이버페이</button>
        <!-- 카카오페이 --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('KAKAOPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-yellow-400 text-gray-900 hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_kakaopay"/></on>카카오페이</button>
        <!-- 삼성페이 --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('SAMSUNGPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-blue-700 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_samsungpay"/></on>삼성페이</button>
        <!-- 애플페이 --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('APPLEPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-gray-900 dark:bg-gray-950 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_applepay"/></on>애플페이</button>
        <!-- PAYCO --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('PAYCO')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-red-500 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_payco"/></on>PAYCO</button>
        <!-- 11pay (SKpay) --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('SKPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-orange-500 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_skpay"/></on>11pay</button>
        <!-- SSG페이 --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('SSGPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-red-600 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_ssgpay"/></on>SSG페이</button>
        <!-- L.pay --><button data-if="{{(nicepay_easy_pay_config.data?.enabled_easy_pays ?? []).includes('LPAY')}}" type="button" class="px-4 py-2 rounded-lg text-sm font-bold bg-pink-700 text-white hover:opacity-90"><on type="click"><action handler="sirsoft-pay_nicepayments.setPaymentMethod" paymentMethod="nicepay_lpay"/></on>L.pay</button>
      </div>
    </div>
  </inject>
  <data-source id="nicepay_easy_pay_config" label_key="$t:sirsoft-pay_nicepayments.editor.data_source.nicepay_easy_pay_config" type="api" endpoint="/api/modules/sirsoft-ecommerce/payments/client-config/nicepayments" method="GET" :auto_fetch="true"/>
</extension>
