# 시나리오 매니페스트 — 나이스페이먼츠의 이커머스 결제 계약 전환 대조 (#916 ②)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: nicepayments_payment_gateway_contract

description: |
  나이스페이먼츠 SignData 요청의 재결제 복구는 이커머스 주문 상태를 직접 되돌리던 코드를 공개 계약
  `PaymentLifecycle::restoreForRetry` 로 옮겼다. 전환 전 현행 복구 결과를 이커머스 `RetryRestoreCharacterizationRecorderTest` 가
  녹화해 두고, 주문 소유자의 SignData 요청이 실패 주문을 결제 대기로 되돌린 결과가 녹화값과 DB 원문까지 같은지 대조한다.
  조회 계약은 호출자가 넘긴 결제사 id 목록(첫 값 자기 id, 나머지 옛 id)의 결제 행만 싣는다. 관리자 입금통보 이력 조회는
  옛 식별자(`nicepay`)까지 넘겨, 옛 id 로 발급된 가상계좌의 이력도 보이는지 대조한다.
  계약 자체의 동작은 이커머스 `payment-gateway-contract.yaml` 이 소유한다.

axes:
  case: [sign_data_retry_restore_matches_recorded_legacy_bytes, admin_vbank_notifications_legacy_provider_id]

effects:
  - nice_sign_data_retry_restore_matches_legacy_recording  # SignData 재결제 복구 결과가 녹화값과 DB 원문까지 같다
  - admin_vbank_notifications_include_legacy_provider_id  # 옛 식별자(nicepay)로 발급된 가상계좌의 입금통보 이력도 보인다

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/tests/Feature/Characterization/RetryRestoreCharacterizationTest.php
  - plugins/_bundled/sirsoft-pay_nicepayments/tests/Feature/Controllers/AdminVbankNotificationControllerTest.php
