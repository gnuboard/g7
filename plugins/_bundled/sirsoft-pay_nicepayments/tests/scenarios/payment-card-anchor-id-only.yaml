feature: 결제 정보 카드는 템플릿이 약속한 id 로만 찾는다

description: |
  주문 상세·신청서 상세의 결제 정보 카드에서 결제 방법 행을 고칠 때 카드를 id(order_payment_info_panel)로만 찾는다.
  종전에는 id 가 없으면 화면 제목의 한국어 「결제 정보」로 찾았는데, 제목 글자는 언어마다 달라 찾는 기준이 될 수 없다
  (PO 결정 2026-09-28). id 가 없는 화면에는 붙이지 않는다.

axes:
  plugin: [nicepayments]

effects:
  - card_found_by_id_only

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/paymentCardAnchorIdOnly.test.ts
