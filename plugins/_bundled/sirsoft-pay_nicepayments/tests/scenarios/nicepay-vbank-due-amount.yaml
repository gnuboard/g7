feature: 나이스페이 가상계좌 입금 안내 — 입금 금액 = 결제예정금액

description: |
  마이페이지 주문 상세 「가상계좌 입금 안내」(후속 B 세션 B5, 전수 실측 S2 인계). 입금 금액은 실제 입금액인 결제예정금액
  (`total_due_amount_formatted`, 마일리지 차감 뒤)을 먼저 읽고, 그 값이 없는 비회원 응답에서는 주문금액으로 대신한다.
  KG 는 금액·자동 취소 경고가 아예 없었고, KCP 확장은 금액 행 자체가 없었다. 나이스·KCP 주입기는 주문금액 필드를 읽었는데,
  입금 대기 중에는 결제예정금액과 같은 값이라(실측 B5 마일리지 주문 5,000/5,000) 화면 결함은 아니었고 기준 필드만 맞췄다.

axes:
  path: [extension]

effects:
  - nicepay_vbank_shows_due_amount

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/layouts/mypageVbankDueAmount.test.ts

validation:
  browser_check: 마일리지를 쓴 가상계좌 입금 대기 주문의 마이페이지 주문 상세 → 입금 금액이 결제예정금액, 자동 취소 안내 표시
