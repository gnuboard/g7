feature: 가상계좌 계좌 만료 시각 — 주문의 입금 기한을 결제창에 넘긴다

description: |
  가상계좌 주문의 입금 기한은 쇼핑몰 설정(이커머스 「주문 자동취소」 기한, order_settings.auto_cancel_days)이 정하고,
  주문서도 그 기한으로 안내한다. 결제창에 기한을 넘기지 않으면 나이스가 자기 기본 기한(실측 10일)으로 계좌를 열고,
  승인 콜백이 그 값(VbankExpDate)으로 주문 기한을 덮어써 자동취소까지 나이스 기한을 따랐다.

  수정 이력 (이커머스 전수 실측 S2 — S2-D7, 제품 결정 「쇼핑몰 설정을 단일 기한으로」):
    - 이커머스가 pg_payment_data.vbank_due_at(한국 시각 ISO 8601)을 싣고, 결제창 폼에 VbankExpDate(YYYYMMDDHHmm)로 넘긴다.

axes:
  due: [present, absent]

effects:
  - vbank_exp_date_carries_order_vbank_due       # VbankExpDate = 주문 입금 기한
  - missing_due_or_other_method_sends_nothing    # 기한 없음 · 가상계좌 아님: VbankExpDate 없음(나이스 기본 기한)

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/handlers/requestPayment.test.ts

validation:
  browser_check: 전용 Chrome 실측 — 테스트 상점 나이스 가상계좌 발급 후 주문 상세 「입금 기한」이 주문 시각 + 자동취소 일수와 같은지
