feature: 주문 완료 화면 › 나이스페이먼츠 영수증·매출전표·간편결제 이름은 레이아웃 조각이 그린다

description: |
  주문 완료 화면의 나이스페이먼츠 영수증 표시를 주입 스크립트(orderCompleteReceiptInjector)에서 레이아웃 조각
  (user_order_complete_receipt)으로 옮긴다(#639). 스크립트는 주소 정규식(/shop/orders/{N}/complete)으로 화면을 알아보고
  history.pushState 를 덮어써 이동을 엿본 뒤 파란 버튼 옆에 「영수증 조회」 버튼을 그렸다. 조각은 결제사 주소를 글자 그대로
  적고 회원 토큰으로만 조회해 비회원 현금영수증 조회가 실패했다.

  이제 조각이 입금이 끝난 나이스페이먼츠 결제에서만 영수증 조회 API 를 회원(선택 인증)·비회원(조회 토큰 헤더) 같은
  방식으로 불러 결제 영수증·매출전표·현금영수증 링크와 간편결제 서비스명을 그린다. 엔진은 조건이 거짓인 노드에서도 마운트
  동작을 돌리므로 조회는 조건 블록 안쪽 행에 건다 — 다른 결제사·입금 대기 주문에는 조회가 나가지 않는다.

  E2E 는 두지 않는다 — 로컬·CI 에 나이스페이먼츠 결제 완료 주문 픽스처가 없다. 설치되는 조각 원본(JSON)을 엔진에 태워
  확인하고, API 응답은 플러그인 PHPUnit(UserReceiptControllerTest)이 잠근다.

axes:
  viewer: [member, guest]
  payment: [nicepay_paid, vbank_waiting, other_pg]

exclusions:
  - { viewer: guest, payment: vbank_waiting, reason: "블록 표시 조건은 결제 정보만 보고 조회 주체(회원·비회원)를 보지 않는다 — 회원 행이 같은 분기를 덮는다" }
  - { viewer: guest, payment: other_pg, reason: "블록 표시 조건은 결제 정보만 보고 조회 주체(회원·비회원)를 보지 않는다 — 회원 행이 같은 분기를 덮는다" }

effects:
  - receipt_links_from_api                 # 결제 영수증·매출전표·현금영수증 링크 주소는 API 응답에서만
  - easy_pay_name_translated               # 간편결제 원 수단 코드를 번역 키로 풀어 보인다
  - guest_token_header_sent                # 비회원은 _global.guestOrderToken 을 X-Guest-Order-Token 으로
  - hidden_until_paid                      # 입금 전 결제에는 블록·조회 없음
  - hidden_for_other_pg                    # 다른 결제사 주문에는 블록·조회 없음
  - no_external_url_literal_in_fragment    # 조각에 결제사 주소를 적지 않는다

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/layouts/orderCompleteReceiptFragment.test.tsx
