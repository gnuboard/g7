feature: 가상계좌 입금 안내 — 결제 상태별 표시

description: |
  주문 상세·신청서 상세(결제 정보 카드)와 주문 완료 화면의 「가상계좌 입금 안내」는 입금 대기 주문에 계좌와
  「입금 기한 내에 입금하지 않으시면 주문이 자동 취소됩니다」 경고를 보인다.

  수정 이력 (이커머스 전수 실측 S4 — S4-D13, 결함인계대장 S2 01:36Z·02:49Z):
    - 입금을 마친 주문에도 자동 취소 경고가 남아 고객이 다시 입금해야 하는 줄 알 수 있었다(KCP). 입금 뒤에는 경고를 감춘다
      (나이스는 이미 감추고 있었다).
    - 입금 전에 취소한 주문에도 입금 계좌가 그대로 보여 취소 뒤 입금을 부를 수 있었다(KCP·나이스). 취소된 주문엔
      블록을 그리지 않는다. KG 는 입금 대기일 때만 그려 원래 맞았다.

axes:
  payment_state: [waiting_deposit, paid, cancelled]

effects:
  - guide_and_notice_while_waiting   # 입금 대기: 계좌 + 자동 취소 경고
  - notice_hidden_after_payment      # 입금 완료: 계좌는 남고 경고는 없음
  - guide_hidden_when_cancelled      # 취소: 입금 안내 블록 없음

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/vbankGuideVisibility.test.ts

validation:
  browser_check: 전용 Chrome 실측 — 입금 완료 KCP 주문(290)·취소된 가상계좌 주문 상세
