feature: 결제 방법 행은 화면이 약속한 id 로만 찾는다

description: |
  간편결제 이름을 결제 방법 행에 덧붙일 때 행을 id 로만 찾는다 — 사용자 주문 상세·주문 완료는 템플릿의
  order_payment_method_row, 관리자 주문 상세는 이커머스의 payment_method_block_{결제 순번}. 종전에는 행 이름 글자
  (「결제 방법」「결제수단」「Payment Method」)로 찾아 그 밖의 언어 화면에서는 조용히 빠졌다(PO 결정 2026-09-28).
  id 가 없는 화면에서는 건드리지 않는다.

axes:
  screen: [mypage_order, admin_order, order_complete]
  row: [with_id, without_id]

effects:
  - row_found_by_id_only

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/paymentMethodRowById.test.ts
