feature: 간편결제 서비스명은 레이아웃 조각이 플러그인 API 의 원 수단 코드를 번역 키로 풀어 그린다

description: |
  이커머스 주문 화면은 간편결제 주문도 기본 결제수단(신용카드)만 안다. 종전에는 주입 스크립트(adminOrderPaymentDisplayInjector·
  mypageOrderShowInjector)가 주소 정규식으로 화면을 알아보고 history.pushState 를 덮어써 이동을 엿본 뒤, 관리자 주문 상세의
  결제수단 칸(payment_method_block_{n})과 마이페이지의 결제 방법 행(order_payment_method_row) 글자를 직접 고쳐 썼다(#639).

  이제 관리자 주문 상세는 결제 조회 패널(admin_order_payment_query)이 거래 조회(nicepay_status)의 `_embedded_pg_provider` 를,
  마이페이지 결제 정보 카드 슬롯(user_mypage_order_receipt)은 영수증 조회 API 의 `embedded_pg_provider` 를 번역 키
  (user.easy_pay_names.*)로 풀어 자기 행에 보인다. 마이페이지 조각이 종전에 보던 `payment_meta.PayMethod` 는 주문 응답에
  없는 값이라 그 행은 한 번도 뜨지 않았다.

axes:
  screen: [admin_order, mypage_order]
  provider: [easy_pay, none]

effects:
  - easy_pay_name_translated               # 원 수단 코드 → 번역된 서비스명
  - easy_pay_row_hidden_without_provider   # 간편결제가 아니면 행을 그리지 않는다

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/layouts/easyPayNameFragments.test.tsx
