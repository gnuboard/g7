feature: 나이스페이먼츠 화면 글자·결제 오류 알림은 번역 키로 낸다

description: |
  주문 완료 화면 영수증 버튼 글자, 결제 실패 알림, 영수증 조각의 간편결제 이름표를 한국어로 박아 두어 영어·일본어 화면에서도
  한국어로 나오던 것을 플러그인 번역 키(ko·en, 일본어는 언어팩)로 옮긴다.
  주문 완료 화면 영수증 버튼은 #639 에서 주입 스크립트 대신 레이아웃 조각(user_order_complete_receipt)의 링크가 됐다 — 그 링크 글자도
  번역 키로 그린다.

axes:
  surface: [order_complete_button, payment_error_toast, easy_pay_name]

effects:
  - text_from_translation_key

test_files:
  - plugins/_bundled/sirsoft-pay_nicepayments/resources/js/__tests__/paymentTextTranslated.test.ts
