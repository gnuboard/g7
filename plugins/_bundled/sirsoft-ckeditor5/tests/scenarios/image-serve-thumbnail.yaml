feature: 본문 이미지 서빙의 썸네일 (`?size=` · `?w=`)

description: |
  에디터 본문 이미지(`/api/plugins/sirsoft-ckeditor5/images/{hash}`)는 인증 없이 보이는 완전 공개 원본이다.
  컨트롤러가 해시 조회(게이트) 뒤·원본 응답 바로 앞에서 코어 `ThumbnailResponder` 를 부르고, 낼 수 없으면
  원본에 `X-G7-Thumbnail: bypass:{사유}` 를 붙인다. 서비스 `serve()` 안에서 부르지 않는 것은 원본의 304 판정을
  컨트롤러가 하기 때문이다 — 서비스가 썸네일을 돌려주면 원본 검증자로 다시 싸인다.

  리스너(`ThumbnailRegistrationListener`)가 서빙 경로 패턴과 공개 원본 제공자를 코어 목록에 더한다. 패턴이
  빠지면 화면·SEO 가 본문 이미지 주소에 규격을 붙이지 않아 오류 없이 원본만 나간다.

  회귀 불변식:
    1. 파라미터 없는 요청은 이전과 같은 원본 바이트이고 썸네일 헤더·파생본이 생기지 않는다.
    2. `?size=sm` 은 160×160 파생본(첫 요청 miss, 다음 hit) + nosniff. 키는 `thumbnails/{디스크}/sirsoft-ckeditor5/{file_path}/sm_…`.
    3. `?w=300` 은 숫자 요청 대상 중 가로 ≥ 300 최소(md 640)로 올려 맞춘다.
    4. 운영 환경에서 공개 원본 썸네일의 캐시는 `public`(권한 원본의 `private` 와 반대).
    5. 미정의 규격·원본보다 큰 규격(확대 끔)은 원본 + `bypass:{사유}`.
    6. 공개 썸네일 저장 위치가 공개 자산 디스크(public)면 302 직접 주소, 비공개 디스크에는 쓰지 않는다.
    7. 리스너가 경로 패턴과 제공자를 등록하고, 제공자는 `images` 카테고리만 원본으로 분류한다(임시·설정·그 밖의 카테고리와 다른 확장 경로는 아니다).
    8. 원본 파일만 사라진 행은 `?size=` 를 붙여도 무파라미터와 같은 404 다(남은 파생본으로 200 을 내지 않는다).
    9. 제공자 목록 필터는 필터 호출마다 제공자를 새로 만들지 않고 같은 인스턴스를 돌려준다.
    10. 앞선 리스너가 배열이 아닌 값을 넘기면 그 값을 그대로 돌려준다. 나눠 읽는 상한은 최소 1 이다.
    11. 업로드 목록 이미지는 sm 규격이고(주소는 `preview_url ?? download_url` — 직접 URL 행도 API 주소에 규격),
        본문 표시 확장은 호출자가 준 imageSizes 를 HtmlContent 에 넘긴다.
    12. 공개 자산 디스크(CDN) 직접 주소로 저장되는 본문 이미지는 이 서빙 경로를 지나지 않는다 — 업로드 응답 `urls` 의 숫자 후보
        (API 주소 + `?size=`)가 본문 `srcset` 으로 저장되어 이 경로로 썸네일을 받는다. 응답 계약은
        tests/scenarios/public-asset-cdn.yaml(`editor_upload_returns_responsive_api_urls_for_direct_rows`)이 소유한다.

