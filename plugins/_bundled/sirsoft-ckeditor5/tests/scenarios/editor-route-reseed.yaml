feature: 같은 레이아웃 경로 이동에서 편집기가 새 글 값으로 다시 선다

description: |
  게시판 글 수정과 새 글 쓰기·다른 글 수정은 같은 레이아웃이라 편집기 조각이 다시 마운트되지 않는다. 편집기 확장은 주소가
  바뀐 것을 보고 폼의 새 값으로 편집기를 다시 세우고, 그 전에는 편집기 값을 폼으로 내보내지 않는다. 종전에는 「폼이 아직
  이전 글 값인가」를 편집기에 보이는 값과만 비교해, 편집기가 다듬은 값(평문 → 문단 HTML)과 글자가 다른 이전 글 원문을
  「새 값」으로 오인했다 — 폼 데이터를 받는 동안 감시가 한 번 돌면 이전 글 본문으로 다시 세우고 대기를 끝내, 새 글 값이
  와도 입력 중으로 보아 다시 세우지 않았다(새 글 화면 편집기에 앞 글 본문이 남고 입력하면 새 글 폼에 들어감). 감시 주기
  안의 입력도 새 화면 폼으로 나갔다. 편집기를 만들지 못해 내려앉은 평문 입력칸에는 재동기화가 아예 없었다.
  같은 화면 입력 중에는 되돌리지 않는다(글자 손실 금지).

