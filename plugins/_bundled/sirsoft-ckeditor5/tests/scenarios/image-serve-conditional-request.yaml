feature: 본문 이미지 서빙의 조건부 요청 계약 (ETag · Last-Modified → 304)

description: |
  에디터 본문 이미지(`/api/plugins/sirsoft-ckeditor5/images/{hash}`)는 `<img>` 로 실려
  건수가 유계가 아닌 통로다. 앞서 `ETag`·`Last-Modified` 를 **내보내기**는
  했지만 돌려받은 `If-None-Match` / `If-Modified-Since` 를 **판정**하는 곳이 없어 재검증이
  영원히 전문 200 이었다 — 검증자를 싣지 않던 시절과 대역폭이 같다. 오류도 로그도 없이
  응답 헤더로만 드러나므로 실제 HTTP 왕복으로 고정한다.

  판정은 코어 단일 지점(`streamedFileResponse()`)이 하고, 여기서는 그 지점에 배선되었는가와
  304 가 200 의 캐시 헤더(`Cache-Control`·`Expires`·`Last-Modified`·`ETag`)를 함께 싣는가를
  잰다. 라우터를 지나야 한다 — Laravel 은 304 응답에 `setNotModified()` 를 다시 불러
  `Last-Modified` 를 벗기므로, 컨트롤러 반환값만 보면 「붙였다」와 「나갔다」가 구분되지 않는다.

  회귀 불변식:
    1. 일치하는 `If-None-Match` → 본문 없는 304 + 200 과 같은 캐시 헤더.
    2. `If-Modified-Since` 만 보내는 클라이언트도 304 로 재검증된다.
    3. 검증자가 어긋나면 전문 200 — 판정이 「언제나 304」로 기울지 않는다.
    4. 이미지는 압축 대상이 아니라 200 에 `Vary` 가 없다 — 304 에만 붙이면 비대칭이다.

axes:
  conditional_request: [if_none_match, if_modified_since, non_matching]

effects:
  - image_serve_matching_etag_returns_304_with_the_cache_headers_of_200
  - image_serve_if_modified_since_alone_returns_304
  - image_serve_non_matching_validator_returns_full_200

test_files:
  - plugins/_bundled/sirsoft-ckeditor5/tests/Feature/Http/Controllers/ImageServeConditionalRequestTest.php

notes: |
  형제 통로의 같은 계약: 코어 스트림 서빙·공개 스토리지 → tests/scenarios/docroot-single-folder.yaml,
  페이지 첨부 미리보기 → modules/_bundled/sirsoft-page/tests/scenarios/page-attachment-serving.yaml,
  게시판 첨부 → modules/_bundled/sirsoft-board/tests/scenarios/board-attachment-serving-contract.yaml.
  마운트 접두사 축(하위 폴더 설치의 이미지 URL)은 docroot-single-folder.yaml 이 소유한다.
