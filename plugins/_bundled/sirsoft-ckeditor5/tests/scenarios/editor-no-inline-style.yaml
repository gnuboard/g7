feature: 편집기·본문 표시가 인라인 스타일을 쓰지 않는다 — 엄격한 스타일 정책 호환

description: |
  운영자가 `style-src 'self'; style-src-attr 'none'` 을 걸면 `<style>` 요소와 HTML 문자열의 `style="…"` 속성이 막힌다.
  종전 핸들러는 읽기 화면 본문 보정(다크·표 너비), 다국어 탭, 편집기 다크 모드 변수 덮어쓰기, 편집기 최소 높이를
  `<style>` 요소로, 「미디어 넣기」 편집 화면 미리보기 모양을 `style="…"` 문자열로 실었다. 이 플러그인이 이름을 정하는
  클래스(다국어 탭 `ckeditor-locale-tab*`·미리보기 `ckeditor-embed-preview`·`ckeditor-embed-preview__frame`)의 규칙은
  플러그인 CSS 파일(`resources/css/main.css` → `dist/css/plugin.css`, `plugin.json` 의 `assets.css` 로 선언, 이름공간
  `ckeditor`)로 옮긴다. CKEditor 라이브러리 DOM(`.ck-*`·`.ck-content`)을 꾸미는 본문 보정·편집기 다크·최소 높이 규칙은
  확장 CSS 가 자기 이름공간 선택자만 실을 수 있어(감사 룰 `extension-css-namespace`) `initEditor.ts` 의 `LIBRARY_CSS` 를
  코어 `G7Core.style.setRules`(생성형 스타일시트 — 정책에 막히지 않는다)로 편집기 마운트·읽기 화면 본문 주입 때 한 벌
  싣는다. 다크 규칙은 중립 표식 `html[data-g7-color-scheme="dark"]`(CSS 파일 쪽은 「다크 안의 라이트」 제외 규격)로
  스코프해 `<html>` 관측자가 필요 없고, 편집기 높이는 컨테이너 속성(`data-ckeditor5-min-height`) + CSS 변수
  (`--ckeditor5-min-height`)로 싣는다. 미리보기 클래스는 CKEditor 가 편집 화면에 그릴 때 떼지 않는다. 코어 API 가 없는
  환경에서도 `<style>` 로 되돌아가지 않는다. CKEditor 라이브러리가 스스로 넣는 스타일은 다루지 않는다.

axes:
  case:
    - editor_single        # 단일 편집기
    - editor_dark          # 다크 모드에서 띄움·띄운 뒤 전환
    - editor_multilingual  # 다국어 탭 편집기
    - editor_destroy       # 편집기 해제
    - content_view         # 읽기 화면 본문 스타일 주입
    - embed_preview        # 미디어 미리보기 HTML
    - css_contract         # CSS 파일 계약
    - source_contract      # 소스·manifest 계약

effects:
  - no_style_element_injected            # 핸들러가 <style> 요소를 만들지 않는다
  - min_height_via_css_variable          # 높이 = 컨테이너 속성 + CSS 변수
  - min_height_marker_removed_on_destroy # 해제하면 속성·변수를 걷는다
  - dark_rules_scoped_by_neutral_marker  # 다크 규칙은 중립 표식 html[data-g7-color-scheme="dark"] 스코프(.dark 미전제)
  - tab_rules_in_css_file                # 다국어 탭 규칙(자기 클래스)이 CSS 파일에 있고 핸들러 클래스와 이름이 같다
  - content_rules_via_runtime_stylesheet # 본문 보정 규칙이 LIBRARY_CSS 에 있고 setRules 로 한 벌 싣는다
  - library_rules_outside_css_file       # 라이브러리 DOM(.ck-*)·CKEditor 변수 규칙은 CSS 파일에 두지 않는다
  - preview_html_has_no_style_attribute  # 미리보기 HTML 에 style 속성이 없다
  - css_declared_as_plugin_asset         # 엔트리 import + plugin.json assets.css

test_files:
