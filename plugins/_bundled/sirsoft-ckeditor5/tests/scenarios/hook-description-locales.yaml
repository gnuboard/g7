feature: CKEditor5 플러그인 — 발행 훅 설명의 언어별 선언

description: |
  관리자 확장 관리의 플러그인 정보 창 「훅」·「필터」 칸은 getHooks() 의 설명을 화면 언어로 고른다.
  설명이 ko/en 만 선언돼 ja 화면에서 한국어로 보였다(7.1.0 실측 P-11). 선언한 훅마다 ko·en·ja 설명을 둔다.

axes:
  locale: [ko, en, ja]

effects:
  - every_declared_hook_has_description_per_locale
  - non_korean_description_is_not_korean_text

test_files:
  - plugins/_bundled/sirsoft-ckeditor5/tests/Unit/HookDescriptionLocalesTest.php

notes: |
  브라우저 실측: 확장 관리 > 플러그인 > 정보 창의 「훅」·「필터」 칸 글자를 ko/en/ja 화면에서 읽는다.
