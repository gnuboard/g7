feature: sirsoft-ckeditor5 레이아웃과 라우트의 다국어 키 해석

description: |
  레이아웃과 라우트가 쓰는 다국어 키(`$t:`)는 화면 언어 ko/en/ja 언어 파일에 모두 있어야 한다. 어느 언어 파일에도 없는 키는
  화면과 검색엔진용 렌더에서 키 이름이나 사이트 기본 제목으로 대신 나간다(7.1.0 O-C3c-1 인기글 공유 미리보기 제목과 같은 결함군).
  확장 식별자로 시작하는 키는 그 확장의 언어 파일과 ja 언어팩에서, 나머지는 레이아웃이 그려지는 템플릿과 코어 프런트 언어
  파일에서 찾는다. 동적 키와 어느 화면에서도 닿지 않는 partials 파일은 판정에서 뺀다.

axes:
  source: [layout_and_route]

effects:
  - layout_translation_keys_resolve_in_all_locales
  - dynamic_and_orphan_excluded

test_files:
  - plugins/_bundled/sirsoft-ckeditor5/resources/js/__tests__/layouts/layout-translation-keys.test.ts

notes: |
  e2e_browser=partial — 정적 대조로 잠근다. 인기글 화면 공유 미리보기 제목은 7.1.0 종합 최종 검증에서 검색엔진용 렌더(봇 UA)와
  브라우저(데스크톱 UA)로 ko/en/ja 를 쟀다.
