feature: 업로드 관리 목록의 올린 사람 표시 이름

description: |
  업로드 관리 목록의 「올린 사람」 이름(`uploader_name`)은 회원 이름 컬럼을 직접 읽지 않고 관리자 영역(`core:admin`) 표시 이름으로
  계산한다. 회원 관계는 표시 이름 계산에 필요한 컬럼(닉네임, 상태, 회원이 고른 종류 포함)으로 읽는다.

  실명은 이름 키에 싣지 않는다. 보는 관리자에게 회원 조회 권한(`core.users.read`)이 있고 실명이 표시 이름과 다를 때만 별도 키
  `uploader_real_name` 으로 싣고, 화면은 그 키가 있을 때만 이름 아래에 작은 글씨 보조 줄(접근 가능한 이름 「실명 ○○」)을 그린다.
  설정을 바꾸지 않은 사이트의 응답은 수정 전과 같다.

  축은 하나(`case`)다. 영역, 권한, 경로를 축으로 나누면 곱이 미커버로 남으므로 잠그는 사실 하나를 한 사례로 편다.

axes:
  case:
    # 응답
    - nickname_admin_area_with_member_read
    - nickname_admin_area_without_member_read
    - default_site_unchanged
    - reference_filter_path
    # 화면
    - uploader_sub_line_markup
    - uploader_sub_line_rendering

effects:
  - uploader_name_follows_admin_area
  - uploader_real_name_added_for_member_readers
  - uploader_real_name_hidden_without_member_read
  - uploader_name_unchanged_on_default_site
  - uploader_real_name_omitted_when_same
  - uploader_name_null_without_uploader
  - uploader_name_follows_admin_area_in_reference_filter
  - uploader_sub_line_in_uploader_cell
  - uploader_sub_line_label_uses_expression_translation
  - uploader_real_name_sub_line_drawn_only_when_key_present

test_files:
  - plugins/_bundled/sirsoft-ckeditor5/tests/Feature/Http/Controllers/Admin/UploaderDisplayNameTest.php
  - plugins/_bundled/sirsoft-ckeditor5/resources/js/__tests__/layouts/uploaderRealNameSub.test.tsx
