feature: 편집 화면의 서식을 CSSOM 으로 입힌다 — 엄격한 스타일 정책에서도 정렬·색·표·이미지 크기가 보인다

description: |
  운영자가 `style-src 'self'; style-src-attr 'none'` 을 걸면 `setAttribute('style', …)` 가 막힌다. CKEditor 는 편집
  화면 요소의 서식(가운데 정렬·들여쓰기·글자색·표 테두리·이미지 크기)을 그 방식으로 써서, 정책을 건 사이트에서는
  서식을 눌러도 편집 화면에 보이지 않았다(저장되는 내용은 맞다). CKEditor 는 편집 화면 DOM 의 속성을 변환기의
  `setDomElementAttribute` 한 곳으로 쓴다. 편집 화면용 변환기(`editor.editing.view.domConverter`)의 그 메서드를
  인스턴스 단위로 덮어써 `style` 만 `el.style.cssText` 로 입힌다. 안전 판정은 원본과 같게 하고 거짓이면 원본으로
  넘긴다. 저장용 변환기·프로토타입·동봉 라이브러리 파일은 건드리지 않으므로 저장되는 HTML 은 그대로다.

axes:
  case:
    - style_attribute         # style 속성 쓰기
    - other_attribute         # style 이 아닌 속성
    - unsafe_style            # 안전 판정이 거짓인 style
    - empty_value             # 빈 값
    - related_element_missing # 뷰 요소 없이 호출(직접 그리는 HTML 조각)
    - converter_missing       # 변환기·메서드가 없는 편집기
    - data_converter          # 저장용 변환기
    - editor_create           # 편집기 생성(단일·다국어)

effects:
  - style_applied_via_cssom            # style 값이 cssText 로 입혀진다
  - no_style_attribute_string_write    # setAttribute('style') 호출 0회
  - other_attributes_delegated         # 다른 속성은 원본이 쓴다
  - unsafe_value_delegated             # 안전하지 않은 값은 원본 경로(우회 속성)로 간다
  - empty_value_removes_attribute      # 빈 값이면 style 속성을 지운다
  - other_editor_build_untouched       # 변환기가 다르면 아무것도 하지 않는다
  - saved_html_converter_untouched     # 저장용 변환기는 그대로다
  - plugin_registered_on_every_editor  # 만드는 편집기마다 extraPlugins 에 들어간다

test_files:
