<!-- 코어 HTML 편집기 자리를 CKEditor 5 로 대체하는 조각 — 편집기 실체는 외부 스크립트가 만들고 이 조각은 마운트·해제 시점만 잡는다 -->
<extension extension-point="html_editor" mode="replace" priority="100">
  <!-- 읽기 전용 값이 로드 뒤에 바뀌어도(권한 확인 도착 등) 편집기가 따라가도록, 같은 식으로 컨테이너의 상태 표식 data-readonly 를 바꾼다 — 핸들러가 이 속성 변화를 지켜본다. 표식은 스타일이 아니라 상태라 클래스로 두지 않는다. 핸들러는 컨테이너를 id 로 찾으므로 컨테이너에는 클래스가 없다 -->
  <div data-ref="ckeditor5_container" id="ckeditor5-{{extensionPointProps.name ?? 'content'}}" data-readonly="{{String(_computed.isReadOnly ?? extensionPointProps.disabled ?? extensionPointProps.readOnly ?? false) === 'true' ? 'true' : 'false'}}">
    <on event="mount">
      <!-- 편집기 생성 — 슬롯을 연 쪽이 준 값과 플러그인 설정(툴바·높이·이미지 업로드)을 합쳐 넘긴다 -->
      <action handler="sirsoft-ckeditor5.initEditor" name="{{extensionPointProps.name ?? 'content'}}" content="{{extensionPointProps.content ?? extensionPointProps.value ?? ''}}" multilingual="{{extensionPointProps.multilingual ?? false}}" placeholder="{{extensionPointProps.placeholder ?? ''}}" readOnly="{{_computed.isReadOnly ?? extensionPointProps.disabled ?? extensionPointProps.readOnly ?? false}}" imageUpload="{{_global.plugins['sirsoft-ckeditor5']?.imageUpload ?? false}}" height="{{_global.plugins['sirsoft-ckeditor5']?.editorHeight ?? 400}}" toolbar="{{_global.plugins['sirsoft-ckeditor5']?.toolbar ?? 'standard'}}" trackChanges="{{extensionPointProps.trackChanges ?? true}}" writeScope="{{extensionPointProps.writeScope ?? 'local'}}" writePath="{{extensionPointProps.writePath ?? ''}}"/>
    </on>
    <on event="unmount">
      <!-- 편집기 해제 — 화면을 떠날 때 인스턴스를 반드시 거둔다(남기면 다음 진입에서 같은 이름으로 두 번 붙는다) -->
      <action handler="sirsoft-ckeditor5.destroyEditor" name="{{extensionPointProps.name ?? 'content'}}"/>
    </on>
  </div>
  <script src="/api/plugins/assets/sirsoft-ckeditor5/dist/vendor/ckeditor5/43.3.1/ckeditor5.umd.js" id="ckeditor5_script" label="$t:sirsoft-ckeditor5.editor.asset.label"/>
</extension>
