feature: KG이니시스 본인인증 — 본인확인 정리 원자성과 로그 파기 시 매핑 명시 삭제

description: |
  사용자 탈퇴·삭제 시 record 파기와 로그 익명화는 한 트랜잭션으로 함께 성공하거나 함께 되돌아간다 —
  한쪽만 끝나면 파기된 것으로 보이는데 이력에 식별자가 남거나, 그 반대가 된다.

  코어 보관주기 파기(`IdentityLogService::purge()`)는 배치마다 로그를 지우기 직전에
  `core.identity_logs.before_purge` 를 그 배치의 로그 ID 배열로 발화한다.
  `CleanInicisChallengeMappingsOnLogPurge` 가 이를 동기로 구독해 그 로그를 참조하는
  `inicis_challenge_mappings` 행을 Repository 로 명시 삭제한다. 외래키 `cascadeOnDelete()` 는
  안전망일 뿐이므로, 테스트는 외래키 검사를 끈 상태에서도 매핑이 0건임을 단언한다.

axes:
  trigger:
    - withdraw      # 탈퇴 훅 (로그 익명화 실패 주입)
    - delete        # 삭제 훅 (로그 익명화 실패 주입)
    - prune_logs    # 보관주기 로그 파기

exclusions: []

effects:
  - record_purge_rolled_back
  - half_done_state_prevented
  - prune_logs_deletes_challenge_mappings_explicitly

test_files:
  - plugins/_bundled/sirsoft-verification_kginicis/tests/Feature/Listeners/CleanInicisRecordAtomicityTest.php
