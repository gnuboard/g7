feature: KG이니시스 본인인증 — 라이브 MID 접두(LIVE_MID_PREFIX) 부착과 라이브 모드 사용 가능 판정

description: |
  이니시스 정책 변경으로 라이브 가맹점 MID 접두가 SRA 에서 SRB 로 바뀌었다(#458). 접두는
  InicisIdentityProvider::LIVE_MID_PREFIX 상수 한 곳에 있고 buildLiveMid / isAvailable 이 그 상수를 따른다.
  입력에 접두가 없으면 붙이고, 이미 있으면 다시 붙이지 않으며, 빈 입력은 빈 값으로 둔다.
  라이브 모드는 MID 와 API 키가 모두 있어야 사용 가능하다.

  기존 회귀 테스트의 소유권을 2026-11-11 시험 기반 클래스를 고치며 사후 등재했다.
  축 `case` 는 시험 하나하나다.

axes:
  case: [prefix_constant, mid_without_prefix, mid_with_prefix, blank_mid, live_mode_with_credentials, live_mode_without_api_key]

effects:
  - live_mid_prefix_constant_is_srb
  - live_mid_prefix_prepended_when_absent
  - live_mid_prefix_not_prepended_twice
  - blank_live_mid_stays_empty
  - live_mode_available_with_mid_and_api_key
  - live_mode_unavailable_without_api_key

test_files:
  - plugins/_bundled/sirsoft-verification_kginicis/tests/Unit/Identity/InicisLiveMidPrefixTest.php
