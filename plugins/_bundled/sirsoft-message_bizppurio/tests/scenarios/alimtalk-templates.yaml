# audit:allow test-scenario-coverage reason: |
#   알림톡 템플릿 화면은 설정 페이지(plugin_settings.json)의 탭으로 배치되며(독립 페이지·메뉴
#   없음), kapi 실시간 위임이라 DB 저장이 없다. 조회 전용 전환으로 등록·수정·삭제·검수·상태변경을
#   제거하고 목록·상태·내용 조회 + 알림 연결만 남겼다(등록·관리는 비즈뿌리오 콘솔로 위임). axes
#   cross product 의 UI 구조(탭 전환·목록 서브뷰·상세 모달·콘솔/준비 안내·i18n) effects 는 Vitest
#   (alimtalk_templates.test.tsx) 정적 검증으로 가드된다. 조회 권한 경계(view)·등록 라우트 제거(405)·
#   kapi 실패 전파(422)는 PHPUnit Feature(AlimtalkTemplateControllerTest) 로, 상태 배지 매핑·kapi
#   파라미터 전달은 Unit(AlimtalkTemplateServiceTest) 로 Http::fake 왕복 관찰한다. 런타임 Playwright
#   spec 은 실연동 검증(PO 직접 수행, 카카오 관리 API 자격증명 필요) 단계에서 최초 도입한다.

feature: 알림톡 템플릿 조회 (조회 전용)

description: |
  설정 페이지 알림톡 템플릿 탭에서 카카오 관리 API(kapi.ppurio.com)로 알림톡 템플릿을
  실시간 조회한다(목록·상태·내용). DB 저장 없이 매 요청 kapi 위임이며, 등록·수정·삭제·검수·
  상태변경은 비즈뿌리오 콘솔로 위임한다. 이 화면의 고유 가치는 카카오 템플릿 ↔ G7 알림 연결
  (binding)이며, 진입은 코어 소유 설정 페이지 하나로 통일한다(메뉴 없음).

  핵심 동작:
    - 탭 네비게이션: 환경설정 ↔ 알림톡 템플릿 (query.tab, 배타 전환)
    - 목록 서브뷰: 상태 필터(templateStatus) + 검색(keyword) + 상태 배지(serviceStatus) + [내용]
    - 상세 모달: 내용만 표시 + [닫기] (관리 액션 없음)
    - 권한: 조회=messaging.view (변경 라우트는 제거 — 등록은 콘솔)
    - kapi 실패(발신프로필 미설정·조회 실패)는 그대로 422 로 전파(운영자가 사유 즉시 확인)
    - readiness: api_key·sender_key 미설정 시 안내 + [설정하기] 탭 이동
    - 안내: 목록 상단 콘솔 위임 안내 + 환경설정 탭 사용 전 준비 안내(카카오·SMS)

axes:
  auth: [view, forbidden, guest]
  kapi_result: [ok, fail, not_found]

exclusions:
  - { auth: guest, kapi_result: fail, reason: "비인증은 결과 무관 401 — kapi 도달 전 차단" }
  - { auth: forbidden, kapi_result: fail, reason: "권한 없으면 403 — kapi 도달 전 차단" }
  - { auth: guest, kapi_result: not_found, reason: "비인증은 결과 무관 401 — kapi 도달 전 차단" }
  - { auth: forbidden, kapi_result: not_found, reason: "권한 없으면 403 — kapi 도달 전 차단" }

