  - lookup_returns_results_keyed_by_log_id
  # overlay 결과 컬럼 렌더 (프론트)
  - overlay_appends_result_column_to_core_history_datagrid
  - result_column_batch_fetches_by_current_page_log_ids
  - success_cell_renders_reason_code_label
