  - balance_low_result_flags_is_low_balance_true
  - fallback_status_surfaced_in_result
  - missing_result_code_yields_null_result_label_with_status_label
  - unmatched_log_id_excluded_from_result_map
  - result_map_excludes_recipient_phone_masking_not_needed
  # 결과 조회 API (백엔드)
