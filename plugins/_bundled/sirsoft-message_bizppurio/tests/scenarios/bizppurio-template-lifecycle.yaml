scenarios:
  - id: bizppurio_tab_integration_e2e
    description: 코어 알림 설정에서 문자·알림톡 개별 탭이 사라지고 '비즈뿌리오' 통합 탭이 노출되며, 행 하단에 승인 2단 배지 + SMS 설정 요약만 렌더된다 (버튼 0, i18n 원문 노출 0)
    effects:
      - bizppurio_tab_replaces_sms_and_alimtalk_tabs
      - row_footer_shows_status_summary_only
      - approval_badge_two_tier
  - id: bizppurio_edit_modal_e2e
    description: 행 [편집]을 누르면 코어 모달의 제목/본문이 숨고 알림톡 템플릿·문자(SMS) 섹션이 렌더되며, 하단 [저장] 한 번으로 알림톡 내용·발송 설정·SMS 본문(·바뀐 수신자 규칙)이 저장된다
    effects:
      - edit_modal_hosts_alimtalk_and_sms_sections
      - core_modal_hides_editor_for_hidden_template_editor_channel
      - unified_save_chain_alimtalk_then_core_recipients
      - inspection_request_carries_reviewer_comment
  - id: bizppurio_compose_modal_e2e
    description: 편집 모달의 알림톡 섹션에서 강조 유형(NONE→TEXT→IMAGE→ITEM_LIST)을 전환하면 조건부 필드 블록이 등장/소멸한다
    effects:
      - compose_modal_switches_conditional_fields_by_type
  - id: bizppurio_manage_round_trip_e2e
    description: 플러그인 관리 화면에서 필터·페이지 상태가 URL 에 보존되고(mergeQuery) SMS 본문 모달이 저장 왕복한다
    effects:
      - manage_screen_lists_db_rows_with_merge_query_round_trip
      - sms_modal_saves_body_via_delivery_upsert
      - manage_list_mobile_card_view_and_unified_toolbar

