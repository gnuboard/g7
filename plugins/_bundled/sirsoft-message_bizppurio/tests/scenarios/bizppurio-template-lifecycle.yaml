feature: 비즈뿌리오 알림톡 템플릿 라이프사이클 (#597)

description: |
  알림톡 템플릿을 시스템에서 작성(draft) → 검수 신청(requested) → 카카오 승인(approved)
  후 발송 활성화하는 전 흐름. 발송 판정은 DB(bizppurio_templates)가 유일한 근거다
  (발송 전 실시간 조회 폐지 — 이슈 요구).

  핵심 동작:
    - 작성: 알림 1건당 1행(unique), content 는 kapi 등록 페이로드 JSON 단일 컬럼
      (유형별 컬럼 분해 없음 — 카카오 규격 변경에 스키마 불변)
    - 검수 신청: template_code 자체 채번(g7_{md5 8}_{세대}, codeCheck 충돌 시 세대 증가
      최대 3회) → kapi add(최초)/update(재신청) → request → requested
    - 전이 가드: content 수정·삭제는 draft/rejected 만 (requested 는 신청 취소 먼저,
      approved 는 승인 취소 먼저 — 승인 취소 즉시 발송 게이트 차단 경고)
    - 동기화: 스케줄러(30분, requested 있을 때만 list 일괄 대조) + 수동 새로고침(detail 1건).
      승인 전이 시 content 를 approved_content 로 동결(발송 SSoT), 반려 시 comments 저장
    - 화면: 3면(코어/게시판/이커머스) '비즈뿌리오' 통합 탭(sms 탭 숨김 + tab_channels 규칙)
      행 하단 상태 요약(승인 2단 배지) + 코어 [편집] 모달에 녹인 알림톡·SMS 섹션(통합 저장,
      4×4 유형) + 플러그인 관리 화면(DB 목록). 제품 결정 2026-08-23: 별도 작성/SMS 모달 폐지

  axis 설계 노트:
    - content_variant 는 카카오 메시지유형×강조유형의 대표 변형 4종이다 — 유형별 조건부
      검증·페이로드 보존이 각 변형에서 실측된다. 유형 전 조합(4×4)의 세부 판정은
      FormRequest 매트릭스 effects(데이터셋 전수)가 담당한다.
    - 전이 axis 는 유형과 직교(전이 로직은 content 를 불투명 JSON 으로 다룬다)하므로
      대표 유형(ba_none)으로만 교차한다 — exclusions 에 명시.
    - 동기화 경로(스케줄러/수동)·화면 면(3면+관리)은 조합 폭발 축이 아니라 효과 축이라
      effects 로 검증한다(스케줄러=커맨드 테스트, 3면 패리티=렌더 테스트, 브라우저=e2e).

axes:
  content_variant: [ba_none, ex_text, ad_image, mi_item_list]
  transition: [draft_to_requested, requested_to_approved, requested_to_rejected, approved_cancel, requested_cancel]

exclusions:
  - { content_variant: [ex_text, ad_image, mi_item_list], transition: [requested_to_approved, requested_to_rejected, approved_cancel, requested_cancel], reason: "전이 규칙은 유형과 직교(content 는 불투명 JSON) — 전이 axis 는 대표 유형(ba_none)으로 검증하고, 유형 axis 는 검증 매트릭스·신청 페이로드 보존으로 검증" }

