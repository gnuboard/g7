<!-- 알림 설정 '비즈뿌리오' 통합 탭 오버레이(제품 결정 2026-08-23 개정). ① 탭 상단 상태 배너(문제 있을 때만: readiness/테스트 모드) + 안내 박스 ② 요약 맵(bizppurioTemplates)과 작성 셀렉트용 카테고리·발신프로필 데이터소스는 [편집] 모달 섹션 확장점(notification_template_form_sections)이 함께 싣는다 — 같은 모달을 둔 플러그인 설정 화면에도 실리게 하려고 오버레이에서 옮겼다. 알림톡 작성/검수/SMS 본문 편집 UI 는 코어 [편집] 모달에 주입되므로 이 오버레이는 더 이상 모달을 등록하지 않는다. -->
<extension target-layout="admin_settings" priority="320">
  <inject target-id="notif_channel_content" position="prepend_child">
    <div data-ref="bizppurio_status_banner" data-if="{{['sms','alimtalk'].includes(query.channel ?? '') &amp;&amp; (((availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.readiness?.ready === false) || ((availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.is_test_mode === true))}}" class="bizppurio:mt-4 bizppurio:mb-3 bizppurio:space-y-2">
      <div data-ref="bizppurio_banner_not_ready" data-if="{{(availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.readiness?.ready === false}}" class="bizppurio-flex-between bizppurio:gap-3 bizppurio:p-3 bizppurio:rounded-lg bizppurio:bg-red-50 bizppurio:dark:bg-red-900/30 bizppurio:border bizppurio:border-red-200 bizppurio:dark:border-red-700">
        <div class="bizppurio:flex bizppurio:items-center bizppurio:gap-2">
          <icon name="circle-exclamation" size="sm" class="bizppurio:text-red-600 bizppurio:dark:text-red-400"/>
          <span class="bizppurio:text-sm bizppurio:text-red-800 bizppurio:dark:text-red-200">$t:sirsoft-message_bizppurio.banner.not_ready</span>
        </div>
        <a href="/admin/plugins/sirsoft-message_bizppurio/settings" class="bizppurio-button bizppurio:text-xs bizppurio:font-medium bizppurio:px-3 bizppurio:py-1.5 bizppurio:rounded-md bizppurio:bg-red-600 bizppurio:text-white bizppurio:hover:bg-red-700 bizppurio:dark:bg-red-600 bizppurio:dark:hover:bg-red-700 bizppurio:whitespace-nowrap">
<permissions>
<permission>core.plugins.update</permission>
</permissions>
          <on type="click">
            <navigate/>
          </on>
          $t:sirsoft-message_bizppurio.banner.setup_action
        </a>
      </div>
      <div data-ref="bizppurio_banner_test_mode" data-if="{{(availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.is_test_mode === true}}" class="bizppurio:flex bizppurio:items-center bizppurio:gap-2 bizppurio:p-3 bizppurio:rounded-lg bizppurio:bg-amber-50 bizppurio:dark:bg-amber-900/30 bizppurio:border bizppurio:border-amber-200 bizppurio:dark:border-amber-700">
        <icon name="flask" size="sm" class="bizppurio:text-amber-600 bizppurio:dark:text-amber-400"/>
        <span class="bizppurio:text-sm bizppurio:text-amber-800 bizppurio:dark:text-amber-200">$t:sirsoft-message_bizppurio.banner.test_mode</span>
      </div>
    </div>
    <!-- 비즈뿌리오 탭 상시 안내 박스 — 알림톡 템플릿을 시스템에서 작성→검수 신청→승인 후 발송됨을 안내. alimtalk 탭 정체성일 때만. -->
    <div data-ref="bizppurio_alimtalk_guide" data-if="{{(query.channel) === 'alimtalk'}}" class="bizppurio:flex bizppurio:items-center bizppurio:gap-2 bizppurio:mt-3 bizppurio:mb-1 bizppurio:p-3 bizppurio:rounded-lg bizppurio:bg-blue-50 bizppurio:dark:bg-blue-950 bizppurio:border bizppurio:border-blue-200 bizppurio:dark:border-blue-800">
      <icon name="circle-info" size="sm" class="bizppurio:text-blue-500 bizppurio:dark:text-blue-400 bizppurio:flex-shrink-0"/>
      <span class="bizppurio:text-sm bizppurio:text-blue-800 bizppurio:dark:text-blue-200">$t:sirsoft-message_bizppurio.template.tab_guide</span>
    </div>
  </inject>
</extension>
