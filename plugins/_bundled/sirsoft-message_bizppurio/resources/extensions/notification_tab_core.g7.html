<!-- 알림 설정 '비즈뿌리오' 통합 탭 오버레이(제품 결정 2026-08-23 개정). ① 탭 상단 상태 배너(문제 있을 때만: readiness/테스트 모드) + 안내 박스 ② 요약 맵(bizppurioTemplates)과 작성 셀렉트용 카테고리·발신프로필 데이터소스는 [편집] 모달 섹션 확장점(notification_template_form_sections)이 함께 싣는다 — 같은 모달을 둔 플러그인 설정 화면에도 실리게 하려고 오버레이에서 옮겼다. 알림톡 작성/검수/SMS 본문 편집 UI 는 코어 [편집] 모달에 주입되므로 이 오버레이는 더 이상 모달을 등록하지 않는다. -->
<extension target-layout="admin_settings" priority="320">
  <inject target-id="notif_channel_content" position="prepend_child">
    <div data-ref="bizppurio_status_banner" data-if="{{['sms','alimtalk'].includes(query.channel ?? '') &amp;&amp; (((availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.readiness?.ready === false) || ((availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.is_test_mode === true))}}" class="mt-4 mb-3 space-y-2">
      <div data-ref="bizppurio_banner_not_ready" data-if="{{(availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.readiness?.ready === false}}" class="flex-between gap-3 p-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700">
        <div class="flex items-center gap-2">
          <icon name="fas fa-circle-exclamation" size="sm" class="text-red-600 dark:text-red-400"/>
          <span class="text-sm text-red-800 dark:text-red-200">$t:sirsoft-message_bizppurio.banner.not_ready</span>
        </div>
        <button type="button" class="text-xs font-medium px-3 py-1.5 rounded-md bg-red-600 text-white hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600 whitespace-nowrap">
<permissions>
<permission>core.plugins.update</permission>
</permissions>
          <on type="click">
            <navigate path="/admin/plugins/sirsoft-message_bizppurio/settings"/>
          </on>
          $t:sirsoft-message_bizppurio.banner.setup_action
        </button>
      </div>
      <div data-ref="bizppurio_banner_test_mode" data-if="{{(availableChannels?.data?.channels ?? []).find(c => c.id === (query.channel))?.is_test_mode === true}}" class="flex items-center gap-2 p-3 rounded-lg bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700">
        <icon name="fas fa-flask" size="sm" class="text-amber-600 dark:text-amber-400"/>
        <span class="text-sm text-amber-800 dark:text-amber-200">$t:sirsoft-message_bizppurio.banner.test_mode</span>
      </div>
    </div>
    <!-- 비즈뿌리오 탭 상시 안내 박스 — 알림톡 템플릿을 시스템에서 작성→검수 신청→승인 후 발송됨을 안내. alimtalk 탭 정체성일 때만. -->
    <div data-ref="bizppurio_alimtalk_guide" data-if="{{(query.channel) === 'alimtalk'}}" class="flex items-center gap-2 mt-3 mb-1 p-3 rounded-lg bg-blue-50 dark:bg-blue-950 border border-blue-200 dark:border-blue-800">
      <icon name="fas fa-circle-info" size="sm" class="text-blue-500 dark:text-blue-400 flex-shrink-0"/>
      <span class="text-sm text-blue-800 dark:text-blue-200">$t:sirsoft-message_bizppurio.template.tab_guide</span>
    </div>
  </inject>
</extension>
