              <sequence if="{{!(JSON.stringify(_global?.[extensionPointProps.stateKey]?.recipients ?? []) !== JSON.stringify(_global?.[extensionPointProps.stateKey]?.template?.recipients ?? []))}}">
                <set-state target="global" :bz_tpl_modal.isSaving="false" :bz_sms_modal.isSaving="false"/>
                <refetch-data-source dataSourceId="bizppurioTemplates"/>
                <refetch-data-source dataSourceId="{{extensionPointProps.refetchDataSourceId}}"/>
                <toast message="$t:sirsoft-message_bizppurio.template.section.saved_toast" type="success"/>
                <close-modal/>
              </sequence>
            </success>
            <fail>
              <set-state target="global" :bz_tpl_modal.isSaving="false" :bz_sms_modal.isSaving="false" bz_tpl_modal.error="{{error.errors?.bizppurio_message ?? error.message}}" bz_tpl_modal.errors="{{(error.errors &amp;&amp; typeof error.errors === 'object' &amp;&amp; !error.errors.bizppurio_message) ? error.errors : null}}"/>
            </fail>
            <body alimtalk_enabled="{{!!(_global.bz_tpl_modal?.alimtalk_enabled ?? true)}}" fallback_sms_enabled="{{!!(_global.bz_sms_modal?.fallback_sms_enabled)}}" sms_only="{{!!(_global.bz_sms_modal?.sms_only)}}" sms_body="{{Object.assign({}, _global.bz_sms_modal?.body)}}"/>
          </api-call>
        </sequence>
      </on>
      <icon data-if="{{(_global.bz_tpl_modal?.isSaving ?? false)}}" name="spinner" class="animate-spin text-sm"/>
      <span>{{(_global.bz_tpl_modal?.isSaving ?? false) ? '$t:common.saving' : '$t:common.save'}}</span>
    </button>
  </div>
</extension>
