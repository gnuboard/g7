<!-- 개인정보 통지 접수와 실제 채널별 결과를 구분하는 이력 화면 -->
<layout name="gdpr_notice_log" version="1.0.0" extends="_admin_base">
  <meta title="$t:sirsoft-gdpr.annual_notice.log_title"/>
  <data-source id="gdprNoticeLog" label_key="$t:sirsoft-gdpr.editor.data_source.gdprNoticeLog" type="api" endpoint="/api/plugins/sirsoft-gdpr/admin/notice-log?page={{query.page || 1}}" method="GET" :auto_fetch="true" :auth_required="true" :refetchOnMount="true"/>
  <permissions><permission>sirsoft-gdpr.privacy.view</permission></permissions>
  <transition-overlay><wait-for>gdprNoticeLog</wait-for></transition-overlay>
  <slot name="content">
    <div class="admin-page-content">
      <page-header title="$t:sirsoft-gdpr.annual_notice.log_title" description="$t:sirsoft-gdpr.annual_notice.log_description" backPath="/admin/plugins/sirsoft-gdpr/settings"/>
      <div class="flex-between my-4">
        <span>$t:sirsoft-gdpr.annual_notice.total|count={{gdprNoticeLog?.data?.pagination?.total ?? 0}}</span>
        <button type="button" class="btn btn-secondary">
          <on type="click"><refetch-data-source dataSourceId="gdprNoticeLog"/></on>
          <span>$t:common.refresh</span>
        </button>
      </div>
      <data-grid data-ref="gdpr_notice_log_grid" data="{{gdprNoticeLog?.data?.data ?? []}}" :pagination="true" :serverSidePagination="true" serverCurrentPage="{{gdprNoticeLog?.data?.pagination?.current_page ?? 1}}" serverTotalPages="{{gdprNoticeLog?.data?.pagination?.last_page ?? null}}" :pageSize="20" :alwaysShowPagination="true" :selectable="false" idField="id" serverHasMorePages="{{gdprNoticeLog?.data?.pagination?.has_more_pages ?? false}}" emptyMessage="$t:sirsoft-gdpr.annual_notice.empty">
        <responsive on="mobile" visibleColumns="{{['created_at', 'user_id', 'status_label', 'is_test']}}"/>
        <column field="created_at" header="$t:sirsoft-gdpr.annual_notice.created_at" :sortable="false"/>
        <column field="user_id" header="$t:sirsoft-gdpr.annual_notice.user_id" :sortable="false"/>
        <column field="status_label" header="$t:sirsoft-gdpr.annual_notice.status" :sortable="false"/>
        <column field="channels_label" header="$t:sirsoft-gdpr.annual_notice.channels" :sortable="false"/>
        <column field="is_test" header="$t:sirsoft-gdpr.annual_notice.kind" :sortable="false">
          <cell><span>{{row.is_test ? $t('sirsoft-gdpr.annual_notice.test') : $t('sirsoft-gdpr.annual_notice.scheduled')}}</span></cell>
        </column>
        <on type="change" event="onPageChange">
          <navigate path="/admin/plugins/sirsoft-gdpr/notice-log" :replace="true" :mergeQuery="true" transition_overlay_target="gdpr_notice_log_grid__body"><query page="{{$args[0]}}"/></navigate>
        </on>
      </data-grid>
    </div>
  </slot>
</layout>
