<partial description="운영자 수동 정책 버전 발행 모달 — memo 입력 + POST /admin/policy-versions">
  <!-- 정책 버전 발행 창 — 환경설정에서만 쓴다. 발행 즉시 적용되고 전 회원이 재동의 대상이 되므로 영향 안내를 함께 싣는다 -->
  <modal data-type="composite" data-ref="policy_version_publish_modal" title="$t:sirsoft-gdpr.settings.policy_version.material_modal.title" size="medium">
    <div class="space-y-3 text-sm text-gray-700 dark:text-gray-200">
      <!-- 사용자 영향 안내 — amber 좌측 색띠 + circle-exclamation — 「발행 시 즉시 적용 + 전 회원 재동의」 라는 점을 명확히 강조 -->
      <div class="bg-amber-50 dark:bg-gray-900 border border-amber-200 dark:border-gray-700 border-l-4 gdpr-accent-warning rounded-lg p-3 flex-center gap-2">
        <icon name="circle-exclamation" size="sm" class="text-amber-600 dark:text-amber-400 flex-shrink-0"/>
        <span class="text-sm text-gray-800 dark:text-gray-100 leading-relaxed">$t:sirsoft-gdpr.settings.policy_version.material_modal.body</span>
      </div>
      <ul class="list-disc list-inside text-xs text-gray-600 dark:text-gray-300 space-y-1 pl-1">
        <li>$t:sirsoft-gdpr.settings.policy_version.material_modal.effect_bump</li>
        <li>$t:sirsoft-gdpr.settings.policy_version.material_modal.effect_reconsent</li>
        <li>$t:sirsoft-gdpr.settings.policy_version.material_modal.effect_history</li>
      </ul>
      <div class="pt-2">
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">$t:sirsoft-gdpr.settings.policy_version.material_modal.memo_label</label>
        <textarea name="publish_memo" :rows="3" placeholder="$t:sirsoft-gdpr.settings.policy_version.material_modal.memo_placeholder" value="{{_local.publishMemo ?? ''}}" class="text-primary w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-blue-500 dark:focus:border-blue-400" disabled="{{$parent._computed.isPluginReadOnly}}">
          <on type="change">
            <!-- 발행 메모 — 무엇이 바뀌어 새 버전을 냈는지 남기는 자리다(이력 표에 그대로 보인다) -->
            <set-state target="local" publishMemo="{{$event?.target?.value ?? ''}}"/>
          </on>
        </textarea>
      </div>
      <div class="flex justify-end gap-2 pt-3 border-t border-gray-200 dark:border-gray-700 mt-3">
        <button type="button" disabled="{{_local.isPublishing}}" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <on type="click">
            <close-modal/>
          </on>
          <span>$t:common.cancel</span>
        </button>
        <!-- 발행 확정 — isPublishing 플래그로 발행 동안 스피너 노출 + 양쪽 버튼 disabled. closeModal 을 sequence 마지막에서 onSuccess 로 이동 (이전: 클릭 즉시 닫혀서 사용자가 발행 진행 상태 파악 불가). 발행 실패 시 모달 유지 → memo 수정 후 재시도 가능. -->
        <button type="button" disabled="{{$parent._computed.isPluginReadOnly || (!(_local.publishMemo ?? '').trim() || _local.isPublishing)}}" class="px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg text-sm font-medium hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center">
          <on type="click">
            <sequence>
              <set-state target="local" :isPublishing="true"/>
              <api-call :auth_required="true" target="/api/plugins/sirsoft-gdpr/admin/policy-versions" method="POST" body="{{({memo: _local.publishMemo ?? ''})}}">
                <success>
                  <set-state target="local" :isPublishing="false" publishMemo=""/>
                  <refetch-data-source dataSourceId="gdprPolicyVersionCurrent"/>
                  <refetch-data-source dataSourceId="gdprPolicyVersionHistory"/>
                  <close-modal/>
                  <toast type="success" message="$t:sirsoft-gdpr.settings.policy_version.publish_success"/>
                </success>
                <fail>
                  <set-state target="local" :isPublishing="false"/>
                  <toast type="error" message="{{Object.values(error.errors ?? {})[0]?.[0] ?? '$t:sirsoft-gdpr.settings.save_error'}}"/>
                </fail>
              </api-call>
            </sequence>
          </on>
          <icon data-if="{{_local.isPublishing}}" name="spinner" size="sm" :spin="true" class="mr-1"/>
          <span data-if="{{!_local.isPublishing}}">$t:sirsoft-gdpr.settings.policy_version.material_modal.confirm</span>
          <span data-if="{{_local.isPublishing}}">$t:sirsoft-gdpr.settings.policy_version.publishing</span>
        </button>
      </div>
    </div>
  </modal>
</partial>
