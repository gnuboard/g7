<!-- gdpr 설정 — 알림 정의 초기화 확인 창. 손으로 고친 알림 설정을 플러그인이 제공하는 기본값으로
  되돌린다. 되돌리면 그동안의 수정이 사라지므로 되묻는다. -->
<partial description="알림 정의 기본값 복원 확인">
  <modal data-type="composite" data-ref="modal_gdpr_notification_definition_reset" title="$t:sirsoft-gdpr.notification_definitions.reset_modal.title" size="sm">
    <p class="text-gray-700 dark:text-gray-300">$t:sirsoft-gdpr.notification_definitions.reset_modal.confirm_message</p>
    <div class="mt-4 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
      <span class="form-sub-label">$t:sirsoft-gdpr.notification_definitions.reset_modal.target_label</span>
      <span class="text-primary font-medium">{{_global.resetTargetName ?? ''}}</span>
    </div>
    <div class="alert-danger">
      <p class="text-error-soft">$t:sirsoft-gdpr.notification_definitions.reset_modal.warning_message</p>
    </div>
    <div class="modal-footer-buttons">
      <button type="button" class="px-4 py-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <close-modal target="modal_gdpr_notification_definition_reset"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="flex-center gap-2 px-4 py-2 bg-orange-600 dark:bg-orange-500 text-white dark:text-white rounded-lg hover:bg-orange-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <!-- 초기화. 성공하면 알림 목록을 다시 불러 되돌아간 값을 보여 준다. -->
          <sequence>
            <set-state target="global" :isResettingNotification="true"/>
            <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.resetTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :isResettingNotification="false" :resetTargetId="null" resetTargetName=""/>
                <refetch-data-source dataSourceId="gdprNotificationDefinitions"/>
                <toast type="success" message="$t:sirsoft-gdpr.notification_definitions.reset_success"/>
                <close-modal target="modal_gdpr_notification_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :isResettingNotification="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-gdpr.notification_definitions.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingNotification}}" name="spinner" class="spinner-sm"/>
        <span>{{_global.isResettingNotification ? '$t:sirsoft-gdpr.notification_definitions.reset_modal.btn_confirming' : '$t:sirsoft-gdpr.notification_definitions.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
