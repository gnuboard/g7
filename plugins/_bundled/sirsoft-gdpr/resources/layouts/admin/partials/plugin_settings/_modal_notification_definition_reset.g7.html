<!-- gdpr 설정 — 알림 정의 초기화 확인 창. 손으로 고친 알림 설정을 플러그인이 제공하는 기본값으로
  되돌린다. 되돌리면 그동안의 수정이 사라지므로 되묻는다. -->
<partial description="알림 정의 기본값 복원 확인">
  <modal data-type="composite" data-ref="modal_gdpr_notification_definition_reset" title="$t:sirsoft-gdpr.notification_definitions.reset_modal.title" size="sm">
    <p class="gdpr:text-gray-700 gdpr:dark:text-gray-300">$t:sirsoft-gdpr.notification_definitions.reset_modal.confirm_message</p>
    <div class="gdpr:mt-4 gdpr:p-3 gdpr:bg-gray-100 gdpr:dark:bg-gray-700 gdpr:rounded-lg">
      <span class="gdpr-form-sub-label">$t:sirsoft-gdpr.notification_definitions.reset_modal.target_label</span>
      <span class="gdpr-text-primary gdpr:font-medium">{{_global.resetTargetName ?? ''}}</span>
    </div>
    <div class="gdpr-alert-danger">
      <p class="gdpr-text-error-soft">$t:sirsoft-gdpr.notification_definitions.reset_modal.warning_message</p>
    </div>
    <div class="gdpr-modal-footer-buttons">
      <button type="button" class="gdpr:px-4 gdpr:py-2 gdpr:bg-white gdpr:dark:bg-gray-800 gdpr:text-gray-700 gdpr:dark:text-gray-300 gdpr:border gdpr:border-gray-300 gdpr:dark:border-gray-600 gdpr:rounded-lg gdpr:hover:bg-gray-50 gdpr:dark:hover:bg-gray-700 gdpr:disabled:opacity-50 gdpr:disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <close-modal target="modal_gdpr_notification_definition_reset"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="gdpr-flex-center gdpr:gap-2 gdpr:px-4 gdpr:py-2 gdpr:bg-orange-700 gdpr:dark:bg-orange-700 gdpr:text-white gdpr:dark:text-white gdpr:rounded-lg gdpr:hover:bg-orange-800 gdpr:disabled:opacity-50 gdpr:disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <!-- 초기화. 성공하면 알림 목록을 다시 불러 되돌아간 값을 보여 준다. -->
          <sequence>
            <set-state target="global" :isResettingNotification="true"/>
            <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.resetTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :isResettingNotification="false" :resetTargetId="null" resetTargetName=""/>
                <refetch-data-source dataSourceId="gdprNotificationDefinitions"/>
                <toast type="success" message="$t:sirsoft-gdpr.notification_definitions.reset_success"/>
                <close-modal target="modal_gdpr_notification_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :isResettingNotification="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-gdpr.notification_definitions.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingNotification}}" name="spinner" class="gdpr-spinner-sm"/>
        <span>{{_global.isResettingNotification ? '$t:sirsoft-gdpr.notification_definitions.reset_modal.btn_confirming' : '$t:sirsoft-gdpr.notification_definitions.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
