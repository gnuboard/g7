limitations:
  - "마이페이지는 회원 전용(consent/me auth_required) 이라 게스트 거부는 화면 표기 없음 — 이슈 요구와 일치 (게스트 거부는 history 에만 기록)."
  - "거부는 선택형(non-required) 카테고리에만 의미가 있다. 필수 카테고리는 ePrivacy Art.5(3) 면제로 거부 대상 아님."
  - "재동의 플래그 해제는 회원 status 에만 적용. 게스트는 status 미사용이라 history append 만 이뤄진다."
  - "admin 동의이력 [거부] 필터는 백엔드 actions[] whereIn 을 그대로 사용 — rejected 값이 화이트리스트 검증 없이 통과(백엔드 무수정)."
