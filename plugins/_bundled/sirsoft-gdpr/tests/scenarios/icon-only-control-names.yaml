feature: sirsoft-gdpr 레이아웃의 아이콘만 담은 단추·링크 접근 이름

description: |
  번들 템플릿의 Icon 은 이름(ariaLabel)을 받지 않으면 영문 글리프 이름(「trash」·「chevron left」·「ellipsis」)을
  role="img" 이름으로 달았고, 이 확장 레이아웃의 아이콘만 담은 단추·링크는 그 영문 이름에 기대 이름을 얻고 있었다.
  Icon 을 꾸밈(aria-hidden)으로 바꾸면서(7.1.0 O-C3b-3) 이 단추·링크는 화면 언어를 따르는 이름(aria-label, 필요하면 title)을
  직접 갖는다. 이름으로 쓴 다국어 키는 ko/en/ja 언어 파일에 모두 있어야 한다.

axes:
  control: [layout_icon_only_control]

effects:
  - layout_icon_only_control_named
  - icon_only_control_keys_resolve

test_files:
  - plugins/_bundled/sirsoft-gdpr/resources/js/__tests__/layouts/icon-only-control-names.test.ts

notes: |
  e2e_browser=partial — 레이아웃 JSON 정적 대조로 잠근다. 실제 화면 접근 이름은 7.1.0 종합 3c 격리 브라우저 실측에서
  관리자 대표 화면으로 확인했다.
