feature: 플러그인 설정 화면 읽기 전용 — 코어 설정 응답 abilities.can_update (7.1.0 abilities 게이트)

description: |
  코어 플러그인 설정 응답 `data.abilities.can_update`(= core.plugins.update)가 true 가 아니면(응답 전·키 없음 포함, fail-closed)
  읽기 전용 안내를 보이고 설정 입력·저장·쓰기 버튼을 잠근다. 저장 PUT 은 코어가 요청 본문의 abilities 를 버린다.

test_files:
  - plugins/_bundled/sirsoft-gdpr/resources/js/__tests__/layouts/plugin-settings-read-only.test.ts

axes:
  case:
    - plugin_settings_without_update
    - aux_source_forbidden

effects:
  - plugin_settings_locked_read_only
  - aux_source_forbidden_handled_without_toast   # 화면이 스스로 받는 보조 소스의 403 은 소스에서 끊는다(오류 알림 없음) — 그 칸은 숨거나 같은 권한 소스의 「권한 없음」 안내로 대신
