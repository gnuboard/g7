feature: 코어 동의 제공자 계약으로 동의 판단에 답하기 (#639)

description: |
  코어는 동의를 관리하는 확장이 무엇인지 모른다. 이 플러그인은 코어 필터 `core.consent.registered_providers` 로
  제공자(GdprConsentProvider)를 등록하고, 코어 매니저가 고른 제공자일 때 「이 방문자가 무엇에 동의했나」에
  스냅샷으로 답한다. 코어 코드에는 이 플러그인의 식별자·클래스·경로·이벤트명이 없다.

    등록      core.consent.registered_providers (filter) ← RegisterGdprConsentProviderListener
    식별      게스트 = 서명 검증한 gdpr_session UUID, 회원 = 회원 번호
    스냅샷    미식별 게스트 = 필수만(D19), 정책 버전 변경 = needsRenewal, 조회 실패 = 코어가 unknown 으로 닫음
    변경 알림 sirsoft-gdpr.consent.granted/revoked → 요청 종료 시 주체마다 한 번 core.consent.changed (D11)

  브라우저 쪽은 코어 동의 런타임(_global.consent · consent:changed · refreshConsent)을 소비만 한다 —
  자체 조회 폴백·전용 이벤트·동기화 핸들러가 없다(Vitest consentRuntimeConsumer 가 잠근다).

