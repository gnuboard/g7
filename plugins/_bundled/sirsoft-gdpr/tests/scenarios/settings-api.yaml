feature: GDPR 설정 API 계약 — 관리자 저장 검증 · 공개 응답 · 개인정보처리방침 주소

description: |
  관리자 설정 저장(PUT /admin/settings)·조회(GET /admin/settings)와 공개 설정(GET /settings)이
  지키는 계약, 그리고 1.1.0 에서 슬러그(`privacy_policy_slug`)를 대체한 개인정보처리방침 주소
  (`privacy_policy_url`)의 전 생애를 한 곳에서 잇는다.

  처리방침 주소:
    1.0.x 는 슬러그를 저장하고 페이지 모듈의 주소 규칙(`/page/{slug}`)으로 링크를 조합했다 — 이
    플러그인이 선언하지 않은 확장의 주소 규칙에 기댄 구조라, 1.1.0 부터 운영자가 주소를 직접 적는다.
      - 허용 형식: `/` 로 시작하는 사이트 경로 또는 `https://` 절대 주소 (판정 SSoT: Support\PrivacyPolicyUrl)
      - 거부: 다른 스킴(javascript:/data: 등)·http·프로토콜 상대(`//host`)·백슬래시(`/\host`)·공백·제어문자·userinfo
      - 공개 응답: privacy_policy_url(허용 형식만, 아니면 null) + privacy_policy_available(주소가 있으면 true)
        처리방침 페이지의 실재 여부는 보지 않는다 — 어느 확장이 게시하는지 이 플러그인은 모른다
      - 연간 통지: 사이트 경로는 앱 주소를 붙인 절대 주소로 접수 시점 스냅샷에 얼린다
      - 정책 버전 스냅샷: privacy_policy_url 을 기록. 1.0.x 스냅샷의 슬러그는 읽을 때만 `/page/{slug}` 로 풀어
        비교·표시한다(원본은 입증 자료라 고치지 않는다)
      - 기설치본: 1.1.0 업그레이드 스텝이 슬러그를 같은 경로로 옮기고 슬러그 키를 지운다

axes:
  surface: [admin_show, admin_update, public_show, annual_notice, policy_snapshot, upgrade, installation]

effects:
  # C5 후속(2026-09-28 결정): 연간 통지 메일은 처리방침 주소가 비어 있으면 링크 줄을 뺀다.
  - annual_notice_omits_policy_link_line_when_address_empty
  # 관리자 설정 API (기존 계약)
  - admin_settings_requires_authentication
  - admin_show_returns_saved_settings
  - admin_update_persists_validated_settings
  - admin_update_strips_removed_toggle_keys
  - admin_update_rejects_invalid_banner_position
  - admin_update_normalizes_blocked_domains
  - admin_update_validates_blocked_domain_format
  - admin_update_accepts_four_category_catalog
  - admin_update_validates_data_storage_location
  - admin_update_never_publishes_policy_version
  - admin_update_without_cookie_categories_leaves_them_untouched
  - admin_show_fills_default_categories_when_stored_value_empty
  - admin_update_validation_messages_read_naturally
  - admin_update_introduction_too_long_reports_single_error

  # 공개 설정 API (기존 계약)
  - public_settings_accessible_without_auth
  - public_settings_exposes_banner_toggle_only
  - public_settings_exposes_blocked_domains_catalog
  - public_settings_exposes_four_categories

  # 처리방침 주소 — 저장 검증
  - privacy_policy_url_accepts_site_path_and_https_url
  - privacy_policy_url_rejects_unsafe_addresses
  - privacy_policy_url_validation_names_the_field
  - privacy_policy_url_legacy_slug_key_is_not_saved
  - admin_settings_field_binds_privacy_policy_url

  # 처리방침 주소 — 노출·링크
  - public_settings_exposes_privacy_policy_url_and_availability
  - public_settings_hides_unsafe_stored_privacy_policy_url
  - banner_links_operator_privacy_policy_url
  - annual_notice_links_operator_privacy_policy_url

  # 처리방침 주소 — 정책 버전 스냅샷
  - policy_snapshot_records_privacy_policy_url
  - policy_diff_reads_legacy_slug_snapshot_as_same_address
  - snapshot_modal_links_resolved_privacy_policy_url
  - snapshot_modal_labels_legacy_slug_snapshot
  - initial_snapshot_records_privacy_policy_url

  # 처리방침 주소 — 기설치본 이관 (1.1.0 업그레이드 스텝)
  - upgrade_converts_slug_to_page_path
  - upgrade_keeps_existing_privacy_policy_url
  - upgrade_privacy_policy_url_is_idempotent

