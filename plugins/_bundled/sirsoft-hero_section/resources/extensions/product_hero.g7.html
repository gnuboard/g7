<!-- 상품 상세 상단 히어로 자리(`product_hero`)에 그 상품의 배너 슬라이더를 붙이는 조각 — 화면 주소의 상품 코드(route.product_code)를 대상으로 공개 API 에
  넘겨 그 상품에 등록한 배너(현재 언어 문구)와 위치 슬라이더 설정을 받는다. SPA 로 다른 상품 화면으로 옮기면 주소 값이 바뀌어 다시 받는다 —
  새 응답이 오기 전 앞 상품의 배너가 보이지 않게, 응답이 되돌려 준 화면 값(`target`)이 지금 주소 값과 같을 때만 배너를 넘긴다.
  대상마다 첫 로드 힌트를 줄 수 없어 첫 방문에는 스켈레톤을 그리지 않고, 그 상품을(를) 다시 찾았을 때 브라우저 기억이 「배너 있음」이면 그린다.
  배너가 없거나 받기에 실패하면 아무것도 그리지 않는다. 다른 템플릿이 경로 이름을 다르게 쓰면 그 템플릿이 이 조각을 덮어써 값을 맞춘다. -->
<extension extension-point="product_hero" mode="append" priority="50">
  <sirsoft-hero_section.hero-slider data-type="composite" data-ref="heroSectionProduct_slider" banners="{{heroSectionProduct?.data?.target === String(route?.product_code ?? '') ? (heroSectionProduct?.data?.banners ?? []) : []}}" loading="{{heroSectionProduct == null || (heroSectionProduct?.data != null &amp;&amp; heroSectionProduct.data.target !== String(route?.product_code ?? ''))}}" editable="{{heroSectionProduct?.data?.abilities?.can_update === true}}" settings="{{heroSectionProduct?.data?.settings}}" position="product_hero" target="{{String(route?.product_code ?? '')}}" contentClass="{{extensionPointProps?.contentClass ?? ''}}">
    <!-- 템플릿이 확장점으로 넘긴 본문 상자 클래스 — 데스크톱은 따로 넘긴 값(없으면 기본 값). 표시 폭이 본문 폭이면 슬라이더 바깥, 화면 전체면 문구·넘김 단추에 쓴다 -->
    <responsive on="desktop" contentClass="{{extensionPointProps?.contentClassDesktop ?? extensionPointProps?.contentClass ?? ''}}"/>
  </sirsoft-hero_section.hero-slider>
  <!-- 이 상품의 노출 배너 — 로그인하지 않아도 받는다. 로그인했으면 토큰을 실어 수정 권한(abilities.can_update)을 함께 받는다. 주소 값이 바뀌면 엔진이 다시 부른다 -->
  <data-source id="heroSectionProduct" label_key="$t:sirsoft-hero_section.editor.data_source.heroSectionProduct" type="api" endpoint="/api/plugins/sirsoft-hero_section/hero" method="GET" :auto_fetch="true" auth_mode="optional" loading_strategy="background">
    <params position="product_hero" target="{{route?.product_code}}"/>
    <fallback :data="null"/>
  </data-source>
</extension>
