<!-- 쇼핑몰 메인 상단 히어로 자리(`shop_hero`)에 배너 슬라이더를 붙이는 조각 — 지금 노출 중인 배너(현재 언어 문구)와 그 위치의 슬라이더 설정을
  공개 API 로 받는다. 받는 동안(응답 전 값이 비어 있음)은 슬라이더가 같은 크기의 스켈레톤을 그려 자리를 잡고(첫 로드 힌트가 배너 없음이면 잡지 않는다), 배너가 0건이거나
  받기에 실패하면 아무것도 그리지 않는다(구좌 숨김, 화면 오류로 만들지 않는다). 플러그인을 끄면 이 조각과
  공개 API 가 함께 빠져 자리도 비어 있다. 언어를 바꾸면 화면이 새로 마운트되며 새 언어로 다시 받는다. -->
<extension extension-point="shop_hero" mode="append" priority="50">
  <sirsoft-hero_section.hero-slider data-type="composite" data-ref="heroSectionShop_slider" banners="{{heroSectionShop?.data?.banners ?? []}}" loading="{{heroSectionShop == null}}" skeletonWidth="{{_global.plugins?.['sirsoft-hero_section']?.slot_widths?.shop_hero ?? ''}}" skeletonBanners="{{_global.plugins?.['sirsoft-hero_section']?.slot_banners?.shop_hero}}" editable="{{heroSectionShop?.data?.abilities?.can_update === true}}" skeletonOverlay="{{_global.plugins?.['sirsoft-hero_section']?.slot_overlays?.shop_hero}}" skeletonMaxHeight="{{_global.plugins?.['sirsoft-hero_section']?.slot_max_heights?.shop_hero ?? null}}" settings="{{heroSectionShop?.data?.settings}}" position="shop_hero" contentClass="{{extensionPointProps?.contentClass ?? ''}}">
    <!-- 템플릿이 확장점으로 넘긴 본문 상자 클래스 — 데스크톱은 따로 넘긴 값(없으면 기본 값). 표시 폭이 본문 폭이면 슬라이더 바깥, 화면 전체면 문구·넘김 단추에 쓴다 -->
    <responsive on="desktop" contentClass="{{extensionPointProps?.contentClassDesktop ?? extensionPointProps?.contentClass ?? ''}}"/>
  </sirsoft-hero_section.hero-slider>
  <!-- 지금 노출 중인 배너 — 로그인하지 않아도 받는다. 로그인했으면 토큰을 실어 수정 권한(abilities.can_update)을 함께 받는다. 실패하면 빈 값으로 떨어져 슬라이더를 그리지 않는다 -->
  <data-source id="heroSectionShop" label_key="$t:sirsoft-hero_section.editor.data_source.heroSectionShop" type="api" endpoint="/api/plugins/sirsoft-hero_section/hero" method="GET" :auto_fetch="true" auth_mode="optional" loading_strategy="background">
    <params position="shop_hero"/>
    <fallback :data="null"/>
  </data-source>
</extension>
