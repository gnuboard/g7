feature: 히어로섹션 노출 위치 확장 (위치 등록 필터·동적 위치·대상)

description: |
  노출 위치 목록은 필터 `sirsoft-hero_section.position.registered_positions` 로 모은다. 히어로가 내장 위치를 맨 앞에 넣고
  (사이트 홈·쇼핑몰 메인, 게시판 모듈이 켜져 있으면 게시판 목록, 이커머스 모듈이 켜져 있으면 상품 상세·카테고리 목록), 다른 확장이
  같은 필터로 더한다. 어긋난 정의는 버리고 경고를 남긴다. 동적 위치는 배너가 대상(게시판·상품·카테고리)마다 따로이고, 대상 해석기가
  화면 값(slug·상품 코드·id)을 저장 키(id)로 푼다. 순서·노출·통계·공개 캐시는 자리(위치 + 대상) 단위이고, 슬라이더 설정은 위치 단위다(D6).
  대상에 배너가 없으면 사이트에 아무것도 그리지 않는다(D3). 위치를 더한 확장을 끄거나 대상을 지워도 배너는 남아 관리자에게만
  「등록되지 않은 위치」·「없는 대상」으로 보인다(D7). 동적 위치는 첫 로드 힌트가 없어 브라우저 기억이 「배너 있음」일 때만 스켈레톤을 그린다(D8).
  모듈 DB 상태에 기대지 않도록 PHPUnit 은 켜진 모듈을 고정하고(`PinsActiveModules`), 동적 위치는 시험용 위치 `fake_hero`(가짜 해석기)로 본다 —
  제3 확장이 위치를 더하는 길과 같다. 내장 해석기 3종은 모듈 저장소를 목으로 바꿔 따로 본다 — 화면 값은 slug·상품 코드를 먼저 찾고 없을 때만 숫자 id 로 찾는다(숫자 slug 가 다른 대상 id 와 겹치면 slug 쪽). 위치를 더한 확장이 자기 화면에 두는 조각은
  문서 예시와 같은 시험용 조각으로 히어로 자기 조각과의 계약 일치·엔진 실제 렌더·히어로 꺼짐을 본다.
  다른 확장이 더한 위치는 템플릿이 같은 이름의 확장점만 두면 히어로가 레이아웃을 낼 때 자리를 채운다(내장 조각 파일이 원본인 출력 조각,
  동적 위치는 등록한 경로 매개변수로 대상 값을 읽는다) — 실제 레이아웃 병합으로 채움·건너뜀(이미 슬라이더가 든 자리·편집기·미등록·경로
  매개변수 없음)을 보고, 자리 안의 자리·반복 템플릿(표·카드 셀, 펼침 행, 하위 행) 안의 자리도 리스너 한 번 실행으로 채우는지 본다.
  생성 조각은 실제 HeroSlider 로도 그려 본다. 외부 정적 위치의 관리·검증·공개 API, 확장을 껐다 켤 때 배너 보존을 본다.

