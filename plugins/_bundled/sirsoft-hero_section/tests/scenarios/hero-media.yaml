feature: 히어로섹션 영상 배너 (유튜브 · 영상 파일)

description: |
  배너마다 미디어 종류(이미지 기본 · 유튜브 영상 · 영상 파일)를 고른다. 어느 종류든 PC 이미지는 대표 이미지로 필수다 —
  유튜브는 방문자가 마케팅 쿠키에 동의하기 전(또는 동의 런타임이 없는 화면)에, 영상은 받는 동안·움직임 줄이기에서 대신 보인다.
  유튜브는 주소를 받아 영상 ID(11자)만 저장하고 사이트는 youtube-nocookie 플레이어를 소리 없이 띄운다. 동의 전에는 재생
  단추를 눌러야 그 배너만 불러온다. 영상 파일(MP4·WEBM)은 이미지처럼 임시 묶음에 올린 뒤 저장 때 붙고, PC·모바일 각각 둘 수
  있으며(모바일이 없으면 PC), 공개 응답은 범위 요청(206)을 받는다. 활성 장이 영상이면 간격 넘김을 멈추고 영상이 끝나면 다음
  장으로 넘긴다(한 장이면 반복). 재생할 수 없는 영상(파일 오류·플레이어 무응답 10초)은 이미지처럼 간격으로 넘긴다. 일시정지
  단추는 자동 넘김과 영상 재생을 함께 멈춘다. 영상 최대 용량은 이미지와 따로(기본 30MB, 서버 PHP 한도 이하)다.
  입력 변종(미디어 종류 image·youtube·video × 동의 none·ready 동의·ready 미동의·unknown·런타임 없음 × 기기 pc·mobile)은
  surface 마다 해당 조합을 시험 본문에서 돌린다(동의 판정 표는 marketing_consent_rules, 기기 영상은 video_device_source).

