feature: 히어로섹션 영상 배너 (영상 파일)

description: |
  배너마다 미디어 종류(이미지 기본 · 영상 파일)를 고른다. 어느 종류든 PC 이미지는 대표 이미지로 필수다 — 영상은 받는 동안·
  움직임 줄이기에서 대신 보인다. 영상 파일(MP4·WEBM)은 이미지처럼 임시 묶음에 올린 뒤 저장 때 붙고, PC·모바일 각각 둘 수
  있으며(모바일이 없으면 PC), 공개 응답은 범위 요청(206)을 받는다. 활성 장이 영상이면 간격 넘김을 멈추고 영상이 끝나면 다음
  장으로 넘긴다(한 장이면 반복). 재생할 수 없는 영상(파일 오류)은 이미지처럼 간격으로 넘긴다. 일시정지 단추는 자동 넘김과
  영상 재생을 함께 멈춘다. 영상 최대 용량은 이미지와 따로(기본 30MB, 서버 PHP 한도 이하)다.
  유튜브 등 제3자 영상 플랫폼은 받지 않는다(추후 보완 출시) — 등록·수정에서 그 종류를 거절하고, 옛 응답에 남은 유튜브 종류는
  대표 이미지로만 그린다. 옛 유튜브 배너는 업그레이드 때 이미지 배너로 바뀐다.
  입력 변종(미디어 종류 image·video·옛 youtube × 기기 pc·mobile)은 surface 마다 해당 조합을 시험 본문에서 돌린다(기기 영상은 video_device_source).

