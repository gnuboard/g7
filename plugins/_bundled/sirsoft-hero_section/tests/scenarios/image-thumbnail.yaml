feature: 배너 이미지 서빙의 썸네일 (`?size=` · `?w=`) 과 사용자 슬라이더 srcset

description: |
  배너 이미지(`/api/plugins/sirsoft-hero_section/images/{hash}`)는 해시만 알면 누구나 받는 공개 원본이다(원본 응답도 `public` 1년 캐시).
  PC·모바일 이미지는 기기별로 따로 올리지만 둘 다 각자의 원본이라 각자 썸네일 경로를 탄다. 컨트롤러가 해시 조회(게이트) 바로 뒤·원본
  응답 바로 앞에서 코어 `ThumbnailResponder` 를 부르고, 낼 수 없으면 원본에 `X-G7-Thumbnail: bypass:{사유}` 를 붙인다. 서비스
  `publicServing()` 안에서 부르지 않는 것은 원본의 304 판정을 컨트롤러가 하기 때문이다.

  리스너(`ThumbnailRegistrationListener`)가 서빙 경로 패턴과 공개 원본 제공자를 코어 목록에 더한다. 코어는 이 플러그인을 모른다 —
  경로·제공자는 이 플러그인만 안다. 패턴이 빠지면 화면이 이 주소에 규격을 붙이지 않아 오류 없이 원본만 나간다.

  사용자 슬라이더(`HeroSlider`)는 코어 `G7Core.thumbnail.contentSrcsetWithin(주소, 원본 가로, { includeOriginal: true })` 로
  숫자 요청 규격(md·lg·xl) 중 원본보다 작은 후보 + 원본(제 가로)을 받아 기기 판정으로 고른 주 이미지(PC 또는 모바일)의 `<img>` 에 그 이미지 원본으로 srcset 을 준다
  (sizes 는 그려진 슬라이더 상자를 잰 폭 — 이미지가 상자보다 가로로 길면 덮어 그리는 폭 `상자 높이 × 이미지 비율`, 잴 수 없으면 상한 100vw.
  재기 전에는 이미지 주소를 붙이지 않아 100vw 로 받기 시작하지 않는다). 그 함수가 없으면 srcset 없이 원본 하나다(템플릿 본문 이미지와 같은 정책).

  회귀 불변식:
    1. 파라미터 없는 요청은 이전과 같은 원본 바이트이고 썸네일 헤더·파생본이 생기지 않는다.
    2. `?size=md` 는 가로 640 파생본(비율 유지, 첫 요청 miss·다음 hit) + nosniff. 키는 `thumbnails/{디스크}/sirsoft-hero_section/images/{path}/md_…`.
    3. 모바일 이미지는 자기 파생본을 갖는다(PC 파생본과 키가 갈린다).
    4. `?w=1000` 은 숫자 요청 대상 중 가로 ≥ 1000 최소(lg 1280)로 올려 맞춘다.
    5. 운영 환경에서 공개 원본 썸네일의 캐시는 `public`.
    6. 미정의 규격·원본보다 큰 규격(확대 끔)은 원본 + `bypass:{사유}`. 영상은 원본 영상 + `bypass:not-raster`, 파생본 없음.
    7. 저장 전 임시 업로드도 같은 썸네일을 낸다(해시 공개).
    8. 공개 썸네일 저장 위치가 공개 자산 디스크(public)면 302 직접 주소, 비공개 디스크에는 쓰지 않는다.
    9. 원본 파일만 사라진 행은 `?size=` 를 붙여도 무파라미터와 같은 404 다. 드라이버로 지우면 파생본도 지워진다.
    10. 제공자는 `sirsoft-hero_section/images/` 의 래스터만 원본으로 분류(영상·다른 카테고리·다른 확장 제외), 기존 이미지 수·목록은 배너에 붙은 이미지만.
    11. 슬라이더 srcset 은 원본보다 작은 숫자 규격 + 원본. 코어 함수 `contentSrcsetWithin` 이 없거나 대상 주소가 아니거나 원본 가로를 모르면 srcset 없이 원본 하나다.
    14. 슬라이더 sizes 는 실제 상자 폭이다(본문 폭 1920 화면의 1216px 칸이 원본 대신 lg). 재기 전 sizes 로 주소가 붙은 적이 없다.
    12. 썸네일을 요청했는데 원본을 낼 때는 운영 환경에서도 `immutable` 이 없고 유지 시간은 썸네일 응답과 같은 `cache.layout_ttl` 이다(영상 포함, 원본 주소는 그대로 1년 불변). 설정이 1년보다 길어도 우회 원본은 1년에서 멈춘다.
    13. 관리 목록 규격 `sirsoft-hero_section.list`(가로 240, 가로만 맞춤, 숫자 요청 아님)가 확장 규격으로 등록되고 그 이름으로 240×80 을 낸다.
        환경설정 「썸네일 규격」 표 행에는 이름 「배너 목록」(다국어 키 → 로케일 맵 `label`)이 실린다.

