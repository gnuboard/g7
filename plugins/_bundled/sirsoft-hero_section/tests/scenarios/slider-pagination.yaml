feature: 히어로섹션 슬라이더 페이징 모양

description: |
  위치 설정(사이트 홈·쇼핑몰 메인마다)에서 페이징 모양을 고른다 — 점(dots, 기본·기존 행) · 진행 막대 점(progress, 지금 장 점이
  24px 막대로 길어지고 Swiper 자동 넘김의 지난 비율만큼 찬다, 자동 넘김이 멈추면 가득) · 배너 이름 탭(tabs, 장마다 배너 제목과
  막대, 휴대폰에서는 이름을 화면 읽기용으로만 남기고 막대만) · 번호(fraction, 「01 / 05」, 화면 읽기에서는 감춤 — 장 번호는 슬라이드
  이름이 읽는다) · 알약 번호(pill, 문구 아래 왼쪽 둥근 상자 안 「‹ 1 / 5 ›」, 양옆 화살표 없이 상자 안 단추로 넘긴다). 관리 화면에서 고르면 저장 전에 미리보기가 따라가고, 저장하면 공개 응답 설정에 실린다. 생략하면 지금 값 유지.

axes:
  surface:
    - slider_pagination_dots_default
    - slider_pagination_progress
    - slider_pagination_tabs
    - slider_pagination_fraction
    - slider_pagination_pill
    - admin_pagination_setting
    - site_pagination_variants
    - admin_preview_without_swiper_errors

effects:
  - pagination_follows_position_setting

