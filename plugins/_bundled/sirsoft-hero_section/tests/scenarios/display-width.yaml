feature: 히어로섹션 위치별 표시 폭 (본문 폭 · 화면 전체)

description: |
  운영자가 위치(사이트 홈·쇼핑몰 메인)마다 배너를 본문 폭에 맞출지 화면 전체 폭으로 펼칠지 고른다. 기본은 본문 폭이라
  업데이트 뒤에도 사이트 화면이 그대로다. 템플릿은 히어로 자리를 본문 상자 밖(전폭)에 두고 본문 상자 클래스를 확장점 속성
  (`contentClass` 기본 · `contentClassTablet` 태블릿 · `contentClassDesktop` 데스크톱)으로 넘긴다. 본문 폭이면 슬라이더를 그 상자 안에, 화면 전체면 끝까지
  그리되 제목·넘김 단추는 그 상자에 맞추고 높이는 640px 에서 멈춘다. 관리자 목록에서 고르면 저장 전에 미리보기가 바뀌고,
  미리보기는 위치 설정 응답의 구좌 틀(`content`)로 같은 상자를 그린다. 표시 폭을 빼고 저장하면 지금 값을 유지한다.

