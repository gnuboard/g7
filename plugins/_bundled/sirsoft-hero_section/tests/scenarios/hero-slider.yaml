effects:
  - accessible_carousel_semantics
  - responsive_image_switch
  - preview_survives_multilingual_fields
  - device_layout_follows_engine_width
  - slider_controls_follow_banner_count   # 배너 0장은 아무것도 그리지 않고, 1장은 화살표·점·자동 넘김·무한 반복을 끄고, 2장 이상만 켠다. 배너 목록이 바뀌면 첫 장으로 돌아간다
  - banner_text_follows_display_settings   # 문구 표시 여부·색·정렬 설정이 그대로 그려진다
  - banner_link_follows_link_settings   # 버튼 문구가 있으면 버튼만, 없으면 슬라이드 전체가 링크다. 새 창은 rel=noopener noreferrer, 사이트 안 주소는 마운트 접두사를 붙인다
  - autoplay_follows_interval_and_visitor   # 자동 넘김은 설정 간격을 따르고 마우스·포커스·일시정지 단추·움직임 줄이기에 멈추며, 포인터 클릭은 넘김을 붙잡지 않는다
  - transition_effect_follows_setting   # 전환 효과 설정이 Swiper effect·speed 로 옮겨지고 모르는 값은 slide 다
  - slider_navigation_controls_operable   # 이전·다음 단추, 좌우 화살표 키, 점 단추로 장을 넘긴다
  - preview_slider_moves_without_swiper   # iframe 미리보기에서는 Swiper 없이 화살표·점이 장을 옮긴다
  - slide_images_load_by_priority   # 첫 장 이미지는 즉시·높은 우선순위, 다음 장은 전환 전에 미리, 나머지는 지연으로 받는다
  - loading_skeleton_reserves_slot   # 받는 중에는 같은 비율의 스켈레톤으로 자리를 잡고, 직전 방문의 모양(0건·화면 전체)과 표시 폭 힌트를 따른다

