feature: HeroSlider 사용자 슬라이더 컴포넌트

description: |
  플러그인 소유 컴포넌트 `sirsoft-hero_section.HeroSlider` 의 렌더·동작 계약(Vitest, jsdom).
  배너 0개면 아무것도 그리지 않고, 1개면 컨트롤·자동 재생이 없다. PC/모바일 이미지는 picture 로 전환하고,
  버튼 문구가 있으면 버튼만, 없으면 슬라이드 전체가 링크다(새 창이면 rel="noopener noreferrer"). 전체 링크는 슬라이드를 덮는 빈 링크이고
  문구는 그 위 형제라 문구를 눌러도 링크로 간다.
  첫 슬라이드 이미지는 즉시, 나머지는 지연 로딩하고, width·height·aspect-ratio 로 화면 밀림을 막는다. 자동 재생은 마우스·포커스·일시정지 단추·
  reduced-motion 에서 멈춘다. 관리자 미리보기(HeroBannerPreview)는 같은 렌더 함수를 쓴다.
  넘김은 Swiper(무한 반복·손가락 넘기기, PC 마우스 끌기 끔)가 맡는다 — 단위 시험은 Swiper 대역으로 옵션·호출·장 번호 동기만 보고,
  실제 넘김·자동 재생·쓸기는 e2e-flows.yaml 의 slider_* 흐름이 실브라우저에서 본다. 자동으로 넘어가는 동안 장 번호는 읽지 않는다.

