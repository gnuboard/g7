feature: 히어로섹션 관리자 운영 안내 (등록 동선·저장 잠김 이유·버튼과 링크 안내·목록 제작 상태·빈 상태 구분)

description: |
  배너 담당자가 화면만 보고 다음 할 일을 알 수 있게 한다. 등록·수정은 사진을 먼저 올리고(이미지 → 이미지 표시 → 문구),
  좁은 화면에서는 미리보기가 입력 위에 온다. 저장 단추가 잠기면 그 옆에 이유(올리는 중 / PC 이미지 없음)를 보이고,
  버튼 문구만 있고 주소가 없으면 사이트에 버튼이 안 보인다고 알린다. 목록은 행마다 제작 상태(제목이 빈 사이트 언어 ·
  모바일 이미지 없음 · 버튼 문구만 있고 주소 없음)를 보이고, 그 위치 자리가 있는 사이트 주소로 「사이트에서 보기」를,
  활성 사용자 템플릿에 자리가 없으면 안내를 보인다. 비어 있는 상황은 위치에 배너 없음(첫 등록 카드) · 조건 결과 없음 ·
  지금 노출 없음(예약·비노출·종료 건수)으로 나눈다. 사이트 주소는 위치 설정 응답의 구좌 틀이 활성 사용자 템플릿 라우트에서 찾는다.

