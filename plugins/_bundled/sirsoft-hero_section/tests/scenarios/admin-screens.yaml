feature: 히어로섹션 관리자 화면 레이아웃 계약 (목록·순서 변경 창·등록/수정·플러그인 설정)

description: |
  `.g7.html` 을 구운 짝 JSON 을 createLayoutTest 로 렌더해 화면 계약을 잠근다.
  #757 규칙(선택칸 이름·이동은 링크·받는 중 빈 문구 숨김·행 이름)과 abilities 기반 단추 노출,
  위치 탭이 바뀌면 선택이 비워지는지(다른 위치 배너가 일괄 처리에 섞이지 않게), 순서 변경 창,
  폼 초기화가 한 번만 일어나는지(재조회로 변경 표시가 되살아나는 회귀 방지)를 본다.

