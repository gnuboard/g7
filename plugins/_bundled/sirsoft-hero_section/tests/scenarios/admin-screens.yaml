    - banner_list   # 화면이 내놓는 정렬 옵션과 서버 게이트 허용 집합의 대조(PHPUnit)

effects:
  - modal_buttons_in_fixed_footer
  - list_image_uses_width_fit_thumbnail
  - accessible_names_present
  - navigation_uses_links
  - abilities_gate_actions
  - preview_survives_multilingual_fields
  - languages_named_like_tabs
  - preview_error_stays_in_preview
  - banner_form_initializes_from_entry   # 등록 진입은 기본값·쿼리 위치·새 임시 키로, 수정 진입은 원본을 한 번만 심는다
  - banner_period_sent_only_when_scheduled   # 시작·종료 입력은 기간 지정일 때만 보이고 저장 본문에 실린다
  - multilingual_fields_follow_active_locales   # 다국어 칸은 사이트 활성 언어 탭으로 입력하고 제목만 필수다
  - banner_images_apply_on_save   # 이미지 업로드는 임시 키로만 보내고, 업로드가 끝나기 전에는 저장이 잠기며, 저장 요청의 이미지 ID 로 반영된다
  - banner_save_sent_once   # 저장을 빠르게 두 번 눌러도 요청은 한 번이다
  - banner_form_preview_renders   # 편집 미리보기가 관리자 템플릿에 있는 컴포넌트로 그려진다
  - link_example_points_to_real_page   # 링크 칸 예시 주소가 번들 사용자 템플릿에 실제로 있는 화면이다
  - upload_limit_matches_server   # 업로더 최대 용량과 안내가 설정과 서버 한도 중 작은 값을 쓴다
  - size_warning_does_not_block_save   # 권장 크기와 다른 이미지는 안내만 보이고 저장을 막지 않는다
  - validation_errors_shown_and_save_flag_cleared   # 422 사유가 칸 아래와 위쪽 요약에 보이고 저장 진행 깃발은 성공·실패 양쪽에서 꺼진다
  - empty_message_matches_load_state   # 표와 미리보기의 빈 문구가 받는 중에는 비고, 조건 0건과 위치 0건과 노출 0건을 구분한다
  - list_filters_go_through_query   # 상태 필터·검색·정렬이 주소 쿼리를 바꿔 서버가 다시 거른다
  - bulk_selection_scoped_to_position   # 일괄 줄은 선택이 있을 때만 개수와 함께 보이고, 위치 탭·필터·정렬이 바뀌면 선택을 비운다
  - slider_settings_saved_per_position   # 슬라이더 설정은 그 위치 주소로 저장되고 성공·실패 양쪽에서 진행 깃발을 끈다
  - reorder_saves_only_changes   # 순서 창은 그 위치 전체를 받아 열고, 순서가 같으면 저장이 잠기며 실패 사유를 창 안에 남긴다
  - sort_options_within_gate   # 레이아웃이 내놓는 정렬 옵션이 전부 서버 게이트의 허용 집합 안에 있다(벗어나면 그 옵션을 고를 때 422)

