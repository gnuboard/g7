feature: 히어로섹션 동적 위치 대상별 슬라이더 설정

description: |
  게시판·카테고리처럼 대상이 있는 위치는 위치 설정이 그 위치의 기본값이고, 대상(게시판·카테고리 등)마다 슬라이더 항목
  (자동 재생·간격·효과·표시 폭·메뉴 겹치기·페이징·기기별 최대 높이)을 따로 정할 수 있다. 해석 순서는 기본값 → 위치 → 대상
  재정의이고, 재정의에 키가 없으면 상속, false·null 은 명시값이다. 항목 하나를 상속으로 되돌리거나 대상 재정의 전체를
  지울 수 있고, 저장·초기화는 그 대상의 공개 캐시만 비운다. 배너 없이 설정만 남은 대상도 관리자 대상 목록에 남는다. 정적 위치·미등록 위치는 대상 설정이 없다(404).

axes:
  surface:
    - target_settings_inherit_by_default
    - target_settings_isolated_per_target
    - target_settings_partial_inherit
    - target_settings_reset
    - target_settings_validation
    - target_settings_permission
    - target_settings_activity_log
    - target_settings_admin_card
    # 배너 없이 대상 설정만 남은 대상(지워진 대상 포함)도 대상 목록에 남아 되돌릴 수 있다
    - target_settings_orphan_listed
    - target_settings_late_response_isolated
    - target_settings_failure_retry
    - promo_video_poster_overlap
    - promo_mobile_capped_text_scroll
    # 휴대폰 프로모션형은 문구 칸 200px 를 먼저 두고 남는 높이에서 그림에 최대 120px(높이의 40% 이내)를 보장한다
    - promo_mobile_media_share
    # 프로모션형이 있는 띠는 PC·태블릿 최소 400px(최대 높이 이하) — 태블릿 3:1 높이(256)에서 문구가 잘리지 않게
    - promo_tablet_min_height

effects:
  - public_output_follows_target_override
  - target_cache_invalidated_only_for_that_target
  - inherited_items_follow_position_change
  - target_draft_preserved_after_late_response
  - target_settings_retry_restores_controls
  - promo_existing_media_and_height_options_work

