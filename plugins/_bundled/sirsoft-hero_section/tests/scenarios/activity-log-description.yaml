feature: 활동 로그 배너 이름 해석 (core.activity_log.filter_description_params)

description: |
  활동 로그에는 배너 id 만 저장하고, 화면에 보일 때 이 플러그인 설명 키만 골라 이름으로 바꾼다.
  기록 시점 제목 스냅샷(다국어면 현재 언어) → 「ID: {id}」 순. 다른 확장의 키와 이미 채워진 이름은 건드리지 않는다.
  목록 한 줄에서 자리를 알아보게 위치 키는 위치 이름으로 바꾸고, 동적 위치면 기록 시점 대상 이름(없으면 대상 키)을 덧붙인다.
  배너 모델이 생기면(1.0.0) 스냅샷이 없을 때 DB 에서 현재 제목을 찾는 단계가 사이에 더해진다.

axes:
  surface:
    - registered_on_core_filter
    - localized_snapshot_current_locale
    - falls_back_to_id
    - ignores_other_extension_keys
    - keeps_already_resolved_title
    - placement_named_in_summary
    - target_setting_names_target   # 「이 대상 설정」 저장·되돌리기 로그가 대상 키 대신 기록 시점 대상 이름
    - device_named_in_summary       # 이미지·영상 교체·삭제 로그가 기기 키(pc·mobile) 대신 기기 이름

effects:
  - banner_title_resolved
  - internal_keys_shown_as_names   # 대상 키·기기 키 같은 내부 키가 목록 한 줄에 그대로 나가지 않음

test_files:
  - plugins/_bundled/sirsoft-hero_section/tests/Unit/Listeners/ActivityLogDescriptionResolverTest.php
