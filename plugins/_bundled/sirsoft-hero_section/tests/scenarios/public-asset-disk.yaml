notes: |
  e2e 의 filesystems 에는 url 을 가진 디스크가 없어 Playwright 신규 spec 은 두지 않았다(후속) — 기존 hero-image-single-fetch·site-media-prefix·media-banner 회귀만 돈다.
  썸네일 302(공개 썸네일 디스크)는 image-thumbnail.yaml 의 hero_image_public_thumbnail_disk_redirects 가 소유한다.
  웹서버 위임(X-Sendfile)의 응답 계약 전체는 코어 FileDelegationResponseTest 가 소유하고, 여기서는 히어로 영상 통로가 그 계약을 타는지만 본다.
