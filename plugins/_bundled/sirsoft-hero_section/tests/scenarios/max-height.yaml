  - plugins/_bundled/sirsoft-hero_section/resources/js/__tests__/components/HeroPreviewFrame.test.tsx
  - plugins/_bundled/sirsoft-hero_section/resources/js/__tests__/layouts/hero_section_banner_list.test.tsx
  - plugins/_bundled/sirsoft-hero_section/resources/js/__tests__/layouts/hero_section_banner_form.test.tsx
