feature: 히어로섹션 기기별 최대 높이

description: |
  위치 설정(위치마다, 동적 위치는 그 위치의 모든 대상에 함께)에서 PC·휴대폰(화면 폭 767px 이하) 최대 높이를 px 로 정한다(160~2000 정수,
  비우면 null). 슬라이더는 비율(1920:640 · 750:1000)대로 그리다가 그 높이에서 멈추고, 넘치는 이미지는 초점 기준으로 위아래를 자른다.
  비운 기기는 종전 그대로(본문 폭은 비율대로, 화면 전체 폭은 640px). 기존 행·처음 저장 전은 비어 있고, 생략하면 지금 값 유지.
  받는 동안 스켈레톤은 첫 로드 힌트(`slot_max_heights`) → 직전 방문 기억 순으로 같은 높이에서 멈춘다. 관리 화면에서 고치면
  저장 전에 미리보기가 따라가고, 범위 밖이면 안내와 함께 저장이 잠긴다.

axes:
  surface:
    - position_settings_max_height
    - slot_max_height_hint_from_position_settings
    - slider_max_height_vars
    - skeleton_max_height_from_hint
    - admin_max_height_setting

effects:
  - preview_follows_max_height_before_save

test_files:
