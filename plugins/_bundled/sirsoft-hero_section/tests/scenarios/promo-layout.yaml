feature: 히어로섹션 배너 구성 — 배경형·프로모션형

description: |
  배너마다 구성을 고른다. 배경형(기본·기존 배너)은 미디어가 띠 전체를 덮고 문구가 그 위에 놓인다. 프로모션형은 바탕색 위에
  문구 칸과 그림 칸을 나눈다(PC 는 문구 가로 위치로 좌우, 휴대폰은 세로 위치로 위아래). 기기별 문구 폭은 비우면 공통 폭,
  제목·설명은 여러 줄, 순차 등장(머리글 0·제목 0.3·설명 0.6초, 각 0.4초)과 그림 등장 효과(0.8초)를 따로 고른다.
  새 키가 없는 옛 배너는 배경형 그대로 읽히고 다시 저장되지 않는다. 구성을 바꿔도 다른 표현값은 남는다.

axes:
  surface:
    - promo_layout_saved
    - promo_layout_legacy_defaults
    - promo_layout_switch_back
    - promo_layout_validation
    - promo_layout_legacy_render
    - promo_layout_render
    - promo_motion
    - promo_multiline
    - promo_layout_form

effects:
  - legacy_banner_not_rewritten
  - other_presentation_kept_on_layout_switch
  - promo_preset_fills_draft_only
  - legacy_banner_renders_unchanged   # 새 키가 없는 옛 배너는 배경형 그대로(미디어 감싸개·프로모션 칸 없이) 그려진다
  - promo_layout_splits_text_and_media   # 프로모션형은 바탕색 위에 문구 칸·그림 칸을 나누고, PC 는 가로 위치로 좌우·휴대폰은 세로 위치로 위아래가 정해진다
  - promo_layout_honors_existing_options   # 프로모션형도 문구 바탕·밝기·정렬·링크·영상 등 기존 옵션을 그대로 쓴다
  - promo_motion_timing_follows_setting   # 순차 등장(줄 간격 0.3초·0.4초)과 그림 등장 효과(0.8초)가 설정대로 실리고 움직임 줄이기면 둘 다 없다
  - promo_device_text_width_falls_back_to_common   # 기기별 문구 폭은 비우면 공통 폭을 쓰고, 미리보기 기기 고정은 그 기기 값을 쓰며, 형식에 맞지 않는 바탕색은 쓰지 않는다
  - multiline_text_rendered_as_plain_text   # 제목·설명의 줄바꿈 입력을 HTML 로 해석하지 않고 글자 그대로 싣는다
  - promo_slider_min_height_remembered_for_skeleton   # 프로모션형이 한 장이라도 있으면 슬라이더에 최소 높이 표식을 달고, 그 자리의 다음 방문 스켈레톤도 같은 높이로 잡는다

