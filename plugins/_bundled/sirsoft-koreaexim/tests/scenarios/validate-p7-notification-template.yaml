feature: 환율 플러그인 알림 템플릿 편집 창 — 코어 모달 계약 정합 (#599 validate P7)

description: |
  환율 플러그인의 알림 템플릿 편집 창은 코어 창과 같은 저장 API 를 쓰면서 코어 계약 변경을 따라가지 못했다 —
  관련 사용자 relation 을 고를 수 없어 422, 역할이 단일 선택이라 서버가 내려 주는 배열 값과 어긋남,
  채널 본문 편집기 선언(template_editor)을 무시하고 늘 위지윅을 띄움. 코어 창의 수신자·본문 블록을 이식한다.

axes:
  case: [named, specific_users_to_role, to_related_user, related_user_to_trigger_user, exclude_trigger_user_carry, other_rows_untouched, empty, undeclared, multiple, none_declared, role, none, rich, picked_role, picked_user, role_chip_remove, user_chip_remove, chips_above_open_dropdown]

