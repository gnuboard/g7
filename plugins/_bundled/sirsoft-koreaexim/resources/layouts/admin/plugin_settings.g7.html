<layout name="plugin_settings" version="1.0.0" extends="_admin_base">
<meta title="$t:sirsoft-koreaexim.title" description="$t:sirsoft-koreaexim.description"/>
<data-source id="settings" label_key="$t:sirsoft-koreaexim.settings_tab" type="api" endpoint="/api/admin/plugins/sirsoft-koreaexim/settings" method="GET" :auto_fetch="true" :auth_required="true" initLocal="form" :refetchOnMount="true"/>
<data-source id="koreaeximStatus" label_key="$t:sirsoft-koreaexim.status" type="api" endpoint="/api/plugins/sirsoft-koreaexim/admin/status" method="GET" :auto_fetch="true" :auth_required="true" :refetchOnMount="true"><error-handling><on-code code="403"><show-error-page target="content"/></on-code></error-handling></data-source>
<data-source id="koreaeximRecentRuns" if="{{(query.tab ?? 'settings') === 'settings'}}" label_key="$t:sirsoft-koreaexim.recent" type="api" endpoint="/api/plugins/sirsoft-koreaexim/admin/runs" method="GET" :auto_fetch="true" :auth_required="true"><params :per_page="5"/><fallback><field name="data"><field name="data" :value="[]"/><field name="pagination"><field name="current_page" :value="1"/><field name="last_page" :value="1"/><field name="total" :value="0"/></field></field></fallback></data-source>
<data-source id="koreaeximRuns" if="{{query.tab === 'history'}}" label_key="$t:sirsoft-koreaexim.history_tab" type="api" endpoint="/api/plugins/sirsoft-koreaexim/admin/runs" method="GET" :auto_fetch="true" :auth_required="true"><params page="{{query.page ?? 1}}" :per_page="20" status="{{query.status}}" trigger="{{query.trigger}}" date_from="{{query.date_from}}" date_to="{{query.date_to}}"/><fallback><field name="data"><field name="data" :value="[]"/><field name="pagination"><field name="current_page" :value="1"/><field name="last_page" :value="1"/><field name="total" :value="0"/></field></field></fallback><error-handling><on-code code="403"><show-error-page target="content"/></on-code></error-handling></data-source>
<data-source id="koreaeximNotificationDefinitions" if="{{(query.tab ?? 'settings') === 'settings'}}" label_key="$t:sirsoft-koreaexim.notifications" type="api" endpoint="/api/admin/notification-definitions?extension_type=plugin&amp;extension_identifier=sirsoft-koreaexim" method="GET" :auto_fetch="true" :auth_required="true"><params template_channel="{{query.notification_channel ?? 'mail'}}"/><fallback><field name="data"><field name="data" :value="[]"/><field name="pagination"><field name="current_page" :value="1"/><field name="last_page" :value="1"/><field name="total" :value="0"/></field></field></fallback></data-source>
<computed name="activeTab">{{query.tab || _global.activeKoreaeximTab || 'settings'}}</computed><computed name="isReadOnly">{{koreaeximStatus?.data?.abilities?.can_manage !== true}}</computed><computed name="isNotificationReadOnly">{{koreaeximNotificationDefinitions?.data?.abilities?.can_update !== true}}</computed>
<permissions><permission>sirsoft-koreaexim.exchange_rate.view</permission></permissions>
<slot name="content"><div data-ref="koreaexim_settings_content" data-key="form" data-track-changes class="admin-page-content-responsive"><page-header data-ref="page_header" title="$t:sirsoft-koreaexim.title" description="$t:sirsoft-koreaexim.description"><button data-ref="koreaexim_back" type="button" class="btn btn-secondary whitespace-nowrap" aria-label="$t:admin.plugins.back_to_list"><on type="click"><navigate path="/admin/plugins"/></on><icon name="arrow-left"/><span>$t:common.back</span></button></page-header>
<tab-navigation data-ref="koreaexim_tab_navigation" activeTabId="{{_computed.activeTab}}" variant="default" class="sticky-tab-nav-responsive"><prop name="tabs"><item id="settings" label="$t:sirsoft-koreaexim.settings_tab"/><item id="history" label="$t:sirsoft-koreaexim.history_tab"/></prop><on type="change" event="onTabChange"><sequence><set-state target="global" activeKoreaeximTab="{{$args[0]}}"/><navigate path="/admin/plugins/sirsoft-koreaexim/settings" :mergeQuery="true" :replace="true"><query tab="{{$args[0]}}"/></navigate></sequence></on></tab-navigation>
<div data-if="{{_computed.isReadOnly}}" role="status" class="alert-info mb-4">$t:sirsoft-koreaexim.read_only</div>
<div data-ref="koreaexim_tab_content" class="tab-content"><include src="partials/plugin_settings/_tab_settings.g7.html"/><include src="partials/plugin_settings/_tab_history.g7.html"/></div>
<div data-if="{{_computed.activeTab === 'settings'}}" class="sticky-footer-buttons"><button type="button" class="btn btn-secondary"><on type="click"><navigate path="/admin/plugins"/></on><span>$t:common.cancel</span></button><button type="button" data-ref="koreaexim_save" disabled="{{_computed.isReadOnly || !_local.hasChanges || _local.isSaving}}" class="btn btn-primary disabled:opacity-50 disabled:cursor-not-allowed"><on type="click"><sequence><set-state target="local" :isSaving="true" :errors="null"/><api-call target="/api/admin/plugins/sirsoft-koreaexim/settings" method="PUT" body="{{_local.form}}" :auth_required="true"><success><set-state target="local" :isSaving="false" :hasChanges="false"/><refetch-data-source dataSourceId="settings"/><refetch-data-source dataSourceId="koreaeximStatus"/><toast type="success" message="$t:sirsoft-koreaexim.saved"/></success><fail><set-state target="local" :isSaving="false" errors="{{error.errors}}"/><toast type="error" message="{{error.message}}"/></fail></api-call></sequence></on><span>$t:common.save</span></button></div></div></slot>
<modal src="partials/plugin_settings/_modal_notification_template_edit.g7.html"/>
<modal src="partials/plugin_settings/_modal_notification_template_preview.g7.html"/>
<modal src="partials/plugin_settings/_modal_notification_definition_reset.g7.html"/>
</layout>
