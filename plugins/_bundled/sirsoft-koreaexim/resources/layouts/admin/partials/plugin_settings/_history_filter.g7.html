<partial description="실행 이력의 기간·결과·계기 필터">
<!-- 이력 필터 — 값은 전부 query 에 실린다(새로고침·뒤로 가기에도 유지). 어느 필터를 바꾸든 1페이지부터 다시 조회하고, 데이터소스 koreaeximRuns 가 쿼리에서 읽는다 -->
<div class="admin-card mb-4">
  <div class="grid-2col-responsive">
    <div>
      <label class="form-label">$t:sirsoft-koreaexim.date_from</label>
      <input aria-label="$t:sirsoft-koreaexim.date_from" type="date" value="{{query.date_from ?? ''}}" max="{{query.date_to ?? ''}}">
        <on type="change">
          <!-- 시작일 변경 — 이력 탭을 유지한 채 date_from 만 바꾸고 1페이지로 돌아간다 -->
          <navigate path="/admin/plugins/sirsoft-koreaexim/settings" :mergeQuery="true"><query tab="history" :page="1" date_from="{{$event.target.value}}"/></navigate>
        </on>
      </input>
    </div>
    <div>
      <label class="form-label">$t:sirsoft-koreaexim.date_to</label>
      <input aria-label="$t:sirsoft-koreaexim.date_to" type="date" value="{{query.date_to ?? ''}}" min="{{query.date_from ?? ''}}">
        <on type="change">
          <!-- 종료일 변경 — 이력 탭을 유지한 채 date_to 만 바꾸고 1페이지로 돌아간다 -->
          <navigate path="/admin/plugins/sirsoft-koreaexim/settings" :mergeQuery="true"><query tab="history" :page="1" date_to="{{$event.target.value}}"/></navigate>
        </on>
      </input>
    </div>
    <div>
      <label class="form-label">$t:sirsoft-koreaexim.result</label>
      <select aria-label="$t:sirsoft-koreaexim.result" value="{{query.status ?? ''}}">
        <options><option value="">$t:sirsoft-koreaexim.all</option><option value="success">$t:sirsoft-koreaexim.RunStatus.success</option><option value="partial">$t:sirsoft-koreaexim.RunStatus.partial</option><option value="no_data">$t:sirsoft-koreaexim.RunStatus.no_data</option><option value="skipped">$t:sirsoft-koreaexim.RunStatus.skipped</option><option value="auth_missing">$t:sirsoft-koreaexim.RunStatus.auth_missing</option><option value="auth_error">$t:sirsoft-koreaexim.RunStatus.auth_error</option><option value="quota_exceeded">$t:sirsoft-koreaexim.RunStatus.quota_exceeded</option><option value="network_error">$t:sirsoft-koreaexim.RunStatus.network_error</option><option value="bad_request">$t:sirsoft-koreaexim.RunStatus.bad_request</option><option value="bad_response">$t:sirsoft-koreaexim.RunStatus.bad_response</option><option value="unsupported_base">$t:sirsoft-koreaexim.RunStatus.unsupported_base</option><option value="dry_run">$t:sirsoft-koreaexim.RunStatus.dry_run</option></options>
        <on type="change">
          <!-- 결과 상태 필터 — RunStatus 코드 하나(빈 값은 전체)로 좁히고 1페이지로 돌아간다 -->
          <navigate path="/admin/plugins/sirsoft-koreaexim/settings" :mergeQuery="true"><query tab="history" :page="1" status="{{$event.target.value}}"/></navigate>
        </on>
      </select>
    </div>
    <div>
      <label class="form-label">$t:sirsoft-koreaexim.trigger</label>
      <select aria-label="$t:sirsoft-koreaexim.trigger" value="{{query.trigger ?? ''}}">
        <options><option value="">$t:sirsoft-koreaexim.all</option><option value="scheduled">$t:sirsoft-koreaexim.RunTrigger.scheduled</option><option value="retry">$t:sirsoft-koreaexim.RunTrigger.retry</option><option value="manual">$t:sirsoft-koreaexim.RunTrigger.manual</option><option value="dry_run">$t:sirsoft-koreaexim.RunTrigger.dry_run</option><option value="currency_changed">$t:sirsoft-koreaexim.RunTrigger.currency_changed</option></options>
        <on type="change">
          <!-- 실행 계기 필터 — 예약·재시도·수동·모의·통화 변경 중 하나로 좁히고 1페이지로 돌아간다 -->
          <navigate path="/admin/plugins/sirsoft-koreaexim/settings" :mergeQuery="true"><query tab="history" :page="1" trigger="{{$event.target.value}}"/></navigate>
        </on>
      </select>
    </div>
  </div>
  <!-- 뒤집힌 기간 안내 — 두 날짜 칸이 서로의 범위를 막아도 직접 입력·공유 주소로 들어올 수 있다. 이 기간이면 데이터소스 koreaeximRuns 가 조회하지 않고 그리드도 비우므로(직전 결과가 남지 않게), 「기록 없음」으로 읽히지 않게 이유를 적는다 -->
  <p data-if="{{!!query.date_from &amp;&amp; !!query.date_to &amp;&amp; query.date_to &lt; query.date_from}}" role="alert" class="form-error mt-2">$t:sirsoft-koreaexim.date_range_invalid</p>
</div>
</partial>
