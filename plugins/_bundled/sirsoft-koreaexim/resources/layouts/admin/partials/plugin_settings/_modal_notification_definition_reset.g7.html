<!-- 쇼핑몰 설정 — 알림 정의 초기화 확인 창. 손으로 고친 알림 설정을 모듈이 제공하는 기본값으로
  되돌린다. 되돌리면 그동안의 수정이 사라지므로 되묻는다. -->
<partial description="환율 실패 알림 기본 정의 복원 확인">
  <modal data-type="composite" data-ref="modal_koreaexim_notification_definition_reset" title="$t:sirsoft-koreaexim.notification_definitions.reset_modal.title" size="sm">
    <p class="koreaexim:text-gray-700 koreaexim:dark:text-gray-300">$t:sirsoft-koreaexim.notification_definitions.reset_modal.confirm_message</p>
    <div class="koreaexim:mt-4 koreaexim:p-3 koreaexim:bg-gray-100 koreaexim:dark:bg-gray-700 koreaexim:rounded-lg">
      <span class="koreaexim-form-sub-label">$t:sirsoft-koreaexim.notification_definitions.reset_modal.target_label</span>
      <span class="koreaexim-text-primary koreaexim:font-medium">{{_global.resetTargetName ?? ''}}</span>
    </div>
    <div class="koreaexim-alert-danger">
      <p class="koreaexim-text-error-soft">$t:sirsoft-koreaexim.notification_definitions.reset_modal.warning_message</p>
    </div>
    <div class="koreaexim-modal-footer-buttons">
      <button type="button" class="koreaexim:px-4 koreaexim:py-2 koreaexim:bg-white koreaexim:dark:bg-gray-800 koreaexim:text-gray-700 koreaexim:dark:text-gray-300 koreaexim:border koreaexim:border-gray-300 koreaexim:dark:border-gray-600 koreaexim:rounded-lg koreaexim:hover:bg-gray-50 koreaexim:dark:hover:bg-gray-700 koreaexim:disabled:opacity-50 koreaexim:disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <close-modal target="modal_koreaexim_notification_definition_reset"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="koreaexim-flex-center koreaexim:gap-2 koreaexim:px-4 koreaexim:py-2 koreaexim:bg-orange-700 koreaexim:dark:bg-orange-700 koreaexim:text-white koreaexim:dark:text-white koreaexim:rounded-lg koreaexim:hover:bg-orange-800 koreaexim:disabled:opacity-50 koreaexim:disabled:cursor-not-allowed" disabled="{{_global.isResettingNotification}}">
        <on type="click">
          <!-- 초기화. 성공하면 알림 목록을 다시 불러 되돌아간 값을 보여 준다. -->
          <sequence>
            <set-state target="global" :isResettingNotification="true"/>
            <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.resetTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :isResettingNotification="false" :resetTargetId="null" resetTargetName=""/>
                <refetch-data-source dataSourceId="koreaeximNotificationDefinitions"/>
                <toast type="success" message="$t:sirsoft-koreaexim.notification_definitions.reset_success"/>
                <close-modal target="modal_koreaexim_notification_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :isResettingNotification="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-koreaexim.notification_definitions.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.isResettingNotification}}" name="spinner" class="koreaexim-spinner-sm"/>
        <span>{{_global.isResettingNotification ? '$t:sirsoft-koreaexim.notification_definitions.reset_modal.btn_confirming' : '$t:sirsoft-koreaexim.notification_definitions.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
