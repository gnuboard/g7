<!-- 쇼핑몰 설정 — 알림 템플릿 미리보기 창. 편집 창이 만들어 둔 결과를 보여 주기만 하고
  입력이 없다 — 그래서 이 조각에는 액션이 하나도 없다. -->
<partial description="환율 실패 알림 치환 결과 미리보기">
  <modal data-type="composite" data-ref="modal_koreaexim_notification_definition_preview" title="$t:sirsoft-koreaexim.notification_definitions.preview_modal.title" size="lg">
    <div data-ref="koreaexim_preview_content">
      <div>
        <label class="koreaexim-form-label">$t:sirsoft-koreaexim.notification_definitions.preview_modal.rendered_subject</label>
        <p class="koreaexim-text-primary koreaexim:text-sm koreaexim:bg-gray-50 koreaexim:dark:bg-gray-900 koreaexim:rounded-md koreaexim:p-3 koreaexim:border koreaexim:border-gray-200 koreaexim:dark:border-gray-700">{{_global.koreaexim_notification_template_form_modal?.preview?.subject ?? ''}}</p>
      </div>
      <div>
        <label class="koreaexim-form-label">$t:sirsoft-koreaexim.notification_definitions.preview_modal.rendered_body</label>
        <html-content data-type="composite" content="{{_global.koreaexim_notification_template_form_modal?.preview?.body ?? ''}}" :isHtml="true" class="koreaexim:text-sm koreaexim:max-w-none koreaexim:bg-white koreaexim:dark:bg-gray-900 koreaexim:rounded-md koreaexim:p-4 koreaexim:border koreaexim:border-gray-200 koreaexim:dark:border-gray-700 koreaexim:max-h-[400px] koreaexim:overflow-y-auto"/>
      </div>
      <div class="koreaexim:flex koreaexim:justify-end koreaexim:border-t koreaexim:border-gray-200 koreaexim:dark:border-gray-700">
        <button data-ref="koreaexim_btn_close_preview" type="button" class="koreaexim-text-body koreaexim:px-4 koreaexim:py-2 koreaexim:rounded-md koreaexim:border koreaexim:border-gray-300 koreaexim:dark:border-gray-600 koreaexim:hover:bg-gray-50 koreaexim:dark:hover:bg-gray-700 koreaexim:transition-colors">
          <on type="click">
            <close-modal target="modal_koreaexim_notification_definition_preview"/>
          </on>
          $t:sirsoft-koreaexim.notification_definitions.preview_modal.btn_close
        </button>
      </div>
    </div>
  </modal>
</partial>
