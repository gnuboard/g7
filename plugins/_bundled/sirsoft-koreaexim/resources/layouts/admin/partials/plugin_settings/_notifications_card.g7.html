<partial description="환율 실패 알림 채널 선택과 활성화">
<div class="admin-card mb-4"><h3 class="card-title">$t:sirsoft-koreaexim.notifications</h3><select value="{{query.notification_channel ?? 'mail'}}" aria-label="$t:sirsoft-koreaexim.notifications"><options><option value="mail">$t:sirsoft-koreaexim.channels.mail</option><option value="database">$t:sirsoft-koreaexim.channels.database</option></options><on type="change"><navigate path="/admin/plugins/sirsoft-koreaexim/settings" :mergeQuery="true"><query notification_channel="{{$event.target.value}}"/></navigate></on></select><div data-each="def in {{koreaeximNotificationDefinitions?.data?.data ?? []}}"><p>{{$localized(def.name)}}</p><div data-each="template in {{def.templates ?? []}}" class="flex flex-wrap items-center gap-3 my-3"><span>{{$t('sirsoft-koreaexim.channels.' + template.channel)}}</span><toggle label="{{$localized(def.name) + ' / ' + $t('sirsoft-koreaexim.channels.' + template.channel)}}" checked="{{template.is_active}}" disabled="{{_computed.isNotificationReadOnly}}"><on type="change"><api-call target="/api/admin/notification-templates/{{template.id}}/toggle-active" method="PATCH" :auth_required="true"><success><refetch-data-source dataSourceId="koreaeximNotificationDefinitions"/></success><fail><toast type="error" message="{{error.message}}"/></fail></api-call></on></toggle><button type="button" class="btn btn-secondary" disabled="{{_computed.isNotificationReadOnly}}"><on type="click"><sequence><set-state target="global"><field name="koreaexim_notification_template_form_modal"><field name="template" value="{{JSON.parse(JSON.stringify(template))}}"/><field name="definition" value="{{def}}"/><field name="recipients" value="{{JSON.parse(JSON.stringify(template.recipients ?? []))}}"/><field name="editLang" value="{{$locale}}"/><field name="errors" :value="null"/><field name="isSaving" :value="false"/><field name="roleSearchResults" :value="[]"/><field name="userSearchResults" :value="[]"/></field></set-state><open-modal target="modal_koreaexim_notification_template_edit"/></sequence></on><span>$t:sirsoft-koreaexim.edit_template</span></button></div><button type="button" class="btn btn-secondary" disabled="{{_computed.isNotificationReadOnly}}"><on type="click"><sequence><set-state target="global" resetTargetId="{{def.id}}" resetTargetName="{{$localized(def.name)}}"/><open-modal target="modal_koreaexim_notification_definition_reset"/></sequence></on><span>$t:sirsoft-koreaexim.reset</span></button></div></div>
</partial>
