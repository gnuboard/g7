<!-- e2e:allow Playwright 스펙 없음(이 플러그인 tests/Playwright/specs/sso-*.spec.ts 는 로그인 흐름만 덮는다) — 브라우저 실측은 F1 Chrome MCP 계획서 §10 M10·M14(W40) — P4 는 Vitest 로 덮음
     SSO 연동 설정 — 탭 「IdP」(목록 → 같은 화면 편집 보기, ?idp={id} 로 새로고침 유지), 「정책」(강제, 비상 계정, 자동 이동, 세션 상한), 「보존」(이력 보존일, 알림 기준).
     정책과 IdP 설정은 코어 플러그인 설정 API 가 아니라 플러그인 API(admin/idps, admin/policy)로 읽고 쓴다(W38) — 코어 설정 「저장」 버튼은 두지 않는다.
     최고관리자 전용 칸(사이트 전체 강제, 역할 강제, 비상 계정, 관리자 역할 매핑)은 응답의 abilities.is_super 로 잠근다(서버가 403 으로도 막는다).
     파일명이 계약이다 — `plugin_settings` 라야 코어 「플러그인 관리 → 설정」(/admin/plugins/sirsoft-sso/settings)이 띄운다. -->
<layout name="plugin_settings" version="1.0.0" extends="_admin_base">
  <meta title="$t:sirsoft-sso.admin.settings.title" description="$t:sirsoft-sso.admin.settings.description"/>
  <!-- IdP 목록과 추가할 수 있는 프로토콜 — 추가, 수정, 삭제 뒤 다시 받는다 -->
  <data-source id="ssoIdps" label_key="$t:sirsoft-sso.editor.data_source.admin_idps" type="api" endpoint="/api/plugins/sirsoft-sso/admin/idps" method="GET" :auto_fetch="true" :auth_required="true" :refetchOnMount="true">
    <error-handling>
      <on-code code="403">
        <show-error-page target="content"/>
      </on-code>
    </error-handling>
  </data-source>
  <!-- 편집 중인 IdP — 주소의 idp 가 있을 때만 받는다. 받은 값은 편집 칸(_local.idpForm)의 초기값이다(비밀값은 가린 값으로 온다) -->
  <data-source id="ssoIdp" label_key="$t:sirsoft-sso.editor.data_source.admin_idp" type="api" endpoint="/api/plugins/sirsoft-sso/admin/idps/{{query.idp}}" method="GET" :auto_fetch="true" :auth_required="true" if="{{!!query.idp}}" initLocal="idpForm" :refetchOnMount="true">
    <error-handling>
      <default>
        <!-- 받기 실패 — 빈 편집 칸이 저장되지 않게 본문 오류 화면 -->
        <show-error-page errorCode="{{error.status}}" target="content"/>
      </default>
    </error-handling>
  </data-source>
  <!-- 사이트 정책 — 정책, 보존 탭의 편집 칸(_local.policyForm)이 함께 쓴다 -->
  <data-source id="ssoPolicy" label_key="$t:sirsoft-sso.editor.data_source.admin_policy" type="api" endpoint="/api/plugins/sirsoft-sso/admin/policy" method="GET" :auto_fetch="true" :auth_required="true" initLocal="policyForm" :refetchOnMount="true">
    <error-handling>
      <default>
        <!-- 받기 실패 — 기본값 정책이 저장되지 않게 본문 오류 화면 -->
        <show-error-page errorCode="{{error.status}}" target="content"/>
      </default>
    </error-handling>
  </data-source>
  <computed name="canUpdate">{{ssoIdps?.data?.abilities?.can_update === true}}</computed>
  <computed name="isSuper">{{ssoIdps?.data?.abilities?.is_super === true}}</computed>
  <computed name="activeTab">{{query.idp ? 'idps' : (query.tab || 'idps')}}</computed>
  <init-local>
    <field name="idpTab" value="basic"/>
    <field name="idpErrors" :value="null"/>
    <field name="isSavingIdp" :value="false"/>
    <field name="testResult" :value="null"/>
    <field name="scimToken" :value="null"/>
    <field name="ldapTestId" value=""/>
    <field name="ldapTestPw" value=""/>
    <field name="showAddIdp" :value="false"/>
    <field name="newIdp">
      <field name="protocol" value="oidc"/>
      <field name="key" value=""/>
      <field name="label" :value="{}"/>
    </field>
    <field name="newIdpErrors" :value="null"/>
    <field name="policyErrors" :value="null"/>
    <field name="isSavingPolicy" :value="false"/>
    <field name="policyImpact" :value="null"/>
    <field name="emergencySearch" value=""/>
    <field name="emergencyCandidates" :value="[]"/>
  </init-local>
  <permissions>
    <permission>sirsoft-sso.settings.view</permission>
    <permission>core.plugins.read</permission>
  </permissions>
  <!-- IdP 저장 — 편집 칸 전체를 보낸다(서버는 저장 칸만 고른다). 비밀값은 가린 값이면 유지된다 -->
  <action name="saveIdp">
    <sequence>
      <set-state target="local" :isSavingIdp="true" :idpErrors="null"/>
      <api-call :auth_required="true" target="/api/plugins/sirsoft-sso/admin/idps/{{query.idp}}" method="PUT" body="{{_local.idpForm}}">
        <success>
          <set-state target="local" :isSavingIdp="false" idpForm="{{response.data}}"/>
          <toast type="success" message="$t:sirsoft-sso.admin.settings.idp.saved"/>
          <refetch-data-source dataSourceId="ssoIdps"/>
        </success>
        <fail>
          <set-state target="local" :isSavingIdp="false" idpErrors="{{error.errors?.fields ?? error.errors}}"/>
          <toast type="error" message="{{error.message ?? '$t:sirsoft-sso.admin.settings.save_failed'}}"/>
        </fail>
      </api-call>
    </sequence>
  </action>
  <!-- 정책 저장 — 정책, 보존 탭이 함께 쓴다. 새로 강제 대상이 된 회원의 비밀번호 로그인 토큰이 회수되면 그 수를 알린다(W34) -->
  <action name="savePolicy">
    <sequence>
      <set-state target="local" :isSavingPolicy="true" :policyErrors="null"/>
      <api-call :auth_required="true" target="/api/plugins/sirsoft-sso/admin/policy" method="PUT" body="{{_local.policyForm?.policy ?? {}}}">
        <success>
          <set-state target="local" :isSavingPolicy="false" :policyImpact="null" policyForm="{{response.data}}"/>
          <toast type="success" message="$t:sirsoft-sso.admin.settings.policy.saved|revoked={{response.data?.revoked_tokens ?? 0}}"/>
        </success>
        <fail>
          <set-state target="local" :isSavingPolicy="false" policyErrors="{{error.errors}}"/>
          <toast type="error" message="{{error.message ?? '$t:sirsoft-sso.admin.settings.save_failed'}}"/>
        </fail>
      </api-call>
    </sequence>
  </action>
  <slot name="content">
    <div data-ref="sso_settings_content" class="sso:p-4 sso:min-h-screen sso:bg-gray-50 sso:dark:bg-gray-900">
      <responsive on="640-1023" class="sso:p-6 sso:min-h-screen sso:bg-gray-50 sso:dark:bg-gray-900"/>
      <responsive on="1024-" class="sso:p-8 sso:min-h-screen sso:bg-gray-50 sso:dark:bg-gray-900"/>
      <page-header data-type="composite" data-ref="page_header" title="$t:sirsoft-sso.admin.settings.title" description="$t:sirsoft-sso.admin.settings.description" backPath="/admin/plugins" backLabel="$t:admin.plugins.back_to_list"/>
      <div data-ref="sso_read_only_banner" data-if="{{!_computed.canUpdate &amp;&amp; !!ssoIdps?.data}}" role="status" class="sso-alert-warning sso:mt-4">
        <icon name="lock" class="sso:text-xl sso:text-amber-600 sso:dark:text-amber-400 sso:flex-shrink-0"/>
        <span class="sso:text-sm sso:text-amber-800 sso:dark:text-amber-200">$t:sirsoft-sso.admin.settings.read_only</span>
      </div>
      <tab-navigation data-type="composite" data-ref="settings_tabs" class="sso:mt-6" activeTabId="{{_computed.activeTab}}" variant="underline">
        <prop name="tabs">
          <item id="idps" label="$t:sirsoft-sso.admin.settings.tabs.idps"/>
          <item id="policy" label="$t:sirsoft-sso.admin.settings.tabs.policy"/>
          <item id="retention" label="$t:sirsoft-sso.admin.settings.tabs.retention"/>
        </prop>
        <on type="change" event="onTabChange">
          <!-- 탭 전환은 주소의 tab 만 바꾼다(편집 중인 idp 는 빠진다) — 새로고침, 뒤로 가기에도 같은 탭이 열린다 -->
          <navigate path="/admin/plugins/sirsoft-sso/settings">
            <query tab="{{$args[0]}}"/>
          </navigate>
        </on>
      </tab-navigation>
      <include src="partials/plugin_settings/_idp_list.g7.html"/>
      <include src="partials/plugin_settings/_idp_edit.g7.html"/>
      <include src="partials/plugin_settings/_policy_tab.g7.html"/>
      <include src="partials/plugin_settings/_retention_tab.g7.html"/>
    </div>
  </slot>
</layout>
