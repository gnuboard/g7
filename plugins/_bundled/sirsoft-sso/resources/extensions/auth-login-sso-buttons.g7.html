<!-- E2E: tests/Playwright/specs/sso-oidc-mock.spec.ts·sso-saml-mock.spec.ts 가 이 버튼(`sso_login_button_{키}`)으로 회사 계정 로그인을 시작한다. 화면 폭·다크(§10 M14)는 F1 Chrome MCP 실측, 구운 JSON 계약은 Vitest
     로그인 화면에 「회사 계정으로 로그인」 묶음을 붙이는 조각 — 소셜 로그인 버튼(priority 100)보다 위(priority 10)에 놓인다.
     버튼은 이 사이트의 플러그인 시작 경로로 전체 페이지 이동을 한다(IdP 로 가는 302 는 서버가 만든다). 로그인 뒤 돌아갈 주소(query.redirect)는
     공개 IdP 목록 요청에 실어 서버가 같은 출처 경로만 남긴 시작 주소를 받는다. 켜진 IdP 가 없으면 묶음째 그리지 않는다. -->
<extension extension-point="auth_login_extensions" mode="prepend" priority="10">
  <div data-ref="sso_login_buttons_section" data-if="{{(ssoPublicIdps?.data ?? []).length > 0}}" class="sso:mt-6">
    <div class="sso:flex sso:items-center sso:gap-3 sso:mb-4">
      <div class="sso:flex-1 sso:h-px sso:bg-gray-200 sso:dark:bg-gray-700"/>
      <span class="sso:text-xs sso:text-gray-500 sso:dark:text-gray-400">$t:sirsoft-sso.buttons.company_account</span>
      <div class="sso:flex-1 sso:h-px sso:bg-gray-200 sso:dark:bg-gray-700"/>
    </div>
    <div data-ref="sso_login_buttons" class="sso:flex sso:flex-col sso:gap-2">
      <button data-each="idp in ssoPublicIdps?.data ?? []" data-key="{{idp.key}}" data-ref="sso_login_button_{{idp.key}}" type="button" class="sso:w-full sso:inline-flex sso:items-center sso:justify-center sso:gap-3 sso:px-4 sso:py-3 sso:sm:py-2 sso:text-sm sso:font-medium sso:rounded-lg sso:border sso:cursor-pointer {{idp.button_style?.bg ? '' : 'sso:bg-white sso:dark:bg-gray-800 sso:text-gray-900 sso:dark:text-white sso:border-gray-300 sso:dark:border-gray-600 sso:hover:bg-gray-50 sso:dark:hover:bg-gray-700'}}" style="{{idp.button_style?.bg ? 'background-color:' + idp.button_style.bg + ';color:' + (idp.button_style.fg ?? '#ffffff') + ';border-color:' + (idp.button_style.border ?? idp.button_style.bg) : ''}}" aria-label="$t:sirsoft-sso.buttons.login_with|idp={{idp.label}}">
        <on type="click">
          <!-- 회사 계정 왕복 시작 — 이 플러그인의 같은 출처 시작 경로로만 이동한다 -->
          <action handler="sirsoft-sso.startLogin" url="{{idp.start_url}}"/>
        </on>
        <span aria-hidden="true" class="sso:inline-flex sso:items-center sso:justify-center sso:w-6 sso:h-6 sso:rounded-full sso:ring-1 sso:ring-current sso:text-xs sso:font-semibold">{{idp.initial}}</span>
        <span>$t:sirsoft-sso.buttons.login_with|idp={{idp.label}}</span>
      </button>
    </div>
  </div>
  <!-- 켜진 IdP 목록 — 비로그인으로 읽는다(키, 이름, 버튼 색, 시작 주소만) -->
  <data-source id="ssoPublicIdps" label_key="$t:sirsoft-sso.editor.data_source.public_idps" type="api" endpoint="/api/plugins/sirsoft-sso/idps" method="GET" :auto_fetch="true" auth_mode="optional">
    <params guard="user" redirect="{{typeof query.redirect === 'string' ? query.redirect : ''}}"/>
    <fallback>
      <field name="data" :value="[]"/>
    </fallback>
    <error-handling>
      <on-code code="default">
        <!-- 다른 확장의 화면에 붙는 덧붙임이다 — 목록을 못 받으면 버튼만 그리지 않는다(fallback 빈 목록) -->
        <suppress/>
      </on-code>
    </error-handling>
  </data-source>
</extension>
