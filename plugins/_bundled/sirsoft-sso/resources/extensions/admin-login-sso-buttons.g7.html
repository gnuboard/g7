<!-- E2E: tests/Playwright/specs/sso-enforcement.spec.ts 가 이 버튼(`sso_admin_login_button_{키}`)으로 관리자 회사 계정 로그인을 시작한다. 화면 폭·다크(§10 M14)는 F1 Chrome MCP 실측, 구운 JSON 계약은 Vitest
     관리자 로그인 화면(admin_login_extensions)에 「회사 계정으로 로그인」 버튼 — 사용자 화면과 같은 버튼을 관리자 경로(guard=admin)로 연다.
     돌아오면 코어가 인계 코드를 관리자 로그인 응답 분기(applyAdminLoginResult)로 넘긴다. 켜진 IdP 가 없으면 그리지 않는다. -->
<extension extension-point="admin_login_extensions" mode="prepend" priority="10">
  <div data-ref="sso_admin_login_buttons_section" data-if="{{(ssoAdminPublicIdps?.data ?? []).length > 0}}" class="sso:mt-6">
    <div class="sso:flex sso:items-center sso:gap-3 sso:mb-4">
      <div class="sso:flex-1 sso:h-px sso:bg-gray-200 sso:dark:bg-gray-700"/>
      <span class="sso:text-xs sso-text-muted">$t:sirsoft-sso.buttons.company_account</span>
      <div class="sso:flex-1 sso:h-px sso:bg-gray-200 sso:dark:bg-gray-700"/>
    </div>
    <div data-ref="sso_admin_login_buttons" class="sso:flex sso:flex-col sso:gap-2">
      <button data-each="idp in ssoAdminPublicIdps?.data ?? []" data-key="{{idp.key}}" data-ref="sso_admin_login_button_{{idp.key}}" type="button" class="sso:w-full sso:inline-flex sso:items-center sso:justify-center sso:gap-3 sso:px-4 sso:py-3 sso:text-sm sso:font-medium sso:rounded-lg sso:border sso:cursor-pointer {{idp.button_style?.bg ? '' : 'sso:bg-white sso:dark:bg-gray-800 sso:text-gray-900 sso:dark:text-white sso:border-gray-300 sso:dark:border-gray-600 sso:hover:bg-gray-50 sso:dark:hover:bg-gray-700'}}" style="{{idp.button_style?.bg ? 'background-color:' + idp.button_style.bg + ';color:' + (idp.button_style.fg ?? '#ffffff') + ';border-color:' + (idp.button_style.border ?? idp.button_style.bg) : ''}}" aria-label="$t:sirsoft-sso.buttons.login_with|idp={{idp.label}}">
        <responsive on="640-" class="sso:w-full sso:inline-flex sso:items-center sso:justify-center sso:gap-3 sso:px-4 sso:py-2 sso:text-sm sso:font-medium sso:rounded-lg sso:border sso:cursor-pointer {{idp.button_style?.bg ? '' : 'sso:bg-white sso:dark:bg-gray-800 sso:text-gray-900 sso:dark:text-white sso:border-gray-300 sso:dark:border-gray-600 sso:hover:bg-gray-50 sso:dark:hover:bg-gray-700'}}"/>
        <on type="click">
          <!-- 관리자 경로 왕복 시작 — 시작 주소에 guard=admin 이 실려 있다 -->
          <action handler="sirsoft-sso.startLogin" url="{{idp.start_url}}"/>
        </on>
        <span aria-hidden="true" class="sso:inline-flex sso:items-center sso:justify-center sso:w-6 sso:h-6 sso:rounded-full sso:ring-1 sso:ring-current sso:text-xs sso:font-semibold">{{idp.initial}}</span>
        <span>$t:sirsoft-sso.buttons.login_with|idp={{idp.label}}</span>
      </button>
    </div>
  </div>
  <!-- 관리자 경로(guard=admin)로 켜진 IdP 목록 — 비로그인으로 읽는다. 빈 배열이면 회사 계정 줄 전체를 숨긴다 -->
  <data-source id="ssoAdminPublicIdps" label_key="$t:sirsoft-sso.editor.data_source.public_idps" type="api" endpoint="/api/plugins/sirsoft-sso/idps" method="GET" :auto_fetch="true" auth_mode="optional">
    <params guard="admin" redirect="{{typeof query.redirect === 'string' ? query.redirect : ''}}"/>
    <fallback>
      <field name="data" :value="[]"/>
    </fallback>
    <error-handling>
      <on-code code="default">
        <!-- 관리자 로그인 화면 덧붙임 — 목록을 못 받으면 버튼만 그리지 않는다 -->
        <suppress/>
      </on-code>
    </error-handling>
  </data-source>
</extension>
