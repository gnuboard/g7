<!-- 관리자 회원 목록에 「부서」, 「직급」 열을 얹는다(A1 A6t 실측 — 확장점 신설 없이 inject_props `_append`). 표(users_data_grid) 열 끝과
  툴바 열 선택기(column_selector) 선택지 끝에 둘 다 덧붙이고, 열 선택기의 기본 열에는 넣지 않아 처음에는 숨어 있다(선택기가 관리자별로 보이는 열을
  브라우저에 저장하므로 기본 열에 더해도 이미 저장한 관리자에게는 켜지지 않는다 — 소셜 연결 열과 같은 선택).
  셀 값 `row.sso_department`, `row.sso_title` 은 코어 목록 일괄 필터에서 `MemberListSsoListener` 가 페이지당 한 번의 조회로 채운다(권한이 없으면 키가 없고
  셀은 `-`). 주입 props 의 `<append>` 안은 항목 리스트라 열 정의를 `<item>`·`<field>` 트리로 적는다. -->
<extension target-layout="admin_user_list" priority="220">
  <inject target-id="users_data_grid" position="inject_props">
    <props>
      <prop name="columns">
        <append>
          <item>
            <field name="field" value="sso_department"/>
            <field name="header" value="$t:sirsoft-sso.admin.user_list.department"/>
            <field name="sortable" :value="false"/>
            <field name="cellChildren">
              <item>
                <field name="type" value="basic"/>
                <field name="name" value="Span"/>
                <field name="props">
                  <field name="className" value="text-sm text-gray-700 dark:text-gray-300"/>
                </field>
                <field name="text" value="{{row.sso_department ?? '-'}}"/>
              </item>
            </field>
          </item>
          <item>
            <field name="field" value="sso_title"/>
            <field name="header" value="$t:sirsoft-sso.admin.user_list.title"/>
            <field name="sortable" :value="false"/>
            <field name="cellChildren">
              <item>
                <field name="type" value="basic"/>
                <field name="name" value="Span"/>
                <field name="props">
                  <field name="className" value="text-sm text-gray-700 dark:text-gray-300"/>
                </field>
                <field name="text" value="{{row.sso_title ?? '-'}}"/>
              </item>
            </field>
          </item>
        </append>
      </prop>
    </props>
  </inject>
  <inject target-id="column_selector" position="inject_props">
    <props>
      <prop name="columns">
        <append>
          <item field="sso_department" header="$t:sirsoft-sso.admin.user_list.department"/>
          <item field="sso_title" header="$t:sirsoft-sso.admin.user_list.title"/>
        </append>
      </prop>
    </props>
  </inject>
</extension>
