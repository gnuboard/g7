# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: 강제 꺼짐 + 비상 계정 2단계 요구)이 대부분이라 명목상이다.
feature: sso_policy_enforcement
description: |
  SSO 강제와 비상 계정 — 비밀번호 인증 정책(강제 단위 4 × 1차/2차 × 비상 계정 × purpose 6), 진입 판정, 자동 이동, 셀프 가입 닫기, 2단계 인증 생략, 강제 해제 명령, 정책 저장 검증(W5, 최고관리자 전용 칸), 강제 전환 시 비밀번호 토큰 회수(W34), LDAP 도메인 판정 순서(W27).
axes:
  enforce_site: ["false|true", "true"]
  auto_redirect_idp: ["none|enabled|disabled"]
  guard: ["user|admin", admin, user]
  domain: [owned_oidc, "other|disabled_idp|ldap", ldap_enforced]
  member: ["exists|absent", "newly_enforced|emergency|not_enforced", passwordless_linked, with_password_linked]
  discovery_enabled: ["false"]
  enforcement: ["on", "off|on"]
  login_method: ["password|sso"]
  emergency: ["no", "yes", "yes|no"]
  site_two_factor: ["off"]
  enforce: ["off", domain]
  unit: [domain, role, linked, site, none]
  phase: [identifier, user, "identifier|user"]
  password: ["correct|wrong"]
  link: ["active|inactive|none"]
  purpose: ["login|login_password_change|reset_request|reset_complete|set_password|admin_set_password"]
  allow_local_password: ["false|true", "false"]
  prior_decision: [deny]
  option: ["status|disable|restore", restore]
  backup: [none]
  path: [policy, idp_update]
  token: ["password|sso"]
  enforce_owned_domains: [false→true]
  verifier: [absent, matches]
  enforced: ["no"]
  two_factor_mode: ["always_skip|skip_if_mfa|always"]
  mfa: ["true|false|null"]
  emergency_user_ids: [empty]
  actor: [super, delegate]
  enabled_idps: ["0|1"]
  key: ["enforce_site|enforce_roles|emergency_user_ids|session_max_minutes"]
  value: ["out_of_range|unknown_role|unknown_user"]
