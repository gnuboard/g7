feature: sso_refresh_token_across_pending
description: |
  동의·연결 확인 대기를 거친 첫 OIDC 로그인의 refresh 토큰 보관 — 콜백 때 받은 토큰이 (암호화된) 대기 값을 따라가 완료 요청의 회원 결정 훅에서 저장된다. 대기 정보 응답에는 싣지 않는다. 저장 자체(주기 점검 켬일 때만)는 P3 `SyncOnAccountResolvedListener`.
axes:
  pending: [consent, link]
  deprovision: [periodic]
effects:
  - refresh_token_stored_after_pending
  - refresh_token_not_exposed
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/Flow/RefreshTokenAcrossPendingTest.php
