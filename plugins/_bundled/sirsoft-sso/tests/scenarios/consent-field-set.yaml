feature: sso_consent_field_set

description: |
  첫 로그인 동의 창이 운영자가 환경설정 > 회원에서 정한 가입 항목을 코어 가입 화면과 같게 받는다.
  동의 창이 항목을 그렸으면 받은 정의 버전(fields_version)을 요청에 싣고, 그 요청에만 항목 규칙(필수 포함)이 걸린다.
  버전을 싣지 않는 창은 종전과 같은 본문으로 가입되고 빠진 필수 항목은 첫 로그인 뒤 받는다.
  IdP 가 값을 주는 칸은 창에서 읽기 전용이고 요청이 다른 값을 실어 와도 IdP 값이 저장된다.

coverage_strategy: full

axes:
  fields_version: [absent, current, stale]
  locked: [none, sync_lock]

exclusions:
  - { fields_version: absent, locked: sync_lock, reason: "버전을 싣지 않은 요청은 항목 값을 받지 않으므로 잠금이 판정에 닿지 않는다(생성 뒤 속성 동기화가 IdP 값을 쓴다 — AttributeSyncTest)" }
  - { fields_version: stale, locked: sync_lock, reason: "409 는 규칙을 만들기 전에 정의 버전만 보고 답한다 — 잠금과 무관" }

effects:
  - legacy_body_creates_member_and_defers_required_fields
  - required_field_missing_returns_field_keyed_error
  - consent_pending_survives_validation_error
  - field_values_outside_fixed_keys_are_saved
  - field_set_consent_is_not_deferred
  - idp_values_become_field_defaults
  - idp_managed_field_is_readonly_with_sso_reason
  - field_lookup_from_other_browser_gets_no_values_and_keeps_pending
  - idp_managed_field_input_is_ignored
  - stale_fields_version_returns_409_and_keeps_pending
  - jit_registration_data_filter_contract_unchanged

test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/ConsentFieldSetTest.php
