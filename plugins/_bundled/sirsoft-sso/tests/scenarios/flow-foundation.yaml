# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: 거절된 시작의 콜백 단계)이 대부분이라 명목상이다.
feature: sso_flow_foundation
description: |
  왕복 기반 — 같은 출처 복귀 주소, state 1회용·만료, 브라우저 묶음 쿠키 발급·대조, 시작 티켓(1회용·브라우저·IdP 묶음), 대기 토큰 묶음, 프로토콜 레지스트리(내장·필터·덮어쓰기 무시), 로그인 왕복 시작 거절과 콜백 거절, 공개 IdP 목록.
axes:
  input: [redirect_variants, same_origin_absolute, fallback]
  state: [fresh, expired, "missing|reused", missing, reused]
  pull: [twice]
  bind: ["same|other|missing", same, other, missing]
  ticket: ["same_browser|other_browser|reuse", same_browser, other_browser, reuse, missing, "reused|other_browser|other_idp", reused, other_idp]
  registry: [builtin, "filter_add|filter_override|filter_invalid", filter_add, filter_override, filter_invalid]
  account: [linked]
  guard: [user]
  redirect: ["/mypage"]
  browser: ["first_visit(no_bind_cookie)", other, none]
  idp: ["disabled|unknown|mock_gate_off", disabled, unknown, mock_gate_off]
  intent: [link_without_ticket, "link|reauth|test", link, reauth, test]
  idp_error: [access_denied]
  api: [public_idps]
  mock_gate: ["on|off", on, off]
  pending: [consent, link]
  failure: ["idp_denial|start_refused|state_expired", idp_denial, start_refused, state_expired]
  success: [handoff]
effects:
  - safe_path_only
  - converted_to_path
  - fallback_returned
  - state_single_use
  - redirect_sanitized
  - state_expired
  - bind_compared
  - bind_cookie_issued_once_per_request
  - ticket_single_use
  - ticket_bound
  - oidc_registered
  - third_party_added
  - builtin_kept
  - invalid_ignored
  - handoff_issued
  - context_login_method
  - attempt_recorded
  - hooks_fired
  - last_login_updated
  - bind_cookie_issued
  - state_bound_to_it
  - state_expired_error
  - bind_mismatch_error
  - start_refused
  - error_recorded_on_idp
  - public_fields_only
  - mock_hidden_when_off
  - ticket_required
  - ticket_invalid
  - bind_mismatch
  - token_destroyed
  - victim_password_never_checked
  - login_failed_hook_fired
  - no_hook_on_success
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Unit/Services/SafeRedirectTest.php
  - plugins/_bundled/sirsoft-sso/tests/Unit/Services/StateStoreTest.php
  - plugins/_bundled/sirsoft-sso/tests/Unit/Services/ProtocolRegistryTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Flow/OidcLoginFlowTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Flow/StartTicketTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Flow/PendingBindingTest.php
