# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: IdP-initiated 와 SP 발 로그아웃)이 대부분이라 명목상이다.
feature: sso_ldap_protocol
description: |
  LDAP/Active Directory 드라이버와 코어 외부 자격 증명 검증자 — 인증 순서(빈 비밀번호 거절, 서비스 바인드, 정확히 1건, 재바인드), 필터 이스케이프, AD objectGUID·비활성, 조회, 연결 시험, 코어 로그인 API 연동(자동 생성, 동의 대기 409, 실패 횟수, 잠긴 회원, 관리자 경로), ext-ldap 없음.
coverage_strategy: pairwise
axes:
  directory: [openldap, ad]
  identifier: ["email|username", email, username, "injection(*)(uid=*)", "sAMAccountName|UPN|mail", sAMAccountName, UPN, mail, "email(other_domain)"]
  password: [empty, wrong]
  search_result: ["0|2", 0, 2]
  service_bind: [wrong]
  server: [down]
  userAccountControl: [514]
  lookup: ["guid|email|username|missing", guid, email, username, missing, "true"]
  disabled_rule: [attribute]
  helper: ["guid|rdn", guid, rdn]
  validate_config: ["true"]
  test_connection: ["true"]
  test_account: ["true"]
  account: [new, linked, "linked|unlinked", unlinked, linked_locked, "admin|member", admin, member]
  provisioning: [jit]
  consent: [skip, required]
  browser: [first_visit]
  guard: [admin]
  accept_username: ["on|off", "on", "off"]
  ext_ldap: [missing]
  member: [has_g7_password]
  public_idps: ["true"]
  protocol: [ldap]
effects:
  - identity_subject_entry_uuid
  - groups_from_filter
  - service_bind_then_user_bind
  - filter_escaped
  - no_match
  - no_user_bind
  - rejected_before_connect
  - bind_attempts_zero
  - rejected
  - invalid_credentials_vs_unavailable
  - guid_string_subject
  - groups_from_member_of
  - login_rejected_deprovisioned
  - lookup_inactive
  - guid_binary_escaped
  - entry_or_null
  - rejected_deprovisioned
  - directory_unavailable
  - conversions
  - error_keys
  - checks_reported
  - values_masked
  - login_200_token
  - user_created_without_password
  - account_subject_entry_uuid
  - attempt_handoff
  - login_200
  - after_resolve_fired
  - last_login_at_set
  - login_method_sso
  - login_409_external_step
  - redirect_sso_pending
  - bind_cookie_on_response
  - member_not_created_yet
  - login_401
  - failed_attempts_counted_for_linked_only
  - failed_attempts_zero
  - idp_last_error_ldap_unavailable
  - login_423
  - user_bind_zero
  - admin_200
  - member_403
  - password_path_200
  - directory_calls_zero
  - accepts_usernames_flag
  - validation_422_when_off
  - driver_unavailable
  - verifier_unavailable
  - username_field_closed
  - not_listed
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Unit/Ldap/LdapDriverTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Ldap/SsoCredentialVerifierTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Ldap/LdapAvailabilityTest.php
