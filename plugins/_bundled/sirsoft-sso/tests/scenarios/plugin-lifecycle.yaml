# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: 거절된 시작의 콜백 단계)이 대부분이라 명목상이다.
feature: sso_plugin_lifecycle
description: |
  플러그인 선언과 생애주기 — 이음매 파일, 리스너 계약, 권한·역할·훅·설정 선언, 활성화·비활성·삭제의 메뉴 동기화, 표 스키마(collation, UNIQUE, CASCADE 없음, comment), 회원 탈퇴·삭제 정리, 모의 IdP 게이트와 명령.
axes:
  seams: [all]
  declarations: [listeners, "permissions|roles|hooks|settings", permissions, roles, hooks, settings]
  lifecycle: ["activate|uninstall", activate, uninstall, delete, withdraw]
  column: ["subject|scim_external_id", subject, scim_external_id, all, all_timestamps]
  model: ["identity_provider|sso_account|sso_login_attempt"]
  index: [unique]
  fk: [delete_rule]
  gate: ["off|on", off, on, enable]
  minutes: [999]
  command: ["enable+seed-idp|disable", "enable+seed-idp", disable, enable, backchannel]
  tls: [self_signed]
  env: [production]
  redirect_uri: [foreign]
  route: [mock_authorize]
  loader: [bundled_vendor]
  order: [before_composer_loaders]
  class: ["plugin_entry|plugin_service|vendor_saml|vendor_jwt|vendor_xmlsec"]
effects:
  - seam_files_exist_and_load
  - listeners_implement_contract
  - declared_shape
  - menus_synced
  - menus_removed
  - collation_utf8mb4_bin
  - idp_subject_and_idp_user_unique
  - no_cascade
  - comment_present
  - timestamp_columns_cast_to_datetime
  - accounts_removed
  - user_delete_no_fk_error
  - unlink_hooks
  - mock_routes_404_when_off
  - capped_at_240
  - gate_toggled
  - mock_idp_seeded
  - refused
  - bad_request
  - bundled_vendor_wins
  - classes_loaded_from_bundled
  - backchannel_sent_without_tls_verify
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/Lifecycle/InstallActivateTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Migrations/SchemaTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Listeners/UserCleanupListenerTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Mock/MockGateTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Lifecycle/BundledAutoloadTest.php
