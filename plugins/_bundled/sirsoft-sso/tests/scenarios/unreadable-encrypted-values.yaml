feature: sso_unreadable_encrypted_values
description: |
  사이트 앱 키가 바뀌어 저장된 암호문(IdP 비밀값, 연결의 갱신 토큰)을 지금 키로 풀 수 없을 때도 관리자 화면에서 복구할 수 있다.
  IdP 편집 화면은 비밀값을 미설정으로 보이며 열리고, 비밀값을 다시 입력하면 풀 수 없는 옛 값을 덮어 저장한다. 꺼진 IdP 의 다른
  칸만 저장하면(마스크·빈 값을 함께 보내도) 저장되고 옛 암호문은 그대로 둔다. 켜진 IdP 는 활성화 조건을 볼 비밀값이 없으므로
  비밀값 칸을 짚는 422 로 다시 입력을 요구한다. 연결의 갱신 토큰도 새 값으로 덮어 저장된다.
axes:
  case: [reentered_secret, other_field_mask_or_empty, account_refresh_token]
effects:
  - idp_detail_opens_with_unreadable_secrets
  - reentered_idp_secret_overwrites_unreadable
  - disabled_idp_other_field_saved_keeps_unreadable
  - enabled_idp_requires_secret_reentry_422
  - account_refresh_token_overwrites_unreadable
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/AppKeyRotation/UnreadableEncryptedValuesTest.php
