# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: 거절된 시작의 콜백 단계)이 대부분이라 명목상이다.
feature: sso_account_resolution
description: |
  IdP 신원 → 회원 결정 — 연결 회원 로그인, 자동 생성(동의 대기·동의 생략·이메일 없음·소유 도메인 밖·이메일 충돌), 연결 확인(비밀번호·메일 인증번호·3회 실패 폐기), 소유 도메인 자동 연결, 관리자 대상 제한, 사전 등록 전용, 마이페이지 연결, 퇴사 출처별 재활성, 관리자 경로 인계.
