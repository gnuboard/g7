feature: sso_saml_mock_e2e
description: |
  모의 SAML IdP 를 켠 채 브라우저로 도는 로그인 종단(계획서 §10 M2). 회사 계정 버튼 → Redirect 바인딩 AuthnRequest(요청 ID, 이 사이트 ACS)
  → 승인 → ACS 302 → 첫 로그인 동의 → 비밀번호 없는 회원 자동 가입·연결·로그인, 새로고침 뒤 같은 회원.
  서명·조건이 어긋난 응답은 saml_invalid, 「IdP 에서 시작」이 꺼져 있으면 요청하지 않은 응답은 saml_unsolicited, SP 메타데이터는 XML.
  서명 감싸기·재전송·암호화 같은 응답 세부는 PHPUnit `saml-protocol.yaml` 이 덮는다.
axes:
  case: [authn_request, jit_consent, response_variant, unsolicited, sp_metadata]
effects:
  - e2e_saml_button_sends_redirect_binding_authn_request
  - e2e_saml_acs_consent_creates_member_and_logs_in
  - e2e_invalid_saml_response_refused
  - e2e_idp_initiated_refused_when_off
  - e2e_sp_metadata_is_xml_with_acs
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Playwright/specs/sso-saml-mock.spec.ts
limitations:
  - "ACS 주소 호스트에 밑줄이 있으면 SAML 라이브러리 주소 검사에 걸린다 — 밑줄 없는 호스트의 사이트에서 PLAYWRIGHT_BASE_URL 로 돌린다."
