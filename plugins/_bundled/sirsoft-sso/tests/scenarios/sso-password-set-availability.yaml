feature: sso_password_set_availability
description: |
  연결 IdP 가 「이 사이트 비밀번호 허용」을 끈 회원(기본값)은 비밀번호를 만들 수 없다. 플러그인이 코어 필터 `core.auth.password_auth_decision`
  (`set_password`·`admin_set_password`)으로 답하는 판정이 코어 회원 응답(마이페이지 `can_set_password`, 관리자 회원 상세 `password_status.can_set`)에
  그대로 실려, 화면이 칸과 본인 확인 대신 안내를 미리 보인다. 문구는 저장 403 과 같다.
axes:
  allow_local_password: ['false|true']
  surface: ["profile|admin_detail"]
effects:
  - member_response_reports_password_unsettable
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/Policy/PasswordSetAvailabilityTest.php
