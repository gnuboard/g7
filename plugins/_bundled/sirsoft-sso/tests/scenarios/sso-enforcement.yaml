feature: sso_enforcement_e2e
description: |
  SSO 강제를 브라우저·API 로 도는 종단(계획서 §10 M5·M6). 이메일 먼저 입력(소유 도메인 → 「…(으)로 계속」, 다른 도메인 → 비밀번호 칸),
  IdP 「이 도메인 비밀번호 로그인 막기」와 역할 강제의 비밀번호 로그인 403(사용자·관리자 경로 모두, 틀린 비밀번호는 일반 401),
  사이트 전체 강제의 가입 차단과 비상 계정 2단계 필수, 자동 이동과 거부 뒤 재이동 없음·?local=1,
  관리자 화면 SSO 로그인과 비관리자 403. 강제 판정 세부와 토큰 회수(W34)는 PHPUnit `sso-policy-enforcement.yaml` 이 덮는다.
axes:
  case: [discover, domain_enforced, role_enforced, site_enforced, auto_redirect, admin_sso, admin_sso_non_admin]
effects:
  - e2e_owned_domain_switches_to_company_button
  - e2e_other_domain_keeps_password_form
  - e2e_domain_enforcement_blocks_password_login
  - e2e_role_enforcement_blocks_both_login_routes
  - e2e_wrong_password_does_not_reveal_role
  - e2e_site_enforcement_closes_registration
  - e2e_emergency_account_requires_two_factor
  - e2e_auto_redirect_goes_to_idp
  - e2e_denied_auto_redirect_does_not_loop
  - e2e_local_query_skips_auto_redirect
  - e2e_admin_sso_login_reaches_admin
  - e2e_non_admin_sso_refused_on_admin_screen
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Playwright/specs/sso-enforcement.spec.ts
limitations:
  - "정책은 fixture 가 저장소에 바로 쓴다 — 저장 화면의 토큰 회수를 타지 않아 개발 사이트 다른 회원의 로그인을 건드리지 않는다(회수는 PHPUnit 이 덮는다)."
