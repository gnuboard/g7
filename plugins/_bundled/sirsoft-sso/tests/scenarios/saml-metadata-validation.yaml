feature: saml_metadata_validation

description: |
  SAML IdP 의 붙여 넣은 메타데이터 XML 을 저장 검사(`SamlDriver::validateConfig`)에서 로그인 때와 같은 파서(`SamlMetadata::parse`)로
  읽는다. 깨졌거나(닫히지 않음, XML 아님) 필요한 것이 없으면(EntityDescriptor·IDPSSODescriptor, SingleSignOnService, 서명 인증서 — 인증서는 실제로 읽히는지까지)
  `idp_metadata_xml` 칸 오류 — 켜진 IdP 저장은 422 `config_invalid`. DOCTYPE·엔티티가 든 XML 은 거절(XXE). 붙여 넣은 XML 은
  주소보다 먼저 쓰이므로 주소가 함께 있어도 읽는다. 주소만 있으면 저장 때 받지 않는다(받기는 연결 시험·로그인 때).

axes:
  check:
    - broken_metadata   # 깨진 변종 7개(닫히지 않음, XML 아님, EntityDescriptor 없음, SSO 주소 없음, 서명 인증서 없음, 못 읽는 인증서, DOCTYPE·엔티티) × 주소 없음·있음
    - valid_metadata    # 모의 IdP 정상 메타데이터, 주소만
    - admin_api         # 켜진 SAML IdP 관리자 저장 — 깨진 XML 422, 정상 XML 200

effects:
  - metadata_xml_field_error         # validateConfig 가 idp_metadata_xml => saml.validation.metadata_invalid
  - valid_metadata_accepted          # 정상 XML·주소만은 메타데이터 칸 오류 없음, 저장 200
  - config_invalid_422_with_field    # 관리자 저장 422 config_invalid, errors.fields.idp_metadata_xml
  - config_unchanged_on_reject       # 거절 뒤 저장된 설정 그대로

test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/Saml/SamlMetadataValidationTest.php
