feature: sso_policy_ttl

description: |
  정책 「로그인 요청 유효 시간」(state_ttl_minutes)·「동의·연결 확인 대기 시간」(pending_ttl_minutes)은 관리자 정책 화면에서 저장되지만
  state·대기 저장소가 늘 기본 10분을 써서 동작에 반영되지 않았다(실측: 정책 1분, 78초 뒤 승인해도 로그인 성공). 저장소가 수명을
  받지 않으면 정책 값(PolicyService)을 쓴다. 드라이버가 시작 정보를 다시 저장해도(update — SAML 요청 id) 처음 만든 시각 기준 정책 수명을 넘기지 않는다.

axes:
  store: [state, pending]
  policy: [one_minute, default]

effects:
  - state_follows_policy_ttl     # 정책 1분이면 61초 뒤 state 없음(다시 저장해도 연장 없음)
  - pending_follows_policy_ttl   # 정책 1분이면 61초 뒤 동의 pending_expired·연결 link_expired
  - default_ttl_unchanged        # 기본 10분이면 61초 뒤에도 남음

test_files:
  - plugins/_bundled/sirsoft-sso/tests/Unit/Services/PolicyTtlTest.php
