notes:
  - |
    활동 로그의 회원 이름을 남기는 자리는 연결과 해제, 자동 생성, 퇴사 처리, 역할 동기화(리스너), 사전 등록, 비상 로그인,
    속성과 이메일 동기화, 퇴사 뒤 탈퇴다. 모두 같은 도우미(`Support\MemberName::forRecord`)를 거치며, 이 매니페스트는 리스너 경로
    (연결)와 서비스 경로(사전 등록)를 대표로 잠근다.
  - |
    정책 화면의 비상 계정 목록(`emergency_users[].name`)도 관리자 영역 표시 이름과 실명 보조 줄을 쓴다.
    후보 검색은 코어 회원 목록 API 를 그대로 쓰므로 같은 규칙의 이름과 실명이 이미 온다.
