feature: SSO 플러그인의 회원 표시 이름

description: |
  SSO 플러그인이 회원 이름을 응답, 기록, 알림에 실을 때 회원 이름 컬럼을 직접 읽지 않고 코어 표시 이름 계산기를 거친다.

  - 관리자 「회원 연결」 목록과 연결 추가 응답의 회원 이름(`user.name`)은 관리자 영역(`core:admin`) 표시 이름이다. 실명은 보는
    관리자에게 회원 조회 권한(`core.users.read`)이 있고 실명이 표시 이름과 다를 때만 `user.real_name` 으로 싣는다. 화면은 그 키가
    있을 때만 이름 아래에 작은 글씨 보조 줄(접근 가능한 이름 「실명 ○○」)을 그린다.
  - 목록 검색은 관리자 화면의 회원 검색 규칙대로 이름 또는 닉네임을 찾고, 종전처럼 이메일도 찾는다.
  - 새로 남기는 활동 로그의 회원 이름(`user_name`)은 그 시점의 관리자 영역 표시 이름이다. 이미 남은 기록은 바꾸지 않는다.
  - 알림 본문의 사건 회원 이름(`user_name`)은 알림 영역(`core:notification`) 표시 이름이다. 회원 본인에게 가는 알림의 받는 사람
    이름(`name`)은 자리표시(`{recipient_name}`)로 싣고 코어가 받는 사람과 채널마다 푼다.

  설정을 바꾸지 않은 사이트의 응답은 수정 전과 같다.

  축은 하나(`case`)다. 자리, 영역, 권한을 축으로 나누면 곱이 미커버로 남으므로 잠그는 사실 하나를 한 사례로 편다.

