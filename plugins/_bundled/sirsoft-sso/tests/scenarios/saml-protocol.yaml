# audit:allow test-scenario-coverage[cross_product] reason: issue:#798 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: IdP-initiated 와 SP 발 로그아웃)이 대부분이라 명목상이다.
feature: sso_saml_protocol
description: |
  SAML 2.0 SP 드라이버와 모의 SAML IdP — 응답 변종 카탈로그(부록 C-2) 전수, 서명 감싸기·주석 주입·재전송, 암호화 어설션과 SP 키 교체, SP-initiated 왕복(ACS, state, 묶음 쿠키 SameSite=None), IdP-initiated(허용·1회·복귀 경로), 단일 로그아웃(SP 발, IdP 발 서명 필수), SP 메타데이터와 IdP 메타데이터 갱신·인증서 만료 훅, 라이브러리 사용 규율.
coverage_strategy: pairwise
axes:
  protocol: [saml]
  variant: [appendix_c2, "ok|mfa_context|groups_multi|no_attributes", ok, mfa_context, groups_multi, no_attributes, replay, comment_injection, "xsw_wrap|xsw_sibling", xsw_wrap, xsw_sibling, "ok|encrypted_assertion", encrypted_assertion, "ok|cert_expiring_7d", cert_expiring_7d, "unsigned|audience_other", unsigned, audience_other, repeat_attribute]
  mfa_authn_contexts: [empty]
  want_assertions_encrypted: ["true"]
  sp_key: [rotated_within_30_days, "none|present", none, present]
  status: [Responder/RequestDenied]
  state: [missing_request_id, reused, none]
  size: [over_256kb]
  name_id_format: [transient]
  subject_source: [name_id, attribute]
  route: [sp_metadata]
  idp: ["oidc|mock_gate_off|disabled", oidc, mock_gate_off, disabled]
  idp_metadata: [url]
  command: [metadata-refresh]
  days_left: [7]
  metadata: [unreachable]
  sp_keys: [generate]
  validate_config: ["true"]
  test_connection: ["true"]
  site_host: [underscore]
  scan: [src_without_mock]
  host_header: [spoofed]
  binding: [redirect, post]
  account: [linked, new]
  guard: [user, admin]
  redirect: [/mypage]
  provisioning: [jit]
  consent: [skip]
  acs_input: [missing]
  locale: ["ko|en", ko, en]
  intent: [reauth]
  site: [https]
  browser: [first_visit, "same|none|other", same, none, other]
  idp_initiated: ["off", "on"]
  replay: [second]
  response: [has_in_response_to]
  relay_state: [external_url]
  direction: [idp_to_sp, sp_to_idp]
  signed: ["true", "false|wrong_key", "false", wrong_key]
  name_id: [missing]
  sls_input: ["both|none", both, none]
  library_error: [after_validation]
effects:
  - response_summary_recorded
  - raw_response_not_stored
  - recent_attempt_has_summary
  - identity_or_error_code
  - identity_fields_mapped
  - repeated_attribute_values_merged
  - library_error_maps_to_saml_invalid
  - mfa_unknown
  - second_rejected_response_replayed
  - subject_is_full_signed_value
  - rejected_no_identity
  - plain_rejected
  - encrypted_decrypted
  - decrypted_with_previous_key
  - access_denied
  - rejected_before_parse
  - rejected
  - subject_from_attribute
  - content_type_xml
  - entity_id
  - acs_sls_site_url
  - certificate_published
  - not_found
  - disabled_still_served
  - entity_id_parsed
  - earliest_cert_expiry
  - refreshed_at_saved
  - cert_expires_at_saved
  - cert_expiring_hook_once
  - exit_zero
  - fields_unchanged
  - key_matches_certificate
  - ten_years
  - error_keys
  - site_url_check_failed
  - login_start_saml_invalid
  - checks_reported
  - forbidden_pattern_count_zero
  - post_binding_autosubmit_without_inline_handler
  - base_url_from_site_url
  - superglobals_restored
  - authn_request_sent
  - acs_is_site_url
  - request_id_in_state
  - handoff_issued
  - context_login_method
  - attempt_recorded
  - user_created
  - account_subject_name_id
  - subject_format_saved
  - sso_error_saml_invalid
  - member_change_zero
  - attempt_failed
  - second_state_expired
  - admin_login_screen
