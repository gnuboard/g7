  - plugins/_bundled/sirsoft-sso/tests/Unit/Saml/SamlMetadataTest.php
  - plugins/_bundled/sirsoft-sso/tests/Unit/Saml/SamlLibraryUsageTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Saml/SamlLoginFlowTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Saml/SamlBindingCookieTest.php
