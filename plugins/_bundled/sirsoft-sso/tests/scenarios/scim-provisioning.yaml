# audit:allow test-scenario-coverage[cross_product] reason: 축은 시험마다 따로 고른 입력 변수다 — 서로 곱하면 한 흐름에서 동시에 성립하지 않는 조합(예: SCIM 꺼짐과 PATCH 연산)이 대부분이라 명목상이다.
feature: sso_scim
description: |
  SCIM 2.0 서버 — Bearer 인증과 수신 이력, ServiceProviderConfig·ResourceTypes·Schemas, Users(목록 필터 3, 생성, 교체, PATCH 3, 삭제=퇴사), Groups(소속, 역할 매핑 재적용), 대조 키(userName/externalId).
axes:
  token: ["missing|wrong", missing, wrong, reissued, other_idp]
  scim_enabled: ["false"]
  request: [users_get_missing, "not_found|bad_patch", not_found, bad_patch]
  method: [POST, DELETE, PUT]
  members: [1]
  filter: [displayName, "unsupported_operator|unsupported_attribute", unsupported_operator, unsupported_attribute, "userName|externalId|emails.value", userName, externalId, emails.value]
  op: ["add|remove_filter|replace", add, remove_filter, replace, rename, "replace|add|remove", remove, "patch_active_false|delete", patch_active_false, delete]
  scim_match: [externalId, default]
  externalId: [missing]
  resource: [ServiceProviderConfig, "ResourceTypes|Schemas", ResourceTypes, Schemas]
  existing_user: [none]
  email_domain: [owned, foreign]
  existing: ["same_subject|same_email"]
  domain_auto: ["off|on"]
  page: ["startIndex+count"]
effects:
  - scim_401
  - scim_event_recorded
  - scim_403
  - old_token_401
  - new_token_200
  - scim_event_has_no_body
  - group_created
  - role_synced_on_membership
  - scim_409
  - members_excluded
  - members_changed
  - role_removed_on_leave
  - role_follows_rename
  - group_and_members_deleted
  - subject_is_external_id
  - filters_work
  - scim_400
  - subject_is_user_name
  - supported_flags
  - list_response
  - scim_400_invalid_filter
  - scim_error_schema
  - user_created_passwordless
  - account_linked_via_scim
  - attributes_saved
  - no_consents
  - fallback_invalid_email
  - scim_409_uniqueness
  - linked_existing_member
  - filtered_list
  - paged_list
  - user_name_changed
  - attributes_replaced
  - name_replaced
  - department_added
  - title_removed
  - member_blocked
  - tokens_revoked
  - account_inactive
  - member_kept
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Feature/Scim/ScimAuthTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Scim/ScimGroupsTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Scim/ScimMatchKeyTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Scim/ScimSchemaResponsesTest.php
  - plugins/_bundled/sirsoft-sso/tests/Feature/Scim/ScimUsersTest.php
