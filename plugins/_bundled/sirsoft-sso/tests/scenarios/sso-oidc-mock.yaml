feature: sso_oidc_mock_e2e
description: |
  모의 OIDC IdP 를 켠 채 브라우저로 도는 로그인 종단(계획서 §10 M1). 로그인 화면 회사 계정 버튼 → 모의 authorize(state·nonce·PKCE,
  묶음 쿠키 HttpOnly) → 승인 → 첫 로그인 동의 모달 → 비밀번호 없는 회원 자동 가입·연결(jit)·동의 2건 → 로그인 인계.
  같은 계정 재로그인은 동의 없이, 돌아갈 주소는 같은 출처 경로만, 거부·서명 변종·다른 브라우저 콜백은 로그인되지 않는다.
  프로토콜 세부(서명 검증, 시계, JWKS 회전)는 PHPUnit `oidc-protocol.yaml`·`flow-foundation.yaml` 이 덮는다.
axes:
  case: [entry, jit_consent, returning, redirect, deny, idps_failure, token_variant, bind_mismatch]
effects:
  - e2e_login_screen_shows_company_buttons
  - e2e_start_redirects_with_state_nonce_pkce
  - e2e_first_login_consent_modal_creates_passwordless_member
  - e2e_jit_link_and_consents_recorded
  - e2e_returning_member_skips_consent
  - e2e_redirect_kept_same_origin_only
  - e2e_denied_returns_error_without_login
  - e2e_idps_failure_hides_buttons_keeps_password_form
  - e2e_invalid_id_token_refused
  - e2e_callback_in_other_browser_refused
test_files:
  - plugins/_bundled/sirsoft-sso/tests/Playwright/specs/sso-oidc-mock.spec.ts
limitations:
  - "실서버 한 대·DB 하나를 쓰는 종단 시험이라 직렬(워커 1)로만 돈다. 회원은 e2e798. 접두어로만 만들고 끝에 지운다."
