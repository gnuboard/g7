feature: 우편번호 검색 창은 인라인 스타일을 쓰지 않는다 — 엄격한 스타일 정책 호환

description: |
  운영자가 `style-src 'self'; style-src-attr 'none'` 을 걸면 `<style>` 요소와 `setAttribute('style', …)` 가 막힌다.
  종전 핸들러는 펼치기 영역·다크 모드 규칙을 `<style>` 로, 전체 화면 창·그 안 frame·레이어 크기를 style 속성 문자열로
  실어, 정책을 켠 사이트에서 주소 검색 창이 무스타일로 떴다. 규칙은 플러그인 CSS 파일(`resources/css/main.css` →
  `dist/css/plugin.css`, `plugin.json` 의 `assets.css` 로 선언)로 옮기고, 레이어의 설정 너비·높이만 CSS 변수
  (`--dp-width`·`--dp-height`)로 싣는다. 레이어가 화면에 남기는 여백(32px·96px)은 핸들러 상수와 CSS 파일 두 곳에
  있으므로 테스트가 같은 값임을 묶는다. `el.style.x = …`·`el.style.cssText = …`·`style.setProperty()` 는 정책이 막지
  않으므로 그대로 쓴다.

axes:
  mode:
    - inline      # 페이지 안에 펼치기
    - fullscreen  # 모바일 전체 화면 창
    - layer       # PC 레이어
    - source      # 소스·manifest 계약

effects:
  - no_style_element_injected        # 핸들러가 <style> 요소를 만들지 않는다
  - no_style_attribute_string        # setAttribute('style', …) 를 부르지 않는다
  - fullscreen_styled_by_class       # 전체 화면 창·frame 을 클래스로 꾸민다
  - layer_size_via_css_variables     # 레이어 설정 크기 = CSS 변수
  - layer_gutter_constants_match_css # 여백 상수 = CSS 파일의 값
  - css_declared_as_plugin_asset     # 엔트리 import + plugin.json assets.css
  - dark_rules_in_css_file           # 펼치기 영역(daumpostcode-inline*)·다크 모드 짝(중립 표식 data-g7-color-scheme, .dark 미전제) 규칙이 CSS 파일에 있다

test_files:
  - plugins/_bundled/sirsoft-daum_postcode/resources/js/__tests__/postcode-no-inline-style.test.ts
