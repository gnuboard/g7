# 시나리오 매니페스트 — 다음 우편번호: 받는 중 노출 전수(#915)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: loading_negative_state

description: >-
  화면이 먼저 그려진 뒤 받는 데이터소스(progressive·background)는 받기 전 값이 undefined 다. 조건이 빈 값을
  「없음」·「비회원」·「미동의」로 읽으면 받는 중에도 참이 되어 화면이 잠깐 틀리게 보였다가 바뀐다(제보: 동의를 마친
  방문자에게 쿠키 동의 배너가 새로고침마다 잠깐 보임). 이 패키지의 레이아웃(조각은 넣는 자리에서 펼침)을 엔진의
  실제 조건 평가기로 받는 중 상태에서 평가해, 받은 뒤에만 뜻이 있는 요소는 받기 전에 그리지 않거나 흐리는지 본다.

test_files:
  - plugins/_bundled/sirsoft-daum_postcode/resources/js/__tests__/layouts/loadingNegativeState.test.tsx

coverage_strategy: full

# axis 의미:
#   load_state — 데이터소스 상태. loading 은 엔진이 화면을 먼저 그릴 때 넣는 undefined. 레이아웃 전부를 한 시험이 돈다.
axes:
  load_state: [loading]

effects:
  - loading_hides_post_load_only_state   # 받는 중에는 받은 뒤에만 뜻이 있는 노출·안내가 없다(일부 소스만 도착한 순간·회원 분기 포함, 흐림 아래는 허용) — 노출 전수(#915)
  - loading_blurs_zero_counts   # 받는 데이터를 `?? 0` 으로 메운 숫자는 그 소스를 기다리는 흐림 아래에 있다 — 노출 전수(#915)
