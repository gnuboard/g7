feature: 우편번호 SDK 실패 안내는 플러그인 문구 한 건으로 나온다

description: |
  SDK 스크립트는 레이아웃 조각의 `<script id="daum_postcode_script">` 로 실리므로 끝내 못 불러오면 코어 레이아웃
  스크립트 로더도 같은 자산의 실패를 따로 알린다(이름 = 스크립트 id 원문). 두 건이 겹치면 코어 안내가 묶음 문구
  「2개 항목을 불러오지 못했습니다. daum_postcode_script, 주소 검색」이 되어 내부 id 가 보이고 플러그인의
  「주소를 직접 입력해 주세요」가 사라졌다. 플러그인 안내의 재시도가 같은 SDK 를 다시 불러오므로, 플러그인 안내가
  떠 있는 동안 코어의 같은 자산 안내(`layout-script:daum_postcode_script`)를 걷는다 — 먼저 와 있든 나중에 오든.

axes:
  core_notice_order: [before, after]

effects:
  - postcode_sdk_failure_shows_single_plugin_notice

test_files:
  - plugins/_bundled/sirsoft-daum_postcode/resources/js/__tests__/postcode-failure-notice.test.ts
