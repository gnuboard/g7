<!-- 주소 검색 버튼을 이커머스 배송지 폼의 주소 슬롯에 끼워 넣는 조각 — 어떤 필드를 잠글지는 슬롯을 연 쪽이 props 로 정한다.
  슬롯을 연 화면이 읽기 전용이면(수정 권한 없음) props.disabled 로 알려 주고, 이 조각은 그 값으로 버튼을 잠근다. -->
<extension extension-point="address_search_slot" priority="100">
  <div data-ref="daum_postcode_container" class="inline-flex">
    <on event="mount">
      <!-- 주소 검색 플러그인 마운트 시 지정된 필드를 readOnly로 설정 -->
      <action handler="sirsoft-daum_postcode.setFieldReadOnly" fields="{{extensionPointProps.readOnlyFields ?? ['zipcode', 'address']}}" :readOnly="true"/>
    </on>
    <button data-ref="btn_search_address" type="button" class="px-3 py-2 bg-gray-100 dark:bg-gray-700 text-sm text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="{{String(extensionPointProps.disabled ?? false) === 'true'}}">
      <on type="click">
        <!-- G7 표준 형식으로 변환하여 callbackAction 실행 (하이브리드 방식) -->
        <action handler="sirsoft-daum_postcode.openPostcode" displayMode="{{_global.plugins['sirsoft-daum_postcode']?.display_mode ?? 'layer'}}" width="{{_global.plugins['sirsoft-daum_postcode']?.popup_width ?? 500}}" height="{{_global.plugins['sirsoft-daum_postcode']?.popup_height ?? 600}}" callbackAction="{{extensionPointCallbacks.onAddressSelect}}" targetFields="{{extensionPointProps.targetFields}}">
          <field name="theme">
            <field name="searchBgColor" value="{{_global.plugins['sirsoft-daum_postcode']?.theme_color ?? '#1D4ED8'}}"/>
            <field name="queryTextColor" value="#FFFFFF"/>
          </field>
        </action>
      </on>
      $t:sirsoft-daum_postcode.search_address
    </button>
  </div>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" id="daum_postcode_script" label="$t:sirsoft-daum_postcode.search_address"/>
</extension>
