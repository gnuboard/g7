feature: social_login_standalone_pages_no_inline_style

description: |
  단독 HTML 페이지가 인라인 스타일을 쓰지 않는다 — 스타일 보안 정책 호환 (코어 #163, 7.1.6).

  사이트가 `style-src 'self'; style-src-attr 'none'` 을 걸면 `<style>` 요소와 `style="…"` 속성이 막힌다. `Support\HtmlPage`
  가 그리는 화면(연결 테스트 결과·데이터 삭제 상태·모의 제공자 동의 화면)이 `<style>` 블록으로 모양을 실어 그 정책에서
  무스타일로 떴다. 규칙은 같은 출처 정적 파일(`assets/pages/html-page.css`, 빌드 대상 아님)로 옮기고 `<head>` 에는
  `<link rel="stylesheet">` 하나만 둔다.

axes:
  page:
    - html_page          # HtmlPage::render 가 그리는 단독 화면
    - stylesheet_file    # 옮긴 CSS 파일

effects:
  - standalone_page_has_no_inline_style        # <style> 요소·style 속성 0건
  - standalone_page_links_stylesheet_in_head   # <head> 에 CSS 링크 1건
  - stylesheet_file_keeps_original_rules       # CSS 파일에 종전 규칙이 그대로 있다

test_files:
  - plugins/_bundled/sirsoft-social_login/tests/Feature/Support/HtmlPageNoInlineStyleTest.php
