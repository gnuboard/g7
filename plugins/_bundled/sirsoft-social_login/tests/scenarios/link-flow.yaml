  registry: [unscoped_provider_first, company_reauth_before_social]
  entry: [core_challenge_continue, password_first_set_428]
  screen: ["mypage_profile_edit|mypage_change_password"]
  provider: [same_link, other_user, unlinked, mock_naver, other_provider, provider_denied]
  identity_policy: [password_change]
  claim: [other_user]
