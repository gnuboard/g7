# audit:allow test-scenario-coverage[cross_product] reason: 연결 관리(연결·충돌·해제·마지막 수단), 대체 이메일 회원의 소셜 재확인, 회원 생애주기 리스너, 공개 제공자 목록은 서로 다른 표면이라 축을 곱하면 성립하지 않는 조합만 늘어난다 — 표면별 시험으로 나눴다.
feature: social_login_link_flow
coverage_strategy: pairwise
description: |
  마이페이지 연결 관리와 그 주변 표면. [연결] 왕복은 로그인 회원으로 시작해 콜백이 연결을 만들고, 다른 회원에 연결된 계정·이미 연결된
  제공자는 거절한다. 해제는 제공자 권한 회수를 시도하고(실패해도 해제), 비밀번호도 없고 연결이 하나뿐이면 막는다(설정으로 허용).
  대체 이메일 회원(비밀번호 없음, 메일 수신 불가)은 연결된 제공자로 다시 로그인해 정보 수정 진입·비밀번호 첫 설정을 통과한다(R16 —
  코어 본인인증 수단으로 붙고 확인 토큰은 주소에 싣지 않는다). 회원 삭제·탈퇴는 연결을 지우고, 회원 응답에 연결된 제공자 목록을 더하며,
  공개 제공자 목록은 켜진 제공자만 자격증명 없이 준다.
