# audit:allow test-scenario-coverage[cross_product] reason: 제공자 설정·연결 테스트·진단·통계·회원 연결은 서로 다른 관리자 표면이라 축을 곱하면 성립하지 않는 조합만 늘어난다 — 표면별 시험으로 나눴다.
feature: social_login_admin_providers
coverage_strategy: pairwise
description: |
  관리자 화면의 서버 표면. 제공자 설정(목록·수정·일반 OIDC 추가·삭제·정렬·discovery·영향)은 비밀값을 값 대신 마스크로만 보이고
  마스크 회신은 유지, 빈 값은 삭제다. 연결 테스트는 없는 인가 코드로 토큰 주소를 불러 거절 사유를 정상·클라이언트 오류·콜백 주소
  불일치·도달 불가로 나누고, 브라우저 테스트는 인가 주소를 준다. 진단은 제공자·큐·메일·모의·회원·웹훅 카드와 앱 키 교체로 풀 수
  없는 자격증명을 보이고, 통계는 기간 안 시도(관리자 테스트 제외)와 지금의 연결 수를 센다. 회원 상세 탭은 연결 열람(제공자 사용자
  ID 앞 6자)과 강제 해제(마지막 수단 가드 없음)이고, 권한 4종이 라우트마다 갈린다. 브라우저 종단(E2E)은 자격증명 저장 뒤 새로고침의
  마스킹, 일반 OIDC 추가와 연결 테스트(닫힌 포트라 서명 키 목록 실패)와 삭제, 설정 조회 전용 관리자의 읽기 전용 카드를 잰다.
  설정 화면 알림 탭은 이 플러그인이 등록한 알림 정의 5종을 코어 알림 API 로 받아 정의 사용 여부·발송 수단·템플릿(편집·미리보기·저장)·
  기본값 되돌리기를 다루고, 알림 권한이 없는 관리자에게는 권한 안내를 보인다. 정책 탭의 두 알림 기준 칸은 알림 탭으로 가는 링크를 단다.
  관리자 화면과 마이페이지 카드, 서버가 그리는 두 페이지의 시각 칸은 코어 리소스처럼 보는 사람 시간대의 `Y-m-d H:i:s` 로 나간다.
  통계 기간은 사이트 시간대 자정부터 세고 기준 시각도 사이트 시간대로 보인다.
