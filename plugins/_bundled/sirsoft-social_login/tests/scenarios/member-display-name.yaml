feature: 소셜 로그인 플러그인의 회원 표시 이름 (#490)

description: |
  소셜 로그인 플러그인이 기록과 알림에 회원 이름을 실을 때 회원 이름 컬럼을 직접 읽지 않는다.

  - 새로 남기는 활동 로그(연결, 자동 연결, 해제, 관리자 해제, 웹훅 해제, 소셜 가입)의 회원 이름(`user_name`)은 그 시점의
    관리자 영역(`core:admin`) 표시 이름이다. 이미 남은 기록은 바꾸지 않는다.
  - 회원 대상 알림 2종(로그인 수단 없음 안내, 관리자 해제 안내)은 받는 사람이 그 회원 본인이다. 받는 사람 이름(`name`)은
    자리표시(`{recipient_name}`)로 싣고 코어가 받는 사람과 채널마다 표시 이름으로 푼다.

  설정을 바꾸지 않은 사이트는 수정 전과 같은 이름이 남고 나간다.

  축은 하나(`case`)다. 자리와 영역을 축으로 나누면 곱이 미커버로 남으므로 잠그는 사실 하나를 한 사례로 편다.

axes:
  case:
    - activity_log_nickname_admin_area
    - activity_log_default_site
    - notification_member_name_placeholder
    - notification_delivered_nickname_notification_area
    - notification_delivered_default_site

effects:
  - activity_log_user_name_is_admin_area_name
  - activity_log_user_name_unchanged_on_default_site
  - notification_member_recipient_name_is_placeholder
  - delivered_mail_uses_notification_area_name
  - delivered_mail_name_unchanged_on_default_site

test_files:
  - plugins/_bundled/sirsoft-social_login/tests/Feature/MemberDisplayNameTest.php

notes:
  - |
    활동 로그의 회원 이름은 한 메서드(`ActivityLogListener::write`)가 모든 유형에 쓰므로 관리자 해제 경로를 대표로 잠근다.
  - |
    운영 알림 3종(제공자 연속 실패, 가입 급증, 웹훅 처리 실패)은 종전부터 자리표시를 실었다.
