feature: social_login_signup_field_set
description: |
  소셜 가입 완료 창이 운영자가 환경설정 > 회원에서 정한 가입 항목을 코어 가입 화면과 같게 받는다.
  가입 창이 항목을 그렸으면 받은 정의 버전(fields_version)을 요청에 싣고, 그 요청에만 항목 규칙(필수 포함)이 걸린다.
  버전을 싣지 않는 창은 종전과 같은 본문으로 가입되고 빠진 필수 항목은 첫 로그인 뒤 받는다.
coverage_strategy: full
axes:
  fields_version: [absent, current, stale]
effects:
  - legacy_body_signs_up_and_defers_required_fields
  - required_field_missing_returns_field_keyed_error
  - field_set_signup_is_not_deferred
  - field_values_outside_fixed_keys_are_saved
  - provider_values_become_field_defaults
  - pending_view_lists_required_fields_as_missing
  - stale_fields_version_returns_409_and_keeps_pending
  - nickname_policy_error_stays_under_nickname_field
  - registration_data_filter_contract_unchanged
test_files:
  - plugins/_bundled/sirsoft-social_login/tests/Feature/SignupFieldSetTest.php
