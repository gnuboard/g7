# audit:allow test-scenario-coverage[cross_product] reason: CLI·게이트·리다이렉트는 각각 독립 단언이고 제공자×변종은 데이터 제공자(8행)로 덮는다 — 축 곱은 실재하지 않는 조합이다. 회귀 가드는 effects.
feature: social_login_mock_provider
description: |
  모의 제공자는 CLI 로만 켜고(최대 240분), 꺼져 있으면 모의 주소가 모두 404 다. 켜지면 모의 제공자 5종이 실제 드라이버에
  주소만 바꿔 등록되고, 동의 화면 → 토큰 → 사용자 정보(→ discovery, JWKS) 왕복이 결과 화면까지 이른다.
axes:
  cli: [mock]
  gate: [off, on, off_then_on]
  provider: [mock_kakao, mock_naver, mock_google, mock_facebook, mock_oidc]
  variant: [catalog]
  redirect: [foreign]
  cache_store: [redis]
effects:
  - reenabled_gate_rotates_kid
  - mock_cli_on_off_status
  - mock_gate_accepts_numeric_string_from_cache
  - mock_routes_404_when_off
  - mock_refuses_foreign_redirect
  - mock_round_trip_reaches_result_page
test_files:
  - plugins/_bundled/sirsoft-social_login/tests/Feature/Mock/MockProviderTest.php