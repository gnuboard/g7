# audit:allow test-scenario-coverage[cross_product] reason: 버튼 컴포넌트(의도·계열), 왕복 시작 핸들러(주소 판정·응답), 확장 조각(화면별 주입·분기)은 서로 다른 표면이라 곱하면 성립하지 않는 조합만 늘어난다 — 표면별로 나눴다.
feature: social_login_user_screens
coverage_strategy: pairwise
description: |
  사용자 화면 프론트. 제공자 버튼 컴포넌트(로그인·가입은 시작 주소 링크, 연결·재확인은 플러그인 핸들러, 계열별 색·공식 심볼·문구)와 연결 목록 줄의 제공자 심볼,
  로그인 회원 왕복 시작 핸들러(코어 API 클라이언트로 시작하고 같은 출처·https 주소로만 이동), 확장 조각 8개(로그인 버튼·안내, 가입 버튼·모달,
  마이페이지 카드, 대체 이메일 회원 재확인 3종)의 주입 자리·조건·요청·응답 분기와 문구 키(ko·en)를 잰다.
axes:
  intent: [login, register, link, reauth]
  brand: [all]
  redirect: [external]
  i18n: [missing]
  providers: [none]
  network: [failed]
  disabled: ['true']
  url: [same_origin, https, http_external, javascript]
  handler: [startLink, startReauth]
  response: [ok, '409']
