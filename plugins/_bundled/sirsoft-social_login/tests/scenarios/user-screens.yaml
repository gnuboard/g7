  surface: [all, login, register, register_modal, signup_modal, existing_modal, mypage_card, profile_edit_gate, change_password]
  viewport: ['390']
  locale: [ko, en]
  query: [social_error, social_notice, social_pending]
  step: [complete, existing, expired]
  has_password: ['false']
  member: [placeholder]
  iteration: [data_each]
  client: [class_instance]
  modal: [reopen]
  accounts: [none, one]
  policy: [allow_unlink_last_method, signup_before_submit]
  code: [sent]
  theme: [light, dark]
