# audit:allow test-scenario-coverage[cross_product] reason: 의도 × 응답 × state 를 곱하면 state 가 틀린 조합은 응답 축에 도달하지 않아 명목상이다.
feature: social_login_oauth_roundtrip
description: |
  OAuth 왕복의 시작과 콜백을 HTTP 로 잰다. 관리자 연결 테스트는 로그인하지 않고 한 번만 보이는 결과 화면으로 끝나고,
  실패(위조 state, 재사용, 제공자 거부, 교환 실패, 제공자 오류가 아닌 예외, ID 없음)는 시도 기록과 제공자 진단 값에 남는다. 연결 없는 로그인 의도는
  가입 흐름(가입 화면)으로 넘어간다(로그인·가입 분기의 상세는 login-policy·signup-flow 매니페스트). 제공자 레지스트리의 시딩, 확장 등록, 내장 덮어쓰기 무시, 한도도 함께 본다.
axes:
  intent: [login, test]
  provider: [enabled, disabled, unknown]
  response: [success, access_denied, exchange_failed, unexpected_exception, missing_id]
  state: [valid, forged, replayed, cross_provider]
  api: [test_login]
  role: [operator, member]
  registry: [builtin, extension, custom_limit, mock_gate]
  seed: [builtin]
effects:
  - start_redirects_to_provider
  - start_refused_back_to_login
  - test_result_page_shown_once
  - test_result_expires_after_sixty_seconds
  - state_replay_rejected
  - forged_state_rejected
  - provider_error_shown_on_result_page
  - exchange_failure_recorded
  - unexpected_exception_becomes_provider_error
  - missing_provider_id_fails
  - login_without_link_goes_to_signup
  - test_login_requires_settings_update
  - builtin_four_seeded_disabled
  - drivers_instantiated_by_driver_column
  - extension_adds_new_key_builtin_override_ignored
  - custom_providers_capped
  - mock_providers_only_when_gate_on
test_files:
  - plugins/_bundled/sirsoft-social_login/tests/Feature/OAuth/CallbackFlowTest.php
  - plugins/_bundled/sirsoft-social_login/tests/Feature/Registry/ProviderRegistryTest.php
