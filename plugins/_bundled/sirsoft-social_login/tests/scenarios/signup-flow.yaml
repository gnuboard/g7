# audit:allow test-scenario-coverage[cross_product] reason: 이메일 정책(미제공 3 × 신뢰 3)은 데이터 제공자 6행으로 대표 조합을 덮고, 기존 회원 정책 3 × 확인 방법 2 는 정책별 시험으로 나눴다 — 곱하면 대부분 같은 분기를 다시 밟는다.
feature: social_login_signup_flow
description: |
  연결된 회원이 없는 소셜 계정의 가입. 콜백에서 가입 허용·이메일 정책·「이미 가입된 이메일」을 판정해 가입 대기를 만들고,
  가입 모달이 부족한 항목(이메일 인증번호·이름)과 동의를 받아 코어 가입(비밀번호 없음)으로 마친 뒤 로그인 인계를 받는다.
  같은 이메일의 기존 회원은 기본으로 그 계정의 비밀번호나 이메일 인증번호로 확인한 뒤에만 연결한다.
coverage_strategy: pairwise
axes:
  email: [verified, missing, unverified, input, taken, verified_then_changed, locked, conflict]
  policy: [default, verify_link, auto_link_verified, never_link]
  signup_allowed: ['off']
  email_missing_policy: [ask, deny, placeholder]
  email_trust: [flag, trust, verify]
  identity_policy: [signup_before_submit, signup_after_create]
  surge_threshold: ['1']
  filter: [nickname]
  pending: [expired, missing_name, ttl_elapsed]
  code: [correct, wrong, other_challenge, expired]
  method: [password, email]
  password: [correct, wrong]
  existing: [passwordless, withdrawn, admin]
  verified: ['true', 'false']
  action: [discard]
  provider: [mock_kakao]
  variant: [no_email]
  mail: [failed]
