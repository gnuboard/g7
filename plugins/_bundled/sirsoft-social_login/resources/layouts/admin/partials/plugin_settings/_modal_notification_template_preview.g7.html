<!-- 소셜 로그인 설정 — 알림 템플릿 미리보기 창. 편집 창이 만들어 둔 결과를 보여 주기만 하고
  입력이 없다 — 그래서 이 조각에는 액션이 하나도 없다. -->
<partial description="알림 템플릿 치환 결과 미리보기">
  <modal data-type="composite" data-ref="modal_sl_notification_definition_preview" title="$t:sirsoft-social_login.admin.notifications.preview_modal.title" size="lg">
    <div data-ref="sl_preview_content">
      <div>
        <label class="sl-form-label">$t:sirsoft-social_login.admin.notifications.preview_modal.rendered_subject</label>
        <p class="sl-text-primary sl:text-sm sl:bg-gray-50 sl:dark:bg-gray-900 sl:rounded-md sl:p-3 sl:border sl:border-gray-200 sl:dark:border-gray-700">{{_global.sl_notification_template_form_modal?.preview?.subject ?? ''}}</p>
      </div>
      <div>
        <label class="sl-form-label">$t:sirsoft-social_login.admin.notifications.preview_modal.rendered_body</label>
        <html-content data-type="composite" content="{{_global.sl_notification_template_form_modal?.preview?.body ?? ''}}" :isHtml="true" class="sl:text-sm sl:max-w-none sl:bg-white sl:dark:bg-gray-900 sl:rounded-md sl:p-4 sl:border sl:border-gray-200 sl:dark:border-gray-700 sl:max-h-[400px] sl:overflow-y-auto"/>
      </div>
      <div class="sl:flex sl:justify-end sl:border-t sl:border-gray-200 sl:dark:border-gray-700">
        <button data-ref="sl_btn_close_preview" type="button" class="sl-text-body sl:px-4 sl:py-2 sl:rounded-md sl:border sl:border-gray-300 sl:dark:border-gray-600 sl:hover:bg-gray-50 sl:dark:hover:bg-gray-700 sl:transition-colors">
          <on type="click">
            <close-modal target="modal_sl_notification_definition_preview"/>
          </on>
          $t:sirsoft-social_login.admin.notifications.preview_modal.btn_close
        </button>
      </div>
    </div>
  </modal>
</partial>
