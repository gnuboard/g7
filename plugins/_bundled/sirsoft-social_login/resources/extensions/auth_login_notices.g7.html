<!-- 로그인 화면 진입 안내 — 소셜 로그인이 로그인 화면으로 돌려보낼 때 실은 사유(social_error)와 안내(social_notice)를 토스트로 띄운다.
     2단계 인증·비밀번호 변경·휴면 해제 같은 로그인 단계는 로그인 인계(login_handoff)로 템플릿이 처리하므로 여기서는 다루지 않는다.
     모르는 사유 코드는 일반 실패 문구로 보인다. -->
<extension target-layout="auth/login" priority="100">
  <init>
    <!-- 실패 사유 — 문구 키가 없으면(제공자가 준 낯선 오류 코드) 일반 실패 문구 -->
    <toast if="{{!!query.social_error}}" type="error" message="{{$t('sirsoft-social_login.errors.' + query.social_error) === 'sirsoft-social_login.errors.' + query.social_error ? $t('sirsoft-social_login.errors.provider_error') : $t('sirsoft-social_login.errors.' + query.social_error)}}"/>
    <!-- 가입 뒤 본인인증 대기 회원 — 로그인하지 않고 안내만 -->
    <toast if="{{query.social_notice === 'pending_verification'}}" type="info" message="$t:sirsoft-social_login.notices.pending_verification"/>
  </init>
</extension>
