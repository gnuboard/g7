feature: 마케팅 수신 채널 저장 실패 처리

description: |
  환경설정 화면의 채널 저장(PUT /api/plugins/sirsoft-marketing/admin/channels)이 422 로 실패했을 때의 처리.
  동의한 회원이 있는 일반 채널을 지우려 하면 서버가 막힌 채널 키를 `errors.blocked_channel_keys` 로 돌려주고,
  화면은 그 경우에만 「비활성으로 전환」 창을 열어 그 채널을 꺼진 채로 원래 자리에 되살린다.
  형식·필수값 오류는 창을 열지 않고 실제 검증 문구를 오류 목록에 싣는다.
  채널 추가 창은 서버 규칙(키 형식·중복, 화면 언어 이름 필수)을 확정 전에 걸러 확정 버튼을 잠근다.

axes:
  case: [channel_has_consents, field_validation, unauthenticated, saved, add_channel]

exclusions: []

effects:
  - blocked_channel_key_is_machine_readable
  - deactivate_modal_only_for_blocked_channels
  - blocked_channel_restored_disabled
  - field_errors_shown_without_deactivate_modal
  - add_modal_blocks_invalid_input
  - admin_only_channel_save

test_files:
  - plugins/_bundled/sirsoft-marketing/tests/Feature/Http/Controllers/MarketingAdminControllerTest.php
  - plugins/_bundled/sirsoft-marketing/resources/js/__tests__/layouts/pluginSettingsChannelSave.test.tsx
