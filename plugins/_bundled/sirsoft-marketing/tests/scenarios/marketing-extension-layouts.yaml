feature: 마케팅 동의 확장 레이아웃 구조 계약

description: |
  sirsoft-marketing 이 사용자 화면(회원가입·프로필·프로필 보기)과 관리자 화면(동의 폼·상세·플러그인 설정)에 꽂는
  확장 레이아웃 JSON 의 구조를 잠근다 — 켜짐 조건 if, 약관 보기 버튼 조건, apiCall 성공 뒤 상태 저장 경로,
  채널 반복(item_var), Object.assign setState, 약관 모달, 다국어 키 이름공간, 다크 모드 클래스,
  플러그인 설정 화면 진입 권한(core.plugins.read — 보기 권한 관리자도 읽기 전용으로 연다, #434 W18).

axes:
  layout:
    - register         # user-marketing-register.json
    - profile          # user-marketing-profile.json
    - profile_view     # user-marketing-profile-view.json
    - form             # user-marketing-form.json
    - detail           # user-marketing-detail.json
    - plugin_settings  # plugin_settings.json

effects:
  - extension_layout_contract_holds   # 레이아웃별 구조 계약이 성립한다

test_files:
  - plugins/_bundled/sirsoft-marketing/resources/js/__tests__/layouts/marketing-extension-layouts.test.ts

validation:
  audit_rule: test-scenario-coverage
