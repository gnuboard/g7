feature: 페이지 모듈을 선택 연동으로 — 약관 「보기」 링크

description: |
  마케팅 동의 플러그인은 페이지 모듈(sirsoft-page)을 필수 의존이 아니라 선택 연동(integrations, >=1.0.0)으로 선언한다(1.1.2).
  약관 본문은 페이지 모듈이 제공하므로 그 모듈이 꺼진 사이트에서 약관 「보기」를 누르면 본문 API 가 404 로 끝난다.
  동의 칸을 회원 항목으로 옮긴 뒤에는 약관 「보기」 단추를 이 플러그인의 조각이 아니라 코어 템플릿이 항목 계약(ui.link)대로
  그린다. 계약이 링크가 기대는 모듈(requires_module)을 함께 알려 주고 템플릿은 그 모듈이 꺼져 있으면 단추를 그리지 않는다.
  그래서 이 플러그인의 레이아웃에는 페이지 모듈 API 를 부르는 곳이 남아 있지 않아야 한다. 계약 쪽은
  marketing-consent-fields.yaml 이 잠근다.

axes:
  page_module_state: [inactive]

effects:
  - marketing_manifest_declares_page_as_integration
  - no_layout_calls_page_module_api

test_files:
  - plugins/_bundled/sirsoft-marketing/resources/js/__tests__/layouts/marketing-terms-page-guard.test.ts

notes: |
  e2e_browser=partial — 레이아웃 파일 정적 대조로 잠근다. 페이지 모듈을 끈 사이트의 실제 화면(보기 단추 0, 체크박스 존재)은
  코어 템플릿의 약관 묶음 실측에서 확인한다.
