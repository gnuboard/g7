feature: 회원 생성, 수정, 삭제 때 마케팅 동의 저장이 요청 안에서 끝난다

description: |
  동의 저장이 큐로 가면 저장 직후 다시 연 화면에 옛 동의값이 보이고, 워커에는 요청이 없어 관리자 수정이 본인 수정(profile)
  출처로 기록된다. 동의 값은 회원 항목 저장소 어댑터가 회원 저장과 같은 트랜잭션에서 쓰므로 큐로 갈 수 있는 저장 액션
  (core.user.after_create, after_update, core.auth.after_register)을 구독하지 않는다. 이력 출처는 요청 경로가 아니라
  회원 항목의 표면(admin_update, self_update)에서 정한다. before_delete 정리는 삭제 트랜잭션 안에서 돌도록 sync 다.

axis_notes:
  case: |
    sync_contract 는 구독 선언, admin_update 는 관리자 회원 수정 API, profile_update 는 본인 마이페이지 수정 API 다.
    수정 두 경우는 큐 드라이버를 database 로 두고 워커를 돌리지 않는다(운영의 웹 요청과 워커 분리 재현).

axes:
  case: [sync_contract, admin_update, profile_update]

effects:
  - consent_saved_in_request          # 저장 직후 상세와 프로필 응답에 새 동의값이 보인다
  - source_matches_request_route      # 이력 출처가 실제 경로(admin/profile)대로 남는다

test_files:
  - plugins/_bundled/sirsoft-marketing/tests/Feature/MarketingConsentAdminUpdateQueuedTest.php
