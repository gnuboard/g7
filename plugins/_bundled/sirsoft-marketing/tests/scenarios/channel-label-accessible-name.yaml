feature: 마케팅 채널 추가·편집 창 이름 칸 제목에 언어를 박지 않는다 (7.1.1)

description: |
  이름 칸은 언어 탭이 달린 다국어 입력칸이라 관리자 부품이 곁 제목 뒤에 칸마다 「({언어})」 를 붙여 읽힌다.
  제목이 「항목명 (한국어)」 라 화면 낭독기가 「항목명 (한국어) (English)」 처럼 언어를 두 번 읽었다.
  제목은 채널 목록 표의 「항목명」 열 제목과 같은 언어 없는 이름을 쓴다.

axes:
  surface: [channel_edit_modal]

effects:
  - channel_label_title_has_no_language
  - channel_label_title_matches_list_column

test_files:
  - plugins/_bundled/sirsoft-marketing/resources/js/__tests__/layouts/pluginSettingsChannelLabelName.test.ts
