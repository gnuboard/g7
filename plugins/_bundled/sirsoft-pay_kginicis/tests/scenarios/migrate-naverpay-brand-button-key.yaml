feature: KG 이니시스 네이버페이 브랜드 버튼 설정 키를 공통 간편결제 키로 이관 (1.0.0)

description: |
  1.0.0 업그레이드 마이그레이션이 플러그인 설정의 옛 키 easy_pay_naverpay_brand_button 을
  공통 키 easy_pay_show_brand_button 으로 옮기고 옛 키를 지우는지 고정한다.
  공통 키가 이미 있으면 운영자가 정한 그 값을 덮어쓰지 않고, 설정 파일이 없으면 새로 만들지 않는다.

axes:
  case: [legacy_key_only, both_keys, settings_missing]

effects:
  - legacy_naverpay_brand_button_moved_to_common_key
  - existing_common_brand_button_value_preserved
  - missing_settings_file_skipped

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Unit/Upgrades/MigrateNaverpayBrandButtonKeyTest.php
