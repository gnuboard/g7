feature: KG이니시스 가상계좌 입금 안내 — 입금 금액과 자동 취소 경고

description: |
  마이페이지·비회원 주문 상세 「가상계좌 입금 안내」(후속 B 세션 B5, 전수 실측 S2 인계). 입금 금액은 실제 입금액인 결제예정금액
  (`total_due_amount_formatted`, 마일리지 차감 뒤)을 먼저 읽고, 그 값이 없는 비회원 응답에서는 주문금액으로 대신한다.
  KG 는 금액·자동 취소 경고가 아예 없었다. 입금 대기 중에는 결제예정금액과 주문금액이 같은 값이라(실측 B5 마일리지 주문
  5,000/5,000) 나이스·KCP 는 기준 필드만 맞췄다.

  입금 안내는 주문 상세 결제 정보 카드의 조각(user_order_show)이 그린다(#639 에서 주입 스크립트를 조각으로 옮김).
  설치되는 조각 JSON 을 엔진(createLayoutTest)에 태워 렌더 결과를 단언한다.

axes:
  case: [member_with_mileage, guest_without_due, english_translation]

effects:
  - kginicis_vbank_shows_due_amount
  - kginicis_vbank_shows_auto_cancel_notice
  - kginicis_vbank_amount_notice_translated

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/vbankInfoAmountNotice.test.ts

validation:
  browser_check: 마일리지를 쓴 가상계좌 입금 대기 주문의 마이페이지 주문 상세 → 입금 금액이 결제예정금액, 자동 취소 안내 표시
