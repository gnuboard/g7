feature: 관리자 주문 상세 — 결제수단 칸의 간편결제 이름을 화면 조각으로 덧붙인다 (#639)

description: |
  관리자 주문 상세 결제 정보 카드의 결제수단 칸에 간편결제 이름(예: 간편결제: 카카오페이)을 한 줄 덧붙인다. 예전에는
  주입 스크립트(adminOrderPaymentDisplayInjector)가 주소 글자를 맞추고 로그인 토큰을 저장소에서 읽어 거래 상태를 다시
  조회한 뒤, 이커머스가 그린 칸 글자와 상단 배지 글자를 덮어썼다(history.pushState 덮어쓰기 포함).

  이제 같은 조각(admin_order_payment_query)의 결제 상태 데이터 소스(kginicis_status)를 그대로 쓰고, 이커머스가 약속한
  결제수단 칸 id(payment_method_block_{결제 순번}) 안에 자식으로 붙는다. 칸 값과 상단 배지는 이커머스 소유라 바꾸지 않는다.

axes:
  case: [anchor, easy_pay, no_easy_pay, i18n]

effects:
  - attaches_to_ecommerce_block_id_only
  - easy_pay_name_from_status_data_source
  - easy_pay_label_translated

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/layouts/adminOrderEasyPayFragment.test.tsx
