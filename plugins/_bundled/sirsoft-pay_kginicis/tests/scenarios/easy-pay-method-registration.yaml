feature: KG이니시스 간편결제 수단 등록

description: |
  KG이니시스는 결제수단 카탈로그 필터 훅으로 국내 간편결제 4종(삼성페이·네이버페이·L.pay·카카오페이)과
  일본 결제 2종(PayPay·편의점, 일본 결제를 켰을 때만)을 쇼핑몰 결제수단 목록에 끼워 넣는다. 등록 데이터가 틀리면
  쇼핑몰 관리자 화면과 체크아웃이 그 값을 그대로 믿기 때문에 어긋남이 다른 곳에서 드러난다.

  계약 네 갈래:
    - 위치: 휴대폰 결제 뒤, 포인트·무통장 앞에 놓인다.
    - 기본값: PG 를 자기 자신으로 고정 선언한다(pg_provider=kginicis, pg_locked, needs_pg, 환불수단 pg).
      pg_provider 가 비면 쇼핑몰이 간편결제 주문을 PG 결제가 아닌 주문으로 오인한다.
      설치 직후에는 꺼진 상태이며 재고·마일리지 차감 시점은 결제 완료다.
    - 활성 상태: 플러그인 설정에서 끈 간편결제도 관리자가 켤 수 있게 비활성으로 목록에 들어가고,
      예전 플러그인 설정의 켬/끔 값이 기본 활성 상태로 이어진다.
    - 표시명: 이름·설명이 언어팩 문구에서 오며, ko·en 두 언어 고정이 아니라 지원 언어(활성 언어팩) 전부로 실린다.
      네이버페이 설명은 브랜드 단추 설정에 따라 짧은 문구와 긴 문구가 갈린다.

  브랜드 마크(SVG 로고)는 쇼핑몰의 체크아웃 브랜드 마크 시나리오가 소유한다.

# axis 의미:
#   contract — 등록 데이터가 지키는 계약 갈래. 간편결제 수단은 같은 등록 코드를 지나므로 수단별로
#              곱하지 않고, 각 계약을 수단 전체에 대해 단언한다.
axes:
  contract: [catalog_position, method_defaults, activation_state, display_labels]

effects:
  - easy_pay_methods_follow_phone_before_point                        # 휴대폰 뒤, 포인트·무통장 앞
  - easy_pay_methods_locked_to_own_pg                                 # pg_provider=kginicis, pg_locked, needs_pg, 환불수단 pg
  - easy_pay_methods_installed_inactive_with_payment_complete_timing  # 설치 직후 비활성, 차감 시점 결제 완료
  - disabled_easy_pay_injected_inactive_for_admin_toggle              # 설정에서 끈 수단도 비활성으로 목록에 남음(일본 결제는 끄면 빠짐)
  - legacy_easy_pay_settings_seed_default_active_state                # 예전 설정의 켬/끔이 기본 활성 상태로
  - naverpay_description_follows_brand_button_setting                 # 브랜드 단추 설정에 따라 네이버페이 설명 문구가 갈림
  - easy_pay_labels_cover_supported_locales                           # 이름·설명이 ko·en 고정이 아니라 지원 언어(활성 언어팩) 전부로 채워짐

