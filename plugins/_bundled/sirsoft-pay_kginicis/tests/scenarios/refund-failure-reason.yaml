feature: 결제 환불 실패 사유의 원문 가림

description: |
  쇼핑몰은 결제 환불 리스너가 돌려준 실패 사유를 「PG 환불 처리에 실패했습니다. (…)」 안내에 끼워
  회원·비회원·관리자 취소 응답으로 낸다(#858). KG이니시스가 돌려준 거절 사유(resultMsg)는 그대로 싣고,
  통신 예외·HTTP 오류·내부 예외의 원문(결제대행사 API 주소·cURL 문구·서버 경로)은 서버 로그에만 남긴 채
  번역된 일반 문구(refund.pg_failed)를 싣는다. 디버그 모드는 코어 관례대로 원문을 둔다.

axes:
  failure: [transport, http_error, pg_rejected, debug]

exclusions: []

effects:
  - refund_failure_hides_internal_detail
  - refund_failure_keeps_pg_reason

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Listeners/RefundFailureReasonTest.php
