feature: 현금영수증 발급의 공급가액·부가세 분할 (#612 ②)

description: |
  이커머스 1.3.3 은 발급 페이로드에 주문 부가세를 과세 몫 비율로 나눈 `vat_amount` 를 싣는다(면세 몫은 면세 + 영세).
  KG 발급 요청의 tax 는 그 값을 쓰고(과세 몫 상한), 없으면(구버전 이커머스) 과세 몫/11 로 떨어진다.
  종전 /11 고정은 5% 세율 상품·영세가 섞인 주문에서 부가세를 과다 신고했다.

axes:
  payload_vat: [present, absent, exceeds_taxable_share]

effects:
  - issue_uses_ecommerce_vat_amount
  - issue_falls_back_to_one_eleventh_without_vat

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Unit/Listeners/CashReceiptVatSplitTest.php
