# 시나리오 매니페스트 — 표준결제·모바일 서명 요청의 주문 맥락 대조
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"
# 금액 하한(0원, 최소 금액, 세 경로 하한 동일)은 payment-min-price.yaml 이 같은 테스트 파일에서 소유한다.

feature: KG이니시스 결제창 서명 요청은 주문 금액·통화·구매자·가맹점 자격을 대조한 뒤에만 서명을 발급한다

description: |
  PC 표준결제와 모바일 결제는 결제창을 열기 전에 서버에 서명(signature, verification, chkfake)을 요청한다.
  서버는 요청 금액이 주문 청구액(결제 통화로 환산한 값)과 같은지, 주문 통화가 원화인지, PC 요청의 구매자
  연락처가 주문자와 같은지, 가맹점 자격이 설정됐는지를 확인한 뒤에만 서명을 내준다. 청구액을 계산할 수 없는
  통화는 500 이 아니라 422 로 거절한다.

axes:
  case:
    - pc_matching_order_context
    - pc_amount_mismatch
    - pc_unchargeable_currency
    - pc_non_krw_order
    - pc_buyer_mismatch
    - pc_missing_credentials
    - pc_converted_price
    - mobile_non_krw_order
    - mobile_missing_credentials
    - mobile_unchargeable_currency

effects:
  - pc_signature_issued_for_matching_order_context  # 주문과 맞는 요청은 서명·검증값·mKey 를 받는다
  - signature_rejects_amount_mismatch               # 금액이 청구액과 다르면 서명하지 않는다(422)
  - signature_rejects_unchargeable_currency_with_422  # 청구액을 계산할 수 없는 통화는 500 이 아니라 422
  - signature_rejects_non_krw_order                 # 원화가 아닌 주문은 PC·모바일 모두 서명하지 않는다(422)
  - pc_signature_rejects_buyer_mismatch             # PC 요청 구매자 연락처가 주문자와 다르면 403
  - signature_rejects_missing_credentials           # 가맹점 자격이 없으면 PC·모바일 모두 422
  - pc_signature_expects_converted_price            # 결제 통화 환산 청구액으로만 서명한다(기본 통화 금액은 422)

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/SignatureControllerTest.php
