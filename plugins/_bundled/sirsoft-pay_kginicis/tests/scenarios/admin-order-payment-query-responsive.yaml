feature: KG이니시스 관리자 결제 조회 조각 — 카드 머리 설명의 폭 분기

description: |
  화면 폭 분기를 엔진 responsive 로 쓴다. 카드 머리 설명은 640px 미만에서 숨고 640px 이상에서 보인다.
  확장 유틸리티는 화면에 실릴 때 층 없이 실려 의미 클래스 칸의 pay-kginicis-hidden 을 이기므로,
  640px 이상 갈래에 inline 이 있어야 넓은 화면에서 설명이 보인다.

axes:
  plugin: [sirsoft-pay_kginicis]
  width: [narrow, wide]

effects:
  - card_description_hidden_below_640
  - card_description_inline_from_640

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/layouts/adminOrderPaymentQueryResponsive.test.ts
