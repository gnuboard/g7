# 시나리오 매니페스트 — CBT(일본 엔화) 경로의 클레임 추가결제 (K5)
# 참조: docs/testing-guide.md "기능 단위 시나리오 매트릭스"

feature: KG이니시스 CBT(엔화) 클레임 추가결제 — 체크아웃 토큰, 해시, 승인 콜백, 결제창 중단 복귀

description: |
  엔화 기준 상점에서는 클레임 추가결제도 CBT 경로(체크아웃 토큰 → 결제창 해시 → 승인 콜백)를 탄다.
  세 지점이 클레임 결제 번호(CP-)를 주문번호로 조회하면 「주문 없음」 404 로 끝나 결제창이 열리지 않았다.
  이제 세 지점이 클레임 결제 건을 직접 찾고, 통화(엔화만)와 금액을 대조하며, 결제창을 닫으면 신청서 상세로 돌아간다.
  편의점(CVS)은 입금 대기 수단이라 클레임 결제로 받지 않고 발급분을 환불로 되돌린다.
  승인 재료(sid)와 결제 건의 서명 바인딩은 claim-cbt-approve-binding.yaml 이 소유한다.

axes:
  case:
    - checkout_token_issued
    - checkout_token_amount_mismatch
    - checkout_token_krw
    - hash_data_issued
    - callback_confirms
    - user_cancel
    - cvs_rejected

effects:
  - cbt_claim_checkout_token_is_issued_for_jpy        # 엔화 클레임 결제 건은 CBT 체크아웃 토큰을 받는다
  - cbt_claim_checkout_token_rejects_amount_mismatch  # 요청 금액이 결제 건 금액과 다르면 토큰을 발급하지 않는다
  - cbt_claim_checkout_token_rejects_krw              # 원화 결제 건은 CBT 경로를 쓸 수 없다(국내 표준결제로)
  - cbt_claim_hash_data_is_issued                     # 토큰을 받은 뒤 결제창 해시가 발급된다
  - cbt_claim_callback_confirms_without_order         # 승인 콜백이 주문을 전제하지 않고 클레임 결제 건을 확정한다
  - cbt_claim_user_cancel_returns_to_claim_detail     # 결제창을 닫으면 체크아웃이 아니라 신청서 상세로 돌아간다
  - cbt_claim_cvs_is_refunded                         # 편의점 결제는 거절하고 발급분을 환불로 되돌린다

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/CbtClaimPaymentTest.php
