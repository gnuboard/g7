feature: 에스크로 배송 등록·구매거절확인 필수값 잠금과 실패 사유 표시

description: |
  관리자 주문 상세의 에스크로 배송 등록 버튼은 서버 필수값이 모두 채워져야 열린다.
  등록·구매거절확인이 실패하면 실패 문맥(error)의 서버 문구 — 검증 항목 오류 또는 PG 거절 사유 — 를 그대로 보이고,
  문구가 없을 때만 일반 안내로 떨어진다(구매거절확인도 실패 문맥에 없는 `response` 를 읽어 PG 사유가 가려지던 결함).
  서버는 KG이니시스가 돌려준 거절 사유(resultMsg)만 응답에 그대로 싣고, 통신 예외·HTTP 오류·DB 예외 원문은
  서버 로그에만 남긴 채 응답에는 번역된 일반 문구를 싣는다. 사유 없는 거절·「이미 완료」 안내도 번역 문구다.
  CBT 시험 상품 생성 실패의 `detail` 은 코어 SafeExceptionMessage 로 고른다. 디버그 모드는 원문을 둔다.

axes:
  flow: [escrow_delivery_register, escrow_deny_confirm, cbt_test_product]

exclusions: []

effects:
  - escrow_register_requires_fields_and_shows_server_reason
  - escrow_register_failure_hides_internal_detail
  - escrow_register_failure_keeps_pg_reason
  - escrow_deny_confirm_shows_server_reason
  - escrow_deny_confirm_failure_hides_internal_detail
  - escrow_deny_confirm_failure_keeps_pg_reason
  - cbt_test_product_failure_hides_internal_detail

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/layouts/escrowDeliveryRegisterGuard.test.tsx
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/AdminEscrowFailureReasonTest.php
