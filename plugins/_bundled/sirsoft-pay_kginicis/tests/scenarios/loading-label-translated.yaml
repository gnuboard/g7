feature: KG이니시스 영수증 버튼의 조회 중 글자는 번역 키로 낸다

description: |
  영수증 버튼을 누른 뒤 조회하는 동안의 「로딩 중...」이 한국어로 박혀 영어·일본어 화면에서도 한국어로 나오던 것을
  user.loading 번역 키(ko·en, 일본어는 언어팩)로 옮긴다(PO 결정 2026-09-28 「모두 번역 키로」). 주문 완료 화면 버튼도 같은 키를 쓴다.

axes:
  surface: [mypage_receipt_button]

effects:
  - loading_text_from_translation_key

