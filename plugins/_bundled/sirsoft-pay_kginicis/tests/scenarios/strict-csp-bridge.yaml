feature: strict_csp_bridge

description: |
  결제창 닫기·에스크로 구매결정·결제확인서 팝업의 인라인 실행 코드 제거 (#158 strict CSP).

  사이트가 `script-src 'self'` 를 걸면 이 플러그인이 직접 내는 독립 HTML 의 인라인 `<script>`·on* 이
  실행되지 않는다. 동작은 플러그인 루트 `assets/bridge/*.js`(손작성 ES5, 빌드 대상 아님)로 옮기고
  서버 값은 속성·JSON 데이터 블록으로만 넘긴다.

  핵심 동작:
    - 결제창 닫기(closeUrl): payment-close.js(주문 화면 알림) → INIStdPay_close.js 순서
    - 에스크로: escrow-confirm.js data-mode = pc-open(INIStdPay.pay) · pc-return · close · mobile-submit
    - CBT 결제확인서 팝업: 인쇄 버튼은 data-print + 쓰기 뒤 click 리스너

axes:
  page: [payment_close, escrow_return, escrow_confirm]

effects:
  - bridge_page_has_no_inline_executable
  - payment_close_uses_mode_script_and_bridge
  - receipt_print_button_without_inline_handler

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/BridgeNoInlineScriptTest.php
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/PaymentCloseControllerTest.php
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/receiptPopup.print.test.ts

notes: |
  팝업 인쇄 시험은 표면 축(`surface=receipt_popup`)으로 따로 표시한다 — 서버 페이지 축(page)과 교차하지 않는다.
  실제 PG 결제창·에스크로 창의 브라우저 동작은 코어 이력 문서의 브라우저 실측(T8 브리지 행)이 덮는다.
