feature: 독립 HTML 페이지가 인라인 스타일을 쓰지 않는다 — 스타일 보안 정책 호환

description: |
  사이트가 `style-src 'self'; style-src-attr 'none'` 을 걸면 `<style>` 요소와 `style="…"` 속성이 막힌다. 이 플러그인이
  엔진 셸 밖에서 직접 내는 화면 둘이 `<style>` 블록으로 모양을 실었다.

    - CBT 결제확인서 팝업(`receiptPopup.ts` 의 `document.write`) — 빈 팝업은 여는 문서의 정책을 물려받아
      무스타일(여백·테두리·2단 배치 없음)로 떴다
    - 에스크로 구매확인 창(PC·모바일, `UserEscrowConfirmController`) — 「준비 중」 안내가 왼쪽 위 구석에 맨 글자로 떴다

  규칙은 같은 출처 정적 파일(`assets/bridge/receipt-popup.css`·`escrow-confirm.css`, 빌드 대상 아님)로 옮기고 페이지에는
  `<head>` 의 `<link rel="stylesheet">` 만 둔다. 서버 페이지는 `BridgeScript::stylesheetTag()`, 팝업은 코어의
  `G7Core.asset.plugin()` 으로 주소를 만든다(주소를 손으로 조립하지 않는다). 그 API 가 없는 코어에서는 링크 없이
  그린다 — 무스타일이지만 내용과 인쇄는 된다.

  결제사 스크립트가 띄우는 결제창·구매확인 창은 결제사 호스트의 CSS 파일을 스스로 싣는다. 그 호스트를 plugin.json 의
  `trusted_style_hosts` 로 선언해 코어 스타일 정책에 자동 허용되게 한다(코어 7.1.6). 선언이 없으면 정책을 강제한
  사이트에서 결제창이 화면을 덮지 못하고 페이지 아래 띠로 밀린다.

axes:
  page:
    - receipt_popup          # CBT 결제확인서 팝업
    - escrow_confirm_pc      # 에스크로 구매확인 창 (PC)
    - escrow_confirm_mobile  # 에스크로 구매확인 창 (모바일)
    - stylesheet_files       # 옮긴 CSS 파일
    - payment_window         # 결제사 스크립트가 띄우는 결제창·구매확인 창

effects:
  - standalone_page_has_no_inline_style        # <style> 요소·style 속성 0건
  - standalone_page_links_stylesheet_in_head   # <head> 에 CSS 링크 1건
  - stylesheet_href_is_escaped                 # 팝업 CSS 주소는 절대 주소 + 속성값 이스케이프
  - popup_renders_without_asset_api            # 자산 API 가 없거나 실패해도 내용·인쇄는 된다
  - stylesheet_files_keep_original_rules       # CSS 파일에 종전 규칙이 그대로 있다
  - payment_window_style_hosts_declared_for_csp # 결제창 CSS 호스트를 trusted_style_hosts 로 선언한다(사유 포함, 스크립트 선언과 같은 호스트)

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/StandalonePagesNoInlineStyleTest.php
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/receiptPopup.noInlineStyle.test.ts

notes: |
  실제 이니시스 구매확인 창·결제창 안쪽(결제사 스크립트)이 정책에 걸리는지는 브라우저 실측이 판정한다.
