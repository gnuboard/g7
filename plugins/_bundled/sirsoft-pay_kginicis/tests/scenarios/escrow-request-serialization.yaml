feature: 에스크로 관리자 요청·구매결정 증표 소비의 직렬화

description: |
  관리자 에스크로 배송등록·구매거절확인은 「결제 메타를 읽어 → 처리 전인지 보고 → PG 에 보내고 → 메타에 쓴다」
  순서다. 더블클릭·재시도로 두 요청이 겹치면 둘 다 "처리 전"을 보고 PG 에 같은 요청을 두 번 보냈다.
  구매결정 결과 수신의 일회용 증표도 읽기와 지우기 사이가 비어 있어, 같은 증표의 두 수신이 둘 다 문맥을 읽었다.

  핵심 계약:
    - 배송등록·거절확인은 플러그인의 주문 단위 잠금(`SerializesPaymentCallbacks::acquireOrderCallbackLock`,
      문맥 `escrow-delivery`·`escrow-deny-confirm`) 안에서 결제 메타를 다시 읽는다.
    - 잠금을 기다리다 시간이 다 되면 PG 를 부르지 않고 409 `messages.errors.escrow_in_progress`.
    - 이미 처리된 건(배송 신규 등록 I 인데 등록 이력 있음 · 거절확인 이력 있음)은 409. 배송 변경(U)은 정상 경로.
    - 증표 소비는 증표별 잠금(`sirsoft-pay_kginicis:escrow-nonce:{sha1}`)을 즉시 시도해, 못 잡으면 null(문맥은 지우지 않음).

axes:
  request: [escrow_delivery, escrow_deny_confirm, escrow_confirm_return]
  contention: [lock_held, already_processed, sequential]

exclusions:
  - request: escrow_confirm_return
    contention: already_processed
    reason: 증표는 꺼내면 지워지므로 "이미 처리됨"은 문맥 없음(null)과 같다 — 기존 일회성 테스트(EscrowConfirmReturnBindingTest)가 다룬다

effects:
  - escrow_request_rejected_without_pg_call_while_locked   # 잠금 선점 중 → 409 escrow_in_progress, PG 미호출
  - escrow_request_rejected_when_already_processed         # 잠금 안 재조회로 이미 처리됨 → 409, PG 미호출
  - escrow_change_and_first_request_still_succeed          # 배송 변경(U)·첫 거절확인은 PG 1회, 처리 뒤 잠금 해제
  - escrow_nonce_consume_is_exclusive                      # 다른 소비자 잠금 보유 중 null·문맥 보존, 소비 뒤 잠금 해제

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/EscrowDeliveryLockTest.php
  - plugins/_bundled/sirsoft-pay_kginicis/tests/Unit/Support/EscrowConfirmNonceConsumeTest.php
