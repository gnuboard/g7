feature: KG이니시스 입금 기한 — 쇼핑몰이 서식을 입힌 값을 그대로 쓴다

description: |
  입금 안내의 입금 기한은 쇼핑몰(이커머스)이 사용자 언어·시간대로 서식을 입혀 주는 vbank_due_at_formatted 를 그대로 쓴다.
  종전에는 플러그인이 ISO 값을 한국 서식·한국 시간으로 다시 서식을 입혀 영어·일본어 화면에도 한국식 날짜가 나왔고,
  주문 완료 화면의 날짜 글자까지 한국식으로 덮어썼다. 날짜 서식은 쇼핑몰의 책임이라 플러그인은 서식을 입히지 않는다.

axes:
  surface: [mypage_vbank_panel, order_complete_page]

effects:
  - due_date_uses_shop_formatted_value
  - order_complete_text_untouched

test_files:
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/vbankDueDateFromShop.test.ts
