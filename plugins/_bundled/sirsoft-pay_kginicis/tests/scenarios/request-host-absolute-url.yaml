feature: KG 이니시스 결과 이동·PG 전송 주소의 사이트 주소 고정 + 에스크로 구매결정 결과 수신 결속

description: |
  결제 콜백 검증 실패가 Laravel 기본 previous()(Referer) 로 외부 주소까지 이동했고, 클레임 결제 실패·에스크로
  복귀·PG 전송 주소(returnUrl·closeUrl·P_NEXT_URL·P_NOTI_URL·notiUrl)가 요청 Host·브라우저 현재 주소를 따랐다.
  에스크로 구매결정 결과 수신은 tid 만으로 기록돼 제3자가 남의 결제에 기록을 남길 수 있었고, 확인창 닫기
  주소는 주문번호 라우트에 가려 500 으로 끝났다.

axes:
  # forged = 위조 Host 변종 4종(외부 도메인·사이트 하위 도메인·포트만 바꾼 Host·신뢰 프록시 X-Forwarded-Host)을
  #          코어 `Tests\Concerns\ForgesRequestHost::forgedHosts()` 데이터 제공자가 모두 돈다. 같은 제공자에
  #          사이트 주소(canonical) 행이 함께 있어, 그 행이 사이트 주소 Host 에서도 같은 값을 내는지 본다.
  host_header: [canonical, forged]
  sink: [payment_result_redirect, claim_result_redirect, pg_callback_urls, admin_notify_url, pg_server_notify, escrow_confirm, front_pg_urls, front_pg_form_action, front_receipt_window]

exclusions:
  - { sink: front_receipt_window, host_header: canonical, reason: "수신·제출 주소 판정은 요청 Host 를 읽지 않는다 — 입력 값만 본다(위조 Host 변종이 의미 없음)" }
  - { sink: front_pg_form_action, host_header: canonical, reason: "수신·제출 주소 판정은 요청 Host 를 읽지 않는다 — 입력 값만 본다(위조 Host 변종이 의미 없음)" }
  - { sink: front_pg_urls, host_header: canonical, reason: "수신·제출 주소 판정은 요청 Host 를 읽지 않는다 — 입력 값만 본다(위조 Host 변종이 의미 없음)" }
  - { sink: payment_result_redirect, host_header: canonical, reason: "forged 데이터 제공자가 사이트 주소(canonical) 행을 함께 돈다 — 같은 테스트가 두 축을 덮는다" }
  - { sink: claim_result_redirect, host_header: canonical, reason: "forged 데이터 제공자가 사이트 주소(canonical) 행을 함께 돈다 — 같은 테스트가 두 축을 덮는다" }
  - { sink: pg_callback_urls, host_header: canonical, reason: "forged 데이터 제공자가 사이트 주소(canonical) 행을 함께 돈다 — 같은 테스트가 두 축을 덮는다" }
  - { sink: admin_notify_url, host_header: canonical, reason: "forged 데이터 제공자가 사이트 주소(canonical) 행을 함께 돈다 — 같은 테스트가 두 축을 덮는다" }
  - { sink: pg_server_notify, host_header: canonical, reason: "forged 데이터 제공자가 사이트 주소(canonical) 행을 함께 돈다 — 같은 테스트가 두 축을 덮는다" }

effects:
  - payment_result_redirect_uses_site_address
  - claim_result_redirect_uses_site_address
  - client_config_callback_urls_are_site_absolute
  - browser_api_callback_urls_point_to_api_routes
  - admin_notify_url_uses_site_address
  - invalid_server_notify_returns_422_without_redirect
  - escrow_confirm_urls_are_site_address_with_path_nonce
  - escrow_confirm_records_only_bound_return_once
  - escrow_close_and_guest_window_do_not_error
  - front_pg_urls_require_site_absolute
  - front_pg_urls_use_server_site_address_unchanged
  - front_pg_form_action_allowlisted
  - front_receipt_window_has_no_opener_and_https_only

