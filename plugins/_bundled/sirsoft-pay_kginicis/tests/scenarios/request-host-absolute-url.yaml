  - plugins/_bundled/sirsoft-pay_kginicis/tests/Feature/Controllers/EscrowConfirmReturnBindingTest.php
  - plugins/_bundled/sirsoft-pay_kginicis/resources/js/__tests__/hostTrust.test.ts
