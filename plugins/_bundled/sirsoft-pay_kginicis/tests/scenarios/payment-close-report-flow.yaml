  - checkout_submit_state_reset_on_close
  - close_reported_to_server
  - no_report_without_close_message
  - foreign_messages_ignored
  - checkout_detected_by_shop_base_contract
  - mobile_return_resets_submit_state
  - failure_return_reported_once
  - guest_token_read_from_state_contract_only
  - member_bearer_left_to_core_api
  - no_token_sends_without_header

