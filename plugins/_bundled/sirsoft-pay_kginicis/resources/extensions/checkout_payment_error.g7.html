<!-- 결제 실패를 주문서 화면에 알리는 조각 — 결제창이 실패로 돌아왔을 때 뜬다 -->
<extension target-layout="shop/checkout">
  <modal>
    <!-- 결제 실패 안내 창 — PG 가 준 사유가 있으면 함께 보여 준다 -->
    <modal data-type="composite" data-ref="kginicis_payment_error_modal" title="$t:sirsoft-pay_kginicis.payment_error.title" size="sm" :showCloseButton="true">
      <div class="paykginicis:text-center paykginicis:py-4">
        <icon name="exclamation-circle" class="paykginicis:text-red-500 paykginicis:text-4xl paykginicis:leading-none paykginicis:mb-4"/>
        <p class="paykginicis:text-gray-700 paykginicis:dark:text-gray-300">$t:sirsoft-pay_kginicis.payment_error.message</p>
        <p data-if="{{_local.paymentErrorMessage}}" class="paykginicis:text-sm paykginicis:text-red-600 paykginicis:dark:text-red-400 paykginicis:mt-2">{{_local.paymentErrorMessage}}</p>
      </div>
      <div class="paykginicis:flex paykginicis:justify-center paykginicis:mt-6">
        <button type="button" class="paykginicis:px-6 paykginicis:py-2 paykginicis:bg-blue-600 paykginicis:text-white paykginicis:rounded-lg paykginicis:font-medium paykginicis:hover:bg-blue-700 paykginicis:transition-colors">
          <on type="click">
            <!-- 확인 — 남아 있던 실패 사유를 지우고 창을 닫는다(지우지 않으면 다음에 열 때 옛 사유가 그대로 보인다) -->
            <sequence>
              <set-state target="local" :paymentErrorMessage="null"/>
              <close-modal/>
            </sequence>
          </on>
          $t:common.confirm
        </button>
      </div>
    </modal>
  </modal>
</extension>
