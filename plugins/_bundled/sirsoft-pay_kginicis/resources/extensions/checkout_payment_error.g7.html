<extension target-layout="shop/checkout">
  <modal>
    <modal data-ref="kginicis_payment_error_modal" title="$t:sirsoft-pay_kginicis.payment_error.title" size="sm" :showCloseButton="true">
      <div class="text-center py-4">
        <icon name="exclamation-circle" class="text-red-500 text-4xl mb-4"/>
        <p class="text-gray-700 dark:text-gray-300">$t:sirsoft-pay_kginicis.payment_error.message</p>
        <p data-if="{{_local.paymentErrorMessage}}" class="text-sm text-red-600 dark:text-red-400 mt-2">{{_local.paymentErrorMessage}}</p>
      </div>
      <div class="flex justify-center mt-6">
        <button type="button" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors"><on type="click"><set-state target="local" :paymentErrorMessage="null"/><close-modal/></on>$t:common.confirm</button>
      </div>
    </modal>
  </modal>
</extension>
