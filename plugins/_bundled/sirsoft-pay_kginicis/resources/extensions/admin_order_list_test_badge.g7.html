<!-- 주문 목록에 KG이니시스 테스트 결제 표시를 얹는 조각 — 컬럼을 새로 만들지 않고 기존 그리드의 props 에 끼워 넣는다 -->
<extension target-layout="admin_ecommerce_order_list" priority="999">
  <inject target-id="order_datagrid" position="inject_props">
    <props>
      <prop name="columns">
        <field name="_patch">
          <field name="by" value="field"/>
          <field name="items">
            <item>
              <field name="field" value="payment_method"/>
              <field name="comment" value="호스트가 래퍼 Div(id: payment_method_cell)와 라벨(id: payment_method_label)을 소유한다 — 이 플러그인은 자기 배지만 덧붙인다. 통째로 교체하면 함께 설치된 다른 결제 플러그인의 배지를 지운다(#599)."/>
              <field name="cellChildren">
                <field name="_patch">
                  <field name="by" value="id"/>
                  <field name="items">
                    <item>
                      <field name="id" value="payment_method_cell"/>
                      <field name="children">
                        <field name="_append">
                          <item>
                            <field name="type" value="basic"/>
                            <field name="name" value="Span"/>
                            <field name="comment" value="자기 데이터소스만 본다 — 남의 플러그인 맵을 함께 보면 그 플러그인이 없는 사이트에서 미정의 참조가 된다."/>
                            <field name="if" value="{{kginicis_test_map.data?.[row.order_number] === true}}"/>
                            <field name="props">
                              <field name="className" value="text-xs font-medium text-orange-500 dark:text-orange-400 leading-tight"/>
                            </field>
                            <field name="text" value="($t:sirsoft-pay_kginicis.admin.test_mode_badge)"/>
                          </item>
                        </field>
                      </field>
                    </item>
                  </field>
                </field>
              </field>
            </item>
          </field>
        </field>
      </prop>
    </props>
  </inject>
  <!-- 주문번호 → 테스트 결제 여부 맵. 목록 본체와 별도로 늦게 도착해도 되므로 progressive 다 -->
  <data-source id="kginicis_test_map" label_key="$t:sirsoft-pay_kginicis.editor.data_source.kginicis_test_map" type="api" endpoint="/api/plugins/sirsoft-pay_kginicis/admin/orders/test-mode-map" method="GET" :auto_fetch="true" :auth_required="true" loading_strategy="progressive"/>
</extension>
