feature: 인증 앱 설정 → 알림 템플릿 편집 창 — 수신자 규칙 칸의 읽을 수 있는 이름과 고른 수 문구

description: |
  보안 알림(등록·해제·백업 코드 재발급) 템플릿 편집 창은 형제 환율·GDPR 설정 화면의 같은 창을 이식했다.
  수신자 규칙마다 붙은 × 단추는 아이콘뿐이라 화면 낭독기가 아이콘 이름 「xmark」 로 읽었다(형제 화면에서 관찰한 결함) —
  「수신자 규칙 N 삭제」 aria-label 을 단다. 역할·회원 다중 선택의 「{count}개 선택됨」 문구는 드롭다운이 {count} 를 스스로
  채우므로 레이아웃이 같은 수를 count 인자로 넘겨야 단수·복수가 맞게 나온다.

axes:
  control:
    - remove_rule_button      # 수신자 규칙 줄의 × 단추
    - selected_count_label    # 역할·회원 드롭다운의 고른 수 문구

effects:
  - recipient_rule_remove_button_named   # × 단추가 「수신자 규칙 N 삭제」 aria-label 을 갖는다
  - call_site_passes_count               # 고른 수 문구에 count 인자를 넘긴다

test_files:
  - plugins/_bundled/sirsoft-totp/resources/js/__tests__/layouts/notificationRecipientRuleRemoveName.test.ts
  - plugins/_bundled/sirsoft-totp/resources/js/__tests__/layouts/recipientSelectedCountPlural.test.ts

notes: |
  e2e_browser=partial — 레이아웃 정적 단언. 인증 앱 설정 화면의 브라우저 실측은 알림 영역 통합 실측에서 함께 한다.
