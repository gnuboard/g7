feature: 백업 코드 복사 핸들러 — 클립보드 API 와 비보안 컨텍스트 폴백

description: |
  인증 앱 등록 확정·백업 코드 재발급 화면의 [복사] 는 `sirsoft-totp.copyToClipboard` 핸들러가 처리한다.
  보안 컨텍스트(HTTPS)에서는 `navigator.clipboard.writeText()` 를 쓰고, 클립보드 API 가 없거나(사내망 HTTP 설치본)
  쓰기가 거부되면 임시 textarea + `document.execCommand('copy')` 폴백으로 내려간다.
  복사할 텍스트가 비면 아무것도 하지 않고 false — 백업 코드가 실리기 전에 눌린 경우 빈 문자열을 붙여넣게 두지 않는다.
  반환값(true/false)은 화면이 「복사됨」 안내를 띄울지 정하는 근거다 — 폴백까지 실패하면 false 여야 운영자가 직접 적는다.

axes:
  clipboard: [available, missing, rejected]
  text: [present, empty]

exclusions:
  - clipboard: missing
    text: empty
    reason: 텍스트가 비면 클립보드 유무를 보기 전에 끝난다 — available·empty 케이스가 같은 분기를 검증한다
  - clipboard: rejected
    text: empty
    reason: 텍스트가 비면 쓰기를 시도하지 않으므로 거부가 일어날 수 없다 — available·empty 케이스가 같은 분기를 검증한다

effects:
  - copies_text_via_clipboard_api           # 클립보드 API 로 넘겨받은 텍스트를 그대로 담고 true
  - empty_text_skips_clipboard              # 빈 텍스트는 클립보드를 건드리지 않고 false
  - falls_back_to_exec_command              # 클립보드 API 없음·쓰기 거부 → execCommand('copy') 폴백으로 true
  - returns_false_when_fallback_fails       # 폴백까지 실패하면 false

test_files:
  - plugins/_bundled/sirsoft-totp/resources/js/__tests__/handlers/copyToClipboard.test.ts
