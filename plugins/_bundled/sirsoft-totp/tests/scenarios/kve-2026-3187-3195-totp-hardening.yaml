feature: 인증 앱 보안 강화 (KVE-2026-3190·3193·3194·3195 대응, 1.0.3)

description: |
  인증 앱 코드·백업 코드는 한 번만 통과하고(동시 제출 포함), 등록 시작은 현재 비밀번호를 다시 확인하며,
  해제·백업 코드 재발급의 코드 확인은 회원 단위로 시도를 제한한다. 두 화면의 동시 확정은 먼저 확정한 쪽만 남고,
  일반 운영자는 슈퍼 관리자의 인증 앱을 풀 수 없다. 등록·해제(관리자 강제 해제 포함)·백업 코드 재발급은 계정 주인에게
  메일로 알리고(운영자가 끌 수 있음), 비밀번호 재설정은 인증 앱 등록을 지우지 않는다. 인증 앱 challenge 는
  재발송으로 시도 횟수를 초기화할 수 없다.

