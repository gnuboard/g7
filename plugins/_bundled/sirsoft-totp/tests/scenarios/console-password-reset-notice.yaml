feature: 터미널 비밀번호 재설정 결과의 인증 앱 초기화 안내 (코어 7.1.4 `user:reset-password`)

description: |
  셸에서 관리자 비밀번호를 되찾아도 인증 앱을 잃었으면 로그인하지 못한다. 코어는 어느 확장이 설치돼
  있는지 묻지 않고 filter 훅 `core.auth.console_password_reset_notices` 로 안내를 받는다 — 이 플러그인은
  인증 앱 등록을 마친(confirmed) 회원일 때만 `php artisan totp:reset {email}` 안내 한 줄을 답한다.

axes:
  enrollment: [confirmed, none]

exclusions: []

effects:
  - console_password_reset_shows_totp_reset_notice_for_enrolled_user
  - console_password_reset_omits_totp_notice_without_enrollment
  - console_password_reset_notice_listener_is_registered_by_the_plugin

test_files:
  - plugins/_bundled/sirsoft-totp/tests/Feature/TotpConsolePasswordResetNoticeTest.php
