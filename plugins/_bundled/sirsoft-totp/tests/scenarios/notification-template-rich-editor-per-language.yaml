feature: 인증 앱 알림 템플릿 편집 창 — 서식 편집기 슬롯이 편집 언어마다 따로 선다

description: |
  메일 본문은 html_editor 확장 슬롯(CKEditor)으로 열리고, 편집기는 마운트 때 본문과 쓰기 경로(활성 언어 포함)를 한 번만 받는다.
  슬롯 하나를 언어 사이에 돌려 쓰면 영어 탭을 눌러도 한국어 본문이 보이고 입력이 한국어 칸에 저장된다(형제 환율 설정 실측
  2026-10-03). 설치 언어마다 슬롯을 두고 편집 중인 언어의 것만 세운다. 편집기 이름도 언어별이다.

axes:
  case: [slot_per_language, lang_switch]

effects:
  - totp_rich_editor_slot_per_language
  - totp_only_active_language_rich_editor_mounts
  - totp_rich_editor_reads_and_writes_its_language
  - totp_rich_editor_name_differs_per_language

test_files:
  - plugins/_bundled/sirsoft-totp/resources/js/__tests__/layouts/totpNotificationTemplateRichEditorPerLanguage.test.ts

notes: |
  e2e_browser=partial — 레이아웃 계약 단언. 인증 앱 설정 화면의 브라우저 실측은 알림 영역 통합 실측에서 함께 한다.
