feature: 인증 앱 설정 알림 템플릿 편집 창 — 「이벤트 유발자 제외」 스위치 접근 이름

description: |
  수신자 규칙(역할, 특정 회원)의 「이벤트 유발자 제외」 스위치는 옆 글자를 따로 둔 span 으로 그리면 스위치와 이어지지 않아
  화면 읽기 프로그램에 이름 없는 스위치로 읽힌다(형제 환율 설정 7.1.0 실측 결함). 스위치 label 로 이름을 주고 옆 글자도
  label 이 함께 그린다.

axes:
  case: [totp_exclude_trigger_switch]

effects:
  - exclude_trigger_switch_has_accessible_name
  - exclude_trigger_switch_text_shown_once

test_files:
  - plugins/_bundled/sirsoft-totp/resources/js/__tests__/layouts/totpNotificationTemplateExcludeTriggerSwitch.test.ts

notes: |
  e2e_browser=partial — 레이아웃 속성 단언. 인증 앱 설정 화면의 브라우저 실측은 알림 영역 통합 실측에서 함께 한다.
