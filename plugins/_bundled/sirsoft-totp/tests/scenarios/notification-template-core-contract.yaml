feature: 인증 앱 설정 → 알림 템플릿 편집 창 — 코어 모달 계약(수신자·관계·역할 다중·본문 편집기) 정합

description: |
  보안 알림 템플릿 편집 창은 코어 알림 템플릿 편집 창과 같은 저장 API(PUT /api/admin/notification-templates/{id})를 쓴다.
  형제 환율 설정 화면이 코어 계약 변경을 따라가지 못해 겪은 결함 — 관련 사용자 relation 을 고를 수 없어 422, 역할 단일 선택이라
  서버 배열 값과 어긋남, 채널 본문 편집기 선언(template_editor) 무시, 방금 고른 역할·회원이 식별자·UUID 로 보임 — 을 이식한
  창이 그대로 지키는지 레이아웃 표현식을 엔진에 넣어 결과로 본다.

axes:
  case: [named, specific_users_to_role, to_related_user, related_user_to_trigger_user, exclude_trigger_user_carry, other_rows_untouched, empty, undeclared, multiple, none_declared, role, none, rich, picked_role, picked_user, role_chip_remove, user_chip_remove, chips_above_open_dropdown]

