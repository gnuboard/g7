  - totp_body_editor_follows_channel_declaration
  - totp_recipient_picked_role_keeps_search_result_name
  - totp_recipient_picked_user_keeps_search_result_name
  - totp_role_chip_removes_value_and_name_together
  - totp_user_chip_removes_value_and_name_together
  - totp_chips_stay_visible_while_dropdown_open

