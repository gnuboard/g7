<!-- 인증 앱 설정 — 알림 템플릿 미리보기 창. 편집 창이 만들어 둔 치환 결과를 보여 주기만 하고
  입력이 없다 — 닫기 단추 하나뿐이다. -->
<partial description="인증 앱 보안 알림 치환 결과 미리보기">
  <modal data-type="composite" data-ref="modal_totp_notification_definition_preview" title="$t:sirsoft-totp.admin.notifications.preview_modal.title" size="lg">
    <div data-ref="totp_preview_content">
      <div>
        <label class="totp-form-label">$t:sirsoft-totp.admin.notifications.preview_modal.rendered_subject</label>
        <p class="totp-text-primary totp:text-sm totp:bg-gray-50 totp:dark:bg-gray-900 totp:rounded-md totp:p-3 totp:border totp:border-gray-200 totp:dark:border-gray-700">{{_global.totp_notification_template_form_modal?.preview?.subject ?? ''}}</p>
      </div>
      <div>
        <label class="totp-form-label">$t:sirsoft-totp.admin.notifications.preview_modal.rendered_body</label>
        <html-content data-type="composite" content="{{_global.totp_notification_template_form_modal?.preview?.body ?? ''}}" :isHtml="true" class="totp:text-sm totp:max-w-none totp:bg-white totp:dark:bg-gray-900 totp:rounded-md totp:p-4 totp:border totp:border-gray-200 totp:dark:border-gray-700 totp:max-h-[400px] totp:overflow-y-auto"/>
      </div>
      <div class="totp:flex totp:justify-end totp:border-t totp:border-gray-200 totp:dark:border-gray-700">
        <button data-ref="totp_btn_close_preview" type="button" class="totp-text-body totp:px-4 totp:py-2 totp:rounded-md totp:border totp:border-gray-300 totp:dark:border-gray-600 totp:hover:bg-gray-50 totp:dark:hover:bg-gray-700 totp:transition-colors">
          <on type="click">
            <close-modal target="modal_totp_notification_definition_preview"/>
          </on>
          $t:sirsoft-totp.admin.notifications.preview_modal.btn_close
        </button>
      </div>
    </div>
  </modal>
</partial>
