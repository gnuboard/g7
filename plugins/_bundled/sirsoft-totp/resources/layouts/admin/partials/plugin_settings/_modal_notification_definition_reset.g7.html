<!-- 인증 앱 설정 — 알림 정의 초기화 확인 창. 손으로 고친 알림 설정(채널·제목·본문·수신자)을 플러그인이 제공하는
  기본값으로 되돌린다. 되돌리면 그동안의 수정이 사라지므로 되묻는다. 대상 ID·이름은 알림 카드의 「기본값 되돌리기」가
  전역(totpResetTargetId·totpResetTargetName)에 넣고 연다 — 창은 별도 문맥이라 목록의 _local 을 보지 못한다. -->
<partial description="인증 앱 보안 알림 기본 정의 복원 확인">
  <modal data-type="composite" data-ref="modal_totp_notification_definition_reset" title="$t:sirsoft-totp.admin.notifications.reset_modal.title" size="sm">
    <p class="totp:text-gray-700 totp:dark:text-gray-300">$t:sirsoft-totp.admin.notifications.reset_modal.confirm_message</p>
    <div class="totp:mt-4 totp:p-3 totp:bg-gray-100 totp:dark:bg-gray-700 totp:rounded-lg">
      <span class="totp-form-sub-label">$t:sirsoft-totp.admin.notifications.reset_modal.target_label</span>
      <span class="totp-text-primary totp:font-medium">{{_global.totpResetTargetName ?? ''}}</span>
    </div>
    <div class="totp-alert-danger">
      <p class="totp-text-error-soft">$t:sirsoft-totp.admin.notifications.reset_modal.warning_message</p>
    </div>
    <div class="totp-modal-footer-buttons">
      <button type="button" class="totp:px-4 totp:py-2 totp:bg-white totp:dark:bg-gray-800 totp:text-gray-700 totp:dark:text-gray-300 totp:border totp:border-gray-300 totp:dark:border-gray-600 totp:rounded-lg totp:hover:bg-gray-50 totp:dark:hover:bg-gray-700 totp:disabled:opacity-50 totp:disabled:cursor-not-allowed" disabled="{{_global.totpResettingNotification}}">
        <on type="click">
          <close-modal target="modal_totp_notification_definition_reset"/>
        </on>
        $t:common.cancel
      </button>
      <button type="button" class="totp-flex-center totp:gap-2 totp:px-4 totp:py-2 totp:bg-orange-700 totp:dark:bg-orange-700 totp:text-white totp:dark:text-white totp:rounded-lg totp:hover:bg-orange-800 totp:disabled:opacity-50 totp:disabled:cursor-not-allowed" disabled="{{_global.totpResettingNotification}}">
        <on type="click">
          <!-- 초기화. 성공하면 알림 목록을 다시 불러 되돌아간 값을 보여 준다. -->
          <sequence>
            <set-state target="global" :totpResettingNotification="true"/>
            <api-call :auth_required="true" target="/api/admin/notification-definitions/{{_global.totpResetTargetId}}/reset" method="POST">
              <success>
                <set-state target="global" :totpResettingNotification="false" :totpResetTargetId="null" totpResetTargetName=""/>
                <refetch-data-source dataSourceId="totpNotificationDefinitions"/>
                <toast type="success" message="$t:sirsoft-totp.admin.notifications.reset_success"/>
                <close-modal target="modal_totp_notification_definition_reset"/>
              </success>
              <fail>
                <set-state target="global" :totpResettingNotification="false"/>
                <toast type="error" message="{{error.message ?? '$t:sirsoft-totp.admin.notifications.reset_failed'}}"/>
              </fail>
            </api-call>
          </sequence>
        </on>
        <icon data-if="{{_global.totpResettingNotification}}" name="spinner" class="totp-spinner-sm"/>
        <span>{{_global.totpResettingNotification ? '$t:sirsoft-totp.admin.notifications.reset_modal.btn_confirming' : '$t:sirsoft-totp.admin.notifications.reset_modal.btn_confirm'}}</span>
      </button>
    </div>
  </modal>
</partial>
