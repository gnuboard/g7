feature: 사용자 팝업 레이어 컴포넌트 (판정·배치·캐러셀·닫기·보지 않기·접근성·GDPR 공존)

description: |
  PopupLayer 가 공개 API 배열을 받아 경로·기기·보지 않기·이번 페이지에서 닫음으로 거른 뒤 한 레이어 안 캐러셀로 보인다.
  「보지 않기」는 그때 보이던 팝업 전부의 id 를 만료와 함께 쿠키 하나(g7_popup_dismissed)에 기록하고(D3),
  「닫기」는 새로고침 전까지 같은 팝업을 다시 띄우지 않는다(모듈 메모리). 모바일 하단 시트는 GDPR 배너 높이만큼 올라간다.
  접근성: dialog·aria-modal·포커스 가둠·ESC·←→·포커스 복귀·자동 넘김 멈춤(마우스·포커스·일시정지·누름·reduced-motion)·aria-live 전환.
  장 전환은 가로 이동 — 현재 장과 들어올 옆 장 하나만 ±100% 에 두고 옮긴다(끝 ↔ 처음도 한 칸). 마우스·손가락으로 끌면 두 장이 함께
  밀리고, 폭의 20% 이상 또는 빠른 휙 넘김이면 넘기고 아니면 제자리. 세로 의도는 무시, 끈 뒤의 click 은 링크로 가지 않는다.
  끄는 동안 보이는 옆 장은 aria-hidden + inert, 화면 밖 장은 hidden. 끈 거리는 실제 표시 폭 대비 비율(축소 미리보기 틀 포함).
  본문 HTML 은 DOMPurify 로 한 번 더 거르고, 덮는 링크 안에 포커스 요소가 없다.
  창 옮기기(2026-10-28 결정, 2026-10-29 잡는 곳 변경): 위쪽 손잡이 띠는 없고, PC 창·모바일 가운데 창은 하단 바(「보지 않기」·「닫기」 띠)를
  마우스·손가락으로 끌어 옮긴다 — 단추 위에서 눌러도 8px 이상 움직이면 옮기기이고 그 동작의 click 은 막는다(닫히지 않음), 못 미치면 단추가 동작한다.
  키보드로는 옮기지 않는다(전용 초점 요소 없음). 화면 가장자리 8px 안쪽, 화면 위 고정 요소(층 40 이상, 헤더 등) 아래·바닥의 GDPR 배너 위로만
  놓이며 열릴 때 덮여 있으면 비켜 뜬다. 그 사이가 창보다 좁으면 본문 높이를 줄여 창 전체(하단 바 포함)가 보이게 하고, 그래도 크면 하단 바가 먼저 보인다.
  옮긴 자리는 기억하지 않는다(경로·목록·배치가 바뀌면 원래 자리). 모바일 하단 시트는 손잡이 막대가 없고 하단 바를 끌어도 아무것도 하지 않는다(단추로만 닫음).
  관리자 미리보기는 하단 바를 끌어도 옮기지 않는다.
  넘김 컨트롤(2026-10-29 변경): 점·「n / N」·일시정지는 별도 띠 없이 본문 아래쪽 가운데에 겹친 반투명 어두운 캡슐에 있다(덮는 링크보다 위 층,
  눌러도 장 끌기·링크 이동이 없다). 지금 장 점은 길쭉한 알약, 나머지는 작은 원이고 누르는 영역은 44px 이상이다. 한 줄에 들어가는 개수
  (PC 8·휴대폰 5, 좁은 창은 그 폭만큼)를 넘으면 점 대신 숫자. 일시정지는 캡슐 오른쪽 끝. 이전·다음은 PC·휴대폰 모두 본문 양옆 오버레이.
  직접 작성형 본문은 캡슐 높이만큼 아래 여백을 더 둔다. 미리보기도 같은 모양이고 본문 높이 몫에서 띠 몫(44px)이 빠졌다.

