feature: 팝업 이미지 위 글 상자(오버레이) — 저장·공개 응답·사용자 레이어·관리자 편집기

description: |
  이미지형 팝업에 기기별(PC·모바일) 글 상자를 최대 10개 둔다. 위치·폭·글자 크기는 이미지 기준 %, 서식은 언어 공통이고 글만 언어별이다.
  서버는 FormRequest 로 범위·형식·언어를 검증하고(태그 제거), 직접 작성형이면 비우고, 모바일 이미지가 없으면 모바일 배치를 비운다.
  공개 응답은 상자 글을 요청 언어 → 기본 언어로 골라 문자열 하나로 싣고 글이 빈 상자는 뺀다.
  사용자 레이어는 이미지 표시 사각형과 같은 프레임 안에 상자를 % 로 겹치고, 상자는 누름·끌기를 받지 않는다(이미지 링크·장 넘김 그대로).
  관리자 편집기는 사용자 레이어와 같은 렌더러로 그린 캔버스에서 끌기·폭 조절·키보드 이동·서식 패널·순서·기기 탭을 다룬다.

