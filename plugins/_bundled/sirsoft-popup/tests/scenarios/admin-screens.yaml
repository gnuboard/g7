feature: 팝업 관리자 화면·사용자 주입 조각 레이아웃 렌더링

description: |
  목록·등록/수정·환경설정 레이아웃과 user_global_overlay 주입 조각을 createLayoutTest 로 렌더링해
  #757 규칙(링크·받는 중 빈 문구·행 이름·컨트롤 이름), abilities 게이트, 일괄 줄·확인 창, 순서 변경 창,
  폼 초기화·유형 전환·라우트 칩·에디터 확장점·업로드 주소·충돌 복구, 설정 화면 조건부 입력·onError 를 잠근다.

