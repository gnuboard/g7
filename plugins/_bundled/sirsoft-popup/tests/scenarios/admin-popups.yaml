feature: 팝업 관리 API (목록·등록·수정·삭제·일괄·복사·순서·이미지·표시 방식)

description: |
  관리자 목록 필터(상태·기기·검색)와 통계, 상태 필터·정렬은 SQL 에서(쪽 수가 SQL 결과와 일치),
  등록·수정 검증(관리용 제목·내용 유형별 필수·기본 언어 본문·비활성 언어 키·기간·라우트·링크·PC 이미지),
  수정 충돌(revision 불일치 409), 이미지는 저장 때만 붙고 옛 파일은 지워짐, 유형을 직접 작성형으로 바꾸면 이미지 정리,
  영구 삭제는 PC·모바일 파일 모두, 일괄 노출/비노출·복사(비활성·맨 뒤·이미지 파일 복제)·삭제, 순서는 전체 집합.
  모든 변경은 before/after 훅·활동 로그(항목별)·공개 캐시 무효화로 이어진다(각 리스너 매니페스트가 따로 잠금).
  기간 입력은 사이트 시간대 → UTC 저장, 표시는 사이트 시간대.
  수정은 언어팩을 꺼 지원 목록에서 빠진 언어의 저장된 번역을 막지도 지우지도 않는다(새 지원 밖 언어만 422). 정화 뒤 비는 본문은 422.
  이미지 파일 쓰기 실패·행 저장 실패(업로드·복사)는 행도 파일도 남기지 않는다.
  임시 이미지 삭제는 자기가 올린 것만(다른 관리자 것은 403), 임시 묶음 키는 UUID 만(내부 묶음 `released:{id}` 거부).

